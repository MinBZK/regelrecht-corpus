  - number: '2.103'
    text: |-
      1 Het bevoegd gezag kan de basisberoepsgerichte leerweg, bedoeld in [artikel 2.22, eerste lid, onderdeel b][ref1],
      ook inrichten als leer-werktraject. Een leer-werktraject is gericht op het behalen van een startkwalificatie
      op het niveau van de basisberoepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel b, WEB][ref2] of
      [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref3].

      2 Een leer-werktraject omvat een buitenschools praktijkgedeelte, dat wordt verzorgd bij een bedrijf of organisatie.

      3 Elke schoolweek in het derde en vierde leerjaar omvat in elk geval binnenschools onderwijs.

      4 Een leer-werktraject omvat in elk geval Nederlandse taal en een beroepsgericht programma. Het bevoegd gezag kan,
      na overleg met de leerling of diens ouders, beslissen dat het leer-werktraject voor die leerling ook een of meer
      andere vakken van de basisberoepsgerichte leerweg omvat.

      5 Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:

      a. de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf
      dat of de organisatie die het buitenschoolse praktijkgedeelte verzorgt; en

      b. de invulling van het buitenschoolse praktijkgedeelte.

      6 Het buitenschoolse praktijkgedeelte omvat niet uitsluitend eenzijdige productie-arbeid. Het wordt verzorgd op
      grondslag van een leer-werkovereenkomst tussen het bevoegd gezag, de leerling of diens ouders, en het bedrijf dat
      of de organisatie die dit praktijkgedeelte verzorgt.

      7 In afwijking van [artikel 610, tweede lid, tweede volzin, van Boek 7 van het Burgerlijk Wetboek][ref4], zijn in
      geval van strijd als bedoeld in die volzin, van toepassing het zesde lid en de regels voor de uitvoering daarvan.

      8 Voor leerlingen voor wie het bevoegd gezag het volgen van een leer-werktraject het meest geschikt acht, wordt het
      onderwijs in de eerste twee leerjaren vanwege de in [artikel 2.12][ref5] bedoelde bevordering van de doorstroming
      van leerlingen, verzorgd op basis van een samenstel van kerndoelen dat niet alle kerndoelen behoeft te omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2.12
