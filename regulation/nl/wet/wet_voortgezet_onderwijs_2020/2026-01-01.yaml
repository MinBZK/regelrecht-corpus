      1 In afwijking van [artikel 5.4, eerste lid][ref1], bestaat de bekostiging voor een school uit:

      a. een bedrag per school; en

      b. een bedrag per leerling, waarbij onderscheid kan worden gemaakt naar schoolsoort, leerjaar, leerweg of profiel.

      2 [Artikel 5.4, tweede lid][ref2], is niet van toepassing.

      3 [Artikel 5.4, vierde lid, onderdeel c][ref3], is niet van toepassing. In plaats daarvan wordt de bekostiging
      van de scholen mede verstrekt voor kosten wegens voorschriften die zijn gegevens bij of krachtens de
      [Ambtenarenwet BES][ref4].

      4 De [artikelen 5.5][ref5] en [5.9, derde lid][ref6], zijn niet van toepassing.

      5 Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging kan worden toegekend.


