  - number: '5.43'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.43
  - number: 5.43a
    text: |-
      Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.43a
  - number: '5.44'
    text: |-
      1 De gemeente vergoedt de kosten van herstel van schade aan gebouwen, terreinen en roerende zaken waarvoor de
      scholen bekostiging ontvangen, tenzij:

      a. die schade wordt toegebracht door schuld of nalatigheid van de rechtspersoon die de school in stand houdt; of

      b. de rechtspersoon die de school in stand houdt een beroep kan doen op een verzekering waarvoor de premie voor
      vergoeding in aanmerking komt, of indien de gemeente voor de vergoeding van die schade een collectieve verzekering
      heeft afgesloten, voor zover die collectieve verzekering de schade dekt.

      2 Indien schade die is ontstaan aan gebouwen, terreinen of roerende zaken van een school in aanmerking komt voor
      vergoeding door de gemeente, treedt de gemeente op het moment van een uitdrukkelijk besluit tot vergoeding in alle
      rechten van de rechtspersoon die de school in stand houdt tegenover derden met betrekking tot die schade.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.44
  - number: '5.45'
    text: |-
      1 Onze Minister verstrekt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 1.5.1 WEB][ref1], binnen de grenzen van de middelen die de begrotingswetgever beschikbaar heeft gesteld,
      subsidie voor de uitvoering van de taak, bedoeld in [artikel 2.105, tweede lid][ref2].

      2 De subsidie wordt per boekjaar verstrekt. De [artikelen 2.4.2][ref3] en [2.4.3 WEB][ref4] zijn van
      overeenkomstige toepassing.


