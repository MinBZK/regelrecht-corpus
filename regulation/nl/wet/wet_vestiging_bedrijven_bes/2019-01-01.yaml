articles:
  - number: '1'
    text: |-
      In de artikelen van deze wet wordt verstaan onder openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel1
  - number: 1a
    text: |-
      1 Onder zaak verstaat deze wet en de ter uitvoering daarvan uitgevaardigde besluiten, elke onderneming, waarin
      eenig bedrijf, door wien ook, wordt uitgeoefend.

      2 Naamlooze vennootschappen, bestuurders van Naamlooze vennootschappen, coöperatieve vereenigingen, importeurs,
      agenten, tusschenhandelaars, alsmede vennooten van een vennootschap onder een firma en van een vennootschap en
      commandito, met uitzondering evenwel van den commanditairen vennoot, worden steeds geacht een zaak in den zin dezer
      wet te drijven.

      3 Filialen, bijkantoren en andere nederzettingen van zaken worden ten aanzien van de bepalingen dezer wet als
      afzonderlijke zaken beschouwd.

      4 Een zaak wordt gevestigd, wanneer het bedrijf ten aanzien van het publiek aanvangt.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel1a
  - number: '2'
    text: |-
      Het is verboden:

      a. een zaak te vestigen en te drijven of te doen drijven;

      b. een zaak te doen vestigen en te drijven of te doen drijven;

      c. een zaak over te nemen en te drijven of te doen drijven;

      d. een zaak te doen overnemen en te drijven of te doen drijven;

      e. een zaak voort te zetten of te doen voortzetten;

      f. een zaak ten aanzien van het publiek te verplaatsen;

      g. een zaak van aard te wijzigen, zonder een daartoe strekkende vergunning van het Bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel2
  - number: '3'
    text: |-
      Geen vergunning is vereischt voor één of meer van bovengenoemde handelingen ten aanzien van zaken:

      a. toebehoorende aan publiekrechtelijke lichamen;

      b. welke uitsluitend uitgeoefend worden in of op openbare markten of als straatventerij op den openbare weg;

      c. waarbij het bedrijf van land-, tuinbouw, veeteelt of visscherij uitgeoefend wordt al of niet samengaande met den
      verkoop van de producten in dat bedrijf voortgebracht, gewonnen of gevangen;

      d. toebehoorende aan ambachtslieden, tenzij deze uitgeoefend worden met meer arbeiders dan voor elk bedrijf door
      het Bestuurscollege bij besluit zal worden bepaald;

      e. toebehoorende aan kleine handelslieden, die bij besluit van het Bestuurscollege daarvan zijn vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het verzoekschrift tot het verkrijgen eener vergunning, houdt zooveel mogelijk en zoo nauwkeurig mogelijk in, de
      opgaven, vermeld in de artikelen 12 tot en met 21 van het Handelsregisterbesluit BES.

      2 Indien inlichtingen in het buitenland moeten worden ingewonnen, komen de daarop vallende kosten ten laste van den
      aanvrager der vergunning en is deze desverlangd verplicht tot dat einde het bedrag van USD 8 voor te schieten.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel4
  - number: 4a
    text: |-
      1 Het bestuurscollege beslist binnen acht weken op een aanvraag.

      2 De in het eerste lid genoemde termijn vangt aan op het moment dat een aanvraag op een door het bestuurscollege
      vast te stellen wijze is ingediend en kan door het bestuurscollege schriftelijk worden verlengd met
      ten hoogste acht weken, indien het bestuurscollege voornemens is een aanvraag af te wijzen op grond van
      [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel5
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: '5'
  - number: 4b
    text: |-
      1 Indien niet tijdig op de aanvraag is beslist, is de vestigingsvergunning van rechtswege gegeven.

      2 De verlening van rechtswege geldt als beschikking.

      3 De beschikking, bedoeld in het tweede lid, treedt in werking op de derde dag na afloop van de beslistermijn,
      bedoeld in [artikel 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel4a
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: 4a
  - number: 4c
    text: |-
      1 Het bestuurscollege maakt de beschikking, bedoeld in [artikel 4b, tweede lid][ref1], op de daarvoor gebruikelijke
      wijze bekend binnen twee weken nadat zij van rechtswege is gegeven.

      2 Bij de bekendmaking wordt vermeld dat de beschikking van rechtswege is gegeven.

      3 Het bestuurscollege kan nadere voorwaarden als bedoeld in [artikel 6][ref2], verbinden aan een van rechtswege
      gegeven vergunning, door binnen acht weken na afloop van de beslistermijn een nadere beschikking te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0028164#Artikel6
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: 4b
      - id: ref2
        bwb_id: BWBR0028164
        artikel: '6'
  - number: '5'
    text: |-
      1 De vergunning kan worden geweigerd indien de aanvrager in kennelijk onvoldoende mate beschikt over algemene
      vaardigheden om een zaak te leiden dan wel in kennelijk onvoldoende mate beschikt over de financiële middelen die
      naar redelijkheid benodigd zijn voor het starten van een zaak als waarvoor de vergunning wordt gevraagd.

      2 De vergunning kan worden geweigerd met het oog op een te beschermen algemeen belang, onder voorwaarde dat Onze
      Minister van Economische Zaken en Klimaat voorafgaand aan de weigering daarmee heeft ingestemd. Het gemotiveerde
      verzoek om instemming wordt door het bestuurscollege aan de minister gezonden met in ieder geval een beschrijving
      van het te beschermen algemeen belang. De Minister deelt zijn beslissing mee uiterlijk binnen drie weken na
      ontvangst van het verzoek om instemming.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel5
  - number: '6'
    text: |-
      Bij het verleenen eener vergunning is het Bestuurscollege bevoegd, daaraan voorwaarden te verbinden, betreffende de
      credietwaardigheid van den aanvrager en de financiering der zaak.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 De vergunning kan door hem, die haar verleende worden ingetrokken:

      a. indien de persoon of personen, aan wie(n) de vergunning is verleend, niet kan (kunnen) aantoonen, dat de voor de
      vergunning gestelde voorwaarden worden nageleefd;

      b. indien zij verkregen werd door het opzettelijk verschaffen van een onjuiste of onvolledige opgaaf, zooals
      bedoeld in [artikel 4][ref1];

      c. indien de vergunninghouder zijn zaak gedurende drie achtereenvolgende maanden of langer voor het publiek heeft
      gesloten en hij het bestuurscollege daarvan niet schriftelijk in kennis heeft gesteld;

      d. indien de vergunninghouder zijn zaak gedurende zes achtereenvolgende maanden of langer voor het publiek heeft
      gesloten en hij het bestuurscollege van een tijdelijke sluiting schriftelijk in kennis heeft gesteld.

      2 Behoudens in gevallen, waarbij de vergunning werd verkregen door opzettelijk onjuiste of onvolledig verschafte
      gegevens, in welk geval intrekking van de vergunning plaats vindt nadat een veroordeling terzake van het misdrijf
      genoemd in [artikel 10 lid 3][ref2], in kracht van gewijsde is gegaan, zal de bevoegde autoriteit aan de intrekking
      der vergunning een redelijken termijn verbinden, waarbinnen de vergunninghouder zijn zaak zal kunnen liquideeren.
      Na het verstrijken van dezen termijn wordt de betrokken persoon niet geacht in het bezit eener vergunning te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028164#Artikel10
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028164
        artikel: '10'
  - number: '8'
    text: |-
      Verlening, weigering of intrekking van een vergunning heeft niet plaats dan nadat de betrokken Kamer van Koophandel
      en Nijverheid is gehoord. De betrokken kamer brengt het advies binnen twee weken uit.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel8
  - number: '9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel9
  - number: '10'
    text: |-
      1 Met hechtenis van ten hoogste een maand of geldboete van ten hoogste USD 280 wordt gestraft; hij, die het verbod,
      gesteld bij [artikel 2][ref1], overtreedt.

      2 Indien tijdens het plegen van het feit nog geen twee jaren zijn verloopen sedert een vroegere veroordeeling van
      den schuldige wegens een overtreding van een of meer bepalingen dezer wet onherroepelijk is geworden, kan hechtenis
      van ten hoogste twee maanden of geldboete van ten hoogste USD 560 worden opgelegd.

      3 Met gevangenisstraf van ten hoogste zes maanden of geldboete van ten hoogste USD 1120 wordt gestraft hij,
      die opzettelijk een onjuiste of onvolledige opgaaf doet ter verkrijging van een vergunning, als bedoeld in
      [artikel 2][ref2].

      4 De feiten, strafbaar gesteld in het eerste en tweede lid van dit artikel, worden beschouwd als overtredingen.

      5 De feiten, strafbaar gesteld in het derde lid van dit artikel, worden beschouwd als misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028164#Artikel2
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028164
        artikel: '2'
  - number: '11'
    text: |-
      1 Indien de bij deze wet strafbaar gestelde feiten worden begaan door of vanwege een rechtspersoon, wordt de
      strafvervolging ingesteld en de straf uitgesproken tegen de bestuurders en/of commissarissen, en bij afwezigheid en
      ontstentenis van deze personen, tegen den vertegenwoordiger van den rechtspersoon in de openbare lichamen Bonaire,
      Sint Eustatius en Saba.

      2 Het bepaalde bij het vorige lid vindt overeenkomstige toepassing ten opzichte van rechtspersonen, optredende als
      bestuurders of vertegenwoordigers van een anderen rechtspersoon.

      3 Geen strafvervolging wordt ingesteld en geen straf uitgesproken, tegen den bestuurder en/of commissaris, buiten
      wiens toedoen het feit begaan is.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel11
  - number: '12'
    text: |-
      Met het opsporen van de bij deze wet strafbaar gestelde feiten zijn, behalve de ambtenaren, die in het algemeen
      belast zijn met het opsporen van strafbare feiten, mede belast zij, die door het Bestuurscollege daartoe worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel12
  - number: '13'
    text: |-
      1 De hierboven bedoelde opsporingsambtenaren hebben te allen tijde toegang tot alle plaatsen waar redelijkerwijs
      vermoed kan worden, dat een bij deze regeling strafbaar gesteld feit wordt gepleegd. Wordt hun de toegang
      geweigerd, dan verschaffen zij zich dien, desnoods met inroeping van den sterken arm, ondanks de bewoners,
      gebruikers of eigenaars.

      2 Is de plaats tevens eene woning, of alleen door eene woning toegankelijk, dan treden zij tegen den wil des
      bewoners niet binnen dan in tegenwoordigheid van den betrokken ambtenaar van het Openbaar Ministerie bij het
      Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel13
  - number: '14'
    text: |-
      Bij ministeriële regeling kunnen verdere regelen in het belang van een goede uitvoering van deze wet worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel14
  - number: '15'
    text: Het Bestuurscollege doet een zaak sluiten, welke zonder vergunning gedreven wordt.
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel15
  - number: '16'
    text: |-
      Het bepaalde in [artikel 2, sub e][ref1], is niet van toepassing ten aanzien van zaken, die bij het inwerkingtreden
      dezer wet wettig werden gedreven. Voor het voortzetten dezer zaken wordt, zonder dat zij een vergunning behoeven
      aan te vragen, door de autoriteit aangewezen in artikel 2, een vergunning als daar bedoeld uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028164#Artikel2
    url: https://wetten.overheid.nl/BWBR0028164/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028164
        artikel: '2'
