$id: regeling_uitvoering_verordeningen_inzake_voedselveiligheid_lnv
regulatory_layer: WET
publication_date: '2005-12-23'
valid_from: '2005-01-01'
bwb_id: BWBR0017633
url: https://wetten.overheid.nl/BWBR0017633/2005-01-01
preamble:
  text: |-
    Gelet op artikel 19 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel1
  - number: 1.a
    text: |-
      [verordening (EG) nr. 178/2002](32002R0178): [verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement
      en de Raad van de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften
      van de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot
      vaststelling van procedures voor voedselveiligheidsaangelegenheden (PbEG L 31);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel1
  - number: 1.b
    text: |-
      levensmiddelenbedrijf: levensmiddelenbedrijf als bedoeld in artikel 3, onderdeel 2, van [verordening (EG) nr.
      178/2002](32002R0178);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel1
  - number: 1.c
    text: |-
      primaire productie: primaire productie als bedoeld in artikel 3, onderdeel 17, van [verordening (EG) nr. 178/2002]
      (32002R0178).
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden in strijd te handelen met artikel 12, 14 en 16 van [verordening (EG) nr. 178/2002](32002R0178) ten
      aanzien van levensmiddelen waarop een van de volgende regelingen van toepassing is:
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel2
  - number: 2.a
    text: de [Regeling uitvoer vers vlees en vleesbereidingen 1985](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel2
  - number: 2.b
    text: de [Regeling keuring en handelsverkeer vleesproducten 1993](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel2
  - number: 2.c
    text: de [Regeling keuring en handel dierlijke producten](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel2
  - number: 2.d
    text: de [Regeling keuring en handelsverkeer konijne- en hazevlees 1993](onbekend).
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is exploitanten van een levensmiddelenbedrijf verboden in strijd te handelen met artikel 18 en 19 van
      [verordening (EG) nr. 178/2002](32002R0178) ingeval een van de volgende regelingen op hen van toepassing is:
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: 3.1.a
    text: de [Regeling uitvoer vers vlees en vleesbereidingen 1985](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: 3.1.b
    text: de [Regeling keuring en handelsverkeer vleesproducten 1993](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: 3.1.c
    text: de [Regeling keuring en handel dierlijke producten](onbekend);
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: 3.1.d
    text: de [Regeling keuring en handelsverkeer konijne- en hazevlees 1993](onbekend).
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het is exploitanten van een levensmiddelenbedrijf dat actief is in enig stadium van primaire productie verboden in
      strijd te handelen met artikel 18 en 19 van [verordening nr. 178/2002](32002R0178).
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: '3.3'
    text: |-
      De Voedsel en Waren Autoriteit is de bevoegde autoriteit, bedoeld in artikel 19, eerste en derde lid, van
      [verordening (EG) nr. 178/2002](32002R0178).
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel3
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoering verordeningen inzake voedselveiligheid LNV.'
    url: https://wetten.overheid.nl/BWBR0017633/2005-01-01#Artikel6
