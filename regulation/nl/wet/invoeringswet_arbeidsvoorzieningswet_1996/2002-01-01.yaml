preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Arbeidsvoorzieningswet 1996
    en enkele daarmee samenhangende onderwerpen te regelen, alsmede om verder uitvoering te geven aan de Richtlijn
    van de Raad van de Europese Gemeenschappen van 25 juni 1991 betreffende de tenuitvoerlegging van maatregelen
    ter bevordering van de verbetering van de veiligheid en de gezondheid op het werk van de werknemers met
    arbeidsbetrekkingen voor bepaalde tijd of uitzendbetrekkingen (91/383/EEG; Pb EG nr. L 206);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Arbeidsvoorzieningsorganisatie, Centraal Bestuur, Regionaal Bestuur, Algemene Directie en Regionale Directie:
      hetgeen daaronder wordt verstaan in de [Arbeidsvoorzieningswet 1996][ref1];

      b. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '2'
    text: |-
      1 De Arbeidsvoorzieningswet en de Invoeringswet Arbeidsvoorzieningswet worden ingetrokken.

      2 Voor de verschillende artikelen of onderdelen van de artikelen van de Arbeidsvoorzieningswet kan bij koninklijk
      besluit het tijdstip waarop deze vervallen verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De Arbeidsvoorzieningsorganisatie, genoemd in artikel 2 van de Arbeidsvoorzieningswet, wordt als rechtspersoon
      gehandhaafd.

      2 Waar in een wettelijk voorschrift of enige andere regeling sprake is van de Arbeidsvoorzieningsorganisatie
      of een van haar organen als bedoeld in de Arbeidsvoorzieningswet, wordt als zodanig beschouwd
      de Arbeidsvoorzieningsorganisatie dan wel het daartoe behorende orgaan, bedoeld in de
      [Arbeidsvoorzieningswet 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '4'
    text: |-
      Aan de voorzitter, de plaatsvervangend voorzitters, de leden en de plaatsvervangende leden van het Centraal Bestuur
      voor de Arbeidsvoorziening en van de Regionale Besturen voor de Arbeidsvoorziening die op de dag voorafgaande aan
      de datum van inwerkingtreding van deze wet die functies bekleden wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Aan de leden van de raad, bedoeld in artikel 74 van de Arbeidsvoorzieningswet, die op de dag voorafgaande aan de
      datum van inwerkingtreding van deze wet die functie bekleden wordt met ingang van die datum ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De ontslagcommissie, bedoeld in artikel 37 van de Arbeidsvoorzieningswet, de benoemingen van leden en
      plaatsvervangende leden van die commissie, voor de daarbij vastgestelde tijd, en de regels die zijn gesteld op
      grond van [het zevende][ref1] en [het achtste lid][ref2] van genoemd artikel, berusten met ingang van de datum van
      inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref3] op artikel 43 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008368#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008368#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008368
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008368
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008367
  - number: '7'
    text: |-
      De algemene maatregel van bestuur op grond van artikel 61, eerste lid, onderdeel *d*, van de Arbeidsvoorzieningswet
      berust met ingang van de datum van inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref1] op artikel 69,
      eerste lid, onderdeel *d*, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '8'
    text: |-
      De door het Centraal Bestuur op grond van de artikelen 18 en 21, derde lid, onderscheidenlijk 66, eerste lid, 67
      en 69 van de Arbeidsvoorzieningswet gestelde regels berusten met ingang van de datum van inwerkingtreding van de
      [Arbeidsvoorzieningswet 1996][ref1] op artikel 23, onderscheidenlijk de artikelen 74, eerste lid, 75 en 77 van
      die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '9'
    text: |-
      De door de Regionale Besturen op grond van de artikelen 30 en 33, derde lid, van de Arbeidsvoorzieningswet
      gestelde regels berusten met ingang van de datum van inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref1],
      doch uiterlijk tot het tijdstip met ingang waarvan het Centraal Bestuur toepassing geeft aan
      [artikel 23, onderdeel ][ref2] van laatstbedoelde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0008368#Artikel35
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0008368
        artikel: '35'
        hoofdstuk: '4'
  - number: '10'
    text: |-
      Het reglement, bedoeld in artikel 19 van de Wet persoonsregistraties en vastgesteld door het Centraal Bestuur op
      grond van artikel 66, tweede lid, van de Arbeidsvoorzieningswet berust met ingang van de datum van inwerkingtreding
      van de [Arbeidsvoorzieningswet 1996][ref1], doch uiterlijk tot en met de laatste dag van de vijfde kalendermaand na
      die datum, op artikel 74, tweede lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '11'
    text: |-
      De door het Centraal Bestuur op grond van artikel 14, tweede lid, van de Arbeidsvoorzieningswet gestelde en
      door Onze Minister op grond van artikel 109 van die wet goedgekeurde regels berusten met ingang van de datum
      van inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref1], doch uiterlijk tot en met de laatste dag van de
      vijfde kalendermaand na die datum, op artikel 19, onderdeel *b*, van die wet en gelden voor hetzelfde tijdvak als
      goedgekeurd door Onze Minister op grond van artikel 87 van laatstbedoelde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '12'
    text: |-
      De door het Centraal Bestuur op grond van artikel 27 van de Arbeidsvoorzieningswet gestelde regels berusten met
      ingang van de datum van inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref1], doch uiterlijk tot en met de
      laatste dag van de vijfde kalendermaand na die datum, op artikel 32 van die wet en gelden voor hetzelfde tijdvak
      als goedgekeurd door Onze Minister op grond van artikel 87 van laatstbedoelde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '13'
    text: |-
      De door het Centraal Bestuur op grond van artikel 99 van de Arbeidsvoorzieningswet gestelde regels
      en de daarop steunende besluiten berusten met ingang van de datum van inwerkingtreding van de
      [Arbeidsvoorzieningswet 1996][ref1] op artikel 81, eerste en tweede lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '14'
    text: |-
      De door de Regionale Besturen op grond van artikel 99 van de Arbeidsvoorzieningswet gestelde regels
      en de daarop steunende besluiten berusten met ingang van de datum van inwerkingtreding van de
      [Arbeidsvoorzieningswet 1996][ref1], doch uiterlijk tot het tijdstip met ingang waarvan het Centraal Bestuur
      toepassing geeft aan artikel 81, derde lid, van die wet, op artikel 81, eerste en tweede lid, van laatstbedoelde
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '15'
    text: |-
      De vaststelling van het aantal en de werkgebieden van de Regionale Besturen, zoals deze ingevolge besluit van het
      Centraal Bestuur op grond van artikel 9 van de Arbeidsvoorzieningswet geldt, berust met ingang van de datum van
      inwerkingtreding van de [Arbeidsvoorzieningswet 1996][ref1] op artikel 13 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '16'
    text: |-
      1 Ten aanzien van de oprichting of mede-oprichting van en deelneming in stichtingen, maatschappen,
      vennootschappen, verenigingen, coöperaties en onderlinge waarborgmaatschappijen door de
      Arbeidsvoorzieningsorganisatie die heeft plaatsgevonden vóór de datum van inwerkingtreding van deze wet, is
      [artikel 10, tweede lid, van de Arbeidsvoorzieningswet 1996][ref1] eerst na verloop van één jaar na die datum van
      toepassing.

      2 Ten aanzien van een oprichting, mede-oprichting of deelneming als bedoeld in het eerste lid waaruit geen
      verplichtingen, rechten of bevoegdheden van de Arbeidsvoorzieningsorganisatie met betrekking tot de stichting,
      maatschap, vennootschap, vereniging, coöperatie of onderlinge waarborgmaatschappij zijn voortgevloeid of nog kunnen
      voortvloeien, is [artikel 10, tweede lid, van de Arbeidsvoorzieningswet 1996][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008367#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008367#Artikel10
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008367
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0008367
        artikel: '10'
  - number: '17'
    text: |-
      1 Onze Minister is bevoegd in plaats van de tijdstippen, genoemd in de Afdelingen 3 en 4 van [hoofdstuk II van
      de Arbeidsvoorzieningswet 1996](onbekend), andere tijdstippen vast te stellen alsmede te bepalen dat anderszins
      wordt afgeweken van de bij of krachtens die afdelingen gegeven regels dan wel dat de toepassing daarvan achterwege
      blijft, voor zover dat in verband met de datum van inwerkingtreding van die wet noodzakelijk is.

      2 Onze Minister is bevoegd, voor zover dat in verband met de datum van inwerkingtreding van de
      [Arbeidsvoorzieningswet 1996][ref1] noodzakelijk is, regels te stellen met betrekking tot de bevoegdheid van het
      Centraal Bestuur en de Regionale Besturen tot het aangaan van verplichtingen en het doen van uitgaven en de daaraan
      ten grondslag te leggen begrotingen en beleidsplannen.

      3 Onze Minister is overigens bevoegd met het oog op een goede invoering van de [Arbeidsvoorzieningswet 1996][ref2]
      regels te stellen, waarbij zo nodig kan worden afgeweken van het bepaalde bij en krachtens die wet en de
      Arbeidsvoorzieningswet.

      4 Alvorens toepassing te geven aan dit artikel hoort Onze Minister het Centraal Bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
      [ref2]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008367
      - id: ref2
        bwb_id: BWBR0008367
  - number: '35'
    text: |-
      Het Centraal Bestuur geeft in elk geval met ingang van de datum van inwerkingtreding van de
      [Arbeidsvoorzieningswet 1996][ref1] en vervolgens gedurende het tijdvak van de eerste vier kalenderjaren na die
      datum in elk geval telkens met ingang van ieder kalenderjaar toepassing aan artikel 68, onderdelen –*e*, van die
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008367
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008367
  - number: '36'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel36
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Arbeidsvoorzieningswet 1996.'
    url: https://wetten.overheid.nl/BWBR0008368/2002-01-01#Artikel37
