$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanwijzing_dier_en_plantensoorten_flora_en_faunawet
regulatory_layer: WET
publication_date: '2016-01-19'
valid_from: '2015-01-21'
bwb_id: BWBR0013485
url: https://wetten.overheid.nl/BWBR0013485/2015-01-21
preamble:
  text: |-
    Gelet op het Verdrag inzake het behoud van wilde dieren en planten en hun natuurlijk leefmilieu in Europa (Trb.
    1979, 175);

    Gelet op richtlijn nr. 83/129/EEG van de Raad van 28 maart 1983 betreffende de invoer in de Lid-Staten van huiden
    van bepaalde zeehondenjongen en daarvan vervaardigde producten (PbEG L 91);

    Gelet op verordening (EEG) nr. 3254/91 van de Raad van 4 november 1991 houdende een verbod op het gebruik van
    de wildklem in de Gemeenschap en op het binnenbrengen in de Gemeenschap van pelzen en producten die vervaardigd
    zijn van bepaalde in het wild levende diersoorten uit landen waar gebruik wordt gemaakt van de wildklem of andere
    vangmethoden die niet stroken met de internationale normen voor humane vangst met behulp van vallen (PbEG L 308);

    Gelet op richtlijn nr. 92/43/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992 inzake de
    instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206);

    Gelet op verordening (EG) nr. 338/97 van de Raad van de Europese Unie van 9 december 1996 inzake de bescherming van
    in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer (PbEG 1997, L 61);

    Gelet op de artikelen 3, tweede lid, 4, derde lid, en 5, tweede lid, van de Flora- en faunawet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            wet:

              [Flora- en faunawet][ref1];



            b
             basisverordening:

              [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december 1996 inzake de
      bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer
      (PbEG 1997, L 61);



            c

              [richtlijn 92/43/EEG](31992L0043):

              [richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen van 21 mei 1992 inzake de
      instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206);



            d
            verordening (EG) 1007/2009:

              verordening (EG) nr. 1007/2009 van het Europees Parlement en de Raad van de Europese Unie van 16 september
      2009 betreffende de handel in zeehondenproducten (PbEU L 286).


      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: '2'
    text: |-
      Als beschermde inheemse plantensoort als bedoeld in [artikel 3, tweede lid, van de wet][ref1] zijn aangewezen de
      in [bijlage 1][ref2] bij deze regeling genoemde plantensoorten, met inbegrip van de bij deze bijlage behorende
      voetnoot.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013485
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013485
  - number: '3'
    text: |-
      Als beschermde inheemse diersoort als bedoeld in [artikel 4, derde lid, van de wet][ref1] zijn aangewezen de in
      [bijlage 2][ref2] bij deze regeling genoemde diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013485
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013485
  - number: '4.1'
    text: |-
      Als beschermde uitheemse dier- en plantensoort als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn,
      voorzover het soorten als bedoeld in [artikel 5, eerste lid, onderdeel a, van de wet][ref2] betreft, en met
      uitzondering van de daarin voorkomende beschermde inheemse dier- en plantensoorten, aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel5
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '5'
  - number: 4.1.a
    text: |-
      de soorten genoemd in bijlage A bij de basisverordening, met inachtneming van de tot die bijlage behorende
      opmerkingen over de interpretatie daarvan;
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
  - number: 4.1.b
    text: |-
      de soorten genoemd in bijlage IV bij [richtlijn 92/43/EEG](31992L0043), voorzover deze soorten niet vallen onder
      de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
  - number: 4.1.c
    text: |-
      de soorten genoemd in [bijlage 3][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013485
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013485
  - number: '4.2'
    text: |-
      Als beschermde uitheemse dier- en plantensoort als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn,
      voorzover het soorten als bedoeld in [artikel 5, eerste lid, onderdeel b, van de wet][ref2] betreft en voorzover
      deze soorten niet reeds onder [artikel 4, eerste lid][ref3], van deze regeling vallen, aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013485#Artikel4
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0013485
        artikel: '4'
  - number: 4.2.a
    text: |-
      de soorten genoemd in de bijlagen B, C en D bij de basisverordening, met inachtneming van de tot die bijlage
      behorende opmerkingen over de interpretatie daarvan, en met uitzondering van de daarin voorkomende beschermde
      inheemse dier- en plantensoorten;
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
  - number: 4.2.b
    text: |-
      Castor canadensis (Canadese bever), Canis latrans (Coyote), Martes zibellina (sabelmarter), Procycon lotor
      (wasbeer), Ondatra zibethicus (muskusrat), Martes pennanti (Canadese marter), Taxidea taxus (Canadese das) en
      Martes americana (Amerikaanse marter);
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
  - number: 4.2.c
    text: Zeehond als bedoeld in artikel 2, eerste onderdeel, van verordening (EG) 1007/2009.
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel4
  - number: '5'
    text: |-
      Een wijziging van bijlage IV bij [richtlijn 92/43/EEG](31992L0043) geldt voor de toepassing van deze regeling met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [artikelen 3, tweede lid][ref1], [4, derde lid][ref2], en
      [5, tweede lid, van de Flora- en faunawet][ref3] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel5
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '5'
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing dier- en plantensoorten Flora- en faunawet.'
    url: https://wetten.overheid.nl/BWBR0013485/2015-01-21#Artikel7
