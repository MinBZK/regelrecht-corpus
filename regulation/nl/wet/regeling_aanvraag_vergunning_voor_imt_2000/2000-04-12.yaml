  - number: '10'
    text: |-
      1 De aanvrager voldoet een bedrag ter zekerstelling dat een bod gestand wordt gedaan of kosten en schade kunnen
      worden verhaald.

      2 Het in het eerste lid bedoelde bedrag bedraagt honderd miljoen gulden indien een aanvraag is ingediend voor een
      of meer vergunningen, bedoeld in [artikel 2, onder a of onder b][ref1].

      3 Het in het eerste lid bedoelde bedrag bedraagt negentig miljoen gulden indien een aanvraag is ingediend voor een
      of meer vergunningen, bedoeld in [artikel 2, onder c tot en met e][ref2].

      4 Indien een aanvraag is ingediend voor zowel een of meer vergunningen als bedoeld in
      [artikel 2, onder a of onder b][ref3], als voor een of meer van de vergunningen, bedoeld in
      [artikel 2, onder c tot en met e][ref4], bedraagt het in het eerste lid bedoelde bedrag honderd miljoen gulden.

      5 Uiterlijk op het tijdstip, bedoeld in [artikel 8, eerste lid][ref5], is het in het tweede, derde of vierde lid
      bedoelde bedrag, onder vermelding van ‘zekerstelling IMT-2000’ bijgeschreven op het in [artikel 9][ref6] genoemde
      bankrekeningnummer, of is voor het bedrag ter zekerstelling een bankgarantie volgens het model dat als bijlage 2
      bij deze regeling is gevoegd, overgelegd aan de notaris.


