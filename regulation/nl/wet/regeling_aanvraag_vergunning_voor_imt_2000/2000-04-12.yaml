  - number: '7'
    text: |-
      1 In de aanvraag wordt aangegeven voor welke vergunningen, bedoeld in [artikel 2][ref1], de aanvraag wordt
      ingediend.

      2 Onverminderd het eerste lid, kan de aanvrager ten hoogste één van de door hem aangevraagde vergunningen
      verkrijgen.

      3 In de aanvraag wordt met inachtneming van het tweede lid tevens aangegeven voor welke vergunning de aanvrager
      de voorkeur heeft indien de voor IMT-2000 beschikbare vergunningen zonder toepassing van een veiling kunnen worden
      verleend.

      4 In de aanvraag wordt tevens aangegeven welke door de Internationale Telecommunicatie Unie
      vastgestelde radio-interfaces de aanvrager zal gebruiken indien hij een van de vergunningen, bedoeld in
      [artikel 2, onder b tot en met e][ref2], verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel2
