  - number: '4'
    text: |-
      1 Degene die in aanmerking wenst te komen voor een vergunning voor IMT-2000, verzoekt de minister per brief om
      toezending van een aanvraagdocument.

      2 Het verzoek wordt als volgt geadresseerd:

        - De Minister van Verkeer en Waterstaat
        - p/a mevr. Mr. W.H.G. Kroon-Welp, notaris
        - Pels Rijcken & Droogleever Fortuijn
        - Postbus 11756
        - 2502 AT Den Haag
        - Nederland
        - e-mail: IMT-2000@PRDF.nl.

      3 Een aanvraagdocument wordt toegezonden na ontvangst van een bedrag van zevenhonderdvijftig gulden dat onder
      vermelding van 'aanvraagdocument vergunning voor IMT-2000' op het in [artikel 9][ref1] genoemde bankrekeningnummer
      wordt overgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel9
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '9'
    machine_readable:
      execution:
        output:
          - name: kosten_aanvraagdocument_nlg
            type: number
            description: >-
              Bedrag voor toezending van het aanvraagdocument in gulden (NLG),
              bedoeld in artikel 4 lid 3.
        actions:
          - output: kosten_aanvraagdocument_nlg
            value: 750
  - number: '5'
    text: |-
      1 Eenieder aan wie een aanvraagdocument is toegezonden, kan vragen met betrekking tot dat document per brief of per
      elektronische post en per brief aan de minister stellen.

      2 De vragensteller vergezelt iedere vraag van een niet tot zijn identiteit herleidbare versie.

      3 De vragen, bedoeld in het eerste en tweede lid, worden uiterlijk 10 mei 2000, om 14.00 uur per brief door de
      minister ontvangen.

      4 De vragen worden geadresseerd op de wijze, genoemd in [artikel 4, tweede lid][ref1].

      5 De minister beantwoordt de vragen die tijdig zijn gesteld uiterlijk op 17 mei 2000 schriftelijk en stuurt
      de gestelde vragen met de daarop gegeven antwoorden gelijktijdig in afschrift aan eenieder aan wie een
      aanvraagdocument is toegezonden.

      6 De identiteit van de vragensteller wordt niet bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel4
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '4'
  - number: '6'
    text: |-
      1 De aanvraag omvat de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage 1][ref1], volgens
      de specificaties in deze bijlage.

      2 De aanvraag wordt ingedeeld overeenkomstig de in het eerste lid bedoelde bijlage.

      3 In de aanvraag worden de namen vermeld van ten hoogste vier natuurlijke personen, die beschikken over een
      rechtsgeldige en toereikende volmacht om namens de aanvrager handelingen te verrichten gedurende de veiling,
      bedoeld in de [Regeling veiling gebruiksrecht radio-frequenties voor IMT-2000][ref2].

      4 De aanvrager zorgt er voor dat de in het derde lid bedoelde personen tijdens de veiling niet tevens namens een
      andere aanvrager handelingen verrichten.

      5 Bij de aanvraag worden voor iedere in de aanvraag vermelde natuurlijke persoon, bedoeld in het derde lid, de
      volgende documenten ingediend:

      a. een kopie van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3], waaruit de
      identiteit van de houder en de geldigheid van het document blijkt;

      b. twee identieke recente pasfoto's;

      c. de in het derde lid bedoelde, in de Nederlandse taal gestelde volmacht.

      6 De door de aanvrager in te dienen aanvraag is in de Nederlandse taal gesteld en aangeduid als het origineel
      exemplaar. Dit exemplaar wordt ondertekend door de aanvrager.

      7 De aanvraag omvat zeven afschriften van het origineel exemplaar, bedoeld in het zesde lid en vijf exemplaren in
      de Engelse taal.

      8 Indien er verschillen bestaan tussen het origineel exemplaar, bedoeld in het zesde lid, en de afschriften of de
      Engelstalige exemplaren, is het origineel exemplaar van de aanvraag bindend.

      9 Onverminderd [artikel 11][ref4] informeert de aanvrager de minister onmiddellijk over wijzigingen met betrekking
      tot de in het eerste lid bedoelde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011288
      [ref2]: https://wetten.overheid.nl/BWBR0011289
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel11
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011288
      - id: ref2
        bwb_id: BWBR0011289
      - id: ref3
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011288
        artikel: '11'
  - number: '7'
    text: |-
      1 In de aanvraag wordt aangegeven voor welke vergunningen, bedoeld in [artikel 2][ref1], de aanvraag wordt
      ingediend.

      2 Onverminderd het eerste lid, kan de aanvrager ten hoogste één van de door hem aangevraagde vergunningen
      verkrijgen.

      3 In de aanvraag wordt met inachtneming van het tweede lid tevens aangegeven voor welke vergunning de aanvrager
      de voorkeur heeft indien de voor IMT-2000 beschikbare vergunningen zonder toepassing van een veiling kunnen worden
      verleend.

      4 In de aanvraag wordt tevens aangegeven welke door de Internationale Telecommunicatie Unie
      vastgestelde radio-interfaces de aanvrager zal gebruiken indien hij een van de vergunningen, bedoeld in
      [artikel 2, onder b tot en met e][ref2], verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel2
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '2'
  - number: '8'
    text: |-
      1 De aanvraag wordt uiterlijk op 5 juni 2000, om 14.00 uur ontvangen.

      2 Indiening van de aanvraag geschiedt uitsluitend door aflevering op het volgende adres:

        - De Minister van Verkeer en Waterstaat
        - p/a mevr. Mr. W.H.G. Kroon-Welp, notaris
        - Pels Rijcken & Droogleever Fortuijn
        - Koningin julianaplein 30
        - Gebouw Babylon
        - Kantoren A, 5e verdieping
        - Den Haag
        - Nederland.

      3 De minister bevestigt schriftelijk de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel8
    machine_readable:
      untranslatables:
        - construct: "om 14.00 uur"
          reason: >-
            Tijdstip (14:00 uur) kan niet worden uitgedrukt in het date type;
            alleen de datum (2000-06-05) is representeerbaar in de engine.
          suggestion: "Add TIME or DATETIME type/operation to engine"
          legal_text_excerpt: >-
            "De aanvraag wordt uiterlijk op 5 juni 2000, om 14.00 uur ontvangen."
            (artikel 8 lid 1)
          accepted: false
      execution:
        output:
          - name: indiening_deadline
            type: date
            description: >-
              Uiterste datum voor ontvangst van de aanvraag (5 juni 2000,
              artikel 8 lid 1). Tijdstip 14:00 uur is untranslatable.
        actions:
          - output: indiening_deadline
            value: "2000-06-05"
  - number: '9'
    text: |-
      Als bijdrage in de kosten voor de bemoeiingen met betrekking tot de aanvraagprocedure wordt, onder vermelding van
      'aanvraagprocedure IMT-2000' uiterlijk op het tijdstip, bedoeld in [artikel 8, eerste lid][ref1], een bedrag van
      twintigduizend gulden van de aanvrager ontvangen op onderstaand bankrekeningnummer:

      22.58.49.046,

      F. van Lanschot Bankiers N.V., Den Haag

      t.n.v.:

      Pels Rijcken & Droogleever Fortuijn,

      derdengelden notariaat,

      inzake IMT-2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel8
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '8'
    machine_readable:
      execution:
        output:
          - name: bijdrage_aanvraagprocedure_nlg
            type: number
            description: Bijdrage in kosten aanvraagprocedure in gulden (NLG)
        actions:
          - output: bijdrage_aanvraagprocedure_nlg
            value: 20000
  - number: '10'
    text: |-
      1 De aanvrager voldoet een bedrag ter zekerstelling dat een bod gestand wordt gedaan of kosten en schade kunnen
      worden verhaald.

      2 Het in het eerste lid bedoelde bedrag bedraagt honderd miljoen gulden indien een aanvraag is ingediend voor een
      of meer vergunningen, bedoeld in [artikel 2, onder a of onder b][ref1].

      3 Het in het eerste lid bedoelde bedrag bedraagt negentig miljoen gulden indien een aanvraag is ingediend voor een
      of meer vergunningen, bedoeld in [artikel 2, onder c tot en met e][ref2].

      4 Indien een aanvraag is ingediend voor zowel een of meer vergunningen als bedoeld in
      [artikel 2, onder a of onder b][ref3], als voor een of meer van de vergunningen, bedoeld in
      [artikel 2, onder c tot en met e][ref4], bedraagt het in het eerste lid bedoelde bedrag honderd miljoen gulden.

      5 Uiterlijk op het tijdstip, bedoeld in [artikel 8, eerste lid][ref5], is het in het tweede, derde of vierde lid
      bedoelde bedrag, onder vermelding van 'zekerstelling IMT-2000' bijgeschreven op het in [artikel 9][ref6] genoemde
      bankrekeningnummer, of is voor het bedrag ter zekerstelling een bankgarantie volgens het model dat als bijlage 2
      bij deze regeling is gevoegd, overgelegd aan de notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011288#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0011288#Artikel9
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011288
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0011288
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0011288
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0011288
        artikel: '9'
    machine_readable:
      definitions:
        ZEKERSTELLING_HOOG_NLG:
          value: 100000000
          description: 100 miljoen gulden — bij aanvraag voor kavel A of B (artikel 2 onder a of b)
        ZEKERSTELLING_LAAG_NLG:
          value: 90000000
          description: 90 miljoen gulden — bij aanvraag uitsluitend voor kavel C t/m E (artikel 2 onder c t/m e)
      execution:
        parameters:
          - name: aanvraag_kavel_a_of_b
            type: boolean
            required: true
            description: >-
              Aanvraag ingediend voor een of meer vergunningen bedoeld in artikel 2 onder a of onder b
              (kavel A of kavel B). Indien true geldt het hogere zekerheidsbedrag (lid 2 en 4).
        output:
          - name: bedrag_ter_zekerstelling_nlg
            type: number
            description: >-
              Bedrag ter zekerstelling in gulden (NLG), bedoeld in artikel 10 eerste lid.
              100 miljoen bij kavel A of B, 90 miljoen bij uitsluitend kavel C t/m E.
        actions:
          - output: bedrag_ter_zekerstelling_nlg
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $aanvraag_kavel_a_of_b
                    value: true
                  then: $ZEKERSTELLING_HOOG_NLG
              default: $ZEKERSTELLING_LAAG_NLG
  - number: '11'
    text: |-
      Na het tijdstip, genoemd in [artikel 8, eerste lid][ref1], wordt de aanvraag niet aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel8
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '8'
  - number: '12'
    text: |-
      Indien niet is voldaan aan de in de [artikelen 4][ref1] of [8][ref2] bedoelde eisen, wordt de aanvraag niet in
      behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel8
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '8'
    machine_readable:
      execution:
        parameters:
          - name: voldoet_aan_artikel4_eisen
            type: boolean
            required: true
            description: >-
              Voldoet de aanvraag aan de eisen van artikel 4 (verzoek per brief om aanvraagdocument,
              juiste adressering, betaling 750 gulden voor aanvraagdocument).
          - name: voldoet_aan_artikel8_eisen
            type: boolean
            required: true
            description: >-
              Voldoet de aanvraag aan de eisen van artikel 8 (tijdige ontvangst uiterlijk 5 juni 2000
              om 14.00 uur, juiste indiening op het voorgeschreven adres).
        output:
          - name: aanvraag_in_behandeling
            type: boolean
            description: Of de aanvraag in behandeling wordt genomen (true = in behandeling)
        actions:
          - output: aanvraag_in_behandeling
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $voldoet_aan_artikel4_eisen
                  value: true
                - operation: EQUALS
                  subject: $voldoet_aan_artikel8_eisen
                  value: true
  - number: '13'
    text: |-
      1 Indien de aanvraag niet voldoet aan de in de [artikel 6][ref1], [7][ref2], [9][ref3] of [10][ref4] gestelde
      eisen, stelt de minister de aanvrager in de gelegenheid het verzuim binnen een week te herstellen.

      2 Indien het verzuim, bedoeld in het eerste lid, binnen de termijn genoemd in het eerste lid, niet is hersteld, of
      de aanvraag na herstel niet voldoet aan de in de [artikel 6][ref5], [7][ref6], [9][ref7] of [10][ref8] gestelde
      eisen, wordt de aanvraag niet in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0011288#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0011288#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0011288#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0011288#Artikel10
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel13
