    machine_readable:
      execution:
        parameters:
          - name: kennisgeving_datum
            type: date
            required: true
            description: >-
              Datum waarop de minister de aanvrager in de gelegenheid stelt het verzuim te herstellen
              (aanvang van de hersteltermijn van één week, bedoeld in lid 1).
          - name: verzuim_hersteld_binnen_termijn
            type: boolean
            required: true
            description: >-
              Of het verzuim binnen de termijn van één week (bedoeld in lid 1) is hersteld.
          - name: aanvraag_voldoet_na_herstel
            type: boolean
            required: true
            description: >-
              Of de aanvraag na herstel voldoet aan de eisen van artikelen 6, 7, 9 of 10
              (lid 2, tweede zinsdeel).
        output:
          - name: herstel_termijn_einddatum
            type: date
            description: >-
              Uiterste datum voor herstel van het verzuim (één week na de kennisgeving, lid 1).
          - name: aanvraag_niet_in_behandeling_na_verzuim
            type: boolean
            description: >-
              Of de aanvraag niet in behandeling wordt genomen wegens niet-hersteld of nog
              steeds niet-voldoend verzuim (lid 2).
        actions:
          - output: herstel_termijn_einddatum
            value:
              operation: DATE_ADD
              date: $kennisgeving_datum
              weeks: 1
          - output: aanvraag_niet_in_behandeling_na_verzuim
            value:
              operation: OR
              conditions:
                - operation: NOT
                  value: $verzuim_hersteld_binnen_termijn
                - operation: NOT
                  value: $aanvraag_voldoet_na_herstel
  - number: '14'
    text: |-
      1 De minister deelt de aanvrager binnen twee weken na de datum, genoemd in [artikel 8, eerste lid][ref1],
      schriftelijk mee of zijn aanvraag in behandeling wordt genomen.

      2 Indien is voldaan aan de in de [artikelen 4][ref2], [6][ref3], [7][ref4], [8][ref5], [9][ref6] en [10][ref7]
      gestelde eisen, wordt de aanvrager getoetst aan de eisen, bedoeld in [artikel 15][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011288#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0011288#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0011288#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0011288#Artikel15
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011288
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0011288
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0011288
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0011288
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0011288
        artikel: '10'
      - id: ref8
        bwb_id: BWBR0011288
        artikel: '15'
    machine_readable:
      execution:
        parameters:
          - name: artikel8_indiening_deadline
            type: date
            required: true
            description: >-
              Datum bedoeld in artikel 8 eerste lid (5 juni 2000, het tijdstip van uiterste ontvangst
              van de aanvraag). Startpunt voor de tweewekentermijn voor de ministeriele mededeling.
          - name: voldoet_aan_alle_formele_eisen
            type: boolean
            required: true
            description: >-
              Of voldaan is aan de eisen van artikelen 4, 6, 7, 8, 9 en 10 (lid 2).
              Bij true wordt de aanvrager getoetst aan artikel 15.
        output:
          - name: mededeling_deadline
            type: date
            description: >-
              Uiterste datum waarop de minister schriftelijk meedeelt of de aanvraag in behandeling
              wordt genomen (twee weken na de datum bedoeld in artikel 8 eerste lid, lid 1).
          - name: toetsing_artikel15_van_toepassing
            type: boolean
            description: >-
              Of de aanvrager wordt getoetst aan de eisen van artikel 15
              (true indien aan alle formele eisen is voldaan, lid 2).
        actions:
          - output: mededeling_deadline
            value:
              operation: DATE_ADD
              date: $artikel8_indiening_deadline
              weeks: 2
          - output: toetsing_artikel15_van_toepassing
            value:
              operation: EQUALS
              subject: $voldoet_aan_alle_formele_eisen
              value: true
  - number: '15'
    text: |-
      1 Een aanvrager moet voldoen aan de eisen, bedoeld in
      [artikel 6, tweede lid, onder a, b en c van het besluit][ref1].

      2 Aan de eisen, bedoeld in het eerste lid, wordt voldaan, indien:

      a. de aanvrager een rechtspersoon is, opgericht in overeenstemming met het recht van een van de lidstaten van de
      Europese Unie of een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, en zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging binnen de Europese Economische Ruimte
      heeft;

      b. wat betreft de financiële positie van de aanvrager:

      1º de aanvrager niet in staat van faillissement verkeert, noch een verzoek tot faillietverklaring van de aanvrager
      is ingediend,

      2º de aanvrager geen surcéance van betaling is verleend, noch ten aanzien van de aanvrager surcéance van betaling
      is aangevraagd,

      3º geen beslag is gelegd op een of meer bedrijfsmiddelen van de aanvrager;

      c. wat betreft de kennis en ervaring van de aanvrager:

      1º de aanvrager aantoonbaar kan beschikken over ervaring met de aanleg van openbare telecommunicatie-
      infrastructuur,

      2º de aanvrager aantoonbaar kan beschikken over ervaring met de instandhouding en exploitatie van openbare
      telecommunicatie-infrastructuur,

      3º de activiteiten die de onder 2° bedoelde ervaring betreffen ten minste een aaneengesloten periode van een jaar
      beslaan en voortduren op de in [artikel 8, eerste lid][ref2], genoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel8
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '8'
    machine_readable:
      execution:
        parameters:
          - name: is_rechtspersoon_eer
            type: boolean
            required: true
            description: >-
              Aanvrager is een rechtspersoon opgericht naar recht van een EER-lidstaat en heeft statutaire zetel,
              hoofdbestuur of hoofdvestiging binnen de EER (lid 2 onder a).
          - name: niet_in_faillissement
            type: boolean
            required: true
            description: >-
              Aanvrager verkeert niet in staat van faillissement en er is geen verzoek tot
              faillietverklaring ingediend (lid 2 onder b, 1°).
          - name: geen_surceance
            type: boolean
            required: true
            description: >-
              Aanvrager heeft geen surceance van betaling en er is geen surceance aangevraagd
              (lid 2 onder b, 2°).
          - name: geen_beslag_bedrijfsmiddelen
            type: boolean
            required: true
            description: >-
              Er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager
              (lid 2 onder b, 3°).
          - name: heeft_ervaring_aanleg_telecom
            type: boolean
            required: true
            description: >-
              Aanvrager kan aantoonbaar beschikken over ervaring met de aanleg van openbare
              telecommunicatie-infrastructuur (lid 2 onder c, 1°).
          - name: heeft_ervaring_instandhouding_exploitatie
            type: boolean
            required: true
            description: >-
              Aanvrager kan aantoonbaar beschikken over ervaring met de instandhouding en exploitatie
              van openbare telecommunicatie-infrastructuur (lid 2 onder c, 2°).
          - name: ervaring_duur_ten_minste_een_jaar
            type: boolean
            required: true
            description: >-
              De activiteiten (instandhouding en exploitatie) beslaan ten minste een aaneengesloten
              periode van een jaar (lid 2 onder c, 3°, eerste zinsdeel).
          - name: ervaring_voortdurend_op_indiening_deadline
            type: boolean
            required: true
            description: >-
              De activiteiten (instandhouding en exploitatie) duren voort op de datum bedoeld in
              artikel 8 eerste lid (5 juni 2000) (lid 2 onder c, 3°, tweede zinsdeel).
        output:
          - name: voldoet_aan_eisen_artikel15
            type: boolean
            description: >-
              Of de aanvrager voldoet aan alle eisen van artikel 15 (rechtspersoon EER,
              financiële positie, kennis en ervaring).
        actions:
          - output: financieel_gezond
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $niet_in_faillissement
                  value: true
                - operation: EQUALS
                  subject: $geen_surceance
                  value: true
                - operation: EQUALS
                  subject: $geen_beslag_bedrijfsmiddelen
                  value: true
          - output: voldoende_kennis_en_ervaring
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $heeft_ervaring_aanleg_telecom
                  value: true
                - operation: EQUALS
                  subject: $heeft_ervaring_instandhouding_exploitatie
                  value: true
                - operation: EQUALS
                  subject: $ervaring_duur_ten_minste_een_jaar
                  value: true
                - operation: EQUALS
                  subject: $ervaring_voortdurend_op_indiening_deadline
                  value: true
          - output: voldoet_aan_eisen_artikel15
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_rechtspersoon_eer
                  value: true
                - operation: EQUALS
                  subject: $financieel_gezond
                  value: true
                - operation: EQUALS
                  subject: $voldoende_kennis_en_ervaring
                  value: true
  - number: '16'
    text: |-
      1 De minister stelt binnen vier weken na de datum, genoemd in [artikel 8, eerste lid][ref1], vast of de aanvrager
      voldoet aan de eisen, bedoeld in [artikel 15][ref2].

      2 Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in [artikel 15][ref3], is voldaan, wijst de minister
      de aanvraag af.

      3 De minister stelt de aanvrager onverwijld schriftelijk op de hoogte van zijn besluit.

      4 De minister betaalt de aanvrager die niet wordt toegelaten tot de veiling, in geval ter voldoening van het bedrag
      ter zekerstelling, een waarborgsom is gestort, deze waarborgsom, vermeerderd met de rente van een éénmaandsdeposito
      van de bank, bedoeld in [artikel 9][ref4] terug, of geeft in geval de aanvrager ter voldoening van het bedrag ter
      zekerstelling een bankgarantie heeft overgelegd, deze bankgarantie terug.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel9
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0011288
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0011288
        artikel: '9'
    machine_readable:
      untranslatables:
        - construct: "vermeerderd met de rente van een éénmaandsdeposito van de bank"
          reason: >-
            Interest rate calculation (éénmaandsdeposito rente) is not available as an
            engine operation. The engine has no INTEREST or RATE_LOOKUP operation.
          suggestion: "Add INTEREST or FINANCIAL_RATE operation to engine"
          legal_text_excerpt: >-
            "deze waarborgsom, vermeerderd met de rente van een éénmaandsdeposito van de bank,
            bedoeld in artikel 9 terug" (lid 4)
          accepted: false
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: artikel8_indiening_deadline
            type: date
            required: true
            description: >-
              Datum bedoeld in artikel 8 eerste lid (5 juni 2000). Startpunt voor de
              vierwekentermijn waarbinnen de minister vaststelt of aan artikel 15 is voldaan (lid 1).
          - name: voldoet_aan_artikel15
            type: boolean
            required: true
            description: >-
              Of de aanvrager voldoet aan de eisen van artikel 15 (rechtspersoon EER,
              financiële positie, kennis en ervaring). Bepaalt toelating tot de veiling (lid 2).
        output:
          - name: vaststelling_deadline
            type: date
            description: >-
              Uiterste datum waarop de minister vaststelt of de aanvrager voldoet aan artikel 15
              (vier weken na de datum bedoeld in artikel 8 eerste lid, lid 1).
          - name: toegelaten_tot_veiling
            type: boolean
            description: >-
              Of de aanvrager wordt toegelaten tot de veiling (true indien voldaan aan artikel 15).
          - name: aanvraag_afgewezen
            type: boolean
            description: >-
              Of de aanvraag is afgewezen wegens niet-voldoen aan artikel 15 (lid 2).
        actions:
          - output: vaststelling_deadline
            value:
              operation: DATE_ADD
              date: $artikel8_indiening_deadline
              weeks: 4
          - output: toegelaten_tot_veiling
            value:
              operation: EQUALS
              subject: $voldoet_aan_artikel15
              value: true
          - output: aanvraag_afgewezen
            value:
              operation: NOT
              value: $voldoet_aan_artikel15
  - number: '17'
    text: |-
      1 De minister stelt vast of op grond van het aantal aanvragen dat is ingediend door de aanvragers die aan de eisen,
      bedoeld in [artikel 15][ref1], voldoen, de voor IMT-2000 beschikbare vergunningen zonder toepassing van een veiling
      kunnen worden verleend.

      2 Indien aan ieder van de aanvragers, bedoeld in het eerste lid, een vergunning kan worden verleend overeenkomstig
      de op grond van [artikel 7, derde lid][ref2], opgegeven voorkeur, vindt veiling niet plaats en wordt aan ieder van
      de aanvragers overeenkomstig de opgegeven voorkeur de betreffende vergunning verleend.

      3 Indien aan een van de aanvragers, bedoeld in het eerste lid, niet overeenkomstig zijn op grond van
      [artikel 7, derde lid][ref3], opgegeven voorkeur een vergunning kan worden verleend, vindt een veiling plaats van
      alle voor IMT-2000 beschikbare vergunningen.

      4 De minister maakt aan eenieder die is toegelaten tot de veiling de identiteit bekend van de overige
      aanvragers die op grond van het derde lid tot de veiling zijn toegelaten, alsmede welke door de Internationale
      Telecommunicatie Unie vastgestelde radio-interfaces de betreffende aanvrager zal gebruiken indien hij een van de
      vergunningen, bedoeld in [artikel 2, onder b tot en met e][ref4], verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011288#Artikel2
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011288
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0011288
        artikel: '2'
    machine_readable:
      execution:
        parameters:
          - name: iedere_aanvrager_voorkeur_honoreerbaar
            type: boolean
            required: true
            description: >-
              Of aan iedere gekwalificeerde aanvrager (die voldoet aan artikel 15) een vergunning kan
              worden verleend overeenkomstig de op grond van artikel 7 derde lid opgegeven voorkeur
              (lid 2 vs lid 3 criterium).
        output:
          - name: veiling_vindt_plaats
            type: boolean
            description: >-
              Of de veiling plaatsvindt (true indien niet aan iedere aanvrager de voorkeur
              kan worden gehonoreerd, lid 3; false indien alle voorkeuren honoreerbaar zijn, lid 2).
        actions:
          - output: veiling_vindt_plaats
            value:
              operation: NOT
              value: $iedere_aanvrager_voorkeur_honoreerbaar
  - number: '18'
    text: |-
      De minister betaalt de aanvragers, bedoeld in [artikel 17, tweede lid][ref1], in geval ter voldoening van
      het bedrag ter zekerstelling een waarborgsom is gestort, deze waarborgsom vermeerderd met de rente van een
      éénmaandsdeposito van de bank, bedoeld in [artikel 9][ref2] terug, of geeft in het geval ter voldoening van het
      bedrag ter zekerstelling een bankgarantie is overgelegd, deze bankgarantie terug.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel9
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0011288
        artikel: '9'
    machine_readable:
      untranslatables:
        - construct: "vermeerderd met de rente van een éénmaandsdeposito van de bank"
          reason: >-
            Interest rate calculation (éénmaandsdeposito rente) is not available
            as an engine operation. The engine has no INTEREST or RATE_LOOKUP operation.
          suggestion: "Add INTEREST or FINANCIAL_RATE operation to engine"
          legal_text_excerpt: >-
            "deze waarborgsom vermeerderd met de rente van een éénmaandsdeposito
            van de bank, bedoeld in artikel 9 terug" (artikel 18)
          accepted: false
      execution:
        parameters:
          - name: waarborgsom_gestort
            type: boolean
            required: true
            description: >-
              Of ter voldoening van het bedrag ter zekerstelling een waarborgsom
              is gestort (true) of een bankgarantie is overgelegd (false).
        output:
          - name: waarborgsom_terug_te_betalen
            type: boolean
            description: >-
              Of de waarborgsom terugbetaald wordt (zonder rente — rente-component
              is untranslatable). Van toepassing bij aanvragers bedoeld in
              artikel 17 tweede lid indien waarborgsom werd gestort.
          - name: bankgarantie_terug_te_geven
            type: boolean
            description: >-
              Of de bankgarantie teruggegeven wordt. Van toepassing bij
              aanvragers bedoeld in artikel 17 tweede lid indien bankgarantie
              werd overgelegd.
        actions:
          - output: waarborgsom_terug_te_betalen
            value:
              operation: EQUALS
              subject: $waarborgsom_gestort
              value: true
          - output: bankgarantie_terug_te_geven
            value:
              operation: NOT
              value: $waarborgsom_gestort
  - number: '19'
    text: Deze regeling treedt in werking met ingang van 12 april 2000.
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraag vergunning voor IMT-2000.'
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel20
