preamble:
  text: |-
    Gelet op de artikelen 4, eerste lid, 6, eerste lid, 8, eerste lid, van het Frequentiebesluit en artikel 5, eerste
    lid, van het Besluit vergoedingen Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Verkeer en Waterstaat;



            b

              *besluit:*


              [Frequentiebesluit][ref1];



            c

              *IMT-2000:*


              International Mobile Telecommunications-2000, de familie van mobiele telecommunicatie-systemen voor de
      derde generatie, met de daarbij behorende radio-interfaces, zoals door de Internationale Telecommunicatie Unie
      (ITU) is vastgesteld op basis van resolutie 212 van de ITU;



            d

              *UMTS:*


              een systeem van de IMT-2000 familie, zoals omschreven in artikel 2 van Beschikking nr. 128/1999/EG van het
      Europees Parlement en de Raad van de Europese Unie van 14 december 1998 betreffende de gecoördineerde invoering van
      de derde generatie van mobiele draadloze communicatiesystemen (UMTS) in de Gemeenschap (PbEG L 17);



            e

              *aanvraag:*


              aanvraag om een vergunning voor IMT-2000;



            f

              *aanvrager:*


              degene die een aanvraag doet;



            g

              *aanvraagdocument:*


              document, bedoeld in [artikel 5, eerste lid, van het besluit][ref2], ten behoeve van IMT-2000;



            h

              *bedrag ter zekerstelling:*


              bedrag, bedoeld in [artikel 10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009997
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel10
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011288
        artikel: '10'
  - number: '2'
    text: |-
      Voor IMT-2000 zijn de volgende vijf vergunningen beschikbaar:

      a. een vergunning volgens het UMTS systeem, met frequentiebereik 1920,3 - 1934,9 MHz, gecombineerd met 2110,3 -
      2124,9 MHz gepaard spectrum en 1914,9 - 1920,3 MHz ongepaard spectrum;

      b. een vergunning volgens een van de IMT-2000 systemen, met frequentiebereik 1934,9 - 1949,7 MHz, gecombineerd met
      2124,9 - 2139,7 MHz gepaard spectrum en 1909,9 - 1914,9 MHz ongepaard spectrum;

      c. een vergunning volgens een van de IMT-2000 systemen, met frequentiebereik 1949,7 - 1959,7 MHz, gecombineerd met
      2139,7 - 2149,7 MHz gepaard spectrum en 1904,9 - 1909,9 MHz ongepaard spectrum;

      d. een vergunning volgens een van de IMT-2000 systemen, met frequentiebereik 1959,7 - 1969,7 MHz, gecombineerd met
      2149,7 - 2159,7 MHz gepaard spectrum en 1899,9 - 1904,9 MHz ongepaard spectrum; en

      e. een vergunning volgens een van de IMT-2000 systemen, met frequentiebereik 1969,7 - 1979,7 MHz, gecombineerd met
      2159,7 - 2169,7 MHz gepaard spectrum en 2019,7 - 2024,7 MHz ongepaard spectrum.
    url: https://wetten.overheid.nl/BWBR0011288/2000-04-12#Artikel2
  - number: '3'
    text: |-
      1 De vergunningen voor IMT-2000 worden verleend door middel van de procedure van veiling.

      2 De radiofrequenties, bedoeld in [artikel 2][ref1], worden ten behoeve van de veiling, bedoeld in het eerste lid,
      verdeeld in de volgende kavels:

      a. de radio-frequenties, bedoeld in [artikel 2, onder a][ref2], in kavel A;

      b. de radio-frequenties, bedoeld in [artikel 2, onder b][ref3], in kavel B;

      c. de radio-frequenties, bedoeld in [artikel 2, onder c][ref4], in kavel C;

      d. de radio-frequenties, bedoeld in [artikel 2, onder d][ref5], in kavel D;

      e. de radio-frequenties, bedoeld in [artikel 2, onder e][ref6], in kavel E.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel2
