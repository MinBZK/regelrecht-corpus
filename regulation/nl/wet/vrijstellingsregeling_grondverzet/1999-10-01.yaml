---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vrijstellingsregeling_grondverzet
regulatory_layer: WET
publication_date: '2007-12-20'
valid_from: '1999-10-01'
bwb_id: BWBR0010715
url: https://wetten.overheid.nl/BWBR0010715/1999-10-01
preamble:
  text: |-
    Gelet op artikel 64 van de Wet bodembescherming;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Op deze regeling zijn de begripsbepalingen van
      [artikel 1 van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '1'
  - number: '1.2'
    text: |-
      In deze regeling wordt verstaan onder:

              a
               Besluit:

                [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1];



              b
              grondwerk:

                werk waarin geen andere bouwstof dan grond is verwerkt, niet zijnde een geluidwal of een windwal;



              c
               licht verontreinigde grond:

                grond waarvan de samenstellingswaarden liggen tussen de samenstellingswaarden voor grond zoals aangegeven
      in de [bijlagen 1][ref2] en [2][ref3] van het Besluit;



              d
               bodemkwaliteitskaart:

                kaart met bijbehorend bodembeheerplan, voor een bepaald gebied, waarin ten behoeve van het gebruik van
      licht verontreinigde grond in dat gebied, de samenstelling van de bodem is weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
      [ref2]: https://wetten.overheid.nl/BWBR0007667
      [ref3]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007667
      - id: ref2
        bwb_id: BWBR0007667
      - id: ref3
        bwb_id: BWBR0007667
  - number: '2'
    text: |-
      Van de volgende artikelen van het Besluit wordt vrijstelling verleend voor het gebruik van licht verontreinigde
      grond in een grondwerk voor zover dit gebruik plaats vindt in een gebied waarvoor een bodemkwaliteitskaart
      overeenkomstig het gestelde in [artikel 5][ref1] is opgesteld en voldaan is aan [artikel 3][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel3
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '3'
  - number: 2.a
    text: |-
      [artikel 6, tweede lid][ref1], en [9, tweede, vierde, vijfde en zesde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '9'
  - number: 2.b
    text: |-
      [artikel 9, negende lid][ref1], voor zover het gegevens met betrekking tot immissiewaarden betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: 2.c
    text: |-
      [artikelen 10 tot en met 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel10
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '10'
  - number: '3'
    text: |-
      Aan de in [artikel 2][ref1] bedoelde vrijstelling zijn de volgende voorwaarden verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0010715#Artikel2
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010715
        artikel: '2'
  - number: 3.a
    text: |-
      de grond die wordt gebruikt is van vergelijkbare kwaliteit als of van betere kwaliteit dan de kwaliteit van de
      bodem ter plaatse, en
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel3
  - number: 3.b
    text: |-
      de eigenaar of erfpachter van de bodem waarop de grond wordt gebruikt, meldt het gebruik van de grond tenminste 5
      werkdagen tevoren aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel3
  - number: '4'
    text: |-
      In afwijking van [artikel 9][ref1] van het Besluit kan de bodemkwaliteitskaart gebruikt worden voor het vaststellen
      van de kwaliteit van de te gebruiken grond indien die grond na afgraving zonder verdere bewerkingen, het uitzeven
      van grove bestanddelen daargelaten, in een grondwerk wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel9
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '9'
  - number: '5.1'
    text: De bodemkwaliteitskaart van een bepaald gebied wordt bij besluit vastgesteld door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid wordt de bodemkwaliteitskaart bij besluit vastgesteld door gedeputeerde staten
      indien een bepaald gebied daartoe in het bij besluit vastgestelde provinciale beleid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: '5.3'
    text: 'De bodemkwaliteitskaart kan slechts worden vastgesteld indien:'
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: 5.3.a
    text: |-
      het gestelde in hoofdstuk 5.3.1 van de beleidsnota ’Grond grondig bekeken, verantwoord omgaan met schone en
      verontreinigde grond’ (publicatie van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      nr. 22669/210) en de daarbij behorende bijlage 1 (publicatie van het Ministerie van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, nr. 17961/190) in acht is genomen;
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: 5.3.b
    text: rekening is gehouden met het geldende provinciale beleid ten aanzien van grondverzet, en
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: 5.3.c
    text: overleg heeft plaatsgevonden met overheden die het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel5
  - number: '6.1'
    text: |-
      De melding, bedoeld in [artikel 3][ref1], geschiedt onder aanduiding van:


      [ref1]: https://wetten.overheid.nl/BWBR0010715#Artikel3
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010715
        artikel: '3'
  - number: 6.1.a
    text: het tijdstip waarop de grond wordt aangebracht;
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: 6.1.b
    text: de plaats waar de grond gebruikt zal worden;
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: 6.1.c
    text: het doel van het grondwerk;
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: 6.1.d
    text: de kwaliteit van de ontvangende bodem, en
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: 6.1.e
    text: de plaats van herkomst, hoeveelheid en kwaliteit van de grond.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: '6.2'
    text: Burgemeester en wethouders kunnen nadere regels geven aan het in het eerste lid genoemde.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel6
  - number: '7.1'
    text: |-
      Een bodemkwaliteitskaart, die door burgemeester en wethouders of gedeputeerde staten voor de datum van
      inwerkingtreding van deze regeling is vastgesteld, wordt tot uiterlijk 1 juli 2001 als een bodemkwaliteitskaart als
      bedoeld in deze regeling aangemerkt, zolang voor dat gebied, waarop de bodemkwaliteitskaart betrekking heeft, geen
      toepassing is gegeven aan [artikel 5, eerste, onderscheidenlijk tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010715#Artikel5
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010715
        artikel: '5'
  - number: '7.2'
    text: |-
      Burgemeester en wethouders, onderscheidenlijk gedeputeerde staten kunnen bij besluit als bedoeld in
      [artikel 5, eerste, onderscheidenlijk tweede lid][ref1], bepalen dat [artikel 5, derde lid, onder a][ref2], op
      betreffende bodemkwaliteitskaart niet van toepassing is, indien het besluit is genomen voor 1 januari 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0010715#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010715#Artikel5
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010715
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010715
        artikel: '5'
  - number: '7.3'
    text: In een geval als bedoeld in het tweede lid is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel7
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 oktober 1999 en werkt terug tot en met 1 juli 1999.
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Vrijstellingsregeling grondverzet.'
    url: https://wetten.overheid.nl/BWBR0010715/1999-10-01#Artikel9
