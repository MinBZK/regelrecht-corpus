$id: wet_regels_integriteit_en_vervolgfuncties_bewindspersonen
regulatory_layer: WET
publication_date: '2025-10-13'
valid_from: '2026-02-20'
bwb_id: BWBR0051611
url: https://wetten.overheid.nl/BWBR0051611/2026-02-20
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is een wettelijke grondslag te creëren voor het vaststellen
    van een gedragscode voor bewindspersonen en regels te stellen die tot doel hebben duidelijkheid over het mogelijke
    loopbaanvervolg van bewindspersonen te bevorderen, alsmede een tweetal wijzigingen in de Wet adviescolleges
    rechtspositie politieke ambtsdragers door te voeren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder: - *adviescollege:* adviescollege rechtspositie politieke
      ambtsdragers als bedoeld in [artikel 1 van Wet adviescollege rechtspositie politieke ambtsdragers][ref1];
        - *dienstverband:* aanstelling, arbeidsovereenkomst of andere titel op grond waarvan tegen betaling opgedragen
      taken worden verricht;
        - *bewindspersoon:* minister of staatssecretaris;
        - *gewezen bewindspersoon:* bewindspersoon aan wie door Ons ontslag is verleend;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *voormalig ministerie:* het ministerie of de ministeries waarvoor de gewezen bewindspersoon binnen de periode van
      twee jaar voor zijn ontslag werkzaamheden heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0045946#Artikel1
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045946
        artikel: '1'
  - number: 1a
    text: |-
      De Minister-President stelt, in overeenstemming met het gevoelen van de ministerraad, een gedragscode voor
      bewindspersonen vast.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel1a
  - number: '2.1'
    text: |-
      Een bewindspersoon of een gewezen bewindspersoon in de periode van twee jaar nadat hem door Ons ontslag is
      verleend, verzoekt het adviescollege gemotiveerd advies uit te brengen over de aanvaardbaarheid van het aangaan van
      een dienstverband.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing indien de bewindspersoon of gewezen bewindspersoon voornemens is een ambt te
      aanvaarden als:
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.a
    text: lid van het Europese Parlement;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.b
    text: lid van de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.c
    text: |-
      lid van een algemeen vertegenwoordigend orgaan als bedoeld in [artikel 4 van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel4
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '4'
  - number: 2.2.d
    text: bewindspersoon;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.e
    text: vice-president, lid, staatsraad of staatsraad in buitengewone dienst van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.f
    text: president, lid of lid in buitengewone dienst van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.g
    text: Nationale ombudsman of substituut-ombudsman;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.h
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.i
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.j
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.k
    text: wethouder; of
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.2.l
    text: voorzitter of lid van het dagelijks bestuur van een waterschap.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.3'
    text: |-
      Uitgaande van de wenselijkheid dat een bewindspersoon of een gewezen bewindspersoon zijn maatschappelijke carrière
      kan voortzetten, brengt het adviescollege een advies uit over de aanvaardbaarheid van een dienstverband als bedoeld
      in het eerste lid, al dan niet onder voorwaarden, gelet op:
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.3.a
    text: |-
      het risico op belangenverstrengeling, waarvan sprake kan zijn indien een bewindspersoon of een gewezen
      bewindspersoon:
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.3.a.i
    text: |-
      gebruik kan maken van inzichten van vertrouwelijke of gevoelige aard in beleid of strategie, waaronder
      onaangekondigd overheidsbeleid of handelsgeheimen van concurrenten, die hij tijdens zijn ambt heeft verkregen en
      daarmee zijn nieuwe werkgever of opdrachtgever een concurrentievoordeel kan opleveren;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.3.a.ii
    text: |-
      in een positie is geweest waarbij een sterk vermoeden kan ontstaan dat zijn vervolgfunctie een beloning is geweest
      voor eerdere gunsten;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.3.b
    text: |-
      het risico op schending van de geheimhoudingsplicht van bewindspersonen, bedoeld in
      [artikel 98 van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 2.3.c
    text: |-
      de bepalingen als bedoeld in de [artikelen 3][ref1] en [4][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0051611#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051611#Artikel4
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0051611
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0051611
        artikel: '4'
  - number: '2.4'
    text: |-
      Advisering door het adviescollege vindt niet plaats dan nadat de bewindspersoon of de gewezen bewindspersoon die om
      een advies als bedoeld in het eerste lid heeft verzocht, in de gelegenheid is gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.5'
    text: |-
      Een advies als bedoeld in het eerste lid wordt door het adviescollege gemotiveerd, waarbij wordt ingegaan op de in
      het derde lid genoemde afwegingen, en behelst of een dienstverband aanvaardbaar, aanvaardbaar onder voorwaarden, of
      niet aanvaardbaar is.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.6'
    text: |-
      Indien het adviescollege voornemens is een advies uit te brengen concluderende dat het dienstverband niet
      aanvaardbaar of slechts onder voorwaarden aanvaardbaar is, brengt het adviescollege de bewindspersoon of de gewezen
      bewindspersoon daarvan op de hoogte en stelt het deze opnieuw in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.7'
    text: Een bewindspersoon informeert Onze Minister-President over het verzoek om een advies als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.8'
    text: |-
      Het adviescollege brengt binnen twee weken na een verzoek om advies als bedoeld in het eerste lid advies uit aan de
      bewindspersoon of de gewezen bewindspersoon die dit verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.9'
    text: 'In afwijking van het achtste lid wordt een advies binnen vier weken uitgebracht, indien:'
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.9.a
    text: de bewindspersoon of de gewezen bewindspersoon wordt gehoord als bedoeld in het vierde of zesde lid;
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.9.b
    text: het adviescollege de bewindspersoon of de gewezen bewindspersoon om additionele informatie verzoekt; of
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.9.c
    text: in overleg met de bewindspersoon of de gewezen bewindspersoon de termijn van twee weken is verlengd.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.10'
    text: |-
      Gedurende een periode van twee jaar nadat hem door Ons ontslag is verleend, wordt de naam van de gewezen
      bewindspersoon en een door hem aanvaard dienstverband op de website van het adviescollege openbaar gemaakt. De
      gewezen bewindspersoon stelt hiertoe binnen twee weken na het aanvaarden van een dienstverband het adviescollege
      daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.11'
    text: |-
      Een advies als bedoeld in het eerste lid wordt binnen twee weken nadat het desbetreffende dienstverband is
      aanvaard, openbaar gemaakt op de website van het adviescollege gedurende een periode van twee jaar.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.12'
    text: Documenten betreffende het verzoek om een advies als bedoeld in het eerste lid zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.13'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met betrekking tot een advies als bedoeld in het eerste lid
      regels gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.13.a
    text: de procedure van het verzoek; en
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: 2.13.b
    text: |-
      de additionele gegevens, naast naam, adres, woonplaats en telefoonnummer, die de bewindspersoon of de gewezen
      bewindspersoon aanlevert.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '2.14'
    text: |-
      Bij algemene maatregel van bestuur worden met betrekking tot de bewaartermijn van de in het kader van een advies
      als bedoeld in het eerste lid aangeleverde gegevens regels gesteld.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel2
  - number: '3.1'
    text: |-
      Een gewezen bewindspersoon gaat binnen twee jaar na zijn ontslag geen dienstverband aan bij zijn voormalig
      ministerie, noch bij een ander ministerie voor zover hij bij beleidsterreinen van dat andere ministerie intensief
      en meer dan incidenteel betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister-President kan ontheffing verlenen van het bepaalde in het eerste lid. Onze Minister doet binnen twee
      weken na verlening van een ontheffing hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister-President verzoekt het adviescollege gemotiveerd advies uit te brengen met betrekking tot de
      wenselijkheid van een ontheffing als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel3
  - number: '3.4'
    text: |-
      Ten aanzien van de adviezen als bedoeld in het derde lid is [artikel 2, elfde tot en met veertiende lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051611#Artikel2
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0051611
        artikel: '2'
  - number: '4.1'
    text: |-
      Een gewezen bewindspersoon heeft binnen twee jaar na zijn ontslag geen zakelijk contact met de ambtenaren die
      onder zijn voormalig ministerie ressorteren, noch met ambtenaren die onder andere ministeries ressorteren over de
      beleidsterreinen waarover de gewezen bewindspersoon voor zijn ontslag intensief en meer dan incidenteel contact
      had.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is niet van toepassing op een gewezen bewindspersoon die een dienstverband aangaat bij een
      rechtspersoon of instelling als bedoeld in [artikel 1.2 van de Wet normering topinkomens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
  - number: '4.3'
    text: |-
      Onze Minister-President kan ontheffing verlenen van het bepaalde in het eerste lid. Onze Minister doet binnen twee
      weken na verlening van een ontheffing hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister-President verzoekt het adviescollege gemotiveerd advies uit te brengen met betrekking tot de
      wenselijkheid en de reikwijdte van een ontheffing als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel4
  - number: '4.5'
    text: |-
      Ten aanzien van de adviezen als bedoeld in het vierde lid is [artikel 2, elfde tot en met veertiende lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051611#Artikel2
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0051611
        artikel: '2'
  - number: '8'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel8
  - number: '9'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel9
  - number: '10'
    text: 'Deze wet wordt aangehaald als: Wet regels integriteit en vervolgfuncties bewindspersonen.'
    url: https://wetten.overheid.nl/BWBR0051611/2026-02-20#Artikel10
