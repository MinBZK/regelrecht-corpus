preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 59, eerste en derde lid, van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             wet:

              [Meststoffenwet][ref1];



            b
             administratie:

              administratie als bedoeld in artikel 2, eerste lid, van de Regeling administratieve verplichtingen
      Meststoffenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2.1'
    text: |-
      Bedrijven waarop herbevolking heeft plaatsgevonden zijn in 1998 vrijgesteld van de heffingen, bedoeld in
      [titel 2][ref1] van [hoofdstuk IV van de wet][ref2], tot een overeenkomstig het derde of vierde lid bepaalde
      belastbare hoeveelheid mineralen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '2.2'
    text: |-
      Onder herbevolking wordt verstaan de opbouw van de varkensstapel van een bedrijf waarop op
      1 januari 1998 een lager aantal varkens werd gehouden dan gebruikelijk, voorzover in verband
      met de varkenspestuitbraken in 1997 en 1998 op enig moment in 1997 of 1998: - voor het gebied
      waarin het bedrijf geheel of gedeeltelijk is gelegen een vervoersverbod voor varkens ingevolge
      [artikel 30, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1] van kracht is geweest, of
        - ten aanzien van het bedrijf een maatregel als bedoeld in
      [artikel 22, eerste lid, onderdeel f, van de Gezondheids- en welzijnswet voor dieren][ref2] is genomen op grond
      waarvan alle op het bedrijf gehouden varkens zijn gedood.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '22'
  - number: '2.3'
    text: |-
      De belastbare hoeveelheid mineralen waarvoor de vrijstelling geldt wordt bepaald door achtereenvolgens:
        - het aantal varkens van de in de onderstaande tabel genoemde diercategorieën, onderscheiden in
      [bijlage A bij de wet][ref1], dat gemiddeld op het bedrijf werd gehouden in de periode van 1 september tot en met
      31 december 1998, te verminderen met het aantal varkens van de desbetreffende diercategorie dat op 1 januari 1998
      op het bedrijf werd gehouden;
        - de uitkomsten te vermenigvuldigen met de voor de desbetreffende diercategorie in de onderstaande tabel aangegeven
      hoeveelheid fosfaat, onderscheidenlijk stikstof, en
        - de aldus berekende hoeveelheden fosfaat, onderscheidenlijk stikstof bij elkaar op te tellen.









