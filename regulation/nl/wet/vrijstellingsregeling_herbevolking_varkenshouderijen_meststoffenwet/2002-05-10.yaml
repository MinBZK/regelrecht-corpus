  - number: '2.4'
    text: |-
      Indien de heffingplichtige aantoont dat op het bedrijf in de periode van 1 september tot en met 31 december 1998
      herbevolking plaatsvond, wordt in afwijking van het derde lid de belastbare hoeveelheid mineralen waarvoor de
      vrijstelling geldt bepaald door achtereenvolgens: - het aantal varkens van de in de in het vorige lid opgenomen
      tabel genoemde diercategorieën, onderscheiden in [bijlage A bij de wet][ref1], dat gemiddeld op het bedrijf werd
      gehouden in één van de door de heffingplichtige aangegeven maanden in de periode van 1 september tot en met 31
      december 1998, te verminderen met het aantal varkens van de desbetreffende diercategorie dat op 1 januari 1998 op
      het bedrijf werd gehouden;
        - de uitkomsten te vermenigvuldigen met de voor de desbetreffende diercategorie in de tabel aangegeven hoeveelheid
      fosfaat, onderscheidenlijk stikstof, en
        - de aldus berekende hoeveelheden fosfaat, onderscheidenlijk stikstof bij elkaar op te tellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2.5'
    text: |-
      Indien in 1998 een overdracht van het bedrijf heeft plaatsgevonden, wordt voor de toepassing van het derde lid,
      ten aanzien van de vervreemder in aanmerking genomen het aantal varkens van de in de in het derde lid opgenomen
      tabel genoemde diercategorieën, onderscheiden in [bijlage A bij de wet][ref1], dat op het moment van overdracht
      op het bedrijf werd gehouden, te verminderen met het aantal varkens van de desbetreffende diercategorie dat op 1
      januari 1998 op het bedrijf werd gehouden, en ten aanzien van de verwerver het aantal varkens van de in de in het
      derde lid opgenomen tabel genoemde diercategorieën, onderscheiden in [bijlage A bij de wet][ref2], dat gemiddeld op
      het bedrijf werd gehouden in de periode van 1 september tot en met 31 december 1998, te verminderen met het aantal
      varkens van de desbetreffende diercategorie dat op het moment van overdracht op het bedrijf werd gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
  - number: '2.6'
    text: |-
      Indien in 1998 een overdracht van het bedrijf heeft plaatsgevonden, is het vierde lid van overeenkomstige
      toepassing op de verwerver van dit bedrijf, met dien verstande dat hierbij in aanmerking wordt genomen het
      aantal varkens van de in de in het derde lid opgenomen tabel genoemde diercategorieën, onderscheiden in
      [bijlage A bij de wet][ref1], dat door de verwerver gemiddeld op het bedrijf werd gehouden in één van de door de
      heem aangegeven maanden in de periode van 1 september tot en met 31 december 1998, te verminderen met het aantal
      varkens van de desbetreffende diercategorie dat op het moment van overdracht op het bedrijf werd gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2.7'
    text: |-
      Indien het bedrijf gelegen is in een gebied waarvoor in verband met de varkenspestuitbraken
      in 1997 en 1998 op enig moment in 1997 of 1998 een fokverbod voor varkens ingevolge
      [artikel 17, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1] van
      kracht is geweest, en ten aanzien van dit bedrijf geen maatregel als bedoeld in
      [artikel 22, eerste lid, onderdeel f, van de Gezondheids- en welzijnswet voor dieren][ref2] is genomen op grond
      waarvan alle op het bedrijf gehouden varkens zijn gedood, worden voor de toepassing van derde en vierde lid de
      varkens van de diercategorie die in de tabel van het derde lid wordt aangeduid met het nummer 401, die werden
      gehouden op 1 januari 1998, aangemerkt als varkens van de diercategorie die in de tabel van het derde lid wordt
      aangeduid met het nummer 400.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '22'
  - number: '3.1'
    text: |-
      Bij de aangifte, bedoeld in [artikel 28 van de wet][ref1], met betrekking tot 1998 wordt door de heffingplichtige
      melding gemaakt van het overeenkomstig [artikel 2, derde of vierde lid][ref2], berekende aantal varkens van de
      onderscheiden diercategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0010268#Artikel2
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0010268
        artikel: '2'
  - number: '3.2'
    text: |-
      De melding geschiedt op het daartoe door de Minister van Landbouw, Natuurbeheer en Visserij vastgestelde formulier,
      dat volledig en naar waarheid is ingevuld en door de heffingplichtige is ondertekend.
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel3
  - number: '3.3'
    text: Bij de melding wordt een afschrift van de administratie met betrekking tot 1998 meegezonden.
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel3
  - number: 3a.1
    text: |-
      Bedrijven waarop herbevolking heeft plaatsgevonden zijn in 1999 vrijgesteld van de heffingen, bedoeld
      in [titel 2][ref1] van [hoofdstuk IV van de wet][ref2], indien na vermindering van de belastbare
      hoeveelheid mineralen, bedoeld in [artikel 24 van de wet][ref3], over het jaar 1998 met de overeenkomstig
      [artikel 2, derde en vierde lid][ref4], bepaalde hoeveelheid mineralen, een hoeveelheid mineralen van minder dan
      nihil resteert, tot een belastbare hoeveelheid mineralen overeenkomend met die resterende hoeveelheid mineralen
      van minder dan nihil, met dien verstande dat de vrijstelling ten hoogste een belastbare hoeveelheid mineralen
      overeenkomend met de overeenkomstig [artikel 2, derde en vierde lid][ref5], bepaalde hoeveelheid mineralen kan
      betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0010268#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0010268#Artikel2
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0010268
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0010268
        artikel: '2'
  - number: 3a.2
    text: |-
      Bij de aangifte, bedoeld in [artikel 28 van de wet][ref1], met betrekking tot 1999 wordt door de heffingplichtige
      melding gemaakt van de belastbare hoeveelheid mineralen waarvoor ingevolge het eerste lid een vrijstelling geldt
      en de wijze waarop de heffingplichtige deze heeft bepaald en wordt een afschrift van de dieradministratie met
      betrekking tot 1998 meegezonden, voor zover de heffingplichtige deze gegevens niet reeds aan het Bureau Heffingen
      heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel28
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '28'
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 2, derde en vierde lid][ref1], wordt uitsluitend in aanmerking genomen het aantal
      varkens van de onderscheiden diercategorieën dat kan worden gestaafd met de gegevens van de administratie en de,
      desgevraagd door de inspecteur van het Bureau Heffingen, door de heffingplichtige overgelegde andere bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0010268#Artikel2
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010268
        artikel: '2'
  - number: '5'
    text: |-
      Voor de toepassing van [artikel 43 van de wet][ref1] wordt dat deel van de belastbare hoeveelheid mineralen
      waarover door toepassing van [artikel 2][ref2] in 1998, of door toepassing van [artikel 3a][ref3] in 1999 geen
      heffing is geheven, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0010268#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010268#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0010268
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010268
        artikel: 3a
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel6
  - number: '7'
    text: |-
      Deze regeling wordt aangehaald als: [Vrijstellingsregeling herbevolking varkenshouderijen Meststoffenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010268
    url: https://wetten.overheid.nl/BWBR0010268/2002-05-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010268
