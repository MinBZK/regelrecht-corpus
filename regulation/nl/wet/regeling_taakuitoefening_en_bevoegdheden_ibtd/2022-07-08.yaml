preamble:
  text: |-
    Gelet op artikel 41c van het Organisatiebesluit Ministerie van Financiën 2020;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *inspecteur-generaal:* inspecteur-generaal belastingen, toeslagen en douane;
        - *inspectie:* de inspectie belastingen, toeslagen en douane, genoemd in
      [hoofdstuk 8a van het Organisatiebesluit Ministerie van Financiën 2020][ref1];
        - *minister:* Minister van Financiën;
        - *ministerie:* Ministerie van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Hoofdstuk8A
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0043027
        hoofdstuk: 8A
  - number: '2'
    text: |-
      1 De inspectie richt haar werkzaamheden in op basis van een werkprogramma, waarin de risicoanalyse, aandachtsvelden
      en, voor zover mogelijk, de geplande onderzoeken, alsmede het voor het volgende kalenderjaar in de rijksbegroting
      vastgestelde budget voor de inspectie zijn opgenomen.

      2 De inspecteur-generaal stelt het werkprogramma vast en biedt het door hem vastgestelde werkprogramma jaarlijks
      vóór 1 november ter goedkeuring aan de minister aan.

      3 De minister biedt het door hem nog goed te keuren werkprogramma onverkort en terstond na ontvangst aan beide
      Kamers der Staten-Generaal aan.

      4 De minister verleent zijn goedkeuring aan het werkprogramma niet eerder dan vier weken nadat het door hem
      aan beide Kamers der Staten-Generaal is aangeboden, maar uiterlijk op 31 december. De minister doet onverwijld
      mededeling van de goedkeuring aan beide Kamers der Staten-Generaal.

      5 De minister onthoudt zijn goedkeuring aan het werkprogramma van de inspectie slechts indien het werkprogramma op
      ondeugdelijke wijze tot stand is gekomen. Indien de minister zijn goedkeuring aan het werkprogramma onthoudt doet
      hij daarvan zo spoedig mogelijk, onder vermelding van zijn overwegingen, mededeling aan beide Kamers der Staten-
      Generaal.

      6 Indien de minister zijn goedkeuring aan het werkprogramma onthoudt, stelt de inspecteur-generaal het
      werkprogramma opnieuw vast met inachtneming van de opmerkingen van de minister over de wijze van totstandkoming
      en het bepaalde in het tweede tot en met het vijfde lid, waarbij de inspecteur-generaal en de minister nadere
      afspraken maken over de in deze leden genoemde data.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel2
  - number: '3'
    text: |-
      1 De inspecteur-generaal informeert de minister over ontwikkelingen die voor hem aanleiding zijn om het
      werkprogramma aan te passen of als er andere aangelegenheden van invloed zijn op de uitvoering van het
      werkprogramma.

      2 De minister kan de inspecteur-generaal verzoeken de inspectie onderzoeken uit te laten voeren die niet zijn
      opgenomen in het door de inspecteur-generaal vastgestelde werkprogramma. Over de budgettaire consequenties van
      dergelijke verzoeken treedt de inspecteur-generaal in overleg met de minister.

      3 Op wijzigingen in het werkprogramma van de inspectie zoals bedoeld in het eerste en tweede lid, is het bepaalde
      in [artikel 2, tweede tot en met het zesde lid][ref1], van overeenkomstige toepassing, waarbij nadere afspraken
      worden gemaakt over de in deze leden genoemde data.


      [ref1]: https://wetten.overheid.nl/BWBR0046866#Artikel2
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046866
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 De inspecteur-generaal stelt een protocol vast waarin de werkwijze van de inspectie bij onderzoeken wordt
      vastgelegd.

      2 Een interviewprotocol maakt onderdeel uit van het onderzoeksprotocol.

      3 Na vaststelling wordt het onderzoeksprotocol openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel4
  - number: '5'
    text: |-
      1 De inspecteur-generaal stelt jaarlijks een verslag op over de wijze waarop in het voorgaande kalenderjaar
      toezicht is gehouden en de resultaten daarvan en biedt het jaarverslag nadat het door hem is vastgesteld aan de
      minister aan.

      2 De minister biedt het vastgestelde jaarverslag onverkort en terstond aan beide Kamers der Staten-Generaal
      aan, inclusief de eventuele reactie van het ministerie op het ontwerp daarvan en eventuele aanpassingen die de
      inspecteur-generaal op basis daarvan heeft doorgevoerd.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel5
  - number: '6'
    text: |-
      1 De inspectie legt bevindingen en daarop gebaseerde conclusies en aanbevelingen vast in een rapport.

      2 De inspecteur-generaal stelt het rapport vast en biedt het rapport aan de minister en eventuele andere
      beleidsinhoudelijk verantwoordelijke ministers aan.

      3 Een wederhoortabel met betrekking tot de bevindingen van de inspectie maakt onderdeel uit van het rapport en
      wordt opgenomen als bijlage bij het rapport.

      4 De minister biedt het rapport onverkort en terstond na ontvangst aan beide Kamers der Staten-Generaal aan.

      5 De minister biedt beide Kamers der Staten-Generaal binnen zes weken na aanbieding van het rapport een
      beleidsreactie op het rapport aan.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel6
  - number: '7'
    text: De inspecteur-generaal is verantwoordelijk voor het met de taken van de inspectie samenhangende communicatiebeleid.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel7
  - number: '8'
    text: |-
      1 De medewerkers van het ministerie zijn verplicht:

      a. de door de inspectie verlangde medewerking te verlenen;

      b. aan de inspectie alle informatie te verstrekken die naar het oordeel van de
      inspectie noodzakelijk is in het kader van de uitoefening van de haar op grond van
      [artikel 41b van het Organisatiebesluit Ministerie van Financiën 2020][ref1] opgedragen taken.

      2 De informatie, bedoeld in onderdeel b van het vorige lid, wordt ontdaan van gegevens waarop van toepassing is:

      a. de geheimhoudingsplicht, bedoeld in [artikel 67, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2];

      b. het beroepsgeheim, bedoeld in artikel 12 van [Verordening (EU) nr. 952/2013](32013R0952) van het Europees
      Parlement en van de Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269)
      en, indien van toepassing, in samenhang met [artikel 1:5 van de Algemene douanewet][ref3];

      c. de geheimhoudingsplicht, bedoeld in [artikel 2:5 van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel25
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel8
    references:
