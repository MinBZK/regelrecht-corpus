  - number: '9'
    text: |-
      1 Indien medewerkers van de inspectie bij de uitoefening van hun taken de beschikking krijgen over gegevens waarvan
      zij het vertrouwelijke karakter kennen of redelijkerwijs moeten vermoeden, zijn zij verplicht tot geheimhouding
      van die gegevens, behoudens in gevallen waarbij zij bij of krachtens enig wettelijk voorschrift tot mededeling
      zijn verplicht.

      2 De geheimhoudingsplicht geldt evenzeer voor personen die in het kader van toezicht of onderzoek aan de
      medewerkingsplicht zijn onderworpen of uit anderen hoofde kennis dragen van feiten of gegevens betreffende toezicht
      of onderzoek door de inspectie.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel9
  - number: '10'
    text: |-
      1 Aan de inspecteur-generaal wordt toestemming verleend om op verzoek vanwege een of beide Kamers der Staten-
      Generaal betreffende het werkterrein van de inspectie met een of beide Kamers der Staten-Generaal in contact te
      treden.

      2 De inspecteur-generaal kan een of beide Kamers der Staten-Generaal in gevallen als bedoeld in het eerste lid
      niet alleen feitelijke informatie verstrekken, maar ook zijn oordelen op basis van door de inspectie afgerond en
      openbaar gemaakt onderzoek bespreken.

      3 De inspecteur-generaal informeert de minister vooraf indien hij in contact zal treden met een of beide Kamers der
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel10
  - number: '11'
    text: |-
      De inspecteur-generaal informeert de minister rechtstreeks over zijn bevindingen, oordelen, adviezen en andere
      relevante gegevens.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel11
  - number: '12'
    text: |-
      1 De minister kan aan de inspecteur-generaal uitsluitend in schriftelijke vorm algemene en bijzondere aanwijzingen
      geven.

      2 Een algemene aanwijzing wordt in de Staatscourant geplaatst.

      3 Een bijzondere aanwijzing wordt door de minister onverwijld aan beide Kamers der Staten-Generaal gezonden.

      4 Een bijzondere aanwijzing ziet niet op:

      a. het weerhouden van de inspectie om een specifiek onderzoek te verrichten of te voltooien;

      b. de wijze waarop de inspectie een specifiek onderzoek verricht;

      c. iedere vorm van bevindingen, oordelen en aanbevelingen van de inspectie.

      5 De inspecteur-generaal informeert de minister in een schriftelijke reactie over de wijze waarop hij opvolging
      geeft aan een aanwijzing als bedoeld in het eerste lid. De minister biedt de reactie van de inspecteur-generaal
      onverkort en terstond na ontvangst aan beide Kamers der Staten Generaal aan.

      6 De bevoegdheid tot het geven van een aanwijzing wordt niet gemandateerd.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel12
  - number: '13'
    text: |-
      1 De inspecteur-generaal is verantwoordelijk voor de bedrijfsvoering van de inspectie.

      2 De werkzaamheden uit het werkprogramma dienen binnen het voor de inspectie opgenomen budget in de rijksbegroting
      voor het ministerie te worden uitgevoerd, tenzij andere afspraken zijn gemaakt met de secretaris-generaal van het
      ministerie.

      3 De inspectie besteedt het beschikbare budget naar eigen inzicht, met inachtneming van de
      [Comptabiliteitswet 2016][ref1], de voor het ministerie geldende interne regelingen en, indien van toepassing,
      specifieke afspraken die daarover door de secretaris-generaal met de inspecteur‑generaal zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2022. Indien de Staatscourant waarin deze regeling wordt
      geplaatst wordt uitgegeven na 1 januari 2022, treedt zij in werking met ingang van de dag na de datum van uitgifte
      van de Staatscourant waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 2022.
    url: https://wetten.overheid.nl/BWBR0046866/2022-07-08#Artikel14
