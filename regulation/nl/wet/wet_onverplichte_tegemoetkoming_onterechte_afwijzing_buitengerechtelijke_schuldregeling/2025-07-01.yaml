  - number: '2'
    text: |-
      1 De ontvanger kent ambtshalve een tegemoetkoming toe aan een belanghebbende namens wie in de periode van 1 januari
      2014 tot en met 31 maart 2021 een MSNP-verzoek is gedaan, dat door de ontvanger is afgewezen vanwege:

      1°. een registratie in de Fraude Signalering Voorziening van de Belastingdienst;

      2°. een kwalificatie opzet of grove schuld;

      3°. een indicatie van fraude; of

      4°. een belastingschuld of toeslagschuld boven een door de ontvanger gehanteerd normbedrag.

      2 De tegemoetkoming bedraagt € 500 per MSNP-verzoek dat door de ontvanger is afgewezen, met dien verstande
      dat opeenvolgende MSNP-verzoeken die binnen een periode van 240 dagen na elkaar worden gedaan, als een verzoek
      worden aangemerkt en die periode steeds aanvangt op de datum waarop de ontvanger het eerst ontvangen MSNP-verzoek
      onterecht heeft afgewezen.

      3 De tegemoetkoming blijft achterwege indien de afwijzing het gevolg is van een opgelegde vergrijpboete, een
      strafrechtelijke veroordeling, fraude met betrekking tot toeslagschulden of indien er naast de grond voor
      afwijzing, bedoeld in het eerste lid, een andere grond voor de afwijzing bestond en de reden voor de afwijzing is
      opgenomen in de afwijzingsbrief.
    url: https://wetten.overheid.nl/BWBR0051149/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Indien na de datum van inwerkingtreding van dit artikel een buitengerechtelijke schuldregeling of de
      schuldsaneringsregeling natuurlijke personen nog niet is afgerond of aanvangt, betaalt de ontvanger op een
      gemotiveerde aanvraag de openstaande bedragen die de belanghebbende na de datum van inwerkingtreding van
      dit artikel dient af te dragen op basis van diens afloscapaciteit ten behoeve van een buitengerechtelijke
      schuldregeling of schuldsaneringsregeling natuurlijke personen.

      2 De aanvraag wordt gedaan door of namens de belanghebbende die in aanmerking komt voor de tegemoetkoming, bedoeld
      in [artikel 2, eerste lid][ref1].

      3 Het eerste lid vindt geen toepassing indien:

      a. namens de belanghebbende is verzocht om een heroverweging van de afwijzing, bedoeld in
      [artikel 2, eerste lid][ref2], en die afwijzing bij de heroverweging heeft standgehouden ingevolge een grond voor
      afwijzing die niet is genoemd in artikel 2, eerste lid, en de reden voor de afwijzing is opgenomen in de tweede
      afwijzingsbrief;

      b. namens de belanghebbende op een later moment een nieuw MSNP-verzoek is gedaan en dit verzoek is afgewezen,
      waarbij een grond voor afwijzing is aangevoerd die niet is genoemd in [artikel 2, eerste lid][ref3], en deze grond
      is opgenomen in de tweede afwijzingsbrief;

      c. naar aanleiding van de beslissing van de ontvanger om geen medewerking te verlenen aan een buitengerechtelijke
      schuldregeling de belanghebbende aan de rechtbank het verzoek heeft gedaan om de ontvanger te bevelen in te stemmen
      met de aangeboden schuldregeling en de rechtbank dit verzoek heeft afgewezen op basis van een andere grond dan
      genoemd in [artikel 2, eerste lid][ref4]; of

      d. tussen de onterechte afwijzingsbrief en de datum van inwerkingtreding van dit artikel een buitengerechtelijke
      schuldregeling of de schuldsaneringsregeling natuurlijke personen is aangevangen en vervolgens voor de datum van
      inwerkingtreding van dit artikel is beëindigd.

      4 De ontvanger betaalt de bedragen op grond van [artikel 30 van Boek 6 van het Burgerlijk Wetboek][ref5] uit aan:

      a. de schuldhulpverlener die namens de belanghebbende de buitengerechtelijke schuldregeling heeft aangeboden;

      b. de bewindvoerder die namens de belanghebbende het gerechtelijk akkoord in het kader van een
      schuldsaneringsregeling natuurlijke personen heeft aangeboden; of

      c. de kredietverstrekker die een saneringskrediet ter beschikking heeft gesteld voor de buitengerechtelijke
      schuldregeling.


