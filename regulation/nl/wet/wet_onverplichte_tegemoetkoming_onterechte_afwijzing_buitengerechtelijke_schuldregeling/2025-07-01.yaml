  - number: '5'
    text: |-
      1 De ontvanger verleent ambtshalve kwijtschelding van het op de datum van inwerkingtreding van deze wet openstaande
      bedrag van een belastingaanslag van de belastingschuldige die in aanmerking komt voor een tegemoetkoming
      als bedoeld in [artikel 2, eerste lid][ref1], en ten aanzien van wie tussen de dagtekening van de onterechte
      afwijzingsbrief en datum van inwerkingtreding van deze wet:

      a. geen buitengerechtelijke schuldregeling tot stand is gekomen of niet de schuldsaneringsregeling natuurlijke
      personen, bedoeld in [titel III van de Faillissementswet][ref2], is aangevangen; of

      b. een buitengerechtelijke schuldregeling of de schuldsaneringsregeling natuurlijke personen, bedoeld in
      [titel III van de Faillissementswet][ref3], is aangevangen die niet voor de datum van inwerkingtreding van deze wet
      is afgerond.

      2 Het eerste lid vindt geen toepassing indien:

      a. namens de belanghebbende is verzocht om een heroverweging van de afwijzing, bedoeld in
      [artikel 2, eerste lid][ref4], en die afwijzing bij de heroverweging heeft standgehouden ingevolge een grond voor
      afwijzing die niet is genoemd in artikel 2, eerste lid, en de reden voor de afwijzing is opgenomen in de tweede
      afwijzingsbrief;

      b. namens de belanghebbende op een later moment een nieuw MSNP-verzoek is gedaan en dit verzoek is afgewezen,
      waarbij een grond voor afwijzing is aangevoerd die niet is genoemd in [artikel 2, eerste lid][ref5], en deze grond
      is opgenomen in de tweede afwijzingsbrief; of

      c. naar aanleiding van de beslissing van de ontvanger om geen medewerking te verlenen aan een buitengerechtelijke
      schuldregeling de belanghebbende aan de rechtbank het verzoek heeft gedaan om de ontvanger te bevelen in te stemmen
      met de aangeboden schuldregeling en de rechtbank dit verzoek heeft afgewezen op basis van een andere grond dan
      genoemd in [artikel 2, eerste lid][ref6].

      3 Het eerste lid is van overeenkomstige toepassing op belastingaanslagen die niet voor de datum van
      inwerkingtreding van deze wet bekend zijn gemaakt en betrekking hebben op een tijdvak dat is geëindigd, dan wel
      zien op een tijdvak dat is aangevangen, voor de datum van inwerkingtreding van deze wet.

      4 De ontvanger verleent de belanghebbende die op grond van [artikel 49 van de Invorderingswet 1990][ref7]
      aansprakelijk is gesteld voor rijksbelastingen of voor andere bedragen, als bedoeld in het eerste en derde lid,
      ontslag van de verplichting tot betaling van die belastingen of bedragen.

      5 In afwijking van het eerste en derde lid verleent de ontvanger kwijtschelding van een voorlopige aanslag nadat de
      aanslag over hetzelfde tijdvak is opgelegd en bekendgemaakt.


