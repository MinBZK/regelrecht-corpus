  - number: '11'
    text: |-
      1 De uitbetaling van de tegemoetkoming, bedoeld in [artikel 2, eerste lid][ref1], of het bedrag gelijk aan
      de betaalde en verrekende bedragen, bedoeld in [artikel 4][ref2], vindt plaats aan de belanghebbende, de
      persoon, bedoeld in [artikel 6][ref3], of de nabestaande op een daartoe door die belanghebbende, die persoon,
      onderscheidenlijk die nabestaande, bestemde bankrekening die op diens naam staat, binnen zes weken nadat de
      tegemoetkoming, onderscheidenlijk het bedrag gelijk aan de betaalde en verrekende bedragen, is toegekend en nadat
      het bankrekeningnummer van de belanghebbende, de persoon, onderscheidenlijk de nabestaande, bij de ontvanger bekend
      is geworden. Indien de nabestaande minderjarig is, vindt de uitbetaling plaats op een bankrekening die daartoe
      is bestemd door diens wettelijke vertegenwoordiger, die op naam staat van de nabestaande en door of namens de
      nabestaande bij de ontvanger is opgegeven.

      2 Het bedrag gelijk aan de afloscapaciteit, bedoeld in [artikel 3, eerste lid][ref4], wordt uitbetaald op het
      opgegeven bankrekeningnummer van de schuldhulpverlener, bewindvoerder of kredietverstrekker binnen zes weken nadat
      de ontvanger de aanvraag hiertoe heeft toegekend en de schuldhulpverlener, de bewindvoerder, onderscheidenlijk de
      kredietverstrekker, zijn bankrekeningnummer heeft opgegeven bij de ontvanger.

      3 Bij de uitbetaling van de tegemoetkoming, bedoeld in [artikel 2, eerste lid][ref5], het bedrag gelijk aan de
      afloscapaciteit, bedoeld in [artikel 3, eerste lid][ref6], en het bedrag gelijk aan de betaalde en verrekende
      bedragen, bedoeld in [artikel 4][ref7], door de ontvanger is [artikel 24 van de Invorderingswet 1990][ref8] niet
      van overeenkomstige toepassing.


