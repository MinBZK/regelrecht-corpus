  - number: '7'
    text: |-
      1 De ontvanger kent de tegemoetkoming, bedoeld in [artikel 2, eerste lid][ref1], ambtshalve toe aan de
      nabestaanden, indien de belanghebbende, bedoeld in artikel 2, eerste lid, is overleden voordat de tegemoetkoming
      waarop deze overledene recht zou hebben bij leven aan hem is toegekend.

      2 Indien meerdere kinderen op grond van het eerste lid aanspraak maken op de tegemoetkoming, wordt het bedrag
      verdeeld naar evenredigheid van het aantal kinderen dat in aanmerking komt voor die tegemoetkoming.

      3 Nabestaanden die niet bekend zijn bij de ontvanger kunnen een gemotiveerde aanvraag doen tot toekenning van de
      tegemoetkoming.

      4 Bij de toepassing van het derde lid is de hoogte van de tegemoetkoming gelijk aan het bedrag dat aan een andere
      nabestaande van de overledene op grond van het eerste lid of derde lid is toegekend. Indien bij toepassing van
      het derde lid nog geen tegemoetkoming is uitgekeerd aan een andere nabestaande van de overledene op grond van
      het eerste of derde lid, wordt het bedrag van de tegemoetkoming naar evenredigheid verdeeld over de nabestaanden
      die op grond van het eerste lid in aanmerking komen en waarbij de tegemoetkoming nog niet aan die nabestaanden
      is toegekend en de nabestaanden die op grond van het derde lid een aanvraag tot toekenning van de tegemoetkoming
      hebben gedaan en de ontvanger op die verzoeken nog geen besluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0051149#Artikel2
