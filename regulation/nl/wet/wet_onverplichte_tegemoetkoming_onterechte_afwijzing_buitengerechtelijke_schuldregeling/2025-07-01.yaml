  - number: '10'
    text: |-
      Op een aanvraag als bedoeld in de [artikelen 3, eerste lid][ref1], [6][ref2], en [7, derde lid][ref3], besluit de
      ontvanger binnen een termijn van zes weken na ontvangst van die aanvraag. Deze termijn kan eenmaal met maximaal zes
      weken worden verlengd.


