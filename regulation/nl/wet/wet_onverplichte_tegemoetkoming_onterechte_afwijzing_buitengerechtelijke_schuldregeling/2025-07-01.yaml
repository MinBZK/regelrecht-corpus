preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is aan personen van wie een verzoek tot medewerking
    aan een buitengerechtelijke schuldregeling of stabilisatieverzoek in voorbereiding op een buitengerechtelijke
    schuldregeling onterecht is afgewezen, een onverplichte tegemoetkoming kan worden toegekend waarmee recht wordt
    gedaan aan het leed dat deze personen hebben ervaren door een fout van de Belastingdienst;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051149/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *afloscapaciteit:* het bedrag dat de belanghebbende beschikbaar dient te stellen voor de aflossing van zijn
      schulden in het kader van een buitengerechtelijke schuldregeling of schuldsaneringsregeling natuurlijke personen
      waarbij dit bedrag wordt vastgesteld aan de hand van het vrij te laten bedrag, het aanwezige vermogen en de te
      verwachte baten;
        - *afwijzingsbrief:* de brief waarin de ontvanger, al dan niet namens de Dienst Toeslagen, meedeelt dat een MSNP-
      verzoek wordt afgewezen;
        - *buitengerechtelijke schuldregeling:* een schuldregeling waarbij schuldeisers op basis van een buitengerechtelijk
      akkoord finale kwijting verlenen jegens de belanghebbende, nadat de belanghebbende de op hem rustende
      verplichtingen die voortvloeien uit de schuldregelingsovereenkomst is nagekomen;
        - *Dienst Toeslagen:* de Dienst Toeslagen, bedoeld in
      [artikel 11, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1];
        - *MSNP-verzoek:* een verzoek dat door de schuldhulpverlener namens de belanghebbende na ondertekening van de
      schuldregelingsovereenkomst aan de ontvanger wordt gedaan met als doel een buitengerechtelijke schuldregeling tot
      stand te laten komen, alsmede een stabilisatieverzoek dat door de ontvanger is behandeld als voornoemd verzoek;
        - *nabestaande:* a. de partner, bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref2], van
      de belanghebbende op het moment dat die belanghebbende is komen te overlijden; b. bij ontstentenis van de onder a
      bedoelde persoon, het kind, zijnde bloedverwant of aanverwant in de neergaande lijn van de belanghebbende;
        - *onterechte afwijzingsbrief:* de brief waarin de ontvanger, al dan niet namens de Dienst Toeslagen, meedeelt
      dat een MSNP-verzoek is afgewezen op grond van een registratie in de Fraude Signalering Voorziening van de
      Belastingdienst, een kwalificatie opzet of grove schuld, een indicatie van fraude of een belastingschuld of
      toeslagschuld boven een door de ontvanger gehanteerd normbedrag en hiernaast in de brief geen andere grond voor
      afwijzing is aangevoerd;
        - *ontvanger:* de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref3];
        - *Onze Minister:* Onze Minister van Financiën;
        - *schuldhulpverlener:* een persoon of instelling als bedoeld in
      [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref4], die namens de belanghebbende een
      buitengerechtelijke schuldregeling uitvoert;
        - *schuldsaneringsregeling natuurlijke personen:* de schuldsaneringsregeling natuurlijke personen, bedoeld in
      [titel III van de Faillissementswet][ref5];
        - *stabilisatieverzoek:* een verzoek van een schuldhulpverlener namens de belanghebbende aan een schuldeiser
      om gedurende een periode van maximaal 240 dagen geen dwanginvorderingsmaatregelen te treffen ter zake van een
      openstaande schuld van de belanghebbende teneinde de belanghebbende in de gelegenheid te stellen om een stabiele
      situatie met betrekking tot zijn inkomsten en uitgaven te bereiken.


