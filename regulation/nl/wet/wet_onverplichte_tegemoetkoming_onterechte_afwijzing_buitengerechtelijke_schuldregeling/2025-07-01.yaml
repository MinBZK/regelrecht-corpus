  - number: '4'
    text: |-
      1 De ontvanger betaalt ambtshalve het bedrag gelijk aan de bedragen die zien op belastingschulden of
      toeslagschulden die betrekking hebben op een tijdvak gelegen voor de dagtekening van de onterechte afwijzingsbrief
      of een tijdvak dat liep ten tijde van de dagtekening van de onterechte afwijzingsbrief en die zijn voldaan of
      verrekend, met inbegrip van de met de schuld samenhangende betaalde renten en kosten van invordering, in de
      periode tussen de dagtekening van de onterechte afwijzingsbrief en de datum van inwerkingtreding van deze wet aan
      de belanghebbende die in aanmerking komt voor een tegemoetkoming als bedoeld in [artikel 2, eerste lid][ref1], en
      waarbij tussen de dagtekening van de onterechte afwijzingsbrief en de datum van inwerkingtreding van deze wet:

      a. geen buitengerechtelijke schuldregeling of geen schuldsaneringsregeling natuurlijke personen is aangevangen; of

      b. een buitengerechtelijke schuldregeling of een schuldsaneringsregeling natuurlijke personen is aangevangen die
      niet voor de datum van inwerkingtreding van deze wet is afgerond.

      2 Het eerste lid vindt geen toepassing indien:

      a. namens de belanghebbende is verzocht om een heroverweging van de afwijzing, bedoeld in
      [artikel 2, eerste lid][ref2], en die afwijzing bij de heroverweging heeft standgehouden ingevolge een grond voor
      afwijzing die niet is genoemd in artikel 2, eerste lid, en de reden voor de afwijzing is opgenomen in de tweede
      afwijzingsbrief;

      b. namens de belanghebbende op een later moment een nieuw MSNP-verzoek is gedaan en dit verzoek is afgewezen,
      waarbij een grond voor afwijzing is aangevoerd die niet is genoemd in [artikel 2, eerste lid][ref3], en deze grond
      is opgenomen in de tweede afwijzingsbrief; of

      c. naar aanleiding van de beslissing van de ontvanger om geen medewerking te verlenen aan een buitengerechtelijke
      schuldregeling de belanghebbende aan de rechtbank het verzoek heeft gedaan om de ontvanger te bevelen in te stemmen
      met de aangeboden schuldregeling en de rechtbank dit verzoek heeft afgewezen op basis van een andere grond dan
      genoemd in [artikel 2, eerste lid][ref4].

      3 Het bedrag gelijk aan de betaalde en verrekende bedragen wordt verminderd met het bedrag dat aan de
      belanghebbende reeds op grond van [artikel 3.13 van de Wet hersteloperatie toeslagen][ref5] is toegekend vanwege
      betalingen die zien op belastingschulden of toeslagschulden die betrekking hebben op een tijdvak gelegen voor
      de dagtekening van de onterechte afwijzingsbrief of een tijdvak dat liep ten tijde van de dagtekening van de
      onterechte afwijzingsbrief en hebben plaatsgevonden na de dagtekening van de onterechte afwijzingsbrief.


