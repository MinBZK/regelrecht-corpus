  - number: '12'
    text: |-
      1 Indien noodzakelijk voor de uitvoering van [artikel 2][ref1] kan de ontvanger persoonsgegevens van
      strafrechtelijke aard verwerken.

      2 Voor de verwerking van gegevens van strafrechtelijke aard worden praktische handleidingen en werkinstructies
      opgesteld om te borgen dat de persoonlijke levenssfeer van de belanghebbende niet onevenredig wordt geschaad.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de verwerking van
      persoonsgegevens van strafrechtelijke aard ter bescherming van de rechten en vrijheden van de belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0051149#Artikel2
