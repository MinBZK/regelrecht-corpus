  - number: '6'
    text: |-
      De persoon die samen met de belanghebbende die in aanmerking komt dan wel in aanmerking zou zijn gekomen
      indien deze belanghebbende niet was overleden voor de toekenning van de tegemoetkoming, bedoeld in
      [artikel 2, eerste lid][ref1], heeft gepoogd tot een buitengerechtelijke schuldregeling te komen voor al hun
      beider schulden door gezamenlijk een MSNP-verzoek te doen en er tussen deze persoon en de belanghebbende sprake is
      geweest van een gemeenschap van goederen als bedoeld in [artikel 94 van Boek 1 van het Burgerlijk Wetboek][ref2]
      ten tijde van het doen van het MSNP-verzoek komt op aanvraag in aanmerking voor de tegemoetkoming, bedoeld
      in artikel 2, eerste lid, het bedrag gelijk aan de afloscapaciteit, bedoeld in [artikel 3, eerste lid][ref3],
      het bedrag gelijk aan de betaalde en verrekende bedragen, bedoeld in [artikel 4][ref4], de kwijtschelding
      van belastingschulden, bedoeld in [artikel 5][ref5] en de kwijtschelding van toeslagschulden, bedoeld in
      [artikel 31ter van de Algemene wet inkomensafhankelijke regelingen][ref6], indien die persoon niet zelf een
      afwijzing heeft ontvangen als bedoeld in artikel 2, eerste lid.


