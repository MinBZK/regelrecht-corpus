  - number: '8'
    text: |-
      1 De tegemoetkoming, bedoeld in [artikel 2, eerste lid][ref1], het bedrag gelijk aan de afloscapaciteit,
      bedoeld in [artikel 3, eerste lid][ref2], het bedrag gelijk aan de betaalde en verrekende bedragen, bedoeld in
      [artikel 4][ref3], en de kwijtschelding van belastingschulden, bedoeld in [artikel 5][ref4] worden vastgesteld bij
      voor bezwaar vatbare beschikking als bedoeld in [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref5].

      2 Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake de in het eerste lid bedoelde beschikking is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref6] van overeenkomstige toepassing.


