preamble:
  text: |-
    In overeenstemming met de Minister van Binnenlandse Zaken en Koninkrijksrelaties en de Minister van Defensie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 DSI: de Dienst Speciale Interventies van het Korps landelijke politiediensten, zijnde de eigenstandige
      organisatie van de DSI met daarbij inbegrepen de eenheden die onder operationele aansturing van de DSI kunnen
      worden ingezet;

      2 UIM: Unit Interventie Mariniers, zijnde de interventie-eenheid van het Korps Mariniers.
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel1
  - number: '2'
    text: |-
      Er is een Beleidsteam voor de advisering en ondersteuning van de Minister van Justitie bij de inzet van de DSI,
      zoals bedoeld in [artikel 3 lid 1 a t/m c][ref1], hierna te noemen het Beleidsteam.


      [ref1]: https://wetten.overheid.nl/BWBR0020015#Artikel3
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020015
        artikel: '3'
  - number: '3'
    text: |-
      1 Het Beleidsteam adviseert en ondersteunt de Minister van Justitie bij de inzet van de DSI, in die situaties
      waarin:

      a. de UIM op basis van de criteria de aangewezen eenheid is om te worden ingezet, of

      b. zich meerdere incidenten op verschillende locaties tegelijkertijd voordoen waartussen vermoedelijk een verband
      bestaat, of

      c. op enige andere wijze een nationaal belang in het geding is.

      2 De advisering en ondersteuning heeft betrekking op het plan van inzet van de DSI en de voorwaarden en kaders
      waarbinnen de inzet plaats dient te vinden.
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel3
  - number: '4'
    text: |-
      1 De voorzitter van het Beleidsteam is de Nationaal Coördinator Terrorismebestrijding. Het Beleidsteam is voorts
      samengesteld uit:

      a. De Korpschef van het Korps landelijke politiediensten;

      b. de Voorzitter van het College van procureurs-generaal.

      2 In het geval inzet van de UIM aan de orde is maakt de Directeur juridische zaken van het ministerie van Defensie
      deel uit van het beleidsteam.

      3 Het Beleidsteam kan zich laten adviseren door adviseurs.

      4 In het geval de leden van het Beleidsteam om zwaarwegende redenen niet aanwezig kunnen zijn, kunnen zij zich
      laten vertegenwoordigen.

      5 Het secretariaat van de commissie berust bij de Nationaal Coördinator Terrorismebestrijding.
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel4
  - number: '5'
    text: |-
      1 De confidentiële regeling van de Minister van Justitie (nr. R45/99 d.d. 6 juni 2005) houdende instelling van de
      Begeleidingscommissie ten behoeve van de bijzondere bijstandseenheden (BELCOM-BBE) wordt met inwerkingtreding van
      dit besluit ingetrokken.

      2 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Instellingsregeling Beleidsteam DSI.'
    url: https://wetten.overheid.nl/BWBR0020015/2006-07-01#Artikel6
