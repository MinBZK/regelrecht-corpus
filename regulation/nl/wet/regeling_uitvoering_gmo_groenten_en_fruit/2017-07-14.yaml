  - number: 170.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 170.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel170
  - number: '171.1'
    text: |-
      Bij de indiening van het operationeel programma verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten als bedoeld in deze afdeling aan de minister een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.1.a
    text: onderwerp(en) en leerdoel(en) van de bijeenkomst;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.1.b
    text: het programma met een specificatie van de onderdelen en gehanteerde werkvormen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.1.c
    text: aantal bijeenkomsten met vermelding van de data en de duur per bijeenkomst, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.1.d
    text: de kosten van de bijeenkomst.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: '171.2'
    text: |-
      Bij de indiening van de steunaanvraag verstrekt de producentenorganisatie in geval van educatieve bijeenkomsten als
      bedoeld in deze afdeling aan de minister:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.2.a
    text: een deelnemerslijst, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: 171.2.b
    text: een aanwezigheidsregistratie per bijeenkomst per deelnemer voorzien van een handtekening van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: '171.3'
    text: |-
      Uitsluitend leden, medewerkers van leden en medewerkers van de producentenorganisatie, waaronder medewerkers van
      dochterondernemingen en kleindochterondernemingen van de producentenorganisatie, kunnen deelnemen aan educatieve
      bijeenkomsten als bedoeld in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: '171.4'
    text: |-
      In het kader van uitgaven voor educatieve bijeenkomsten als bedoeld in deze afdeling zijn uitsluitend de door de
      organisatie van de educatieve bijeenkomst in rekening gebrachte kosten voor deelname van de personen, bedoeld in
      het derde lid, subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel171
  - number: '172.1'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur
      van de producentenorganisatie door professionalisering van de producentenorganisatie richting de markt
      zijn subsidiabel, indien het gaat om de kosten van opleidingen voor personeel voor activiteiten van de
      producentenorganisatie op het gebied van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: 172.1.a
    text: afzet;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: 172.1.b
    text: logistiek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: 172.1.c
    text: kwaliteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: 172.1.d
    text: milieubescherming, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: 172.1.e
    text: teelttechniek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: '172.2'
    text: |-
      Uitgaven voor opleiding en advies ten behoeve van het verwerven van algemene kennis en vaardigheden zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel172
  - number: '173.1'
    text: |-
      Uitgaven voor activiteiten ten behoeve van versterking van de interne structuur van de producentenorganisatie
      door professionalisering richting de markt zijn subsidiabel, indien het gaat om de kosten van inhuur van externe
      deskundigen voor activiteiten van de producentenorganisatie op het gebied van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: 173.1.a
    text: afzet;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: 173.1.b
    text: logistiek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: 173.1.c
    text: kwaliteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: 173.1.d
    text: milieubescherming, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: 173.1.e
    text: teelttechniek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: '173.2'
    text: Uitgaven als bedoeld in het eerste lid, onderdeel e, zijn voor maximaal 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel173
  - number: '174.1'
    text: |-
      Bij de uitgaven voor advies en begeleiding ten behoeve van de teelttechniek, bedoeld in
      [artikel 173, eerste lid, onderdeel e][ref1], stellen voorlichters jaarlijks per deelnemend lid van de
      producentenorganisatie, met gebruikmaking van een door de minister beschikbaar gesteld middel, evaluatierapporten
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel173
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '173'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '4'
  - number: '174.2'
    text: 'De evaluatierapporten, bedoeld in het eerste lid, bevatten:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: 174.2.a
    text: een samenvatting van de concreet gegeven adviezen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: 174.2.b
    text: de beoogde effecten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: 174.2.c
    text: |-
      de resultaten met betrekking tot de onderdelen kwaliteitsverbetering en milieureducties op het gebied van
      gewasbeschermingsmiddelen, mineralen en energie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: '174.3'
    text: |-
      Bij de indiening van de steunaanvraag zendt de producentenorganisatie op verzoek van de minister een selectie van
      de evaluatierapporten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: '174.4'
    text: De evaluatierapporten van elk deelnemend lid zijn opgenomen in de administratie van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel174
  - number: '175'
    text: |-
      Bij de indiening van de steunaanvraag verstrekt de producentenorganisatie in geval van de uitgaven voor advies en
      begeleiding ten behoeve van de teelttechniek, bedoeld in [artikel 173, eerste lid, onderdeel e][ref1], per lid per
      gewas, met gebruikmaking van een door de minister beschikbaar gesteld middel, aan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel173
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '173'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '4'
  - number: 175.a
    text: de naam en het aanvoernummer of lidnummer;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.b
    text: de naam van de voorlichter;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.c
    text: het soort gewas;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.d
    text: het areaal;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.e
    text: 'conform de overeenkomst tussen producentenorganisatie en voorlichter:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.e.1
    text: het aantal bezoeken;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.e.2
    text: de gemiddelde duur per bezoek in uren, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.e.3
    text: het totaalbedrag per lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.f
    text: het extra aantal bezoeken;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.g
    text: het totaalbedrag van de extra in rekening gebrachte kosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: 175.h
    text: het subsidiabele percentage.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel175
  - number: '176'
    text: |-
      Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in geval van biologische
      productie zijn subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a
    text: 'het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.1
    text: biologische teelt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.2
    text: bodemvruchtbaarheid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.3
    text: biologische bemesting;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.4
    text: compostering;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.5
    text: vruchtwisseling;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.6
    text: rassenkeuze;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.7
    text: biologische bestrijding en biologisch evenwicht, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.a.8
    text: biologische teelttechniek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.b
    text: voldaan is aan de bepalingen opgenomen in verordening 834/2007, en verordening 889/2008, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: 176.c
    text: |-
      deelnemende leden van de producentenorganisatie beschikken over een geldig Skal certificaat of een bevestiging van
      Stichting Skal dat het bedrijf van het lid in omschakeling is naar biologische productie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel176
  - number: '177.1'
    text: |-
      Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in het geval van
      geïntegreerde plaagbestrijding zijn subsidiabel als het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.1.a
    text: biologische of geïntegreerde bestrijding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.1.b
    text: geleide bestrijding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.1.c
    text: |-
      het voorkomen van ziekten en plagen met inbegrip van gewas-, water- of bodemanalyses gericht op het vaststellen van
      ziekten en plagen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: '177.2'
    text: |-
      Bij de indiening van de steunaanvraag verstrekt de producentenorganisatie in geval van de uitgaven, bedoeld in het
      eerste lid, onderdeel c, per soort analyse, met gebruikmaking van een door de minister beschikbaar gesteld middel,
      aan de minister:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.a
    text: de soort en naam van de analyse;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.b
    text: de naam van de leverancier;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.c
    text: het aantal deelnemende telers;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.d
    text: het aantal van de analyses;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.e
    text: een tarief voor de analyse, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: 177.2.f
    text: het totaalbedrag per analyse.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel177
  - number: '178.1'
    text: |-
      Uitgaven van de producentenorganisatie voor algemeen advies en begeleiding ten behoeve van de teelt in het geval
      van geïntegreerde productie die mede het kwaliteit en milieu betreffen zijn voor 50% subsidiabel indien het onder
      meer gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.a
    text: gewasbeoordeling;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.b
    text: gewasbescherming;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.c
    text: watermanagement;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.d
    text: bemesting en reduceren mineralengebruik;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.e
    text: klimaataansturing, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: 178.1.f
    text: energiereductie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: '178.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid die betrekking hebben op de begeleiding van het trekken van witlofpennen
      zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel178
  - number: '179'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder vi, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 179.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 179.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel179
  - number: '180'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel180
  - number: 180.a
    text: |-
      *incidentele crisis:* een crisis veroorzaakt door een aanwijsbaar incident dat een belangrijke invloed heeft op de
      prijsvorming gedurende een kortere periode en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel180
  - number: 180.b
    text: '*structurele crisis:* een crisis met een langdurige periode van lage prijzen, die onder de kostprijs liggen.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel180
  - number: '181.1'
    text: |-
      In geval van een structurele crisis zijn de uitgaven, bedoeld in deze afdeling, uitsluitend subsidiabel als de
      acties het effect op korte en lange termijn kunnen sorteren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: '181.2'
    text: |-
      In geval van een incidentele crisis zijn de uitgaven, bedoeld in deze afdeling, uitsluitend subsidiabel als het
      effect van de acties gericht is op het oplossen van de crisis op korte termijn.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: '181.3'
    text: |-
      De minister stelt vast in welke gevallen sprake is van een crisis als bedoeld in het eerste en tweede lid en wat de
      aard van deze crisis is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: '181.4'
    text: 'Voor het jaar 2017 verkeert in structurele crisis de afzet van de producten:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.a
    text: glasgroenten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.b
    text: witlof;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.c
    text: bloemkool;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.d
    text: champignons;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.e
    text: appels, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: 181.4.f
    text: peren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: '181.5'
    text: Dit artikel is niet van toepassing op uitgaven voor premies ten behoeve van een oogstverzekering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel181
  - number: '182.1'
    text: |-
      Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten in het kader van afzetbevorderings
      -en communicatieacties als bedoeld in artikel 33, derde lid, onderdeel c, van [verordening 1308/2013](onbekend)
      zijn subsidiabel indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.a
    text: marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.b
    text: marktstudies;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.c
    text: introductie van een nieuwe verpakkingswijze;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.d
    text: introductie van een merk;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.e
    text: promotie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: 182.1.f
    text: reclame.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: '182.2'
    text: Onder de uitgaven, bedoeld in het eerste lid, worden mede verstaan voorbereidende uitgaven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel182
  - number: '183.1'
    text: |-
      Uitgaven van de producentenorganisatie voor collectieve generieke promotie-uitingen op het gebied van crisis zijn
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel183
  - number: '183.2'
    text: |-
      Bij de indiening van het operationeel programma legt de producentenorganisatie in het kader van de uitgaven,
      bedoeld in het eerste lid, een plan inhoudende de concrete invulling van de acties en begroting voor aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel183
  - number: '184.1'
    text: |-
      Uitgaven van de producentenorganisatie voor het uit de markt nemen van producten als bedoeld in artikel 33, derde
      lid, onderdeel f, van [verordening 1308/2013](onbekend) zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '184.2'
    text: 'Als producten bedoeld in artikel 33, derde lid, onderdeel f, van verordening 1308/2013 worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.a
    text: tomaten met GN code 0702 00 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.b
    text: wortels met GN code 0706 10 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.c
    text: witte kool en rode kool met GN code 0704 90 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.d
    text: niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.e
    text: bloemkool en broccoli met GN code 0704 10 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.f
    text: komkommers met GN code 0707 00 05;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.g
    text: augurken met GN code 0707 00 90;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.h
    text: champignons agaricus met GN code 0709 51 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.i
    text: appelen met GN code 0808 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.j
    text: peren met GN code 0808 30;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.k
    text: pruimen met GN-code 0809 40 05, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.2.l
    text: rood fruit met GN codes 0810 20, 0810 30 en 0810 40;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '184.3'
    text: |-
      Als certificaat als bedoeld in artikel 78, eerste lid, van verordening 543/2011 wordt aangemerkt een verklaring
      van een producentenorganisatie waarin staat dat de uit de markt genomen producten voldoen aan de in artikel 76 van
      verordening 543/2011 bedoelde handelsnormen of minimumeisen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '184.4'
    text: 'Als toegestane bestemmingen als bedoeld in artikel 80, eerste lid, van verordening 543/2011 worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.4.a
    text: afvoer naar de afvalverwerkende industrie, nadat het product is gedenatureerd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.4.b
    text: afvoer naar veehouders ten behoeve van vervoedering, nadat het product is gedenatureerd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: 184.4.c
    text: |-
      gratis uitreiking, als bedoeld in artikel 80, tweede lid, van verordening 543/2011, aan liefdadigheidsinstellingen
      of -organisaties als bedoeld in artikel 187, eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '184.5'
    text: Afvalverwerkers, bedoeld in het vierde lid, onderdeel a, beschikken over een geldige milieuvergunning.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '184.6'
    text: |-
      Afnemers van producten die op grond van het eerste lid uit de markt genomen zijn mogen geen vergoeding betalen voor
      het uit de markt genomen product.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel184
  - number: '185.1'
    text: |-
      Een voorafgaande melding, bedoeld in artikel 78, eerste lid, van [verordening 543/2011](onbekend), wordt
      elektronisch ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
  - number: '185.2'
    text: Een melding als bedoeld in het eerste lid betreft een massa van ten hoogste 30.000 kilogram.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
  - number: '185.3'
    text: |-
      Ten behoeve van de in het eerste lid bedoelde melding maakt de producentenorganisatie of unie van
      producentenorganisaties gebruik van een middel dat door de minister ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
  - number: '185.4'
    text: |-
      Indien de melding bedoeld in het eerste lid plaats vindt voor 0:00 uur, vindt de controle, bedoeld in artikel 108,
      eerste lid, van verordening 543/2011 uiterlijk de derde werkdag plaats.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
  - number: '185.5'
    text: |-
      De uit de markt genomen producten worden bij controle in dusdanige verpakking aangeboden dat controle mogelijk is
      en in elk geval niet in een verpakking met een omvang groter dan 1 kubieke meter en een gewicht van meer dan 300
      kg.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
  - number: '185.6'
    text: |-
      In afwijking van het vijfde lid worden de producten, bedoeld in
      [artikel 184, tweede lid, onderdelen a, k, en l][ref1], in elk geval niet aangeboden in verpakkingen van meer dan
      25 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel184
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '184'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: '185.7'
    text: |-
      Een producentenorganisatie toont aan dat bij het indienen van een melding, als bedoeld in het eerste lid, van het
      uit de markt nemen ten behoeve van gratis uitreiking, als bedoeld in [artikel 184, vierde lid, onderdeel c][ref1],
      de afname door de liefdadigheidsinstelling of -organisatie verzekerd is. Op verzoek van de minister overlegt de
      producentenorganisatie hiertoe schriftelijke bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel184
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '184'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: '186'
    text: |-
      De minister stelt de door de lidstaten vast te stellen maximale steunbedragen, bedoeld in artikel 79, eerste lid,
      van [verordening 543/2011](onbekend) vast.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel186
  - number: '187.1'
    text: |-
      Als erkende liefdadigheidsinstellingen of -organisaties als bedoeld in artikel 34, vierde lid,
      onderdeel a, van [verordening 1308/2013](onbekend) worden aangewezen voedselbanken die op grond van
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] zijn aangemerkt als algemeen nut
      beogende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5b
  - number: '187.2'
    text: |-
      Als personen die op grond van de nationale wetgeving recht hebben op overheidsbijstand, met name omdat zij over
      onvoldoende middelen beschikken om in hun onderhoud te voorzien als bedoeld in artikel 34, vierde lid, onderdeel a,
      van verordening 1308/2013 worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: 187.2.a
    text: |-
      personen die op grond van [artikel 11, eerste lid, van de Wet werk en bijstand][ref1] recht hebben op een
      overheidsuitkering, en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '11'
  - number: 187.2.b
    text: |-
      andere personen die ten genoegen van de voedselbanken kunnen aantonen niet over voldoende middelen te beschikken om
      in hun onderhoud te voorzien.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: '187.3'
    text: |-
      Het overnamecertificaat, bedoeld in artikel 83, eerste lid, onderdeel d, van [verordening 543/2011](onbekend) wordt
      getekend door:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: 187.3.a
    text: |-
      het regionale distributiecentrum, in het geval de uit de markt genomen producten geleverd worden aan een regionale
      distributiecentrum voor voedselbanken, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: 187.3.b
    text: |-
      de voedselbank, in het geval de uit de markt genomen producten geleverd worden aan de voedselbank die de uit de
      markt genomen producten daadwerkelijk uitreikt aan de eindontvangers.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: '187.4'
    text: |-
      Indien een voedselbank van haar aanvragers een symbolische bijdrage vraagt voor de voedselpakketten vraagt de
      voedselbank hiervoor vooraf toestemming aan onze minister en houdt zij hiervoor een financiële boekhouding bij.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: '187.5'
    text: |-
      Indien een voedselbank de op grond van deze regeling ontvangen producten verwerkt of laat verwerken toont de
      voedselbank aan dat de verwerkte producten volledig ten goede komen aan de personen bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel187
  - number: '188.1'
    text: |-
      Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers als bedoeld in
      [artikel 184, vierde lid][ref1], en transporteurs van uit de markt genomen producten waarin de afnemers en
      transporteurs worden verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel184
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '184'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 188.1.a
    text: tot naleving van de voorwaarden uit artikel 83 van [verordening 543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.1.b
    text: |-
      bij ontvangst van de uit de markt genomen producten de daarbij behorende door de minister ter beschikking gestelde
      vrachtbrief te ondertekenen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.1.c
    text: |-
      de vrachtbrief, bedoeld in onderdeel b, en de overeenkomst met de producentenorganisatie gedurende tenminste 7
      kalenderjaren, volgend op het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.1.d
    text: |-
      tot vervoer van de uit de markt genomen producten voor bestemmingen als bedoeld in
      [artikel 184, vierde lid, onderdeel a en b][ref1], zonder dat verlies uit het vervoermiddel van producten of delen
      ervan plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel184
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '184'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: '188.2'
    text: |-
      In aanvulling op het eerste lid worden ontvangers van uit de markt genomen producten als bedoeld in
      [artikel 184, vierde lid, onderdelen a en b][ref1], verplicht om de uit de markt genomen producten in geval van de
      bestemmingen bedoeld in artikel 184, vierde lid, onderdelen a en b:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel184
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '184'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 188.2.a
    text: 'een niet voor menselijke consumptie geschikte bestemming te geven die:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.2.a.1
    text: de normale afzet van de betrokken productie niet in de weg staat, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.2.a.2
    text: |-
      geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 80, eerste lid, van
      verordening 543/2011, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: 188.2.b
    text: |-
      bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
  - number: '188.3'
    text: |-
      Indien voor gratis uitreiking, als bedoeld in [artikel 185, vierde lid, onderdeel c][ref1], bestemd product door
      de verwerkende industrie wordt verwerkt toont de afnemer ten genoegen van de minister aan de hand van bewijsstukken
      aan dat het product niet opnieuw in het commerciële handelscircuit terecht komt.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel185
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '185'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: '189'
    text: 'Uit de bewijsstukken bedoeld in artikel 81, tweede lid, van [verordening 543/2011](onbekend) blijkt:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel189
  - number: 189.a
    text: vanaf welk adres de uit de markt genomen producten bestemd voor gratis uitreiking vervoerd zijn;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel189
  - number: 189.b
    text: |-
      het adres waar de uit de markt genomen goederen bestemd voor gratis uitreiking zijn afgeleverd aan een voedselbank
      als bedoeld in [artikel 187, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel187
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '187'
        hoofdstuk: '4'
        paragraaf: '3'
        afdeling: '5'
  - number: 189.c
    text: het aantal afgelegde kilometers.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel189
  - number: '190.1'
    text: |-
      Uitgaven van de producentenorganisatie voor het groen oogsten en niet oogsten van producten als bedoeld in artikel
      33, derde lid, onderdeel g, van [verordening 1308/2013](onbekend) zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: '190.2'
    text: 'Als producten bedoeld in artikel 33, derde lid, onderdeel g, van verordening 1308/2013 worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.a
    text: tomaten met GN code 0702 00 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.b
    text: wortels met GN code 0706 10 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.c
    text: witte kool en rode kool met GN code 0704 90 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.d
    text: niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.e
    text: bloemkool en broccoli met GN code 0704 10 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.f
    text: komkommers met GN code 0707 00 05;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.g
    text: augurken met GN code 0707 00 90;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.h
    text: champignons Agaricus met GN code 0709 51 00;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.i
    text: appelen met GN code 0808 10;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.j
    text: peren met GN code 0808 30;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.k
    text: pruimen met GN-code 0809 40 05, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: 190.2.l
    text: rood fruit met GN codes 0810 20, 0810 30 en 0810 40.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: '190.3'
    text: |-
      Uitgaven voor het groen oogsten en niet oogsten van percelen beplant met appelbomen of perenbomen die zijn
      aangeplant na 1 oktober 2015 zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel190
  - number: '191'
    text: |-
      De minister stelt de voor groen oogsten en niet oogsten te betalen vergoedingen, vast op grond van artikel 85,
      vierde lid, onderdeel b, van [verordening 543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel191
  - number: '192.1'
    text: |-
      Een voorafgaande melding als bedoeld in artikel 85, tweede lid, van [verordening 543/2011](onbekend), wordt
      elektronisch ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel192
  - number: '192.2'
    text: |-
      In de melding wordt het door de minister toegekende registratienummer van het toepasselijke perceel of de
      registratienummers van de toepasselijke percelen, zoals vermeld op het formulier, bedoeld in de Regeling
      landbouwtelling en gecombineerde opgave zoals die geldt op het moment waarop de melding wordt gedaan, opgegeven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel192
  - number: '192.3'
    text: |-
      Ten behoeve van de in het eerste lid bedoelde melding maakt de producentenorganisatie of unie van
      producentenorganisaties gebruik van een door de minister beschikking gesteld middel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel192
  - number: '192.4'
    text: |-
      Indien de melding plaatsvindt voor 0:00 uur, vindt de controle, bedoeld in artikel 108, eerste lid, van verordening
      543/2011 uiterlijk de derde werkdag plaats;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel192
  - number: '193'
    text: |-
      Voor producten waarvan de normale oogst reeds begonnen is maar die een langere oogstperiode dan een maand hebben
      wordt de resterende oogstcapaciteit door de producentenorganisatie ten genoegen van de minister bepaald aan de
      hand van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel193
  - number: 193.a
    text: afleverbonnen van de planten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel193
  - number: 193.b
    text: de normale productiecyclus van een gewas, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel193
  - number: 193.c
    text: de oorspronkelijk geplande ruimdatum.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel193
  - number: '194.1'
    text: De producentenorganisatie voert het vernietigde gewas, indien van toepassing, of het groen geoogste product af.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: '194.2'
    text: 'Als toegestane bestemmingen voor de in het eerste lid bedoelde afvoer worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.2.a
    text: afvalverwerkers, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.2.b
    text: veehouders ten behoeve van vervoedering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: '194.3'
    text: Afvalverwerkers bedoeld in het tweede lid, onderdeel a, beschikken over een geldige milieuvergunning.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: '194.4'
    text: |-
      Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers als bedoeld in het tweede lid en
      transporteurs van de in het eerste lid bedoelde gewassen en producten waarin de afnemers en transporteurs worden
      verplicht:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.4.a
    text: tot naleving van de voorwaarden uit artikel 83, tweede lid, van [verordening 543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.4.b
    text: |-
      bij ontvangst van de in het eerste lid bedoelde gewassen en producten de daarbij behorende door de minister ter
      beschikking gestelde vrachtbrief te ondertekenen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.4.c
    text: |-
      de vrachtbrief, bedoeld in onderdeel b, en de overeenkomst met de producentenorganisatie gedurende tenminste 7
      kalenderjaren, volgend op het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: '194.5'
    text: |-
      In aanvulling op het vierde lid worden ontvangers van de gewassen en producten bedoeld in het eerste lid verplicht
      om deze gewassen en producten:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.5.a
    text: 'een niet voor menselijke consumptie geschikte bestemming te geven die:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.5.a.1
    text: de normale afzet van de betrokken productie niet in de weg staat, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.5.a.2
    text: |-
      geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 80, eerste lid, van
      verordening 543/2011, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: 194.5.b
    text: |-
      bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel194
  - number: '195.1'
    text: |-
      Uitgaven voor premies ten behoeve van een oogstverzekering als bedoeld in artikel 33, derde lid, onderdeel h, van
      [verordening 1308/2013](onbekend) en de artikelen 50 en 51 van [verordening 2017/891](onbekend) zijn subsidiabel
      indien de producentenorganisatie voor die verzekering een raamovereenkomst met de verzekeraar heeft gesloten, of:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: 195.1.a
    text: de oogstverzekering op naam van de producentenorganisatie is gesteld, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: 195.1.b
    text: de uitgaven door de producentenorganisatie worden gedaan.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: '195.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid zijn slechts subsidiabel indien zij betrekking hebben op het deel van de
      polis dat betrekking heeft op gewasschade als gevolg van weersomstandigheden of klimatologische omstandigheden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: '195.3'
    text: |-
      Uitgaven als bedoeld in het eerste lid, zijn uitsluitend subsidiabel indien zij daadwerkelijk betaald zijn,
      met uitzondering van assurantiebelasting en polis- of andere soortgelijke kosten onder aftrek van kortingen en
      retributies op pro rato basis van de betaalde premies.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: '195.4'
    text: |-
      Indien de oogstverzekering, bedoeld in het eerste lid, uitsluitend dekking biedt tegen ongunstige
      weersomstandigheden vindt artikel 34, derde lid, van [verordening 1308/2013](onbekend) geen toepassing.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: '195.5'
    text: |-
      Bij de indiening van de steunaanvraag wordt door de producentenorganisatie aan de minister, met gebruikmaking van
      een door de minister beschikbaar gesteld middel, in geval van de uitgaven, bedoeld in het eerste lid, informatie
      overlegd over de verzekering en de daaraan deelnemende leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel195
  - number: '196'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder viii, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 196.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 196.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel196
  - number: '197'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur van
      de producentenorganisatie door fusies en overnames zijn subsidiabel, indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel197
  - number: 197.a
    text: de juridische kosten en administratiekosten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel197
  - number: 197.b
    text: de kosten van haalbaarheidsstudies.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel197
  - number: '198.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van de versterking van de verticale samenwerking in de keten
      voor beleggingen in aandelen zijn subsidiabel indien het gaat om uitgaven voor de waarde van de materiële vaste
      activa.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel198
  - number: '198.2'
    text: |-
      De producentenorganisatie toont de belegging, bedoeld in het eerste lid, bij de indiening van de steunaanvraag aan
      door middel van bankstukken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel198
  - number: '289.1'
    text: |-
      Als bewijsstuk als bedoeld in artikel 69, tweede lid, onderdelen a en d, van [verordening 543/2011](onbekend),
      gelden:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289
  - number: 289.1.a
    text: een overzicht van de per project en activiteit aangevraagde steun, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289
  - number: 289.1.b
    text: een detailstaat van de verrichte uitbetalingen en afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289
  - number: '289.2'
    text: |-
      Als bewijsstuk als bedoeld in artikel 69, tweede lid, onderdeel i, van verordening 543/2011, geldt de detailstaat
      betalingen en afschrijvingen van de producentenorganisatie waarin de facturen voor de betreffende acties zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289
  - number: '289.3'
    text: |-
      Indien uitgaven voor activiteiten op grond van [deel 4, hoofdstuk 3][ref1] of [4][ref2], voor 50% subsidiabel
      zijn, worden de volledige uitgaven van de producentenorganisatie voor deze activiteiten opgenomen in de detailstaat
      van de verrichte uitbetalingen en afschrijvingen, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: 289a.1
    text: |-
      Uitgaven als bedoeld in [deel 4, hoofdstuk 3][ref1] en [4][ref2], worden opgenomen in de steunaanvraag voor het
      uitvoeringsjaar waarin de activiteit wordt uitgevoerd en de uitgaven worden dat jaar betaald, tenzij in hoofdstuk 3
      of 4 van deel 4 anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289a
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: 289a.2
    text: |-
      In afwijking van het eerste lid kunnen uitgaven als bedoeld in [hoofdstuk 3][ref1] en [4 van deel 4][ref2] worden
      opgenomen in de steunaanvraag voor het jaar voorafgaand aan het jaar waarin de uitgaven betaald worden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289a
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: 289a.2.a
    text: de activiteit is uitgevoerd in het jaar waarvoor de steunaanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289a
  - number: 289a.2.b
    text: |-
      de uitgaven betaald zijn in de periode van 1 januari tot en met 14 februari van het jaar dat volgt op het jaar
      waarop de steunaanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel289a
  - number: '290.1'
    text: |-
      Uitgaven als bedoeld in artikel 69, derde lid, van [verordening 543/2011](onbekend), kunnen in de steunaanvraag van
      het jaar waarin zij geprogrammeerd zijn worden opgenomen, indien de producentenorganisatie, in een bijlage bij de
      steunaanvraag, gemotiveerd aangeeft dat deze uitgaven betrekking hebben op situaties die:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: 290.1.a
    text: aantoonbaar zijn ontstaan na indiening van het operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: 290.1.b
    text: geheel buiten de invloedsfeer van de producentenorganisatie liggen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: 290.1.c
    text: niet het gevolg zijn van een risicovolle planning door de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: '290.2'
    text: |-
      Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring afleggen,
      met gebruikmaking van een door de minister vastgesteld model, over de naleving van de in het eerste lid bedoelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: '290.3'
    text: |-
      Producentenorganisaties overleggen de verklaring, bedoeld in het derde lid, uiterlijk op 15 mei van het jaar na het
      jaar waarvoor de subsidie wordt aangevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: '290.4'
    text: De minister besluit of de uitgaven, bedoeld in het eerste lid, subsidiabel zijn.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel290
  - number: '291.1'
    text: |-
      Producentenorganisaties laten een extern accountant de juistheid van de bewijsstukken, bedoeld in artikel
      69, tweede lid, onderdelen a, c, d, f, en i, van [verordening 543/2011](onbekend), controleren en laten de
      bewijsstukken door de accountant waarmerken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel291
  - number: '291.2'
    text: |-
      Producentenorganisaties laten een extern accountant een controle uitvoeren op de naleving van de punten, bedoeld in
      artikel 69, tweede lid, onderdelen e, g en h van [verordening 543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel291
  - number: '291.3'
    text: |-
      De in het eerste en tweede lid bedoelde accountant stelt op basis van de door hem uitgevoerde controle een
      controleverklaring op met gebruikmaking van een door de minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel291
  - number: '291.4'
    text: |-
      De in het derde lid bedoelde controleverklaring geldt als bewijsstuk als bedoeld in artikel 69, tweede lid,
      onderdelen a en c tot en met i van [verordening 543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel291
  - number: '292'
    text: |-
      Producentenorganisaties overleggen ter uitvoering van artikel 106, eerste lid, van [verordening 543/2011](onbekend)
      jaarlijks tegelijk met de indiening van de steunaanvraag:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel292
  - number: 292.a
    text: |-
      een digitale ledenlijst per 1 januari van het jaar volgend op het jaar waarop de steunaanvraag betrekking heeft met
      gebruikmaking van een door de minister vastgesteld formulier;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel292
  - number: 292.b
    text: |-
      een overzicht van de leden die gedurende het jaar waarop de steunaanvraag betrekking heeft zijn uitgetreden, onder
      vermelding van de datum van uittreding, met gebruikmaking van een door de minister beschikbaar gesteld model, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel292
  - number: 292.c
    text: een parafenlijst van tekeningbevoegde personen binnen de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel292
  - number: '293.1'
    text: |-
      Een producentenorganisatie die in enig jaar een goedgekeurd operationeel programma uitvoert kan de minister
      uiterlijk op de volgende data om betaling van een voorschot als bedoeld in artikel 71, eerste lid, van [verordening
      543/2011](onbekend) verzoeken:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.1.a
    text: 'eerste voorschot: 31 januari;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.1.b
    text: 'tweede voorschot: 31 mei, en'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.1.c
    text: 'derde voorschot: 30 september'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.2'
    text: 'In een verzoek om een voorschot als bedoeld in het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.2.a
    text: het bedrag van het verzochte voorschot genoemd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.2.b
    text: een onderbouwing opgenomen aan de hand van een reële raming van de verwachte uitgaven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.3'
    text: |-
      Een producentenorganisatie die om een voorschot als bedoeld in het eerste lid verzoekt, is ook verplicht om voor de
      tweede en derde termijn van het betreffende jaar een voorschot te verzoeken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.4'
    text: |-
      Ten behoeve van ieder volgend voorschot overlegt de producentenorganisatie de volgende bewijsstukken aan de
      minister:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.4.a
    text: de kwartaalrapportage, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.4.b
    text: de detailstaat betalingen en afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.5'
    text: |-
      De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.6'
    text: |-
      De in het eerste en tweede lid bedoelde accountant stelt op basis van de door hem uitgevoerde controle, met
      gebruikmaking van een door de minister vastgesteld model, een controleverklaring op en waarmerkt de in het vierde
      lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '293.7'
    text: |-
      De bewijsstukken, bedoeld in het vierde en zesde lid, worden uiterlijk op de volgende data aan de minister
      overlegd:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.7.a
    text: 'eerste rapportage: 1 juli van het jaar waarop het verstrekte voorschot betrekking heeft, en'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: 293.7.b
    text: 'tweede rapportage: 31 oktober van het jaar waarop het verstrekte voorschot betrekking heeft.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel293
  - number: '294.1'
    text: |-
      Bij een verzoek om vrijgave van de zekerheid, bedoeld in artikel 71, vierde lid, van [verordening 543/2011]
      (onbekend), worden, voor het kwartaal waarop de gestelde zekerheid betrekking heeft, de bewijsstukken, bedoeld in
      [artikel 293, vierde en zesde lid][ref1], ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel293
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel294
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '293'
  - number: '294.2'
    text: 'Een verzoek om vrijgave van zekerheid als bedoeld in het eerste lid wordt uiterlijk ingediend op:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel294
  - number: 294.2.a
    text: 'eerste rapportage: 1 juli, of'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel294
  - number: 294.2.b
    text: 'tweede rapportage: 31 oktober.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel294
  - number: '295.1'
    text: |-
      Een producentenorganisatie kan de minister uiterlijk op 1 mei, 1 augustus of 31 oktober van enig jaar verzoeken om
      een betaling van het gedeelte van de steun dat overeenkomt met de reeds in het kader van het operationele programma
      bestede en nog niet aan de producentenorganisatie betaalde bedragen, bedoeld in artikel 72 van [verordening
      543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: '295.2'
    text: |-
      Ter onderbouwing van het verzoek om gedeeltelijke betaling als bedoeld in het eerst lid, overlegt de
      producentenorganisatie de volgende bewijsstukken aan de minister:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295.2.a
    text: |-
      een rapportage, met gebruikmaking van een door de minister beschikbaar gesteld middel, over de bij het verzoek
      betrokken periode, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295.2.b
    text: een detailstaat betalingen en afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: '295.3'
    text: |-
      De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: '295.4'
    text: |-
      De accountant, bedoeld in het derde lid, stelt op basis van de door hem uitgevoerde controle een controleverklaring
      op, met gebruikmaking van een door de minister vastgesteld model, en waarmerkt de bewijsstukken, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: '295.5'
    text: |-
      De bewijsstukken, bedoeld in het tweede en vierde lid, worden uiterlijk op de volgende data aan de minister
      overlegd:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295.5.a
    text: 'eerste rapportage: 15 mei van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295.5.b
    text: 'tweede rapportage: 15 augustus van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft, en'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295.5.c
    text: 'derde rapportage: 15 november van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295
  - number: 295a
    text: |-
      Indien een producentenorganisatie werkt met een administratie van dertien perioden wordt, voor de toepassing van de
      [artikelen 293][ref1], [294][ref2] en [295][ref3], onder kwartaal verstaan één keer een tijdvak van vier perioden
      en drie keer een tijdvak van drie perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel293
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel294
      [ref3]: https://wetten.overheid.nl/BWBR0034320#Artikel295
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel295a
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '293'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '294'
      - id: ref3
        bwb_id: BWBR0034320
        artikel: '295'
  - number: '296.1'
    text: |-
      Indien een producentenorganisatie in enig jaar gebruikt maakt van voorschotten, kan deze producentenorganisatie
      voor het betreffende jaar geen gebruik maken van gedeeltelijke betalingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel296
  - number: '296.2'
    text: |-
      Indien een producentenorganisatie in enig jaar gebruikt maakt van gedeeltelijke betalingen, kan deze
      producentenorganisatie voor het betreffende jaar geen gebruik maken van voorschotten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel296
  - number: '297.1'
    text: |-
      Producentenorganisaties overleggen jaarlijks ter uitvoering van artikel 97, eerste lid, van [verordening 543/2011]
      (onbekend) uiterlijk op 15 februari een jaarverslag als bedoeld in artikel 96, eerste lid, van [verordening
      543/2011](onbekend), aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: '297.2'
    text: |-
      Het jaarverslag, bedoeld in het eerste lid, bevat ten aanzien van de tijdens het vorig jaar uitgevoerde
      operationele programma, bedoeld in artikel 96, tweede lid, van [verordening 543/2011](onbekend):
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: 297.2.a
    text: |-
      een beschrijving van de geplande en daadwerkelijke uitgevoerde werkzaamheden voor het betreffende jaar per
      activiteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: 297.2.b
    text: |-
      een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde werkzaamheden als bedoeld in onderdeel
      a;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: 297.2.c
    text: |-
      een beschrijving per activiteit van de geplande en daadwerkelijk bereikte realisatie voor het betreffende
      jaar van de in het goedgekeurde operationele programma vastgestelde meetbare streefdoelen als bedoeld in
      [artikel 47, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: 297.2.d
    text: een motivering van afwijkingen tussen geplande en de daadwerkelijk bereikte realisatie, bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: 297.2.e
    text: |-
      een beschrijving van de bijdrage die de uitvoering van het operationeel programma in het betreffende jaar
      geleverd heeft aan de realisatie van het operationeel programma, met name de strategische doelen, bedoeld in
      [artikel 43, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 297.2.f
    text: |-
      een beschrijving van de, als gevolg van de afwijkingen, bedoeld in onderdeel d, noodzakelijke aanpassingen van de
      meetbare streefdoelen, bedoeld in [artikel 47, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: 297.2.g
    text: |-
      een beschrijving en onderbouwing van de geplande en daadwerkelijke bijdrage die de gerealiseerde werkzaamheden in
      het betreffende jaar per project hebben geleverd aan de realisatie van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: 297.2.g.i
    text: |-
      strategische doelen, bedoeld in [artikel 43, eerste en tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 297.2.g.ii
    text: |-
      de gekwantificeerde streefdoelen, bedoeld in [artikel 43, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 297.2.h
    text: een motivering van afwijkingen tussen de geplande en daadwerkelijk gerealiseerde bijdrage, bedoeld in onderdeel g.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
  - number: '297.3'
    text: |-
      Indien de meetbare streefdoelen, bedoeld in artikel 59, onderdeel b, van [verordening 543/2011](onbekend)
      moeten worden aangepast dient de producentenorganisatie voor het volgende jaar een verzoek tot wijziging van het
      operationeel programma aan, bedoeld in [artikel 286][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel286
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '286'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '6'
  - number: '298'
    text: |-
      Producentenorganisaties overleggen uiterlijk op 15 februari van het jaar dat volgt op het laatste jaar van
      uitvoering van het operationeel programma, het eindverslag, bedoeld in artikel 96, vierde lid, van [verordening
      543/2011](onbekend), aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel298
  - number: '299'
    text: |-
      Ter uitvoering van artikel 97, onderdeel b, van [verordening 543/2011](onbekend) overleggen producentenorganisaties
      jaarlijks, uiterlijk op 25 oktober, aan de minister de informatie, bedoeld in bijlage XIV van [verordening
      543/2011](onbekend), met gebruikmaking van een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel299
  - number: '300.1'
    text: |-
      De producentenorganisatie overlegt in het laatste uitvoeringsjaar van het operationeel programma uiterlijk op 15
      februari, met gebruikmaking van een door de minister beschikbaar gesteld middel, een tussenevaluatie als bedoeld in
      artikel 126, derde lid, van [verordening 543/2011](onbekend) aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: '300.2'
    text: |-
      Ter uitvoering van artikel 126, derde lid, van verordening 543/2011 bevat de tussentijdse evaluatie in ieder geval
      de volgende onderdelen:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: 300.2.a
    text: |-
      een beschrijving van de geplande en daadwerkelijke gedurende de looptijd van het operationeel programma uitgevoerde
      projecten en activiteiten, bedoeld in [artikel 47, eerste lid, onderdelen d en e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: 300.2.b
    text: |-
      een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde projecten en activiteiten als bedoeld
      in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: 300.2.c
    text: |-
      een beschrijving per project en activiteit van de geplande en gedurende de looptijd van het operationeel programma
      daadwerkelijk bereikte realisatie van de in het goedgekeurde operationele programma vastgestelde meetbare
      streefdoelen als bedoeld in [artikel 47, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: 300.2.d
    text: een motivering van afwijkingen tussen geplande en de daadwerkelijk bereikte realisatie, bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: 300.2.e
    text: |-
      een beschrijving van de bijdrage die de uitvoering van het operationeel programma gedurende haar looptijd
      geleverd heeft aan de realisatie van het operationeel programma, met name de strategische doelen, bedoeld in
      [artikel 43, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 300.2.f
    text: |-
      een beschrijving van de begrote en daadwerkelijke benutting van het actiefonds gedurende de looptijd van het
      operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: 300.2.g
    text: een motivering van afwijkingen tussen begrote en de daadwerkelijk bereikte benutting van het actiefonds, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: 300.2.h
    text: |-
      een beschrijving van de wijzigingen van het operationele programma als gevolg van de afwijkingen, bedoeld in
      onderdeel b, d en f.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: '300.3'
    text: |-
      Indien de looptijd van een operationeel programma is verlengd op grond van artikel 65, eerste lid, van verordening
      543/2011 behoeft de tussenevaluatie slechts één maal te worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel300
  - number: '301'
    text: Dit deel strekt ter uitvoering van artikel 144 van [verordening 543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel301
  - number: '302.1'
    text: |-
      Wanneer een onjuiste opgave leidt tot een hogere subsidie wordt de subsidie, behoudens overmacht of kennelijke
      vergissing, lager vastgesteld tot het bedrag waarvoor de producentenorganisatie bij een juiste opgave in
      aanmerking zou zijn gekomen, onder extra aftrek van 20 procent van het verschil tussen het opgegeven bedrag en het
      vastgestelde bedrag, indien blijkt dat:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel302
  - number: 302.1.a
    text: |-
      de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de waarde van de afgezette
      productie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel302
  - number: 302.1.b
    text: de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de bijdragen aan het actiefonds.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel302
  - number: '302.2'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel302
  - number: '303.1'
    text: |-
      Indien blijkt dat het operationeel programma of enig onderdeel daarvan, in strijd met de voorwaarden waaronder het
      is goedgekeurd of in strijd met de op grond van verordening 1308/2013 gestelde voorschriften is uitgevoerd, wordt,
      behoudens overmacht, de subsidie verlaagd met een percentage van 20 procent, berekend over:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel303
  - number: 303.1.a
    text: de totale waarde van de onjuist uitgevoerde onderdelen van het operationeel programma, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel303
  - number: 303.1.b
    text: de begrote waarde van de niet uitgevoerde onderdelen van het operationeel programma.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel303
  - number: '303.2'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel303
  - number: '304.1'
    text: |-
      Indien een producentenorganisatie niet voldoet aan het minimum omzetvereiste, bedoeld in
      [artikel 5, eerste lid][ref1], krijgt de producentenorganisatie een hersteltermijn van 12 maanden om alsnog aan het
      gestelde vereiste te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel5
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '5'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '304.2'
    text: |-
      Indien de producentenorganisatie na de hersteltermijn, bedoeld in het eerste lid, niet aan het minimum
      omzetvereiste voldoet, wordt de subsidie voor het jaar waarin niet aan het minimum omzetvereiste werd voldaan 10
      procent lager vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel304
  - number: '304.3'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel304
  - number: '305.1'
    text: |-
      Indien blijkt dat de producentenorganisatie of één of meer van haar leden voor een uit het actiefonds gefinancierde
      actie overlappende nationale of communautaire financiering heeft ontvangen, wordt de aan de betreffende actie
      gerelateerde subsidie lager vastgesteld door:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel305
  - number: 305.1.a
    text: ontneming van het gehele voordeel als gevolg van de overlappende financiering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel305
  - number: 305.1.b
    text: een extra verlaging van 50 procent op het bedrag dat volgt uit de toepassing van onderdeel a.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel305
  - number: '305.2'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel305
  - number: '306.1'
    text: |-
      Indien aan de administratie van de producentenorganisatie, haar leden of van ondernemingen aan wie de
      producentenorganisatie activiteiten heeft uitbesteed op grond van verordening 1308/2013 eisen zijn gesteld en
      blijkt dat aan deze eisen niet is voldaan, wordt de aan de desbetreffende actie gerelateerde subsidie, behoudens
      overmacht, verlaagd met 20 procent.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel306
  - number: '306.2'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel306
  - number: '307.1'
    text: |-
      De subsidie wordt 20 procent lager vastgesteld indien blijkt dat de producentenorganisatie met betrekking tot de
      uitvoering van deze regeling:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel307
  - number: 307.1.a
    text: aanwijzingen van de minister niet opvolgt, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel307
  - number: 307.1.b
    text: aan verzoeken van de minister geen gevolg heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel307
  - number: '307.2'
    text: |-
      Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel307
  - number: '308'
    text: |-
      Indien een aanvraag op grond van de artikelen 65, eerste lid, 66, eerste lid, 69, eerste lid, 71, eerste lid,
      of 72, eerste lid, van [verordening 543/2011](onbekend) onvolledig is en niet binnen een redelijke termijn wordt
      aangevuld, wordt de aan de desbetreffende aanvraag gerelateerde subsidie, behoudens overmacht, met 5 procent
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel308
  - number: '309'
    text: |-
      Indien uit een onderzoek als bedoeld in artikel 115, tweede lid, van [verordening 543/2011](onbekend) blijkt dat
      sprake is van fraude, worden de kosten van dit onderzoek ten laste van de producentenorganisaties gebracht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel309
  - number: '310'
    text: |-
      Bij samenloop van diverse subsidieverlagende factoren als bedoeld in de [artikelen 302 tot en met 304][ref1]
      en [306 tot en met 308][ref2] bedraagt de totale subsidieverlaging, indien er geen sprake is van opzet of grove
      nalatigheid, niet meer dan 50 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel306
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '306'
  - number: '311'
    text: |-
      Archiefbescheiden van Productschap Tuinbouw betreffende zaken die op basis van deze regeling worden behartigd door
      de minister, worden overgedragen aan de minister, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1]
      zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '312.1'
    text: |-
      De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen of verzoeken die zijn ingediend op
      grond van de Verordening PT Uitvoeringsbepalingen GMO Groenten & Fruit 2012 en de Verordening PT GMO Groenten &
      Fruit 2009 worden met ingang van 1 januari 2014 behandeld door de minister met inachtneming van de termijn die op
      dat tijdstip is verstreken sinds het tijdstip van indiening van de aanvraag of het verzoek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312
  - number: '312.2'
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen op grond van de Verordening PT
      Uitvoeringsbepalingen GMO Groenten & Fruit 2012 en de Verordening PT GMO Groenten & Fruit 2009 door het
      Productschap Tuinbouw, die golden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit artikel,
      worden met ingang van 1 januari 2014 geacht te zijn genomen door de minister op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312
  - number: 312a.1
    text: |-
      Een operationeel programma dat is goedgekeurd onder de regeling zoals deze gold voor 1 januari 2017 wordt beheerst
      door de bepalingen van hoofdstuk 4 van de regeling zoals dat gold voor 1 januari 2017, met dien verstande dat in
      artikel 144 van dat hoofdstuk zoals dat gold voor 1 januari 2017 'minimaal 30% van' vervalt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.2
    text: |-
      In afwijking van het eerste lid, zijn de
      [artikelen 47, eerste lid, onderdeel e, subonderdeel 5, alsmede vijfde, zesde en zevende lid][ref1],
      [67][ref2], [73, tweede lid, onderdeel c][ref3], [106, eerste lid][ref4], [107, eerste lid][ref5],
      [116, onderdelen f en i][ref6], [182][ref7] en [195][ref8] van deze regeling van toepassing op uitgaven gedaan
      en activiteiten gestart na 1 januari 2018 in het kader van een operationeel programma dat is goedgekeurd onder de
      regeling zoals deze gold voor 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
