---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_uitvoering_gmo_groenten_en_fruit
regulatory_layer: WET
publication_date: '2014-08-27'
valid_from: '2017-07-14'
bwb_id: BWBR0034320
url: https://wetten.overheid.nl/BWBR0034320/2017-07-14
preamble:
  text: |-
    Gelet op artikelen 1 tot en met 3, 103 ter tot en met 103 octies, 122 tot en met 124, 125 bis, 125 ter, 125
    quinquies en 193 van Verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende een gemeenschappelijke
    ordening van de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (PBEU L 299);

    Gelet op artikelen 19 tot en met 35, 50 tot en met 90, 96 tot en met 110, 113 tot en met 115, 117 tot en met 127
    en 143 tot en met 148 Verordening (EU) nr. 543/2011 van de Commissie van 7 juni 2011 tot vaststelling van nadere
    bepalingen voor de toepassing van Verordening (EG) nr. 1234/2007 van de Raad, wat de sectoren groenten en fruit en
    verwerkte groenten en fruit betreft (PBEU L 157);

    Gelet op artikelen 13, eerste lid, onderdeel b, 15 en 19, eerste lid, onderdeel a, van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.a
    text: '*minister:* Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.b
    text: |-
      *verordening 1308/2013:* Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december 2013
      tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking van de
      [Verordeningen (EEG) nr. 922/72](onbekend), [(EEG) nr. 234/79](onbekend), [(EG) nr. 1037/2001](onbekend) en [(EG)
      nr. 1234/2007](onbekend) van de Raad (PBEU 2013, L 347);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.c
    text: |-
      *verordening 543/2011:* Verordening (EU) nr. 543/2011 van de Commissie van 7 juni 2011 tot vaststelling van nadere
      bepalingen voor de toepassing van [Verordening (EG) nr. 1234/2007](onbekend) van de Raad, wat de sectoren groenten
      en fruit en verwerkte groenten en fruit betreft (PBEU 2011, L 157);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.d
    text: |-
      *verordening 2100/94:* [Verordening (EG) nr. 2100/94](onbekend) van de Raad van 27 juli 1994 inzake het
      communautaire kwekersrecht (PBEU 1994, L 227);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.e
    text: |-
      *verordening 874/2009:* [Verordening (EG) nr. 874/2009](onbekend) van de Commissie van 17 september 2009 houdende
      uitvoeringsbepalingen van [Verordening (EG) nr. 2100/94](onbekend) van de Raad wat betreft de procedures voor het
      Communautair Bureau voor plantenrassen (PBEU 2009, L 251);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.f
    text: |-
      *verordening 834/2007:* [Verordening (EG) nr. 834/2007](onbekend) van de Raad van 28 juni 2007 inzake de
      biologische productie en de etikettering van biologische producten en tot intrekking van [Verordening (EEG) nr.
      2092/91](onbekend) (PBEU 2007, L 189);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.g
    text: |-
      *verordening 889/2008:* [Verordening (EG) nr. 889/2008](onbekend) van de Commissie van 5 september 2008 tot
      vaststelling van bepalingen ter uitvoering van [Verordening (EG) nr. 834/2007](onbekend) van de Raad inzake de
      biologische productie en de etikettering van biologische producten, wat de biologische productie, de etikettering
      en de controle betreft (PBEU 2008, L 250);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.h
    text: |-
      *verordening 1857/2006:* [Verordening (EG) nr. 1857/2006](onbekend) van de Commissie van 15 december 2006
      betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op staatssteun voor kleine en middelgrote
      ondernemingen die landbouwproducten produceren, en tot wijziging van [Verordening (EG) nr. 70/2001](onbekend) (PBEU
      2006, L 358);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.i
    text: |-
      *richtlijn 2000/29:* [Richtlijn 2000/29/EG](onbekend) van de Raad van 8 mei 2000 betreffende de beschermende
      maatregelen tegen het binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige
      producten schadelijke organismen (PBEU 2000, L 169);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.j
    text: |-
      *richtlijn 2002/63:* [Richtlijn 2002/63/EG](onbekend) van de Commissie van 11 juli 2002 houdende vaststelling
      van communautaire bemonsteringsmethoden voor de officiële controle op residuen van bestrijdingsmiddelen in en op
      producten van plantaardige en van dierlijke oorsprong en tot intrekking van [Richtlijn 79/700/EEG](onbekend) (PBEU
      2002, L 187);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.k
    text: '*operationeel programma:* het programma, bedoeld in artikel 33 van [verordening 1308/2013](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.l
    text: '*uitvoeringsjaar:* een jaar van uitvoering van een operationeel programma;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.m
    text: |-
      *tussentijdse wijziging:* een wijziging van het operationeel programma in de loop van het jaar als bedoeld in
      artikel 66, eerste lid, van [verordening 543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.n
    text: |-
      *waarde afgezette productie:* de waarde van de afgezette productie van een producentenorganisatie als bedoeld in
      artikel 50 van [verordening 543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.o
    text: '*erkenningsaanvraag:* een verzoek als bedoeld in artikel 154, eerste lid, van [verordening 1308/2013](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.p
    text: |-
      *erkenningsbesluit:* een besluit van de minister op een verzoek als bedoeld in artikel 154, eerste lid, van
      [verordening 1308/2013](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.q
    text: '*actiefonds:* actiefonds als bedoeld in artikel 32 van [verordening 1308/2013](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.r
    text: |-
      *producentenorganisatie:* door de minister erkende producentenorganisatie als bedoeld in artikel 152 van
      [verordening 1308/2013](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.s
    text: |-
      *unie van erkende producentenorganisaties:* unie van erkende producentenorganisaties als bedoeld in artikel 156 van
      [verordening 1308/2013](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.t
    text: '*subsidie:* financiële steun van de Unie als bedoeld in artikel 34 van [verordening 1308/2013](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.u
    text: |-
      *steunaanvraag:* een aanvraag om subsidie als bedoeld in artikel 69, eerste lid, van [verordening 543/2011]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.v
    text: '*gedeeltelijke betaling:* gedeeltelijke betaling als bedoeld in artikel 72 van [verordening 543/2011](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.w
    text: '*voorschotaanvraag:* aanvraag als bedoeld in artikel 71, eerste lid, van [verordening 543/2011](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.x
    text: |-
      *nationale strategie:* nationale strategie als bedoeld in artikel 36, tweede lid, van [verordening 1308/2013]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.y
    text: '*nationaal kader:* nationaal kader als bedoeld in artikel 36, tweede lid, van [verordening 1308/2013](onbekend);'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.z
    text: |-
      *lid:* een aangesloten producent als bedoeld in artikel 19, eerste lid, onder b) van [Verordening (EG) nr.
      543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.aa
    text: |-
      *niet-producerend lid:* een lid van een producentenorganisatie dat meer dan één teeltseizoen geen producten teelt
      waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.bb
    text: |-
      *verkoper:* natuurlijke of rechtspersoon die door een producentenorganisatie is belast met de verkoop van producten
      van de leden van de producentenorganisatie waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.cc
    text: |-
      *areaalenquête:* inventarisatie van een door een lid van de producentenorganisatie beteeld areaal en de door dit
      lid geteelde producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.dd
    text: |-
      *aanvoerprognose:* opgave door een lid van een producentenorganisatie van de hoeveelheid en aard van de producten
      die het lid in een door de producentenorganisatie te bepalen tijdvak bij de producentenorganisatie verwacht aan
      te voeren;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.ee
    text: |-
      *project:* een samenhangend geheel van activiteiten die subsidiabel zijn gesteld in deze regeling ter uitvoering
      van een strategisch doel dat door een producentenorganisatie wordt nagestreefd met haar operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.ff
    text: |-
      *activiteit:* een activiteit ter uitvoering van een project en een actie als bedoeld in artikel 19, eerste lid,
      onderdeel h, van [verordening 543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.gg
    text: |-
      *goederenlogistiek:* het verzamelen, ophalen, sorteren, opslaan, verpakken, transporteren en distribueren van het
      product;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.hh
    text: |-
      *forfaitair standaardtarief:* een vast of maximaal bedrag per eenheid dat wordt gebruikt om de te declareren
      bedragen vast te stellen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.ii
    text: |-
      *accountant:* een accountant die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36, eerste lid, van de Wet op het Accountantsberoep][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: 1.jj
    text: |-
      *stadium af producentenorganisatie:* het moment waarop er een verkooptransactie plaatsvindt door of namens de
      producentenorganisatie met een derde partij of een minder dan 90 procent dochteronderneming;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.kk
    text: '*denatureren:* het ongeschikt maken voor menselijke consumptie.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.ll
    text: |-
      *strategisch doel:* een doelstelling als bedoeld in artikel 36, tweede lid, onderdeel c, van [verordening
      1308/2013](onbekend) of een doel als bedoeld in artikel 59, onderdeel b, van [verordening 543/2011](onbekend), dat
      een producentenorganisatie nastreeft met haar operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.mm
    text: |-
      *gekwantificeerd streefdoel:* gekwantificeerd streefdoel als bedoeld in artikel 55, derde lid, van [verordening
      543/2011](onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.nn
    text: |-
      *meetbaar streefdoel:* meetbaar streefdoel als bedoeld in artikel 59, onderdeel b, van [verordening 543/2011]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: 1.oo
    text: |-
      *SWOT analyse:* een bedrijfskundig model dat intern de sterktes en zwaktes en in de omgeving de kansen en
      bedreigingen analyseert.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel1
  - number: '2.1'
    text: |-
      De minister wordt aangewezen als bevoegde nationale autoriteit als bedoeld in artikel 38, onder b, van verordening
      1308/2013.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel2
  - number: '2.2'
    text: |-
      De minister wordt aangewezen als bevoegde autoriteit als bedoeld in de artikelen 51, vierde lid, 63, eerste lid,
      64, 65, derde lid, 66, tweede tot en met vierde lid, 69, eerste en vierde lid, 78, eerste lid, 85, tweede lid,
      96, eerste lid, 98, eerste en derde lid, 104, tweede lid, 108, tweede en derde lid, 109, zesde lid, 143, onderdeel
      b, 146, eerste lid, 147, 148 en bijlage IX, onderdeel 1, vijfde gedachtestreepje, van [verordening 543/2011]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel2
  - number: '2.3'
    text: |-
      De minister wordt aangewezen als lidstaat als bedoeld in de artikelen 32, tweede lid, 33, 34, vierde lid, 36,
      eerste en tweede lid, artikel 152, eerste en derde lid, artikel 154, eerste, tweede en derde lid van verordening
      1308/2013 en de artikelen 20, 21, 22, eerste lid, 23, 28, tweede lid, 29, tweede lid, 30, 31, 33, eerste lid, 34,
      35, tweede lid, 50, vierde lid, 51, tweede en zesde lid, 52, 54, eerste lid, 55, vierde lid, 56, eerste lid, 57,
      60, tweede en zesde lid, 62, eerste en derde lid, 63, eerste lid, 65, eerste lid, 66, eerste en vierde lid, 68
      eerste en tweede lid, 70, 71, eerste tot en met derde en zesde lid, 72, 73, 78, tweede en derde lid, 80, 83, eerste
      lid, 85, eerste en vierde lid, 86, eerste lid, 87, 89, eerste en tweede lid, 90, eerste en vierde lid, 96, vijfde
      lid, 97, 98, tweede lid, 99, 100, 101, 104, eerste lid, 105, eerste en derde lid, 106, eerste, derde en vierde
      lid, 107, eerste, tot en met derde lid, 108, eerste en derde lid, 109, eerste lid, 110 tot en met 115, 117, tweede
      lid, 125, derde lid,127, tweede lid, 132, tweede lid, 143, 144, 146, tweede, vierde en vijfde lid en bijlage IX,
      onderdelen 1 en 2, van verordening 543/2011.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel2
  - number: '3'
    text: |-
      De rechtspersoonlijkheid van een producentenorganisatie als bedoeld in artikel 154, eerste lid, van verordening
      1308/2013 blijkt uit:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel3
  - number: 3.a
    text: een in het handelsregister neergelegd authentiek afschrift van de oprichtingsakte van de producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel3
  - number: 3.b
    text: |-
      een in het handelsregister van de Kamer van Koophandel neergelegd authentiek afschrift van de statuten van de
      producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel3
  - number: 3.c
    text: een inschrijving bij het Handelsregister van de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel3
  - number: '4'
    text: 'Van een producentenorganisatie kunnen lid zijn:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel4
  - number: 4.a
    text: een natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel4
  - number: 4.b
    text: |-
      een rechtspersoon als bedoeld in [artikel 2:3 Burgerlijk Wetboek][ref1] of een rechtspersoon naar buitenlands
      recht, of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: 4.c
    text: |-
      een in het Handelsregister van de Kamer van Koophandel ingeschreven maatschap, vennootschap onder firma of
      commanditaire vennootschap.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel4
  - number: '5.1'
    text: |-
      Het minimumaantal leden en de minimale waarde afgezette productie, bedoeld in artikel 154, eerste lid, onderdeel b,
      van verordening 1308/2013 bedraagt:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: 5.1.a
    text: |-
      voor producentenorganisaties die zijn erkend voor 1 januari 2008 tenminste vijf leden, met een gezamenlijke waarde
      van de afgezette productie van € 100.000;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: 5.1.b
    text: |-
      voor producentenorganisaties die zijn erkend na 1 januari 2008 tenminste tien leden, met een gezamenlijke waarde
      van de afgezette productie van € 25.000.000.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: '5.2'
    text: |-
      Rechtspersonen die eigendom zijn van één natuurlijke persoon worden bij de beoordeling van de erkenningsaanvraag
      gezamenlijk door de minister aangemerkt als één lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: '5.3'
    text: |-
      Indien een lid van een producentenorganisatie een rechtspersoon is waarbij meerdere producenten zijn aangesloten,
      kan de minister besluiten deze producenten bij de beoordeling van de erkenningsaanvraag mee te tellen bij de
      bepaling van het aantal leden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: '5.4'
    text: |-
      Producentenorganisaties houden een ledenlijst bij volgens een door de minister vastgesteld model, dat verkrijgbaar
      is bij de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel5
  - number: '6.1'
    text: |-
      Het lidmaatschap van een producentenorganisatie duurt minimaal één jaar en treedt in werking op een door het
      bestuur van de producentenorganisatie te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: '6.2'
    text: 'Aspirant leden verzoeken de producentenorganisatie schriftelijk om lidmaatschap en verklaren in dit verzoek:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.2.a
    text: de statuten van de producentenorganisatie na te leven;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.2.b
    text: |-
      niet bij een andere erkende producentenorganisatie te zijn aangesloten voor het product waarvoor de
      producentenorganisatie is erkend, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.2.c
    text: geen product waarvoor de producentenorganisatie is erkend buiten de producentenorganisatie om te zullen afzetten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: '6.3'
    text: |-
      Een producentenorganisatie bepaalt in haar statuten dat het lidmaatschap kan worden opgezegd met ingang van 1
      januari met inachtneming van een opzegtermijn van tenminste drie maanden en ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: '6.4'
    text: |-
      De bevestiging van lidmaatschap en opzegging van lidmaatschap, alsmede de datum waarop het lidmaatschap en de
      opzegging in werking treedt, wordt door de producentenorganisatie schriftelijk aan het lid meegedeeld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: '6.5'
    text: |-
      Bepalingen omtrent de minimumduur, opzeggingsdata en inwerkingtreding van opzegging van het lidmaatschap zijn niet
      van toepassing in geval van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.5.a
    text: overlijden van het lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.5.b
    text: faillissement van het lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.5.c
    text: toepassing van het sanctiereglement van de producentenorganisatie inzake royement, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: 6.5.d
    text: indien dit redelijkerwijs niet van het lid of coöperatie gevergd kan worden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel6
  - number: '7'
    text: |-
      Een producentenorganisatie kan niet-producerende leden hebben, indien in de statuten van de producentenorganisatie
      wordt bepaald dat deze leden:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel7
  - number: 7.a
    text: |-
      reeds aangesloten waren bij de producentenorganisatie vóór zij gedurende meer dan één productieseizoen geen
      producten meer teelden waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel7
  - number: 7.b
    text: opgenomen worden in een afzonderlijke ledenadministratie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel7
  - number: 7.c
    text: |-
      niet mogen deelnemen aan de stemming van de algemene vergadering over besluiten inzake het actiefonds van de
      producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel7
  - number: '8.1'
    text: |-
      Producentenorganisaties tonen aan dat zij voldoen aan artikel 152, eerste lid, onderdeel b, van [verordening
      1308/2013](onbekend) aan de hand van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel8
  - number: 8.1.a
    text: de oprichtingsakte van de producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel8
  - number: 8.1.b
    text: de notulen van de eerste vergadering of oprichtingsvergadering van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel8
  - number: '8.2'
    text: Het eerste lid is niet van toepassing op producentenorganisaties die zijn erkend voor 1 januari 2008.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel8
  - number: '8.3'
    text: |-
      De producentenorganisaties, bedoeld in het tweede lid, worden geacht te voldoen aan het vereiste van artikel 152,
      onderdeel b, van [verordening 1308/2013](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel8
  - number: '9'
    text: |-
      Een afnemer van producten waarvoor de producentenorganisatie is erkend is ingevolge artikel 152, eerste lid,
      onderdeel c, onder ii, van verordening 1308/2013 geen lid van het bestuur of de Raad van Commissarissen van de
      producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel9
  - number: '10'
    text: |-
      Producentenorganisaties verbieden hun leden op grond van artikel 152, eerste lid, onderdeel c, onder ii, van
      verordening 1308/2013 om activiteiten te ontplooien die het vermoeden doen ontstaan dat de verkoop van het
      product waarvoor zij bij de producentenorganisatie zijn aangesloten niet uitsluitend via de producentenorganisatie
      verloopt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel10
  - number: '11'
    text: |-
      Producentenorganisaties bepalen op grond van artikel 152, eerste lid, onderdeel c, onder ii, van verordening
      1308/2013 op welke moment leden hun product aan de producentenorganisatie ter verkoop aanbieden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel11
  - number: '12.1'
    text: |-
      Producentenorganisaties verplichten hun leden op grond van artikel 152, eerste lid, onderdeel c, onder ii, van
      verordening 1308/2013 om aan de producentenorganisatie:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: 12.1.a
    text: |-
      melding te doen van eigendomsbelangen in ondernemingen die door het lid geproduceerde producten verkopen, indien
      het lid voor deze producten is aangesloten bij de producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: 12.1.b
    text: |-
      aan de hand van schriftelijke bewijsstukken aan te tonen dat binnen de in het eerste lid bedoelde ondernemingen is
      verzekerd dat het lid:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: 12.1.b.1
    text: |-
      geen invloed kan uitoefenen op het vaststellen van de verkoopvoorwaarden door de ondernemingen van de producten
      waarvoor het lid bij de producentenorganisatie is aangesloten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: 12.1.b.2
    text: geen invloed kan uitoefenen op besluiten aangaande commerciële relaties en het prijsbeleid van de ondernemingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: '12.2'
    text: |-
      Producentenorganisaties die zijn erkend voor 1 januari 2014 nemen de in het eerste lid genoemde verplichting
      uiterlijk op 1 januari 2015 op in hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: '12.3'
    text: |-
      Producentenorganisaties die zijn erkend na 1 januari 2014 nemen de in het eerste lid genoemde verplichting op in
      hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel12
  - number: '13.1'
    text: Producentenorganisaties stellen voorschriften vast voor de controle op de naleving van hun statuten door hun leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.2'
    text: |-
      De in het eerste lid bedoelde voorschriften bevatten ten aanzien van de controle op de naleving door hun leden van
      artikel 160 van [verordening 1308/2013](onbekend) voor de door de producentenorganisatie gedurende het jaar uit te
      voeren controles tenminste:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.2.a
    text: |-
      een systematische vergelijking per producent van areaalenquêtes en aanvoerprognoses met de daadwerkelijk aan de
      producentenorganisatie geleverde hoeveelheden gedurende het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.2.b
    text: |-
      een verificatie van de door de leden verstrekte areaalenquêtes en aanvoerprognoses door middel van bezoek door de
      producentenorganisatie aan de leden gedurende het jaar;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.2.c
    text: |-
      een periodieke vergelijking van de aanvoerprognoses en de daadwerkelijke aanvoer met een door de
      producentenorganisatie, op basis van statistische normen of ervaringscijfers, vast te stellen normstelling per
      areaal;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.2.d
    text: |-
      een registratie van de op basis van de onderdelen a tot en met c aangetroffen verschillen en de daarvoor door het
      lid gegeven verklaring, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.2.e
    text: |-
      een registratie van de door de producentenorganisatie getroffen acties naar aanleiding van op grond van onderdeel d
      onverklaarde verschillen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.3'
    text: |-
      De in het eerste lid bedoelde voorschriften bevatten voor de door de producentenorganisatie na afloop van het
      kalenderjaar uit te voeren controles minimaal:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a
    text: |-
      een verplichting voor ieder lid om uiterlijk voor 1 mei na afloop van het kalenderjaar schriftelijk aan de
      producentenorganisatie te verklaren:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.1
    text: hoeveel product hij dat jaar geproduceerd heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.2
    text: hoeveel product hij bij derden heeft ingekocht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.3
    text: hoeveel product hij via de producentenorganisatie verkocht heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.4
    text: |-
      hoeveel product hij op grond van artikel 26 bis van [verordening 543/2011](onbekend) buiten de
      producentenorganisatie om verkocht heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.5
    text: |-
      dat hij, uitgezonderd de verkoop op grond van artikel 26 bis van verordening 543/2011, geen door hem geteelde
      producten waarvoor hij bij de producentenorganisatie is aangesloten buiten de producentenorganisatie verkocht
      heeft, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.a.6
    text: |-
      dat hij bij verkoop op grond van artikel 26 bis van verordening 543/2011 de daaraan door de producentenorganisatie
      gestelde voorwaarden heeft nageleefd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.b
    text: een vergelijking van informatie uit de in onderdeel a bedoelde verklaringen met de omzetgegevens van het lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.c
    text: |-
      een onderzoek door de producentenorganisatie naar de, op basis van de op grond van onderdeel b uitvoerde
      vergelijking, geconstateerde verschillen tussen de eigen verklaringen en de omzetgegevens van het lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.d
    text: |-
      een verplichting tot het instellen van een accountantsonderzoek naar op grond van onderdeel c onvoldoende
      verklaarde verschillen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.e
    text: een registratie van de uitkomsten van het in onderdeel d bedoelde accountantsonderzoek, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.3.f
    text: |-
      een registratie van de opvolging van de uitkomsten van het in onderdeel e bedoelde accountantsonderzoek door de
      producentenorganisatie, waaronder sanctionering van de betreffende leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.4'
    text: |-
      De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om de
      juistheid van in het derde lid, onderdeel a, bedoelde verklaring te laten onderzoeken door een accountant door
      middel van een COS 4400 onderzoek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.5'
    text: 'Het in het vierde lid bedoelde onderzoek betreft:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.5.a
    text: |-
      de leden die verzuimd hebben voor 1 juni na afloop van het kalenderjaar de in het derde lid, onderdeel a, bedoelde
      eigen verklaring te verstrekken;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.5.b
    text: |-
      de leden waarbij door de producentenorganisatie of door controle-instanties in het jaar voorafgaand aan het
      controlejaar is vastgesteld dat zij artikel 160 van verordening 1308/2013 niet hebben nageleefd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.5.c
    text: |-
      de leden waarbij door de producentenorganisatie in het voorafgaande kalenderjaar is vastgesteld dat verschillen
      tussen areaalgegevens en omzetgegevens onvoldoende konden worden verklaard, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: 13.5.d
    text: |-
      minimaal 2 procent van de leden van de producentenorganisatie, met een minimum van één lid, die niet reeds op grond
      van onderdelen a tot en met c deel uit maken van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.6'
    text: |-
      Indien de accountant bij meerdere leden in deze deelwaarneming afwijkende bevindingen constateert treft de
      producentenorganisatie afhankelijk van de aard van de afwijkingen passende maatregelen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.7'
    text: |-
      De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om jaarlijks
      de betrouwbaarheid van het door haar opgezette systeem van controle op de naleving door hun leden van het vereiste
      van artikel 160 van verordening 1308/2013 te evalueren aan de hand van de uitkomsten van het in het vierde lid
      bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.8'
    text: |-
      Producentenorganisaties die zijn erkend voor 1 januari 2014 nemen de in het eerste lid genoemde verplichting
      uiterlijk op 1 januari 2015 op in hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '13.9'
    text: |-
      Producentenorganisaties die zijn erkend na 1 januari 2014 nemen de in het eerste lid genoemde verplichting op in
      hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel13
  - number: '14.1'
    text: |-
      De producentenorganisatie stelt voorschriften vast voor sanctionering van niet naleving van hun statuten door hun
      leden die, behoudens gevallen van overmacht, tenminste bepalen dat:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: 14.1.a
    text: |-
      bij een eerste overtreding van de statutaire verplichtingen ter uitvoering van artikel 160 van [verordening
      1308/2013](onbekend), artikel 26 bis van [verordening 543/2011](onbekend) en de [artikelen 10][ref1], [11][ref2],
      [12][ref3], en [13][ref4] het lid minimaal een schriftelijke waarschuwing krijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0034320#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '10'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '11'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0034320
        artikel: '12'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 14.1.b
    text: |-
      bij een tweede overtreding begaan binnen vijf jaar na het begaan van de eerste overtreding bedoeld in onderdeel a,
      minimaal een boete aan het lid wordt opgelegd en deze boete daadwerkelijk wordt geïncasseerd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: 14.1.c
    text: |-
      leden bij alle vervolgovertredingen begaan binnen vijf jaar na het begaan van de eerste overtreding bedoeld in
      onderdeel a, worden geroyeerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: '14.2'
    text: |-
      Producentenorganisaties administreren alle geconstateerde overtredingen van hun statutaire verplichtingen en aan
      hun leden opgelegde sancties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: '14.3'
    text: |-
      Producentenorganisaties die zijn erkend voor 1 januari 2014 nemen de in het eerste lid genoemde verplichting
      uiterlijk op 1 januari 2015 op in hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: '14.4'
    text: |-
      Producentenorganisaties die zijn erkend na 1 januari 2014 nemen de in het eerste lid genoemde verplichting op in
      hun statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel14
  - number: '15'
    text: |-
      Producentenorganisaties beschikken op grond van artikel 23, onderdeel a, van [verordening 543/2011](onbekend)
      tenminste over een deugdelijk en accuraat systeem van areaalenquêtes en aanvoerprognoses.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel15
  - number: '16'
    text: |-
      Producentenorganisaties beschikken op grond van artikel 154, eerste lid, onderdeel c, van verordening 1308/2013
      tenminste over een volledige beschrijving van de interne organisatie en van de administratieve en interne
      beheersing van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.a
    text: de verkoop en prijsbepaling;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.b
    text: de goederenlogistiek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.c
    text: de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.d
    text: de beoordeling van investeringen en uitgaven waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.e
    text: het aannemen van nieuwe leden en het beëindigen van het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.f
    text: |-
      het vergaren van informatie van de leden en de verwerking van mutaties daarin, waaronder de controle op de
      juistheid van de ledenlijst;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.g
    text: de beoordeling van areaalenquêtes en aanvoerprognoses, waaronder de vergelijking met realisaties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.h
    text: |-
      de controle op naleving van artikel 160 van verordening 1308/2013 door de leden waaronder het verlenen van
      toestemming als bedoeld in artikel 26 bis van verordening 543/2011;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.i
    text: het opleggen van sancties, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: 16.j
    text: het uitbesteden van activiteiten als bedoeld in artikel 155 van verordening 1308/2013.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel16
  - number: '17.1'
    text: |-
      De producentenorganisatie beschikt op grond van artikel 154, eerste lid, onderdeel c, van verordening 1308/2013
      over een redelijk niveau van vermogen en liquiditeit.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel17
  - number: '17.2'
    text: |-
      Een negatief vermogen wordt door de producentenorganisatie, op grond van artikel 154, eerste lid, onderdeel c, van
      verordening 1308/2013 binnen één kalenderjaar aangevuld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel17
  - number: '18.1'
    text: |-
      De producentenorganisatie beschikt ten behoeve van het commercieel en budgettair beheer van hun activiteiten,
      bedoeld in artikel 153, tweede lid, onderdeel f, van verordening 1308/2013, met ingang van 1 januari 2013 op grond
      van artikel 23 van [verordening 543/2011](onbekend) over een eigen, als zodanig kenbare, kantoorruimte die beschikt
      over een eigen opgang, welke niet door ruimtes van een afnemer of een lid van de producentenorganisatie leidt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel18
  - number: '18.2'
    text: |-
      De in het eerste lid bedoelde kantoorruimte is eigendom van de producentenorganisatie of wordt door de
      producentenorganisatie gehuurd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel18
  - number: '19.1'
    text: |-
      Producentenorganisaties maken voor hun financieel administratieve werkzaamheden, waaronder het factureren naar
      afnemers en leden en het opstellen van budgetten, gebruik van eigen personeel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel19
  - number: '19.2'
    text: Het in het eerste lid bedoelde verbod geldt niet voor het opstellen van jaarrekeningen en fiscale zaken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel19
  - number: '20.1'
    text: |-
      Producentenorganisaties tonen op grond van artikel 152, eerste lid, onderdeel c, onder ii, van verordening
      1308/2013 aan de hand van schriftelijke bewijsstukken aan dat zij de verkoopvoorwaarden, en meer in het bijzonder
      de verkoopprijzen, voor de producten van haar leden waarvoor zij is erkend daadwerkelijk kan bepalen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: '20.2'
    text: 'De in het eerste lid bedoelde schriftelijke bewijsstukken tonen aan:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.a
    text: |-
      welke verkoper er binnen of door de producentenorganisatie belast is met de verkoop van de producten van de leden
      waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.b
    text: wat de taak of opdracht van de in onderdeel a bedoelde verkoper is;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.c
    text: op welke wijze de in onderdeel a bedoelde verkoper door de producentenorganisatie wordt aangestuurd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.d
    text: |-
      welke aanwijzingen de in onderdeel a bedoelde verkoper van de producentenorganisatie gekregen heeft voor het voeren
      van onderhandelingen over de verkoopvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.e
    text: |-
      op welke wijze de in onderdeel a bedoelde verkoper achteraf verantwoording aflegt aan de producentenorganisatie
      over de gerealiseerde verkoopvoorwaarden, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: 20.2.f
    text: dat de in onderdeel e bedoelde verantwoording daadwerkelijk wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: '20.3'
    text: |-
      De producentenorganisatie legt haar afzetbeleid vast in een besluit van het bestuur dat door de algemene
      vergadering wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: '20.4'
    text: |-
      De producentenorganisatie bepaalt op welke locatie of welke locaties het aanbod van de producten van haar leden
      fysiek geconcentreerd wordt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: '20.5'
    text: |-
      Het afzetbeleid van de producentenorganisatie wordt jaarlijks door haar bestuur geëvalueerd en deze evaluatie wordt
      jaarlijks door de algemene vergadering van de producentenorganisatie besproken en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel20
  - number: '21.1'
    text: |-
      Artikel 155 van verordening 1308/2013 is van toepassing op de activiteiten van de producentenorganisatie die
      bijdragen aan het realiseren van de doelstellingen van de producentenorganisatie, bedoeld in de artikelen 152 en
      154 van verordening 1308/2013.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.2'
    text: |-
      Wanneer een producentenorganisatie de in het eerste lid bedoelde activiteiten heeft uitbesteed toont de
      producentenorganisatie op grond van artikel 155 van verordening 1308/2013 door middel van door het bestuur en de
      algemene vergadering geaccordeerde schriftelijke bewijsstukken aan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.2.a
    text: welke activiteiten worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.2.b
    text: waarom deze activiteiten niet door de producentenorganisatie zelf worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.2.c
    text: aan wie deze activiteiten worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.2.d
    text: waarom tot de keuze voor uitbesteding aan de in onderdeel c bedoelde entiteit is gekomen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.2.e
    text: welke afspraken er met de in onderdeel c bedoelde entiteit zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.3'
    text: |-
      De producentenorganisatie toont op grond van artikel 27, tweede lid, van [verordening 543/2007](onbekend) aan de
      hand van schriftelijke bewijsstukken aan op welke wijze de in het tweede lid, onderdeel c, bedoelde entiteit:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.3.a
    text: door de producentenorganisatie wordt aangestuurd bij de uitvoering van de aan haar uitbestede activiteiten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.3.b
    text: verantwoording aflegt aan de producentenorganisatie over de uitvoering van de aan haar uitbestede activiteiten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.4'
    text: |-
      Wanneer een producentenorganisatie verkoopactiviteiten uitbesteedt, toont zij aan de hand van schriftelijke
      bewijsstukken aan dat zij minimaal één maal per week met de in het tweede lid, onderdeel c, bedoelde entiteit
      overlegt over de te hanteren verkoopvoorwaarden, waaronder de verkoopprijs.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.5'
    text: |-
      De keuze voor uitbesteding wordt jaarlijks per geval door het bestuur van de producentenorganisatie geëvalueerd en
      deze evaluatie wordt jaarlijks door de algemene vergadering besproken en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.6'
    text: 'Activiteiten van de producentenorganisatie die niet worden uitbesteed aan haar leden zijn:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.6.a
    text: verkoop van de producten van haar leden waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.6.b
    text: controle op de naleving van de leveringsplicht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.6.c
    text: commercieel en budgettair beheer;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.6.d
    text: boekhouding en facturering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.6.e
    text: kennis van productie van de leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '21.7'
    text: |-
      Activiteiten van de producentenorganisatie die alleen kunnen worden uitbesteed aan dochterondernemingen die voor
      meer dan 90 procent eigendom zijn van de producentenorganisatie zijn:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.7.a
    text: controle op de naleving van de leveringsplicht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.7.b
    text: boekhouding en facturering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: 21.7.c
    text: kennis van productie van de leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel21
  - number: '22'
    text: |-
      Producentenorganisaties nemen in hun statuten op dat zij alle in artikel 152, eerste lid, onderdeel c, onder i,
      ii en iii, van verordening 1308/2013 genoemde doelstellingen nastreven en tonen aan dat zij uitvoering geven aan
      deze doelstellingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel22
  - number: '23.1'
    text: |-
      De statuten van producentenorganisaties bepalen op grond van artikel 153, tweede lid, onderdeel c, van verordening
      1308/2013 dat:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel23
  - number: 23.1.a
    text: |-
      bij een producentenorganisatie met meer dan 10 leden een lid niet meer dan 10 procent van de stemmen van de
      algemene vergadering van de producentenorganisatie heeft, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel23
  - number: 23.1.b
    text: |-
      bij een producentenorganisatie met minder dan 10 leden een lid maximaal 20 procent van de stemmen van de algemene
      vergadering van de producentenorganisatie heeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel23
  - number: '23.2'
    text: De percentages genoemd in het eerste lid omvatten tevens volmachten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel23
  - number: '23.3'
    text: |-
      Indien een natuurlijk persoon, afgezien van volmachten, bevoegd is om te stemmen voor meerdere leden, geldt het in
      het eerste lid genoemde maximum percentage van de stemmen voor deze rechtspersonen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel23
  - number: '24.1'
    text: |-
      Een producentenorganisatie kan haar leden slechts toestemming als bedoeld in artikel 26 bis van [verordening
      543/2011](onbekend) verlenen indien deze mogelijkheid in haar statuten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.2'
    text: |-
      Indien een producentenorganisatie haar leden toestaat gebruik te maken van de uitzondering, bedoeld in artikel 26
      bis van verordening 543/2011, stelt de producentenorganisatie voorschriften vast inzake:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.2.a
    text: de procedure voor verlening van de toestemming;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.2.b
    text: de algemene voorwaarden voor verlening van de toestemming, bedoeld in artikel 26 bis van verordening 543/2011, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.2.c
    text: de rapportageverplichtingen bij het gebruik van de toestemming.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.3'
    text: |-
      Een producentenorganisatie verleent toestemming als bedoeld in het eerste lid schriftelijk en per individueel geval
      voordat gebruik wordt gemaakt van de uitzondering, bedoeld in artikel 26 bis van verordening 543/2011.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.4'
    text: |-
      Indien een producentenorganisatie aan een toestemming als bedoeld in het eerste lid specifieke voorwaarden
      verbindt, worden deze voorwaarden in de toestemming vermeld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.5'
    text: |-
      Het percentage, bedoeld in artikel 26 bis, eerste lid, van verordening 543/2011 wordt vastgesteld op maximaal 25
      procent.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.6'
    text: |-
      Een marginaal deel van het volume van de verhandelbare productie, bedoeld in artikel 26 bis, tweede lid, van
      verordening 543/2011, bedraagt:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.6.a
    text: maximaal 5 procent van het volume van de verhandelbare productie van de producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.6.b
    text: |-
      maximaal 25 procent van het volume van de verhandelbare productie van het lid waar de toestemming aan wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.7'
    text: |-
      Producten die normaliter niet onder de handelsactiviteiten van de producentenorganisatie vallen, bedoeld in artikel
      26 bis, derde lid van verordening 543/2011, zijn:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.7.a
    text: |-
      producten die niet onder het gebruikelijke productassortiment van de producentenorganisatie vallen, terwijl deze
      producten wel onderwerp zijn van de erkenning, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: 24.7.b
    text: |-
      producten welke gewoonlijk wel door de producentenorganisatie worden verkocht, maar door teeltmethode of variëteit
      afwijken van het gangbare productenpakket.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.7'
    text: |-
      Aan een lid mag door de producentenorganisatie slechts een toestemming als bedoeld in artikel 26 bis van
      verordening 543/2011 worden verleend voor in totaal maximaal 25% van de het volume van de verhandelbare productie
      van het lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '24.9'
    text: |-
      Toestemming als bedoeld in artikel 26 bis, onderdelen 2 en 3, van verordening 543/2011 die wordt verleend na 19
      november 2012 kan telkens voor twee jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel24
  - number: '25'
    text: |-
      Een erkenning als bedoeld in artikel 154, eerste lid, van [verordening 1308/2013](onbekend) wordt verleend indien
      de aanvrager kan aantonen dat hij voldoet aan de op grond van de artikelen 152, 153, 154 en 155 van verordening
      1308/2013 en [titel 1][ref1] van deze afdeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '1'
  - number: '26.1'
    text: |-
      Een verzoek om erkenning omvat ter uitvoering van artikel 154, vierde lid, van verordening 1308/2013 de volgende
      stukken:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.a
    text: de oprichtingsakte en statuten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.b
    text: het huishoudelijk reglement;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.c
    text: een uittreksel uit het handelsregister van de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.d
    text: notulen van de oprichtingsvergadering;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.e
    text: het meerjarenplan;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.f
    text: de bestuursnotitie omtrent de afzet en aanbodbundeling;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.g
    text: de bestuursnotitie omtrent de uitbesteding van activiteiten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.h
    text: de ledenlijst;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.i
    text: indien aanwezig de jaarrekeningen van de producentenorganisatie over de afgelopen drie boekjaren;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.j
    text: de beschrijving van de administratieve organisatie en interne beheersing, bedoeld in artikel 16;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.k
    text: de beschrijving van de samenstelling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.l
    text: de procuratieregeling;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.m
    text: het autorisatieschema;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.n
    text: een organogram;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.o
    text: de bevoegdhedenmatrix en parafenlijst;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.p
    text: een beschrijving van de ondernemingsstructuur en dochterondernemingen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: 26.1.q
    text: een beschrijving van de goederenlogistiek.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: '26.2'
    text: |-
      Indien dit nodig is voor de beoordeling van het verzoek om erkenning, bedoeld in artikel 154, vierde lid,
      van verordening 1308/2013 kan de minister de producentenorganisatie verzoeken om aanvullende schriftelijke
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel26
  - number: '27'
    text: |-
      Indien de minister op grond van [artikel 26, tweede lid][ref1], aanvullende bewijsstukken opvraagt wordt de in
      artikel 154, vierde lid, van verordening 1308/2013 bedoelde termijn opgeschort tot de op grond van artikel 26,
      tweede lid, verzochte aanvullende bewijsstukken door de producentenorganisatie aan de minister zijn overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel26
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '26'
        hoofdstuk: '1'
  - number: '28'
    text: 'De producentenorganisatie informeert de minister onverwijld over:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel28
  - number: 28.a
    text: wijzigingen in hun statuten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel28
  - number: 28.b
    text: wijzigingen in hun organisatiestructuur, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel28
  - number: 28.c
    text: voornemens tot fusie of samenwerking.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel28
  - number: '29.1'
    text: 'De producentenorganisatie overlegt jaarlijks voor 1 maart de volgende stukken aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.1.a
    text: een uittreksel uit het handelsregister van de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.1.b
    text: de verslagen van de in het afgelopen boekjaar gehouden algemene vergaderingen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.1.c
    text: |-
      een beschrijving van het afzetbeleid en de evaluatie, bedoeld [artikel 20, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel20
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '20'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.1.d
    text: |-
      de evaluatie, bedoeld in [artikel 13, zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.1.e
    text: |-
      de evaluatie, bedoeld in [artikel 21, vijfde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel21
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '21'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.1.f
    text: de jaarrekening over het afgelopen boekjaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: '29.2'
    text: |-
      De producentenorganisatie overlegt, indien de statuten of de huishoudelijke reglementen van de
      producentenorganisatie gedurende een kalenderjaar gewijzigd zijn, voor 1 maart van het kalenderjaar volgend
      op het jaar waarin de wijziging heeft plaatsgevonden aan de minister de gewijzigde statuten of de gewijzigde
      huishoudelijke reglementen van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: '29.3'
    text: |-
      De producentenorganisatie rapporteert jaarlijks uiterlijk op 1 juni van het eerste jaar na het jaar waarop de
      controles, bedoeld in [artikel 13, derde lid][ref1], betrekking hebben, aan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.3.a
    text: |-
      de namen van bij de producentenorganisatie aangesloten leden die weigeren om de in
      [artikel 13, derde lid, onderdeel a][ref1], bedoelde verklaring te overleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.3.b
    text: |-
      de namen van bij de producentenorganisatie uitgetreden leden die weigeren om de verklaring, bedoeld in
      [artikel 13, derde lid, onderdeel a][ref1], te overleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.3.c
    text: |-
      de voorlopige bevindingen van de producentenorganisatie over de naleving van artikel 160 van [verordening
      1308/2013](onbekend) door haar leden, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.3.d
    text: |-
      de door de producentenorganisatie opgelegde sancties wegens niet naleving van artikel 160 van verordening 1308/2013
      door haar leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: '29.4'
    text: |-
      De producentenorganisatie rapporteert jaarlijks uiterlijk op 1 april van het tweede jaar na het jaar waarop het in
      [artikel 13, vierde lid][ref1], bedoelde onderzoek betrekking heeft aan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.4.a
    text: |-
      de aantallen producenten per productgroep die aan een onderzoek door een accountant als bedoeld in
      [artikel 13, vierde lid][ref1], zijn onderworpen, alsmede hun afzonderlijke omzetcijfers;


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.4.b
    text: |-
      de door de accountant op grond van het in [artikel 13, vierde lid][ref1], bedoelde onderzoek gerapporteerde
      afwijkende bevindingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.4.c
    text: |-
      de door de producentenorganisatie naar aanleiding van de in onderdeel b bedoelde afwijkende bevindingen getroffen
      of te treffen corrigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: '29.5'
    text: |-
      De producentenorganisatie overlegt jaarlijks uiterlijk op 1 juni, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de minister een samenvattend overzicht van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.5.a
    text: |-
      de door de leden op grond van [artikel 13, derde lid, onderdeel a, onder 1° tot en met 4°][ref1], aan de
      producentenorganisatie verstrekte informatie;


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel13
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '13'
        hoofdstuk: '1'
        afdeling: '3'
  - number: 29.5.b
    text: het areaal van de leden van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.5.c
    text: de door de leden van de producentenorganisatie geteelde gewassen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.5.d
    text: |-
      de hoeveelheden product waarvoor aan de leden een toestemming op grond van artikel 26 bis van [verordening
      543/2011](onbekend) is verleend, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: 29.5.e
    text: de omzet van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel29
  - number: '30.1'
    text: Alleen een erkende producentenorganisatie kan lid zijn van een unie van producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel30
  - number: '30.2'
    text: Een unie van producentenorganisatie bestrijkt de totale groep van producten waarvoor zij is erkend.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel30
  - number: '30.3'
    text: De minister kan ontheffing verlenen voor de in het tweede lid gestelde voorwaarde.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel30
  - number: '30.4'
    text: |-
      Een unie van producentenorganisaties is verplicht een operationeel programma of een operationeel deelprogramma in
      te dienen en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel30
  - number: '31'
    text: |-
      De [artikelen 6][ref1], [16][ref2], [17][ref3] en [24][ref4] zijn van overeenkomstige toepassing op unies van
      producentenorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0034320#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0034320#Artikel24
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '6'
        hoofdstuk: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '16'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0034320
        artikel: '16'
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0034320
        artikel: '24'
        hoofdstuk: '1'
        afdeling: '4'
  - number: '32'
    text: |-
      Een erkenning als bedoeld in artikel 156 van verordening 1308/2013 wordt slechts verleend indien wordt voldaan
      aan de op grond van artikel 156 van verordening 1308/2013, hoofdstuk III, sectie 3, van [verordening 543/2011]
      (onbekend) en de in [artikelen 30][ref1] en [31][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel31
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '30'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '31'
        hoofdstuk: '2'
  - number: '33'
    text: |-
      De referentieperiode voor het bepalen van de waarde van de afgezette productie, bedoeld in artikel 51, eerste lid,
      van [verordening 543/2011](onbekend), is het kalenderjaar twee jaar vóór het uitvoeringsjaar waarvoor de waarde
      afgezette productie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel33
  - number: '34.1'
    text: |-
      Bij het bepalen van de waarde van de afgezette productie mogen de producten worden meegenomen, voor zover
      het producten betreft waarvoor de producentenorganisatie is erkend, die in de referentieperiode, bedoeld in
      [artikel 33][ref1], op het grondgebied van de Europese Unie zijn geproduceerd door:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 34.1.a
    text: de producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: 34.1.b
    text: |-
      leden die op 1 januari van het jaar van uitvoering van het operationeel programma bij de producentenorganisatie
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: '34.2'
    text: |-
      Producten zijn geproduceerd door de producentenorganisatie of een lid van de producentenorganisatie als bedoeld in
      het eerste lid, wanneer de productie voor eigen rekening en risico van de producentenorganisatie of haar lid heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: '34.3'
    text: |-
      Ter uitvoering van artikel 50, zevende lid, onderdeel b, van [verordening 543/2011](onbekend) worden de kosten voor
      collectietransport en interlocatietransport buiten een zone van 50 kilometer vanaf de Nederlandse grens niet in
      aanmerking genomen bij de bepaling van de waarde van de afgezette productie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: '34.4'
    text: |-
      In de waarde van de afgezette productie worden geen transportkosten naar de afnemer opgenomen, ongeacht of deze op
      de verkoopfactuur zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: '34.5'
    text: De producentenorganisatie controleert de naleving van het tweede lid en evalueert jaarlijks haar controlebeleid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel34
  - number: '35'
    text: |-
      De waarde van de afgezette productie van leden die zijn toegetreden tot de producentenorganisatie gedurende de
      referentieperiode, bedoeld in [artikel 33][ref1], wordt in aanmerking genomen voor de bepaling van de waarde
      afgezette productie van de producentenorganisatie vanaf de datum die door het bestuur van de producentenorganisatie
      in haar schriftelijke bevestiging als bedoeld in [artikel 6, vierde lid][ref2], is aangewezen als de datum waarop
      het lidmaatschap in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel6
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '6'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '36.1'
    text: |-
      De producentenorganisatie kan bij de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie de waarde van de afgezette productie van leden in aanmerking nemen die:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
  - number: 36.1.a
    text: |-
      gedurende de referentieperiode, bedoeld in [artikel 33][ref1], voor de producten waarvoor de producentenorganisatie
      is erkend waren aangesloten bij een andere in Nederland erkende producentenorganisatie, en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 36.1.b
    text: |-
      na de referentieperiode, bedoeld in [artikel 33][ref1], voor de producten waarvoor de producentenorganisatie
      is erkend tot de producentenorganisatie zijn toegetreden, voor zover deze leden voldoen aan het vereiste van
      [artikel 34, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel34
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '34'
        hoofdstuk: '1'
  - number: '36.2'
    text: |-
      De waarde van de afgezette productie van de leden, bedoeld in het eerste lid, wordt slechts door de nieuwe
      producentenorganisatie in aanmerking genomen indien de producentenorganisaties waar de producent was aangesloten
      gedurende de referentieperiode, bedoeld in [artikel 33][ref1], de nieuwe producentenorganisatie uiterlijk op 15
      november van het jaar waarvoor de waarde van de afgezette productie bepaald wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 36.2.a
    text: |-
      een overzicht verstrekt van de waarde van de voor het individuele lid afgezette producten waarvoor het lid bij de
      nieuwe producentenorganisatie is aangesloten, met gebruikmaking van een door de minister vastgesteld model, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
  - number: 36.2.b
    text: |-
      een rapportage verstrekt van een extern accountant waarin de juistheid van het in onderdeel a bedoelde overzicht
      wordt bevestigd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel36
  - number: '37.1'
    text: |-
      De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie in aanmerking nemen de
      waarde van de afgezette productie van leden die:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.1.a
    text: |-
      na de referentieperiode, bedoeld in [artikel 33][ref1], tot de producentenorganisatie zijn toegetreden, voor zover
      deze leden voldoen aan het vereiste van [artikel 34, eerste lid, onderdeel b][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel34
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '34'
        hoofdstuk: '1'
  - number: 37.1.b
    text: |-
      gedurende de referentieperiode, bedoeld in [artikel 33][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 37.1.b.1
    text: niet waren aangesloten bij een erkende producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.1.b.2
    text: waren aangesloten bij een producentenorganisatie waarvan de erkenning nadien is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: '37.2'
    text: |-
      De waarde afgezette productie van de leden, bedoeld in het eerste lid, wordt in aanmerking genomen bij de bepaling
      van de waarde afgezette productie van de producentenorganisatie indien het lid de producentenorganisatie:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.a
    text: |-
      een overzicht verstrekt van de waarde van de afgezette productie van de producten waarvoor de producent bij de
      producentenorganisatie is aangesloten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.b
    text: |-
      een controleverklaring of rapportage naar aanleiding van een COS 4400 onderzoek van een extern accountant overlegd
      waarin wordt bevestigd dat de waarde die is opgegeven in het overzicht, bedoeld in onderdeel a:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.b.1
    text: juist is;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.b.2
    text: gerealiseerd is door de verkoop van producten waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.b.3
    text: |-
      dat de betreffende producten voor eigen rekening en risico door de betreffende producent binnen het grondgebied van
      de Europese Unie zijn geproduceerd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: 37.2.b.4
    text: geen BTW en transportkosten bevat.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel37
  - number: '38.1'
    text: |-
      De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie in aanmerking nemen de waarde afgezette productie van leden die:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
  - number: 38.1.a
    text: |-
      gedurende de referentieperiode, bedoeld in [artikel 33][ref1], waren aangesloten bij een in een andere lidstaat
      erkende producentenorganisatie, en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 38.1.b
    text: |-
      na de referentieperiode, bedoeld in [artikel 33][ref1], tot de producentenorganisatie zijn toegetreden, voor zover
      deze leden voldoen aan het vereiste van [artikel 34, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel34
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '34'
        hoofdstuk: '1'
  - number: '38.2'
    text: |-
      De waarde afgezette productie van de in het eerste lid bedoelde leden wordt in aanmerking genomen bij het bepalen
      van de waarde afgezette productie van de producentenorganisatie indien de producentenorganisatie waar de producent
      was aangesloten gedurende de referentieperiode, bedoeld in [artikel 33][ref1], de nieuwe producentenorganisatie:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel33
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '33'
        hoofdstuk: '1'
  - number: 38.2.a
    text: |-
      een schriftelijke verklaring verstrekt over de waarde van de voor het individuele lid afgezette producten waarvoor
      het lid bij de nieuwe producentenorganisatie is aangesloten, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
  - number: 38.2.b
    text: |-
      een overzicht en controleverklaring of rapportage als bedoeld in [artikel 37, tweede lid, onderdeel b][ref1],
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel37
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '37'
        hoofdstuk: '1'
  - number: '39'
    text: |-
      De waarde van de afgezette productie die is gerealiseerd door verkoop van producten van leden die op 1 januari
      van het uitvoeringsjaar waarvoor de waarde van de afgezette productie wordt berekend en niet meer bij de
      producentenorganisatie zijn aangesloten, wordt aantoonbaar uit de waarde van de afgezette productie van de
      producentenorganisatie verwijderd voor het betreffende jaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel39
  - number: '40.1'
    text: |-
      Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring afleggen,
      met gebruikmaking van een door de minister vastgesteld model, over de juistheid van de opgave van de waarde van de
      afgezette productie van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel40
  - number: '40.2'
    text: 'Producentenorganisaties overleggen jaarlijks uiterlijk op 2 december aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel40
  - number: 40.2.a
    text: |-
      de definitieve opgave van de waarde van de afgezette productie, met gebruikmaking van een door de minister
      vastgesteld model, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel40
  - number: 40.2.b
    text: de in het eerste lid bedoelde controleverklaring.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel40
  - number: '41.1'
    text: |-
      De wijze van berekening van de financiële bijdragen aan het actiefonds, bedoeld in artikel 32, eerste lid,
      onderdeel a, onder i, van [verordening 1308/2013](onbekend), wordt door de producentenorganisatie vastgelegd in
      haar statuten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel41
  - number: '41.2'
    text: |-
      De financiële bijdragen van de leden, bedoeld in artikel 32, eerste lid, onderdeel a, onder i, van verordening
      1308/2013, kunnen op basis van objectieve criteria worden onderscheiden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel41
  - number: '41.3'
    text: |-
      Ter uitvoering van artikel 53, tweede lid, van [verordening 543/2011](onbekend) wordt het besluit van de
      producentenorganisatie tot vaststelling van de bijdragen van de individuele leden en bijdragen uit de eigen
      middelen van de producentenorganisatie aan het actiefonds goedgekeurd door de algemene vergadering van de
      producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel41
  - number: '41.4'
    text: |-
      In aanvulling op artikel 61 van verordening 543/2011 overlegt een producentenorganisatie voor 15 december van
      het jaar waarin een operationeel programma, of een wijziging als bedoeld in artikel 65 van verordening 543/2011
      daarvan, voor goedkeuring is voorgelegd aan de minister bewijstukken waarmee wordt aangetoond dat de goedkeuring
      van het besluit tot vaststelling van de wijze waarop de bijdragen van de individuele leden aan het actiefonds door
      de algemene vergadering van de producentenorganisatie, bedoeld in het derde lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel41
  - number: '42.1'
    text: |-
      Ter uitvoering van artikel 52 van [verordening 543/2011](onbekend) wordt door de producentenorganisatie voor het
      actiefonds:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42.1.a
    text: een bankrekening geopend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42.1.b
    text: een grootboekrekening gereserveerd, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42.1.c
    text: een aparte kostenplaats aangemaakt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: '42.2'
    text: |-
      De afsluiting van het kwartaal of het jaar in de administratie van de grootboekrekening of bankrekening van het
      actiefonds van de producentenorganisatie sluit direct aan op kwartaalrapportage of de jaarrapportage.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: '42.3'
    text: |-
      Het saldo van de eigen bijdrage van leden aan het actiefonds van de producentenorganisatie is op 14 februari van
      enig jaar groter dan of gelijk aan nul.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: '42.4'
    text: |-
      De producentenorganisatie laat een extern accountant een controle uitvoeren en, met gebruikmaking van een door de
      minister vastgesteld model, een controleverklaring afleggen over:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42.4.a
    text: de juistheid van de in het tweede lid bedoelde afsluiting, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42.4.b
    text: |-
      de naleving van de voorschriften inzake het beheer van het actiefonds, bedoeld in artikel 52 van [verordening
      543/2011](onbekend).
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42
  - number: 42a.1
    text: |-
      De producentenorganisatie informeert jaarlijks na afloop van het uitvoeringsjaar al haar leden in een algemene
      vergadering over de realisatie van het operationeel programma gedurende het voorgaande uitvoeringsjaar, in het
      bijzonder voor wat betreft:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42a
  - number: 42a.1.a
    text: de bedragen die per project over het uitvoeringsjaar zijn gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42a
  - number: 42a.1.b
    text: |-
      welke investeringen van € 100.000 en hoger gedurende het uitvoeringsjaar op locatie van de producentenorganisatie
      zijn gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42a
  - number: 42a.1.c
    text: |-
      welke investeringen van € 50.000 en hoger gedurende het uitvoeringsjaar op andere locaties zijn gerealiseerd, onder
      vermelding van het adres van de locaties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42a
  - number: 42a.2
    text: |-
      De producentenorganisatie overlegt aan de minister jaarlijks voor 1 juli na enig uitvoeringsjaar bewijsstukken
      waaruit blijkt dat het voldaan heeft aan haar informatieverplichting als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel42a
  - number: '43.1'
    text: 'Producentenorganisaties streven met hun operationeel programma minimaal elk van de volgende strategische doelen na:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.1.a
    text: verduurzaming, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.1.b
    text: marktgericht produceren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: '43.2'
    text: |-
      Producentenorganisaties kunnen met hun operationeel programma tevens het strategisch doel versterking
      afzetstructuur nastreven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: '43.3'
    text: 'De gekwantificeerde streefdoelen zijn voor Nederland:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a
    text: 'voor de strategische doelstelling verduurzaming voor de periode van 1 januari 2017 tot en met 1 januari 2018:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a.1
    text: vermindering van de uitstoot van broeikasgassen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a.2
    text: het hergebruik van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a.3
    text: het voorkomen van emissie van gewasbeschermingsmiddelen en nutriënten naar lucht, water en bodem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a.4
    text: het bevorderen van geïntegreerde productie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.a.5
    text: het bevorderen van omschakeling naar een biologische productiewijze;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.b
    text: 'voor het strategische doel marktgericht produceren voor de periode van 1 januari 2017 tot en met 31 december 2020:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.b.1
    text: |-
      van de totale omzet van Nederlandse producentenorganisaties is op 31 december 2020 15% afkomstig uit de afzet van
      nieuwe producten of nieuwe concepten op bestaande markten of het aanboren van nieuwe afzetkanalen en markten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.b.2
    text: een jaarlijkse toename van 2,5% van de omzet per areaal;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.b.3
    text: |-
      een toename van het aantal producten dat wordt afgezet in een hogere kwaliteitsklasse of met een onderscheidend
      kwaliteitslabel, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.b.4
    text: een jaarlijkse groei van 5% van de omzet van biologisch gecertificeerde productie in groente en fruit.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.c
    text: |-
      voor de strategische doelstelling versterking afzetstructuur voor de periode van 1 januari 2017 tot en met 31
      december 2020:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.c.1
    text: verdergaande samenwerking tussen producentenorganisaties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: 43.3.c.2
    text: |-
      een toename van de organisatiegraad per subsector met 15% van het aangesloten areaal op 31 december 2020 ten
      opzichte van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel43
  - number: '44.1'
    text: |-
      In aanvulling op de gegevens, bedoeld in artikel 59 van [verordening (EU) nr. 543/2011](onbekend), bevat een
      operationeel programma de visie van de producentenorganisatie voor de toekomst van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel44
  - number: '44.2'
    text: 'In de visie van de producentenorganisatie, bedoeld in het eerste lid, is ten minste een beschrijving opgenomen van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel44
  - number: 44.2.a
    text: |-
      het toekomstbeeld dat de producentenorganisatie nastreeft en aan het einde van de looptijd van het operationeel
      programma wil hebben gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel44
  - number: 44.2.b
    text: |-
      de wijze waarop dit toekomstbeeld past binnen de strategische doelstellingen bedoeld in [artikel 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: '45'
    text: |-
      De beschrijving van de uitgangssituatie, bedoeld in artikel 59, onderdeel a, van [verordening 543/2011](onbekend)
      bevat een SWOT analyse waarin tenminste:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel45
  - number: 45.a
    text: een beschrijving en onderbouwing is opgenomen van de sterke en zwakke punten van de producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel45
  - number: 45.b
    text: |-
      een beschrijving en onderbouwing is opgenomen van de kansen en bedreigingen voor de producentenorganisatie bij het
      realiseren van de visie, bedoeld in [artikel 44][ref1], en de strategische doelen, bedoeld in [artikel 43][ref2],
      van de producentenorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '44'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: '46'
    text: |-
      In de beschrijving van de doelen, bedoeld in artikel 59, onderdeel b, van [verordening 543/2011](onbekend),
      onderbouwt de producentenorganisatie aan de hand van de SWOT analyse, bedoeld in [artikel 45][ref1], de keuze om de
      strategische doelen, bedoeld in [artikel 43][ref2], wel of niet na te streven met het operationeel programma.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '45'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: '47.1'
    text: |-
      De gedetailleerde beschrijving, bedoeld in artikel 59, onderdeel c, van [verordening 543/2011](onbekend), bevat per
      strategisch doel een plan dat de volgende onderdelen bevat:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.a
    text: de meetbare streefdoelen die de producentenorganisatie in het kader van het strategisch doel beoogt te realiseren;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.b
    text: |-
      een onderbouwing van de gekozen en niet gekozen meetbare streefdoelen van de producentenorganisatie aan de hand van
      de SWOT analyse, bedoeld in [artikel 45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel45
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '45'
        hoofdstuk: '1'
  - number: 47.1.c
    text: 'per meetbaar streefdoel van de producentenorganisatie:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.c.1
    text: |-
      een meetbare en controleerbare nulsituatie, voor zover mogelijk gebaseerd op de gemeenschappelijke
      uitgangsindicatoren, bedoeld in bijlage VIII van verordening 543/2011;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.c.2
    text: |-
      de percentages of cijfers, voor zover mogelijk uitgedrukt in dezelfde eenheid als de gekwantificeerde streefdoelen,
      die de producentenorganisatie aan het eind van de looptijd van het operationele programma nastreeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.c.3
    text: alle projecten waarmee de realisatie van het streefdoel van de producentenorganisatie wordt nagestreefd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.d
    text: 'per project:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.d.1
    text: een omschrijving van het project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.d.2
    text: |-
      een omschrijving en onderbouwing van de verwachte bijdrage, absoluut of relatief, van het project aan de realisatie
      van de meetbare streefdoelen van de producentenorganisatie,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.d.3
    text: een onderbouwing van het vernieuwende karakter van het project, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.d.4
    text: |-
      de subsidiabele activiteiten die in het kader van project worden ingezet om de meetbare streefdoelen van de
      producentenorganisatie te realiseren;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e
    text: 'per subsidiabele activiteit:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.1
    text: een omschrijving van de activiteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.2
    text: |-
      een omschrijving en onderbouwing van de verwachte bijdrage, absoluut of relatief, van de activiteit aan de
      realisatie van de meetbare streefdoelen van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.3
    text: een onderbouwing van de subsidiariteit van de activiteit en de bijbehorende uitgavenposten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.4
    text: per uitvoeringsjaar van het operationeel programma een planning van werkzaamheden voor de activiteit, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.5
    text: 'per uitvoeringsjaar van het operationeel programma een begroting voor de activiteit onderbouwd aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.5.i
    text: |-
      minimaal drie kostenbegrotingen per uitgavenpost voor uitgavenposten die betrekking hebben op het eerste jaar van
      het operationeel programma, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.1.e.5.ii
    text: |-
      minimaal één kostenbegroting per uitgavenpost voor uitgavenposten die betrekking hebben op de volgende jaren van
      het operationeel programma
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '47.2'
    text: 'De meetbare streefdoelen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.2.a
    text: sluiten geheel of gedeeltelijk aan bij de gekwantificeerde streefdoelen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.2.b
    text: dragen bij aan de realisatie van de gekwantificeerde streefdoelen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '47.3'
    text: |-
      Een project heeft een vernieuwend karakter als bedoeld in het eerste lid, onderdeel d, onder 3°, wanneer de
      producentenorganisatie kan aantonen dat zij gedurende de looptijd van het voorafgaande operationele programma geen
      planmatige of bewuste activiteiten heeft ondernomen op het gebied van het betreffende project.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '47.4'
    text: |-
      In afwijking van het eerste lid, onderdeel d, onder 3° geldt het vereiste dat een project een vernieuwend karakter
      moet hebben niet voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.4.a
    text: maatregelen als bedoeld in artikel 19, onderdeel g, onder vi en vii, van verordening (EU) nr. 543/2011, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: 47.4.b
    text: |-
      het jaar 2017 voor activiteiten die subsidiabel zijn op grond van de artikelen [128 tot en met 131][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel128
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '128'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '47.5'
    text: |-
      De uitgavenposten die in het operationeel programma zijn opgenomen voor de jaren na het eerste jaar van het
      operationeel programma worden jaarlijks door middel van een verzoek tot wijziging van het operationeel programma,
      als bedoeld in artikel 65, eerste lid, van verordening 543/2011, onderbouwd door middel van minimaal drie
      kostenbegrotingen per uitgavenpost.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '47.6'
    text: |-
      In afwijking van het eerste lid, onderdeel e, onder 5°, en het vijfde lid, wordt een begroting voor een
      uitgavenpost voor activiteit waarvan de uitgaven in een uitvoeringsjaar worden geraamd op minder dan € 25.000
      onderbouwd aan de hand van een enkele kostenbegroting.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '47.7'
    text: |-
      Indien een uitgavenpost voor een activiteit aantoonbaar niet door meer dan twee partijen kan worden uitgevoerd
      wordt een kostenbegroting, in afwijking van het eerste lid, onderdeel e, onder 5°, en het vijfde lid, onderbouwd
      met de beschikbare kostenbegrotingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel47
  - number: '48'
    text: |-
      Een operationeel programma dat is ingediend in 2015 heeft, in afwijking van artikel 33, eerste lid, van
      [verordening 1308/2013](onbekend), een maximale looptijd van 3 jaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel48
  - number: '49'
    text: |-
      Ter uitvoering van artikel 55, vijfde lid, van [verordening 543/2011](onbekend) betreffen de uitgaven van de
      uitvoering van het operationeel programma per project als bedoeld in [artikel 47, eerste lid, onderdeel d][ref1],
      maximaal 50 procent van het totale operationele programma.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: '50.1'
    text: |-
      Ter uitvoering van artikel 53, tweede lid, van [verordening (EU) nr. 543/2011](onbekend) wordt een operationeel
      programma of een verzoek tot wijziging van een operationeel programma als bedoeld in artikel 65 van verordening
      543/2011 door de algemene vergadering van de producentenorganisatie goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel50
  - number: '50.2'
    text: |-
      In aanvulling op artikel 61 van verordening (EU) nr. 543/2011 overlegt een producentenorganisatie voor 15
      december van het jaar waarin een operationeel programma of een wijziging daarvan voor goedkeuring is voorgelegd
      aan de minister bewijstukken waarmee wordt aangetoond dat de goedkeuring van het besluit tot goedkeuring van
      het operationeel programma of tot wijziging van een operationeel programma door de algemene vergadering van de
      producentenorganisatie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel50
  - number: '51.1'
    text: |-
      De producentenorganisatie dient het operationele programma als bedoeld in artikel 63, eerste lid, van [verordening
      543/2011](onbekend), met gebruikmaking van een door de minister beschikbaar gesteld middel, in voor 1 oktober.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel51
  - number: '51.2'
    text: |-
      In afwijking van het eerste lid dient de producentenorganisatie een operationeel programma als bedoeld in artikel
      63, eerste lid, van verordening 543/2011 in het jaar 2016 uiterlijk in om 23h59 op 17 oktober 2016.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel51
  - number: '52.1'
    text: |-
      Een wijziging van een operationeel programma als bedoeld in artikel 65, eerste lid, van [verordening 543/2011]
      (onbekend) kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.a
    text: een wijziging in de meerjarenbegroting voor de volgende uitvoeringsjaren van het operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.b
    text: |-
      het toevoegen of laten vervallen van uitgavenposten voor activiteiten opgenomen in een goedgekeurd operationeel
      programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.c
    text: het toevoegen van streefdoelen, projecten of activiteiten aan het operationele programma voor de volgende jaren;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.d
    text: het laten vervallen van projecten of activiteiten in het operationele programma voor de volgende jaren,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.e
    text: het jaarbedrag van het actiefonds, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: 52.1.f
    text: de looptijd van het operationele programma.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: '52.2'
    text: |-
      Een verzoek tot wijziging als bedoeld in [artikel 65, eerste lid][ref1], wordt ingediend met gebruikmaking van een
      door de minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel65
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '65'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '52.3'
    text: |-
      In afwijking van artikel 65, eerste lid, van verordening 543/2011, dient de producentenorganisatie een verzoek tot
      wijziging als bedoeld in artikel 65, eerste lid, van verordening 543/2011 in het jaar 2016 uiterlijk in om 23h59 op
      17 oktober 2016.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
  - number: '52.4'
    text: |-
      Voor een operationeel programma dat is goedgekeurd voor 31 december 2016 en dat doorloopt na 1 januari 2017 is
      het toevoegen van activiteiten als bedoeld in het eerste lid, onderdeel c, slechts mogelijk indien de activiteit
      subsidiabel is op grond van [hoofdstuk 4][ref1] van dit deel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: '53.1'
    text: |-
      Een wijziging van een operationeel programma gedurende het jaar, als bedoeld in artikel 66, eerste lid, van
      [verordening 543/2011](onbekend), kan betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.a
    text: |-
      het toevoegen van nieuwe activiteiten aan bestaande projecten opgenomen in een goedgekeurd operationele programma,
      indien deze toevoeging voorafgaand aan het uitvoeringsjaar niet voorzienbaar was;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.b
    text: een overschrijding van de totale begroting voor een uitvoeringsjaar van een goedgekeurd operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.c
    text: |-
      een wijziging van de begroting voor een uitgavenpost voor een activiteit opgenomen in een goedgekeurd operationeel
      met meer dan 20%;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.d
    text: het verhogen van het jaarbedrag van het actiefonds met maximaal 25%;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.e
    text: het verlagen van het jaarbedrag van het actiefonds met maximaal 80%, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.1.f
    text: het toevoegen van andere soorten financiële bijdragen aan het actiefonds dan oorspronkelijk goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: '53.2'
    text: |-
      De producentenorganisatie geeft ten aanzien van wijzigingen, bedoeld in het eerste lid, onderdeel a, gemotiveerd
      aan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.a
    text: waarom deze activiteit subsidiabel is;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.b
    text: welk strategisch doel deze activiteit ondersteunt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.c
    text: hoe het begrote bedrag tot stand gekomen is;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.d
    text: waarom deze wijziging niet voorzienbaar was;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.e
    text: waarom het noodzakelijk is dat deze wijziging gedurende het jaar gedaan wordt, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.2.f
    text: wat de gevolgen van deze wijziging zijn voor de uitvoering van het operationeel programma.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: '53.3'
    text: |-
      Ten aanzien van de wijzigingen, bedoeld in het eerste lid, onderdelen d en e, wordt door de producentenorganisatie
      aangetoond dat de wijziging geen afbreuk doet aan de strategische doelen en de meetbare streefdoelen van het
      operationele programma.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: '53.4'
    text: |-
      De producentenorganisatie dient een verzoek tot wijziging als bedoeld in artikel 66, eerste lid, van verordening
      543/2011 in op:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.4.a
    text: 1 februari van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.4.b
    text: 1 mei van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.4.c
    text: 1 augustus van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: 53.4.d
    text: 31 oktober van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
  - number: '53.5'
    text: |-
      Voor een operationeel programma dat is goedgekeurd voor 1 januari 2016 en dat doorloopt na 1 januari 2017 is
      het toevoegen van activiteiten als bedoeld in het eerste lid, onderdeel a, slechts mogelijk indien de activiteit
      subsidiabel is op grond van [hoofdstuk 4][ref1] van dit deel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: '54.1'
    text: |-
      Wijzigingen van de begroting voor activiteiten opgenomen in een goedgekeurd operationeel programma met minder
      dan 20% en het vervallen van activiteiten opgenomen in een goedgekeurd operationeel programma worden door de
      producentenorganisatie gemeld aan de minister op de data bedoeld in [artikel 53, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel53
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '53'
        hoofdstuk: '2'
  - number: '54.2'
    text: |-
      In afwijking van het eerste lid wordt een wijziging van de begroting als bedoeld in het eerste lid die ontstaat na
      31 oktober van een uitvoeringsjaar aan de minister gemeld in de steunaanvraag, bedoeld in artikel 69, eerste lid,
      van [verordening 543/2011](onbekend), voor het betreffende uitvoeringsjaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel54
  - number: '54.3'
    text: |-
      Een wijziging van de begroting voor een activiteit opgenomen in een goedgekeurd operationeel programma met
      minder dan 20% als bedoeld in het eerste lid wordt door de producentenorganisatie onderbouwd aan de hand van
      kostenbegrotingen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel54
  - number: '55.1'
    text: |-
      De uitgaven, bedoeld in dit hoofdstuk, zijn subsidiabel indien zij op grond van [hoofdstuk 4][ref1] van dit deel
      subsidiabel worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: '55.2'
    text: |-
      De uitgaven, bedoeld in [bijlage I][ref1], zijn niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0034320
  - number: '55.3'
    text: |-
      Ter uitvoering van artikel 58, derde lid van [verordening 543/2011](onbekend) is het steunniveau voor activiteiten
      die subsidiabel zijn op grond van hoofdstuk 4 van dit deel waarvoor door leden van de producentenorganisatie
      tevens subsidie kan worden aangevraagd op grond van verordening 1305/2013 niet hoger dan het steunniveau voor deze
      activiteiten op grond van verordening 1305/2013.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel55
  - number: '55.4'
    text: |-
      Indien de producentenorganisatie kan aantonen dat haar leden voor de activiteiten, bedoeld in het derde lid, geen
      steun kunnen aanvragen op grond van verordening 1305/2013 kan het steunniveau dat voor deze activiteiten geldt op
      grond van verordening 1308/2013 worden toegepast.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel55
  - number: '56'
    text: |-
      Onder personeelskosten als bedoeld in punt twee van bijlage IX van [verordening 543/2011](onbekend) worden
      verstaan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.a
    text: 'de loonkosten voor personeel in dienst van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.a.1
    text: de producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.a.2
    text: een dochteronderneming die voor minimaal 90% eigendom is van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.b
    text: |-
      de kosten voor het inhuren van gedetacheerd personeel en uitzendkrachten ingehuurd door de in onderdeel a genoemde
      ondernemingen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.c
    text: 'de arbeidskosten van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.c.1
    text: een lid, indien het lid een natuurlijk persoon is, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: 56.c.2
    text: de eigenaar of directeur van een lid, indien het lid een rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel56
  - number: '57.1'
    text: 'Personeelskosten zijn subsidiabel voor maximaal:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: 57.1.a
    text: |-
      90% van het aantal uren, bedoeld in [artikel 61, derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel61
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '61'
        hoofdstuk: '3'
  - number: 57.1.b
    text: |-
      80% van het aantal uren, bedoeld in [artikel 61, derde lid][ref1], in geval van managers en leidinggevenden.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel61
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '61'
        hoofdstuk: '3'
  - number: '57.2'
    text: 'Uren worden alleen aan een activiteit toegerekend wanneer de producentenorganisatie aannemelijk maakt dat:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: 57.2.a
    text: de uren aan de betreffende activiteit zijn besteed, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: 57.2.b
    text: de verhouding tussen de bestede uren en de omvang van de betreffende activiteit redelijk is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: '57.3'
    text: Personeelskosten voor managementactiviteiten en beheersmatige activiteiten zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: '57.4'
    text: |-
      Activiteiten van leden van de directie of het bestuur van een producentenorganisatie of een 90% zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: '57.5'
    text: |-
      De minister kan, op verzoek van een producentenorganisatie, in afwijking van het vierde lid, besluiten dat
      personeelskosten voor een lid van de directie of het bestuur subsidiabel zijn, indien het kosten betreft voor
      concrete en aantoonbare activiteiten ter uitvoering van een activiteit.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel57
  - number: '58.1'
    text: |-
      Voor de kosten, bedoeld in [artikel 56, onderdeel c][ref1], geldt een forfaitair uurtarief van € 40.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel56
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '56'
        hoofdstuk: '3'
  - number: '58.2'
    text: |-
      Wanneer een lid van een producentenorganisatie meerdere eigenaren of directeuren heeft, geeft de
      producentenorganisatie bij de indiening van het operationeel programma aan welke eigenaar of directeur de
      activiteiten zal uitvoeren en welke personeelskosten daarvoor worden opgevoerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel58
  - number: '59.1'
    text: |-
      Onder vakbekwaam personeel als bedoeld in punt twee, onderdeel b, van bijlage IX van [verordening 543/2011]
      (onbekend), wordt verstaan personeel met een werk- en denkniveau met minimaal het opleidingsniveau van het
      middelbaar beroepsonderwijs, dat is verkregen door:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: 59.1.a
    text: een afgeronde opleiding, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: 59.1.b
    text: ervaring en specifieke vakkennis.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: '59.2'
    text: |-
      De eisen omtrent vakbekwaamheid, bedoeld in het eerste lid, worden door de producentenorganisatie opgenomen in door
      de directie of het bestuur geaccordeerde functieprofielen, welke worden opgenomen in de administratieve organisatie
      van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: '59.3'
    text: |-
      De producentenorganisatie overlegt bij de indiening van het operationeel programma of een verzoek tot wijziging van
      een operationeel programma aan de minister, ter onderbouwing van de vakbekwaamheid van het personeel, bedoeld in
      het eerste lid:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: 59.3.a
    text: de door de directie of het bestuur van de producentenorganisatie geaccordeerde functieprofielen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: 59.3.b
    text: een volledige taakomschrijving per subsidiabele activiteit van het voor die activiteit ingezette personeel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: '59.4'
    text: |-
      De verplichting opgenomen in het derde lid is slechts van toepassing op een verzoek tot wijziging van een
      operationeel programma voor zover hiermee functies worden opgevoerd die niet eerder in het operationeel programma
      waren opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: '59.5'
    text: |-
      De minister kan, ter onderbouwing van de vakbekwaamheid, bedoeld in het eerste lid, schriftelijke bewijsstukken
      opvragen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel59
  - number: '60.1'
    text: |-
      De producentenorganisatie houdt ter onderbouwing van de gewerkte uren, bedoeld in punt twee, onderdeel b, van
      bijlage IX van [verordening 543/2011](onbekend), een volledige urenadministratie bij die minimaal één keer per
      maand geparafeerd en gedateerd wordt door:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.1.a
    text: de betreffende medewerker, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.1.b
    text: de projectleider of leidinggevende.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.2'
    text: Op verzoek van de minister overlegt de producentenorganisatie de urenadministratie bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.3'
    text: |-
      De medewerker, bedoeld in het eerste lid onderdeel a, mag niet dezelfde persoon zijn als de projectleider of
      leidinggevende, bedoeld in het eerste lid onderdeel b.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.4'
    text: 'De urenadministratie, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.a
    text: |-
      wordt bijgehouden gedurende het hele kalenderjaar of voor de duur van de arbeidsovereenkomst van de medewerker
      wiens inzet wordt toegerekend aan een subsidiabele activiteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.b
    text: |-
      omvat alle uren waarvoor de betreffende medewerker een arbeidscontract heeft, waaronder de uren die niet worden
      toegerekend aan subsidiabele activiteiten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.c
    text: |-
      bevat een korte en duidelijke omschrijving van ter uitvoering van de subsidiabele activiteit verrichte
      werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.d
    text: 'geeft duidelijk weer voor hoeveel uren de betreffende medewerker wordt ingezet:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.d.1
    text: per activiteit, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: 60.4.d.2
    text: voor niet-subsidiabele activiteiten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.5'
    text: |-
      De minister kan, in afwijking van het vierde lid, onderdeel d, op verzoek van een producentenorganisatie
      schriftelijk toestemming verlenen om de onderverdeling, bedoeld in het derde lid, onderdeel d, te maken aan de hand
      van een andere deugdelijke onderbouwing.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.6'
    text: |-
      Indien managers of leidinggevenden uren maken ter uitvoering van een activiteit blijkt uit de urenadministratie,
      bedoeld in het eerste lid, dat managementactiviteiten en beheersmatige activiteiten niet zijn toegerekend aan
      subsidiabele activiteiten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '60.7'
    text: |-
      Het aantal uren waarvoor in de steunaanvraag per activiteit steun wordt aangevraagd overschrijdt niet het aantal
      uren dat ingevolge de goedkeuring van het operationeel programma of het verzoek tot wijziging daarvan voor deze
      activiteit is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel60
  - number: '61.1'
    text: |-
      De producentenorganisatie onderbouwt de loonkosten, bedoeld in [artikel 56, onderdeel a][ref1], van de subsidiabele
      activiteiten aan de hand van uurtarieven op basis van het jaarsalaris van de betreffende medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel56
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '56'
        hoofdstuk: '3'
  - number: '61.2'
    text: 'In het uurtarief, bedoeld in het eerste lid, kan worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.a
    text: het contractueel of bij CAO overeengekomen brutoloon;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.b
    text: een bij contract of CAO overeengekomen niet winstafhankelijke dertiende maand;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.c
    text: een onregelmatigheidstoeslag;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.d
    text: een ploegentoeslag;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.e
    text: het werkgeversdeel sociale verzekeringswetten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.f
    text: de voor rekening van de werkgever komende kosten voor de ziektekostenverzekering;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.g
    text: het werkgeversdeel pensioen en vervroegde uittreding, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.2.h
    text: |-
      dotaties aan pensioenvoorzieningen voor zover onderbouwd kan worden dat hier rechtens afdwingbare verplichtingen
      tegenover staan.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: '61.3'
    text: 'Ten behoeve van de berekening van het uurtarief, bedoeld in het eerste lid, wordt het jaarsalaris gedeeld door:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.3.a
    text: 1.720 uur in het geval van een overeengekomen werkweek 40 uur, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: 61.3.b
    text: |-
      het aantal uur dat de overeengekomen werkweek bedraagt vermenigvuldigd met 43 werkweken in het geval de
      overeengekomen werkweek minder dan 40 uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: '61.4'
    text: Overwerktoeslagen worden niet het in het eerste lid bedoelde uurtarief opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: '61.5'
    text: |-
      De producentenorganisatie overlegt bij de indiening van operationeel programma van één personeelslid een voorbeeld
      van de berekening aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel61
  - number: '62.1'
    text: De producentenorganisatie neemt duurzame productiemiddelen binnen twaalf maanden na aankoop in gebruik.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel62
  - number: '62.2'
    text: |-
      De producentenorganisatie toont de aanschaf van duurzame productiemiddelen aan de hand van facturen of
      afleverbonnen aan en verstrekt deze onverwijld aan de minister, indien de minister daar om verzoekt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel62
  - number: '63'
    text: |-
      Duurzame productiemiddelen die zijn gefinancierd met behulp van steun uit het actiefonds zijn toegankelijk voor
      alle leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel63
  - number: '64.1'
    text: |-
      Ter uitvoering van artikel 60, zesde lid, van [verordening 543/2011](onbekend) zijn duurzame productiemiddelen
      geplaatst op het bedrijf van een lid van een producentenorganisatie subsidiabel indien de producentenorganisatie
      schriftelijk met het lid overeenkomt dat het productiemiddel toegankelijk is voor al haar leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel64
  - number: '64.2'
    text: |-
      Investeringen in elementaire voorzieningen als afwateringssystemen, riolering, aansluiting op waterleiding en
      aansluiting op systemen voor datacommunicatie, die worden gezien als onmisbare elementen, op het bedrijf van een
      lid zijn:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel64
  - number: 64.2.a
    text: 100% subsidiabel indien zij zich bevinden op het erf en tot een afstand van vijfhonderd meter van de erfgrens, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel64
  - number: 64.2.b
    text: 50% subsidiabel indien zij zich bevinden op een afstand van meer dan vijfhonderd meter van de erfgrens.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel64
  - number: '65.1'
    text: |-
      Ter uitvoering van artikel 60, derde lid, van [verordening 543/2011](onbekend) zijn duurzame productiemiddelen
      subsidiabel indien het productiemiddel gedurende een piekperiode voor meer dan 50% wordt gebruikt voor producten
      waarvoor de producentenorganisatie is erkend.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: '65.2'
    text: 'Als piekperiode bedoeld in het eerste lid wordt vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: 65.2.a
    text: 'glasgroenten en asperges: mei tot en met augustus;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: 65.2.b
    text: 'zachtfruit: juni tot en met september;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: 65.2.c
    text: 'kersen: half mei tot en met half juli;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: 65.2.d
    text: 'vollegrondsteelten en jaarrondteelten: augustus tot en met november;'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: 65.2.e
    text: 'hardfruit: oktober tot en met januari.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: '65.3'
    text: |-
      De minister kan op eigen initiatief of op verzoek van een producentenorganisatie besluiten om voor bepaalde
      producten of duurzame productiemiddelen, in afwijking van het tweede lid, een andere piekperiode vast te stellen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel65
  - number: '66'
    text: |-
      Investeringen die voor 1 januari 2008 reeds in een operationeel programma waren opgenomen en ook na 1 januari 2008
      nog in een operationeel programma zijn opgenomen, zijn voor het deel dat betrekking heeft op de periode voor 1
      januari 2008 subsidiabel naar rato van het aandeel van de investering dat wordt gebruikt voor producten waarvoor de
      producentenorganisatie is erkend.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel66
  - number: '67.1'
    text: |-
      Producentenorganisatie tonen het gebruik van het duurzame productiemiddel tijdens de piekperiode, bedoeld in
      [artikel 65, eerste lid][ref1], aan met behulp van:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel65
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '65'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 67.1.a
    text: |-
      gebruiksadministraties per duurzaam productiemiddel voor productiemiddelen geplaatst op centrale locaties van de
      producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.1.b
    text: |-
      verklaringen van de aangesloten producenten omtrent het gebruik van het duurzaam productiemiddel voor
      productiemiddelen geplaatst op locaties van aangesloten producenten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.2'
    text: |-
      De producentenorganisatie geeft bij de indiening van het operationeel programma aan op welke wijze de
      gebruiksadministratie, bedoeld in het eerste lid, onderdeel a, gevoerd gaat worden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.3'
    text: |-
      De gebruiksadministratie, bedoeld in het eerste lid, onderdeel a, wordt bijgehouden gedurende de gehele periode,
      bedoeld in [artikel 65, eerste lid][ref1], en registreert per dag minimaal de volgende elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel65
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '65'
        hoofdstuk: '3'
        afdeling: '1'
  - number: 67.3.a
    text: het jaar;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.b
    text: het project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.c
    text: de locatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.d
    text: het soort productiemiddel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.e
    text: de aanschafdatum;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.f
    text: de leverancier, het merk, het type, het serienummer of registratienummer;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.g
    text: de hoeveelheid bewerkt of voorbereid product waarvoor de producentenorganisatie is erkend;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.h
    text: de hoeveelheid bewerkt of voorbereid product waarvoor de producentenorganisatie niet is erkend, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.3.i
    text: de totale hoeveelheid bewerkt of voorbereid product.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.4'
    text: |-
      De hoeveelheid bewerkt of voorbereid product, bedoeld in het derde lid, onderdelen g tot en met i, worden
      geregistreerd op:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.4.a
    text: productstromen op locatieniveau in geval van distributiecentra en gebouwen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.4.b
    text: palletregistraties in geval van koelcellen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: 67.4.c
    text: stuks, collie of kilogramregistraties, in geval van sorteerlijnen en verpakkingsmachines.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.5'
    text: |-
      De gebruiksadministratie wordt bij de indiening van de steunaanvraag, geaggregeerd per maand aan de minister
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.6'
    text: |-
      De minister kan, op eigen initiatief of op verzoek van een producentenorganisatie besluiten, in afwijking van het
      tweede, derde en vierde lid, andere voorschriften te stellen aan de gebruiksadministratie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
  - number: '67.7'
    text: |-
      Indien een duurzaam productiemiddel wordt aangeschaft na de piekperiode, bedoeld in [artikel 65, eerste lid][ref1],
      dan begint de gebruiksadministratie in het daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel65
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '65'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '68.1'
    text: |-
      Uitgaven voor het installeren en monteren van duurzame productiemiddelen en de bijkomende kosten van installatie en
      montage, waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden geactiveerd, zijn als onderdeel
      van het duurzame productiemiddel subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel68
  - number: '68.2'
    text: |-
      In afwijking van het eerste lid zijn uitgaven voor het installeren en monteren van duurzame productiemiddelen niet
      subsidiabel voor zover het gaat om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel68
  - number: 68.2.a
    text: service en onderhoud van duurzame productiemiddelen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel68
  - number: 68.2.b
    text: construction all risk verzekeringen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel68
  - number: '68.3'
    text: |-
      Uitgaven voor het demonteren van duurzame productiemiddelen zijn subsidiabel wanneer dit tot doel heeft het
      productiemiddel te verhuizen, reviseren, transporteren en opnieuw monteren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel68
  - number: '69.1'
    text: 'De producentenorganisatie neemt in de steunaanvraag alleen uitgaven op voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.1.a
    text: |-
      nieuwbouw of verbouw van gebouwen die eigendom zijn van de producentenorganisatie of een dochteronderneming die
      voor minimaal 90% eigendom is van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.1.b
    text: |-
      ruimtes die zijn aangemerkt als subsidiabel in [bijlage II][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0034320
  - number: 69.1.c
    text: |-
      elementen die zijn aangemerkt als subsidiabel in [bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0034320
  - number: '69.2'
    text: |-
      Uitgaven als bedoeld in deel 2 van [bijlage II][ref1] en kolom 2 van [bijlage III][ref2] zijn niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320
      [ref2]: https://wetten.overheid.nl/BWBR0034320
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0034320
      - id: ref2
        bwb_id: BWBR0034320
  - number: '69.3'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van het operationeel programma de subsidiabele uitgaven,
      bedoeld in het eerste lid, aan de hand van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.3.a
    text: bouwtekeningen, die aangegeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.3.b
    text: offertes van de aanneem- of bouwsom, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.3.c
    text: |-
      een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en niet
      subsidiabele oppervlakten en elementen en bijbehorende uitgaven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: '69.4'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag de subsidiabele uitgaven aan de hand
      van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.4.a
    text: bouwtekeningen die aangeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreffen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.4.b
    text: facturen op naam van de producentenorganisatie met vermelding van de aanneem- of bouwsom, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: 69.4.c
    text: |-
      een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en niet
      subsidiabele oppervlakte en elementen en bijbehorende uitgaven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel69
  - number: '70.1'
    text: |-
      De aankoop van onbebouwde grond, bedoeld in punt 6 van bijlage IX van [verordening 543/2011](onbekend), is
      subsidiabel indien deze grond daadwerkelijk wordt aangewend voor de realisatie van in het operationeel programma
      opgenomen investeringen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel70
  - number: '70.2'
    text: |-
      De aankoop van grond die wordt gebruikt voor onderdelen van investeringen die op grond van deel 2 van
      [bijlage II][ref1] en kolom 2 van [bijlage III][ref2] niet subsidiabel zijn, is niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320
      [ref2]: https://wetten.overheid.nl/BWBR0034320
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0034320
      - id: ref2
        bwb_id: BWBR0034320
  - number: '70.3'
    text: |-
      De producentenorganisatie toont bij de indiening van het operationeel programma aan de hand van bouwtekeningen
      of plattegronden aan welke delen van de grond worden aangewend voor in het operationeel programma opgenomen
      subsidiabele investeringen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel70
  - number: '70.4'
    text: |-
      De producentenorganisatie gebruikt de grond binnen de looptijd van het operationeel programma voor realisatie van
      de investering waarvoor de grond is aangekocht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel70
  - number: '71.1'
    text: |-
      Duurzame productiemiddelen die zijn gefinancierd of mede zijn gefinancierd door middel van het actiefonds zijn
      eigendom van de producentenorganisatie of van een dochteronderneming die voor minimaal 90% eigendom is van de
      producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: '71.2'
    text: 'Duurzame productiemiddelen worden geplaatst op een locatie:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: 71.2.a
    text: |-
      waar zij bijdragen aan de toegevoegde waarde en de waarde van de afgezette productie van de producentenorganisatie,
      en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: 71.2.b
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: 71.2.b.1
    text: eigendom is van de producentenorganisatie,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: 71.2.b.2
    text: eigendom is van haar leden, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: 71.2.b.3
    text: door de producentenorganisatie of haar leden wordt gehuurd of geleased.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: '71.3'
    text: |-
      Duurzame productiemiddelen die mede worden gefinancierd door rechtspersonen die een dochteronderneming zijn
      van meerdere erkende producentenorganisaties zijn subsidiabel naar rato van de aandelenverhoudingen tussen de
      betreffende producentenorganisaties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: '71.3'
    text: |-
      Duurzame productiemiddelen, bedoeld in het eerste lid, die mede zijn gefinancierd door rechtspersonen waarin bij de
      producentenorganisatie aangesloten producenten een belang hebben van meer dan 10% zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: '71.4'
    text: Kosten voor het vestigen van een recht van opstal zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel71
  - number: '72.1'
    text: |-
      Ter uitvoering van artikel 60, zesde lid, van [verordening 543/2011](onbekend) behoudt de producentenorganisatie
      of de dochteronderneming die voor minimaal 90% eigendom is van de producentenorganisatie gedurende vijf jaar
      na ingebruikname het eigendom en de volledige zeggenschap over duurzame roerende productiemiddelen die zijn
      gefinancierd met behulp van het actiefonds.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: '72.2'
    text: |-
      Ter uitvoering van artikel 60, zesde lid, van verordening 543/2011 behoudt de producentenorganisatie gedurende tien
      jaar na ingebruikname het eigendom en de volledige zeggenschap over duurzame onroerende productiemiddelen die zijn
      gefinancierd met behulp van het actiefonds.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: '72.3'
    text: |-
      In afwijking van het tweede lid blijft een duurzaam onroerend productiemiddel dat is gefinancierd met
      behulp van het actiefonds gedurende tenminste vijf jaar eigendom van de producentenorganisatie, indien
      de producentenorganisatie aantoont dat de investering geen economische restwaarde meer heeft voor de
      producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: '72.4'
    text: |-
      In afwijking van het tweede lid wordt de opbrengst van bomen en meerjarige planten geleverd aan de
      producentenorganisatie gedurende:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: 72.4.a
    text: |-
      vijf jaar, wanneer de boom of meerjarige plant op basis van de producteigenschappen gedurende vijf jaar of meer
      vruchten levert, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: 72.4.b
    text: |-
      de termijn gedurende welke de boom of meerjarige plant vruchten levert wanneer de boom of meerjarige plant op basis
      van de producteigenschappen gedurende minder dan vijf jaar vruchten levert.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: '72.5'
    text: |-
      De termijn, bedoeld in het eerste tot en met vierde lid, vangt aan op het moment van ingebruikname van de
      investering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel72
  - number: '73.1'
    text: |-
      Indien een producentenorganisatie het eigendom van een duurzaam productiemiddel, dat is gefinancierd
      of mede is gefinancierd door middel van het actiefonds, gedurende de periode, bedoeld in
      [artikel 72, eerste tot en met vierde lid][ref1], verliest, wordt de gesubsidieerde restwaarde van de investering
      gerecupereerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel72
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '72'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '73.2'
    text: 'De restwaarde wordt bepaald door een afschrijving:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: 73.2.a
    text: van 20% per jaar voor duurzame roerende productiemiddelen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: 73.2.b
    text: van 10% per jaar voor duurzame onroerende productiemiddelen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: 73.2.c
    text: |-
      naar rato van de resterende periode gedurende welke de boom of meerjarige plant volgens de producteigenschappen
      vruchten had moeten leveren in het geval van het rooien van bomen of meerjarige planten met een maximum van 5 jaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: '73.3'
    text: |-
      De afschrijving wordt naar rato van het aantal maanden dat een investering daadwerkelijk eigendom is geweest van de
      producentenorganisatie toegepast.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: '73.4'
    text: |-
      In afwijking van het tweede lid wordt de restwaarde, indien een producentenorganisatie minder steun heeft
      aangevraagd dan er op grond van de berekening op basis van het tweede lid moet worden terugbetaald, vastgesteld op
      het bedrag waarvoor steun is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: '73.5'
    text: |-
      In afwijking van het tweede lid wordt de restwaarde, indien het eigendom van een investering tenietgaat als gevolg
      van een oorzaak waarvoor de producentenorganisatie een uitkering van een verzekeraar ontvangt, vastgesteld op het
      bedrag aan ontvangen verzekeringspenningen, voor zover de verzekeringspenningen de ontvangen steun niet te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel73
  - number: '74.1'
    text: |-
      Ter uitvoering van artikel 60, zesde lid van [verordening 543/2011](onbekend), wordt, wanneer een producent op
      wiens terrein een duurzaam productiemiddel is geplaatst de producentenorganisatie verlaat, het op het terrein van
      de producent geplaatste duurzaam productiemiddel, herplaatst op een locatie van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel74
  - number: 74.1.a
    text: de producentenorganisatie, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel74
  - number: 74.1.b
    text: een aangesloten producent.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel74
  - number: '74.2'
    text: |-
      Indien herplaatsing als bedoeld in het eerste lid niet mogelijk is, is [artikel 73][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel73
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '73'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '75.1'
    text: |-
      Bij vervanging van duurzame productiemiddelen als bedoeld in artikel 60, vijfde lid van [verordening 543/2011]
      (onbekend) wordt de restwaarde van duurzame productiemiddelen die vervangen worden in mindering gebracht op de
      vervangingskosten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel75
  - number: '75.2'
    text: |-
      De restwaarde, bedoeld in het eerste lid, wordt bepaald volgens de voorschriften van
      [artikel 73, tweede tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel73
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '73'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '75.3'
    text: De vervanging van onderdelen van duurzame productiemiddelen is niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel75
  - number: '76.1'
    text: |-
      Een producentenorganisatie meldt de eerste keer dat uitgaven voor een investering in een duurzaam productiemiddel
      in een steunaanvraag wordt opgenomen aan de minister of zij het duurzaam productiemiddel:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: 76.1.a
    text: in één keer in een steunaanvraag opneemt, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: 76.1.b
    text: gedurende meerdere jaren in de steunaanvraag opneemt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: '76.2'
    text: |-
      Indien een producentenorganisatie uitgaven voor een investering in een duurzaam productiemiddel gedurende meerdere
      jaren in de steunaanvraag opneemt:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: 76.2.a
    text: |-
      meldt de producentenorganisatie bij ontvangst van de laatste factuur over hoeveel kwartalen de investering in het
      duurzaam productiemiddel ten laste van het actiefonds wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: 76.2.b
    text: |-
      wordt de investering in het duurzaam productiemiddel niet eerder in een steunaanvraag opgenomen dan op het moment
      van ingebruikname van het duurzaam productiemiddel, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: 76.2.c
    text: wordt het bedrag dat per kwartaal in de steunaanvraag wordt opgenomen lineair bepaald.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: '76.3'
    text: |-
      Het bedrag, bedoeld in het tweede lid, onderdeel c, wordt vastgesteld op het moment van oplevering van het duurzaam
      productiemiddel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: '76.4'
    text: |-
      Indien een producentenorganisatie een investering in duurzaam productiemiddel in één keer in de steunaanvraag
      opneemt wordt iedere ontvangen en betaalde factuur bij de eerst volgende declaratie volledig ten laste van het
      actiefonds gebracht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel76
  - number: '77.1'
    text: |-
      Uitgaven voor duurzame productiemiddelen, inclusief duurzame productiemiddelen die worden verworven door middel
      van langlopende leasecontracten, kunnen over meerdere operationele programma’s worden gespreid, indien de
      producentenorganisatie daarvoor gegronde economische redenen aanvoert.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel77
  - number: '77.2'
    text: |-
      Indien de duurzame productiemiddelen bestaan uit roerende zaken kunnen deze in maximaal 5 jaar ten laste van het
      actiefonds worden gebracht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel77
  - number: '77.3'
    text: |-
      Indien de duurzame productiemiddelen bestaan uit onroerende zaken kunnen deze in maximaal 10 jaar ten laste van het
      actiefonds worden gebracht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel77
  - number: '78.1'
    text: 'Tweedehands duurzame productiemiddelen zijn subsidiabel indien:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: 78.1.a
    text: het aanschafbedrag hoger is dan € 10.000, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: 78.1.b
    text: |-
      de producentenorganisatie bij indiening van de steunaanvraag aan de minister een verklaring van de verkopende
      partij overlegt dat voor de aankoop van het productiemiddel in de voorafgaande zeven jaren geen uniale steun of
      nationale subsidie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: '78.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, bedraagt de termijn waarbinnen geen uniale steun of nationale
      subsidie mag zijn ontvangen voor onroerende zaken tien jaar.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: '78.3'
    text: |-
      Tweedehands duurzame productiemiddelen die bij een aangesloten producent zijn aangeschaft zijn niet subsidiabel
      indien deze productiemiddelen vervolgens bij deze of een andere aangesloten producent worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: '78.4'
    text: Dit artikel is van overeenkomstige toepassing op investeringen die worden gehuurd of geleased.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel78
  - number: '79.1'
    text: 'Duurzame productiemiddelen op het terrein van ICT zijn subsidiabel indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.1.a
    text: 'hardware die:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.1.a.1
    text: een integraal onderdeel uitmaakt van subsidiabele installaties, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.1.a.2
    text: |-
      ondersteunend is voor subsidiabele activiteiten en op grond van offertes kan worden toegerekend aan deze
      activiteiten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.1.b
    text: |-
      software applicaties die ondersteunend is voor subsidiabele activiteiten die bijdragen aan handhaving van
      kwaliteit, milieubescherming of verbetering van de afzet en op grond van offertes kan worden toegerekend aan deze
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: '79.2'
    text: 'De producentenorganisatie toont bij de indiening van de steunaanvraag aan:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.2.a
    text: welke applicaties via de server gebruikt worden, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: 79.2.b
    text: wat het capaciteitsbeslag en het gebruik van de subsidiabele applicaties is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel79
  - number: '80.1'
    text: |-
      Uitgaven voor investeringen in uitgangsmateriaal van rassen van meerjarige gewassen en licenties voor het gebruik
      van zaden en plantgoed van nieuwe rassen van meerjarige gewassen die zijn opgenomen in het operationeel programma
      van een producentenorganisatie zijn subsidiabel, indien de bedoelde rassen:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel80
  - number: 80.1.a
    text: toegelaten zijn door de Stichting Nederlandse Algemene Kwaliteitsdienst voor de Tuinbouw;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel80
  - number: 80.1.b
    text: ingeschreven staan in het Nederlandse rassenregister van de Raad voor de plantenrassen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel80
  - number: 80.1.c
    text: ingeschreven staan bij een keuringsinstantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel80
  - number: '80.2'
    text: |-
      Op verzoek van de minister overlegt de producentenorganisatie voor de zaden en het plantgoed, bedoeld in het eerste
      lid, het plantenpaspoort, bedoeld in richtlijn 2000/29.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel80
  - number: '81'
    text: |-
      Producentenorganisaties houden voor alle duurzame productiemiddelen die zijn opgenomen in een lopend operationeel
      programma, met gebruikmaking van een door de minister beschikbaar gesteld middel, een actueel register bij.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel81
  - number: '82.1'
    text: |-
      Een producentenorganisatie die uitgaven voor investeringen in installaties voor energiebesparende projecten
      opneemt in haar operationeel programma voegt aan de onderbouwing van het plan, bedoeld in [artikel 47][ref1], een
      energiebalans toe, waarin wordt vermeld wat de beginsituatie en de verwachte situatie is, op basis van een door
      een deskundige:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: 82.1.1
    text: opgestelde technische specificatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: 82.1.2
    text: gemaakte berekening van de verwachte energiestromen en de verwachte energiebesparing.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: '82.2'
    text: |-
      Ter verantwoording van de gerealiseerde energiebesparing overlegt de producentenorganisatie bij de steunaanvraag
      die wordt ingediend nadat de installaties één jaar in bedrijf zijn gesteld, het volgende:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: 82.2.a
    text: |-
      het declaratieformulier energiebesparende investeringen, met gebruikmaking van een door de minister beschikbaar
      gesteld middel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: 82.2.b
    text: |-
      een overzicht van de bereikte energiebesparing volgens de geactualiseerde energiebalans, met gebruikmaking van een
      door de minister beschikbaar gesteld middel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: 82.2.c
    text: |-
      de jaaropgave van het energieverbruik in het kader van de uniforme milieuregistratie die is overgelegd aan de
      Uitvoeringsorganisatie Glastuinbouw en Milieu en het voor deze registratie bijgehouden logboek of de meest recente
      jaarafrekening van de energieleverancier.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: '82.3'
    text: |-
      Indien een afwijking van de verwachte energiebesparing, bedoeld in het eerste lid, door de producentenorganisatie
      onvoldoende gemotiveerd wordt kan de minister uitgaven voor investeringen als bedoeld in het eerste lid niet
      subsidiabel oordelen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel82
  - number: '83.1'
    text: |-
      In afwijking van [artikel 76, eerste lid][ref1], worden uitgaven voor investeringen in een energiebesparende
      installatie vanaf het moment van investeren lineair over een periode van vijf jaar ten laste van het actiefonds
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel76
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '76'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '83.2'
    text: |-
      Indien de totale hoeveelheid aan derden geleverde energie die wordt opgewekt met de in het eerste lid bedoelde
      installatie groter is dan de totale hoeveelheid energie die door het lid waar de investering is geplaatst van
      energieleveranciers is afgenomen, wordt de opbrengst van de netto energielevering aan derden van energie die wordt
      opgewekt met de in het eerste lid bedoelde installatie lineair over een periode van vijf jaar in mindering gebracht
      op de in het eerste lid bedoelde uitgaven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel83
  - number: '83.3'
    text: |-
      Wanneer de energie die wordt opgewekt met de in het eerste lid bedoelde installatie uitsluitend op het teeltbedrijf
      zelf gebruikt wordt, overlegt de producentenorganisatie aan de minister jaarlijks bij het indienen van de
      steunaanvraag, vanaf het jaar waarin de installatie een jaar in gebruik is, de energiebalans waaruit blijkt dat er
      geen warmte of elektriciteit is geleverd aan derden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel83
  - number: '83.4'
    text: |-
      In afwijking van het eerste lid is het toegestaan om de uitgaven voor investeringen in een energiebesparende
      installatie, waarmee geen energie wordt opgewekt, in één keer ten laste van het actiefonds te brengen, indien
      de producentenorganisatie aan de minister aantoont dat de investering niet leidt tot het leveren van energie aan
      derden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel83
  - number: '83.5'
    text: Dit artikel is van toepassing op investeringen gedaan op of na 10 september 2011.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel83
  - number: '84.1'
    text: |-
      Uitgaven voor investeringen in een energiebesparende installatie uitgevoerd door middel van een participatie in een
      samenwerkingsverband van agrarische bedrijven met energieclustering zij subsidiabel voor 50%.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel84
  - number: '84.2'
    text: |-
      Een agrarisch samenwerkingsverband als bedoeld in het eerste lid omvat ook een leveringsovereenkomst tussen
      agrarische bedrijven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel84
  - number: '84.3'
    text: |-
      In geval van participatie in een samenwerkingsverband van agrarische bedrijven wordt de waarde van de investering
      in de participatie lineair over een periode van 5 jaar in de steunaanvraag opgenomen, onder aftrek van de genoten
      opbrengsten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel84
  - number: '84.4'
    text: |-
      In afwijking van het derde lid is het toegestaan om de uitgaven, bedoeld in het eerste lid voor investeringen in
      energiebesparende installaties, waarmee geen energie wordt opgewekt, in één keer ten laste van het actiefonds te
      brengen, indien de producentenorganisatie aan de minister aantoont dat de investering niet leidt tot het leveren
      van energie aan derden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel84
  - number: '85.1'
    text: |-
      Een producentenorganisatie die uitgaven voor investeringen in installaties voor verbeterde waterkwaliteit,
      waterbesparing of besparing op het mineralenverbruik opneemt in haar operationeel programma voegt aan de
      onderbouwing van het plan, bedoeld in [artikel 47][ref1], een prognose toe van de verwachte verbetering of
      besparing per installatie, aan de hand van een technische specificatie van de leverancier of deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: '85.2'
    text: |-
      Ter verantwoording van de gerealiseerde verbetering van de waterkwaliteit of de waterzuivering, of van de
      gerealiseerde besparing op het waterverbruik of het mineralenverbruik overlegt de producentenorganisatie bij de
      steunaanvraag die wordt ingediend nadat de installaties één jaar in gebruik zijn genomen, het volgende:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: 85.2.a
    text: |-
      het declaratieformulier installaties waterkwaliteit, waterbesparing, waterzuivering en fertigatie in de fruitteelt,
      met gebruikmaking van een door de minister beschikbaar gesteld middel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: 85.2.b
    text: |-
      een overzicht van de bereikte verbetering of besparing per installatie, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de hand van een vergelijking van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: 85.2.b.1
    text: een meting van de situatie voor de ingebruikname van de installatie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: 85.2.b.2
    text: een meting van de gerealiseerde situatie na de ingebruikname van de installatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: '85.3'
    text: |-
      In geval van leidingwater wordt de bereikte waterbesparing onderbouwd aan de hand van de jaarafrekening van het
      waterleidingbedrijf.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
  - number: '85.4'
    text: |-
      Indien uitgaven voor investeringen in duurzame productiemiddelen op grond van [titel 1 van hoofdstuk 4][ref1]
      van dit deel subsidiabel zijn wanneer een waterbesparing of energiebesparing van 25% wordt gerealiseerd, wordt de
      besparing berekend in het kader van en op het niveau van de investering.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: '86.1'
    text: |-
      Uitgaven voor de inhuur van externen zijn subsidiabel, indien de voor uitvoering van een activiteit benodigde
      kennis of capaciteit bij een producentenorganisatie niet voldoende aanwezig is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel86
  - number: '86.2'
    text: |-
      Externen als bedoeld in het eerste lid beschikken minimaal over het opleidingsniveau, bedoeld in
      [artikel 59, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel59
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '59'
        hoofdstuk: '3'
  - number: '86.3'
    text: |-
      Producentenorganisaties geven in het operationeel programma aan welke specifieke taken aan externe diensten worden
      uitbesteed.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel86
  - number: '86.4'
    text: |-
      De minister kan een producentenorganisatie, ten behoeve van de beoordeling van de subsidiabiliteit van uitgaven
      voor de inhuur van externen, verzoeken om aanvullende informatie en bewijsstukken te overleggen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel86
  - number: '87.1'
    text: |-
      Uitgaven voor kilometers gereden met de eigen auto door leden en medewerkers van de producentenorganisatie zijn
      subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.1.a
    text: deze leden en medewerkers in het operationeel programma zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.1.b
    text: de kilometers zijn gemaakt in het kader van een in het operationeel programma opgenomen activiteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.1.c
    text: de vergoedingen daadwerkelijk aan de medewerker of het lid zijn uitbetaald;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.1.d
    text: de vergoeding maximaal € 0,19 per kilometer bedraagt, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.1.e
    text: |-
      er een deugdelijke kilometeradministratie is bijgehouden die is geaccordeerd door de projectleider of
      leidinggevende die verantwoordelijk is voor de uitvoering van de activiteit en een andere persoon is dan de persoon
      die de reis heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: '87.2'
    text: |-
      Uitgaven voor vliegtickets voor buitenlandse dienstreizen, plaatsbewijzen voor het openbaar vervoer en tickets voor
      veerboten zijn subsidiabel op basis van de economy class prijzen van deze tickets of plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: '87.3'
    text: |-
      Producentenorganisaties kunnen voor uitgaven voor verblijfkosten voor dienstreizen en excursies in binnenland
      en EU-lidstaten door medewerkers en aangesloten leden forfaitaire vergoedingen verstrekken binnen de maxima van
      [artikel 5 van de Reisregeling Binnenland][ref1] en [artikel 3 van de Reisregeling Buitenland][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005912#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006914#Artikel3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005912
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006914
        artikel: '3'
  - number: '87.4'
    text: |-
      De in het tweede en derde lid bedoelde uitgaven worden, met uitzondering van de vergoeding toegekend voor
      dagkosten, bij indiening van de steunaanvraag onderbouwd aan de hand van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.4.a
    text: facturen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: 87.4.b
    text: vervoersbewijzen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: '87.5'
    text: Kosten voor auto’s in eigendom van of geleased dan wel gehuurd door de PO zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel87
  - number: '88.1'
    text: |-
      Uitgaven voor overige kosten op het gebied van ICT zijn subsidiabel voor zover deze ICT voorzieningen ondersteunend
      zijn voor subsidiabele activiteiten en op grond van offertes kunnen worden toegerekend aan deze activiteiten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel88
  - number: '88.2'
    text: |-
      Jaarlijkse licentiekosten en abonnementen voor software applicaties als bedoeld in
      [artikel 79, eerste lid, onderdeel b][ref1], zijn voor maximaal 50% subsidiabel indien het uitgaven voor
      subsidiabele applicaties en modules betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel79
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '79'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '88.3'
    text: Onderhoudsabonnementen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel88
  - number: '89.1'
    text: |-
      Uitgaven voor investeringen in uitgangsmateriaal voor rassen van eenjarige gewassen en licenties voor het gebruik
      van zaden en plantgoed van nieuwe rassen van eenjarige gewassen die zijn opgenomen in het operationeel programma
      van een producentenorganisatie zijn subsidiabel, indien de bedoelde rassen:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel89
  - number: 89.1.a
    text: toegelaten zijn door de Stichting Nederlandse Algemene Kwaliteitsdienst voor de Tuinbouw;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel89
  - number: 89.1.b
    text: ingeschreven staan in het Nederlandse rassenregister van de Raad voor de plantenrassen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel89
  - number: 89.1.c
    text: ingeschreven staan bij een keuringsinstantie van een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel89
  - number: '89.2'
    text: |-
      Op verzoek van de minister overlegt de producentenorganisatie voor de zaden en het plantgoed, bedoeld in het eerste
      lid, het plantenpaspoort, bedoelt in richtlijn 2000/29.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel89
  - number: '90'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het strategisch doel, bedoeld in
      [artikel 43, eerst lid, onderdeel a][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder vii, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 90.a
    text: |-
      [hoofdstuk 3][ref1] van dit deel, en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 90.b
    text: deze titel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel90
  - number: '91'
    text: |-
      De minister kan subsidie voor in het operationeel programma opgenomen milieuacties aanpassen wanneer het relevante
      referentieniveau wijzigt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel91
  - number: '92.1'
    text: |-
      De producentenorganisatie voert activiteiten ter realisatie van het strategisch doel, bedoeld in
      [artikel 43, eerst lid, onderdeel a][ref1], uit gedurende de gehele looptijd van het operationeel programma.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '4'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '92.2'
    text: |-
      De activiteiten, bedoeld in het eerste lid, worden tevens in een volgend operationeel programma opgenomen, indien
      dit noodzakelijk is om de looptijd te bereiken die van toepassing is op grond van artikel 28, vijfde lid, van
      verordening 1305/2013.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel92
  - number: '92.3'
    text: |-
      De producentenorganisatie gebruikt de technische middelen, met uitzondering van vaste activa, waarvoor
      subsidie wordt verstrekt voor uitvoering van activiteiten ter realisatie van het strategisch doel, bedoeld in
      [artikel 43, eerst lid, onderdeel a][ref1], gedurende de hele periode, bedoeld in artikel 28, vijfde lid, van
      verordening 1305/2013, voor de doeleinden zoals goedgekeurd in het operationeel programma.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: '93'
    text: |-
      Investeringen in duurzame productiemiddelen die op grond van deze afdeling subsidiabel zijn kunnen gedurende de
      bedrijfseconomische levensduur vervangen worden, indien er significante milieuvoordelen zijn.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel93
  - number: '94.1'
    text: |-
      Uitgaven voor investeringen in innovatieve en emissiebeperkende gewasbeschermingsapparatuur zijn subsidiabel
      indien deze investeringen tot doel hebben om het gebruik van chemische bestrijdingsmiddelen te verminderen of te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: '94.2'
    text: 'Als innovatieve en emissiebeperkende gewasbeschermingsapparatuur wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.a
    text: spuitapparatuur;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.b
    text: UV-licht ter bestrijding van schimmelziekten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.c
    text: mechanische onkruidbestrijdingsapparatuur,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.d
    text: |-
      GPS systemen in het kader van de precisielandbouwtechnieken, indien de inzet van GPS systemen leidt tot positieve
      effecten op het milieu of de kwaliteit van producten door aantoonbaar toepassen van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.d.1
    text: precisie zaaien of planten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.d.2
    text: precisietoediening van meststoffen en gewasbeschermingsmiddelen en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.d.3
    text: precisie mechanische onkruidbestrijding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.e
    text: |-
      apparatuur voor het elektrochemisch activeren van een zwakke oplossing van natriumchloride in onthard water in
      combinatie met een vernevelaar ter bestrijding van micro organismen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: 94.2.f
    text: apparatuur om looftrekdoeken te ontsmetten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: '94.3'
    text: |-
      Spuitleidingen en het transportsysteem voor het verplaatsen naar de volgende rij of afdeling van spuitrobots en UV
      belichtingswagens zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: '94.4'
    text: In geval van opgebouwde zelfrijdende landbouwspuitmachines is uitsluitend het spuitsysteem subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: '94.5'
    text: |-
      De uitgaven van de producentenorganisatie voor GPS systemen in het kader van de precisielandbouwtechnieken, bedoeld
      in het tweede lid, onderdeel d, zijn voor 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel94
  - number: '95.1'
    text: |-
      De producentenorganisatie onderbouwt de emissiebeperking, bedoeld in [artikel 94, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel94
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '94'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 95.1.a
    text: |-
      bij de indiening van het operationeel programma of voorafgaand aan de uitvoering van de investering aan de hand van
      bij het betreffende merk of type apparatuur uitgevoerd onafhankelijk onderzoek, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: 95.1.b
    text: |-
      door bij de indiening van de steunaanvraag een jaarlijkse opgave van het totale gebruik aan werkzame stof in
      kilogram per hectare van het betrokken teeltbedrijf te overleggen waarbij de nulsituatie wordt weergegeven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: '95.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan de minister indien er geen onafhankelijk onderzoek beschikbaar
      is, bij de beoordeling van de steunaanvraag van een betrokken teeltbedrijf een meerjarige spuitregistratie opvragen
      ter vergelijking van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: 95.2.a
    text: |-
      het gewasbeschermingsmiddelenverbruik in het jaar voorafgaand aan het jaar van inbedrijfstelling van de
      investering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: 95.2.b
    text: 'het gewasbeschermingsmiddelenverbruik gedurende het jaar:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: 95.2.b.1
    text: van ingebruikname van de investering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: 95.2.b.2
    text: volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: '95.3'
    text: |-
      De nulsituatie, bedoeld in het eerste lid, onderdeel b, is het gemiddelde gebruik aan werkzame stof in kilogram per
      hectare van het betrokken teeltbedrijf over 3 voorgaande jaren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel95
  - number: '96'
    text: |-
      Uitgaven voor hygiënesluizen en hygiënestations ter voorkoming van insleep van ziekten in kassen door medewerkers
      en bezoekers zijn subsidiabel indien de sluis de enige toegang vormt tot de te betreden ruimte onder quarantaine.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel96
  - number: '97.1'
    text: |-
      Uitgaven van de producentenorganisatie voor insectengaas bij vollegrondsteelten ter wering van insecten zijn
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel97
  - number: '97.2'
    text: De uitgaven van de producentenorganisatie voor vliesdoek zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel97
  - number: '98.1'
    text: 'Uitgaven voor investeringen in duurzame energie zijn subsidiabel indien:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: 98.1.a
    text: |-
      de specificatie van de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie
      ingekocht op het net van minimaal 25% geeft, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: 98.1.b
    text: 'het gaat om onder meer:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: 98.1.b.1
    text: zonnepanelen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: 98.1.b.2
    text: zonnecollectoren, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: 98.1.b.3
    text: windmolens.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: '98.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 10% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: '98.3'
    text: |-
      In geval van een investering in een installatie voor zonne-energie als bedoeld in het eerste lid, onderdelen a en
      b, zijn de kosten van de installatie zelf en het draagmateriaal subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: '98.4'
    text: |-
      Uitgaven voor aanpassing aan het gebouw en een installatie voor zonne-energie op het dak van een nabijgelegen
      bedrijf van een derde zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel98
  - number: '99.1'
    text: |-
      Uitgaven voor investeringen in warmte-krachtkoppeling installaties zijn subsidiabel indien de specificatie van
      de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van
      minimaal 25% geeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel99
  - number: '99.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 10% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel99
  - number: '99.3'
    text: Uitgaven voor bouwkundige voorzieningen bij aanschaf van warmte-krachtkoppeling installaties zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel99
  - number: '100.1'
    text: |-
      Uitgaven voor investeringen in aardwarmte zijn subsidiabel indien de specificatie van de investering een reductie
      van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van minimaal 25% geeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel100
  - number: '100.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 10% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel100
  - number: '100.3'
    text: 'Uitgaven voor investeringen voor aansluiting van het teeltbedrijf op een geothermische bron zijn subsidiabel voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel100
  - number: 100.3.a
    text: 100% tot een afstand van 500 meter van de erfgrens, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel100
  - number: 100.3.b
    text: 50% vanaf 500 meter van de erfgrens.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel100
  - number: '101.1'
    text: |-
      Uitgaven voor investeringen in aanvullende meetapparatuur voor metingen in de kas ter voorkoming van schade aan
      gewassen is subsidiabel indien deze apparatuur extreem gevoelig is voor NO, NO, CH en CO en waarden kleiner dan
      5.000 microgram per liter meet.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel101
  - number: '101.2'
    text: 'De producentenorganisatie onderbouwt de emissie na rookgasreiniging:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel101
  - number: 101.2.a
    text: bij de indiening van het operationeel programma aan de hand van de specificatie van de leverancier vooraf, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel101
  - number: 101.2.b
    text: bij de indiening van de steunaanvraag aan de hand van de metingen van de emissieconcentratie na ingebruikstelling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel101
  - number: '101.3'
    text: |-
      Uitgaven van de producentenorganisatie voor voorzieningen voor distributie en regeling van CO in de kas zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel101
  - number: '102.1'
    text: |-
      Uitgaven voor investeringen in rookgasreinigers en bijbehorende meetapparatuur voor de afvang van CO voor
      stookinstallaties zijn voor 50% subsidiabel indien de afgevangen CO wordt aangewend voor dosering aan het gewas in
      de kassen van het betreffende teeltbedrijf of cluster van teeltbedrijven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel102
  - number: '102.2'
    text: |-
      Uitgaven voor aansluitingen, bedoeld in het eerste lid, zijn in geval van participatie in een samenwerkingsverband
      van agrarische bedrijven met CO clustering voor 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel102
  - number: '102.3'
    text: |-
      Uitgaven van de producentenorganisatie voor voorzieningen voor distributie en regeling van CO in de kas zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel102
  - number: '103.1'
    text: |-
      Uitgaven voor investeringen op bedrijven, anders dan glastuinbouwbedrijven, in warmtepompen, warmtewisselaars,
      warmte- en koudebuffering zijn subsidiabel indien de specificatie van de investering een reductie van het
      energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van minimaal 25% geeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel103
  - number: '103.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 10% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel103
  - number: '104.1'
    text: |-
      Uitgaven voor investeringen in het kader van het programma ‘Kas als Energiebron’ of ‘Het nieuwe telen’ zijn
      subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.a
    text: |-
      de specificatie van de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie
      ingekocht op het net van minimaal 25% geeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b
    text: 'het gaat om installaties ten behoeve van semi-gesloten kassen die een combinatie vormen van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.1
    text: buitenluchtaanzuiging in combinatie met een tweede beweegbaar energiescherm;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.2
    text: energiebesparend ventilatiesysteem met warmteterugwinning of voorverwarming;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.3
    text: luchtbehandelingsystemen ter ontvochtiging van lucht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.4
    text: |-
      hogedrukvernevelingsysteem met een adiabatische koeling waarbij de druppelgrootte 5 tot maximaal 15 micron
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.5
    text: warmtewisselingsysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.6
    text: warmtepomp;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.7
    text: seizoensopslagsysteem voor warmte en koude;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.8
    text: warmtebuffertank;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.9
    text: tweede energiescherm, waarbij de energiebesparing met het doek dicht minimaal 45% bedraagt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.10
    text: |-
      eerste energiescherm voor bedrijven met een verbruik van minder dan 25 Nm3 aardgasequivalent/m2, waarbij de
      energiebesparing met het doek dicht minimaal 35% bedraagt, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: 104.1.b.11
    text: gevelscherm, waarbij de energiebesparing met het scherm dicht minimaal 40% bedraagt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: '104.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 10% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: '104.3'
    text: Het scherm, bedoeld in het eerste lid, onderdeel b, onder 9 tot en met 11, is geen scherm voor lichtafscherming.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: '104.4'
    text: |-
      De vervanging van bestaande schermen, bedoeld in het eerste lid, onderdeel b, onder 9 tot en met 11, is niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel104
  - number: '105'
    text: Uitgaven voor investeringen in zelfpersende containers zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel105
  - number: '106.1'
    text: 'Uitgaven voor investeringen in innovatieve installaties ten behoeve van waterbesparing zijn subsidiabel indien:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.1.a
    text: de specificatie van de investering een reductie van het waterverbruik van minimaal 25% geeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.1.b
    text: |-
      de investeringen gericht zijn op de vervanging of de modernisering van bestaande systemen met het doel het
      waterverbruik te verminderen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.1.c
    text: 'het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.1.c.1
    text: bodemvochtsensoren in de vollegrondsteelt, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.1.c.2
    text: installaties gericht op het hergebruik van spoelwater bij het afleveringsklaar maken van geoogst product.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: '106.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan de minister in uitzonderlijke gevallen een reductie van het
      waterverbruik van minimaal 10% toestaan, indien de activiteit andere milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: '106.3'
    text: |-
      Het vaststellen van waterbesparing, gemeten in m³, als gevolg van een investering als bedoeld in het eerste lid
      vindt plaats op basis van een vergelijking tussen:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.3.a
    text: het waterverbruik van de 12 maanden voorafgaand aan het jaar van inbedrijfstelling van de investering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.3.b
    text: 'het waterverbruik gedurende het jaar:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.3.b.1
    text: na ingebruikname van de investering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: 106.3.b.2
    text: volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel106
  - number: '107.1'
    text: |-
      Uitgaven voor investeringen in installaties ten behoeve van het zuiveren van water voorafgaand aan lozing zijn
      subsidiabel indien het bevoegd gezag heeft bepaald dat de verplichting om water dat gewasbeschermingsmiddelen
      bevat, voorafgaand aan het lozen door een zuiveringsvoorziening te leiden die ten minste 95% van de werkzame
      stoffen die bestaan uit organische verbindingen, uit het afvalwater verwijdert, voor de desbetreffende inrichting
      niet geldt en de specificatie van de investering een reductie van de emissie van afvalstoffen in het geloosde
      afvalwater van minimaal 25% geeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel107
  - number: '107.2'
    text: |-
      In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van de emissie van
      afvalstoffen in het geloosde afvalwater van minimaal 10% toestaan, indien de activiteit andere milieuvoordelen
      waarborgt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel107
  - number: '107.3'
    text: |-
      In geval van waterzuivering als bedoeld in het eerste lid overlegt de producentenorganisatie, bij indiening van
      de steunaanvraag aan de minister, een opgave van de emissiereductie van afvalstoffen in het geloosde afvalwater.
      De reductie wordt vastgesteld aan de hand van een vergelijking van de metingen voor inbedrijfstelling van de
      investering en direct na inbedrijfstelling van de investering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel107
  - number: '108'
    text: |-
      Ter uitvoering van artikel 58, vierde lid, van [verordening 543/2011](onbekend) kunnen in uitzonderlijke gevallen
      de werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat dit, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel108
  - number: '109.1'
    text: |-
      Uitgaven voor aankoop van mest en compost afkomstig van door de Stichting Skal, bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1], gecertificeerde biologische landbouwbedrijven zijn
      subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
  - number: '109.2'
    text: |-
      De producentenorganisatie toont de biologische oorsprong van mest en compost bij de indiening van de steunaanvraag
      aan door middel van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.a
    text: een factuur en een afleverbon met vermelding van Skalnummer en ‘eko’ of ‘bio’;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.b
    text: het Skal certificaat van de leverancier, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.c
    text: 'een opgave per deelnemende producent van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.c.1
    text: het areaal GMO waardige gewassen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.c.2
    text: de hoeveelheid en het type mest of compost, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: 109.2.c.3
    text: de opgevoerde kosten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: '109.3'
    text: |-
      In afwijking van het tweede lid, onderdeel b, kan de producentenorganisatie in plaats van Skal certificaten een
      lijst van Skal gecertificeerde leveranciers en Skalnummers overleggen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: '109.4'
    text: |-
      De uitgaven van de producentenorganisatie, bedoeld in het eerste lid, voor geconcentreerde handelsmeststoffen zijn
      niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel109
  - number: '110.1'
    text: |-
      Uitgaven voor het verbeteren van de bodemvruchtbaarheid door het activeren van bodemleven door middel van het
      toedienen van micro-organismen zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel110
  - number: '110.2'
    text: |-
      De producentenorganisatie verzoekt de minister vooraf om goedkeuring van de micro-organismen, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel110
  - number: '111.1'
    text: |-
      Uitgaven voor biologische vermeerdering en opkweek van uitgangsmateriaal en de niet-chemische behandeling
      bij zaden van gangbare oorsprong zijn subsidiabel indien zij door de Stichting Skal, bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1], gecertificeerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
  - number: '111.2'
    text: Voor de uitgaven, bedoeld in het eerste lid, geldt een forfaitair tarief van 25%.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
  - number: '111.3'
    text: |-
      De producentenorganisatie toont de biologische oorsprong van uitgangsmateriaal bij de indiening van de
      steunaanvraag aan door middel van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
  - number: 111.3.a
    text: |-
      een factuur en een afleverbon met vermelding van Skalnummer en ‘eko’ of ‘bio’ en, indien van toepassing, ‘niet
      chemisch behandeld’, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
  - number: 111.3.b
    text: het Skal certificaat van de leverancier.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
  - number: '111.4'
    text: |-
      In afwijking van het derde lid, onderdeel b, kan de producentenorganisatie in plaats van Skal certificaten een
      lijst van Skal gecertificeerde leveranciers en Skalnummers overleggen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel111
  - number: '112'
    text: |-
      Ter uitvoering artikel 58, vierde lid, van [verordening 543/2011](onbekend) kunnen in uitzonderlijke gevallen de
      werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat het, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel112
  - number: '113.1'
    text: |-
      Uitgaven voor zaden van rassen met één of meerdere extra resistenties met als doel vermindering van het gebruik van
      chemische gewasbeschermingsmiddelen zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel113
  - number: '113.2'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van het operationeel programma aan de hand van schriftelijke
      bewijsstukken, dat het ras, bedoeld het eerste lid, beschikt over één of meerdere extra resistenties ten opzichte
      van de belangrijkste standaardrassen aan de hand van een vergelijking tussen deze rassen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel113
  - number: '113.3'
    text: |-
      De producentenorganisatie beschikt over de afleverbonnen of plantenpaspoorten van zaden als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel113
  - number: '114.1'
    text: |-
      Voor de rassen, bedoeld in [artikel 113, eerste lid][ref1], zijn de meerkosten ten opzichte van een standaardras
      zonder extra resistentie subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel113
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '113'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '114.2'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, de meerkosten, bedoeld in het eerste lid, door middel van een vergelijking
      tussen de kosten van de belangrijkste standaardrassen en het ras met de extra resistentie, bedoeld in
      [artikel 113, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel113
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '113'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '114.3'
    text: De vergelijking, bedoeld in het tweede lid, wordt gemaakt per ras en per leverancier.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel114
  - number: '114.4'
    text: |-
      De kosten van gecoat zaad worden bij de prijsvergelijking, bedoeld in het derde lid, onderdeel a, buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel114
  - number: '114.5'
    text: |-
      De producentenorganisatie beschikt over de afleverbonnen van het zaad, bedoeld in [artikel 113, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel113
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '113'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '115.1'
    text: |-
      Uitgaven voor het enten van plantmateriaal met als doel het verminderen van het gebruik van chemische
      gewasbeschermingsmiddelen zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel115
  - number: '115.2'
    text: |-
      De onderverdeling van rassen in tariefgroepen vindt plaats op basis van het rassenregister van de Raad voor de
      Plantenrassen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel115
  - number: '115.3'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag de uitgaven, bedoeld in het eerste lid,
      met gebruikmaking van een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel115
  - number: '115.4'
    text: |-
      De producentenorganisatie beschikt over de afleverbonnen van het plantmateriaal, bedoeld in het eerste lid, en
      overlegt deze desgevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel115
  - number: '116'
    text: |-
      Uitgaven voor middelen voor biologische of geïntegreerde gewasbescherming en het voorkomen van ziekten en plagen
      zijn subsidiabel indien het uitgaven betreft voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: 116.a
    text: |-
      macrobiologische bestrijders en aaltjes, die zijn toegelaten op grond van de
      [Regeling vrijstelling beschermde dier- en plantensoorten Flora- en faunawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0013486
  - number: 116.b
    text: |-
      microbiologische bestrijders die zijn toegelaten op grond van de [Wet gewasbeschermingsmiddelen en biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: 116.c
    text: |-
      overige gewasbeschermingsmiddelen van natuurlijke oorsprong die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: 116.d
    text: |-
      middelen voor feromoonverwarring die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0021670
  - number: 116.e
    text: feromonen als lokstof in vallen of op rollertraps en vangplaten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: 116.f
    text: vangplaten en rollertraps;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: 116.g
    text: kalkmelk voor de fruitteelt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: 116.h
    text: organismen, voeding en middelen voor dosering ter ondersteuning van biologische gewasbescherming, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: 116.i
    text: bakken om eitjes, poppen of larven van fruitvliegen te doden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel116
  - number: '117.1'
    text: |-
      Uitgaven voor biologische of geïntegreerde gewasbescherming en het voorkomen van ziekten en plagen zijn subsidiabel
      indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.1.a
    text: verblazingsapparatuur voor het effectief doseren van natuurlijke vijanden;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.1.b
    text: een scoutbox voor automatische detectie en diagnose van plagen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.1.c
    text: vlieglampen en sporenfilters voor de champignonteelt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: '117.2'
    text: 'In afwijking van het eerste lid zijn de volgende uitgaven niet subsidiabel:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.2.a
    text: afdichtingsmateriaal ten behoeve van het afdichten van champignoncellen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.2.b
    text: messen ter voorkoming van verspreiding van virussen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: 117.2.c
    text: grondstomen en stomen van materialen in de kas.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: '117.3'
    text: |-
      Uitgaven voor een softwarelicentie voor een scoutbox als bedoeld in het eerste lid onderdeel b, zijn voor 50%
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel117
  - number: '118.1'
    text: |-
      Voor de uitgaven, bedoeld in [artikel 116][ref1] en [117, eerste lid][ref2], geldt een forfaitair tarief van:






                    Uitvoeringsjaar


                    Forfaitair tarief






                    2017


                    40%




                    2018


                    40%




                    2019


                    20%




                    2020


                    20%


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel117
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '116'
        hoofdstuk: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '117'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '118.2'
    text: |-
      De producentenorganisatie onderbouwt het effect van biologische en geïntegreerde bestrijding als bedoeld in
      [artikel 116][ref1] en [117, eerste lid][ref2], op het terugdringen van het gebruik van werkzame stof uit chemische
      gewasbeschermingsmiddelen, met gebruikmaking van een door de minister beschikbaar gesteld middel, aan de hand
      van een jaarlijkse opgave van het totale gebruik aan werkzame stof in kilogram per hectare, uitgesplitst naar
      gewas(groep) aan de hand van registraties van de teeltbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel117
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '116'
        hoofdstuk: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '117'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '118.3'
    text: |-
      De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag de uitgaven, bedoeld in
      [artikel 116][ref1] en [117, eerste lid][ref2], met gebruikmaking van een door de minister beschikbaar gesteld
      middel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel117
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '116'
        hoofdstuk: '4'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '117'
        hoofdstuk: '4'
        afdeling: '4'
  - number: '119'
    text: Uitgaven voor materialen, monitoring en begeleiding van biologische grondontsmetting zijn voor 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel119
  - number: '120'
    text: |-
      Ter uitvoering van artikel 58, vierde lid, van [verordening 543/2011](onbekend) kunnen in uitzonderlijke gevallen
      de werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat het, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel120
  - number: '121.1'
    text: |-
      Uitgaven voor de meerkosten van biologisch afbreekbaar folie bestemd voor onkruidbestrijding ten opzichte van
      kunststoffolie zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel121
  - number: '121.2'
    text: |-
      De meerkosten, bedoeld in het eerste lid, worden door de producentenorganisatie bij het indienen van de
      steunaanvraag aangetoond aan de hand van offertes en facturen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel121
  - number: '122.1'
    text: 'De producentenorganisatie geeft bij de indiening van de steunaanvraag aan:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel122
  - number: 122.1.a
    text: of zij declareert op ingaande of uitgaande fuststromen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel122
  - number: 122.1.b
    text: wat de verhouding is tussen ingaande en uitgaande fuststromen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel122
  - number: '122.2'
    text: |-
      De producentenorganisatie overlegt bij indiening van de steunaanvraag, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, een overzicht van roulaties per type fust.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel122
  - number: '123.1'
    text: |-
      Uitgaven voor deelname aan nationaal of internationaal maatschappelijk aanvaarde milieuzorgsystemen en aanvullende
      certificeringssystemen die openstaan voor alle producenten van groenten en fruit zijn subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.a
    text: het milieuzorgsysteem bindende voorwaarden omvat met betrekking tot productiemethoden;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.b
    text: |-
      de naleving van de voorwaarden, bedoeld in onderdeel a, het onderwerp zijn van een onafhankelijke controle door
      gekwalificeerde personen of organen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.c
    text: 'het gaat om de volgende uitgaven voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.c.1
    text: |-
      begeleiding, audits, certificering en lidmaatschapkosten, indien zij noodzakelijk zijn voor deelname aan
      milieuzorgsystemen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.c.2
    text: personeelskosten voor milieuzorgsystemen, indien zij nodig zijn voor de deelname in milieuzorgsystemen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.c.3
    text: het ontwikkelen van materialen voor milieuzorgsystemen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.1.c.4
    text: het ontwikkelen en verbeteren van ICT en registratiemodules ten behoeve van milieuzorgsystemen
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.2'
    text: 'Milieuzorgsystemen, bedoeld in het eerste lid, op het teeltbedrijf van aangesloten leden zijn:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.2.a
    text: GlobalGAP;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.2.b
    text: Skal biologische productie, voor teelt van gewassen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.2.c
    text: certificeringssystemen, zoals Milieukeur, MPS Fruit & Vegetable, Duurzame Glastuinbouw Producten, CO Footprint, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.2.d
    text: certificeringssystemen van retailers, zoals Albert Heijn Protocol, Field to Fork, LEAF en Sedex.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.3'
    text: |-
      Milieuzorgsystemen, bedoeld in het eerste lid, op het centrale niveau van de producentenorganisatie of
      distributiecentra van de producentenorganisatie zijn:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.3.a
    text: ISO 14001 Milieu;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.3.b
    text: Skal bereiding, verpakking, handel en opslag, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.3.c
    text: Milieukeur.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.4'
    text: Uitgaven voor deelname aan het milieuzorgsysteem Global Gap zijn subsidiabel tot en met 31 december 2017.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.5'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om uitgaven voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.5.a
    text: GLN codes in het kader van GlobalGAP en uitgaven voor certificering van groenlabelkassen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: 123.5.b
    text: de aanschaf van materialen, bedoeld in het eerste lid, onderdeel c, onder 3°.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.6'
    text: |-
      De producentenorganisatie overlegt bij de indiening van de steunaanvraag, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, cijfers met betrekking tot de deelname van producenten aan de systemen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '123.7'
    text: |-
      Uitgaven als bedoeld in het eerste lid, onderdeel c, onder 4°, voor jaarlijkse abonnementen of licenties voor
      registratiemodules zijn voor maximaal 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel123
  - number: '124'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het strategisch doel marktgericht
      produceren, bedoeld in [artikel 43, eerste lid, onderdeel b][ref1], en ter uitvoering van de maatregel, bedoeld in
      artikel 19, eerste lid, onderdeel g, onder i, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt
      voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 124.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 124.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel124
  - number: '125.1'
    text: |-
      Uitgaven van de producentenorganisatie voor investeringen in de aanschaf van belichtingsinstallaties ten behoeve
      van het jaarrond produceren zijn subsidiabel indien de energie die gedurende de instandhoudingstermijn, bedoeld
      in [artikel 72, eerste lid][ref1], wordt gebruikt voor de belichtingsinstallatie een aantoonbaar duurzaam karakter
      heeft of wordt opgewekt met behulp van een warmtekrachtkoppelingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel72
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '72'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '125.2'
    text: 'De producentenorganisatie toont bij de indiening van het operationeel programma aan dat:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: 125.2.a
    text: verkoop van het betreffende product op dat moment niet jaarrond plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: 125.2.b
    text: |-
      de verkoop van het betreffende product met behulp van de belichtingsinstallatie waarvoor steun wordt aangevraagd
      wel jaarrond kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: '125.3'
    text: |-
      De producentenorganisatie toont bij indiening van de steunaanvraag voor het laatste uitvoeringsjaar van het
      operationeel programma aan dat de productie van het product jaarrond plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: '125.4'
    text: Uitgaven voor schermen ten behoeve van lichtafscherming en verwijderingsbijdragen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: '125.5'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product, met uitsplitsing naar gewas en type klant, die zijn geproduceerd met behulp van de in
      het eerste lid bedoelde belichtingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel125
  - number: '126'
    text: |-
      Indien dit noodzakelijk is voor het functioneren van de belichtingsinstallatie, bedoeld in
      [artikel 125, eerste lid][ref1], zijn uitgaven van de producentenorganisatie voor de aansluiting van een extern
      trafostation van het energiebedrijf of de verzwaring van de netkoppeling op de warmte-krachtkoppelingsinstallatie
      subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel125
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '125'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '127'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het strategisch doel marktgericht
      produceren, bedoeld in [artikel 43, eerste lid, onderdeel b][ref1], en ter uitvoering van de maatregel, bedoeld in
      artikel 19, eerste lid, onderdeel g, onder ii, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt
      voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 127.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 127.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel127
  - number: '128.1'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van het optimaliseren van de productkwaliteit
      in de keten zijn subsidiabel indien het gaat om investeringen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.1.a
    text: het verhogen van de houdbaarheid van de producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.1.b
    text: voedselveiligheid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.1.c
    text: kwaliteitszorgsystemen
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.1.d
    text: het verhogen van de fysieke productkwaliteit, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.1.e
    text: lange bewaring in koelhuizen, koelcellen, koelinstallaties, vriescellen
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: '128.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om investeringen:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.a
    text: in reinigingsinstallaties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.b
    text: in fustwasinstallaties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.c
    text: in installaties en apparatuur voor conditionering van champignon- en witloftrekcellen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.d
    text: in voorzieningen voor gekoeld of geconditioneerd transport op het teeltbedrijf;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.e
    text: in droogsystemen voor aanzuiging van buitenlucht voor knoflook;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.f
    text: in vogel -en wildafweer, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: 128.2.g
    text: die de producentenorganisatie doet om te voldoen aan de voorwaarden van kwaliteitskeurmerken.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel128
  - number: '129.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van de borging van een nieuw product of concept in de keten zijn
      subsidiabel, indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: 129.1.a
    text: |-
      investeringen ten behoeve van het voor de eerste keer laten certificeren van keurmerken voor nieuwe producten en
      nieuwe concepten, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: 129.1.b
    text: |-
      investeringen ten behoeve het voor de eerste keer laten certificeren van keurmerken op het gebied van duurzaamheid
      (MVO), kwaliteit en voedselveiligheid in de keten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: '129.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid voor investeringen in ICT voorzieningen voor tracking en tracing systemen
      zijn subsidiabel indien het gaat om ICT voorzieningen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: 129.2.a
    text: de registraties van productherkomst, ziekten, plagen, middelen of meststoffen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: 129.2.b
    text: het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: '129.3'
    text: Uitgaven als bedoeld in het tweede lid zijn voor maximaal 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel129
  - number: '130.1'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van het optimaliseren van de productkwaliteit
      in de keten zijn tot en met 31 december 2017 subsidiabel indien het gaat om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.a
    text: het verhogen van de houdbaarheid van de producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.b
    text: voedselveiligheid, met name residumonitoring en fytosanitaire controles;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.c
    text: 'kwaliteitszorgsystemen, indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.c.1
    text: |-
      uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor begeleiding en audits van
      kwaliteitszorgsystemen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.c.2
    text: uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor productcontroles;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.c.3
    text: uitgaven voor certificering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.c.4
    text: lidmaatschapskosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.d
    text: het verhogen van de fysieke productkwaliteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.e
    text: het vergroten van de duurzaamheid van het product en van het productieproces;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.f
    text: keurmerken of modules van keurmerken voor maatschappelijk verantwoord ondernemen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.g
    text: het ontwikkelen en verbeteren van ICT en registratiemodules, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.1.h
    text: |-
      software van conditioneringssystemen ten behoeve van lange bewaring van producten waarbij productieplanning het
      doel is.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: '130.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om uitgaven voor:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.2.a
    text: certificering van meet- en weegapparatuur
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.2.b
    text: aanschaf van bedrijfskleding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.2.c
    text: materialen voor certificeringssystemen,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.2.d
    text: het schoonmaken van bedrijfsruimten, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.2.e
    text: aanschaf van Global Location Number (GLN) codes in het kader van GlobalGAP.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: '130.3'
    text: |-
      Bij de indiening van de steunaanvraag overlegt de producentenorganisatie, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, voor de uitgaven, bedoeld in het eerste lid, onderdeel c, aan de minister een
      overzicht van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.3.a
    text: het aantal deelnemende tot de producentenorganisatie of haar leden behorende bedrijven per zorgsysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.3.b
    text: de toe- en afname van het aantal deelnemers ten opzichte van het voorgaand jaar;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.3.c
    text: het aantal gecertificeerde deelnemers, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: 130.3.d
    text: |-
      het aantal en percentage gecertificeerde bedrijven ten opzichte van het totaal aantal tot de producentenorganisatie
      of haar leden behorende bedrijven.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel130
  - number: '131.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van de borging van de productkwaliteit van een nieuw product of
      concept in de keten zijn subsidiabel, indien het gaat om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.1.a
    text: het voor de eerste keer laten certificeren van keurmerken voor nieuwe producten en nieuwe concepten, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.1.b
    text: |-
      het voor de eerste keer laten certificeren van keurmerken op het gebied van duurzaamheid, kwaliteit en
      voedselveiligheid in de keten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: '131.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid voor ICT voorzieningen voor tracking en tracing systemen zijn subsidiabel
      indien het gaat om ICT voorzieningen ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.2.a
    text: de registraties van productherkomst, ziekten, plagen, middelen of meststoffen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.2.b
    text: het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: '131.3'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.3.a
    text: uitgaven voor onderhoudsabonnementen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.3.b
    text: uitgaven voor de aanschaf van een Global Location Number (GLN), of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: 131.3.c
    text: uitgaven van de producentenorganisatie om aan keurmerken te voldoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: '131.4'
    text: Uitgaven als bedoeld in het tweede lid zijn voor maximaal 50% subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel131
  - number: '132'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het strategisch doel marktgericht
      produceren, bedoeld in artikel 43, eerste lid, onderdeel b, en ter uitvoering van de maatregel, bedoeld in artikel
      19, eerste lid, onderdeel g, onder iii, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt
      voldaan aan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel132
  - number: 132.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 132.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel132
  - number: '133.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten zijn subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.1.a
    text: 'het gaat om de aanschaf van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.1.a.1
    text: bomen of meerjarig plantmateriaal ten behoeve van nieuwe markten of nieuwe productmarktcombinaties, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.1.a.2
    text: |-
      kruisbestuivers die nodig zijn voor de aanplant van nieuw in het operationeel programma op te nemen bomen en
      meerjarige planten, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.1.b
    text: |-
      de producentenorganisatie door middel van contracten of andere schriftelijke bescheiden aantoont dat de bomen
      of meerjarig plantmateriaal gedurende de looptijd van het project slechts op een vooraf vastgestelde hoeveelheid
      areaal wordt geproduceerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: '133.2'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn gedurende maximaal 4 jaar subsidiabel, te rekenen vanaf het moment van
      aanvang van de activiteit.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: '133.3'
    text: |-
      Uitgaven voor de aankoop van meerjarig plantmateriaal en bomen, bedoeld in het eerste lid, onderdeel a, onder 1°,
      zijn evenwel slechts subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.3.a
    text: er gedurende meerdere jaren van de bomen en planten geoogst wordt, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.3.b
    text: het gaat om de uitgaven voor de initiële aanplant.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: '133.4'
    text: |-
      De producentenorganisatie overlegt voor de uitgaven, bedoeld in het eerste lid, jaarlijks bij de indiening van de
      steunaanvraag aan de minister een overzicht, met gebruikmaking van een door de minister beschikbaar gesteld middel,
      van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.4.a
    text: het gewas en de rassen van de aangeplante meerjarige planten, bomen of kruisbestuivers;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.4.b
    text: de producenten en productgroep ten behoeve waarvan van de activiteit wordt verricht;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.4.c
    text: |-
      de locatie(s) waarop de meerjarige planten, bomen of kruisbestuivers aangeplant zijn, gemarkeerd op een
      bedrijfskaart;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.4.d
    text: het geteelde areaal per ras, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: 133.4.e
    text: het aantal planten, bomen of kruisbestuivers per ras.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: '133.5'
    text: |-
      De producentenorganisatie beschikt over de afleverbonnen voor de bomen, het meerjarig plantmateriaal en de
      kruisbestuivers, bedoeld in het eerste lid, en overlegt deze desgevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel133
  - number: '134.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van het ontsluiten van nieuwe markten zijn subsidiabel, indien
      het gaat om innovatieve op afzetverbetering gerichte investeringen in:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.a
    text: 'sorteer- en verpakcentra:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.b
    text: distributiecentra;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.c
    text: verwerkingscentra;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.d
    text: fustopslag;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.e
    text: dockboards, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.1.f
    text: sorteer- en verpakkingslijnen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: '134.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.2.a
    text: investeringen ter vervanging van oude centra als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.2.b
    text: |-
      standaard sorteer- en verpakkingslijnen op teeltbedrijven en op bestaande locaties van de producentenorganisatie,
      en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: 134.2.c
    text: met de sorteerlijn geïntegreerde aanvoerprognosesystemen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: '134.3'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel134
  - number: '135.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van het ontsluiten van nieuwe markten zijn subsidiabel, indien
      het gaat om de kosten van het huren van de investeringen bedoeld in [artikel 134, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel134
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '134'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: '135.2'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn subsidiabel in het jaar waarin zij aan de producentenorganisatie zijn
      gefactureerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel135
  - number: '135.3'
    text: |-
      In het geval de uitgaven, bedoeld in het eerste lid, betrekking hebben op twee uitvoeringsjaren van het
      operationeel programma, zijn deze uitgaven, in afwijking van [artikel 289a, eerste lid][ref1], subsidiabel in het
      jaar waarin zij aan de producentenorganisatie zijn gefactureerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel289a
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: 289a
  - number: '135.4'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister voor de
      uitgaven, bedoeld in het eerste lid, een huurcontract.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel135
  - number: '135.5'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van huur.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel135
  - number: '136.1'
    text: |-
      Uitgaven van de producentenorganisatie voor investeringen ten behoeve van het vergroten van de afzetwaarde van
      producten door middel van het vergroten van de duurzaamheid van het product en van het productieproces zijn
      subsidiabel, indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.1.a
    text: |-
      één volledige investering in fertigatie in het kader van precisiebemestingtechnieken die bestemd is voor besparing
      en het gereguleerd doseren van water en meststoffen aan gewassen in vollegrondsfruitteelt;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.1.b
    text: de besparing op het meststoffenverbruik door de producentenorganisatie is aangetoond, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.1.c
    text: de investering niet leidt tot een hoger watergebruik.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: '136.2'
    text: 'Onder een investering in fertigatie als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.2.a
    text: |-
      een waterafgiftesysteem op het perceel, waaronder de waterpomp, verdeelleidingen en druppelleidingen die niet
      uitsluitend worden gebruikt voor het geven van water;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.2.b
    text: een regeleenheid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.2.c
    text: vochtmeetapparatuur;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.2.d
    text: apparatuur voor het bepalen van het mineralengehalte en pH, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.2.e
    text: voorzieningen voor dosering en menging van meststoffen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: '136.3'
    text: |-
      Druppelleidingen als bedoeld in het tweede lid, onderdeel a, zijn uitsluitend subsidiabel bij initiële
      investeringen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: '136.4'
    text: |-
      Investeringen in een waterafgiftesysteem als bedoeld in het tweede lid, onderdeel a, zijn niet subsidiabel indien
      het investeringen betreft in:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.4.a
    text: fertigatie in teeltsystemen los van de grond;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.4.b
    text: aanleg van een waterbron, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: 136.4.c
    text: afvoerleidingen naar het te fertigeren perceel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: '136.5'
    text: |-
      De producentenorganisatie overlegt bij de indiening van het operationeel programma aan de minister, met gebruik
      van een door de minister beschikbaar gesteld middel, per lid een projectplan met projectbegroting, voorzien van
      bijbehorende offertes.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel136
  - number: '137.1'
    text: |-
      De producentenorganisatie overlegt bij de indiening van de steunaanvraag aan de minister, met gebruikmaking van een
      door de minister beschikbaar gesteld middel, voor de investering, bedoeld in [artikel 136][ref1], een opgave van de
      gerealiseerde besparing op het meststoffenverbruik en waterverbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel136
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '136'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: '137.2'
    text: |-
      De berekening van de gerealiseerde besparing op het meststoffenverbruik, gemeten in kilogrammen, als gevolg van een
      investering als bedoeld in [artikel 136][ref1], vindt plaats op basis van een vergelijking tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel136
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '136'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: 137.2.a
    text: |-
      het mineralenverbruik, volgens de mineralenregistratie, van het jaar voorafgaand aan het jaar van inbedrijfstelling
      van de investering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.2.b
    text: 'het mineralenverbruik, volgens de mineralenregistratie, gedurende het jaar:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.2.b.1
    text: van ingebruikname van de investering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.2.b.2
    text: volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: '137.3'
    text: |-
      Het vaststellen van veranderingen in het waterverbruik en meststoffenverbruik, gemeten in m3, als gevolg van een
      investering als bedoeld in [artikel 136, eerste lid][ref1], vindt plaats op basis van een vergelijking tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel136
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '136'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: 137.3.a
    text: |-
      het waterverbruik en meststoffenverbruik van het jaar voorafgaand aan het jaar van inbedrijfstelling van de
      investering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.3.b
    text: 'het waterverbruik en meststoffenverbruik gedurende het jaar:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.3.b.1
    text: ingebruikname van de investering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: 137.3.b.2
    text: volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel137
  - number: '138.1'
    text: |-
      Uitgaven van de producentenorganisatie voor investeringen ten behoeve van het vergroten van de afzetwaarde van
      producten door middel van het vergroten van de duurzaamheid van het product en van het productieproces zijn
      subsidiabel indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
  - number: 138.1.a
    text: |-
      het gaat om investeringen om de kwaliteit van water bij substraatteelt bij de bron te verbeteren en de emissie van
      vervuild recirculatiewater te voorkomen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
  - number: 138.1.b
    text: de verbetering van de waterkwaliteit door de producentenorganisatie is aangetoond, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
  - number: 138.1.c
    text: de investeringen niet leiden tot een hoger waterverbruik.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
  - number: '138.2'
    text: |-
      Een producentenorganisatie die uitgaven voor investeringen als bedoeld in het eerste lid in haar operationeel
      programma opneemt, voegt aan het plan, bedoeld in [artikel 47][ref1], een technische specificatie van de
      leverancier van het systeem of een erkende deskundige toe ten behoeve van de onderbouwing van de te bereiken
      verbetering van de waterkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel47
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '47'
        hoofdstuk: '1'
  - number: '138.3'
    text: |-
      Uitgaven als bedoeld in het eerste lid voor afdekzeilen van bassins en silo’s voor wateropslag ter voorkoming van
      algengroei zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel138
  - number: '139.1'
    text: |-
      De producentenorganisatie overlegt aan de minister, met gebruikmaking van een door de minister beschikbaar
      gesteld middel, voor de investeringen, bedoeld in artikel 138, uiterlijk bij de indiening van de steunaanvraag
      per investering:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.1.a
    text: een opgave van de verbetering van de waterkwaliteit, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.1.b
    text: de gerealiseerde waterbesparing.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: '139.2'
    text: |-
      De opgave, bedoeld in het eerste lid, onderdeel a, vindt plaats aan de hand van berekeningen en metingen op
      basis van een vergelijking tussen het moment voor de ingebruikname van de investering en het moment één jaar na
      ingebruikname van de investering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: '139.3'
    text: |-
      In geval van omgekeerde osmose als bedoeld in [artikel 138, eerste lid, onderdeel a][ref1], overlegt de
      producentenorganisatie aan de minister bij de indiening van de steunaanvraag een opgave van de reductie van natrium
      en chloor in mmol/l of mg/l, op basis van een vergelijking tussen metingen uitgevoerd voor ingebruikname van de
      investering en één jaar na ingebruikname van de investering.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel138
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '138'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: '139.4'
    text: |-
      Het vaststellen van veranderingen in het waterverbruik, gemeten in m³, als gevolg van een investering als bedoeld
      in artikel 138, eerste lid, vindt plaats op basis van een vergelijking tussen:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.4.a
    text: het waterverbruik van het jaar voorafgaand aan het jaar van inbedrijfstelling van de investering, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.4.b
    text: 'het waterverbruik gedurende het jaar:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.4.b.1
    text: ingebruikname van de investering, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: 139.4.b.2
    text: volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel139
  - number: '140.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van marktonderzoek en marktontwikkeling zijn subsidiabel indien
      het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.a
    text: consumentenonderzoek en aankoop van paneldata;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.b
    text: het testen van een product waarvoor de producentenorganisatie erkend is door een panel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.c
    text: onderzoek naar het onderhouden van schap of retail positionering;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.d
    text: productmarktanalyses;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.e
    text: marktonderzoek, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: 140.1.f
    text: het doen van marktonderzoek door middel van pop-up stores.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: '140.2'
    text: |-
      De in het eerste lid bedoelde uitgaven zijn gedurende maximaal 4 jaar subsidiabel, te rekenen vanaf het moment van
      aanvang van de uitgavenpost.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: '140.3'
    text: |-
      Onderzoeken als bedoeld in het eerste lid naar verwerkte producten zijn slechts subsidiabel indien dit onderzoek
      betrekking heeft op producten die bestemd zijn voor de food-markt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel140
  - number: '141.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten zijn subsidiabel wanneer het gaat om licenties voor het recht op het
      gebruik van zaden en plantgoed ten behoeve van nieuwe rassen indien de producentenorganisatie door middel van
      contracten of andere schriftelijke bescheiden aantoont dat het ras gedurende de looptijd van het project slechts op
      een vooraf vastgestelde hoeveelheid areaal wordt geproduceerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '141.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid voor een volledige overname van een licentie en de kosten van aankoop van
      het zaad en het plantgoed zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '141.3'
    text: |-
      De in het eerste lid bedoelde uitgaven zijn gedurende maximaal 4 jaar subsidiabel, te rekenen vanaf het moment van
      aanvang van de uitgavenpost.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '141.4'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht,
      met gebruikmaking van een door de minister beschikbaar middel, van:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: 141.4.a
    text: het gewas en de geteelde rassen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: 141.4.b
    text: de producenten waarbij en de productgroep waarvoor de activiteit wordt verricht
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: 141.4.c
    text: de locatie(s) waarop de planten geteeld zijn, gemarkeerd op een bedrijfskaart;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: 141.4.d
    text: het geteelde areaal per ras, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: 141.4.e
    text: het aantal planten per ras.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '141.5'
    text: |-
      De producentenorganisatie overlegt bij de indiening van de steunaanvraag voor het laatste uitvoeringsjaar van het
      operationeel programma aan de minister, met gebruikmaking van een door de minister beschikbaar gesteld middel, het
      resultaat van de evaluatie waaruit blijkt hoe de producentenorganisatie zich in de markt met het betreffende ras
      heeft onderscheiden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '141.6'
    text: |-
      De producentenorganisatie beschikt over de afleverbonnen voor de zaden en het plantgoed, bedoeld in het eerste lid
      en overlegt deze desgevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel141
  - number: '142.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten zijn subsidiabel wanneer het gaat om rassenproeven op intrinsieke
      producteigenschappen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: '142.2'
    text: |-
      Rassenproeven, bedoeld in het eerste lid, zijn slechts subsidiabel indien de producten van de geteste rassen
      bedoeld zijn voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: '142.3'
    text: |-
      De in het eerste lid bedoelde uitgaven zijn gedurende maximaal 4 jaar subsidiabel, te rekenen vanaf het moment van
      aanvang van de uitgavenpost.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: '142.4'
    text: 'De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: 142.4.a
    text: het contract en de gedetailleerde factuur voor de uitvoering van de rassenproeven, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: 142.4.b
    text: een overzicht van de producenten waar de activiteit wordt verricht.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel142
  - number: '143.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van concepten rondom verse
      producten zijn subsidiabel indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: 143.1.a
    text: conceptontwikkeling op het gebied van duurzaamheid, gezondheid en gemak, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: 143.1.b
    text: ontwikkeling van nieuwe verpakkingen voor het verse product.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: '143.2'
    text: |-
      Uitgaven als bedoeld in het eerste, onderdeel b, zijn slechts subsidiabel indien deze rechtstreeks bijdragen aan
      het kwaliteitsbehoud.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: '143.3'
    text: 'De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: 143.3.a
    text: een overzicht van de producenten waar de activiteiten worden verricht, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: 143.3.b
    text: een gedetailleerde factuur.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel143
  - number: '144.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van concepten rondom bewerkte en
      verwerkte producten zijn subsidiabel indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.1.a
    text: conceptontwikkeling van bewerkte en verwerkte producten op het gebied van duurzaamheid, gezondheid en gemak;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.1.b
    text: ontwikkeling van nieuwe verpakkingen ten behoeve van verwerkte en bewerkte producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.1.c
    text: ontwikkeling van nieuwe verwerkte producten ten behoeve van de foodmarkt, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.1.d
    text: |-
      ontwikkeling van ondersteunende voedingsproducten en niet voedingsproducten ten behoeve van bewerkte en verwerkte
      producten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: '144.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid, onderdelen c en d, zijn slechts subsidiabel indien het verwerkte product
      dat de producentenorganisatie met behulp van de activiteiten, bedoeld in het eerste lid, onderdelen c en d,
      produceert:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.2.a
    text: direct, zonder verdere verwerking, door consumenten kan worden geconsumeerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.2.b
    text: niet wordt verwerkt in ingrediënten ten behoeve van de voedselindustrie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: '144.3'
    text: |-
      Uitgaven als bedoeld in het eerste lid, onderdeel d, zijn slechts subsidiabel indien deze rechtstreeks bijdragen
      aan het kwaliteitsbehoud van groente- en fruit producten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: '144.4'
    text: 'De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.4.a
    text: |-
      een overzicht van het aantal producenten ten behoeve van de betreffende productgroep waarvoor de activiteiten
      worden verricht, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: 144.4.b
    text: een gedetailleerde factuur.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel144
  - number: '145.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van generieke afzetbevordering zijn subsidiabel indien het gaat
      om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.a
    text: generieke promotie op consumentenbeurzen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.b
    text: generieke promotie tijdens publieksevenementen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.c
    text: generieke promotie in het kader van duurzaam telen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.d
    text: generieke promotie gericht op doelgroepen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.e
    text: sectorpromotie en PR-campagnes;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.f
    text: collectieve acties voor GMO producten door meerdere producentenorganisaties, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.g
    text: 'websites en sociale media, voor zover het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.g.1
    text: het voor de eerste maal registreren van domeinnamen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.g.2
    text: het bouwen van nieuwe websites, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.1.g.3
    text: het uitbouwen van bestaande websites met aantoonbaar nieuwe elementen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: '145.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel als het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.2.a
    text: activiteiten op het gebied van verkoop van producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.2.b
    text: |-
      activiteiten op het gebied van gezamenlijke verkoopbevordering waarvan de kosten mede worden gedragen door een
      afnemer;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.2.c
    text: de kosten van producten in het geval van het gratis verstrekken van product;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.2.d
    text: |-
      abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande websites,
      personeelskosten ten behoeve van berichtgeving in het kader van social media, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: 145.2.e
    text: uitgaven voor sponsoring.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel145
  - number: '146.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeven van marketing en verkoopbevordering van merken en handelsnamen
      van de producentenorganisatie en hun dochterondernemingen, die wordt meegenomen in de berekening van de waarde van
      de afgezette productie op grond van artikel 50, negende lid, van [verordening 543/2011](onbekend), zijn subsidiabel
      indien het gaat om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.a
    text: promotie van merken of handelsnamen op consumentenbeurzen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.b
    text: promotie van merken of handelsnamen op publieksevenementen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.c
    text: promotie van merken of handelsnamen in het kader van duurzaam telen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.d
    text: promotie van merken of handelsnamen gericht op doelgroepen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.e
    text: sectorpromotie en PR-campagnes;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.f
    text: 'websites en sociale media, indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.f.1
    text: het voor de eerste maal registreren van een domeinnaam;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.f.2
    text: het bouwen van een nieuwe website, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.f.3
    text: het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.g
    text: het opstellen en uitvoeren van plannen voor accountmanagement of categorymanagement, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.1.h
    text: |-
      het laten uitvoeren van onderzoek op het gebied van afzetbeleid, voor zover niet gericht op de interne organisatie
      van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: '146.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel als het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.a
    text: De aankoop van een licentie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.b
    text: activiteiten ten behoeve van een merk waarvan de licentie gehuurd of geleased is;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.c
    text: activiteiten op het gebied van verkoop van producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.d
    text: uitgaven voor gezamenlijke verkoopbevordering, waarvan de kosten mede worden gedragen door een afnemer;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.e
    text: de kosten van producten in het geval van het gratis verstrekken van product;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.f
    text: |-
      abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande websites,
      personeelskosten ten behoeve van berichtgeving in het kader van social media;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.g
    text: uitgaven voor sponsoring, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: 146.2.h
    text: PR-activiteiten richting potentiële leden van een producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel146
  - number: '147.1'
    text: |-
      Uitgaven van de producentenorganisatie voor reclameactiviteiten en reclameartikelen voor producten waarvoor de
      producentenorganisatie is erkend, zijn subsidiabel als het gaat om uitgaven voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.a
    text: advertenties in magazines of kranten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.b
    text: 'promotie in een blad of magazine van supermarkten, indien:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.b.1
    text: in het blad of magazine duidelijk vermeld is dat de producentenorganisatie de afzender is, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.b.2
    text: er geen logo of verwijzing naar de supermarkt in de advertentie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.c
    text: |-
      ontwikkelingskosten van de lay-out en extra kosten van reclamedrukwerk op verpakkingen of etiketten, steekkaarten
      of wikkels voor zover gebruikt bij tijdelijke acties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.d
    text: toonbankdisplays, flyers of folders, gadgets, belettering, aangekochte producten voor standaankleding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.e
    text: billboards, radioreclame, tv-reclame, banners op websites;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.f
    text: |-
      uitdelen van producten ter waarde van de marktprijs van het uit te delen product, indien deze actie aantoonbaar
      minimaal vier weken voor de uitvoering van de actie gepland is en niet bedoeld is als interventiemaatregel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.g
    text: kookdemonstraties;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.h
    text: |-
      bedrijfsrondleidingen bij een producentenorganisatie of lid van de producentenorganisatie, een open dag, opening of
      jubileum, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: 147.1.i
    text: |-
      deelname aan beurzen, indien deze beurzen gericht zijn op afnemers van de producentenorganisatie, met uitzondering
      van verstrekte consumpties.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: '147.2'
    text: |-
      Ter onderbouwing van de uitgaven, bedoeld in het eerste lid, onderdeel h, overlegt de producentenorganisatie aan de
      minister bij de indiening van de steunaanvraag een uitnodigingslijst.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: '147.3'
    text: Reclameacties en reclameartikelen waarvan de kosten mede worden gedragen door een afnemer zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel147
  - number: '148.1'
    text: |-
      Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten ten behoeve van activiteiten
      gericht op het bepalen van een marktstrategie zijn subsidiabel indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.1.a
    text: |-
      het laten uitvoeren van onderzoek op het gebied van afzetbeleid voor zover niet gericht op de interne organisatie
      van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.1.b
    text: het jaarlijks aanpassen of opstellen van marketingplannen of accountplannen, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.1.c
    text: relatiebeheer in het kader van contact met afnemers.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: '148.2'
    text: |-
      Onder marktstrategie als bedoeld in het eerste lid wordt verstaan samenwerking in de keten, reclame, innovatie en
      planning van het productaanbod.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: '148.3'
    text: 'Onder personeel en externe diensten als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.a
    text: categoriemanagers;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.b
    text: accountmanagers;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.c
    text: productmanagers;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.d
    text: marketingpersoneel;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.e
    text: marketingmanagers, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.3.f
    text: marktonderzoekers.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: '148.4'
    text: |-
      De activiteiten van het personeel en externe diensten, bedoeld in het derde lid, hebben in ieder geval betrekking
      op het:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.4.a
    text: samenstellen van een innovatief, concurrerend en formulegericht assortiment per productgroep;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.4.b
    text: behouden van klanten of nieuwe klanten werven door acquisitieactiviteiten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.4.c
    text: |-
      bepalen van de ontwikkeling, de productie, de marketing en het in de markt zetten van een product en het analyseren
      van de resultaten met het oog op de commerciële lange termijn doelen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.4.d
    text: |-
      bepalen van de marktstrategie door middel van marketingplannen en het ervoor zorgen dat deze strategie wordt
      geïmplementeerd en nageleefd;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: 148.4.e
    text: |-
      onderzoek naar alle factoren op alle verschillende (potentiële) markten die de vraag naar een product beïnvloeden,
      onder meer wat betreft trends, klanttevredenheid, de onderliggende behoeften van klanten en het imago van de
      sector.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: '148.5'
    text: |-
      Activiteiten van het personeel en van externe diensten op het gebied van het verkopen van producten op welke manier
      dan ook, het opnemen van bestellingen, het leveren en de allocatie van het product, het maken van prijsafspraken
      ten aanzien van producten van niet-leden of waarvoor de producentenorganisatie niet is erkend, zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel148
  - number: '149.1'
    text: |-
      Uitgaven van de producentenorganisatie voor personeel en externe diensten voor nieuwbouw van sorteercentra en
      verpakcentra, distributiecentra, verwerkingscentra, fustopslag, dockboards en op afzetverbetering gerichte sorteer-
      en verpakkingslijnen, bedoeld in [artikel 134, eerste lid][ref1], ten behoeve van de bundeling van productstromen
      zijn subsidiabel indien het gaat om:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel134
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '134'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '3'
  - number: 149.1.a
    text: de kosten van bouwkundig advies;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.b
    text: de kosten van bouwbegeleiding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.c
    text: de kosten van projectmanagement;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.d
    text: de kosten van onafhankelijk toezicht op uitvoering van een project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.e
    text: de kosten van haalbaarheidsstudies;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.f
    text: juridische en administratiekosten,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: 149.1.g
    text: reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: '149.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden
      geactiveerd in het investeringsbedrag zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: '149.3'
    text: |-
      Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel149
  - number: '150'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder i, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 150.a
    text: |-
      [deel 4, hoofdstuk 2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '2'
  - number: 150.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel150
  - number: '151.1'
    text: |-
      Uitgaven van de producentenorganisatie voor de aanschaf van systemen voor aanvoerprognoses en areaalenquêtes
      zijn subsidiabel indien het gaat om systemen bij de producentenorganisatie en haar leden die met elkaar kunnen
      communiceren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel151
  - number: '151.2'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van het aantal systemen, bedoeld in het eerste lid, en het aantal aansluitingen van haar leden op deze systemen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel151
  - number: '152.1'
    text: |-
      Uitgaven van producentenorganisaties ten behoeve van voorraadbeheer en distributie zijn subsidiabel indien het
      gaat om het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning en voor zover zij tot
      doel hebben:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.1.a
    text: kwaliteitsverbetering van het proces;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.1.b
    text: tracking and tracing van producten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.1.c
    text: koppeling van vraag aan aanbod, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.1.d
    text: efficiencyverbetering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.2'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn vanaf de aanvang van de activiteiten gedurende maximaal 4 jaar
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.3'
    text: |-
      Onder de uitgaven, bedoeld in het eerste lid, vallen kosten voor de interface van ICT systemen voor logistieke
      planning, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.3.a
    text: een aanvoerregistratiesysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.3.b
    text: een verkoopsysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.3.c
    text: het verladingssysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.3.d
    text: een orderregistratiesysteem, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.3.e
    text: een facturatiesysteem.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.4'
    text: |-
      Uitgaven als bedoeld in het eerste lid op locatie van de leden van de producentenorganisatie zijn slechts
      subsidiabel indien de producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het systeem voor
      logistieke planning van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.5'
    text: 'De volgende uitgaven zijn voor maximaal 50% subsidiabel:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.5.a
    text: uitgaven voor scanner, touchscreens, tags, punnets en RIFD, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.5.b
    text: |-
      uitgaven voor hardware of software van het in het eerste lid bedoelde systeem, indien de producentenorganisatie aan
      de minister op basis van een offerte niet kan aantonen dat deze hardware of software uitsluitend bestemd is voor de
      functionaliteiten, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.6'
    text: Uitgaven voor het verder uitrollen van ICT systemen voor logistieke planning zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '152.7'
    text: 'Bij de indiening van het operationeel programma wordt een onderbouwd plan overlegd met daarin:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.7.a
    text: een gedetailleerde beschrijving van het project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.7.b
    text: een begroting van de investeringskosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.7.c
    text: een definiëring van de onderdelen van de investeringskosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.7.d
    text: een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: 152.7.e
    text: een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel152
  - number: '153.1'
    text: |-
      Uitgaven van de producentenorganisatie voor koeling van producten ten behoeve van lange bewaring zijn subsidiabel,
      indien het gaat om:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: 153.1.a
    text: koelhuizen,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: 153.1.b
    text: koelcellen,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: 153.1.c
    text: koelinstallaties en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: 153.1.d
    text: vriescellen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: '153.2'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de gekoelde hoeveelheden product, met uitsplitsing naar gewas en type klant.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel153
  - number: '154.1'
    text: |-
      Uitgaven van de producentenorganisatie voor investeringen in conditioneringssystemen ten behoeve van lange bewaring
      van producten zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel154
  - number: '154.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel154
  - number: 154.2.a
    text: installaties of apparatuur voor conditionering van champignon- en witloftrekcellen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel154
  - number: 154.2.b
    text: droogsystemen voor de aanzuiging van buitenlucht ten behoeve van knoflook.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel154
  - number: '155.1'
    text: |-
      Uitgaven van de producentenorganisatie voor het huren van koelsystemen als bedoeld in
      [artikel 153, eerste lid][ref1], of conditioneringssystemen als bedoel in [artikel 154, eerste lid][ref2], zijn
      subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Artikel154
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '153'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0034320
        artikel: '154'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '155.2'
    text: |-
      De in het eerste lid bedoelde uitgaven zijn subsidiabel in het jaar waarin zij aan de producentenorganisatie
      gefactureerd zijn.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: '155.3'
    text: |-
      In het geval de uitgaven, bedoeld in het eerste lid, betrekking hebben op twee uitvoeringsjaren van het
      operationeel programma, zijn deze uitgaven, in afwijking van 289a, eerste lid, subsidiabel in het jaar waarin zij
      aan de producentenorganisatie zijn gefactureerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: '155.4'
    text: |-
      Ter uitvoering van artikel 60, eerste lid, en bijlage IX van [verordening 543/2011](onbekend) overlegt de
      producentenorganisatie jaarlijks bij het indienen van de steunaanvraag aan de minister een bewijs van de uitgaven,
      bedoeld in het eerste lid, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: 155.4.a
    text: een huurcontract; en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: 155.4.b
    text: een registratie van de in- en uitslag.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: '155.5'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de gekoelde of geconditioneerde hoeveelheden product, met uitsplitsing naar gewas en type klant.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel155
  - number: '156.1'
    text: |-
      Uitgaven van de producentenorganisatie voor de aanpassingen in systemen en interfaces van de producentenorganisatie
      en haar leden die noodzakelijk zijn voor de aanschaf van systemen voor aanvoerprognose en areaalenquêtes zijn
      subsidiabel indien de systemen voor aanvoerprognose en areaalenquêtes van de producentenorganisatie en haar leden
      met elkaar kunnen communiceren.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel156
  - number: '156.2'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van het aantal systemen, bedoeld in het eerste lid, en het aantal aansluitingen van haar leden op deze systemen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel156
  - number: '157'
    text: |-
      Uitgaven voor jaarlijkse licenties voor aanvoermodules voor systemen voor aanvoerprognoses en areaalenquêtes als
      bedoeld in [artikel 152][ref1] zijn voor maximaal 50% subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel152
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '152'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '158.1'
    text: |-
      Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten ten behoeve van voorraadbeheer
      en distributie, het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning als bedoeld in
      [artikel 152, eerste lid][ref1], zijn subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel152
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '152'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '1'
  - number: '158.2'
    text: 'Bij de indiening van het operationeel programma overlegt de producentenorganisatie aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel158
  - number: 158.2.a
    text: een begroting van het aantal uren per taak of functie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel158
  - number: 158.2.b
    text: een omschrijving van de taken en functies.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel158
  - number: '159'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder iii, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 159.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 159.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel159
  - number: '160.1'
    text: |-
      Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor markt en afzet zijn subsidiabel indien
      het systeem tot doel heeft:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: 160.1.a
    text: kwaliteitsverbetering van het proces;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: 160.1.b
    text: koppeling van vraag aan aanbod, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: 160.1.c
    text: efficiencyverbetering.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: '160.2'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn gedurende maximaal 4 jaar subsidiabel, te rekenen vanaf de aanvang van
      de activiteit.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: '160.3'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van het aantal systemen, bedoeld in het eerste lid, en het aantal aansluitingen van haar klanten op deze systemen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel160
  - number: '161.1'
    text: |-
      Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor customer relationship management zijn
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '161.2'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn vanaf de aanvang van de activiteiten gedurende maximaal 4 jaar
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '161.3'
    text: |-
      Onder de uitgaven, bedoeld in het eerste lid, vallen kosten voor de interface van de ICT systemen voor customer
      relationship management, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.3.a
    text: een aanvoerregistratiesysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.3.b
    text: een verkoopsysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.3.c
    text: het verladingssysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.3.d
    text: een orderregistratiesysteem, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.3.e
    text: een facturatiesysteem.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '161.4'
    text: |-
      Uitgaven als bedoeld in het eerste lid op locatie van de leden van de producentenorganisatie zijn slechts
      subsidiabel indien de producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het ICT systeem
      voor customer relationship management van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '161.5'
    text: Uitgaven voor het verder uitrollen van ICT systemen voor customer relationship management zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '161.6'
    text: |-
      In geval van de uitgaven, bedoeld in het eerste lid, wordt door de producentenorganisatie aan de minister bij de
      indiening van het operationeel programma een onderbouwd plan overlegd met daarin:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.6.a
    text: een gedetailleerde beschrijving van het project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.6.b
    text: een begroting van de investeringskosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.6.c
    text: een definiëring van de onderdelen van de investeringskosten;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.6.d
    text: een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: 161.6.e
    text: een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel161
  - number: '162.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van de bundeling van productstromen zijn subsidiabel, indien het
      gaat om innovatieve op afzetverbetering gerichte investeringen in:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.a
    text: 'sorteer- en verpakcentra:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.b
    text: distributiecentra;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.c
    text: verwerkingscentra;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.d
    text: fustopslag;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.e
    text: dockboards, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.1.f
    text: sorteer- en verpakkingslijnen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: '162.2'
    text: 'Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.2.a
    text: investeringen ter vervanging van oude centra als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.2.b
    text: standaard sorteer- en verpakkingslijnen op teeltbedrijven en op bestaande locaties van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: 162.2.c
    text: met de sorteerlijn geïntegreerde aanvoerprognosesystemen;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: '162.3'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel162
  - number: '163.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van de bundeling van productstromen zijn subsidiabel, indien het
      gaat om de kosten van het huren van de investeringen bedoeld in [artikel 162, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel162
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '162'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '163.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om de uitgaven bedoeld in
      [artikel 162, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel162
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '162'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '163.3'
    text: |-
      De uitgaven, bedoeld in het eerste lid, zijn subsidiabel in het jaar waarin zij aan de producentenorganisatie zijn
      gefactureerd.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel163
  - number: '163.4'
    text: |-
      In het geval de uitgaven, bedoeld in het eerste lid, betrekking hebben op twee uitvoeringsjaren van het
      operationeel programma, zijn deze uitgaven, in afwijking van [artikel 289a, eerste lid][ref1], subsidiabel in het
      jaar waarin zij aan de producentenorganisatie zijn gefactureerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel289a
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: 289a
  - number: '163.5'
    text: |-
      De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister voor de
      uitgaven, bedoeld in het eerste lid, een huurcontract.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel163
  - number: '164.1'
    text: 'Uitgaven van de producentenorganisatie in vollegrondsteelt zijn subsidiabel indien:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: 164.1.a
    text: |-
      het gaat om investeringen in gecombineerde oogst- sorteer- en verpakkingssystemen, waaronder apparatuur, bestemd
      voor het reinigen, sorteren, wegen of verpakken van de in de grond geteelde gewassen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: 164.1.b
    text: de investeringen gebruikt worden in het veld direct na de oogstfase.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: '164.2'
    text: |-
      In geval van een geïntegreerd systeem met een oogstmachine zijn de meerkosten van de toegevoegde functies ten
      opzichte van een vergelijkbare oogstmachine zonder extra functies als uitgaven als bedoeld in het eerste lid,
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: '164.3'
    text: |-
      Indien de in het eerste lid bedoelde uitgaven een mobiel pakstation betreffen, zijn maximaal twee in het pakstation
      geïntegreerde wagens subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: '164.4'
    text: Investeringen in aparte oogstsystemen en tractoren zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel164
  - number: '165'
    text: |-
      Uitgaven van producentenorganisaties voor de van ICT systemen voor markt en afzet, bedoeld in
      [artikel 160, eerste lid][ref1], zijn subsidiabel indien het gaat om de kosten van de benodigde aanpassingen van
      het systeem en de interface, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel160
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '160'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 165.a
    text: een aanvoerregistratiesysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
  - number: 165.b
    text: een verkoopsysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
  - number: 165.c
    text: een verladingssysteem;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
  - number: 165.d
    text: een orderregistratiesysteem, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
  - number: 165.e
    text: een facturatiesyteem
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel165
  - number: '166.1'
    text: |-
      Uitgaven van de producentenorganisatie ten behoeve van het ontwerpen, bouwen en implementeren van ICT systemen voor
      customer relationship management systemen als bedoeld in [artikel 161, eerste lid][ref1], zijn subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel161
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '161'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '166.2'
    text: 'Bij de indiening van het operationeel programma overlegt de producentenorganisatie aan de minister:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel166
  - number: 166.2.a
    text: een begroting van het aantal uren per taak of functie, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel166
  - number: 166.2.b
    text: een omschrijving van de taken en functies.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel166
  - number: '167.1'
    text: |-
      Uitgaven van de producentenorganisatie voor personeel en externe diensten voor nieuwbouw van sorteercentra en
      verpakcentra, distributiecentra, verwerkingscentra, fustopslag, dockboards en innovatieve op afzetverbetering
      gerichte sorteer- en verpakkingslijnen, bedoeld in [artikel 162, eerste lid][ref1], ten behoeve van het ontsluiten
      van nieuwe markten zijn subsidiabel indien het gaat om:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel162
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '162'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 167.1.a
    text: de kosten van bouwkundig advies;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.b
    text: de kosten van bouwbegeleiding;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.c
    text: de kosten van projectmanagement;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.d
    text: de kosten van onafhankelijk toezicht op uitvoering van een project;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.e
    text: de kosten van haalbaarheidsstudies;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.f
    text: juridische en administratiekosten,
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: 167.1.g
    text: reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: '167.2'
    text: |-
      Uitgaven als bedoeld in het eerste lid waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden
      geactiveerd in het investeringsbedrag zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: '167.3'
    text: |-
      Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel167
  - number: '168'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder iv, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
        hoofdstuk: '1'
  - number: 168.a
    text: |-
      [deel 4, hoofdstuk 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
  - number: 168.b
    text: deze afdeling.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel168
  - number: '169'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur
      van de producentenorganisatie door professionalisering van de producentenorganisatie richting de markt zijn
      subsidiabel, indien het gaat om de kosten voor:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: 169.a
    text: 'onderzoek naar activiteiten van de producentenorganisatie op het gebied van:'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: 169.a.1
    text: afzet;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: 169.a.2
    text: logistiek;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: 169.a.3
    text: kwaliteit;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: 169.a.4
    text: milieubescherming, en
