  - number: 169.b
    text: experimentele productie.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel169
  - number: '170'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 43, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 19, eerste lid,
      onderdeel g, onder v, van [verordening 543/2011](onbekend), zijn subsidiabel, indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Artikel43
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0034320
        artikel: '43'
