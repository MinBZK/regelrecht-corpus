  - number: 312a.3
    text: |-
      In afwijking van het eerste lid, toont de producentenorganisatie, ter uitvoering van artikel 31, vierde
      lid, van [verordening 2017/891](onbekend), voor investeringen gedaan vanaf 1 januari 2018 het gebruik van
      duurzame productiemiddelen aan met behulp van een gebruiksadministratie per productiemiddel, tenzij de
      producentenorganisatie het gebruik van het productiemiddel op andere wijze aantoont ten genoegen van de minister.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.4
    text: |-
      De producentenorganisatie meldt de minister bij het indienen van het verzoek tot wijziging als bedoeld in
      artikel 65 van [verordening 543/2011](onbekend) voor het komende uitvoeringsjaar op welke wijze op welke wijze de
      gebruiksadministratie, bedoeld in het derde lid, gevoerd wordt.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.5
    text: |-
      In afwijking van het eerste lid wordt een operationeel programma beheerst door de bepalingen van de regeling
      zoals deze gelden vanaf 1 januari 2017 indien de producentenorganisatie op grond van artikel 65 of artikel 66 van
      [verordening 543/2011](onbekend) na 1 juli 2016 verzoekt om een wijziging van een operationeel programma dat strekt
      tot een aanpassing van de looptijd van het operationeel programma.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.6
    text: |-
      Het toevoegen van een activiteit aan een operationeel programma als bedoeld in het eerste lid door middel van een
      wijzigingsverzoek grond van artikel 65 of artikel 66 van verordening 543/2011 dat is ingediend na 1 juli 2016 is
      toegestaan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.6.a
    text: indien de activiteit subsidiabel is op grond van de regeling zoals deze geldt vanaf 1 januari 2017, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.6.b
    text: |-
      onder de voorwaarden die [hoofdstuk 3][ref1] en [4 van deel 4][ref2] van de regeling aan deze activiteit stelt
      vanaf 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: 312a.7
    text: |-
      Het toevoegen van een maatregel als bedoeld in artikel 19, eerste lid, van verordening 543/2011 of een doel als
      bedoeld in artikel 33, eerste lid, of 152, eerste lid, onder c, van verordening 1308/2013 aan een operationeel
      programma als bedoeld in het eerste lid door middel van een wijzigingsverzoek op grond van artikel 65 of artikel 66
      van verordening 543/2011 dat is ingediend na 1 juli 2016 is toegestaan:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.7.a
    text: indien de activiteit subsidiabel is op grond van de regeling zoals deze geldt vanaf 1 januari 2017, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.7.b
    text: |-
      onder de voorwaarden die [hoofdstuk 3][ref1] en [4 van deel 4][ref2] van de regeling aan deze activiteit stelt
      vanaf 1 januari 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034320#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
    references:
      - id: ref1
        bwb_id: BWBR0034320
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034320
        hoofdstuk: '4'
  - number: 312a.8
    text: |-
      Uitgaven voor investeringen in duurzame productiemiddelen die niet of onder andere voorwaarden subsidiabel zijn
      op grond van de regeling zoals deze geldt vanaf 1 januari 2017 kunnen worden opgenomen in een nieuw operationeel
      programma onder de voorwaarden voor subsidiabele activiteiten zoals deze golden voor 31 december 2016 indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.8.a
    text: zij onderdeel uitmaken van een voor 20 januari 2016 goedgekeurd operationeel programma;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.8.b
    text: |-
      de producentenorganisatie voor deze investering voor 31 december 2016 aan de minister heeft gemeld dat deze
      uitgaven gedurende meerdere jaren in de steunaanvraag worden opgenomen, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.8.c
    text: de eerste termijn van deze uitgaven voor 31 december 2016 in de steunaanvraag is opgenomen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.9
    text: |-
      Na 1 juli 2016 mogen geen verzoeken tot wijziging op grond van artikel 65 of 66 van verordening 543/2011 worden
      ingediend indien:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.9.a
    text: deze strekken tot het toevoegen van investeringen in duurzame productiemiddelen aan een operationeel programma, en
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.9.b
    text: deze investeringen niet subsidiabel zijn onder de regeling zoals deze geldt vanaf 1 januari 2017.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.10
    text: |-
      Een wijziging als bedoeld in artikel 65 of 66 van verordening 543/2011 is niet toegestaan indien deze strekt tot
      het in eenmaal in de steunaanvraag opnemen van de resterende termijn van uitgaven voor investeringen in duurzame
      productiemiddelen waarvoor de producentenorganisatie voor 31 december 2016 aan de minister heeft gemeld deze
      uitgaven in meerdere termijnen in de steunaanvraag op te nemen.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.11
    text: |-
      Wijzigingen van statuten van producentenorganisaties als gevolg van aanpassing van deze regeling treden uiterlijk
      op 1 januari 2018 in werking.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.12
    text: |-
      In afwijking van het eerste lid dient een producentenorganisatie een wijziging als bedoeld in artikel 66, eerste
      lid, van verordening 543/2011 in op:
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.12.a
    text: 1 februari van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.12.b
    text: 1 mei van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.12.c
    text: 1 augustus van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft, of
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: 312a.12.d
    text: 31 oktober van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel312a
  - number: '313'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel313
  - number: '314'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoering GMO groenten en fruit.'
    url: https://wetten.overheid.nl/BWBR0034320/2017-07-14#Artikel314
