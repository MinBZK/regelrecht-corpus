preamble:
  text: |-
    Gelet op artikel 10, derde lid, van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011622/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Bij een kennisgeving als bedoeld in
      [artikel 10, eerste lid, van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1]
      verstrekt degene die voornemens is een badinrichting op te richten ten minste drie maanden
      vóór het tijdstip waarop de aanvraag om een omgevingsvergunning voor het bouwen, bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref2], vermoedelijk zal worden
      ingediend, de volgende gegevens aan gedeputeerde staten:

      a. naam, adres en telefoonnummer van de houder van de badinrichting;

      b. naam en adres van de badinrichting;

      c. of de badinrichting behoort tot een categorie als bedoeld in [artikel 2, eerste lid][ref3], [artikel 26][ref4]
      of [artikel 34 van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref5];

      d. indien de badinrichting behoort tot een categorie als bedoeld in
      [artikel 2, eerste lid, van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref6]: naam,
      adres en telefoonnummer van het laboratorium als bedoeld in [artikel 10, eerste lid, van dat besluit][ref7], dat
      bij de ingebruikneming van de badinrichting het onderzoek zal verrichten;

      e. indien de badinrichting behoort tot een categorie als bedoeld in
      [artikel 2, eerste lid, van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref8]: een
      stromingsschema van de waterbehandeling met een zodanige toelichting dat een oordeel gevormd kan worden over de
      opzet en capaciteit ervan;

      f. indien de badinrichting behoort tot een categorie als bedoeld in [artikel 2, eerste lid][ref9],
      of [artikel 26 van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref10]: de
      herkomst en het kaliumpermanganaatverbruik van het in [artikel 8, tweede lid][ref11], onderscheidenlijk
      [artikel 27 van dat besluit][ref12] bedoelde water;

      g. een duidelijke overzichtstekening van de badinrichting;

      h. het maximale aantal per dag toe te laten zwemmers of baders, het maximale aantal gelijktijdig toe te laten
      zwemmers of baders, en de maximale openingstijden per dag.

      2 Gedeputeerde staten kunnen een formulier vaststellen waarop de in het eerste lid bedoelde gegevens worden
      ingediend.


