  - number: '2'
    text: |-
      1 Bij een kennisgeving als bedoeld in
      [artikel 10, eerste lid, van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1]
      verstrekt degene die voornemens is een badinrichting zodanig te wijzigen of uit te breiden dat de gegevens,
      bedoeld in [artikel 1, eerste lid, onder e, g of h][ref2], een verandering ondergaan, ten minste drie
      maanden vóór het tijdstip waarop de aanvraag om een omgevingsvergunning voor het bouwen, bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref3], vermoedelijk zal worden
      ingediend, de desbetreffende gegevens aan gedeputeerde staten.

      2 In afwijking in zoverre van het eerste lid, verstrekt degene die voornemens is een badinrichting
      zodanig te wijzigen dat de gegevens, bedoeld in [artikel 1, eerste lid, onder e][ref4], een
      verandering ondergaan en voor die verandering geen omgevingsvergunning voor het bouwen, bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref5], is vereist, ten minste
      drie maanden voordat het voornemen tot wijziging in uitvoering wordt gegeven, de desbetreffende gegevens aan
      gedeputeerde staten.

      3 [Artikel 1, tweede lid][ref6], is van overeenkomstige toepassing.


