  - number: 3.1.b
    text: |-
      degene die naar de omstandigheden beoordeeld hier te lande woonachtig is en: - een uitkering ontvangt ingevolge
      de [Algemene nabestaandenwet][ref1], tot de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar
      bereikt, dan wel
        - een arbeidsongeschiktheidsuitkering ontvangt op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], berekend naar een arbeidsongeschiktheid van tenminste
      45% dan wel
        - een arbeidsongeschiktheidsuitkering ontvangt op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3], berekend naar een arbeidsongeschiktheid van
      tenminste 45% of
        - een uitkering ontvangt op grond van [hoofdstuk 3, afdeling 2, paragraaf 2, van de Wet arbeid en zorg][ref4],
      indien betrokkene op de dag, voorafgaande aan de dag waarop haar recht op die uitkering ingaat, verzekerde was;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
