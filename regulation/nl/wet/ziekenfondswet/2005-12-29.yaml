  - number: 3.1.c
    text: |-
      vanaf de eerste dag van de maand waarin hij de leeftijd van 65 jaar zal bereiken, degene die naar de omstandigheden
      beoordeeld hier te lande woonachtig is en op de laatste dag van de voorafgaande maand verzekerde was;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.1.d
    text: degene, die behoort tot de bij of krachtens algemene maatregel van bestuur aangewezen groepen van personen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.2'
    text: |-
      Indien bij of krachtens de algemene maatregel van bestuur bedoeld in het eerste lid, onder d, een groep van
      personen als verzekerd wordt aangewezen, geldt deze aanwijzing niet voor tot die groep behorende personen, wier
      loon, verdiend in een of meer dienstbetrekkingen, meer bedraagt dan het in het eerste lid, onder *a*, genoemde
      bedrag per jaar, herzien overeenkomstig [artikel 3][ref1] van deze wet. Het bepaalde in de eerste volzin is van
      overeenkomstige toepassing op de in het eerste lid, onder b, bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
        hoofdstuk: II
        paragraaf: a
  - number: '3.3'
    text: 'Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, onder d, kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.3.a
    text: |-
      dat daarbij aan te wijzen andere inkomsten voor de toepassing van het bepaalde in het tweede lid als overeengekomen
      vast loon in geld, verdiend in een of meer dienstbetrekkingen, zullen gelden;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.3.b
    text: |-
      uit welken hoofde een verzekerde voor de toepassing van deze paragraaf als verzekerde geldt, indien hij op grond
      van meer dan één bepaling verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.4'
    text: 'Voor de toepassing van het bepaalde bij het eerste lid, onder a, en bij of krachtens het tweede lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.4.a
    text: |-
      onder loon verstaan: - elke overeengekomen vaste, naar tijdsruimte en in geld vastgestelde uitkering, welke
      de verzekerde als vergoeding voor zijn arbeid of gedurende staking van de arbeid van zijn werkgever ontvangt,
      met uitzondering van bij algemene maatregel van bestuur aan te wijzen uitkeringen of bestanddelen van zodanige
      uitkeringen;
        - een uitkering op grond van de verplichte verzekering ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1];
        - een uitkering op grond van de verplichte verzekering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2]niet zijnde de uitkering van een overheidswerknemer in de zin
      van [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3], of van een
      gewezen overheidswerknemer, berekend naar een arbeidsongeschiktheid van minder dan 45%;
        - een uitkering op grond van de verplichte verzekering ingevolge de [Ziektewet][ref4] dan wel een uitkering of
      bijdrage als bedoeld in artikel 59 van die wet, voor zover die laatstbedoelde uitkering of bijdrage door Onze
      Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid als zodanig loon is aangewezen.
        - een uitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref5] dan
      wel hoofdstuk IV van die wet niet zijnde de uitkering van een overheidswerknemer in de zin van
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref6], of van een gewezen
      overheidswerknemer;
        - een toeslag ingevolge de [Toeslagenwet][ref7];
        - een loonsuppletie als bedoeld in [hoofdstuk IIIb](onbekend) van de [Werkloosheidswet][ref8] en
      [artikel 25 van de Invoeringswet stelselherziening sociale zekerheid][ref9];
        - een uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend) aan de
      werknemer of gelijkgestelde, bedoeld in artikel 3:6, eerste lid, van die wet;


