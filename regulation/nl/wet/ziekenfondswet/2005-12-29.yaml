  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt als gehuwd of als echtgenoot mede aangemerkt de ongehuwde
      meerderjarige die met een andere ongehuwde meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een
      bloedverwant in de eerste graad.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1
  - number: 1a.1
    text: |-
      Er is een College voor zorgverzekeringen, dat rechtspersoonlijkheid bezit. Het College zorgverzekeringen is
      gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1a
  - number: 1a.2
    text: |-
      Het College zorgverzekeringen is belast met de taken die hem zijn opgedragen bij of krachtens deze wet,
      de [Algemene Wet Bijzondere Ziektekosten][ref1], de [Wet financiering volksverzekeringen][ref2], de
      [Overgangswet verzorgingshuizen][ref3], de [Wet op de toegang tot ziektekostenverzekeringen 1998][ref4], de
      [Wet tarieven gezondheidszorg][ref5], de [Wet ziekenhuisvoorzieningen][ref6], een andere wet of een internationale
      overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0004538
      [ref3]: https://wetten.overheid.nl/BWBR0008252
      [ref4]: https://wetten.overheid.nl/BWBR0009750
      [ref5]: https://wetten.overheid.nl/BWBR0003356
      [ref6]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0004538
      - id: ref3
        bwb_id: BWBR0008252
      - id: ref4
        bwb_id: BWBR0009750
      - id: ref5
        bwb_id: BWBR0003356
      - id: ref6
        bwb_id: BWBR0002753
  - number: 1a.3
    text: Het College zorgverzekeringen wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1a
  - number: 1b.1
    text: Het College zorgverzekeringen bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.2
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op grond van
      de deskundigheid die nodig is voor de uitoefening van de taken van het College zorgverzekeringen alsmede op grond
      van maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.3
    text: |-
      Het lidmaatschap van het College zorgverzekeringen is onverenigbaar met het lidmaatschap van het College toezicht.
      Bij ministeriële regeling kunnen andere functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met
      het lidmaatschap van het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.4
    text: |-
      Bij de samenstelling van het College zorgverzekeringen wordt gestreefd naar evenredige deelneming van vrouwen en
      personen behorende tot etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.5
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.6
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1b.7
    text: |-
      Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College zorgverzekeringen en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1b
  - number: 1c.1
    text: |-
      Het College zorgverzekeringen stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld omtrent
      de wijze waarop besluiten worden voorbereid, genomen en uitgevoerd, alsmede omtrent de wijze waarop afspraken
      over samenwerking met het College toezicht tot stand komen ten aanzien van aangelegenheden die het College
      zorgverzekeringen en het College toezicht beide aangaan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1c
  - number: 1c.2
    text: |-
      In het bestuursreglement kan het College zorgverzekeringen voorzien in de instelling van commissies. In commissies
      kunnen personen deelnemen die geen lid van het College zorgverzekeringen zijn. In het reglement worden regels
      gesteld over de samenstelling en taken van de ingestelde commissies.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1c
  - number: 1c.3
    text: |-
      Vergaderingen van het College zorgverzekeringen en van commissies zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1c
  - number: 1c.4
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1c
  - number: 1d.1
    text: Het College zorgverzekeringen benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1d
  - number: 1d.2
    text: Het College zorgverzekeringen stelt met betrekking tot de arbeidsvoorwaarden van het personeel regels vast.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1d
  - number: 1e
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende
      kalenderjaar. Het werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1e
  - number: 1f
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten
      voor het volgende kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1f
  - number: 1g
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het
      gevoerde beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in
      het bijzonder, alsmede gegevens omtrent de uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze
      Minister zendt het verslag aan beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het verslag
      algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1g
  - number: 1h.1
    text: |-
      Het College zorgverzekeringen brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over
      zijn beheerskosten over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de
      getrouwheid en rechtmatigheid van de ontvangsten en uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1h.2
    text: |-
      Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het financieel verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1h
  - number: 1i
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1i
  - number: 1j
    text: |-
      De beheerskosten van het College zorgverzekeringen worden volgens bij ministeriële regeling te stellen regels tot
      ten hoogste de in de begroting aangegeven bedragen gedekt uit de Algemene Kas en het Algemeen Fonds Bijzondere
      Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1j
  - number: 1k
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1k
  - number: 1l.1
    text: Een besluit van het College zorgverzekeringen kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1l
  - number: 1l.2
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1l
  - number: 1l1.1
    text: |-
      Het College zorgverzekeringen bevordert de rechtmatige en doelmatige uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] door de uitvoeringsorganen en door de rechtspersonen, bedoeld in
      [artikel 14][ref2] van deze wet en [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1l1
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '16'
  - number: 1l1.2
    text: |-
      Het College zorgverzekeringen kan met het oog op de rechtmatige en doelmatige uitvoering beleidsregels
      stellen voor de uitvoeringsorganen en de rechtspersonen, bedoeld in [artikel 14][ref1] van deze wet en
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1l1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '16'
  - number: 1m
    text: |-
      Het College zorgverzekeringen geeft aan de uitvoeringsorganen en aan de rechtspersonen, bedoeld in
      [artikel 14][ref1] van deze wet en [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2], aan personen
      en instellingen die vormen van hulp of zorg verlenen, alsmede op verzoek van Onze Minister aan verzekerden
      voorlichting over het beleid op het terrein van de ziektekostenverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1m
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '14'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '16'
  - number: 1n.1
    text: |-
      Het College zorgverzekeringen rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid
      van voorgenomen beleid op het terrein van de ziekenfondsverzekering of de algemene verzekering bijzondere
      ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1n
  - number: 1n.2
    text: |-
      Het College zorgverzekeringen signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het
      terrein van de ziekenfondsverzekering of de algemene verzekering bijzondere ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1n
  - number: 1o.1
    text: 'Het College zorgverzekeringen bevordert de afstemming van de uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
  - number: 1o.1.a
    text: de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
  - number: 1o.1.b
    text: de ziekenfondszekering met de uitvoering van de algemene verzekering bijzondere ziektekosten,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
  - number: 1o.1.c
    text: |-
      de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten met de uitvoering van het beleid op
      andere terreinen van de volksgezondheid, en
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
  - number: 1o.1.d
    text: |-
      de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten met de uitvoering van het beleid op
      andere terreinen van sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
  - number: 1o.2
    text: |-
      Het College zorgverzekeringen kan met het oog op de afstemming beleidsregels stellen voor
      de uitvoeringsorganen en de rechtspersonen, bedoeld in [artikel 14][ref1] van deze wet en
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1o
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '14'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '16'
  - number: 1p.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het College zorgverzekeringen ten laste van de Algemene Kas
      dan wel ten laste van het Algemeen Fonds Bijzondere Ziektekosten, overeenkomstig in die regeling gestelde regels
      subsidies verstrekt:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
  - number: 1p.1.a
    text: |-
      voor voorzieningen, ten aanzien waarvan het voornemen bestaat deze te doen opnemen in de aanspraken ingevolge deze
      wet of de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1p.1.b
    text: |-
      voor voorzieningen die aan verzekerden ingevolge deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref1] kunnen
      worden geboden in plaats van een voorziening waarop ingevolge die wetten aanspraak bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1p.1.c
    text: voor activiteiten welke ten doel hebben verbetering van de zorgverlening te bevorderen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
  - number: 1p.1.d
    text: |-
      ten behoeve van verzekerden ingevolge deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref1] om hen de
      mogelijkheid te geven om in plaats van het tot gelding brengen van een aanspraak ingevolge die wetten zelf te
      voorzien in de zorg die zij behoeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1p.1.e
    text: |-
      voor onderzoek met betrekking tot de uitvoering van deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1p.1.f
    text: |-
      voor andere bij die regeling aan te wijzen doeleinden, verband houdende met de verzekering ingevolge deze wet of de
      [Algemene Wet Bijzondere Ziektekosten][ref1] of de volksgezondheid in het algemeen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1p.2
    text: |-
      In een regeling als bedoeld in het eerste lid kan worden bepaald dat daarbij aan te wijzen bevoegdheden
      met betrekking tot de verstrekking van subsidies worden uitgeoefend door een of meer door het College
      zorgverzekeringen aan te wijzen rechtspersonen als bedoeld in [artikel 14][ref1] van deze wet of
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '14'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '16'
  - number: 1p.3
    text: |-
      In een regeling als bedoeld in het eerste lid kan aan het College zorgverzekeringen worden opgedragen nadere regels
      te stellen. De nadere regels behoeven de goedkeuring van Onze Minister. Goedkeuring kan slechts worden onthouden
      wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
  - number: 1p.4
    text: Onze Minister kan jaarlijks voor een categorie van subsidies het subsidieplafond voor het komende jaar bekendmaken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1p
  - number: 1q.1
    text: |-
      Er is een Algemene Kas, waarin gestort worden de gelden, bedoeld in [artikel 14a, eerste lid, onder a][ref1], met
      uitzondering van de nominale premies, bedoeld in [de artikelen 17][ref2] en [18, tweede lid][ref3], alsmede de
      gelden, bedoeld in [artikel 14a, eerste lid, onder b, en tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 14a
        hoofdstuk: II
        paragraaf: c
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '17'
        hoofdstuk: II
        paragraaf: c
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '18'
        hoofdstuk: II
        paragraaf: c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 14a
        hoofdstuk: II
        paragraaf: c
  - number: 1q.2
    text: Het College zorgverzekeringen is belast met het beheer van de Algemene Kas.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
  - number: 1q.3
    text: 'De middelen van de Algemene Kas worden aangewend:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
  - number: 1q.3.a
    text: ten behoeve van gehele of gedeeltelijke dekking van de kosten van de ziekenfondsverzekering;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
  - number: 1q.3.b
    text: |-
      ten behoeve van uitgaven voor de ziekenfondsverzekering, voortvloeiende uit enige andere wettelijke regeling of
      uit overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
  - number: 1q.3.c
    text: |-
      ten behoeve van het verstrekken van subsidies als bedoeld in [artikel 1p][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1p
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1p
        hoofdstuk: IA
  - number: 1q.3.d
    text: ten behoeve van het vormen van een reserve, overeenkomstig bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1q
  - number: 1r.1
    text: |-
      Het College zorgverzekeringen houdt de financiële middelen die deel uitmaken van de Algemene Kas, in rekening-
      courant bij Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.2
    text: |-
      Het College zorgverzekeringen kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële
      middelen die hij in rekening-courant bij Onze Minister van Financiën houdt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.3
    text: |-
      In afwijking van het eerste lid kan het College zorgverzekeringen een deel van de in het eerste lid bedoelde
      financiële middelen buiten de in het eerste lid bedoelde rekening-courant houden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.4
    text: |-
      Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met het College
      zorgverzekeringen, de omvang van het in het derde lid bedoelde deel van de financiële middelen vast.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.5
    text: |-
      Bij een tekort aan financiële middelen maakt het College zorgverzekeringen gebruik van de kredietfaciliteiten die
      door Onze Minister van Financiën worden verleend.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.6
    text: |-
      Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen ten aanzien van de rekening-courant,
      in elk geval met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.6.a
    text: de slotstanden per dag;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.6.b
    text: alle dagelijks geboekte mutaties of transacties in de rekening-courant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.7
    text: |-
      Het College zorgverzekeringen informeert Onze Minister van Financiën ten aanzien van de rekening-courant in elk
      geval met betrekking tot de prognoses van de saldi van de rekening-courant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.8
    text: Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.9
    text: |-
      Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met het College
      zorgverzekeringen, regels omtrent de rente die over de saldi van de in het eerste lid bedoelde rekening-courant
      wordt vergoed onderscheidenlijk in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1r.10
    text: |-
      Onze Minister van Financiën kan in overeenstemming met Onze Minister, na overleg met het College zorgverzekeringen,
      regels stellen omtrent het eerste, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1r
  - number: 1s.1
    text: |-
      Het College zorgverzekeringen zendt met betrekking tot de Algemene Kas en het Algemeen Fonds Bijzondere
      Ziektekosten jaarlijks voor 31 december aan Onze Minister een financieel verslag over de uitgaven en ontvangsten in
      het voorafgaande kalenderjaar en de toestand van die kas en dat fonds per 31 december van dat jaar. Artikel 1i is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.2
    text: 'Het financieel verslag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.2.a
    text: |-
      een verklaring over de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1s.2.b
    text: |-
      een verklaring van de accountant over de rechtmatigheid van het beheer met betrekking tot de uitgaven en
      ontvangsten van de Algemene Kas en van het Algemeen Fonds Bijzondere Ziektekosten;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.2.c
    text: een rapport van de accountant over de ordelijkheid en controleerbaarheid van het gevoerde financieel beheer;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.2.d
    text: |-
      een rapport over de mate waarin de uitgaven en ontvangsten van de Algemene Kas en van het Algemeen Fonds Bijzondere
      Ziektekosten zijn gedekt door rechtmatigheidsverklaringen of rechtmatigheidsrapportages van derden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.3
    text: |-
      Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het financieel verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.4
    text: 'Het College zorgverzekeringen rapporteert Onze Minister gevraagd en ongevraagd omtrent:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.4.a
    text: |-
      de benodigde omvang van de ten laste van de Algemene Kas en het Algemeen Fonds Bijzondere Ziektekosten besteedbare
      middelen voor de ziekenfondsverzekering onderscheidenlijk de algemene verzekering bijzondere ziektekosten;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
  - number: 1s.4.b
    text: |-
      de hoogte van de premie, bedoeld in [artikel 15, eerste lid][ref1], en van de premie, bedoeld in
      [artikel 39, eerste lid, onder a, van de Wet financiering volksverzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel39
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '39'
  - number: 1t.1
    text: |-
      Het College zorgverzekeringen is tegenover personen of instellingen, die terzake van aan verzekerden op grond van
      deze wet verleende zorg vorderingen hebben op een ziekenfonds, aansprakelijk voor de betaling daarvan, wanneer dat
      ziekenfonds verkeert in de toestand, dat het heeft opgehouden te betalen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1t
  - number: 1t.2
    text: Het Rijk is tegenover het College zorgverzekeringen aansprakelijk voor de betalingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1t
  - number: 1u.1
    text: |-
      Er is een College van toezicht op de zorgverzekeringen, dat rechtspersoonlijkheid bezit. Het College toezicht is
      gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1u
  - number: 1u.2
    text: |-
      Het College toezicht is belast met het toezicht op de rechtmatige en doelmatige uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] door de uitvoeringsorganen. Het College toezicht kan bij algemene
      maatregel van bestuur tevens worden belast met het toezicht op andere organen voor zover deze taken vervullen die
      rechtstreeks verband houden met de uitvoering van de ziekenfondsverzekering of de algemene verzekering bijzondere
      ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1u
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1u.3
    text: |-
      In een krachtens deze wet, de [Algemene Wet Bijzondere Ziektekosten][ref1], de
      [Wet financiering volksverzekeringen][ref2] of een andere wet vast te stellen algemene maatregel van bestuur of
      ministeriële regeling kan het nemen van een voor de toepassing van die wetten te nemen besluit, voor zover dat voor
      de goede uitoefening van taken door het College toezicht wenselijk is, worden opgedragen aan het College toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1u
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0004538
  - number: 1u.4
    text: Het College toezicht wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1u
  - number: 1v.1
    text: Het College toezicht bestaat uit een oneven aantal van ten hoogste vijf leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1v
  - number: 1v.2
    text: |-
      [Artikel 1b, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1b
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1v
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1b
        hoofdstuk: IA
  - number: 1w
    text: |-
      [De artikelen 1c, eerste, derde en vierde lid][ref1], en [1d tot en met 1l][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1d
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1w
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1c
        hoofdstuk: IA
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1d
        hoofdstuk: IA
  - number: 1x.1
    text: Het College toezicht wijst de medewerkers aan die zijn belast met het toezicht.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x
  - number: 1x.2
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15 tot en met 5:17][ref3] en
      [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing ten aanzien van de op grond van
      het eerste lid aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 1x.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x
  - number: 1x1.1
    text: |-
      Het College toezicht rapporteert voor 1 november aan Onze Minister en aan het College
      zorgverzekeringen per uitvoeringsorgaan over de rechtmatigheid van de uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] in het voorafgaande kalenderjaar. Daarbij wordt per uitvoeringsorgaan
      een verklaring gegeven over de rechtmatigheid van de in de financiële verantwoording over het voorafgaande
      kalenderjaar door het uitvoeringsorgaan opgenomen posten. Indien het College toezicht uitgaven of besparingen op
      beheerskosten van een uitvoeringsorgaan als niet verantwoord heeft aangemerkt, vermeldt het dat in zijn verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1x1.2
    text: |-
      Het College toezicht zendt voor 1 november aan Onze Minister en aan het College zorgverzekeringen een samenvattend
      rapport over de rechtmatigheid van de uitvoering van deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref1]
      door de uitvoeringsorganen in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1x1.3
    text: |-
      Onze Minister zendt het rapport, bedoeld in het tweede lid, tegelijk met het financieel verslag, bedoeld in
      [artikel 1s][ref1], aan beide kamers der Staten-Generaal. Het College toezicht stelt het rapport, bedoeld in het
      tweede lid, algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1s
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x1
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1s
        hoofdstuk: IA
  - number: 1x1.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de rapportages, bedoeld in
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x1
  - number: 1x2.1
    text: |-
      Het College toezicht zendt jaarlijks aan Onze Minister en aan het College zorgverzekeringen rapportages over de
      resultaten van de door hem uitgevoerde onderzoeken naar de doelmatigheid van de uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] door de uitvoeringsorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x2
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1x2.2
    text: |-
      Onze Minister zendt de rapportages, bedoeld in het eerste lid, aan beide kamers der Staten-Generaal. Het College
      toezicht stelt de rapportages, bedoeld in het eerste lid, algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x2
  - number: 1x2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de rapportages, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x2
  - number: 1x3.1
    text: |-
      Het College toezicht maakt, onverminderd zijn bevoegdheid tot eigen onderzoek, zoveel mogelijk gebruik van de
      resultaten van door anderen verrichte controles.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x3
  - number: 1x3.2
    text: |-
      De uitvoeringsorganen verstrekken desgevraagd aan het College toezicht de informatie over de uitgevoerde
      werkzaamheden van hen die met de controle zijn belast en lichten hem volledig in over de resultaten van de controle
      door overlegging van rapporten of op andere door het College toezicht aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x3
  - number: 1x4
    text: |-
      Het College toezicht stelt naast het in het werkprogramma opgenomen onderzoek, op verzoek van Onze Minister
      onderzoek in bij uitvoeringsorganen. Het College toezicht kan tevens op verzoek van het College zorgverzekeringen
      onderzoek bij de uitvoeringsorganen instellen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x4
  - number: 1x5.1
    text: |-
      Het College toezicht adviseert desgevraagd of uit eigen beweging het College zorgverzekeringen over de intrekking
      van:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x5
  - number: 1x5.1.a
    text: |-
      een toelating als bedoeld in [artikel 36, eerste lid][ref1], van deze wet en
      [artikel 35, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel35
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '36'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '35'
  - number: 1x5.1.b
    text: |-
      een toestemming als bedoeld in [artikel 41, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel41
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '41'
        hoofdstuk: III
  - number: 1x5.1.c
    text: |-
      een ontheffing als bedoeld in [artikel 42, vijfde lid][ref1], van deze wet en
      [artikel 41, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel41
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '42'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '41'
  - number: 1x5.2
    text: Het College toezicht brengt een advies als bedoeld in het eerste lid onverwijld ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x5
  - number: 1x6
    text: |-
      Het College toezicht rapporteert desgevraagd aan Onze Minister over de uitvoerbaarheid en doelmatigheid van
      voorgenomen beleid in verband met de uitoefening van zijn toezichthoudende taak.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x6
  - number: 1x7
    text: |-
      Het College toezicht, onderscheidenlijk het College zorgverzekeringen kan in overeenstemming met het College
      zorgverzekeringen, onderscheidenlijk het College toezicht regels stellen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x7
  - number: 1x7.a
    text: de administratie en controle door de uitvoeringsorganen,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x7
  - number: 1x7.b
    text: |-
      de inhoud en inrichting van het verslag, bedoeld in [artikel 43e][ref1] en het financieel verslag, bedoeld in
      [artikel 43f][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel43e
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel43f
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x7
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 43e
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 43f
        hoofdstuk: III
  - number: 1x7.c
    text: |-
      de accountantscontrole en de inhoud en inrichting van het rapport, bedoeld in [artikel 43f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel43f
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x7
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 43f
        hoofdstuk: III
  - number: 1x8.1
    text: Het College toezicht kan uit hoofde van zijn toezichthoudende taak een aanwijzing geven aan een uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x8
  - number: 1x8.2
    text: |-
      Een aanwijzing kan geen betrekking hebben op de besluitvorming betreffende de toekenning van een verstrekking of
      een vergoeding aan een verzekerde.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x8
  - number: 1x8.3
    text: |-
      Bij de aanwijzing stelt het College toezicht een termijn waarbinnen het uitvoeringsorgaan aan de aanwijzing moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x8
  - number: 1x8.4
    text: |-
      Indien het uitvoeringsorgaan niet binnen de termijn, bedoeld in het derde lid, aan de aanwijzing voldoet, is het
      College toezicht bevoegd tot toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x8
  - number: 1x9.1
    text: |-
      Het College toezicht kan een ziekenfonds geheel of gedeeltelijk onder bewind stellen indien het van oordeel is dat
      bij het ziekenfonds sprake is van wanbeheer of dat een toestand dreigt te ontstaan waarin het ziekenfonds zijn taak
      niet naar behoren vervult. De onderbewindstelling beslaat ten hoogste twee jaar en kan telkens met ten hoogste een
      jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.2
    text: |-
      Onder onderbewindstelling wordt verstaan het slechts mogen uitoefenen van bevoegdheden met toestemming van een of
      meer door het College toezicht aangewezen personen en met inachtneming van de opdrachten van deze personen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.3
    text: 'Een besluit tot onderbewindstelling of tot verlenging daarvan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.3.a
    text: de tijdstippen waarop het bewind ingaat en eindigt,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.3.b
    text: de naam van de persoon of personen die het bewind voeren,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.3.c
    text: een beschrijving van de taken en bevoegdheden van de bewindvoerders,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.3.d
    text: |-
      voor zover het niet betreft alle activiteiten of onderdelen van een ziekenfonds, een aanduiding van de activiteiten
      of onderdelen van het ziekenfonds waarop de onderbewindstelling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.4
    text: |-
      Het College toezicht brengt een besluit tot onderbewindstelling onverwijld ter kennis van het ziekenfonds, het
      College zorgverzekeringen en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.5
    text: Het ziekenfonds is verplicht te handelen overeenkomstig de opdrachten van de bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.6
    text: Het College toezicht kan een bewindvoerder tussentijds vervangen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.7
    text: |-
      Voor schade ten gevolge van een handeling die is verricht in strijd met het besluit tot onderbewindstelling,
      is degene die deze handeling als orgaan van het ziekenfonds heeft verricht, persoonlijk aansprakelijk tegenover
      het ziekenfonds. De vernietigbaarheid van de handeling kan worden ingeroepen door het ziekenfonds, indien
      de wederpartij wist of daarvan niet onkundig kon zijn, dat deze handeling in strijd was met het besluit tot
      onderbewindstelling.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x9.8
    text: |-
      De kosten die de bewindvoerders maken ter uitvoering van de aan hen opgedragen taken, alsmede het honorarium van de
      bewindvoerders komen ten laste van het ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x9
  - number: 1x10
    text: |-
      Het College toezicht kan, optredende voor een uitvoeringsorgaan een schadevergoeding vorderen van een
      bestuurder of gewezen bestuurder voor schade, veroorzaakt door diens nalatigheid of wanbeheer. De voorgaande
      volzin is ten aanzien van ziekenfondsen eveneens van toepassing ten aanzien van degenen, bedoeld in
      [artikel 1x9, zevende lid, eerste volzin][ref1], voor schade als in dat lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x9
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x10
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x9
        hoofdstuk: IB
  - number: 1x11.1
    text: |-
      Een uitvoeringsorgaan verstrekt op verzoek van het College zorgverzekeringen dan wel het College toezicht,
      overeenkomstig de daarbij door het desbetreffende college gestelde eisen en binnen de daarbij gestelde termijn,
      kosteloos alle gegevens en inlichtingen die het desbetreffende college nodig acht voor de uitoefening van zijn
      taak.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x11
  - number: 1x11.2
    text: |-
      Een uitvoeringsorgaan verleent op verzoek van het College zorgverzekeringen dan wel het College toezicht aan
      door het desbetreffende college aangewezen personen toegang tot en inzage in alle gegevens die het desbetreffende
      college nodig acht voor de uitoefening van zijn taak. De aangewezen persoon is bevoegd van de gegevens kopieën
      te maken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x11
  - number: 1x11.3
    text: |-
      Het eerste en tweede lid zijn tevens van toepassing op een rechtspersoon waaraan een uitvoeringsorgaan een deel van
      zijn werkzaamheden heeft opgedragen of overgedragen, voor zover het die werkzaamheden betreft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x11
  - number: 1x12.1
    text: |-
      Het College toezicht, onderscheidenlijk het College zorgverzekeringen kan na overleg met het College
      zorgverzekeringen, onderscheidenlijk het College toezicht regels stellen welke gegevens en inlichtingen
      regelmatig door de uitvoeringsorganen moeten worden verstrekt. De regels kunnen mede omvatten het tijdstip en
      de wijze waarop de gegevens en inlichtingen moeten worden verstrekt, alsmede dat een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de juistheid van de verstrekte gegevens en inlichtingen
      bevestigt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1x12.2
    text: |-
      Bij ministeriële regeling kan worden bepaald welke statistische gegevens de uitvoeringsorganen verzamelen
      betreffende verstrekking van zorg, vergoeding van kosten van zorg dan wel vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x12
  - number: 1x13.1
    text: |-
      Een natuurlijke persoon of rechtspersoon voor wie een uitvoeringsorgaan werkzaamheden verricht of heeft verricht,
      verstrekt op verzoek van het College zorgverzekeringen dan wel het College toezicht, overeenkomstig de door
      het desbetreffende college gestelde eisen en binnen de daarbij gestelde termijn, kosteloos alle gegevens en
      inlichtingen voor zover dat voor de vervulling van de taak van het desbetreffende college strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x13
  - number: 1x13.2
    text: |-
      Een natuurlijke persoon of rechtspersoon voor wie een uitvoeringsorgaan werkzaamheden verricht of heeft verricht,
      verleent op verzoek van het College zorgverzekeringen dan wel het College toezicht aan door het desbetreffende
      college aangewezen personen toegang tot en inzage in alle gegevens voor zover dat voor de vervulling van de taak
      van het desbetreffende college strikt noodzakelijk is. De aangewezen persoon is bevoegd van de gegevens kopieën
      te maken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x13
  - number: 1x14.1
    text: |-
      Indien een uitvoeringsorgaan behoort tot een groep, verstrekt het aan het College zorgverzekeringen dan wel het
      College toezicht, voor zover dat voor de vervulling van de taak van het desbetreffende college redelijkerwijs
      noodzakelijk is, op verzoek overeenkomstig de door het desbetreffende college gestelde eisen en binnen de daarbij
      gestelde termijn, kosteloos alle gegevens en inlichtingen over:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.1.a
    text: de zeggenschapsstructuur van de groep,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.1.b
    text: de financiële structuur van de groep,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.1.c
    text: de inrichting van de administratieve organisatie en interne controle van de groep,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.1.d
    text: de activiteiten van de leden van de groep,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.1.e
    text: |-
      de personen die het beleid van de groep, of van leden van de groep bepalen of medebepalen en wier beleid uit dien
      hoofde van belang is voor het uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.2
    text: |-
      Onder de overeenkomstig het eerste lid gestelde voorwaarden verleent het daar bedoelde uitvoeringsorgaan op verzoek
      van het desbetreffende college aan door dat college aangewezen personen toegang tot en inzage in alle in dat lid
      bedoelde gegevens. Het uitvoeringsorgaan biedt voorts gelegenheid tot het kopiëren van die gegevens.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.3
    text: |-
      Gegevens en inlichtingen die ingevolge het bepaalde bij of krachtens deze wet zijn verstrekt of verkregen over de
      groep of de andere leden van de groep worden niet gepubliceerd en zijn geheim.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.4
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van het eerste of tweede lid enige taak vervult, verboden
      van gegevens of inlichtingen, ingevolge het eerste of tweede lid verstrekt of verkregen, verder of anders
      gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van deze wet, de
      [Algemene Wet Bijzondere Ziektekosten][ref1] of de [Wet financiering volksverzekeringen][ref2] wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0004538
  - number: 1x14.5
    text: |-
      Het derde en vierde lid laten, ten aanzien van degene op wie het derde lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1] die betrekking hebben op het als
      getuige of deskundige in strafzaken afleggen van een verklaring over gegevens of inlichtingen verkregen bij de
      vervulling van zijn ingevolge deze wet opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 1x14.6
    text: |-
      Het derde en vierde lid laten evenzo, ten aanzien van degene op wie het vierde lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en
      van [artikel 66 van de Faillissementswet ][ref2]die betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring over gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen over een lid van een groep als bedoeld in het eerste lid, die in staat van faillissement
      is verklaard of op grond van een rechterlijke uitspraak is ontbonden. Het in de voorgaande volzin bepaalde geldt
      niet voor gegevens of inlichtingen die betrekking hebben op leden van een groep, die betrokken zijn of zijn geweest
      bij een poging het desbetreffende lid van de groep in staat te stellen zijn bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: 1x14.7
    text: |-
      Het College zorgverzekeringen en het College toezicht zijn, in afwijking van het derde en vierde lid, bevoegd met
      gebruikmaking van gegevens of inlichtingen verkregen bij de vervulling van de hen ingevolge deze wet opgedragen
      taak, mededelingen te doen mits deze niet kunnen worden herleid tot afzonderlijke leden van de groep niet zijnde
      uitvoeringsorganen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
  - number: 1x14.8
    text: |-
      Het derde en vierde lid laten onverlet de bevoegdheden van de Algemene Rekenkamer ingevolge
      [artikel 59 van de Comptabiliteitswet][ref1]. De Rekenkamer is bij het doen van mededelingen als bedoeld in
      [artikel 59][ref2], elfde tot en met veertiende lid, van de Comptabiliteitswet, verplicht tot geheimhouding voor
      zover het betreft gegevens en inlichtingen die haar ingevolge de eerste volzin bekend zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel59
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x14
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '59'
  - number: 1x15.1
    text: |-
      Het College zorgverzekeringen en het College toezicht zijn bevoegd ter handhaving van
      [de artikelen 1x11, eerste en tweede lid][ref1], en [1x14, eerste en tweede lid][ref2], een last onder dwangsom op
      te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x11
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1x14
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x15
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x11
        hoofdstuk: IC
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1x14
        hoofdstuk: IC
  - number: 1x15.2
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 1x16
    text: |-
      Het College zorgverzekeringen en het College toezicht verstrekken elkaar wederzijds die inlichtingen die van belang
      kunnen zijn voor de uitoefening van de uit deze wet voortvloeiende taken. Artikel 1x14, derde lid, is daarbij niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1x16
  - number: 1y.1
    text: |-
      Het College zorgverzekeringen en het College toezicht verstrekken desgevraagd aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1y
  - number: 1y.2
    text: |-
      Het College zorgverzekeringen en het College toezicht verlenen aan door Onze Minister aangewezen personen toegang
      tot en inzage in alle gegevens die Onze Minister nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1y
  - number: 1z
    text: |-
      Het College zorgverzekeringen en het College toezicht verstrekken desgevraagd aan het College
      tarieven gezondheidszorg, bedoeld in de [Wet tarieven gezondheidszorg][ref1], en aan het College
      bouw ziekenhuisvoorzieningen en het College sanering ziekenhuisvoorzieningen, bedoeld in de
      [Wet ziekenhuisvoorzieningen][ref2], de voor de uitoefening van hun taak benodigde inlichtingen. De bedoelde
      colleges kunnen inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van hun
      taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel1z
    references:
      - id: ref1
        bwb_id: BWBR0003356
      - id: ref2
        bwb_id: BWBR0002753
  - number: '2'
    text: |-
      Vreemdelingen die niet rechtmatig in Nederland verblijf genieten als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], zijn niet verzekerd ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.1'
    text: 'Verzekerd is:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.1.a
    text: |-
      de werknemer in de zin van de [Ziektewet][ref1], wiens loon, verdiend in een of meer dienstbetrekkingen in de zin
      van de [Ziektewet][ref2], niet meer bedraagt dan f 62 200 per jaar, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
  - number: 3.1.a.1e
    text: |-
      ten aanzien van degene die ingevolge [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd, gedurende het eerste jaar voor zover hij recht heeft op een werkloosheidsuitkering berekend naar 70%
      van het dagloon, de verzekering ingevolge deze wet wordt beoordeeld naar zijn verzekeringssituatie op de dag
      voorafgaande aan die waarop dat artikel op hem van toepassing werd;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 3.1.a.2e
    text: |-
      ten aanzien van degene die ingevolge [artikel 8 ][ref1]of [8c van de Ziektewet][ref2] als werknemer in de zin van
      die wet wordt beschouwd, de verzekering ingevolge deze wet wordt beoordeeld naar zijn verzekeringssituatie op de
      dag voorafgaande aan die waarop dat artikel op hem van toepassing werd;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
