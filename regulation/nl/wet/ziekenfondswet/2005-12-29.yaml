  - number: 3.4.b
    text: het over een of meer gedeelten van een jaar verdiende loon tot jaarloon herleid;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.4.c
    text: |-
      tot het einde van een kalenderjaar geen rekening gehouden met wijzigingen van het loon, welke tijdens de duur van
      de dienstbetrekking onderscheidenlijk van de uitkering, bijdrage, toeslag of loonsuppletie na 1 november van het
      voorafgaande kalenderjaar plaatsvinden of hebben plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.4.d
    text: |-
      geen rekening gehouden met de wijzigingen van het loon, die tijdens de duur van de dienstbetrekking
      plaatsvinden of hebben plaatsgevonden als gevolg van het genieten van onbetaald verlof in de zin van
      [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] dan wel een publiekrechtelijke regeling inzake onbetaald
      verlof of ouderschapsverlof;.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: 3.4.e
    text: |-
      geen rekening gehouden met de wijzigingen van het loon, welke tijdens de duur van de dienstbetrekking plaatsvinden
      of hebben plaatsgevonden als gevolg van een verhindering de arbeid te verrichten wegens ziekte, tenzij de
      betrokkene ter zake van de verhindering inmiddels een uitkering op grond van de verplichte verzekering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '3.5'
    text: |-
      Voor de toepassing van het bepaalde bij het eerste lid, onder a, en bij of krachtens het tweede lid wordt het loon,
      verdiend in een arbeidsverhouding als bedoeld in [artikel 6, eerste lid, onderdeel a, van de Ziektewet][ref1] dan
      wel artikel 8b van die wet geacht te zijn verdiend in een dienstbetrekking in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
  - number: '3.6'
    text: |-
      Voor de toepassing van het bepaalde bij het eerste lid, onder a, sub 2e, wordt, wanneer uitkering wordt ontvangen
      op grond van:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.6.a
    text: |-
      [artikel 46 van de Ziektewet][ref1], als dag voorafgaande aan die, waarop [artikel 8 van die wet][ref2] van
      toepassing werd, aangemerkt de dag, waarop de verzekering eindigde ter zake waarvan [artikel 46][ref3] is
      toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel46
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '46'
  - number: 3.6.b
    text: |-
      [artikel 3:10 van de Wet arbeid en zorg][ref1], als dag voorafgaande aan die, waarop
      [artikel 8c van de Ziektewet][ref2] van toepassing werd, aangemerkt de dag waarop de verzekering op grond van
      de [artikelen 3 tot en met 8 van de Ziektewet][ref3] eindigde laatstelijk voorafgaande aan de toepassing van
      [artikel 3:10 van de Wet arbeid en zorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel8c
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 8c
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '3.7'
    text: |-
      Het eerste lid, onder c, is slechts van toepassing indien betrokkene in het tijdvak van vijf jaar, onmiddellijk
      voorafgaande aan de maand waarin hij de leeftijd van 65 jaar bereikt, tenminste drie jaar verzekerde is geweest.
      Bij ministeriële regeling kan worden bepaald dat voor daarbij aan te wijzen categorieën van personen als bedoeld in
      het eerste lid, onder c, niet van toepassing is de in de eerste volzin genoemde voorwaarde of de voorwaarde dat zij
      op de laatste dag van de maand, voorafgaande aan de maand waarin zij de leeftijd van 65 jaar bereiken, verzekerde
      waren.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.8'
    text: |-
      De voorwaarde dat de persoon, bedoeld in het eerste lid, onder b of c, naar de omstandigheden beoordeeld hier
      te lande woonachtig is, is niet van toepassing op degene die naar de omstandigheden beoordeeld woonachtig is
      op het grondgebied van een andere lid-staat van de Europese Unie, dan wel een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of een staat waarmee Nederland een verdrag inzake sociale
      zekerheid heeft gesloten, indien betrokkene met toepassing van de desbetreffende verordening van de Raad van de
      Europese Unie onderscheidenlijk met toepassing van het desbetreffende verdrag recht op prestaties kan doen gelden,
      welke in beginsel worden verleend ten laste van de middelen van de ziekenfondsverzekering.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën van personen, bedoeld in het eerste lid, van de
      verzekering worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.10'
    text: |-
      Bij de algemene maatregel van bestuur bedoeld in het eerste lid, onder d, kunnen in afwijking van [artikel 2][ref1]
      vreemdelingen als verzekerden worden aangewezen, voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '2'
        hoofdstuk: II
        paragraaf: a
  - number: 3.10.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: 3.10.b
    text: |-
      vreemdelingen die, na in Nederland rechtmatig verblijf te hebben genoten als bedoeld in
      [artikel 8, onder a tot en met e en l , van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.10.c
    text: |-
      hier te lande verblijvende vreemdelingen anders dan bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], ter uitvoering van een verdrag dan wel
      een besluit van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.11'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, categorieën
      van personen, behorende tot de in het eerste lid, onderdeel a, bedoelde personen aanwijzen, die, indien zij de wens
      daartoe te kennen geven, niet verzekerd zijn ingevolge deze wet. Onze Minister kan regels stellen met betrekking
      tot de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
  - number: '3.12'
    text: |-
      Het eerste lid van dit artikel is niet van toepassing op degene die uitsluitend vanwege de hoogte van zijn
      inkomen niet verzekerd is ingevolge [artikel 3d][ref1]. Op degene die in de loop van een kalenderjaar voor
      het eerst verzekerd is geworden ingevolge [artikel 3, eerste lid, aanhef en onder a][ref2], van de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen is de eerste volzin van toepassing met ingang van 1 januari van het
      daarop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: '3.13'
    text: |-
      Voor de toepassing van het eerste lid, onder a, sub 1e, worden perioden waarin recht op uitkering op grond van
      de [Werkloosheidswet][ref1] bestaat samengeteld indien het recht op uitkering na gehele eindiging van dat recht
      herleeft op grond van [artikel 21 van die wet][ref2]. Voor de toepassing van de eerste volzin worden met perioden
      waarin recht op uitkering op grond van de [Werkloosheidswet][ref3] bestaat gelijkgesteld, perioden waarin geen
      recht bestaat op die uitkering op grond van het feit dat betrokkene een uitkering krachtens de [Ziektewet][ref4]
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0001888
  - number: 3a.1
    text: |-
      Het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref1], wordt door Onze Minister telkens herzien met ingang
      van 1 januari. Bij die herziening wordt, met inachtneming van het bij en krachtens het tweede lid bepaalde, dit
      bedrag verhoogd of verlaagd overeenkomstig het procentuele verschil tussen het indexcijfer der lonen op 31 juli
      daaraan voorafgaande en het indexcijfer, dat bij de laatste herziening is gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3a.2
    text: |-
      Onder indexcijfer der lonen wordt verstaan het indexcijfer van de CAO-lonen per maand inclusief bijzondere
      uitkeringen, sector particuliere bedrijven, zoals dat op basis van het jaar 2000 wordt berekend door het Centraal
      Bureau voor de Statistiek naar de stand op de laatste werkdag van elke kalendermaand en voor de eerste maal, al dan
      niet voorlopig, wordt gepubliceerd in het «Statistisch Bulletin van het Centraal Bureau voor de Statistiek». Het in
      de eerste volzin genoemde jaartal kan bij ministeriële regeling worden gewijzigd. Bij de eerstvolgende herziening
      nadat een dergelijke regeling is getroffen, wordt, in afwijking van het eerste lid, het procentuele verschil
      gehanteerd tussen het indexcijfer der lonen op 31 juli daaraan voorafgaande en het indexcijfer, dat bij de laatste
      herziening zou zijn gehanteerd, ware de indexcijferreeks reeds op het gewijzigde jaartal gebaseerd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
  - number: 3a.3
    text: Het op grond van de vorige leden berekende bedrag wordt naar boven afgerond op een veelvoud van € 50.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
  - number: 3a.4
    text: |-
      Het overeenkomstig de vorige leden herziene bedrag treedt in de plaats van het bedrag, genoemd in
      [artikel 3, eerste lid, onder ][ref1], met dien verstande, dat de afronding, bedoeld in het vorige lid, bij de
      eerstvolgende toepassing van het eerste lid buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3a.5
    text: |-
      Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kan het bedrag, genoemd in
      [artikel 3, eerste lid, onder ][ref1], bij algemene maatregel van bestuur worden herzien. Het ingevolge de vorige
      volzin herziene bedrag treedt in de plaats van het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref2], met
      dien verstande, dat de herziening voor de eerstvolgende toepassing van het eerste lid geacht wordt niet te hebben
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3a.6
    text: |-
      Indien een herziening als in het vorige lid bedoeld zou samenvallen met een herziening als bedoeld in het eerste
      lid, blijft laatstbedoelde herziening achterwege.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
  - number: 3a.7
    text: |-
      Wanneer een herziening van het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref1], overeenkomstig het
      bepaalde in de vorige leden er naar Ons oordeel toe zou leiden, dat het aantal verzekerde werknemers in de zin van
      deze wet beduidend zou toenemen dan wel afnemen, kan:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3a.7.a
    text: bij algemene maatregel van bestuur worden bepaald, dat herziening achterwege blijft, of
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
  - number: 3a.7.b
    text: |-
      bij algemene maatregel van bestuur die herziening op zodanige wijze plaatsvinden, dat het bedoelde toenemen dan wel
      afnemen niet of niet ten volle zal optreden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3a
  - number: 3b.1
    text: |-
      [Artikel 3, eerste lid, onder b][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3b.1.a
    text: |-
      degene die recht heeft op een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], indien hij deelneemt dan wel op de dag, voorafgaande
      aan de dag waarop zijn recht op die uitkering ingaat, deelnam aan een publiekrechtelijke ziektekostenregeling voor
      ambtenaren, als bedoeld in [artikel 4, zestiende lid, onder b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: 3b.1.b
    text: |-
      degene die een uitkering ingevolge de [Algemene nabestaandenwet][ref1] ontvangt, wegens het overlijden van een
      persoon die op de dag van zijn overlijden deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren,
      als bedoeld in [artikel 4, zestiende lid, onder b][ref2], indien die uitkering met ingang van de eerste dag van de
      maand van dat overlijden wordt ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: 3b.1.c
    text: |-
      degene die een uitkering ingevolge de [Algemene nabestaandenwet][ref1] ontvangt, indien hij deelneemt dan wel op de
      dag, voorafgaande aan de eerste dag van de maand met ingang waarvan de uitkering wordt ontvangen, deelnam aan een
      publiekrechtelijke ziektekostenregeling voor ambtenaren, als bedoeld in [artikel 4, zestiende lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: 3b.2
    text: |-
      Bij ministeriële regeling kunnen door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, andere categorieën van personen worden aangewezen, op wie [artikel 3, eerste lid, onder b][ref1],
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3b.3
    text: |-
      Bij ministeriële regeling kunnen door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, categorieën van personen worden aangewezen op wie, indien zij de wens daartoe te kennen geven,
      [artikel 3, eerste lid, onder b][ref1], niet van toepassing is. Bij die regeling wordt voorzien in hetgeen verder
      terzake regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 3c.1
    text: |-
      Verzekerde is voorts degene van 65 jaar of ouder, die zich daartoe heeft aangemeld bij een ziekenfonds indien hij
      naar de omstandigheden beoordeeld hier te lande woonachtig is, en het inkomen van hem en zijn eventuele echtgenote
      niet hoger is dan f 39 550 . Bij de aanmelding bij een ziekenfonds overlegt de verzekerde een verklaring van de
      Sociale verzekeringsbank waaruit blijkt dat het inkomen van hem en zijn eventuele echtgenote niet hoger is dan het
      bedrag genoemd in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.2
    text: De verzekering ingevolge het eerste lid gaat in op de eerste dag van de maand volgend op de dag van aanmelding.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.3
    text: |-
      Voor de toepassing van het eerste lid wordt onder inkomen verstaan het gecorrigeerde verzamelinkomen,
      onderscheidenlijk het gecorrigeerde belastbare loon. Bij ministeriële regeling wordt vastgesteld welk tijdvak
      voor de bepaling van het inkomen in aanmerking wordt genomen en worden regels gesteld ter uitvoering van de tweede
      volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.4
    text: |-
      [Artikel 3a][ref1] is van overeenkomstige toepassing op het bedrag, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
        hoofdstuk: II
        paragraaf: a
  - number: 3c.5
    text: |-
      Het eerste lid geldt niet voor degene die op de laatste dag van de maand voorafgaande aan de maand waarin hij de
      leeftijd van 65 jaar heeft bereikt, deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren als
      bedoeld in [artikel 4, zestiende lid, onder b][ref1], of als gezinslid in de zin van die regeling werd aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: 3c.6
    text: |-
      Het gecorrigeerde verzamelinkomen is het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3c.6.a
    text: |-
      indien in het tijdvak de zelfstandigenaftrek, bedoeld in [artikel 3.76 van de Wet inkomstenbelasting 2001][ref1],
      is toegepast: € 1 355;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3c.6.b
    text: |-
      indien in het tijdvak loon wordt genoten: het hoogste van de uit de toepassing van de volgende onderdelen
      voortvloeiende bedragen:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.b.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1 605;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.b.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.c
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen kosten van woon-werkverkeer (reiskostenforfait),
      maar niet meer dan € 939;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.d
    text: |-
      indien in het kalenderjaar 2000 loon uit dienstbetrekking wordt genoten: het bedrag van de in dat jaar in
      aanmerking genomen aftrekbare kosten terzake van inkomsten uit arbeid andere dan kosten van woon-werkverkeer, na
      toepassing van artikel 37, tweede lid, van de Wet op de inkomstenbelasting 1964, verminderd met 12% van het loon
      uit tegenwoordige dienstbetrekking in dat jaar, maar met niet minder dan € 119 en met niet meer dan € 1 605;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.e
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen renten van schulden, kosten van geldleningen
      daaronder begrepen, bedoeld in artikel 45, eerste lid, onderdeel f, van de Wet op de inkomstenbelasting 1964;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.f
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen premies voor lijfrenten, maar niet meer dan €
      2 804, verminderd met € 1 036, maar niet verder dan tot nihil; indien bij de echtgenoot van degene van wie het
      gecorrigeerd verzamelinkomen wordt berekend geen premies voor lijfrenten in aanmerking genomen zijn, worden de
      bedragen van € 2 804 en € 1 036 verhoogd tot € 5 608 respectievelijk € 2 072;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.6.g
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen uitgaven tot voorziening in het levensonderhoud
      van kinderen en pleegkinderen van 27 jaar en ouder, alsmede andere bloed- en aanverwanten in de rechte lijn of
      in de tweede graad van de zijlijn, bedoeld in artikel 46, eerste lid, onderdeel a, onder 2°, van de Wet op de
      inkomstenbelasting 1964.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.7
    text: |-
      In het zesde lid wordt onder loon verstaan loon in de zin van de [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 3c.8
    text: |-
      Het gecorrigeerde belastbare loon is het belastbare loon, bedoeld in artikel 9 van de Wet op de loonbelasting 1964,
      verminderd met:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.8.a
    text: 'het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.8.a.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1 605;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.8.a.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.8.b
    text: de bedragen, bedoeld in het zesde lid, onderdelen c tot en met g.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.9
    text: Voor de toepassing van het eerste lid wordt het inkomen voorts verminderd met € 315.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.10
    text: |-
      De in het zesde lid, onderdelen c tot en met g, en achtste lid, onderdeel b, bedoelde correctieposten, worden over
      het tijdvak 2001 voor het geheel in aanmerking genomen, over het tijdvak 2002 voor 2/3 deel en over het tijdvak
      2003 voor 1/3 deel.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.11
    text: 'Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.11.a
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: 3c.11.b
    text: |-
      loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.12
    text: |-
      Onverminderd het bepaalde in het negende lid wordt over het tijdvak 2004 en volgende tijdvakken,
      in afwijking van het derde lid, onder inkomen verstaan het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], verminderd met € 487.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3c.13
    text: |-
      De inspecteur, onder wie de verzekerde of zijn eventuele echtgenoot krachtens [artikel 3, tweede lid, van de
      Algemene wet inzake rijksbelastingen](onbekend) ressorteert voor de heffing van de inkomstenbelasting, bepaalt
      op verzoek van de Sociale Verzekeringsbank het inkomen, bedoeld in het derde lid, over de tijdvakken 2001, 2002
      of 2003 van de desbetreffende verzekerde of zijn eventuele echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.14
    text: |-
      De in het dertiende lid bedoelde inspecteur verstrekt de gegevens inzake het inkomen bedoeld in het derde lid over
      de tijdvakken 2001, 2002 of 2003 aan de Sociale verzekeringsbank. Bij of krachtens algemene maatregel van bestuur
      kunnen hiervoor nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3c.15
    text: |-
      Indien het inkomen moet worden bepaald over een aan het kalenderjaar 2001 voorafgaand tijdvak, wordt in
      afwijking van het derde lid uitgegaan van alle inkomsten waarover ingevolge de artikelen 3 en 48 van de Wet op de
      inkomstenbelasting 1964 inkomstenbelasting verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3c
  - number: 3d.1
    text: 'Verzekerd gedurende een kalenderjaar is de persoon, jonger dan 65 jaar:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.1.a
    text: |-
      die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      drijft;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.1.b
    text: |-
      die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening drijft; en wiens inkomen niet meer bedraagt dan € 20 800 .
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.2
    text: |-
      De inspecteur van de rijksbelastingdienst verstrekt bij voor bezwaar vatbare beschikking aan de persoon, bedoeld
      in of krachtens het eerste lid, een verklaring waaruit blijkt dat hij voldoet aan de in het eerste lid bedoelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.3
    text: |-
      Voor de toepassing van het eerste lid blijven buiten beschouwing wijzigingen in het inkomen die door de inspecteur
      van de rijksbelastingdienst na 1 oktober worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.4
    text: |-
      Voor de toepassing van het eerste en het derde lid wordt onder inkomen verstaan de som van het belastbare
      inkomen uit werk en woning, het belastbare inkomen uit aanmerkelijk belang en het belastbare inkomen uit sparen
      en beleggen, bedoeld in de [Hoofdstukken 3][ref1], [4][ref2] en [5 van de Wet inkomstenbelasting 2001][ref3],
      verminderd met de correctieposten bedoeld in [artikel 3c, zesde lid, onderdelen a tot en met g][ref4], met dien
      verstande dat indien de berekening van het belastbare inkomen uit werk en woning of het belastbare inkomen uit
      aanmerkelijk belang tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld. Bij ministeriële regeling
      wordt bepaald over welk tijdvak het inkomen in aanmerking wordt genomen en kunnen nadere regels worden gesteld ter
      uitvoering van het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 3c
        hoofdstuk: II
        paragraaf: a
  - number: 3d.5
    text: |-
      [Artikel 3a][ref1] is van overeenkomstige toepassing op het bedrag, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
        hoofdstuk: II
        paragraaf: a
  - number: 3d.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan uitbreiding of beperking worden gegeven aan de in het eerste
      lid bedoelde verzekering.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.7
    text: |-
      [Artikel 3c, tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3c
        hoofdstuk: II
        paragraaf: a
  - number: 3d.8
    text: |-
      Over het tijdvak 2004 en volgende tijdvakken wordt, in afwijking van het vierde lid, onder inkomen verstaan
      de som van het belastbare inkomen uit werk en woning, het belastbare inkomen uit aanmerkelijk belang
      en het belastbare inkomen uit sparen en beleggen, bedoeld in de [Hoofdstukken 3][ref1], [4][ref2] en
      [5 van de Wet inkomstenbelasting 2001][ref3], verminderd voor de tijdvakken 2004 en 2005 met € 1 355; met dien
      verstande dat indien de berekening van het belastbare inkomen uit werk en woning of het belastbare inkomen uit
      aanmerkelijk belang tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '5'
  - number: 3d.9
    text: |-
      Indien het inkomen moet worden bepaald over een aan het kalenderjaar 2001 voorafgaand kalenderjaar, wordt, in
      afwijking van het vierde lid, onder inkomen verstaan: voor binnenlands belastingplichtigen, het inkomen bedoeld
      in artikel 3, eerste lid, van de Wet op de inkomensbelasting 1964 en voor buitenlands belastingplichtigen het
      binnenlandse inkomen bedoeld in artikel 48, eerste lid, van die wet met dien verstande dat indien de berekening van
      het inkomen tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
  - number: 3d.10
    text: |-
      Voor de toepassing van het eerste lid, geschiedt de toerekening van de gemeenschappelijke
      inkomensbestanddelen en bestanddelen van de rendementsgrondslag van de verzekerde en zijn partner
      overeenkomstig [artikel 2.17 van de Wet inkomstenbelasting 2001][ref1]. Onder partner wordt
      verstaan degene die partner is in de zin van [artikel 1.2, van de Wet inkomstenbelasting 2001][ref2]
      en degene die geen keuze voor behandeling als binnenlandse belastingplichtige als bedoeld in
      [artikel 1.2, derde lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref3] heeft gedaan of heeft kunnen
      doen. In geval de verzekerde en zijn partner beiden belastingplichtig zijn, geldt de gemaakte keuze, bedoeld in de
      [artikelen 1.2, eerste lid, onderdeel b][ref4], en [2.17, tweede lid, van de Wet inkomstenbelasting 2001][ref5] ook
      voor de toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3e.1
    text: 'Verzekerd is degene jonger dan 65 jaar die naar de omstandigheden beoordeeld hier te lande woonachtig is en die:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: 3e.1.a
    text: |-
      een periodieke uitkering of verstrekking op grond van een rechtstreeks uit het familierecht voortvloeiende
      verplichting ontvangt, tenzij deze uitkering of verstrekking wordt ontvangen van bloed- of aanverwanten in de
      rechte lijn of in de tweede graad van de zijlijn, en
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: 3e.1.b
    text: |-
      medeverzekerd is ingevolge artikel 4, eerste lid, op de dag voorafgaande aan de dag waarop hij niet langer behoort
      tot het huishouden van de in die bepaling bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: 3e.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: 3e.2.a
    text: |-
      degene die verzekerd is ingevolge het bepaalde bij of krachtens de artikelen 3 of 3d, dan wel die uitsluitend in
      verband met overschrijding van de voor de ziekenfondsverzekering geldende loon- of inkomensgrens niet verzekerd is;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: 3e.2.b
    text: |-
      degene wiens inkomen bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], meer bedraagt dan het in
      artikel 3d, eerste lid, genoemde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 3e.2.c
    text: |-
      degene die niet langer de in het eerste lid bedoelde periodieke uitkering of verstrekking
      ontvangt, tenzij de beëindiging van deze periodieke uitkering of verstrekking
      voortvloeit uit het ontvangen van een bij wijze van pensioenverevening ingevolge de
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________ (Stb. 1994, 342)
      ontvangen pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: 3e.3
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel3e
  - number: '4.1'
    text: |-
      Medeverzekerde is de echtgenote of echtgenoot van de verzekerde, indien deze jonger is dan 65 jaar en behoort tot
      het huishouden van de verzekerde en de verzekerde als haar of zijn kostwinner is aan te merken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.2'
    text: |-
      Medeverzekerden zijn voorts de eigen en aangehuwde kinderen en de pleegkinderen van de verzekerde, voor wie de
      verzekerde als kostwinner is aan te merken en die:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.2.a
    text: jonger dan 16 jaar zijn en tot zijn huishouden behoren;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.2.b
    text: |-
      jonger dan 16 jaar zijn, niet tot zijn huishouden behoren, en die in belangrijke mate op zijn kosten worden
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.2.c
    text: |-
      16 jaar of ouder doch jonger dan 27 jaar zijn, wier voor werkzaamheden beschikbare tijd grotendeels in
      beslag wordt genomen door of in verband met het volgen van onderwijs of van een beroepsopleiding, en die
      in belangrijke mate op zijn kosten worden onderhouden, tenzij het kind studiefinanciering geniet ingevolge
      [de Wet studiefinanciering 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 4.2.d
    text: |-
      16 jaar of ouder, doch jonger dan 27 jaar zijn, ten gevolge van ziekte of gebreken buiten staat zijn
      om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen die overigens in
      gelijke omstandigheden verkeren, kunnen verdienen, en daartoe ook hetzij in het afgelopen jaar buiten
      staat zijn geweest hetzij vermoedelijk in het eerstkomende jaar buiten staat zullen zijn, en die in
      belangrijke mate op zijn kosten worden onderhouden, tenzij bedoelde kinderen recht hebben op toekenning
      van een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
  - number: 4.2.e
    text: |-
      16 jaar of ouder doch jonger dan 18 jaar zijn, werkloos zijn en die in belangrijke mate op zijn kosten worden
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.2.f
    text: |-
      18 jaar of ouder, doch jonger dan 21 jaar zijn, na beëindiging van de studie of de beroepsopleiding werkloos zijn,
      dan wel na vestiging in of terugkeer naar het Rijk werkloos zijn en die in belangrijke mate op zijn kosten worden
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.3'
    text: |-
      Medeverzekerd is voorts één eigen of aangehuwd kind dan wel pleegkind van 16 jaar of ouder doch jonger dan 27 jaar
      van de verzekerde, indien dat tot het huishouden van de verzekerde behoort, de verzekerde als zijn kostwinner is
      aan te merken en zijn voor werkzaamheden beschikbare tijd grotendeels in beslag wordt genomen door het verzorgen
      van dat huishouden of, mits tot dat huishouden ten minste drie andere kinderen jonger dan 27 jaar behoren, door
      het medeverzorgen van dat huishouden en dat in belangrijke mate op kosten van de verzekerde wordt onderhouden. De
      vorige volzin is niet van toepassing ten aanzien van een kind dat ten gevolge van ziekte of gebreken buiten staat
      is om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.4'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens dit artikel wordt, indien het volgen van onderwijs of van de
      beroepsopleiding tijdens de loop van een kalenderkwartaal wordt beëindigd, het kind geacht het volgen van onderwijs
      of van de beroepsopleiding eerst aan het einde van dat kalenderkwartaal te hebben beëindigd. Indien het volgen van
      onderwijs of van de beroepsopleiding wordt beëindigd tijdens of bij het begin van een door de onderwijsinstelling
      vastgestelde vakantie dan wel het onderwijs of de beroepsopleiding wordt afgesloten met een eindexamen dat kort
      voor het begin van de laatste door de onderwijsinstelling vastgestelde vakantie van het desbetreffende studiejaar
      wordt afgelegd, wordt het kind geacht het volgen van onderwijs of van de beroepsopleiding eerst te hebben beëindigd
      aan het einde van het kalenderkwartaal waarin de vakantie eindigt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van het tweede lid, onder *e*, wordt een kind dat de leeftijd van 18 jaar bereikt, anders dan
      op de eerste dag van een kalenderkwartaal, geacht die leeftijd eerst te hebben bereikt op de eerste dag van het
      volgende kalenderkwartaal.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.6'
    text: |-
      Voor de toepassing van het tweede lid, onder *f*, wordt een kind dat de leeftijd van 21 jaar bereikt, anders dan op
      de eerste dag van een kalendermaand, geacht die leeftijd eerst te hebben bereikt op de eerste dag van de volgende
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.7'
    text: |-
      Een kind als bedoeld in het tweede lid, onder *e* of *f* wordt slechts als werkloos aangemerkt, indien en zolang
      het bij de Centrale organisatie werk en inkomen als werkzoekende is ingeschreven en indien deze inschrijving binnen
      een redelijke termijn heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.8'
    text: |-
      Een kind als bedoeld in het tweede lid, onder *f* is slechts medeverzekerd zolang het werkloos is, doch ten hoogste
      gedurende de twee kalenderkwartalen volgende op dat waarin de beëindiging van het onderwijs of de beroepsopleiding
      heeft plaatsgevonden dan wel volgende op dat waarin de vestiging in of de terugkeer naar het Rijk heeft
      plaatsgevonden. In afwijking van de vorige volzin is een kind dat het onderwijs of de beroepsopleiding kort voor of
      met ingang van de zomervakantie heeft beëindigd, slechts medeverzekerd zolang het werkloos is, doch uiterlijk tot 1
      januari volgende op die beëindiging.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.9'
    text: |-
      Medeverzekerden zijn bovendien de door Onze Minister aan te wijzen personen als wier kostwinner de verzekerde is
      aan te merken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.10'
    text: Een kind wordt als pleegkind beschouwd, indien het als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.11'
    text: 'Onze Minister kan bepalen in welke gevallen:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.11.a
    text: |-
      een kind te wiens aanzien niet wordt voldaan aan het bepaalde in het tiende lid, nochtans met een pleegkind wordt
      gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.11.b
    text: |-
      de echtgenote of echtgenoot van een verzekerde met wie de verzekerde nog niet samenwoont, geacht wordt tot het
      huishouden van de verzekerde te behoren;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.11.c
    text: |-
      een eigen of aangehuwd kind of pleegkind of een met een pleegkind gelijkgesteld kind geacht wordt tot het
      huishouden van de verzekerde te behoren.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.12'
    text: 'Onze Minister kan regelen stellen, naar welke wordt beoordeeld:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.12.a
    text: of een kind in belangrijke mate op kosten van de verzekerde wordt onderhouden;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.12.b
    text: |-
      of een kind buiten staat zal zijn om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen
      die overigens in gelijke omstandigheden verkeren, kunnen verdienen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.12.c
    text: of een verzekerde als kostwinner wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.13'
    text: |-
      Voor het vaststellen van de mate, waarin een eigen kind, een aangehuwd kind, een pleegkind dan wel een met een
      pleegkind gelijkgesteld kind door de verzekerde wordt onderhouden, wordt het inkomen van het kind geacht te zijn
      aangewend voor het onderhoud van dat kind.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.14'
    text: |-
      Onze Minister kan voorschriften geven ter bepaling van het inkomen van het kind als bedoeld in het dertiende lid.
      Tevens kan Onze Minister, in afwijking van het dertiende lid, bepalen dat uitkeringen welke aan de verzekerde ten
      behoeve van het kind worden verstrekt, voor de toepassing van dat lid als inkomen van het kind worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.15'
    text: Onze Minister kan nadere regelen stellen met betrekking tot de toepassing van de voorafgaande leden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.16'
    text: |-
      In afwijking van het bepaalde in het eerste, tweede, derde en negende lid worden niet als medeverzekerden
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: 4.16.a
    text: |-
      de verzekerde ingevolge het bepaalde bij of krachtens [de artikelen 3, eerste lid][ref1], of 3d
      dan wel degene die uitsluitend in verband met overschrijding van de voor de ziekenfondsverzekering
      geldende loon- of inkomensgrens niet verzekerd is ingevolge genoemde artikelen dan wel bij of krachtens
      [de artikelen 3, eerste of negende lid][ref2], dan wel 3b van de ziekenfondsverzekering is uitgezonderd, tenzij bij
      of krachtens algemene maatregel van bestuur anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
  - number: 4.16.b
    text: |-
      degene, die krachtens zijn arbeidsverhouding deelnemer is in een door Onze Minister, in overeenstemming met Onze
      Minister van Binnenlandse Zaken, aan te wijzen publiekrechtelijke ziektekostenregeling voor ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.17'
    text: |-
      Onze Minister kan bepalen uit welken hoofde een medeverzekerde voor de toepassing van dit hoofdstuk als
      medeverzekerde geldt, indien hij uit verschillenden hoofde verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
  - number: '4.18'
    text: |-
      In afwijking van [artikel 2][ref1] wordt als medeverzekerde als bedoeld in dit artikel
      aangemerkt, de vreemdeling die rechtmatig in Nederland verblijf heeft als bedoeld in
      [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '2'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '5.1'
    text: |-
      De verzekerde, die de aanspraken, welke hem en zijn medeverzekerden ingevolge dit hoofdstuk toekomen, geldend
      wil maken, meldt zich daartoe aan bij een ziekenfonds, werkende in de gemeente of in het deel van de gemeente
      waar hij woont, welk ziekenfonds verplicht is hem als zodanig in te schrijven. De verzekerde ingevolge
      [artikel 3d, eerste lid][ref1], legt daartoe de verklaring, bedoeld in [artikel 3d, tweede lid][ref2], over.
      Waar iemand woont wordt naar de omstandigheden beoordeeld. Het College zorgverzekeringen kan nadere en zonodig
      afwijkende regelen vaststellen; Onze Minister kan ten aanzien van bepaalde groepen van verzekerden een of meer
      ziekenfondsen aanwijzen, waarbij deze zich bij uitsluiting aanmelden, en kan daarbij bepalen dat een desbetreffend
      ziekenfonds in afwijking van de eerste volzin geen andere verzekerden die zich bij dat ziekenfonds aanmelden,
      inschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
  - number: '5.2'
    text: |-
      Al hetgeen verder de inschrijving als verzekerde betreft wordt bij of krachtens algemene maatregel van bestuur
      geregeld. Daarbij kunnen verplichtingen worden opgelegd aan verzekerden, gewezen verzekerden, alsmede aan hun
      werkgevers of vroegere werkgevers.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
  - number: '5.3'
    text: |-
      Werkgever is de werkgever in de zin van de [Ziektewet][ref1]. Bij of krachtens algemene maatregel van bestuur
      wordt aangegeven wie werkgever is van degenen, bedoeld in [de artikelen 3, eerste lid, onder b, c en d][ref2],
      en [3d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
  - number: '5.4'
    text: |-
      Van degene, die de regelen, bedoeld in het tweede lid, niet naleeft, kan het ziekenfonds een vergoeding vorderen
      van de deswege geleden schade. De hoogte van de vergoeding wordt bepaald overeenkomstig regelen, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
  - number: '5.5'
    text: |-
      Het bepaalde in het vierde lid is van overeenkomstige toepassing op degene die niet verzekerd is, dan wel
      anderszins niet voor inschrijving als verzekerde in aanmerking komt en zich niettemin als zodanig heeft doen
      inschrijven.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
  - number: '5.6'
    text: |-
      Tot inschrijving van een persoon, als bedoeld in [artikel 4, eerste lid][ref1], wordt door het ziekenfonds slechts
      overgegaan indien deze persoon op hetzelfde woonadres als de verzekerde aan wiens verzekering de medeverzekering
      wordt ontleend, is ingeschreven in een gemeentelijke basisadministratie, met uitzondering van bij of krachtens
      algemene maatregel van bestuur te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: 5a.1
    text: |-
      De verzekerde is verplicht desgevraagd aan het ziekenfonds waarbij hij zich aanmeldt onderscheidenlijk waarbij hij
      is ingeschreven, een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter
      inzage te verstrekken, voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 5a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de medeverzekerde die door de verzekerde bij het
      ziekenfonds wordt aangemeld, onderscheidenlijk waarbij de medeverzekerde is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5a
  - number: 5a.3
    text: |-
      Het ziekenfonds stelt voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet de identiteit
      vast van de personen bedoeld in het eerste en tweede lid aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] en neemt daarvan aard en nummer op in de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 5a.4
    text: |-
      Het ziekenfonds verlangt van de vreemdeling die zich als verzekerde of medeverzekerde aanmeldt een kopie van het
      document of de schriftelijke verklaring bedoeld in [artikel 9, tweede lid, van de Vreemdelingenwet 2000][ref1], dat
      wordt aangemerkt als een bescheid als bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6'
    text: |-
      Het beding, waarbij een verzekerde zich tegenover zijn werkgever verbindt zich te doen inschrijven bij een door die
      werkgever aangewezen ziekenfonds, is nietig.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel6
  - number: '7.1'
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of de kosten daarvan, gesloten
      door degene, die als verzekerde bij een ziekenfonds wordt ingeschreven, vervalt met ingang van de dag, waarop
      de verzekeraar van de verzekerde mededeling van de inschrijving ontvangt, voor zover aan de overeenkomst rechten
      kunnen worden ontleend, gelijkwaardig aan die, welke uit de verzekering voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel7
  - number: '7.2'
    text: |-
      De premie, welke degene, wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk
      is vervallen, heeft vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 pct. van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel7
  - number: '8.1'
    text: |-
      De verzekerden hebben, voor zover daarop geen aanspraak bestaat ingevolge de
      [Algemene Wet Bijzondere Ziektekosten][ref1], ter voorziening in hun geneeskundige verzorging aanspraak op de
      navolgende verstrekkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 8.1.a
    text: |-
      medisch-specialistische zorg, verleend door of vanwege een ziekenhuis, al dan niet gepaard gaande met opneming
      gedurende het etmaal of een deel daarvan, verpleging, verzorging, paramedische hulp of farmaceutische hulp.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.b
    text: revalidatiezorg van medisch-specialistische, paramedische, gedragswetenschappelijke en revalidatie-technische aard;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.c
    text: medisch-specialistische zorg, anders dan bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.d
    text: huisartsenzorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.e
    text: verloskundige zorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.f
    text: kraamzorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.g
    text: tandheelkundige zorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.h
    text: paramedische zorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.i
    text: zorg bestaande uit hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8.1.j
    text: farmaceutische zorg.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat op verstrekking van andere zorg dan de zorg, bedoeld in
      het eerste lid, aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: '8.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan de inhoud en omvang van de aanspraken nader worden geregeld en
      kunnen voor het tot gelding brengen van de aanspraken voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur kan als voorwaarde voor het tot gelding brengen van aanspraken worden bepaald
      dat de verzekerde een bijdrage in de kosten betaalt. Daarbij kan worden bepaald dat het vaststellen van de hoogte
      van de bijdrage en een maximum van bijdragen bij ministeriële regeling geschiedt. De bijdrage hoeft niet voor alle
      verzekerden gelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: '8.5'
    text: |-
      Ziekenfondsen dragen er zorg voor dat de bij hen ingeschreven verzekerden hun aanspraken tot gelding kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8
  - number: 8a.1
    text: |-
      Een instelling die zorg als bedoeld in [artikel 8][ref1] verleent, moet als zodanig zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: 8a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een instelling, behorende tot een bij de maatregel aan te
      wijzen categorie van instellingen, voor de toepassing van deze wet als toegelaten wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8a
  - number: 8a.3
    text: Het College zorgverzekeringen beslist op aanvragen om toelating.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8a
  - number: 8a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan de aard van de te leveren gegevens worden bepaald, alsmede de
      wijze waarop en de termijn waarbinnen aanlevering van deze gegevens geschiedt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8a
  - number: 8c
    text: 'Een toelating wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8c
  - number: 8c.a
    text: |-
      met betrekking tot instellingen die een ziekenhuisvoorziening in de zin van de [Wet ziekenhuisvoorzieningen][ref1]
      in stand houden: voor zover de instelling niet voldoet aan de ingevolge die wet geldende voorschriften inzake
      spreiding en behoefte;


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: 8c.b
    text: |-
      met betrekking tot de overige instellingen: voor zover de instelling niet voldoet aan de door Onze Minister vast te
      stellen voorschriften inzake spreiding en behoefte.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8c
  - number: 8f
    text: |-
      Indien bij de aanvraag tot toelating gegevens over de omvang van de te verlenen zorg of de werkwijze van de
      instelling zijn verstrekt, verricht de instelling zijn werkzaamheden volgens die gegevens, behoudens voor zover bij
      de toelating anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8f
  - number: 8g
    text: 'Een toelating wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8g
  - number: 8g.a
    text: |-
      voor zover de instelling niet meer voldoet aan de voorschriften, bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 8c
        hoofdstuk: II
        paragraaf: b
  - number: 8g.b
    text: |-
      indien de instelling in strijd handelt met [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8f
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 8f
        hoofdstuk: II
        paragraaf: b
  - number: 8h
    text: |-
      Een toegelaten instelling is verplicht, voor zover het College zorgverzekeringen zulks voor de toepassing van
      dit hoofdstuk behoeft, deze alle gevraagde mondelinge en schriftelijke inlichtingen en gegevens te verstrekken
      en inzage te geven van boeken en bescheiden, welke betrekking hebben op het gevoerde beheer en de verrichte
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8h
  - number: 8i
    text: |-
      Indien een maatregel als bedoeld in artikel 18*a*, eerste lid, eerste volzin, aanhef en onder *a*, of tweede
      volzin, van de [Wet ziekenhuisvoorzieningen][ref1] is getroffen, wordt de toelating geacht dienovereenkomstig te
      zijn gewijzigd dan wel ingetrokken. In afwijking van [artikel 77][ref2] kan ter zake geen beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel77
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0002753
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '77'
        hoofdstuk: VI
  - number: '9.1'
    text: |-
      De verzekerde die zijn aanspraak op een verstrekking geldend wil maken, wendt zich daartoe tot een persoon of
      een instelling met wie of met welke het ziekenfonds waarbij hij is ingeschreven tot dat doel een overeenkomst als
      bedoeld in [artikel 44][ref1] heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: '9.2'
    text: |-
      De verzekerde wordt de keuze gelaten uit de in het eerste lid bedoelde personen en instellingen, behoudens het
      vijfde lid en behoudens de [Wet ambulancevervoer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002757
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002757
  - number: '9.3'
    text: |-
      In afwijking van het eerste lid kan een ziekenfonds een verzekerde die een aanspraak op een verstrekking geldend
      kan maken toestemming verlenen zich voor de onder die verstrekking vallende zorg tot een niet door het ziekenfonds
      gecontracteerde persoon of instelling te wenden. In dit geval heeft de verzekerde in plaats van aanspraak op de
      verstrekking, aanspraak op gehele of gedeeltelijke vergoeding van de voor deze zorg gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: '9.4'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: 9.4.a
    text: |-
      wordt bepaald in welke gevallen en onder welke voorwaarden de verzekerde voor het verkrijgen van een aanspraak op
      vergoeding als bedoeld in het derde lid, geen toestemming van het ziekenfonds behoeft;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: 9.4.b
    text: |-
      wordt de hoogte van de vergoeding bepaald, waarbij deze voor verschillende gevallen verschillend kan worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: 9.4.c
    text: kunnen voorwaarden worden bepaald waaraan de verzekerde moet voldoen, wil toestemming kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: 9.4.d
    text: kan worden bepaald in welke gevallen geen toestemming wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: '9.5'
    text: |-
      In de overeenkomsten, bedoeld in het eerste lid, kan worden bepaald dat verzekerden, om hun aanspraak op de
      desbetreffende verstrekking geldend te kunnen maken, door het ziekenfonds ingeschreven moeten zijn op naam van
      een persoon of instelling. Tevens kunnen daarin bepalingen worden opgenomen ter beperking van het aantal ten name
      van een persoon of een instelling in te schrijven verzekerden. Bij reglement van het ziekenfonds kan het aantal
      overschrijvingen van een verzekerde in een bepaald tijdvak aan een maximum worden gebonden en kunnen regels worden
      gesteld betreffende de tijdstippen van overschrijving.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel9
  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke mate en onder welke voorwaarden aanspraak
      bestaat op een verstrekking of op een vergoeding wegens kosten van geneeskundige verzorging, verleend in of buiten
      Nederland, in gevallen, waarin een verzekerde als gevolg van in die algemene maatregel van bestuur omschreven
      omstandigheden geneeskundige hulp heeft ingeroepen, welke hij, hadden die omstandigheden zich niet voorgedaan, op
      de in [artikel 9][ref1] omschreven wijze had kunnen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
        hoofdstuk: II
        paragraaf: b
  - number: '11.1'
    text: |-
      Indien voor een vorm van zorg de verplichtingen, bedoeld in [artikel 47, eerste lid][ref1], en
      [artikel 48, eerste lid][ref2], niet gelden en bovendien door het College tarieven gezondheidszorg geen tarief
      als bedoeld in de [Wet tarieven gezondheidszorg][ref3] dient te worden goedgekeurd of vastgesteld, hebben de bij
      het ziekenfonds ingeschreven verzekerden in afwijking van [artikel 8, eerste en tweede lid][ref4], jegens hem de
      keuze tussen aanspraak op verstrekking van de desbetreffende zorg (natura) of aanspraak op vergoeding van kosten
      (restitutie). Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de hoogte van de
      restitutie wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003356
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '47'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '48'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003356
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: '11.2'
    text: |-
      [Artikel 8, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: '11.3'
    text: |-
      Indien het eerste lid toepassing vindt, is [artikel 9, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
        hoofdstuk: II
        paragraaf: b
  - number: '11.4'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11
  - number: 11a.1
    text: |-
      Indien een ziekenfonds in de onmogelijkheid verkeert op voor hem aanvaardbare voorwaarden met een genoegzaam aantal
      personen of instellingen ter zake van een of meer vormen van zorg overeenkomsten als bedoeld in [artikel 44][ref1]
      te sluiten, kan bij ministeriële regeling worden bepaald dat de bij het ziekenfonds ingeschreven verzekerden
      tijdelijk in plaats van aanspraak op deze zorg, jegens hun ziekenfonds aanspraak hebben op vergoeding van de voor
      deze zorg gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: 11a.2
    text: |-
      In de ministeriële regeling wordt tevens bepaald onder welke voorwaarden en tot welk bedrag aanspraak op vergoeding
      bestaat en kunnen nadere regels voor de aanspraak op een vergoeding worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11a
  - number: 11a.3
    text: |-
      Voor zover een ziekenfonds in de onmogelijkheid verkeert op voor hem aanvaardbare voorwaarden met een genoegzaam
      aantal personen of instellingen ter zake van een of meer vormen van zorg overeenkomsten te sluiten als bedoeld in
      [artikel 44][ref1], kan het College toezicht hem ontheffen van de verplichting zodanige overeenkomsten te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: 11b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke omvang, in welke mate en onder welke
      voorwaarden een verstrekking wordt voortgezet na het tijdstip waarop de verzekering is geëindigd of tot welke
      hoogte en onder welke voorwaarden aanspraak op een vergoeding bestaat voor zorg die wordt verleend na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11b
  - number: 11c.1
    text: |-
      Onverminderd het bij of krachtens deze wet bepaalde kan het ziekenfonds bij reglement de voorwaarden vaststellen
      waaronder de aanspraken, bedoeld in de [artikelen 8 tot en met 11b][ref1], geldend worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: 11c.2
    text: |-
      Het ziekenfonds zorgt er voor dat de bij hem ingeschreven verzekerden bij inschrijving en vervolgens periodiek het
      reglement of een weergave van de inhoud daarvan ontvangen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11c
  - number: 11c.3
    text: Het ziekenfonds verstrekt eenieder op diens verzoek het reglement of een weergave van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel11c
  - number: '12'
    text: |-
      De verzekerde kan aan de verzekering geen aanspraak ontlenen, indien en voor zover hij ingevolge een bij algemene
      maatregel van bestuur aangewezen regeling op geneeskundige behandeling of vergoeding van de kosten daarvan recht
      heeft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel12
  - number: '14'
    text: |-
      Ten aanzien van het verlenen van bij algemene maatregel van bestuur aan te wijzen verstrekkingen van verpleging
      en behandeling kan een bij algemene maatregel van bestuur te bepalen deel van de administratie en de controle
      worden uitgeoefend door de door Onze Minister aan te wijzen rechtspersonen, welke deze taak voor het gehele land
      of voor een gedeelte van het land dan wel voor groepen van ziekenfondsen vervullen, overeenkomstig door het College
      zorgverzekeringen. vast te stellen beleidsregels. Het College zorgverzekeringen. regelt tevens de wijze, waarop de
      kosten, voortvloeiende uit de werkzaamheden van de aangewezen rechtspersonen, worden gedekt uit de Algemene Kas.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14
  - number: 14a.1
    text: 'De middelen tot dekking van de uitgaven van de verzekering worden gevonden door:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14a
  - number: 14a.1.a
    text: het heffen van premies;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14a
  - number: 14a.1.b
    text: |-
      het verlenen van een bijdrage door het uitvoeringsorgaan als bedoeld in artikel 1, onder e, van de
      [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003933
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003933
  - number: 14a.2
    text: |-
      Onze Minister kan jaarlijks een bijdrage verlenen aan de Algemene Kas, tot het bedrag dat daarvoor in de wet
      tot vaststelling van de begroting voor zijn ministerie voor dat jaar is toegestaan. De bijdrage wordt betaald in
      gelijke maandelijkse delen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14a
  - number: 14a.3
    text: |-
      Onze Minister kan in overeenstemming met het gevoelen van de ministerraad besluiten de bijdrage te wijzigen. Van
      zodanig besluit wordt schriftelijk mededeling gedaan aan de beide kamers van de Staten-Generaal, indien de bijdrage
      daardoor met meer dan € 11 000 000 toeneemt of afneemt. De maandelijkse betalingen worden met het genomen besluit
      in overeenstemming gebracht, tenzij in een geval als bedoeld in de tweede volzin binnen veertien dagen door een der
      kamers van de Staten-Generaal de wens te kennen wordt gegeven nadere inlichtingen te ontvangen over de wijziging
      van de bijdrage. Indien een der kamers van de Staten-Generaal na het ontvangen van de bedoelde inlichtingen als
      haar oordeel uitspreekt dat de wijziging van de bijdrage voorafgaande machtiging bij wet behoeft, zal de wijziging
      eerst plaatsvinden nadat een daarop betrekking hebbend voorstel van wet tot wijziging van de begroting tot wet zal
      zijn verheven.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel14a
  - number: '15.1'
    text: |-
      Onverminderd hetgeen bij of krachtens [artikel 17][ref1] omtrent de daarbedoelde nominale premie is bepaald,
      wordt voor de verzekering van de verzekerden, bedoeld in [artikel 3, eerste lid, onder ][ref2], een procentuele
      premie geheven, in een door Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid te zamen
      te bepalen percentage van het loon, dat in het tijdvak, waarover de betaling loopt, door de verzekerden is
      genoten. Voor verzekerden, op wie de regeling van [artikel 415 van het Wetboek van Koophandel][ref3] van
      toepassing is, alsmede voor de verzekerden die ingevolge het bepaalde bij of krachtens [artikel 7][ref4], dan
      wel [artikel 8 van de Ziektewet][ref5] als werknemer in de zin van die wet worden beschouwd, indien zij een
      uitkering ontvangen op grond van een arbeidsverhouding dan wel een beëindigde arbeidsverhouding terzake waarvan
      zij behoorden tot de verzekerden op wie de regeling van [artikel 415 van het Wetboek van Koophandel][ref6]
      van toepassing was, wordt door Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid te zamen
      de premie op een lager percentage bepaald. Bij algemene maatregel van bestuur worden regels gesteld over de
      wijze waarop het in de tweede volzin bedoelde premiepercentage wordt berekend. Ten aanzien van degenen die bij
      of krachtens [artikel 7 van de Ziektewet][ref7] als werknemer in de zin van die wet worden beschouwd, is de
      tweede volzin slechts van toepassing gedurende het eerste jaar zolang en voor zover zij recht hebben op een
      werkloosheidsuitkering, berekend naar 70% van het dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0001838#Artikel415
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '17'
        hoofdstuk: II
        paragraaf: c
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '415'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0001838
        artikel: '415'
      - id: ref7
        bwb_id: BWBR0001888
        artikel: '7'
  - number: '15.2'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid bij ministeriële
      regeling welk deel van de procentuele premie, bedoeld in het eerste lid, door de werkgever en welk deel door de
      werknemer is verschuldigd, met dien verstande dat bedoelde premie geheel door de werkgever is verschuldigd ten
      aanzien van de verzekerde, wiens loon geheel bestaat uit verstrekkingen in natura, met of zonder huisvesting en
      onderricht. Alvorens een regeling krachtens de eerste volzin wordt vastgesteld, wordt de zakelijke inhoud ervan
      schriftelijk medegedeeld aan de beide kamers der Staten-Generaal. De regeling treedt niet eerder in werking dan
      nadat vier weken zijn verstreken na die mededeling.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
  - number: '15.3'
    text: |-
      De werkgever is gehouden zowel de door de verzekerde als door hem zelf verschuldigde premie te betalen aan
      het Uitvoeringsinstituut werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen stelt de
      verschuldigde premie vast voor alle sectoren van het bedrijfs- en beroepsleven en vordert deze in overeenkomstig
      de bepalingen van de [Coördinatiewet Sociale Verzekering][ref1]. Indien een herziening van het in de eerste of
      de tweede volzin van het eerste lid bedoelde premiepercentage ingaat op een ander tijdstip dan met ingang van 1
      januari, gaat het Uitvoeringsinstituut werknemersverzekeringen bij de vaststelling en de invordering van de premie
      uit van een door hem, onder goedkeuring van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid,
      vast te stellen gemiddeld percentage dat zal gelden voor het gehele kalenderjaar. Het Uitvoeringsinstituut
      werknemersverzekeringen kan regels stellen waarin gevallen worden aangewezen waarbij wordt uitgegaan van de
      percentages bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: '15.4'
    text: |-
      De werkgever is bevoegd op het loon van de verzekerde in te houden het door deze verschuldigde deel der premie over
      de tijd, waarover dat loon wordt betaald. Indien de verschuldigde premie na de loonuitbetaling met terugwerkende
      kracht wordt verhoogd of indien een voorschotpremie wordt gevorderd, mag bij de definitieve vaststelling van
      de kosten niets van een eventueel door de werkgever bij te betalen of bijbetaald bedrag op de werknemer worden
      verhaald.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
  - number: '15.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stort de ontvangen bedragen in de Algemene Kas. Bij of krachtens
      algemene maatregel van bestuur kunnen regelen worden gesteld betreffende de afdracht en de verantwoording van de
      ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
  - number: '15.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de premie, verschuldigd voor de verzekering
      van de bij of krachtens die algemene maatregel van bestuur aangewezen groepen van personen, andere organen worden
      aangewezen voor de premie-inning en kunnen andere regelen worden gesteld voor de vaststelling, de invordering, de
      afdracht en de verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15
  - number: 15a.1
    text: |-
      Onverminderd hetgeen bij of krachtens [artikel 17][ref1] omtrent de daarbedoelde nominale premie is bepaald, is
      de verzekerde, bedoeld in [artikel 3d, eerste lid][ref2], een premie verschuldigd tot een door Onze Minister en
      Onze Minister van Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage over het inkomen, bedoeld in
      [artikel 3d, vierde, zevende en achtste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '17'
        hoofdstuk: II
        paragraaf: c
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
  - number: 15a.2
    text: |-
      Het inkomen wordt voor de premieheffing ten hoogste in aanmerking genomen tot het bedrag, genoemd in
      [artikel 3d, eerste lid][ref1], zoals dat geldt voor het kalenderjaar waarop de verzekering betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
  - number: 15a.3
    text: |-
      De verschuldigde procentuele premie wordt geheven en ingevorderd door de rijksbelastingdienst overeenkomstig de
      voor de heffing en de invordering van de inkomstenbelasting geldende regels, met dien verstande dat de [artikelen
      3 154](onbekend) en [9.4 van de Wet inkomstenbelasting 2001][ref1] buiten toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 15a.4
    text: |-
      Voor de toepassing van het eerste lid wordt ten aanzien van degene die bij of krachtens
      [artikel 3d, eerste lid][ref1], verzekerd is en die tevens ingevolge [artikel 3][ref2] verzekerd is, de reeds uit
      hoofde van [artikel 15, eerste lid][ref3], en bij of krachtens [artikel 18][ref4] betaalde procentuele premie in
      mindering gebracht tot maximaal de ingevolge het eerste lid verschuldigde premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel18
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '18'
        hoofdstuk: II
        paragraaf: c
  - number: 15a.5
    text: |-
      De aanslag ziekenfondspremie en de aanslag inkomstenbelasting kunnen op een aanslagbiljet worden verenigd. In dat
      geval worden de bedragen van de aanslagen afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
  - number: 15a.6
    text: |-
      Met betrekking tot het eerste tot en met vijfde lid kunnen bij ministeriële regeling door Onze Minister in
      overeenstemming met Onze Minister van Financiën nadere en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
  - number: 15a.7
    text: |-
      Indien een herziening van het in het eerste lid bedoelde premiepercentage ingaat op een ander tijdstip dan
      met ingang van 1 januari, stelt Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, een gemiddeld premiepercentage vast dat zal gelden voor het gehele kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15a
  - number: 15b.1
    text: |-
      Onverminderd hetgeen bij of krachtens artikel 17 omtrent de daar bedoelde nominale premie is bepaald, is de
      verzekerde, bedoeld in artikel 3e, een premie verschuldigd tot een door Onze Minister en Onze Minister van
      Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage over de periodieke uitkering of verstrekking.
      De geldswaarde van bedoelde verstrekking wordt gesteld op het bedrag dat bij de heffing ingevolge de
      [Wet inkomstenbelasting 2001][ref1] in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 15b.2
    text: |-
      De premie wordt per maand berekend en door het ziekenfonds waarbij de verzekerde is ingeschreven vastgesteld. Het
      ziekenfonds int de premie bij de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15b
  - number: 15b.3
    text: |-
      Voor de toepassing van dit artikel is [artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 15b.4
    text: |-
      Het ziekenfonds stort de in het tweede lid bedoelde premie in de Algemene Kas. Onze Minister kan aan het in het
      tweede lid bedoelde orgaan verplichtingen opleggen en voorschriften geven met betrekking tot de vaststelling, de
      invordering, de afdracht en de verantwoording van de premie.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15b
  - number: 15b.5
    text: Bij ministeriële regeling kunnen met betrekking tot de premieheffing nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15b
  - number: 15c.1
    text: |-
      De ontvanger van de rijksbelastingdienst stort de ingevolge [artikel 15a][ref1] ontvangen bedragen in de Algemene
      Kas.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 15a
        hoofdstuk: II
        paragraaf: c
  - number: 15c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan Onze Minister in overeenstemming met Onze Minister van
      Financiën regels stellen betreffende de afdracht en de verantwoording van de ontvangen bedragen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel15c
  - number: '16.1'
    text: |-
      Voor de toepassing van artikel 15 wordt onder loon verstaan het loon in de zin van de
      [Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: '16.2'
    text: |-
      Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel16
  - number: '17.1'
    text: |-
      Onverminderd hetgeen bij of krachtens de artikelen [15][ref1], [15a][ref2] of [15b][ref3] omtrent de
      daar bedoelde procentuele premie is bepaald, wordt voor de verzekering van de verzekerde, bedoeld in
      [artikel 3, eerste lid, onder a][ref4], [artikel 3d][ref5] of [artikel 3e][ref6], van 18 jaar of ouder, en zijn
      medeverzekerde, bedoeld in [artikel 4, eerste lid][ref7], een nominale premie geheven, waarvan de hoogte volgens
      bij of krachtens algemene maatregel van bestuur te stellen regelen wordt bepaald door het ziekenfonds waarbij de
      verzekerde is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15b
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel3e
      [ref7]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 15a
        hoofdstuk: II
        paragraaf: c
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 15b
        hoofdstuk: II
        paragraaf: c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref5
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 3e
        hoofdstuk: II
        paragraaf: a
      - id: ref7
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: '17.2'
    text: |-
      De nominale premie is verschuldigd door de verzekerde voor zich en zijn medeverzekerde, in maandelijkse termijnen
      bij vooruitbetaling te voldoen. In geval vooruitbetaling plaatsvindt over een langere termijn kan het ziekenfonds,
      rekening houdende met rente en incasso-kosten, op de verschuldigde nominale premie een korting verlenen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
  - number: '17.3'
    text: |-
      De nominale premie is verschuldigd vanaf het tijdstip van aanvang van de verzekering. Indien de aanmelding bij
      het ziekenfonds, bedoeld in [artikel 5, eerste lid][ref1], plaatsvindt later dan zestig dagen na de aanvang van
      de verzekering is de premie slechts verschuldigd vanaf de zestigste dag voor die van de aanmelding, met dien
      verstande dat in dat geval het ziekenfonds de premie over die zestig dagen kan verhogen. De verhoging bedraagt ten
      hoogste de op het tijdstip van aanmelding geldende nominale premie op jaarbasis. De tweede en derde volzin zijn van
      overeenkomstige toepassing indien de inschrijving van de verzekerde bij het ziekenfonds volgens de krachtens deze
      wet gestelde regels is beëindigd en de verzekerde, zonder dat zijn verzekering ingevolge deze wet is geëindigd,
      zich later dan zestig dagen na beëindiging van die inschrijving opnieuw bij een ziekenfonds aanmeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '5'
        hoofdstuk: II
        paragraaf: a
  - number: '17.4'
    text: |-
      De verzekerde betaalt de nominale premie aan het ziekenfonds, bedoeld in het eerste lid, dat de verschuldigde
      premie vaststelt en invordert. Bij de vaststelling van de nominale premie kan het ziekenfonds uitgaan van
      peildata, gelegen op de eerste dag van iedere kalendermaand. Indien de verzekerde nalatig blijft de verschuldigde
      nominale premie volgens de gestelde regelen te betalen kan het ziekenfonds het verschuldigde bedrag verhogen met
      administratie- en invorderingskosten. Het ziekenfonds kan voor de betaling, de vaststelling en de invordering van
      de nominale premie met inachtneming van het bepaalde bij en krachtens deze wet bij reglement nader regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
  - number: '17.5'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een bedrag bepalen
      hetwelk ten hoogste als nominale premie in rekening mag worden gebracht. Onze Minister kan omtrent het in de eerste
      volzin bedoelde besluit de Pensioen- & Verzekeringskamer horen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
  - number: '17.6'
    text: |-
      De door het ziekenfonds geheven nominale premie wordt aangewend ter dekking van de aan de uitvoering van deze wet
      voor dat ziekenfonds verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
  - number: '17.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot al hetgeen de in dit artikel bedoelde
      nominale premie betreft, verschuldigd voor de verzekering van de bij of krachtens die algemene maatregel van
      bestuur aangewezen groepen van personen, andere regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel17
  - number: '18.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt voor de verzekerden, bedoeld in
      [artikel 3, eerste lid, onder b en c][ref1], voor elke krachtens [artikel 3, eerste lid, onder d][ref2],
      aangewezen groep van verzekerden, alsmede voor de verzekerden, bedoeld in [artikel 3c][ref3], bepaald of
      premie en, zo ja, welke premie verschuldigd is, naar welke regelen die premie wordt berekend, wie de premie
      verschuldigd is, wie de premie afdraagt en welk orgaan voor de premie-inning wordt aangewezen. Bij of krachtens
      de bedoelde algemene maatregel van bestuur worden de nodige voorschriften gegeven betreffende de vaststelling,
      de invordering, de afdracht en de verantwoording van de premie, kunnen verplichtingen worden opgelegd tot het
      verstrekken van inlichtingen en tot het geven van inzage in boeken en bescheiden, nodig voor de beoordeling van de
      verzekeringsplicht en de vaststelling van de premie, en kunnen de nodige regelen worden gesteld met betrekking tot
      de controle op inhouding en afdracht van de premie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3c
        hoofdstuk: II
        paragraaf: a
  - number: '18.2'
    text: |-
      Indien voor de verzekering van een of meer groepen van verzekerden, bedoeld in het eerste lid, en hun
      medeverzekerde, bedoeld in [artikel 4, eerste lid][ref1], een nominale premie verschuldigd is als bedoeld in
      [artikel 17][ref2], wordt die nominale premie door het ziekenfonds waarbij de verzekerde die die nominale premie
      verschuldigd is, overeenkomstig [artikel 5, eerste lid][ref3], is ingeschreven, aangewend ter dekking van de aan de
      uitvoering van deze wet voor dat ziekenfonds verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel5
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '17'
        hoofdstuk: II
        paragraaf: c
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '5'
        hoofdstuk: II
        paragraaf: a
  - number: '18.3'
    text: |-
      Onverminderd het bepaalde in het eerste lid zijn de verzekerden, bedoeld in
      [de artikelen 3, eerste lid, onder c, en 3c][ref1], over hun uitkering ingevolge de
      [Algemene Ouderdomswet][ref2] een procentuele premie verschuldigd naar hetzelfde percentage als ingevolge
      [artikel 15, eerste lid, eerste volzin][ref3], voor de verzekering van de aldaar bedoelde verzekerden wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
  - number: 18a.1
    text: |-
      Indien een verzekerde in enig kalenderjaar geen of weinig gebruik heeft gemaakt van zorg waarop ingevolge deze wet
      aanspraak bestaat, heeft hij jegens het ziekenfonds waarbij hij ingeschreven was aanspraak op een uitkering. Voor
      de toepassing van dit artikel worden vergoedingen als bedoeld in de [artikelen 9, derde lid][ref1], [10][ref2],
      [11][ref3] of [11a][ref4] gelijkgesteld aan het gebruik maken van zorg waarop aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '10'
        hoofdstuk: II
        paragraaf: b
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '11'
        hoofdstuk: II
        paragraaf: b
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 11a
        hoofdstuk: II
        paragraaf: b
  - number: 18a.2
    text: |-
      Het bedrag van de uitkering voor de verzekerde die geen gebruik heeft gemaakt van zorg, wordt bij algemene
      maatregel van bestuur vastgesteld. Indien de ten laste van de ziekenfondsverzekering komende kosten van zorg
      waarvan een verzekerde gebruik heeft gemaakt, lager zijn dan het in de eerste volzin bedoelde bedrag, is de
      uitkering voor de verzekerde gelijk aan het verschil tussen dat bedrag en de kosten van de zorg.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.3
    text: |-
      Voor de toepassing van het eerste lid wordt het gebruik van verloskundige zorg, kraamzorg en huisartsenzorg buiten
      beschouwing gelaten. Voor de toepassing van het eerste lid worden tevens buiten beschouwing gelaten de bedragen die
      de verzekerde op grond van [artikel 8, vierde lid][ref1], als bijdrage in de kosten van zorg heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: 18a.4
    text: |-
      Indien de zorg in de vorm van een diagnose behandel combinatie wordt verleend, geldt als tijdstip van gebruik van
      zorg het tijdstip waarop de diagnose behandel combinatie is geopend.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.5
    text: Verzekerden voor wie geen nominale premie verschuldigd is, hebben geen aanspraak op de uitkering.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.a
    text: binnen welke termijn en op welke wijze de uitkering wordt betaald;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.b
    text: |-
      welk ziekenfonds de uitkering betaalt indien de verzekerde in het kalenderjaar achtereenvolgens bij meer dan een
      ziekenfonds was ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.c
    text: |-
      welke uitkering wordt betaald indien de verzekerde slechts een deel van het kalenderjaar bij een ziekenfonds
      was ingeschreven dan wel indien voor de verzekerde slechts een deel van het kalenderjaar een nominale premie
      verschuldigd was;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.d
    text: |-
      de gevolgen van het bekend worden van gebruik van zorg in een kalenderjaar waarvoor reeds uitbetaling van de
      uitkering heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.e
    text: |-
      welk bedrag aan kosten voor de onderscheiden vormen van zorg voor de toepassing van dit artikel in aanmerking wordt
      genomen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: 18a.6.f
    text: |-
      het indexcijfer waarmee het in het tweede lid bedoelde bedrag jaarlijks bij ministeriële regeling wordt herzien, de
      berekeningswijze en de afronding die bij die herziening worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel18a
  - number: '19.1'
    text: |-
      Het College zorgverzekeringen verstrekt aan de ziekenfondsen ten laste van de Algemene Kas jaarlijks een uitkering
      ter gehele of gedeeltelijke dekking van de kosten van de verzekering ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.2'
    text: |-
      Bij ministeriële regeling wordt jaarlijks geregeld welke middelen beschikbaar zijn voor de uitkeringen aan
      ziekenfondsen voor het volgende kalenderjaar. In die regeling worden tevens regels gesteld met betrekking tot de
      vaststelling van de uitkeringen, alsmede met betrekking tot de nadere vaststelling van de uitkeringen, bedoeld in
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.3'
    text: |-
      Het College zorgverzekeringen stelt beleidsregels vast, waarin wordt aangegeven op welke wijze het toepassing geeft
      aan de in het tweede lid bedoelde regels. De beleidsregels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.4'
    text: |-
      Het College zorgverzekeringen stelt de uitkering van elk ziekenfonds vast vóór de aanvang van het kalenderjaar
      waarop de uitkering betrekking heeft. De betaling van de uitkering geschiedt overeenkomstig door het College
      zorgverzekeringen te stellen beleidsregels.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.5'
    text: |-
      Het College zorgverzekeringen stelt na afloop van het kalenderjaar waarop de uitkering betrekking heeft, de
      uitkering nader vast. Naar het oordeel van het College toezicht onverantwoorde besparingen op de beheerskosten
      worden in mindering gebracht op de uitkering. Het verschil tussen het bedrag van de vooraf vastgestelde uitkering
      en de nader vastgestelde uitkering wordt verrekend. Voor de rente die het College zorgverzekeringen dan wel het
      ziekenfonds over het verschil heeft gederfd, wordt overeenkomstig door het College zorgverzekeringen te stellen
      beleidsregels aan het ziekenfonds een vergoeding in rekening gebracht onderscheidenlijk aan het ziekenfonds een
      vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.6'
    text: |-
      Ook na aanvang van het kalenderjaar kan bij ministeriële regeling worden geregeld dat middelen beschikbaar zijn
      voor het doen van uitkeringen. In dat geval zijn de tweede volzin van het tweede lid en het derde, vierde en vijfde
      lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '19.7'
    text: Bij ministeriële regeling kunnen ter zake van de verstrekking van uitkeringen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel19
  - number: '20'
    text: |-
      Indien een verzekerde schuldig nalatig blijft de door hem verschuldigde premie volledig te voldoen, kan het
      ziekenfonds waarbij hij is ingeschreven:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel20
  - number: 20.a
    text: |-
      de kosten van aan hem of aan zijn medeverzekerden verleende verstrekkingen, geheel of gedeeltelijk op die
      verzekerde verhalen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel20
  - number: 20.b
    text: |-
      vergoedingen waarop de verzekerde wegens de voor zorg gemaakte kosten aanspraak heeft, geheel of gedeeltelijk
      weigeren of wegens deze kosten betaalde vergoedingen geheel of gedeeltelijk van de verzekerde terugvorderen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel20
  - number: '21.1'
    text: |-
      Een ziekenfonds besteedt de middelen waarover het ten behoeve van de verzekering ingevolge deze wet de beschikking
      heeft gekregen, ter dekking van zijn ten behoeve van de uitvoering van de verzekering ingevolge deze wet
      noodzakelijke uitgaven.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel21
  - number: '21.2'
    text: |-
      De beheerskosten van een ziekenfonds worden aangemerkt als kosten voor de uitvoering van de verzekering ingevolge
      deze wet, voor zover zij niet worden gedekt door vergoedingen voor beheerskosten die het ziekenfonds ontvangt
      anders dan voor de uitvoering van de verzekering ingevolge deze wet. Indien het ziekenfonds is aangewezen als een
      rechtspersoon, bedoeld in [artikel 16, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], worden de
      beheerskosten die het in of in verband met die hoedanigheid maakt en de vergoeding die het daarvoor ontvangt voor
      de toepassing van de eerste volzin buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '16'
  - number: '21.3'
    text: |-
      Het College toezicht is bevoegd vast te stellen dat uitgaven van een ziekenfonds niet verantwoord waren voor zover
      deze door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel21
  - number: '21.4'
    text: Het College zorgverzekeringen kan voor de toepassing van het tweede lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel21
  - number: '34.1'
    text: |-
      Een rechtspersoon welke als ziekenfonds werkzaam is, moet daartoe zijn toegelaten door het College
      zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: '34.2'
    text: |-
      Op de voorbereiding van een beschikking tot toelating is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '34.3'
    text: 'Toelating als ziekenfonds wordt verleend indien de aanvrager een stichting of onderlinge waarborgmaatschappij is:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.a
    text: |-
      die ingevolge haar statuten ten doel heeft in een daarin aangegeven werkgebied het ziektekostenverzekeringsbedrijf
      uitsluitend uit te oefenen ter uitvoering van deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 34.3.b
    text: die direct noch indirect beoogt winst te maken,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.c
    text: die in haar statuten waarborgen biedt voor een redelijke mate van invloed van de verzekerden op het bestuur,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.d
    text: waarvan de dagelijkse leiding wordt gevormd door ten minste twee personen,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.e
    text: |-
      waarvan het beleid wordt bepaald door natuurlijke personen van wie de deskundigheid naar het oordeel van het
      College zorgverzekeringen voldoende is voor de uitoefening van de taken van een ziekenfonds,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.f
    text: |-
      waarvan het beleid wordt bepaald of mede bepaald door natuurlijke personen wier voornemens, handelingen of
      antecedenten het College zorgverzekeringen geen aanleiding geven tot het oordeel dat de betrouwbaarheid van deze
      personen, met het oog op de belangen van de verzekerden die ingevolge deze wet moeten worden gediend, niet buiten
      twijfel staat,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.g
    text: waarvan de onafhankelijke besluitvorming gewaarborgd is,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.h
    text: die voldoet aan de overige bij of krachtens deze wet aan ziekenfondsen gestelde eisen, en
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: 34.3.i
    text: waarvan ook overigens is te verwachten dat zij de taak van een ziekenfonds naar behoren zal uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: '34.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de mate van invloed die verzekerden ten
      minste op het bestuur van een ziekenfonds dienen te hebben.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: '34.5'
    text: |-
      Behoort de aanvrager tot een groep dan zijn de onderdelen e en f van het derde lid van overeenkomstige toepassing
      op de personen die het beleid bepalen van de groep waartoe de aanvrager behoort, voor zover uit dien hoofde hun
      beleid van belang is voor de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel34
  - number: '35.1'
    text: |-
      Bij de beschikking tot toelating als ziekenfonds kunnen aan het ziekenfonds met het oog op een goede uitvoering van
      deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref1] verplichtingen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '35.2'
    text: |-
      Ook op een later tijdstip kunnen aan het ziekenfonds met het oog op een goede uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] verplichtingen worden opgelegd. Een beschikking als bedoeld in de
      eerste volzin treedt niet in werking dan na verloop van vier weken na de dag waarop zij is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '36.1'
    text: 'De toelating wordt ingetrokken indien het ziekenfonds:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel36
  - number: 36.1.a
    text: |-
      niet meer voldoet aan de eisen, vervat in [artikel 34, derde en vijfde lid][ref1], of de aan hem opgelegde
      verplichtingen, of


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '34'
        hoofdstuk: III
  - number: 36.1.b
    text: |-
      in ernstige mate handelt in strijd met de bij enig wettelijk voorschrift ten aanzien van ziekenfondsen gestelde
      eisen of anderszins zijn taak niet naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel36
  - number: '36.2'
    text: Op aanvraag van het ziekenfonds wordt de toelating met ingang van een daarbij te bepalen datum ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel36
  - number: '36.3'
    text: |-
      Het College zorgverzekeringen regelt de gevolgen van de intrekking van de toelating en de afwikkeling der lopende
      zaken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel36
  - number: '37'
    text: |-
      Van beschikkingen ingevolge [de artikelen 34][ref1], [35, tweede lid][ref2], en [36][ref3] wordt mededeling gedaan
      in de Staatscourant, onder vermelding van het werkgebied van het betrokken ziekenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel36
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '35'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '36'
        hoofdstuk: III
  - number: 38a
    text: |-
      De leden of oud-leden van een ziekenfonds dat een onderlinge waarborgmaatschappij is, zijn niet verplicht om in een
      tekort bij te dragen. Het ziekenfonds moet aan het slot van zijn naam de letters U.A. plaatsen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel38a
  - number: 38b.1
    text: |-
      De toestemming van het College zorgverzekeringen is vereist voor de overdracht van verbintenissen van een
      ziekenfonds aan een ander ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel38b
  - number: 38b.2
    text: Aan deze toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel38b
  - number: 38b.3
    text: |-
      Bij de samenvoeging van ziekenfondsen tot een nieuw ziekenfonds gaan alle rechten, welke derden hebben jegens elk
      der ziekenfondsen welke ophouden te bestaan, over op het nieuwe ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel38b
  - number: 38c
    text: |-
      Een ziekenfonds is verplicht zijn werkzaamheden op een doelmatige wijze uit te voeren. Het treft de nodige
      maatregelen ter voorkoming van onnodige verstrekkingen en van uitgaven, welke hoger dan noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel38c
  - number: '39.1'
    text: |-
      Een ziekenfonds maakt voor de uitwisseling van gegevens ten behoeve van de uitvoering van deze wet gebruik van een
      elektronische infrastructuur.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: '39.2'
    text: |-
      Het College zorgverzekeringen kan regels stellen met betrekking tot de in het eerste lid bedoelde
      gegevensuitwisseling. De regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: 39.2.a
    text: |-
      de wijze waarop het gebruik van de infrastructuur wordt georganiseerd en beheerd, waaronder begrepen de inrichting
      en instandhouding van een gemeenschappelijke database;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: 39.2.b
    text: |-
      de wijze waarop de uitwisseling van gegevens plaatsvindt, waaronder begrepen de aansluiting van ziekenfondsen op
      deze infrastructuur;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: 39.2.c
    text: |-
      de aard en omvang van de gegevensuitwisseling en de voorschriften waaraan de gegevensuitwisseling ten minste moet
      voldoen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: 39.2.d
    text: de financiering van het gebruik van de infrastructuur en de wijze waarop de kosten ervan worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel39
  - number: '40.1'
    text: |-
      In de administratie van de ziekenfondsen ter zake van de uitvoering van deze wet wordt het sociaal-fiscaalnummer van
      de verzekerde, bedoeld in [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1],
      opgenomen, tenzij aan de verzekerde geen sociaal-fiscaalnummer is toegekend of bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '40.2'
    text: |-
      Bij de verstrekking van gegevens door de ziekenfondsen en de in [de artikelen 73b][ref1] en [73c][ref2] genoemde
      organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel73c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 73b
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 73c
        hoofdstuk: V
  - number: '41.1'
    text: |-
      Een ziekenfonds is bevoegd met toestemming van het College zorgverzekeringen administratieve werkzaamheden te
      verrichten ten behoeve van natuurlijke en rechtspersonen die zich bezighouden met werkzaamheden op het gebied van
      de volksgezondheid. Het ziekenfonds brengt de kosten van zodanige werkzaamheden aan de opdrachtgever in rekening.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel41
  - number: '41.2'
    text: |-
      Een toestemming ingevolge het vorige lid kan onder beperkingen worden verleend; aan de toestemming kunnen
      voorschriften worden verbonden. Ook na het verlenen van een toestemming kunnen daaraan beperkingen worden gesteld
      of voorschriften worden verbonden dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel41
  - number: '41.3'
    text: 'Een toestemming ingevolge het eerste lid kan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel41
  - number: 41.3.a
    text: indien wordt gehandeld in strijd met aan de toestemming verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel41
  - number: 41.3.b
    text: indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel41
  - number: '42.1'
    text: |-
      Het is een ziekenfonds verboden zelf de bij of krachtens [artikel 8][ref1] of
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref2] geregelde zorg te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: '42.2'
    text: |-
      Het is een ziekenfonds verboden aan een instelling in de zin van deze wet of de
      [Algemene Wet Bijzondere Ziektekosten][ref1] gelden voor bedrijfsuitoefening te verschaffen, zich als borg of
      hoofdelijk medeschuldenaar voor die instelling te verbinden, zich voor die instelling sterk te maken, zich tot
      zekerheid voor een schuld van die instelling te verbinden, dan wel aan die instelling bestuurlijk deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '42.3'
    text: |-
      Het is een ziekenfonds verboden, behoudens voor zover deze wet anders bepaalt, zelf tegen betaling andere dan de in
      het eerste lid bedoelde diensten of zaken aan verzekerden te leveren.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: '42.4'
    text: |-
      De in het eerste en derde lid bedoelde verboden gelden niet ten aanzien van het in gebruik geven van medische
      hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: '42.5'
    text: |-
      De in het eerste en tweede lid bedoelde verboden gelden niet in door het College zorgverzekeringen aan te geven
      gevallen. Het College zorgverzekeringen kan ontheffing van het bepaalde in het eerste, tweede en derde lid verlenen
      in bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: '42.6'
    text: |-
      Een ontheffing ingevolge het vijfde lid kan onder beperkingen worden verleend; aan de ontheffing kunnen
      voorschriften worden verbonden. Ook na het verlenen van een ontheffing kunnen daaraan beperkingen worden gesteld
      of voorschriften worden verbonden dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: '42.7'
    text: 'Een ontheffing kan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: 42.7.a
    text: indien wordt gehandeld in strijd met aan de ontheffing verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: 42.7.b
    text: indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: '42.8'
    text: Van besluiten als bedoeld in het vijfde, zesde en zevende lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel42
  - number: 43a
    text: |-
      Het is een ziekenfonds verboden personen als verzekerden in te schrijven die woonachtig zijn buiten de gemeente,
      gemeenten of delen daarvan, waar de rechtspersoon volgens zijn statuten zijn werkzaamheden als ziekenfonds wil
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43a
  - number: 43b.1
    text: |-
      Een ziekenfonds is verplicht toereikende technische voorzieningen bedoeld in
      [artikel 66, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], aan te houden. De technische
      voorzieningen dienen volledig door waarden te zijn gedekt. Bij of krachtens algemene maatregel van bestuur kunnen
      ter zake nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel66
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '66'
  - number: 43b.2
    text: |-
      Een ziekenfonds beschikt over een solvabiliteitsmarge als bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], waarvan de omvang volgens door
      Onze Minister te stellen regels wordt bepaald. Onze Minister kan omtrent in de vorige volzin bedoelde regels de
      Pensioen- & Verzekeringskamer horen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: 43b.3
    text: |-
      Een ziekenfonds houdt een reserve Ziekenfondswet aan. Bij ministeriële regeling wordt een maximum aan deze reserve
      gesteld. Indien het College zorgverzekeringen vaststelt dat de reserve Ziekenfondswet het gestelde maximum te boven
      gaat, stort het ziekenfonds het door het College zorgverzekeringen vastgestelde bedrag van de overschrijding binnen
      vier weken in de Algemene Kas.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
  - number: 43b.4
    text: |-
      Het saldo van baten en lasten van een ziekenfonds over enig boekjaar wordt toegevoegd aan onderscheidenlijk
      gebracht ten laste van de reserve Ziekenfondswet. Voor de toepassing van de eerste volzin blijven uitgaven, waarvan
      het College toezicht heeft vastgesteld dat deze niet verantwoord waren, buiten beschouwing, tenzij het College
      toezicht anders besluit. De eerste volzin is niet van toepassing op baten en lasten die in redelijkheid moeten
      worden toegerekend aan andere onderdelen van het eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
  - number: 43b.5
    text: |-
      Het ontwerp van een ministeriële regeling krachtens het derde lid wordt overgelegd aan de beide kamers der Staten-
      Generaal. De regeling treedt niet eerder in werking dan nadat vier weken zijn verstreken sedert de overlegging.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
  - number: 43b.6
    text: |-
      Indien krachtens [artikel 5, eerste lid][ref1], een ziekenfonds wordt aangewezen, waarbij de verzekerden, bedoeld
      in [artikel 15, eerste lid, tweede volzin][ref2], zich bij uitsluiting dienen aan te melden en Onze Minister
      daarbij bepaalt dat het ziekenfonds in afwijking van [artikel 5, eerste lid, eerste volzin][ref3], geen andere
      verzekerden die zich bij dat ziekenfonds aanmelden, inschrijft, gelden het eerste, tweede en derde lid niet
      ten aanzien van dat ziekenfonds. Indien Onze Minister niet heeft bepaald dat het ziekenfonds in afwijking van
      [artikel 5, eerste lid, eerste volzin][ref4], geen andere verzekerden die zich bij dat ziekenfonds aanmelden,
      inschrijft, blijven, voor zover krachtens de op grond van dit artikel te stellen regels de omvang van technische
      voorzieningen, bedoeld in het eerste lid, van de solvabiliteitsmarge, bedoeld in het tweede lid of van de reserve,
      bedoeld in het derde lid, wordt bepaald of mede wordt bepaald door verzekerdenaantallen, de verzekerden, bedoeld
      in [artikel 15, eerste lid, tweede volzin][ref5], buiten beschouwing. De eerste en tweede volzin zijn slechts van
      toepassing indien op grond van de regels krachtens [artikel 19][ref6] het desbetreffende ziekenfonds voor de kosten
      ten behoeve van zijn verzekerden, bedoeld in [artikel 15, eerste lid, tweede volzin][ref7], aanspraak heeft op
      uitkeringen naar werkelijke kosten onder aftrek van de opbrengsten ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '5'
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '5'
        hoofdstuk: II
        paragraaf: a
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '5'
        hoofdstuk: II
        paragraaf: a
      - id: ref5
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref6
        bwb_id: BWBR0002460
        artikel: '19'
        hoofdstuk: II
        paragraaf: c
      - id: ref7
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
  - number: 43c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de belegging van gelden waarover
      ziekenfondsen beschikken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43c
  - number: 43d.1
    text: |-
      In geval van liquidatie of intrekking van de toelating van een ziekenfonds heeft het College zorgverzekeringen ten
      behoeve van de Algemene Kas een vordering op het ziekenfonds ten belope van de som van de reserve Ziekenfondswet
      en de middelen, waarover het ziekenfonds ten behoeve van de uitvoering van de verzekering ingevolge deze wet de
      beschikking heeft gekregen, voor zover deze door het ziekenfonds niet zijn aangewend ter dekking van zijn ten
      behoeve van de uitvoering van de verzekering ingevolge deze wet noodzakelijke uitgaven. Uitgaven waarvan het
      College toezicht vaststelt dat deze niet verantwoord zijn, blijven daarbij buiten beschouwing, tenzij het College
      toezicht anders besluit.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43d
  - number: 43d.2
    text: |-
      Het eerste lid is niet van toepassing bij overdracht van verbintenissen van een ziekenfonds aan een ander
      ziekenfonds en bij samenvoeging van ziekenfondsen tot een nieuw ziekenfonds, voor zover het in het eerste lid
      bedoelde bedrag is overgedragen aan het andere onderscheidenlijk het nieuwe ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43d
  - number: 43e
    text: |-
      Een ziekenfonds zendt voor 1 maart aan het College zorgverzekeringen en aan het College toezicht een verslag over
      de uitvoering van deze wet in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43e
  - number: 43f.1
    text: |-
      Een ziekenfonds zendt voor 1 maart aan het College zorgverzekeringen en aan het College
      toezicht een financieel verslag over het voorafgaande kalenderjaar, dat vergezeld gaat van een
      verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 43f.2
    text: |-
      In het financieel verslag wordt een onderscheid gemaakt tussen de beheerskosten en de kosten van verstrekkingen
      en vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43f
  - number: 43f.3
    text: |-
      Op aanvraag van een uitvoeringsorgaan is het College toezicht bevoegd voor in zijn besluit aan te wijzen baten en
      lasten te besluiten dat het ontbreken van een overeenkomst als bedoeld in [artikel 44][ref1], geen gevolgen heeft
      voor de inhoud van de verklaring, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: '44.1'
    text: |-
      Ziekenfondsen sluiten schriftelijke overeenkomsten met personen en instellingen die zorg kunnen verlenen op
      verstrekking waarvan bij of krachtens [artikel 8][ref1] aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: '44.2'
    text: De duur van een overeenkomst bedraagt maximaal vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel44
  - number: '44.3'
    text: |-
      Indien na beëindiging door het ziekenfonds van een overeenkomst voor een bepaalde vorm van zorg geen aansluitende
      overeenkomst voor die vorm van zorg met dezelfde persoon of instelling tot stand komt, behoudt de verzekerde zolang
      die zorg noodzakelijk is jegens het ziekenfonds aanspraak op ononderbroken voortzetting van die vorm van zorg, te
      verlenen door dezelfde persoon of instelling, wanneer die zorg is aangevangen voor de datum waarop de overeenkomst
      met die persoon of instelling voor die desbetreffende vorm van zorg is beëindigd.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel44
  - number: '44.4'
    text: |-
      Gedurende de tijdelijke voortzetting van de zorg, bedoeld in het derde lid, gelden tussen het ziekenfonds en
      de persoon of instelling de voorwaarden van de overeenkomst waaronder de zorg aan de in het derde lid bedoelde
      verzekerde is aangevangen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel44
  - number: '45.1'
    text: 'De overeenkomsten bevatten ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.a
    text: |-
      het tijdstip waarop de overeenkomst aanvangt te werken, de duur van de overeenkomst en tussentijdse beëindiging van
      de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.b
    text: de aard, de kwaliteit, de doelmatigheid en de omvang van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.c
    text: de prijs van de te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.d
    text: de wijze waarop de verzekerden van informatie worden voorzien;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.e
    text: |-
      de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verlenen dan wel verleende
      zorg en op de juistheid van de daarvoor in rekening gebrachte bedragen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: 45.1.f
    text: de administratieve voorwaarden die partijen bij de uitvoering van de overeenkomst in acht zullen nemen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: '45.2'
    text: Bij algemene maatregel van bestuur kunnen nadere regels over de inhoud van de overeenkomsten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel45
  - number: '46'
    text: |-
      Overeenkomsten die in strijd met het bij of krachtens de [artikelen 44][ref1] of [45][ref2] bepaalde zijn gesloten,
      zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel45
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '45'
        hoofdstuk: IV
  - number: '47.1'
    text: |-
      Een ziekenfonds is verplicht met iedere instelling die binnen het werkgebied van het ziekenfonds is gelegen of
      waarvan de bevolking van het werkgebied van het ziekenfonds naar verwachting regelmatig gebruik zal maken, op haar
      verzoek een overeenkomst te sluiten als bedoeld in [artikel 44, eerste lid][ref1], tenzij het ziekenfonds daartegen
      ernstige bezwaren heeft. Het College zorgverzekeringen kan bij het verlenen van een ontheffing als bedoeld in
      [artikel 42, vijfde lid][ref2], van het bepaalde in het [eerste lid van dat artikel][ref3], bepalen of en in
      hoeverre van het gestelde in de eerste volzin kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel42
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '42'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '42'
        hoofdstuk: III
  - number: '47.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel47
  - number: '48.1'
    text: |-
      Een instelling als bedoeld in [artikel 1, onderdeel f, onder 1°][ref1], die met een ziekenfonds een overeenkomst
      als bedoeld in [artikel 44, eerste lid][ref2], heeft gesloten, is gehouden op daartoe door een ander ziekenfonds
      gedaan verzoek met dat ziekenfonds een gelijke overeenkomst te sluiten, tenzij die instelling daartegen ernstige
      bezwaren heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: '48.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen vormen van zorg of categorieën van instellingen worden
      aangewezen waarvoor het eerste lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel48
  - number: 73b.1
    text: |-
      Een ieder verstrekt op verzoek aan het College zorgverzekeringen, het College toezicht, Onze Minister van Sociale
      Zaken en Werkgelegenheid, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, de
      Rijksbelastingdienst, het gemeentebestuur, ziekenfondsen of aan een daartoe door of vanwege een van deze instanties
      aangewezen persoon kosteloos alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van deze wet
      door de desbetreffende rechtspersoon ten opzichte van:
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.a
    text: hemzelf;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.b
    text: degenen die in aanmerking kunnen komen voor medeverzekering;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.c
    text: degene die ten opzichte van hem bij of krachtens deze wet is of was aangewezen als werkgever;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.d
    text: degene die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.e
    text: degene van wie een pensioen of uitkering wordt, zal worden of is verkregen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.f
    text: degene aan wie een pensioen of uitkering wordt, zal worden of is verstrekt;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.g
    text: |-
      degene van wie inkomen uit of in verband met het verrichten van arbeid in het bedrijfs- of beroepsleven wordt, zal
      worden of is ontvangen;
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.1.h
    text: |-
      degene aan wie inkomen uit of in verband met het verrichten van arbeid in het bedrijfs- of beroepsleven wordt, zal
      worden of is verstrekt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.2
    text: |-
      De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm, of in een
      andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het in
      het eerste lid bedoelde verzoek.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73b.3
    text: |-
      Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73b
  - number: 73c.1
    text: |-
      De in [artikel 73][ref1], bedoelde instanties zijn bevoegd uit eigen beweging en verplicht op verzoek uit de
      onder hun verantwoordelijkheid gevoerde administratie, aan elkaar of aan een daartoe door of vanwege een van deze
      instanties aangewezen persoon de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet. De
      verstrekking van de gegevens geschiedt kosteloos, tenzij bij of krachtens wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 73b
        hoofdstuk: V
  - number: 73c.2
    text: |-
      Publiekrechtelijke lichamen zijn verplicht hun medewerking te verlenen bij het verkrijgen van inlichtingen,
      benodigd voor de uitvoering van deze wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of
      krachtens wet anders is bepaald. Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kunnen regelen stellen met betrekking tot de wijze waarop en de vorm waarin de inlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73c
  - number: 73c.3
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan een in
      [artikel 73][ref1], bedoelde instantie de door deze gevraagde uittreksels uit de registers kosteloos toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 73b
        hoofdstuk: V
  - number: 73c.4
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      het College zorgverzekeringen, aan het College toezicht en aan de ziekenfondsen alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel73c
  - number: '74.1'
    text: |-
      Een beslissing op bezwaar inzake een aanspraak op een verstrekking of op een vergoeding ingevolge deze wet wordt
      niet genomen dan nadat daaromtrent door het College zorgverzekeringen op verzoek van het bestuursorgaan advies
      is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: '74.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover het bezwaarschrift betrekking heeft op een ingevolge het bepaalde
      krachtens deze wet verschuldigde bijdrage, waarvan de hoogte niet afhankelijk is van een medisch oordeel.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: '74.3'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: 74.3.a
    text: het bezwaar kennelijk niet-ontvankelijk is,
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: 74.3.b
    text: aan het bezwaar volledig tegemoet wordt gekomen, of
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: 74.3.c
    text: |-
      het College zorgverzekeringen geen advies heeft uitgebracht binnen de in het vierde lid genoemde termijn of heeft
      medegedeeld geen advies te zullen uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: '74.4'
    text: |-
      Het College zorgverzekeringen brengt een advies als bedoeld in het eerste lid uit binnen tien weken na ontvangst
      van alle gegevens en bescheiden die voor de beoordeling van het verzoek noodzakelijk zijn, en zendt gelijktijdig
      afschrift daarvan aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
  - number: '74.5'
    text: |-
      Indien het College zorgverzekeringen is verzocht advies uit te brengen, wordt de beslissing op bezwaar in afwijking
      van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] genomen binnen een en twintig weken na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '75'
    text: |-
      Het beroep en het hoger beroep inzake een geschil van uitsluitend geneeskundige aard worden behandeld met
      toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
  - number: '76'
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake een beschikking als bedoeld in
      [artikel 3d, tweede lid][ref1], is [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '77'
    text: |-
      Een belanghebbende kan tegen ingevolge deze wet genomen besluiten, niet zijnde besluiten als bedoeld in
      [artikel 8:2 van de Algemene wet bestuursrecht][ref1], van Onze Minister, van het College zorgverzekeringen,
      het College toezicht, en van rechtspersonen als bedoeld in [artikel 1p, tweede lid][ref2], beroep instellen bij
      de Afdeling bestuursrechtspraak van de Raad van State. De eerste volzin geldt niet ten aanzien van een besluit,
      genomen jegens een persoon die behoort tot het personeel van de genoemde colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1p
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1p
        hoofdstuk: IA
  - number: '78.1'
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit inzake de verschuldigde premie gehoord op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '78.2'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen in de in het eerste lid bedoelde bezwaarschriftprocedure binnen
      dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '79.1'
    text: |-
      Bij afwijzing van een verzoek als bedoeld in [artikel 47, eerste lid, eerste volzin][ref1], kan de beslissing van
      het College zorgverzekeringen worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel47
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '47'
        hoofdstuk: IV
  - number: '79.2'
    text: |-
      Eveneens kan de beslissing van het College zorgverzekeringen worden ingeroepen bij afwijzing van het verzoek, als
      bedoeld in [artikel 48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel48
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '48'
        hoofdstuk: IV
  - number: '79.3'
    text: |-
      Het eerste lid geldt niet voor zover er voor ziekenfondsen of instellingen op grond van bij of krachtens algemene
      maatregel van bestuur gestelde regels geen verplichting bestaat tot het sluiten van in [artikel 44][ref1] bedoelde
      overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: 83a
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken
      ter zake van een feit, dat aanleiding geeft tot het verlenen van verstrekkingen of vergoedingen ingevolge de
      verzekering, houdt de rechter rekening met de aanspraken, die de verzekerde krachtens deze wet heeft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83a
  - number: 83b.1
    text: |-
      Behoudens toepassing van het derde lid, eerste volzin, heeft een ziekenfonds voor de krachtens de verzekering
      gemaakte kosten verhaal op degene, die in verband met het veroorzaken van het in [artikel 83][ref1] bedoelde feit
      jegens de verzekerde naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag,
      waarvoor deze bij het ontbreken van de aanspraken krachtens de verzekering naar burgerlijk recht aansprakelijk
      zou zijn, verminderd met een bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke
      persoon jegens de verzekerde naar burgerlijk recht is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel83a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 83a
        hoofdstuk: VII
  - number: 83b.2
    text: |-
      Voorzover de geldswaarde van de in het eerste lid bedoelde verleende verstrekkingen niet kan worden vastgesteld,
      wordt deze bepaald op een geschat bedrag. Onze Minister kan hieromtrent nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83b
  - number: 83b.3
    text: |-
      Het College zorgverzekeringen kan met verzekeraars een overeenkomst sluiten inhoudende een door die verzekeraars
      aan het College zorgverzekeringen te betalen afkoopsom voor de voor de komende periode te verwachten schadelast
      tengevolge van de schadeplichtigheid van diens verzekerden ingevolge het eerste lid. De overeenkomst heeft geen
      betrekking op de schadelast van een ziekenfonds dat voor de aanvang van de onderhandelingen over de bedoelde
      overeenkomst aan het College zorgverzekeringen te kennen heeft gegeven van zijn bevoegdheid in het eerste lid
      gebruik te maken. Het College zorgverzekeringen stelt voor aanvang van de periode waarvoor een afkoopsom is
      overeengekomen, ziekenfondsen op de hoogte van de totstandkoming van bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83b
  - number: 83c.1
    text: |-
      Het bepaalde in het vorige artikel geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding verplichte
      werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar burgerlijk recht tot schadevergoeding
      verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever als de verzekerde jegens wie naar
      burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien het in [artikel 83][ref1] bedoelde feit
      is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel83a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 83a
        hoofdstuk: VII
  - number: 83c.2
    text: |-
      Voor de toepassing van het vorige lid wordt mede als werkgever beschouwd degene, die krachtens het bepaalde bij
      het eerste lid van [artikel 16][ref1] mede als werkgever wordt beschouwd, ongeacht de bij het tweede lid van dat
      artikel bedoelde uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83c
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 16a
  - number: 83d.1
    text: |-
      Een ziekenfonds kan van hem, die, zonder daartoe gerechtigd te zijn, opzettelijk aanspraken als verzekerde bij
      hem doet gelden onderscheidenlijk deed gelden, alsmede van hem, die daaraan opzettelijk zijn medewerking verleent
      onderscheidenlijk heeft verleend, geheel of gedeeltelijk het bedrag vorderen van de verstrekkingen of van de
      vergoedingen die hem te veel of ten onrechte zijn verleend. Voorzover de geldswaarde van de in de eerste volzin
      bedoelde verstrekkingen niet vaststaat, kan deze worden vastgesteld op een geschat bedrag.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83d
  - number: 83d.2
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83d
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 83d.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de in het eerste lid
      bedoelde terugvordering.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel83d
  - number: '84'
    text: |-
      Overtreding van het bepaalde bij of krachtens een algemene maatregel van bestuur, strekkende tot uitvoering van
      deze wet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien en
      voor zover deze overtreding bij die algemene maatregel van bestuur als strafbaar feit is aangeduid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel84
  - number: '86'
    text: |-
      Hij die werkzaamheden verricht, welke ingevolge deze wet uitsluitend aan ingevolge [artikel 34][ref1] toegelaten
      ziekenfondsen zijn toegestaan, of die zodanige werkzaamheden blijft verrichten nadat zijn toelating overeenkomstig
      het bepaalde in [artikel 36][ref2] is ingetrokken, of die voorwaarden overtreedt, waaronder toelating is verleend,
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel36
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '36'
        hoofdstuk: III
  - number: '87'
    text: |-
      Hij die niet voldoet aan een hem bij [artikel 1x11, tweede en derde lid][ref1], [artikel 1x13, tweede lid][ref2],
      en [artikel 1x14, tweede lid][ref3], opgelegde verplichting, wordt gestraft met hechtenis van ten hoogste zes
      maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x11
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1x13
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel1x14
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x11
        hoofdstuk: IC
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1x13
        hoofdstuk: IC
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 1x14
        hoofdstuk: IC
  - number: '88'
    text: |-
      Overtreding van [artikel 43][ref1] wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel43a
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 43a
        hoofdstuk: III
  - number: '89'
    text: |-
      Hij die niet voldoet aan een hem bij de [artikelen 73b, derde lid][ref1], en [73c][ref2] opgelegde verplichting of
      ter zake onjuiste inlichtingen verstrekt, wordt gestraft met een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel73c
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 73b
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 73c
        hoofdstuk: V
  - number: '91.1'
    text: |-
      Met de opsporing van feiten die zijn strafbaar gesteld bij of krachtens deze wet, alsmede, voor
      zover het feit voor de toepassing van deze wet van belang is, van de feiten omschreven in de
      [artikelen 225 tot en met 227b][ref1], [447c][ref2] en [447d van het Wetboek van Strafrecht][ref3] zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4], belast de ambtenaren, aangewezen bij besluit
      van Onze Minister en Onze Minister van Justitie. Deze ambtenaren zijn tevens belast met de opsporing van feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref5] en [184 van het Wetboek van Strafrecht][ref6], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel447c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel447d
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 447c
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 447d
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '91.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel91
  - number: '92'
    text: De bij of krachtens deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel92
  - number: '93'
    text: |-
      Voor zover deze wet niet anders bepaalt, wordt hetgeen tot haar uitvoering nodig is bij of krachtens algemene
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel93
  - number: 93a.1
    text: |-
      De voordracht tot het vaststellen van een algemene maatregel van bestuur als bedoeld in de [artikelen 3a][ref1],
      [8][ref2], [15, eerste en zesde lid][ref3], [17, eerste lid][ref4], en [18][ref5] wordt gedaan door Onze Minister
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel18
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
        hoofdstuk: II
        paragraaf: a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '17'
        hoofdstuk: II
        paragraaf: c
      - id: ref5
        bwb_id: BWBR0002460
        artikel: '18'
        hoofdstuk: II
        paragraaf: c
  - number: 93a.2
    text: |-
      Indien een algemene maatregel van bestuur, bedoeld in [artikel 8][ref1], geen zodanige invloed heeft op de
      geldelijke omvang van de verstrekkingen dat zulks verhoging of verlaging van de in [artikel 15][ref2] bedoelde
      premie tot gevolg heeft, zal, in afwijking van het eerste lid, een voordracht tot het vaststellen daarvan worden
      gedaan door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '15'
        hoofdstuk: II
        paragraaf: c
  - number: 93a.3
    text: |-
      De bevoegdheden van Onze Minister, als bedoeld in [de artikelen 4, twaalfde lid, onder ][ref1], worden door hem
      uitgeoefend in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
        hoofdstuk: II
        paragraaf: a
  - number: '94'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College zorgverzekeringen of het College toezicht zijn uit de wet voortvloeiende
      verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel94
  - number: '95'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van
      het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel95
  - number: '96'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van
      het College toezicht.
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel96
  - number: '107'
    text: 'Deze wet wordt aangehaald als: Ziekenfondswet.'
    url: https://wetten.overheid.nl/BWBR0002460/2005-12-29#Artikel107
