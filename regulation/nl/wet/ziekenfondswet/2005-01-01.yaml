  - number: '36'
    text: |-
      1 De toelating wordt ingetrokken indien het ziekenfonds:

      a. niet meer voldoet aan de eisen, vervat in [artikel 34, derde en vijfde lid][ref1], of de aan hem opgelegde
      verplichtingen, of

      b. in ernstige mate handelt in strijd met de bij enig wettelijk voorschrift ten aanzien van ziekenfondsen gestelde
      eisen of anderszins zijn taak niet naar behoren vervult.

      2 Op aanvraag van het ziekenfonds wordt de toelating met ingang van een daarbij te bepalen datum ingetrokken.

      3 Het College zorgverzekeringen regelt de gevolgen van de intrekking van de toelating en de afwikkeling der lopende
      zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
