        bwb_id: BWBR0002460
        artikel: 83a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002126
        artikel: 16a
  - number: 83d
    text: |-
      1 Een ziekenfonds kan van hem, die, zonder daartoe gerechtigd te zijn, opzettelijk aanspraken als verzekerde bij
      hem doet gelden onderscheidenlijk deed gelden, alsmede van hem, die daaraan opzettelijk zijn medewerking verleent
      onderscheidenlijk heeft verleend, geheel of gedeeltelijk het bedrag vorderen van de verstrekkingen die hem te veel
      of ten onrechte zijn verleend. Voorzover de geldswaarde van de in de eerste volzin bedoelde verstrekkingen niet
      vaststaat, kan deze worden vastgesteld op een geschat bedrag.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de in het eerste lid
      bedoelde terugvordering.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel83d
  - number: '84'
    text: |-
      Overtreding van het bepaalde bij of krachtens een algemene maatregel van bestuur, strekkende tot uitvoering van
      deze wet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie, indien en
      voor zover deze overtreding bij die algemene maatregel van bestuur als strafbaar feit is aangeduid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel84
  - number: '86'
    text: |-
      Hij die werkzaamheden verricht, welke ingevolge deze wet uitsluitend aan ingevolge [artikel 34][ref1] toegelaten
      ziekenfondsen zijn toegestaan, of die zodanige werkzaamheden blijft verrichten nadat zijn toelating overeenkomstig
      het bepaalde in [artikel 36][ref2] is ingetrokken, of die voorwaarden overtreedt, waaronder toelating is verleend,
      wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel36
