preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen met betrekking tot de
    geneeskundige verzorging door middel van ziekenfondsverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan, bij deze:
  url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport,

      b. het College zorgverzekeringen: het college, genoemd in [artikel 1a][ref1],

      c. het College toezicht: het college, genoemd in [artikel 1u][ref2],

      d. ziekenfonds: een rechtspersoon, toegelaten overeenkomstig [artikel 34][ref3],

      e. uitvoeringsorgaan: een ziekenfonds, een ziektekostenverzekeraar, toegelaten overeenkomstig
      [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref4] en een uitvoerend orgaan als bedoeld in
      [artikel 38 van de Algemene Wet Bijzondere Ziektekosten][ref5],

      f. instelling: een instelling, toegelaten overeenkomstig [artikel 8a][ref6],

      g. verzekerde: een verzekerde ingevolge deze wet en, tenzij het tegendeel blijkt, een medeverzekerde,

      h. vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref7],

      i. ziekenfondsverzekering: de verzekering ingevolge deze wet,

      j. algemene verzekering bijzondere ziektekosten: de verzekering ingevolge de
      [Algemene Wet Bijzondere Ziektekosten][ref8],

      k. Algemene Kas: de kas, genoemd in [artikel 1q, eerste lid][ref9],

      l. Algemeen Fonds Bijzondere Ziektekosten: het fonds, genoemd in
      [artikel 38 van de Wet financiering volksverzekeringen][ref10],

      m. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11],

      n. particuliere ziektekostenverzekering: een overeenkomst van directe verzekering die strekt tot vergoeding
      van kosten van geneeskundige hulp, met uitzondering van overeenkomsten van arbeidsongeschiktheidsverzekering,
      overeenkomsten van ongevallenverzekering, overeenkomsten van reisverzekering en andere overeenkomsten van
      verzekering waarbij kosten van geneeskundige hulp uitsluitend aanvullend worden gedekt,

      o. groep: een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref12];

      p. winst uit onderneming: de belastbare winst uit onderneming, bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref13];

      q. winst uit Nederlandse onderneming: de belastbare winst uit Nederlandse onderneming, bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref14].

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. gehuwd: als partner geregistreerd;

      d. gehuwde: als partner geregistreerde.

      3 In deze wet en de daarop berustende bepalingen wordt als gehuwd of als echtgenoot mede aangemerkt de ongehuwde
      meerderjarige die met een andere ongehuwde meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een
      bloedverwant in de eerste graad.

      4 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      5 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.

      6 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.


