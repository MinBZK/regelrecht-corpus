  - number: 1m
    text: |-
      Het College zorgverzekeringen geeft aan de uitvoeringsorganen en aan de rechtspersonen, bedoeld in
      [artikel 14][ref1] van deze wet en [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2], aan personen
      en instellingen die vormen van hulp of zorg verlenen, alsmede op verzoek van Onze Minister aan verzekerden
      voorlichting over het beleid op het terrein van de ziektekostenverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
