  - number: 46a
    text: |-
      1 De betrokken organisaties van ziekenfondsen en van personen en instellingen treffen een regeling ter zake van de
      instelling en werkwijze van een commissie die, nadat Onze Minister uitvoering heeft gegeven aan [artikel 11][ref1],
      voor de desbetreffende vorm van zorg het tarief, bedoeld in [artikel 17][ref2], kan vaststellen.

      2 De regeling wordt zo spoedig mogelijk medegedeeld aan het College zorgverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel17f
