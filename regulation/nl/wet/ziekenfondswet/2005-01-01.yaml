  - number: '94'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College zorgverzekeringen of het College toezicht zijn uit de wet voortvloeiende
      verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel94
  - number: '95'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van
      het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel95
  - number: '96'
    text: |-
