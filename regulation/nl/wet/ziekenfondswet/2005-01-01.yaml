  - number: '35'
    text: |-
      1 Bij de beschikking tot toelating als ziekenfonds kunnen aan het ziekenfonds met het oog op een goede uitvoering
      van deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref1] verplichtingen worden opgelegd.

      2 Ook op een later tijdstip kunnen aan het ziekenfonds met het oog op een goede uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref2] verplichtingen worden opgelegd.

      Een beschikking als bedoeld in de eerste volzin treedt niet in werking dan na verloop van vier weken na de dag
      waarop zij is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
