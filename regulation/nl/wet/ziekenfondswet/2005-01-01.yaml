  - number: 1n
    text: |-
      1 Het College zorgverzekeringen rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en
      doelmatigheid van voorgenomen beleid op het terrein van de ziekenfondsverzekering of de algemene verzekering
      bijzondere ziektekosten.

      2 Het College zorgverzekeringen signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op
      het terrein van de ziekenfondsverzekering of de algemene verzekering bijzondere ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1n
  - number: 1o
    text: |-
      1 Het College zorgverzekeringen bevordert de afstemming van de uitvoering van:

      a. de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten,

      b. de ziekenfondszekering met de uitvoering van de algemene verzekering bijzondere ziektekosten,

      c. de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten met de uitvoering van het beleid op
      andere terreinen van de volksgezondheid, en

      d. de ziekenfondsverzekering en de algemene verzekering bijzondere ziektekosten met de uitvoering van het beleid op
      andere terreinen van sociale zekerheid.

      2 Het College zorgverzekeringen kan met het oog op de afstemming beleidsregels stellen voor
      de uitvoeringsorganen en de rechtspersonen, bedoeld in [artikel 14][ref1] van deze wet en
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1o
