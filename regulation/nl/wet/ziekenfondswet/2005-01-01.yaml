  - number: '4'
    text: |-
      1 Medeverzekerde is de echtgenote of echtgenoot van de verzekerde, indien deze jonger is dan 65 jaar en behoort tot
      het huishouden van de verzekerde en de verzekerde als haar of zijn kostwinner is aan te merken.

      2 Medeverzekerden zijn voorts de eigen en aangehuwde kinderen en de pleegkinderen van de verzekerde, voor wie de
      verzekerde als kostwinner is aan te merken en die:

      a. jonger dan 16 jaar zijn en tot zijn huishouden behoren;

      b. jonger dan 16 jaar zijn, niet tot zijn huishouden behoren, en die in belangrijke mate op zijn kosten worden
      onderhouden;

      c. 16 jaar of ouder doch jonger dan 27 jaar zijn, wier voor werkzaamheden beschikbare tijd grotendeels in
      beslag wordt genomen door of in verband met het volgen van onderwijs of van een beroepsopleiding, en die
      in belangrijke mate op zijn kosten worden onderhouden, tenzij het kind studiefinanciering geniet ingevolge
      [de Wet studiefinanciering 2000][ref1];

      d. 16 jaar of ouder, doch jonger dan 27 jaar zijn, ten gevolge van ziekte of gebreken buiten staat
      zijn om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen die overigens in
      gelijke omstandigheden verkeren, kunnen verdienen, en daartoe ook hetzij in het afgelopen jaar buiten
      staat zijn geweest hetzij vermoedelijk in het eerstkomende jaar buiten staat zullen zijn, en die in
      belangrijke mate op zijn kosten worden onderhouden, tenzij bedoelde kinderen recht hebben op toekenning
      van een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3].

      e. 16 jaar of ouder doch jonger dan 18 jaar zijn, werkloos zijn en die in belangrijke mate op zijn kosten worden
      onderhouden;

      f. 18 jaar of ouder, doch jonger dan 21 jaar zijn, na beëindiging van de studie of de beroepsopleiding werkloos
      zijn, dan wel na vestiging in of terugkeer naar het Rijk werkloos zijn en die in belangrijke mate op zijn kosten
      worden onderhouden.

      3 Medeverzekerd is voorts één eigen of aangehuwd kind dan wel pleegkind van 16 jaar of ouder doch jonger dan 27
      jaar van de verzekerde, indien dat tot het huishouden van de verzekerde behoort, de verzekerde als zijn kostwinner
      is aan te merken en zijn voor werkzaamheden beschikbare tijd grotendeels in beslag wordt genomen door het verzorgen
      van dat huishouden of, mits tot dat huishouden ten minste drie andere kinderen jonger dan 27 jaar behoren, door
      het medeverzorgen van dat huishouden en dat in belangrijke mate op kosten van de verzekerde wordt onderhouden. De
      vorige volzin is niet van toepassing ten aanzien van een kind dat ten gevolge van ziekte of gebreken buiten staat
      is om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen.

      4 Voor de toepassing van het bepaalde bij of krachtens dit artikel wordt, indien het volgen van onderwijs of van de
      beroepsopleiding tijdens de loop van een kalenderkwartaal wordt beëindigd, het kind geacht het volgen van onderwijs
      of van de beroepsopleiding eerst aan het einde van dat kalenderkwartaal te hebben beëindigd. Indien het volgen van
      onderwijs of van de beroepsopleiding wordt beëindigd tijdens of bij het begin van een door de onderwijsinstelling
      vastgestelde vakantie dan wel het onderwijs of de beroepsopleiding wordt afgesloten met een eindexamen dat kort
      voor het begin van de laatste door de onderwijsinstelling vastgestelde vakantie van het desbetreffende studiejaar
      wordt afgelegd, wordt het kind geacht het volgen van onderwijs of van de beroepsopleiding eerst te hebben beëindigd
      aan het einde van het kalenderkwartaal waarin de vakantie eindigt.

      5 Voor de toepassing van het tweede lid, onder *e*, wordt een kind dat de leeftijd van 18 jaar bereikt, anders dan
      op de eerste dag van een kalenderkwartaal, geacht die leeftijd eerst te hebben bereikt op de eerste dag van het
      volgende kalenderkwartaal.

      6 Voor de toepassing van het tweede lid, onder *f*, wordt een kind dat de leeftijd van 21 jaar bereikt, anders
      dan op de eerste dag van een kalendermaand, geacht die leeftijd eerst te hebben bereikt op de eerste dag van de
      volgende kalendermaand.

      7 Een kind als bedoeld in het tweede lid, onder *e* of *f* wordt slechts als werkloos aangemerkt, indien en zolang
      het bij de Centrale organisatie werk en inkomen als werkzoekende is ingeschreven en indien deze inschrijving binnen
      een redelijke termijn heeft plaatsgevonden.

      8 Een kind als bedoeld in het tweede lid, onder *f* is slechts medeverzekerd zolang het werkloos is, doch
      ten hoogste gedurende de twee kalenderkwartalen volgende op dat waarin de beëindiging van het onderwijs of de
      beroepsopleiding heeft plaatsgevonden dan wel volgende op dat waarin de vestiging in of de terugkeer naar het
      Rijk heeft plaatsgevonden. In afwijking van de vorige volzin is een kind dat het onderwijs of de beroepsopleiding
      kort voor of met ingang van de zomervakantie heeft beëindigd, slechts medeverzekerd zolang het werkloos is, doch
      uiterlijk tot 1 januari volgende op die beëindiging.

      9 Medeverzekerden zijn bovendien de door Onze Minister aan te wijzen personen als wier kostwinner de verzekerde is
      aan te merken.

      10 Een kind wordt als pleegkind beschouwd, indien het als een eigen kind wordt onderhouden en opgevoed.

      11 Onze Minister kan bepalen in welke gevallen:

      a. een kind te wiens aanzien niet wordt voldaan aan het bepaalde in het tiende lid, nochtans met een pleegkind
      wordt gelijkgesteld;

      b. de echtgenote of echtgenoot van een verzekerde met wie de verzekerde nog niet samenwoont, geacht wordt tot het
      huishouden van de verzekerde te behoren;

      c. een eigen of aangehuwd kind of pleegkind of een met een pleegkind gelijkgesteld kind geacht wordt tot het
      huishouden van de verzekerde te behoren.

      12 Onze Minister kan regelen stellen, naar welke wordt beoordeeld:

      a. of een kind in belangrijke mate op kosten van de verzekerde wordt onderhouden;

      b. of een kind buiten staat zal zijn om 55 procent te verdienen van hetgeen lichamelijk en geestelijk gezonde
      kinderen die overigens in gelijke omstandigheden verkeren, kunnen verdienen;

      c. of een verzekerde als kostwinner wordt aangemerkt.

      13 Voor het vaststellen van de mate, waarin een eigen kind, een aangehuwd kind, een pleegkind dan wel een met een
      pleegkind gelijkgesteld kind door de verzekerde wordt onderhouden, wordt het inkomen van het kind geacht te zijn
      aangewend voor het onderhoud van dat kind.

      14 Onze Minister kan voorschriften geven ter bepaling van het inkomen van het kind als bedoeld in het dertiende
      lid. Tevens kan Onze Minister, in afwijking van het dertiende lid, bepalen dat uitkeringen welke aan de verzekerde
      ten behoeve van het kind worden verstrekt, voor de toepassing van dat lid als inkomen van het kind worden
      aangemerkt.

      15 Onze Minister kan nadere regelen stellen met betrekking tot de toepassing van de voorafgaande leden.

      16 In afwijking van het bepaalde in het eerste, tweede, derde en negende lid worden niet als medeverzekerden
      aangemerkt:

      a. de verzekerde ingevolge het bepaalde bij of krachtens [de artikelen 3, eerste lid][ref4], of 3d
      dan wel degene die uitsluitend in verband met overschrijding van de voor de ziekenfondsverzekering
      geldende loon- of inkomensgrens niet verzekerd is ingevolge genoemde artikelen dan wel bij of krachtens
      [de artikelen 3, eerste of negende lid][ref5], dan wel 3b van de ziekenfondsverzekering is uitgezonderd, tenzij bij
      of krachtens algemene maatregel van bestuur anders wordt bepaald.

      b. degene, die krachtens zijn arbeidsverhouding deelnemer is in een door Onze Minister, in overeenstemming met Onze
      Minister van Binnenlandse Zaken, aan te wijzen publiekrechtelijke ziektekostenregeling voor ambtenaren.

      17 Onze Minister kan bepalen uit welken hoofde een medeverzekerde voor de toepassing van dit hoofdstuk als
      medeverzekerde geldt, indien hij uit verschillenden hoofde verzekerd is.

      18 In afwijking van [artikel 2][ref6] wordt als medeverzekerde als bedoeld in dit artikel
      aangemerkt, de vreemdeling die rechtmatig in Nederland verblijf heeft als bedoeld in
      [artikel 8, onder f tot en met k, van de Vreemdelingenwet 2000][ref7].


