  - number: 3d
    text: |-
      1 Verzekerd gedurende een kalenderjaar is de persoon, jonger dan 65 jaar:

      a. die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      drijft;

      b. die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening drijft; en wiens inkomen niet meer bedraagt dan € 20 800 .

      2 De inspecteur van de rijksbelastingdienst verstrekt bij voor bezwaar vatbare beschikking aan de persoon, bedoeld
      in of krachtens het eerste lid, een verklaring waaruit blijkt dat hij voldoet aan de in het eerste lid bedoelde
      voorwaarden.

      3 Voor de toepassing van het eerste lid blijven buiten beschouwing wijzigingen in het inkomen die door de
      inspecteur van de rijksbelastingdienst na 1 oktober worden vastgesteld.

      4 Voor de toepassing van het eerste en het derde lid wordt onder inkomen verstaan de som van het belastbare
      inkomen uit werk en woning, het belastbare inkomen uit aanmerkelijk belang en het belastbare inkomen uit sparen
      en beleggen, bedoeld in de [Hoofdstukken 3][ref1], [4][ref2] en [5 van de Wet inkomstenbelasting 2001][ref3],
      verminderd met de correctieposten bedoeld in [artikel 3c, zesde lid, onderdelen a tot en met g][ref4], met dien
      verstande dat indien de berekening van het belastbare inkomen uit werk en woning of het belastbare inkomen uit
      aanmerkelijk belang tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld. Bij ministeriële regeling
      wordt bepaald over welk tijdvak het inkomen in aanmerking wordt genomen en kunnen nadere regels worden gesteld ter
      uitvoering van het eerste, tweede en derde lid.

      5 [Artikel 3a][ref5] is van overeenkomstige toepassing op het bedrag, genoemd in het eerste lid.

      6 Bij of krachtens algemene maatregel van bestuur kan uitbreiding of beperking worden gegeven aan de in het eerste
      lid bedoelde verzekering.

      7 [Artikel 3c, tiende lid][ref6], is van overeenkomstige toepassing.

      8 Over het tijdvak 2004 en volgende tijdvakken wordt, in afwijking van het vierde lid, onder inkomen
      verstaan de som van het belastbare inkomen uit werk en woning, het belastbare inkomen uit aanmerkelijk
      belang en het belastbare inkomen uit sparen en beleggen, bedoeld in de [Hoofdstukken 3][ref7], [4][ref8] en
      [5 van de Wet inkomstenbelasting 2001][ref9], verminderd voor de tijdvakken 2004 en 2005 met € 1 355; met dien
      verstande dat indien de berekening van het belastbare inkomen uit werk en woning of het belastbare inkomen uit
      aanmerkelijk belang tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld.

      9 Indien het inkomen moet worden bepaald over een aan het kalenderjaar 2001 voorafgaand kalenderjaar, wordt, in
      afwijking van het vierde lid, onder inkomen verstaan: voor binnenlands belastingplichtigen, het inkomen bedoeld
      in artikel 3, eerste lid, van de Wet op de inkomensbelasting 1964 en voor buitenlands belastingplichtigen het
      binnenlandse inkomen bedoeld in artikel 48, eerste lid, van die wet met dien verstande dat indien de berekening van
      het inkomen tot een negatief bedrag leidt, dat inkomen op nul wordt gesteld.


