  - number: 15b
    text: |-
      1 Onverminderd hetgeen bij of krachtens artikel 17 omtrent de daar bedoelde nominale premie is bepaald, is
      de verzekerde, bedoeld in artikel 3e, een premie verschuldigd tot een door Onze Minister en Onze Minister van
      Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage over de periodieke uitkering of verstrekking.
      De geldswaarde van bedoelde verstrekking wordt gesteld op het bedrag dat bij de heffing ingevolge de
      [Wet inkomstenbelasting 2001][ref1] in aanmerking wordt genomen.

      2 De premie wordt per maand berekend en door het ziekenfonds waarbij de verzekerde is ingeschreven vastgesteld. Het
      ziekenfonds int de premie bij de verzekerde.

      3 Voor de toepassing van dit artikel is [artikel 9, tweede lid, van de Coördinatiewet Sociale Verzekering][ref2]
      van overeenkomstige toepassing.

      4 Het ziekenfonds stort de in het tweede lid bedoelde premie in de Algemene Kas. Onze Minister kan aan het in het
      tweede lid bedoelde orgaan verplichtingen opleggen en voorschriften geven met betrekking tot de vaststelling, de
      invordering, de afdracht en de verantwoording van de premie.

      5 Bij ministeriële regeling kunnen met betrekking tot de premieheffing nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
