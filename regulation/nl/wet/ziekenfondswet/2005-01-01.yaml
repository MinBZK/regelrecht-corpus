  - number: 43a
    text: |-
      Het is een ziekenfonds verboden personen als verzekerden in te schrijven die woonachtig zijn buiten de gemeente,
      gemeenten of delen daarvan, waar de rechtspersoon volgens zijn statuten zijn werkzaamheden als ziekenfonds wil
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel43a
  - number: 43b
    text: |-
      1 Een ziekenfonds is verplicht toereikende technische voorzieningen bedoeld in
      [artikel 66, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1], aan te houden. De technische
      voorzieningen dienen volledig door waarden te zijn gedekt. Bij of krachtens algemene maatregel van bestuur kunnen
      ter zake nadere regels worden gesteld.

      2 Een ziekenfonds beschikt over een solvabiliteitsmarge als bedoeld in
      [artikel 68, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2], waarvan de omvang volgens door
      Onze Minister te stellen regels wordt bepaald. Onze Minister kan omtrent in de vorige volzin bedoelde regels de
      Pensioen- & Verzekeringskamer horen.

      3 Een ziekenfonds houdt een reserve Ziekenfondswet aan. Bij ministeriële regeling wordt een maximum aan deze
      reserve gesteld. Indien het College zorgverzekeringen vaststelt dat de reserve Ziekenfondswet het gestelde
      maximum te boven gaat, stort het ziekenfonds het door het College zorgverzekeringen vastgestelde bedrag van de
      overschrijding binnen vier weken in de Algemene Kas.

      4 Het saldo van baten en lasten van een ziekenfonds over enig boekjaar wordt toegevoegd aan onderscheidenlijk
      gebracht ten laste van de reserve Ziekenfondswet. Voor de toepassing van de eerste volzin blijven uitgaven, waarvan
      het College toezicht heeft vastgesteld dat deze niet verantwoord waren, buiten beschouwing, tenzij het College
      toezicht anders besluit. De eerste volzin is niet van toepassing op baten en lasten die in redelijkheid moeten
      worden toegerekend aan andere onderdelen van het eigen vermogen.

      5 Het ontwerp van een ministeriële regeling krachtens het derde lid wordt overgelegd aan de beide kamers der
      Staten-Generaal. De regeling treedt niet eerder in werking dan nadat vier weken zijn verstreken sedert de
      overlegging.

      6 Indien krachtens [artikel 5, eerste lid][ref3], een ziekenfonds wordt aangewezen, waarbij de verzekerden,
      bedoeld in [artikel 15, eerste lid, tweede volzin][ref4], zich bij uitsluiting dienen aan te melden en Onze
      Minister daarbij bepaalt dat het ziekenfonds in afwijking van [artikel 5, eerste lid, eerste volzin][ref5], geen
      andere verzekerden die zich bij dat ziekenfonds aanmelden, inschrijft, gelden het eerste, tweede en derde lid
      niet ten aanzien van dat ziekenfonds. Indien Onze Minister niet heeft bepaald dat het ziekenfonds in afwijking
      van [artikel 5, eerste lid, eerste volzin][ref6], geen andere verzekerden die zich bij dat ziekenfonds aanmelden,
      inschrijft, blijven, voor zover krachtens de op grond van dit artikel te stellen regels de omvang van technische
      voorzieningen, bedoeld in het eerste lid, van de solvabiliteitsmarge, bedoeld in het tweede lid of van de reserve,
      bedoeld in het derde lid, wordt bepaald of mede wordt bepaald door verzekerdenaantallen, de verzekerden, bedoeld
      in [artikel 15, eerste lid, tweede volzin][ref7], buiten beschouwing. De eerste en tweede volzin zijn slechts van
      toepassing indien op grond van de regels krachtens [artikel 19][ref8] het desbetreffende ziekenfonds voor de kosten
      ten behoeve van zijn verzekerden, bedoeld in [artikel 15, eerste lid, tweede volzin][ref9], aanspraak heeft op
      uitkeringen naar werkelijke kosten onder aftrek van de opbrengsten ingevolge deze wet.


