  - number: 1r
    text: |-
      1 Het College zorgverzekeringen houdt de financiële middelen die deel uitmaken van de Algemene Kas, in rekening-
      courant bij Onze Minister van Financiën.

      2 Het College zorgverzekeringen kan, voor de uitvoering van zijn wettelijke taken, beschikken over de financiële
      middelen die hij in rekening-courant bij Onze Minister van Financiën houdt.

      3 In afwijking van het eerste lid kan het College zorgverzekeringen een deel van de in het eerste lid bedoelde
      financiële middelen buiten de in het eerste lid bedoelde rekening-courant houden.

      4 Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met het College
      zorgverzekeringen, de omvang van het in het derde lid bedoelde deel van de financiële middelen vast.

      5 Bij een tekort aan financiële middelen maakt het College zorgverzekeringen gebruik van de kredietfaciliteiten die
      door Onze Minister van Financiën worden verleend.

      6 Onze Minister van Financiën informeert dagelijks het College zorgverzekeringen ten aanzien van de rekening-
      courant, in elk geval met betrekking tot:

      a. de slotstanden per dag;

      b. alle dagelijks geboekte mutaties of transacties in de rekening-courant.

      7 Het College zorgverzekeringen informeert Onze Minister van Financiën ten aanzien van de rekening-courant in elk
      geval met betrekking tot de prognoses van de saldi van de rekening-courant.

      8 Onze Minister van Financiën brengt voor het beheer van de rekening-courant geen kosten in rekening.

      9 Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met het College
      zorgverzekeringen, regels omtrent de rente die over de saldi van de in het eerste lid bedoelde rekening-courant
      wordt vergoed onderscheidenlijk in rekening wordt gebracht.

      10 Onze Minister van Financiën kan in overeenstemming met Onze Minister, na overleg met het College
      zorgverzekeringen, regels stellen omtrent het eerste, zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1r
  - number: 1s
    text: |-
      1 Het College zorgverzekeringen zendt met betrekking tot de Algemene Kas en het Algemeen Fonds Bijzondere
      Ziektekosten jaarlijks voor 31 december aan Onze Minister een financieel verslag over de uitgaven en ontvangsten in
      het voorafgaande kalenderjaar en de toestand van die kas en dat fonds per 31 december van dat jaar. Artikel 1i is
      van overeenkomstige toepassing.

      2 Het financieel verslag gaat vergezeld van:

      a. een verklaring over de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1];

      b. een verklaring van de accountant over de rechtmatigheid van het beheer met betrekking tot de uitgaven en
      ontvangsten van de Algemene Kas en van het Algemeen Fonds Bijzondere Ziektekosten;

      c. een rapport van de accountant over de ordelijkheid en controleerbaarheid van het gevoerde financieel beheer;

      d. een rapport over de mate waarin de uitgaven en ontvangsten van de Algemene Kas en van het Algemeen Fonds
      Bijzondere Ziektekosten zijn gedekt door rechtmatigheidsverklaringen of rechtmatigheidsrapportages van derden.

      3 Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het financieel verslag algemeen verkrijgbaar.

      4 Het College zorgverzekeringen rapporteert Onze Minister gevraagd en ongevraagd omtrent:

      a. de benodigde omvang van de ten laste van de Algemene Kas en het Algemeen Fonds Bijzondere Ziektekosten
      besteedbare middelen voor de ziekenfondsverzekering onderscheidenlijk de algemene verzekering bijzondere
      ziektekosten;

      b. de hoogte van de premie, bedoeld in [artikel 15, eerste lid][ref2], en van de premie, bedoeld in
      [artikel 39, eerste lid, onder a, van de Wet financiering volksverzekeringen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004538#Artikel39
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1s
