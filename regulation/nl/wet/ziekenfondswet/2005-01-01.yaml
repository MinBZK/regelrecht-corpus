  - number: '45'
    text: |-
      1 Een modelovereenkomst als bedoeld in [artikel 44][ref1] met betrekking tot een categorie van personen bevat
      slechts bepalingen betreffende:

      a. het tijdstip waarop de overeenkomst aanvangt te werken en de duur van de periode waarvoor de overeenkomst is
      gesloten;

      b. de aard en de omvang van de wederzijdse rechten en verplichtingen, behoudens voorzover deze zijn geregeld bij of
      krachtens de [Wet tarieven gezondheidszorg][ref2];

      c. de te verlenen verstrekkingen alsmede algemene voorwaarden ten aanzien van de kwaliteit daarvan;

      d. de voorwaarden van administratieve aard, waaraan de partijen hebben te voldoen;

      e. de controle op de naleving van de overeenkomst, waaronder begrepen de controle op de te verrichten dan wel
      verrichte prestaties en op de juistheid van de daarvoor in rekening gebrachte bedragen, alsmede de verplichting tot
      het verstrekken van gegevens ten behoeve van deze controle;

      f. de beëindiging van de overeenkomst, met dien verstande, dat door opzegging de overeenkomst alleen kan worden
      beëindigd met ingang van 1 januari en de opzegtermijn tenminste zes maanden bedraagt, behoudens in de gevallen dat
      op grond van bijzondere omstandigheden verdere nakoming van de overeenkomst door een der partijen redelijkerwijs
      niet kan worden gevergd;

      g. de voorziening voor de situaties waarin de overeenkomsten als bedoeld in [artikel 44][ref3] kunnen afwijken van
      de modelovereenkomst;

      h. de mogelijkheid van instelling van een commissie welke bemiddeling kan verlenen bij de oplossing van geschillen
      welke uit de overeenkomst voortvloeien.

      2 Het eerste lid is ten aanzien van modelovereenkomsten met betrekking tot instellingen van overeenkomstige
      toepassing, met dien verstande dat het woord "slechts" wordt vervangen door: ten minste, en dat bij algemene
      maatregel van bestuur onderwerpen kunnen worden aangegeven ten aanzien waarvan de modelovereenkomst nadere
      bepalingen dient te bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0003356
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel44
