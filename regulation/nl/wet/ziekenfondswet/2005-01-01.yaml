  - number: 1x8
    text: |-
      1 Het College toezicht kan uit hoofde van zijn toezichthoudende taak een aanwijzing geven aan een
      uitvoeringsorgaan.

      2 Een aanwijzing kan geen betrekking hebben op de besluitvorming betreffende de toekenning van een verstrekking,
      vergoeding of uitkering aan een verzekerde.

      3 Bij de aanwijzing stelt het College toezicht een termijn waarbinnen het uitvoeringsorgaan aan de aanwijzing moet
      voldoen.

      4 Indien het uitvoeringsorgaan niet binnen de termijn, bedoeld in het derde lid, aan de aanwijzing voldoet, is het
      College toezicht bevoegd tot toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x8
  - number: 1x9
    text: |-
      1 Het College toezicht kan een ziekenfonds geheel of gedeeltelijk onder bewind stellen indien het van oordeel is
      dat bij het ziekenfonds sprake is van wanbeheer of dat een toestand dreigt te ontstaan waarin het ziekenfonds zijn
      taak niet naar behoren vervult. De onderbewindstelling beslaat ten hoogste twee jaar en kan telkens met ten hoogste
      een jaar worden verlengd.

      2 Onder onderbewindstelling wordt verstaan het slechts mogen uitoefenen van bevoegdheden met toestemming van een of
      meer door het College toezicht aangewezen personen en met inachtneming van de opdrachten van deze personen.

      3 Een besluit tot onderbewindstelling of tot verlenging daarvan bevat ten minste:

      a. de tijdstippen waarop het bewind ingaat en eindigt,

      b. de naam van de persoon of personen die het bewind voeren,

      c. een beschrijving van de taken en bevoegdheden van de bewindvoerders,

      d. voor zover het niet betreft alle activiteiten of onderdelen van een ziekenfonds, een aanduiding van de
      activiteiten of onderdelen van het ziekenfonds waarop de onderbewindstelling betrekking heeft.

      4 Het College toezicht brengt een besluit tot onderbewindstelling onverwijld ter kennis van het ziekenfonds, het
      College zorgverzekeringen en Onze Minister.

      5 Het ziekenfonds is verplicht te handelen overeenkomstig de opdrachten van de bewindvoerders.

      6 Het College toezicht kan een bewindvoerder tussentijds vervangen.

      7 Voor schade ten gevolge van een handeling die is verricht in strijd met het besluit tot onderbewindstelling,
      is degene die deze handeling als orgaan van het ziekenfonds heeft verricht, persoonlijk aansprakelijk tegenover
      het ziekenfonds. De vernietigbaarheid van de handeling kan worden ingeroepen door het ziekenfonds, indien
      de wederpartij wist of daarvan niet onkundig kon zijn, dat deze handeling in strijd was met het besluit tot
      onderbewindstelling.

      8 De kosten die de bewindvoerders maken ter uitvoering van de aan hen opgedragen taken, alsmede het honorarium van
      de bewindvoerders komen ten laste van het ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x9
  - number: 1x10
    text: |-
      Het College toezicht kan, optredende voor een uitvoeringsorgaan een schadevergoeding vorderen van een
      bestuurder of gewezen bestuurder voor schade, veroorzaakt door diens nalatigheid of wanbeheer. De voorgaande
      volzin is ten aanzien van ziekenfondsen eveneens van toepassing ten aanzien van degenen, bedoeld in
      [artikel 1x9, zevende lid, eerste volzin][ref1], voor schade als in dat lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x9
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x10
