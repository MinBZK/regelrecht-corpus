    text: |-
      1 Voor de toepassing van artikel 15 wordt onder loon verstaan het loon in de zin van de
      [Coördinatiewet Sociale Verzekering][ref1].

      2 Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel16
