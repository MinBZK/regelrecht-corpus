  - number: 83a
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken
      ter zake van een feit, dat aanleiding geeft tot het verlenen van verstrekkingen of vergoedingen ingevolge de
      verzekering, houdt de rechter rekening met de aanspraken, die de verzekerde krachtens deze wet heeft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel83a
  - number: 83b
    text: |-
      1 Behoudens toepassing van het derde lid, eerste volzin, heeft een ziekenfonds voor de krachtens de verzekering
      gemaakte kosten verhaal op degene, die in verband met het veroorzaken van het in [artikel 83][ref1] bedoelde feit
      jegens de verzekerde naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag,
      waarvoor deze bij het ontbreken van de aanspraken krachtens de verzekering naar burgerlijk recht aansprakelijk
      zou zijn, verminderd met een bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke
      persoon jegens de verzekerde naar burgerlijk recht is gehouden.

      2 Voorzover de geldswaarde van de in het eerste lid bedoelde verleende verstrekkingen niet kan worden vastgesteld,
      wordt deze bepaald op een geschat bedrag. Onze Minister kan hieromtrent nadere regels stellen.

      3 Het College zorgverzekeringen kan met verzekeraars een overeenkomst sluiten inhoudende een door die verzekeraars
      aan het College zorgverzekeringen te betalen afkoopsom voor de voor de komende periode te verwachten schadelast
      tengevolge van de schadeplichtigheid van diens verzekerden ingevolge het eerste lid. De overeenkomst heeft geen
      betrekking op de schadelast van een ziekenfonds dat voor de aanvang van de onderhandelingen over de bedoelde
      overeenkomst aan het College zorgverzekeringen te kennen heeft gegeven van zijn bevoegdheid in het eerste lid
      gebruik te maken. Het College zorgverzekeringen stelt voor aanvang van de periode waarvoor een afkoopsom is
      overeengekomen, ziekenfondsen op de hoogte van de totstandkoming van bedoelde overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel83a
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 83a
        hoofdstuk: VII
  - number: 83c
    text: |-
      1 Het bepaalde in het vorige artikel geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding verplichte
      werkgever van de verzekerde, onderscheidenlijk ten aanzien van de naar burgerlijk recht tot schadevergoeding
      verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever als de verzekerde jegens wie naar
      burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien het in [artikel 83][ref1] bedoelde feit
      is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk verzekerde.

      2 Voor de toepassing van het vorige lid wordt mede als werkgever beschouwd degene, die krachtens het bepaalde bij
      het eerste lid van [artikel 16][ref2] mede als werkgever wordt beschouwd, ongeacht de bij het tweede lid van dat
      artikel bedoelde uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel83a
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel83c
    references:
