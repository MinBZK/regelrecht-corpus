  - number: '48'
    text: |-
      Een instelling die met een ziekenfonds een overeenkomst als bedoeld in [het eerste lid van artikel 44][ref1]
      heeft gesloten, is gehouden op daartoe door een ander ziekenfonds gedaan verzoek met dat ziekenfonds een gelijke
      overeenkomst te sluiten, tenzij die instelling daartegen ernstige bedenkingen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
        hoofdstuk: IV
  - number: '49'
    text: |-
      1 Indien overeenkomsten, welke nodig zijn voor het verlenen van een bepaalde verstrekking, niet of niet in
      voldoende aantal tot stand komen, kan Onze Minister bepalen, dat overeenkomsten ten aanzien van de bedoelde
      verstrekking slechts mogen worden gesloten met inachtneming van door hem te stellen richtlijnen.

      2 Alvorens een besluit te nemen krachtens het eerste lid, wint Onze Minister het advies van een door hem te
      benoemen commissie in.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel49
  - number: 73b
    text: |-
      1 Een ieder verstrekt op verzoek aan het College zorgverzekeringen, het College toezicht, Onze Minister van
      Sociale Zaken en Werkgelegenheid, het Uitvoeringsinstituut werknemersverzekeringen, de Sociale verzekeringsbank, de
      Rijksbelastingdienst, het gemeentebestuur, ziekenfondsen of aan een daartoe door of vanwege een van deze instanties
      aangewezen persoon kosteloos alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van deze wet
      door de desbetreffende rechtspersoon ten opzichte van:

      a. hemzelf;

      b. degenen die in aanmerking kunnen komen voor medeverzekering;

      c. degene die ten opzichte van hem bij of krachtens deze wet is of was aangewezen als werkgever;

      d. degene die in zijn dienst dan wel te zijnen behoeve werkt of gewerkt heeft;

      e. degene van wie een pensioen of uitkering wordt, zal worden of is verkregen;

      f. degene aan wie een pensioen of uitkering wordt, zal worden of is verstrekt;

      g. degene van wie inkomen uit of in verband met het verrichten van arbeid in het bedrijfs- of beroepsleven wordt,
      zal worden of is ontvangen;

      h. degene aan wie inkomen uit of in verband met het verrichten van arbeid in het bedrijfs- of beroepsleven wordt,
      zal worden of is verstrekt.

      2 De in het eerste lid bedoelde gegevens en inlichtingen worden op verzoek verstrekt in schriftelijke vorm, of in
      een andere vorm die redelijkerwijs kan worden verlangd, binnen een termijn die schriftelijk wordt gesteld bij het
      in het eerste lid bedoelde verzoek.

      3 Een ieder geeft op verzoek van een rechtspersoon als bedoeld in het eerste lid, inzage in alle bescheiden en
      andere gegevensdragers, stelt deze op verzoek ter beschikking voor het nemen van afschrift en verleent de terzake
      verlangde medewerking, voorzover dit noodzakelijk is voor de uitvoering van deze wet door de desbetreffende
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel73b
  - number: 73c
    text: |-
      1 De in [artikel 73][ref1], bedoelde instanties zijn bevoegd uit eigen beweging en verplicht op verzoek uit de
      onder hun verantwoordelijkheid gevoerde administratie, aan elkaar of aan een daartoe door of vanwege een van deze
      instanties aangewezen persoon de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet. De
      verstrekking van de gegevens geschiedt kosteloos, tenzij bij of krachtens wet anders is bepaald.

      2 Publiekrechtelijke lichamen zijn verplicht hun medewerking te verlenen bij het verkrijgen van inlichtingen,
      benodigd voor de uitvoering van deze wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij of
      krachtens wet anders is bepaald. Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      kunnen regelen stellen met betrekking tot de wijze waarop en de vorm waarin de inlichtingen worden verstrekt.

      3 Alle ambtenaren tot afgifte van uittreksels uit registers van burgerlijke stand bevoegd, zijn verplicht aan
      een in [artikel 73][ref2], bedoelde instantie de door deze gevraagde uittreksels uit de registers kosteloos toe
      te zenden.

      4 Griffiers van colleges, geheel of ten dele met rechtspraak belast, verstrekken op verzoek, kosteloos, aan
      het College zorgverzekeringen, aan het College toezicht en aan de ziekenfondsen alle gegevens, inlichtingen
      en uittreksels uit of afschriften van uitspraken, registers en andere stukken, die noodzakelijk zijn voor de
      uitvoering van deze wet door de desbetreffende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel73c
    references:
