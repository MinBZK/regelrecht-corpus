  - number: '47'
    text: |-
      1 Een ziekenfonds is verplicht met iedere instelling die binnen het werkgebied van het ziekenfonds is gelegen
      of waarvan de bevolking van het werkgebied van het ziekenfonds regelmatig gebruik maakt, op haar verzoek een
      overeenkomst te sluiten als bedoeld in [artikel 44, eerste lid][ref1], tenzij het ziekenfonds daartegen ernstige
      bezwaren heeft. Het College zorgverzekeringen kan bij het verlenen van een ontheffing als bedoeld in artikel 42,
      vijfde lid, van het bepaalde in het eerste lid van dat artikel, bepalen of en in hoeverre van het gestelde in de
      vorige volzin kan worden afgeweken.

      2 Bij de algemene maatregel van bestuur, bedoeld in [artikel 8][ref2], kan worden bepaald dat het eerste lid niet
      geldt voor de bij die maatregel aangewezen categorieën van instellingen.

      3 Een rechtspersoon als bedoeld in [artikel 14][ref3], is verplicht met iedere daarvoor in aanmerking komende
      instelling, welke hiertoe is aangewezen door het College zorgverzekeringen, op haar verzoek een overeenkomst te
      sluiten als bedoeld in [artikel 44, tiende lid][ref4], tenzij de eerstbedoelde rechtspersoon daartegen ernstige
      bedenkingen heeft.


