  - number: '6'
    text: |-
      Het beding, waarbij een verzekerde zich tegenover zijn werkgever verbindt zich te doen inschrijven bij een door die
      werkgever aangewezen ziekenfonds, is nietig.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of de kosten daarvan, gesloten
      door degene, die als verzekerde bij een ziekenfonds wordt ingeschreven, vervalt met ingang van de dag, waarop
      de verzekeraar van de verzekerde mededeling van de inschrijving ontvangt, voor zover aan de overeenkomst rechten
      kunnen worden ontleend, gelijkwaardig aan die, welke uit de verzekering voortvloeien.

      2 De premie, welke degene, wiens verzekering krachtens het bepaalde in het eerste lid geheel of gedeeltelijk
      is vervallen, heeft vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst terugbetaald, onder aftrek van ten hoogste 25 pct. van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 De verzekerden hebben, voor zover daarop geen aanspraak bestaat ingevolge de
      [Algemene Wet Bijzondere Ziektekosten][ref1], ter voorziening in hun geneeskundige verzorging aanspraak op de
      navolgende verstrekkingen:

      a. medisch-specialistische zorg, verleend door of vanwege een ziekenhuis, al dan niet gepaard gaande met opneming
      gedurende het etmaal of een deel daarvan, verpleging, verzorging, paramedische hulp of farmaceutische hulp.

      b. revalidatiezorg van medisch-specialistische, paramedische, gedragswetenschappelijke en revalidatie-technische
      aard;

      c. medisch-specialistische zorg, anders dan bedoeld onder a;

      d. huisartsenzorg;

      e. verloskundige zorg;

      f. kraamzorg;

      g. tandheelkundige zorg;

      h. paramedische zorg;

      i. hulpmiddelen;

      j. farmaceutische zorg.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat op verstrekking van andere zorg dan de zorg, bedoeld in
      het eerste lid, aanspraak bestaat.

      3 Bij of krachtens algemene maatregel van bestuur kan de inhoud en omvang van de aanspraken nader worden geregeld
      en kunnen voor het tot gelding brengen van de aanspraken voorwaarden worden gesteld.

      4 Bij algemene maatregel van bestuur kan als voorwaarde voor het tot gelding brengen van aanspraken worden bepaald
      dat de verzekerde een bijdrage in de kosten betaalt. Daarbij kan worden bepaald dat het vaststellen van de hoogte
      van de bijdrage en een maximum van bijdragen bij ministeriële regeling geschiedt. De bijdrage hoeft niet voor alle
      verzekerden gelijk te zijn.

      5 Ziekenfondsen dragen er zorg voor dat de bij hen ingeschreven verzekerden hun aanspraken tot gelding kunnen
      brengen.

      6 Bij algemene maatregel van bestuur kan worden geregeld in welke omvang, in welke mate en onder welke voorwaarden
      een verstrekking wordt voortgezet na het tijdstip waarop de verzekering is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 8a
    text: |-
      1 Een instelling die verstrekkingen als bedoeld in [artikel 8][ref1] verleent, moet als zodanig zijn toegelaten.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een instelling, behorende tot een bij de maatregel aan
      te wijzen categorie van instellingen, voor de toepassing van deze wet als toegelaten wordt aangemerkt.

      3 Het College zorgverzekeringen beslist op aanvragen om toelating.

      4 Bij of krachtens algemene maatregel van bestuur worden bepaald de aard van de te verstrekken gegevens, alsmede de
      wijze waarop en de termijn waarbinnen de gegevens moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
  - number: 8c
    text: |-
      Een toelating wordt geweigerd:

      a. met betrekking tot instellingen die een ziekenhuisvoorziening in de zin van de
      [Wet ziekenhuisvoorzieningen][ref1] in stand houden: voor zover de instelling niet voldoet aan de ingevolge die wet
      geldende voorschriften inzake spreiding en behoefte;

      b. met betrekking tot de overige instellingen: voor zover de instelling niet voldoet aan de door Onze Minister vast
      te stellen voorschriften inzake spreiding en behoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: 8f
    text: |-
      Behoudens voor zover bij de toelating anders is aangegeven, worden de werkzaamheden van de instelling ter zake van
      de verlening van verstrekkingen verricht op de wijze en in de omvang overeenkomstig de gegevens, verstrekt bij de
      aanvraag om toelating.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8f
  - number: 8g
    text: |-
      Een toelating wordt ingetrokken:

      a. voor zover de instelling niet meer voldoet aan de voorschriften, bedoeld in [artikel 8][ref1];

      b. indien de instelling in strijd handelt met [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel8f
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 8c
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 8f
        hoofdstuk: II
        paragraaf: b
  - number: 8h
    text: |-
      Een toegelaten instelling is verplicht, voor zover het College zorgverzekeringen zulks voor de toepassing van
      dit hoofdstuk behoeft, deze alle gevraagde mondelinge en schriftelijke inlichtingen en gegevens te verstrekken
      en inzage te geven van boeken en bescheiden, welke betrekking hebben op het gevoerde beheer en de verrichte
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8h
  - number: 8i
    text: |-
      Indien een maatregel als bedoeld in artikel 18*a*, eerste lid, eerste volzin, aanhef en onder *a*, of tweede
      volzin, van de [Wet ziekenhuisvoorzieningen][ref1] is getroffen, wordt de toelating geacht dienovereenkomstig te
      zijn gewijzigd dan wel ingetrokken. In afwijking van [artikel 77][ref2] kan ter zake geen beroep worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel77
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel8i
    references:
      - id: ref1
        bwb_id: BWBR0002753
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '77'
        hoofdstuk: VI
  - number: '9'
    text: |-
      1 De verzekerde, die zijn aanspraak op een verstrekking geldend wil maken, wendt zich daartoe, behalve in gevallen,
      genoemd in de algemene maatregel van bestuur krachtens [het tweede lid van artikel 8][ref1], tot een persoon of
      een instelling, met wie of welke het ziekenfonds, waarbij hij is ingeschreven, tot dat doel een overeenkomst heeft
      gesloten, een en ander behoudens het bepaalde in het vierde lid.

      2 De verzekerde wordt de keuze gelaten uit de in het eerste lid bedoelde personen en instellingen, behoudens het
      bepaalde in het vijfde lid en ten aanzien van ambulancevervoer in de zin van de [Wet ambulancevervoer][ref2].

      3

      4 Een ziekenfonds kan, in afwijking van het bepaalde in het eerste en tweede lid, aan een verzekerde toestemming
      verlenen zich voor het geldend maken van zijn recht op een verstrekking te wenden tot een andere persoon of
      instelling in Nederland, indien zulks voor zijn geneeskundige verzorging nodig is. Onze Minister kan bepalen in
      welke gevallen en onder welke voorwaarden aan een verzekerde ook toestemming kan worden verleend zich voor het
      geldend maken van zijn recht op een verstrekking te wenden tot een persoon of inrichting buiten Nederland.

      5 In de overeenkomsten, bedoeld in het eerste lid, kan worden bepaald, dat verzekerden, om hun rechten op de
      desbetreffende verstrekking geldend te kunnen maken, door het ziekenfonds ingeschreven moeten zijn op naam van
      een persoon of een instelling. Daarbij kunnen regelen worden gesteld ter beperking van het ten name van een
      persoon of een instelling in te schrijven aantal verzekerden. Bij reglement van het ziekenfonds kan het aantal
      overschrijvingen van een verzekerde in een bepaald tijdvak aan een maximum worden gebonden en kunnen regelen worden
      gesteld betreffende de tijdstippen van overschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002757
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '8'
        hoofdstuk: II
        paragraaf: b
      - id: ref2
        bwb_id: BWBR0002757
  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald in welke mate en onder welke voorwaarden aanspraak
      bestaat op een verstrekking of op een vergoeding wegens kosten van geneeskundige verzorging, verleend in of buiten
      Nederland, in gevallen, waarin een verzekerde als gevolg van in die algemene maatregel van bestuur omschreven
      omstandigheden geneeskundige hulp heeft ingeroepen, welke hij, hadden die omstandigheden zich niet voorgedaan, op
      de in [artikel 9][ref1] omschreven wijze had kunnen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel9
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '9'
        hoofdstuk: II
        paragraaf: b
  - number: '11'
    text: |-
      1 Onze Minister kan bepalen, dat de verzekerden van alle of van door hem aan te wijzen ziekenfondsen aanspraak
      hebben jegens hun ziekenfonds op een uitkering in geld wegens gemaakte kosten voor een bepaalde vorm van
      geneeskundige verzorging in plaats van aanspraak op de desbetreffende verstrekking. Onze Minister gaat hiertoe
      slechts over, indien hij van oordeel is, dat alle of door hem aangewezen ziekenfondsen in de onmogelijkheid
      verkeren op voor hen aanvaardbare voorwaarden overeenkomsten te sluiten met een genoegzaam aantal personen of
      instellingen, die de bedoelde vorm van geneeskundige verzorging kunnen verlenen.

      2 In het besluit van Onze Minister, bedoeld in het eerste lid, wordt tevens bepaald onder welke voorwaarden en tot
      welk bedrag aanspraak op een uitkering bestaat.

      3 De bekendmaking van een besluit als bedoeld in het eerste lid, gaat vergezeld van een toelichting daarop.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel11
  - number: '12'
    text: |-
      De verzekerde kan aan de verzekering geen aanspraak ontlenen, indien en voor zover hij ingevolge een bij algemene
      maatregel van bestuur aangewezen regeling op geneeskundige behandeling of vergoeding van de kosten daarvan recht
      heeft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel12
  - number: '14'
    text: |-
      Ten aanzien van het verlenen van bij algemene maatregel van bestuur aan te wijzen verstrekkingen van verpleging
      en behandeling kan een bij algemene maatregel van bestuur te bepalen deel van de administratie en de controle
      worden uitgeoefend door de door Onze Minister aan te wijzen rechtspersonen, welke deze taak voor het gehele land
      of voor een gedeelte van het land dan wel voor groepen van ziekenfondsen vervullen, overeenkomstig door het College
      zorgverzekeringen. vast te stellen beleidsregels. Het College zorgverzekeringen. regelt tevens de wijze, waarop de
      kosten, voortvloeiende uit de werkzaamheden van de aangewezen rechtspersonen, worden gedekt uit de Algemene Kas.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel14
  - number: 14a
    text: |-
      1 De middelen tot dekking van de uitgaven van de verzekering worden gevonden door:

      a. het heffen van premies;

      b. het verlenen van een bijdrage door het uitvoeringsorgaan als bedoeld in artikel 1, onder e, van de
      [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1].

      2 Onze Minister kan jaarlijks een bijdrage verlenen aan de Algemene Kas, tot het bedrag dat daarvoor in de wet
      tot vaststelling van de begroting voor zijn ministerie voor dat jaar is toegestaan. De bijdrage wordt betaald in
      gelijke maandelijkse delen.

      3 Onze Minister kan in overeenstemming met het gevoelen van de ministerraad besluiten de bijdrage te wijzigen. Van
      zodanig besluit wordt schriftelijk mededeling gedaan aan de beide kamers van de Staten-Generaal, indien de bijdrage
      daardoor met meer dan € 11 000 000 toeneemt of afneemt. De maandelijkse betalingen worden met het genomen besluit
      in overeenstemming gebracht, tenzij in een geval als bedoeld in de tweede volzin binnen veertien dagen door een der
      kamers van de Staten-Generaal de wens te kennen wordt gegeven nadere inlichtingen te ontvangen over de wijziging
      van de bijdrage. Indien een der kamers van de Staten-Generaal na het ontvangen van de bedoelde inlichtingen als
      haar oordeel uitspreekt dat de wijziging van de bijdrage voorafgaande machtiging bij wet behoeft, zal de wijziging
      eerst plaatsvinden nadat een daarop betrekking hebbend voorstel van wet tot wijziging van de begroting tot wet zal
      zijn verheven.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003933
  - number: '15'
    text: |-
      1 Onverminderd hetgeen bij of krachtens [artikel 17][ref1] omtrent de daarbedoelde nominale premie is bepaald,
      wordt voor de verzekering van de verzekerden, bedoeld in [artikel 3, eerste lid, onder ][ref2], een procentuele
      premie geheven, in een door Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid te zamen
      te bepalen percentage van het loon, dat in het tijdvak, waarover de betaling loopt, door de verzekerden is
      genoten. Voor verzekerden, op wie de regeling van [artikel 415 van het Wetboek van Koophandel][ref3] van
      toepassing is, alsmede voor de verzekerden die ingevolge het bepaalde bij of krachtens [artikel 7][ref4], dan
      wel [artikel 8 van de Ziektewet][ref5] als werknemer in de zin van die wet worden beschouwd, indien zij een
      uitkering ontvangen op grond van een arbeidsverhouding dan wel een beëindigde arbeidsverhouding terzake waarvan
      zij behoorden tot de verzekerden op wie de regeling van [artikel 415 van het Wetboek van Koophandel][ref6]
      van toepassing was, wordt door Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid te zamen
      de premie op een lager percentage bepaald. Bij algemene maatregel van bestuur worden regels gesteld over de
      wijze waarop het in de tweede volzin bedoelde premiepercentage wordt berekend. Ten aanzien van degenen die bij
      of krachtens [artikel 7 van de Ziektewet][ref7] als werknemer in de zin van die wet worden beschouwd, is de
      tweede volzin slechts van toepassing gedurende het eerste jaar zolang en voor zover zij recht hebben op een
      werkloosheidsuitkering, berekend naar 70% van het dagloon.

      2 Onze Minister bepaalt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid bij ministeriële
      regeling welk deel van de procentuele premie, bedoeld in het eerste lid, door de werkgever en welk deel door de
      werknemer is verschuldigd, met dien verstande dat bedoelde premie geheel door de werkgever is verschuldigd ten
      aanzien van de verzekerde, wiens loon geheel bestaat uit verstrekkingen in natura, met of zonder huisvesting en
      onderricht. Alvorens een regeling krachtens de eerste volzin wordt vastgesteld, wordt de zakelijke inhoud ervan
      schriftelijk medegedeeld aan de beide kamers der Staten-Generaal. De regeling treedt niet eerder in werking dan
      nadat vier weken zijn verstreken na die mededeling.

      3 De werkgever is gehouden zowel de door de verzekerde als door hem zelf verschuldigde premie te betalen aan
      het Uitvoeringsinstituut werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen stelt de
      verschuldigde premie vast voor alle sectoren van het bedrijfs- en beroepsleven en vordert deze in overeenkomstig
      de bepalingen van de [Coördinatiewet Sociale Verzekering][ref8]. Indien een herziening van het in de eerste of
      de tweede volzin van het eerste lid bedoelde premiepercentage ingaat op een ander tijdstip dan met ingang van 1
      januari, gaat het Uitvoeringsinstituut werknemersverzekeringen bij de vaststelling en de invordering van de premie
      uit van een door hem, onder goedkeuring van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid,
      vast te stellen gemiddeld percentage dat zal gelden voor het gehele kalenderjaar. Het Uitvoeringsinstituut
      werknemersverzekeringen kan regels stellen waarin gevallen worden aangewezen waarbij wordt uitgegaan van de
      percentages bedoeld in het eerste lid.

      4 De werkgever is bevoegd op het loon van de verzekerde in te houden het door deze verschuldigde deel der premie
      over de tijd, waarover dat loon wordt betaald.

      Indien de verschuldigde premie na de loonuitbetaling met terugwerkende kracht wordt verhoogd of indien een
      voorschotpremie wordt gevorderd, mag bij de definitieve vaststelling van de kosten niets van een eventueel door de
      werkgever bij te betalen of bijbetaald bedrag op de werknemer worden verhaald.

      5 Het Uitvoeringsinstituut werknemersverzekeringen stort de ontvangen bedragen in de Algemene Kas. Bij of krachtens
      algemene maatregel van bestuur kunnen regelen worden gesteld betreffende de afdracht en de verantwoording van de
      ontvangen bedragen.

      6 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de premie, verschuldigd voor de
      verzekering van de bij of krachtens die algemene maatregel van bestuur aangewezen groepen van personen, andere
      organen worden aangewezen voor de premie-inning en kunnen andere regelen worden gesteld voor de vaststelling, de
      invordering, de afdracht en de verantwoording van de premie.


