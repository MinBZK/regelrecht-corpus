  - number: 1y
    text: |-
      1 Het College zorgverzekeringen en het College toezicht verstrekken desgevraagd aan Onze Minister de voor de
      uitoefening van zijn taak benodigde inlichtingen en gegevens.

      2 Het College zorgverzekeringen en het College toezicht verlenen aan door Onze Minister aangewezen personen toegang
      tot en inzage in alle gegevens die Onze Minister nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1y
  - number: 1z
    text: |-
      Het College zorgverzekeringen en het College toezicht verstrekken desgevraagd aan het College
      tarieven gezondheidszorg, bedoeld in de [Wet tarieven gezondheidszorg][ref1], en aan het College
      bouw ziekenhuisvoorzieningen en het College sanering ziekenhuisvoorzieningen, bedoeld in de
      [Wet ziekenhuisvoorzieningen][ref2], de voor de uitoefening van hun taak benodigde inlichtingen. De bedoelde
      colleges kunnen inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van hun
      taak redelijkerwijs nodig is.


