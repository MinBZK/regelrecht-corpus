    text: |-
      1 In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit inzake de verschuldigde premie gehoord op zijn verzoek.

      2 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2] beslist het
      Uitvoeringsinstituut werknemersverzekeringen in de in het eerste lid bedoelde bezwaarschriftprocedure binnen
      dertien weken na ontvangst van het bezwaarschrift.


