  - number: '5'
    text: |-
      1 De verzekerde, die de aanspraken, welke hem en zijn medeverzekerden ingevolge dit hoofdstuk toekomen,
      geldend wil maken, meldt zich daartoe aan bij een ziekenfonds, werkende in de gemeente of in het deel van de
      gemeente waar hij woont, welk ziekenfonds verplicht is hem als zodanig in te schrijven. De verzekerde ingevolge
      [artikel 3d, eerste lid][ref1], legt daartoe de verklaring, bedoeld in [artikel 3d, tweede lid][ref2], over.

      Waar iemand woont wordt naar de omstandigheden beoordeeld. Het College zorgverzekeringen kan nadere en zonodig
      afwijkende regelen vaststellen; Onze Minister kan ten aanzien van bepaalde groepen van verzekerden een of meer
      ziekenfondsen aanwijzen, waarbij deze zich bij uitsluiting aanmelden, en kan daarbij bepalen dat een desbetreffend
      ziekenfonds in afwijking van de eerste volzin geen andere verzekerden die zich bij dat ziekenfonds aanmelden,
      inschrijft.

      2 Al hetgeen verder de inschrijving als verzekerde betreft wordt bij of krachtens algemene maatregel van bestuur
      geregeld. Daarbij kunnen verplichtingen worden opgelegd aan verzekerden, gewezen verzekerden, alsmede aan hun
      werkgevers of vroegere werkgevers.

      3 Werkgever is de werkgever in de zin van de [Ziektewet][ref3]. Bij of krachtens algemene maatregel van bestuur
      wordt aangegeven wie werkgever is van degenen, bedoeld in [de artikelen 3, eerste lid, onder b, c en d][ref4],
      en [3d][ref5].

      4 Van degene, die de regelen, bedoeld in het tweede lid, niet naleeft, kan het ziekenfonds een vergoeding vorderen
      van de deswege geleden schade. De hoogte van de vergoeding wordt bepaald overeenkomstig regelen, te stellen bij of
      krachtens algemene maatregel van bestuur.

      5 Het bepaalde in het vierde lid is van overeenkomstige toepassing op degene die niet verzekerd is, dan wel
      anderszins niet voor inschrijving als verzekerde in aanmerking komt en zich niettemin als zodanig heeft doen
      inschrijven.

      6 Tot inschrijving van een persoon, als bedoeld in [artikel 4, eerste lid][ref6], wordt door het ziekenfonds
      slechts overgegaan indien deze persoon op hetzelfde woonadres als de verzekerde aan wiens verzekering de
      medeverzekering wordt ontleend, is ingeschreven in een gemeentelijke basisadministratie, met uitzondering van bij
      of krachtens algemene maatregel van bestuur te bepalen gevallen.


