  - number: 1p
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het College zorgverzekeringen ten laste van de Algemene Kas
      dan wel ten laste van het Algemeen Fonds Bijzondere Ziektekosten, overeenkomstig in die regeling gestelde regels
      subsidies verstrekt:

      a. voor voorzieningen, ten aanzien waarvan het voornemen bestaat deze te doen opnemen in de aanspraken ingevolge
      deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. voor voorzieningen die aan verzekerden ingevolge deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref2]
      kunnen worden geboden in plaats van een voorziening waarop ingevolge die wetten aanspraak bestaat;

      c. voor activiteiten welke ten doel hebben verbetering van de zorgverlening te bevorderen;

      d. ten behoeve van verzekerden ingevolge deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref3] om hen de
      mogelijkheid te geven om in plaats van het tot gelding brengen van een aanspraak ingevolge die wetten zelf te
      voorzien in de zorg die zij behoeven;

      e. voor onderzoek met betrekking tot de uitvoering van deze wet en de [Algemene Wet Bijzondere Ziektekosten][ref4];

      f. voor andere bij die regeling aan te wijzen doeleinden, verband houdende met de verzekering ingevolge deze wet of
      de [Algemene Wet Bijzondere Ziektekosten][ref5] of de volksgezondheid in het algemeen.

      2 In een regeling als bedoeld in het eerste lid kan worden bepaald dat daarbij aan te wijzen bevoegdheden
      met betrekking tot de verstrekking van subsidies worden uitgeoefend door een of meer door het College
      zorgverzekeringen aan te wijzen rechtspersonen als bedoeld in [artikel 14][ref6] van deze wet of
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref7].

      3 In een regeling als bedoeld in het eerste lid kan aan het College zorgverzekeringen worden opgedragen nadere
      regels te stellen. De nadere regels behoeven de goedkeuring van Onze Minister. Goedkeuring kan slechts worden
      onthouden wegens strijd met het recht of het belang van de volksgezondheid.

      4 Onze Minister kan jaarlijks voor een categorie van subsidies het subsidieplafond voor het komende jaar
      bekendmaken.


