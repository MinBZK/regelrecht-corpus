    text: |-
      1 Het College toezicht rapporteert voor 1 november aan Onze Minister en aan het College
      zorgverzekeringen per uitvoeringsorgaan over de rechtmatigheid van de uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] in het voorafgaande kalenderjaar. Daarbij wordt per uitvoeringsorgaan
      een verklaring gegeven over de rechtmatigheid van de in de financiële verantwoording over het voorafgaande
      kalenderjaar door het uitvoeringsorgaan opgenomen posten. Indien het College toezicht uitgaven of besparingen op
      beheerskosten van een uitvoeringsorgaan als niet verantwoord heeft aangemerkt, vermeldt het dat in zijn verklaring.

      2 Het College toezicht zendt voor 1 november aan Onze Minister en aan het College zorgverzekeringen
      een samenvattend rapport over de rechtmatigheid van de uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref2] door de uitvoeringsorganen in het voorafgaande kalenderjaar.

      3 Onze Minister zendt het rapport, bedoeld in het tweede lid, tegelijk met het financieel verslag, bedoeld in
      [artikel 1s][ref3], aan beide kamers der Staten-Generaal. Het College toezicht stelt het rapport, bedoeld in het
      tweede lid, algemeen verkrijgbaar.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van de rapportages, bedoeld
      in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
