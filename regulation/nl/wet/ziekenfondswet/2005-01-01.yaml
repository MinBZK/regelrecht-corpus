    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake een beschikking als bedoeld in
      [artikel 3d, tweede lid][ref1], is [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref2] van
