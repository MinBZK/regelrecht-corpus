  - number: 3a
    text: |-
      1 Het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref1], wordt door Onze Minister telkens herzien met ingang
      van 1 januari. Bij die herziening wordt, met inachtneming van het bij en krachtens het tweede lid bepaalde, dit
      bedrag verhoogd of verlaagd overeenkomstig het procentuele verschil tussen het indexcijfer der lonen op 31 juli
      daaraan voorafgaande en het indexcijfer, dat bij de laatste herziening is gehanteerd.

      2 Onder indexcijfer der lonen wordt verstaan het indexcijfer van de CAO-lonen per maand inclusief bijzondere
      uitkeringen, sector particuliere bedrijven, zoals dat op basis van het jaar 2000 wordt berekend door het Centraal
      Bureau voor de Statistiek naar de stand op de laatste werkdag van elke kalendermaand en voor de eerste maal, al dan
      niet voorlopig, wordt gepubliceerd in het «Statistisch Bulletin van het Centraal Bureau voor de Statistiek».

      Het in de eerste volzin genoemde jaartal kan bij ministeriële regeling worden gewijzigd. Bij de eerstvolgende
      herziening nadat een dergelijke regeling is getroffen, wordt, in afwijking van het eerste lid, het procentuele
      verschil gehanteerd tussen het indexcijfer der lonen op 31 juli daaraan voorafgaande en het indexcijfer, dat bij de
      laatste herziening zou zijn gehanteerd, ware de indexcijferreeks reeds op het gewijzigde jaartal gebaseerd.

      3 Het op grond van de vorige leden berekende bedrag wordt naar boven afgerond op een veelvoud van € 50.

      4 Het overeenkomstig de vorige leden herziene bedrag treedt in de plaats van het bedrag, genoemd in
      [artikel 3, eerste lid, onder ][ref2], met dien verstande, dat de afronding, bedoeld in het vorige lid, bij de
      eerstvolgende toepassing van het eerste lid buiten beschouwing blijft.

      5 Indien daartoe naar Ons oordeel een bijzondere aanleiding bestaat, kan het bedrag, genoemd in
      [artikel 3, eerste lid, onder ][ref3], bij algemene maatregel van bestuur worden herzien. Het ingevolge de vorige
      volzin herziene bedrag treedt in de plaats van het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref4], met
      dien verstande, dat de herziening voor de eerstvolgende toepassing van het eerste lid geacht wordt niet te hebben
      plaatsgevonden.

      6 Indien een herziening als in het vorige lid bedoeld zou samenvallen met een herziening als bedoeld in het eerste
      lid, blijft laatstbedoelde herziening achterwege.

      7 Wanneer een herziening van het bedrag, genoemd in [artikel 3, eerste lid, onder ][ref5], overeenkomstig het
      bepaalde in de vorige leden er naar Ons oordeel toe zou leiden, dat het aantal verzekerde werknemers in de zin van
      deze wet beduidend zou toenemen dan wel afnemen, kan:

      a. bij algemene maatregel van bestuur worden bepaald, dat herziening achterwege blijft, of

      b. bij algemene maatregel van bestuur die herziening op zodanige wijze plaatsvinden, dat het bedoelde toenemen dan
      wel afnemen niet of niet ten volle zal optreden.


