  - number: '77'
    text: |-
      Een belanghebbende kan tegen ingevolge deze wet genomen besluiten van Onze Minister, van het College
      zorgverzekeringen, het College toezicht, en van rechtspersonen als bedoeld in [artikel 1p, tweede lid][ref1],
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. De eerste volzin geldt niet ten aanzien
      van een besluit, genomen jegens een persoon die behoort tot het personeel van de genoemde colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1p
