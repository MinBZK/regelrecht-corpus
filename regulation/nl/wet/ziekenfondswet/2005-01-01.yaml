  - number: '41'
    text: |-
      1 Een ziekenfonds is bevoegd met toestemming van het College zorgverzekeringen administratieve werkzaamheden te
      verrichten ten behoeve van natuurlijke en rechtspersonen die zich bezighouden met werkzaamheden op het gebied van
      de volksgezondheid. Het ziekenfonds brengt de kosten van zodanige werkzaamheden aan de opdrachtgever in rekening.

      2 Een toestemming ingevolge het vorige lid kan onder beperkingen worden verleend; aan de toestemming kunnen
      voorschriften worden verbonden. Ook na het verlenen van een toestemming kunnen daaraan beperkingen worden gesteld
      of voorschriften worden verbonden dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of
      ingetrokken.

      3 Een toestemming ingevolge het eerste lid kan worden ingetrokken:

      a. indien wordt gehandeld in strijd met aan de toestemming verbonden voorschriften;

      b. indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel41
  - number: '42'
    text: |-
      1 Het is een ziekenfonds verboden zelf diensten of zaken te leveren, welke behoren tot de
      bij of krachtens deze wet geregelde verstrekkingen of welke behoren tot de zorg, bedoeld in
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1].

      2 Het is een ziekenfonds verboden aan een instelling in de zin van deze wet of de
      [Algemene Wet Bijzondere Ziektekosten][ref2] gelden voor bedrijfsuitoefening te verschaffen, zich als borg of
      hoofdelijk medeschuldenaar voor die instelling te verbinden, zich voor die instelling sterk te maken, zich tot
      zekerheid voor een schuld van die instelling te verbinden, dan wel aan die instelling bestuurlijk deel te nemen.

      3 Het is een ziekenfonds verboden, behoudens voor zover deze wet anders bepaalt, zelf tegen betaling andere dan de
      in het eerste lid bedoelde diensten of zaken aan verzekerden te leveren.

      4 De in het eerste en derde lid bedoelde verboden gelden niet ten aanzien van het in gebruik geven van medische
      hulpmiddelen.

      5 De in het eerste en tweede lid bedoelde verboden gelden niet in door het College zorgverzekeringen aan te geven
      gevallen. Het College zorgverzekeringen kan ontheffing van het bepaalde in het eerste, tweede en derde lid verlenen
      in bijzondere gevallen.

      6 Een ontheffing ingevolge het vijfde lid kan onder beperkingen worden verleend; aan de ontheffing kunnen
      voorschriften worden verbonden. Ook na het verlenen van een ontheffing kunnen daaraan beperkingen worden gesteld
      of voorschriften worden verbonden dan wel kunnen beperkingen of voorschriften worden gewijzigd, aangevuld of
      ingetrokken.

      7 Een ontheffing kan worden ingetrokken:

      a. indien wordt gehandeld in strijd met aan de ontheffing verbonden voorschriften;

      b. indien gedurende drie achtereenvolgende jaren geen handelingen zijn verricht met gebruikmaking daarvan.

      8 Van besluiten als bedoeld in het vijfde, zesde en zevende lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel42
