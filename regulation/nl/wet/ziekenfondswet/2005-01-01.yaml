  - number: 43c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de belegging van gelden waarover
      ziekenfondsen beschikken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel43c
  - number: 43d
    text: |-
      1 In geval van liquidatie of intrekking van de toelating van een ziekenfonds heeft het College zorgverzekeringen
      ten behoeve van de Algemene Kas een vordering op het ziekenfonds ten belope van de som van de reserve
      Ziekenfondswet en de middelen, waarover het ziekenfonds ten behoeve van de uitvoering van de verzekering ingevolge
      deze wet de beschikking heeft gekregen, voor zover deze door het ziekenfonds niet zijn aangewend ter dekking van
      zijn ten behoeve van de uitvoering van de verzekering ingevolge deze wet noodzakelijke uitgaven. Uitgaven waarvan
      het College toezicht vaststelt dat deze niet verantwoord zijn, blijven daarbij buiten beschouwing, tenzij het
      College toezicht anders besluit.

      2 Het eerste lid is niet van toepassing bij overdracht van verbintenissen van een ziekenfonds aan een ander
      ziekenfonds en bij samenvoeging van ziekenfondsen tot een nieuw ziekenfonds, voor zover het in het eerste lid
      bedoelde bedrag is overgedragen aan het andere onderscheidenlijk het nieuwe ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel43d
  - number: 43e
    text: |-
      Een ziekenfonds zendt voor 1 maart aan het College zorgverzekeringen en aan het College toezicht een verslag over
      de uitvoering van deze wet in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel43e
  - number: 43f
    text: |-
      1 Een ziekenfonds zendt voor 1 maart aan het College zorgverzekeringen en aan het College
      toezicht een financieel verslag over het voorafgaande kalenderjaar, dat vergezeld gaat van een
      verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.

      2 In het financieel verslag wordt een onderscheid gemaakt tussen de beheerskosten en de kosten van verstrekkingen
      en vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel43f
