  - number: '93'
    text: |-
      Voor zover deze wet niet anders bepaalt, wordt hetgeen tot haar uitvoering nodig is bij of krachtens algemene
      maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel93
  - number: 93a
    text: |-
      1 De voordracht tot het vaststellen van een algemene maatregel van bestuur als bedoeld in de [artikelen 3a][ref1],
      [8][ref2], [15, eerste en zesde lid][ref3], [17, eerste lid][ref4], en [18][ref5] wordt gedaan door Onze Minister
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.

      2 Indien een algemene maatregel van bestuur, bedoeld in [artikel 8][ref6], geen zodanige invloed heeft op de
      geldelijke omvang van de verstrekkingen dat zulks verhoging of verlaging van de in [artikel 15][ref7] bedoelde
      premie tot gevolg heeft, zal, in afwijking van het eerste lid, een voordracht tot het vaststellen daarvan worden
      gedaan door Onze Minister.

      3 De bevoegdheden van Onze Minister, als bedoeld in [de artikelen 4, twaalfde lid, onder ][ref8], worden door hem
      uitgeoefend in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel8
