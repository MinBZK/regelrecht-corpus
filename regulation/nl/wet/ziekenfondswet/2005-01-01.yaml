  - number: '2'
    text: |-
      Vreemdelingen die niet rechtmatig in Nederland verblijf genieten als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], zijn niet verzekerd ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3'
    text: |-
      1 Verzekerd is:

      a. de werknemer in de zin van de [Ziektewet][ref1], wiens loon, verdiend in een of meer dienstbetrekkingen in de
      zin van de [Ziektewet][ref2], niet meer bedraagt dan f 62 200 per jaar, met dien verstande dat:

      1e. ten aanzien van degene die ingevolge [artikel 7 van de Ziektewet][ref3] als werknemer in de zin van die wet
      wordt beschouwd, gedurende het eerste jaar voor zover hij recht heeft op een werkloosheidsuitkering berekend naar
      70% van het dagloon, de verzekering ingevolge deze wet wordt beoordeeld naar zijn verzekeringssituatie op de dag
      voorafgaande aan die waarop dat artikel op hem van toepassing werd;

      2e. ten aanzien van degene die ingevolge [artikel 8 ][ref4]of [8c van de Ziektewet][ref5] als werknemer in de zin
      van die wet wordt beschouwd, de verzekering ingevolge deze wet wordt beoordeeld naar zijn verzekeringssituatie op
      de dag voorafgaande aan die waarop dat artikel op hem van toepassing werd;

      b. degene die naar de omstandigheden beoordeeld hier te lande woonachtig is en:

        - een uitkering ontvangt ingevolge de [Algemene nabestaandenwet][ref6], tot de eerste dag van de maand waarin de
      betrokkene de leeftijd van 65 jaar bereikt, dan wel
        - een arbeidsongeschiktheidsuitkering ontvangt op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], berekend naar een arbeidsongeschiktheid van tenminste
      45% dan wel
        - een arbeidsongeschiktheidsuitkering ontvangt op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], berekend naar een arbeidsongeschiktheid van
      tenminste 45% of
        - een uitkering ontvangt op grond van [hoofdstuk 3, afdeling 2, paragraaf 2, van de Wet arbeid en zorg][ref9],
      indien betrokkene op de dag, voorafgaande aan de dag waarop haar recht op die uitkering ingaat, verzekerde was;

      c. vanaf de eerste dag van de maand waarin hij de leeftijd van 65 jaar zal bereiken, degene die naar de
      omstandigheden beoordeeld hier te lande woonachtig is en op de laatste dag van de voorafgaande maand verzekerde
      was;

      d. degene, die behoort tot de bij of krachtens algemene maatregel van bestuur aangewezen groepen van personen.

      2 Indien bij of krachtens de algemene maatregel van bestuur bedoeld in het eerste lid, onder d, een groep van
      personen als verzekerd wordt aangewezen, geldt deze aanwijzing niet voor tot die groep behorende personen, wier
      loon, verdiend in een of meer dienstbetrekkingen, meer bedraagt dan het in het eerste lid, onder *a*, genoemde
      bedrag per jaar, herzien overeenkomstig [artikel 3][ref10] van deze wet. Het bepaalde in de eerste volzin is van
      overeenkomstige toepassing op de in het eerste lid, onder b, bedoelde personen.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, onder d, kan worden bepaald:

      a. dat daarbij aan te wijzen andere inkomsten voor de toepassing van het bepaalde in het tweede lid als
      overeengekomen vast loon in geld, verdiend in een of meer dienstbetrekkingen, zullen gelden;

      b. uit welken hoofde een verzekerde voor de toepassing van deze paragraaf als verzekerde geldt, indien hij op grond
      van meer dan één bepaling verzekerd is.

      4 Voor de toepassing van het bepaalde bij het eerste lid, onder a, en bij of krachtens het tweede lid, wordt:

      a. onder loon verstaan:

        - elke overeengekomen vaste, naar tijdsruimte en in geld vastgestelde uitkering, welke de verzekerde als vergoeding
      voor zijn arbeid of gedurende staking van de arbeid van zijn werkgever ontvangt, met uitzondering van bij algemene
      maatregel van bestuur aan te wijzen uitkeringen of bestanddelen van zodanige uitkeringen;
        - een uitkering op grond van de verplichte verzekering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11]niet zijnde de uitkering van een overheidswerknemer in de zin
      van [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref12], of van een
      gewezen overheidswerknemer, berekend naar een arbeidsongeschiktheid van minder dan 45%;
        - een uitkering op grond van de verplichte verzekering ingevolge de [Ziektewet][ref13] dan wel een uitkering of
      bijdrage als bedoeld in artikel 59 van die wet, voor zover die laatstbedoelde uitkering of bijdrage door Onze
      Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid als zodanig loon is aangewezen.
        - een uitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref14] dan
      wel hoofdstuk IV van die wet niet zijnde de uitkering van een overheidswerknemer in de zin van
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref15], of van een gewezen
      overheidswerknemer;
        - een toeslag ingevolge de [Toeslagenwet][ref16];
        - een loonsuppletie als bedoeld in [hoofdstuk IIIb](onbekend) van de [Werkloosheidswet][ref17] en
      [artikel 25 van de Invoeringswet stelselherziening sociale zekerheid][ref18];
        - een uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend) aan de
      werknemer of gelijkgestelde, bedoeld in artikel 3:6, eerste lid, van die wet;

      b. het over een of meer gedeelten van een jaar verdiende loon tot jaarloon herleid;

      c. tot het einde van een kalenderjaar geen rekening gehouden met wijzigingen van het loon, welke tijdens de duur
      van de dienstbetrekking onderscheidenlijk van de uitkering, bijdrage, toeslag of loonsuppletie na 1 november van
      het voorafgaande kalenderjaar plaatsvinden of hebben plaatsgevonden,

      d. geen rekening gehouden met de wijzigingen van het loon, die tijdens de duur van de dienstbetrekking
      plaatsvinden of hebben plaatsgevonden als gevolg van het genieten van onbetaald verlof in de zin van
      [artikel 1, onderdeel i, van de Werkloosheidswet][ref19] dan wel een publiekrechtelijke regeling inzake onbetaald
      verlof of ouderschapsverlof;.

      e. geen rekening gehouden met de wijzigingen van het loon, welke tijdens de duur van de dienstbetrekking
      plaatsvinden of hebben plaatsgevonden als gevolg van een verhindering de arbeid te verrichten wegens ziekte, tenzij
      de betrokkene ter zake van de verhindering inmiddels een uitkering op grond van de verplichte verzekering ingevolge
      de [Wet op de arbeidsongeschiktheidsverzekering][ref20] geniet.

      5 Voor de toepassing van het bepaalde bij het eerste lid, onder a, en bij of krachtens het tweede lid wordt het
      loon, verdiend in een arbeidsverhouding als bedoeld in [artikel 6, eerste lid, onderdeel a, van de Ziektewet][ref21]
      dan wel artikel 8b van die wet geacht te zijn verdiend in een dienstbetrekking in de zin van die wet.

      6 Voor de toepassing van het bepaalde bij het eerste lid, onder a, sub 2e, wordt, wanneer uitkering wordt ontvangen
      op grond van:

      a. [artikel 46 van de Ziektewet][ref22], als dag voorafgaande aan die, waarop [artikel 8 van die wet][ref23]
      van toepassing werd, aangemerkt de dag, waarop de verzekering eindigde ter zake waarvan [artikel 46][ref24] is
      toegepast;

      b. [artikel 3:10 van de Wet arbeid en zorg][ref25], als dag voorafgaande aan die, waarop
      [artikel 8c van de Ziektewet][ref26] van toepassing werd, aangemerkt de dag waarop de verzekering op grond van
      de [artikelen 3 tot en met 8 van de Ziektewet][ref27] eindigde laatstelijk voorafgaande aan de toepassing van
      [artikel 3:10 van de Wet arbeid en zorg][ref28].

      7 Het eerste lid, onder c, is slechts van toepassing indien betrokkene in het tijdvak van vijf jaar, onmiddellijk
      voorafgaande aan de maand waarin hij de leeftijd van 65 jaar bereikt, tenminste drie jaar verzekerde is geweest.
      Bij ministeriële regeling kan worden bepaald dat voor daarbij aan te wijzen categorieën van personen als bedoeld in
      het eerste lid, onder c, niet van toepassing is de in de eerste volzin genoemde voorwaarde of de voorwaarde dat zij
      op de laatste dag van de maand, voorafgaande aan de maand waarin zij de leeftijd van 65 jaar bereiken, verzekerde
      waren.

      8 De voorwaarde dat de persoon, bedoeld in het eerste lid, onder b of c, naar de omstandigheden beoordeeld hier te
      lande woonachtig is, is niet van toepassing op degene die naar de omstandigheden beoordeeld woonachtig is op het
      grondgebied van een andere lid-staat van de Europese Gemeenschappen, dan wel een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of een staat waarmee Nederland een verdrag inzake sociale
      zekerheid heeft gesloten, indien betrokkene met toepassing van de desbetreffende verordening van de Raad van de
      Europese Gemeenschappen onderscheidenlijk met toepassing van het desbetreffende verdrag recht op verstrekkingen kan
      doen gelden, welke in beginsel worden verleend ten laste van de middelen van de ziekenfondsverzekering.

      9 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van personen, bedoeld in het eerste lid, van
      de verzekering worden uitgezonderd.

      10 Bij de algemene maatregel van bestuur bedoeld in het eerste lid, onder d, kunnen in afwijking van
      [artikel 2][ref29] vreemdelingen als verzekerden worden aangewezen, voor zover het betreft:

      a. vreemdelingen die rechtmatig in Nederland arbeid verrichten dan wel hebben verricht;

      b. vreemdelingen die, na in Nederland rechtmatig verblijf te hebben genoten als bedoeld in
      [artikel 8, onder a tot en met e en l , van de Vreemdelingenwet 2000][ref30], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref31];

      c. hier te lande verblijvende vreemdelingen anders dan bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref32], ter uitvoering van een verdrag dan wel
      een besluit van een volkenrechtelijke organisatie.

      11 Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties,
      categorieën van personen, behorende tot de in het eerste lid, onderdeel a, bedoelde personen aanwijzen, die, indien
      zij de wens daartoe te kennen geven, niet verzekerd zijn ingevolge deze wet. Onze Minister kan regels stellen met
      betrekking tot de eerste volzin.

      12 Het eerste lid van dit artikel is niet van toepassing op degene die uitsluitend vanwege de hoogte van
      zijn inkomen niet verzekerd is ingevolge [artikel 3d][ref33]. Op degene die in de loop van een kalenderjaar
      voor het eerst verzekerd is geworden ingevolge [artikel 3, eerste lid, aanhef en onder a][ref34], van de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen is de eerste volzin van toepassing met ingang van 1 januari van het
      daarop volgende kalenderjaar.

      13 Voor de toepassing van het eerste lid, onder a, sub 1e, worden perioden waarin recht op uitkering op grond van
      de [Werkloosheidswet][ref35] bestaat samengeteld indien het recht op uitkering na gehele eindiging van dat recht
      herleeft op grond van [artikel 21 van die wet][ref36]. Voor de toepassing van de eerste volzin worden met perioden
      waarin recht op uitkering op grond van de [Werkloosheidswet][ref37] bestaat gelijkgesteld, perioden waarin geen
      recht bestaat op die uitkering op grond van het feit dat betrokkene een uitkering krachtens de [Ziektewet][ref38]
      ontvangt.


