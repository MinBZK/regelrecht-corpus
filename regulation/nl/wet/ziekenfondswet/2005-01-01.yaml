  - number: 38a
    text: |-
      De leden of oud-leden van een ziekenfonds dat een onderlinge waarborgmaatschappij is, zijn niet verplicht om in een
      tekort bij te dragen. Het ziekenfonds moet aan het slot van zijn naam de letters U.A. plaatsen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel38a
  - number: 38b
    text: |-
      1 De toestemming van het College zorgverzekeringen is vereist voor de overdracht van verbintenissen van een
      ziekenfonds aan een ander ziekenfonds.

      2 Aan deze toestemming kunnen voorwaarden worden verbonden.

      3 Bij de samenvoeging van ziekenfondsen tot een nieuw ziekenfonds gaan alle rechten, welke derden hebben jegens elk
      der ziekenfondsen welke ophouden te bestaan, over op het nieuwe ziekenfonds.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel38b
  - number: 38c
    text: |-
      Een ziekenfonds is verplicht zijn werkzaamheden op een doelmatige wijze uit te voeren. Het treft de nodige
      maatregelen ter voorkoming van onnodige verstrekkingen en van uitgaven, welke hoger dan noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel38c
  - number: '40'
    text: |-
      1 In de administratie van de ziekenfondsen ter zake van de uitvoering van
      deze wet wordt het sociaal-fiscaalnummer van de verzekerde, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1], opgenomen, tenzij aan de
      verzekerde geen sociaal-fiscaalnummer is toegekend of bekendgemaakt.

      2 Bij de verstrekking van gegevens door de ziekenfondsen en de in [de artikelen 73b][ref2] en [73c][ref3] genoemde
      organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel73b
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel73c
