  - number: '19'
    text: |-
      1 Het College zorgverzekeringen verstrekt aan de ziekenfondsen ten laste van de Algemene Kas jaarlijks een
      uitkering ter gehele of gedeeltelijke dekking van de kosten van de verzekering ingevolge deze wet.

      2 Bij ministeriële regeling wordt jaarlijks geregeld welke middelen beschikbaar zijn voor de uitkeringen aan
      ziekenfondsen voor het volgende kalenderjaar. In die regeling worden tevens regels gesteld met betrekking tot de
      vaststelling van de uitkeringen, alsmede met betrekking tot de nadere vaststelling van de uitkeringen, bedoeld in
      het vijfde lid.

      3 Het College zorgverzekeringen stelt beleidsregels vast, waarin wordt aangegeven op welke wijze het toepassing
      geeft aan de in het tweede lid bedoelde regels. De beleidsregels behoeven de goedkeuring van Onze Minister.

      4 Het College zorgverzekeringen stelt de uitkering van elk ziekenfonds vast vóór de aanvang van het kalenderjaar
      waarop de uitkering betrekking heeft. De betaling van de uitkering geschiedt overeenkomstig door het College
      zorgverzekeringen te stellen beleidsregels.

      5 Het College zorgverzekeringen stelt na afloop van het kalenderjaar waarop de uitkering betrekking heeft, de
      uitkering nader vast. Naar het oordeel van het College toezicht onverantwoorde besparingen op de beheerskosten
      worden in mindering gebracht op de uitkering. Het verschil tussen het bedrag van de vooraf vastgestelde uitkering
      en de nader vastgestelde uitkering wordt verrekend. Voor de rente die het College zorgverzekeringen dan wel het
      ziekenfonds over het verschil heeft gederfd, wordt overeenkomstig door het College zorgverzekeringen te stellen
      beleidsregels aan het ziekenfonds een vergoeding in rekening gebracht onderscheidenlijk aan het ziekenfonds een
      vergoeding toegekend.

      6 Ook na aanvang van het kalenderjaar kan bij ministeriële regeling worden geregeld dat middelen beschikbaar zijn
      voor het doen van uitkeringen. In dat geval zijn de tweede volzin van het tweede lid en het derde, vierde en vijfde
      lid van overeenkomstige toepassing.

      7 Bij ministeriële regeling kunnen ter zake van de verstrekking van uitkeringen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel19
  - number: '20'
    text: |-
      Indien een verzekerde schuldig nalatig blijft de door hem verschuldigde premie volledig te voldoen, kan het
      ziekenfonds waarbij hij overeenkomstig de bepalingen van dit hoofdstuk is ingeschreven, de kosten van aan hem of
      aan zijn medeverzekerden verleende verstrekkingen, geheel of gedeeltelijk op die verzekerde verhalen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel20
  - number: '21'
    text: |-
      1 Een ziekenfonds besteedt de middelen waarover het ten behoeve van de verzekering ingevolge deze wet de
      beschikking heeft gekregen, ter dekking van zijn ten behoeve van de uitvoering van de verzekering ingevolge deze
      wet noodzakelijke uitgaven.

      2 De beheerskosten van een ziekenfonds worden aangemerkt als kosten voor de uitvoering van de verzekering ingevolge
      deze wet, voor zover zij niet worden gedekt door vergoedingen voor beheerskosten die het ziekenfonds ontvangt
      anders dan voor de uitvoering van de verzekering ingevolge deze wet. Indien het ziekenfonds is aangewezen als een
      rechtspersoon, bedoeld in [artikel 16, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], worden de
      beheerskosten die het in of in verband met die hoedanigheid maakt en de vergoeding die het daarvoor ontvangt voor
      de toepassing van de eerste volzin buiten beschouwing gelaten.

      3 Het College toezicht is bevoegd vast te stellen dat uitgaven van een ziekenfonds niet verantwoord waren voor
      zover deze door hem niet noodzakelijk worden geacht voor de uitvoering van de verzekering ingevolge deze wet.

      4 Het College zorgverzekeringen kan voor de toepassing van het tweede lid nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '16'
  - number: '34'
    text: |-
      1 Een rechtspersoon welke als ziekenfonds werkzaam is, moet daartoe zijn toegelaten door het College
      zorgverzekeringen.

      2 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 Toelating als ziekenfonds wordt verleend indien de aanvrager een stichting of onderlinge waarborgmaatschappij is:

      a. die ingevolge haar statuten ten doel heeft in een daarin aangegeven werkgebied het
      ziektekostenverzekeringsbedrijf uitsluitend uit te oefenen ter uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref2],

      b. die direct noch indirect beoogt winst te maken,

      c. die in haar statuten waarborgen biedt voor een redelijke mate van invloed van de verzekerden op het bestuur,

      d. waarvan de dagelijkse leiding wordt gevormd door ten minste twee personen,

      e. waarvan het beleid wordt bepaald door personen waarvan de deskundigheid naar het oordeel van het College
      zorgverzekeringen voldoende is in verband met de uitoefening van de taken van een ziekenfonds en de handelingen en
      antecedenten van de personen die het beleid van het ziekenfonds bepalen of mede bepalen, geen aanleiding geven tot
      het oordeel dat de belangen van de verzekerden bij uitoefening van de taken van een ziekenfonds ingevolge deze wet,
      in gevaar zouden kunnen komen,

      f. waarvan de onafhankelijke besluitvorming gewaarborgd is,

      g. die voldoet aan de overige bij of krachtens deze wet aan ziekenfondsen gestelde eisen, en

      h. waarvan ook overigens is te verwachten dat zij de taak van een ziekenfonds naar behoren zal uitoefenen.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de mate van invloed die verzekerden ten
      minste op het bestuur van een ziekenfonds dienen te hebben.

      5 Behoort de aanvrager tot een groep dan is het derde lid, onderdeel e, van overeenkomstige toepassing op de
      personen die het beleid bepalen van de groep waartoe de aanvrager behoort, voor zover uit dien hoofde hun beleid
      van belang is voor de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel34
