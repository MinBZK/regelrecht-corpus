  - number: 1b
    text: |-
      1 Het College zorgverzekeringen bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.

      2 Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op grond
      van de deskundigheid die nodig is voor de uitoefening van de taken van het College zorgverzekeringen alsmede op
      grond van maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling
      gedaan in de Staatscourant.

      3 Het lidmaatschap van het College zorgverzekeringen is onverenigbaar met het lidmaatschap van het College
      toezicht. Bij ministeriële regeling kunnen andere functies of werkzaamheden worden aangewezen, die niet verenigbaar
      zijn met het lidmaatschap van het College zorgverzekeringen.

      4 Bij de samenstelling van het College zorgverzekeringen wordt gestreefd naar evenredige deelneming van vrouwen en
      personen behorende tot etnische of culturele minderheidsgroepen.

      5 De leden worden benoemd voor ten hoogste vier jaar.

      Herbenoeming kan twee maal en telkens voor ten hoogste vier jaar plaatsvinden.

      6 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Minister.

      7 Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College zorgverzekeringen en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1b
  - number: 1c
    text: |-
      1 Het College zorgverzekeringen stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld
      omtrent de wijze waarop besluiten worden voorbereid, genomen en uitgevoerd, alsmede omtrent de wijze waarop
      afspraken over samenwerking met het College toezicht tot stand komen ten aanzien van aangelegenheden die het
      College zorgverzekeringen en het College toezicht beide aangaan.

      2 In het bestuursreglement kan het College zorgverzekeringen voorzien in de instelling van commissies. In
      commissies kunnen personen deelnemen die geen lid van het College zorgverzekeringen zijn. In het reglement worden
      regels gesteld over de samenstelling en taken van de ingestelde commissies.

      3 Vergaderingen van het College zorgverzekeringen en van commissies zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.

      4 Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1c
  - number: 1d
    text: |-
      1 Het College zorgverzekeringen benoemt, schorst en ontslaat het personeel.

      2 Het College zorgverzekeringen stelt met betrekking tot de arbeidsvoorwaarden van het personeel regels vast.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1d
  - number: 1e
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende
      kalenderjaar. Het werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1e
  - number: 1f
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten
      voor het volgende kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1f
  - number: 1g
    text: |-
      Het College zorgverzekeringen zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het
      gevoerde beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in
      het bijzonder, alsmede gegevens omtrent de uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze
      Minister zendt het verslag aan beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het verslag
      algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1g
  - number: 1h
    text: |-
      1 Het College zorgverzekeringen brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over
      zijn beheerskosten over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de
      getrouwheid en rechtmatigheid van de ontvangsten en uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.

      2 Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College zorgverzekeringen stelt het financieel verslag algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1i
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1i
  - number: 1j
    text: |-
      De beheerskosten van het College zorgverzekeringen worden volgens bij ministeriële regeling te stellen regels tot
      ten hoogste de in de begroting aangegeven bedragen gedekt uit de Algemene Kas en het Algemeen Fonds Bijzondere
      Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1j
  - number: 1k
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1k
  - number: 1l
    text: |-
      1 Een besluit van het College zorgverzekeringen kan bij koninklijk besluit worden vernietigd.

      2 Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1l
  - number: 1l1
    text: |-
      1 Het College zorgverzekeringen bevordert de rechtmatige en doelmatige uitvoering van deze wet en de
      [Algemene Wet Bijzondere Ziektekosten][ref1] door de uitvoeringsorganen en door de rechtspersonen, bedoeld in
      [artikel 14][ref2] van deze wet en [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref3].

      2 Het College zorgverzekeringen kan met het oog op de rechtmatige en doelmatige uitvoering beleidsregels
      stellen voor de uitvoeringsorganen en de rechtspersonen, bedoeld in [artikel 14][ref4] van deze wet en
      [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref5].


