  - number: '17'
    text: |-
      1 Onverminderd hetgeen bij of krachtens de artikelen [15][ref1], [15a][ref2] of [15b][ref3] omtrent de
      daar bedoelde procentuele premie is bepaald, wordt voor de verzekering van de verzekerde, bedoeld in
      [artikel 3, eerste lid, onder a][ref4], [artikel 3d][ref5] of [artikel 3e][ref6], van 18 jaar of ouder, en zijn
      medeverzekerde, bedoeld in [artikel 4, eerste lid][ref7], een nominale premie geheven, waarvan de hoogte volgens
      bij of krachtens algemene maatregel van bestuur te stellen regelen wordt bepaald door het ziekenfonds waarbij de
      verzekerde is ingeschreven.

      2 De nominale premie is verschuldigd door de verzekerde voor zich en zijn medeverzekerde, in maandelijkse termijnen
      bij vooruitbetaling te voldoen. In geval vooruitbetaling plaatsvindt over een langere termijn kan het ziekenfonds,
      rekening houdende met rente en incasso-kosten, op de verschuldigde nominale premie een korting verlenen.

      3 De nominale premie is verschuldigd vanaf het tijdstip van aanvang van de verzekering. Indien de aanmelding
      bij het ziekenfonds, bedoeld in [artikel 5, eerste lid][ref8], plaatsvindt later dan zestig dagen na de aanvang
      van de verzekering is de premie slechts verschuldigd vanaf de zestigste dag voor die van de aanmelding, met dien
      verstande dat in dat geval het ziekenfonds de premie over die zestig dagen kan verhogen. De verhoging bedraagt ten
      hoogste de op het tijdstip van aanmelding geldende nominale premie op jaarbasis. De tweede en derde volzin zijn van
      overeenkomstige toepassing indien de inschrijving van de verzekerde bij het ziekenfonds volgens de krachtens deze
      wet gestelde regels is beëindigd en de verzekerde, zonder dat zijn verzekering ingevolge deze wet is geëindigd,
      zich later dan zestig dagen na beëindiging van die inschrijving opnieuw bij een ziekenfonds aanmeldt.

      4 De verzekerde betaalt de nominale premie aan het ziekenfonds, bedoeld in het eerste lid, dat de verschuldigde
      premie vaststelt en invordert. Bij de vaststelling van de nominale premie kan het ziekenfonds uitgaan van
      peildata, gelegen op de eerste dag van iedere kalendermaand. Indien de verzekerde nalatig blijft de verschuldigde
      nominale premie volgens de gestelde regelen te betalen kan het ziekenfonds het verschuldigde bedrag verhogen met
      administratie- en invorderingskosten. Het ziekenfonds kan voor de betaling, de vaststelling en de invordering van
      de nominale premie met inachtneming van het bepaalde bij en krachtens deze wet bij reglement nader regelen stellen.

      5 Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, een bedrag bepalen
      hetwelk ten hoogste als nominale premie in rekening mag worden gebracht. Onze Minister kan omtrent het in de eerste
      volzin bedoelde besluit de Pensioen- & Verzekeringskamer horen.

      6 De door het ziekenfonds geheven nominale premie wordt aangewend ter dekking van de aan de uitvoering van deze wet
      voor dat ziekenfonds verbonden kosten.

      7 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot al hetgeen de in dit artikel bedoelde
      nominale premie betreft, verschuldigd voor de verzekering van de bij of krachtens die algemene maatregel van
      bestuur aangewezen groepen van personen, andere regelen worden gesteld.


