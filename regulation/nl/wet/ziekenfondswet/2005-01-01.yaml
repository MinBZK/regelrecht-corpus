  - number: 5a
    text: |-
      1 De verzekerde is verplicht desgevraagd aan het ziekenfonds waarbij hij zich aanmeldt onderscheidenlijk waarbij
      hij is ingeschreven, een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] terstond
      ter inzage te verstrekken, voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de medeverzekerde die door de verzekerde bij het
      ziekenfonds wordt aangemeld, onderscheidenlijk waarbij de medeverzekerde is ingeschreven.

      3 Het ziekenfonds stelt voor zover dit redelijkerwijs nodig is voor de uitvoering van deze wet de identiteit
      vast van de personen bedoeld in het eerste en tweede lid aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] en neemt daarvan aard en nummer op in de administratie.

      4 Het ziekenfonds verlangt van de vreemdeling die zich als verzekerde of medeverzekerde aanmeldt een kopie van het
      document of de schriftelijke verklaring bedoeld in [artikel 9, tweede lid, van de Vreemdelingenwet 2000][ref3], dat
      wordt aangemerkt als een bescheid als bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel43
