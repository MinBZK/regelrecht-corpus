  - number: 15a
    text: |-
      1 Onverminderd hetgeen bij of krachtens [artikel 17][ref1] omtrent de daarbedoelde nominale premie is bepaald,
      is de verzekerde, bedoeld in [artikel 3d, eerste lid][ref2], een premie verschuldigd tot een door Onze Minister
      en Onze Minister van Sociale Zaken en Werkgelegenheid tezamen te bepalen percentage over het inkomen, bedoeld in
      [artikel 3d, vierde, zevende en achtste lid][ref3].

      2 Het inkomen wordt voor de premieheffing ten hoogste in aanmerking genomen tot het bedrag, genoemd in
      [artikel 3d, eerste lid][ref4], zoals dat geldt voor het kalenderjaar waarop de verzekering betrekking heeft.

      3 De verschuldigde procentuele premie wordt geheven en ingevorderd door de rijksbelastingdienst overeenkomstig de
      voor de heffing en de invordering van de inkomstenbelasting geldende regels, met dien verstande dat de [artikelen
      3 154](onbekend) en [9.4 van de Wet inkomstenbelasting 2001][ref5] buiten toepassing blijven.

      4 Voor de toepassing van het eerste lid wordt ten aanzien van degene die bij of krachtens
      [artikel 3d, eerste lid][ref6], verzekerd is en die tevens ingevolge [artikel 3][ref7] verzekerd is, de reeds uit
      hoofde van [artikel 15, eerste lid][ref8], en bij of krachtens [artikel 18][ref9] betaalde procentuele premie in
      mindering gebracht tot maximaal de ingevolge het eerste lid verschuldigde premie.

      5 De aanslag ziekenfondspremie en de aanslag inkomstenbelasting kunnen op een aanslagbiljet worden verenigd. In dat
      geval worden de bedragen van de aanslagen afzonderlijk vermeld.

      6 Met betrekking tot het eerste tot en met vijfde lid kunnen bij ministeriële regeling door Onze Minister in
      overeenstemming met Onze Minister van Financiën nadere en zonodig afwijkende regels worden gesteld.

      7 Indien een herziening van het in het eerste lid bedoelde premiepercentage ingaat op een ander tijdstip
      dan met ingang van 1 januari, stelt Onze Minister, in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, een gemiddeld premiepercentage vast dat zal gelden voor het gehele kalenderjaar.


