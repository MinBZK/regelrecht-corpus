  - number: 44a
    text: |-
      1 Het College zorgverzekeringen stelt ten behoeve van te sluiten overeenkomsten als bedoeld in
      [artikel 44, eerste lid][ref1], voor categorieën van personen of instellingen een modelovereenkomst vast.

      2 Alvorens een modelovereenkomst vast te stellen, hoort het College zorgverzekeringen de daarbij betrokken
      organisaties van ziekenfondsen en van personen en instellingen.

      3 Het eerste lid is niet van toepassing indien het overleg tussen de organisaties, bedoeld in
      [artikel 46, eerste lid][ref2], binnen de termijn van zes maanden, bedoeld in [artikel 44, achtste lid][ref3],
      heeft geleid tot de in [artikel 46, tweede lid][ref4], bedoelde overeenstemming en de uitkomst daarvan voldoet aan
      [artikel 45, eerste lid][ref5], en deze uitkomst de goedkeuring van het College zorgverzekeringen heeft verkregen.


