  - number: '46'
    text: |-
      1 Onverminderd [artikel 44, derde lid][ref1], wordt omtrent de inhoud van de in het eerste lid van dat artikel
      bedoelde overeenkomsten overleg gepleegd tussen de betrokken organisaties van ziekenfondsen en van personen en
      instellingen.

      2 Indien het in het eerste lid bedoelde overleg tot overeenstemming heeft geleid, wordt de uitkomst daarvan, voor
      zover deze geen betrekking heeft op het tarief, bedoeld in de [Wet tarieven gezondheidszorg][ref2] (*Stb.* 1980,
      646), onderworpen aan de goedkeuring van het College zorgverzekeringen.

      3 Een overeenkomst als bedoeld in [artikel 44, eerste lid][ref3], eindigt op hetzelfde tijdstip als de in het
      tweede lid bedoelde uitkomst eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003356
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel44
