    text: |-
      1 Het College zorgverzekeringen is tegenover personen of instellingen, die terzake van aan verzekerden verleende
      verstrekkingen op grond van deze wet vorderingen hebben op een ziekenfonds, aansprakelijk voor de betaling daarvan,
      wanneer dat ziekenfonds verkeert in de toestand, dat het heeft opgehouden te betalen.

      2 Het Rijk is tegenover het College zorgverzekeringen aansprakelijk voor de betalingen, bedoeld in het eerste lid.
