  - number: 3c
    text: |-
      1 Verzekerde is voorts degene van 65 jaar of ouder, die zich daartoe heeft aangemeld bij een ziekenfonds indien hij
      naar de omstandigheden beoordeeld hier te lande woonachtig is, en het inkomen van hem en zijn eventuele echtgenote
      niet hoger is dan f 39 550 . Bij de aanmelding bij een ziekenfonds overlegt de verzekerde een verklaring van de
      Sociale verzekeringsbank waaruit blijkt dat het inkomen van hem en zijn eventuele echtgenote niet hoger is dan het
      bedrag genoemd in de eerste volzin.

      2 De verzekering ingevolge het eerste lid gaat in op de eerste dag van de maand volgend op de dag van aanmelding.

      3 Voor de toepassing van het eerste lid wordt onder inkomen verstaan het gecorrigeerde verzamelinkomen,
      onderscheidenlijk het gecorrigeerde belastbare loon. Bij ministeriële regeling wordt vastgesteld welk tijdvak
      voor de bepaling van het inkomen in aanmerking wordt genomen en worden regels gesteld ter uitvoering van de tweede
      volzin van het eerste lid.

      4 [Artikel 3a][ref1] is van overeenkomstige toepassing op het bedrag, genoemd in het eerste lid.

      5 Het eerste lid geldt niet voor degene die op de laatste dag van de maand voorafgaande aan de maand waarin hij
      de leeftijd van 65 jaar heeft bereikt, deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren als
      bedoeld in [artikel 4, zestiende lid, onder b][ref2], of als gezinslid in de zin van die regeling werd aangemerkt.

      6 Het gecorrigeerde verzamelinkomen is het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref3], verminderd met:

      a. indien in het tijdvak de zelfstandigenaftrek, bedoeld in [artikel 3.76 van de Wet inkomstenbelasting 2001][ref4],
      is toegepast: € 1 355;

      b. indien in het tijdvak loon wordt genoten: het hoogste van de uit de toepassing van de volgende onderdelen
      voortvloeiende bedragen:

      1°. bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan €
      1 605;

      2°. bij loon uit vroegere dienstbetrekking: € 487;

      c. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen kosten van woon-werkverkeer
      (reiskostenforfait), maar niet meer dan € 939;

      d. indien in het kalenderjaar 2000 loon uit dienstbetrekking wordt genoten: het bedrag van de in dat jaar in
      aanmerking genomen aftrekbare kosten terzake van inkomsten uit arbeid andere dan kosten van woon-werkverkeer, na
      toepassing van artikel 37, tweede lid, van de Wet op de inkomstenbelasting 1964, verminderd met 12% van het loon
      uit tegenwoordige dienstbetrekking in dat jaar, maar met niet minder dan € 119 en met niet meer dan € 1 605;

      e. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen renten van schulden, kosten van geldleningen
      daaronder begrepen, bedoeld in artikel 45, eerste lid, onderdeel f, van de Wet op de inkomstenbelasting 1964;

      f. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen premies voor lijfrenten, maar niet meer dan
      € 2 804, verminderd met € 1 036, maar niet verder dan tot nihil; indien bij de echtgenoot van degene van wie het
      gecorrigeerd verzamelinkomen wordt berekend geen premies voor lijfrenten in aanmerking genomen zijn, worden de
      bedragen van € 2 804 en € 1 036 verhoogd tot € 5 608 respectievelijk € 2 072;

      g. het bedrag van de in het kalenderjaar 2000 in aanmerking genomen uitgaven tot voorziening in het levensonderhoud
      van kinderen en pleegkinderen van 27 jaar en ouder, alsmede andere bloed- en aanverwanten in de rechte lijn of
      in de tweede graad van de zijlijn, bedoeld in artikel 46, eerste lid, onderdeel a, onder 2°, van de Wet op de
      inkomstenbelasting 1964.

      7 In het zesde lid wordt onder loon verstaan loon in de zin van de [Wet inkomstenbelasting 2001][ref5].

      8 Het gecorrigeerde belastbare loon is het belastbare loon, bedoeld in artikel 9 van de Wet op de loonbelasting
      1964, verminderd met:

      a. het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:

      1°. bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan €
      1 605;

      2°. bij loon uit vroegere dienstbetrekking: € 487;

      b. de bedragen, bedoeld in het zesde lid, onderdelen c tot en met g.

      9 Voor de toepassing van het eerste lid wordt het inkomen voorts verminderd met € 315.

      10 De in het zesde lid, onderdelen c tot en met g, en achtste lid, onderdeel b, bedoelde correctieposten, worden
      over het tijdvak 2001 voor het geheel in aanmerking genomen, over het tijdvak 2002 voor 2/3 deel en over het
      tijdvak 2003 voor 1/3 deel.

      11 Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:

      a. loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref6], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8];

      b. loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.

      12 Onverminderd het bepaalde in het negende lid wordt over het tijdvak 2004 en volgende
      tijdvakken, in afwijking van het derde lid, onder inkomen verstaan het verzamelinkomen, bedoeld in
      [artikel 2.18 van de Wet inkomstenbelasting 2001][ref9], verminderd met € 487.

      13 De inspecteur, onder wie de verzekerde of zijn eventuele echtgenoot krachtens [artikel 3, tweede lid, van de
      Algemene wet inzake rijksbelastingen](onbekend) ressorteert voor de heffing van de inkomstenbelasting, bepaalt
      op verzoek van de Sociale Verzekeringsbank het inkomen, bedoeld in het derde lid, over de tijdvakken 2001, 2002
      of 2003 van de desbetreffende verzekerde of zijn eventuele echtgenoot.

      14 De in het dertiende lid bedoelde inspecteur verstrekt de gegevens inzake het inkomen bedoeld in het derde lid
      over de tijdvakken 2001, 2002 of 2003 aan de Sociale verzekeringsbank. Bij of krachtens algemene maatregel van
      bestuur kunnen hiervoor nadere regels worden gesteld.

      15 Indien het inkomen moet worden bepaald over een aan het kalenderjaar 2001 voorafgaand tijdvak, wordt in
      afwijking van het derde lid uitgegaan van alle inkomsten waarover ingevolge de artikelen 3 en 48 van de Wet op de
      inkomstenbelasting 1964 inkomstenbelasting verschuldigd is.


