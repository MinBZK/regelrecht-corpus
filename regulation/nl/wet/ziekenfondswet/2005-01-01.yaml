  - number: 15c
    text: |-
      1 De ontvanger van de rijksbelastingdienst stort de ingevolge [artikel 15a][ref1] ontvangen bedragen in de Algemene
      Kas.

      2 Bij of krachtens algemene maatregel van bestuur kan Onze Minister in overeenstemming met Onze Minister van
      Financiën regels stellen betreffende de afdracht en de verantwoording van de ontvangen bedragen.


