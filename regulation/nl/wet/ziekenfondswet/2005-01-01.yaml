        artikel: '393'
  - number: '44'
    text: |-
      1 Ziekenfondsen sluiten overeenkomsten met personen en instellingen die een of meer van de verstrekkingen kunnen
      verlenen waarop ingevolge [artikel 8][ref1] aanspraak bestaat.

      2 Een overeenkomst als bedoeld in het eerste lid dient schriftelijk te worden gesloten.

      3 Behoudens toepassing van het vijfde lid dient een overeenkomst als bedoeld in het eerste lid in ieder geval in
      te houden de bepalingen als bedoeld in [artikel 45, eerste onderscheidenlijk tweede lid][ref2] , alsmede bepalingen
      omtrent de kwaliteit en de doelmatigheid van de hulpverlening.

      4 Behoudens toepassing van het vijfde lid, dient een overeenkomst als bedoeld in het eerste lid overeen te stemmen
      met een op grond van [artikel 46, tweede lid][ref3], goedgekeurde uitkomst of met een voor de betrokken categorie
      van personen of instellingen op grond van [artikel 44][ref4], tot stand gekomen modelovereenkomst.

      5 Het College zorgverzekeringen kan aan een ziekenfonds toestemming verlenen een overeenkomst als bedoeld in het
      eerste lid te sluiten, welke afwijkt van het derde en vierde lid.

      6 Aan de in het eerste lid bedoelde overeenkomsten welke zijn gesloten in strijd met de voorgaande leden, dan
      wel aan de bepalingen van een overeenkomst als bedoeld in het eerste lid, welke afwijken van de voorgaande leden,
      kunnen geen rechten worden ontleend.

      7 Een overeenkomst als bedoeld in het eerste lid, die wordt gesloten met een persoon, wordt aangegaan voor bepaalde
      tijd.

      8 De geldingsduur van een overeenkomst als bedoeld in het eerste lid wordt, indien voor de beëindiging van de
      overeenkomst geen nieuwe overeenkomst tot stand komt, verlengd met een periode van zes maanden of tot het moment
      waarop gedurende die periode een nieuwe overeenkomst als bedoeld in het eerste lid in werking treedt.

      9 Gedurende de in het zevende en achtste lid bedoelde periode kan een overeenkomst niet door
      opzegging worden beëindigd, behoudens op grond van bijzondere omstandigheden, bedoeld in
      [artikel 45, eerste lid, aanhef en onder ][ref5], en behoudens in die gevallen waarin niet voldaan wordt aan de in
      het derde lid bedoelde bepalingen omtrent de kwaliteit en de doelmatigheid van de hulpverlening.

      10 Overeenkomsten, gesloten tussen een rechtspersoon als bedoeld in [artikel 14][ref6] en een instelling als
      bedoeld in [artikel 8][ref7], welke hiertoe is aangewezen door het College zorgverzekeringen, worden voor de
      toepassing van deze wet gelijkgesteld met overeenkomsten als bedoeld in het eerste lid.


