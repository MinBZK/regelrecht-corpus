      1 Er is een Algemene Kas, waarin gestort worden de gelden, bedoeld in [artikel 14a, eerste lid, onder a][ref1],
      met uitzondering van de nominale premies, bedoeld in [de artikelen 17][ref2] en [18, tweede lid][ref3], alsmede de
      gelden, bedoeld in [artikel 14a, eerste lid, onder b, en tweede lid][ref4].

      2 Het College zorgverzekeringen is belast met het beheer van de Algemene Kas.

      3 De middelen van de Algemene Kas worden aangewend:

      a. ten behoeve van gehele of gedeeltelijke dekking van de kosten van de ziekenfondsverzekering;

      b. ten behoeve van uitgaven voor de ziekenfondsverzekering, voortvloeiende uit enige andere wettelijke regeling of
      uit overeenkomsten;

      c. ten behoeve van het verstrekken van subsidies als bedoeld in [artikel 1p][ref5];

      d. ten behoeve van het vormen van een reserve, overeenkomstig bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel14a
