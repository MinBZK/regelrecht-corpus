  - number: 3b
    text: |-
      1 [Artikel 3, eerste lid, onder b][ref1], is niet van toepassing op:

      a. degene die recht heeft op een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], indien hij deelneemt dan wel op de dag, voorafgaande
      aan de dag waarop zijn recht op die uitkering ingaat, deelnam aan een publiekrechtelijke ziektekostenregeling voor
      ambtenaren, als bedoeld in [artikel 4, zestiende lid, onder b][ref3];

      b. degene die een uitkering ingevolge de [Algemene nabestaandenwet][ref4] ontvangt, wegens het overlijden van een
      persoon die op de dag van zijn overlijden deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren,
      als bedoeld in [artikel 4, zestiende lid, onder b][ref5], indien die uitkering met ingang van de eerste dag van de
      maand van dat overlijden wordt ontvangen;

      c. degene die een uitkering ingevolge de [Algemene nabestaandenwet][ref6] ontvangt, indien hij deelneemt
      dan wel op de dag, voorafgaande aan de eerste dag van de maand met ingang waarvan de uitkering wordt
      ontvangen, deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren, als bedoeld in
      [artikel 4, zestiende lid, onder b][ref7].

      2 Bij ministeriële regeling kunnen door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, andere categorieën van personen worden aangewezen, op wie [artikel 3, eerste lid, onder b][ref8],
      niet van toepassing is.

      3 Bij ministeriële regeling kunnen door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, categorieën van personen worden aangewezen op wie, indien zij de wens daartoe te kennen geven,
      [artikel 3, eerste lid, onder b][ref9], niet van toepassing is. Bij die regeling wordt voorzien in hetgeen verder
      terzake regeling behoeft.


