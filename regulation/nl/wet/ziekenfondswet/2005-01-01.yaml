  - number: 3e
    text: |-
      1 Verzekerd is degene jonger dan 65 jaar die naar de omstandigheden beoordeeld hier te lande woonachtig is en die:

      a. een periodieke uitkering of verstrekking op grond van een rechtstreeks uit het familierecht voortvloeiende
      verplichting ontvangt, tenzij deze uitkering of verstrekking wordt ontvangen van bloed- of aanverwanten in de
      rechte lijn of in de tweede graad van de zijlijn, en

      b. medeverzekerd is ingevolge artikel 4, eerste lid, op de dag voorafgaande aan de dag waarop hij niet langer
      behoort tot het huishouden van de in die bepaling bedoelde verzekerde.

      2 Het eerste lid is niet van toepassing op:

      a. degene die verzekerd is ingevolge het bepaalde bij of krachtens de artikelen 3 of 3d, dan wel die uitsluitend in
      verband met overschrijding van de voor de ziekenfondsverzekering geldende loon- of inkomensgrens niet verzekerd is;

      b. degene wiens inkomen bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], meer bedraagt dan het
      in artikel 3d, eerste lid, genoemde bedrag;

      c. degene die niet langer de in het eerste lid bedoelde periodieke uitkering of
      verstrekking ontvangt, tenzij de beëindiging van deze periodieke uitkering of verstrekking
      voortvloeit uit het ontvangen van een bij wijze van pensioenverevening ingevolge de
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________ (Stb. 1994, 342)
      ontvangen pensioen.

      3 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van dit artikel.


