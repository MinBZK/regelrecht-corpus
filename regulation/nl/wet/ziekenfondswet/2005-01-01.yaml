        bwb_id: BWBR0002460
        artikel: 1x9
        hoofdstuk: IB
  - number: 1x11
    text: |-
      1 Een uitvoeringsorgaan verstrekt op verzoek van het College zorgverzekeringen dan wel het College toezicht,
      overeenkomstig de daarbij door het desbetreffende college gestelde eisen en binnen de daarbij gestelde termijn,
      kosteloos alle gegevens en inlichtingen die het desbetreffende college nodig acht voor de uitoefening van zijn
      taak.

      2 Een uitvoeringsorgaan verleent op verzoek van het College zorgverzekeringen dan wel het College toezicht aan
      door het desbetreffende college aangewezen personen toegang tot en inzage in alle gegevens die het desbetreffende
      college nodig acht voor de uitoefening van zijn taak. De aangewezen persoon is bevoegd van de gegevens kopieën
      te maken.

      3 Het eerste en tweede lid zijn tevens van toepassing op een rechtspersoon waaraan een uitvoeringsorgaan een deel
      van zijn werkzaamheden heeft opgedragen of overgedragen, voor zover het die werkzaamheden betreft.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x11
  - number: 1x12
    text: |-
      1 Het College toezicht, onderscheidenlijk het College zorgverzekeringen kan na overleg met het College
      zorgverzekeringen, onderscheidenlijk het College toezicht regels stellen welke gegevens en inlichtingen
      regelmatig door de uitvoeringsorganen moeten worden verstrekt. De regels kunnen mede omvatten het tijdstip en
      de wijze waarop de gegevens en inlichtingen moeten worden verstrekt, alsmede dat een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de juistheid van de verstrekte gegevens en inlichtingen
      bevestigt.

      2 Bij ministeriële regeling kan worden bepaald welke statistische gegevens de uitvoeringsorganen verzamelen
      betreffende verstrekkingen dan wel vormen van zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1x13
    text: |-
      1 Een natuurlijke persoon of rechtspersoon voor wie een uitvoeringsorgaan werkzaamheden verricht of heeft
      verricht, verstrekt op verzoek van het College zorgverzekeringen dan wel het College toezicht, overeenkomstig de
      door het desbetreffende college gestelde eisen en binnen de daarbij gestelde termijn, kosteloos alle gegevens en
      inlichtingen voor zover dat voor de vervulling van de taak van het desbetreffende college strikt noodzakelijk is.

      2 Een natuurlijke persoon of rechtspersoon voor wie een uitvoeringsorgaan werkzaamheden verricht of heeft verricht,
      verleent op verzoek van het College zorgverzekeringen dan wel het College toezicht aan door het desbetreffende
      college aangewezen personen toegang tot en inzage in alle gegevens voor zover dat voor de vervulling van de taak
      van het desbetreffende college strikt noodzakelijk is. De aangewezen persoon is bevoegd van de gegevens kopieën
      te maken.
    url: https://wetten.overheid.nl/BWBR0002460/2005-01-01#Artikel1x13
  - number: 1x14
    text: |-
      1 Indien een uitvoeringsorgaan behoort tot een groep, verstrekt het aan het College zorgverzekeringen dan wel
      het College toezicht, voor zover dat voor de vervulling van de taak van het desbetreffende college redelijkerwijs
      noodzakelijk is, op verzoek overeenkomstig de door het desbetreffende college gestelde eisen en binnen de daarbij
      gestelde termijn, kosteloos alle gegevens en inlichtingen over:

      a. de zeggenschapsstructuur van de groep,

      b. de financiële structuur van de groep,

      c. de inrichting van de administratieve organisatie en interne controle van de groep,

      d. de activiteiten van de leden van de groep,

      e. de personen die het beleid van de groep, of van leden van de groep bepalen of medebepalen en wier beleid uit
      dien hoofde van belang is voor het uitvoeringsorgaan.

      2 Onder de overeenkomstig het eerste lid gestelde voorwaarden verleent het daar bedoelde uitvoeringsorgaan op
      verzoek van het desbetreffende college aan door dat college aangewezen personen toegang tot en inzage in alle in
      dat lid bedoelde gegevens. Het uitvoeringsorgaan biedt voorts gelegenheid tot het kopiëren van die gegevens.

      3 Gegevens en inlichtingen die ingevolge het bepaalde bij of krachtens deze wet zijn verstrekt of verkregen over de
      groep of de andere leden van de groep worden niet gepubliceerd en zijn geheim.

      4 Het is aan een ieder die uit hoofde van de toepassing van het eerste of tweede lid enige taak vervult,
      verboden van gegevens of inlichtingen, ingevolge het eerste of tweede lid verstrekt of verkregen, verder of
      anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van deze wet, de
      [Algemene Wet Bijzondere Ziektekosten][ref1] of de [Wet financiering volksverzekeringen][ref2] wordt vereist.

      5 Het derde en vierde lid laten, ten aanzien van degene op wie het derde lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref3] die betrekking hebben op het als
      getuige of deskundige in strafzaken afleggen van een verklaring over gegevens of inlichtingen verkregen bij de
      vervulling van zijn ingevolge deze wet opgedragen taak.

      6 Het derde en vierde lid laten evenzo, ten aanzien van degene op wie het vierde lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref4] en
      van [artikel 66 van de Faillissementswet ][ref5]die betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring over gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen over een lid van een groep als bedoeld in het eerste lid, die in staat van faillissement
      is verklaard of op grond van een rechterlijke uitspraak is ontbonden. Het in de voorgaande volzin bepaalde geldt
      niet voor gegevens of inlichtingen die betrekking hebben op leden van een groep, die betrokken zijn of zijn geweest
      bij een poging het desbetreffende lid van de groep in staat te stellen zijn bedrijf voort te zetten.

      7 Het College zorgverzekeringen en het College toezicht zijn, in afwijking van het derde en vierde lid, bevoegd
      met gebruikmaking van gegevens of inlichtingen verkregen bij de vervulling van de hen ingevolge deze wet opgedragen
      taak, mededelingen te doen mits deze niet kunnen worden herleid tot afzonderlijke leden van de groep niet zijnde
      uitvoeringsorganen.

      8 Het derde en vierde lid laten onverlet de bevoegdheden van de Algemene Rekenkamer ingevolge
      [artikel 59 van de Comptabiliteitswet][ref6]. De Rekenkamer is bij het doen van mededelingen als bedoeld in
      [artikel 59][ref7], elfde tot en met veertiende lid, van de Comptabiliteitswet, verplicht tot geheimhouding voor
      zover het betreft gegevens en inlichtingen die haar ingevolge de eerste volzin bekend zijn geworden.


