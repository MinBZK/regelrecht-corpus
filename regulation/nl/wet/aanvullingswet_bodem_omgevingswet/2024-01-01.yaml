  - number: '3.2'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op:

      a. een aanwijzing op grond van [artikel 27, tweede lid, van de Wet bodembescherming][ref1] die is gegeven voor
      dat tijdstip,

      b. een verklaring op grond van de op [artikel 28a, van de Wet bodembescherming][ref2] gebaseerde ministeriele
      regeling die is afgegeven voor dat tijdstip,

      c. een maatregel op grond van [artikel 30, eerste en vierde lid, van de Wet bodembescherming][ref3] die is
      vastgesteld voor dat tijdstip,

      d. een maatregel of een beperking op grond van [artikel 37, vierde lid, van de Wet bodembescherming][ref4], waarvan
      het bevoegd gezag voor dat tijdstip in een beschikking als bedoeld in dat lid heeft aangegeven dat die moeten
      worden genomen of in acht moeten worden genomen,

      e. een bevel op grond van [artikel 43, eerste lid, onder b, van de Wet bodembescherming][ref5] dat is gegeven voor
      dat tijdstip,

      f. een voor dat tijdstip vastgesteld en goedgekeurd plan op grond van
      [artikel 55d van de Wet bodembescherming][ref6] waarin een gebiedsgerichte aanpak is vastgelegd, of

      g. het verhalen van kosten van verontreiniging of aantasting van de bodem, bedoeld in
      [artikel 75, van de Wet bodembescherming][ref7], als die verontreiniging of aantasting is ontstaan voor dat
      tijdstip en een vordering daarvoor is ingesteld.


