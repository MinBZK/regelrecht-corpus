preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is om de Omgevingswet aan te vullen met regels met het oog
    op de bescherming van de bodem, met inbegrip van het grondwater, en het duurzaam en doelmatig gebruik van de bodem;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043277/2024-01-01#ArtikelAanhef
articles:
  - number: '2.1'
    text: |-
      De [Wet bodembescherming][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0043277/2024-01-01#Artikel2.1
    references:
