        bwb_id: BWBR0003994
  - number: '3.1'
    text: |-
      1 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op gevallen
      van ernstige verontreiniging als bedoeld in de [Wet bodembescherming][ref1] of saneringen als bedoeld in die wet
      waarvoor voor dat tijdstip:

      a. een besluit is genomen dat spoedige sanering noodzakelijk is krachtens [artikel 29][ref2] juncto
      [artikel 37, eerste lid, van de Wet bodembescherming][ref3],

      b. een saneringsplan is ingediend als bedoeld in [artikel 39 van de Wet bodembescherming][ref4], of

      c. een saneringsplan voor een gedeelte van de verontreiniging van de bodem is ingediend als bedoeld in
      [artikel 40 van de Wet bodembescherming][ref5], uitsluitend voor het gedeelte waarop het saneringsplan betrekking
      heeft.

      2 Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op saneringen
      als bedoeld in de [Wet bodembescherming][ref6] waarvoor voor dat tijdstip een melding is gedaan als bedoeld in
      [artikel 39b, derde lid, van die wet][ref7].


