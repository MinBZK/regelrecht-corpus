        artikel: '64'
  - number: '3.4'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op een vordering
      tot schadevergoeding als bedoeld in [artikel 73 van de Wet bodembescherming][ref1] die aanhangig is gemaakt voor de
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel73
    url: https://wetten.overheid.nl/BWBR0043277/2024-01-01#Artikel3.4
