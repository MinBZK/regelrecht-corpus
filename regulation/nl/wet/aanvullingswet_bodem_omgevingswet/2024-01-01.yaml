  - number: 3.2a
    text: |-
      De [artikelen 13][ref1], [27][ref2], [88][ref3] en [95 van de Wet bodembescherming][ref4] zoals die luidden
      voor het tijdstip van inwerkingtreding van deze wet blijven van toepassing op voor dat tijdstip veroorzaakte
      verontreiniging of aantasting als bedoeld in [artikel 13 van de Wet bodembescherming][ref5] ook indien die na dat
      tijdstip wordt ontdekt.


