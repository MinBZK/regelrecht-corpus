  - number: '3.3'
    text: |-
      Het recht zoals dat gold voor het tijdstip van inwerkingtreding van deze wet blijft tot en met 31 december 2021 van
      toepassing op een vrijstelling die op grond van [artikel 64 van de Wet bodembescherming][ref1] voor het gebruik van
      waterige fracties of reinigingswater is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel64
    url: https://wetten.overheid.nl/BWBR0043277/2024-01-01#Artikel3.3
