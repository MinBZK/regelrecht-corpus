  - number: '3.5'
    text: |-
      1 Een plan als bedoeld in [artikel 3.2, onder f][ref1], geldt met ingang van de dag nadat vier jaar
      zijn verstreken sinds de datum van inwerkingtreding van deze wet als een programma als bedoeld in
      [artikel 3.4 van de Omgevingswet][ref2].

      2 Een kaart die is vastgesteld met toepassing van [artikel 12a, vijfde lid, van de Wet bodembescherming][ref3]
      geldt als deel van een omgevingsplan als bedoeld in [artikel 4.2 van de Omgevingswet][ref4].

      3 Een besluit van de gemeenteraad over het toepassen van grond of baggerspecie op of in de bodem als bedoeld in
      [artikel 12a, tweede lid, van de Wet bodembescherming][ref5] geldt als deel van een omgevingsplan als bedoeld in
      [artikel 2.4 van de Omgevingswet][ref6].

      4 Een besluit van het algemeen bestuur van een waterschap tot vaststelling van voorschriften over het toepassen van
      grond of baggerspecie in oppervlaktewater als bedoeld in [artikel 6.6, tweede lid, van de Waterwet][ref7] en een
      verordening van een waterschap als bedoeld in artikel 6.6, derde lid, van die wet, voor zover die betrekking heeft
      op het toepassen van grond of baggerspecie in oppervlaktewater, gelden als deel van een waterschapsverordening als
      bedoeld in [artikel 2.5 van de Omgevingswet][ref8].

      5 Een besluit van Onze Minister van Infrastructuur en Waterstaat tot vaststelling van
      voorschriften over het toepassen van grond of baggerspecie in oppervlaktewater als bedoeld in
      [artikel 6.6, tweede lid, van de Waterwet][ref9] geldt gedurende twee jaar vanaf de datum van
      inwerkingtreding van deze wet als een besluit tot het stellen van maatwerkvoorschriften als bedoeld in
      [artikel 4.5 van de Omgevingswet][ref10].

      6 Een ontheffing die is verleend op grond van [artikel 51 van de Wet bodembescherming][ref11] wordt aangemerkt als
      een omgevingsvergunning voor een omgevingsplanactiviteit voor de periode waarop de ontheffing betrekking heeft.


