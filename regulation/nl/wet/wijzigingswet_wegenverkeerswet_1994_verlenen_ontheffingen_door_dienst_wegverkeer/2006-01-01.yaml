  - number: V
    text: |-
      1 [Artikel I, onderdelen A, B, F tot en met H][ref1], en [artikel IV][ref2] treden in werking op een bij koninklijk
      besluit te bepalen tijdstip.

      2 [Artikel I, onderdeel C][ref3], treedt in werking met ingang van de eerste dag van de derde kalendermaand na de
      datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst.

      3 Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref4] treden
      [artikel I, onderdelen D en E][ref5], en [artikel III][ref6] in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst.

