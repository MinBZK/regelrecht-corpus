preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bevoegdheid tot ontheffingverlening van de
    Wegenverkeerswet 1994 voor bepaalde gevallen te centraliseren bij de Dienst Wegverkeer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017665/2006-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      De [artikelen 108, eerste lid, onderdeel h][ref1], en [109, eerste lid, van de Wegenverkeerswet 1994][ref2], zoals
      die artikelen luidden vóór het tijdstip van inwerkingtreding van [artikel I, onderdelen D en E, van deze wet][ref3],
      blijven van kracht ten aanzien van rijbewijzen, afgegeven door het daartoe bevoegde gezag in een andere Lid-Staat
      van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, die voor dat tijdstip zijn geregistreerd in het rijbewijzenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0017665#ArtikelI
    url: https://wetten.overheid.nl/BWBR0017665/2006-01-01#ArtikelIII
