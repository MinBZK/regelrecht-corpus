  - number: IV
    text: |-
      Ontheffingen verleend ingevolge [artikel 149, eerste lid, van de Wegenverkeerswet 1994][ref1], zoals deze bepaling
      luidde voor inwerkingtreding van deze wet, behouden hun geldigheid zolang hun geldigheidsduur niet is verstreken of
      zij niet zijn vervangen door een ontheffing verleend op grond van [artikel 149a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0017665/2006-01-01#ArtikelIV
