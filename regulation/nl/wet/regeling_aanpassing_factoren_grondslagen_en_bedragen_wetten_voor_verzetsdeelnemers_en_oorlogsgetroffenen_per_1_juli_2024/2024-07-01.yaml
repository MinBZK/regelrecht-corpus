  - number: '1'
    text: |-
      De pensioenbedragen, bedoeld in [artikel 31b, eerste lid, onder a, van de Wet buitengewoon pensioen 1940–1945][ref1]
      en in [artikel 28b, eerste lid, onder a, van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2],
      zoals zij golden op 1 januari 2024, worden met ingang van 1 juli 2024 verhoogd met 3,1%.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel31b
