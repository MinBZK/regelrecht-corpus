preamble:
  text: >-
    Wij, Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is het wettelijke bezoldigingsmaximum voor
    topfunctionarissen in de publieke en semipublieke sector, zoals neergelegd in de Wet normering bezoldiging
    topfunctionarissen publieke en semipublieke sector, te verlagen van 130% naar 100% van de bezoldiging van een
    Minister;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036047/2015-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij dat besluit kunnen de in
      [artikel I, onderdeel D][ref1], genoemde bedragen overeenkomstig dat onderdeel worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0036047#ArtikelI
