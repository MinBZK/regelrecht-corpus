---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitkeringsregeling_backpay
regulatory_layer: WET
publication_date: '2023-09-29'
valid_from: '2015-12-25'
bwb_id: BWBR0037426
url: https://wetten.overheid.nl/BWBR0037426/2015-12-25
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
  - number: 1.a)
    text: '*Minister:* de Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
  - number: 1.b)
    text: '*Uitvoeringsorganisatie:* de door de minister aan te wijzen organisatie die onderhavige regeling uitvoert;'
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
  - number: 1.c)
    text: |-
      *Backpay:* eenmalige uitkering van netto 25.000 euro – op morele gronden – als finale financiële tegemoetkoming
      voor niet uitbetaalde salarissen aan belanghebbende;
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
  - number: 1.d)
    text: |-
      *Belanghebbende:* de persoon die als ambtenaar of militair ten tijde van de Japanse bezetting in dienst was van
      het Nederlands-Indisch Gouvernement en aan wie gedurende de Japanse bezetting in de periode van 8 maart 1942 tot 15
      augustus 1945 geen dan wel niet volledig salaris is uitbetaald;
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
  - number: 1.e)
    text: |-
      *Aanvrager:* diegene die overeenkomstig [artikel 5][ref1] via de bevestigingsbrief verklaart dat hij belanghebbende
      is; of die overeenkomstig [artikel 6][ref2] via het aanvraagformulier een aanvraag indient.


      [ref1]: https://wetten.overheid.nl/BWBR0037426#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037426#Artikel6
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037426
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0037426
        artikel: '6'
  - number: '2'
    text: De minister kan aan een belanghebbende backpay toekennen.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel2
  - number: '3.1'
    text: 'Recht op backpay heeft de belanghebbende die:'
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel3
  - number: 3.1.a
    text: op 15 augustus 2015 in leven was;
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel3
  - number: 3.1.b
    text: niet door de rechter is veroordeeld wegens collaboratie met de Japanners;
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel3
  - number: 3.1.c
    text: gedurende (een deel van) de Japanse bezetting niet de Japanse nationaliteit heeft bezeten.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel3
  - number: '3.2'
    text: Indien de belanghebbende op of na 15 augustus 2015 is overleden hebben diens erfgenamen recht op backpay.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel3
  - number: '4'
    text: |-
      Indien de belanghebbende op basis van bronnenonderzoek van de uitvoeringsorganisatie naar het oordeel van de
      minister voldoet aan de criteria, bedoeld in [artikel 3, onder a tot en met c][ref1], wordt de backpay ambtshalve
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037426#Artikel3
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037426
        artikel: '3'
  - number: '5.1'
    text: |-
      Diegene die naar het oordeel van de minister kan worden aangemerkt als potentiële belanghebbende ontvangt een
      bevestigingsbrief die hij dient in te vullen en te retourneren indien aanvrager van mening is belanghebbende te
      zijn en te voldoen aan de criteria, bedoeld in [artikel 3, onder a tot en met c][ref1]. Potentiële belanghebbenden
      worden geselecteerd op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0037426#Artikel3
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037426
        artikel: '3'
  - number: 5.1.a
    text: |-
      bij de uitvoeringsorganisatie beschikbare namen van potentiële belanghebbenden waarbij op grond van de beschikbare
      bronnen, voldoende aannemelijk is dat sprake was van een dienstverband met het Nederlands-Indisch Gouvernement;
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel5
  - number: 5.1.b
    text: |-
      waar lijkt dat wordt voldaan aan de criteria, bedoeld in [artikel 3, onder a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037426#Artikel3
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037426
        artikel: '3'
  - number: '5.2'
    text: |-
      De bevestigingsbrief dient uiterlijk 1 januari 2017 ingevuld en ondertekend door de uitvoeringsorganisatie te zijn
      ontvangen. De minister kan deze termijn tot uiterlijk 1 januari 2018 verlengen.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel5
  - number: '5.3'
    text: De aanvrager dient de gegevens te overleggen waarnaar in de bevestigingsbrief wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel5
  - number: '6.1'
    text: |-
      Diegene die geen ambtshalve toekenning als bedoeld in [artikel 4][ref1] of bevestigingsbrief als bedoeld in
      [artikel 5][ref2] heeft ontvangen en van mening is belanghebbende te zijn en te voldoen aan de criteria, bedoeld in
      [artikel 3, onder a tot en met c][ref3], kan een aanvraag indienen via het aanvraagformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0037426#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037426#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037426#Artikel3
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037426
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037426
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0037426
        artikel: '3'
  - number: '6.2'
    text: |-
      Het aanvraagformulier dient uiterlijk 1 januari 2017 ingevuld en ondertekend door de uitvoeringsorganisatie te zijn
      ontvangen. De minister kan deze termijn tot uiterlijk 1 januari 2018 verlengen.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel6
  - number: '6.3'
    text: De aanvrager dient de gegevens te overleggen waarnaar in het aanvraagformulier wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel6
  - number: '7'
    text: |-
      De minister kan in bijzondere gevallen tegemoetkomen aan onbillijkheden van overwegende aard, die zich naar het
      oordeel van de minister bij de toepassing van deze regeling mochten voordoen.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel7
  - number: '8.1'
    text: |-
      De aanvrager verleent via de bevestigingsbrief of het aanvraagformulier toestemming tot onderzoek naar en in de
      persoonlijke gegevens die van belang kunnen zijn voor de beoordeling van de aanvraag, zulks ter beoordeling van
      de uitvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel8
  - number: '8.2'
    text: |-
      Desgevraagd of uit eigen beweging verstrekt de aanvrager aan de uitvoeringsorganisatie alle inlichtingen en
      verleent hij alle medewerking die van belang kunnen zijn voor de beoordeling van de aanvraag, een en ander ter
      beoordeling van de uitvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel8
  - number: '8.3'
    text: |-
      Door ondertekening van de bevestigingsbrief of het aanvraagformulier verklaart de aanvrager dat hij bekend is met
      deze regeling en met de verplichtingen die deze regeling jegens hem in het leven roept.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel8
  - number: '8.4'
    text: |-
      De ontvangst van de geretourneerde bevestigingsbrief of het aanvraagformulier zal schriftelijk binnen een maand aan
      de aanvrager worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel8
  - number: '8.5'
    text: De aanvragen zullen, waar mogelijk, in volgorde van ontvangst worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel8
  - number: '9.1'
    text: |-
      De minister neemt binnen dertien weken na ontvangst van de aanvraag een besluit inzake de toekenning van de
      backpay.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel9
  - number: '9.2'
    text: |-
      Een besluit over het al dan niet toekennen van de backpay wordt schriftelijk aan de aanvrager medegedeeld en per
      post verzonden.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel9
  - number: '10.1'
    text: |-
      Een besluit tot toekenning van backpay kan worden ingetrokken indien de aanvrager aan wie de backpay is toegekend
      onjuiste of onvolledige informatie heeft verschaft, waardoor de backpay ten onrechte is toegekend.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel10
  - number: '10.2'
    text: |-
      Indien het besluit tot toekenning van backpay wordt ingetrokken en de uitkering van de backpay heeft
      plaatsgevonden, vordert de minister de backpay terug. Terugbetaling dient te geschieden binnen een periode van 12
      maanden na intrekking van het besluit tot toekenning.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel10
  - number: '11'
    text: In alle gevallen waarin de regeling niet voorziet, beslist de minister.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de eerste dag na de datum van afgifte van de Staatscourant waarin
      zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Uitkeringsregeling Backpay.'
    url: https://wetten.overheid.nl/BWBR0037426/2015-12-25#Artikel13
