    text: |-
      kinderopvangtoeslag en tegemoetkomingen op grond van de [Wet kinderopvang][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 3.104.h
    text: |-
      op het inkomen van de belastingplichtige afgestemde uitkeringen die bij ministeriële regeling worden aangewezen,
      voorzover zij volgens die regeling zijn bedoeld ter dekking van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.h.1°
    text: bepaalde noodzakelijke kosten van huur van een woning of een woonwagen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.h.2°
    text: |-
      bepaalde noodzakelijke kosten in verband met de verkrijging of het behoud van een eigen woning als bedoeld in
      [artikel 3.111][ref1], waarbij voor de toepassing van de regeling inzake de aftrek van de op de voordelen uit die
      woning drukkende kosten als bedoeld in [artikel 3.110][ref2] deze uitkering geacht wordt wel te zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
