  - number: '2.11'
    text: |-
      Voor de belastingplichtige die geen premie voor de algemene ouderdomsverzekering verschuldigd is
      ingevolge [artikel 10 van de Wet financiering sociale verzekeringen][ref1] wordt de verschuldigde
      belasting over uitkeringen of bedragen die zouden moeten worden uitgekeerd als bedoeld in
      [artikel 18a, negende lid, van de Wet op de loonbelasting 1964][ref2], gesteld op de som van
      de belasting en de premie voor de algemene ouderdomsverzekering die daarover ingevolge de
      [Wet financiering sociale verzekeringen][ref3] verschuldigd zou zijn door een persoon die wel de premie voor
      de algemene ouderdomsverzekering verschuldigd is en overigens in dezelfde omstandigheden verkeert als de
      belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref3
        bwb_id: BWBR0017745
  - number: 2.11a.1
    text: |-
      De belasting op het belastbare inkomen uit werk en woning nadat de regelingen ter voorkoming van dubbele
      belasting zijn toegepast, wordt verminderd op de voet van artikel 4.53 met een nog niet in aanmerking genomen
      belastingkorting voor verlies uit aanmerkelijk belang. De in de eerste volzin bedoelde belasting op het belastbare
      inkomen uit werk en woning wordt bepaald zonder rekening te houden met te conserveren inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: 2.11a.2
    text: |-
      Voor de toepassing van dit artikel wordt, indien ingevolge artikel 9.1, derde lid, de heffing van de belasting en
      de premie voor de volksverzekeringen geschiedt bij wege van één aanslag, onder belasting mede verstaan de in die
      aanslag te begrijpen premie voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: 2.11a.3
    text: |-
      De vermindering van de belasting op het belastbare inkomen uit werk en woning vindt plaats bij voor bezwaar vatbare
      beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: 2.11a.4
    text: |-
      De inspecteur geeft de beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarbij de
      belastingkorting voor verlies uit aanmerkelijk belang wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: 2.11a.5
    text: |-
      Het bedrag van de verrekende belastingkorting voor verlies uit aanmerkelijk belang wordt op het aanslagbiljet
      afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: 2.11a.6
    text: |-
      Rechtsmiddelen tegen de beschikking kunnen uitsluitend betrekking hebben op de toepassing van artikel 4.53,
      alsmede, indien geen belasting is verschuldigd, tegen de grootte van het verrekende bedrag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.11a
  - number: '2.12'
    text: |-
      De belasting op het belastbare inkomen uit aanmerkelijk belang ([afdeling 4.1][ref1] respectievelijk
      [afdeling 7.3][ref2]) bedraagt 25%.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: '2.13'
    text: |-
      De belasting op het belastbare inkomen uit sparen en beleggen ([afdeling 5.1][ref1] respectievelijk
      [afdeling 7.4][ref2]) bedraagt 30%.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.4'
  - number: 2.14.1
    text: |-
      Indien een voordeel op grond van meer dan een hoofdstuk, afdeling of paragraaf als bestanddeel, al dan niet
      vrijgesteld, van een van de belastbare inkomens zou kunnen worden aangemerkt, wordt het voordeel uitsluitend
      op grond van het als eerste opgenomen hoofdstuk of de als eerste opgenomen afdeling of paragraaf aangemerkt als
      bestanddeel van het desbetreffende belastbare inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Voorzover vermogensbestanddelen inkomen, al dan niet vrijgesteld, uit werk en woning of uit aanmerkelijk belang
      genereren, worden zij niet in aanmerking genomen voor de bepaling van het belastbare inkomen uit sparen en
      beleggen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.14.3
    text: 'In afwijking in zoverre van het eerste en tweede lid worden:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.14.3.a
    text: |-
      schulden ter zake waarvan de renten op basis van een specifieke bepaling in [hoofdstuk 3][ref1] of
      [hoofdstuk 4][ref2] van aftrek zijn uitgesloten, in aanmerking genomen bij de bepaling van het belastbare inkomen
      uit sparen en beleggen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 2.14.3.b
    text: |-
      vermogensbestanddelen, of delen daarvan, die gedurende een periode van niet meer dan drie achtereenvolgende maanden
      inkomen uit werk en woning of aanmerkelijk belang genereren, en daaraan voorafgaand en daaropvolgend inkomen uit
      sparen en beleggen genereren, tevens in aanmerking genomen bij de bepaling van het belastbare inkomen uit sparen en
      beleggen indien in deze periode een begindatum of een einddatum is gelegen als bedoeld in [artikel 5.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 2.14.3.c
    text: |-
      vermogensbestanddelen, of delen daarvan, die gedurende een periode van meer dan drie achtereenvolgende maanden,
      maar niet meer dan zes achtereenvolgende maanden inkomen uit werk en woning of uit aanmerkelijk belang genereren,
      en daaraan voorafgaand en daaropvolgend inkomen uit sparen en beleggen genereren, tevens in aanmerking genomen bij
      de bepaling van het belastbare inkomen uit sparen en beleggen indien in deze periode een begindatum of einddatum is
      gelegen als bedoeld in [artikel 5.2][ref1], tenzij de belastingplichtige aannemelijk maakt dat aan zijn handelingen
      zakelijke overwegingen ten grondslag liggen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 2.14.3.d
    text: |-
      van een werkgever die een met de belastingplichtige verbonden persoon is als bedoeld in [artikel 3.91][ref1], of
      waarin de belastingplichtige of een met hem verbonden persoon als bedoeld in [artikel 3.92][ref2] een aanmerkelijk
      belang heeft als bedoeld in [hoofdstuk 4][ref3], uitgezonderd de [artikelen 4.10][ref4] en [4.11][ref5], ontvangen
      vergoedingen ter zake van kosten en lasten die verband houden met een werkruimte ten behoeve van hemzelf in zijn
      woning, niet in aanmerking genomen bij de bepaling van het belastbare loon, doch bij de bepaling van het belastbare
      resultaat uit overige werkzaamheden en wordt die werkruimte tot het vermogen van die werkzaamheid gerekend, indien
      de werkruimte een naar verkeersopvatting zelfstandig gedeelte van de woning vormt en:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 2.14.3.d.1º
    text: |-
      ingeval de belastingplichtige tevens een werkruimte buiten die woning ter beschikking heeft, hij zijn belastbaar
      loon hoofdzakelijk in de werkruimte in die woning verwerft, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.14.3.d.2º
    text: |-
      ingeval de belastingplichtige niet tevens een werkruimte buiten die woning ter beschikking heeft, hij zijn
      belastbaar loon hoofdzakelijk in of vanuit de werkruimte in die woning verwerft en in belangrijke mate in de
      werkruimte in die woning verwerft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Met betrekking tot het derde lid, onderdelen b en c, is [artikel 5.3, vijfde lid][ref1], van overeenkomstige
      toepassing. Met betrekking tot het derde lid, onderdeel d, is [artikel 3.16, twaalfde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 2.14.5
    text: |-
      Voor gevallen waarin een premie voor een lijfrente of een andere periodieke uitkering of verstrekking uit een
      inkomensvoorziening niet geheel als uitgave voor een inkomensvoorziening in aanmerking is genomen, kunnen bij
      ministeriële regeling regels worden gesteld met betrekking tot de toerekening van de risicodekking, de overige
      kosten en het rendement aan het gedeelte van het recht dat in aanmerking wordt genomen bij het belastbare inkomen
      uit werk en woning en het gedeelte dat in aanmerking wordt genomen bij het belastbare inkomen uit sparen en
      beleggen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Voor de toepassing van deze wet, behoudens voorzover het de toepassing van [artikel 2.16][ref1] betreft, wordt geen
      rekening gehouden met het wettelijk vruchtgenot van het vermogen van een minderjarig *kind*.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.15.2
    text: |-
      Het belastbare resultaat uit overige werkzaamheden als bedoeld in de artikelen
      [3.91, eerste lid, onderdelen a en b, en derde lid][ref1], en [3.92][ref2], de belastbare inkomsten uit eigen
      woning, het belastbare inkomen uit aanmerkelijk belang en de rendementsgrondslag voor het belastbare inkomen uit
      sparen en beleggen, van een minderjarig kind worden toegerekend aan de ouder die het gezag over het kind uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 2.15.3
    text: |-
      Met de ouder die het gezag over het kind uitoefent, wordt, indien niet tevens een andere ouder
      het gezag uitoefent, gelijkgesteld de ouder die van het ouderlijk gezag is ontheven volgens
      [artikel 266 van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '266'
  - number: 2.15.4
    text: |-
      Indien het gezag over het kind aan meer dan één ouder toekomt, worden de in het tweede lid bedoelde
      inkomensbestanddelen in gelijke delen aan ieder van hen toegerekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.15
  - number: 2.16.1
    text: |-
      De belastingplichtige aan wie inkomensbestanddelen van een *kind* zijn toegerekend en die daarvan niet het
      vruchtgenot heeft, heeft verhaal op dat kind voor een gedeelte van de door hem verschuldigde inkomstenbelasting,
      voorzover deze is voldaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.16
  - number: 2.16.2
    text: |-
      Het in het eerste lid bedoelde gedeelte wordt gesteld op een evenredig gedeelte van de verschuldigde belasting,
      bepaald naar de verhouding waarin de belastbare inkomsten uit eigen woning, het inkomen uit aanmerkelijk belang
      of het belastbare inkomen uit sparen en beleggen van dat kind dat bij de vaststelling van de belastingschuld
      in aanmerking is genomen, staat tot het inkomen uit werk en woning, het inkomen uit aanmerkelijk belang
      onderscheidenlijk het belastbare inkomen uit sparen en beleggen dat tot de belastingschuld heeft geleid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.16
  - number: 2.16.3
    text: |-
      Indien in het belastbare inkomen uit werk en woning of het belastbare inkomen uit aanmerkelijk belang te
      conserveren inkomen is begrepen, wordt het in het eerste lid bedoelde gedeelte bepaald met overeenkomstige
      toepassing van de [artikelen 2.8, eerste lid][ref1], en [2.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 2.16.4
    text: Van het eerste lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.16
  - number: 2.17.1
    text: |-
      Inkomensbestanddelen van de belastingplichtige en zijn *partner* worden in aanmerking genomen bij degene door
      wie de inkomensbestanddelen zijn genoten of op wie deze drukken. Bestanddelen van de rendementsgrondslag van
      de belastingplichtige en zijn partner worden in aanmerking genomen bij degene tot wiens bezit die bestanddelen
      behoren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      Gemeenschappelijke inkomensbestanddelen en bestanddelen van de rendementsgrondslag van de belastingplichtige
      en zijn partner worden geacht bij hen op te komen respectievelijk tot hun bezit te behoren, in de onderlinge
      verhouding die zij daarvoor ieder jaar bij het doen van aangifte kiezen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      Een gemeenschappelijk inkomensbestanddeel wordt geacht bij de belastingplichtige en zijn partner voor de helft op
      te komen en een bestanddeel van de rendementsgrondslag wordt geacht bij de belastingplichtige en zijn partner voor
      de helft tot hun bezit te behoren voorzover zij daarvoor geen onderlinge verhouding hebben gekozen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.4
    text: |-
      De voor een gemeenschappelijk inkomensbestanddeel of bestanddeel van de rendementsgrondslag dan wel gedeelte
      daarvan tot stand gekomen onderlinge verhouding kan door de belastingplichtige en zijn partner gezamenlijk
      worden gewijzigd tot het moment waarop de aanslag, navorderingsaanslag, conserverende aanslag of conserverende
      navorderingsaanslag van een van hen waarin het desbetreffende bestanddeel of gedeelte daarvan is begrepen,
      onherroepelijk vaststaat.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.5
    text: |-
      Indien de belastingplichtige gedurende het gehele kalenderjaar dezelfde partner heeft, zijn gemeenschappelijke
      inkomensbestanddelen:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.5.a
    text: belastbare inkomsten uit eigen woning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.5.b
    text: het inkomen uit aanmerkelijk belang vóór vermindering met de persoonsgebonden aftrek;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.5.c
    text: de persoonsgebonden aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.6
    text: |-
      Indien een persoonsgebonden aftrek van een belastingplichtige in aanmerking is genomen bij zijn partner wordt een
      met die aftrek verband houdende negatieve persoonsgebonden aftrek eveneens in aanmerking genomen bij die partner,
      zo die persoon nog steeds kan kwalificeren als partner van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: 2.17.7
    text: |-
      Indien de belastingplichtige gedurende een deel van het kalenderjaar een partner heeft wordt hij voor de toepassing
      van dit artikel geacht het gehele kalenderjaar die partner te hebben gehad indien hij daarvoor samen met die
      partner kiest. De keuze wordt gemaakt bij verzoeken in verband met voorlopige teruggaaf of bij aangifte.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.17
  - number: '2.18'
    text: 'Verzamelinkomen is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.18
  - number: 2.18.a
    text: het inkomen uit werk en woning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.18
  - number: 2.18.b
    text: het inkomen uit aanmerkelijk belang en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.18
  - number: 2.18.c
    text: het belastbare inkomen uit sparen en beleggen, verminderd met daarin begrepen te conserveren inkomen
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.18
  - number: 3.1.1
    text: |-
      Belastbaar inkomen uit werk en woning is het inkomen uit werk en woning verminderd met de te verrekenen verliezen
      uit werk en woning ([afdeling 3.13][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 3.1.2
    text: 'Inkomen uit werk en woning is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
  - number: 3.1.2.a
    text: |-
      de belastbare winst uit onderneming ([afdeling 3.2][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.1.2.b
    text: |-
      het belastbare loon ([afdeling 3.3][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.1.2.c
    text: |-
      het belastbare resultaat uit overige werkzaamheden ([afdeling 3.4][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3.1.2.d
    text: |-
      de belastbare periodieke uitkeringen en verstrekkingen ([afdeling 3.5][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.1.2.e
    text: |-
      de belastbare inkomsten uit eigen woning ([afdeling 3.6][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.1.2.f
    text: |-
      de negatieve uitgaven voor inkomensvoorzieningen ([afdeling 3.8][ref1]) en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.1.2.g
    text: |-
      de negatieve persoonsgebonden aftrekposten ([afdeling 3.9][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.9'
  - number: 3.1.2
    text: 'verminderd met:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
  - number: 3.1.2.h
    text: |-
      de aftrek wegens geen of geringe eigenwoningschuld ([afdeling 3.6a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: 3.6a
  - number: 3.1.2.i
    text: |-
      de uitgaven voor inkomensvoorzieningen ([afdeling 3.7][ref1]) en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.1.2.j
    text: |-
      de persoonsgebonden aftrek ([hoofdstuk 6][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
  - number: '3.2'
    text: |-
      Belastbare winst uit onderneming is het gezamenlijke bedrag van de winst die de belastingplichtige als
      *ondernemer* geniet uit een of meer ondernemingen ([paragraaf 3.2.2][ref1]) verminderd met de ondernemersaftrek
      ([paragraaf 3.2.4][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        paragraaf: 3.2.4
        afdeling: '3.2'
  - number: 3.3.1
    text: 'Belastbare winst uit onderneming is mede:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      de winst die de belastingplichtige, anders dan als *ondernemer* of aandeelhouder, als medegerechtigde tot het
      vermogen van een onderneming geniet uit een of meer ondernemingen ([paragraaf 3.2.2][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.3.1.b
    text: |-
      het bedrag van de gezamenlijke voordelen die de belastingplichtige geniet uit hoofde van een schuldvordering op een
      ondernemer ten behoeve van een voor zijn rekening gedreven onderneming, indien zich een in het derde lid genoemde
      omstandigheid voordoet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, behoeft de medegerechtigdheid zich niet uit te strekken tot een
      eventueel liquidatiesaldo.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.3
    text: 'Een in het eerste lid, onderdeel b, bedoelde omstandigheid is:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.3.a
    text: |-
      de schuldvordering is onder zodanige voorwaarden aangegaan dat deze in feite functioneert als vermogen van de in
      dat onderdeel bedoelde onderneming of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.3.b
    text: |-
      de vergoeding over de schuldvordering is op het tijdstip van het aangaan van de schuldvordering zodanig vastgesteld
      dat deze rechtens – dan wel in feite – bezien over de gehele looptijd grotendeels afhankelijk is van de winst van
      de in dat onderdeel bedoelde onderneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Het eerste lid, onderdeel b, is – in afwijking in zoverre van [artikel 2.14][ref1] – niet van toepassing op
      voordelen uit hoofde van een schuldvordering die tevens als belastbaar resultaat uit overige werkzaamheden zouden
      kunnen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 3.3.5
    text: |-
      Indien de voorwaarden waaronder een schuldvordering is aangegaan nadien worden gewijzigd, wordt voor de toepassing
      van het derde lid de schuldvordering op het tijdstip van het wijzigen van de voorwaarden geacht opnieuw te zijn
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.6
    text: |-
      De in het eerste lid, onderdeel b, bedoelde voordelen worden bepaald alsof de schuldvordering een onderneming
      vormt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
  - number: 3.3.7
    text: |-
      Dit artikel is niet van toepassing met betrekking tot directe beleggingen in durfkapitaal als bedoeld in
      [artikel 5.17][ref1], voorzover het bedrag van die belegging binnen de begrenzing van [artikel 5.16][ref2] blijft
      en die beleggingen voor het overige voldoen aan de ter zake gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: '3.4'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder *ondernemer*: de belastingplichtige voor
      rekening van wie een onderneming wordt gedreven en die rechtstreeks wordt verbonden voor verbintenissen betreffende
      die onderneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt mede verstaan onder onderneming: het zelfstandig
      uitgeoefende beroep.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt mede verstaan onder *ondernemer*: de beoefenaar van een
      zelfstandig beroep.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder *urencriterium*: het gedurende het
      kalenderjaar besteden van ten minste 1225 uren aan werkzaamheden voor een of meer ondernemingen waaruit de
      belastingplichtige als *ondernemer* winst geniet, indien:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.1.a
    text: |-
      de tijd die in totaal wordt besteed aan die ondernemingen en het verrichten van werkzaamheden in de zin van de
      [afdelingen 3.3][ref1] en [3.4][ref2], grotendeels wordt besteed aan die ondernemingen of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3.6.1.b
    text: de ondernemer in een of meer van de vijf voorafgaande kalenderjaren geen ondernemer was.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Voor de toepassing van het eerste lid, aanhef, komen niet in aanmerking werkzaamheden ten behoeve van
      een onderneming waaruit de belastingplichtige als ondernemer winst geniet en die deel uitmaakt van een
      samenwerkingsverband met een of meer met hem verbonden personen, indien:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.2.a
    text: |-
      de door de belastingplichtige verrichte werkzaamheden ten behoeve van het samenwerkingsverband hoofdzakelijk van
      ondersteunende aard zijn en het ongebruikelijk is dat een dergelijk samenwerkingsverband tussen niet-verbonden
      personen wordt aangegaan, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.2.b
    text: |-
      het samenwerkingsverband verband houdt met een onderneming waaruit een met de belastingplichtige verbonden persoon
      als ondernemer winst geniet, maar de belastingplichtige zelf niet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.3
    text: 'Voor de toepassing van dit artikel wordt onder met de belastingplichtige verbonden personen verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.3.a
    text: personen die behoren tot het huishouden van de belastingplichtige en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.3.b
    text: bloed- of aanverwanten in de rechte lijn of personen die behoren tot hun huishouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: 3.6.4
    text: |-
      Onder een samenwerkingsverband dat verband houdt met een onderneming waaruit een met de belastingplichtige
      verbonden persoon als ondernemer winst geniet wordt mede verstaan een samenwerkingsverband dat verband houdt met
      een lichaam waarin de belastingplichtige of een met hem verbonden persoon direct of indirect een aanmerkelijk
      belang in de zin van [afdeling 4.3][ref1] van deze wet heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 3.6.5
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, worden onderbroken vanwege zwangerschap van de
      belastingplichtige, worden deze tijdens de periode die overeenkomt met het zwangerschaps- en bevallingsverlof zoals
      dat geldt voor werkneemsters, voor de bepaling van het aantal gewerkte uren geacht niet te zijn onderbroken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.6
  - number: '3.8'
    text: |-
      Winst uit een onderneming (winst) is het bedrag van de gezamenlijke voordelen die, onder welke naam en in welke
      vorm ook, worden verkregen uit een onderneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Voorzover de winst van de belastingplichtige, bedoeld in [artikel 3.3][ref1] in het jaar, vóór toepassing van
      dit lid, tezamen met de winst van alle daaraan voorafgaande jaren waarin dat artikel op hem van toepassing was,
      negatief is en in absolute zin uitgaat boven het in het tweede lid bedoelde bedrag, wordt het verschil ten bate van
      de winst van het jaar gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.9.2
    text: |-
      Het in het eerste lid bedoelde bedrag betreft de boekwaarde van het vermogen van de onderneming op het tijdstip
      waarop [artikel 3.3][ref1] voor het eerst op de belastingplichtige van toepassing werd, verminderd met het bedrag
      van de reserves, bedoeld in [artikel 3.53][ref2], op dat tijdstip. Indien na het in de eerste volzin bedoelde
      tijdstip door de belastingplichtige is gestort in of onttrokken aan de onderneming, wordt het in de eerste volzin
      bedoelde bedrag vermeerderd met de waarde van die storting op het tijdstip van die storting respectievelijk
      verminderd met de waarde van die onttrekking op het tijdstip van die onttrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.9.3
    text: |-
      Hetgeen op grond van het eerste lid ten bate van de winst van het jaar is gebracht, wordt ten laste van de
      winst van het volgende jaar gebracht indien [artikel 3.3][ref1] bij de aanvang van dat volgende jaar nog op de
      belastingplichtige van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: '3.10'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld volgens welke, onder te stellen voorwaarden, de *ondernemer*
      bij het bepalen van de winst de per saldo resterende kosten en lasten in aftrek kan brengen die zijn gemaakt in de
      vijf kalenderjaren die onmiddellijk voorafgaan aan het eerste kalenderjaar als *ondernemer*, verband houden met het
      starten van de onderneming en niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.10
  - number: 3.11.1
    text: Tot de winst behoren niet voordelen uit bosbedrijf.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Een belastingplichtige die het bosbedrijf uitoefent, kan de inspecteur verzoeken om het eerste lid op hem niet van
      toepassing te doen zijn. Bij inwilliging van het verzoek geldt dit tot wederopzegging door de belastingplichtige
      maar ten minste voor tien jaar. Een hernieuwd verzoek kan pas tien jaar nadat het eerste lid wederom van toepassing
      is geworden, worden ingewilligd. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.11
  - number: 3.11.3
    text: |-
      De waarde van de tot het bosbedrijf behorende bezittingen wordt op het tijdstip met ingang waarvan het eerste lid
      niet meer van toepassing is en op het tijdstip onmiddellijk voorafgaand aan dat waarop het eerste lid weer van
      toepassing is, gesteld op de waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.11
  - number: 3.11.4
    text: |-
      De voordelen die worden behaald onmiddellijk voorafgaand aan het tijdstip met ingang waarvan het eerste lid
      weer van toepassing is, kunnen onder bij algemene maatregel van bestuur te stellen voorwaarden buiten aanmerking
      blijven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      Tot de winst behoren niet voordelen uit landbouwbedrijf ter zake van waardeveranderingen van gronden – daaronder
      begrepen de ondergrond van gebouwen – voorzover de waardeverandering van de grond is toe te rekenen aan de
      ontwikkeling van de waarde in het economische verkeer bij voortzetting van de aanwending van de grond in het kader
      van een landbouwbedrijf, en niet is ontstaan in de uitoefening van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Voor de toepassing van dit artikel wordt onder landbouwbedrijf verstaan een bedrijf dat is gericht op het
      voortbrengen van producten van akkerbouw, van weidebouw of van tuinbouw – daaronder begrepen fruitteelt en het
      kweken van bomen, bloemen, bloembollen en paddestoelen – of op het in het kader van veehouderij fokken, mesten of
      houden van dieren. Met landbouwbedrijf worden gelijkgesteld binnenvisserij en visteelt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.12
  - number: 3.13.1
    text: 'Tot de winst behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
  - number: 3.13.1.a
    text: |-
      voordelen verkregen door het prijsgeven van niet voor verwezenlijking vatbare rechten door schuldeisers,
      voorzover de voordelen de som van het verlies uit werk en woning dat overigens mocht zijn geleden en de volgens
      [afdeling 3.13][ref1] te verrekenen verliezen uit het verleden overtreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 3.13.1.b
    text: |-
      voordelen bestaande uit aanspraken die berusten op een *pensioenregeling* en leiden tot als *loon* aan te
      merken pensioentermijnen of die uitsluitend of nagenoeg uitsluitend bestaan uit rechten op belastbare periodieke
      uitkeringen en verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
  - number: 3.13.1.c
    text: |-
      voordelen bestaande uit aanspraken op een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1] of op een
      bedrijfsbeëindigingsvergoeding van een door een of meer van Onze Ministers opgerichte stichting ter bevordering
      van de ontwikkeling en van de sanering binnen het bedrijfsleven, voorzover die aanspraken bestaan uit rechten op
      belastbare periodieke uitkeringen en verstrekkingen en uitsluitend zijn toegekend ter zake van de beëindiging van
      de onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0004163
  - number: 3.13.1.d
    text: |-
      voordelen bestaande uit uitkeringen en aanspraken op uitkeringen op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3.13.1.e
    text: |-
      voordelen op grond van een buitenlandse regeling die naar aard en strekking overeenkomt met een regeling als
      bedoeld in de onderdelen c en d;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
  - number: 3.13.1.f
    text: uitkeringen uit een stakingskas;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
  - number: 3.13.1.g
    text: |-
      een door Onze Minister na overleg met Onze Minister van Landbouw, Natuurbeheer en Visserij bij ministeriële
      regeling te bepalen deel van de voordelen ingevolge bij deze ministeriële regeling aangewezen regelingen ten
      behoeve van de ontwikkeling en instandhouding van bos en natuur alsmede aangewezen overeenkomsten die vooruitlopen
      op die regelingen en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
  - number: 3.13.1.h
    text: |-
      voordelen die op de voet van [artikel 32ab, eerste lid, van de Wet op de loonbelasting 1964][ref1] als
      eindheffingsbestanddeel in aanmerking zijn genomen, mits de belastingplichtige de aldaar bedoelde schriftelijke
      mededeling in zijn administratie bewaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ab
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ab
  - number: 3.13.2
    text: |-
      Op de voordelen bedoeld in het eerste lid, onderdeel d, en de voordelen op grond van een buitenlandse
      regeling die naar aard en strekking overeenkomt met een regeling als bedoeld in dat onderdeel, is
      [artikel 2.14, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 3.14.1
    text: 'Bij het bepalen van de winst komen niet in aftrek kosten en lasten die verband houden met de volgende posten:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.a
    text: het voeren van een zekere staat;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.b
    text: vaartuigen die worden gebruikt voor representatieve doeleinden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.c
    text: |-
      geldboeten opgelegd door een Nederlandse strafrechter en geldsommen betaald aan de Staat ter voorkoming van
      strafvervolging in Nederland of ter voldoening aan een voorwaarde verbonden aan een besluit tot gratieverlening,
      bestuurlijke boeten, geldboeten opgelegd op basis van bij wet geregeld tuchtrecht, geldboeten opgelegd
      door een instelling van de Europese Unie, alsmede kosten als bedoeld in [artikel 234, zesde lid][ref1], en
      [artikel 235, derde lid, van de Gemeentewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '234'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '235'
  - number: 3.14.1.d
    text: |-
      misdrijven ter zake waarvan de belastingplichtige door een Nederlandse strafrechter bij onherroepelijke uitspraak
      is veroordeeld, daaronder begrepen de misdrijven die zijn betrokken bij de bepaling van de hoogte van de opgelegde
      straf en ter zake waarvan het Openbaar Ministerie heeft verklaard te zullen afzien van vervolging;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.e
    text: |-
      misdrijven ter zake waarvan de belastingplichtige ter voorkoming van strafvervolging in Nederland aan de gestelde
      voorwaarden heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.f
    text: |-
      wapens en munitie, tenzij ter zake een erkenning, consent, vergunning, verlof of ontheffing is verleend krachtens
      de Wet wapens en munitie en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.1.g
    text: |-
      dieren en categorieën van dieren als bedoeld in de krachtens de [artikelen 73][ref1] en
      [107 van de Gezondheids- en welzijnswet voor dieren][ref2] vastgestelde Regeling agressieve dieren, tenzij ter zake
      een dierenpaspoort als bedoeld in die regeling is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel107
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '107'
  - number: 3.14.2
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing voorzover de onderneming direct is gericht op het vervaardigen
      of het verhandelen van vaartuigen die worden gebruikt voor representatieve doeleinden, dan wel op het verrichten
      van diensten in verband met die vaartuigen en die vaartuigen respectievelijk diensten deel uitmaken van de omzet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.3
    text: |-
      Onder bestuurlijke boete als bedoeld in het eerste lid, onderdeel c, wordt verstaan: een door een Nederlands
      bestuursorgaan bij beschikking opgelegde onvoorwaardelijke verplichting tot betaling van een geldsom, die is
      gericht op bestraffing van degene die een gedraging in strijd met het bepaalde bij of krachtens enig wettelijk
      voorschrift pleegt of medepleegt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.4
    text: 'Tot de in het eerste lid, onderdelen d en e, bedoelde kosten en lasten behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.4.a
    text: |-
      voldoening aan de Staat van een geldbedrag of overdracht van in beslag genomen voorwerpen, ter gehele of
      gedeeltelijke ontneming van wederrechtelijk verkregen voordelen en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.4.b
    text: vergoeding van door het misdrijf veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Voorzover kosten en lasten die verband houden met een misdrijf bij het bepalen van de winst in aanmerking zijn
      genomen in een of meer van de vijf jaren voorafgaande aan het jaar waarin de veroordeling, bedoeld in het eerste
      lid, onderdeel d, onherroepelijk is geworden, of waarin aan de gestelde voorwaarden, bedoeld in het eerste
      lid, onderdeel e, is voldaan, wordt het bedrag ter grootte van de som van deze kosten en lasten gerekend tot de
      positieve voordelen van de winst uit onderneming van het laatstbedoelde jaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.6
    text: |-
      Voor de toepassing van het eerste lid, onderdelen d en e, wordt met de belastingplichtige gelijkgesteld degene die
      ten behoeve van de belastingplichtige opdracht heeft gegeven tot het misdrijf dan wel aan het misdrijf feitelijk
      leiding heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.7
    text: 'Bij het bepalen van de winst komen mede niet in aftrek:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.7.a
    text: geheven dividendbelasting en kansspelbelasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.14.7.b
    text: |-
      belastingen die buiten Nederland in enige vorm naar de winst of bestanddelen van de winst worden geheven, indien
      voor de belastingplichtige ter zake daarvan een regeling ter voorkoming van dubbele belasting van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Bij het bepalen van de winst komen, onverminderd [artikel 3.14][ref1], tot een bedrag van  € 4000 niet in aftrek
      kosten en lasten die verband houden met de volgende posten:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.15.1.a
    text: voedsel, drank en genotmiddelen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.1.b
    text: representatie, daaronder begrepen recepties, feestelijke bijeenkomsten en vermaak en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.1.c
    text: congressen, seminars, symposia, excursies, studiereizen en dergelijke.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Onder de in het eerste lid bedoelde posten worden mede verstaan de desbetreffende reizen en het desbetreffende
      verblijf.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      Het eerste lid is niet van toepassing op de in dat lid bedoelde posten voorzover de onderneming direct is gericht
      op het vervaardigen of het verhandelen van tot die posten behorende goederen, dan wel op het verrichten van
      diensten in verband met die posten en die posten deel uitmaken van de omzet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.4
    text: |-
      Met betrekking tot de kosten en lasten die vallen onder het eerste lid worden, in afwijking in zoverre van
      [artikel 3.8][ref1], ten aanzien van de belastingplichtige zelf geen onttrekkingen in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.15.5
    text: |-
      Indien de belastingplichtige daarvoor bij de aangifte kiest, komen, in afwijking van het eerste lid, kosten en
      lasten die verband houden met de in dat lid genoemde posten, voor 75% in aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.6
    text: |-
      Voor de toepassing van het eerste, tweede en vijfde lid worden kosten en lasten die verband houden met een tot het
      privé-vermogen van de belastingplichtige behorend of door hem in privé gehuurd vervoermiddel, eerst beperkt tot
      € 0,19 per kilometer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.15.7
    text: |-
      Voor de toepassing van het zesde lid worden met de belastingplichtige gelijkgesteld personen die behoren tot zijn
      huishouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Bij het bepalen van de winst komen mede niet in aftrek kosten en lasten die verband houden met een
      werkruimte, de inrichting daaronder begrepen, ten behoeve van de belastingplichtige zelf in zijn niet tot zijn
      ondernemingsvermogen behorende woning, tenzij de werkruimte een naar verkeersopvatting zelfstandig gedeelte van de
      woning vormt en:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.1.a
    text: |-
      ingeval hij tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag van
      zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden
      hoofdzakelijk in de werkruimte in die woning verwerft, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.1.b
    text: |-
      ingeval hij niet tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag
      van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden
      hoofdzakelijk in of vanuit de werkruimte in die woning verwerft en in belangrijke mate in de werkruimte in die
      woning verwerft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Bij het bepalen van de winst komen mede niet in aftrek kosten en lasten ten behoeve van de belastingplichtige zelf
      die verband houden met de volgende posten:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2.a
    text: telefoonabonnementen met betrekking tot telefoonaansluitingen in zijn woonruimte;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2.b
    text: literatuur, met uitzondering van vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2.c
    text: kleding, met uitzondering van werkkleding;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2.d
    text: persoonlijke verzorging;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.2.e
    text: |-
      geheven inkomensafhankelijke bijdragen als bedoeld in [paragraaf 5.2 van de Zorgverzekeringswet][ref1], of een
      buitenlandse regeling die naar aard en strekking daarmee overeenkomt en


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0018450
        paragraaf: '5.2'
  - number: 3.16.2.f
    text: |-
      reizen en verblijf in verband met cursussen en opleidingen voor studie en beroep, alsmede in verband met
      congressen, seminars, symposia, excursies, studiereizen en dergelijke, voorzover deze meer bedragen dan € 1500.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      Bij het bepalen van de winst komen mede niet in aftrek kosten en lasten die verband houden met tot het privé-
      vermogen van de belastingplichtige behorende of door hem in privé gehuurde muziekinstrumenten, geluidsapparatuur,
      gereedschappen, computers en andere dergelijke apparatuur, alsmede beeldapparatuur.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.4
    text: |-
      Bij het bepalen van de winst komen mede niet in aftrek kosten en lasten die verband houden met vergoeding van
      arbeid door de partner van de belastingplichtige, indien de vergoeding lager is dan € 5000.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.5
    text: 'Voor de toepassing van het tweede lid, onderdeel c, wordt kleding als werkkleding aangemerkt indien zij:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.5.a
    text: uitsluitend of nagenoeg uitsluitend geschikt is om in het kader van de onderneming te worden gedragen of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.5.b
    text: |-
      is voorzien van zodanige uiterlijke kenmerken dat daaruit blijkt dat deze uitsluitend is bestemd om bij het behalen
      van de winst te worden gedragen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.6
    text: |-
      Bij ministeriële regeling kunnen voor het vijfde lid, onderdelen a en b, regels worden gesteld om te bepalen
      wanneer aan de in die onderdelen gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.7
    text: |-
      Het tweede lid, onderdelen c en d, is niet van toepassing ten aanzien van de belastingplichtige die optreedt als
      artiest of als presentator of die als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.8
    text: |-
      Het tweede lid, onderdeel f, is niet van toepassing indien de aard van de door de belastingplichtige verrichte
      werkzaamheden noodzaakt tot het bijwonen van de desbetreffende cursussen, opleidingen, congressen, seminars,
      symposia, excursies en dergelijke respectievelijk het maken van de desbetreffende studiereizen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.9
    text: 'Bij het bepalen van de winst komen mede niet in aftrek:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.9.a
    text: geheven loonbelasting en premie voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.9.b
    text: |-
      premies voor buitenlandse verzekeringen die naar aard en strekking overeenkomen met de volksverzekeringen, tenzij
      de belastingplichtige premieplichtig is voor de volksverzekeringen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.10
    text: |-
      Bij het bepalen van de winst komen voorts mede niet in aftrek, renten van schulden, kosten van geldleningen
      daaronder begrepen, die corresponderen met geldvorderingen als bedoeld in [artikel 5.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 3.16.11
    text: |-
      Voor de toepassing van dit artikel worden met de belastingplichtige gelijkgesteld personen die behoren tot zijn
      huishouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
  - number: 3.16.12
    text: |-
      Voor de toepassing van dit artikel wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip of
      woonwagen in de zin van [artikel 1 van de Woningwet][ref1], alsmede de aanhorigheden van een schip of woonwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 3.17.1
    text: |-
      Bij het bepalen van de winst komen, onverminderd de [artikelen 3.14][ref1], [3.15][ref2] en [3.16][ref3], kosten en
      lasten die verband houden met de volgende posten, tot het bij die posten aangegeven gedeelte in aftrek:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.17.1.a
    text: 'ten behoeve van de belastingplichtige zelf:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.1.a.1°
    text: 'verhuizing naar een andere woonruimte: de kosten van het overbrengen van zijn inboedel, vermeerderd met € 5445;'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.1.a.2°
    text: 'huisvesting buiten zijn woonplaats: gedurende ten hoogste twee jaar;'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.1.b
    text: |-
      tot het privé-vermogen van de belastingplichtige behorend of door hem in privé gehuurd vervoermiddel: € 0,19 per
      kilometer;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.1.c
    text: |-
      tot het privé-vermogen van de belastingplichtige behorende of door hem in privé gehuurde bezittingen, andere dan
      vervoermiddelen als bedoeld in onderdeel b:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.1.c.1º
    text: |-
      indien de bezittingen tot het privé-vermogen behoren: een gebruiksvergoeding van ten hoogste het voordeel uit
      sparen en beleggen dat ter zake van deze bezittingen in aanmerking wordt genomen, zonder daarbij rekening te houden
      met het heffingvrije vermogen bedoeld in [artikel 5.5][ref1], dat kan worden toegerekend aan de periode van het
      gebruik van de bezitting in de onderneming, alsmede een evenredig deel van de kosten die in huurverhoudingen door
      de huurder plegen te worden gedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 3.17.1.c.2º
    text: |-
      indien de bezittingen in privé zijn gehuurd: een gebruiksvergoeding van ten hoogste een evenredig deel van de
      huurprijs dat kan worden toegerekend aan de periode van het gebruik van de bezitting in de onderneming, alsmede een
      evenredig deel van de kosten die in huurverhoudingen door de huurder plegen te worden gedragen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, onder 1°, kunnen bij ministeriële regeling regels worden
      gesteld voor de beoordeling of in ieder geval in het kader van de onderneming is verhuisd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Indien een belastingplichtige uit meer dan een onderneming of werkzaamheid als bedoeld in [afdeling 3.4][ref1]
      winst respectievelijk resultaat behaalt, worden de kosten en lasten van de posten, bedoeld in het eerste lid,
      onderdeel a, gezamenlijk bij één onderneming of werkzaamheid in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: 3.17.4
    text: |-
      Voor de toepassing van dit artikel, behoudens het eerste lid, onderdeel c, worden met de belastingplichtige
      gelijkgesteld personen die behoren tot zijn huishouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.17
  - number: 3.19.1
    text: |-
      Bij het bepalen van de winst met betrekking tot een woning die de belastingplichtige of personen die behoren tot
      zijn huishouden, anders dan tijdelijk als hoofdverblijf ter beschikking staat, wordt de waarde van de onttrekking
      gesteld op het bedrag in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
  - number: 3.19.2
    text: |-
      De onttrekking bedraagt bij een woningwaarde van:







                    meer dan


                    maar niet meer dan


                    op jaarbasis






                    –


                    € 12 500


                    0,80% van deze waarde, maar niet minder dan € 100




                    € 12 500


                    € 25 000


                    1,00% van deze waarde




                    € 25 000


                    € 50 000


                    1,15% van deze waarde




                    € 50 000


                    € 75 000


                    1,25% van deze waarde




                    € 75 000


                    –-


                    1,45% van deze waarde, maar ten hoogste € 21 700
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
  - number: 3.19.3
    text: |-
      De woningwaarde is de volgens [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] voor die woning
      vastgestelde waarde of waarden voor het tijdvak waarbinnen het kalenderjaar valt. Indien een woning deel uitmaakt
      van een onroerende zaak als bedoeld in [artikel 16 van de Wet waardering onroerende zaken][ref2], wordt de
      woningwaarde gesteld op het gedeelte van de waarde van de onroerende zaak dat kan worden toegerekend aan die
      woning.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 3.19.4
    text: |-
      Indien met betrekking tot een woning het derde lid geen toepassing kan vinden door het ontbreken van een op
      grond van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] vastgestelde waarde, is de woningwaarde
      de waarde van de woning die wordt bepaald met overeenkomstige toepassing van het bepaalde bij of krachtens de
      [artikelen 16 tot en met 19][ref2], [20, tweede lid][ref3], en [22, derde lid, van die wet][ref4] en van het derde
      lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 3.19.5
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
  - number: 3.19.5.a
    text: |-
      wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip of woonwagen in de zin van
      [artikel 1 van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 3.19.5.b
    text: |-
      blijft onder woning begrepen een werkruimte waarvan de kosten en lasten, indien die werkruimte niet tot het
      ondernemingsvermogen zou behoren, ingevolge [artikel 3.16, eerste lid][ref1], niet in aftrek zouden komen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.20.1
    text: |-
      Indien aan de belastingplichtige ook voor privé-doeleinden een auto ter beschikking staat, wordt op jaarbasis ten
      minste 22% van de waarde van de auto als onttrekking in aanmerking genomen. De auto wordt in ieder geval geacht
      ook voor privé-doeleinden ter beschikking te staan tenzij blijkt dat de auto op jaarbasis voor niet meer dan 500
      kilometer voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Indien uit een rittenregistratie of anderszins blijkt dat de auto op jaarbasis voor niet meer dan 500 kilometer
      voor privé-doeleinden wordt gebruikt, wordt de onttrekking gesteld op nihil.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt onder auto verstaan een personenauto of
      bestelauto als bedoeld in [artikel 3 van de Wet op de belasting van personenauto's en motorrijwielen 1992][ref1],
      met uitzondering van de bestelauto die door aard of inrichting uitsluitend of nagenoeg uitsluitend geschikt blijkt
      te zijn voor vervoer van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 3.20.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld waaraan een rittenregistratie moet voldoen. Tevens kunnen
      regels worden gesteld over het anderszins laten blijken dat de auto op jaarbasis voor niet meer dan 500 kilometer
      voor privé-doeleinden wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: 3.20.5
    text: |-
      Voor de toepassing van het eerste lid wordt de waarde van de auto gesteld op de catalogusprijs met inbegrip van de
      omzetbelasting en de belasting van personenauto's en motorrijwielen. In afwijking in zoverre van de eerste volzin
      wordt de waarde van een auto die meer dan vijftien jaar geleden voor het eerst in gebruik is genomen, gesteld op de
      waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: 3.20.6
    text: |-
      De onttrekking wordt in aanmerking genomen voorzover zij uitgaat boven de bedragen die de belastingplichtige ter
      zake van de kosten en lasten van de auto voor eigen rekening heeft genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: 3.20.7
    text: Voor de toepassing van dit artikel wordt woon-werkverkeer geacht niet voor privé-doeleinden plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      Bij het bepalen van de winst wordt mede in aanmerking genomen de nominale waarde van aandelen die
      worden uitgereikt door een lichaam dat wordt aangemerkt als beleggingsinstelling als bedoeld in
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1], voorzover niet blijkt dat storting heeft
      plaatsgevonden of zal plaatsvinden. Bijschrijving op die aandelen wordt met uitreiking van aandelen gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 3.22.1
    text: |-
      Op verzoek van de belastingplichtige wordt, in afwijking van de [artikelen 3.8 tot en met 3.20][ref1],
      [3.25 tot en met 3.65][ref2], en [3.79][ref3], de winst uit zeescheepvaart bepaald aan de hand van de tonnage van
      de schepen waarmee die winst wordt behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.4
        afdeling: '3.2'
  - number: 3.22.2
    text: |-
      Het verzoek wordt gedaan in het eerste jaar waarin de belastingplichtige uit de desbetreffende onderneming winst
      uit zeescheepvaart geniet, dan wel in het tiende jaar of een veelvoud daarvan nadien. De inspecteur beslist op het
      verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Bij inwilliging van het verzoek geldt dit met ingang van het jaar waarin het verzoek is gedaan en tot
      wederopzegging door de belastingplichtige, waarbij wederopzegging alleen mogelijk is met ingang van het tiende jaar
      of een veelvoud daarvan na het einde van het jaar met ingang waarvan de winst uit zeescheepvaart wordt bepaald aan
      de hand van de tonnage.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Voor de toepassing van dit artikel, [artikel 3.23][ref1] en [artikel 3.24][ref2] wordt onder de winst uit
      zeescheepvaart verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.22.4.a
    text: |-
      de winst behaald met de exploitatie van een schip bestemd voor het vervoer van zaken of personen in het
      internationale verkeer over zee dan wel voor het vervoer van zaken of personen over zee ten behoeve van de
      exploratie of exploitatie van natuurlijke rijkdommen op zee;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.4.b
    text: |-
      de winst behaald met de exploitatie van een schip bestemd voor baggerwerkzaamheden op zee waarvan de jaarlijkse
      bedrijfstijd grotendeels uit zeevervoer bestaat of voor het verrichten van sleep- of hulpwerkzaamheden, op zee
      aan schepen als bedoeld in [artikel 1, tweede lid, van de Schepenwet][ref1], niet zijnde een schip waarvan het
      geheel van werkzaamheden en activiteiten grotendeels bestaat uit het meren, ontmeren en verhalen van zeeschepen die
      gebruik maken van eigen voortstuwing en die inkomen van of uitgaan naar zee, en


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 3.22.4.c
    text: |-
      de winst behaald met de werkzaamheden die direct samenhangen met de in onderdeel a en b bedoelde exploitatie van
      een schip.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5
    text: |-
      Voor de toepassing van dit artikel, [artikel 3.23][ref1] en [artikel 3.24][ref2] is sprake van exploitatie van een
      schip, indien de belastingplichtige:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.22.5.a
    text: |-
      in Nederland in belangrijke mate het beheer verricht van het schip, het schip de vlag voert van een van de
      lidstaten van de Europese Gemeenschap of van de Europese Economische Ruimte en de belastingplichtige het schip:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5.a.1°
    text: in eigendom heeft of mede in eigendom heeft en niet in rompbevrachting heeft gegeven, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5.a.2°
    text: in rompbevrachting houdt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5.b
    text: |-
      in Nederland hoofdzakelijk het commerciële beheer verricht van het schip voor een ander, mits de belastingplichtige
      daarnaast een of meer schepen beheert op een wijze als bedoeld in de aanhef en onderdeel a, waarbij schepen in
      mede-eigendom alleen in aanmerking worden genomen indien die mede-eigendom ten minste 5% beloopt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5.c
    text: |-
      het schip in tijd- of reischarter houdt, mits de belastingplichtige daarnaast een of meer schepen beheert op een
      wijze als bedoeld in de aanhef en onderdeel a, waarbij schepen in mede-eigendom alleen in aanmerking worden genomen
      indien die mede-eigendom ten minste 5% beloopt, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.5.d
    text: in Nederland voor een ander het volledige bemanning- en technische beheer verricht van het schip.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.6
    text: |-
      In afwijking van het vijfde lid, onderdeel a, is de voorwaarde dat het schip de vlag voert van een van de lidstaten
      van de Europese Gemeenschap of van de Europese Economische Ruimte niet van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.6.a
    text: |-
      direct voorafgaand aan het moment van in gebruik nemen van het schip door de belastingplichtige, de netto-tonnage
      van de reeds door hem geëxploiteerde kwalificerende schepen die de vlag voeren van een van de lidstaten van de
      Europese Gemeenschap of van de Europese Economische Ruimte, als percentage van de totale netto-tonnage van de reeds
      door hem geëxploiteerde kwalificerende schepen, niet is afgenomen ten opzichte van het overeenkomstig berekende
      percentage op 17 januari 2004 dan wel, zo dit later is, het overeenkomstig berekende percentage aan het einde van
      het boekjaar waarin de belastingplichtige voor het eerst de winst uit zeescheepvaart heeft bepaald overeenkomstig
      het eerste lid, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.6.b
    text: |-
      direct voorafgaand aan het moment van in gebruik nemen van het schip door de belastingplichtige, de netto-tonnage
      van de reeds door hem geëxploiteerde kwalificerende schepen die de vlag voeren van een van de lidstaten van de
      Europese Gemeenschap of van de Europese Economische Ruimte, ten minste 60 procent bedraagt van de totale netto-
      tonnage van de reeds door hem geëxploiteerde kwalificerende schepen, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.6.c
    text: |-
      met betrekking tot het kalenderjaar van het in gebruik nemen van het schip door de belastingplichtige, voor
      de aanvang van dat jaar bij ministeriële regeling is bepaald dat op landelijk niveau de netto-tonnage van
      kwalificerende schepen die de vlag voeren van een van de lidstaten van de Europese Gemeenschap of van de Europese
      Economische Ruimte als percentage van de netto-tonnage van kwalificerende schepen in een bepaalde periode
      vergeleken met de daaraan voorafgaande periode, niet is afgenomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.7
    text: |-
      Van de toepassing van het zesde lid zijn uitgesloten schepen waarmee winst uit zeescheepvaart wordt behaald als
      bedoeld in het vierde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.8
    text: |-
      Voor de toepassing van het zesde lid en het negende lid wordt onder kwalificerende schepen verstaan: schepen
      waarvan de winst wordt bepaald overeenkomstig het eerste lid en die in eigendom of mede-eigendom zijn van de
      belastingplichtige of door hem in rompbevrachting worden gehouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.9
    text: |-
      Voor de toepassing van het zesde lid, onderdeel a, worden mede in aanmerking genomen schepen die worden
      geëxploiteerd door lichamen waarin de belastingplichtige direct of indirect overwegende zeggenschap heeft als
      bedoeld in artikel 1 van de Zevende Richtlijn nr. 1983/349/EEG van de Raad van de Europese Unie van 13 juni 1983
      betreffende de geconsolideerde jaarrekening (Pb EG, nr. L 193), voorzover het betreft kwalificerende schepen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.10
    text: |-
      Het in het zesde lid, onderdeel c, bedoelde percentage over een periode wordt berekend als gemiddelde over drie
      aaneengesloten kalenderjaren (tijdvak), waarbij het laatste tijdvak eindigt één jaar voor het kalenderjaar en
      het daarvoor gelegen tijdvak eindigt twee jaar vóór het kalenderjaar. De in het zesde lid, onderdeel c, bedoelde
      ministeriële regeling wordt vastgesteld in overeenstemming met onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.11
    text: |-
      Indien de voor rekening van de belastingplichtige gedreven onderneming deel uitmaakt van een samenwerkingsverband
      met een of meer andere natuurlijke personen of rechtspersonen, worden voor de beoordeling of bij de
      belastingplichtige sprake is van exploitatie van een schip als bedoeld in het vijfde en zesde lid, de werkzaamheden
      die door die anderen ten behoeve van het samenwerkingsverband plaatsvinden, toegerekend aan de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
  - number: 3.22.12
    text: |-
      Voor de toepassing van dit artikel en [artikel 3.23][ref1] wordt onder zee verstaan alle wateren die zich bevinden
      voorbij de laagwaterlijn van de kust van elk van de Lidstaten van de Europese Gemeenschap. Indien een transport
      over zee plaatsvindt met inbegrip van transport over een vaarweg die voorkomt op de lijst van waterwegen van
      maritieme aard, zoals opgenomen in bijlage I van de verordening (EG) nr. 13/2004 van de Commissie van de Europese
      Gemeenschap van 8 december 2003 (Pb EU, nr. L3), wordt het transport voor het gehele traject geacht transport over
      zee te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.22.13
    text: |-
      Voor de toepassing van dit artikel, [artikel 3.23][ref1] en [artikel 3.24][ref2], kunnen bij ministeriële regeling
      nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.23.1
    text: |-
      Bij inwilliging van het in [artikel 3.22, eerste lid][ref1], bedoelde verzoek wordt de in een kalenderjaar genoten
      winst uit zeescheepvaart per schip vastgesteld aan de hand van de in de volgende tabel aangegeven bedragen per dag.






                    Bedrag per dag per 1000 nettoton






                    € 9,08


                    tot 1000 nettoton




                    € 6,81


                    voor het meerdere tot 10 000 nettoton




                    € 4,54


                    voor het meerdere tot 25 000 nettoton




                    € 2,27


                    voor het meerdere boven 25 000 nettoton




           Met betrekking tot schepen bestemd voor baggerwerkzaamheden op zee of voor het verrichten van sleep- of
      hulpverleningswerkzaamheden op zee aan schepen als bedoeld in [artikel 1, tweede lid, van de Schepenwet][ref2],
      wordt de volgens de eerste volzin vastgestelde winst vermeerderd met de winst die is behaald met werkzaamheden
      andere dan vervoer van opgebaggerd materiaal over zee of sleep- of hulpverleningswerkzaamheden op zee.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 3.23.2
    text: |-
      Bij inwilliging van het verzoek wordt tot de winst van het jaar waarin het verzoek wordt gedaan, mede gerekend
      het gezamenlijke bedrag – dat is bepaald naar de toestand op het tijdstip dat onmiddellijk aan dat jaar voorafgaat
      – van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
  - number: 3.23.2.a
    text: |-
      de op grond van de [artikelen 3.53][ref1] en [3.54][ref2] gevormde reserves van de onderneming die verband houden
      met de zeescheepvaart en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.23.2.b
    text: |-
      een bedrag ter grootte van het positieve verschil tussen de waarde die in het economische verkeer wordt toegekend
      aan de zaken die door de onderneming worden gebruikt voor het behalen van winst uit zeescheepvaart en de waarde
      waarvoor deze zaken op dat tijdstip te boek zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Het in het tweede lid bedoelde gezamenlijke bedrag blijft buiten aanmerking voorzover dit het bedrag waarvoor
      de belastingplichtige op het in de aanhef van dat lid bedoelde tijdstip aanspraak kan maken op verrekening van
      verliezen volgens [afdeling 3.13][ref1], te boven gaat. De inspecteur stelt het bedrag dat buiten aanmerking
      blijft, per onderneming vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 3.23.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de toepassing van het eerste lid, tweede volzin,
      alsmede ter voorkoming van cumulatie tussen de eerste volzin en de tweede volzin van dat lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.23
  - number: 3.24.1
    text: |-
      Het bedrag dat op grond van [artikel 3.23, derde lid][ref1], buiten aanmerking is gebleven, wordt alsnog tot
      de winst gerekend indien de belastingplichtige – anders dan door overlijden – binnen tien jaar na het tijdstip
      met ingang waarvan de winst uit zeescheepvaart wordt bepaald aan de hand van de tonnage, de onderneming waarmee
      in Nederland winst uit zeescheepvaart wordt behaald, voor het geheel of voor een gedeelte staakt. In geval van
      staking voor een gedeelte wordt het in de vorige volzin bedoelde bedrag alleen tot de winst gerekend voorzover dat
      betrekking heeft op dat gedeelte. Het bedrag dat alsnog tot de winst wordt gerekend, wordt geacht te zijn genoten
      ten tijde van de staking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.24.2
    text: |-
      Een schip dat wordt gebruikt voor het behalen van winst uit zeescheepvaart wordt, op het tijdstip waarop de winst
      uit dat schip niet meer wordt bepaald aan de hand van de tonnage, gewaardeerd op de waarde in het economische
      verkeer verminderd – maar niet verder dan tot nihil – met het bedrag dat met betrekking tot dat schip ingevolge
      [artikel 3.23, derde lid][ref1], buiten aanmerking is gebleven, tenzij tien jaren na het tijdstip met ingang
      waarvan de winst uit dat schip aan de hand van de tonnage wordt bepaald, zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.24.3
    text: |-
      De zaken die worden gebruikt voor het behalen van winst uit zeescheepvaart, worden op het tijdstip waarop na
      wederopzegging [artikel 3.22, eerste lid][ref1], niet meer van toepassing is, te boek gesteld voor de waarde in het
      economische verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.24.4
    text: |-
      Voor de toepassing van het eerste lid wordt niet als staking aangemerkt een doorschuiving bij ontbinding van
      de huwelijksgemeenschap als bedoeld in [artikel 3.59][ref1], een doorschuiving naar ondernemers als bedoeld in
      [artikel 3.63][ref2] of een omzetting als bedoeld in [artikel 3.65][ref3] mits de belastingplichtige, alsmede
      in geval van een doorschuiving tevens degene aan wie is overgedragen, dit verzoekt. In dat geval wordt degene
      aan wie is overgedragen, respectievelijk de vennootschap waarin de onderneming is omgezet, voor de toepassing
      van dit artikel en de [artikelen 3.22][ref4] en [3.23][ref5] geacht in de plaats te zijn getreden van de
      belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.25'
    text: |-
      De in een kalenderjaar genoten winst wordt bepaald volgens goed koopmansgebruik, met inachtneming van een
      bestendige gedragslijn die onafhankelijk is van de vermoedelijke uitkomst. De bestendige gedragslijn kan alleen
      worden gewijzigd indien goed koopmansgebruik dit rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.25
  - number: 3.26.1
    text: |-
      Bij het bepalen van de in een kalenderjaar genoten winst blijven kosten en lasten voorzover deze, al dan niet door
      tussenkomst van derden, rechtstreeks of zijdelings verband houden met wijzigingen in de hoogte van lonen of prijzen
      na afloop van het jaar, buiten aanmerking, ook al zou de omvang van deze kosten en lasten reeds bij het einde van
      het jaar vaststaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.26
  - number: 3.26.2
    text: |-
      De in het eerste lid bedoelde kosten en lasten komen in aanmerking bij het bepalen van de winst van de op het
      kalenderjaar volgende jaren en wel naar gelang de wijzigingen optreden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Ten aanzien van een onderneming die het schadeverzekeringsbedrijf uitoefent, is het eerste lid niet van toepassing
      op kosten en lasten die betrekking hebben op overeenkomsten van schadeverzekering, voorzover uit de overeenkomsten
      verplichtingen voortvloeien ter zake van schaden aan de gezondheid van natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.26
  - number: 3.27.1
    text: |-
      De in [artikel 3.26][ref1] bedoelde kosten en lasten worden in afwijking van dat artikel uiterlijk in aanmerking
      genomen in het jaar van betaling. Daarbij wordt een betaling vóór de aanvang van het kalenderjaar of binnen zes
      maanden na afloop van het kalenderjaar gelijkgesteld met een betaling in het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.27.2
    text: |-
      Het eerste lid is voor pensioenvoorzieningen – voorzover niet uitgezonderd in het derde lid – van toepassing indien
      de betalingen plaatsvinden in de vorm van krachtens een *pensioenregeling* verschuldigde premies of koopsommen
      aan een pensioenfonds of een verzekeringsmaatschappij. Daarbij blijft het in de premies of koopsommen begrepen
      bestanddeel voor toekomstige wijzigingen in de hoogte van lonen of prijzen buiten aanmerking voorzover dit
      bestanddeel uitgaat boven het bedrag dat nodig is om de opgebouwde pensioenrechten, ter zake waarvan aan het fonds
      of de maatschappij geen premies of koopsommen meer moeten worden betaald, te kunnen aanpassen aan een wijziging in
      de hoogte van lonen of prijzen van 4% per jaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
  - number: 3.27.3
    text: |-
      Het eerste lid is voor pensioenvoorzieningen alleen van toepassing op betalingen die worden verricht aan een
      lichaam dat:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
  - number: 3.27.3.a
    text: |-
      bevoegd is het directe verzekeringsbedrijf, bedoeld in de [Wet toezicht verzekeringsbedrijf 1993][ref1], uit te
      oefenen of


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 3.27.3.b
    text: |-
      volgens [artikel 5, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref1] is vrijgesteld van die
      belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: 3.27.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld, volgens welke, zo nodig onder te stellen voorwaarden, kan
      worden afgeweken van het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.27
  - number: '3.28'
    text: |-
      Voor de toepassing van de [artikelen 3.26][ref1] en [3.27][ref2] wordt een verband met wijzigingen in de
      hoogte van lonen of prijzen na afloop van het jaar ten aanzien van kosten en lasten die betrekking hebben op
      pensioenvoorzieningen, niet aanwezig geacht, indien die kosten en lasten betrekking hebben op een pensioengrondslag
      die is gebaseerd op een loon dat niet uitgaat boven het loon bij het einde van het jaar, en bij de berekening van
      die kosten en lasten in feite een rekenrente in aanmerking is genomen van ten minste 4%.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.29'
    text: |-
      De waardering van pensioenverplichtingen en andere soortgelijke verplichtingen vindt plaats met inachtneming van
      algemeen aanvaarde actuariële grondslagen, waarbij een rekenrente in aanmerking wordt genomen van ten minste 4%.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.29
  - number: 3.30.1
    text: |-
      De afschrijving op goederen die voor het drijven van een onderneming worden gebruikt (bedrijfsmiddelen), wordt
      jaarlijks gesteld op het gedeelte van de nog niet afgeschreven aanschaffings- of voortbrengingskosten dat aan het
      kalenderjaar kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.30
  - number: 3.30.2
    text: |-
      De werkelijke aanschaffings- of voortbrengingskosten van voorwerpen van geringe waarde, waarvan de aanschaffings-
      of voortbrengingskosten gewoonlijk tot de lopende uitgaven van een onderneming worden gerekend, worden in het
      kalenderjaar van aanschaffing of voortbrenging ineens afgeschreven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.30
  - number: 3.31.1
    text: |-
      De aanschaffings- of voortbrengingskosten van bedrijfsmiddelen die zijn aangewezen als bedrijfsmiddelen die
      in het belang zijn van de bescherming van het Nederlandse milieu (milieu-bedrijfsmiddelen) kunnen door de
      belastingplichtige willekeurig worden afgeschreven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.31
  - number: 3.31.2
    text: |-
      Bij ministeriële regeling kunnen milieu-bedrijfsmiddelen worden aangewezen door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze Minister en na overleg met Onze Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.31
  - number: 3.31.3
    text: |-
      Als milieu-bedrijfsmiddelen kunnen uitsluitend worden aangewezen bedrijfsmiddelen die in Nederland nog niet
      gangbaar zijn, niet eerder zijn gebruikt en er in belangrijke mate toe kunnen bijdragen dat de nadelige gevolgen
      voor het Nederlandse milieu van menselijke activiteiten – daaronder begrepen het verbruik van grondstoffen – in de
      vorm van verontreiniging, aantasting of uitputting worden voorkomen, beperkt of ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.31
  - number: 3.31.4
    text: |-
      Op milieu-bedrijfsmiddelen die bestemd zijn om te worden gebruikt buiten Nederland, kan alleen willekeurig
      worden afgeschreven indien op een door de belastingplichtige gedaan schriftelijk verzoek door Onze Minister in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer is verklaard dat het
      gebruik van de bedrijfsmiddelen in belangrijke mate kan bijdragen aan de bescherming van het Nederlandse milieu.
      Het verzoek wordt gedaan binnen een door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.31
  - number: 3.34.1
    text: |-
      De aanschaffings- of voortbrengingskosten van bedrijfsmiddelen die door Onze Minister in overeenstemming met Onze
      Minister van Economische Zaken bij ministeriële regeling zijn aangewezen (andere aangewezen bedrijfsmiddelen)
      kunnen door de belastingplichtige willekeurig worden afgeschreven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.34
  - number: 3.34.2
    text: |-
      Als andere aangewezen bedrijfsmiddelen kunnen uitsluitend worden aangewezen bedrijfsmiddelen die in het belang zijn
      van de bevordering van de economische ontwikkeling of de economische structuur, daaronder begrepen de bevordering
      van het ondernemerschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.34
  - number: 3.34.3
    text: |-
      In de in het eerste lid bedoelde ministeriële regeling kan worden bepaald dat de willekeurige afschrijving
      wordt beperkt tot aangewezen gebieden of tot aangewezen groepen van belastingplichtigen. Daarbij kunnen nadere
      voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.34
  - number: 3.34a
    text: |-
      Voor de willekeurige afschrijving blijft een vermindering van de aanschaffings- of voortbrengingskosten ingevolge
      een herinvesteringsreserve als bedoeld in artikel 3.54 buiten aanmerking. Daarbij wordt het bedrag van die
      vermindering geacht willekeurig te zijn afgeschreven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.34a
  - number: '3.35'
    text: |-
      Willekeurige afschrijving is mogelijk zodra ter zake van de verwerving of verbetering van het bedrijfsmiddel
      verplichtingen zijn aangegaan of ter zake van het bedrijfsmiddel voortbrengingskosten zijn gemaakt. Het bedrag van
      de willekeurige afschrijving kan voor de ingebruikneming van het bedrijfsmiddel niet groter zijn dan het bedrag dat
      ter zake van de verplichtingen is betaald, of aan voortbrengingskosten is gemaakt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.35
  - number: 3.36.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat willekeurige afschrijving alleen mogelijk is indien de aangegane
      verplichtingen of de in het jaar gemaakte voortbrengingskosten zijn aangemeld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.36
  - number: 3.36.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid, en wel
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.36
  - number: 3.36.2.a
    text: |-
      indien het milieu-bedrijfsmiddelen betreft: in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.36
  - number: 3.36.2.b
    text: 'indien het andere aangewezen bedrijfsmiddelen betreft: in overeenstemming met Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.36
  - number: 3.37.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de willekeurige afschrijving op andere aangewezen bedrijfsmiddelen
      alleen van toepassing is indien op een door of namens de belastingplichtige gedaan verzoek door Onze Minister van
      Economische Zaken is verklaard dat sprake is van een aangewezen bedrijfsmiddel. Bij die regeling kunnen tevens
      nadere regels worden gesteld met betrekking tot de verklaring.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.37
  - number: 3.37.2
    text: |-
      Tegen de in het eerste lid bedoelde verklaring staat beroep open bij het College van Beroep voor het bedrijfsleven.
      Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en Onze Minister
      van Economische Zaken beroep in cassatie instellen ter zake van schending of verkeerde toepassing van het eerste
      lid met betrekking tot het begrip bedrijfsmiddelen. Op dit beroep zijn de voorschriften betreffende het beroep in
      cassatie tegen uitspraken van de gerechtshoven inzake beroepen in belastingzaken van overeenkomstige toepassing,
      waarbij het College van Beroep voor het bedrijfsleven de plaats inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.37
  - number: '3.38'
    text: |-
      Indien op een bedrijfsmiddel willekeurig is afgeschreven en op enig tijdstip binnen een bij ministeriële regeling
      te bepalen periode niet langer wordt voldaan aan de bij of krachtens de [artikelen 3.31][ref1] en [3.34][ref2]
      gestelde voorwaarden met betrekking tot dat bedrijfsmiddel, wordt op dat tijdstip de boekwaarde van het
      bedrijfsmiddel gesteld op de boekwaarde die zou zijn bereikt indien geen willekeurige afschrijving zou hebben
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.39'
    text: |-
      Afschrijving op bedrijfsmiddelen vindt plaats volgens de regels voor het tijdvak waarin voor de verwerving of de
      verbetering van het bedrijfsmiddel verplichtingen zijn aangegaan of voortbrengingskosten zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.39
  - number: '3.40'
    text: |-
      Indien wordt geïnvesteerd in bedrijfsmiddelen kan door de belastingplichtigenaast de afschrijvingen een deel van
      het investeringsbedrag aanvullend ten laste van de winst worden gebracht (investeringsaftrek). Investeringsaftrek
      kan de vorm hebben van kleinschaligheidsinvesteringsaftrek, van energie-investeringsaftrek en van milieu-
      investeringsaftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.40
  - number: 3.41.1
    text: |-
      Indien in een kalenderjaar wordt geïnvesteerd in bedrijfsmiddelen, en de belastingplichtige daarvoor bij de
      aangifte kiest, wordt een in het tweede lid aangewezen percentage van het investeringsbedrag ten laste gebracht van
      de winst over dat jaar (kleinschaligheidsinvesteringsaftrek).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Bij een investeringsbedrag in een kalenderjaar van:







                    meer dan


                    maar niet meer dan


                    bedraagt het percentage






                    –


                    € 2 100


                    0




                    € 2 100


                    € 35 000


                    25




                    € 35 000


                    € 67 000


                    22




                    € 67 000


