  - number: 6.18.3
    text: |-
      Indien de belastingplichtige gedurende het gehele jaar een *partner* heeft, worden de uitgaven voor gezinshulp
      samengevoegd. Over deze periode geldt voor de toepassing van het tweede lid in plaats van het verzamelinkomen vóór
      toepassing van de persoonsgebonden aftrek het gezamenlijke bedrag van de verzamelinkomens van de belastingplichtige
      en zijn partner vóór toepassing van de persoonsgebonden aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.18
  - number: 6.18.4
    text: |-
      Indien de belastingplichtige gedurende een deel van het kalenderjaar een partner heeft en zij een keuze als bedoeld
      in [artikel 2.17, zevende lid][ref1], hebben gemaakt, wordt de belastingplichtige voor de toepassing van het derde
      lid geacht gedurende het gehele kalenderjaar een partner te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.18
