valid_from: '2006-01-01'
bwb_id: BWBR0011353
url: https://wetten.overheid.nl/BWBR0011353/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de grondslag van de belasting op inkomen te
    verbreden en te versterken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Onder de naam inkomstenbelasting wordt een belasting geheven van natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.1
  - number: 1.2.1
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder *partner*:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.1.a
    text: de niet duurzaam gescheiden levende echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.1.b
    text: 'de ongehuwde meerderjarige die:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.1.b.1°
    text: |-
      met de ongehuwde meerderjarige belastingplichtige in het kalenderjaar gedurende meer dan zes maanden onafgebroken
      een gezamenlijke huishouding voert en gedurende die tijd op hetzelfde woonadres als de belastingplichtige staat
      ingeschreven in de basisadministratie persoonsgegevens en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.1.b.2°
    text: samen en uitsluitend met de belastingplichtige voor het kalenderjaar kiest voor kwalificatie als partner.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.2
    text: 'Voor het kalenderjaar kan tevens voor kwalificatie als partner worden gekozen indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.2.a
    text: |-
      de ongehuwde meerderjarige belastingplichtige in het voorafgaande kalenderjaar samen met een ongehuwde
      meerderjarige heeft gekozen voor kwalificatie als partner en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.2.b
    text: |-
      zij uitsluitend door het overlijden van de ongehuwde meerderjarige in het kalenderjaar niet gedurende meer dan zes
      maanden een gezamenlijke huishouding hebben gevoerd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.3
    text: 'Als partner kan niet worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.3.a
    text: |-
      een bloedverwant in de eerste graad van de belastingplichtige, tenzij beiden bij de aanvang van het kalenderjaar de
      leeftijd van 27 jaar hebben bereikt of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.3.b
    text: een persoon die geen inwoner is van Nederland en niet kiest voor behandeling als binnenlandse belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.4
    text: |-
      Een persoon die duurzaam gescheiden van zijn echtgenoot leeft, wordt voor de toepassing van dit artikel
      gelijkgesteld met een ongehuwde.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.5
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt voor de bepaling van aanverwantschap de
      kwalificatie als partner gelijkgesteld met het huwelijk.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.2.6
    text: |-
      Indien een persoon meer dan één niet duurzaam gescheiden levende echtgenoot heeft, wordt alleen de echtgenoot uit
      de oudste verbintenis als partner aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      De gezamenlijke keuze van de belastingplichtige en de andere ongehuwde meerderjarige voor de kwalificatie als
      *partner* wordt gemaakt bij verzoeken in verband met voorlopige teruggaaf of bij aangifte.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      De keuze voor de kwalificatie als partner geldt – tot herziening met ingang van een kalenderjaar – voor de periode
      waarin de ongehuwde meerderjarige met de belastingplichtige onafgebroken een gezamenlijke huishouding voert en op
      hetzelfde woonadres als de belastingplichtige staat ingeschreven in de basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.3
  - number: 1.3.3
    text: |-
      Indien de belastingplichtige een keuze heeft gemaakt voor de kwalificatie als partner van een ander, wordt deze
      ander ten aanzien van de belastingplichtige als partner aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.3
  - number: 1.3.4
    text: |-
      Een bij de aangifte gemaakte keuze voor de kwalificatie als partner kan voor het desbetreffende kalenderjaar niet
      worden herzien.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder een *kind* mede verstaan een
      pleegkind, ook wat betreft bloed- en aanverwantschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen kunnen bij ministeriële regeling regels worden
      gesteld op grond waarvan wordt beoordeeld of een *kind* in belangrijke mate wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.5
  - number: '1.6'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden de landen van het Koninkrijk der
      Nederlanden aangemerkt als afzonderlijke mogendheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.6
  - number: 1.7.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder *lijfrente*: een aanspraak volgens
      een overeenkomst van *levensverzekering* ([artikel 3.117][ref1]) op vaste en gelijkmatige periodieke
      uitkeringen die eindigen uiterlijk bij overlijden, welke aanspraak niet kan worden afgekocht, vervreemd,
      prijsgegeven, of formeel of feitelijk tot voorwerp van zekerheid kan dienen, anders dan op grond van
      [artikel 3.126, eerste lid, onderdeel d, onder 2°][ref2], of ten behoeve van uitstel van betaling op grond van
      [artikel 25, vijfde lid, Invorderingswet 1990][ref3]. Onder een lijfrente wordt mede verstaan de aanspraak op
      winstuitkeringen voorzover die uitkeringen verband houden met een lijfrente.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref3
