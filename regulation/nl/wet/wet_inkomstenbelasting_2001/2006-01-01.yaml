        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.44.2
    text: |-
      Bij het staken van de onderneming en bij de eindafrekening als bedoeld in [artikel 3.61][ref1] wordt de
      investeringsaftrek voor het geheel in aanmerking genomen in het jaar van staking, respectievelijk eindafrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.45.1
    text: 'Voor de investeringsaftrek behoren niet tot de bedrijfsmiddelen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.a
    text: bedrijfsmiddelen waarvan het investeringsbedrag minder bedraagt dan € 450;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.b
    text: 'bedrijfsmiddelen die zijn bestemd om – direct of indirect – hoofdzakelijk te worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.b.1°
    text: |-
      voor de uitoefening van het bosbedrijf als bedoeld in [artikel 3.11, eerste lid][ref1], tenzij de voordelen daaruit
      volgens [artikel 3.11, tweede lid][ref2], tot de winst behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.45.1.b.2°
    text: |-
      voor het drijven van een onderneming, of een gedeelte van een onderneming, op de winst waarvan een regeling ter
      voorkoming van dubbele belasting van toepassing is;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.c
    text: |-
      gronden, met inbegrip van de ondergrond van gebouwen, met uitzondering van verbetering van grond indien de
      verbeteringskosten plegen te worden afgeschreven;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.d
    text: woonhuizen en woonschepen, met inbegrip van de gedeelten van andere zaken die dienen voor bewoning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.e
    text: |-
      personenauto's als bedoeld in [artikel 3 van de Wet op de belasting van personenauto's en motorrijwielen 1992][ref1],
      die niet zijn bestemd voor het beroepsvervoer over de weg;


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0005806
        artikel: '3'
  - number: 3.45.1.f
    text: |-
      vaartuigen als bedoeld in [artikel 3.14][ref1], eerste lid, onderdeel b;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.45.1.g
    text: |-
      effecten, vorderingen, goodwill alsmede vergunningen, ontheffingen, concessies en andere dispensaties van
      publiekrechtelijke aard en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.1.h
    text: dieren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.2
    text: |-
      Voor de kleinschaligheidsinvesteringsaftrek behoren tot de bedrijfsmiddelen mede niet bedrijfsmiddelen die zijn
      bestemd om – direct of indirect – hoofdzakelijk ter beschikking te worden gesteld aan derden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.3
    text: |-
      Voor de energie-investeringsaftrek en de milieu-investeringsaftrek behoren tot de bedrijfsmiddelen mede niet
      bedrijfsmiddelen die zijn bestemd om – direct of indirect – hoofdzakelijk ter beschikking te worden gesteld aan:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.3.a
    text: niet in Nederland wonende natuurlijke personen of gevestigde lichamen of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.3.b
    text: |-
      natuurlijke personen of lichamen voor het drijven van een onderneming of een gedeelte van een onderneming, op de
      winst waarvan een regeling ter voorkoming van dubbele belasting van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.45.4
    text: Onze Minister kan bepalen dat het eerste lid, onderdeel b, onder 2°, en het derde lid niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.45
  - number: 3.46.1
    text: 'Voor de investeringsaftrek worden niet in aanmerking genomen verplichtingen aangegaan tussen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.46.1.a
    text: de belastingplichtige en personen die tot zijn huishouden behoren;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.46.1.b
    text: bloed- of aanverwanten in de rechte lijn of personen die behoren tot hun huishouden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.46.1.c
    text: gerechtigden tot een nalatenschap waartoe het bedrijfsmiddel behoort of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.46.1.d
    text: degene die voor ten minste een derde gedeelte belang heeft in een lichaam en dat lichaam.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.46.2
    text: Onze Minister kan bepalen dat het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.46
  - number: 3.47.1
    text: |-
      Indien in een kalenderjaar tegen overdrachtsprijzen voor een bedrag van meer dan € 2100 aan goederen wordt
      vervreemd, wordt van de overdrachtsprijzen een gelijk percentage als ter zake van de investering in die
      goederen als investeringsaftrek in aanmerking is genomen, ten bate van de winst over dat jaar gebracht
      (desinvesteringsbijtelling).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.2
    text: |-
      Desinvesteringsbijtelling heeft alleen plaats voorzover de vervreemding plaatsvindt binnen vijf jaar na het begin
      van het kalenderjaar waarin de investering heeft plaatsgevonden en wordt over geen hoger bedrag berekend dan het
      investeringsbedrag voorzover daarover investeringsaftrek in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.3
    text: 'Met vervreemding wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.3.a
    text: het onttrekken van een goed aan de onderneming;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.3.b
    text: |-
      het wijzigen van de bestemming van een goed zodanig dat dit gaat voldoen aan de omschrijving
      van[ artikel 3.45, tweede en derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.47.3.c
    text: |-
      het wijzigen van de bestemming van een goed zodanig dat dit gaat voldoen aan de omschrijving van
      [artikel 3.45, eerste lid, onderdeel b, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.47.4
    text: Voor de toepassing van het derde lid geldt de waarde in het economische verkeer van het goed als overdrachtsprijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.5
    text: |-
      Indien een investering ongedaan wordt gemaakt, of voor een investering een vermindering, teruggaaf of vergoeding
      wordt genoten, geldt dat als vervreemding van een goed en geldt het bedrag van die investering, vermindering,
      teruggaaf of vergoeding als overdrachtsprijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.6
    text: 'Onder ongedaan maken van een investering wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.6.a
    text: |-
      het niet betaald zijn binnen twaalf maanden na het aangaan van de verplichting van ten minste 25% van het
      investeringsbedrag ter zake van die verplichting, tenzij het bedrijfsmiddel binnen die periode in gebruik is
      genomen en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.6.b
    text: |-
      het niet in gebruik genomen zijn van een bedrijfsmiddel binnen drie jaar na het begin van het kalenderjaar waarin
      de investering is gedaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: 3.47.7
    text: Onze Minister kan bepalen dat het derde lid, onderdeel c, of het zesde lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.47
  - number: '3.51'
    text: |-
      De investeringsaftrek en de desinvesteringsbijtelling vinden plaats volgens de regels voor het tijdvak waarin de
      investering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.51
  - number: 3.52.1
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.1.a
    text: |-
      kan de willekeurige afschrijving in het algemeen of voor bepaalde aangewezen bedrijfsmiddelen of bepaalde groepen
      van aangewezen bedrijfsmiddelen buiten toepassing worden gesteld, of per kalenderjaar worden beperkt, en wel:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.1.a.1°
    text: |-
      indien het milieu-bedrijfsmiddelen betreft: na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer en Onze Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.1.a.2°
    text: 'indien het andere aangewezen bedrijfsmiddelen betreft: na overleg met Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.1.b
    text: |-
      kunnen de in [artikel 3.41, tweede lid][ref1], [artikel 3.42, derde lid][ref2], en
      [artikel 3.42a, derde lid][ref3], vermelde percentages voor de investeringsaftrek worden vervangen door andere;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.52.1.c
    text: |-
      kunnen aan de in [artikel 3.45][ref1] vermelde uitgesloten bedrijfsmiddelen voor de investeringsaftrek,
      bedrijfsmiddelen worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.52.2
    text: |-
      Uiterlijk binnen drie maanden na het tijdstip waarop een krachtens het eerste lid vastgestelde ministeriële
      regeling in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede Kamer der
      Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.3
    text: |-
      Indien het voorstel van wet wordt ingetrokken of indien een van de kamers der Staten-Generaal tot het niet-aannemen
      van het voorstel besluit, worden onverwijld bij ministeriële regeling, met ingang van het tijdstip waarop die
      regeling in werking treedt, de krachtens het eerste lid aangebrachte wijzigingen ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
  - number: 3.52.4
    text: |-
      Het tweede lid is niet van toepassing op een beperking van de willekeurige afschrijving die plaatsvindt bij de
      aanwijzing van bedrijfsmiddelen op grond van [artikel 3.31][ref1] of [artikel 3.34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.53.1
    text: 'Bij het bepalen van de in een kalenderjaar genoten winst kan worden gereserveerd:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.53
  - number: 3.53.1.a
    text: tot gelijkmatige verdeling van kosten en lasten (egalisatiereserve);
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.53
  - number: 3.53.1.b
    text: |-
      tot herinvestering in bedrijfsmiddelen volgens [artikel 3.54][ref1] (herinvesteringsreserve) en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.53.1.c
    text: |-
      voor de oude dag volgens [paragraaf 3.2.3][ref1] (oudedagsreserve).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.53.2
    text: |-
      Met betrekking tot een in het eerste lid, onderdeel a, bedoelde reserve is
      [artikel 3.26, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.54.1
    text: |-
      Indien bij vervreemding van een bedrijfsmiddel de opbrengst de boekwaarde van het bedrijfsmiddel overtreft,
      kan bij het bepalen van de in het kalenderjaar genoten winst het verschil gereserveerd worden en blijven tot
      vermindering van de in aanmerking te nemen aanschaffings- of voortbrengingskosten van bedrijfsmiddelen die in het
      jaar van vervreemding of in de daarop volgende drie jaren worden aangeschaft of voortgebracht, indien en zolang het
      voornemen tot herinvestering van de opbrengst bestaat (herinvesteringsreserve).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.2
    text: |-
      Afboeking van de herinvesteringsreserve op de aanschaffings- of voortbrengingskosten van het bedrijfsmiddel of de
      bedrijfsmiddelen waarin wordt geherinvesteerd, vindt plaats voorzover het gezamenlijke bedrag van de boekwaarden
      van die bedrijfsmiddelen door die afboeking niet daalt beneden het bedrag van de boekwaarde onmiddellijk
      voorafgaande aan de vervreemding van het bedrijfsmiddel ter zake waarvan de herinvesteringsreserve is gevormd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.3
    text: |-
      Afboeking van een herinvesteringsreserve die is ontstaan als gevolg van de vervreemding van een bedrijfsmiddel
      waarop niet pleegt te worden afgeschreven of waarop in meer dan tien jaren pleegt te worden afgeschreven,
      behoeft slechts plaats te vinden op de aanschaffings- of voortbrengingskosten van bedrijfsmiddelen met eenzelfde
      economische functie als de vervreemde bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.4
    text: |-
      Met betrekking tot bedrijfsmiddelen waarop niet pleegt te worden afgeschreven en bedrijfsmiddelen waarop in
      meer dan tien jaren pleegt te worden afgeschreven, vindt afboeking van een herinvesteringsreserve slechts plaats
      voorzover de herinvesteringsreserve is gevormd ter zake van de vervreemding van bedrijfsmiddelen met eenzelfde
      economische functie in de onderneming als de aangeschafte of voortgebrachte bedrijfsmiddelen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.5
    text: |-
      Een herinvesteringsreserve wordt uiterlijk in het derde jaar na het jaar waarin de reserve is ontstaan, in de winst
      opgenomen, behalve voorzover:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.5.a
    text: in verband met de aard van de aan te schaffen of voort te brengen bedrijfsmiddelen een langer tijdvak is vereist of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.5.b
    text: |-
      de aanschaffing of voortbrenging, mits daaraan een begin van uitvoering is gegeven, door bijzondere omstandigheden
      is vertraagd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.6
    text: |-
      Voor de toepassing van dit artikel wordt met vervreemding gelijkgesteld verlies of beschadiging van een
      bedrijfsmiddel. De vergoeding wegens verlies of beschadiging wordt daarbij aangemerkt als opbrengst.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.7
    text: 'Voor de toepassing van dit artikel behoren niet tot de bedrijfsmiddelen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.7.a
    text: vermogensrechten die ter belegging worden gehouden, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.7.b
    text: |-
      voorwerpen van geringe waarde als bedoeld in [artikel 3.30, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.54.8
    text: |-
      Indien op het vervreemde bedrijfsmiddel willekeurig is afgeschreven, wordt voor de toepassing van het eerste lid
      als boekwaarde van dat bedrijfsmiddel in aanmerking genomen, de boekwaarde die zonder willekeurige afschrijving zou
      hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54.9
    text: |-
      Met betrekking tot bedrijfsmiddelen waarop in meer dan tien jaar pleegt te worden afgeschreven, is de beperking
      van het vierde lid niet van toepassing voorzover de herinvesteringsreserve is gevormd ter zake van de vervreemding
      van bedrijfsmiddelen die een direct gevolg is van een aangewezen vorm van overheidsingrijpen als bedoeld in
      [artikel 3.64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.54.10
    text: |-
      Met betrekking tot bedrijfsmiddelen waarop niet pleegt te worden afgeschreven, is de beperking van het vierde
      lid niet van toepassing voorzover de herinvesteringsreserve is gevormd ter zake van de vervreemding van
      zodanige bedrijfsmiddelen die een direct gevolg is van een aangewezen vorm van overheidsingrijpen als bedoeld in
      [artikel 3.64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.54.11
    text: |-
      Met betrekking tot bedrijfsmiddelen waarop niet pleegt te worden afgeschreven en bedrijfsmiddelen waarop in meer
      dan tien jaren pleegt te worden afgeschreven, zijn de vorige leden van overeenkomstige toepassing indien aan het
      voornemen tot herinvestering in een dergelijk bedrijfsmiddel reeds vóór de vervreemding gevolg is gegeven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54
  - number: 3.54a.1
    text: |-
      Indien de belastingplichtige de onderneming van een vennootschap waarvan hij aandelen of
      winstbewijzen houdt, in het kader van de ontbinding van die vennootschap met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1], voortzet of mede voortzet, wordt op het tijdstip
      van de voortzetting op de balans van de onderneming een reserve gevormd (positieve of negatieve terugkeerreserve).


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.54a.2
    text: |-
      De terugkeerreserve wordt gesteld op de helft van het vervreemdingsvoordeel dat op grond van [artikel 4.24a][ref1]
      of [artikel 4.42a][ref2] voor de heffing buiten aanmerking blijft, na het vervreemdingsvoordeel eerst te hebben
      verminderd met het bedrag bedoeld in het derde lid. Indien deze vermindering leidt tot een positief bedrag,
      ontstaat er een positieve terugkeerreserve welke ten laste van het vermogen van de voortgezette onderneming komt.
      Wanneer deze vermindering leidt tot een negatief bedrag, ontstaat er een negatieve terugkeerreserve ter grootte
      van de helft van het negatieve bedrag; een negatieve terugkeerreserve komt in mindering op de winst bij staking van
      de onderneming. Voor de toepassing van de eerste volzin wordt het in die volzin bedoelde vervreemdingsvoordeel in
      aanmerking genomen zonder rekening te houden met de toepassing van [artikel 4.24a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.4
        afdeling: '4.8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 3.54a.3
    text: |-
      Het bedrag waarmee het vervreemdingsvoordeel wordt verminderd wordt gesteld op 69% van de winst die volgens
      [artikel 14c, eerste lid in verbinding met het tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1]
      voor de heffing van de vennootschapsbelasting buiten aanmerking blijft, voorzover deze winst is toe te rekenen aan
      het aandeel van de belastingplichtige in de vennootschap. Voor de toepassing van de vorige volzin blijft buiten
      aanmerking het deel van de winst waarop een vermindering ter voorkoming van internationale dubbele belasting
      van toepassing zou zijn ingeval [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref2] niet zou zijn
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.54a.4
    text: |-
      Een positieve terugkeerreserve wordt uiterlijk bij staking van de onderneming in de winst opgenomen. Bij staking
      van een gedeelte van de voortgezette onderneming wordt een evenredig gedeelte van de positieve terugkeerreserve in
      de winst opgenomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
  - number: 3.54a.5
    text: |-
      De omvang van de terugkeerreserve wordt door de inspecteur vastgesteld bij voor bezwaar vatbare beschikking.
      De in de eerste volzin bedoelde beschikking kan mede betrekking hebben op voorwaarden als bedoeld in
      [artikel 4.42a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.4
        afdeling: '4.8'
  - number: 3.54a.6
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat de omvang van de terugkeerreserve op een onjuist bedrag is
      vastgesteld, kan de inspecteur de beschikking herzien bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
  - number: 3.54a.7
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behoudens in de gevallen waarin de belastingplichtige terzake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
  - number: 3.54a.8
    text: De bevoegdheid tot herziening vervalt door verloop van vijf jaren na de datum van vaststelling van de beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.54a
  - number: 3.55.1
    text: |-
      De belastingplichtige hoeft bij het bepalen van de in een kalenderjaar genoten winst het voordeel uit de
      vervreemding van aandelen of winstbewijzen in het kader van een aandelenfusie niet in aanmerking te nemen. De
      eerste volzin is niet van toepassing op een in het kader van een aandelenfusie genoten bijbetaling.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.2
    text: 'Een aandelenfusie wordt aanwezig geacht indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.2.a
    text: |-
      een in Nederland gevestigde vennootschap tegen uitreiking van eigen aandelen of winstbewijzen, eventueel met
      bijbetaling, een zodanig bezit aan aandelen in een andere in Nederland gevestigde vennootschap verwerft dat zij
      meer dan de helft van de stemrechten in de laatstgenoemde vennootschap kan uitoefenen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.2.b
    text: |-
      een in een lidstaat van de Europese Unie gevestigde vennootschap tegen uitreiking van eigen aandelen of
      winstbewijzen, eventueel met een bijbetaling, een zodanig bezit aan aandelen in een andere in een lidstaat van de
      Europese Unie gevestigde vennootschap verwerft dat zij meer dan de helft van de stemrechten in de laatstgenoemde
      vennootschap kan uitoefenen of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.2.c
    text: |-
      een in Nederland gevestigde vennootschap tegen uitreiking van eigen aandelen of winstbewijzen, eventueel met een
      bijbetaling, een zodanig bezit aan aandelen in een buiten een lidstaat van de Europese Unie gevestigde vennootschap
      verwerft dat zij alle of nagenoeg alle stemrechten in de laatstgenoemde vennootschap kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.3
    text: |-
      Een aandelenfusie wordt eveneens aanwezig geacht indien een in het tweede lid bedoelde vennootschap voor
      de uitreiking van de eigen aandelen of winstbewijzen reeds meer dan de helft, respectievelijk nagenoeg alle
      stemrechten in de aldaar bedoelde andere vennootschap kon uitoefenen en door de uitreiking van de eigen aandelen of
      winstbewijzen een groter aantal stemrechten in die andere vennootschap kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.4
    text: 'Een aandelenfusie wordt, in afwijking in zoverre van het tweede en het derde lid, niet aanwezig geacht indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.4.a
    text: een bijbetaling een tiende gedeelte van de nominale waarde van de uitgereikte aandelen te boven gaat of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.4.b
    text: |-
      de fusie in overwegende mate is gericht op het ontgaan of uitstellen van belastingheffing. De fusie wordt, tenzij
      het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het ontgaan of uitstellen
      van belastingheffing indien de fusie niet plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering
      of rationalisering van de actieve werkzaamheden van de bij de fusie betrokken rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.5
    text: 'Een in een lidstaat van de Europese Unie gevestigde vennootschap is een vennootschap die:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.5.1°
    text: |-
      een van de rechtsvormen heeft die zijn opgenomen in de bijlage van de Richtlijn 90/434/EEG van de Raad van
      de Europese Gemeenschappen van 23 juli 1990 betreffende de gemeenschappelijke fiscale regeling voor fusies,
      splitsingen, inbreng van activa en aandelenruil met betrekking tot vennootschappen uit verschillende lidstaten
      (PbEG L 225);
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.5.2°
    text: |-
      niet wordt geacht volgens een door de lidstaat van vestiging met een derde staat gesloten verdrag ter voorkoming
      van dubbele belasting buiten de Europese Unie te zijn gevestigd en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.5.3°
    text: |-
      zonder keuzemogelijkheid en zonder ervan te zijn vrijgesteld, in de lidstaat van vestiging is onderworpen aan de
      aldaar geheven belasting naar de winst als bedoeld in artikel 3, onderdeel c, van de onder 1° genoemde richtlijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.6
    text: |-
      De belastingplichtige stelt, indien het voordeel volgens het eerste lid buiten aanmerking blijft, de in het kader
      van de aandelenfusie verworven aandelen of winstbewijzen op het tijdstip van de fusie te boek voor dezelfde waarde
      als waarvoor de in het kader van die fusie vervreemde aandelen of winstbewijzen onmiddellijk voor het fusietijdstip
      te boek waren gesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.55.7
    text: |-
      De belastingplichtige die zekerheid wenst omtrent de vraag of er sprake is van een aandelenfusie, kan vóór de
      vervreemding van de aandelen of winstbewijzen een verzoek indienen bij de hierna aangeduide inspecteur. Indien de
      vennootschap die de aandelen of winstbewijzen verwerft in Nederland is gevestigd, doet de belastingplichtige het
      verzoek bij de inspecteur belast met de aanslagregeling voor de vennootschapsbelasting van die vennootschap; in
      andere gevallen bij de inspecteur belast met de aanslagregeling van de belastingplichtige. De inspecteur beslist op
      het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.55
  - number: 3.56.1
    text: |-
      De belastingplichtige die is betrokken bij een overgang onder algemene titel in het kader van een splitsing van een
      rechtspersoon, wordt geacht zijn aandelen in of zijn schuldvorderingen op de splitsende rechtspersoon ten tijde van
      de splitsing te hebben vervreemd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.2
    text: |-
      De belastingplichtige hoeft bij het bepalen van de in een kalenderjaar genoten winst het voordeel uit de in het
      eerste lid bedoelde vervreemding niet in aanmerking te nemen, mits de splitsende en de verkrijgende rechtspersoon
      in Nederland zijn gevestigd, of in de zin van [artikel 3.55, vijfde lid][ref1], in een lidstaat van de Europese
      Unie zijn gevestigd. De eerste volzin geldt niet voor een in het kader van de splitsing genoten bijbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.56.3
    text: |-
      Indien het voordeel volgens het tweede lid niet in aanmerking wordt genomen, wordt de waarde waarvoor de aandelen
      of schuldvorderingen ten tijde van de splitsing te boek zijn gesteld, voor een evenredig gedeelte toegerekend aan
      de aandelen of schuldvorderingen die de belastingplichtige direct na de splitsing in respectievelijk op de bij
      splitsing betrokken rechtspersonen heeft. Voorts treden de schuldvorderingen die de belastingplichtige direct na
      de splitsing op de bij de splitsing betrokken rechtspersonen heeft, in de plaats van de schuldvorderingen die de
      belastingplichtige ten tijde van de splitsing heeft op de splitsende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.4
    text: |-
      Het tweede lid is niet van toepassing indien de splitsing in overwegende mate is gericht op het ontgaan of
      uitstellen van belastingheffing. De splitsing wordt, tenzij het tegendeel aannemelijk wordt gemaakt, geacht
      in overwegende mate te zijn gericht op het ontgaan of uitstellen van belastingheffing indien de splitsing
      niet plaatsvindt op grond van zakelijke overwegingen, zoals herstructurering of rationalisering van de actieve
      werkzaamheden van de bij de splitsing betrokken rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.5
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.5.a
    text: |-
      wordt onder een evenredig gedeelte verstaan een gedeelte dat evenredig is aan de verhouding van de waarde in het
      economische verkeer ten tijde van de splitsing van de vermogensbestanddelen die onder algemene titel overgaan en
      van het gehele vermogen van de splitsende rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.5.b
    text: worden met aandelen gelijkgesteld winstbewijzen en lidmaatschapsrechten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.5.c
    text: |-
      wordt een recht om aandelen in, winstbewijzen van of schuldvorderingen op de splitsende rechtspersoon te verwerven
      aangemerkt als aandeel, winstbewijs respectievelijk schuldvordering waarop het recht betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.5.d
    text: |-
      wordt, indien de belastingplichtige ten tijde van de splitsing met de splitsende rechtspersoon verbonden is
      in de zin van [artikel 10a, vijfde lid, van de Wet op de vennootschapsbelasting 1969][ref1], de verkrijgende
      rechtspersoon direct na de splitsing eveneens als met de belastingplichtige verbonden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 3.56.6
    text: |-
      De vorige leden zijn van overeenkomstige toepassing indien in het kader van de splitsing aandelen worden uitgereikt
      door een andere rechtspersoon dan de rechtspersoon op wie de vermogensbestanddelen onder algemene titel overgaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.56.7
    text: |-
      De belastingplichtige die zekerheid wenst omtrent de vraag of de splitsing niet wordt geacht in overwegende mate
      te zijn gericht op het ontgaan of uitstellen van belastingheffing, kan vóór de splitsing een verzoek indienen bij
      de inspecteur belast met de aanslagregeling van de splitsende rechtspersoon, die daarop bij voor bezwaar vatbare
      beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.56
  - number: 3.57.1
    text: |-
      De belastingplichtige die is betrokken bij een overgang onder algemene titel in het kader van een fusie van een
      rechtspersoon, wordt geacht zijn aandelen in of zijn schuldvorderingen op de verdwijnende rechtspersoon ten tijde
      van de fusie te hebben vervreemd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.2
    text: |-
      De belastingplichtige hoeft bij het bepalen van de in een kalenderjaar genoten winst het voordeel uit de in het
      eerste lid bedoelde vervreemding niet in aanmerking te nemen mits de verdwijnende en de verkrijgende rechtspersoon
      in Nederland zijn gevestigd, of in de zin van [artikel 3.55, vijfde lid][ref1], in een lidstaat van de Europese
      Unie zijn gevestigd. De eerste volzin geldt niet voor een in het kader van de fusie genoten bijbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.57.3
    text: |-
      Indien het voordeel volgens het tweede lid niet in aanmerking wordt genomen, worden de in het kader van de fusie
      verworven aandelen in of schuldvorderingen op de verkrijgende rechtspersoon direct na de fusie te boek gesteld voor
      dezelfde waarde als waarvoor de aandelen in of de schuldvorderingen op de verdwijnende rechtspersoon ten tijde van
      de fusie te boek zijn gesteld. Voorts treden de schuldvorderingen die de belastingplichtige direct na de fusie op
      de verkrijgende rechtspersoon heeft, in de plaats van de schuldvorderingen die de belastingplichtige ten tijde van
      de fusie heeft op de verdwijnende rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.4
    text: |-
      Het tweede lid is niet van toepassing indien de fusie in overwegende mate is gericht op het ontgaan of uitstellen
      van belastingheffing. De fusie wordt, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate
      te zijn gericht op het ontgaan of uitstellen van belastingheffing indien de fusie niet plaatsvindt op grond van
      zakelijke overwegingen, zoals herstructurering of rationalisering van de actieve werkzaamheden van de bij de fusie
      betrokken rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.5
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.5.a
    text: worden met aandelen gelijkgesteld winstbewijzen en lidmaatschapsrechten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.5.b
    text: |-
      wordt een recht om aandelen in, winstbewijzen van of schuldvorderingen op de verdwijnende rechtspersoon te
      verwerven aangemerkt als aandeel, winstbewijs respectievelijk schuldvordering waarop het recht betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.5.c
    text: |-
      wordt, indien de belastingplichtige ten tijde van de fusie met de verdwijnende rechtspersoon verbonden is in de zin
      van [artikel 10a, vijfde lid, van de Wet op de vennootschapsbelasting 1969][ref1], de verkrijgende rechtspersoon
      direct na de fusie eveneens als met de belastingplichtige verbonden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 3.57.6
    text: |-
      De vorige leden zijn van overeenkomstige toepassing indien in het kader van de fusie aandelen worden uitgereikt
      door een andere rechtspersoon dan de rechtspersoon op wie de vermogensbestanddelen onder algemene titel overgaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.57.7
    text: |-
      De belastingplichtige die zekerheid wenst omtrent de vraag of de fusie niet wordt geacht in overwegende mate te
      zijn gericht op het ontgaan of uitstellen van belastingheffing, kan vóór de fusie een verzoek indienen bij de
      inspecteur belast met de aanslagregeling van de verdwijnende rechtspersoon, die daarop bij voor bezwaar vatbare
      beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.57
  - number: 3.58.1
    text: |-
      Bij het staken van een onderneming door het overlijden van de belastingplichtige, wordt, behalve voor de toepassing
      van de desinvesteringsbijtelling, het vermogen van de onderneming geacht op het onmiddellijk daaraan voorafgaande
      tijdstip te zijn overgedragen aan degene aan wie het krachtens erfrecht of huwelijksvermogensrecht toekomt en wel
      tegen de waarde die in het economische verkeer aan dat vermogen kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.58
  - number: 3.58.2
    text: |-
      Voor de toepassing van het eerste lid wordt de waarde in het economische verkeer van een woning die, anders
      dan tijdelijk, als hoofdverblijf ter beschikking blijft staan van personen die bij het overlijden van de
      belastingplichtige tot zijn huishouden behoren, gesteld op 60% van de woningwaarde.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.58
  - number: 3.58.3
    text: |-
      Indien een woning als bedoeld in het tweede lid gaat behoren tot het vermogen van een onderneming van een persoon
      die bij het overlijden van de belastingplichtige tot zijn huishouden behoort, wordt de waarde in het economische
      verkeer van die woning op dat tijdstip gesteld op 60% van de woningwaarde.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.58
  - number: 3.58.4
    text: |-
      Voor de toepassing van het tweede en derde lid is [artikel 3.19, derde tot en met vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.58
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.59.1
    text: |-
      Bij ontbinding van een huwelijksgemeenschap waartoe het vermogen van een onderneming behoort, anders dan door het
      overlijden van de belastingplichtige, wordt, behoudens voor de toepassing van de desinvesteringsbijtelling, het
      aandeel in dat vermogen dat op het onmiddellijk daaraan voorafgaande tijdstip krachtens huwelijksvermogensrecht
      toekomt aan de echtgenoot van de belastingplichtige, geacht op dat tijdstip aan hem aan wie het krachtens erfrecht
      of huwelijksvermogensrecht toekomt, te zijn overgedragen tegen de waarde die daaraan in het economische verkeer kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.59
  - number: 3.59.2
    text: |-
      Het eerste lid is niet van toepassing op de bestanddelen van het vermogen van de onderneming waarmee degene aan
      wie die bestanddelen krachtens erfrecht of huwelijksvermogensrecht toekomen, de onderneming rechtstreeks voortzet
      of mede voortzet. In dat geval wordt degene die de onderneming rechtstreeks voortzet of mede voortzet voor zijn
      gedeelte, voor het bepalen van de winst geacht in de plaats te zijn getreden van degene van wie de onderneming
      rechtstreeks wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.59
  - number: 3.59.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de oudedagsreserve voorzover deze overgaat naar de
      langstlevende echtgenoot of gewezen echtgenoot en niet uitgaat boven het ondernemingsvermogen – in de zin van
      [artikel 3.71][ref1] – waarmee deze de onderneming voortzet of mede voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: '3.60'
    text: |-
      Indien bestanddelen van het vermogen van een in Nederland gedreven onderneming of zelfstandig gedeelte van een
      onderneming, waaruit de belastingplichtige winst geniet, worden overgebracht naar een buiten Nederland gedreven
      onderneming waaruit de belastingplichtige winst geniet en de belastingplichtige gelijktijdig of daarna ophoudt
      binnenlands belastingplichtig te zijn, worden die bestanddelen op het tijdstip onmiddellijk voorafgaande aan het
      ophouden van de binnenlandse belastingplicht en voorzover zij nog behoren tot het vermogen van de onderneming,
      geacht te zijn vervreemd tegen de waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.60
  - number: '3.61'
    text: |-
      Voordelen uit een onderneming die niet reeds uit anderen hoofde in aanmerking zijn genomen, worden gerekend tot de
      winst van het kalenderjaar waarin de belastingplichtige ophoudt in Nederland uit de onderneming winst te genieten.
      In dat geval worden de goederen voor de toepassing van de desinvesteringsbijtelling geacht aan de onderneming te
      zijn onttrokken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.61
  - number: 3.62.1
    text: |-
      [Artikel 3.58][ref1] vindt geen toepassing met betrekking tot de bestanddelen van het vermogen van een onderneming
      waarmee een of meer van degenen aan wie die bestanddelen krachtens erfrecht of huwelijksvermogensrecht toekomen,
      de onderneming rechtstreeks voortzetten of mede voortzetten, mits degenen die de onderneming voortzetten of mede
      voortzetten dit bij de aangifte van de overleden belastingplichtige verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.62
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.62.2
    text: |-
      Degenen die het verzoek hebben gedaan worden, ieder voor zijn gedeelte, voor het bepalen van de winst geacht in de
      plaats te zijn getreden van degene van wie de onderneming rechtstreeks wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.62
  - number: 3.62.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de oudedagsreserve voorzover deze overgaat op de
      *partner* en niet uitgaat boven het ondernemingsvermogen – in de zin van [artikel 3.71][ref1] – waarmee deze de
      onderneming voortzet of mede voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.62
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.63.1
    text: |-
      Indien de belastingplichtige een onderneming waaruit hij als ondernemer of als belastingplichtige als bedoeld in
      [artikel 3.3, eerste lid, onderdeel a][ref1], winst geniet, overdraagt in een geval als bedoeld in het vierde lid
      of vijfde lid, wordt voor het bepalen van de uit de onderneming in het kalenderjaar van overdracht genoten winst
      de onderneming, behalve voor de toepassing van [artikel 3.54a][ref2], geacht niet te zijn gestaakt, mits zowel de
      belastingplichtige als degene die de onderneming voortzet dit bij de aangifte van de belastingplichtige verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.63.2
    text: |-
      In dat geval wordt degene aan wie de onderneming is overgedragen, voor het bepalen van de winst van de onderneming
      geacht in de plaats te zijn getreden van degene die de onderneming heeft overgedragen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
  - number: 3.63.3
    text: |-
      Voor de toepassing van dit artikel wordt onder overdracht van een onderneming mede begrepen de overdracht van een
      gedeelte van een onderneming, ongeacht of bij degene die overdraagt een eventueel niet overgedragen gedeelte van de
      onderneming nog een onderneming is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
  - number: 3.63.4
    text: |-
      Het eerste lid is slechts van toepassing indien de over te dragen onderneming gedurende de 36 maanden die
      onmiddellijk voorafgaan aan het tijdstip van de overdracht deel uitmaakte van een samenwerkingsverband met degene
      die de onderneming gaat voortzetten en degene die voortzet met betrekking tot dat samenwerkingsverband gedurende
      die 36 maanden als ondernemer winst heeft genoten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
  - number: 3.63.5
    text: |-
      Het eerste lid is voorts slechts van toepassing indien de onderneming wordt overgedragen aan een natuurlijk persoon
      die gedurende de 36 maanden die onmiddellijk voorafgaan aan het tijdstip van de overdracht als werknemer in die
      onderneming werkzaam is geweest.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
  - number: 3.63.6
    text: |-
      Bij ministeriële regeling kan onder nader te stellen voorwaarden worden bepaald dat in bij die regeling te bepalen
      gevallen de in het vierde lid en vijfde lid bedoelde termijn tot een bij die regeling te bepalen periode wordt
      verkort.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
  - number: 3.63.7
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de oudedagsreserve voor zover deze overgaat op de
      *partner* en niet uitgaat boven het ondernemingsvermogen – in de zin van [artikel 3.71][ref1] – waarmee deze de
      onderneming voortzet of mede voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.64.1
    text: |-
      Bij het staken van een onderneming als direct gevolg van een in het vierde lid bedoelde vorm van overheidsingrijpen
      wordt op verzoek van de belastingplichtige bij de aangifte de met of bij de staking behaalde winst die is toe te
      rekenen aan bedrijfsmiddelen en aan herinvesteringsreserves, afzonderlijk bepaald en behandeld als te conserveren
      inkomen, voorzover aannemelijk wordt gemaakt dat die afzonderlijk bepaalde winst in het jaar van staking, dan
      wel binnen een periode van 12 maanden na staking, zal worden geherinvesteerd in een onderneming waaruit de
      belastingplichtige winst geniet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.2
    text: |-
      Bij tijdige herinvestering wordt de afzonderlijk bepaalde winst in mindering gebracht op de aanschaffings- of
      voortbrengingskosten van bedrijfsmiddelen die door de belastingplichtige ten behoeve van een bestaande of nieuwe
      onderneming worden aangeschaft of voortgebracht, als ware die winst een herinvesteringsreserve. Daarbij is
      [artikel 3.54][ref1] van overeenkomstige toepassing. De inspecteur vermindert vervolgens dienovereenkomstig de
      conserverende belastingaanslag bij voor bezwaar vatbare beschikking. Rechtsmiddelen tegen deze beschikking kunnen
      uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.64.3
    text: 'Op verzoek van de belastingplichtige wordt de periode van 12 maanden, bedoeld in het eerste lid, verlengd, indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.3.a
    text: |-
      in verband met de aard van de aan te schaffen of voort te brengen bedrijfsmiddelen, voor de herinvestering een
      langer tijdvak is vereist of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.3.b
    text: de herinvestering, mits daaraan een begin van uitvoering is gegeven, door bijzondere omstandigheden is vertraagd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.4
    text: 'Onder een vorm van overheidsingrijpen als bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.4.a
    text: onteigening, daaronder begrepen minnelijke onteigening en aankoop ter voorkoming van onteigening;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.64.4.b
    text: |-
      bij algemene maatregel van bestuur aangewezen communautaire of nationale regelgeving die leidt tot herstructurering
      van een bedrijfstak.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.64
  - number: 3.65.1
    text: |-
      Indien een onderneming wordt omgezet in de vorm van een door een naamloze vennootschap of besloten vennootschap
      met beperkte aansprakelijkheid gedreven onderneming, wordt, op verzoek van de belastingplichtige, voor het
      bepalen van de uit de onderneming in het kalenderjaar van omzetting genoten winst de onderneming, behalve voor
      de toepassing van [artikel 3.54a][ref1], geacht niet te zijn gestaakt, mits de oprichters van de vennootschap
      in het aandelenkapitaal geheel of nagenoeg geheel in dezelfde verhouding gerechtigd zijn als in het vermogen van
      de omgezette onderneming en de door Onze Minister nader te stellen voorwaarden zijn vervuld. De eerste volzin is
      niet van toepassing in situaties als bedoeld in artikel 3.3, eerste lid, onderdeel b; in situaties als bedoeld
      in artikel 3.3, eerste lid, onderdeel a, is de eerste volzin slechts van toepassing indien de medegerechtigdheid
      van de belastingplichtige de rechtstreekse voortzetting vormt van zijn gerechtigdheid of medegerechtigdheid als
      ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.65.2
    text: Het eerste lid is niet van toepassing met betrekking tot de oudedagsreserve.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.65.3
    text: |-
      Bij een omzetting op de voet van het eerste lid vervalt, in afwijking van [artikel 3.54a, tweede lid][ref1], een
      negatieve terugkeerreserve zonder dat dit de winst beïnvloedt. Onze Minister houdt bij de bepaling van de omvang
      van de verkrijgingspijs van de bij de omzetting verkregen aandelen rekening met het vervallen van de negatieve
      terugkeerreserve.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.65.4
    text: |-
      De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking waarin de in het eerste lid bedoelde
      voorwaarden zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.65.5
    text: |-
      De in het eerste lid bedoelde voorwaarden strekken ter verzekering van de heffing en de invordering van de
      inkomstenbelasting en de vennootschapsbelasting, die verschuldigd zouden zijn of zouden worden indien het eerste
      lid buiten toepassing zou blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.65.5.a
    text: de grootte van het geplaatste en gestorte aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.65.5.b
    text: |-
      de verkrijgingsprijs, bedoeld in [artikel 4.21][ref1], van de bij de omzetting verkregen aandelen en de boekwaarde
      van bij de omzetting verkregen schuldvorderingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 3.65.5.c
    text: de berekening van de verminderingen ter voorkoming van dubbele belasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.65.5.d
    text: |-
      de ingebrachte vermogensbestanddelen die als gevolg van de omzetting gaan behoren tot een deelneming als bedoeld in
      [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '13'
  - number: 3.65.5.e
    text: de vervreemding van de aandelen in de opgerichte vennootschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.65
  - number: 3.66.1
    text: |-
      Indien de aard van de onderneming dit rechtvaardigt, mag de winst worden bepaald over een niet met het kalenderjaar
      samenvallend boekjaar. In dat geval treedt het boekjaar in de plaats van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.66
  - number: 3.66.2
    text: |-
      De winst van een niet met het kalenderjaar samenvallend boekjaar wordt beschouwd als winst van het kalenderjaar
      waarin het boekjaar is geëindigd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.66
  - number: 3.66.3
    text: |-
      Een boekjaar van meer dan twaalf maanden wordt gesplitst in twee gedeelten waarvan het eerste twaalf maanden omvat,
      mits bij deze splitsing de twee gedeelten in verschillende kalenderjaren eindigen. Beide gedeelten worden als een
      afzonderlijk boekjaar aangemerkt. De winst van het eerste gedeelte wordt door schatting bepaald; aan het tweede
      gedeelte wordt de rest van de winst van het boekjaar toegerekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.66
  - number: 3.67.1
    text: |-
      De *ondernemer*die aan het *urencriterium*voldoet en bij de aanvang van het kalenderjaar de leeftijd van 65 jaar
      nog niet heeft bereikt, kan bij het bepalen van de in een kalenderjaar genoten winst over dat jaar toevoegen aan
      de oudedagsreserve.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.67
  - number: 3.67.2
    text: |-
      De voorwaarde inzake het urencriterium geldt niet bij de extra toevoeging op de voet van
      [artikel 3.69, eerste lid, aanhef en onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.68.1
    text: |-
      De toevoeging aan de reserve over een kalenderjaar bedraagt 12% van de winst die de belastingplichtige als
      *ondernemer* uit een onderneming geniet, maar niet meer dan € 11 050. De op grond van de eerste volzin bepaalde
      toevoeging wordt verminderd met de ten laste van die winst gekomen premies en andere bijdragen uit hoofde van
      *pensioenregelingen*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.68
  - number: 3.68.2
    text: |-
      De op grond van het eerste lid berekende toevoeging bedraagt ten hoogste het bedrag waarmee het
      ondernemingsvermogen bij het einde van het kalenderjaar de oudedagsreserve bij het begin van het kalenderjaar te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.68
  - number: 3.68.3
    text: |-
      Voor de toepassing van dit artikel wordt onder winst verstaan: de winst voor toevoeging aan en afneming van
      de oudedagsreserve en vermeerderd met de premies en andere bijdragen als bedoeld in het eerste lid, maar met
      uitzondering van de winst waarop een regeling ter voorkoming van dubbele belasting van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.68
  - number: 3.69.1
    text: |-
      Het bedrag dat volgens [artikel 3.68, eerste lid][ref1], aan de oudedagsreserve wordt toegevoegd, kan worden
      vermeerderd:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.69.1.a
    text: |-
      met het bedrag waarmee in het voorafgaande kalenderjaar de oudedagsreserve volgens
      [artikel 3.70, eerste lid, aanhef en onderdeel b][ref1], geheel of gedeeltelijk is afgenomen en waarop
      [artikel 3.72, derde lid][ref2], geen toepassing heeft gevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.69.1.b
    text: |-
      met de belastbare periodieke uitkeringen en verstrekkingen, bedoeld in
      [artikel 3.100, eerste lid, onderdeel b][ref1], en de negatieve uitgaven voor inkomensvoorzieningen
      die ten aanzien van de belastingplichtige in aanmerking worden genomen in verband met de toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref2] ten aanzien van de vennootschap waarvan de
      belastingplichtige aandeelhouder is voorzover deze uitkeringen, verstrekkingen en negatieve uitgaven verband houden
      met een lijfrente die in het kader van de afname van een oudedagsreserve van de belastingplichtige is gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.69.2
    text: |-
      Het bedrag dat na de vermeerdering van het eerste lid, onderdeel a, aan de oudedagsreserve kan worden toegevoegd,
      kan niet uitgaan boven het verschil tussen het bedrag van het ondernemingsvermogen bij het einde van het
      kalenderjaar en het bedrag van de oudedagsreserve bij het begin van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.69
  - number: 3.70.1
    text: 'De oudedagsreserve neemt af met:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.1.a
    text: |-
      een door de belastingplichtige te kiezen bedrag, maar met ten hoogste het bedrag van de premies voor *lijfrenten*
      die in het kalenderjaar als uitgaven voor inkomensvoorzieningen in aanmerking worden genomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.1.b
    text: 'het bedrag waarmee de oudedagsreserve het ondernemingsvermogen bij het einde van het kalenderjaar overtreft indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.1.b.1°
    text: in het kalenderjaar de onderneming of een gedeelte van de onderneming is gestaakt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.1.b.2°
    text: de belastingplichtige bij de aanvang van het kalenderjaar de leeftijd van 65 jaar heeft bereikt of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.1.b.3°
    text: de belastingplichtige in het kalenderjaar en in het voorafgaande kalenderjaar niet aan het *urencriterium* voldoet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: 3.70.2
    text: Het bedrag van de afnemingen wordt in de winst opgenomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.70
  - number: '3.71'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder ondernemingsvermogen verstaan de boekwaarde van het vermogen van
      de onderneming verminderd met het bedrag van de reserves bedoeld in [artikel 3.53][ref1], met uitzondering van de
      oudedagsreserve, verminderd met het bedrag van een positieve terugkeerreserve als bedoeld in [artikel 3.54a][ref2]
      en vermeerderd met het bedrag van een negatieve terugkeerreserve als bedoeld in [artikel 3.54a][ref3]. Daarbij
      blijven buiten aanmerking de vermogensbestanddelen en reserves waarvan de waardeveranderingen respectievelijk de
      wijzigingen behoren tot de winst ter zake waarvan een regeling ter voorkoming van dubbele belasting van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.72.1
    text: 'Indien de belastingplichtige als *ondernemer* winst geniet uit meer dan één onderneming:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
  - number: 3.72.1.a
    text: |-
      wordt voor de toepassing van de [artikelen 3.68][ref1] en [3.69][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.72.1.a.1°
    text: |-
      winst opgevat als het gezamenlijke bedrag van de winst die met de ondernemingen waaruit de belastingplichtigen als
      ondernemer winst geniet, is behaald;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
  - number: 3.72.1.a.2°
    text: ondernemingsvermogen opgevat als het gezamenlijke bedrag van het vermogen van de ondernemingen, bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
  - number: 3.72.1.a.3°
    text: |-
      oudedagsreserve opgevat als het gezamenlijke bedrag van de oudedagsreserves van de ondernemingen, bedoeld onder
      1°, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
  - number: 3.72.1.b
    text: |-
      vindt de toedeling van de toevoeging, bedoeld in [artikel 3.68][ref1], aan de ondernemingen, bedoeld in onderdeel
      a, onder 1°, naar keuze van de *ondernemer* plaats, voorzover als gevolg van de toevoeging de oudedagsreserve niet
      uitgaat boven het ondernemingsvermogen van die onderneming bij het einde van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.72.2
    text: |-
      Indien de belastingplichtige als ondernemer of als medegerechtigde tot het vermogen van een onderneming als
      bedoeld in [artikel 3.3][ref1], winst geniet uit meer dan één onderneming, geldt het bedrag van de premies voor
      *lijfrenten*, bedoeld in [artikel 3.70, eerste lid][ref2], voor de gezamenlijke ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.72.3
    text: |-
      Indien de belastingplichtige als *ondernemer* winst geniet uit meer dan één onderneming en bij een of meer van die
      ondernemingen [artikel 3.70, eerste lid][ref1], aanhef en onderdeel b, aanhef en onder 1°, is toegepast:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.72.3.a
    text: |-
      kan de *ondernemer* aan het gezamenlijke bedrag van de oudedagsreserves bij de andere ondernemingen waaruit de
      belastingsplichtige als ondernemer winst geniet, toevoegen het gezamenlijke bedrag van de afnemingen volgens
      [artikel 3.70, eerste lid, aanhef en onderdeel b, aanhef en onder 1°][ref1], voorzover als gevolg van de
      toevoeging het gezamenlijke bedrag van de oudedagsreserves van die andere ondernemingen bij het einde van het
      kalenderjaar niet uitgaat boven het gezamenlijke bedrag van het ondernemingsvermogen van die andere ondernemingen
      bij het einde van het kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.72.3.b
    text: |-
      vindt de toedeling van die toevoeging aan de ondernemingen waaruit de belastingsplichtige als ondernemer winst
      geniet, naar keuze van de *ondernemer* plaats, voorzover als gevolg van die toevoeging de oudedagsreserve niet
      uitgaat boven het ondernemingsvermogen van die onderneming bij het einde van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.72
  - number: 3.73.1
    text: |-
      Indien de winst wordt bepaald over een niet met het kalenderjaar samenvallend boekjaar is
      [artikel 3.66, eerste lid][ref1], laatste volzin, niet van toepassing op het eerstgenoemde kalenderjaar in
      [artikel 3.67, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.73.2
    text: |-
      Indien belastingplichtige als *ondernemer* of als medegerechtigde tot het vermogen van een onderneming als bedoeld
      in [artikel 3.3][ref1], winst geniet uit meer dan één onderneming en de winst van die ondernemingen wordt bepaald
      over onderling niet samenvallende boekjaren:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.73.2.a
    text: |-
      is [artikel 3.66, eerste lid][ref1], laatste volzin, niet van toepassing op deze paragraaf;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.73.2.b
    text: |-
      wordt voor de toepassing van [artikel 3.68, derde lid][ref1], winst opgevat in de zin van
      [artikel 3.66, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.73.2.c
    text: |-
      wordt voor de toepassing van [artikel 3.72, eerste lid, onderdeel a, onder 2°][ref1], voor elke onderneming als
      vermogen van die onderneming aangemerkt het ondernemingsvermogen bij het einde van het jongste boekjaar dat voor
      het einde van het kalenderjaar is geëindigd, vermeerderd of verminderd met de kapitalen die door de ondernemer
      tussen het einde van het boekjaar en het einde van het kalenderjaar aan de ondernemingen zijn toegevoegd of
      onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.73.3
    text: |-
      Indien de ondernemer ophoudt binnenlands belastingplichtige te zijn, treedt voor de toepassing van het tweede lid,
      het gedeelte van het kalenderjaar dat eindigt met die belastingplicht voor het kalenderjaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.73
  - number: '3.74'
    text: 'De ondernemersaftrek is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.74
  - number: 3.74.a
    text: de zelfstandigenaftrek;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.74
  - number: 3.74.b
    text: de aftrek voor speur- en ontwikkelingswerk;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.74
  - number: 3.74.c
    text: de meewerkaftrek, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.74
  - number: 3.74.d
    text: de stakingsaftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.74
  - number: '3.75'
    text: |-
      Voor de toepassing van deze paragraaf en de daarop rustende bepalingen wordt onder een onderneming mede verstaan:
      de gezamenlijke ondernemingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.75
  - number: 3.76.1
    text: |-
      De zelfstandigenaftrek geldt voor de *ondernemer*die aan het *urencriterium*voldoet en bij het begin van het
      kalenderjaar de leeftijd van 65 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.76
  - number: 3.76.2
    text: |-
      Bij een winst







                    gelijk aan of meer dan


                    maar minder dan


                    bedraagt de zelfstandigenaftrek






                    –


                    € 13 150


                    € 8885




                    € 13 150


                    € 15 255


                    € 8260




                    € 15 255


                    € 17 360


                    € 7638




                    € 17 360


                    € 49 720


                    € 6807




                    € 49 720


                    € 51 825


                    € 6213




                    € 51 825


                    € 53 935


                    € 5556




                    € 53 935


                    € 56 030


                    € 4903




                    € 56 030


                    –


                    € 4310
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.76
  - number: 3.76.3
    text: |-
      Indien de ondernemer in een of meer van de vijf voorafgaande kalenderjaren geen ondernemer was en bij
      hem in die periode niet meer dan tweemaal zelfstandigenaftrek is toegepast, wordt de zelfstandigenaftrek
      verhoogd met € 1987. De eerste volzin is niet van toepassing voor de ondernemer die met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1] een onderneming voortzet of mede voortzet
      waarbij dit voortzetten een aanvang heeft genomen in het kalenderjaar of in een van de vijf daaraan voorafgaande
      kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.76
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.76.4
    text: |-
      Voor de toepassing van dit artikel wordt onder winst verstaan het gezamenlijke bedrag van de winst die de
      belastingplichtige als ondernemer uit een of meer ondernemingen geniet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.76
  - number: 3.77.1
    text: |-
      De aftrek voor speur- en ontwikkelingswerk geldt voor de *ondernemer*die aan het *urencriterium* voldoet
      en in het kalenderjaar ten minste 500 uur besteedt aan werk dat bij een S&O-verklaring als bedoeld in
      [artikel 27, eerste lid, van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1]
      is aangemerkt als speur- en ontwikkelingswerk. De aftrek voor speur- en ontwikkelingswerk bedraagt € 11 255.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel27
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '27'
  - number: 3.77.2
    text: |-
      Indien de ondernemer in een of meer van de vijf voorafgaande kalenderjaren geen ondernemer was en aan
      hem voor die periode met betrekking tot ten hoogste twee kalenderjaren een S&O-verklaring is afgegeven,
      wordt de aftrek voor speur- en ontwikkelingswerk verhoogd met € 5628. Een S&O-verklaring die is afgegeven
      voor een deel van een kalenderjaar wordt aangemerkt als een S&O-verklaring afgegeven met betrekking tot
      een heel kalenderjaar. De eerste volzin is niet van toepassing voor de ondernemer die met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1] een onderneming voortzet of mede voortzet
      waarbij dit voortzetten een aanvang heeft genomen in het kalenderjaar of in een van de vijf daaraan voorafgaande
      kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.77.3
    text: |-
      [Artikel 3.6, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.77.4
    text: |-
      Indien op grond van
      [artikel 29 van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1] de in
      [artikel 23, derde en zevende lid, van die wet][ref2], vermelde percentages worden verhoogd, verlaagd of op
      nihil worden gesteld, kan bij ministeriële regeling van Onze Minister van Economische Zaken het in het eerste lid
      vermelde bedrag in dezelfde mate worden verhoogd tot maximaal € 13 371, worden verlaagd of op nihil worden gesteld.
      Het nieuwe bedrag geldt met betrekking tot de S&O-verklaringen die betrekking hebben op een kalenderjaar dat
      aanvangt op of na de dag waarop de wijziging in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel23
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0007746
        artikel: '23'
  - number: 3.78.1
    text: |-
      De meewerkaftrek geldt voor de *ondernemer* die aan het *urencriterium* voldoet en van wie de *partner* zonder
      enige vergoeding arbeid verricht in een onderneming waaruit de belastingplichtige als ondernemer winst geniet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
  - number: 3.78.2
    text: |-
      Bij arbeid van de partner die gedurende het kalenderjaar een aantal uren in beslag neemt







                    gelijk aan of meer dan


                    maar minder dan


                    bedraagt de meewerkaftrek






                    525


                    875


                    1,25% van de winst




                    875


                    1 225


                    2% van de winst




                    1225


                    1 750


                    3% van de winst




                    1 750


                    –


                    4% van de winst
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
  - number: 3.78.3
    text: |-
      Voor de toepassing van dit artikel wordt onder winst verstaan het gezamenlijke bedrag van de winst die de
      belastingplichtige als ondernemer geniet uit ondernemingen waarin de partner zonder enige vergoeding arbeid
      verricht, verminderd met:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
  - number: 3.78.3.a
    text: winst genoten ter vervanging van door een onteigening gederfde of te derven voordelen uit onderneming;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
  - number: 3.78.3.b
    text: |-
      winst behaald met of bij het staken van een onderneming of een gedeelte van een onderneming, daaronder mede
      verstaan staking door overlijden als bedoeld in [artikel 3.58][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.78.3.c
    text: |-
      winst als gevolg van de overbrenging van vermogensbestanddelen naar het buitenland of als gevolg van eindafrekening
      bedoeld in [artikel 3.60][ref1] respectievelijk [3.61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.79.1
    text: 'De stakingsaftrek geldt voor de ondernemer die als *ondernemer* in het kalenderjaar winst behaalt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
  - number: 3.79.1.a
    text: met of bij het staken van een of meer gehele ondernemingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
  - number: 3.79.1.b
    text: |-
      door een afneming van de oudedagsreserve na een geruisloze doorschuiving of omzetting als bedoeld in
      [artikel 3.59, tweede lid][ref1], [artikel 3.62][ref2], [artikel 3.63][ref3], respectievelijk [artikel 3.65][ref4],
      waarbij zonder die geruisloze doorschuiving of omzetting sprake zou zijn van het staken van een gehele onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.79.2
    text: |-
      De stakingsaftrek is gelijk aan het bedrag van de in het eerste lid bedoelde winst, maar bedraagt niet meer dan
      € 3 630.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
  - number: 3.79.3
    text: |-
      De stakingsaftrek is ten aanzien van de ondernemer die op grond van doorschuiving bij ontbinding van de
      huwelijksgemeenschap als bedoeld in [artikel 3.59, tweede lid][ref1], doorschuiving bij overlijden als bedoeld
      in [artikel 3.62][ref2] of doorschuiving naar ondernemers als bedoeld in [artikel 3.63][ref3], een onderneming
      voortzet of mede voortzet, met betrekking tot de voordelen ter zake van die doorgeschoven onderneming alleen van
      toepassing indien die onderneming ten minste drie jaren voor zijn rekening is gedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.79.4
    text: |-
      Het in het tweede lid bedoelde maximumbedrag van € 3 630 wordt verminderd – maar niet verder dan tot nihil – met de
      in voorafgaande jaren door de ondernemer genoten bedragen aan stakingsaftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.79
  - number: '3.80'
    text: |-
      Belastbaar loon is *loon* verminderd met de*werknemersaftrek*([paragraaf 3.3.2][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.80
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        paragraaf: 3.3.2
        afdeling: '3.3'
  - number: '3.81'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder *loon:* loon overeenkomstig de wettelijke
      bepalingen van de loonbelasting, met dien verstande dat, voorzover nodig in afwijking van die bepalingen, fooien en
      dergelijke prestaties van derden in aanmerking worden genomen voor het werkelijk genoten bedrag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.81
  - number: '3.82'
    text: 'Tot *loon* wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
  - number: 3.82.a
    text: 'wat wordt genoten:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
  - number: 3.82.a.1°
    text: ter vervanging van gederfd of te derven loon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
  - number: 3.82.a.2°
    text: |-
      ter zake van het staken of nalaten van werkzaamheden voorzover het genotene niet is aan te merken als resultaat uit
      overige werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
  - number: 3.82.b
    text: |-
      uitkeringen op grond van een pensioenregeling van een andere mogendheid als bedoeld in
      [artikel 1.7, tweede lid, onderdeel c][ref1], behoudens voorzover aannemelijk is dat over de aanspraken ingevolge
      die pensioenregeling heffing naar het inkomen heeft plaatsgevonden die naar aard en strekking overeenkomt met de
      loonbelasting of de inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.82.c
    text: |-
      uitkeringen op grond van een pensioenregeling van een internationale organisatie, behoudens voorzover aannemelijk
      is dat over de aanspraken ingevolge die pensioenregeling een heffing naar het inkomen heeft plaatsgevonden die naar
      aard en strekking overeenkomt met de loonbelasting of de inkomstenbelasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.82
  - number: 3.83.1
    text: |-
      Tot *loon* wordt gerekend de waarde in het economische verkeer van opgebouwde aanspraken uit een
      *pensioenregeling*, indien de belastingplichtige die werknemer of gewezen werknemer is in de zin van de wettelijke
      bepalingen van de loonbelasting en aan wie het pensioen is toegezegd, ophoudt binnenlands belastingplichtige te
      zijn anders dan door overlijden, of indien na zijn overlijden de gerechtigde tot de uitkeringen ophoudt binnenlands
      belastingplichtige te zijn. Onder ophouden binnenlands belastingplichtig te zijn wordt mede verstaan de situatie
      waarin de belastingplichtige voor de toepassing van de Belastingregeling voor het Koninkrijk of een verdrag ter
      voorkoming van dubbele belasting wordt geacht geen inwoner van Nederland meer te zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
  - number: 3.83.2
    text: |-
      Tot loon wordt gerekend, tenzij het eerste lid toepassing vindt, de waarde in het economische
      verkeer van opgebouwde aanspraken uit een *pensioenregeling* indien de verplichtingen waarop de
      aanspraken berusten, geheel of gedeeltelijk zijn ondergebracht bij een ander lichaam dan bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b, d, e en f, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 3.83.3
    text: |-
      De waarde van de opgebouwde aanspraken wordt verminderd met de waarde van de aanspraken die niet ten laste is
      gekomen van belastbaar inkomen uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
  - number: 3.83.4
    text: |-
      Indien het eerste of het tweede lid toepassing vindt met betrekking tot de waarde van aanspraken die op grond
      van het eerste of tweede lid dan wel [artikel 7.2, achtste lid, onderdeel a][ref1], eveneens is begrepen in het
      belastbare inkomen uit werk en woning van een vorig kalenderjaar, wordt, onder bij ministeriële regeling te stellen
      voorwaarden, het belastbare inkomen uit werk en woning van dat vorige kalenderjaar met die waarde van de aanspraken
      verlaagd. De inspecteur vermindert dienovereenkomstig de conserverende aanslag over dat jaar bij voor bezwaar
      vatbare beschikking. Rechtsmiddelen tegen deze beschikking kunnen uitsluitend betrekking hebben op de grootte van
      de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 3.83.5
    text: |-
      Indien [artikel 19b van de Wet op de loonbelasting 1964][ref1] toepassing heeft gevonden, wordt het loon verminderd
      met de waarde van de aanspraken die tot het loon zijn gerekend met toepassing van het tweede lid, voorzover de
      belasting ter zake van de waarde van die aanspraken is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
  - number: 3.83.6
    text: |-
      Bij algemene maatregel van bestuur worden aanwijzingen gegeven met betrekking tot de bepaling van de waarde in het
      economische verkeer van de opgebouwde aanspraken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
  - number: 3.83.7
    text: |-
      Op verzoek van de belastingplichtige wordt, indien de waarde van aanspraken op grond van het eerste of tweede lid
      dan wel [artikel 7.2, achtste lid, onderdeel a][ref1], is begrepen in het belastbare inkomen uit werk en woning van
      een vorig kalenderjaar, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 3.83.7.1°
    text: |-
      wordt voldaan aan de voorwaarden voor uitstel van betaling bedoeld in
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 3.83.7.2°
    text: |-
      de verplichtingen waarop de aanspraken berusten geheel zijn ondergebracht bij een verzekeraar als bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b, d, e of f, van de Wet op de loonbelasting 1964][ref1], het belastbare
      inkomen uit werk en woning van dat vorige kalenderjaar met die waarde van de aanspraken verlaagd. De inspecteur
      vermindert dienovereenkomstig de conserverende aanslag over dat jaar bij voor bezwaar vatbare beschikking.
      Rechtsmiddelen tegen deze beschikking kunnen uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.83
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: '3.84'
    text: |-
      Tot loon behoren niet voordelen waarover de belasting op grond van [artikel 31][ref1] of [artikel 32ab][ref2] in
      verbinding met [artikel 31 van de Wet op de loonbelasting 1964][ref3] is verschuldigd door de inhoudingsplichtige,
      evenmin als een hierdoor voor de belastingplichtige ontstaan voordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32ab
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.84
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32ab
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '3.85'
    text: De werknemersaftrek is het gezamenlijke bedrag van de reisaftrek en de zeedagenaftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.85
  - number: 3.87.1
    text: |-
      De reisaftrek geldt bij ten minste eenmaal per week plegen te reizen tussen de woning of verblijfplaats en de
      plaats of plaatsen van werkzaamheden waarbij binnen een tijdsbestek van 24 uur zowel heen als terug wordt gereisd
      en wordt in aanmerking genomen voor de per openbaar vervoer afgelegde *reisafstand*, voor zover dat vervoer niet
      vanwege de inhoudingsplichtige plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.2
    text: |-
      In dit artikel en daarop berustende bepalingen wordt onder reisafstand verstaan: de afstand tussen de woning of
      verblijfplaats en de plaats van de werkzaamheden gemeten langs de meest gebruikelijke weg.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.3
    text: |-
      De op basis van de volgende leden bepaalde reisaftrek wordt verminderd met de voor de per openbaar vervoer
      afgelegde reisafstand ontvangen reiskostenvergoedingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.4
    text: |-
      Indien de belastingplichtige op ten minste vier dagen per week naar dezelfde plaats van werkzaamheden pleegt te
      reizen, bedraagt de reisaftrek:







                    Bij een reisafstand per openbaar vervoer




                    van meer dan


                    maar niet meer dan


                    op jaarbasis






                    –


                    10 km


                    –




                    10 km


                    15 km


                    € 396




                    15 km


                    20 km


                    € 529




                    20 km


                    30 km


                    € 888




                    30 km


                    40 km


                    € 1101




                    40 km


                    50 km


                    € 1437




                    50 km


                    60 km


                    € 1598




                    60 km


                    70 km


                    € 1773




                    70 km


                    80 km


                    € 1834




                    80 km


                    –


                    € 1859
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.5
    text: |-
      Indien de belastingplichtige op drie dagen, twee dagen of één dag per week naar dezelfde plaats van werkzaamheden
      pleegt te reizen, bedraagt de reisaftrek:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.5.a
    text: |-
      indien de reisafstand niet meer beloopt dan 90 kilometer: driekwart, de helft respectievelijk een kwart van het in
      de tabel aangegeven bedrag;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.5.b
    text: |-
      indien de reisafstand meer beloopt dan 90 kilometer: € 0,21 per kilometer van die reisafstand vermenigvuldigd met
      het aantal dagen waarop wordt gereisd, maar niet meer dan € 1859 per jaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.6
    text: |-
      Indien de belastingplichtige naar verschillende plaatsen van werkzaamheden pleegt te reizen, vinden het vierde en
      vijfde lid afzonderlijk toepassing met betrekking tot het reizen naar elk van die plaatsen, waarbij de som van de
      volgens deze leden bepaalde reisaftrek niet meer bedraagt dan € 1859 per jaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.7
    text: |-
      Indien de belastingplichtige op dezelfde dag naar verschillende plaatsen van werkzaamheden pleegt te reizen, zijn
      de vorige leden uitsluitend van toepassing op het reizen naar de meest bereisde plaats van werkzaamheden. Indien de
      plaatsen van werkzaamheden even vaak plegen te worden bereisd, geldt de grootste reisafstand.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.8
    text: |-
      Voor de toepassing van het eerste lid pleegt de belastingplichtige in ieder geval ten minste eenmaal per week
      te reizen indien hij in het kalenderjaar op 40 dagen of meer van zijn woning of verblijfplaats naar de plaats of
      plaatsen van werkzaamheden heeft gereisd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.9
    text: |-
      De per openbaar vervoer afgelegde reisafstand blijkt slechts uit een op een tijdvak van 12 maanden betrekking
      hebbende verklaring die is afgegeven door de desbetreffende openbaar-vervoersonderneming (de openbaar-
      vervoerverklaring).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.10
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van deze openbaar-vervoerverklaring en
      voor de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.87.11
    text: |-
      In afwijking van het negende lid kunnen bij ministeriële regeling nadere regels worden gesteld om aan een openbaar-
      vervoerverklaring gelijk te stellen andere aan de persoon van de belastingplichtige herleidbare verklaringen
      omtrent het gereisd hebben met openbaar vervoer in die gevallen dat door de gebruikte kaartsoort de openbaar-
      vervoerverklaring niet kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.87
  - number: 3.89.1
    text: |-
      De zeedagenaftrek geldt voor de belastingplichtige die als kapitein, scheepsofficier of scheepsgezel van een
      zeeschip in de zin van de [Zeebrievenwet][ref1] in verband met zijn werkzaamheden doorgaans ten minste 180 dagen
      per jaar aan boord van een dergelijk zeeschip of in een buitenlandse haven of havenplaats verblijft (zeedagen). De
      dagen van vertrek en van aankomst worden daarbij meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: 3.89.2
    text: De zeedagenaftrek bedraagt € 4 per zeedag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
  - number: 3.89.3
    text: 'Als zeedagen worden niet in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
  - number: 3.89.3.a
    text: |-
      dagen ten gevolge van reizen met een duur van 14 dagen of minder, tenzij gedurende de reis een buitenlandse haven
      is aangedaan die voor de vervoerde zaken of personen het karakter van haven van bestemming of van vertrek heeft;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
  - number: 3.89.3.b
    text: dagen waarbij het vertrek uit en de aankomst in een Nederlandse haven op dezelfde dag liggen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
  - number: 3.89.3.c
    text: dagen waarop het zeeschip de hele dag in een Nederlandse haven ligt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.89
  - number: '3.90'
    text: |-
      Belastbaar resultaat uit overige werkzaamheden is het gezamenlijke bedrag van het resultaat uit een of meer
      werkzaamheden die geen belastbare winst of belastbaar loon genereren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.90
  - number: 3.91.1
    text: 'Onder werkzaamheid wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.1.a
    text: |-
      het rendabel maken van vermogensbestanddelen – daaronder begrepen de schulden die rechtstreeks samenhangen met die
      vermogensbestanddelen – door deze vermogensbestanddelen al dan niet tegen vergoeding rechtens dan wel in feite,
      direct of indirect ter beschikking te stellen aan een met de belastingplichtige verbonden persoon, voorzover die
      vermogensbestanddelen door die persoon worden aangewend voor het behalen van belastbare winst uit onderneming of
      belastbaar resultaat uit overige werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.1.b
    text: |-
      het rendabel maken van vermogensbestanddelen – daaronder begrepen de schulden die rechtstreeks samenhangen met
      die vermogensbestanddelen – voorzover deze vermogensbestanddelen al dan niet tegen vergoeding rechtens dan wel in
      feite, direct of indirect ter beschikking worden gesteld ten behoeve van een samenwerkingsverband waarvan een met
      de belastingplichtige verbonden persoon die daarbij belastbare winst uit onderneming of belastbaar resultaat uit
      overige werkzaamheden geniet, deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.1.c
    text: |-
      het rendabel maken van vermogen op een wijze die normaal, actief vermogensbeheer te buiten gaat, zoals bij het
      uitponden van onroerende zaken, het in belangrijke mate door de belastingplichtige zelf verrichten van groot
      onderhoud of andere aanpassingen aan een zaak, of het aanwenden door de belastingplichtige van voorkennis of
      daarmee vergelijkbare bijzondere vormen van kennis.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2
    text: 'Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a
    text: |-
      met het ter beschikking stellen van vermogensbestanddelen aan een in het eerste lid bedoelde persoon of ten behoeve
      van een daar bedoeld samenwerkingsverband gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a.1°
    text: |-
      het aangaan of het hebben van een schuldvordering alsmede het aangaan of het hebben van rechten uit een
      spaarovereenkomst of uit een daarmee verwante overeenkomst op een in dat lid bedoelde persoon of bedoeld
      samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a.2°
    text: |-
      het sluiten van een overeenkomst van *levensverzekering* of het hebben van rechten uit een overeenkomst van
      *levensverzekering* waarbij de in dat lid bedoelde persoon of bedoeld samenwerkingsverband als verzekeraar optreedt
      behoudens voorzover de uitkeringen uit die rechten anders in aanmerking zouden worden genomen als een periodieke
      uitkering of verstrekking als bedoeld in [afdeling 3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.91.2.a.3°
    text: |-
      het vestigen of het hebben van een genotsrecht op een vermogensbestanddeel dat ter beschikking is gesteld aan een
      in dat lid bedoelde persoon of ten behoeve van een in dat lid bedoeld samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a.4°
    text: |-
      het overeenkomen of het hebben van een recht een vermogensbestanddeel dat ter beschikking is gesteld aan een in dat
      lid bedoelde persoon of ten behoeve van een in dat lid bedoeld samenwerkingsverband, te verwerven;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a.5°
    text: |-
      het verkrijgen of het hebben van een recht of een verplichting een vermogensbestanddeel te verwerven van een
      in dat lid bedoelde persoon of bedoeld samenwerkingsverband indien de daar tegenover staande verplichting
      onderscheidenlijk het daar tegenover staande recht tot diens vermogen van een onderneming of tot diens resultaat
      uit een werkzaamheid behoort;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.a.6°
    text: |-
      het verkrijgen of het hebben van een recht of een verplichting een vermogensbestanddeel te vervreemden aan
      een in dat lid bedoelde persoon of bedoeld samenwerkingsverband indien de daar tegenover staande verplichting
      onderscheidenlijk het daar tegenover staande recht tot diens vermogen van een onderneming of tot diens resultaat
      uit een werkzaamheid behoort;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b
    text: 'onder een met de belastingplichtige verbonden persoon verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b.1°
    text: de partner van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b.2°
    text: degene die ten overstaan van een notaris een samenlevingscontract heeft gesloten met de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b.3°
    text: degene die voor de toepassing van een pensioenregeling als partner van de belastingplichtige is aangemeld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b.4°
    text: |-
      degene die samen met de belastingplichtige een woning bewoont welke voor hen een eigen woning is en aansprakelijk
      is of mede aansprakelijk is voor een schuld waarbij die woning als onderpand dient;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.b.5°
    text: |-
      degene, niet zijnde een bloed- of aanverwant in de eerste graad van de rechte lijn, die samen met de
      belastingplichtige voor het kalenderjaar kan kiezen voor kwalificatie als *partner* als bedoeld in
      [artikel 1.2][ref1], tenzij de belastingplichtige aannemelijk maakt dat geen sprake is van een duurzaam gevoerde
      gemeenschappelijke huishouding;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.91.2.b.6°
    text: |-
      de minderjarige kinderen van de belastingplichtige, van zijn partner of van een onder 2° tot en met 5° aangeduide
      persoon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.c
    text: |-
      indien de belastingplichtige minderjarig is, onder een met de belastingplichtige verbonden persoon mede verstaan:
      een bloed- of aanverwant in de eerste graad van de opgaande lijn en degene die onder een met die bloed- of
      aanverwant verbonden persoon als bedoeld in het tweede lid, onderdeel b, wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.d
    text: |-
      een vergoeding voor het aangaan van borgtocht voor schulden betreffende een onderneming, werkzaamheid of
      samenwerkingsverband als bedoeld in het eerste lid, aangemerkt als een voordeel uit het ter beschikking stellen van
      een vermogensbestanddeel;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.e
    text: |-
      onder rechten als bedoeld in onderdeel a, onder 4°, 5° en 6° mede verstaan: rechten waarvan de waarde direct of
      indirect verband houdt met de waardeverandering van een vermogensbestanddeel of met de wijziging van een factor,
      zoals de rentestand;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.2.f
    text: |-
      onder verplichtingen als bedoeld in onderdeel a, onder 5° en 6°, mede verstaan: verplichtingen waarvan de waarde
      direct of indirect verband houdt met de waardeverandering van een vermogensbestanddeel of met de wijziging van een
      factor, zoals de rentestand.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.91.3
    text: |-
      Op dezelfde wijze als het ter beschikking stellen van vermogensbestanddelen aan een met de belastingplichtige
      verbonden persoon wordt behandeld het ter beschikking stellen aan een niet onder het tweede lid, onderdeel b,
      begrepen bloed- of aanverwant in de rechte lijn van de belastingplichtige, van zijn partner of van een in dat
      onderdeel onder 2° tot en met 5° aangeduide persoon, indien het een in het maatschappelijke verkeer ongebruikelijke
      terbeschikkingstelling is. Bij ministeriële regeling kunnen regels worden gesteld voor de toepassing van dit lid,
      waaronder regels of sprake is van een in het maatschappelijk verkeer ongebruikelijke terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.91
  - number: 3.92.1
    text: 'Voorts wordt onder werkzaamheid mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.1.a
    text: |-
      het rendabel maken van vermogensbestanddelen – daaronder begrepen de schulden die rechtstreeks samenhangen met
      die vermogensbestanddelen – voorzover deze vermogensbestanddelen al dan niet tegen vergoeding rechtens dan wel in
      feite, direct of indirect ter beschikking worden gesteld aan een vennootschap waarin de belastingplichtige of een
      met hem verbonden persoon, een aanmerkelijk belang heeft als bedoeld in [hoofdstuk 4][ref1] behoudens indien sprake
      is van een aanmerkelijk belang op grond van de [artikelen 4.10][ref2] en [4.11][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 3.92.1.b
    text: |-
      het rendabel maken van vermogensbestanddelen – daaronder begrepen de schulden die rechtstreeks samenhangen met
      die vermogensbestanddelen – voorzover deze vermogensbestanddelen al dan niet tegen vergoeding rechtens dan wel in
      feite, direct of indirect ter beschikking worden gesteld aan een samenwerkingsverband waarvan een vennootschap als
      bedoeld in onderdeel a deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2
    text: 'Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.a
    text: |-
      met het ter beschikking stellen van vermogensbestanddelen aan een in het eerste lid bedoelde vennootschap of ten
      behoeve van een daar bedoeld samenwerkingsverband gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.a.1°
    text: |-
      het aangaan of het hebben van een schuldvordering alsmede het aangaan of het hebben van rechten uit een
      spaarovereenkomst of uit een daarmee verwante overeenkomst op een in dat lid bedoelde vennootschap of bedoeld
      samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.a.2°
    text: |-
      het sluiten van een overeenkomst van *levensverzekering* of het hebben van rechten uit een overeenkomst van
      *levensverzekering* waarbij de in dat lid bedoelde vennootschap of bedoeld samenwerkingsverband als verzekeraar
      optreedt behoudens voorzover de uitkeringen uit die rechten anders in aanmerking zouden worden genomen als een
      periodieke uitkering of verstrekking als bedoeld in [afdeling 3.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.92.2.a.3°
    text: |-
      het vestigen of het hebben van een genotsrecht op een vermogensbestanddeel dat ter beschikking is gesteld aan een
      in dat lid bedoelde vennootschap of ten behoeve van een in dat lid bedoeld samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.a.4°
    text: |-
      het overeenkomen of het hebben van een recht een vermogensbestanddeel dat ter beschikking is gesteld aan een in dat
      lid bedoelde vennootschap of ten behoeve van een in dat lid bedoeld samenwerkingsverband, te verwerven;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.a.5°
    text: |-
      het verkrijgen of het hebben van een recht, anders dan bedoeld in
      [artikel 10a van de Wet op de loonbelasting 1964][ref1], of een verplichting een vermogensbestanddeel te verwerven
      van een in dat lid bedoelde vennootschap of bedoeld samenwerkingsverband;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 3.92.2.a.6°
    text: |-
      het verkrijgen of het hebben van een recht of een verplichting een vermogensbestanddeel te vervreemden aan een in
      dat lid bedoelde vennootschap of bedoeld samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.b
    text: |-
      onder een met de belastingplichtige verbonden persoon verstaan hetgeen daaronder wordt verstaan in
      [artikel 3.91, tweede lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 3.92.2.c
    text: |-
      een vergoeding voor het aangaan van borgtocht voor schulden van een vennootschap of betreffende een
      samenwerkingsverband als bedoeld in het eerste lid, aangemerkt als een voordeel uit het ter beschikking stellen van
      een vermogensbestanddeel;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.d
    text: |-
      met een vennootschap gelijkgesteld een fonds voor gemene rekening als bedoeld in [artikel 4.5][ref1] en een
      coöperatie of vereniging op coöperatieve grondslag;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.92.2.e
    text: |-
      onder het ter beschikking stellen van vermogensbestanddelen niet begrepen het houden van aandelen in een
      vennootschap en het houden van winstbewijzen van een vennootschap;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.f
    text: |-
      onder rechten als bedoeld in onderdeel a, onder 4°, 5° en 6° mede verstaan: rechten waarvan de waarde direct of
      indirect verband houdt met de waardeverandering van een vermogensbestanddeel of met de wijziging van een factor,
      zoals de rentestand;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.2.g
    text: |-
      onder verplichtingen als bedoeld in onderdeel a, onder 5° en 6°, mede verstaan: verplichtingen waarvan de waarde
      direct of indirect verband houdt met de waardeverandering van een vermogensbestanddeel of met de wijziging van een
      factor, zoals de rentestand.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
  - number: 3.92.3
    text: |-
      Op dezelfde wijze als het ter beschikking stellen van vermogensbestanddelen aan een vennootschap waarin een met de
      belastingplichtige verbonden persoon een aanmerkelijk belang heeft, wordt behandeld het ter beschikking stellen aan
      een vennootschap waarin een niet onder [artikel 3.91, tweede lid, onderdeel b][ref1], begrepen bloed- of aanverwant
      in de rechte lijn van de belastingplichtige, van zijn partner of van een in dat onderdeel onder 2° tot en met 5°
      aangeduide persoon een aanmerkelijk belang heeft, indien het een in het maatschappelijke verkeer ongebruikelijke
      terbeschikkingstelling is. Bij ministeriële regeling kunnen regels worden gesteld voor de toepassing van dit lid,
      waaronder regels of sprake is van een in het maatschappelijk verkeer ongebruikelijke terbeschikkingstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 3.92a
    text: |-
      Voorts wordt onder werkzaamheid mede verstaan het hebben van een opwaarderingsreserve als bedoeld in
      [artikel 3.98a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.92a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 3.93.1
    text: |-
      Voor de toepassing van de [artikelen 3.91][ref1] en [3.92][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 3.93.1.a
    text: |-
      geldt een persoon niet als aanverwant indien het huwelijk waardoor de verwantschap is ontstaan, door echtscheiding
      is ontbonden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.93
  - number: 3.93.1.b
    text: |-
      wordt niet als het rendabel maken van vermogensbestanddelen aangemerkt het ter beschikking stellen van een
      werkruimte, de inrichting daaronder begrepen, in een woning die de belastingplichtige ter beschikking staat, indien
      de persoon aan wie of het lichaam waaraan ter beschikking wordt gesteld ter zake van die terbeschikkingstelling
      niet een vergoeding ten laste van de winst of het resultaat uit overige werkzaamheden kan brengen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.93
  - number: 3.93.2
    text: Werkzaamheden van dezelfde aard worden aangemerkt als een werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.93
  - number: 3.93.3
    text: |-
      Voor de toepassing van dit artikel wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip
      of woonwagen in de zin van [artikel 1 van de Woningwet][ref1], alsmede de aanhorigheden van een woning, schip of
      woonwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.93
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '3.94'
    text: |-
      Resultaat uit een werkzaamheid (resultaat) is het bedrag van de gezamenlijke voordelen die, onder welke naam en in
      welke vorm ook, worden behaald met een werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.94
  - number: '3.95'
    text: |-
      Bij de bepaling van het resultaat zijn de [artikelen 3.10][ref1], [3.13 tot en met 3.21][ref2],
      [3.25 tot en met 3.30][ref3], [3.55 tot en met 3.58][ref4], [3.59, eerste en tweede lid][ref5], en
      [3.60 tot en met 3.62][ref6] van overeenkomstige toepassing, alsof de werkzaamheid een onderneming vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.95
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.95a
    text: |-
      Indien ingevolge [artikel 2.14, derde lid, onderdeel d][ref1], door de belastingplichtige genoten vergoedingen
      ter zake van een werkruimte niet worden aangemerkt als loon doch als voordeel behaald met een werkzaamheid en die
      werkruimte behoort tot het vermogen van een onderneming van hem of van één met hem verbonden persoon als bedoeld in
      dat artikelonderdeel, wordt voor de berekening van het resultaat met die werkzaamheid slechts als kosten en lasten
      in aftrek gebracht een evenredig deel van de op de voet van [artikel 3.19][ref2] berekende bijtelling privé-gebruik
      woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.95a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.96'
    text: 'Tot het resultaat behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.96
  - number: 3.96.a
    text: |-
      voordelen uit het deelnemen aan kansspelen als bedoeld in
      [artikel 2, eerste lid, van de Wet op de kansspelbelasting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '2'
  - number: 3.96.b
    text: |-
      voordelen die door de belastingplichtige worden behaald ter zake van het verrichten van arbeid in de onderneming
      van zijn partner, indien bij het bepalen van de winst uit die onderneming de kosten en lasten die verband houden
      met de vergoeding voor die arbeid op grond van [artikel 3.16, vierde lid][ref1], niet in aftrek komen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.96.c
    text: |-
      voordelen die door de belastingplichtige als vrijwilliger, bedoeld in
      [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref1], worden behaald, waarbij het gezamenlijke bedrag
      van de vergoedingen en verstrekkingen niet meer bedraagt dan de aldaar genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.96
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 3.97.1
    text: |-
      Indien de belastingplichtige bij de aangifte daarvoor kiest, worden de door hem uit het houden van kostgangers
      verkregen opbrengsten voor een deel als voordelen uit *eigen woning* dan wel uit een huurrecht aangemerkt. Dit
      keuzerecht geldt voor het deel van de opbrengsten dat betrekking heeft op het, anders dan voor korte duur, ter
      beschikking stellen aan derden van al dan niet gestoffeerde of gemeubileerde woonruimte die niet een zelfstandige
      woning vormt en deel uitmaakt van de woning die de belastingplichtige tot hoofdverblijf dient.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.97
  - number: 3.97.2
    text: 'Het eerste lid is alleen van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.97
  - number: 3.97.2.a
    text: |-
      het deel van de opbrengsten dat betrekking heeft op het ter beschikking stellen van de woonruimte niet meer
      bedraagt dan € 3902 per jaar, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.97
  - number: 3.97.2.b
    text: |-
      zowel de belastingplichtige als degenen aan wie ter beschikking is gesteld gedurende de periode van de
      terbeschikkingstelling als ingezetenen op het woonadres ter zake van de woning zijn ingeschreven in de
      basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.97
  - number: '3.98'
    text: |-
      Indien vermogensbestanddelen als bedoeld in [artikel 3.92][ref1] niet langer door de
      belastingplichtige ter beschikking worden gesteld aan de vennootschap in verband met de toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref2] maar onderdeel gaan uitmaken van de onderneming
      van de vennootschap die door hem wordt voortgezet, wordt, op verzoek van de belastingplichtige, de daarmee
      behaalde stakingswinst niet in aanmerking genomen voor het bepalen van het in het jaar uit de werkzaamheid
      genoten resultaat. In dat geval wordt bij de onderneming de boekwaarde van de vermogensbestanddelen gesteld op de
      boekwaarde daarvan bij de werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.98a.1
    text: |-
      Indien de belastingplichtige een schuldvordering heeft als bedoeld in [artikel 3.92][ref1] en die schuldvordering
      is afgewaardeerd ten laste van de winst uit een onderneming of het resultaat uit een werkzaamheid van hem of
      van een met hem verbonden persoon, wordt, indien zich een omstandigheid voordoet als bedoeld in het tweede
      lid, tot het resultaat van de belastingplichtige gerekend een bedrag gelijk aan die afwaardering. Het in de
      eerste volzin bedoelde bedrag kan gelijktijdig ten laste van het resultaat worden toegevoegd aan een reserve
      (opwaarderingsreserve).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 3.98a.2
    text: 'Van een omstandigheid als bedoeld in het eerste lid is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.2.a
    text: |-
      de met de schuldvordering corresponderende schuld door de schuldenaar wordt voldaan door het uitgeven van aandelen
      of winstbewijzen (omzetting);
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.2.b
    text: |-
      de met de schuldvordering corresponderende schuld gaat functioneren als eigen vermogen van de schuldenaar zonder
      dat deze daartoe aandelen of winstbewijzen uitgeeft waarbij de schuldvordering niet meer behoort tot het vermogen
      van een werkzaamheid; of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.2.c
    text: de schuldvordering geheel of gedeeltelijk wordt prijsgegeven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.3
    text: |-
      Het eerste lid is ter zake van een omstandigheid als bedoeld in het tweede lid, onderdeel c, niet van toepassing
      voor zover de in dat lid bedoelde omstandigheid bij de schuldenaar leidt tot belastbare winst in Nederland of
      meebrengt dat een voordeel bij de schuldenaar wordt betrokken in de heffing van een belasting naar de winst die
      naar Nederlandse maatstaven redelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.4
    text: |-
      De opwaarderingsreserve wordt aan het resultaat toegevoegd voor zover het verschil tussen de actuele waarde
      in het economische verkeer van de aandelen of winstbewijzen die de belastingplichtige of een met hem verbonden
      persoon direct of indirect houdt in de schuldenaar en de waarde in het economische verkeer van die aandelen
      of winstbewijzen ten tijde van de in het eerste lid bedoelde omstandigheid uitgaat boven het bedrag waarmee de
      opwaarderingsreserve sinds die omstandigheid reeds is afgenomen. Daarbij wordt de waardestijging van de direct
      of indirect gehouden aandelen of winstbewijzen van een met de belastingplichtige verbonden persoon bij de
      belastingplichtige niet in aanmerking genomen, voor zover die waardestijging bij de verbonden persoon op grond van
      dit artikel reeds leidt tot een toevoeging aan het resultaat uit een werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.5
    text: |-
      Indien aandelen of winstbewijzen van de belastingplichtige of een met hem verbonden persoon in de schuldenaar na de
      in het eerste lid bedoelde omstandigheid zijn vervreemd aan een niet met de belastingplichtige verbonden persoon of
      een vennootschap waarin de belastingplichtige noch een met hem verbonden persoon een aanmerkelijk belang heeft als
      bedoeld in [hoofdstuk 4][ref1], wordt voor de toepassing van het vierde lid de actuele waarde in het economische
      verkeer van de daar bedoelde aandelen of winstbewijzen vermeerderd met de overdrachtsprijs van de vervreemde
      aandelen of winstbewijzen. Indien de belastingplichtige of een met hem verbonden persoon zijn aandelenbezit of
      bezit van winstbewijzen in de schuldenaar na de in het eerste lid bedoelde omstandigheid heeft uitgebreid doordat
      aandelen of winstbewijzen zijn verkregen van de schuldenaar zelf of van een niet met de belastingplichtige
      verbonden persoon of een vennootschap waarin noch de belastingplichtige noch een met hem verbonden persoon
      een aanmerkelijk belang heeft als bedoeld in [hoofdstuk 4][ref2], wordt voor de toepassing van het vierde lid
      de actuele waarde in het economische verkeer van de daar bedoelde aandelen of winstbewijzen verminderd met de
      verkrijgingsprijs van die uitbreiding. Onder een uitbreiding van het aandelenbezit of bezit aan winstbewijzen
      als bedoeld in de tweede volzin wordt mede begrepen een storting van kapitaal zonder uitreiking van aandelen of
      winstbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 3.98a.6
    text: |-
      Indien een omstandigheid, anders dan omschreven in het achtste lid, meebrengt dat noch de belastingplichtige, noch
      een met hem verbonden persoon, meer een aanmerkelijk belang als bedoeld in [hoofdstuk 4][ref1] in de schuldenaar
      heeft, wordt direct voorafgaande aan die omstandigheid het vierde lid voor het laatst toegepast. Ingeval daarna
      nog een bedrag aan opwaarderingsreserve resteert, vervalt dat restant zonder dat dit tot een toevoeging aan het
      resultaat leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 3.98a.7
    text: |-
      In afwijking van het zesde lid, tweede volzin, wordt het restant van de opwaarderingsreserve wel toegevoegd aan
      het resultaat uit een werkzaamheid indien de omstandigheid in overwegende mate is gericht op het realiseren van
      een vrijval van de opwaarderingsreserve die niet tot een toevoeging aan het resultaat leidt. Een omstandigheid
      wordt, tenzij het tegendeel aannemelijk wordt gemaakt, geacht in overwegende mate te zijn gericht op het realiseren
      van een vrijval die niet tot een toevoeging aan het resultaat leidt, indien de belastingplichtige of een met
      hem verbonden persoon binnen drie jaar na die omstandigheid opnieuw een aanmerkelijk belang in de schuldenaar
      verkrijgt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
  - number: 3.98a.8
    text: |-
      Indien de onderneming of een gedeelte van de onderneming van de schuldenaar wordt vervreemd aan de
      belastingplichtige of aan een met hem verbonden persoon dan wel aan een vennootschap waarin de belastingplichtige
      of een met hem verbonden persoon, een aanmerkelijk belang heeft als bedoeld in [hoofdstuk 4][ref1], wordt
      onmiddellijk daaraan voorafgaand de opwaarderingsreserve toegevoegd aan het resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 3.98a.9
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 4.3][ref1], [4.4][ref2], [4.5][ref3] en [4.5a][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 3.98a.10
    text: |-
      Voor de toepassing van dit artikel wordt onder een met de belastingplichtige verbonden persoon verstaan hetgeen
      daaronder wordt verstaan in [artikel 3.91, tweede lid, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.98a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: '3.99'
    text: |-
      Indien een werkzaamheid in een kalenderjaar uitgroeit tot een onderneming waaruit de belastingplichtige als
      *ondernemer* winst geniet, wordt voor het bepalen van het in het jaar uit de werkzaamheid genoten resultaat,
      de werkzaamheid geacht niet te zijn gestaakt. In dat geval wordt bij de onderneming de boekwaarde van de
      vermogensbestanddelen gesteld op de boekwaarde daarvan bij de werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.99
  - number: 3.100.1
    text: 'Belastbare periodieke uitkeringen en verstrekkingen zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
  - number: 3.100.1.a
    text: de aangewezen periodieke uitkeringen en verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
  - number: 3.100.1.b
    text: |-
      termijnen van *lijfrenten*en andere periodieke uitkeringen en verstrekkingen uit een inkomensvoorziening
      ([afdeling 3.7][ref1]) voorzover de voor die voorziening betaalde premies als uitgave voor inkomensvoorziening in
      aanmerking zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.100.1.c
    text: |-
      uitkeringen en verstrekkingen op grond van een buitenlandse voorziening waarvan de strekking overeenkomt met een
      inkomensvoorziening, behoudens voorzover aannemelijk is dat met de voor die voorziening betaalde premies geen
      rekening is gehouden bij een heffing naar het inkomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
  - number: 3.100.1.d
    text: |-
      uitkeringen op grond van verplicht gestelde deelnemingen aan pensioenregelingen als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.100.2
    text: |-
      In afwijking in zoverre van [artikel 2.14][ref1] wordt de belastbaarheid van uitkeringen op grond
      van buitenlandse regelingen die naar aard en strekking overeenkomen met uitkeringen op grond van de
      [Algemene Kinderbijslagwet][ref2] beheerst door deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.100
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0002368
  - number: 3.101.1
    text: 'Aangewezen periodieke uitkeringen en verstrekkingen zijn de periodieke uitkeringen en verstrekkingen die:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
  - number: 3.101.1.a
    text: worden ontvangen op grond van een publiekrechtelijke regeling;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
  - number: 3.101.1.b
    text: |-
      worden ontvangen op grond van een rechtstreeks uit het familierecht voortvloeiende verplichting, tenzij de
      uitkeringen of verstrekkingen worden ontvangen van bloed- of aanverwanten in de rechte lijn of in de tweede graad
      van de zijlijn;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
  - number: 3.101.1.c
    text: |-
      in rechte vorderbaar zijn en niet de tegenwaarde voor een prestatie vormen, tenzij de uitkeringen of verstrekkingen
      worden ontvangen van een bloed- of aanverwant in de rechte lijn of in de tweede graad van de zijlijn dan wel de
      genieter behoort tot het huishouden van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
  - number: 3.101.1.d
    text: niet in rechte vorderbaar zijn en worden ontvangen van een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
  - number: 3.101.2
    text: |-
      Indien verstrekkingen als bedoeld in het eerste lid, onderdelen b of c, worden ontvangen in de vorm van huisvesting
      ter zake van een woning of een gedeelte van een woning, worden die verstrekkingen voorzover zij afkomstig zijn
      van een beperkt gerechtigde tot die woning of gedeelte van die woning gesteld op de huurwaarde respectievelijk een
      evenredig deel van de huurwaarde berekend volgens [artikel 3.112][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.101
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.102.1
    text: |-
      Tot de aangewezen periodieke uitkeringen en verstrekkingen behoort wat wordt ontvangen ter vervanging van gederfde
      of te derven periodieke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.2
    text: |-
      Het eerste lid is niet van toepassing voorzover wat wordt ontvangen ter vervanging van de gederfde of te
      derven periodieke uitkeringen en verstrekkingen bestaat uit een recht op soortgelijke periodieke uitkeringen en
      verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.3
    text: |-
      Tot de aangewezen periodieke uitkeringen en verstrekkingen behoort wat in het kader van echtscheiding of scheiding
      van tafel en bed wordt ontvangen ter zake van het recht op verrekening van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.3.a
    text: pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.3.b
    text: |-
      *lijfrenten* en andere inkomensvoorzieningen voorzover de daarvoor betaalde premies als uitgave voor
      inkomensvoorziening in aanmerking zijn genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.4
    text: |-
      Het derde lid is niet van toepassing voorzover wat wordt ontvangen bestaat uit een lijfrente of een andere
      inkomensvoorziening en de daarvoor betaalde premies als uitgave voor inkomensvoorziening in aanmerking zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: 3.102.5
    text: |-
      Tot wat wordt ontvangen ter zake van het recht op verrekening bedoeld in het derde lid, behoort niet een recht op
      periodieke uitkeringen en verstrekkingen dat is toegekend door degene die tot de verrekening verplicht is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.102
  - number: '3.103'
    text: |-
      Tot de periodieke uitkeringen en verstrekkingen die worden ontvangen op grond van een publiekrechtelijke regeling
      behoren:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.103
  - number: 3.103.a
    text: |-
      uitkeringen uit vrijwillige verzekering op grond van de [artikelen 35][ref1] of
      [38 van de Algemene Ouderdomswet][ref2] en de [artikelen 63a][ref3] of [63d van de Algemene nabestaandenwet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel63d
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0007795
        artikel: 63d
  - number: 3.103.b
    text: |-
      uitkeringen aan gemoedsbezwaarden op grond van [artikel 48 van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel48
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '48'
  - number: 3.103.c
    text: |-
      uitkeringen op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.103
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3.103.d
    text: |-
      uitkeringen op grond van buitenlandse regelingen die naar aard en strekking overeenkomen met uitkeringen als
      bedoeld in de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.103
  - number: '3.104'
    text: 'Tot de aangewezen periodieke uitkeringen en verstrekkingen behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.a
    text: |-
      uitkeringen en verstrekkingen op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 3.104.b
    text: |-
      uitkeringen op grond van de [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 3.104.c
    text: |-
      uitkeringen ingevolge [artikel 4.3 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '4'
  - number: 3.104.d
    text: |-
      uitkeringen in de vorm van een gift of een voorwaardelijke gift ingevolge de [Wet studiefinanciering 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 3.104.e
    text: |-
      uitkeringen als bedoeld in de [artikelen 7.51, eerste tot en met zesde lid][ref1], [7.51a][ref2] en
      [17.10 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel17
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
