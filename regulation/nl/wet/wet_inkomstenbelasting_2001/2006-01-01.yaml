    text: het bedrag van de oudedagsreserve bij de aanvang van het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.3.c
    text: |-
      de bedragen die op grond van [artikel 3.127, eerste en tweede lid][ref1], en [artikel 3.128][ref2] in de
      voorafgaande kalenderjaren in aanmerking zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.129.3.d
    text: de bedragen die reeds eerder volgens het eerste lid in aanmerking zijn genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.4
    text: |-
      Voor de toepassing van dit artikel wordt de belastingplichtige, bedoeld in
      [artikel 3.3, eerste lid, onderdeel a][ref1], als ondernemer aangemerkt, indien de medegerechtigdheid van
      de belastingplichtige de rechtstreekse voortzetting vormt van zijn gerechtigdheid of medegerechtigdheid als
      ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 3.130.1
    text: |-
      Premies voor *lijfrenten* komen voor aftrek in aanmerking op het tijdstip waarop deze zijn betaald of verrekend,
      voorzover de verrekening niet leidt tot een schuldig gebleven bedrag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.130
  - number: 3.130.2
    text: |-
      Een belastingplichtige kan premies voor lijfrenten die binnen de hierna aangegeven periode na afloop van het
      kalenderjaar door hem zijn betaald of verrekend, naar bij de aangifte gemaakte keuze aanmerken als premies die zijn
      betaald of verrekend in het kalenderjaar, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.130
  - number: 3.130.2.a
    text: |-
      premies als bedoeld in [artikel 3.127, eerste en tweede lid][ref1]: binnen drie maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.130.2.b
    text: |-
      premies als bedoeld in de [artikelen 3.127, vijfde lid][ref1], [3.128][ref2] en [3.129][ref3]: binnen zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.130
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.130.3
    text: |-
      Bij wijziging van binnenlandse belastingplicht in buitenlandse belastingplicht in het kalenderjaar kan de
      belastingplichtige premies voor lijfrenten naar bij de aangifte gemaakte keuze aanmerken als premies die zijn
      betaald of verrekend in de periode van binnenlandse belastingplicht in het kalenderjaar, indien de premies zijn
      betaald of verrekend in de periode van de buitenlandse belastingplicht in het kalenderjaar of binnen de in het
      tweede lid, onderdelen a en b, bedoelde periode na afloop van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.130
  - number: 3.131.1
    text: |-
      Een belastingplichtige kan als uitgaven voor inkomensvoorzieningen in aanmerking komende premies voor onmiddellijk
      ingaande *lijfrenten* op zijn verzoek, in afwijking in zoverre van de [artikelen 3.124, onderdeel a][ref1],
      en [artikel 3.125, eerste lid][ref2], niet bij hem zelf in aanmerking nemen, maar, als uitgaven voor
      inkomensvoorzieningen, bij degene door het overlijden van wie een onderneming is gestaakt, waarbij deze wordt
      geacht de verzekeringnemer te zijn. Hierbij geldt als voorwaarde dat de premies zijn betaald of verrekend binnen
      zes maanden na het overlijden en in de overeenkomst waarbij de lijfrenten zijn bedongen, is opgenomen dat een
      verzoek zal worden gedaan om toepassing van deze bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.131
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.131.2
    text: |-
      In afwijking van [artikel 3.126, eerste lid, onderdeel a, onder 2°][ref1], kunnen in situaties, bedoeld in het
      eerste lid, ook in aanmerking komen premies voor lijfrenten die zijn verschuldigd aan degene die de onderneming
      voortzet, onder voorwaarde dat deze in Nederland woont of is gevestigd en de lijfrenteverplichting tot zijn
      binnenlandse ondernemingsvermogen rekent.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.131
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.131.3
    text: |-
      Het eerste lid is niet van toepassing voorzover de premies meer bedragen dan op grond van [artikelen 3.128][ref1]
      en [3.129][ref2] is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.131
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.131.4
    text: |-
      De bij de overledene in aanmerking te nemen premies worden in aanmerking genomen op het tijdstip van zijn
      overlijden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.131
  - number: 3.131.5
    text: Het verzoek wordt gedaan bij de aangifte van de overledene.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.131
  - number: '3.132'
    text: Negatieve uitgaven voor inkomensvoorzieningen zijn teruggaven van uitgaven voor inkomensvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.132
  - number: 3.133.1
    text: |-
      Voorzover zich met betrekking tot een aanspraak op *lijfrente* of periodieke uitkeringen als bedoeld in
      [artikel 3.124][ref1] een in het tweede lid genoemde omstandigheid voordoet, worden de premies voor die
      aanspraak die als uitgaven voor inkomensvoorzieningen in aftrek zijn gebracht en het daarover behaalde rendement
      ([artikel 3.137][ref2]) bij de verzekeringnemer dan wel, indien deze is overleden, bij de gerechtigde tot de
      aanspraak als negatieve uitgaven voor inkomensvoorzieningen in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.133.2
    text: 'Het eerste lid vindt toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
  - number: 3.133.2.a
    text: |-
      het een aanspraak als bedoeld in [artikel 3.124, onderdeel b of onderdeel c][ref1], betreft en de aanspraak zodanig
      wordt gewijzigd dat deze niet langer aan de in dat onderdeel gestelde voorwaarden voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.b
    text: |-
      het een aanspraak als bedoeld in [artikel 3.125][ref1] betreft en de aanspraak – beoordeeld vanuit de
      verzekeringnemer – zodanig wordt gewijzigd dat deze niet langer aan de in dat artikel gestelde voorwaarden voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.c
    text: |-
      het een aanspraak als bedoeld in [artikel 3.125][ref1] betreft en de aanspraak zodanig wordt gewijzigd dat
      indien de gewijzigde aanspraak van begin af aan zou zijn bedongen het op grond van de [artikelen 3.127][ref2] en
      [3.129][ref3] in totaal aanmerking te nemen bedrag aan premies voor lijfrenten lager zou zijn geweest dan het in
      aftrek gebrachte bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.d
    text: de aanspraak wordt afgekocht of vervreemd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
  - number: 3.133.2.e
    text: |-
      de aanspraak formeel of feitelijk voorwerp van zekerheid wordt, anders dan ten behoeve van uitstel van betaling op
      grond van [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 3.133.2.f
    text: |-
      het een aanspraak betreft waarvoor als verzekeraar optreedt een persoon of lichaam als bedoeld in
      [artikel 3.126, eerste lid, onderdeel a, onder 2°][ref1], en de aanspraak wordt prijsgegeven, behoudens voorzover
      de aanspraak niet voor verwezenlijking vatbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.g
    text: |-
      de verzekeraar of de in [artikel 3.126, eerste lid, onderdeel d, onder 2°][ref1], bedoelde belastingplichtige niet
      langer voldoet aan de in [artikel 3.126][ref2] gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.h
    text: |-
      de lijfrenteverplichting overgaat, of beoordeeld aan het einde van het kalenderjaar in enig voorafgaand jaar is
      overgegaan, op een ander pensioenfonds of lichaam dat bevoegd is het levensverzekeringsbedrijf te uitoefenen dan
      bedoeld in [artikel 3.126, eerste lid, onderdeel a, onder 1°, onderdeel b of onderdeel d][ref1], ter verwerving
      van pensioenrechten in het kader van de aanvaarding van een dienstbetrekking buiten Nederland teneinde een
      pensioenbreuk als gevolg van deze aanvaarding te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.i
    text: |-
      de lijfrenteverplichting, anders dan bedoeld onder h, geheel of gedeeltelijk overgaat op een andere verzekeraar dan
      bedoeld in [artikel 3.126, eerste lid, onderdeel a, onder 1°, onderdeel b of onderdeel d][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.j
    text: |-
      de aanspraak bij het einde van het kalenderjaar is ondergebracht bij een verzekeraar als bedoeld in
      [artikel 3.126, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.2.k
    text: |-
      een pensioentekort waarvoor premies voor lijfrenten in aanmerking zijn genomen op de voet van
      [artikel 3.127, eerste of tweede lid][ref1], nadien wordt gecompenseerd door middel van verbetering van een
      aanspraak ingevolge een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.3
    text: |-
      Onder overgang van de lijfrenteverplichting wordt mede verstaan herverzekering indien de lijfrente is
      bedongen bij een verzekeraar als bedoeld in [artikel 3.126, eerste lid, onderdeel a, onder 2°][ref1], of
      [artikel 3.131, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.133.4
    text: |-
      Het tweede lid, aanhef en onderdeel i, heeft mede betrekking op verplichtingen die betrekking hebben op aanspraken
      op periodieke uitkeringen en verstrekkingen ter zake van invaliditeit, ziekte of ongeval.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
  - number: 3.133.5
    text: |-
      Voorzover voor de belasting die betrekking heeft op de premies voor een aanspraak, en het daarover behaalde
      rendement, die volgens het eerste lid in samenhang met het tweede lid, onderdelen h en j, als negatieve
      uitgaven voor inkomensvoorzieningen in aanmerking zijn genomen, uitstel van betaling is verleend volgens
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt het eerste lid voor het overige geacht geen
      toepassing te hebben gevonden op die premies en het behaalde rendement.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 3.133.6
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het bepaalde in het tweede lid,
      aanhef en onderdeel k.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.133
  - number: 3.134.1
    text: |-
      Voorzover een *lijfrente* als bedoeld in de [artikelen 3.124][ref1] en [3.125][ref2] wordt omgezet in een ander
      zodanig recht, wordt het tweede recht beschouwd als een voortzetting van het eerste.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.134.2
    text: |-
      [Artikel 3.133][ref1] is niet van toepassing indien een belastingplichtige in het kader van de verdeling van een
      gemeenschap bij echtscheiding of scheiding van tafel en bed, ter voldoening of afkoop van een verplichting tot het
      doen van periodieke uitkeringen of verstrekkingen als bedoeld in [artikel 3.101, eerste lid, onderdeel b][ref2], of
      ter voldoening aan een verplichting tot verevening van pensioenrechten:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.134.2.a
    text: |-
      een aanspraak op periodieke uitkeringen geheel of gedeeltelijk vervreemdt aan zijn binnenlands belastingplichtige
      gewezen echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
  - number: 3.134.2.b
    text: |-
      zijn binnenlands belastingplichtige gewezen echtgenoot aanwijst als onherroepelijk begunstigde van een dergelijke
      aanspraak of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
  - number: 3.134.2.c
    text: |-
      een dergelijke aanspraak omzet in een aanspraak die voor zijn binnenlands belastingplichtige gewezen echtgenoot een
      aanspraak is als bedoeld in de [artikelen 3.124][ref1] en [3.125][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.134.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, kan, in afwijking van [artikel 3.125, eerste lid][ref1], de aanspraak
      zodanig worden gewijzigd dat de uitkeringen onmiddellijk na het tijdstip van de wijziging ingaan en uiterlijk
      eindigen bij het overlijden van de gewezen echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.134.4
    text: |-
      In de gevallen, bedoeld in het tweede lid, wordt de gewezen echtgenoot aangemerkt als verzekeringnemer van de
      aanspraak op periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
  - number: 3.134.5
    text: |-
      Onze Minister kan voor gevallen of groepen van gevallen waarin
      [artikel 3.133, tweede lid, onderdeel a, b of c][ref1], gezien de strekking van dit artikel tot onbillijkheden
      leidt, onder door hem te stellen voorwaarden bepalen dat dit onderdeel a, b of c niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.134.6
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden bepalen dat [artikel 3.133, tweede lid, onderdeel i][ref1],
      niet van toepassing is indien de lijfrenteverplichting overgaat in verband met de overdracht van de
      onderneming van een verzekeraar als bedoeld in [artikel 3.126, eerste lid, onderdeel a, onder 2°][ref2], of
      [artikel 3.131, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.134
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.135.1
    text: |-
      Als negatieve uitgaven voor inkomensvoorzieningen van de verzekeringnemer dan wel, indien deze is overleden, de
      gerechtigde worden mede in aanmerking genomen de premies voor aanspraken uit een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, onderdeel b][ref1], en het daarover behaalde rendement ([artikel 3.137][ref2]) voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.135.1.a
    text: |-
      de aanspraak zodanig wordt gewijzigd dat deze niet langer is aan te merken als een aanspraak uit een zodanige
      pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.135.1.b
    text: |-
      de aanspraak zodanig wordt gewijzigd dat deze geheel of gedeeltelijk niet langer bestaat uit een recht op
      belastbare periodieke uitkeringen of verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.135.1.c
    text: de aanspraak wordt afgekocht of vervreemd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.135.1.d
    text: |-
      de aanspraak formeel of feitelijk voorwerp van zekerheid wordt, anders dan ten behoeve van uitstel van betaling op
      grond van [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 3.135.1.e
    text: |-
      de verplichting inzake de aanspraak geheel of gedeeltelijk overgaat op een andere instelling dan de instelling
      waarbij de aanspraak op grond van de in [artikel 1.7, tweede lid, onderdeel b][ref1], genoemde wettelijke
      regelingen is ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.135.2
    text: |-
      Voor de toepassing van dit artikel alsmede van de [artikelen 3.136][ref1] en [3.137][ref2] wordt degene die
      verplicht is de premies voor de aanspraak te betalen, aangemerkt als de verzekeringnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.135.3
    text: |-
      Voorzover een in het eerste lid bedoelde aanspraak wordt omgezet in een andere zodanige aanspraak, wordt de tweede
      aanspraak beschouwd als een voortzetting van de eerste.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.135.4
    text: |-
      Het eerste lid, onderdelen a en c, is niet van toepassing indien de belastingplichtige in het kader van
      scheiding van tafel en bed of echtscheiding de aanspraak geheel of gedeeltelijk vervreemdt aan zijn binnenlands
      belastingplichtige echtgenoot of gewezen echtgenoot dan wel omzet in een zodanige aanspraak met als gerechtigde die
      echtgenoot of gewezen echtgenoot. Voor de toepassing van deze wet wordt de verkregen of omgezette aanspraak geacht
      de voortzetting te zijn van de eerste aanspraak.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.135.5
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden bepalen dat het eerste lid, onderdeel e, niet van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.135
  - number: 3.136.1
    text: |-
      Bij de belastingplichtige die anders dan door overlijden ophoudt binnenlands belastingplichtige te zijn, worden
      indien hij verzekeringnemer, dan wel indien deze is overleden, gerechtigde is, de premies voor aanspraken als
      bedoeld in [artikel 3.124, onderdelen a, b en c][ref1], die als uitgaven voor inkomensvoorzieningen in aftrek zijn
      gebracht en de premies voor aanspraken als bedoeld in [artikel 1.7, tweede lid, onderdeel b][ref2], alsmede het
      over die premies behaalde rendement als negatieve uitgaven voor inkomensvoorzieningen in aanmerking genomen. Bij de
      toepassing van de eerste volzin blijven premies voor aanspraken als bedoeld in [artikel 3.124, onderdeel c][ref3],
      waarvan de uitkeringen zijn ingegaan buiten beschouwing. Onder ophouden binnenlands belastingplichtig te zijn
      wordt mede verstaan de situatie waarin de belastingplichtige voor de toepassing van de Belastingregeling voor
      het Koninkrijk of een verdrag ter voorkoming van dubbele belasting wordt geacht geen inwoner van Nederland meer
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.136
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.136.2
    text: |-
      Voorzover voor de belasting die betrekking heeft op de premies voor een aanspraak, en het daarover behaalde
      rendement, die volgens het eerste lid als negatieve uitgaven voor inkomensvoorzieningen in aanmerking zijn genomen
      uitstel van betaling is verleend volgens [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt het
      eerste lid voor het overige geacht geen toepassing te hebben gevonden op die premies en het behaalde rendement.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.136
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 3.137.1
    text: |-
      Voor de toepassing van de [artikelen 3.133][ref1], [3.135][ref2] en [3.136][ref3] wordt het bedrag aan in
      aanmerking te nemen premies en het daarover behaalde rendement ter zake van een aanspraak of een gedeelte van een
      aanspraak gesteld op de waarde in het economische verkeer van die aanspraak of dat gedeelte op het tijdstip dat
      onmiddellijk voorafgaat aan dat waarop zich de in die artikelen bedoelde omstandigheid voordoet. Daarbij wordt de
      waarde in het economische verkeer van een aanspraak waarvan nog geen uitkeringen zijn vervallen, tenminste gesteld
      op de premies die voor de aanspraak of een gedeelte van de aanspraak als uitgaven voor inkomensvoorzieningen doch
      niet als negatieve uitgaven voor inkomensvoorzieningen in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.137
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.137.2
    text: |-
      Voor de toepassing van het eerste lid en de [artikelen 3.133][ref1], [3.135][ref2] en [3.136][ref3] blijft
      buiten beschouwing het behaalde rendement over een periode waarin de belastingplichtige geen binnenlands
      belastingplichtige is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.137
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.138.1
    text: |-
      Voorzover bij een binnenlandse belastingplichtige de negatieve uitgaven voor inkomensvoorzieningen die op
      grond van [artikel 3.133, tweede lid, onderdelen h of j][ref1], of [artikel 3.136][ref2] in aanmerking worden
      genomen, eveneens zijn begrepen in het belastbare inkomen uit werk en woning van een vorig kalenderjaar, wordt,
      onder bij ministeriële regeling te stellen voorwaarden, het belastbare inkomen uit werk en woning van dat vorig
      kalenderjaar met de daarin begrepen negatieve uitgaven verlaagd. De verlaging vindt plaats door vermindering van
      de conserverende aanslag over dat jaar bij voor bezwaar vatbare beschikking van de inspecteur. Rechtsmiddelen tegen
      deze beschikking kunnen uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.138
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.138.2
    text: |-
      In een kalenderjaar bedraagt het volgens [artikel 3.133, tweede lid, onderdelen h en j][ref1], en
      [artikel 3.136][ref2] in totaal in aanmerking te nemen bedrag aan negatieve uitgaven ter zake van een aanspraak
      niet meer dan de waarde in het economische verkeer van die aanspraak, waarbij de negatieve uitgaven in de volgorde
      waarin deze opkomen zo veel mogelijk worden toegerekend aan een periode van binnenlandse belastingplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.138
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.138.3
    text: |-
      Voorzover de belasting die betrekking heeft op in aanmerking genomen negatieve uitgaven voor inkomensvoorzieningen
      wordt voldaan, en die negatieve uitgaven eveneens zijn begrepen in het belastbare inkomen uit werk en woning van
      een ander kalenderjaar, wordt het belastbare inkomen uit werk en woning van dat andere kalenderjaar met die daarin
      begrepen negatieve uitgaven verlaagd. Het eerste lid, tweede en derde volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.138
  - number: 3.138.4
    text: |-
      Indien bij een belastingplichtige in een kalenderjaar negatieve uitgaven voor inkomensvoorzieningen in
      aanmerking zijn genomen en hij voor de belasting die daarop betrekking heeft uitstel van betaling heeft volgens
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], wordt, indien de omstandigheid waarvoor deze negatieve
      uitgaven in aanmerking zijn genomen zich niet meer voordoet, op zijn verzoek het belastbare inkomen uit werk en
      woning van dat jaar verminderd met die daarin begrepen negatieve uitgaven. Deze bepaling is van toepassing in bij
      ministeriële regeling te bepalen gevallen en onder bij die regeling te stellen voorwaarden. Het eerste lid, tweede
      en derde volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.138
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '3.139'
    text: 'Als negatieve persoonsgebonden aftrek van een belastingplichtige wordt in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
  - number: 3.139.a
    text: |-
      hetgeen door hem is ontvangen als teruggave van of nagekomen betaling ter zake van onderhoudsverplichtingen die op
      grond van [afdeling 6.2][ref1] in aanmerking zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 3.139.b
    text: |-
      hetgeen door hem is ontvangen als nagekomen schuldaflossing op een geldlening ter zake waarvan verliezen op grond
      van [afdeling 6.3][ref1] in aanmerking zijn genomen, ten hoogste tot het bedrag van verliezen die in aftrek zijn
      gekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.3'
  - number: 3.139.c
    text: |-
      hetgeen door hem is ontvangen als teruggave van of nagekomen betaling ter zake van buitengewone uitgaven die op
      grond van [afdeling 6.5][ref1] in aanmerking zijn genomen, ten hoogste tot het bedrag van de uitgaven die in aftrek
      zijn gekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 3.139.d
    text: |-
      hetgeen door hem is ontvangen als teruggave van of nagekomen betaling ter zake van scholingsuitgaven die op grond
      van [afdeling 6.7][ref1] in aanmerking zijn genomen, ten hoogste tot het bedrag van de uitgaven die in aftrek zijn
      gekomen en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: 3.139.e
    text: |-
      hetgeen door hem is ontvangen als nagekomen betaling ter zake van uitgaven voor monumentenpanden die op grond van
      [afdeling 6.8][ref1] in aanmerking zijn genomen, ten hoogste tot het bedrag van de uitgaven die in aftrek zijn
      gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.139
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: '3.144'
    text: |-
      Niet in geld genoten *loon*, periodieke uitkeringen en verstrekkingen, voordelen uit *eigen woning* en voordelen
      uit kapitaalverzekering eigen woning worden – voorzover niet anders is bepaald – in aanmerking genomen naar de
      waarde die daaraan in het economische verkeer kan worden toegekend, met dien verstande dat voorzover de verwerving
      van dat inkomen het gebruik of verbruik daarvan meebrengt, de waarde wordt gesteld op ten hoogste het bedrag van de
      besparing. Deze kan bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.144
  - number: 3.146.1
    text: |-
      Loon, aangewezen periodieke uitkeringen en verstrekkingen, termijnen van *lijfrenten* en andere periodieke
      uitkeringen en verstrekkingen uit een inkomensvoorziening, uitkeringen op grond van een buitenlandse voorziening
      die naar aard en strekking overeenkomt met een inkomensvoorziening, voordelen uit eigen woning, voordelen uit
      kapitaalverzekering eigen woning en negatieve uitgaven voor inkomensvoorzieningen worden – voorzover niet anders is
      bepaald – geacht te zijn genoten op het tijdstip waarop zij zijn:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.1.a
    text: ontvangen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.1.b
    text: verrekend;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.1.c
    text: ter beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.1.d
    text: rentedragend geworden of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.1.e
    text: vorderbaar en inbaar geworden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
  - number: 3.146.2
    text: |-
      Voor loon is [artikel 13a, tweede en derde lid, van de Wet op de loonbelasting 1964][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13a
  - number: 3.146.3
    text: |-
      De in [artikel 3.83, eerste lid][ref1], bedoelde aanspraken uit een *pensioenregeling* worden geacht te zijn
      genoten op het tijdstip dat onmiddellijk voorafgaat aan dat waarop de belastingplichtige ophoudt binnenlands
      belastingplichtig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 3.146.4
    text: |-
      De in [artikel 3.116, derde en vierde lid][ref1], bedoelde waarde in het economische verkeer van de
      kapitaalverzekering eigen woning wordt geacht te zijn genoten op het tijdstip van de fictieve uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.146.5
    text: |-
      De in de [artikelen 3.133][ref1], [3.135][ref2] en [3.136][ref3] bedoelde negatieve uitgaven voor
      inkomensvoorzieningen worden geacht te zijn genoten op het tijdstip dat onmiddellijk voorafgaat aan dat waarop zich
      de omstandigheid voordoet, bedoeld in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.146
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: '3.147'
    text: |-
      Aftrekbare kosten en uitgaven voor inkomensvoorzieningen komen – voorzover niet anders is bepaald – voor aftrek in
      aanmerking op het tijdstip waarop zij zijn:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.147
  - number: 3.147.a
    text: betaald;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.147
  - number: 3.147.b
    text: verrekend;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.147
  - number: 3.147.c
    text: ter beschikking gesteld of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.147
  - number: 3.147.d
    text: rentedragend geworden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.147
  - number: 3.148.1
    text: |-
      Indien de berekening van het inkomen uit werk en woning leidt tot een negatief bedrag wordt dit aangemerkt als
      verlies uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.148
  - number: 3.148.2
    text: |-
      Indien de berekening van de belastbare winst uit onderneming leidt tot een negatief bedrag, wordt dit tot ten
      hoogste het verlies uit werk en woning aangemerkt als ondernemingsverlies.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.148
  - number: '3.149'
    text: |-
      Voor de toepassing van deze afdeling worden inkomen uit werk en woning en verlies uit werk en woning bepaald zonder
      rekening te houden met te conserveren inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.149
  - number: 3.150.1
    text: |-
      Het verlies uit werk en woning wordt verrekend met de inkomens uit werk en woning van de drie voorafgaande en acht
      volgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
  - number: 3.150.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder verlies uit werk en woning mede verstaan verlies uit werk en
      woning in Nederland zoals bedoeld in [artikel 7.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 3.150.3
    text: De in het eerste lid genoemde termijn van acht jaar wordt terzake van ondernemingsverliezen onbepaald verlengd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
  - number: 3.150.4
    text: |-
      De in het eerste lid genoemde termijn van drie jaar wordt voor een belastingplichtige aan wie
      wegens gemoedsbezwaren tegen één of meer volksverzekeringen ontheffing is verleend als bedoeld in
      [artikel 64, eerste lid, aanhef en onderdeel a, van de Wet financiering sociale verzekeringen][ref1], en hij
      daarvoor bij de aangifte kiest, voor de in het vijfde lid bedoelde ondernemingsverliezen verlengd tot acht jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: 3.150.5
    text: |-
      Het vierde lid is van toepassing op ondernemingsverliezen die zijn toe te rekenen aan kosten en lasten van schade
      als gevolg van risico's die andere belastingplichtigen die wat betreft aard en omvang van de bedrijfsactiviteiten
      in een vergelijkbare positie verkeren als de belastingplichtige, plegen te verzekeren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
  - number: 3.150.6
    text: |-
      De verrekening vindt plaats in de volgorde waarin de verliezen zijn ontstaan en de inkomens zijn genoten, met dien
      verstande dat eerst andere verliezen dan ondernemingsverliezen worden verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
  - number: 3.150.7
    text: |-
      Het verlies uit werk en woning voorzover dit is voortgevloeid uit de toerekening van gemeenschappelijke
      inkomensbestanddelen aan de belastingplichtige en niet kan worden verrekend met inkomens uit werk en woning
      van de jaren waarin de belastingplichtige een partner heeft, wordt ingeval het partnerschap door het overlijden
      van de belastingplichtige eindigt aangemerkt als verlies uit werk en woning van de partner mits zowel de
      belastingplichtige als zijn partner op het tijdstip van beëindiging binnenlands belastingplichtige was.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
  - number: 3.150.8
    text: |-
      Het ondernemingsverlies dat met toepassing van
      [artikel 14c, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1] geacht wordt te zijn geleden door
      de aandeelhouder die de onderneming voortzet, wordt uitsluitend verrekend met de winst uit de voortgezette
      onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.150
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 3.151.1
    text: De inspecteur stelt het bedrag van een verlies uit werk en woning vast bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
  - number: 3.151.2
    text: |-
      Ingeval het verlies geheel of gedeeltelijk bestaat uit een ondernemingsverlies, stelt de inspecteur bij de in het
      eerste lid bedoelde beschikking tevens het bedrag van het ondernemingsverlies vast.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
  - number: 3.151.3
    text: |-
      Het bedrag van het verlies uit werk en woning en het bedrag van het ondernemingsverlies worden afzonderlijk op het
      aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
  - number: 3.151.4
    text: |-
      Indien er grond is voor het vermoeden dat een verlies uit werk en woning of een ondernemingsverlies te hoog is
      vastgesteld, kan de inspecteur de in het eerste lid bedoelde beschikking herzien. Herziening vindt plaats bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
  - number: 3.151.5
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, levert geen grond op voor
      herziening, tenzij de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
  - number: 3.151.6
    text: |-
      [Artikel 16, tweede lid, onderdeel b, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] is
      van overeenkomstige toepassing op herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.151
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 3.152.1
    text: |-
      Verrekening van verlies uit werk en woning met het inkomen uit werk en woning van een voorafgaand kalenderjaar
      vindt plaats door vermindering van de aanslag bij voor bezwaar vatbare beschikking van de inspecteur. In de
      beschikking wordt tevens vastgesteld welk bedrag aan ondernemingsverlies wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
  - number: 3.152.2
    text: |-
      De inspecteur geeft de beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarin het verlies
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
  - number: 3.152.3
    text: |-
      Indien over een voorafgaand kalenderjaar geen aanslag is vastgesteld en met het inkomen uit werk en woning van dat
      jaar een verlies wordt verrekend, nodigt de inspecteur de belastingplichtige alsnog uit tot het doen van aangifte
      voor dat jaar. Voor de toepassing van [artikel 11, derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      wordt de belastingplichtige in dat geval geacht uitstel voor het doen van aangifte te hebben verkregen vanaf het
      einde van het desbetreffende jaar tot het tijdstip van uitnodiging tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
  - number: 3.152.4
    text: |-
      Rechtsmiddelen tegen de beschikking kunnen uitsluitend betrekking hebben op de toepassing van
      [artikel 3.150][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 3.152.5
    text: |-
      Voorafgaand aan de vermoedelijke vaststelling van de in het eerste lid bedoelde beschikking kan de inspecteur
      bij voor bezwaar vatbare beschikking volgens bij ministeriële regeling te stellen regels een voorlopige
      verliesverrekening verlenen tot ten hoogste het bedrag waarop de vermindering vermoedelijk zal worden vastgesteld.
      Een voorlopige verliesverrekening kan door één of meer voorlopige verliesverrekeningen worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
  - number: 3.152.6
    text: |-
      Voorlopige verliesverrekeningen worden verrekend bij de in het eerste lid bedoelde beschikking of, indien een
      dergelijke beschikking niet wordt vastgesteld, met de aanslag over het jaar waarover het verlies dat tot een
      voorlopige verliesverrekening heeft geleid, is aangegeven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.152
  - number: 3.153.1
    text: |-
      Verrekening van een verlies uit werk en woning met het inkomen uit werk en woning van een volgend kalenderjaar
      vindt plaats bij voor bezwaar vatbare beschikking van de inspecteur. In de beschikking wordt tevens vastgesteld
      welk bedrag aan ondernemingsverlies wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.153
  - number: 3.153.2
    text: |-
      De inspecteur geeft de beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarmee het
      verlies wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.153
  - number: 3.153.3
    text: Het bedrag van het verrekende verlies wordt op het aanslagbiljet afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.153
  - number: 3.153.4
    text: |-
      Rechtsmiddelen tegen de beschikking kunnen uitsluitend betrekking hebben op de toepassing van
      [artikel 3.150][ref1], alsmede, indien geen belasting is verschuldigd, tegen de grootte van het verrekende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.153
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 3.154.1
    text: |-
      Op verzoek wordt aan degene die gedurende een tijdvak van drie aaneengesloten gehele kalenderjaren
      (middelingstijdvak) binnenlands belastingplichtige is geweest een teruggaaf van belasting op inkomen uit werk en
      woning (middelingsteruggaaf) verleend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.2
    text: Een kalenderjaar dat tot een middelingstijdvak behoort, wordt niet in een ander middelingstijdvak betrokken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.3
    text: |-
      De middelingsteruggaaf wordt berekend op het verschil van de belasting op inkomen uit werk en woning die over
      de jaren van het middelingstijdvak is geheven en de belasting op inkomen uit werk en woning die verschuldigd zou
      zijn indien het belastbare inkomen uit werk en woning in elk van die jaren een derde gedeelte zou bedragen van het
      totaal van de – ten minste op nihil te stellen – belastbare inkomens uit werk en woning in die jaren (herrekende
      belasting), voorzover dit verschil meer bedraagt dan € 545.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.4
    text: |-
      Als over de jaren van het middelingstijdvak geheven belasting op inkomen uit werk en woning wordt aangemerkt de
      belasting die is geheven vóór toepassing van de heffingskorting. Indien met toepassing van [artikel 9.4][ref1]
      over een jaar geen aanslag is vastgesteld, wordt voor dat jaar als geheven belasting op inkomen uit werk en woning
      aangemerkt het gezamenlijke bedrag van de voorheffingen, bedoeld in [artikel 9.2][ref2], voorzover die betrekking
      hebben op inkomen uit werk en woning, vermeerderd met de daarbij in aanmerking genomen heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 3.154.5
    text: |-
      Onder herrekende belasting wordt verstaan de belasting op inkomen uit werk en woning die zonder toepassing van
      [artikel 9.4][ref1] zou zijn geheven over de herrekende belastbare inkomens uit werk en woning, zonder rekening te
      houden met de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 3.154.6
    text: |-
      Indien over een jaar van het middelingstijdvak een regeling ter voorkoming van dubbele belasting is toegepast,
      wordt het bedrag van de middelingsteruggaaf gesteld op A x C/B, waarbij A voorstelt: het bedrag van de
      middelingsteruggaaf dat zou zijn berekend indien geen regeling ter voorkoming van dubbele belasting zou zijn
      toegepast; B voorstelt: de belasting, bedoeld in het vierde lid die zou zijn geheven indien geen regeling ter
      voorkoming van dubbele belasting zou zijn toegepast; C voorstelt: de belasting, bedoeld in het vierde lid na
      toepassing van de regelingen ter voorkoming van dubbele belasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.7
    text: |-
      Indien [artikel 27b, eerste lid, van de Wet op de loonbelasting 1964][ref1], of [artikel 9.1, derde lid][ref2],
      is toegepast, wordt voor de toepassing van dit artikel onder geheven belasting op inkomen uit werk en woning mede
      verstaan de geheven premie voor de volksverzekeringen en wordt onder de herrekende belasting op inkomen uit werk en
      woning mede verstaan de premie voor de volksverzekeringen die zonder toepassing van artikel 9.4 zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 3.154.8
    text: |-
      Indien in het middelingstijdvak het jaar is begrepen waarin de belastingplichtige de leeftijd van 65 jaar bereikt,
      wordt voor de toepassing van het zevende lid de geheven en herrekende premie voor de volksverzekeringen voor alle
      jaren in het middelingstijdvak gesteld op het bedrag dat zou zijn geheven of herrekend indien de premie voor de
      algemene ouderdomsverzekering in al die jaren verschuldigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.9
    text: |-
      Dit artikel is niet van toepassing op uitkeringen of bedragen die zouden moeten
      worden uitgekeerd wegens het overschrijden van pensioenbegrenzingen als bedoeld in
      [artikel 18a, negende lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
  - number: 3.154.10
    text: |-
      Het verzoek wordt gedaan bij de inspecteur binnen 36 maanden nadat de aanslagen, voorheffingen en beschikkingen
      om geen aanslag op te leggen die op de jaren van het middelingstijdvak betrekking hebben, onherroepelijk zijn
      geworden. Indien over een jaar van het middelingstijdvak wordt nagevorderd of nageheven dan wel bij beschikking
      een aanslag wordt verminderd wegens verrekening van een verlies uit werk en woning, terwijl op het tijdstip van
      het onherroepelijk worden van de navorderingsaanslag, de naheffingsaanslag of de beschikking de in de eerste volzin
      bedoelde termijn van 36 maanden voor meer dan 34 maanden is verstreken, kan een verzoek om teruggaaf tevens worden
      gedaan binnen twee maanden na dat tijdstip. Bij ministeriële regeling kunnen nadere regels worden gesteld met
      betrekking tot de inhoud van het verzoek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: 3.154.11
    text: De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.154
  - number: '3.155'
    text: |-
      Voor de toepassing van deze afdeling worden de geheven en de herrekende belasting bepaald zonder rekening te houden
      met te conserveren inkomen en de daarover verschuldigde belasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.155
  - number: 3.156.1
    text: |-
      De belastingplichtige die zekerheid wenst omtrent de vraag of de voordelen die hij in een kalenderjaar geniet
      of zal gaan genieten uit een arbeidsrelatie of uit arbeidsrelaties waarin sprake is van hetzelfde soort van
      werkzaamheden die onder overeenkomstige condities worden verricht, worden aangemerkt als winst uit een onderneming,
      als loon of als resultaat uit overige werkzaamheden, kan een verzoek indienen bij de inspecteur. De inspecteur
      beslist op het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
  - number: 3.156.2
    text: |-
      Zodra de feitelijke omstandigheden afwijken van de door de belastingplichtige gepresenteerde omstandigheden op
      basis waarvan de beschikking is verleend, meldt de belastingplichtige dit aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
  - number: 3.156.3
    text: |-
      De inspecteur kan de beschikking herzien, indien de melding van de belastingplichtige als bedoeld in het tweede lid
      daartoe aanleiding geeft of hem uit anderen hoofde bekend is dat de feitelijke omstandigheden daartoe aanleiding
      geven. Herziening vindt plaats bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
  - number: 3.156.4
    text: De beschikking geldt voor een termijn van ten hoogste één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
  - number: 3.156.5
    text: |-
      Ingeval de aanvraag betrekking heeft op werkzaamheden die zijn aangevangen of zullen aanvangen na het begin van het
      kalenderjaar waarop de aanvraag betrekking heeft, gaat de in het vierde lid bedoelde termijn in op de dag van de
      aanvang van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
  - number: 3.156.6
    text: |-
      De inspecteur geeft de beschikking, bedoeld in het eerste lid, binnen acht weken na ontvangst van de aanvraag.
      Indien de beschikking niet binnen acht weken kan worden gegeven, wordt die termijn verlengd met ten hoogste vijf
      weken en stelt de inspecteur de aanvrager daarvan schriftelijk en gemotiveerd in kennis. Mede in afwijking van
      [artikel 25 Algemene wet rijksbelastingen][ref1] is de [Algemene wet bestuursrecht][ref2] onverkort van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.156
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005537
  - number: 3.157.1
    text: |-
      De belastingplichtige met een aanmerkelijk belang als bedoeld in [hoofdstuk IV][ref1], die zekerheid wenst omtrent
      de vraag of werkzaamheden die voortvloeien uit een arbeidsrelatie of arbeidsrelaties waarin sprake is van hetzelfde
      soort van werkzaamheden die onder overeenkomstige condities worden verricht, worden aangemerkt als werkzaamheden
      uitsluitend verricht voor rekening en risico van de onderneming van de vennootschap waarin hij het aanmerkelijk
      belang heeft, kan een verzoek indienen bij de inspecteur. De inspecteur beslist op het verzoek bij voor bezwaar
      vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.157
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 3.157.2
    text: |-
      [Artikel 3.156, tweede tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.157
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.15'
  - number: '4.1'
    text: |-
      Belastbaar inkomen uit aanmerkelijk belang is het inkomen uit aanmerkelijk belang verminderd met de te verrekenen
      verliezen uit aanmerkelijk belang ([afdeling 4.10][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
        afdeling: '4.10'
  - number: '4.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen geldt een persoon niet als aanverwant
      indien het huwelijk waardoor de aanverwantschap is ontstaan, door echtscheiding is ontbonden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.2
  - number: '4.3'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.3
  - number: 4.3.a
    text: |-
      wordt met een aandeelhouder gelijkgesteld degene die slechts gerechtigd is tot voordelen uit aandelen en wordt zijn
      gerechtigdheid aangemerkt als aandeel;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.3
  - number: 4.3.b
    text: |-
      wordt met de houder van winstbewijzen gelijkgesteld degene die slechts gerechtigd is tot voordelen uit
      winstbewijzen en wordt zijn gerechtigdheid aangemerkt als winstbewijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen, met uitzondering van de
      [artikelen 4.6 tot en met 4.8][ref1], wordt een recht om aandelen in of winstbewijzen van een vennootschap te
      verwerven (koopoptie) aangemerkt als een dergelijk aandeel respectievelijk een dergelijk winstbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.5.1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen worden
      bewijzen van deelgerechtigdheid in fondsen voor gemene rekening als bedoeld in
      [artikel 2, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1] gelijkgesteld met aandelen in
      vennootschappen met een in aandelen verdeeld kapitaal en worden de fondsen gelijkgesteld met vennootschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
  - number: 4.5.2
    text: |-
      Voor de beoordeling van de vraag of een belastingplichtige een aanmerkelijk belang heeft in een fonds voor gemene
      rekening wordt zijn bezit aan bewijzen van deelgerechtigdheid in het fonds uitgedrukt als een percentage van de
      in omloop zijnde bewijzen van deelgerechtigdheid, waarbij andere dan enkelvoudige bewijzen van deelgerechtigdheid
      worden herleid tot een daarmee overeenstemmend aantal enkelvoudige bewijzen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5
  - number: 4.5a.1
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5a
  - number: 4.5a.1.a
    text: |-
      een lidmaatschapsrecht, of een daarmee op één lijn te stellen bewijs van deelgerechtigdheid tot het vermogen, van
      een coöperatie of vereniging op coöperatieve grondslag gelijkgesteld met een winstbewijs;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5a
  - number: 4.5a.1.b
    text: een coöperatie of vereniging op coöperatieve grondslag gelijkgesteld met een vennootschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5a
  - number: 4.5a.2
    text: |-
      Het eerste lid is niet van toepassing op rechten van lidmaatschap van coöperaties indien die rechten direct en
      uitsluitend of nagenoeg uitsluitend het recht op uitsluitend of nagenoeg uitsluitend gebruik belichamen van een
      gebouw of van een gedeelte daarvan dat blijkens zijn inrichting is bestemd om als afzonderlijk geheel te worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.5a
  - number: '4.6'
    text: |-
      De belastingplichtige heeft een aanmerkelijk belang indien hij, al dan niet tezamen met zijn *partner*, direct
      of indirect:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.6
  - number: 4.6.a
    text: |-
      voor ten minste 5% van het geplaatste kapitaal aandeelhouder is in een vennootschap waarvan het kapitaal geheel of
      ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.6
  - number: 4.6.b
    text: rechten heeft om direct of indirect aandelen te verwerven tot ten minste 5% van het geplaatste kapitaal;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.6
  - number: 4.6.c
    text: |-
      winstbewijzen heeft die betrekking hebben op ten minste 5% van de jaarwinst van een vennootschap dan wel op ten
      minste 5% van wat bij liquidatie wordt uitgekeerd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.6
  - number: 4.6.d
    text: |-
      gerechtigd is tot ten minste 5% van de stemmen uit te brengen in de algemene vergadering van een in artikel 4.5a
      bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Indien een vennootschap verschillende soorten aandelen heeft, heeft de belastingplichtige ook een aanmerkelijk
      belang indien hij, al dan niet tezamen met zijn *partner*, direct of indirect:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.7
  - number: 4.7.1.a
    text: voor ten minste 5% van het geplaatste kapitaal van een soort aandelen aandeelhouder is of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.7
  - number: 4.7.1.b
    text: |-
      rechten heeft om direct of indirect aandelen van een soort te verwerven tot ten minste 5% van het van die soort
      geplaatste kapitaal.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Aandelen in een vennootschap en de aandelen in die vennootschap die zich daarvan onderscheiden uitsluitend doordat
      aan die aandelen een benoemingsrecht, het recht de naam van de vennootschap te mogen bepalen of een met die rechten
      vergelijkbaar recht is verbonden, of doordat ter zake van die aandelen een bijzondere aanbiedingsregeling of een
      daarmee vergelijkbare regeling geldt, worden beschouwd als behorende tot één soort.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan aandelen niet worden aangemerkt als
      aandelen van een soort.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      Voor de vaststelling of een belastingplichtige een aanmerkelijk belang heeft, wordt ingekocht nog in te trekken
      kapitaal niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Indien een belastingplichtige een aanmerkelijk belang heeft in een vennootschap, behoren daartoe ook zijn overige
      aandelen in of winstbewijzen van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      De tot het vermogen van de belastingplichtige behorende aandelen in of winstbewijzen van een vennootschap waarin
      hij geen, maar zijn partner of een van de bloed- of aanverwanten in de rechte lijn van de belastingplichtige of
      zijn partner wel een aanmerkelijk belang heeft, behoren voor de belastingplichtige tot een aanmerkelijk belang.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      Indien tot het vermogen van de belastingplichtige behorende aandelen of winstbewijzen niet op grond van de overige
      artikelen van deze afdeling tot een aanmerkelijk belang behoren, wordt een aanmerkelijk belang aanwezig geacht
      indien [artikel 3.65][ref1], [4.17][ref2], [4.40][ref3] of [4.41][ref4] is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.2
        afdeling: '4.8'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: '4.12'
    text: 'Inkomen uit aanmerkelijk belang is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.12
  - number: 4.12.a
    text: |-
      de voordelen die worden getrokken uit tot een aanmerkelijk belang behorende aandelen of winstbewijzen (reguliere
      voordelen), verminderd met de aftrekbare kosten en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.12
  - number: 4.12.b
    text: |-
      de voordelen die worden behaald bij de vervreemding van tot een aanmerkelijk belang behorende aandelen of
      winstbewijzen, of bij de vervreemding van een gedeelte van de in deze aandelen of winstbewijzen besloten liggende
      rechten (vervreemdingsvoordelen);
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Tot de reguliere voordelen bedoeld in [artikel 4.12, onderdeel a][ref1], behoren:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.13.1.a
    text: |-
      een forfaitair voordeel uit aandelen in of winstbewijzen van een niet in Nederland gevestigde vennootschap waarvan
      het kapitaal geheel of gedeeltelijk in aandelen is verdeeld en waarvan de bezittingen grotendeels, direct of
      indirect, bestaan uit beleggingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
  - number: 4.13.1.b
    text: |-
      de teruggaaf van wat op aandelen is gestort, waarbij een teruggaaf geen regulier voordeel vormt voorzover de
      teruggaaf niet meer bedraagt dan de verkrijgingsprijs van de desbetreffende aandelen en tevoren de algemene
      vergadering van aandeelhouders tot deze teruggaaf heeft besloten en de nominale waarde van de desbetreffende
      aandelen bij statutenwijziging met een gelijk bedrag is verminderd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
  - number: 4.13.1.c
    text: |-
      de teruggaaf van wat op bewijzen van deelgerechtigdheid in een fonds voor gemene rekening als bedoeld in
      [artikel 4.5][ref1], eerste lid, is gestort waarbij een teruggaaf geen regulier voordeel vormt voorzover de
      teruggaaf niet meer bedraagt dan de verkrijgingsprijs van de desbetreffende bewijzen van deelgerechtigdheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 4.13.1.d
    text: |-
      de teruggaaf van wat door houders van winstbewijzen is gestort of ingelegd waarbij een teruggaaf geen regulier
      voordeel vormt voorzover de teruggaaf niet meer bedraagt dan de verkrijgingsprijs van de bedoelde winstbewijzen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
  - number: 4.13.1.e
    text: |-
      de nominale waarde van aandelen die worden uitgereikt door een lichaam dat wordt aangemerkt als
      beleggingsinstelling als bedoeld in [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref1], voorzover niet
      blijkt dat storting heeft plaatsgevonden of zal plaatsvinden. Bijschrijving op die aandelen wordt met uitreiking
      van aandelen gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel28
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '28'
  - number: 4.13.2
    text: |-
      Behoudens de toepassing van het eerste lid, onderdeel e, behoren tot de reguliere voordelen niet de aan
      aandeelhouders uitgereikte aandelen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het forfaitaire voordeel bedoeld in [artikel 4.13, eerste lid, onderdeel a][ref1], wordt gesteld op 4% per jaar
      van de waarde in het economische verkeer die bij het begin van het kalenderjaar aan de tot het aanmerkelijk
      belang behorende aandelen of winstbewijzen kan worden toegekend, verminderd met de overige op grond van
      [artikel 4.12, onderdeel a][ref2], ter zake van die aandelen of winstbewijzen in aanmerking genomen reguliere
      voordelen, doch niet verder dan tot nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.14.2
    text: |-
      Het voordeel wordt naar tijdsgelang berekend. Indien de aandelen of winstbewijzen niet het gehele kalenderjaar tot
      het aanmerkelijk belang hebben behoord, worden bij de berekening van het voordeel gedeelten van kalendermaanden
      verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Indien de vennootschap na het begin van het kalenderjaar is opgericht, treedt voor de toepassing van het eerste lid
      de datum van oprichting in de plaats van het begin van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.4
    text: |-
      Voorzover tot de directe of indirecte bezittingen van de vennootschap aandelen in, lidmaatschapsrechten van en
      belangen bij een ander lichaam behoren, worden niet de bezittingen van het andere lichaam maar die aandelen,
      lidmaatschapsrechten en belangen als bezittingen van de vennootschap in aanmerking genomen indien de feitelijke
      werkzaamheden van het andere lichaam aanmerkelijk verschillen van beleggen of daarmee overeenkomende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.5
    text: |-
      Voor de toepassing van[ artikel 4.13, eerste lid, onderdeel a][ref1], wordt onder een niet in Nederland gevestigde
      vennootschap mede verstaan een in Nederland gevestigde vennootschap die een buiten Nederland aanwezige vaste
      inrichting heeft waarvan, of een vaste vertegenwoordiger buiten Nederland heeft van wie de feitelijke werkzaamheden
      niet aanmerkelijk verschillen van beleggen of daarmee overeenkomende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: 4.14.6
    text: |-
      Voor de toepassing van [artikel 4.13, eerste lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: 4.14.6.a
    text: |-
      worden onder bezittingen mede verstaan: goederen die niet aan een vennootschap toebehoren voorzover de
      waardeveranderingen die vennootschap aangaan of voorzover die vennootschap tot de opbrengsten van die goederen
      gerechtigd is;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.6.b
    text: |-
      worden onder beleggingen mede verstaan: banktegoeden en andere schuldvorderingen, met uitzondering van vorderingen
      die voortvloeien uit feitelijke werkzaamheden van een vennootschap die aanmerkelijk verschillen van beleggen of
      daarmee overeenkomende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.7
    text: |-
      Voor de toepassing van het eerste lid worden bij de bepaling van de waarde in het economische verkeer van het
      aanmerkelijk belang in de vennootschap de in het zesde lid, onderdeel a, bedoelde goederen gewaardeerd met
      inachtneming van de in [artikel 5.22][ref1] bedoelde algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: 4.14.8
    text: |-
      Het forfaitaire voordeel, bedoeld in [artikel 4.13, eerste lid, onderdeel a][ref1], is niet van toepassing op een
      aanmerkelijk belang in:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: 4.14.8.a
    text: |-
      kredietinstellingen, hypotheekbanken en verzekeringsmaatschappijen die officieel zijn genoteerd op bij ministeriële
      regeling aan te wijzen effectenbeurzen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.8.b
    text: |-
      vennootschappen waarvan de feitelijke werkzaamheden aanmerkelijk verschillen van beleggen of daarmee overeenkomende
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.8.c
    text: |-
      vennootschappen die zijn onderworpen aan een belasting naar de winst of het inkomen welke naar Nederlandse
      maatstaven redelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.14.9
    text: |-
      Indien tot het vermogen van een in Nederland gevestigde vennootschap in enigszins belangrijke mate, direct of
      indirect, aandelen in of winstbewijzen van een vennootschap als bedoeld in het eerste lid behoren, worden deze
      aandelen of winstbewijzen voor de toepassing van dit artikel geacht toe te behoren aan diegenen bij wie het belang
      bij de eerstgenoemde vennootschap berust. De aandelen en winstbewijzen worden toegerekend naar evenredigheid van
      ieders belang. Het in een kalenderjaar in aanmerking te nemen voordeel wordt verminderd met een evenredig gedeelte
      van het voordeel dat door de vennootschap of indirect door een andere zodanige vennootschap op de aandelen en
      winstbewijzen in een in het eerste lid bedoelde vennootschap in dat kalenderjaar als beleggingsopbrengst voor de
      heffing van de vennootschapsbelasting in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      Kosten van reguliere voordelen zijn de daarop drukkende kosten voorzover zij zijn gemaakt tot verwerving, inning en
      behoud van die voordelen en in hun totale omvang niet overtreffen wat gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
  - number: 4.15.2
    text: |-
      Bij de bepaling van de kosten van reguliere voordelen blijven renten en kosten van schulden die corresponderen met
      geldvorderingen als bedoeld in [artikel 5.4, eerste lid][ref1], buiten aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 4.15.3
    text: |-
      Voorzover in verband met de voldoening van aftrekbare kosten schulden ontstaan waarvan de verplichting tot betaling
      – anders dan voor het geval van overlijden of arbeidsongeschiktheid van de belastingplichtige – rechtens, al dan
      niet voorwaardelijk, of in feite, direct of indirect, is beperkt, zijn deze kosten niet aftrekbaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
  - number: 4.15.4
    text: 'Tot de kosten behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
  - number: 4.15.4.a
    text: geheven dividendbelasting en kansspelbelasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
  - number: 4.15.4.b
    text: |-
      belasting die buiten Nederland in enige vorm naar het inkomen of bestanddelen van het inkomen wordt geheven indien
      voor de belastingplichtige ter zake daarvan een regeling ter voorkoming van dubbele belasting van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.15
  - number: 4.16.1
    text: 'Onder vervreemding van aandelen of winstbewijzen wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.a
    text: het inkopen van aandelen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.b
    text: het afkopen en inkopen van winstbewijzen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.c
    text: het betaalbaar stellen van liquidatie-uitkeringen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.d
    text: |-
      het van rechtswege worden van aandeelhouder of houder van winstbewijzen in een andere vennootschap indien vermogen
      van de vennootschap waarin de belastingplichtige een aanmerkelijk belang heeft, onder algemene titel overgaat
      op een andere vennootschap. De vorige zinsnede is van overeenkomstige toepassing op een belastingplichtige die
      een aanmerkelijk belang heeft in een vennootschap waarvan vermogen onder algemene titel overgaat op een andere
      vennootschap en die van rechtswege houder wordt van rechten om aandelen in of winstbewijzen van de andere
      vennootschap te verwerven;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.e
    text: de overgang onder algemene titel alsmede de overgang krachtens erfrecht onder bijzondere titel;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.f
    text: het brengen in het vermogen van een onderneming of het tot het resultaat uit een werkzaamheid gaan behoren;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.g
    text: het niet langer aanwezig zijn van een aanmerkelijk belang;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.h
    text: |-
      het anders dan door overlijden ophouden binnenlands belastingplichtige te zijn, hieronder begrepen de situatie
      waarin de belastingplichtige voor de toepassing van de Belastingregeling voor het Koninkrijk of een verdrag ter
      voorkoming van dubbele belasting wordt geacht geen inwoner van Nederland meer te zijn;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.1.i
    text: het verlenen van een koopoptie.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.2
    text: |-
      Indien een aandeel of winstbewijs wordt vervreemd, wordt degene die slechts is gerechtigd tot de voordelen daaruit
      geacht zijn gerechtigdheid ook te hebben vervreemd, tenzij die gerechtigdheid tot dat aandeel of winstbewijs in
      stand blijft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.3
    text: |-
      Indien aandelen of winstbewijzen op grond van [artikel 4.11][ref1] tot een aanmerkelijk belang behoren, worden deze
      aandelen of winstbewijzen geacht te zijn vervreemd indien de belastingplichtige daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.16.4
    text: Een tot een aanmerkelijk belang behorend genotsrecht wordt geacht te zijn vervreemd indien het genotsrecht eindigt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
  - number: 4.16.5
    text: |-
      Met het betaalbaar stellen van een liquidatie-uitkering als bedoeld in het eerste lid, onderdeel c, wordt
      gelijkgesteld het voor rekening van de belastingplichtige voortzetten van de onderneming van de vennootschap
      waarin de belastingplichtige een aanmerkelijk belang heeft, in het kader van de ontbinding van die vennootschap met
      toepassing van [artikel 14c, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 4.17.1
    text: |-
      De overgang krachtens erfrecht of huwelijksvermogensrecht alsmede de verdeling van een nalatenschap of een
      huwelijksgemeenschap binnen twee jaren na het overlijden van de erflater respectievelijk na de ontbinding van de
      huwelijksgemeenschap wordt niet als een vervreemding aangemerkt, mits de verkrijger binnenlands belastingplichtige
      is en de verkregen aandelen of winstbewijzen geen deel uitmaken van het vermogen van een voor zijn rekening
      gedreven onderneming of tot het resultaat uit een werkzaamheid van hem behoren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.17
  - number: 4.17.2
    text: |-
      De overgang krachtens erfrecht op een niet in Nederland wonende verkrijger wordt niet als vervreemding aangemerkt,
      indien de overgang binnen twee jaren wordt gevolgd door een verdeling van de nalatenschap en voorzover de
      verkregen aandelen of winstbewijzen worden toegescheiden aan een binnenlandse belastingplichtige en deze aandelen
      of winstbewijzen geen deel uitmaken van het vermogen van een voor zijn rekening gedreven onderneming of tot het
      resultaat uit een werkzaamheid van hem behoren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      [Artikel 4.16, eerste lid, onderdeel h][ref1], is niet van toepassing bij een aanmerkelijk belang in een niet in
      Nederland gevestigde vennootschap indien het anders dan door overlijden ophouden binnenlands belastingplichtige te
      zijn, hieronder begrepen de situatie waarin de belastingplichtige voor de toepassing van de Belastingregeling voor
      het Koninkrijk of een verdrag ter voorkoming van dubbele belasting wordt geacht geen inwoner van Nederland meer te
      zijn, plaatsvindt binnen acht jaren nadat de belastingplichtige in Nederland is gaan wonen en de belastingplichtige
      gedurende de laatste vijfentwintig jaar in totaal niet langer dan tien jaren in Nederland heeft gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: '4.19'
    text: |-
      De vervreemdingsvoordelen worden gesteld op de overdrachtsprijs verminderd met de verkrijgingsprijs. In geval van
      vervreemding van een gedeelte van de in aandelen of winstbewijzen besloten rechten wordt een evenredig gedeelte van
      de verkrijgingsprijs in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      Onder overdrachtsprijs wordt verstaan de tegenprestatie bij de vervreemding, verminderd met de ten laste van de
      vervreemder komende kosten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.20
  - number: 4.21.1
    text: |-
      Onder verkrijgingsprijs wordt verstaan de tegenprestatie bij de verkrijging vermeerderd met de ten laste van de
      verkrijger gekomen kosten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Indien een belastingplichtige aandelen of winstbewijzen van eenzelfde soort heeft met een verschillende
      verkrijgingsprijs, wordt de verkrijgingsprijs van die aandelen of winstbewijzen gesteld op de gemiddelde
      verkrijgingsprijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Indien bij een vervreemding een verkrijgingsprijs in aanmerking is genomen met toepassing van het tweede lid, wordt
      bij de berekening van de verkrijgingsprijs van de niet-vervreemde aandelen of winstbewijzen uitgegaan van de bij de
      vervreemding in aanmerking genomen verkrijgingsprijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.21
  - number: 4.21.4
    text: |-
      Indien een inbreng heeft plaatsgevonden op de voet van [artikel 3.65][ref1] kan de verkrijgingsprijs negatief zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 4.22.1
    text: |-
      Indien bij een vervreemding of verkrijging een tegenprestatie ontbreekt of is bedongen bij een niet onder
      normale omstandigheden gesloten overeenkomst, wordt als tegenprestatie aangemerkt de waarde die ten tijde van
      de vervreemding, respectievelijk de verkrijging, in het economische verkeer aan de aandelen of winstbewijzen kan
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Het eerste lid is ook van toepassing indien bij een vervreemding het belang in de vennootschap wordt behouden,
      behoudens in geval van uitgifte van aandelen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.22
  - number: '4.23'
    text: |-
      Indien een aandeel of winstbewijs op een tijdstip na de verkrijging daarvan tot een aanmerkelijk belang gaat
      behoren, wordt de verkrijgingsprijs van dat aandeel of winstbewijs gesteld op de waarde in het economische verkeer
      die op dat tijdstip daaraan kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.23
  - number: 4.24.1
    text: |-
      Indien de belastingplichtige aandelen of winstbewijzen vervreemdt maar zijn belang bij de activiteiten van de
      vennootschap direct of indirect geheel of nagenoeg geheel behoudt, wordt een negatief vervreemdingsvoordeel niet in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.2
    text: 'Het negatieve vervreemdingsvoordeel dat op grond van het eerste lid niet in aanmerking wordt genomen, wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.2.a
    text: |-
      indien de belastingplichtige aandelen in de vennootschap behoudt, gevoegd bij de verkrijgingsprijs van de overige
      aandelen in de vennootschap;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.2.b
    text: |-
      indien de belastingplichtige geen aandelen in de vennootschap behoudt, gevoegd bij verkrijgingsprijs van de
      aandelen in de vennootschap door middel waarvan hij het belang direct of indirect heeft behouden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.2.c
    text: |-
      indien de verkrijgingsprijs niet op grond van de onderdelen a en b is toegevoegd aan andere aandelen en
      [artikel 4.16, vierde lid][ref1], is toegepast, gevoegd bij de verkrijgingsprijs van de winstbewijzen van de
      vennootschap waarin de belastingplichtige een aanmerkelijk belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.24.3
    text: |-
      Het eerste en het tweede lid zijn, behoudens in gevallen als bedoeld in het tweede lid, onderdeel c, niet van
      toepassing indien het niet in aanmerking genomen negatieve vervreemdingsvoordeel niet gevoegd kan worden bij de
      verkrijgingsprijs van een aandeel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.4
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing indien de belastingplichtige aandelen of
      winstbewijzen vervreemdt aan zijn echtgenoot of *partner* of een van hun bloedof aanverwanten in de rechte lijn of
      een vennootschap waarin een van deze personen een aanmerkelijk belang heeft, en hij een aanmerkelijk belang behoudt
      in de vennootschap waarop de aandelen of winstbewijzen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
  - number: 4.24.5
    text: |-
      Dit artikel is niet van toepassing op vervreemdingen in de zin van [artikel 4.16, eerste lid, onderdeel h][ref1],
      [artikel 4.16, derde lid][ref2], en [artikel 7.5, zevende lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 4.24a
    text: |-
      Het vervreemdingsvoordeel ter zake van een geruisloze terugkeer als bedoeld in
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1] wordt ten minste gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.24a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 4.25.1
    text: |-
      Indien een belastingplichtige in Nederland gaat wonen en hij op dat tijdstip aandelen in of winstbewijzen van een
      vennootschap heeft, wordt de verkrijgingsprijs van die aandelen of die winstbewijzen gesteld op de waarde die op
      dat tijdstip in het economische verkeer aan die aandelen of die winstbewijzen kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.25
  - number: 4.25.2
    text: Het eerste lid is niet van toepassing indien de belastingplichtige voordien is opgehouden in Nederland te wonen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.25
  - number: 4.25.3
    text: |-
      Het eerste lid is voorts niet van toepassing indien het aandelen in of winstbewijzen van een in Nederland
      gevestigde vennootschap betreft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.25
  - number: 4.25.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de verkrijgingsprijs voor de gevallen
      bedoeld in het tweede en derde lid, en voor het geval voordien [artikel 7.5, zevende lid][ref1], is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 4.25.5
    text: |-
      Bij algemene maatregel van bestuur kunnen tevens regels worden gesteld met betrekking tot het
      verminderen van de aanslag bij de vaststelling waarvan [artikel 4.16, eerste lid, onderdeel h][ref1], of
      [artikel 7.5, zevende lid][ref2], is toegepast, in geval van terugkeer van de belastingplichtige naar Nederland
      binnen tien jaren nadat hij is opgehouden in Nederland te wonen onderscheidenlijk [artikel 7.5, zevende lid][ref3],
      is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 4.26.1
    text: |-
      In geval van uitreiking van aandelen, storting op bewijzen van deelgerechtigdheid in een fonds voor gemene rekening
      of uitreiking van winstbewijzen aan aandeelhouders, wordt als tegenprestatie aangemerkt het bedrag dat ter zake
      van die uitreiking of storting als regulier voordeel wordt aangemerkt, verhoogd met een eventuele toebetaling door
      de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.26
  - number: 4.26.2
    text: Bijschrijving op aandelen wordt met uitreiking van aandelen gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.26
  - number: 4.27.1
    text: |-
      Indien een voordeel als bedoeld in [artikel 4.13, eerste lid, onderdeel a][ref1], in aanmerking is genomen, wordt
      de verkrijgingsprijs van het desbetreffende aandeel of winstbewijs daarmee verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: 4.27.2
    text: |-
      Indien op grond van [artikel 4.14, negende lid][ref1], een voordeel als bedoeld in
      [artikel 4.13, eerste lid, onderdeel a][ref2], in aanmerking is genomen, wordt de verkrijgingsprijs van de aandelen
      van de in Nederland gevestigde vennootschap door middel waarvan de aandelen of winstbewijzen van de niet in
      Nederland gevestigde vennootschap worden gehouden, daarmee verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.2
        afdeling: '4.5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: 4.28.1
    text: |-
      Indien een overdrachtsprijs uit een of meer termijnen bestaat waarvan het aantal of de omvang op het tijdstip van
      de vervreemding nog niet vaststaat, wordt een geschatte overdrachtsprijs in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.28
  - number: 4.28.2
    text: |-
      Het verschil tussen de in het eerste lid bedoelde geschatte overdrachtsprijs en wat daadwerkelijk wordt genoten
      – opgevat overeenkomstig [artikel 4.43][ref1] – wordt in aanmerking genomen voorzover de daadwerkelijk genoten
      termijnen de geschatte overdrachtsprijs te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.9'
  - number: 4.28.3
    text: |-
      Indien het totaal van de daadwerkelijk genoten termijnen lager is dan de geschatte overdrachtsprijs, wordt het
      verschil in aanmerking genomen als negatief vervreemdingsvoordeel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.28
  - number: 4.29.1
    text: |-
      Indien na het tijdstip van de vervreemding de overdrachtsprijs wordt verhoogd, wordt het verschil met de
      oorspronkelijke overdrachtsprijs aangemerkt als vervreemdingsvoordeel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.29
  - number: 4.29.2
    text: |-
      Indien na het tijdstip van de vervreemding de overdrachtsprijs wordt verlaagd, wordt het verschil met de
      oorspronkelijke overdrachtsprijs als negatief vervreemdingsvoordeel in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.29
  - number: 4.30.1
    text: |-
      Indien een koopoptie wordt uitgeoefend, wordt de verkrijgingsprijs van de koopoptie gerekend tot de
      verkrijgingsprijs van de verworven aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.30
  - number: 4.30.2
    text: |-
      Indien een koopoptie op aandelen of winstbewijzen niet wordt uitgeoefend, wordt de verkrijgingsprijs van het
      optierecht gevoegd bij de verkrijgingsprijs van de soort aandelen of winstbewijzen waarop het betrekking had, of
      bij afwezigheid van die soort, bij de verkrijgingsprijs van de aandelen, respectievelijk winstbewijzen die tot het
      aanmerkelijk belang behoren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.30
  - number: '4.31'
    text: |-
      Het vervreemdingsvoordeel ter zake van het door de belastingplichtige verlenen van een koopoptie wordt gesteld op
      het bedrag van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.31
  - number: 4.32.1
    text: |-
      Indien de belastingplichtige een recht verwerft om aandelen of winstbewijzen te vervreemden, wordt de vergoeding
      daarvoor aangemerkt als kosten ter zake van vervreemding die, indien de belastingplichtige het recht uitoefent, in
      mindering komen op de overdrachtsprijs.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.32
  - number: 4.32.2
    text: |-
      Bij de belastingplichtige aan wie wordt vervreemd, komt de vergoeding in mindering op de verkrijgingsprijs van de
      verworven aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.32
  - number: '4.33'
    text: |-
      Ingeval van teruggaaf van hetgeen op aandelen is gestort, wordt de verkrijgingsprijs verminderd met de teruggaaf
      voorzover deze niet als regulier voordeel in aanmerking is genomen. De eerste volzin is van overeenkomstige
      toepassing in geval van teruggaaf op winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.33
  - number: 4.33a
    text: |-
      Indien zich met betrekking tot een schuldvordering een omstandigheid voordoet als bedoeld in
      [artikel 3.98a, tweede lid][ref1], wordt de verkrijgingsprijs van de verkregen aandelen of winstbewijzen
      onderscheidenlijk de reeds in het bezit van de belastingplichtige zijnde aandelen in of winstbewijzen
      in de schuldenaar, verhoogd met het ingevolge [artikel 3.98a, eerste lid, eerste volzin][ref2], tot
      het resultaat uit een werkzaamheid gerekende voordeel dan wel, indien een opwaarderingsreserve als
      bedoeld in [artikel 3.98a, eerste lid, tweede volzin][ref3], is gevormd, met het sindsdien ingevolge
      [artikel 3.98a, vierde, zevende of achtste lid][ref4], tot het resultaat uit een werkzaamheid gerekende voordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.2
        afdeling: '3.4'
  - number: 4.34.1
    text: |-
      In geval van een liquidatie-uitkering wordt als vervreemdingsvoordeel in aanmerking genomen hetgeen wordt
      uitgekeerd boven de verkrijgingsprijs van de desbetreffende aandelen of winstbewijzen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
  - number: 4.34.2
    text: |-
      Voorzover de liquidatie-uitkering niet als vervreemdingsvoordeel in aanmerking is genomen, wordt de
      verkrijgingsprijs verminderd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
  - number: 4.34.3
    text: |-
      Indien bij ontbinding van de vennootschap nadat de vereffening van het vermogen is voltooid, na toepassing van
      het tweede lid een bedrag aan verkrijgingsprijs resteert, wordt het restant aan verkrijgingsprijs aangemerkt als
      negatief vervreemdingsvoordeel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
  - number: 4.34.4
    text: 'Het eerste tot en met derde lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
  - number: 4.34.4.a
    text: |-
      liquidatie-uitkeringen bestaande uit het voor rekening van de belastingplichtige voortzetten van de onderneming van
      een vennootschap met toepassing van [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 4.34.4.b
    text: |-
      het vervreemdingsvoordeel dat wordt genoten bij een vervreemding als bedoeld in [artikel 4.16, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.34.5
    text: |-
      Vervreemdingsvoordelen als bedoeld in het vierde lid worden gesteld op de waarde van de vermogensbestanddelen van
      de onderneming voorzover die door de belastingplichtige wordt voortgezet, vermeerderd met 50% van het verlies dat
      op grond van [artikel 14c, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1] wordt aangemerkt als
      ondernemersverlies in de zin van [artikel 3.148, tweede lid][ref2], en verminderd met 31% van het bedrag dat op
      grond van [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref3] wordt vrijgesteld en voorts verminderd
      met een evenredig deel van de verkrijgingsprijs. De waarde van de vermogensbestanddelen vermeerderd met 50% van het
      verlies wordt tenminste gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.34
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.13'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: 14c
  - number: '4.35'
    text: |-
      Voor de toepassing van deze afdeling wordt een lichaam waarvan de oprichting heeft plaatsgevonden naar Nederlands
      recht steeds geacht in Nederland te zijn gevestigd. Een Europese naamloze vennootschap die bij haar oprichting
      werd beheerst door Nederlands recht, wordt voor de toepassing van de eerste volzin geacht te zijn opgericht naar
      Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.35
  - number: '4.36'
    text: |-
      De verkrijgingsprijs van aandelen of winstbewijzen die tot een aanmerkelijk belang behoren kan, al dan niet op
      verzoek, door de inspecteur bij voor bezwaar vatbare beschikking worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.36
  - number: 4.37.1
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat de verkrijgingsprijs te hoog is vastgesteld, kan de
      inspecteur de beschikking herzien bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.37
  - number: 4.37.2
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor herziening
      opleveren, behalve indien de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.37
  - number: 4.37.3
    text: |-
      De bevoegdheid tot herziening vervalt door verloop van vijf jaren na de datum van vaststelling van de beschikking,
      behoudens voorzover de verkrijgingsprijs was verschuldigd aan een natuurlijke persoon die niet in Nederland woont
      of een rechtspersoon die niet in Nederland is gevestigd, in welk geval de bevoegdheid tot herziening vervalt door
      verloop van twaalf jaren na de datum van vaststelling van de beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.37
  - number: 4.38.1
    text: |-
      Indien de gezamenlijke belanghebbenden daarvoor kiezen, wordt [artikel 4.17][ref1] niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.38.2
    text: De keuze wordt gemaakt bij de aangifte of aangiften waarin het aldus ontstane vervreemdingsvoordeel is begrepen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.38
  - number: 4.39.1
    text: |-
      Indien door toepassing van [artikel 4.17][ref1] geen sprake is van een vervreemding, geldt als verkrijgingsprijs de
      verkrijgingsprijs die geldt voor de erflater respectievelijk degene van wiens zijde de aandelen of winstbewijzen in
      de huwelijksgemeenschap zijn gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.39.2
    text: |-
      Indien in het kader van de verdeling van een nalatenschap of een huwelijksgemeenschap [artikel 4.17][ref1] is
      toegepast en bij het ontstaan van deze nalatenschap of huwelijksgemeenschap ter zake van de daartoe behorende
      aandelen of winstbewijzen [artikel 4.17][ref2] niet is toegepast, geldt als verkrijgingsprijs van de verkregen
      aandelen of winstbewijzen de verkrijgingsprijs die gold voor degene van wie in het kader van de verdeling wordt
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.39.3
    text: |-
      De in het eerste en het tweede lid bedoelde verkrijgingsprijs wordt evenredig over de verkrijgers verdeeld
      voorzover krachtens erfrecht of in het kader van de verdeling van de nalatenschap of de huwelijksgemeenschap een
      gerechtigdheid als bedoeld in [artikel 4.3][ref1] wordt gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: '4.40'
    text: |-
      Op verzoek van de belastingplichtige wordt het voordeel bij de vervreemding vanwege het niet langer aanwezig
      zijn van een aanmerkelijk belang als bedoeld in [artikel 4.16, eerste lid, onderdeel g][ref1], niet in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.40
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.41.1
    text: |-
      Op verzoek van de belastingplichtige wordt het voordeel uit de vervreemding van aandelen of winstbewijzen
      in het kader van een aandelenfusie als bedoeld in [artikel 3.55][ref1] niet in aanmerking genomen.
      [Artikel 3.55, zevende lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 4.41.2
    text: |-
      Op verzoek van de belastingplichtige wordt het voordeel, bedoeld in [artikel 4.16, eerste lid, onderdeel d][ref1],
      niet in aanmerking genomen in het geval van een splitsing van een rechtspersoon mits de splitsende en de
      verkrijgende rechtspersoon in Nederland zijn gevestigd, of in de zin van artikel 3.55, vijfde lid in een lidstaat
      van de Europese Unie zijn gevestigd. [Artikel 3.56, vierde, zesde en zevende lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 4.41.3
    text: |-
      Op verzoek van belastingplichtige wordt het voordeel, bedoeld in [artikel 4.16, eerste lid, onderdeel d][ref1],
      niet in aanmerking genomen in het geval van een juridische fusie, mits de verdwijnende en de verkrijgende
      rechtspersoon in Nederland zijn gevestigd, of in de zin van [artikel 3.55, vijfde lid][ref2] in een lidstaat van de
      Europese Unie zijn gevestigd. [Artikel 3.57, vierde, zesde en zevende lid][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 4.41.4
    text: |-
      De in de vorige leden bedoelde mogelijkheid het voordeel niet in aanmerking te nemen, geldt niet voor een in het
      kader van de aandelenfusie, splitsing of juridische fusie genoten bijbetaling.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.41
  - number: 4.42.1
    text: |-
      Indien door toepassing van [artikel 4.41][ref1] het voordeel in het kader van een aandelenfusie buiten aanmerking
      blijft, wordt als verkrijgingsprijs van de verworven aandelen of winstbewijzen aangemerkt de verkrijgingsprijs van
      de in het kader van de aandelenfusie vervreemde aandelen of winstbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: 4.42.2
    text: |-
      Indien door toepassing van [artikel 4.41][ref1] het voordeel in het kader van een splitsing buiten aanmerking
      blijft, wordt de verkrijgingsprijs van de aandelen of winstbewijzen in de splitsende rechtspersoon voor een
      evenredig gedeelte toegerekend aan de aandelen of winstbewijzen die de belastingplichtige direct na de splitsing
      heeft in de verkrijgende rechtspersonen. [Artikel 3.56, vijfde lid, onderdeel a][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 4.42.3
    text: |-
      Indien door toepassing van [artikel 4.41][ref1] het voordeel in het kader van een juridische fusie buiten
      aanmerking blijft, wordt de verkrijgingsprijs van de aandelen of winstbewijzen in de verdwijnende rechtspersoon
      aangemerkt als de verkrijgingsprijs van de aandelen of winstbewijzen die de belastingplichtige direct na de fusie
      heeft in de verkrijgende rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: 4.42a.1
    text: |-
      Op verzoek van de belastingplichtige worden de voordelen in verband met de
      vervreemding in het kader van de ontbinding van een vennootschap met toepassing van
      [artikel 14c, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.42a
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
  - number: 4.42a.2
    text: |-
      Onze Minister kan aan de toepassing van het eerste lid voorwaarden verbinden. Deze voorwaarden mogen slechts
      strekken tot verzekering van de heffing en invordering van inkomstenbelasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.42a
  - number: 4.43.1
    text: 'Reguliere voordelen worden geacht te zijn genoten op het tijdstip waarop zij zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.1.a
    text: ontvangen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.1.b
    text: verrekend;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.1.c
    text: ter beschikking gesteld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.1.d
    text: rentedragend geworden of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.1.e
    text: vorderbaar en inbaar geworden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
  - number: 4.43.2
    text: |-
      Reguliere voordelen als bedoeld in [artikel 4.13, eerste lid, onderdeel a][ref1], worden geacht uiterlijk te zijn
      genoten bij het einde van het kalenderjaar of het einde van de binnenlandse belastingplicht indien deze in de loop
      van het kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.43
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5.1
        afdeling: '4.5'
  - number: '4.44'
    text: |-
      De op reguliere voordelen in mindering te brengen aftrekbare kosten worden in aanmerking genomen op het tijdstip
      waarop zij betaald of verrekend zijn, door de belastingplichtige ter beschikking zijn gesteld of rentedragend zijn
      geworden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.44
  - number: 4.45.1
    text: |-
      In een kalenderjaar worden bij wijze van vooruitbetaling voldane renten van schulden, kosten van geldleningen
      daaronder begrepen (vooruitbetaalde rente), niet in aanmerking genomen indien zij betrekking hebben op tijdvakken
      die eindigen later dan zes maanden na afloop van het kalenderjaar waarin zij zijn voldaan en voorzover zij
      betrekking hebben op de periode die aanvangt na afloop van het kalenderjaar, waarbij die renten naar evenredigheid
      worden toegerekend aan kalendermaanden en gedeelten van kalendermaanden als kalendermaand worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.45
  - number: 4.45.2
    text: |-
      Vooruitbetaalde rente die op grond van het eerste lid niet in aanmerking is genomen wordt geacht in gelijke delen
      te zijn voldaan in elk van de op het in het eerste lid bedoelde kalenderjaar volgende kalenderjaren waarop de
      renten betrekking hebben. Hierbij worden gedeelten van kalenderjaren als kalenderjaren aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.45
  - number: 4.45.3
    text: |-
      In het jaar waarin de belastingplichtige overlijdt wordt hetgeen ter zake van vooruitbetaalde rente in dat jaar
      door hem is of wordt geacht te zijn voldaan en de vooruitbetaalde rente die in daaropvolgende jaren wordt geacht te
      zijn voldaan, geheel in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.45
  - number: 4.46.1
    text: Vervreemdingsvoordelen worden geacht te zijn genoten op het tijdstip van de vervreemding.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
  - number: 4.46.2
    text: |-
      In geval van een vervreemding als bedoeld in [artikel 4.16, eerste lid, onderdeel h][ref1], wordt als tijdstip van
      genieten aangemerkt het tijdstip dat onmiddellijk voorafgaat aan het ophouden van de binnenlandse belastingplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.46.3
    text: |-
      Het voordeel bedoeld in [artikel 4.16, eerste lid, onderdeel i][ref1] wordt genoten op het tijdstip waarop de
      koopoptie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.46.4
    text: |-
      Het voordeel bedoeld in [artikel 4.28, tweede lid][ref1], wordt in aanmerking genomen op het tijdstip waarop de
      daadwerkelijk genoten termijnen – opgevat overeenkomstig [artikel 4.43][ref2] – de geschatte overdrachtsprijs
      overschrijden. Het negatieve voordeel bedoeld in [artikel 4.28, derde lid][ref3], wordt in aanmerking genomen op
      het tijdstip waarop de laatste termijn is genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.9'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 4.46.5
    text: |-
      Het voordeel bedoeld in [artikel 4.29, eerste lid][ref1], wordt geacht te zijn genoten op het tijdstip van de
      verhoging van de overdrachtsprijs. Het negatieve vervreemdingsvoordeel bedoeld in [artikel 4.29, tweede lid][ref2],
      wordt in aanmerking genomen op het tijdstip van de verlaging van de overdrachtsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 4.46.6
    text: |-
      Het in [artikel 4.34][ref1] bedoelde negatieve vervreemdingsvoordeel in geval van ontbinding van de vennootschap
      wordt in aanmerking genomen op het tijdstip waarop de vereffening is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: 4.46.7
    text: |-
      De vervreemding als bedoeld in [artikel 4.16, derde lid][ref1], wordt in aanmerking genomen op het tijdstip dat is
      vermeld in het verzoek, maar niet eerder dan op het tijdstip waarop het verzoek is ontvangen door de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: 4.46.8
    text: |-
      Het voordeel, bedoeld in [artikel 4.16, vijfde lid][ref1], wordt geacht te zijn genoten op het tijdstip waarop de
      onderneming van de vennootschap waarin de belastingplichtige een aanmerkelijk belang heeft, voor rekening en risico
      van de belastingplichtige wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.1
        afdeling: '4.6'
  - number: '4.47'
    text: |-
      Indien de berekening van het inkomen uit aanmerkelijk belang leidt tot een negatief bedrag wordt dit aangemerkt als
      verlies uit aanmerkelijk belang.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.47
  - number: '4.48'
    text: |-
      Voor de toepassing van deze afdeling worden inkomen uit aanmerkelijk belang en verlies uit aanmerkelijk belang
      bepaald zonder rekening te houden met te conserveren inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.48
  - number: 4.49.1
    text: |-
      Het verlies uit aanmerkelijk belang wordt verrekend met de inkomens uit aanmerkelijk belang van de drie
      voorafgaande en alle volgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder verlies uit aanmerkelijk belang mede verstaan verlies uit
      aanmerkelijk belang in een in Nederland gevestigde vennootschap zoals bedoeld in[ artikel 7.5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 4.49.3
    text: De verrekening vindt plaats in de volgorde waarin de verliezen zijn ontstaan en de inkomens zijn genoten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.49
  - number: 4.49.4
    text: |-
      Het verlies uit aanmerkelijk belang voorzover dit is voortgevloeid uit de toerekening van gemeenschappelijke
      inkomensbestanddelen aan de belastingplichtige en niet kan worden verrekend met inkomens uit aanmerkelijk belang
      van de jaren waarin de belastingplichtige een partner heeft, wordt ingeval het partnerschap door het overlijden
      van de belastingplichtige eindigt aangemerkt als verlies uit aanmerkelijk belang van de partner mits zowel de
      belastingplichtige als zijn partner op het tijdstip van beëindiging binnenlands belastingplichtig was.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.49
  - number: 4.50.1
    text: De inspecteur stelt het bedrag van een verlies uit aanmerkelijk belang vast bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
  - number: 4.50.2
    text: |-
      De inspecteur geeft de bedoelde beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarin
      het verlies is ontstaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
  - number: 4.50.3
    text: Het bedrag van het verlies uit aanmerkelijk belang wordt afzonderlijk op het aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
  - number: 4.50.4
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat het bedrag van het verlies uit aanmerkelijk belang te hoog
      is vastgesteld, kan de inspecteur de in het eerste lid bedoelde beschikking herzien. Herziening vindt plaats bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
  - number: 4.50.5
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, levert geen grond voor herziening
      op, tenzij de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
  - number: 4.50.6
    text: |-
      [Artikel 16, tweede lid, onderdeel b, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] is
      van overeenkomstige toepassing op herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 4.51.1
    text: |-
      Verrekening van verlies uit aanmerkelijk belang met inkomen uit aanmerkelijk belang van een voorafgaand
      kalenderjaar vindt plaats door vermindering van de aanslag bij voor bezwaar vatbare beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
  - number: 4.51.2
    text: |-
      De inspecteur geeft de beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarin het verlies
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
  - number: 4.51.3
    text: |-
      Indien over een voorafgaand kalenderjaar geen aanslag is vastgesteld en met het inkomen
      uit aanmerkelijk belang van dat jaar een verlies wordt verrekend, nodigt de inspecteur de
      belastingplichtige alsnog uit tot het doen van aangifte voor dat jaar. Voor de toepassing van
      [artikel 11, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt de belastingplichtige in dat geval
      geacht uitstel voor het doen van aangifte te hebben verkregen vanaf het einde van het desbetreffende jaar tot het
      tijdstip van uitnodiging tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
  - number: 4.51.4
    text: |-
      Rechtsmiddelen tegen de in het eerste lid bedoelde beschikking kunnen uitsluitend betrekking hebben op de
      toepassing van artikel 4.49.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
  - number: 4.51.5
    text: |-
      Voorafgaand aan de vermoedelijke vaststelling van de in het eerste lid bedoelde beschikking kan de inspecteur
      bij voor bezwaar vatbare beschikking volgens bij ministeriële regeling te stellen regels een voorlopige
      verliesverrekening verlenen tot ten hoogste het bedrag waarop de vermindering vermoedelijk zal worden vastgesteld.
      Een voorlopige verliesverrekening kan door één of meer voorlopige verliesverrekeningen worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
  - number: 4.51.6
    text: |-
      Voorlopige verliesverrekeningen worden verrekend bij de in het eerste lid bedoelde beschikking of, indien een
      dergelijke beschikking niet wordt vastgesteld, met de aanslag over het jaar waarover het verlies dat tot een
      voorlopige verliesverrekening heeft geleid, is aangegeven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.51
  - number: 4.52.1
    text: |-
      Verrekening van een verlies uit aanmerkelijk belang met het inkomen uit aanmerkelijk belang van een volgend
      kalenderjaar vindt plaats bij voor bezwaar vatbare beschikking van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.52
  - number: 4.52.2
    text: |-
      De inspecteur geeft de beschikking gelijktijdig met het vaststellen van de aanslag over het jaar waarmee het
      verlies wordt verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.52
  - number: 4.52.3
    text: Het bedrag van het verrekende verlies wordt op het aanslagbiljet afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.52
  - number: 4.52.4
    text: |-
      Rechtsmiddelen tegen de beschikking kunnen uitsluitend betrekking hebben op de toepassing van [artikel 4.49][ref1],
      en, indien geen belasting is verschuldigd, tegen de grootte van het verrekende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.10'
  - number: 4.53.1
    text: |-
      Indien de belastingplichtige en zijn *partner* in het kalenderjaar en het daaraan voorafgaande kalenderjaar
      geen aanmerkelijk belang hebben, wordt een nog niet verrekend verlies uit aanmerkelijk belang op verzoek van de
      belastingplichtige omgezet in een belastingkorting voor verlies uit aanmerkelijk belang.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.53
  - number: 4.53.2
    text: De belastingkorting bedraagt 25% van het nog niet verrekende verlies.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.53
  - number: 4.53.3
    text: |-
      De inspecteur stelt het bedrag van de belastingkorting vast bij voor bezwaar vatbare beschikking.
      [Artikel 4.50, vierde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.10'
  - number: 4.53.4
    text: |-
      De belastingkorting voor verlies uit aanmerkelijk belang vermindert de belasting op het belastbare inkomen uit werk
      en woning van het in het eerste lid eerstbedoelde kalenderjaar en de daarop volgende jaren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.53
  - number: 4.53.5
    text: |-
      De belastingkorting voor verlies uit aanmerkelijk belang voorzover deze is voortgevloeid uit de toerekening van
      gemeenschappelijke inkomensbestanddelen aan de belastingplichtige en niet kan worden verrekend met de belasting
      op het belastbare inkomen uit werk en woning van de jaren waarin de belastingplichtige een partner heeft, wordt
      ingeval het partnerschap door het overlijden van de belastingplichtige eindigt, aangemerkt als belastingkorting
      voor verlies uit aanmerkelijk belang van de partner mits zowel de belastingplichtige als zijn partner op het
      tijdstip van het eindigen van het partnerschap binnenlands belastingplichtig was.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel4.53
  - number: '5.1'
    text: |-
      Belastbaar inkomen uit sparen en beleggen is het voordeel uit sparen en beleggen verminderd met de persoonsgebonden
      aftrek ([hoofdstuk 6][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
  - number: '5.2'
    text: |-
      Het voordeel uit sparen en beleggen wordt gesteld op 4% (forfaitair rendement) van het gemiddelde van de
      rendementsgrondslag aan het begin van het kalenderjaar (begindatum) en de rendementsgrondslag aan het einde van het
      kalenderjaar (einddatum), voorzover het gemiddelde meer bedraagt dan het heffingvrije vermogen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.2
  - number: 5.3.1
    text: De rendementsgrondslag is de waarde van de bezittingen verminderd met de waarde van de schulden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2
    text: 'Bezittingen zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.a
    text: onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.b
    text: rechten die direct of indirect op onroerende zaken betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.c
    text: |-
      roerende zaken die door de belastingplichtige en personen die behoren tot zijn huishouden niet voor persoonlijke
      doeleinden worden gebruikt of verbruikt alsmede roerende zaken die voor persoonlijke doeleinden worden gebruikt of
      verbruikt doch hoofdzakelijk als belegging dienen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.d
    text: rechten op roerende zaken;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.e
    text: rechten die niet op zaken betrekking hebben, waaronder geld en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.2.f
    text: overige vermogensrechten, met waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.3
    text: 'Schulden zijn verplichtingen met waarde in het economische verkeer, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.3.3.a
    text: |-
      verplichtingen die voortvloeien uit de [Algemene wet inzake rijksbelastingen][ref1], uit een belastingwet waarop
      de [Algemene wet inzake rijksbelastingen][ref2] van toepassing is of uit de [Invorderingswet 1990][ref3], niet in
      aanmerking worden genomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320
      [ref3]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
      - id: ref3
        bwb_id: BWBR0004770
  - number: 5.3.3.b
    text: |-
      overige verplichtingen alleen in aanmerking worden genomen voorzover de gezamenlijke waarde daarvan meer
      bedraagt dan € 2700. Het in de eerste volzin, aanhef en onderdeel b, genoemde bedrag van € 2700 wordt, indien de
      belastingplichtige een partner heeft en de waarde in het economische verkeer van de overige verplichtingen van
      de belastingplichtige en van zijn partner tezamen meer bedraagt dan € 2700 bij elk van hen gesteld op € 5400. De
      tweede volzin is uitsluitend van toepassing indien de belastingplichtige het gehele kalenderjaar dezelfde *partner*
      heeft of voor de toepassing van [artikel 2.17][ref1] wordt geacht het gehele kalenderjaar die *partner* te hebben
      gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.3.4
    text: |-
      Het derde lid, eerste volzin, aanhef en onderdeel b, en tweede volzin zijn niet van toepassing indien
      de belastingplichtige en zijn *partner* bij het doen van aangifte gezamenlijk verzoeken om, onverminderd
      [artikel 2.17, tweede lid][ref1], bij een van hen, of bij beiden tezamen, een rendementsgrondslag aan te geven die
      € 5400 hoger is dan het bedrag van de rendementsgrondslag indien het derde lid, eerste volzin, aanhef en onderdeel
      b, geen toepassing zou vinden. Indien de waarde in het economische verkeer van alle overige verplichtingen van de
      belastingplichtige en zijn *partner* tezamen minder bedraagt dan € 5400, wordt het in de eerste volzin genoemde
      bedrag van € 5400 gesteld op het bedrag van deze lagere waarde. Op het in de eerste volzin bedoelde verzoek kan
      niet worden teruggekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.3.5
    text: |-
      Indien de belastingplichtige niet het gehele jaar binnenlands belastingplichtige is, wordt bij de bepaling van
      het forfaitair rendement de begindatum vervangen door het latere tijdstip waarop de belastingplichtige geboren
      wordt of anders dan door geboorte binnenlands belastingplichtige wordt, of wordt de einddatum vervangen door
      het eerdere tijdstip waarop de belastingplichtige overlijdt of anders dan door overlijden ophoudt binnenlands
      belastingplichtige te zijn. Daarbij wordt het percentage van 4 naar tijdsgelang herleid, waarbij gedeelten van
      kalendermaanden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.3
  - number: 5.4.1
    text: 'Tot de bezittingen, respectievelijk schulden behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.1.a
    text: |-
      geldvorderingen op de als erfgenaam achtergelaten echtgenoot van een overleden ouder van de belastingplichtige die
      voortvloeien uit de verdeling van de nalatenschap van die ouder waarbij aan de genoemde echtgenoot alle goederen
      uit de nalatenschap zijn overgegaan onder de verplichting alle schulden van de nalatenschap voor zijn rekening
      te nemen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.1.b
    text: |-
      indien de nalatenschap is verdeeld overeenkomstig [artikel 13 van Boek 4 van het Burgerlijk Wetboek](onbekend):
      geldvorderingen als bedoeld in [artikel 80, eerste lid, van Boek 4 van het Burgerlijk Wetboek](onbekend);
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.1.c
    text: schulden die corresponderen met de in de onderdelen a en b genoemde vorderingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Tot de bezittingen behoren niet de goederen waarop ten gevolge van de uitoefening door de belastingplichtige van
      een wilsrecht als bedoeld in de [artikelen 19](onbekend) en [21 van Boek 4 van het Burgerlijk Wetboek](onbekend)
      een vruchtgebruik rust ten behoeve van de langstlevende echtgenoot, bedoeld in [artikel 13, eerste lid, van Boek 4
      van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Indien goederen ingevolge het tweede lid niet tot de bezittingen van de in dat lid bedoelde belastingplichtige
      behoren, worden deze goederen bij de langstlevende echtgenoot als bedoeld in [artikel 13, eerste lid, van Boek 4
      van het Burgerlijk Wetboek](onbekend) in aanmerking genomen alsof het in het tweede lid bedoelde wilsrecht niet
      was uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing bij de uitoefening van wilsrechten die inhoudelijk
      overeenkomen met de wilsrechten bedoeld in de [artikelen 19](onbekend) en [21 van Boek 4 van het Burgerlijk
      Wetboek](onbekend) en die zijn opgekomen door een uiterste wilsbeschikking die tevens aanvankelijk voorziet in een
      verdeling van de nalatenschap zoals bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.5
    text: 'Het eerste tot en met vierde lid zijn van overeenkomstige toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.5.a
    text: |-
      een natuurlijk persoon bij plaatsvervulling tot de nalatenschap van de in het eerste lid bedoelde overleden ouder
      is geroepen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.5.b
    text: |-
      een reeds bestaande geldvordering als bedoeld in het eerste lid dan wel een goed waarop een vruchtgebruik rust als
      bedoeld in het tweede lid is verkregen krachtens erfrecht of huwelijksvermogensrecht door een bloed- of aanverwant
      in de rechte neergaande lijn van de in het eerste lid bedoelde overleden ouder of zijn als erfgenaam achtergelaten
      echtgenoot.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.4.6
    text: |-
      Bezittingen die zijn verkregen onder de ontbindende voorwaarde van overlijden waarop een opschortende voorwaarde
      ten gunste van een verwachter aansluit, worden in aanmerking genomen als waren zij onvoorwaardelijk verkregen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.4
  - number: 5.5.1
    text: Het heffingvrije vermogen bedraagt € 19 698.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Op gezamenlijk verzoek van de belastingplichtige en zijn *partner* wordt het heffingvrije vermogen van de
      belastingplichtige verhoogd tot € 39 396 en het heffingvrije vermogen van de partner verminderd tot nihil. Het
      verzoek wordt gedaan bij de aangifte van de belastingplichtige. Op het verzoek kan niet worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      Het verzoek, bedoeld in het tweede lid, kan uitsluitend worden gedaan indien de belastingplichtige het gehele
      kalenderjaar dezelfde *partner* heeft of voor de toepassing van [artikel 2.17][ref1] geacht wordt te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.5.4
    text: |-
      Indien de belastingplichtige of zijn partner aan het einde van het kalenderjaar als ouder het gezag uitoefent over
      een minderjarig kind, wordt het in het eerste lid genoemde bedrag van € 19 698 of het in het tweede lid genoemde
      bedrag van € 39 396 per minderjarig kind verhoogd met € 2631. Indien de belastingplichtige een partner heeft, geldt
      de in de eerste volzin bedoelde verhoging slechts ten aanzien van een van hen; de verhoging wordt toegepast bij de
      oudste, behoudens ingeval zij gezamenlijk anders verzoeken. Op een verzoek als bedoeld in de tweede volzin kan niet
      worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Het heffingvrije vermogen, bedoeld in [artikel 5.5][ref1], wordt verhoogd met de ouderentoeslag indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.1.a
    text: |-
      de belastingplichtige bij het einde van het kalenderjaar, of, indien de belastingplicht in de loop van het jaar is
      geëindigd, bij het einde van de belastingplicht, de leeftijd van 65 jaar heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
  - number: 5.6.1.b
    text: |-
      de gemiddelde rendementsgrondslag, bedoeld in [artikel 5.2][ref1], na aftrek van het heffingvrije vermogen, bedoeld
      in [artikel 5.5][ref2], doch voor het in aanmerking nemen van de ouderentoeslag (saldogrondslag) niet meer bedraagt
      dan € 260 677.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.2
    text: |-
      Indien de belastingplichtige het gehele kalenderjaar dezelfde *partner* heeft of voor de toepassing van
      [artikel 2.17][ref1] geacht wordt te hebben gehad, wordt voor de toepassing van het eerste lid onder saldogrondslag
      verstaan het gezamenlijke bedrag van de saldogrondslag van de belastingplichtige en de saldogrondslag van die
      *partner*, en wordt het in het eerste lid genoemde bedrag van € 260 677 verhoogd tot € 521 354.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.6.3
    text: |-
      Op gezamenlijk verzoek van de belastingplichtige en zijn*partner* wordt het heffingvrije vermogen van
      de belastingplichtige, bedoeld in [artikel 5.5][ref1], na toepassing van het eerste lid, verhoogd met de
      ouderentoeslag van de *partner* en wordt de ouderentoeslag van de *partner* verminderd tot nihil. Het verzoek wordt
      gedaan bij de aangifte van de belastingplichtige. Op het verzoek kan niet worden teruggekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.6.4
    text: |-
      Het verzoek, bedoeld in het tweede lid, kan uitsluitend worden gedaan indien de belastingplichtige het gehele
      kalenderjaar dezelfde *partner* heeft of voor de toepassing van [artikel 2.17][ref1] geacht wordt te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.7.1
    text: 'Tot de bezittingen behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.7
  - number: 5.7.1.a
    text: bossen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.7
  - number: 5.7.1.b
    text: natuurterreinen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.7
  - number: 5.7.1.c
    text: |-
      onroerende zaken die deel uitmaken van een ingevolge de [Natuurschoonwet 1928][ref1] aangewezen landgoed, met
      uitzondering van de op deze landgoederen voorkomende gebouwde eigendommen.


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: 5.7.2
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over hetgeen onder natuurterrein wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.7
  - number: 5.8.1
    text: Tot de bezittingen behoren niet voorwerpen van kunst en wetenschap, tenzij deze hoofdzakelijk als belegging dienen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Als voorwerpen van kunst en wetenschap worden mede aangemerkt voorwerpen van kunst en wetenschap die ter
      beschikking zijn gesteld aan derden voor culturele en wetenschappelijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Voorwerpen van kunst en wetenschap die deel uitmaken van een verzameling worden niet door dit enkele feit
      aangemerkt als belegging.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      Tot de bezittingen behoren niet de rechten op roerende zaken die krachtens erfrecht bij de belastingplichtige
      zijn opgekomen voorzover deze zaken door de belastingplichtige of personen die behoren tot zijn huishouden voor
      persoonlijke doeleinden worden gebruikt of verbruikt, tenzij deze rechten hoofdzakelijk als belegging dienen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.9
  - number: '5.10'
    text: 'Tot de bezittingen behoren niet:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
  - number: 5.10.a
    text: |-
      rechten op kapitaalsuitkeringen of prestaties uit *levensverzekering*, uitsluitend bestaande uit een
      kapitaalsuitkering bij overlijden van de belastingplichtige, zijn *partner* of een bloed- of aanverwant, dan wel op
      prestaties in natura ter zake van de verzorging van een uitvaart, mits:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
  - number: 5.10.a.1°
    text: |-
      de som van het verzekerde kapitaal uit dergelijke levensverzekeringen per verzekerde niet meer bedraagt dan € 6389;
      dan wel indien de som van het verzekerde kapitaal meer bedraagt dan  € 6389:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
  - number: 5.10.a.2°
    text: de som van de waarde van die rechten per persoon niet meer bedraagt dan € 6389;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
  - number: 5.10.b
    text: rechten op kapitaalsuitkeringen die uitsluitend kunnen plaatsvinden bij invaliditeit, ziekte of ongeval;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
  - number: 5.10.c
    text: |-
      rechten op termijnen van een in [artikel 4.28][ref1] bedoelde overdrachtsprijs van een aanmerkelijk belang.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.6.2
        afdeling: '4.6'
  - number: '5.11'
    text: |-
      Tot de bezittingen behoren niet de geblokkeerde spaartegoeden, aandelenoptierechten, aandelen
      en winstbewijzen die worden aangehouden ingevolge een spaarloonregeling als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1], tot een gezamenlijk bedrag van
      maximaal € 17 025.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '5.12'
    text: |-
      Tot de bezittingen en schulden behoren niet lopende termijnen van inkomsten en verplichtingen die betrekking hebben
      op een tijdvak van een jaar of korter en waarvan het achterliggende vermogensbestanddeel eveneens in het bezit is
      van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.12
  - number: 5.13.1
    text: Tot de bezittingen behoren niet maatschappelijke beleggingen tot een gezamenlijk maximum van  € 52 579.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
  - number: 5.13.2
    text: 'Maatschappelijke beleggingen zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
  - number: 5.13.2.a
    text: |-
      groene beleggingen als bedoeld in [artikel 5.14][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5.13.2.b
    text: |-
      sociaal-ethische beleggingen als bedoeld in [artikel 5.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 5.13.3
    text: |-
      Op gezamenlijk verzoek van de belastingplichtige en zijn partner wordt het in het eerste lid vermelde bedrag van de
      belastingplichtige verhoogd tot  € 105 158 en wordt het in het eerste lid vermelde bedrag van de partner verminderd
      tot nihil. Het verzoek wordt gedaan bij de aangifte van de belastingplichtige. Op het verzoek kan niet worden
      teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
  - number: 5.13.4
    text: |-
      Het verzoek, bedoeld in het derde lid, kan uitsluitend worden gedaan indien de belastingplichtige het gehele
      kalenderjaar dezelfde *partner* heeft of voor de toepassing van [artikel 2.17][ref1] geacht wordt te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.14.1
    text: |-
      Groene beleggingen zijn aandelen in, winstbewijzen van en geldleningen aan bij ministeriële regeling aangewezen
      groene fondsen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.2
    text: 'Als groene fondsen kunnen voor de toepassing van dit artikel worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.2.a
    text: |-
      kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], waarvan het doel en
      de feitelijke werkzaamheden hoofdzakelijk bestaan in het verstrekken van kredieten ten behoeve van projecten in het
      belang van de bescherming van het milieu, waaronder natuur en bos, of het direct of indirect beleggen van vermogen
      in dergelijke projecten;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 5.14.2.b
    text: |-
      beleggingsinstellingen als bedoeld in de [Wet toezicht beleggingsinstellingen][ref1], waarvan het doel en de
      feitelijke werkzaamheden hoofdzakelijk bestaan in het direct of indirect beleggen van vermogen in projecten in het
      belang van de bescherming van het milieu, waaronder natuur en bos.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: 5.14.3
    text: 'Projecten als bedoeld in het tweede lid zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.3.a
    text: |-
      in Nederland gelegen projecten of categorieën van projecten die door Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, in overeenstemming met Onze Minister van Financiën en na overleg met Onze
      Minister van Landbouw, Natuurbeheer en Visserij en Onze Minister van Verkeer en Waterstaat, bij ministeriële
      regeling of verklaring zijn aangewezen als projecten in het belang van de bescherming van het milieu, waaronder
      natuur en bos;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.3.b
    text: |-
      in ontwikkelingslanden en daarmee gelijk te stellen gebieden gelegen projecten of categorieën van projecten die
      door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze Minister
      van Financiën en na overleg met Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Economische
      Zaken en Onze Minister van Ontwikkelingssamenwerking bij ministeriële regeling of verklaring zijn aangewezen als
      projecten in het belang van de bescherming van het milieu, waaronder natuur en bos.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.4
    text: |-
      Op verklaringen en aanwijzingen als bedoeld in het derde lid is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 5.14.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld. Daaronder kunnen worden
      begrepen regels ter verzekering van de heffing over voordelen die niet voortvloeien uit het verstrekken van
      kredieten ten behoeve van projecten in het belang van de bescherming van het milieu, waaronder natuur en bos, of
      uit het direct of indirect beleggen van vermogen in dergelijke projecten. Tevens kunnen daaronder worden begrepen
      regels ter verzekering van de heffing over voordelen voorzover deze verband houden met de in een groen fonds
      aanwezige zuivere winst ten tijde van de aanwijzing van het fonds.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.14.6
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer of Onze Minister van Landbouw, Natuurbeheer en Visserij nadere regels worden gesteld met betrekking
      tot de verklaring bedoeld in het derde lid. Het ontwerp van een ministeriële regeling bedoeld in het derde lid of
      in de vorige volzin wordt ten minste vier weken voordat de regeling wordt vastgesteld, toegezonden aan de Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.14
  - number: 5.15.1
    text: |-
      Sociaal-ethische beleggingen zijn aandelen in, winstbewijzen van en geldleningen aan bij ministeriële regeling
      aangewezen sociaal-ethische fondsen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.2
    text: 'Als sociaal-ethische fondsen kunnen voor de toepassing van dit artikel worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.2.a
    text: |-
      kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], waarvan het doel en
      de feitelijke werkzaamheden hoofdzakelijk bestaan in het verstrekken van kredieten ten behoeve van sociaal-ethische
      projecten, of in het direct of indirect beleggen van vermogen in dergelijke projecten;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 5.15.2.b
    text: |-
      beleggingsinstellingen als bedoeld in de [Wet toezicht beleggingsinstellingen][ref1] waarvan het doel en de
      feitelijke werkzaamheden hoofdzakelijk bestaan in het direct of indirect beleggen van vermogen in sociaal-ethische
      projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: 5.15.3
    text: |-
      Sociaal-ethische projecten als bedoeld in het tweede lid zijn projecten die door Onze Minister voor
      Ontwikkelingssamenwerking in overeenstemming met Onze Minister van Financiën en Onze Minister van Buitenlandse
      Zaken bij ministeriële regeling of verklaring zijn aangewezen als projecten die in het belang zijn van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.3.a
    text: de voedselzekerheid en voedingsverbetering in ontwikkelingslanden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.3.b
    text: de sociale en culturele ontwikkeling in ontwikkelingslanden of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.3.c
    text: de economische ontwikkeling, werkgelegenheid en regionale ontwikkeling in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.4
    text: |-
      Op verklaringen en aanwijzingen als bedoeld in het derde lid is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 5.15.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld. Daaronder kunnen worden
      begrepen regels ter verzekering van de heffing over voordelen die niet voortvloeien uit het verstrekken van
      kredieten ten behoeve van sociaal-ethische projecten of uit het direct of indirect beleggen van vermogen in
      dergelijke projecten. Tevens kunnen daaronder worden begrepen regels ter verzekering van de heffing over voordelen
      voorzover deze verband houden met de in een sociaal-ethisch fonds aanwezige zuivere winst ten tijde van de
      aanwijzing van het fonds.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.15.6
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Buitenlandse Zaken en Onze Minister voor
      Ontwikkelingssamenwerking nadere regels worden gesteld met betrekking tot de verklaring bedoeld in het derde lid.
      Het ontwerp van een ministeriële regeling bedoeld in het derde lid of in de vorige volzin wordt ten minste vier
      weken voordat de regeling wordt vastgesteld, toegezonden aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.15
  - number: 5.16.1
    text: Tot de bezittingen behoren niet beleggingen in durfkapitaal tot een gezamenlijk maximum van € 52 579.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
  - number: 5.16.2
    text: 'Beleggingen in durfkapitaal zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
  - number: 5.16.2.a
    text: |-
      directe beleggingen in durfkapitaal als bedoeld in [artikel 5.17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 5.16.2.b
    text: |-
      indirecte beleggingen in durfkapitaal als bedoeld in [artikel 5.18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 5.16.2.c
    text: |-
      culturele beleggingen als bedoeld in [artikel 5.18a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 5.16.3
    text: |-
      Op gezamenlijk verzoek van de belastingplichtige en zijn partner wordt het in het eerste lid vermelde bedrag van de
      belastingplichtige verhoogd tot € 105 158 en wordt het in het eerste lid vermelde bedrag van de partner verminderd
      tot nihil. Het verzoek wordt gedaan bij de aangifte van de belastingplichtige. Op het verzoek kan niet worden
      teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
  - number: 5.16.4
    text: |-
      Het verzoek, bedoeld in het derde lid, kan uitsluitend worden gedaan indien de belastingplichtige het gehele
      kalenderjaar dezelfde *partner* heeft of voor de toepassing van [artikel 2.17][ref1] geacht wordt te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 5.17.1
    text: |-
      Directe beleggingen in durfkapitaal zijn geregistreerde achtergestelde geldleningen aan een beginnende ondernemer
      die de lening gebruikt voor de financiering van bestanddelen van zijn verplichte ondernemingsvermogen of, indien
      de beginnende ondernemer een rechtspersoon is, de lening gebruikt wordt voor de financiering van bestanddelen van
      het ondernemingsvermogen die tot het verplichte ondernemingsvermogen zouden behoren indien de rechtspersoon een
      natuurlijk persoon zou zijn, gedurende de eerste acht jaar na het verstrekken van de geldlening.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.2
    text: 'Een geldlening wordt niet meer als een belegging in durfkapitaal aangemerkt zodra de beginnende ondernemer:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.2.a
    text: niet langer voldoet aan de voorwaarden die aan hem gesteld zijn;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.2.b
    text: |-
      de geldlening niet langer dient ter financiering van bestanddelen van het verplichte ondernemingsvermogen of,
      indien de beginnende ondernemer een rechtspersoon is, de geldlening niet langer dient ter financiering van
      bestanddelen van het ondernemingsvermogen die tot het verplichte ondernemingsvermogen zouden behoren indien de
      rechtspersoon een natuurlijk persoon zou zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.3
    text: 'Onder een beginnende ondernemer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.3.a
    text: |-
      een natuurlijk persoon die in Nederland voor zijn rekening een onderneming drijft en ten aanzien van wie de
      inspecteur onder door hem te stellen voorwaarden op verzoek bij voor bezwaar vatbare beschikking heeft verklaard
      dat deze voldoet aan bij ministeriële regeling te stellen voorwaarden met betrekking tot de toepassing van de
      zelfstandigenaftrek in het kalenderjaar waarin de lening is verstrekt, het voorafgaande jaar of het daaropvolgende
      jaar alsmede het aantal jaren waarover de zelfstandigenaftrek ten hoogste reeds mag zijn toegepast;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.3.b
    text: |-
      een rechtspersoon die in Nederland een onderneming drijft en ten aanzien waarvan de inspecteur onder door hem
      te stellen voorwaarden op verzoek bij voor bezwaar vatbare beschikking heeft verklaard dat deze voldoet aan bij
      ministeriële regeling te stellen voorwaarden met betrekking tot de totstandkoming van de rechtspersoon, de omvang
      van de onderneming, de herkomst van de onderneming en de aard van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4
    text: |-
      Bij ministeriële regeling kunnen ter zake van geldleningen als bedoeld in het eerste lid voorwaarden worden gesteld
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4.a
    text: de vormgeving;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4.b
    text: de omvang;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4.c
    text: de mate van achterstelling;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4.d
    text: de registratie en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.4.e
    text: het renteniveau.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.5
    text: 'Het eerste lid is niet van toepassing indien de geldleningen zijn aangegaan tussen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.5.a
    text: de belastingplichtige en zijn partner, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.17.5.b
    text: personen die gezamenlijk een onderneming drijven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.17
  - number: 5.18.1
    text: |-
      Indirecte beleggingen in durfkapitaal zijn geldleningen aan, aandelen in of winstbewijzen van bij ministeriële
      regeling aangewezen participatiemaatschappijen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.2
    text: |-
      Als participatiemaatschappij kunnen worden aangewezen in Nederland gevestigde rechtspersonen met als doel en
      feitelijke werkzaamheid het:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.2.a
    text: |-
      hoofdzakelijk en op brede schaal verstrekken van achtergestelde geldleningen aan beginnende ondernemers
      als bedoeld in [artikel 5.17, derde lid][ref1], of het deelnemen in beginnende ondernemers als bedoeld in
      [artikel 5.17, derde lid, onderdeel b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 5.18.2.b
    text: |-
      uitsluitend of nagenoeg uitsluitend verstrekken van geldleningen aan of deelnemen in participatiemaatschappijen met
      het in onderdeel a bedoelde doel en feitelijke werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3
    text: |-
      Bij ministeriële regeling kunnen voor achtergestelde geldleningen en deelnemingen door een participatiemaatschappij
      voorwaarden worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.a
    text: de mate van achterstelling;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.b
    text: de looptijd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.c
    text: het renteniveau;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.d
    text: de aanwending;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.e
    text: de omvang van de geldlening per ondernemer of per rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.f
    text: de omvang van de deelneming per rechtspersoon en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18.3.g
    text: de duur van de deelneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18
  - number: 5.18a.1
    text: |-
      Culturele beleggingen zijn aandelen in, winstbewijzen van en geldleningen aan bij ministeriële regeling aangewezen
      cultuurfondsen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.2
    text: 'Als cultuurfondsen kunnen voor de toepassing van dit artikel worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.2.a
    text: |-
      kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], waarvan het doel
      en de feitelijke werkzaamheden hoofdzakelijk bestaan in het verstrekken van kredieten ten behoeve van culturele
      projecten in Nederland, of in het direct of indirect beleggen van vermogen in dergelijke projecten;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 5.18a.2.b
    text: |-
      beleggingsinstellingen als bedoeld in de [Wet toezicht beleggingsinstellingen][ref1] waarvan het doel en de
      feitelijke werkzaamheden hoofdzakelijk bestaan in het direct of indirect beleggen van vermogen in culturele
      projecten in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0004809
  - number: 5.18a.3
    text: |-
      Culturele projecten als bedoeld in het tweede lid zijn projecten die door Onze Minister van Onderwijs, Cultuur
      en Wetenschappen in overeenstemming met Onze Minister van Financiën bij ministeriële regeling of verklaring zijn
      aangewezen als projecten die in het belang zijn van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.3.a
    text: de Nederlandse podiumkunsten of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.3.b
    text: de Nederlandse musea.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.4
    text: |-
      Op verklaringen en aanwijzingen als bedoeld in het derde lid is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 5.18a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld. Daaronder kunnen worden
      begrepen regels ter verzekering van de heffing over voordelen die niet voortvloeien uit het verstrekken van
      kredieten ten behoeve van culturele projecten in Nederland of uit het direct of indirect beleggen van vermogen in
      dergelijke projecten. Tevens kunnen daaronder worden begrepen regels ter verzekering van de heffing over voordelen
      voorzover deze verband houden met de in een cultuurfonds aanwezige zuivere winst ten tijde van de aanwijzing van
      het fonds.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.18a.6
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen
      nadere regels worden gesteld met betrekking tot de verklaring bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.18a
  - number: 5.19.1
    text: Bezittingen en schulden worden in aanmerking genomen voor de waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.19
  - number: 5.19.2
    text: |-
      Bezittingen en schulden die, al dan niet tezamen, in het economische verkeer als een eenheid plegen te worden
      beschouwd, worden als eenheid in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.19
  - number: 5.19.3
    text: |-
      Indien de waarde van een bezitting of van een schuld op de begindatum of de einddatum niet kan worden bepaald,
      wordt die waarde bepaald op het naastbij gelegen tijdstip waarop dat wel mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.19
  - number: 5.19.4
    text: |-
      *Genotsrechten* die zijn verleend tegen een zakelijke vergoeding die wordt voldaan in regelmatig vervallende
      termijnen die betrekking hebben op een tijdvak van ten hoogste een jaar, worden gewaardeerd op nihil. De eerste
      volzin is van overeenkomstige toepassing op schulden die corresponderen met de aldaar bedoelde genotsrechten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.19
  - number: 5.20.1
    text: |-
      De waarde van een woning die een belastingplichtige in belangrijke mate ter beschikking
      staat, wordt, in afwijking van [artikel 5.19, eerste lid][ref1], gesteld op de volgens
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] voor die woning vastgestelde waarde of waarden voor
      het tijdvak waarbinnen het kalenderjaar valt. Indien de woning deel uitmaakt van een onroerende zaak als bedoeld
      in [artikel 16 van de Wet waardering onroerende zaken][ref3], wordt de waarde van de woning gesteld op het gedeelte
      van de waarde van de onroerende zaak dat kan worden toegerekend aan de woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.4'
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 5.20.2
    text: |-
      Voor de toepassing van deze afdeling wordt onder een woning verstaan een woning als bedoeld in
      [artikel 3.111, eerste lid][ref1], aanhef, die de belastingplichtige niet anders dan tijdelijk als hoofdverblijf
      ter beschikking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: '5.21'
    text: |-
      Voor de waardering van effecten die zijn opgenomen in enige bij ministeriële regeling aangewezen prijscourant
      wordt de waarde in het economische verkeer op de einddatum gesteld op de slotnotering die is vermeld in de
      prijscourant die betrekking heeft op die einddatum, dan wel, indien er geen prijscourant is die betrekking
      heeft op die einddatum, de slotnotering die is vermeld in de prijscourant die betrekking heeft op de laatste
      beursdag voorafgaande aan de einddatum. De waardering van zodanige effecten op de begindatum wordt gesteld op de
      slotnotering van het voorafgaande kalenderjaar. Indien [artikel 5.3, vijfde lid][ref1], van toepassing is, wordt de
      waarde in het economische verkeer op de begindatum gesteld op de slotnotering die is vermeld in de prijscourant die
      betrekking heeft op de laatste beursdag voorafgaande aan de begindatum.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 5.22.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in aanmerking te nemen waarde van
      *genotsrechten*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.22
  - number: 5.22.2
    text: |-
      Bezittingen waarop een genotsrecht is gevestigd, worden gewaardeerd op het verschil van de waarde van de
      onbezwaarde bezitting en de overeenkomstig het eerste lid vastgestelde waarde van het genotsrecht. De eerste volzin
      is van overeenkomstige toepassing op schulden waarvan een genotsgerechtigde de rente moet voldoen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.22
  - number: 5.22.3
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder *genotsrecht*: elke gerechtigdheid tot
      voordelen uit goederen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.22
  - number: 5.22.4
    text: |-
      Indien een genotsrecht is gevestigd in de vorm van verstrekkingen als bedoeld in [artikel 3.101, tweede lid][ref1],
      wordt voor de toepassing van het tweede lid de waarde van het genotsrecht op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '5.23'
    text: |-
      Bij algemene maatregel van bestuur kunnen, in het kader van dit hoofdstuk passende, regels worden gesteld ten
      behoeve van de waardering van bezittingen en schulden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel5.23
  - number: 6.1.1
    text: 'Persoonsgebonden aftrek is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.1.1.a
    text: de in het kalenderjaar op de belastingplichtige drukkende persoonsgebonden aftrekposten en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.1.1.b
    text: het gedeelte van de persoonsgebonden aftrek van voorafgaande jaren dat niet eerder in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.1.2
    text: 'Persoonsgebonden aftrekposten zijn de:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.1.2.a
    text: |-
      uitgaven voor onderhoudsverplichtingen ([afdeling 6.2][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.1.2.b
    text: |-
      verliezen op beleggingen in durfkapitaal ([afdeling 6.3][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.3'
  - number: 6.1.2.c
    text: |-
      uitgaven voor levensonderhoud van *kinderen* ([afdeling 6.4][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.4'
  - number: 6.1.2.d
    text: |-
      buitengewone uitgaven ([afdeling 6.5][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.1.2.e
    text: |-
      weekenduitgaven voor gehandicapten ([afdeling 6.6][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.6'
  - number: 6.1.2.f
    text: |-
      scholingsuitgaven ([afdeling 6.7][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: 6.1.2.g
    text: |-
      uitgaven voor monumentenpanden ([afdeling 6.8][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: 6.1.2.h
    text: |-
      aftrekbare giften ([afdeling 6.9][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.9'
  - number: 6.1.3
    text: |-
      Uitgaven als bedoeld in het tweede lid, onderdelen c, d en e, worden in aanmerking genomen voorzover de
      belastingplichtige zich redelijkerwijs gedrongen heeft kunnen voelen tot het doen van die uitgaven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.1.4
    text: |-
      Bij algemene maatregel van bestuur kunnen aanspraken op vergoedingen of tegemoetkomingen alsmede genoten of te
      genieten vergoedingen of tegemoetkomingen worden aangewezen die buiten beschouwing blijven bij de bepaling van de
      omvang van hetgeen op de belastingplichtige aan uitgaven drukt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.1
  - number: 6.2.1
    text: |-
      De persoonsgebonden aftrek vermindert het inkomen uit werk en woning van het kalenderjaar, maar niet verder dan
      tot nihil.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Voorzover de persoonsgebonden aftrek het inkomen uit werk en woning van het kalenderjaar niet vermindert,
      vermindert de aftrek het belastbaar inkomen uit sparen en beleggen van het jaar, maar niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Voorzover de persoonsgebonden aftrek het inkomen uit werk en woning en het belastbaar inkomen uit sparen en
      beleggen van het kalenderjaar niet vermindert, vermindert de aftrek het inkomen uit aanmerkelijk belang van het
      jaar, maar niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2
  - number: 6.2.4
    text: |-
      Voor de toepassing van het eerste en het derde lid wordt het inkomen uit werk en woning en het inkomen uit
      aanmerkelijk belang bepaald zonder rekening te houden met te conserveren inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2
  - number: 6.2.5
    text: |-
      Bij een vermindering worden allereerst in aanmerking genomen de aftrekposten vermeld in
      [artikel 6.1, tweede lid][ref1], in de volgorde waarin zij daarin zijn vermeld en vervolgens het gedeelte van de
      persoonsgebonden aftrek van voorafgaande jaren, bedoeld in [artikel 6.1, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.2a.1
    text: |-
      De inspecteur stelt het bedrag van de op enig tijdstip niet in aanmerking genomen persoonsgebonden aftrek vast bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
  - number: 6.2a.2
    text: |-
      Indien een beschikking als bedoeld in het eerste lid gelijktijdig wordt gegeven met de vaststelling van een
      belastingaanslag, wordt het bedrag van de niet in aanmerking genomen persoonsgebonden aftrek afzonderlijk op het
      aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
  - number: 6.2a.3
    text: |-
      Indien er grond is voor het vermoeden dat het in het eerste lid bedoelde bedrag te hoog is vastgesteld, kan
      de inspecteur de in dat lid bedoelde beschikking herzien. Herziening vindt plaats bij voor bezwaar vatbare
      beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
  - number: 6.2a.4
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, levert geen grond op voor
      herziening, tenzij de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
  - number: 6.2a.5
    text: |-
      [Artikel 16, tweede lid, onderdeel b, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] is
      van overeenkomstige toepassing op herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 6.2a.6
    text: |-
      Rechtsmiddelen tegen de in het eerste lid bedoelde beschikking kunnen uitsluitend betrekking hebben op het bedrag,
      bedoeld in [artikel 6.1, eerste lid, onderdeel a][ref1]. Rechtsmiddelen tegen de in het derde lid, tweede volzin,
      bedoelde beschikking kunnen uitsluitend betrekking hebben op het bedrag van de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.2b.1
    text: |-
      Ingeval de verschuldigde belasting over een kalenderjaar nihil bedraagt en op een inkomen van dat jaar
      persoonsgebonden aftrek in mindering is gekomen wegens buitengewone uitgaven ([afdeling 6.5][ref1]), stelt de
      inspecteur op verzoek van de belastingplichtige het bedrag aan buitengewone uitgaven dat daarbij in mindering is
      gekomen vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.2b.2
    text: |-
      [Artikel 6.2a, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.2b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.1'
  - number: 6.3.1
    text: 'Onderhoudsverplichtingen zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.1.a
    text: |-
      periodieke uitkeringen en verstrekkingen op grond van een rechtstreeks uit het familierecht voortvloeiende
      verplichting, tenzij deze worden gedaan aan bloed- of aanverwanten in de rechte lijn of in de tweede graad van
      de zijlijn;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.1.b
    text: afkoopsommen van dergelijke uitkeringen of verstrekkingen die worden gedaan aan de gewezen echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.1.c
    text: |-
      op grond van [artikel 13 van de Invoeringswet Wet werk en bijstand][ref1] verhaalde kosten van bijstand tot
      voorziening in het levensonderhoud van de duurzaam van de belastingplichtige gescheiden levende echtgenoot of
      gewezen echtgenoot;


      [ref1]: https://wetten.overheid.nl/BWBR0015704#Artikel13
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0015704
        artikel: '13'
  - number: 6.3.1.d
    text: |-
      bedragen die in het kader van echtscheiding of scheiding van tafel en bed worden voldaan ter zake van de
      verplichting tot verrekening van pensioenrechten en van *lijfrenten* en andere inkomensvoorzieningen waarvan de
      betaalde premies als uitgave voor inkomensvoorziening in aanmerking zijn genomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.1.e
    text: |-
      in rechte vorderbare periodieke uitkeringen en verstrekkingen die berusten op een wettelijke verplichting tot
      vergoeding van schade door het derven van levensonderhoud;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.1.f
    text: |-
      in rechte vorderbare periodieke uitkeringen en verstrekkingen die berusten op een dringende morele verplichting tot
      voorziening in het levensonderhoud.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
  - number: 6.3.2
    text: |-
      Onderhoudsverplichtingen als bedoeld in het eerste lid, onderdeel a, e of f, worden ingeval deze de vorm hebben
      van periodieke verstrekkingen van huisvesting in een woning of een gedeelte van een woning en indien zij worden
      verstrekt door een beperkt gerechtigde tot die woning of dat gedeelte van een woning, bij hem in aanmerking genomen
      voor het bedrag waarvoor die verstrekkingen bij degene die deze geniet, in aanmerking worden genomen op de voet van
      [artikel 3.101, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 6.4.1
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdelen e en f][ref1], behoren niet de
      periodieke uitkeringen en verstrekkingen die worden gedaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.4.1.a
    text: bloed- of aanverwanten in de rechte lijn of in de tweede graad van de zijlijn;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.4
  - number: 6.4.1.b
    text: personen die behoren tot het huishouden van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.4
  - number: 6.4.2
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdelen b en d][ref1], behoren niet de
      afkoopsommen en verrekenbedragen die worden gedaan in de vorm van *lijfrenten* en andere inkomensvoorzieningen,
      voorzover de voor die voorzieningen betaalde premies als uitgave voor inkomensvoorziening in aanmerking zijn
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.4.3
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdeel d][ref1], behoren niet rechten op
      periodieke uitkeringen en verstrekkingen die zijn toegekend door degene die tot de verrekening verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.5.1
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdeel b][ref1], behoren afkoopsommen
      die worden gedaan in de vorm van een betaling van een premie voor een lijfrente aan een verzekeraar als bedoeld in
      [artikel 3.126, eerste lid, onderdeel a, onder 1°][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.5.2
    text: 'De termijnen van de lijfrente moeten:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
  - number: 6.5.2.a
    text: toekomen aan de gewezen echtgenoot;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
  - number: 6.5.2.b
    text: onmiddellijk na het betalen van de premie ingaan;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
  - number: 6.5.2.c
    text: uiterlijk bij het overlijden van de gewezen echtgenoot eindigen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
  - number: 6.5.3
    text: |-
      De voor de lijfrente betaalde premie wordt aangemerkt als een premie voor een lijfrente als bedoeld in
      [artikel 3.124, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.5.4
    text: |-
      Indien de lijfrente niet meer voldoet aan de in dit artikel bedoelde voorwaarden, wordt geacht een omstandigheid
      als bedoeld in [artikel 3.133, tweede lid][ref1], te hebben plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 6.6.1
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdeel d][ref1],
      behoren bedragen die worden voldaan ter zake van de verrekening van pensioenrechten
      in de vorm van een betaling van een premie voor een *lijfrente* als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ____.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.6.2
    text: |-
      Voor de toepassing van [artikel 3.125, eerste lid][ref1], wordt de echtgenoot of de gewezen echtgenoot aangemerkt
      als de belastingplichtige en als de verzekeringnemer van de in die bepaling genoemde lijfrenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.6.3
    text: |-
      De voor de lijfrente betaalde premie wordt aangemerkt als een premie voor een lijfrente als bedoeld in
      [artikel 3.124, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.6.4
    text: |-
      De lijfrente wordt aangemerkt als een lijfrente als bedoeld in [artikel 3.125, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 6.6.5
    text: |-
      Indien de lijfrente niet meer voldoet aan de in dit artikel bedoelde voorwaarden, wordt geacht een omstandigheid
      als bedoeld in [artikel 3.133, tweede lid][ref1], te hebben plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 6.7.1
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdeel a][ref1], behoren de periodieke
      uitkeringen en verstrekkingen voorzover die zijn overeengekomen in het kader van echtscheiding of scheiding van
      tafel en bed ter verrekening van:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.7.1.a
    text: pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.7
  - number: 6.7.1.b
    text: |-
      *lijfrenten* en andere inkomensvoorzieningen voorzover de daarvoor betaalde premies als uitgave voor
      inkomensvoorziening in aanmerking zijn genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.7
  - number: 6.7.2
    text: |-
      Tot de onderhoudsverplichtingen, bedoeld in [artikel 6.3, eerste lid, onderdeel a][ref1], behoren de periodieke
      uitkeringen en verstrekkingen die dienen ter vervanging van dergelijke onderhoudsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.7.3
    text: |-
      Het eerste en het tweede lid zijn uitsluitend van toepassing op periodieke uitkeringen en verstrekkingen die worden
      gedaan door degene die tot de verrekening respectievelijk de vervanging verplicht is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Verliezen op beleggingen in durfkapitaal zijn verliezen op geldleningen aan beginnende ondernemers als bedoeld
      in [artikel 5.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 6.8.2
    text: |-
      Onder een verlies wordt verstaan het gedeelte van de hoofdsom van de geldlening dat door de belastingplichtige is
      kwijtgescholden binnen de eerste acht jaar na het verstrekken van de geldlening.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Het verlies wordt in aanmerking genomen voorzover de inspecteur, op verzoek, bij voor bezwaar vatbare beschikking
      heeft verklaard dat het kwijtgescholden gedeelte van de geldlening niet meer voor verwezenlijking vatbaar is. De
      inspecteur neemt de beschikking niet eerder dan twaalf maanden na het verstrekken van de geldlening.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
  - number: 6.8.4
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden kan de termijn worden verlengd waarbinnen de geldlening moet
      zijn kwijtgescholden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
  - number: 6.8.5
    text: |-
      De verliezen worden in aanmerking genomen voorzover deze in de in het tweede lid bedoelde periode in totaal niet
      meer bedragen dan  € 46 984 per beginnende ondernemer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
  - number: 6.8.6
    text: |-
      De verliezen komen voor aftrek in aanmerking op het tijdstip van kwijtschelding van de geldlening, maar niet eerder
      dan op dat van de dagtekening van de beschikking bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.8
  - number: 6.13.1
    text: |-
      Uitgaven voor levensonderhoud van *kinderen* zijn uitgaven voor levensonderhoud van kinderen jonger dan 30 jaar
      die ten minste in belangrijke mate door de belastingplichtige worden onderhouden. Voor de beoordeling in welke mate
      een kind door de belastingplichtige wordt onderhouden, worden, indien de belastingplichtige een *partner* heeft, de
      uitgaven van de belastingplichtige en zijn partner voor het levensonderhoud van het kind samengevoegd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.13
  - number: 6.13.2
    text: |-
      Uitgaven wegens ziekte, invaliditeit en bevalling, alsmede voor weekenduitgaven voor gehandicapte kinderen van 27
      jaar of ouder die doorgaans in een inrichting verblijven, zijn geen uitgaven voor levensonderhoud.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.13
  - number: 6.14.1
    text: 'Uitgaven voor levensonderhoud van een *kind* worden niet in aanmerking genomen indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.14
  - number: 6.14.1.a
    text: |-
      de belastingplichtige of een persoon die tot zijn huishouden behoort, voor het kind recht heeft op kinderbijslag
      volgens de [Algemene Kinderbijslagwet][ref1] of op een tegemoetkoming volgens een naar aard en strekking met die
      wet overeenkomende buitenlandse regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 6.14.1.b
    text: |-
      voor het kind het recht op kinderbijslag volgens [artikel 7b van de Algemene Kinderbijslagwet][ref1] is
      uitgesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
  - number: 6.14.1.c
    text: |-
      het kind recht heeft op een gift, een voorwaardelijke gift of een prestatiebeurs volgens de
      [Wet studiefinanciering 2000][ref1] die niet uitsluitend bestaat uit een reisvoorziening in de zin van die wet,
      op financiële ondersteuning als bedoeld in de [artikelen 7.51, eerste tot en met zesde lid][ref2], [7.51a][ref3]
      en [17.10 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4], op tegemoetkoming volgens
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref5] of op een tegemoetkoming volgens
      een naar aard en strekking van genoemde regelingen overeenkomende buitenlandse regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 6.14.2
    text: Bij ministeriële regeling wordt bepaald in welke gevallen het eerste lid, onderdeel a, niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.14
  - number: '6.15'
    text: |-
      Uitgaven voor levensonderhoud van een *kind* worden in aanmerking genomen tot een bedrag bepaald volgens bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.15
  - number: '6.16'
    text: 'Buitengewone uitgaven zijn de uitgaven wegens:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.a
    text: |-
      ziekte, invaliditeit en bevalling van de belastingplichtige, zijn *partner*, zijn jonger dan 27-jarige kinderen
      en tot zijn huishouden behorende ernstig gehandicapte personen van 27 jaar of ouder. Bij algemene maatregel van
      bestuur wordt bepaald wanneer een persoon voor de toepassing van deze bepaling als ernstig gehandicapt wordt
      beschouwd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.b
    text: overlijden van de belastingplichtige, zijn partner en zijn jonger dan 27-jarige kinderen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.c
    text: arbeidsongeschiktheid of chronische ziekte van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.d
    text: ouderdom van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.e
    text: chronische ziekte van kinderen van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.f
    text: adoptie door de belastingplichtige of zijn partner;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.16.g
    text: |-
      ziekte en invaliditeit van bij de belastingplichtige inwonende zorgafhankelijke ouders, broers of zusters, met dien
      verstande dat bij algemene maatregel van bestuur wordt bepaald wanneer ouders, broers of zusters voor de toepassing
      van deze bepaling als zorgafhankelijk worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.16
  - number: 6.17.1
    text: 'Als uitgaven wegens ziekte, invaliditeit en bevalling worden aangemerkt de daarmee verband houdende:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.1.a
    text: |-
      uitgaven voor genees-, heel- en verloskundige hulp, met inbegrip van farmaceutische en andere hulpmiddelen en
      vervoer;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.1.b
    text: uitgaven voor extra gezinshulp;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.1.c
    text: |-
      extra uitgaven voor een op medisch voorschrift gehouden dieet indien zij meer bedragen dan € 113, tot een bedrag
      bepaald volgens bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.1.d
    text: extra uitgaven voor kleding en beddengoed, volgens bij ministeriële regeling te stellen regels;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.1.e
    text: |-
      uitgaven voor reizen in verband met het regelmatig bezoeken van wegens ziekte of invaliditeit langer dan een maand
      verpleegde personen met wie de bezoeker bij de aanvang van de ziekte of invaliditeit een gezamenlijke huishouding
      voerde, indien de afstand tussen de woning of de verblijfplaats van de bezoeker en de plaats waar de verpleging
      plaatsvindt gemeten langs de meest gebruikelijke weg meer beloopt dan 10 kilometer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Als hulpmiddel wordt mede aangemerkt een middel dat de persoon in staat stelt tot het verrichten van een normale
      lichaamsfunctie waartoe hij zonder dat middel niet in staat zou zijn. Bij algemene maatregel van bestuur kunnen
      regels worden gesteld met betrekking tot de aard van de hulpmiddelen ter zake waarvan uitgaven in aanmerking kunnen
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.17
  - number: 6.18.1
    text: |-
      Met betrekking tot de uitgaven, bedoeld in [artikel 6.17, eerste lid, onderdeel a][ref1], worden:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 6.18.1.a
    text: |-
      uitgaven voor farmaceutische hulpmiddelen die niet zijn verstrekt op voorschrift van een arts, in aanmerking
      genomen tot een bedrag van € 23 per persoon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.18
  - number: 6.18.1.b
    text: |-
      premies als bedoeld in [paragraaf 3.3 van de Zorgverzekeringswet][ref1] niet in aanmerking genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Paragraaf3.3
