  - number: 10.2.1
    text: |-
      De tabelcorrectiefactor is de verhouding van het gemiddelde van de prijsindexcijfers van de achttiende tot en met
      de zevende aan het kalenderjaar voorafgaande maand, tot het gemiddelde van de prijsindexcijfers van de dertigste
      tot en met de negentiende aan het kalenderjaar voorafgaande maand.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.2
  - number: 10.2.2
    text: |-
      De prijsindexcijfers zijn de cijfers uit de «Consumentenprijsindex Alle Huishoudens, afgeleid» van het Centraal
      Bureau voor de Statistiek. De gemiddelde prijsindexcijfers worden berekend uit de prijsindexcijfers vermeld in
      het nummer van het Statistisch Bulletin, waarin het indexcijfer van de zevende respectievelijk negentiende aan het
      kalenderjaar voorafgaande maand voor het eerst, al dan niet voorlopig, wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.2
  - number: 10.2.3
    text: |-
      Indien de basis voor de prijsindexcijfers wijzigt, wordt bij ministeriële regeling aangegeven op welke wijze wordt
      overgegaan op de nieuwe reeks prijsindexcijfers.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.2
  - number: 10.3.1
    text: |-
      Bij het begin van het kalenderjaar worden de in de [artikelen 3.19, tweede lid][ref1], en
      [3.112, eerste en vijfde lid][ref2], vermelde percentages en het in genoemd tweede lid en eerste lid laatstvermelde
      bedrag alsmede het in genoemd vijfde lid vermelde bedrag bij ministeriële regeling vervangen door andere
      percentages en een ander bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 10.3.2
    text: |-
      Het in de [artikelen 3.19, tweede lid][ref1], en [3.112, eerste lid][ref2], laatstvermelde percentage en het in die
      leden laatstvermelde bedrag alsmede het in a[rtikel 3.112, vijfde lid][ref3], vermelde bedrag worden berekend door
      het te vervangen percentage respectievelijk het te vervangen bedrag te vermenigvuldigen met de factor i.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 10.3.3
    text: |-
      Onder de factor i wordt verstaan: de verhouding van het indexcijfer van de woninghuren over juli van het
      voorafgaande kalenderjaar tot dat indexcijfer over juli van het tweede voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
  - number: 10.3.4
    text: |-
      Bij het begin van het eerste kalenderjaar van een op grond van de [Wet waardering onroerende zaken][ref1] geldend
      tijdvak worden de volgens het tweede lid berekende percentages bijgesteld met de verhouding van het gemiddelde
      van de eigenwoningwaarden die betrekking hebben op het voorafgaande tijdvak en het gemiddelde van die waarden die
      betrekking hebben op het eerstbedoelde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 10.3.5
    text: |-
      De in de artikel 3.112, eerste lid, eerstvermelde percentages worden achtereenvolgens berekend door het volgens het
      tweede en vierde lid berekende laatstvermelde percentage in [artikel 3.112, eerste lid][ref1], te vermenigvuldigen
      met 0,4, 0,6 en 0,8.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 10.3.6
    text: |-
      Het in [artikel 3.112, vijfde lid][ref1], vermelde percentage wordt berekend door het volgens het tweede en vierde
      lid berekende laatstvermelde percentage in [artikel 3.112, eerste lid][ref2], te vermenigvuldigen met 10/6.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 10.3.7
    text: |-
      De in [artikel 3.19, tweede lid][ref1], eerstvermelde vier percentages worden achtereenvolgens berekend door
      respectievelijk nihil en de volgens het vijfde lid berekende drie percentages te vermeerderen met het volgens
      [artikel 10.4, tweede lid][ref2], berekende percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 10.4.1
    text: |-
      Bij het begin van het kalenderjaar worden het percentage en het laatstgenoemde bedrag in
      [artikel 6.31, eerste lid, onderdeel a][ref1], bij ministeriële regeling vervangen door een ander percentage en een
      ander bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.8'
  - number: 10.4.2
    text: |-
      Het percentage vermeld in [artikel 6.31, eerste lid, onderdeel a][ref1], wordt berekend door het te vervangen
