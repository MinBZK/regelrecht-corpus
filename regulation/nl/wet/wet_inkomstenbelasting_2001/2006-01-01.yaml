        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.5'
  - number: 3.129.2.a.3°
    text: de onderneming wordt gestaakt door het overlijden van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.b
    text: '€ 202 612 in de gevallen – andere dan die van onderdeel a – waarin:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.b.1°
    text: de ondernemer ten tijde van het staken de leeftijd van 50 jaar heeft bereikt of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.b.2°
    text: de aan de ondernemer toekomende termijnen van lijfrenten dadelijk ingaan;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.c
    text: € 101 311 in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.3
    text: 'Het bedrag aan reeds opgebouwde voorzieningen is de som van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.3.a
    text: |-
      de waarde in het economische verkeer ten tijde van het staken van de in
      [artikel 3.13, eerste lid, onderdelen b en c][ref1], bedoelde aanspraken;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
