      [artikel 24 van de Belastingregeling voor het Koninkrijk ][ref1]wordt de winst die is toe te rekenen aan de vaste
      inrichting die gelegen is in de Nederlandse Antillen of Aruba berekend zonder inachtneming van het eerste lid.


