  - number: 2.5.3
    text: |-
      Indien de belastingplichtige niet langer kiest voor de toepassing van de regels van deze wet voor binnenlandse
      belastingplichtigen, wordt in het laatste jaar dat voorafgaat aan het eerste jaar waarin de binnenlandse
      belastingplichtige die niet gedurende het gehele kalenderjaar in Nederland woont, of de buitenlandse
      belastingplichtige niet heeft gekozen voor de regels die gelden voor binnenlandse belastingplichtigen, het inkomen
      vermeerderd met een bedrag dat gelijk is aan de in de laatste acht jaar ten laste van het inkomen gekomen negatieve
      bedragen die niet behoren tot het Nederlandse inkomen volgens [artikel 7.1][ref1] en die negatieve bedragen
      die daartoe wel behoren maar waarover het heffingsrecht op grond van het belastingverdrag niet aan Nederland is
      toegewezen. De vorige volzin is niet van toepassing met betrekking tot negatieve bedragen uit kalenderjaren van
      binnenlandse belastingplicht en de persoonsgebonden aftrek als bedoeld in [hoofdstuk 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '6'
  - number: 2.5.4
    text: |-
      In gevallen als bedoeld in het derde lid, wordt de aanslag over het in dat lid bedoelde jaar verhoogd
      met het bedrag van de belastingkorting voor verlies uit aanmerkelijk belang dat in de laatste acht jaar
      in mindering is gebracht op de belasting op het belastbare inkomen uit werk en woning of de volgens
      [artikel 10 van de Wet financiering sociale verzekeringen][ref1] berekende premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel10
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '10'
  - number: 2.5.5
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld voor de vermindering van belasting en de
      verrekening van dividendbelasting voor dat deel van het belastbare inkomen dat niet behoort tot het Nederlandse
      inkomen volgens [artikel 7.1][ref1], en dat deel dat wel daartoe behoort maar waarover het heffingsrecht op grond
      van het belastingverdrag niet aan Nederland is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.1'
  - number: '2.6'
    text: |-
      Voor bepaalde groepen werknemers die van buiten Nederland in dienstbetrekking worden genomen als bedoeld in
      [artikel 15a, eerste lid, onderdeel j, van de Wet op de loonbelasting 1964][ref1], kunnen bij algemene maatregel
      van bestuur, onder daarbij te stellen voorwaarden, regels worden gesteld volgens welke zij kunnen kiezen voor
      gehele of gedeeltelijke toepassing van de regels van deze wet voor buitenlandse belastingplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: 2.7.1
    text: |-
      De over een kalenderjaar verschuldigde inkomstenbelasting is het gezamenlijke bedrag van de over het kalenderjaar
      berekende belasting op:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.7
  - number: 2.7.1.a
    text: het belastbare inkomen uit werk en woning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.7
  - number: 2.7.1.b
    text: het belastbare inkomen uit aanmerkelijk belang en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.7
  - number: 2.7.1.c
    text: |-
      het belastbare inkomen uit sparen en beleggen. Voor belastingplichtigen die gedurende het gehele kalenderjaar,
      dan wel gedurende het kalenderjaar vanaf hun geboorte of tot aan hun overlijden, onder de regels van deze wet voor
      binnenlandse belastingplichtigen vallen, wordt het op grond van de eerste volzin berekende gezamenlijke bedrag, na
      toepassing van regelingen ter voorkoming van dubbele belasting, verminderd met het bedrag van de heffingskorting
      voor de inkomstenbelasting ([artikel 8.3][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 2.7.2
    text: |-
      Indien de belastingplichtige ook premieplichtig is voor de volksverzekeringen en de volgens
      [artikel 12, eerste lid, van de Wet financiering sociale verzekeringen][ref1] berekende
      heffingskorting voor de volksverzekeringen niet volledig kan worden verrekend met de volgens
      [artikel 10 van de Wet financiering sociale verzekeringen][ref2] berekende premie voor de volksverzekeringen,
      wordt het bedrag van de verschuldigde inkomstenbelasting, na toepassing van regelingen ter voorkoming van dubbele
      belasting, ook met dat niet verrekende deel verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel10
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '10'
  - number: 2.8.1
    text: |-
      Indien in het belastbare inkomen uit werk en woning of het belastbare inkomen uit aanmerkelijk belang te
      conserveren inkomen is begrepen, is de verschuldigde belasting voorzover deze bij wege van aanslag wordt geheven
      de belasting die wordt berekend over de belastbare inkomens, verminderd met het daarin begrepen te conserveren
      inkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Als te conserveren inkomen worden aangemerkt de positieve inkomensbestanddelen die in aanmerking zijn genomen op
      grond van de [artikelen 3.58, eerste lid][ref1], [3.64, eerste lid][ref2], [3.83, eerste of tweede lid][ref3],
      [3.116, vierde lid][ref4], [3.133, tweede lid, onderdelen h of j][ref5], [3.136, eerste lid][ref6],
      [4.16, eerste lid, onderdeel h][ref7], [7.2, achtste lid][ref8], of [7.5, vierde, vijfde of zevende lid][ref9],
      alsmede, indien de verkrijger een natuurlijk persoon is die niet in Nederland woont en de verkregen aandelen of
      winstbewijzen geen deel uitmaken van het vermogen van een voor zijn rekening gedreven Nederlandse onderneming als
      bedoeld in [artikel 7.2][ref10] of tot het resultaat uit een werkzaamheid in Nederland van hem behoren, op grond
      van [artikel 4.16, eerste lid, onderdeel e][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
