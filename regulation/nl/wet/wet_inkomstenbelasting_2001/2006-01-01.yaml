    text: |-
      Op aanspraken die uitsluitend dan wel mede betrekking hebben op lijfrenten als bedoeld in
      [artikel 3.125, eerste lid, onderdeel c][ref1], zoals dit onderdeel luidde op 31 december 2005, blijven de op
      die datum geldende bepalingen die verband houden met de aanspraken op dergelijke lijfrenten van toepassing, voor
      zover de aanspraken voortvloeien uit premies die vóór 1 januari 2006 in aanmerking zijn genomen als uitgaven voor
      inkomensvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 10a.1.2
    text: |-
      Indien ter zake van een overeenkomst waarin een aanspraak is opgenomen die mede betrekking heeft op lijfrenten als
      bedoeld in [artikel 3.125, eerste lid, onderdeel c][ref1], zoals dit onderdeel luidde op 31 december 2005, ook na
      31 december 2005 nog premies worden voldaan, worden die premies geacht geen betrekking te hebben op lijfrenten als
      bedoeld in genoemd onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 10a.1.3
    text: |-
      Indien ter zake van een overeenkomst waarin een aanspraak is opgenomen die uitsluitend of mede betrekking heeft op
      lijfrenten als bedoeld in [artikel 3.125, eerste lid, onderdeel c][ref1], zoals dit onderdeel luidde op 31 december
      2005, ook na 31 december 2005 nog premies worden voldaan, is aanwending van opgebouwde aanspraken voor lijfrenten
      als bedoeld in genoemd onderdeel c slechts mogelijk tot ten hoogste een bedrag gelijk aan de waarde in het
      economische verkeer van die aanspraak op 31 december 2005. Voor zover de in de eerste volzin bedoelde aanspraken
      tot een hoger bedrag dan de aldaar bedoelde waarde worden aangewend voor lijfrenten als bedoeld in genoemd
      onderdeel c, is [artikel 3.133, eerste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
