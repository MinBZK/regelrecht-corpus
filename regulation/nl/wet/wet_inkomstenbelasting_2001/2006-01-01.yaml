      Buitengewone uitgaven worden in aanmerking genomen voorzover zij samen, na toepassing van de verhoging ingevolge
      het eerste lid, meer bedragen dan:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.24
  - number: 6.24.2.a
    text: |-
      indien het verzamelinkomen vóór toepassing van de persoonsgebonden aftrek € 6783 niet te boven gaat: € 780
      verminderd met de standaardpremie, bedoeld in [artikel 4 van de Wet op de zorgtoeslag][ref1], en vermeerderd met
      de zorgtoeslag, bedoeld in [artikel 2 van de Wet op de zorgtoeslag][ref2], met dien verstande dat bij de berekening
      van het bedrag van de zorgtoeslag wordt uitgegaan van het toetsingsinkomen vóór toepassing van de persoonsgebonden
      aftrek;


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018451#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018451
        artikel: '2'
  - number: 6.24.2.b
    text: |-
      indien het verzamelinkomen vóór toepassing van de persoonsgebonden aftrek € 6 783 te boven gaat: 11,5% van het
      verzamelinkomen vóór toepassing van de persoonsgebonden aftrek verminderd met de standaardpremie, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref1], en vermeerderd met de zorgtoeslag, met dien verstande dat bij
      de berekening van het bedrag van de zorgtoeslag wordt uitgegaan van het toetsingsinkomen vóór toepassing van de
      persoonsgebonden aftrek.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '4'
  - number: 6.24.3
    text: |-
      Indien de belastingplichtige gedurende het gehele kalenderjaar een partner heeft, worden de buitengewone
      uitgaven samengevoegd. Over deze periode geldt voor de toepassing van het eerste en tweede lid in plaats van het
      verzamelinkomen voor toepassing van de persoonsgebonden aftrek het gezamenlijke bedrag van de verzamelinkomens van
      de belastingplichtige en zijn partner vóór toepassing van de persoonsgebonden aftrek en wordt in het tweede lid,
      onderdeel a en onderdeel b, het bedrag van € 6 783 vervangen door € 13 566 en wordt in het tweede lid, onderdeel a,
      het bedrag van € 780 vervangen door € 1560.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.24
  - number: 6.24.4
    text: |-
      Indien de belastingplichtige gedurende een deel van het kalenderjaar een partner heeft en zij een keuze als bedoeld
      in [artikel 2.17, zevende lid][ref1], hebben gemaakt, wordt de belastingplichtige voor de toepassing van het derde
      lid geacht gedurende het gehele kalenderjaar een partner te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 6.25.1
    text: |-
      Weekenduitgaven voor gehandicapten zijn de extra uitgaven die door een belastingplichtige worden gedaan om zijn
      ernstig gehandicapte kind, broer, zus of onder zijn mentorschap gestelde persoon te verzorgen, mits dit kind, deze
      broer, zus of persoon 27 jaar of ouder is en doorgaans in een inrichting verblijft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.25
  - number: 6.25.2
    text: |-
      Onder mentorschap wordt verstaan mentorschap als bedoeld in [boek 1, titel 20, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 6.25.3
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wanneer een kind, broer, zus of onder mentorschap van de
      belastingplichtige gestelde persoon voor de toepassing van dit artikel als ernstig gehandicapt wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.25
  - number: '6.26'
    text: |-
      Weekenduitgaven voor gehandicapten worden in aanmerking genomen tot een bedrag bepaald volgens bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Scholingsuitgaven zijn uitgaven voor het door de belastingplichtige volgen van een opleiding of studie met het oog
      op het verwerven van inkomen uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.27
  - number: 6.27.2
    text: |-
      Uitgaven voor het door de belastingplichtige volgen van een opleiding of studie met het oog op het verwerven van
      inkomen uit werk en woning die op zijn *partner* drukken, worden mede als scholingsuitgaven aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.27
  - number: 6.28.1
    text: 'Tot de scholingsuitgaven behoren niet uitgaven die verband houden met:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
  - number: 6.28.1.a
    text: levensonderhoud, daaronder begrepen huisvesting, voedsel, drank, genotmiddelen en kleding;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
  - number: 6.28.1.b
    text: werk- of studeerruimten, daaronder begrepen de inrichting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
  - number: 6.28.1.c
    text: reizen en verblijven, daaronder begrepen excursies en studiereizen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
  - number: 6.28.1.d
    text: oorzaken die bij algemene maatregel van bestuur zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
  - number: 6.28.2
    text: |-
      Scholingsuitgaven komen niet voor aftrek in aanmerking voorzover voor een opleiding of
      studie aan de belastingplichtige vrijgestelde uitkeringen en verstrekkingen als bedoeld in
      [artikel 3.104, onderdelen d, e en h, onder 3°][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 6.29.1
    text: |-
      Scholingsuitgaven voor een opleiding of studie waarvoor de belastingplichtige recht heeft op studiefinanciering
      volgens de [Wet studiefinanciering 2000][ref1], komen in aanmerking tot de bedragen, bedoeld in
      [artikel 3.2, eerste lid, onderdelen b en c, van die wet][ref2] indien deze scholingsuitgaven niet meer bedragen
      dan het tweevoud van eerdergenoemde bedragen. In het geval waarin deze scholingsuitgaven meer bedragen dan het
      tweevoud van de in de vorige volzin genoemde bedragen, wordt een bedrag ter grootte van die bedragen niet in
      aanmerking genomen als scholingsuitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 6.29.2
    text: |-
      Scholingsuitgaven komen niet voor aftrek in aanmerking voorzover de voor een opleiding of studie aan
      de belastingplichtige toegekende prestatiebeurs, bedoeld in [artikel 4.7, eerste en tweede lid][ref1],
      of [artikel 5.2, eerste lid, van de Wet studiefinanciering 2000][ref2], op grond van de bepalingen in
      [hoofdstuk 4][ref3], respectievelijk [hoofdstuk 5 van die wet][ref4] wordt omgezet in een gift.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011453
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0011453
        hoofdstuk: '5'
  - number: 6.29.3
    text: |-
      Scholingsuitgaven waarvoor een prestatiebeurs is toegekend, komen voor aftrek in aanmerking in het jaar waarin de
      prestatiebeurs definitief niet wordt omgezet in een gift.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.29
  - number: 6.30.1
    text: |-
      Scholingsuitgaven komen voor aftrek in aanmerking voorzover het gezamenlijke bedrag hoger is dan € 500 en, buiten
      de standaardstudieperiode, vervolgens niet tot een hoger gezamenlijk bedrag dan € 15 000.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.30
  - number: 6.30.2
    text: |-
      Indien scholingsuitgaven, bedoeld in [artikel 6.29, eerste lid][ref1], op grond van
      [artikel 6.29, derde lid][ref2], in het kalenderjaar in aanmerking worden genomen, wordt het bedrag van € 15 000
      vermeerderd met het bedrag van die scholingsuitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
        hoofdstuk: '6'
        afdeling: '6.7'
  - number: 6.30.3
    text: |-
      De standaardstudieperiode is de door de belastingplichtige aan te geven periode van niet meer dan zestien
      kalenderkwartalen waarin hij na het bereiken van de leeftijd van achttien jaar maar voor het bereiken van de
      leeftijd van 30 jaar de voor werkzaamheden beschikbare tijd grotendeels besteedt aan een opleiding met een totale
      studielast van een zodanige omvang dat daarnaast geen volledige werkkring mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.30
  - number: 6.31.1
    text: 'Als uitgaven met betrekking tot een monumentenpand worden in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
  - number: 6.31.1.a
    text: |-
      indien het een eigen woning als bedoeld in het eerste of derde lid van [artikel 3.111][ref1] betreft: het bedrag
      van de kosten, lasten en afschrijvingen – andere dan renten van schulden, kosten van geldleningen en periodieke
      betalingen ingevolge de rechten van erfpacht, opstal of beklemming – verminderd met 0,80% van de eigenwoningwaarde,
      met dien verstande dat die vermindering niet minder dan € 100 en niet meer dan € 12 750 bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 6.31.1.b
    text: |-
      indien het een onroerende zaak betreft die volgens [artikel 5.1][ref1] in de belastingheffing wordt betrokken: het
      bedrag van de onderhoudskosten, verminderd met 4% van de waarde in het economische verkeer van de onroerende zaak
      op de begindatum als bedoeld in [artikel 5.2][ref2], waarbij de waarde in het economisch verkeer van de onroerende
      zaak wordt bepaald met toepassing van [artikel 5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: 6.31.2
    text: |-
      Onder monumentenpand wordt verstaan een pand dat is ingeschreven in een van de registers, bedoeld in
      [artikel 6][ref1] of [artikel 7 van de Monumentenwet 1988][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '7'
  - number: 6.31.3
    text: |-
      Kosten, lasten en afschrijvingen voor monumentenpanden zijn de op de voordelen daaruit drukkende kosten voorzover
      zij zijn gemaakt tot behoud van die voordelen en in hun totale omvang niet overtreffen wat gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
  - number: 6.31.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de kosten, lasten
      en afschrijvingen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
  - number: 6.31.5
    text: |-
      Indien een ander dan de belastingplichtige een genotsrecht als bedoeld in [artikel 5.22, derde lid][ref1], heeft
      op een onroerende zaak, kunnen door de belastingplichtige ter zake van deze onroerende zaak onderhoudskosten in
      aanmerking worden genomen tot ten hoogste een bedrag dat gelijk is aan het gemiddelde van 4% van de waarde in het
      economische verkeer van de bezitting op de begindatum en op de einddatum. De [artikelen 5.2][ref2] en [5.19][ref3]
      zijn daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.4'
  - number: '6.32'
    text: 'Aftrekbare *giften* zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.32
  - number: 6.32.a
    text: periodieke giften;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.32
  - number: 6.32.b
    text: andere giften.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.32
  - number: '6.33'
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.33
  - number: 6.33.a
    text: |-
      *giften*: bevoordelingen uit vrijgevigheid en verplichte bijdragen waar geen directe tegenprestatie tegenover
      staat;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.33
  - number: 6.33.b
    text: |-
      *instellingen*: kerkelijke, levensbeschouwelijke, charitatieve, culturele, wetenschappelijke of het algemeen nut
      beogende instellingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.33
  - number: 6.33.c
    text: |-
      *verenigingen*: niet aan de vennootschapsbelasting onderworpen of daarvan vrijgestelde verenigingen met volledige
      rechtsbevoegdheid en met ten minste 25 leden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.33
  - number: '6.34'
    text: |-
      Periodieke *giften* zijn giften in de vorm van vaste en gelijkmatige periodieke uitkeringen die eindigen uiterlijk
      bij overlijden, aan in Nederland gevestigde *instellingen* of *verenigingen*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.34
  - number: '6.35'
    text: Andere *giften* zijn giften aan in Nederland gevestigde *instellingen*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.35
  - number: '6.36'
    text: |-
      Indien *giften* de vorm hebben van het afzien van een vergoeding van kosten voor vervoer per auto, anders dan per
      taxi, worden zij in aanmerking genomen voor € 0,19 per kilometer.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.36
  - number: '6.37'
    text: |-
      Giften aan niet in Nederland gevestigde instellingen worden aangemerkt als aftrekbare giften voorzover de
      instellingen daartoe door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.37
  - number: '6.38'
    text: |-
      Periodieke *giften* worden in aanmerking genomen indien zij berusten op een bij notariële akte van schenking
      aangegane verplichting om de uitkeringen of verstrekkingen gedurende vijf of meer jaren ten minste jaarlijks uit
      te keren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.38
  - number: 6.39.1
    text: |-
      Andere *giften* worden in aanmerking genomen voorzover zij met schriftelijke bescheiden kunnen worden gestaafd
      en voorzover zij samen zowel € 60 als 1% van het verzamelinkomen vóór toepassing van de persoonsgebonden aftrek
      te boven gaan, en vervolgens tot ten hoogste 10% van het verzamelinkomen vóór toepassing van de persoonsgebonden
      aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.39
  - number: 6.39.2
    text: |-
      Indien de belastingplichtige gedurende het gehele kalenderjaar een *partner* heeft worden andere giften
      samengevoegd. Over deze periode geldt voor de toepassing van het eerste lid, in plaats van het verzamelinkomen vóór
      toepassing van de persoonsgebonden aftrek het gezamenlijke bedrag van de verzamelinkomens van de belastingplichtige
      en zijn partner vóór toepassing van de persoonsgebonden aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.39
  - number: 6.39.3
    text: |-
      Indien de belastingplichtige gedurende een deel van het kalenderjaar een partner heeft en zij een keuze als bedoeld
      in [artikel 2.17, zevende lid, van deze wet][ref1] hebben gemaakt, wordt de belastingplichtige voor de toepassing
      van het tweede lid geacht gedurende het gehele kalenderjaar een partner te hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.39
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '6.40'
    text: |-
      Voorzover in deze wet niet anders is bepaald, komen uitgaven ter zake van persoonsgebonden aftrekposten voor aftrek
      in aanmerking op het tijdstip waarop zij zijn:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.40
  - number: 6.40.a
    text: betaald;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.40
  - number: 6.40.b
    text: verrekend;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.40
  - number: 6.40.c
    text: ter beschikking gesteld of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.40
  - number: 6.40.d
    text: rentedragend geworden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.40
  - number: '7.1'
    text: |-
      Ten aanzien van de buitenlandse belastingplichtige wordt de inkomstenbelasting geheven over het door hem in het
      kalenderjaar genoten:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.1
  - number: 7.1.a
    text: belastbare inkomen uit werk en woning in Nederland;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.1
  - number: 7.1.b
    text: belastbare inkomen uit aanmerkelijk belang in een in Nederland gevestigde vennootschap en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.1
  - number: 7.1.c
    text: belastbare inkomen uit sparen en beleggen in Nederland.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Het belastbare inkomen uit werk en woning in Nederland is het inkomen uit werk en woning in Nederland verminderd
      met de verliezen uit werk en woning, berekend overeenkomstig de regels van hoofdstuk 3.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2
    text: 'Het inkomen uit werk en woning in Nederland is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.a
    text: |-
      de belastbare winst uit Nederlandse onderneming, dat is de belastbare winst, bedoeld in de [artikelen 3.2][ref1]
      en [3.3][ref2] uit een onderneming die, of het gedeelte van een onderneming dat wordt gedreven met behulp van een
      vaste inrichting in Nederland of een vaste vertegenwoordiger in Nederland (Nederlandse onderneming);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: 7.2.2.b
    text: het belastbaar loon ter zake van het in Nederland verrichten of hebben verricht van arbeid;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.c
    text: het belastbaar resultaat uit overige werkzaamheden in Nederland;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.d
    text: |-
      de belastbare periodieke uitkeringen en verstrekkingen voorzover de daarvoor betaalde premies als uitgaven
      voor inkomensvoorzieningen in aanmerking zijn genomen of voortkomen uit *pensioenregelingen* voorzover de
      daarvoor betaalde premies ten laste van de belastbare winst van een Nederlandse onderneming zijn gebracht,
      waarbij met het in aanmerking nemen van negatieve uitgaven voor inkomensvoorzieningen op grond van
      [artikel 3.133, tweede lid, onderdelen h of j][ref1], of [artikel 3.136][ref2], dan wel in de periode van
      buitenlandse belastingplicht, geen rekening wordt gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 7.2.2.e
    text: |-
      de rechten op periodieke uitkeringen en verstrekkingen van publiekrechtelijke aard van of namens een Nederlandse
      publiekrechtelijke rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.f
    text: |-
      de belastbare inkomsten uit eigen woning in Nederland, verminderd met de aftrek wegens geen of geringe
      eigenwoningschuld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.g
    text: de negatieve uitgaven voor inkomensvoorzieningen, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.2.h
    text: de negatieve persoonsgebonden aftrek.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, worden de werkzaamheden in Nederland verricht in de uitoefening
      van een bedrijf of in de zelfstandige uitoefening van een beroep door een niet-ingezetene die ingevolge een
      overeenkomst van korte duur, dan wel kortstondig krachtens een andere grond, als musicus of anderszins als
      artiest optreedt dan wel als beroep een tak van sport beoefent, steeds aangemerkt als een vaste inrichting in
      Nederland. Voor de toepassing van het tweede lid, onderdeel c, is [artikel 1.2, derde lid, onderdeel b][ref1],
      niet van toepassing en wordt onder werkzaamheid in Nederland mede verstaan het ter beschikking stellen van
      vermogensbestanddelen als bedoeld in de [artikelen 3.91][ref2] en [3.92][ref3] aan het in Nederland gevestigde deel
      van een onderneming, werkzaamheid of vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 7.2.4
    text: |-
      Indien de berekening van het inkomen uit werk en woning in Nederland leidt tot een negatief bedrag wordt
      dit aangemerkt als een verlies uit werk en woning in Nederland. De verrekening van dit verlies vindt plaats
      overeenkomstig de regels van [afdeling 3.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
        afdeling: '3.13'
  - number: 7.2.5
    text: |-
      Verliezen uit werk en woning zijn de verliezen uit werk en woning die betrekking hebben op jaren waarin de
      buitenlandse belastingplichtige binnenlands belastingplichtig was en de verliezen uit werk en woning in Nederland.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.6
    text: |-
      In Nederland gelegen onroerende zaken, daaronder begrepen rechten die samenhangen met de exploratie en exploitatie
      van in Nederland aanwezige natuurlijke rijkdommen waaronder ook wordt gerekend de opwekking van energie uit het
      water, de stromen en de winden, of rechten waaraan deze zijn onderworpen, die tot het vermogen van een onderneming
      behoren, behoren tot het vermogen van een Nederlandse onderneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.7
    text: |-
      De gedeeltelijk buiten Nederland vervulde dienstbetrekking voor een inhoudingsplichtige in de zin van de
      [Wet op de loonbelasting 1964][ref1], wordt geacht geheel in Nederland te zijn vervuld. De eerste volzin vindt
      geen toepassing voorzover het loon uit die dienstbetrekking met inachtneming van de Belastingregeling voor het
      Koninkrijk of verdragen waarbij de Staat der Nederlanden partij is, feitelijk is onderworpen aan een belasting
      naar het inkomen die door of vanwege een andere mogendheid wordt geheven. De eerste volzin vindt evenmin toepassing
      indien de dienstbetrekking nagenoeg geheel buiten Nederland wordt vervuld en het loon is onderworpen aan een
      belasting naar het inkomen die door een andere mogendheid wordt geheven en het loon niet op grond van een verdrag
      ter voorkoming van dubbele belasting of op grond van enige andere regel van interregionaal of internationaal recht
      in feite slechts in Nederland aan een belasting naar het inkomen is onderworpen. De buiten Nederland vervulde
      functie van bestuurder of commissaris van een in Nederland gevestigd lichaam, alsmede de dienstbetrekking bij
      de Staat der Nederlanden dan wel de dienstbetrekking waarbij in het kader van een uitzending op het grondgebied
      van een andere mogendheid werkzaamheden zijn of worden verricht op grond van een verdrag waarbij de Staat der
      Nederlanden partij is, worden steeds geacht in Nederland te zijn vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 7.2.8.a
    text: |-
      Tot belastbaar loon wordt gerekend de waarde in het economisch verkeer van opgebouwde aanspraken
      uit een *pensioenregeling* indien de verplichtingen volgens de *pensioenregeling* waarop die
      aanspraken berusten geheel of gedeeltelijk zijn ondergebracht bij een ander lichaam dan bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b, d, e en f van de Wet op de loonbelasting 1964][ref1]. Tot de waarde in
      het economische verkeer wordt niet gerekend het met pensioenpremies behaalde rendement over een periode waarin de
      belastingplichtige geen binnenlands belastingplichtige is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 7.2.8.b
    text: 'Indien onderdeel a toepassing vindt met betrekking tot de waarde van aanspraken die eerder op grond van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.8.b.1°
    text: |-
      onderdeel a in het Nederlandse inkomen uit werk en woning is begrepen, wordt, onder bij ministeriële regeling
      te stellen voorwaarden, dat inkomen met die waarde van de aanspraken verlaagd. De inspecteur vermindert
      dienovereenkomstig de conserverende aanslag bij voor bezwaar vatbare beschikking. Rechtsmiddelen tegen deze
      beschikking kunnen uitsluitend betrekking hebben op de grootte van de vermindering;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.8.b.2°
    text: |-
      [artikel 3.83][ref1] in het belastbare inkomen uit werk en woning is begrepen, wordt, voorzover de belasting ter
      zake van die aanspraken is voldaan, dat inkomen met die waarde van de aanspraken verlaagd en de eerder opgelegde
      conserverende aanslag door de inspecteur verminderd bij voor bezwaar vatbare beschikking. Rechtsmiddelen tegen deze
      beschikking kunnen uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 7.2.8.c
    text: |-
      Indien [artikel 19b van de Wet op de loonbelasting 1964][ref1] toepassing heeft gevonden wordt het belastbaar loon
      verminderd met de waarde van de aanspraken die zijn gerekend tot het loon met toepassing van [artikel 3.83][ref2]
      dan wel met toepassing van onderdeel a, voorzover de belasting ter zake van de waarde van die aanspraken is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
        afdeling: '3.3'
  - number: 7.2.8.d
    text: |-
      Op verzoek van de belastingplichtige wordt, indien de waarde van aanspraken op grond van onderdeel a is begrepen in
      het Nederlandse inkomen uit werk en woning van een vorig kalenderjaar, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.8.d.1°
    text: |-
      wordt voldaan aan de voorwaarden voor uitstel van betaling als bedoeld in
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 7.2.8.d.2°
    text: |-
      de verplichtingen waarop de aanspraken berusten geheel zijn ondergebracht bij een verzekeraar als bedoeld in
      [artikel 19a, eerste lid, onderdelen a, b, d, e of f, van de Wet op de loonbelasting 1964][ref1], het Nederlandse
      inkomen uit werk en woning van dat vorige kalenderjaar met die waarde van de aanspraken verlaagd. De inspecteur
      vermindert dienovereenkomstig de conserverende aanslag over dat jaar bij voor bezwaar vatbare beschikking.
      Rechtsmiddelen tegen deze beschikking kunnen uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: 7.2.8.e
    text: |-
      De waarde van de opgebouwde aanspraken wordt verminderd met de waarde van de aanspraken die niet ten laste zijn
      gekomen van Nederlands belastbaar inkomen uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.9
    text: |-
      Het bedrag van de belastbare periodieke uitkeringen uit een aanspraak wordt verminderd met de ter zake van die
      aanspraak in aanmerking genomen negatieve uitgaven voor inkomensvoorzieningen voorzover de belasting die is
      verschuldigd over die negatieve uitgaven is voldaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
  - number: 7.2.10
    text: |-
      Bij een aanspraak op periodieke uitkeringen vindt [artikel 3.133, tweede lid, onderdelen h en j][ref1], alleen
      toepassing indien door de buitenlandse belastingplichtige in het kalenderjaar ter zake van de aanspraak premie is
      voldaan die als uitgaven voor inkomensvoorzieningen in aanmerking is genomen. De vorige volzin geldt bij onderdeel
      h niet voor het jaar van de in dat onderdeel bedoelde overgang van de lijfrenteverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 7.2.11
    text: |-
      Het bij een buitenlandse belastingplichtige op grond van [artikel 3.133, tweede lid, onderdelen h of j][ref1],
      in aanmerking te nemen bedrag aan negatieve uitgaven wordt in de bij ministeriële regeling te bepalen gevallen
      en onder de in die regeling te stellen voorwaarden, verminderd met de negatieve uitgaven die bij hem ter zake van
      dezelfde aanspraken op grond van [artikel 3.136][ref2] in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 7.2.12
    text: |-
      Voorzover bij een buitenlandse belastingplichtige de negatieve uitgaven voor inkomensvoorzieningen die op grond
      van [artikel 3.133, tweede lid, onderdelen h of j][ref1], in aanmerking worden genomen, eveneens zijn begrepen in
      het belastbaar inkomen uit werk en woning in Nederland van een vorig kalenderjaar, wordt, onder bij ministeriële
      regeling te stellen voorwaarden, het belastbaar inkomen uit werk en woning in Nederland van dat vorig kalenderjaar
      met die daarin begrepen negatieve uitgaven verlaagd. De verlaging vindt plaats door vermindering van de aanslag
      over dat jaar bij voor bezwaar vatbare beschikking van de inspecteur. Rechtsmiddelen tegen deze beschikking kunnen
      uitsluitend betrekking hebben op de grootte van de vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 7.2.13
    text: |-
      Voor de toepassing van het tweede lid wordt een niet in Nederland wonende natuurlijke persoon die deel
      uitmaakt van een buitenlands gezelschap als bedoeld in [artikel 5b van de Wet op de loonbelasting 1964][ref1],
      geacht een evenredig deel, gerelateerd aan het aantal leden van het gezelschap, te hebben genoten
      van de door het gezelschap voor het optreden of de sportbeoefening ontvangen gage, bedoeld in
      [artikel 35g van de Wet op de loonbelasting 1964][ref2], behoudens voorzover hij aannemelijk maakt dat hij een
      ander deel van de gage heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35g
  - number: '7.3'
    text: |-
      Tot het drijven van een Nederlandse onderneming behoort niet het vervoer te water of door de lucht van personen
      en zaken tussen plaatsen buiten Nederland en plaatsen in Nederland, en tussen plaatsen buiten Nederland onderling
      (vervoer in het internationaal verkeer), tenzij de leiding van de onderneming in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      Werkzaamheden die in het kader van een onderneming worden verricht gedurende een aaneengesloten periode
      van ten minste 30 dagen in, op of boven het Noordzeewinningsgebied, vormen een Nederlandse onderneming. Het
      Noordzeewinningsgebied bestaat uit de territoriale zee van Nederland alsmede het buiten de territoriale zee onder
      de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, voorzover het Koninkrijk der Nederlanden daar
      op grond van het internationale recht rechten mag uitoefenen op het gebied van de exploratie en exploitatie van
      natuurlijke rijkdommen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.4
  - number: 7.5.1
    text: |-
      Het belastbare inkomen uit aanmerkelijk belang in een in Nederland gevestigde vennootschap is het inkomen uit een
      niet tot het vermogen van een onderneming behorend aanmerkelijk belang in een in Nederland gevestigde vennootschap,
      verminderd met de verliezen uit aanmerkelijk belang, berekend volgens de regels van [hoofdstuk 4][ref1], met
      uitzondering van de in [artikel 4.12][ref2] genoemde persoonsgebonden aftrek. Voor de beoordeling van de vraag
      of er een aanmerkelijk belang is, is [artikel 1.2, derde lid, onderdeel b][ref3], niet van toepassing. Voor de
      toepassing van de eerste volzin is [afdeling 4.2][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0011353
        hoofdstuk: '4'
        afdeling: '4.2'
  - number: 7.5.2
    text: |-
      Indien de berekening van het inkomen uit aanmerkelijk belang in een in Nederland gevestigde vennootschap leidt tot
      een negatief bedrag wordt dit aangemerkt als een verlies uit aanmerkelijk belang in een in Nederland gevestigde
      vennootschap. De verrekening van dit verlies vindt plaats overeenkomstig de regels van [afdeling 4.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
        afdeling: '4.10'
  - number: 7.5.3
    text: |-
      Verliezen uit aanmerkelijk belang zijn de verliezen uit aanmerkelijk belang die betrekking hebben op jaren waarin
      de buitenlandse belastingplichtige binnenlands belastingplichtig was en de verliezen uit aanmerkelijk belang in een
      in Nederland gevestigde vennootschap.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
  - number: 7.5.4
    text: |-
      [Artikel 4.41, eerste lid][ref1], is niet van toepassing indien de vennootschap die de aandelen of winstbewijzen
      verwerft niet in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: 7.5.5
    text: |-
      [Artikel 4.41, tweede en derde lid][ref1], is niet van toepassing indien en voorzover de verkrijgende vennootschap
      niet in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.8.3
        afdeling: '4.8'
  - number: 7.5.6
    text: |-
      Behoudens voor de toepassing van het vierde en vijfde lid, wordt een lichaam dat ten minste vijf jaar in Nederland
      gevestigd is geweest gedurende tien jaar na verplaatsing van de werkelijke leiding van het lichaam uit Nederland
      nog geacht in Nederland te zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
  - number: 7.5.7
    text: |-
      Een verplaatsing van de werkelijke leiding van een vennootschap uit Nederland is een vervreemding van het
      aanmerkelijk belang.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Als verkrijgingsprijs van aandelen en winstbewijzen die tot een aanmerkelijk belang behoren, geldt de waarde in het
      economische verkeer op het tijdstip waarop de binnenlandse belastingplicht in Nederland is geëindigd, indien bij
      de beëindiging van de binnenlandse belastingplicht van de belastingplichtige vervreemdingsvoordelen in aanmerking
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing na een vervreemding als bedoeld in
      [artikel 7.5, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 7.6.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de verkrijgingsprijs indien
      [artikel 26 van de Invorderingswet 1990][ref1] is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 7.7.1
    text: |-
      Het belastbaar inkomen uit sparen en beleggen in Nederland is het voordeel dat een belastingplichtige geniet
      uit sparen en beleggen in Nederland, berekend volgens de regels van [hoofdstuk 5][ref1], met uitzondering van
      de in [artikel 5.1][ref2] genoemde persoonsgebonden aftrek. Het voordeel uit sparen en beleggen in Nederland
      wordt gesteld op 4% (forfaitair rendement) van het gemiddelde van de rendementsgrondslag in Nederland aan het
      begin van het kalenderjaar (begindatum) en de rendementsgrondslag in Nederland aan het einde van het kalenderjaar
      (einddatum).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.1'
  - number: 7.7.2
    text: |-
      De rendementsgrondslag in Nederland is de waarde van de bezittingen in Nederland verminderd met de waarde van de
      schulden in verband met die bezittingen in Nederland. Bezittingen in Nederland zijn:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
  - number: 7.7.2.a
    text: in Nederland gelegen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
  - number: 7.7.2.b
    text: rechten die direct of indirect betrekking hebben op in Nederland gelegen onroerende zaken en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
  - number: 7.7.2.c
    text: |-
      rechten op aandelen in de winst van een onderneming waarvan de leiding in Nederland is gevestigd, voorzover zij
      niet voortspruiten uit effectenbezit of uit dienstbetrekking en zij niet op grond van de [afdelingen 7.2][ref1]
      of [7.3][ref2] zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 7.7.3
    text: |-
      Onder in Nederland gelegen onroerende zaken worden begrepen rechten die samenhangen met de exploratie of de
      exploitatie van in Nederland aanwezige natuurlijke rijkdommen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
  - number: 7.7.4
    text: |-
      Indien de belastingplichtige niet het gehele jaar belastbaar inkomen uit sparen en beleggen in Nederland geniet,
      wordt bij de bepaling van het forfaitair rendement de begindatum vervangen door het latere tijdstip waarop de
      belastingplichtige aanvangt belastbaar inkomen uit sparen en beleggen in Nederland te genieten, of wordt de
      einddatum vervangen door het eerdere tijdstip waarop de belastingplichtige ophoudt belastbaar inkomen uit sparen en
      beleggen in Nederland te genieten. Daarbij wordt het percentage van 4 naar tijdsgelang herleid, waarbij gedeelten
      van maanden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel7.7
  - number: '8.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.1
  - number: 8.1.a
    text: |-
      *belastingtarief eerste schijf*: het in de eerste regel van de vierde kolom van de tabel in [artikel 2.10][ref1]
      opgenomen percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 8.1.b
    text: |-
      *gecombineerde inkomensheffing*: het gezamenlijke bedrag, na toepassing van regelingen ter voorkoming van
      dubbele belasting, van de belasting op het belastbare inkomen uit werk en woning, de belasting op het belastbare
      inkomen uit aanmerkelijk belang, de belasting op het belastbare inkomen uit sparen en beleggen en de volgens
      [artikel 10 van de Wet financiering sociale verzekeringen][ref1] berekende premie voor de volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel10
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '10'
  - number: 8.1.c
    text: |-
      *gecombineerd heffingspercentage*: de som van het belastingtarief eerste schijf en de op grond van
      [artikel 11 van de Wet financiering sociale verzekeringen][ref1] vastgestelde premiepercentages voor de algemene
      ouderdomsverzekering, de nabestaandenverzekering en de algemene verzekering bijzondere ziektekosten;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 8.1.d
    text: |-
      *gecombineerde heffingskorting*: het gezamenlijke bedrag van de heffingskorting voor de inkomstenbelasting, de
      heffingskorting voor de algemene ouderdomsverzekering, de heffingskorting voor de nabestaandenverzekering en de
      heffingskorting voor de algemene verzekering bijzondere ziektekosten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.1
  - number: '8.2'
    text: 'De standaardheffingskorting is het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
  - number: 8.2.a
    text: |-
      de algemene heffingskorting ([artikel 8.10][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.b
    text: |-
      de arbeidskorting ([artikel 8.11][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.c
    text: |-
      de kinderkorting ([artikel 8.12][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.d
    text: |-
      de combinatiekorting ([artikel 8.14][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.e
    text: |-
      de aanvullende combinatiekorting ([artikel 8.14a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.f
    text: |-
      de ouderschapsverlofkorting ([artikel 8.14b][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.g
    text: |-
      de alleenstaande-ouderkorting ([artikel 8.15][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.h
    text: |-
      de aanvullende alleenstaande-ouderkorting ([artikel 8.16][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.i
    text: |-
      de jonggehandicaptenkorting ([artikel 8.16a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.j
    text: |-
      de ouderenkorting ([artikel 8.17][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.k
    text: |-
      de alleenstaande ouderenkorting ([artikel 8.18][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.l
    text: |-
      de levensloopverlofkorting ([artikel 8.18a][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.m
    text: |-
      de korting voor maatschappelijke beleggingen ([artikel 8.19][ref1]) en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 8.2.n
    text: |-
      de korting voor directe beleggingen in durfkapitaal en culturele beleggingen ([artikel 8.20][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: '8.3'
    text: |-
      De heffingskorting voor de inkomstenbelasting is het deel van de standaardheffingskorting dat tot de
      standaardheffingskorting in dezelfde verhouding staat als het *belastingtarief eerste schijf* staat tot het
      *gecombineerde heffingspercentage*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      De heffingskorting voor de algemene ouderdomsverzekering is het deel van de standaardheffingskorting
      dat tot de standaardheffingskorting in dezelfde verhouding staat als het volgens
      [artikel 11, eerste lid, van de Wet financiering sociale verzekeringen][ref1] vastgestelde premiepercentage voor de
      algemene ouderdomsverzekering staat tot het *gecombineerde heffingspercentage*.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: '8.5'
    text: |-
      De heffingskorting voor de nabestaandenverzekering is het deel van de standaardheffingskorting
      dat tot de standaardheffingskorting in dezelfde verhouding staat als het volgens
      [artikel 11, tweede lid, van de Wet financiering sociale verzekeringen][ref1] vastgestelde premiepercentage voor de
      nabestaandenverzekering staat tot het *gecombineerde heffingspercentage*.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: '8.6'
    text: |-
      De heffingskorting voor de algemene verzekering bijzondere ziektekosten is het deel van de
      standaardheffingskorting dat tot de standaardheffingskorting in dezelfde verhouding staat als het volgens
      [artikel 11, derde lid, van de Wet financiering sociale verzekeringen][ref1] vastgestelde premiepercentage voor de
      algemene verzekering bijzondere ziektekosten staat tot het *gecombineerde heffingspercentage*.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 8.7.1
    text: |-
      Bij de toepassing van [artikel 8.3][ref1], [artikel 8.5][ref2] en [artikel 8.6][ref3] op het deel
      van de standaardheffingskorting dat op de ouderenkorting, de alleenstaande ouderenkorting, de korting
      voor maatschappelijke beleggingen of de korting voor directe beleggingen in durfkapitaal en culturele
      beleggingen betrekking heeft, wordt het *gecombineerde heffingspercentage*verminderd met het volgens
      [artikel 11, eerste lid, van de Wet financiering sociale verzekeringen][ref4] voor de algemene ouderdomsverzekering
      vastgestelde premiepercentage. In dat geval wordt het aan de heffingskorting voor de algemene ouderdomsverzekering
      toerekenbare deel van de ouderenkorting, de alleenstaande ouderenkorting, de korting voor maatschappelijke
      beleggingen en de korting voor directe beleggingen in durfkapitaal en culturele beleggingen in afwijking van
      [artikel 8.4][ref5] op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.7.2
    text: |-
      In het jaar waarin de belastingplichtige de leeftijd van 65 jaar bereikt, wordt bij de toepassing
      van [artikel 8.4][ref1] op het deel van de standaardheffingskorting dat niet op de ouderenkorting, de
      alleenstaande ouderenkorting, de korting voor maatschappelijke beleggingen en de korting voor directe
      beleggingen in durfkapitaal en culturele beleggingen betrekking heeft, het daar genoemde, volgens
      [artikel 11, eerste lid, van de Wet financiering sociale verzekeringen][ref2] vastgestelde premiepercentage voor
      de algemene ouderdomsverzekering verlaagd met dat deel van het laatstgenoemde percentage dat daartoe in dezelfde
      verhouding staat als de in het kalenderjaar vanaf de eerste dag van de kalendermaand waarin de belastingplichtige
      de leeftijd van 65 jaar bereikt resterende periode van premieplicht voor de volksverzekeringen staat tot de periode
      van premieplicht voor de volksverzekeringen vanaf het begin van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '11'
  - number: '8.8'
    text: De *gecombineerde heffingskorting* bedraagt maximaal het bedrag van de *gecombineerde inkomensheffing.*
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Indien de *gecombineerde heffingskorting* door [artikel 8.8][ref1] zou worden beperkt tot een niveau
      beneden het gezamenlijke bedrag van de algemene heffingskorting en de voor de belastingplichtige geldende
      arbeidskorting, kinderkorting, combinatiekorting, aanvullende combinatiekorting, ouderschapsverlofkorting en
      levensloopverlofkorting wordt indien de belastingplichtige in het kalenderjaar gedurende meer dan zes maanden
      dezelfde *partner* heeft, de gecombineerde heffingskorting verhoogd tot het gezamenlijke bedrag van de voor hem
      geldende algemene heffingskorting, de arbeidskorting, de kinderkorting, de combinatiekorting, de aanvullende
      combinatiekorting, de ouderschapsverlofkorting en de levensloopverlofkorting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.9.2
    text: |-
      De verhoging van de gecombineerde heffingskorting bedraagt maximaal het bedrag van de door de partner verschuldigde
      *gecombineerde inkomensheffing* verminderd met zijn gecombineerde heffingskorting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9
  - number: 8.9.3
    text: |-
      De verhoging van de gecombineerde heffingskorting wordt verlaagd met het bedrag van de belastingvermindering
      volgens regelingen ter voorkoming van dubbele belasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9
  - number: 8.9.4
    text: |-
      Dit artikel is niet van toepassing indien de belastingplichtige bij de aanvang van het kalenderjaar de leeftijd
      van 30 jaar niet heeft bereikt en in het kalenderjaar gedurende meer dan zes maanden in belangrijke mate door zijn
      ouders is onderhouden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9
  - number: 8.9.5
    text: |-
      De belastingplichtige die uitsluitend door zijn overlijden in het kalenderjaar of het overlijden van zijn partner
      niet voldoet aan de voorwaarde van het eerste lid inzake het gedurende meer dan zes maanden hebben van dezelfde
      partner in het kalenderjaar wordt, voor de toepassing van dit artikel, geacht meer dan zes maanden dezelfde partner
      te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9
  - number: 8.9a.1
    text: |-
      De bijzondere verhoging van de heffingskorting voor de inkomstenbelasting geldt voor de belastingplichtige die
      recht heeft op de verhoging van de gecombineerde heffingskorting, bedoeld in [artikel 8.9][ref1], maar die deze
      verhoging als niet-premieplichtige niet-inwoner niet volledig kan effectueren. De bijzondere verhoging geldt
      uitsluitend voor inwoners van een andere lidstaat van de Europese Unie of van een bij ministeriële regeling
      aangewezen andere mogendheid waarmee Nederland een regeling ter voorkoming van dubbele belasting is overeengekomen
      die voorziet in de uitwisseling van inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 8.9a.2
    text: |-
      De bijzondere verhoging van de heffingskorting voor de inkomstenbelasting is gelijk aan de verhoging van de
      gecombineerde heffingskorting, voorzover de belastingplichtige daarop als niet-premieplichtige niet-inwoner geen
      recht heeft, maar hij daarop wel recht zou hebben indien hij premieplichtig inwoner van Nederland zou zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9a
  - number: 8.9a.3
    text: |-
      De bijzondere verhoging van de heffingskorting voor de inkomstenbelasting is echter niet hoger dan het gezamenlijke
      bedrag van de belasting na toepassing van regelingen ter voorkoming van dubbele belasting, en de premie voor de
      volksverzekeringen die zijn *partner* is verschuldigd over het belastbare inkomen uit werk en woning, verminderd
      met zijn gecombineerde heffingskorting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.9a
  - number: 8.10.1
    text: De algemene heffingskorting geldt voor iedere belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.10
  - number: 8.10.2
    text: De algemene heffingskorting bedraagt € 1990.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.10
  - number: 8.11.1
    text: |-
      De arbeidskorting geldt voor de belastingplichtige die met tegenwoordige arbeid winst uit een onderneming, loon of
      resultaat uit een werkzaamheid geniet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.2
    text: |-
      De arbeidskorting wordt berekend over het gezamenlijke bedrag van hetgeen met tegenwoordige arbeid is genoten als
      winst uit een of meer ondernemingen, loon en resultaat uit een of meer werkzaamheden (arbeidskortingsgrondslag). De
      arbeidskorting bedraagt de som van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.2.a
    text: 1,795% van de arbeidskortingsgrondslag met een maximum van € 146, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.2.b
    text: 12,421% van de arbeidskortingsgrondslag voorzover die meer bedraagt dan € 8132.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.3
    text: 'In afwijking van het tweede lid wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.3.a
    text: |-
      ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 57 jaar heeft bereikt maar nog
      niet de leeftijd van 60, het percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door
      14,954% en het bedrag, bedoeld in het tweede lid, derde volzin, vervangen door € 1604;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.3.b
    text: |-
      ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 60 jaar heeft bereikt maar nog
      niet de leeftijd van 62, het percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door
      17,467% en het bedrag, bedoeld in het tweede lid, derde volzin, vervangen door € 1849;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.11.3.c
    text: |-
      ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 62 jaar heeft bereikt, het
      percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door 19,990% en het bedrag, bedoeld in
      het tweede lid, derde volzin, vervangen door € 2095.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.11
  - number: 8.12.1
    text: 'De kinderkorting geldt voor de belastingplichtige indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.1.a
    text: |-
      in het kalenderjaar gedurende meer dan zes maanden tot zijn huishouden een *kind* behoort dat in belangrijke mate
      door hem of zijn *partner* wordt onderhouden en dat bij de aanvang van het kalenderjaar de leeftijd van 18 jaar
      niet heeft bereikt en gedurende die tijd op hetzelfde woonadres als de belastingplichtige of zijn partner staat
      ingeschreven in de basisadministratie persoonsgegevens en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.1.b
    text: het gezamenlijk verzamelinkomen van de belastingplichtige en zijn partner minder bedraagt dan € 44 034.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.2
    text: 'De kinderkorting bedraagt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.2.a
    text: 'bij een gezamenlijk verzamelinkomen van de belastingplichtige en zijn partner van niet meer dan € 28 521: € 892;'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.2.b
    text: |-
      bij een gezamenlijk verzamelinkomen van meer dan € 28 521: € 892, verminderd met 5,75% van het verschil tussen het
      gezamenlijke verzamelinkomen en € 28 521.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Indien de belastingplichtige een partner heeft geldt de kinderkorting alleen voor de belastingplichtige met het
      hoogste verzamelinkomen. Indien het verzamelinkomen van de belastingplichtige gelijk is aan dat van zijn partner
      geldt de kinderkorting alleen voor de oudste belastingplichtige. Op gezamenlijk verzoek van deze belastingplichtige
      en zijn partner, wordt het bedrag van de kinderkorting toegekend aan de partner van die belastingplichtige. Op het
      verzoek kan niet worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.12.4
    text: |-
      Voor de toepassing van dit artikel wordt onder partner mede verstaan een in
      [artikel 3.91, tweede lid, onderdeel b, 2° tot en met 5°][ref1] bedoelde verbonden persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 8.12.5
    text: |-
      Indien uitsluitend als gevolg van het overlijden in het kalenderjaar van de belastingplichtige dan wel van een in
      het eerste lid bedoeld kind niet voldaan wordt aan de in dat lid bedoelde termijn van zes maanden, wordt voor de
      toepassing van dit artikel, met betrekking tot dat jaar wel geacht te zijn voldaan aan die termijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.12
  - number: 8.14.1
    text: 'De combinatiekorting geldt voor de belastingplichtige indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.1.a
    text: |-
      hij met tegenwoordige arbeid meer dan € 4405 winst uit een of meer ondernemingen, loon of resultaat uit een of meer
      werkzaamheden heeft genoten of in aanmerking komt voor de zelfstandigenaftrek, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.1.b
    text: 'in het kalenderjaar ten minste zes maanden tot zijn huishouden een kind behoort dat:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.1.b.1°
    text: bij de aanvang van het kalenderjaar de leeftijd van 12 jaar niet heeft bereikt en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.1.b.2°
    text: |-
      gedurende die tijd op hetzelfde woonadres als de belastingplichtige staat ingeschreven in de basisadministratie
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.2
    text: De combinatiekorting bedraagt € 146.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14.3
    text: |-
      Indien uitsluitend als gevolg van het overlijden in het kalenderjaar van de belastingplichtige dan wel van een
      in het eerste lid, onderdeel b, bedoeld kind niet voldaan wordt aan de in het eerste lid bedoelde termijn van zes
      maanden, wordt voor de toepassing van dit artikel met betrekking tot dat jaar wel geacht te zijn voldaan aan die
      termijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14
  - number: 8.14a.1
    text: 'De aanvullende combinatiekorting geldt voor de belastingplichtige indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
  - number: 8.14a.1.a
    text: voor hem de combinatiekorting geldt, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
  - number: 8.14a.1.b
    text: |-
      hij in het kalenderjaar geen partner heeft, danwel indien hij wel een partner heeft, hij in het kalenderjaar
      met tegenwoordige arbeid minder aan winst uit een of meer ondernemingen, loon of resultaat uit een of meer
      werkzaamheden heeft genoten dan zijn partner met tegenwoordige arbeid uit die bronnen heeft genoten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
  - number: 8.14a.2
    text: De aanvullende combinatiekorting bedraagt € 608.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
  - number: 8.14a.3
    text: |-
      Indien het in het kalenderjaar uit de in het eerste lid bedoelde bronnen genoten inkomen van de belastingplichtige
      gelijk is aan dat van zijn partner, geldt de aanvullende combinatiekorting alleen voor de oudste
      belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
  - number: 8.14a.4
    text: |-
      Voor de toepassing van dit artikel wordt onder partner mede verstaan een in
      [artikel 3.91, tweede lid, onderdeel b, onder 2° tot en met 5°][ref1], bedoelde verbonden persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.1
        afdeling: '3.4'
  - number: 8.14b.1
    text: 'De ouderschapsverlofkorting geldt voor de belastingplichtige die in het kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14b
  - number: 8.14b.1.a
    text: |-
      gebruik maakt van zijn recht op ouderschapsverlof als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: 8.14b.1.b
    text: |-
      een voorziening in het kader van een levensloopregeling als bedoeld in
      [artikel 19g Wet op de loonbelasting 1964][ref1], opbouwt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 8.14b.2
    text: |-
      De ouderschapsverlofkorting bedraagt 50% van het wettelijk minimumloon per werkdag, zoals bepaald bij of krachtens
      [artikel 8 van de Wet minimumloon en minimumvakantiebijslag][ref1], per werkdag opgenomen ouderschapsverlof in het
      kalenderjaar, met dien verstande dat de ouderschapsverlofkorting niet meer bedraagt dan het in het voorafgaande
      kalenderjaar genoten belastbare loon verminderd met het in het kalenderjaar genoten belastbare loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 8.14b.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.14b
  - number: 8.15.1
    text: |-
      De alleenstaande-ouderkorting geldt voor de belastingplichtige die in het kalenderjaar gedurende meer dan zes
      maanden:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.15.1.a
    text: geen *partner* heeft;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.15.1.b
    text: |-
      een huishouding voert met een *kind* dat in belangrijke mate door hem wordt onderhouden en op hetzelfde woonadres
      als de belastingplichtige staat ingeschreven in de basisadministratie persoonsgegevens, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.15.1.c
    text: |-
      deze huishouding voert met geen ander dan kinderen die bij de aanvang van het kalenderjaar de leeftijd van 27 jaar
      niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.15.2
    text: De alleenstaande-ouderkorting bedraagt € 1414.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.15.3
    text: |-
      Indien uitsluitend als gevolg van het overlijden in het kalenderjaar van de belastingplichtige dan wel van een
      in het eerste lid, onderdeel b, bedoeld kind niet voldaan wordt aan de in het eerste lid bedoelde termijn van zes
      maanden, wordt voor de toepassing van dit artikel met betrekking tot dat jaar wel geacht te zijn voldaan aan die
      termijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.15
  - number: 8.16.1
    text: 'De aanvullende alleenstaande-ouderkorting geldt voor de belastingplichtige indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16.1.a
    text: voor hem de alleenstaande-ouderkorting geldt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16.1.b
    text: hij tegenwoordige arbeid verricht, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16.1.c
    text: |-
      in het kalenderjaar gedurende meer dan zes maanden tot zijn huishouden een *kind* behoort dat bij de aanvang van
      het kalenderjaar de leeftijd van 16 jaar niet heeft bereikt en gedurende die tijd op hetzelfde woonadres als de
      belastingplichtige staat ingeschreven in de basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16.2
    text: |-
      De aanvullende alleenstaande-ouderkorting bedraagt 4,3% van het bedrag dat met tegenwoordige arbeid aan winst uit
      een of meer ondernemingen, loon of resultaat uit een of meer werkzaamheden is begrepen in het belastbare inkomen
      uit werk en woning, maar maximaal € 1414.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16.3
    text: |-
      Indien uitsluitend als gevolg van het overlijden in het kalenderjaar van de belastingplichtige dan wel van een
      in het eerste lid, onderdeel c, bedoeld kind niet voldaan wordt aan de in het eerste lid bedoelde termijn van zes
      maanden, wordt voor de toepassing van dit artikel met betrekking tot dat jaar wel geacht te zijn voldaan aan die
      termijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16
  - number: 8.16a.1
    text: |-
      De jonggehandicaptenkorting geldt voor de belastingplichtige die in het kalenderjaar op grond van
      [hoofdstuk 2, afdeling 1, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] recht heeft op
      toekenning van een uitkering, tenzij voor hem de ouderenkorting geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Afdeling1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        afdeling: '1'
  - number: 8.16a.2
    text: De jonggehandicaptenkorting bedraagt  € 645.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.16a
  - number: 8.17.1
    text: |-
      De ouderenkorting geldt voor de belastingplichtige die bij het einde van het kalenderjaar, of, indien de
      belastingplicht in de loop van het jaar is geëindigd, bij het einde van de belastingplicht, de leeftijd van 65 jaar
      heeft bereikt en die een verzamelinkomen heeft van niet meer dan € 31 256.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.17
  - number: 8.17.2
    text: De ouderenkorting bedraagt € 374.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.17
  - number: 8.18.1
    text: |-
      De alleenstaande ouderenkorting geldt voor de belastingplichtige indien hij
      in het kalenderjaar in aanmerking komt voor een uitkering als bedoeld in
      [artikel 9, eerste lid, onderdeel a of onderdeel c, van de Algemene Ouderdomswet][ref1], of daarvoor in aanmerking
      zou komen indien hij zou voldoen aan de voorwaarde van [artikel 7, onderdeel b, van de Algemene Ouderdomswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '7'
  - number: 8.18.2
    text: De alleenstaande ouderenkorting bedraagt € 562.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.18
  - number: 8.18a.1
    text: |-
      De levensloopverlofkorting geldt voor de belastingplichtige die in het kalenderjaar beschikt over een ingevolge een
      levensloopregeling als bedoeld in [artikel 19g van de Wet op de loonbelasting 1964][ref1] opgebouwde voorziening.
      Voor de belastingplichtige die met toepassing van [artikel 19g, zesde lid][ref2], beschikt over de opgebouwde
      voorziening is de levensloopverlofkorting niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.18a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 8.18a.2
    text: |-
      De levensloopverlofkorting is gelijk aan het bedrag waarover met toepassing van
      [artikel 19g van de Wet op de loonbelasting 1964][ref1] wordt beschikt, maar ten hoogste € 185 per kalenderjaar
      waarin een voorziening in het kader van een levensloopregeling is opgebouwd, verminderd met de bedragen aan
      levensloopverlofkorting die de belastingplichtige in voorafgaande kalenderjaren reeds heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.18a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 8.18a.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.18a
  - number: 8.19.1
    text: |-
      De korting voor maatschappelijke beleggingen geldt voor de belastingplichtige van wie maatschappelijke beleggingen
      zijn vrijgesteld op grond van [artikel 5.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 8.19.2
    text: |-
      De korting voor maatschappelijke beleggingen bedraagt 1,3% van het gemiddelde van de bedragen die ingevolge
      [artikel 5.13][ref1] op begindatum en op einddatum zijn vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '5.3'
  - number: 8.20.1
    text: |-
      De korting voor directe beleggingen in durfkapitaal en culturele beleggingen geldt voor de belastingplichtige van
      wie directe beleggingen in durfkapitaal als bedoeld in [artikel 5.17][ref1] ingevolge [artikel 5.16][ref2] zijn
      vrijgesteld of van wie culturele beleggingen ingevolge [artikel 5.16][ref3] zijn vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 8.20.2
    text: |-
      De korting voor directe beleggingen in durfkapitaal en culturele beleggingen bedraagt 1,3% van het gemiddelde van
      de bedragen aan directe beleggingen in durfkapitaal en culturele beleggingen die ingevolge [artikel 5.16][ref1] op
      begindatum en op einddatum zijn vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
        hoofdstuk: '5'
        afdeling: 5.3A
  - number: 9.1.1
    text: |-
      De belasting, bedoeld in de [artikelen 2.7][ref1] en [2.8][ref2], wordt geheven bij wege van aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 9.1.2
    text: |-
      De belasting, bedoeld in [artikel 2.9][ref1], wordt geheven bij wege van conserverende aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 9.1.3
    text: |-
      Indien de belastingplichtige ook premieplichtig is voor de volksverzekeringen geschiedt de heffing van de belasting
      en de premie voor de volksverzekeringen door middel van één belastingaanslag en voorzover de heffing plaatsvindt
      bij wege van conserverende aanslag, door middel van één conserverende belastingaanslag. Hierbij zijn de regels
      die gelden voor de heffing en de invordering van de inkomstenbelasting van overeenkomstige toepassing. In dat
      geval wordt, indien [artikel 67a van de Algemene wet inzake rijksbelastingen][ref1] toepassing vindt, die bepaling
      eenmaal toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67a
  - number: 9.2.1
    text: 'De voorheffingen zijn:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.1.a
    text: de geheven loonbelasting met uitzondering van de als eindheffing geheven loonbelasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.1.b
    text: de geheven dividendbelasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.1.c
    text: |-
      de op prijzen van kansspelen geheven kansspelbelasting die betrekking heeft op bestanddelen van het verzamelinkomen
      en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.1.d
    text: |-
      de door het Koninkrijk België, het Groothertogdom Luxemburg of de Republiek Oostenrijk geheven bronbelasting,
      bedoeld in artikel 11, eerste lid, van de richtlijn nr. 2003/48/EG van de Raad van de Europese Unie van 3 juni 2003
      betreffende belastingheffing op inkomsten uit spaargelden in de vorm van rentebetaling (Pb EG L 157), over een uit
      die lidstaat als uiteindelijk gerechtigde in de zin van de richtlijn ontvangen rentebetaling als bedoeld in artikel
      6 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.2
    text: |-
      In afwijking van het eerste lid wordt dividendbelasting niet als voorheffing in aanmerking genomen indien de
      belastingplichtige ten laste van wie de dividendbelasting is ingehouden niet tevens de uiteindelijk gerechtigde is
      tot de opbrengst waarop dividendbelasting is ingehouden. Niet als uiteindelijk gerechtigde wordt beschouwd degene
      die in samenhang met de genoten opbrengst een tegenprestatie heeft verricht als onderdeel van een samenstel van
      transacties waarbij aannemelijk is dat:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.2.a
    text: |-
      de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan een natuurlijk persoon of
      rechtspersoon die in mindere mate gerechtigd is tot vermindering, teruggaaf of verrekening van dividendbelasting
      dan degene die de tegenprestatie heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.2.b
    text: |-
      deze natuurlijk persoon of rechtspersoon een positie in aandelen, winstbewijzen of geldleningen als bedoeld in
      [artikel 10, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1] op directe of indirecte
      wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke aandelen, winstbewijzen of
      geldleningen voorafgaand aan het moment waarop het samenstel van transacties een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '10'
  - number: 9.2.3
    text: |-
      Voor de toepassing van het tweede lid: - kan van een samenstel van transacties eveneens sprake zijn ingeval
      transacties zijn aangegaan op een gereglementeerde effectenbeurs of markt;
        - wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele verwerving
      van een of meer dividendbewijzen of op de vestiging van kortlopende genotsrechten op aandelen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.4
    text: |-
      In afwijking van het eerste lid wordt dividendbelasting niet als voorheffing in aanmerking genomen indien
      de dividendbelasting is ingehouden op de opbrengst die deel uitmaakt van een voorziening ingevolge een
      levensloopregeling als bedoeld in [artikel 19g Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 9.2.5
    text: |-
      Ten aanzien van een belastingplichtige die deel uitmaakt van een buitenlands gezelschap als bedoeld
      in [artikel 5b van de Wet op de loonbelasting 1964][ref1], wordt ook als voorheffing aangemerkt een
      evenredig deel van de loonbelasting die is geheven over de door het gezelschap ontvangen gage, bedoeld in
      [artikel 35g van die wet][ref2], welk evenredig deel is gerelateerd aan het aan hem toegerekende deel van de door
      het gezelschap ontvangen gage.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35g
  - number: 9.2.6
    text: |-
      Indien [artikel 9.1, derde lid][ref1], toepassing vindt, wordt ook als voorheffing aangemerkt de bij wijze van
      inhouding geheven premie voor de volksverzekeringen met uitzondering van de bij wijze van eindheffing geheven
      premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.7
    text: |-
      De ingevolge dit artikel in aanmerking te nemen voorheffingen gelden niet als voorheffing voor de bij wege van
      conserverende aanslag te heffen belasting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.8
    text: |-
      Voor buitenlandse belastingplichtigen wordt, in afwijking van het eerste lid, aanhef en onderdeel b, als
      voorheffing aangewezen de geheven dividendbelasting die betrekking heeft op bestanddelen van het verzamelinkomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.9
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de berekening van de in België
      verschuldigde belasting en bijdragen en premies sociale zekerheid die ingevolge artikel 27 van het op 5 juni 2001
      te Luxemburg tot stand gekomen Verdrag tussen het Koninkrijk der Nederlanden en het Koninkrijk België tot het
      vermijden van dubbele belasting en tot het voorkomen van het ontgaan van belastingen inzake belastingen naar het
      inkomen en naar het vermogen, met Protocol I en II, (Trb. 2001, 136), worden aangemerkt als ingehouden Nederlandse
      loonbelasting. De eerste volzin is van overeenkomstige toepassing met betrekking tot bronbelasting, bedoeld in het
      eerste lid, onderdeel d, en bronbelasting, bedoeld in het tiende lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.2.10
    text: |-
      Bij algemene maatregel van bestuur kan als voorheffing worden aangewezen een door een andere mogendheid dan genoemd
      in het eerste lid, onderdeel d, geheven bronbelasting over een uit die mogendheid als uiteindelijk gerechtigde
      in de zin van de in dat onderdeel bedoelde richtlijn ontvangen rentebetaling, mits de bronbelasting vergelijkbaar
      is met die in artikel 11 van de richtlijn en de rentebetaling valt onder de begripsomschrijving van artikel 6 van
      de richtlijn. Voor de toepassing van de eerste volzin worden de afhankelijke en geassocieerde gebieden, bedoeld
      in artikel 17, tweede lid, onderdeel ii, van de in die volzin bedoelde richtlijn, aangemerkt als afzonderlijke
      mogendheden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.2
  - number: 9.3.1
    text: |-
      Bij de vaststelling van een voorlopige teruggaaf voor of in de loop van het kalenderjaar worden alleen de volgende
      negatieve bestanddelen van het belastbare inkomen uit werk en woning in aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.1.a
    text: de reisaftrek;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.1.b
    text: de negatieve belastbare inkomsten uit eigen woning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.1.c
    text: de uitgaven voor inkomensvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.1.d
    text: de persoonsgebonden aftrek;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.1.e
    text: de verliezen uit werk en woning uit voorafgaande kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2
    text: 'Bij de vaststelling van de voorlopige teruggaaf wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.a
    text: |-
      de verhoging van de *gecombineerde heffingskorting* volgens [artikel 8.9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 9.3.2.b
    text: |-
      de bijzondere verhoging van de heffingskorting voor de inkomstenbelasting volgens [artikel 8.9a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 9.3.2.c
    text: de kinderkorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.d
    text: de ouderschapsverlofkorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.e
    text: de combinatiekorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.f
    text: de aanvullende combinatiekorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.g
    text: de alleenstaande-ouderkorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.h
    text: de aanvullende alleenstaande-ouderkorting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.i
    text: de korting voor maatschappelijke beleggingen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.j
    text: de korting voor directe beleggingen in durfkapitaal en culturele beleggingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.2.k
    text: |-
      de voorheffing, bedoeld in [artikel 9.2, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.3
    text: |-
      Volgens bij of krachtens algemene maatregel van bestuur te stellen regels kan bij de vaststelling van de voorlopige
      teruggaaf rekening worden gehouden met de algemene heffingskorting, de ouderenkorting en de alleenstaande
      ouderenkorting.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.4
    text: |-
      Met een verlies als bedoeld in het eerste lid, onderdeel e, wordt pas rekening gehouden nadat de aangifte is gedaan
      over het kalenderjaar waarop het verlies betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.5
    text: |-
      Een voorlopige teruggaaf wordt, behalve voorzover die betrekking heeft op de verhoging van de gecombineerde
      heffingskorting volgens [artikel 8.9][ref1], alleen vastgesteld voorzover aannemelijk is dat het gezamenlijke
      bedrag van de voorheffingen meer zal belopen dan het bedrag dat aan inkomstenbelasting verschuldigd zou zijn indien
      een aanslag inkomstenbelasting zou worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 9.3.6
    text: |-
      Bij het bepalen van een voorlopige teruggaaf wordt geen rekening gehouden met inkomensbestanddelen waarvan de
      daaraan toe te rekenen belasting wordt begrepen in een conserverende aanslag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
  - number: 9.3.7
    text: |-
      Indien [artikel 9.1, derde lid][ref1], toepassing vindt, wordt in dit artikel onder inkomstenbelasting verstaan het
      gezamenlijke bedrag van de inkomstenbelasting en de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.1
    text: 'Een aanslag wordt vastgesteld indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.1.a
    text: |-
      de verschuldigde belasting het saldo van de gezamenlijke voorheffingen en de voorlopige teruggaven
      (voorheffingssaldo), met meer dan € 41 te boven gaat, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.1.b
    text: de belastingplichtige binnen een bij ministeriële regeling te stellen termijn aangifte heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.2
    text: In andere gevallen wordt geen aanslag vastgesteld en worden voorheffingen niet verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.3
    text: 'Het eerste lid, onderdeel a, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.3.a
    text: |-
      indien de belastingplichtige in het kalenderjaar de leeftijd van 65 jaar bereikt en een verzamelinkomen heeft dat
      uitsluitend bestaat uit een uitkering volgens de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 9.4.3.b
    text: |-
      indien de belastingplichtige een niet in Nederland wonende artiest of beroepssporter is als bedoeld in
      [artikel 5a van de Wet op de loonbelasting 1964][ref1], dan wel lid is van een buitenlands gezelschap in de zin van
      [artikel 5b van die wet][ref2], en zijn verzamelinkomen uitsluitend bestaat uit gage, bedoeld in [artikel 35][ref3]
      of [35g van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 5b
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0002471
        artikel: 35g
  - number: 9.4.4
    text: |-
      Het derde lid, onderdeel a, is niet van toepassing indien een voorlopige teruggaaf is vastgesteld
      waarbij ook rekening is gehouden met negatieve bestanddelen van het belastbare inkomen als bedoeld in
      [artikel 9.3, eerste lid][ref1], dan wel waarbij geheel of gedeeltelijk ten onrechte of tot een hoger bedrag
      dan in [artikel 8.9, tweede lid][ref2], is aangeduid, een verhoging van de gecombineerde heffingskorting volgens
      [artikel 8.9][ref3] in aanmerking is genomen. In het laatste geval hoeft de belastingplichtige geen aangifte te
      doen indien de onjuiste verhoging blijkt bij de aangifte van de partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.1'
  - number: 9.4.5
    text: |-
      In het geval bedoeld in het eerste lid, onderdeel b, wordt, indien het voorheffingssaldo de verschuldigde
      belasting niet, of met niet meer dan € 13 te boven gaat, de aanslag vastgesteld op nihil en wordt gelijktijdig het
      verzamelinkomen vastgesteld bij voor bezwaar vatbare beschikking. Daarbij worden de voorheffingen en de voorlopige
      teruggaven niet verrekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
  - number: 9.4.6
    text: |-
      Indien een of meer voorlopige teruggaven zijn vastgesteld, wordt, indien volgens de vorige leden geen aanslag
      wordt vastgesteld, na verloop van de in [artikel 11, derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      bedoelde termijn, een aanslag geacht te zijn vastgesteld tot het bedrag van de voorlopige teruggaaf of teruggaven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
  - number: 9.4.7
    text: |-
      Indien [artikel 9.1, derde lid][ref1], toepassing vindt, is dit artikel van overeenkomstige toepassing met
      betrekking tot het gezamenlijke bedrag van de belasting en de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.1
    text: |-
      Indien er grond is voor het vermoeden dat vaststelling van het in [artikel 9.4, vijfde lid][ref1], bedoelde
      verzamelinkomen ten onrechte achterwege is gelaten of dat dit verzamelinkomen tot een te laag bedrag is
      vastgesteld, kan de inspecteur alsnog een beschikking verzamelinkomen vaststellen dan wel de vastgestelde
      beschikking bij voor bezwaar vatbare beschikking herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.2
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, levert geen grond op voor
      herziening, tenzij de belastingplichtige terzake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.5
  - number: 9.5.3
    text: |-
      [Artikel 16, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige
      toepassing op de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: '10.1'
    text: |-
