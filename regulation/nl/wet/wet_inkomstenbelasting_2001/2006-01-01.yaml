    text: bepaalde noodzakelijke kosten in verband met opleiding of studie;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.h.4°
    text: bepaalde noodzakelijke kosten die naar aard en strekking overeenkomen met kosten als bedoeld in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.h.5°
    text: bepaalde noodzakelijke kosten van huishoudelijke hulp;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.i
    text: |-
      bij ministeriële regeling aan te wijzen uitkeringen die zijn bedoeld ter dekking van onderhoudskosten van
      thuiswonende gehandicapte kinderen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.j
    text: |-
      uitkeringen krachtens [artikel 44, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
