  - number: 10.10.2
    text: |-
      Als projecten als bedoeld in [artikel 5.14, derde lid][ref1], worden mede aangemerkt projecten of categorieën
      van projecten, die zijn gelegen op de Nederlandse Antillen of Aruba ter zake waarvan door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in overeenstemming met Onze Minister en na overleg met Onze
      Minister van Landbouw, Natuurbeheer en Visserij, schriftelijk is verklaard onder door hem te stellen voorwaarden
      met betrekking tot de controle ter zake van de omstandigheid, dat die projecten of categorieën van projecten
      in het belang dienen te zijn van de bescherming van het milieu, waaronder natuur en bos. Een schriftelijke
      verklaring wordt niet afgegeven op aanvragen voor een project dat voor 1 januari 1998 voldeed aan een van de
      projectomschrijvingen van de krachtens [artikel 5.14, derde lid][ref2], gestelde bepalingen of waarvoor voor die
      datum een begin met de uitvoering van de bijbehorende fysieke werkzaamheden is gemaakt. Een verklaring kan worden
      ingetrokken indien niet wordt voldaan aan de voorwaarden die zijn gesteld ter zake van de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.10
