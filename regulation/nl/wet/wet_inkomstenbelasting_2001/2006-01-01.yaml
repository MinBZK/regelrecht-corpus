  - number: 3.104.k
    text: |-
      de zorgtoeslag op grond van de [Wet op de zorgtoeslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018451
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
    references:
      - id: ref1
        bwb_id: BWBR0018451
  - number: 3.104.l
    text: |-
      bij ministeriële regeling aan te wijzen uitkeringen die naar aard en strekking overeenkomen met uitkeringen als
      bedoeld in de onderdelen a tot en met k;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.104.m
    text: |-
      uitkeringen op grond van buitenlandse regelingen die naar aard en strekking overeenkomen met uitkeringen als
      bedoeld in de onderdelen a tot en met l.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.104
  - number: 3.105.1
    text: |-
      Tot de periodieke uitkeringen en verstrekkingen die worden ontvangen op grond van een rechtstreeks uit het
      familierecht voortvloeiende verplichting behoren de periodieke uitkeringen en verstrekkingen voorzover zij zijn
      overeengekomen in het kader van echtscheiding of scheiding van tafel en bed ter verrekening van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.105
  - number: 3.105.1.a
    text: pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.105
  - number: 3.105.1.b
    text: |-
      *lijfrenten* en andere inkomensvoorzieningen voorzover de daarvoor betaalde premies als uitgave voor
      inkomensvoorziening in aanmerking zijn genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.105
  - number: 3.105.2
    text: |-
      Tot de periodieke uitkeringen en verstrekkingen die worden ontvangen op grond van een rechtstreeks uit het
      familierecht voortvloeiende verplichting behoren de periodieke uitkeringen en verstrekkingen die dienen ter
      vervanging van dergelijke periodieke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.105
  - number: 3.105.3
    text: |-
      Het eerste en het tweede lid zijn uitsluitend van toepassing op periodieke uitkeringen en verstrekkingen die worden
      gedaan door degene die tot de verrekening respectievelijk de vervanging verplicht is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.105
  - number: 3.106.1
    text: |-
      Voorzover ter zake van een *lijfrente* of een andere aanspraak uit een inkomensvoorziening als bedoeld in
      [artikel 3.100, eerste lid, onderdeel b][ref1], dan wel een aanspraak op grond van een pensioenregeling als bedoeld
      in [artikel 3.100, eerste lid, onderdeel d][ref2], op enig moment negatieve uitgaven voor inkomensvoorzieningen in
      aanmerking worden genomen, behoort op dat tijdstip mede tot de uitkeringen als bedoeld in genoemd onderdeel b of
      d, de waarde in het economische verkeer van de aanspraak voorzover deze de ter zake van de aanspraak in aanmerking
      genomen negatieve uitgaven te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.106.2
    text: |-
      Tot de uitkeringen op grond van een buitenlandse voorziening als bedoeld in
      [artikel 3.100, eerste lid, onderdeel c][ref1], behoort mede:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.106
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.106.2.a
    text: wat wordt genoten ter vervanging van gederfde of te derven zodanige uitkeringen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.106
  - number: 3.106.2.b
    text: |-
      wat met betrekking tot een recht op zodanige uitkeringen wordt genoten ter zake van vervreemding of het
      onherroepelijk worden van de begunstiging.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.106
  - number: 3.106.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, wordt als op het tijdstip van vervreemding of onherroepelijk
      worden van de begunstiging genoten bedrag aangemerkt, de waarde in het economische verkeer van het in dat onderdeel
      bedoelde recht. De vorige volzin is niet van toepassing indien de verkrijger of de begunstigde een natuurlijk
      persoon is en het verkregen recht geen deel uitmaakt van het vermogen van een voor zijn rekening gedreven
      onderneming. Met vervreemding wordt gelijkgesteld het brengen in het vermogen van een onderneming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.106
  - number: 3.107.1
    text: |-
      Tot de uitkeringen uit inkomensvoorzieningen bedoeld in [artikel 3.100, eerste lid, onderdeel b][ref1], en de
      uitkeringen uit pensioenregelingen als bedoeld in [artikel 3.100, eerste lid, onderdeel d][ref2], behoren niet
      uitkeringen op grond van een voorziening waarvan de waarde op grond van [artikel 3.106][ref3] in aanmerking is
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: 3.107.2
    text: |-
      [Artikel 2.14, tweede lid][ref1], is niet van toepassing op het recht waaruit deze uitkeringen voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.107
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '3.108'
    text: |-
      Aftrekbare kosten van uitkeringen en verstrekkingen zijn de daarop drukkende kosten voorzover zij zijn gemaakt tot
      verwerving, inning en behoud van die uitkeringen en verstrekkingen. De kosten kunnen in mindering worden gebracht
      voorzover zij in hun totale omvang niet overtreffen wat gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.108
  - number: '3.109'
    text: |-
      Tot de aftrekbare kosten van uitkeringen en verstrekkingen behoren niet renten van schulden, kosten van
      geldleningen daaronder begrepen. [Artikel 3.14, zevende lid][ref1], en [3.16, negende lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.109
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.110'
    text: |-
      Belastbare inkomsten uit *eigen woning* zijn de voordelen uit eigen woning en het voordeel uit
      kapitaalverzekering eigen woning verminderd met de op de voordelen uit eigen woning drukkende aftrekbare kosten
      ([artikel 3.120][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.110
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.111.1
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder *eigen woning*: een gebouw, een duurzaam
      aan een plaats gebonden schip of woonwagen in de zin van [artikel 1 van de Woningwet][ref1], of een gedeelte van
      een gebouw, een schip of een woonwagen, met de daartoe behorende aanhorigheden, voorzover dat de belastingplichtige
      of personen die behoren tot zijn huishouden anders dan tijdelijk als hoofdverblijf ter beschikking staat op grond
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 3.111.1.a
    text: |-
      eigendom, waaronder begrepen economische eigendom, of een recht van lidmaatschap van een coöperatie, indien met
      betrekking tot die woning de belastingplichtige of zijn *partner* de voordelen geniet, de kosten en lasten op de
      belastingplichtige of zijn partner drukken en de waardeverandering hen grotendeels aangaat;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.1.b
    text: |-
      een recht van vruchtgebruik, een recht van bewoning of een recht van gebruik dat de belastingplichtige krachtens
      erfrecht heeft verkregen, indien met betrekking tot die woning de belastingplichtige de voordelen geniet en de
      kosten en lasten op hem drukken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.2
    text: |-
      Een woning wordt mede aangemerkt als eigen woning indien de woning de belastingplichtige in het kalenderjaar of in
      een van de voorafgaande twee jaar als eigen woning als bedoeld in het eerste lid ter beschikking heeft gestaan en
      sindsdien leeg staat en hij aannemelijk maakt dat de woning bestemd is voor verkoop.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.3
    text: |-
      Een woning wordt mede aangemerkt als eigen woning indien de belastingplichtige aannemelijk maakt dat de woning leeg
      staat of in aanbouw is en uitsluitend bestemd is om in het kalenderjaar of in een van de daaropvolgende twee jaren
      hem als eigen woning als bedoeld in het eerste lid ter beschikking te staan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.4
    text: |-
      Een woning wordt voor ten hoogste twee jaren na het tijdstip waarop de woning de belastingplichtige niet
      langer anders dan tijdelijk als hoofdverblijf ter beschikking staat mede aangemerkt als eigen woning indien de
      belastingplichtige aannemelijk maakt dat gedurende die periode de woning zijn gewezen partner anders dan tijdelijk
      als hoofdverblijf ter beschikking staat.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.5
    text: |-
      Een woning wordt voor ten hoogste twee jaren na het tijdstip waarop de woning de belastingplichtige
      niet langer anders dan tijdelijk als hoofdverblijf ter beschikking staat mede aangemerkt als eigen
      woning indien de belastingplichtige gedurende die periode verblijft in een instelling, die op grond van
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref1] moet zijn toegelaten om zorg als bedoeld in artikel 6
      van die wet te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
  - number: 3.111.6
    text: |-
      Een woning die de belastingplichtige gedurende tenminste een jaar als eigen woning als bedoeld in het eerste lid
      ter beschikking heeft gestaan en sindsdien tijdelijk als hoofdverblijf niet anders dan tijdelijk ter beschikking
      staat, kan op verzoek mede worden aangemerkt als eigen woning indien gedurende die periode:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.6.a
    text: de woning niet aan derden ter beschikking wordt gesteld en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.6.b
    text: |-
      de belastingplichtige tezamen met zijn partner niet met betrekking tot een andere woning belastbare inkomsten uit
      eigen woning geniet.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.7
    text: |-
      Het tijdelijk ter beschikking stellen van een woning aan derden, ontneemt daaraan niet het karakter van
      hoofdverblijf.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.8
    text: |-
      Bij een belastingplichtige en zijn *partner* tezamen wordt niet meer dan één hoofdverblijf in aanmerking
      genomen. Indien partners meer dan één woning hebben die als hoofdverblijf kan worden aangemerkt, kunnen de
      belastingplichtige en zijn partner gezamenlijk bij de aangifte kiezen welke van die woningen als zodanig wordt
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.9
    text: 'Indien de belastingplichtige en zijn partner voor een kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.9.a
    text: de keuze om één woning als hoofdverblijf aan te merken hebben gemaakt, kan niet op die keuze worden teruggekomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.9.b
    text: geen keuze hebben gemaakt, wordt geen van de woningen als hoofdverblijf aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.10
    text: |-
      Onder eigen woning wordt niet begrepen een naar verkeersopvatting zelfstandig gedeelte van een gebouw, schip of
      woonwagen met de daartoe behorende aanhorigheden dat wordt gebruikt:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.10.1°
    text: |-
      in een onderneming van de belastingplichtige of persoon die tot zijn huishouden behoort en bij de bepaling van de
      winst van die onderneming ter zake van dat gebruik een bedrag ten laste van de winst kan worden gebracht;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.10.2°
    text: |-
      voor resultaat uit een of meer werkzaamheden van de belastingplichtige of persoon die tot zijn huishouden behoort
      en bij de bepaling van dat resultaat ter zake van dat gebruik een bedrag ten laste van het resultaat kan worden
      gebracht, of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
  - number: 3.111.10.3°
    text: |-
      in een vennootschap waarin de belastingplichtige of persoon die tot zijn huishouden behoort een aanmerkelijk
      belang heeft als bedoeld in [hoofdstuk 4][ref1], uitgezonderd de [artikelen 4.10][ref2] en [4.11][ref3], en bij de
      bepaling van de winst van die vennootschap ter zake van dat gebruik een bedrag ten laste van de winst kan worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.111
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 3.112.1
    text: |-
      De voordelen uit *eigen woning* worden bij een eigenwoningwaarde van







                    meer dan


                    maar niet meer dan


                    op jaarbasis gesteld op






                    –


                    € 12 500


                    nihil




                    € 12 500


                    € 25 000


                    0,20% van deze waarde




                    € 25 000


                    € 50 000


                    0,35% van deze waarde




                    € 50 000


                    € 75 000


                    0,45% van deze waarde




                    € 75 000


                    –


                    0,60% van deze waarde, maar ten hoogste € 8900
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.112
  - number: 3.112.2
    text: |-
      De eigenwoningwaarde is de volgens [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] voor die woning
      vastgestelde waarde of waarden voor het tijdvak waarbinnen het kalenderjaar valt. Indien een eigen woning deel
      uitmaakt van een onroerende zaak als bedoeld in [artikel 16 van de Wet waardering onroerende zaken][ref2], wordt
      de eigenwoningwaarde gesteld op het gedeelte van de waarde van de onroerende zaak dat kan worden toegekend aan
      de woning.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 3.112.3
    text: |-
      Met betrekking tot de eigen woning ter zake waarvan het tweede lid geen toepassing kan vinden door het ontbreken
      van een op grond van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] vastgestelde waarde, is de
      eigenwoningwaarde de waarde van de woning die wordt bepaald met overeenkomstige toepassing van het bepaalde bij of
      krachtens de [artikelen 16 tot en met 19][ref2], [20, tweede lid][ref3], en [22, derde lid, van die wet][ref4] en
      van het tweede lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 3.112.4
    text: |-
      De voordelen uit een eigen woning als bedoeld in [artikel 3.111, tweede en derde lid][ref1], worden gesteld op
      nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.112.5
    text: |-
      De voordelen uit een eigen woning als bedoeld in [artikel 3.111, zesde lid][ref1], worden gesteld op 1% van de
      eigenwoningwaarde, maar ten hoogste € 8900.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.112
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: '3.113'
    text: |-
      Met betrekking tot de *eigen woning* die tijdelijk ter beschikking is gesteld aan derden worden voor de periode van
      terbeschikkingstelling de uit de woning genoten voordelen gesteld op driekwart van de voordelen ter zake van het
      ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.113
  - number: 3.114.1
    text: |-
      Indien de opbrengsten uit het anders dan voor korte duur ter beschikking stellen van al dan niet gestoffeerde
      of gemeubileerde woonruimte die geen zelfstandige woning vormt en deel uitmaakt van de woning die de
      belastingplichtige anders dan tijdelijk als hoofdverblijf ter beschikking staat, niet meer bedragen dan € 3902 per
      jaar, wordt die woonruimte aangemerkt als onderdeel van de *eigen woning*en worden de voordelen, andere dan bedoeld
      in [artikel 3.112, eerste lid][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.114
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.114.2
    text: |-
      Voor toepassing van dit artikel dient zowel de belastingplichtige als degene aan wie ter beschikking is gesteld
      gedurende de tijd van de terbeschikkingstelling als ingezetene op het woonadres ter zake van de woning te zijn
      ingeschreven in de basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.114
  - number: '3.115'
    text: |-
      De voordelen uit een woning die voor twee of meer belastingplichtigen die geen *partner* van elkaar zijn samen
      een *eigen woning* is, worden voor elk van hen in aanmerking genomen naar de mate waarin zij op grond van
      [artikel 3.111, eerste lid][ref1], tot de woning gerechtigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.115
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.116.1
    text: |-
      Het voordeel uit kapitaalverzekering eigen woning is de rente die is begrepen in een kapitaalsuitkering uit
      *levensverzekering*die dient ter aflossing van de eigenwoningschuld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.2
    text: |-
      Van een kapitaalverzekering eigen woning is sprake zolang de in het eerste lid bedoelde woning van de
      verzekeringnemer, zijn echtgenoot of degene met wie hij duurzaam een gezamenlijke huishouding voert een eigen
      woning is en:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.2.a
    text: in de overeenkomst is bepaald dat de begunstigde de uitkering zal aanwenden ter aflossing van de eigenwoningschuld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.2.b
    text: |-
      in de overeenkomst is bepaald dat ten minste 15 jaar, of tot het overlijden van de verzekerde, jaarlijks premies
      ter zake van de verzekering worden voldaan waarbij de hoogste premie niet meer bedraagt dan het tienvoud van de
      laagste premie;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.2.c
    text: de verzekering recht geeft op een eenmalige kapitaalsuitkering bij leven of overlijden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.2.d
    text: |-
      de premies voor de verzekering verschuldigd zijn aan een verzekeraar die bevoegd is het directe
      verzekeringsbedrijf, bedoeld in de[ Wet toezicht verzekeringsbedrijf 1993][ref1], uit te oefenen en


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 3.116.2.e
    text: |-
      in de overeenkomst is bepaald dat de in onderdeel a bedoelde woning een eigen woning is in de zin van de Wet
      inkomstenbelasting 2001.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3
    text: |-
      Een kapitaalverzekering eigen woning wordt geacht geheel tot uitkering te zijn gekomen bij de verzekeringnemer of,
      in geval van onherroepelijke begunstiging, bij de begunstigde, indien:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.a
    text: de verzekering niet meer voldoet aan de voorwaarden van het tweede lid;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.b
    text: |-
      de verzekering wordt afgekocht, behoudens voorzover sprake is van omzetting als bedoeld in [artikel 3 119][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.116.3.c
    text: |-
      de verzekering wordt vervreemd, behoudens voorzover de verzekering in het kader van het aangaan of beëindigen
      van een huwelijk of van een duurzame gezamenlijke huishouding wordt omgezet in een of meer andere soortgelijke
      verzekeringen voor een of beide echtgenoten of voormalige echtgenoten of voor een of beide personen die bedoelde
      gezamenlijke huishouding voeren of hebben gevoerd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.d
    text: de verzekering wordt ingebracht in het vermogen van een onderneming;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.e
    text: |-
      de verzekering gedeeltelijk tot uitkering komt dan wel, indien de verzekering recht geeft op eenmalige uitkeringen
      bij leven of overlijden van meer dan een verzekerde, per verzekerde gedeeltelijk tot uitkering komt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.f
    text: |-
      niet ten minste 15 jaar, of tot het overlijden van de verzekerde, jaarlijks premies ter zake van de verzekering
      worden voldaan dan wel de hoogste premie meer bedraagt dan het tienvoud van de laagste premie; of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.3.g
    text: de verzekering een looptijd van 30 jaar heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.4
    text: |-
      Indien de verzekeringnemer of, in geval van een onherroepelijke begunstiging, de begunstigde anders dan door
      overlijden ophoudt binnenlands belastingplichtig te zijn, wordt de kapitaalverzekering eigen woning geacht op het
      onmiddellijk daaraan voorafgaande tijdstip tot uitkering te zijn gekomen bij de verzekeringnemer of, in geval van
      een onherroepelijke begunstiging, bij de begunstigde en de hoogte van de uitkering gesteld op de waarde in het
      economische verkeer van de verzekering. Onder ophouden binnenlands belastingplichtig te zijn wordt mede verstaan de
      situatie waarin de verzekeringnemer respectievelijk de begunstigde voor de toepassing van de Belastingregeling voor
      het Koninkrijk of een verdrag ter voorkoming van dubbele belasting wordt geacht geen inwoner van Nederland meer
      te zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.5
    text: |-
      Indien bij een belastingplichtige ingevolge het vierde lid een uitkering in aanmerking is genomen ter zake waarvan
      een conserverende aanslag is opgelegd en de belastingplichtige weer binnenlands belastingplichtig is en in de
      tussentijd:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.5.a
    text: |-
      zich niet een omstandigheid heeft voorgedaan waardoor de woning is opgehouden een eigen woning te zijn in de zin
      van [artikel 3.111][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.116.5.b
    text: de belastingplichtige niet een voordeel heeft genoten als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.5.c
    text: zich niet een omstandigheid heeft voorgedaan als bedoeld in het derde lid,
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.6
    text: |-
      De rente begrepen in een uitkering uit een kapitaalverzekering eigen woning wordt gesteld op het bedrag waarmee de
      uitkering overtreft wat ter zake van de verzekering aan premies is voldaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.7
    text: 'Onder premies ter zake van een kapitaalverzekering eigen woning worden mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.7.a
    text: |-
      bij een uitkering bij leven: premies voor bij dezelfde overeenkomst verzekerde uitkeringen bij overlijden of
      uitkeringen of vrijstelling van premiebetaling bij invaliditeit, voorzover die uitkeringen gezamenlijk niet meer
      bedragen dan driemaal het verzekerde kapitaal bij leven;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.7.b
    text: |-
      bij een uitkering bij overlijden: premies voor bij dezelfde overeenkomst verzekerde uitkeringen bij leven,
      uitkeringen of vrijstelling van premiebetaling bij invaliditeit of uitkeringen bij overlijden ten gevolge van
      een ongeval, voorzover die uitkeringen gezamenlijk niet meer bedragen dan driemaal het verzekerde kapitaal bij
      overlijden.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: 3.116.8
    text: |-
      Indien een kapitaalverzekering eigen woning is voortgekomen uit een levensverzekering die na 14 september 1999 tot
      stand gekomen is en die geen kapitaalverzekering eigen woning was wordt, op het moment dat wordt voldaan aan de
      voorwaarden voor een kapitaalverzekering eigen woning, mede als premie ter zake van de kapitaalverzekering eigen
      woning aangemerkt de waarde in het economische verkeer van de oude polis verminderd met de daarop gestorte premies
      (overschot). Voor de beoordeling van de voorwaarde of de hoogste en de laagste premie blijft binnen de in het
      tweede lid, onderdeel b, bedoelde bandbreedte, blijft het overschot buiten aanmerking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.116
  - number: '3.117'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder
      *levensverzekering*: een overeenkomst van levensverzekering als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet toezicht verzekeringsbedrijf 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.117
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 3.118.1
    text: |-
      Tot het voordeel uit kapitaalverzekering eigen woning behoort niet de rente begrepen in de uitkering uit een
      kapitaalverzekering eigen woning voorzover de uitkering niet meer bedraagt dan € 140 500 indien:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.1.a
    text: de uitkering heeft gediend als aflossing van de eigenwoningschuld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.1.b
    text: |-
      ter zake van de verzekering ten minste 20 jaar, of, indien de verzekering tot uitkering komt door eerder
      overlijden, tot het overlijden, jaarlijks premies zijn voldaan en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.1.c
    text: |-
      de hoogste premie niet meer heeft bedragen dan het tienvoud van de laagste. In afwijking in zoverre van de eerste
      volzin, aanhef en onderdeel b, wordt de rente die is begrepen in de uitkering uit een kapitaalverzekering eigen
      woning, voorzover deze uitkering niet meer bedraagt dan € 31 900, niet als voordeel uit kapitaalverzekering
      aangemerkt indien ter zake van de verzekering ten minste 15 jaar jaarlijks premies zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.2
    text: 'De in het eerste lid, onderdelen a en b, genoemde voorwaarden gelden niet indien:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.2.a
    text: |-
      de verzekeringnemer, zijn echtgenoot of degene met wie hij duurzaam een gezamenlijke huishouding voert geen *eigen
      woning*meer ter beschikking staat en ter zake daarvan de verzekering tot uitkering is gekomen of wordt geacht tot
      uitkering te zijn gekomen of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.2.b
    text: |-
      de verzekering wordt geacht tot uitkering te zijn gekomen door het ophouden binnenlands belastingplichtig te zijn
      als bedoeld in [artikel 3.116, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.3
    text: |-
      De bedragen bepaald op grond van het eerste lid worden verminderd met het bedrag aan uitkering uit een
      kapitaalverzekering dat eerder ten aanzien van de belastingplichtige voor de toepassing van het eerste lid in
      aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.4
    text: |-
      Indien op het tijdstip van de uitkering het bedrag van de eigenwoningschuld lager is dan het op grond van het
      eerste en het derde lid bepaalde bedrag, wordt het in het eerste lid, in verbinding met het derde lid, bepaalde
      bedrag vervangen door het bedrag van de eigenwoningschuld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.5
    text: |-
      Indien de belastingplichtige een levensverzekering heeft die ten aanzien van hem tot enig moment heeft voldaan aan
      de voorwaarden voor een kapitaalverzekering eigen woning en ter zake van die verzekering binnen drie jaren na dat
      moment wederom wordt voldaan aan de voorwaarden voor een kapitaalverzekering eigen woning, wordt het in het eerste
      lid genoemde bedrag verhoogd met een bedrag gelijk aan de in het derde lid bedoelde vermindering wegens de eerdere
      toepassing van het eerste lid op deze verzekering. De rente begrepen in de in de eerste volzin bedoelde verhoging,
      komt in mindering op het overschot, bedoeld in [artikel 3.116, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.6
    text: |-
      Indien bij een belastingplichtige ingevolge [artikel 3.116, vierde lid][ref1], een uitkering uit een
      kapitaalverzekering eigen woning in aanmerking is genomen en de belastingplichtige weer binnenlands
      belastingplichtig is en:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.6.a
    text: |-
      zich niet een omstandigheid heeft voorgedaan waardoor de woning is opgehouden een eigen woning te zijn in de zin
      van [artikel 3.111][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.6.b
    text: |-
      de belastingplichtige terzake van die kapitaalverzekering eigen woning niet een voordeel heeft genoten als bedoeld
      in artikel [3.116, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.6.c
    text: |-
      ter zake van die kapitaalverzekering zich niet een omstandigheid heeft voorgedaan als bedoeld in
      [artikel 3.116, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.118.7
    text: |-
      Indien één of meer kapitaalverzekeringen eigen woning tot uitkering komt of komen door het overlijden van de
      *partner* wordt het op grond van de voorgaande leden vast te stellen bedrag ten behoeve van de langstlevende
      *partner* verhoogd met het bedrag dat de overleden *partner* ter zake van deze kapitaalverzekeringen op grond
      van de voorgaande leden nog in aanmerking had kunnen nemen onmiddellijk voorafgaande aan zijn overlijden. Deze
      verhoging kan niet groter zijn dan het totale bedrag dat uit levensverzekering wordt uitgekeerd ten gevolge van het
      overlijden van de *partner*.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: 3.118.8
    text: |-
      Indien één of meer kapitaalverzekeringen eigen woning tot uitkering komt of komen door het overlijden van een
      persoon die geen *partner* is van de begunstigde, geldt voor de begunstigde ten aanzien van deze verzekeringen in
      plaats van het op grond van de voorgaande leden vast te stellen bedrag het bedrag dat de overleden persoon ter zake
      van deze kapitaalverzekeringen op grond van de voorgaande leden nog in aanmerking had kunnen nemen onmiddellijk
      voorafgaande aan zijn overlijden. Indien verschillende begunstigden een uitkering als bedoeld in de eerste volzin
      ontvangen, geldt voor de begunstigde onverkort hetgeen daar is bepaald met dien verstande dat het daar bedoelde
      bedrag dat de overleden persoon nog in aanmerking had kunnen nemen naar rato van de uitkeringen aan onderscheiden
      begunstigden in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.118
  - number: '3.119'
    text: |-
      Voorzover een kapitaalverzekering eigen woning wordt omgezet in een andere soortgelijke verzekering, wordt
      de laatstgenoemde verzekering voor de toepassing van deze afdeling geacht een voortzetting te zijn van de
      eerstgenoemde verzekering.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119
  - number: 3.119a.1
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt onder eigenwoningschuld verstaan
      het gezamenlijke bedrag van de schulden die zijn aangegaan ter verwerving van een eigen woning doch ten hoogste
      een bedrag gelijk aan de kosten ter verwerving van de woning verminderd met het bedrag van de eigenwoningreserve
      direct voorafgaande aan het moment waarop de woning ten aanzien van de belastingplichtige als een eigen woning
      wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.2
    text: |-
      Indien de eigenwoningschuld voor de vorige eigen woning die de belastingplichtige langer dan zes maanden anders
      dan tijdelijk als hoofdverblijf ter beschikking heeft gestaan direct voorafgaande aan de vervreemding van die
      woning groter is dan de op de voet van het eerste lid berekende eigenwoningschuld voor de nieuwe woning wordt, in
      zoverre in afwijking van het eerste lid, de eigenwoningschuld voor die woning gesteld op de eigenwoningschuld voor
      de vorige woning, dan wel, indien dat lager is, op het gezamenlijke bedrag van de schulden die zijn aangegaan ter
      verwerving van de nieuwe woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.3
    text: |-
      De eigenwoningschuld wordt verhoogd met het gezamenlijke bedrag van de schulden die zijn aangegaan voor verbetering
      of onderhoud van de woning of ter afkoop van de rechten van erfpacht, opstal of beklemming met betrekking tot de
      woning voorzover die schulden uitgaan boven het positieve bedrag van de eigenwoningreserve direct voorafgaande aan
      de verbetering, het onderhoud of de afkoop.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.4
    text: |-
      Bij de vervreemding van een eigen woning wordt het vervreemdingssaldo eigen woning toegevoegd aan een
      eigenwoningreserve. Onder vervreemdingssaldo eigen woning wordt verstaan de waarde van de tegenprestatie bij
      de vervreemding van een eigen woning, verminderd met de kosten ter zake van die vervreemding en verminderd
      met de eigenwoningschuld voor de woning. Voor de toepassing van dit lid worden tot de eigenwoningschuld mede
      gerekend het bedrag van de verlaging ingevolge het negende lid, de schulden ter zake waarvan de renten ingevolge
      [artikel 3.120, vierde lid, onderdeel c][ref1], niet tot de aftrekbare kosten van een eigen woning worden gerekend
      alsmede de schulden, bedoeld in [artikel 3.120, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.119a.5
    text: 'Een eigenwoningreserve neemt af, doch niet verder dan tot nihil, met:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.5.a
    text: |-
      een bedrag gelijk aan de kosten ter verwerving van een eigen woning verminderd met het bedrag dat ingevolge het
      eerste lid onderscheidenlijk het tweede lid als eigenwoningschuld voor die woning in aanmerking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.5.b
    text: |-
      een bedrag gelijk aan de aflossingen op de eigenwoningschuld voorzover zij betrekking hebben op het gedeelte
      van de eigenwoningschuld dat uitgaat boven het bedrag dat op de voet van het eerste lid als eigenwoningschuld in
      aanmerking zou kunnen worden genomen;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.5.c
    text: |-
      een bedrag gelijk aan de in een kalenderjaar gemaakte kosten voor verbetering of onderhoud van de woning of ter
      afkoop van de rechten van erfpacht opstal of beklemming met betrekking tot de woning, indien het gezamenlijke
      bedrag van de kosten uitgaat boven € 5 000.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.6
    text: |-
      De eigenwoningreserve vervalt voorzover die is toe te rekenen aan een vervreemdingssaldo eigen woning dat vijf jaar
      geleden is toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.7
    text: |-
      Voor de toepassing van dit artikel wordt onder verwerving onderscheidenlijk vervreemding van een eigen woning
      verstaan een gebeurtenis waardoor de woning ten aanzien van de belastingplichtige als een eigen woning wordt
      aangemerkt, onderscheidenlijk niet meer als zodanig wordt aangemerkt. Als verwerving wordt niet aangemerkt
      die krachtens boedelmenging door voltrekking van een huwelijk of wijziging van huwelijkse voorwaarden. Indien
      bij een verwerving of vervreemding een tegenprestatie ontbreekt of is bedongen bij een niet onder normale
      omstandigheden gesloten overeenkomst, wordt als tegenprestatie aangemerkt de waarde die ten tijde van de verwerving
      onderscheidenlijk de vervreemding in het economische verkeer aan de woning kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.8
    text: |-
      Indien ten aanzien van de belastingplichtige twee woningen gelijktijdig als eigen woning worden aangemerkt en
      vervolgens één van die woningen wordt vervreemd, wordt direct daarna de eigenwoningschuld voor de andere woning
      opnieuw vastgesteld door hernieuwde toepassing van het eerste en tweede lid, waarbij de actuele stand van de
      eigenwoningreserve in de plaats komt van de stand direct voorafgaande aan het moment waarop de woning ten aanzien
      van de belastingplichtige als een eigen woning is aangemerkt. Vervolgens wordt het vijfde lid, onderdeel a, opnieuw
      toegepast. Daarna wordt het derde lid opnieuw toegepast, waarbij de actuele stand van de eigenwoningreserve in de
      plaats komt van de stand direct voorafgaande aan de verbetering, het onderhoud of de afkoop. Ten slotte wordt het
      vijfde lid, onderdelen b en c, opnieuw toegepast.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.9
    text: |-
      Indien de belastingplichtige een eigen woning verwerft die bestemd is om hem en zijn partner anders dan
      tijdelijk als hoofdverblijf ter beschikking te staan, wordt, indien hen voordien reeds tezamen een woning
      anders dan tijdelijk als hoofdverblijf ter beschikking heeft gestaan en de partner ten aanzien van die eerdere
      woning een vervreemdingssaldo heeft behaald, de op grond van het eerste lid berekende eigenwoningschuld van de
      belastingplichtige verlaagd, maar niet verder dan tot nihil, met de eigenwoningreserve van de partner waarbij,
      indien de partner de woning mede heeft verworven, wordt uitgegaan van de eigenwoningreserve na toepassing van dit
      artikel met betrekking tot de partner. De in de eerste volzin bedoelde verlaging van de eigenwoningschuld wordt
      toegepast tot het moment waarop de woning hen niet meer gezamenlijk anders dan tijdelijk als hoofdverblijf ter
      beschikking staat. Voor de toepassing van de eerste volzin wordt onder partner mede verstaan degene met wie de
      belastingplichtige duurzaam een gezamenlijke huishouding voert.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119a.10
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119a
  - number: 3.119b.1
    text: |-
      De eigenwoningreserve kan naar de stand van het einde van een kalenderjaar, al dan niet op verzoek, door de
      inspecteur bij voor bezwaar vatbare beschikking worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119b
  - number: 3.119b.2
    text: |-
      Op gezamenlijk verzoek van de belastingplichtige en zijn gewezen partner kan de eigenwoningreserve aan elk
      van hen worden toegerekend naar de mate waarin zij feitelijk gerechtigd zijn tot het vervreemdingssaldo eigen
      woning. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking. Op het verzoek kan niet worden
      teruggekomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119b
  - number: 3.119b.3
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat de eigenwoningreserve te laag is vastgesteld, kan de
      inspecteur de beschikking herzien. Herziening vindt plaats bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119b
  - number: 3.119b.4
    text: |-
      Een feit dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, levert geen grond voor herziening
      op, tenzij de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119b
  - number: 3.119b.5
    text: |-
      [Artikel 16, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige
      toepassing op herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.119b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 3.120.1
    text: 'De aftrekbare kosten met betrekking tot een eigen woning zijn het gezamenlijke bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.1.a
    text: de renten van schulden, kosten van geldleningen daaronder begrepen, die behoren tot de eigenwoningschuld;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.1.b
    text: |-
      de periodieke betalingen op grond van de rechten van erfpacht, opstal en beklemming met betrekking tot de eigen
      woning.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.2
    text: |-
      De renten van schulden als bedoeld in het eerste lid, onderdeel a, worden gedurende ten hoogste 30 jaren in
      aanmerking genomen als aftrekbare kosten met betrekking tot een eigen woning. De duur van de termijn van 30 jaren
      vangt aan bij het begin van het eerste tijdvak waarop de renten van deze schulden, die als bestanddeel van het
      inkomen uit werk en woning in aftrek worden gebracht, betrekking hebben en eindigt op het tijdstip waarop de
      gehele schuld wordt afgelost. Indien andere schulden worden aangegaan als bedoeld in het eerste lid, onderdeel a,
      worden de renten slechts in aanmerking genomen voor zover de termijn van 30 jaren nog niet is verstreken tenzij
      het betreft:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.2.a
    text: |-
      schulden die worden aangegaan voor verbetering of onderhoud van de woning als bedoeld in
      [artikel 3.119a, derde lid][ref1], die behoren tot de eigenwoningschuld, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.120.2.b
    text: |-
      schulden die het totaal van de hoofdsommen van alle voorgaande schulden overtreffen, voor het gedeelte van de
      schulden dat het totaal van de hoofdsommen van alle voorgaande schulden overtreft. Voor de schulden, bedoeld in
      de onderdelen a en b, vangt een termijn van 30 jaren aan bij het begin van het eerste tijdvak waarop de renten van
      deze schulden, die als bestanddeel van het inkomen uit werk en woning in aftrek worden gebracht, betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.3
    text: |-
      Indien [artikel 3.111, tweede of derde lid][ref1], van toepassing is, kunnen de renten van schulden, bedoeld
      in het eerste lid, onderdeel a, als aftrekbare kosten met betrekking tot een eigen woning in aanmerking worden
      genomen, tenzij ter zake van die schuld of een gedeelte daarvan de termijn van 30 jaren reeds is verstreken. Voor
      het gedeelte van de schuld dat overeenstemt met het totaal van de schulden, die zijn aangegaan voor de verwerving
      van een eigen woning als bedoeld in [artikel 3.111, eerste lid][ref2], en waarvoor op grond van het tweede lid een
      termijn van 30 jaren in aanmerking wordt genomen, heeft in afwijking in zoverre van het tweede lid dat gedeelte
      geen invloed op de duur van de termijn van 30 jaren. Voor het gedeelte van de schuld dat het totaal van de schulden
      waarvoor op grond van het tweede lid een termijn van 30 jaren in aanmerking wordt genomen, overtreft, vangt een
      termijn van 30 jaren of het gedeelte van de termijn van 30 jaren dat nog resteert aan op het tijdstip waarop die
      woning wordt aangemerkt als een eigen woning op grond van [artikel 3.111][ref3], tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.120.4
    text: 'Tot de aftrekbare kosten van een eigen woning worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.4.a
    text: |-
      renten van schulden, kosten van geldlening daaronder begrepen, die zijn aangegaan ter betaling van de in het eerste
      lid, onderdeel a, bedoelde renten;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.4.b
    text: |-
      kosten voorzover in verband met de voldoening daarvan schulden ontstaan waarvan de verplichting tot betaling –
      anders dan voor het geval van overlijden of arbeidsongeschiktheid van de belastingplichtige – rechtens, al dan niet
      voorwaardelijk, of in feite, direct of indirect is beperkt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.4.c
    text: |-
      renten van schulden, kosten van geldlening daaronder begrepen, aangegaan ter verwerving van de eigen woning
      of een gedeelte daarvan, indien de eigen woning of een gedeelte daarvan direct of indirect is verkregen van
      de partner van de belastingplichtige of van degene met wie hij duurzaam een gezamenlijke huishouding voert,
      voorzover het totaal van de schulden die de belastingplichtige en zijn partner of degene met wie hij duurzaam een
      gezamenlijke huishouding voert zijn aangegaan ter verwerving van de woning, na deze verkrijging meer bedraagt dan
      vóór de vervreemding van de woning of een gedeelte daarvan door zijn partner of degene met wie hij duurzaam een
      gezamenlijke huishouding voert.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.5
    text: |-
      De in een kalenderjaar bij wijze van vooruitbetaling voldane renten van schulden, kosten van geldleningen daaronder
      begrepen, worden niet in aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.5.a
    text: |-
      indien zij betrekking hebben op tijdvakken die eindigen later dan zes maanden na afloop van het kalenderjaar
      waarin zij zijn voldaan doch slechts voorzover zij betrekking hebben op de periode die aanvangt na afloop van
      het kalenderjaar, waarbij die renten naar evenredigheid worden toegerekend aan kalendermaanden en gedeelten van
      kalendermaanden als kalendermaand worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.5.b
    text: |-
      voorzover zij betrekking hebben op tijdvakken of delen daarvan die vallen na het tijdstip waarop de binnenlandse
      belastingplicht anders dan door overlijden eindigt.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.6
    text: |-
      Vooruitbetaalde renten, kosten van geldleningen daaronder begrepen, die op grond van het vijfde lid, onderdeel
      a, niet in aanmerking zijn genomen, worden, behoudens indien de binnenlandse belastingplicht anders dan
      door overlijden is geëindigd, geacht in gelijke delen te zijn voldaan in elk van de op het in het vijfde lid
      bedoelde kalenderjaar volgende kalenderjaren waarop de renten, kosten van geldleningen daaronder begrepen,
      betrekking hebben; daarbij worden gedeelten van kalenderjaren als kalenderjaren aangemerkt. In het jaar waarin
      de belastingplichtige overlijdt, worden de renten, kosten van geldleningen daaronder begrepen, die nog buiten
      aanmerking zijn gebleven, geheel in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.7
    text: |-
      Afsluitprovisies die zijn voldaan ter zake van schulden die behoren tot de eigenwoningschuld worden niet gerekend
      tot de bij wijze van vooruitbetaling voldane renten, mits de woning in het kalenderjaar of in de daaropvolgende
      twee jaren de belastingplichtige als hoofdverblijf ter beschikking staat, een en ander voorzover zij niet meer
      belopen dan 1,5% van het bedrag van de aangegane schulden en tevens gezamenlijk een bedrag van € 3630 niet te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.8
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, worden renten van schulden die betrekking hebben op per 31
      december 1995 bestaande schulden, voorzover deze schulden per die datum verzekerd waren door een hypotheek op een
      eigen woning en zulks nog steeds zijn met betrekking tot dezelfde woning, aangemerkt als aftrekbare kosten die
      verband houden met de eigen woning waarop de hypotheek is gevestigd.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.9
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot een overeenkomst van geldlening tussen *partners* en met
      betrekking tot een overeenkomst van geldlening tussen de belastingplichtige en degene met wie hij duurzaam een
      gezamenlijke huishouding voert.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
  - number: 3.120.10
    text: |-
      [Artikel 3.16, tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.120
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.121'
    text: |-
      De aftrekbare kosten met betrekking tot een woning die voor twee of meer belastingplichtigen die geen *partner* van
      elkaar zijn samen een *eigen woning* is, worden voor elk van hen bepaald door de schulden die zij zijn aangegaan
      ter verwerving van de woning en door de periodieke betalingen voorzover die op hen drukken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.121
  - number: 3.122.1
    text: |-
      De schulden, bedoeld in [artikel 3.120, eerste lid, onderdeel a][ref1], worden slechts in aanmerking genomen tot
      ten hoogste het bedrag dat is aangewend voor de verwerving van de*eigen woning* verminderd met het gedeelte van het
      bedrag van de uitkeringen uit kapitaalverzekeringen eigen woning ter zake waarvan de daarin begrepen rente eerder
      op grond van [artikel 3.118][ref2] niet als voordeel uit kapitaalverzekering eigen woning is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.122.2
    text: |-
      Indien de belastingplichtige een eigen woning verwerft en ter zake van een kapitaalverzekering eigen woning in een
      van de drie daaraan voorafgaande jaren [artikel 3.118][ref1] toepassing heeft gevonden en deze verzekering bij de
      verwerving een kapitaalverzekering eigen woning wordt, wordt vanaf dat tijdstip voor de toepassing van het eerste
      lid [artikel 3.118][ref2] geacht geen toepassing te hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.122.3
    text: |-
      Indien bij een belastingplichtige op grond van [artikel 3.116, vierde lid][ref1], een uitkering uit een
      kapitaalverzekering eigen woning in aanmerking is genomen, en zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.122.3.a
    text: |-
      zich niet een omstandigheid voordoet waardoor de woning ophoudt een eigen woning te zijn in de zin van
      [artikel 3.111][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.122.3.b
    text: |-
      de belastingplichtige terzake van die kapitaalverzekering eigen woning niet een voordeel geniet als bedoeld in
      [artikel 3.116, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.122.3.c
    text: |-
      ter zake van die kapitaalverzekering eigen woning zich niet een omstandigheid voordoet als bedoeld in
      [artikel 3.116, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.122
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: '3.123'
    text: |-
      In deze afdeling en de daarop berustende bepalingen worden kosten voor verbetering of onderhoud van de woning in
      aanmerking genomen voorzover de verbetering en het onderhoud met schriftelijke bescheiden zijn te staven.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.123
  - number: 3.123a.1
    text: |-
      Indien de voordelen uit eigen woning, bedoeld in [artikel 3.112][ref1], meer bedragen dan de op deze voordelen
      drukkende aftrekbare kosten, komt de belastingplichtige in aanmerking voor de aftrek wegens geen of geringe
      eigenwoningschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.123a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.123a.2
    text: |-
      De aftrek wegens geen of geringe eigenwoningschuld is gelijk aan de voordelen uit eigen woning, bedoeld in
      [artikel 3.112][ref1], verminderd met de op deze voordelen drukkende aftrekbare kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.123a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.6'
  - number: 3.123a.3
    text: |-
      Indien de belastingplichtige een partner heeft, worden voor de toepassing van dit artikel de voordelen van de
      belastingplichtige en zijn partner en de op deze voordelen drukkende aftrekbare kosten samengevoegd. De aftrek
      wegens geen of geringe eigenwoningschuld wordt in dat geval gesteld op een evenredig gedeelte van de in het tweede
      lid berekende aftrek, bepaald naar de verhouding waarin de belastbare inkomsten uit eigen woning die worden geacht
      bij de belastingplichtige op te komen, staan tot de gezamenlijke belastbare inkomsten uit eigen woning van hem en
      zijn partner.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.123a
  - number: '3.124'
    text: 'Uitgaven voor inkomensvoorzieningen zijn de op de belastingplichtige drukkende:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.124
  - number: 3.124.a
    text: |-
      premies voor *lijfrenten* die dienen ter compensatie van een pensioentekort tot de in de [artikelen 3.127][ref1],
      [3.128][ref2] en [3.129][ref3] genoemde bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.124.b
    text: |-
      premies voor lijfrenten waarvan de termijnen toekomen aan een meerderjarig invalide kind of kleinkind en
      uitsluitend eindigen bij het overlijden van de gerechtigde;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.124
  - number: 3.124.c
    text: |-
      premies voor aanspraken op periodieke uitkeringen en verstrekkingen ter zake van invaliditeit, ziekte of ongeval,
      waarvan de uitkeringen toekomen aan de belastingplichtige en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.124
  - number: 3.124.d
    text: |-
      bijdragen ingevolge [artikel 66a, derde lid, Algemene nabestaandenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel66a
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.124
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 66a
  - number: 3.125.1
    text: 'Als *lijfrenten* die dienen ter compensatie van een pensioentekort worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
  - number: 3.125.1.a
    text: |-
      lijfrenten waarvan de termijnen toekomen aan de belastingplichtige, ingaan uiterlijk in het jaar waarin hij de
      leeftijd van 70 jaar bereikt en uitsluitend eindigen bij zijn overlijden;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
  - number: 3.125.1.b
    text: |-
      lijfrenten waarvan de termijnen toekomen aan een natuurlijk persoon en ingaan bij het overlijden van de
      belastingplichtige, van zijn *partner* of zijn gewezen partner, waarbij indien de termijnen toekomen aan een van
      hun bloed- of aanverwanten, niet zijnde de partner of gewezen partner, in de rechte lijn of in de tweede of derde
      graad van de zijlijn, deze uitsluitend eindigen hetzij bij het overlijden van de gerechtigde hetzij uiterlijk op
      het tijdstip waarop deze de leeftijd van 30 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
  - number: 3.125.1.c
    text: |-
      lijfrenten waarvan de termijnen toekomen aan de belastingplichtige, een looptijd hebben van ten minste vijf jaar,
      niet eerder ingaan dan in het jaar waarin hij de leeftijd van 65 jaar bereikt en uiterlijk ingaan in het jaar
      waarin hij de leeftijd van 70 jaar bereikt, voorzover het gezamenlijke bedrag aan termijnen van die lijfrenten –
      beoordeeld naar het tijdstip van premiebetaling – niet meer beloopt dan € 19 161 per jaar.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
  - number: 3.125.2
    text: |-
      In afwijking van [artikel 1.7, eerste lid][ref1], kan voor rechten als bedoeld in het eerste lid, onderdelen a en
      c zijn overeengekomen dat het bedrag van de uitkeringen als gevolg van het overlijden van de partner of gewezen
      partner afneemt tot ten hoogste 70% van het bedrag dat gold vóór het overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.125.3
    text: |-
      In afwijking van [artikel 1.7, eerste lid][ref1], is voor rechten als bedoeld in het eerste lid, onderdeel b,
      waarvan de termijnen eindigen uiterlijk op het tijdstip waarop de gerechtigde de leeftijd van 30 jaar bereikt de
      grootte van de kans op overlijden van de gerechtigde niet van belang.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.125
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.126.1
    text: 'Premies voor *lijfrenten* worden alleen in aanmerking genomen indien zij zijn verschuldigd aan:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.1.a
    text: 'een van de volgende verzekeraars die de lijfrenteverplichting rekent tot het binnenlandse ondernemingsvermogen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.1.a.1°
    text: |-
      een verzekeraar die bevoegd is het directe verzekeringsbedrijf, bedoeld in de
      [Wet toezicht verzekeringsbedrijf 1993][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 3.126.1.a.2°
    text: |-
      een in Nederland wonend natuurlijk persoon die niet is de echtgenoot, of een in Nederland gevestigd lichaam,
      mits de lijfrenten zijn bedongen als tegenprestatie voor de overdracht van een onderneming of een gedeelte van
      een onderneming aan die persoon of dat lichaam, maar tot ten hoogste het bedrag van de met of bij die overdracht
      behaalde winst en het bedrag van de afnemingen van de oudedagsreserve volgens [artikel 3.70][ref1] in het jaar van
      de overdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.126.1.b
    text: |-
      een lichaam dat volgens [artikel 5, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref1] is vrijgesteld
      van die belasting;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: 3.126.1.c
    text: |-
      een niet in Nederland gevestigd pensioenfonds of lichaam dat het levensverzekeringsbedrijf uitoefent, mits de
      premies worden voldaan ter vrijwillige voortzetting van een *pensioenregeling* of terzake van een lijfrente die
      gedurende ten minste drie jaar voor het ontstaan van de binnenlandse belastingplicht is verzekerd bij dat fonds of
      dat lichaam;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.1.d
    text: |-
      een pensioenfonds of lichaam dat bevoegd het verzekeringsbedrijf uitoefent, anders dan bedoeld in de onderdelen
      a, b en c, dat door Onze Minister, onder door hem te stellen voorwaarden, is aangewezen en dat zich tegenover Onze
      Minister heeft verplicht:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.1.d.1°
    text: |-
      te voldoen aan voorwaarden met betrekking tot het verschaffen van inlichtingen over de uitvoering van de regeling,
      en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.1.d.2°
    text: |-
      zekerheid te stellen voor de invordering van de belasting die is verschuldigd door toepassing van de
      [artikelen 3.133][ref1], [3.135][ref2] en [3.136][ref3], dan wel de belastingplichtige zich heeft verplicht deze
      zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.8'
  - number: 3.126.2
    text: |-
      Voor premies voor aanspraken op periodieke uitkeringen en verstrekkingen ter zake van invaliditeit, ziekte of
      ongeval is het eerste lid, onderdelen a, onder 1°, b, c, en d van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.126.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid, onderdeel d,
      bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.126
  - number: 3.127.1
    text: |-
      Indien de belastingplichtige bij de aanvang van het kalenderjaar nog niet de leeftijd van 65 jaar heeft bereikt
      kan hij, vanwege een pensioentekort in het voorafgaande kalenderjaar, premies voor lijfrenten als bedoeld in
      [artikel 3.124, onderdeel a][ref1], in aanmerking nemen tot een gezamenlijk bedrag van ten hoogste 17% van de
      premiegrondslag, waarbij op de uitkomst van deze berekening nog in aftrek komt de volgens het vierde lid bepaalde
      verminderingen in verband met de opbouw van pensioenaanspraken en dotaties aan de oudedagsreserve. Het volgens de
      eerste volzin in aanmerking te nemen bedrag wordt verminderd met hetgeen de belastingplichtige in het voorafgaande
      kalenderjaar aan spaarloon als bedoeld in [artikel 32 van de Wet op de loonbelasting 1964][ref2] heeft opgenomen
      voor de voldoening van vrijwillig te betalen premies ingevolge een pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '32'
  - number: 3.127.2
    text: |-
      Indien de belastingplichtige in de aan het kalenderjaar voorafgaande periode van zeven jaar minder premies
      voor lijfrenten in aanmerking heeft genomen dan mogelijk was op grond van het eerste lid kan hij, op bij zijn
      aangifte gedaan verzoek, het niet aangewende bedrag, voorzover dit niet in een eerder jaar op grond van dit lid in
      aanmerking is genomen, te beginnen met het in het oudste jaar niet aangewende bedrag, in het kalenderjaar alsnog in
      aanmerking nemen. Het alsnog in aanmerking te nemen bedrag bedraagt ten hoogste 17% van de premiegrondslag, met een
      maximum van € 6389. Voor de belastingplichtige die bij het begin van het kalenderjaar de leeftijd van 55 jaar heeft
      bereikt, wordt het in de vorige volzin genoemde bedrag van € 6389 verhoogd tot € 12 621.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
  - number: 3.127.3
    text: |-
      De premiegrondslag bestaat uit het gezamenlijke bedrag in het voorafgaande kalenderjaar van de winst uit
      onderneming vóór toevoeging aan en afneming van de oudedagsreserve en vóór de ondernemersaftrek, het belastbare
      loon, het belastbare resultaat uit overige werkzaamheden en de belastbare periodieke uitkeringen en verstrekkingen
      van de belastingplichtige, verminderd met een bedrag van € 10 816. Als premiegrondslag wordt ten hoogste een
      bedrag van € 148 579 in aanmerking genomen. Bij algemene maatregel van bestuur kan worden bepaald dat uitkeringen
      volgens een pensioenregeling, termijnen van een lijfrente, of vergelijkbare inkomensbestanddelen niet behoren tot
      de premiegrondslag.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
  - number: 3.127.4
    text: 'Voor de toepassing van het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
  - number: 3.127.4.a
    text: |-
      de vermindering in verband met de opbouw van pensioenaanspraken gesteld op: 7,5 keer de aan het voorafgaande
      kalenderjaar toe te rekenen aangroei van het bedrag van de jaarlijkse uitkeringen van de aan de belastingplichtige
      toekomende aanspraken volgens een pensioenregeling voorzover deze aangroei het gevolg is van de toeneming van
      de diensttijd in dat kalenderjaar, met dien verstande dat de aangroei die het gevolg is van de aanwending van
      spaarloon als bedoeld in [artikel 32 van de Wet op de loonbelasting 1964][ref1] in dat kalenderjaar ter voldoening
      van vrijwillig te betalen premies ingevolge een pensioenregeling, buiten aanmerking blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
  - number: 3.127.4.b
    text: |-
      de vermindering in verband met dotaties aan de oudedagsreserve gesteld op het bedrag waarmee de toevoeging aan
      de oudedagsreserve in het voorafgaande kalenderjaar overtreft de afneming van die reserve bij het einde van dat
      kalenderjaar volgens [artikel 3.70, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.127.5
    text: |-
      Indien de belastingplichtige in het kalenderjaar een onderneming – of een gedeelte daarvan – waaruit hij als
      ondernemer winst geniet staakt, wordt op zijn verzoek in afwijking van de voorgaande leden voor de berekening van
      hetgeen in het kalenderjaar aan lijfrentepremies in aanmerking kan worden genomen, niet uitgegaan van de voor die
      berekening relevante gegevens van het voorafgaande kalenderjaar, maar van die van het kalenderjaar zelf. Alsdan
      wordt voor de toepassing van het eerste en tweede lid in het volgende kalenderjaar de premiegrondslag verminderd
      met de daarin begrepen stakingswinst.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
  - number: 3.127.6
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bepaling van de in het vierde lid,
      onderdeel a, bedoelde waardeaangroei van pensioenaanspraken en de verstrekking van informatie daaromtrent.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.127
  - number: '3.128'
    text: |-
      Een belastingplichtige met een oudedagsreserve kan, vanwege de omzetting van die oudedagsreserve in een
      *lijfrente*, premies voor lijfrenten als bedoeld in [artikel 3.124, onderdeel a][ref1], in aanmerking nemen tot
      een gezamenlijk bedrag van ten hoogste het bedrag van de afneming in het kalenderjaar van die reserve volgens
      [artikel 3.70, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.128
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 3.129.1
    text: |-
      Een *ondernemer* die in het kalenderjaar een onderneming – of een gedeelte daarvan – waaruit hij als ondernemer
      winst geniet staakt kan, vanwege de omzetting van de stakingswinst in een *lijfrente*, premies voor lijfrenten als
      bedoeld in [artikel 3.124, onderdeel a][ref1], in aanmerking nemen tot een gezamenlijk bedrag van ten hoogste het
      bedrag van de winst behaald met of bij die staking, maar tot niet meer dan het in het tweede lid aangegeven maximum
      verminderd met het in het derde lid bedoelde bedrag aan reeds opgebouwde voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.7'
  - number: 3.129.2
    text: 'Het maximum bedraagt:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.a
    text: '€ 405 214 in de gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.a.1°
    text: de ondernemer ten tijde van het staken de leeftijd van 60 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
  - number: 3.129.2.a.2°
    text: |-
      de ondernemer ten tijde van het staken voor 45% of meer arbeidsongeschikt is in de zin van
      [artikel 6.20, eerste lid, onderdeel a][ref1], en de hem toekomende termijnen van lijfrenten ingaan binnen zes
      maanden na het staken of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.129
    references:
      - id: ref1
