  - number: 2.8.3
    text: |-
      Op een bij de aangifte gedaan verzoek wordt het positieve inkomensbestanddeel dat in aanmerking is genomen op grond
      van [artikel 3.58, eerste lid][ref1], geheel of gedeeltelijk niet als te conserveren inkomen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 2.9.1
    text: |-
      De over te conserveren inkomen verschuldigde belasting is het volgens [artikel 2.7][ref1] bepaalde bedrag aan
      belasting verminderd met het volgens [artikel 2.8][ref2] bepaalde bedrag aan belasting, met dien verstande dat de
      belasting ten minste wordt gesteld op het bedrag aan belasting dat verschuldigd zou zijn indien het te conserveren
      inkomen het enige inkomen zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 2.9.2
    text: |-
      Indien een met toepassing van [artikel 2.8][ref1] vastgestelde belastingaanslag wordt verminderd, anders dan
      ingevolge verliesverrekening, en deze vermindering gevolgen heeft voor de over te conserveren inkomen verschuldigde
      belasting, brengt de inspecteur de desbetreffende belastingaanslag daarmee in overeenstemming bij voor bezwaar
      vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '2.10'
    text: |-
