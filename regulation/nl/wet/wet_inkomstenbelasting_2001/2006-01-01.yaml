  - number: 10.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden administratieplichtigen aangewezen die gehouden zijn aan
      de verplichtingen ingevolge [artikel 53, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      te voldoen met betrekking tot het verstrekken van bij of krachtens algemene maatregel van bestuur aan te wijzen
      gegevens en inlichtingen waarvan de kennisneming van belang kan zijn voor de belastingheffing over inkomen uit
      werk en woning, het voordeel uit sparen en beleggen en voor de bepaling van de hoogte van de persoonsgebonden
      aftrekposten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
  - number: 10.8.2
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt ten minste vier weken
      voordat de regeling wordt vastgesteld, toegezonden aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.8
  - number: 10.9.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld volgens welke voor de heffing van de
      inkomstenbelasting de werkzaamheden, rechten en verplichtingen van een rechtspersoon als bedoeld in het tweede lid,
      worden beschouwd als werkzaamheden, rechten en verplichtingen van haar gezamenlijke aandeelhouders.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.9
  - number: 10.9.2
    text: |-
      Een rechtspersoon als bedoeld in het eerste lid, is een naamloze vennootschap of besloten vennootschap met
      beperkte aansprakelijkheid waarvan de bezittingen uitsluitend of hoofdzakelijk bestaan uit ingevolge de
      [Natuurschoonwet 1928][ref1] aangewezen landgoederen en waarvan de werkzaamheden uitsluitend of hoofdzakelijk
      bestaan uit de instandhouding van die landgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: 10.10.1
    text: |-
      De [artikelen 3.40 tot en met 3.42a][ref1], de [artikelen 3.43 tot en met 3.47][ref2],
      [artikel 3.51, eerste lid][ref3], en [artikel 3.52, eerste lid, onderdelen b en c][ref4], zijn in afwijking
      van [artikel 3.45, eerste lid, onderdeel b, onder 2°, en derde lid, onderdeel b][ref5], van overeenkomstige
      toepassing op investeringen in bedrijfsmiddelen die worden toegerekend aan het vermogen van een vaste inrichting
      die gelegen is in de Nederlandse Antillen of Aruba, met dien verstande dat de tabel die is opgenomen in
      [artikel 3.41, tweede lid][ref6], afzonderlijk wordt toegepast op deze investeringen.


