    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.19
  - number: 6.19.2
    text: Uitgaven wegens overlijden worden in aanmerking genomen voorzover zij niet overtreffen wat gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Uitgaven wegens arbeidsongeschiktheid worden in aanmerking genomen indien de belastingplichtige bij het begin van
      het kalenderjaar jonger is dan 65 jaar en aannemelijk maakt dat hij door ziekte of gebreken niet in staat is om
      ten minste 55% te verdienen van wat lichamelijk en geestelijk gezonde belastingplichtigen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen, en daartoe ook hetzij in het afgelopen jaar niet in staat is geweest
      hetzij vermoedelijk in het eerstkomende jaar niet in staat zal zijn.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.20
  - number: 6.20.2
    text: Het in aanmerking te nemen bedrag wordt gesteld op € 795.
