        artikel: '25'
  - number: 1.7.2
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder *pensioenregeling*:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
  - number: 1.7.2.a
    text: een pensioenregeling overeenkomstig de wettelijke bepalingen van de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
  - number: 1.7.2.b
    text: |-
      een pensioenregeling waaraan deelneming verplicht is op grond van de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref1], de Wet op het notarisambt of de
      [Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012092
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0012092
      - id: ref2
        bwb_id: BWBR0018831
  - number: 1.7.2.c
    text: |-
      een regeling van een andere mogendheid, die volgens de belastingwetten van dat land, welke naar aard en strekking
      overeenkomen met de Nederlandse loonbelasting of de inkomstenbelasting, als een pensioenregeling wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
  - number: 1.7.2.d
    text: een pensioenregeling van een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
  - number: 1.7.3
    text: |-
      Aanspraken op periodieke uitkeringen waarvan de uitkeringen zijn ingegaan en waarvan de hoogte van de uitkeringen
      niet voor de gehele uitkeringsperiode in geldeenheden is vastgesteld, worden gelijkgesteld met aanspraken op vaste
      en gelijkmatige periodieke uitkeringen indien de aanspraken en uitkeringen voldoen aan bij ministeriële regeling te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7
  - number: 1.7a.1
    text: |-
      Voor de toepassing van de [artikelen 8.11][ref1], [8.14][ref2], [8.14a][ref3] en [8.16][ref4] en de daarop
      berustende bepalingen wordt met loon uit tegenwoordige arbeid gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
      - id: ref3
