      zonodig naar boven af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.22
  - number: 6.23.1
    text: |-
      Als uitgaven wegens adoptie worden aangemerkt de uitgaven voor de indiening en de behandeling van een verzoek tot
      het uitspreken van adoptie door de rechter.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.23
  - number: 6.23.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot in aanmerking te nemen uitgaven wegens adoptie
      van een *kind* dat in een ander land woonde dan de adoptanten voordat het kind door de adoptanten feitelijk werd
      verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel6.23
