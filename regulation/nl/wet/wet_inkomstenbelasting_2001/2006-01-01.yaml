  - number: 11.1.1
    text: De Wet op de inkomstenbelasting 1964 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel11.1
  - number: 11.1.2
    text: De Wet op de vermogensbelasting 1964 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel11.1
  - number: '11.2'
    text: |-
      De tekst van deze wet zoals die luidt bij de inwerkingtreding van deze wet en bij de inwerkingtreding van overige
      wetten die op hetzelfde tijdstip in werking treden en waarin deze wet wordt gewijzigd, wordt in het Staatsblad
      geplaatst. Voor de plaatsing in het Staatsblad stelt Onze Minister de nummering van de artikelen, paragrafen,
      afdelingen en hoofdstukken van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van de
      artikelen, paragrafen, afdelingen en hoofdstukken met de nieuwe nummering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel11.2
  - number: '11.3'
    text: Deze wet treedt in werking op een bij wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel11.3
  - number: 11.4.1
    text: 'Deze wet wordt aangehaald als: Wet inkomstenbelasting 2001.'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel11.4
  - number: 11.4.2
    text: 'De citeertitel kan worden afgekort tot: Wet IB 2001.'
