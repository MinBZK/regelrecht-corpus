                    –


                    0
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.41
  - number: 3.41.3
    text: |-
      Indien de onderneming van de belastingplichtige deel uitmaakt van een samenwerkingsverband met een of
      meer andere belastingplichtigen die daarbij winst uit onderneming genieten of belastingplichtigen voor
      de vennootschapsbelasting, worden voor de toepassing van het tweede lid hun investeringen voor het
      samenwerkingsverband samengeteld.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.41
  - number: 3.42.1
    text: |-
      Indien in een kalenderjaar in een onderneming die de *ondernemer* voor eigen rekening drijft, wordt geïnvesteerd in
      niet eerder gebruikte bedrijfsmiddelen met betrekking waartoe op een door de *ondernemer*gedaan verzoek door Onze
      Minister van Economische Zaken is verklaard dat sprake is van energie-investeringen, en de *ondernemer*daarvoor bij
      de aangifte kiest, wordt een in het derde lid aangewezen percentage van het bedrag aan energie-investeringen ten
      laste gebracht van de winst over dat jaar (energie-investeringsaftrek).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Energie-investeringen zijn investeringen die door Onze Minister in overeenstemming met Onze Minister van
      Economische Zaken en na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      bij ministeriële regeling zijn aangewezen als investeringen die in het belang zijn van een doelmatig gebruik van
      energie.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.3
    text: |-
      Bij een bedrag aan energie-investeringen in een kalenderjaar van meer dan € 2100 bedraagt de energie-
      investeringsaftrek 44 percent.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.4
    text: 'Als bedrag aan energie-investeringen wordt ten hoogste in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.4.a
    text: |-
      indien de onderneming die de ondernemer voor eigen rekening drijft geen deel uitmaakt van een samenwerkingsverband
      met een of meer andere ondernemers die daarbij voor eigen rekening een onderneming drijven of belastingplichtigen
      voor de vennootschapsbelasting: € 108 000 000;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.4.b
    text: |-
      indien de onderneming die de ondernemer voor eigen rekening drijft wel deel uitmaakt van een zodanig
      samenwerkingsverband: € 108 000 000 vermenigvuldigd met het bedrag aan energie-investeringen van de ondernemer en
      gedeeld door het gezamenlijke bedrag aan energie-investeringen van de ondernemer en de bedoelde andere deelnemers
      aan het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.5
    text: |-
      Onder de aanschaffings- of voortbrengingskosten ter zake van een energie-investering als bedoeld in het eerste
      lid, worden, indien de ondernemer daarvoor bij de aangifte kiest, tevens begrepen de kosten van een advies ter zake
      van energiebesparende maatregelen in gebouwen of bij processen dat op die investering of mede op die investering
      betrekking heeft en voldoet aan bij ministeriële regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.6
    text: De energie-investeringsaftrek is van toepassing indien de energie-investering is aangemeld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.7
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.7.a
    text: |-
      in overeenstemming met Onze Minister van Economische Zaken regels worden gesteld met betrekking tot de in het
      eerste lid bedoelde verklaring en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.7.b
    text: regels worden gesteld met betrekking tot het zesde lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42.8
    text: |-
      Tegen de in het eerste lid bedoelde verklaring staat beroep open bij het College van Beroep voor het bedrijfsleven.
      Tegen een uitspraak van het College van Beroep voor het bedrijfsleven kunnen de belanghebbende en Onze Minister
      van Economische Zaken beroep in cassatie instellen ter zake van schending of verkeerde toepassing van de begrippen
      investeren en bedrijfsmiddelen. Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen
      uitspraken van de gerechtshoven inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij het
      College van Beroep voor het bedrijfsleven de plaats inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42
  - number: 3.42a.1
    text: |-
      Indien in een kalenderjaar in een onderneming die de ondernemer voor eigen rekening drijft, wordt geïnvesteerd in
      niet eerder gebruikte bedrijfsmiddelen die zijn aangewezen als milieu-investeringen, en de ondernemer daarvoor bij
      de aangifte kiest, wordt een in het derde lid aangewezen percentage van het bedrag aan milieu-investeringen in de
      onderscheiden categorieën ten laste gebracht van de winst over dat jaar (milieu-investeringsaftrek).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.2
    text: |-
      Milieu-investeringen zijn investeringen, behorend tot categorie I, II respectievelijk III, die door Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met Onze Minister en na overleg
      met Onze Minister van Economische Zaken en Onze Minister van Landbouw, Natuurbeheer en Visserij bij ministeriële
      regeling zijn aangewezen in het belang van de bescherming van het Nederlandse milieu.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.3
    text: |-
      Bij een bedrag aan milieu-investeringen in een kalenderjaar van meer dan € 2100 bedraagt de milieu-
      investeringsaftrek voor milieu-investeringen die behoren tot categorie I 40 percent , voor milieu-investeringen die
      behoren tot categorie II 30 percent en voor milieu-investeringen die behoren tot categorie III 15 percent .
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.4
    text: |-
      Onder de aanschaffings- of voortbrengingskosten ter zake van een milieu-investering als bedoeld in het eerste lid,
      worden, indien de ondernemer daarvoor bij de aangifte kiest, tevens begrepen de kosten van een advies ter zake van:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.4.a
    text: |-
      vermindering van emissies, veroorzaakt door bestaande en toekomstige activiteiten in een door de onderneming
      beheerd, bestaand object;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.4.b
    text: |-
      het ontwikkelen en aanpassen van processen en producten die leiden tot een vermindering van de belasting van het
      milieu;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.5
    text: |-
      Het vierde lid is slechts van toepassing indien het advies betrekking heeft op een kleine of middelgrote
      onderneming als bedoeld in bijlage I van Verordening EG nr. 70/2001.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.6
    text: |-
      Voorzover met betrekking tot een investering bij de aangifte wordt gekozen voor energie-investeringsaftrek, blijft
      toepassing van de milieu-investeringsaftrek achterwege.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.7
    text: |-
      De milieu-investeringsaftrek is slechts van toepassing indien de aangegane verplichtingen of de in het jaar
      gemaakte voortbrengingskosten zijn aangemeld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.42a.8
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer nadere regels worden gesteld met betrekking tot het zevende lid.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.42a
  - number: 3.43.1
    text: |-
      Onder investeren wordt verstaan het aangaan van verplichtingen ter zake van de aanschaffing of de verbetering
      van een bedrijfsmiddel, alsmede het maken van voortbrengingskosten ter zake van een bedrijfsmiddel, voorzover die
      verplichtingen en kosten op de belastingplichtige drukken.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.43
  - number: 3.43.2
    text: |-
      Onze Minister kan bepalen dat met investeren tot door hem vast te stellen bedragen wordt gelijkgesteld het wijzigen
      van de bestemming van een bedrijfsmiddel als bedoeld in [artikel 3.45, eerste lid, onderdeel b, onder 2°][ref1],
      zodanig dat het bedrijfsmiddel voortaan hoofdzakelijk wordt gebruikt voor het in Nederland drijven van een
      onderneming of gedeelte van een onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 3.44.1
    text: |-
      Indien bij het einde van het kalenderjaar het bedrijfsmiddel nog niet in gebruik is genomen en de
      investeringsaftrek zou uitgaan boven wat bij het einde van dat kalenderjaar ter zake van de investering is betaald,
      wordt in afwijking in zoverre van de artikelen [3.41][ref1], [3.42][ref2] en [3.42a][ref3] een bedrag gelijk aan
      de betaling in aanmerking genomen en wordt het meerdere in aanmerking genomen in de volgende kalenderjaren en wel
      voorzover betalingen plaatsvinden, maar niet later dan in het kalenderjaar waarin het bedrijfsmiddel in gebruik
      wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
