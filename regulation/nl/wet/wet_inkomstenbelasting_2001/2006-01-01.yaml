        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.2'
  - number: 1.7a.1.a
    text: inkomsten genoten wegens tijdelijke arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
  - number: 1.7a.1.b
    text: |-
      uitkeringen op grond van de [Wet arbeid en zorg][ref1] en aanvullingen daarop door degene tot wie de
      belastingplichtige in dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 1.7a.2
    text: 'Inkomsten wegens tijdelijke arbeidsongeschiktheid zijn niet uitkeringen op grond van:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
  - number: 1.7a.2.a
    text: |-
      de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 1.7a.2.b
    text: |-
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.7a.2.c
    text: |-
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 1.7a.2.d
    text: |-
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 1.7a.2.e
    text: |-
      buitenlandse arbeidsongeschiktheidsverzekeringen die naar aard en strekking overeenkomen met de regelingen die zijn
      vermeld in de onderdelen a, b, c en d.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7a
  - number: 1.7b
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met de premie voor een verzekering
      gelijkgesteld de op de verzekeringnemer drukkende uitgaven ter beloning van de assurantietussenpersoon ter zake van
      het afsluiten dan wel het verlengen van de desbetreffende verzekering of het incasseren van premies.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.7b
  - number: '1.8'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt verwezen naar Nederlandse voorschriften of verklaringen
      van Nederlandse instellingen, worden voorschriften van of verklaringen van instellingen in een van de lidstaten
      van de Europese Unie die naar aard en strekking overeenkomen met eerstbedoelde Nederlandse voorschriften of
      verklaringen van Nederlandse instellingen daarmee gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.8
  - number: 1.8.a
    text: |-
      indien ter zake regelgeving in het kader van het Verdrag betreffende de Europese Unie (Trb. 1992, 74) is
      vastgesteld waaruit de overeenkomst naar aard en strekking blijkt;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.8
  - number: 1.8.b
    text: 'in overige gevallen: voorzover dat bij ministeriële regeling is bepaald.'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met de basisadministratie persoonsgegevens
      gelijkgesteld een daarmee naar aard en strekking overeenkomende administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de situatie dat een persoon niet in
      Nederland woont en niet is ingeschreven in een naar aard en strekking met de basisadministratie persoonsgegevens
      overeenkomende administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel1.9
  - number: 2.1.1
    text: 'Belastingplichtigen voor de inkomstenbelasting zijn de natuurlijke personen die:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.1
  - number: 2.1.1.a
    text: in Nederland wonen (binnenlandse belastingplichtigen) of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.1
  - number: 2.1.1.b
    text: niet in Nederland wonen maar wel Nederlands inkomen genieten (buitenlandse belastingplichtigen).
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Nederlands inkomen is inkomen bedoeld in [hoofdstuk 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: 2.2.1
    text: |-
      Een persoon die ophoudt in Nederland te wonen en binnen een jaar daarna weer in Nederland gaat wonen zonder
      intussen in een andere mogendheid te hebben gewoond, wordt ook tijdens zijn afwezigheid geacht in Nederland te
      hebben gewoond. De vorige volzin is niet van toepassing indien de bedoelde persoon aannemelijk maakt dat hij in
      een lidstaat van de Europese Unie of een bij ministeriële regeling aangewezen mogendheid waarmee Nederland een
      regeling ter voorkoming van dubbele belasting is overeengekomen die voorziet in de uitwisseling van inlichtingen,
      als inwoner aan de belastingheffing is onderworpen en de heffingsgrondslagen in die lidstaat of andere mogendheid
      hoofdzakelijk gelijk zijn aan de in [artikel 2.3][ref1] genoemde heffingsgrondslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.2'
  - number: 2.2.2
    text: |-
      Een Nederlander die in dienstbetrekking staat tot de Staat der Nederlanden, wordt steeds geacht in Nederland te
      wonen indien hij is uitgezonden:
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      als lid van een diplomatieke, permanente of consulaire vertegenwoordiging van het Koninkrijk der Nederlanden in het
      buitenland; of
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      om in het kader van een verdrag waarbij de Staat der Nederlanden partij is, in een andere mogendheid werkzaamheden
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Indien een Nederlander op grond van het tweede lid geacht wordt in Nederland te wonen, worden de *partner* en de
      *kinderen* die jonger zijn dan 27 jaar en die in belangrijke mate door hem worden onderhouden, tevens geacht in
      Nederland te wonen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.2
  - number: '2.3'
    text: 'De inkomstenbelasting wordt geheven over het door de belastingplichtige in het kalenderjaar genoten:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.3
  - number: 2.3.a
    text: belastbare inkomen uit werk en woning;
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.3
  - number: 2.3.b
    text: belastbare inkomen uit aanmerkelijk belang en
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.3
  - number: 2.3.c
    text: belastbare inkomen uit sparen en beleggen.
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.3
  - number: 2.4.1
    text: 'Het belastbare inkomen uit werk en woning wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
  - number: 2.4.1.a
    text: |-
      voor binnenlandse belastingplichtigen: volgens de regels van [hoofdstuk 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '3'
  - number: 2.4.1.b
    text: |-
      voor buitenlandse belastingplichtigen: volgens de regels van [afdeling 7.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.2'
  - number: 2.4.2
    text: 'Het belastbare inkomen uit aanmerkelijk belang wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
  - number: 2.4.2.a
    text: |-
      voor binnenlandse belastingplichtigen: volgens de regels van[ hoofdstuk 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '4'
  - number: 2.4.2.b
    text: |-
      voor buitenlandse belastingplichtigen: volgens de regels van [afdeling 7.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: 2.4.3
    text: 'Het belastbare inkomen uit sparen en beleggen wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
  - number: 2.4.3.a
    text: |-
      voor binnenlandse belastingplichtigen: volgens de regels van [hoofdstuk 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '5'
  - number: 2.4.3.b
    text: |-
      voor buitenlandse belastingplichtigen: volgens de regels van [afdeling 7.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
        afdeling: '7.4'
  - number: 2.5.1
    text: |-
      De binnenlandse belastingplichtige die niet gedurende het gehele kalenderjaar in Nederland woont, en de
      buitenlandse belastingplichtige die als inwoner van een andere lidstaat van de Europese Unie of van een bij
      ministeriële regeling aangewezen andere mogendheid waarmee Nederland een regeling ter voorkoming van dubbele
      belasting is overeengekomen die voorziet in de uitwisseling van inlichtingen, in de belastingheffing van
      die lidstaat of mogendheid wordt betrokken, kunnen kiezen voor toepassing van de regels van deze wet voor
      binnenlandse belastingplichtigen. Voor de toepassing van deze bepaling kunnen bij ministeriële regeling
      bewijsmiddelen worden voorgeschreven. Een persoon die niet belastingplichtig is kan kiezen voor toepassing van
      de regels van deze wet voor binnenlandse belastingplichtigen indien hij daardoor wordt aangemerkt als *partner*
      van een belastingplichtige. De persoonsgebonden aftrek ([hoofdstuk 6][ref1]) en de negatieve inkomsten uit
      gemeenschappelijke inkomensbestanddelen als bedoeld in [artikel 2.17][ref2] blijven buiten aanmerking voorzover
      deze bij de partner bij de belastingheffing in de woonstaat in aanmerking kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0011353/2006-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 2.5.2
    text: |-
      De keuze geldt niet voor toepassing van de [artikelen 3.60][ref1], [3.83][ref2],[ 3.116, vierde lid][ref3],
      [3.136][ref4], [4.16, eerste lid, onderdeel h][ref5], [4.17][ref6], [4.18][ref7], [4.25][ref8] en [9.2][ref9].
      De [artikelen 7.2, achtste tot en met twaalfde lid][ref10], en [7.5, zevende lid][ref11], blijven van
      toepassing. Bij de toepassing van de [artikelen 2.7, eerste en tweede lid][ref12], en [8.1, onderdeel b][ref13],
      blijft de zinsnede «na toepassing van regelingen ter voorkoming van dubbele belasting» buiten aanmerking.
      [Artikel 8.9, derde lid][ref14], vindt geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
