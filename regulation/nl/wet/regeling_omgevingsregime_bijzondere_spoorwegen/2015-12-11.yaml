        artikel: '8'
  - number: '4'
    text: |-
      1 De afstanden, genoemd in de [artikelen 2][ref1] en [3][ref2], worden bij een spoorweg op maaiveldniveau gemeten
      vanaf het hart van het buitenste spoor, zijnde een denkbeeldige lijn in de lengterichting van het spoor midden
      tussen beide spoorstaven.

      2 De afstanden, genoemd in de [artikelen 2][ref3] en [3][ref4], worden in het geval van ingraving van de spoorweg
      gemeten uit de bovenzijde van de ingraving en in het geval van ophoging van de spoorweg gemeten uit de teen van
      het talud.


