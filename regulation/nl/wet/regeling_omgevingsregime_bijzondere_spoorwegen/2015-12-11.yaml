  - number: '5'
    text: |-
      Deze regeling is uitsluitend van toepassing op activiteiten die zijn of worden aangevangen na het moment van
      inwerkingtreding van deze regeling.
    url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#Artikel6
