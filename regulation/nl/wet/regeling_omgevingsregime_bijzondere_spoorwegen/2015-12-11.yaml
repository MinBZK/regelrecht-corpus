preamble:
  text: |-
    Gelet op artikel 11, eerste lid, van het Besluit bijzondere spoorwegen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *afstand:* afstand als bedoeld in [artikel 11, eerste lid, van het Besluit bijzondere spoorwegen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036778#Artikel11
    url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036778
        artikel: '11'
  - number: '2'
    text: |-
      1 Voor een bijzondere spoorweg is de afstand 3 meter.

      2 In het geval van een voor het openbaar verkeer openstaande spoorwegovergang is de afstand aan weerszijden
      van de spoorweg een vlak dat wordt gevormd door hoekpunten in het hart van het buitenste spoor op 50 meter aan
      weerszijden van de as van de weg en op 11 meter uit het hart van het spoor in de as van de weg. Deze afstand geldt
      ten aanzien van leidingen, werken, inrichtingen, andere objecten en beplantingen die een meter of hoger reiken dan
      het maaiveld.
    url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#Artikel2
  - number: '3'
    text: |-
      1 In afwijking van [artikel 2][ref1] gelden bij een bijzondere spoorweg, waarvoor op grond van
      [artikel 8, tweede lid, van het Besluit bijzondere spoorwegen][ref2], een ontheffing is verleend de afstanden,
      bedoeld in het tweede tot en met vijfde lid.

      2 De afstand is 8 meter bij een bijzondere spoorweg als rechte baan aangelegd en langs de buitenzijde van de boog,
      indien de spoorweg in gebogen richting is aangelegd.

      3 De afstand is 20 meter langs de binnenzijde van de boog, indien de spoorweg in gebogen richting is aangelegd.

      4 In het geval van een voor het openbaar verkeer openstaande spoorwegovergang is de afstand aan weerszijden van de
      bijzondere spoorweg, waarvoor een ontheffing als bedoeld in het eerste lid, is verleend voor een maximumsnelheid
      van 40 kilometer per uur, een vlak dat wordt gevormd door hoekpunten in het hart van het buitenste spoor op 220
      meter aan weerszijden van de as van de weg en op 11 meter uit het hart van het spoor in de as van de weg.

      5 In het geval van een voor het openbaar verkeer openstaande spoorwegovergang is de afstand aan weerszijden van de
      bijzondere spoorweg, waarvoor een ontheffing als bedoeld in het eerste lid, is verleend voor een maximumsnelheid
      van 41 kilometer per uur of hoger, een vlak dat wordt gevormd door hoekpunten in het hart van het buitenste spoor
      op 500 meter aan weerszijden van de as van de weg en op 11 meter uit het hart van het spoor in de as van de weg.

      6 De afstanden, bedoeld in het vierde en vijfde lid, gelden uitsluitend ten aanzien van leidingen, werken,
      inrichtingen, andere objecten en beplantingen die een meter of hoger reiken dan het maaiveld.


      [ref1]: https://wetten.overheid.nl/BWBR0037317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036778#Artikel8
    url: https://wetten.overheid.nl/BWBR0037317/2015-12-11#Artikel3
    references:
