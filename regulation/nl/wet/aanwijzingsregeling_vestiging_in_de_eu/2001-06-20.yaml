articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *richtlijn:*


              [richtlijn nr. 1999/42/EG](31999L0042) van het Europees Parlement en de Raad van de Europese Unie van 7
      juni 1999 tot de invoering van een regeling voor de erkenning van diploma's betreffende beroepswerkzaamheden die
      binnen de werkingssfeer van de liberaliseringsrichtlijnen en van de richtlijnen houdende overgangsmaatregelen
      vallen en tot aanvulling van het algemene stelsel van erkenning van diploma's (PbEG L 201);



            b

              *kamer:*


              kamer van koophandel en fabrieken als bedoeld in de Wet op de kamers van koophandel en fabrieken 1997.
    url: https://wetten.overheid.nl/BWBR0012577/2001-06-20#Artikel1
  - number: '2'
    text: |-
      Als instantie, bevoegd tot het op verzoek afgeven van verklaringen van daadwerkelijke uitoefening van werkzaamheden
      in Nederland, als bedoeld in Bijlage A, deel 1, lijst I tot en met lijst VI, van de richtlijn, wordt aangewezen de
      kamer in het gebied waarin de werkzaamheden van de aanvrager geheel of in hoofdzaak hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012577/2001-06-20#Artikel2
  - number: '3'
    text: |-
      1 Een verklaring wordt uitsluitend afgegeven, indien de aanvrager heeft aangetoond, dat hij voldoet aan een van de
      voorwaarden, gesteld in artikel 4 van de richtlijn.

      2 De in het eerste lid bedoelde verklaring bevat een opgave van de feiten, op grond waarvan zij wordt afgegeven,
      overeenkomstig het model opgenomen in bijlage 1 bij de bekendmaking van de Commissie betreffende bewijzen,
      verklaringen en documenten die zijn voorgeschreven in de tot en met 1 juni 1973 door de Raad vastgestelde
      richtlijnen op het gebied van de vrijheid van vestiging en het vrij verrichten van diensten en betrekking hebben op

        - de betrouwbaarheid,
        - het feit dat er geen faillissement heeft plaatsgehad,
        - de aard en de duur van de in de landen van herkomst uitgeoefende beroepswerkzaamheden (PbEG C 81).
    url: https://wetten.overheid.nl/BWBR0012577/2001-06-20#Artikel3
  - number: '4'
    text: |-
      Een verklaring, verleend krachtens een van de in [artikel 5][ref1] bedoelde beschikkingen, wordt geacht te zijn
      verleend krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012577#Artikel5
    url: https://wetten.overheid.nl/BWBR0012577/2001-06-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012577
        artikel: '5'
  - number: '5'
    text: |-
      De volgende beschikkingen worden ingetrokken:

      a. de beschikking van 2 september 1964 / Nr. 764/7104 MSW/WV/ Directoraat-Generaal voor de Middenstand en het
      Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in
      andere EEG-landen (Stcrt. 1964, 173);

      b. de beschikking van 9 februari 1965 / Nr. 764/10573 MKVO Directoraat-Generaal voor het Midden- en Kleinbedrijf
      en Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in
      andere EEG-landen (Stcrt. 1965, 29);

      c. de beschikking van 18 februari 1970 / Nr. 769/4840 MKVO/V/VW Directoraat-Generaal voor het Midden- en
      Kleinbedrijf en Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van
      vestiging in andere EEG-landen (Stcrt. 1970, 38);

      d. de beschikking van 18 februari 1970 / Nr. 769/4841 MKVO/V/VW Directoraat-Generaal voor het Midden- en
      Kleinbedrijf en Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van
      vestiging in andere EEG-landen (Stcrt. 1970, 38);

      e. de beschikking van 18 februari 1970 / Nr. 769/4842 MKVO/V/VW Directoraat-Generaal voor het Midden- en
      Kleinbedrijf en Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van
      vestiging in andere EEG-landen (Stcrt. 1970, 38);

      f. de beschikking van 27 oktober 1971 / Nr. 771/8419 MKVO/V/VW Directoraat-Generaal voor het Midden- en
      Kleinbedrijf en Toerisme, houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van
      vestiging in andere EEG-landen (Stcrt. 1971, 212);

      g. de beschikking van 24 maart 1980, 779/I/2898 HAD/O/VW Directoraat-Generaal voor Handel, Ambacht en Diensten,
      houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in andere EEG-
      landen (Stcrt. 1980, 63);

      h. de beschikking van 24 maart 1980, 779/I/2898 HAD/O/VW Directoraat-Generaal voor Handel, Ambacht en Diensten,
      houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in andere EEG-
      landen (Stcrt. 1980, 63);

      i. de beschikking van 4 oktober 1983, 783/I/1264 Directoraat-Generaal voor Handel, Ambacht en Diensten/O/VU,
      houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in andere EEG-
      landen (Stcrt. 1983, 195);

      j. de beschikking van 9 november 1983, Nr.782/I/3998 Directoraat-Generaal voor Handel, Ambacht en Diensten/O/VW,
      houdende de aanwijzing van instanties voor de afgifte van verklaringen ten behoeve van vestiging in andere EEG-
      landen (Stcrt. 1983, 220).
