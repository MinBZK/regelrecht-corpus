articles:
   - number: '1'
     text: |-
       Bij de bepaling van het waterkerend vermogen van een in de bijlage bij deze regeling aangewezen andere dan primaire
       waterkering in beheer bij het Rijk als bedoeld in [artikel 2.5 van de Waterwet][ref1], gaat de beheerder uit van de
       in de bijlage bij deze regeling opgenomen hydraulische randvoorwaarden.


       [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.5
     url: https://wetten.overheid.nl/BWBR0038529/2018-07-01#Artikel1
     references:
       - id: ref1
         bwb_id: BWBR0025458
         artikel: '2.5'
