         - id: hydraulische_randvoorwaarden
           type: object
           required: true
           delegated_to: minister
           delegation_type: MINISTERIELE_REGELING
           legal_basis: bijlage bij regeling_veiligheid_niet_primaire_waterkeringen_in_rijksbeheer
           description: Hydraulische randvoorwaarden op basis waarvan het waterkerend vermogen wordt bepaald
       execution:
          parameters:
            - name: waterkering_id
              type: string
