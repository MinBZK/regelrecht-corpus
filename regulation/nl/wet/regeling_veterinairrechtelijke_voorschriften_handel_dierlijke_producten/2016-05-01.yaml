  - number: '5.1'
    text: |-
      1 De minister kan met betrekking tot een partij producten in de volgende gevallen maatregelen treffen:

      a. in de partij is een ziekteverwekker, zoönose of een andere aandoening aanwezig is, dan wel wordt vermoed
      aanwezig te zijn, die een ernstig gevaar voor dieren kan opleveren;

      b. de partij is afkomstig uit een gebied dat is besmet met een epidemische dierziekte.

      2 De maatregelen, bedoeld in het eerste lid, zijn:

      a. de verplichting tot plaatsing in tijdelijke afzondering;

      b. de verplichting tot vernietiging;

      c. de verplichting tot gebruik voor andere doeleinden.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 De minister kan met betrekking tot een partij producten die niet voldoet aan communautaire en nationale
      veterinairrechtelijke voorschriften, of waarvan dat wordt vermoed, maatregelen treffen.

      2 De minister kan met betrekking tot een partij producten die rechtstreeks afkomstig is uit een derde land, en die
      in Nederland is gebracht zonder te zijn onderworpen aan de bij [richtlijn nr. 97/78/EG](31997L0078) en [verordening
      (EG) nr. 882/2004](32004R0882) en de krachtens die richtlijn en verordening vastgestelde communautaire maatregelen
      voorgeschreven veterinaire controles, maatregelen treffen.

      3 De maatregelen, bedoeld in het eerste en tweede lid, zijn:

      a. de verplichting tot plaatsing in tijdelijke afzondering;

      b. de verplichting tot vernietiging;

      c. de verplichting tot terugzending, voor zover de bevoegde autoriteit van het land van de inrichting van oorsprong
      hierin heeft toegestemd.

      4 De maatregelen, bedoeld in het eerste lid, zijn voorts:

      a. de verplichting tot gebruik voor andere doeleinden dan menselijke consumptie;

      b. de verplichting tot, in voorkomend geval, herstel van gebreken in het certificaat of het vervoersdocument binnen
      een door de minister vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 De kosten van de maatregelen, getroffen op grond van deze titel, komen ten laste van de belanghebbende bij de
      lading of diens vertegenwoordiger, zonder vergoeding van Staatswege.

      2 Het eerste lid is niet van toepassing in gevallen waarvoor op grond van een op artikel 17, zevende lid, van
      [richtlijn nr. 97/78/EG](31997L0078) vastgestelde communautaire uitvoeringsmaatregel een afwijkende regeling geldt.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel5.3
  - number: '5.4'
    text: |-
      1 De maatregelen kunnen onder voorwaarden en beperkingen worden opgelegd. Aan de maatregelen kunnen voorschriften
      worden verbonden.

      2 De maatregelen houden geen risico’s in voor de gezondheid van mens of dier.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel5.4
  - number: '6.1'
    text: |-
      Vergunningen, erkenningen, toestemmingen, goedkeuringen en registraties, die ter uitvoering van communautaire
      maatregelen zijn verleend, onderscheidenlijk hebben plaatsgevonden op grond van de [hoofdstukken 2][ref1],[ 3][ref2],
      [10][ref3], [11][ref4] of [11A van de Regeling keuring en handel dierlijke producten][ref5], de
      [Regeling in- en doorvoer vlees 1979][ref6], de [Regeling in- en doorvoer vleesproducten 1985][ref7],
      de [Regeling in- en doorvoer van pluimveeproducten 1993][ref8] of de
      [Regeling invoer konijne- en hazevlees 1993][ref9], worden geacht te zijn verleend, onderscheidenlijk te hebben
      plaatsgevonden op grond van deze regeling.


