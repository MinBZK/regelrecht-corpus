        paragraaf: 2.1.1
  - number: 2.1.2.2
    text: |-
      Het product is afkomstig van land, dan wel een regio van landen, dat, onderscheidenlijk die is geplaatst op een
      lijst, opgenomen in een krachtens artikel 8, onderdeel 1, van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde
      communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.2
  - number: 2.1.2.3
    text: |-
      Ten aanzien van het product en het dier waaruit het product is verkregen is voldaan aan regels over de oorsprong,
      gesteld in een krachtens artikel 8, onderdeel 3, van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde
      communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.3
  - number: 2.1.2.4
    text: |-
      Het product voldoet aan bijzondere voorschriften, gesteld in een krachtens artikel 8, onderdeel 4, van [richtlijn
      nr. 2002/99/EG](32002L0099) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.4
  - number: 2.1.2.5
    text: |-
      Het product voldoet aan andere voorschriften, gesteld in een krachtens artikel 8, onderdeel 5, van [richtlijn nr.
      2002/99/EG](32002L0099) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.5
  - number: 2.1.2.6
    text: |-
      Het product voldoet aan voorwaarden, gesteld in een krachtens artikel 48 van [verordening (EG) nr. 882/2004]
      (32004R0882) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.6
  - number: 2.1.2.7
    text: |-
      1 Het product gaat vergezeld van een veterinair certificaat.

      2 Een certificaat als bedoeld in het eerste lid voldoet aan elk van de volgende eisen:

      a. de eisen, gesteld in bijlage IV bij [richtlijn nr. 2002/99/EG](32002L0099);

      b. uit het certificaat blijkt of het product al dan niet voldoet aan [richtlijn nr. 2002/99/EG](32002L0099) en
      andere communautaire maatregelen;

      c. de voorschriften, gesteld in een krachtens artikel 9, vierde lid, van [richtlijn nr. 2002/99/EG](32002L0099)
      vastgestelde communautaire uitvoeringsmaatregel.

      3 Ingeval het product afkomstig is uit Nieuw-Zeeland, mag het in afwijking van het tweede lid vergezeld gaan
      van een certificaat dat is vastgesteld bij een communautaire maatregel ter uitvoering van de Overeenkomst van
      17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel
      in levende dieren en dierlijke producten (PbEG L 57), indien is voldaan aan de voorschriften, gesteld in de
      vorenbedoelde communautaire maatregel.

      4 Ingeval het product afkomstig is uit Canada, mag het in afwijking van het tweede lid vergezeld gaan van een
      certificaat dat is vastgesteld bij een communautaire maatregel ter uitvoering van de Overeenkomst van 17 december
      1998 tussen de Europese Gemeenschap en Canada inzake sanitaire maatregelen ter bescherming van de volksgezondheid
      en de diergezondheid bij de handel in levende dieren en dierlijke producten (PbEG 1999, L 71), indien is voldaan
      aan de voorschriften, gesteld in de vorenbedoelde communautaire maatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.2.7
  - number: 2.2.1
    text: |-
      Het is verboden dierlijke bijproducten en afgeleide producten als bedoeld in artikel 3, onderdelen 1 en 2, van
      verordening (EG) nr. 1069/2009:

      a. in Nederland te brengen vanuit een lidstaat;

      b. in Nederland te brengen vanuit een derde land;

      c. buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.2.1
  - number: 2.2.2
    text: |-
      Het verbod, bedoeld in [artikel 2.2.1][ref1], is niet van toepassing op dierlijke bijproducten en afgeleide
      producten ten aanzien waarvan is voldaan aan titel II, hoofdstuk II en III van verordening (EG) 1069/2009,
      alsmede aan de krachtens de artikelen 40, 42 en artikel 43, derde lid van die verordening vastgestelde
      uitvoeringsmaatregelen van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 2.2.1
        hoofdstuk: '2.2'
  - number: 2.3.1
    text: |-
      Het is verboden dierlijke producten afkomstig van herkauwers als bedoeld in artikel 16 van [verordening (EG) nr.
      999/2001](32899R2001):

      a. in Nederland te brengen;

      b. in Nederland te produceren, te verwerken, in de handel te brengen, te vervoeren;

      c. het anders dan in doorvoer buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.3.1
  - number: 2.3.2
    text: |-
      Het verbod, bedoeld in [artikel 2.3.1][ref1], is niet van toepassing indien is voldaan aan de voorschriften gesteld
      in:

      a. artikel 16, tweede lid, van verordening (EG) nr. 999/2001, voor wat betreft de daarin genoemde producten;

      b. artikel 16, derde lid, van verordening (EG) nr. 999/2001, voor wat betreft de daarin genoemde producten;

      c. bijlage VIII, Hoofdstuk C, van verordening (EG) nr. 999/2001, voor wat betreft de daarin genoemde producten;

      d. bijlage IX, hoofdstukken C en F, bij verordening (EG) nr. 999/2001, voor wat betreft de daarin genoemde
      producten.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.3.1
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 2.3.1
        hoofdstuk: '2.3'
  - number: 2.4.1.1
    text: |-
      1 Het is verboden producten van dierlijke oorsprong, genoemd in [richtlijn nr. 92/118/EG](31992L0118):

      a. in Nederland te brengen vanuit een lidstaat;

      b. in Nederland te produceren, te verwerken, in de handel te brengen, te vervoeren;

      c. het anders dan in doorvoer buiten Nederland in een lidstaat te brengen.

      2 De producten, bedoeld in het eerste lid, zijn:

      a. voor menselijke consumptie bestemde nieuwe producten van dierlijke oorsprong als bedoeld in artikel 3, tweede
      gedachtestreep, van [richtlijn nr. 92/118/EEG](31992L0118);

      b. ziekteverwekkers als bedoeld in artikel 1, eerste lid, onderdeel d, van [richtlijn nr. 92/118/EEG](31992L0118);

      c. de producten waarvoor op grond van bijlage 1 bij [richtlijn nr. 92/118/EEG](31992L0118) voorschriften aan het
      handelsverkeer gelden.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.1.1
  - number: 2.4.1.2
    text: |-
      1 Ingeval het product:

      a. een ziekteverwekker is, is voldaan aan krachtens artikel 6 van [richtlijn nr. 92/118/EEG](31992L0118)
      vastgestelde communautaire uitvoeringsmaatregelen en is ten aanzien van de invoer van en de handel in dit product
      melding gedaan aan de minister;

      b. een product is waarvoor op grond van bijlage 1 bij [richtlijn nr. 92/118/EEG](31992L0118) voorschriften aan
      het handelsverkeer gelden, is voldaan aan die voorschriften en de krachtens die bijlage vastgestelde communautaire
      uitvoeringsmaatregelen.

      2 Ingeval een ziekteverwekker als bedoeld in het eerste lid, onderdeel a, die tevens een dierlijk bijproduct als
      bedoeld in verordening (EG) nr. 1069/2009 is, in Nederland wordt gebracht vanuit een lidstaat, wordt de melding,
      bedoeld in het eerste lid, onderdeel a, geacht te zijn gedaan als de ontvangst ervan op Nederlands grondgebied op
      grond van artikel 48, eerste lid, van die verordening is toegestaan.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.1.2
  - number: 2.4.1.3
    text: |-
      Het product is afkomstig van een inrichting die voldoet aan artikel 4, onderdeel 2, van [richtlijn nr. 92/118/
      EEG](31992L0118).
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.1.3
  - number: 2.4.2.1
    text: |-
      1 Het is verboden producten van dierlijke oorsprong dierlijke oorsprong, genoemd in [richtlijn nr. 92/118/EG]
      (31992L0118) in Nederland te brengen vanuit een derde land.

      2 De producten, bedoeld in het eerste lid, zijn:

      a. ziekteverwekkers als bedoeld in artikel 2, eerste lid, onderdeel d, van [richtlijn nr. 92/118/EEG](31992L0118);

      b. de producten waarvoor op grond van bijlage 1 bij [richtlijn nr. 92/118/EEG](31992L0118) voorschriften aan de
      invoer uit derde landen gelden.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan [artikel 2.4.1.2][ref1]
      en[ 2.4.1.3][ref2] en deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel2.4.1.3
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 2.4.1.2
        hoofdstuk: '2.4'
        paragraaf: 2.4.1
      - id: ref2
        bwb_id: BWBR0019235
        artikel: 2.4.1.3
        hoofdstuk: '2.4'
        paragraaf: 2.4.1
  - number: 2.4.2.3
    text: |-
      Het product is afkomstig van een derde land of een gedeelte van een derde land, dat is geplaatst op een lijst,
      opgenomen in een krachtens artikel 10, tweede lid, onderdeel a, van [richtlijn nr. 92/118/EEG](31992L0118)
      vastgestelde communautaire uitvoeringsmaatregel;
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.3
  - number: 2.4.2.4
    text: |-
      Het product voldoet aan specifieke voorschriften dan wel gelijkwaardige garanties, gesteld in een krachtens
      artikel 10, derde lid, onderdeel a of c, van [richtlijn nr. 92/118/EEG](31992L0118) vastgestelde communautaire
      uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.4
  - number: 2.4.2.5
    text: |-
      Ingeval het product is bestemd voor onderzoek, onderwijs of diagnose, is voldaan aan de specifieke voorschriften
      en de voorschriften met betrekking tot de aard en de inhoud van begeleidende documenten, gesteld in een krachtens
      artikel 11 van [richtlijn nr. 92/118/EEG](31992L0118) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.5
  - number: 2.4.2.6
    text: |-
      1 Ingeval het product een handelsmonster als bedoeld in artikel 2, eerste lid, onderdeel b, van [richtlijn nr.
      92/118/EEG](31992L0118) is:

      a. is ten aanzien van dit product door de minister een vergunning verleend voor de invoer van dit product, of

      b. is een termijn van 30 werkdagen, te rekenen vanaf de datum van ontvangst van de aanvraag van een vergunning
      bedoeld in onderdeel a, verstreken, zonder dat door de minister op de aanvraag is beslist.

      2 Ingeval een vergunning is verleend als bedoeld in het eerste lid, onderdeel a, worden de desbetreffende
      vergunning alsmede de daaraan verbonden voorschriften, voorwaarden en beperkingen in een document vastgelegd.

      3 Het document, bedoeld in het tweede lid, onderscheidenlijk een afschrift van de aanvraag, bedoeld in het eerste
      lid, onderdeel b, vergezelt het product, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.6
  - number: 2.4.2.7
    text: |-
      Ingeval het product ter voldoening aan [richtlijn nr. 92/118/EEG](31992L0118) of een op grond van die richtlijn
      vastgestelde een communautaire uitvoeringsmaatregel vergezeld gaat van een certificaat, dan voldoet dit certificaat
      aan artikel 10, tweede lid, onderdeel c, van [richtlijn nr. 92/118/EG](31992L0118), en de op grond van dat artikel
      vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.7
  - number: 2.4.2.8
    text: |-
      Ingeval ten aanzien van het product op grond van bijlage 1 bij [richtlijn nr. 92/118/EEG](31992L0118) voorschriften
      aan de invoer uit derde landen gelden, is voldaan aan die voorschriften en de krachtens die bijlage vastgestelde
      communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.4.2.8
  - number: 3.1.1
    text: |-
      1 Het is verboden een product van dierlijke oorsprong als bedoeld in artikel 1 van [richtlijn nr. 89/662/EEG]
      (31989L0662):

      a. in Nederland te brengen vanuit een lidstaat;

      b. in Nederland in de handel te brengen;

      c. het anders dan in doorvoer buiten Nederland in een lidstaat te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan dit hoofdstuk.

      3 Dit hoofdstuk is van overeenkomstige toepassing op:

      a. dierlijke bijproducten en afgeleide producten als bedoeld in artikel 3, onderdelen 1 en 2, van verordening (EG)
      nr. 1069/2009;

      b. ziekteverwekkers als bedoeld in artikel 1, eerste lid, onderdeel d, van [richtlijn nr. 92/118/EEG](31992L0118);

      c. producten, aangewezen bij een krachtens bijlage B bij [richtlijn nr. 89/662/EEG](31989L0662) vastgestelde
      communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      1 Degene die de partij producten als eerste op Nederlandse grondgebied ontvangt is geregistreerd door de minister.

      2 Registratie vindt uitsluitend plaats indien de persoon, bedoeld in het eerste lid, zich ertoe heeft verbonden:

      a. een administratie te voeren waarin ten minste de leveringen van producten, voor zover zij bestemd zijn voor
      Nederland dan wel een lidstaat, en de verdere bestemming hiervan zijn vermeld en alle op die producten betrekking
      hebbende bescheiden zijn opgenomen:

      b. de vorenbedoelde administratie ten minste drie jaren te bewaren;

      c. voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke partij na te gaan
      of de voor de desbetreffende producten op grond van communautaire maatregelen vereiste merken zijn aangebracht en
      de vereiste certificaten, documenten en andere bewijsstukken aanwezig zijn;

      d. nalatigheden en onregelmatigheden met betrekking tot een levering van een partij onmiddellijk aan de Nederlandse
      Voedsel- en Warenautoriteit te melden;

      e. aan de keuringsdierenarts alle medewerking te verlenen en hem alle gegevens te verstrekken, die deze in verband
      met de controle op de naleving van dit artikel noodzakelijk acht.

      3 De persoon, bedoeld in het eerste lid, voldoet aan andere voorschriften, gesteld krachtens artikel 5, vierde lid,
      van [richtlijn nr. 89/662/EEG](31989L0662) vastgestelde communautaire uitvoeringsmaatregelen.

      4 Voor zover de persoon, bedoeld in het eerste lid, tevens een exploitant van een levensmiddelenbedrijf als bedoeld
      in verordening (EG) nr. 178/2002 is, wordt hij geacht te zijn geregisteerd als bedoeld in het eerste lid indien
      elke inrichting die onder zijn beheer in dit kader activiteiten uitvoert, is geregisteerd ter uitvoering van
      artikel 6, tweede lid, eerste alinea, van verordening (EG) nr. 852/2004, of is erkend ter uitvoering van artikel 4,
      tweede lid, van verordening (EG) nr. 853/2004.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      1 Een partij producten die wordt vervoerd naar meer dan één bestemming, wordt opgesplitst in evenzoveel partijen
      als er bestemmingen zijn.

      2 Ingeval de oorspronkelijke partij op grond van een communautaire maatregel vergezeld gaat van een certificaat of
      een document, geldt die verplichting na splitsing voor elke aldus ontstane partij.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      Ingeval een partij producten is bestemd voor een derde land, vindt het vervoer over Nederlands grondgebied plaats
      onder douanetoezicht.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.4
  - number: 3.1.5
    text: |-
      1 Er geldt geen verbod tot het in, onderscheidenlijk buiten Nederland brengen van het desbetreffende product op
      grond van:

      a. krachtens artikel 9, derde of vierde lid, van [richtlijn nr. 89/662/EEG](31989L0662), dan wel artikel 10, derde
      of vierde lid, van [richtlijn nr. 90/425/EEG](31990L0425) vastgestelde communautaire uitvoeringsmaatregelen;

      b. maatregelen van een lidstaat ter uitvoering van artikel 9, eerste lid, vierde alinea, van [richtlijn nr. 89/662/
      EEG](31989L0662), dan wel artikel 10, eerste lid, vierde alinea, van [richtlijn nr. 90/425/EEG](31990L0425).

      2 Ingeval op grond van maatregelen als bedoeld in het eerste lid voorwaarden zijn gesteld aan het in,
      onderscheidenlijk buiten Nederland brengen van het desbetreffende product, is voldaan aan die voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.5
  - number: 3.1.6
    text: |-
      Er is voldaan aan krachtens artikel 16 van [richtlijn nr. 89/662/EEG](31989L0662) vastgestelde communautaire
      uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.1.6
  - number: 3.2.1.1
    text: |-
      1 Het is verboden een dierlijk product als bedoeld in artikel 2, tweede lid, onderdeel a, van [richtlijn nr. 97/78/
      EG](31997L0078) dat rechtstreeks afkomstig is uit een derde land in Nederland te brengen.

      2 Het is verboden een plantaardig product dat is geplaatst op de lijst, vastgesteld bij een communautaire
      uitvoeringsmaatregel krachtens artikel 19, eerste lid, van [richtlijn nr. 97/78/EG](31997L0078), dat rechtstreeks
      afkomstig is uit een derde land, in Nederland te brengen.

      3 De verboden, bedoeld in het eerste en het tweede lid, zijn niet van toepassing indien is voldaan aan dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.1.1
  - number: 3.2.1.2
    text: |-
      Dit hoofdstuk is niet van toepassing op producten als bedoeld in artikel 16 van [richtlijn nr. 97/78/EG]
      (31997L0078) en de krachtens dat artikel en artikel 25 van [verordening (EG) nr. 882/2004](32004R0882) vastgestelde
      communautaire uitvoeringsmaatregelen, indien is voldaan aan de bij de desbetreffende maatregel ten aanzien van die
      producten gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.1.2
  - number: 3.2.2.1
    text: |-
      1 Een partij producten wordt via een overeenkomstig artikel 6 van [richtlijn nr. 97/78/EG](31997L0078) erkende
      grensinspectiepost in Nederland gebracht.

      2 De erkenning van de grensinspectiepost wordt overeenkomstig artikel 6, derde lid, van [richtlijn nr. 97/78/EG]
      (31997L0078) door de minister opgeschort indien ernstige redenen van diergezondheid hier aanleiding toe geven.

      3 De opschorting van de erkenning, bedoeld in het tweede lid, kan alleen worden beëindigd indien de
      grensinspectiepost opnieuw op de lijst, bedoeld in artikel 6, vierde lid, van [richtlijn nr. 97/78/EG](31997L0078)
      wordt geplaatst overeenkomstig de procedure, bedoeld in artikel 6, tweede lid, onder a, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.1
  - number: 3.2.2.2
    text: |-
      1 De belanghebbende bij de partij producten heeft de Nederlandse Voedsel- en Warenautoriteit van tevoren
      schriftelijk de aankomst bij de grensinspectiepost gemeld.

      2 De melding geschiedt overeenkomstig de krachtens artikel 3, vijfde lid, van [richtlijn nr. 97/78/EG](31997L0078)
      vastgestelde communautaire uitvoeringsmaatregelen.

      3 Ingeval een partij producten wordt gelost op een terminal dan wel een loskade in de grensinspectiepost om
      te worden overgeladen in een ander schip, onderscheidenlijk een ander vliegtuig, meldt de belanghebbende de
      Nederlandse Voedsel- en Warenautoriteit voor aankomst van de partij het vermoedelijk tijdstip van het uitladen, de
      bestemming van de partij en desgevraagd de precieze plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.2
  - number: 3.2.2.3
    text: |-
      1 Ingeval op grond van een communautaire maatregel is vereist dat het product vergezeld gaat van een veterinair
      certificaat of een gelijksoortig document, wordt dit certificaat, onderscheidenlijk document bij aankomst op de
      grensinspectiepost aan de keuringsdierenarts overgelegd.

      2 Het certificaat of het document is in overeenstemming met de desbetreffende communautaire maatregel opgesteld,
      afgegeven, volledig ingevuld, gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.3
  - number: 3.2.2.4
    text: |-
      1 De partij producten wordt bij aankomst op de grensinspectiepost ter controle aangeboden aan de
      keuringsdierenarts.

      2 De controle vindt plaats overeenkomstig [richtlijn nr. 97/78/EG](31997L0078) en [verordening (EG) nr. 882/2004]
      (32004R0882) en de krachtens die richtlijn en verordening vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.4
  - number: 3.2.2.5
    text: |-
      Het overladen van een partij vindt plaats overeenkomstig artikel 9 van [richtlijn nr. 97/78/EG](31997L0078) en de
      krachtens dat artikel vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.5
  - number: 3.2.2.6
    text: |-
      1 Nadat de bij [richtlijn nr. 97/78/EG](31997L0078) en [verordening (EG) nr. 882/2004](32004R0882) en de krachtens
      die richtlijn en verordening vastgestelde communautaire uitvoeringsmaatregelen voorgeschreven veterinaire controles
      zijn afgerond, is met betrekking tot de partij, dan wel tot elk deel van de partij na splitsing, overeenkomstig
      artikel 5 van die richtlijn en de krachtens dat artikel vastgestelde communautaire uitvoeringsmaatregelen een
      certificaat afgegeven door de minister.

      2 Het certificaat, bedoeld in het eerste lid, vergezelt de desbetreffende partij:

      a. zolang zij onder douanetoezicht staat, of

      b. totdat zij op de plek van bestemming is aangekomen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.2.6
  - number: 3.2.3.1
    text: |-
      Ten aanzien van een partij in Nederland te brengen producten die is bestemd voor een derde land, gelden in
      aanvulling op [paragraaf 3.2.2][ref1] de volgende voorwaarden:

      a. de minister heeft toestemming verleend voor het brengen van deze partij in Nederland, ofwel een termijn van 30
      werkdagen, te rekenen vanaf de datum van ontvangst van de aanvraag van deze toestemming, is verstreken zonder dat
      de minister op de aanvraag heeft beslist;

      b. de belanghebbende heeft vooraf aan de minister schriftelijk toegezegd dat, als de partij in het derde land
      wordt geweigerd, hij de partij weer in bezit neemt en overeenkomstig de alsdan getroffen bestuurlijke maatregel
      zal handelen;

      c. het vervoer van de partij vindt onder douanetoezicht plaats;

      d. ingeval de partij wordt vervoerd over de weg, het binnenwater of het spoor geschiedt, is het voertuig dan
      wel de container verzegeld, en vindt geen lossing of splitsing van de partij plaats, en worden de producten niet
      gehanteerd;

      e. de partij verlaat het grondgebied van de Europese Unie uiterlijk 30 dagen na het vertrek uit de
      grensinspectiepost.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Hoofdstuk3.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        hoofdstuk: '3.2'
        paragraaf: 3.2.2
  - number: 3.2.3.2
    text: |-
      1 Ten aanzien van een partij in Nederland te brengen producten die eerder vanuit het grondgebied van de Europese
      Unie zijn verzonden naar een derde land en vervolgens door het derde land zijn geweigerd, gelden in aanvulling op
      [paragraaf 3.2.2][ref1] de volgende voorwaarden:

      a. de minister heeft toestemming verleend voor het brengen van deze partij in Nederland;

      b. de partij gaat vergezeld van het originele certificaat, verleend door de bevoegde autoriteit van de lidstaat van
      waaruit de partij was verzonden, dan wel van een door de bevoegde van dat derde land gewaarmerkt afschrift daarvan,
      met vermelding van:

      1°. de redenen van weigering;

      2°. de garantie dat aan de voorwaarden inzake opslag en vervoer is voldaan;

      3°. de garantie dat de betrokken producten geen bewerking hebben ondergaan;

      4°. ingeval de partij zich bevindt in een verzegelde container, een verklaring dat de inhoud van de container niet
      wordt bewerkt of uitgeladen;

      c. de bevoegde autoriteit van de lidstaat van waaruit de partij was verzonden, heeft ingestemd met terugname van
      de partij;

      d. de partij gaat rechtstreeks terug naar de inrichting van oorsprong, via verzegelde en lekvrije voertuigen of
      containers;

      e. de uitvoeringsbepalingen, gesteld bij krachtens artikel 15, zesde lid, van [richtlijn nr. 97/78/EEG](31997L0078)
      vastgestelde communautaire uitvoeringsmaatregel.

      2 Onder weigering door het derde land als bedoeld in het eerste lid, wordt mede verstaan het weigeren of niet
      afnemen van een partij door een afnemer in het derde land.

      3 De belanghebbende neemt de partij op eerste vordering van de minister in bezit en handelt overeenkomstig de
      alsdan getroffen bestuurlijke maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Hoofdstuk3.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        hoofdstuk: '3.2'
        paragraaf: 3.2.2
  - number: 3.2.4.1
    text: |-
      1 Ingeval een partij producten is bestemd voor een douane-entrepot, is in aanvulling op [paragraaf 3.2.2][ref1] en
      [3.2.3][ref2] aan elk van de volgende voorwaarden voldaan:

      a. de belanghebbende heeft vooraf aangegeven wat de eindbestemming van de partij is;

      b. de belanghebbende heeft vooraf aangegeven of de partij al dan niet aan de eisen aan invoer uit derde landen die
      gelden op grond van communautaire maatregelen en communautaire uitvoeringsmaatregelen voldoet.

      2 Ingeval er onduidelijkheid bestaat over de eindbestemming, wordt de partij geacht te zijn bestemd om in Nederland
      in de handel te worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Hoofdstuk3.2
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Hoofdstuk3.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        hoofdstuk: '3.2'
        paragraaf: 3.2.2
      - id: ref2
        bwb_id: BWBR0019235
        hoofdstuk: '3.2'
        paragraaf: 3.2.3
  - number: 3.2.4.2
    text: |-
      1 Ingeval een partij producten als bedoeld in [artikel 3.2.4.1][ref1] niet voldoet aan de eisen aan invoer
      uit derde landen die gelden op grond van communautaire maatregelen en communautaire uitvoeringsmaatregelen, is
      toelating tot een douane-entrepot slechts toegestaan indien is voldaan aan elk van de volgende voorwaarden:

      a. het entrepot is erkend door de minister;

      b. er bestaat geen gevaar voor de diergezondheid;

      c. de partij heeft een douanezegel.

      2 Erkenning als bedoeld in het eerste lid vindt slechts plaats indien is voldaan aan de voorwaarden, gesteld
      in artikel 12, vierde lid, onderdeel b, van [richtlijn nr. 97/78/EG](31997L0078) en in de krachtens dat artikel
      vastgestelde communautaire uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.4.1
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 3.2.4.1
        hoofdstuk: '3.2'
        paragraaf: 3.2.4
  - number: 3.2.4.3
    text: |-
      1 Een partij producten als bedoeld in [artikel 3.2.4.2][ref1] verlaat een douane-entrepot alleen om te worden
      verzonden naar een derde land of een entrepot als bedoeld in artikel 13 van [richtlijn nr. 97/78/EG](31997L0078).

      2 Ten aanzien van de partij, bedoeld in het eerste lid, is voldaan aan artikel 12, achtste lid, van [richtlijn nr.
      97/78/EG](31997L0078).


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.4.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel3.2.4.3
    references:
