        bwb_id: BWBR0019235
        artikel: 3.2.4.2
        hoofdstuk: '3.2'
        paragraaf: 3.2.4
  - number: 3.2.4.4
    text: |-
      Ingeval een partij producten is bestemd voor rechtstreekse levering als proviand voor bemanning en passagiers aan
      zeevervoermiddelen gelden in aanvulling op de [artikelen 3.2.4.1 tot en met 3.2.4.3][ref1] ten aanzien van degene
      die de producten verhandelt de voorwaarden, gesteld in artikel 13 van [richtlijn nr. 97/78/EG](31997L0078) en de
      krachtens dat artikel vastgestelde communautaire uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel3.2.4.1
