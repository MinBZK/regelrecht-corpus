preamble:
  text: |-
    Gelet op:

    – richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt
    (PbEG L 395);

    – richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en
    zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en producten in het
    vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    – richtlijn nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
    produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als bedoeld
    in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG
    (PbEG L 62);

    – richtlijn nr. 97/78/EG van de Raad van de Europese Unie van 18 december 1997 tot vaststelling van de beginselen
    voor de organisatie van de veterinaire controles voor producten die uit derde landen in de Gemeenschap worden
    binnengebracht (PbEG L 24);

    – verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende
    vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
    encefalopathieën (PbEG L 147);

    – verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad van de Europese Unie van 3 oktober 2002 tot
    vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten
    (PbEG L 273);

    – richtlijn nr. 2002/99/EG van de Raad van de Europese Unie van 16 december 2002 houdende vaststelling van
    veterinairrechtelijke voorschriften voor de productie, de verwerking, de distributie en het binnenbrengen van voor
    menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 18);

    – richtlijn nr. 2004/41/EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 (PbEU
    L 157) houdende intrekking van bepaalde richtlijnen inzake levensmiddelenhygiëne en tot vaststelling van
    gezondheidsvoorschriften voor de productie en het in de handel brengen van bepaalde voor menselijke consumptie
    bestemde producten van dierlijke oorsprong, en tot wijziging van de richtlijnen 89/662/EEG en 92/118/EEG van de
    Raad en van Beschikking 95/408/EG van de Raad;

    – verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake
    officiële controles op de naleving van de wetgeving inzake diervoeders en levensmiddelen en de voorschriften inzake
    diergezondheid en dierenwelzijn (PbEU L 165);

    Gelet op de artikelen 10 en 11 van de Gezondheids- en welzijnswet voor dieren, deartikelen 2, 3, 4 en 5 van het
    Besluit inzake het in de handel brengen van dieren en producten en de toepassing van maatregelen met betrekking tot
    in Nederland gebrachte dieren en producten en artikel 2, onderdeel b, van het Besluit uitvoer dieren en produkten
    van dierlijke oorsprong;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. richtlijn nr. 89/662/EEG: richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11
      december 1989 inzake veterinaire controles in het intracommunautaire handelsverkeer in het vooruitzicht van de
      totstandbrenging van de interne markt (PbEG L 395);

      b. richtlijn nr. 90/425/EG: richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990
      inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren
      en produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

      c. richtlijn nr. 92/118/EEG: richtlijn nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de
      invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire
      regelgeving geldt als bedoeld in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers
      betreft, van Richtlijn 90/425/EEG (PbEG L 62);

      d. richtlijn nr. 97/78/EG: richtlijn nr. 97/78/EG van de Raad van de Europese Unie van 18 december 1997 tot
      vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen
      in de Gemeenschap worden binnengebracht (PbEG L 24);

      e. richtlijn nr. 2006/88/EG: richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober
      2006, betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende
      de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);

      f. verordening (EG) nr. 999/2001: verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de
      Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing
      van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

      g. verordening (EG) nr. 178/2002: verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van
      de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsaangelegenheden (PbEG L 31);

      h. verordening (EG) nr. 1069/2009: verordening (EG) nr. 1069/2009 van het Europese Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300);

      i. richtlijn nr. 2002/99/EG: richtlijn nr. 2002/99/EG van de Raad van de Europese Unie van 16 december 2002
      houdende vaststelling van veterinairrechtelijke voorschriften voor de productie, de verwerking, de distributie en
      het binnenbrengen van voor menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 18);

      j. verordening (EG) nr. 882/2004: verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake officiële controles op de naleving van de wetgeving inzake diervoeders en
      levensmiddelen en de voorschriften inzake diergezondheid en dierenwelzijn (PbEU L 165);

      k. verordening (EG) nr. 852/2004: verordening (EG) nr. 852/2004 van het Europees Parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake levensmiddelenhygiëne (PbEU L 226);

      l. verordening (EG) nr. 853/2004: verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van de
      Europese Unie van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van
      dierlijke oorsprong (PbEU L 226).

      2 Deze regeling berust mede op
      [artikel 2, onderdeel c, van het Besluit uitvoer dieren en produkten van dierlijke oorsprong][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006427#Artikel2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0006427
        artikel: '2'
  - number: 1.1.2
    text: |-
      In deze regeling wordt verstaan onder:

      a. communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het EG-verdrag,
      ter zake van de preventie dan wel de bestrijding van dierziekten, en daarmee verwante onderwerpen;

      b. communautaire uitvoeringsmaatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het EG-
      verdrag, vastgesteld krachtens een communautaire maatregel, genoemd in [artikel 1.1.1][ref1].

      c. minister: Minister van Economische Zaken;

      d. wet: [Gezondheids- en welzijnswet voor dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007026
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 1.1.1
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0007026
  - number: 1.2.1
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire maatregel, genoemd in [artikel 1.1.1][ref1], en in een
      communautaire uitvoeringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautaire maatregel de bevoegde autoriteit een taak opdraagt
      die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de Nederlandse Voedsel- en Warenautoriteit.

      3 De officiële dierenarts, bedoeld in een communautaire uitvoeringsmaatregel, is een dierenarts, verbonden aan de
      Nederlandse Voedsel- en Warenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 1.1.1
        paragraaf: '1.1'
  - number: 1.3.1
    text: |-
      Ingeval in een bepaling van deze regeling is verwezen naar een communautaire uitvoeringsmaatregel, maar er ter
      zake van een product, dier of voorwerp geen dergelijke communautaire uitvoeringsmaatregel geldt, geldt voor de
      toepassing van deze regeling dat er ten aanzien van het desbetreffende product, dier of voorwerp is voldaan aan die
      desbetreffende bepaling van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.3.1
  - number: 1.3.2
    text: |-
      Een communautaire uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.3.2
  - number: 1.3.3
    text: |-
      Verwijzingen naar krachtens [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire
      uitvoeringsmaatregelen gelden tevens als verwijzingen naar:

      a. communautaire uitvoeringsmaatregelen die ten aanzien van producten van dierlijke oorsprong geheel of mede zijn
      vastgesteld krachtens:

      1°. [richtlijn nr. 72/461/EEG](31972L0461) van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vers vlees (PbEG
      L 302);

      2°. [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake
      gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of van vleesprodukten uit derde landen (PbEG L 194);

      3°. [richtlijn nr. 80/215/EEG](31980L0215) van de Raad van de Europese Gemeenschappen van 22 januari 1980 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesprodukten (PbEG
      L 47);

      4°. [richtlijn nr. 91/494/EEG](31991L0494) van de Raad van de Europese Gemeenschappen van 26 juni 1991 tot
      vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
      derde landen van vers vlees van pluimvee (PbEG L 268);

      5°. [richtlijn nr. 91/495/EEG](31991L0495) van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen van
      konijnevlees en vlees van gekweekt wild (PbEG 1991, L 268);

      6°. [richtlijn nr. 92/45/EEG](31992L0045) van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende
      de gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (PbEG L 268);

      7°. [richtlijn nr. 92/46/EEG](31992L0046) van de Raad van de Europese Gemeenschappen van 16 juni 1992 tot
      vaststelling van gezondheidsvoorschriften voor de productie en het in de handel brengen van rauwe melk,
      warmtebehandelde melk en producten op basis van melk (PbEG L 268);

      8°. [richtlijn nr. 94/65/EG](31994L0065) van de Raad van de Europese Unie van 14 december 1994 tot vaststelling van
      voorschriften voor de produktie en het in de handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368);

      b. overgangsmaatregelen, gesteld bij een krachtens artikel 13, derde lid, van [richtlijn nr. 2002/99/EG]
      (32002L0099) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.3.3
  - number: 1.4.1
    text: |-
      Op het brengen in en buiten Nederland van producten vanuit, onderscheidenlijk naar Noorwegen, zijn:

      a. de bepalingen inzake de handel met derde landen niet van toepassing;

      b. de bepalingen inzake de intracommunautaire handel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel1.4.1
  - number: 2.1.1.1
    text: |-
      1 Het is verboden een product van dierlijke oorsprong bestemd voor menselijke consumptie als bedoeld in als bedoeld
      in artikel 2, onderdeel 4, van [richtlijn nr. 2002/99/EG](32002L0099):

      a. in Nederland te brengen vanuit een lidstaat;

      b. in Nederland te produceren, te verwerken, in de handel te brengen, te vervoeren;

      c. het anders dan in doorvoer buiten Nederland in een lidstaat te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan de
      [artikelen 2.1.1.2 tot en met 2.1.1.4][ref1].

      3 Deze paragraaf is van overeenkomstige toepassing op levende dieren die zijn bestemd voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 2.1.1.2
        hoofdstuk: '2.1'
        paragraaf: 2.1.1
  - number: 2.1.1.2
    text: |-
      Het product is verkregen van dieren ten aanzien waarvan aan elk van de volgende voorwaarden is voldaan:

      a. er is voldaan aan de voor desbetreffende diersoort geldende communautaire maatregelen;

      b. het dier is afkomstig van een bedrijf, een inrichting, een grondgebied of een deel daarvan, ten aanzien
      waarvan voor de desbetreffende diersoort en producten geen bestrijdingsmaatregel is getroffen op grond van een
      communautaire maatregel, genoemd in bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099).
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.1.2
  - number: 2.1.1.3
    text: |-
      Vlees en vleesproducten zijn niet verkregen van dieren die zijn gedood in een inrichting waar bij de slacht of
      tijdens de productie dieren, dan wel karkassen of delen daarvan, aanwezig waren die waren besmet, of die werden
      verdacht van besmetting met een ziekte ten aanzien waarvan een bestrijdingsmaatregel is getroffen op grond van een
      communautaire maatregel, genoemd in bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099).
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.1.3
  - number: 2.1.1.4
    text: |-
      Aquacultuurproducten en aquacultuurdieren waarvan de aquacultuurproducten afkomstig zijn, voldoen aan richtlijn
      nr. 2006/88/EG en aan voorschriften, gesteld in krachtens artikel 4, tweede lid, van [richtlijn nr. 2002/99/EG]
      (32002L0099) vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.1.4
  - number: 2.1.1.5
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1.1.1][ref1] in samenhang met de [artikelen 2.1.1.2 tot en met 2.1.1.4][ref2],
      is niet van toepassing op producten die afkomstig zijn van een grondgebied of een deel van een grondgebied
      waarvoor om veterinairrechtelijke redenen beperkende maatregelen gelden, maar niet afkomstig van een bedrijf dat is
      besmet of ten aanzien waarvan dat wordt vermoed, indien de minister een vergunning heeft verleend voor productie,
      verwerkingen distributie van die producten.

      2 De vergunning, bedoeld in het eerste lid, wordt verleend indien is voldaan aan elk van de volgende voorwaarden:

      a. het product heeft een behandeling ondergaan die voldoende is om de risico’s voor de diergezondheid weg te nemen
      en die voldoet aan bijlage III bij [richtlijn nr. 2002/99/EG](32002L0099);

      b. voorafgaande aan de behandeling, bedoeld in onderdeel a, is het product:

      1°. bij de behandeling, de vervaardiging, de hantering, het vervoer en de opslag in tijd of ruimte gescheiden
      gehouden van producten die wel voldoen aan de communautaire maatregelen;

      2°. naar behoren geïdentificeerd overeenkomstig bijlage II bij [richtlijn nr. 2002/99/EG](32002L0099);

      c. de behandeling, bedoeld in onderdeel a, vindt plaats in een inrichting die daartoe is erkend door:

      1°. de minister, ingeval het grondgebied, bedoeld in onderdeel a, Nederland is, of anders

      2°. de bevoegde autoriteit ten aanzien van het grondgebied, bedoeld in het eerste lid;

      d. het vervoer van het product buiten het grondgebied waarvoor om veterinairrechtelijke redenen beperkende
      maatregelen gelden, geschiedt zodanig dat er geen risico’s voor de diergezondheid bestaan;

      e. er wordt voldaan aan de bestrijdingsmaatregelen, getroffen op grond van de communautaire maatregelen, genoemd in
      bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099);

      f. er is voldaan aan krachtens artikel 4 van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire
      uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.2
    url: https://wetten.overheid.nl/BWBR0019235/2016-05-01#Artikel2.1.1.5
