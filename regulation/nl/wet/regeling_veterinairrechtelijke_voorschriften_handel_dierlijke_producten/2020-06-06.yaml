        paragraaf: '1.1'
  - number: 1.3.1
    text: |-
      Ingeval in een bepaling van deze regeling is verwezen naar een communautaire uitvoeringsmaatregel, maar er ter
      zake van een product, dier of voorwerp geen dergelijke communautaire uitvoeringsmaatregel geldt, geldt voor de
      toepassing van deze regeling dat er ten aanzien van het desbetreffende product, dier of voorwerp is voldaan aan die
      desbetreffende bepaling van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.3.1
  - number: 1.3.2
    text: |-
      Een communautaire uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.3.2
  - number: 1.3.3
    text: |-
      Verwijzingen naar krachtens [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire
      uitvoeringsmaatregelen gelden tevens als verwijzingen naar:

      a. communautaire uitvoeringsmaatregelen die ten aanzien van producten van dierlijke oorsprong geheel of mede zijn
      vastgesteld krachtens:

      1°. [richtlijn nr. 72/461/EEG](31972L0461) van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vers vlees (PbEG
      L 302);

      2°. [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake
      gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of van vleesprodukten uit derde landen (PbEG L 194);

      3°. [richtlijn nr. 80/215/EEG](31980L0215) van de Raad van de Europese Gemeenschappen van 22 januari 1980 inzake
      veterinairrechtelijke vraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesprodukten (PbEG
      L 47);

      4°. [richtlijn nr. 91/494/EEG](31991L0494) van de Raad van de Europese Gemeenschappen van 26 juni 1991 tot
      vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
      derde landen van vers vlees van pluimvee (PbEG L 268);

      5°. [richtlijn nr. 91/495/EEG](31991L0495) van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen van
      konijnevlees en vlees van gekweekt wild (PbEG 1991, L 268);

      6°. [richtlijn nr. 92/45/EEG](31992L0045) van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende
      de gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (PbEG L 268);

      7°. [richtlijn nr. 92/46/EEG](31992L0046) van de Raad van de Europese Gemeenschappen van 16 juni 1992 tot
      vaststelling van gezondheidsvoorschriften voor de productie en het in de handel brengen van rauwe melk,
      warmtebehandelde melk en producten op basis van melk (PbEG L 268);

      8°. [richtlijn nr. 94/65/EG](31994L0065) van de Raad van de Europese Unie van 14 december 1994 tot vaststelling van
      voorschriften voor de produktie en het in de handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368);

      b. overgangsmaatregelen, gesteld bij een krachtens artikel 13, derde lid, van [richtlijn nr. 2002/99/EG]
      (32002L0099) vastgestelde communautaire uitvoeringsmaatregel.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.3.3
  - number: 1.4.1
    text: |-
      Op het brengen in en buiten Nederland van producten vanuit, onderscheidenlijk naar Noorwegen, zijn:

      a. de bepalingen inzake de handel met derde landen niet van toepassing;

      b. de bepalingen inzake de intracommunautaire handel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.4.1
  - number: 2.1.1.1
    text: |-
      1 Het is verboden een product van dierlijke oorsprong bestemd voor menselijke consumptie als bedoeld in als bedoeld
      in artikel 2, onderdeel 4, van [richtlijn nr. 2002/99/EG](32002L0099):

      a. in Nederland te brengen vanuit een lidstaat;

      b. in Nederland te produceren, te verwerken, in de handel te brengen, te vervoeren;

      c. het anders dan in doorvoer buiten Nederland in een lidstaat te brengen.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan de
      [artikelen 2.1.1.2 tot en met 2.1.1.4][ref1].

      3 Deze paragraaf is van overeenkomstige toepassing op levende dieren die zijn bestemd voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.2
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 2.1.1.2
        hoofdstuk: '2.1'
        paragraaf: 2.1.1
  - number: 2.1.1.2
    text: |-
      Het product is verkregen van dieren ten aanzien waarvan aan elk van de volgende voorwaarden is voldaan:

      a. er is voldaan aan de voor desbetreffende diersoort geldende communautaire maatregelen;

      b. het dier is afkomstig van een bedrijf, een inrichting, een grondgebied of een deel daarvan, ten aanzien
      waarvan voor de desbetreffende diersoort en producten geen bestrijdingsmaatregel is getroffen op grond van een
      communautaire maatregel, genoemd in bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099).
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.1.2
  - number: 2.1.1.3
    text: |-
      Vlees en vleesproducten zijn niet verkregen van dieren die zijn gedood in een inrichting waar bij de slacht of
      tijdens de productie dieren, dan wel karkassen of delen daarvan, aanwezig waren die waren besmet, of die werden
      verdacht van besmetting met een ziekte ten aanzien waarvan een bestrijdingsmaatregel is getroffen op grond van een
      communautaire maatregel, genoemd in bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099).
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.1.3
  - number: 2.1.1.4
    text: |-
      Aquacultuurproducten en aquacultuurdieren waarvan de aquacultuurproducten afkomstig zijn, voldoen aan richtlijn
      nr. 2006/88/EG en aan voorschriften, gesteld in krachtens artikel 4, tweede lid, van [richtlijn nr. 2002/99/EG]
      (32002L0099) vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.1.4
  - number: 2.1.1.5
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1.1.1][ref1] in samenhang met de [artikelen 2.1.1.2 tot en met 2.1.1.4][ref2],
      is niet van toepassing op producten die afkomstig zijn van een grondgebied of een deel van een grondgebied
      waarvoor om veterinairrechtelijke redenen beperkende maatregelen gelden, maar niet afkomstig van een bedrijf dat is
      besmet of ten aanzien waarvan dat wordt vermoed, indien de minister een vergunning heeft verleend voor productie,
      verwerkingen distributie van die producten.

      2 De vergunning, bedoeld in het eerste lid, wordt verleend indien is voldaan aan elk van de volgende voorwaarden:

      a. het product heeft een behandeling ondergaan die voldoende is om de risico’s voor de diergezondheid weg te nemen
      en die voldoet aan bijlage III bij [richtlijn nr. 2002/99/EG](32002L0099);

      b. voorafgaande aan de behandeling, bedoeld in onderdeel a, is het product:

      1°. bij de behandeling, de vervaardiging, de hantering, het vervoer en de opslag in tijd of ruimte gescheiden
      gehouden van producten die wel voldoen aan de communautaire maatregelen;

      2°. naar behoren geïdentificeerd overeenkomstig bijlage II bij [richtlijn nr. 2002/99/EG](32002L0099);

      c. de behandeling, bedoeld in onderdeel a, vindt plaats in een inrichting die daartoe is erkend door:

      1°. de minister, ingeval het grondgebied, bedoeld in onderdeel a, Nederland is, of anders

      2°. de bevoegde autoriteit ten aanzien van het grondgebied, bedoeld in het eerste lid;

      d. het vervoer van het product buiten het grondgebied waarvoor om veterinairrechtelijke redenen beperkende
      maatregelen gelden, geschiedt zodanig dat er geen risico’s voor de diergezondheid bestaan;

      e. er wordt voldaan aan de bestrijdingsmaatregelen, getroffen op grond van de communautaire maatregelen, genoemd in
      bijlage I bij [richtlijn nr. 2002/99/EG](32002L0099);

      f. er is voldaan aan krachtens artikel 4 van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire
      uitvoeringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.2
