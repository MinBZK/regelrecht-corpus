  - number: 2.1.1.7
    text: |-
      1 Het product gaat vergezeld van een veterinair certificaat, voor zover een krachtens artikel 9 van [richtlijn
      nr. 89/662/EEG](31989L0662) dan wel artikel 4, tweede lid, van [richtlijn nr. 2002/99](32002L0099) vastgestelde
      communautaire uitvoeringsmaatregel dat voorschrijft.

      2 Een certificaat als bedoeld in het eerste lid voldoet aan de eisen, gesteld in krachtens artikel 5, tweede lid,
      van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.1.7
  - number: 2.1.2.1
    text: |-
      1 Het is verboden een product van dierlijke oorsprong bestemd voor menselijke consumptie als bedoeld in artikel 2,
      onderdeel 4, van [richtlijn nr. 2002/99/EG](32002L0099), in Nederland te brengen vanuit een derde land.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan [paragraaf 2.1.1][ref1], met
      uitzondering van [artikel 2.1.1.7][ref2], en deze paragraaf.

      3 Deze paragraaf is van overeenkomstige toepassing op levende dieren die zijn bestemd voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Hoofdstuk2.1
      [ref2]: https://wetten.overheid.nl/BWBR0019235#Artikel2.1.1.7
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel2.1.2.1
