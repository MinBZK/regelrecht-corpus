  - number: 3.3.3
    text: |-
      1 De minister wijst grenscontroleposten aan als bedoeld in artikel 59, eerste lid, van verordening (EU) 2017/625.

      2 De minister kan andere controlepunten aanwijzen als bedoeld in artikel 53, eerste lid, van verordening (EU)
      2017/625.

      3 Aanwijzingen als bedoeld in het eerste en tweede lid, kunnen worden ingetrokken of worden geschorst, ter
      uitvoering van artikel 62 en 63 van de verordening (EU) 2017/62.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel3.3.3
  - number: 4.1.1
    text: |-
      1 Het is verboden producten van dierlijke oorsprong en andere producten en voorwerpen die dragers van een smetstof
      kunnen zijn, vanuit een lidstaat in Nederland te brengen ingeval op grond van een krachtens artikel 53 van
      [verordening (EG) nr. 178/2002](32002R0178) vastgestelde communautaire uitvoeringsmaatregel een van de volgende
      maatregelen is getroffen:

      a. de opschorting van het in de handel brengen van het desbetreffende product of voorwerp;

      b. de vaststelling van bijzondere voorwaarden aan de desbetreffende producten dan wel voorwerpen;

      c. andere passende tijdelijke maatregelen als bedoeld in artikel 53, eerste lid, onderdeel a, onder iv, van
      [verordening (EG) nr. 178/2002](32002R0178).

      2 Het verbod, bedoeld in het eerste lid, onderdeel b dan wel c, is niet van toepassing indien is voldaan aan de bij
      de desbetreffende communautaire uitvoeringsmaatregel voorgeschreven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel4.1.1
  - number: 4.2.2
    text: |-
      1 Het is verboden producten van dierlijke oorsprong en andere producten en voorwerpen die dragers van een smetstof
      kunnen zijn, vanuit een derde land, of een deel daarvan, in Nederland te brengen ingeval op grond van een krachtens
      artikel 53 van [verordening (EG) nr. 178/2002](32002R0178) vastgestelde communautaire uitvoeringsmaatregel een van
      de volgende maatregelen is getroffen:

      a. de opschorting van het in de handel brengen van het desbetreffende product of voorwerp;

      b. de vaststelling van bijzondere voorwaarden aan de desbetreffende producten dan wel voorwerpen;

      c. andere passende tijdelijke maatregelen als bedoeld in artikel 53, eerste lid, onderdeel b, onder iii, van
      [verordening (EG) nr. 178/2002](32002R0178).

      2 Het verbod, bedoeld in het eerste lid, onderdeel b dan wel c, is niet van toepassing indien is voldaan aan de bij
      de desbetreffende communautaire uitvoeringsmaatregel voorgeschreven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel4.2.2
  - number: 4.2.3
    text: |-
      Het is verboden dierlijke producten waarop een of meer bepalingen van [hoofdstuk 2][ref1] van toepassing zijn,
      vanuit een derde land in Nederland te brengen ingeval een communautaire maatregel lidstaten ertoe verplicht:

      a. het binnenbrengen van deze producten te verbieden;

      b. voorwaarden aan het binnenbrengen van deze producten te stellen en ten aanzien van een desbetreffend dierlijk
      product niet aan een of meer van die voorwaarden is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019235
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0019235
  - number: '6.1'
    text: |-
      Vergunningen, erkenningen, toestemmingen, goedkeuringen en registraties, die ter uitvoering van communautaire
      maatregelen zijn verleend, onderscheidenlijk hebben plaatsgevonden op grond van de [hoofdstukken 2][ref1],[ 3][ref2],
      [10][ref3], [11][ref4] of [11A van de Regeling keuring en handel dierlijke producten][ref5], de
      [Regeling in- en doorvoer vlees 1979][ref6], de [Regeling in- en doorvoer vleesproducten 1985][ref7],
      de [Regeling in- en doorvoer van pluimveeproducten 1993][ref8] of de
      [Regeling invoer konijne- en hazevlees 1993][ref9], worden geacht te zijn verleend, onderscheidenlijk te hebben
      plaatsgevonden op grond van deze regeling.


