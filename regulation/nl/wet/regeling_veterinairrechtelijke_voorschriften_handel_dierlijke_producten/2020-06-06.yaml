  - number: 1.1.2
    text: |-
      In deze regeling wordt verstaan onder:

      a. communautaire maatregel: verordening, richtlijn of beschikking als bedoeld in artikel 288 van het Verdrag
      betreffende de werking van de Europese Unie, ter zake van de preventie dan wel de bestrijding van dierziekten, en
      daarmee verwante onderwerpen;

      b. communautaire uitvoeringsmaatregel: verordening, richtlijn of beschikking als bedoeld in artikel 288 van het
      Verdrag betreffende de werking van de Europese Unie, vastgesteld krachtens een communautaire maatregel, genoemd
      in [artikel 1.1.1][ref1].

      c. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      d. wet: [Gezondheids- en welzijnswet voor dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007026
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0019235
        artikel: 1.1.1
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0007026
  - number: 1.2.1
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautaire maatregel, genoemd in [artikel 1.1.1][ref1], en in een
      communautaire uitvoeringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautaire maatregel de bevoegde autoriteit een taak opdraagt
      die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de Nederlandse Voedsel- en Warenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0019235#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#Artikel1.2.1
    references:
