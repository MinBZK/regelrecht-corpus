      is niet van toepassing op producten ten aanzien waarvan is voldaan aan voorwaarden, gesteld in krachtens artikel 4,
      derde lid, van [richtlijn nr. 2002/99/EG](32002L0099) vastgestelde communautaire uitvoeringsmaatregelen.


