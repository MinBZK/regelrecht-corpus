preamble:
  text: |-
    Gelet op:

    – richtlijn nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt
    (PbEG L 395);

    – richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 inzake veterinaire en
    zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en producten in het
    vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    – richtlijn nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
    produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als bedoeld
    in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG
    (PbEG L 62);

    – richtlijn nr. 97/78/EG van de Raad van de Europese Unie van 18 december 1997 tot vaststelling van de beginselen
    voor de organisatie van de veterinaire controles voor producten die uit derde landen in de Gemeenschap worden
    binnengebracht (PbEG L 24);

    – verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende
    vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
    encefalopathieën (PbEG L 147);

    – verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad van de Europese Unie van 3 oktober 2002 tot
    vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten
    (PbEG L 273);

    – richtlijn nr. 2002/99/EG van de Raad van de Europese Unie van 16 december 2002 houdende vaststelling van
    veterinairrechtelijke voorschriften voor de productie, de verwerking, de distributie en het binnenbrengen van voor
    menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 18);

    – richtlijn nr. 2004/41/EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 (PbEU
    L 157) houdende intrekking van bepaalde richtlijnen inzake levensmiddelenhygiëne en tot vaststelling van
    gezondheidsvoorschriften voor de productie en het in de handel brengen van bepaalde voor menselijke consumptie
    bestemde producten van dierlijke oorsprong, en tot wijziging van de richtlijnen 89/662/EEG en 92/118/EEG van de
    Raad en van Beschikking 95/408/EG van de Raad;

    – verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake
    officiële controles op de naleving van de wetgeving inzake diervoeders en levensmiddelen en de voorschriften inzake
    diergezondheid en dierenwelzijn (PbEU L 165);

    Gelet op de artikelen 10 en 11 van de Gezondheids- en welzijnswet voor dieren, deartikelen 2, 3, 4 en 5 van het
    Besluit inzake het in de handel brengen van dieren en producten en de toepassing van maatregelen met betrekking tot
    in Nederland gebrachte dieren en producten en artikel 2, onderdeel b, van het Besluit uitvoer dieren en produkten
    van dierlijke oorsprong;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019235/2020-06-06#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      1 In deze regeling wordt verstaan onder:

      a.

      b.

      c. richtlijn nr. 92/118/EEG: richtlijn nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december
      1992 tot vaststelling van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de
      invoer in de Gemeenschap van produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire
      regelgeving geldt als bedoeld in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG, en, wat ziekteverwekkers
      betreft, van Richtlijn 90/425/EEG (PbEG L 62);

      d.

      e. richtlijn nr. 2006/88/EG: richtlijn nr. 2006/88/EG van de Raad van de Europese Gemeenschappen van 24 oktober
      2006, betreffende veterinairrechtelijke voorschriften voor aquacultuurdieren en de producten daarvan en betreffende
      de preventie en bestrijding van bepaalde ziekten bij waterdieren (PbEG L 328);

      f. verordening (EG) nr. 999/2001: verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de
      Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing
      van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

      g. verordening (EG) nr. 178/2002: verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van
      de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsaangelegenheden (PbEG L 31);

      h. verordening (EG) nr. 1069/2009: verordening (EG) nr. 1069/2009 van het Europese Parlement en de Raad van
      21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde
      dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (PbEU L 300);

      i. richtlijn nr. 2002/99/EG: richtlijn nr. 2002/99/EG van de Raad van de Europese Unie van 16 december 2002
      houdende vaststelling van veterinairrechtelijke voorschriften voor de productie, de verwerking, de distributie en
      het binnenbrengen van voor menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 18);

      j.

      k. verordening (EG) nr. 852/2004: verordening (EG) nr. 852/2004 van het Europees Parlement en de Raad van de
      Europese Unie van 29 april 2004 inzake levensmiddelenhygiëne (PbEU L 226);

      l. verordening (EG) nr. 853/2004: verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van de
      Europese Unie van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van
      dierlijke oorsprong (PbEU L 226);

      m. *verordening (EU) 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (PbEU L 95);

      n. *uitvoeringsverordening (EU) 2019/1013:* uitvoeringsverordening (EU) 2019/1013 van de Commissie van 16 april
      2019 betreffende de voorafgaande kennisgeving van zendingen van bepaalde categorieën dieren en goederen die de Unie
      binnenkomen (PbEU L 165);

      o. *gedelegeerde verordening (EU) 2019/1602:* gedelegeerde verordening (EU) 2019/1602 van de Commissie van
      23 april 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad betreffende het
      gemeenschappelijk gezondheidsdocument van binnenkomst dat zendingen van dieren en goederen tot hun bestemming
      vergezelt (PbEU L 250);

      p. *gedelegeerde verordening (EU) 2019/1666:* gedelegeerde verordening (EU) 2019/1666 van de Commissie van 24 juni
      2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft de voorwaarden
      voor de monitoring van het vervoer en de aankomst van zendingen van bepaalde goederen van de grenscontrolepost van
      aankomst tot de inrichting op de plaats van bestemming in de Unie (PbEU L 255);

      q. *gedelegeerde verordening (EU) 2019/625:* gedelegeerde verordening (EU) 2019/625 van de Commissie van 4 maart
      2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft voorwaarden
      voor de binnenkomst in de Unie van zendingen van bepaalde voor menselijke consumptie bestemde dieren en goederen
      (PbEU L 313);

      r. *uitvoeringsverordening (EU) 2019/1715:* uitvoeringsverordening (EU) 2019/1715 van de Commissie van 30 september
      2019 tot vaststelling van regels inzake de werking van het informatiemanagementsysteem voor officiële controles en
      de systeemcomponenten ervan (de Imsoc-verordening) (PbEU L 261);

      s. *uitvoeringsverordening (EU) 2019/1973:* uitvoeringsverordening (EU) 2019/1793 van de Commissie van 22 oktober
      2019 betreffende de tijdelijke verhoging van de officiële controles en noodmaatregelen met betrekking tot de
      binnenkomst in de Unie van bepaalde goederen uit bepaalde derde landen tot uitvoering van de Verordeningen (EU)
      2017/625 en (EG) nr. 178/2002 van het Europees Parlement en de Raad, en tot intrekking van de [Verordeningen
      (EG) nr. 669/2009](32009R0669)), (EU) [nr. 884/2014](32014R0884), (EU) [2015/175](32075R2015), (EU) [2017/186]
      (32086R2017) en (EU) [2018/1660](33560R2018) van de Commissie (PbEU L 11);

      t. *gedelegeerde verordening (EU) 2019/2122:* gedelegeerde verordening (EU) 2019/2122 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      bepaalde categorieën dieren en goederen die van officiële controles aan grenscontroleposten zijn vrijgesteld, en
      specifieke controles van de persoonlijke bagage van passagiers en van kleine zendingen goederen die aan natuurlijke
      personen worden gezonden en niet bestemd zijn om in de handel te worden gebracht en tot wijziging van Verordening
      (EU) nr. 142/2011 van de Commissie (PbEU L 321);

      u. *gedelegeerde verordening (EU) 2019/2124:* gedelegeerde verordening (EU) 2019/2124 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      voorschriften voor officiële controles van zendingen van dieren en goederen bij doorvoer, overlading en verder
      vervoer door de Unie, tot wijziging van de [Verordeningen (EG) nr. 798/2008](32008R0798), [(EG) nr. 1251/2008]
      (32008R1251), [(EG) nr. 119/2009](32009R0119), (EU) [nr. 206/2010](32010R0206), (EU) [nr. 605/2010](32010R0605),
      (EU) [nr. 142/2011](32011R0142) en (EU) [nr. 28/2012](32012R0028) van de Commissie, Uitvoeringsverordening (EU)
      [2016/759](32659R2016) van de Commissie, en Beschikking [2007/777/EG](32677R2007) van de Commissie (PbEU L 321);

      v. *gedelegeerde verordening (EU) 2019/2125:* gedelegeerde verordening (EU) 2019/2125 van de Commissie van
      10 oktober 2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en de Raad wat betreft
      regels voor de uitvoering van specifieke officiële controles van houten verpakkingsmateriaal, de kennisgeving van
      bepaalde zendingen en de te nemen maatregelen in geval van niet-naleving (PbEU L 321);

      w. *uitvoeringsverordening (EU) 2019/2128:* uitvoeringsverordening (EU) 2019/2128 van de Commissie van 12 november
      2019 tot vaststelling van het model van officieel certificaat en van de regels voor de afgifte van officiële
      certificaten voor goederen die worden geleverd aan vaartuigen die de Unie verlaten en bestemd zijn voor
      bevoorrading van een schip of voor consumptie door de bemanning en passagiers, of aan een militaire basis van de
      NAVO of de Verenigde Staten van Amerika (PbEU L 321).

      2 Deze regeling berust mede op
      [artikel 2, onderdeel c, van het Besluit uitvoer dieren en produkten van dierlijke oorsprong][ref1] en de
      [artikelen 4][ref2] en [5 van het Besluit uitvoering verordening officiële controles diergezondheid][ref3].


