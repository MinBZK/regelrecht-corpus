$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/schema.json
$id: regeling_grenswaarden_voor_per_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1992-01-31'
bwb_id: BWBR0005378
url: https://wetten.overheid.nl/BWBR0005378/1992-01-31
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor het brengen van PER in oppervlaktewateren
    ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 27 juli 1990, 90/415/EEG ( PbEG L
    219/49), tot wijziging van bijlage II bij Richtlijn 86/280/EEG betreffende grenswaarden en kwaliteitsdoelstellingen
    voor lozingen van bepaalde onder lijst I van de bijlage bij Richtlijn 76/464/EEG vallende gevaarlijke stoffen;
    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. PER: perchloorethyleen;

      b. TRI: trichloorethyleen;

      c. TETRA: tetrachloorkoolstof;

      d. verwerken van PER: elk industrieel proces waarbij PER of PER bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij PER of PER bevattende stoffen vrijkomen;

      e. bestaand bedrijf: bedrijf dat PER verwerkt, dat op 31 juli 1991 in werking is en waarvan de capaciteit voor het
      verwerken van PER na 31 juli 1991 niet aanzienlijk is uitgebreid;

      f. nieuw bedrijf: bedrijf dat PER verwerkt en geen bestaand bedrijf is;

      g. bijlage I: bij deze regeling behorende bijlage I;

      h. bijlage II: bij deze regeling behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel1
  - number: '2'
    text: |-
      1 Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie PER voorkomend
      in afvalwater dat in oppervlaktewateren wordt gebracht, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf
      behorende tot een van de in bijlage I genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder
      geval niet hoger is dan de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.

      2 De in het eerste lid laatstgenoemde grenswaarde geldt met ingang van de in bijlage I opgenomen datum die op de
      betrokken bedrijfstak en die grenswaarde van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie PER voorkomend in
      afvalwater dat in oppervlaktewateren wordt gebracht:

      a. indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde, met ingang van de in die bijlage opgenomen datum die daarop van toepassing is;

      b. indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die op 31 januari
      1992 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie PER, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 31 januari 1992.
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel5
  - number: '6'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor PER in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005378/1992-01-31#Artikel6
