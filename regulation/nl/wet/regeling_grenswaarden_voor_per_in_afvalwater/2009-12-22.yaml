---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_grenswaarden_voor_per_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0005378
url: https://wetten.overheid.nl/BWBR0005378/2009-12-22
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor het brengen van PER in oppervlaktewateren
    ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 27 juli 1990, 90/415/EEG ( PbEG L
    219/49), tot wijziging van bijlage II bij Richtlijn 86/280/EEG betreffende grenswaarden en kwaliteitsdoelstellingen
    voor lozingen van bepaalde onder lijst I van de bijlage bij Richtlijn 76/464/EEG vallende gevaarlijke stoffen;
    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.a
    text: 'PER: perchloorethyleen;'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.b
    text: 'TRI: trichloorethyleen;'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.c
    text: 'TETRA: tetrachloorkoolstof;'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.d
    text: |-
      verwerken van PER: elk industrieel proces waarbij PER of PER bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij PER of PER bevattende stoffen vrijkomen;
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.e
    text: |-
      bestaand bedrijf: bedrijf dat PER verwerkt, dat op 31 juli 1991 in werking is en waarvan de capaciteit voor het
      verwerken van PER na 31 juli 1991 niet aanzienlijk is uitgebreid;
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.f
    text: 'nieuw bedrijf: bedrijf dat PER verwerkt en geen bestaand bedrijf is;'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.g
    text: |-
      bijlage I: bij deze regeling behorende [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: 1.h
    text: |-
      bijlage II: bij deze regeling behorende [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: 1.i
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.i.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.i.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1.i.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2.1'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie PER voorkomend in
      afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van toepassing
      van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van de in
      [bijlage I][ref1] genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan
      de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: '2.2'
    text: |-
      De in het eerste lid laatstgenoemde grenswaarde geldt met ingang van de in [bijlage I][ref1] opgenomen datum die op
      de betrokken bedrijfstak en die grenswaarde van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie PER voorkomend in
      afvalwater dat wordt geloosd:
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel3
  - number: 3.a
    text: |-
      indien dat bedrijf behoort tot een van de in [bijlage I][ref1] genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde, met ingang van de in die bijlage opgenomen datum die daarop van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: 3.b
    text: |-
      indien dat bedrijf niet behoort tot een in [bijlage I][ref1] genoemde bedrijfstak: de grenswaarden die op
      31 januari 1992 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande
      technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0005378
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005378
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie PER, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 31 januari 1992.
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel5
  - number: '6'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor PER in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005378/2009-12-22#Artikel6
