bwb_id: BWBR0002389
url: https://wetten.overheid.nl/BWBR0002389/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, de mogelijkheid te openen regelen te stellen teneinde
    het hamsteren van goederen in geval van buitengewone omstandigheden tegen te gaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of een
      gedeelte daarvan [artikel 3][ref3] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002389#Artikel3
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002389
        artikel: '3'
  - number: '1.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
  - number: '1.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
  - number: '1.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel1
  - number: '5.1'
    text: |-
      Een ministeriële regeling als bedoeld in [artikel 3][ref1], of een regeling tot wijziging of intrekking daarvan,
      en een besluit als bedoeld in [artikel 4, vierde lid][ref2], treden niet in werking alvorens te zijn bekendgemaakt
      door plaatsing in de *Staatscourant* of op een andere door Onze betrokken Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002389#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002389#Artikel4
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002389
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002389
        artikel: '4'
  - number: '5.2'
    text: |-
      Een besluit als bedoeld in [artikel 4, vierde lid][ref1], treedt niet in werking alvorens het is bekendgemaakt door
      plaatsing in de *Staatscourant* of op een andere door Onze betrokken Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002389#Artikel4
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002389
        artikel: '4'
  - number: 6a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Economische Zaken, Landbouw en Innovatie aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel6a
  - number: 6a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel6a
  - number: 6a.3
    text: |-
      Zo nodig oefent de toezichthouder de in de [artikelen 5:17][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3] genoemde bevoegdheden uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6a.4
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de krachtens deze wet
      opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel6a
  - number: '11.1'
    text: |-
      Een bij of krachtens deze wet opgelegde verplichting vervalt van rechtswege voorzover het voldoen hieraan zou
      meebrengen dat niet kan worden voldaan aan een verplichting die voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een bij of krachtens deze wet opgelegde verplichting die niet voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak, vervalt eveneens van rechtswege voorzover het
      voldoen hieraan zou meebrengen dat niet kan worden voldaan aan een verplichting die bij of krachtens deze of een
      andere wet is opgelegd in het belang van de bestrijding van een ramp, een zwaar ongeval of van een verstoring van
      de openbare orde of van ernstige vrees voor het ontstaan daarvan.
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel11
  - number: '12.1'
    text: Deze wet kan worden aangehaald als "Hamsterwet".
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Met uitzondering van de [artikelen 3-5][ref1] treedt zij in werking met ingang van de dag na de datum van uitgifte
      van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002389#Artikel3
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002389
        artikel: '3'
  - number: '12.3'
    text: |-
      De [artikelen 3 tot en met 5][ref1] treden in werking op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002389#Artikel3
    url: https://wetten.overheid.nl/BWBR0002389/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002389
        artikel: '3'
