        artikel: '3'
  - number: '3'
    text: |-
      1 Onze Minister van Economische Zaken en Klimaat kan regels stellen tot het tegengaan van het hamsteren van
      goederen.

      2 De krachtens het eerste lid gestelde regelen kunnen onder meer inhouden een verbod daarbij aangewezen goederen
      binnen daarbij aangegeven tijdsruimten in grotere dan daarbij aangegeven hoeveelheden af te leveren of in ontvangst
      te nemen.
    url: https://wetten.overheid.nl/BWBR0002389/2019-01-01#Artikel3
  - number: '5'
    text: |-
      1 Een ministeriële regeling als bedoeld in [artikel 3][ref1], of een regeling tot wijziging of intrekking daarvan,
      en een besluit als bedoeld in [artikel 4, vierde lid][ref2], treden niet in werking alvorens te zijn bekendgemaakt
      door plaatsing in de *Staatscourant* of op een andere door Onze betrokken Minister bepaalde wijze.

      2 Een besluit als bedoeld in [artikel 4, vierde lid][ref3], treedt niet in werking alvorens het is bekendgemaakt
      door plaatsing in de *Staatscourant* of op een andere door Onze betrokken Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002389#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002389#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002389#Artikel4
    url: https://wetten.overheid.nl/BWBR0002389/2019-01-01#Artikel5
