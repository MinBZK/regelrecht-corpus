  - number: '11'
    text: |-
      1 Een bij of krachtens deze wet opgelegde verplichting vervalt van rechtswege voorzover het voldoen hieraan zou
      meebrengen dat niet kan worden voldaan aan een verplichting die voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak.

      2 Een bij of krachtens deze wet opgelegde verplichting die niet voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak, vervalt eveneens van rechtswege voorzover het
      voldoen hieraan zou meebrengen dat niet kan worden voldaan aan een verplichting die bij of krachtens deze of een
      andere wet is opgelegd in het belang van de bestrijding van een ramp, een zwaar ongeval of van een verstoring van
      de openbare orde of van ernstige vrees voor het ontstaan daarvan.
    url: https://wetten.overheid.nl/BWBR0002389/2019-01-01#Artikel11
  - number: '12'
    text: |-
      1 Deze wet kan worden aangehaald als "Hamsterwet".

      2 Met uitzondering van de [artikelen 3-5][ref1] treedt zij in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.

      3 De [artikelen 3 tot en met 5][ref2] treden in werking op een bij koninklijk besluit te bepalen tijdstip.


