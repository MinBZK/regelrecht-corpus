  - number: 6a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister van Economische Zaken en Klimaat aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Zo nodig oefent de toezichthouder de in de [artikelen 5:17][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3] genoemde bevoegdheden uit met behulp van de sterke arm.

      4 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de krachtens deze wet
      opgelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0002389/2019-01-01#Artikel6a
