---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: dienstplichtwet_bes
regulatory_layer: WET
publication_date: '2011-10-07'
valid_from: '2011-10-09'
bwb_id: BWBR0028468
url: https://wetten.overheid.nl/BWBR0028468/2011-10-09
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: 1.1.a
    text: '*krijgsmacht:* de krijgsmacht van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: 1.1.b
    text: '*werkelijke dienst:* dienst in de krijgsmacht;'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: 1.1.c
    text: '*dienstplicht:* de verplichting tot het vervullen van werkelijke dienst;'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: 1.1.d
    text: '*dienstplichtige:* hij, die ingevolge deze wet tot werkelijke dienst kan worden opgeroepen;'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: 1.1.e
    text: '*Onze Minister:* Onze Minister van Defensie.'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: '1.2'
    text: |-
      Onder de ingevolge deze wet voor de dienstplicht in te schrijven personen worden uitsluitend mannelijke personen
      verstaan.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: '1.3'
    text: |-
      Waar in deze wet wordt gesproken van personen, die ongeschikt zijn verklaard, van dienstplicht zijn vrijgesteld
      of uitgesloten of te wier aanzien een rechterlijke uitspraak heeft plaats gehad, worden hieronder – voor zover het
      tegendeel niet blijkt – verstaan diegenen omtrent wie het desbetreffende besluit of de desbetreffende uitspraak
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: '1.4'
    text: |-
      Waar in deze wet wordt gesproken van het oproepen in werkelijke dienst, wordt daaronder ten aanzien van hen, die
      zich reeds in werkelijke dienst bevinden, verstaan het houden in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel1
  - number: '2'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel2
  - number: '3'
    text: |-
      Alle stukken, die in verband met de bepalingen van deze wet of te harer uitvoering gegeven voorschriften en
      uitgevaardigde besluiten en beschikkingen worden gevorderd, ingediend, overgelegd of uitgereikt, zijn vrij van het
      recht van zegel.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel3
  - number: '4.1'
    text: |-
      Hij, die voor de dienstplicht is ingeschreven, kan niettemin, ook al is hij als dienstplichtige in werkelijke
      dienst, worden toegelaten tot een vrijwillige verbintenis bij de krijgsmacht. Onze Minister bepaalt in hoeverre
      betrokkene, na voldoening aan zijn vrijwillige verbintenis, geacht kan worden zijn dienstplicht te hebben vervuld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel4
  - number: '4.2'
    text: |-
      Gedurende de staat van oorlog en beleg behoeft de in het eerste lid bedoelde dienstplichtige voorafgaande
      toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel4
  - number: '4.3'
    text: |-
      De bepalingen van deze wet zijn, tenzij anders is overeengekomen, gedurende de tijd der vrijwillige verbintenis,
      voor zover nodig, van toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel4
  - number: '5.1'
    text: |-
      De dienstplichtige, niet in werkelijke dienst, die zich voor langer dan acht maanden naar het buitenland begeeft,
      geeft hiervan voor zijn vertrek kennis aan de Gezaghebber van het eilandgebied van zijn woonplaats. Gelijke
      kennisgeving doet hij bij zijn terugkeer.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel5
  - number: '5.2'
    text: |-
      Bij met redenen omklede beschikking kan Onze Minister tijdelijk bepalen dat de in het vorige lid bedoelde termijn
      wordt ingekort dan wel vervalt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel5
  - number: '6'
    text: |-
      Voor de toepassing en uitvoering dezer wet en derzelver uitvoeringsbesluiten en beschikkingen wordt een commissie
      van advies ingesteld. Deze commissie heet «Dienstplichtraad»; haar samenstelling, taak en werkwijze worden door
      Onze Minister bepaald. Aan deze commissie worden zo mogelijk een officier van de zeemacht en zo nodig een van de
      luchtmacht en een van de landmacht als lid toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel6
  - number: '7'
    text: |-
      Voor zover in deze wet niet anders is of wordt bepaald geschiedt de uitvoering derzelver bepalingen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel7
  - number: '8.1'
    text: 'Voor de dienstplicht wordt behoudens het bepaalde in het tweede lid ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel8
  - number: 8.1.a
    text: |-
      de Nederlander, die op de dag, waarop hij 18 jaar oud wordt en tot de dag, waarop hij 45 jaar oud wordt in het
      bevolkingsregister te zijner woonplaats is opgenomen of had behoren te zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel8
  - number: 8.1.b
    text: |-
      de Nederlander, die zich tussen zijn achttiende en vijfenveertigste jaar in de openbare lichamen Bonaire, Sint
      Eustatius of Saba vestigt en in het bevolkingsregister te zijner woonplaats is opgenomen of had behoren te zijn
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel8
  - number: 8.1.c
    text: |-
      hij, die tussen zijn achttiende en vijfenveertigste jaar Nederlander of opnieuw Nederlander is geworden en in het
      bevolkingsregister te zijner woonplaats is opgenomen of had behoren te zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel8
  - number: '8.2'
    text: |-
      Voor de dienstplicht wordt niet ingeschreven de Nederlander voor zolang hij in werkelijke dienst is bij de
      krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel8
  - number: '9.1'
    text: |-
      De Gezaghebbers der onderscheiden eilandgebieden zijn gehouden de Nederlanders die overeenkomstig het bepaalde
      in het [vorige artikel][ref1] ingeschreven behoren te worden, in te schrijven of te doen inschrijven in een
      dienstplichtregister, waarvan het model door Onze Minister wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel8
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '8'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De Nederlanders bedoeld in het eerste lid van het [vorige artikel onder b en c][ref1] zijn verplicht zich aan
      te melden voor inschrijving in het dienstplichtregister zodra zij in de daar bedoelde omstandigheden komen te
      verkeren. De aanmelding kan geschieden door tussenkomst van een daartoe schriftelijk gemachtigde. Zij geschiedt
      door de wettelijke vertegenwoordiger, indien de aanmeldingsplichtige minderjarig is of onder curatele is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel8
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '8'
        hoofdstuk: II
  - number: '9.3'
    text: |-
      Door of vanwege de Gezaghebbers der onderscheiden eilandgebieden wordt jaarlijks in de maand januari bij Onze
      Minister ingediend een opgave, bevattende naam, geboortedatum, geboorteplaats en beroep van de personen, die in
      het afgelopen jaar in het dienstplichtregister zijn ingeschreven, alsmede van de personen, die overeenkomstig het
      bepaalde in [artikel 10][ref1] daaruit zijn afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel10
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '10'
        hoofdstuk: II
  - number: '9.4'
    text: |-
      De in het vorige lid genoemde organen zijn gehouden van alle wijzigingen betreffende inschrijvingen en
      afschrijvingen onverwijld aantekening in het dienstplichtregister te doen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel9
  - number: '9.5'
    text: Onze Minister kan vorderen, dat hem ook tussentijds gegevens uit het dienstplichtregister worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel9
  - number: '10'
    text: 'Nederlanders worden uit het dienstplichtregister afgeschreven:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.a
    text: bij overlijden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.b
    text: |-
      bij het bereiken van het vijfenveertigste levensjaar, behoudens het geval bedoeld in [artikel 35 derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
  - number: 10.c
    text: bij verlies van het Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.d
    text: bij verhuizing naar een ander deel van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.e
    text: bij verhuizing naar het buitenland;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.f
    text: bij blijvende ongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.g
    text: bij blijvende uitsluiting;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
  - number: 10.h
    text: |-
      bij ontslag uit de werkelijke dienst ingevolge het bepaalde in de [artikelen 35, tweede lid][ref1], en 36a tweede
      lid [bedoeld zal zijn: de artikelen 35, tweede lid, en [36][ref2]].


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel36
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '36'
        hoofdstuk: IX
  - number: '11.1'
    text: |-
      De geschiktheid of ongeschiktheid voor dienst bij de krijgsmacht in verband met lichaamslengte of met ziekten en
      gebreken wordt beoordeeld door een door Onze Minister samen te stellen keuringscommissie van drie geneeskundigen,
      waaraan zo mogelijk één geneeskundige van de krijgsmacht als lid wordt toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.2'
    text: |-
      De voor een keuring opgeroepene is verplicht behoudens in bij algemene maatregel van bestuur aangewezen gevallen
      aan de oproeping gevolg te geven en zich aan de keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.3'
    text: |-
      De in het eerste lid bedoelde beoordeling geschiedt met inachtneming van algemene maatregel van bestuur vast te
      stellen keuringsreglement, waarin voor zoveel mogelijk de voor de krijgsmacht op dit stuk bestaande regelen worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.4'
    text: De uitspraak der keuringscommissie geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.5'
    text: |-
      Een aanvraag voor herkeuring moet door belanghebbende of door zijn wettelijke vertegenwoordiger binnen 2 weken
      na de in het vorige lid bedoelde uitspraak aan de in het zesde lid bedoelde keuringscommissie worden gedaan. De
      aanvraag moet op aannemelijke in het verzoekschrift omschreven gronden berusten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.6'
    text: Ten behoeve van de herkeuring stelt Onze Minister een of meer herkeuringscommissies in.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.7'
    text: |-
      Verschijnt de aanvrager of degeen te wiens behoeve de aanvraag is gedaan niet voor de herkeuringscommissie, dan
      wordt de aanvraag als vervallen beschouwd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.8'
    text: De uitspraak der herkeuringscommissie geschiedt eveneens in het openbaar.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '11.9'
    text: |-
      Voor zover nodig stellen de betrokken bestuurscolleges geneeskundigen ter beschikking voor de samenstelling der
      keurings- en herkeuringscommissies.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel11
  - number: '12.1'
    text: 'De uitspraak van een keuringscommissie of een herkeuringscommissie betreft:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: 12.1.a
    text: geschiktheid voor de dienst bij de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: 12.1.b
    text: geschiktheid voor de dienst bij de krijgsmacht onder voorbehoud van lichte dienst;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: 12.1.c
    text: ongeschiktheid voor de dienst bij de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: 12.1.d
    text: tijdelijke ongeschiktheid voor de dienst bij de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: '12.2'
    text: |-
      Bij uitspraak van een herkeuringscommissie vervalt de uitspraak van een keuringscommissie ten aanzien van de
      betrokkene, tenzij de voorafgaande uitspraak van de keuringscommissie wordt bevestigd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: '12.3'
    text: Na verstrijken van de duur der tijdelijke ongeschiktheid wordt de betrokkene opnieuw voor de keuring opgeroepen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel12
  - number: '13'
    text: 'De bepalingen van dit hoofdstuk zijn niet van toepassing op hen, die:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel13
  - number: 13.a
    text: in werkelijke dienst zijn;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel13
  - number: 13.b
    text: van de militaire dienst zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel13
  - number: '14'
    text: |-
      De in de keuringscommissie of herkeuringscommissie zitting hebbende geneeskundigen zijn verplicht de hun in verband
      met de keuring opgedragen werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel14
  - number: '15.1'
    text: |-
      Vrijstelling van militaire dienst kan worden verleend wegens: a. kostwinnerschap; b. persoonlijke onmisbaarheid;
      c. aanwezigheid van een bijzonder geval; en wordt verleend wegens: d. het bekleden van een geestelijk of een
      godsdienstig menslievend ambt of opleiding tot zodanig ambt; e. broederdienst.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel15
  - number: '15.2'
    text: Omtrent het verlenen van vrijstelling van militaire dienst beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel15
  - number: '15.3'
    text: |-
      Verleende vrijstelling van militaire dienst op grond van het bepaalde in het eerste lid onder a en b kan te allen
      tijde door Onze Minister worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel15
  - number: '15.4'
    text: |-
      Verleende vrijstelling van militaire dienst op grond van het bepaalde in het eerste lid onder c en d, houdt op te
      gelden, zodra de vrijgestelde ophoudt te verkeren in een geval, als onder die rubrieken bedoeld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel15
  - number: '15.5'
    text: |-
      Onnauwkeurige vermelding van namen en voornamen en andere persoonsgegevens in het dienstplichtregister levert geen
      grond op voor vrijstelling van militaire dienst.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel15
  - number: '16.1'
    text: |-
      Vrijstelling wegens kostwinnerschap kan worden verleend, indien door het verblijf van de ingeschrevene
      in werkelijke dienst, behalve in het geval van opkomst voor herhalingsoefeningen, voldoende middelen tot
      levensonderhoud aan andere personen ontbreken of zouden komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: '16.2'
    text: 'Onder de personen, in het vorige lid bedoeld, worden uitsluitend begrepen:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: 16.2.a
    text: de echtgenote van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: 16.2.b
    text: zijn bloed- en aanverwanten in de rechte lijn;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: 16.2.c
    text: degenen, in wier onderhoud de ingeschrevene ingevolge rechterlijk vonnis moet voorzien.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: '16.3'
    text: |-
      Wanneer geen vrijstelling van militaire dienst wordt verleend aan de ingeschrevene, die in het geval bedoeld in
      het eerste lid verkeert, dan wordt krachtens bij algemene maatregel van bestuur, te stellen regelen aan hem op zijn
      verzoek een vergoeding uit 's Lands kas toegekend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel16
  - number: '17'
    text: |-
      Vrijstelling wegens persoonlijke onmisbaarheid kan door Onze Minister worden verleend aan hem door wiens verblijf
      in werkelijke dienst onoverkomelijke bezwaren zouden ontstaan voor de taakvervulling van de Overheid of een
      particuliere organisatie.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel17
  - number: '18'
    text: |-
      Vrijstelling om de reden, genoemd in [artikel 15 lid 1 onder d][ref1], wordt met inachtneming van bij algemene
      maatregel van bestuur vast te stellen regelen verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel15
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '15'
        hoofdstuk: IV
  - number: '19'
    text: |-
      Vrijstelling van dienst wegens broederdienst wordt verleend aan de ingeschrevene die ten minste drie broeders heeft
      of gehad heeft, die op een door Onze Minister te bepalen tijdstip dienen of ten minste dertig dagen gediend hebben
      bij de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel19
  - number: '20'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel20
  - number: '21.1'
    text: 'Onze Minister sluit van de militaire dienst uit degene, die:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
  - number: 21.1.a
    text: |-
      onverminderd het bepaalde in [artikel 30, onderdelen a en b][ref1], in verzekerde bewaring is gesteld, hechtenis of
      gevangenisstraf ondergaat: voor de duur daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel30
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '30'
        hoofdstuk: VII
  - number: 21.1.b
    text: |-
      bij rechterlijke uitspraak in het Koninkrijk is veroordeeld tot een of meer straffen, zwaarder of te zamen zwaarder
      dan een gevangenisstraf van 6 maanden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
  - number: 21.1.c
    text: bij rechterlijke uitspraak is ontzet uit het recht om bij de gewapende macht te dienen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
  - number: '21.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, kan van de dienst worden uitgesloten degene die bij rechterlijk
      uitspraak is veroordeeld terzake van misdrijven als bedoeld in [artikel 133, tweede lid][ref1], alsmede in de
      [artikelen 109][ref2] en [139 van het Wetboek van Militair Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel139
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '133'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '139'
  - number: '21.3'
    text: |-
      Voor de toepassing van het eerste lid wordt degene, die gratie is verleend, geacht slechts te zijn veroordeeld tot
      de straf, welke krachtens de gratie op hem blijft rusten of komt te rusten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
  - number: '21.4'
    text: Onze Minister kan in bijzondere gevallen de uitsluiting, bedoeld in het eerste lid, achterwege laten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel21
  - number: '22.1'
    text: |-
      Alle ingeschrevenen, met uitzondering van hen, die op grond van voorgaande bepalingen niet dienstplichtig zijn
      of van de dienstplicht zijn vrijgesteld of zijn uitgesloten of die niet tot de militaire dienst verplicht zijn
      ingevolge een internationale overeenkomst, welke in de openbare lichamen Bonaire, Sint Eustatius en Saba van
      toepassing is, zijn dienstplichtigen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel22
  - number: '22.2'
    text: |-
      De dienstplichtigen worden onderscheiden in interne en externe dienstplichtigen. Externe dienstplichtige is hij,
      die reeds elders in het Koninkrijk voor eerste oefening is opgeroepen en deze heeft volbracht of geacht wordt te
      hebben volbracht. De interne dienstplichtige is hij, die voor eerste oefening in Aruba, Curaçao of Sint Maarten of
      in de openbare lichamen Bonaire, Sint Eustatius en Saba kan worden opgeroepen tot het vervullen van dienstplicht,
      hetzij deze aldaar heeft volbracht, dan wel geacht kan worden deze aldaar te hebben volbracht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel22
  - number: '22.3'
    text: |-
      Blijkt, dat iemand in meer dan één dienstplichtregister is ingeschreven dan bepaalt Onze Minister voor welk
      eilandgebied de inschrijving achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel22
  - number: '23.1'
    text: |-
      Hij, die voor de werkelijke dienst heeft moeten opkomen en op de tijd en de plaats, voor zijn verschijning bepaald,
      niet is verschenen, meldt zich zodra mogelijk aan bij de door Onze Minister aan te wijzen autoriteit.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel23
  - number: '23.2'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel23
  - number: '24.1'
    text: 'De interne dienstplichtige is verplicht tot het vervullen van werkelijke dienst:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: 24.1.a
    text: voor eerste oefening;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: 24.1.b
    text: voor herhalingsoefeningen;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: 24.1.c
    text: in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: 24.1.d
    text: |-
      in de gevallen bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel30
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '30'
        hoofdstuk: VII
  - number: '24.2'
    text: |-
      De externe dienstplichtige is verplicht tot het vervullen van werkelijke dienst in de gevallen, vermeld in het
      eerste lid onder b, c en d.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: '24.3'
    text: |-
      De interne dienstplichtigen dienen bij de in Aruba, Curaçao of Sint Maarten of in de openbare lichamen Bonaire,
      Sint Eustatius en Saba aanwezige onderdelen van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: '24.4'
    text: |-
      De dienstplichtigen staan onder het militair gezag van het onderdeel der krijgsmacht waarbij zij in werkelijke
      dienst zijn.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel24
  - number: '25.1'
    text: |-
      Oproeping voor eerste oefening en voor herhalingsoefeningen geschiedt door het bestuurscollege. Het besluit
      tot oproeping bevat alle gegevens betreffende de namen of de groepen van personen, die worden opgeroepen,
      het tijdstip waarop en de plaats waar zij zich moeten melden, de aanduiding, met eventuele vermelding van de
      detacheringsbeschikking, van het krijgsmacht-onderdeel, waarbij werkelijke dienst moet worden vervuld, alsmede de
      duur der eerste oefening of der herhalingsoefeningen, waarvoor wordt opgeroepen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel25
  - number: '25.2'
    text: Het in het eerste lid bedoelde besluit wordt bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel25
  - number: '25.3'
    text: |-
      Degenen, die onder de werking van de Schutterijlandsverordening 1940 (P.B. 1940, no. 81), zoals gewijzigd, aan
      hun dienstplicht hebben voldaan, kunnen slechts worden opgeroepen voor herhalingsoefeningen of ingeval van oorlog,
      oorlogsgevaar of andere buitengewone omstandigheden overeenkomstig het bepaalde in [artikel 29][ref1]. De oproeping
      geschiedt met inachtneming van de militaire rang welke laatstelijk werd bekleed.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel29
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '29'
        hoofdstuk: VII
  - number: '26.1'
    text: |-
      Oproeping voor eerste oefening geschiedt zoveel mogelijk met inachtneming van de jaarklasse van inschrijving van de
      dienstplichtigen in het dienstplichtregister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel26
  - number: '26.2'
    text: |-
      De opgeroepen interne dienstplichtigen zullen hun werkelijke dienst bij voorkeur in het eilandgebied hunner
      woonplaats vervullen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel26
  - number: '27.1'
    text: |-
      De duur van de eerste oefening bedraagt ten hoogste 12 maanden. Ten aanzien van dienstplichtigen, die in opleiding
      worden genomen tot officier of onderofficier bedraagt deze termijn hoogstens 12 maanden meer.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel27
  - number: '27.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald door wie en in welke gevallen uitstel van opkomst voor eerste
      oefening kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel27
  - number: '27.3'
    text: |-
      Aan dienstplichtigen die in werkelijke dienst wensen te blijven, nadat de tijd, welke zij in werkelijke dienst
      moeten doorbrengen is verstreken kan dit volgens door Onze Minister van defensie in Nederland, na overleg met Onze
      Minister vast te stellen regelen worden vergund.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel27
  - number: '28.1'
    text: |-
      De duur der herhalingsoefeningen bedraagt al of niet aaneengesloten, ten hoogste drie maanden over een tijdvak van
      3 jaren.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel28
  - number: '28.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald door wie en in welke gevallen uitstel of vrijstelling van
      herhalingsoefeningen kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel28
  - number: 28A
    text: |-
      Een dienstplichtige kan door het militaire gezag, na overleg met Onze Minister, worden aangewezen voor het
      vervullen van dienst buiten het grondgebied van Aruba, Curaçao of Sint Maarten of van de openbare lichamen Bonaire,
      Sint Eustatius en Saba, mits de duur van deze dienst een tijdvak van dertig aaneengesloten dagen niet overschrijdt
      en de dienstplichtige in een tijdvak van twaalf maanden niet meer dan twee en gedurende de herhalingsoefeningen
      in het geheel niet meer dan één maand buiten het grondgebied van Aruba, Curaçao of Sint Maarten of van de openbare
      lichamen Bonaire, Sint Eustatius en Saba dienst vervult.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel28A
  - number: '29'
    text: |-
      Ingeval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden kunnen de dienstplichtigen buitengewoon in
      werkelijke dienst worden gehouden of opgeroepen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel29
  - number: '30'
    text: 'De dienstplichtige kan, als hij voor groot verlof in aanmerking komt, in werkelijke dienst worden gehouden:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel30
  - number: 30.a
    text: |-
      gedurende evenveel dagen als hij voor het ondergaan van straf, door ongeoorloofde afwezigheid of door desertie niet
      aan de dagelijkse dienst heeft deelgenomen;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel30
  - number: 30.b
    text: |-
      zolang dit nodig is voor het ondergaan van straf of voor het onderzoek omtrent een strafbaar feit of een
      krijgstuchtelijk vergrijp waarvan hij verdacht of beklaagd wordt;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel30
  - number: 30.c
    text: |-
      zolang het vertrek met groot verlof gevaar zou opleveren voor verspreiding van een in de etablissementen van de
      krijgsmacht heersende of geheerst hebbende besmettelijke ziekte.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel30
  - number: '31'
    text: Klein verlof genoten gedurende de werkelijke dienst onderbreekt deze niet.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel31
  - number: '32'
    text: |-
      Zolang de dienstplichtige niet in werkelijke dienst is noch in werkelijke dienst behoeft te zijn, is hij in het
      genot van groot verlof.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel32
  - number: '33'
    text: |-
      De dienstplichtige met groot verlof is verplicht om aan door Onze Minister aan te wijzen personen inzage te
      verlenen van aan hem uitgereikte militaire bescheiden alsmede om aan Onze Minister desgevraagd schriftelijk alle in
      verband met zijn dienstplicht gewenste inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel33
  - number: '34'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel34
  - number: '35.1'
    text: |-
      Het ontslag van officieren bij de krijgsmacht, voor zover in Aruba, Curaçao of Sint Maarten of in de openbare
      lichamen Bonaire, Sint Eustatius en Saba dienstplichtig of dienstplichtig geweest zijnde, geschiedt bij koninklijk
      besluit. In de overige gevallen geschiedt het ontslag door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: '35.2'
    text: 'Aan de dienstplichtige in werkelijke dienst wordt ontslag verleend:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.a
    text: |-
      ter zake van het bereiken van de leeftijd van vijfenveertig jaren, voor zover hij op 1 december 1986 in werkelijke
      dienst was;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.b
    text: |-
      wegens wangedrag in de dienst dan wel buiten de dienst, voor zover dit gedrag schadelijk is of kan zijn voor zijn
      dienstvervulling of niet in overeenstemming is met het aanzien van zijn functie;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.c
    text: |-
      wegens onbekwaamheid of ongeschiktheid voor de vervulling van de werkelijke dienst, wat de ongeschiktheid betreft
      voor zover geen sprake is van blijvende ongeschiktheid uit hoofde van een ziekte of gebrek;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.d
    text: |-
      ter zake van blijvende ongeschiktheid voor het vervullen van de dienst uit hoofde van een ziekte of gebrek, nadat
      ter zake van deze ongeschiktheid een geneeskundig onderzoek is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.e
    text: wegens verregaande nalatigheid bij de vervulling van zijn plichten;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: 35.2.f
    text: |-
      wegens een in kracht van gewijsde gegaan vonnis dat is gewezen in verband met een feit van zodanige aard, dat, mede
      gelet op het algemeen gedrag van de militair, diens ontslag in het belang van de dienst noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: '35.3'
    text: |-
      Afschrijving uit het dienstplichtregister, bedoeld in [artikel 10][ref1] geldt als ontslag uit de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel10
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '10'
        hoofdstuk: II
  - number: '35.4'
    text: |-
      In geval van oorlog of oorlogsgevaar of ingeval bedreiging of verstoring van de inwendige orde en rust kan leiden
      tot wezenlijke aantasting van belangen van het Koninkrijk, kan van het tweede lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel35
  - number: '36.1'
    text: |-
      Ontslag van een vrijwillig nadienende dienstplichtige om een van de redenen, genoemd in
      [artikel 35, tweede lid, onderdelen b, c, e en f][ref1], wordt eerst verleend nadat terzake het advies is
      ingewonnen van een door de Regionaal Bevelhebber ingestelde commissie van onderzoek. Bij ontslag op grond
      van artikel 35, tweede lid, onderdeel c, geldt het bij of krachtens dit lid bepaalde alleen voor de langdurig
      vrijwillig nadienende dienstplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
  - number: '36.2'
    text: |-
      De commissie van onderzoek, bedoeld in het eerste lid, voorziet in de mogelijkheid voor de dienstplichtige die
      het onderzoek geldt: kennis te nemen van op de zaak betrekking hebbende stukken, zich te doen bijstaan door een
      raadsman, gehoord te worden en zijn standpunt naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel36
  - number: '36.3'
    text: |-
      Ontslag van een langdurig vrijwillig nadienende dienstplichtige om de reden, genoemd in
      [artikel 35, tweede lid, onderdeel c][ref1], kan slechts plaatsvinden indien naar het oordeel van de Regionaal
      Bevelhebber na een zorgvuldig onderzoek niet mogelijk gebleken is de militair binnen het krijgsmachtdeel waar
      hij werkzaam is, een andere, passende, functie toe te wijzen, dan wel indien hij een zodanige functie weigert te
      aanvaarden. In het onderzoek wordt de mogelijkheid tot bij- of omscholing van de militair betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
  - number: '37.1'
    text: 'Voor de toepassing van deze titel of de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.a
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.b
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.c
    text: |-
      Regionaal Bevelhebber: de door Onze Minister van Defensie aangewezen commandant der Zeemacht in het Caraibisch
      gebied;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.d
    text: |-
      dienstplichtige: hij die dienstplichtige is in de zin van [artikel 1][ref1], met uitzondering van hem op wie de
      Militaire ambtenarenwet 1931 (Stb. 519) van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel1
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '1'
        hoofdstuk: I
  - number: 37.1.e
    text: |-
      vrijwillig nadienende dienstplichtige: de dienstplichtige aan wie op grond van [artikel 27, derde lid][ref1], is
      vergund in werkelijke dienst te blijven of te komen;


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel27
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '27'
        hoofdstuk: VII
  - number: 37.1.f
    text: |-
      tijd van oorlog: oorlog, oorlogsgevaar, alsmede andere buitengewone omstandigheden waarin dienstplichtigen
      buitengewoon in werkelijke dienst zijn;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.g
    text: |-
      officier: de dienstplichtige die de rang van luitenant ter zee der 3de klasse of van tweede-luitenant of een hogere
      rang bekleedt;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.h
    text: |-
      onderofficier: de dienstplichtige die een lagere rang bekleedt dan die van luitenant ter zee der 3de klasse/tweede-
      luitenant;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.i
    text: 'manschappen: de dienstplichtigen die geen rang bekleden;'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: 37.1.j
    text: |-
      dienstplichtige beneden de rang van luitenant ter zee der 3de klasse/tweede-luitenant: de dienstplichtige die
      een lagere rang bekleedt dan die van luitenant ter zee der 3de klasse of die van tweede-luitenant alsmede de
      dienstplichtige die geen rang bekleedt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: '37.2'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: '37.3'
    text: |-
      Voor de toepassing van de artikelen van deze titel, waarin het begrip «commandant» is gebruikt, kan de Regionaal
      Bevelhebber zo nodig voor elk van die artikelen afzonderlijk bepalen welke functionaris moet worden aangemerkt als
      commandant in de zin van het betrokken artikel.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel37
  - number: '38.1'
    text: |-
      Onze Minister kan in tijd van oorlog tijdelijk afwijken of doen afwijken van hetgeen bij of krachtens deze titel is
      bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de operationele taken van de krijgsmacht
      noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel38
  - number: '38.2'
    text: |-
      Ten aanzien van de dienstplichtige die deelneemt aan een opleiding tot het volgen waarvan hij bij opkomst in
      werkelijke dienst is bestemd, kan Onze Minister bijzondere regelen vaststellen die afwijken van deze titel.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel38
  - number: '38.3'
    text: |-
      Onze Minister kan voorts bijzondere regelen, die afwijken van deze titel, vaststellen ten aanzien van
      dienstplichtigen die tewerkgesteld zijn buiten de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel38
  - number: '39.1'
    text: |-
      De dienstplichtige wordt gedurende zijn verblijf in werkelijke dienst, naar voorwaarden door de Regionaal
      Bevelhebber te stellen, opgelegd tot het verkrijgen van de bekwaamheid, vereist voor de militaire hoedanigheid die
      hij bezit of waarvoor hij is bestemd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel39
  - number: '39.2'
    text: |-
      De dienstplichtige in werkelijke dienst kan voorts, al dan niet op eigen verzoek, worden aangewezen voor het volgen
      van andere opleidingen dan in het vorige lid bedoeld, indien het volgen daarvan, naar het oordeel van de Regionaal
      Bevelhebber, van belang is voor de dienst.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel39
  - number: '40.1'
    text: |-
      Aan de aanwijzing op verzoek van de dienstplichtige voor het volgen van een opleiding als bedoeld in het tweede lid
      van het vorige artikel kunnen, indien hiervoor naar het oordeel van de Regionaal Bevelhebber aanleiding bestaat,
      door Onze Minister bepaalde voorwaarden worden verbonden, welke hieruit kunnen bestaan, dat aan de dienstplichtige
      de verplichting wordt opgelegd:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel40
  - number: 40.1.a
    text: |-
      voor de aanvang van de opleiding een verzoek in te dienen hem – met toepassing van [artikel 27, derde lid][ref1] –
      te vergunnen om een door Onze Minister te bepalen tijdsduur in werkelijke dienst door te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel27
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '27'
        hoofdstuk: VII
  - number: 40.1.b
    text: |-
      indien de vergunning, bedoeld onder a, is verleend, gedurende de tijd waarop die vergunning betrekking heeft, in
      werkelijke dienst te blijven.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel40
  - number: '40.2'
    text: |-
      Wanneer de dienstplichtige wegens omstandigheden, die naar het oordeel van de Regionaal Bevelhebber niet zijn
      ontstaan door eigen wil of toedoen, wordt ontheven van een opleiding of van de functie waarop de opleiding
      betrekking had, dan wel niet wordt aangewezen voor de functie waarop de opleiding betrekking had, wordt hij tevens
      door Onze Minister ontheven van de verplichting bedoeld in het vorige lid onder b, indien deze op hem rust.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel40
  - number: '41.1'
    text: |-
      Een dienstplichtige die is aangewezen voor het volgen van een opleiding als bedoeld in [artikel 39][ref1], kan
      daarvan op voordracht van de Regionaal Bevelhebber, door Onze Minister worden ontheven, indien hij niet voldoet aan
      de bij die opleiding gestelde eisen of indien ontheffing in het belang van de dienst of van de dienstplichtige om
      andere redenen noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel39
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '39'
        hoofdstuk: '2'
  - number: '41.2'
    text: |-
      Wanneer is besloten een dienstplichtige van een opleiding te ontheffen wordt hem dit door Onze Minister, met
      vermelding van de reden, onverwijld schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel41
  - number: '42.1'
    text: |-
      Een dienstplichtige heeft, voorzover hij is aangewezen voor het volgen van een opleiding aan een niet-militaire
      opleidingsinrichting, aanspraak op vergoeding van de aan die opleiding verbonden noodzakelijke en te zijnen laste
      komende kosten, met dien verstande dat de vergoeding geheel of gedeeltelijk door of namens Onze Minister kan worden
      verleend in de vorm van rechtstreekse betaling van de verschuldigde kosten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel42
  - number: '42.2'
    text: |-
      Een vergoeding als bedoeld in het vorige lid kan in door Onze Minister aan te wijzen gevallen eveneens door of
      namens hem worden verleend aan een dienstplichtige die een opleiding volgt aan een militaire opleidingsinrichting.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel42
  - number: '42.3'
    text: De vergoeding, bedoeld in de vorige leden, wordt verleend onder door Onze Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel42
  - number: '43.1'
    text: |-
      Aan de aanwijzing op verzoek voor het volgen van een opleiding als bedoeld in [artikel 39, tweede lid][ref1], kan
      de verplichting worden verbonden tot gehele of gedeeltelijke terugbetaling van hetgeen aan of ten behoeve van de
      dienstplichtige tijdens of in verband met de opleiding is betaald indien hij wegens omstandigheden die naar het
      oordeel van de Minster zijn ontstaan door eigen wil of toedoen:


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel39
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '39'
        hoofdstuk: '2'
  - number: 43.1.a
    text: wordt ontheven van de opleiding;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel43
  - number: 43.1.b
    text: |-
      voordat de tijd, die hem is vergund in werkelijke dienst te blijven is verstreken, wordt ontheven van de functie
      waarvoor hij is opgeleid, dan wel met groot verlof wordt gezonden of uit de dienst wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel43
  - number: '43.2'
    text: Onder de kosten van de opleiding vallen niet de tijdens de opleiding genoten militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel43
  - number: '43.3'
    text: |-
      Onze Minister kan in zeer bijzondere gevallen de dienstplichtige op wie de verplichting rust tot de in het eerste
      lid bedoelde terugbetaling, geheel of gedeeltelijk van die verplichting ontheffen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel43
  - number: '44.1'
    text: |-
      Om voor benoeming tot officier of voor bevordering in aanmerking te kunnen komen moet de dienstplichtige
      in werkelijke dienst, onverminderd de overige bij dit hoofdstuk gestelde eisen, bij goed gedrag, goede
      plichtsbetrachting en goede dienstijver, de vereiste bekwaamheid en geschiktheid bezitten, waaronder in beginsel
      mede wordt verstaan verplaatsbaarheid, voor de rang of de klasse die hij bij benoeming of bevordering zal
      verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel44
  - number: '44.2'
    text: |-
      Voor benoeming tot officier en voor bevordering, behoudens bevordering in klasse, is bovendien vereist dat de
      dienstplichtige in werkelijke dienst blijk* heeft gegeven gezag te kunnen uitoefenen of de aanleg daartoe te
      bezitten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel44
  - number: '44.3'
    text: |-
      Benoeming tot officier en bevordering, behoudens bevordering in klasse of buitengewone bevordering als bedoeld in
      [artikel 50][ref1], vinden slechts plaats voor zover in de desbetreffende rang een vacature bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel50
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '45.1'
    text: |-
      De dienstplichtige in werkelijke dienst, die een opleiding volgt voor een bepaalde rang kan, in afwijking van de
      [artikelen 58][ref1] en [60][ref2] tijdens die opleiding op door de Regionaal Bevelhebber te bepalen tijdstippen
      worden bevorderd tot een klasse of tot een rang, lager dan die waarvoor hij wordt opgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel60
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '58'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '45.2'
    text: |-
      Nadat de in het vorige lid bedoelde dienstplichtige een opleiding voor een rang met gunstige uitslag heeft
      voltooid, wordt hij, indien hij overigens voldoet aan de in dit hoofdstuk gestelde eisen, op een door de Regionaal
      Bevelhebber te bepalen tijdstip bevorderd tot die rang.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel45
  - number: '46.1'
    text: |-
      Voor vrijwillig nadienende of nagediend hebbende officieren en onderofficieren* bestaat een door Onze Minister aan
      te houden ranglijst, waarin per rang zij, die de rang definitief bekleden, worden vermeld naar orde van de datum
      met ingang waarvan zij die rang laatstelijk hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
  - number: '46.2'
    text: |-
      De in het vorige lid bedoelde dienstplichtige wordt van de ranglijst afgevoerd met ingang van de dag van zijn
      afschrijving uit het dienstplichtregister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
  - number: '46.3'
    text: |-
      Onze Minister kan met betrekking tot de datum naar orde waarvan dienstplichtigen als in het eerste lid bedoeld in
      de ranglijst worden vermeld, voor die dienstplichtigen in gunstige zin afwijken van het in dat lid bepaalde ten
      aanzien van diegene die aanvankelijk voor bevordering is voorbijgegaan wegens:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
  - number: 46.3.a
    text: |-
      het verkeren in de omstandigheden, genoemd in [artikel 52, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel52
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '52'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 46.3.b
    text: |-
      het verkregen in de omstandigheid dat hij om redenen van dienstbelang dan wel wegens een ziekte of een gebrek,
      verband houdende met de uitoefening van de dienst, niet heeft kunnen voldoen aan een of meer voor bevordering
      gestelde eisen, doch alleen indien het voorbijgaan voor bevordering uitsluitend aan die omstandigheid te wijten
      was;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
  - number: 46.3.c
    text: |-
      het tengevolge van omstandigheden buiten zijn schuld, anders dan bedoeld onder b, niet voldoen aan een of meer voor
      bevordering gestelde eisen, doch alleen indien het voorbijgaan voor bevordering uitsluitend aan die omstandigheden
      te wijten was.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel46
  - number: '47.1'
    text: |-
      Bevordering geschiedt van de definitief beklede klasse of rang tot de onmiddellijk op die definitief beklede klasse
      of rang volgende hogere klasse, rang dan wel hogere rang.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel47
  - number: '47.2'
    text: |-
      Dienstplichtigen in werkelijke dienst, die dezelfde rang bekleden en naar orde van dezelfde datum in de ranglijst
      zijn geplaatst, worden gelijktijdig voor bevordering in beschouwing genomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel47
  - number: '48.1'
    text: |-
      In bijzondere gevallen kan de dienstplichtige in werkelijke dienst, ongeacht of hij voldoet aan alle eisen voor
      bevordering, tijdelijk tot een bepaalde rang worden bevorderd voor de tijd gedurende welke die dienstplichtige is
      geplaatst in een functie, aan de vervulling waarvan naar het oordeel van de Regionaal Bevelhebber het bekleden van
      die rang noodzakelijk is verbonden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel48
  - number: '48.2'
    text: |-
      Wanneer de dienstplichtige die een rang tijdelijk bekleedt, wordt ontheven van de functie, bedoeld in het vorige
      lid, dan wel wanneer zijn bestemming voor die functie wordt ingetrokken, keert hij op de dag van die ontheffing of
      intrekking van rechtswege terug tot de rang of klasse die hij definitief bekleedt, tenzij er naar het oordeel van
      de Regionaal Bevelhebber redenen aanwezig zijn om anders te bepalen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel48
  - number: '48.3'
    text: |-
      Is de ontheffing, bedoeld in het vorige lid, een gevolg van een ziekte of een gebrek, verband houdende met de
      uitoefening van de dienst, dan blijft de dienstplichtige de rang tijdelijk bekleden gedurende de tijd dat hij
      wegens die ziekte of dat gebrek verhinderd is dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel48
  - number: '48.4'
    text: |-
      In het besluit tot een tijdelijke bevordering worden de reden en het tijdelijke karakter van die bevordering
      uitdrukkelijk vermeld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel48
  - number: '48.5'
    text: |-
      Wanneer de dienstplichtige in werkelijke dienst die een rang tijdelijk bekleedt, overlijdt, wordt hij geacht die
      tijdelijke rang definitief bekleed te hebben op het tijdstip van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel48
  - number: '49'
    text: Aan de dienstplichtige in werkelijke dienst kan in het kader van een opleiding een titulaire rang worden verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel49
  - number: '50.1'
    text: |-
      De dienstplichtige in werkelijke dienst kan in afwijking van een of meer bepalingen van dit hoofdstuk buitengewoon
      worden bevorderd ter beloning van een schitterend wapenfeit of van een andere daad of verrichting waardoor hij zich
      zeer bijzonder heeft onderscheiden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel50
  - number: '50.2'
    text: |-
      De aanleiding tot een bevordering als bedoeld in het vorige lid wordt uitdrukkelijk vermeld in het besluit waarbij
      de dienstplichtige buitengewoon wordt bevorderd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel50
  - number: '51.1'
    text: |-
      De dienstplichtige, die wegens een omstandigheid als bedoeld in [artikel 46, derde lid, onder b][ref1], niet heeft
      kunnen voldoen aan een of meer voor bevordering gestelde eisen en uitsluitend op grond daarvan voor bevordering is
      voorbijgegaan, wordt bevorderd met ingang van de dag waarop hij aan alle eisen voor bevordering heeft voldaan, ook
      al mocht op die dag in de nieuwe rang geen vacature bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel46
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '51.2'
    text: |-
      In een geval als bedoeld in het vorige lid, wordt de dienstplichtige tijdelijk bevorderd tot de naasthogere rang
      voor de tijd die redelijkerwijs nodig is om aan de in het vorige lid bedoelde eisen voor bevordering alsnog te
      voldoen. Het bepaalde in het vierde en vijfde lid van [artikel 48][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel48
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '52.1'
    text: 'De dienstplichtige in werkelijke dienst wordt niet bevorderd zolang hij:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel52
  - number: 52.1.a
    text: in tijd van oorlog om welke reden dan ook is afgescheiden van de eigen of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel52
  - number: 52.1.b
    text: in tijd van vrede is vermist.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel52
  - number: '52.2'
    text: |-
      De dienstplichtige in werkelijke dienst die voor bevordering is voorbijgegaan uitsluitend op grond van de
      omstandigheid in het vorige lid onder a bedoeld, wordt, tenzij zijn houding en gedragingen tegenover de vijand of
      zijn andere gedragingen gedurende zijn afwezigheid naar het oordeel van Onze Minister daarvoor onvoldoende reden
      dan wel daartegen bezwaar opleveren, bevorderd met ingang van de dag van zijn terugkeer, ook al mocht op die dag in
      de nieuwe rang geen vacature bestaan.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel52
  - number: '52.3'
    text: |-
      De dienstplichtige in werkelijke dienst die voor bevordering is voorbijgegaan uitsluitend op grond van de
      omstandigheid in het eerste lid onder b bedoeld, wordt met ingang van de dag van zijn terugkeer bevorderd, ook al
      mocht op die dag in de nieuwe rang geen vacature bestaan.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel52
  - number: '53'
    text: |-
      Wanneer een dienstplichtige in werkelijke dienst voor bevordering wordt voorbijgegaan, wordt hem dit, met
      vermelding van de reden, schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel53
  - number: '54.1'
    text: Benoeming tot officier geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel54
  - number: '54.2'
    text: |-
      Om in aanmerking te kunnen komen voor benoeming tot officier moet de dienstplichtige, onverminderd de overige bij
      dit hoofdstuk gestelde eisen, met gunstig gevolg de daarvoor vereiste opleiding hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel54
  - number: '54.3'
    text: |-
      De aanwijzing voor het volgen van de opleiding tot officier geschiedt door de Regionaal Bevelhebber naar behoefte
      en bij keuze.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel54
  - number: '54.4'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel54
  - number: '55.1'
    text: De dienstplichtige die is benoemd tot officier legt de eed of belofte af.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel55
  - number: '55.2'
    text: De eed of belofte wordt zo spoedig mogelijk na de benoeming tot officier afgelegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel55
  - number: '55.3'
    text: |-
      De eed of belofte wordt afgelegd in handen van een door Onze Minister aan te wijzen functionaris en op door Onze
      Minister te bepalen wijze en luidt: «Ik zweer (beloof) trouw aan de Koning(in), gehoorzaamheid aan de wetten en
      onderwerping aan de krijgstucht. Zo waarlijk helpe mij God Almachtig (Dat beloof ik)».
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel55
  - number: '56.1'
    text: Bevordering van officieren geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel56
  - number: '56.2'
    text: |-
      Bevordering tot de rang van luitenant ter zee der 2de klasse jongste categorie/eerste-luitenant* geschiedt in
      volgorde van rangschikking.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel56
  - number: '56.3'
    text: |-
      Bevordering tot de rang van luitenant ter zee der 2de klasse oudste categorie/kapitein geschiedt bij keuze na het
      volbrengen van een door Onze Minister vast te stellen minimum diensttijd in de definitief beklede rang.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel56
  - number: '57.1'
    text: |-
      Bevordering tot de rang van korporaal geschiedt, met inachtneming van de bepalingen van dit hoofdstuk, door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel57
  - number: '57.2'
    text: |-
      Om in aanmerking te kunnen komen voor bevordering tot de rang van korporaal, moet de dienstplichtige in werkelijke
      dienst de daarvoor vereiste opleiding met gunstige uitslag hebben voltooid.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel57
  - number: '57.3'
    text: |-
      De aanwijzing door de Regionaal Bevelhebber voor het volgen van de opleiding tot korporaal geschiedt naar behoefte
      en bij keuze.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel57
  - number: '57.4'
    text: |-
      In zeer bijzondere gevallen kan een dienstplichtige in werkelijke dienst, zonder daarvoor een opleiding te hebben
      gevolgd tot de rang van korporaal worden bevorderd indien hij naar het oordeel van de Regionaal Bevelhebber een
      bijzondere geschiktheid blijkt te bezitten voor het vervullen van een functie waaraan de rang van korporaal is
      verbonden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel57
  - number: '58'
    text: Bevordering tot de rang van sergeant, sergeant-majoor en adjudant onderofficier geschiedt door Onze Minster.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel58
  - number: '59.1'
    text: |-
      De dienstplichtige die het is vergund om op grond van [artikel 27, 3de lid][ref1] tenminste 1 jaar langer in
      werkelijke dienst te blijven of te komen legt bij bevordering tot de rang van korporaal de eed of belofte af.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel27
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '27'
        hoofdstuk: VII
  - number: '59.2'
    text: De eed of belofte wordt zo spoedig mogelijk na bevordering tot de rang van korporaal afgelegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel59
  - number: '59.3'
    text: |-
      Het gestelde in [artikel 55, 3de lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel55
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '60.1'
    text: Bevordering in klasse geschiedt, met inachtneming van de bepalingen van dit hoofdstuk, door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel60
  - number: '60.2'
    text: |-
      Bevordering in klasse geschiedt indien de dienstplichtige een diensttijd heeft in zijn klasse van tenminste negen
      maanden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel60
  - number: '61.1'
    text: |-
      Aan de dienstplichtige in werkelijke dienst kan, indien dit naar het oordeel van de Regionaal Bevelhebber in het
      belang van de dienst noodzakelijk is, als maatregel van orde tijdelijk worden verboden aan zijn functie verbonden
      werkzaamheden of andere werkzaamheden en/of diensten te verrichten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel61
  - number: '61.2'
    text: |-
      Het verbod als maatregel van orde wordt onverwijld schriftelijk ter kennis van de dienstplichtige gebracht, onder
      mededeling van de reden(en) die tot het verbod leiden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel61
  - number: '61.3'
    text: |-
      Het in het eerste lid bedoelde verbod wordt ingetrokken, zodra het belang van de dienst zich niet langer verzet
      tegen het verrichten van dienst, doch uiterlijk na drie maanden, tenzij Onze Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel61
  - number: '62.1'
    text: |-
      De dienstplichtige in werkelijke dienst beneden de rang van luitenant ter zee de 3de klasse-tweede-luitenant,
      dienende in een rang of klasse waartoe hij definitief is bevorderd, kan bij administratieve maatregel worden
      teruggesteld tot de rang of de klasse – niet zijnde van tijdelijke aard – die hij het laatst voor zijn bevordering
      bekleedde, indien:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel62
  - number: 62.1.a
    text: |-
      hij naar het oordeel van degene die tot terugstellen bevoegd is – anders dan om medische redenen – ongeschikt is om
      in zijn functie te dienen in de rang of de klasse die hij bekleedt, en
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel62
  - number: 62.1.b
    text: |-
      er tevens geen reden of mogelijkheid aanwezig is hem, met behoud van zijn rang of klasse, te werk te stellen in een
      andere functie.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel62
  - number: '62.2'
    text: |-
      Een dienstplichtige als bedoeld in het eerste lid die een rang bekleedt, kan, indien hij niet alleen ongeschikt is
      om in die rang te dienen, maar tevens ongeschikt wordt geacht in enige lagere rang een functie te vervullen, worden
      teruggesteld tot de 1ste klasse van de stand van matroos of marinier, of, indien hiervoor redenen aanwezig zijn,
      tot een lagere klasse van die stand.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel62
  - number: '62.3'
    text: |-
      De terugstelling bij administratieve maatregel wordt onverwijld schriftelijk ter kennis van de dienstplichtige
      gebracht, onder mededeling van de reden(en) die tot de terugstelling leidden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel62
  - number: '63.1'
    text: |-
      De dienstplichtige in werkelijke dienst beneden de rang van luitenant ter zee der 3de klasse/tweede luitenant*,
      kan op zijn verzoek bij administratieve maatregel worden teruggesteld, maar alleen in die gevallen, waarin daarvoor
      naar het oordeel van degene die tot terugstellen bevoegd is, gegronde redenen aanwezig zijn en mits de belangen van
      de dienst zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel63
  - number: '63.2'
    text: |-
      De dienstplichtige in werkelijke dienst die heeft verzocht om toelating tot een opleiding, wordt, indien de
      rang of de klasse die hij bekleedt die toelating zou beletten, in geval van aanwijzing voor die opleiding bij
      administratieve maatregel teruggesteld tot die rang of klasse, die daartegen geen beletsel vormt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel63
  - number: '64.1'
    text: |-
      De dienstplichtige die wordt ontheven van een opleiding, kan, indien hij tijdens en in verband met die opleiding
      is bevorderd, met ingang van de dag van die ontheffing bij administratieve maatregelen worden teruggesteld tot
      een door de Regionaal Bevelhebber te bepalen rang of klasse, niet lager dan die welke hij het laatst voor zijn
      plaatsing bij de opleiding definitief bekleede.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel64
  - number: '64.2'
    text: |-
      Aan de dienstplichtige die wordt ontheven van een opleiding, kan, indien hem tijdens en in verband met die
      opleiding een titulaire rang is verleend, die rang met ingang van de dag van die ontheffing bij Administratieve
      maatregelen worden ontnomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel64
  - number: '65'
    text: |-
      De terugstelling bij administratieve maatregel geschiedt door Onze Minister, die deze bevoegdheid kan overdragen
      aan de Regionaal Bevelhebber.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel65
  - number: '66.1'
    text: |-
      Op de dienstplichtige in werkelijke dienst is, gedurende de tijd dat hij werkelijke dienst verricht onder bevel van
      de Regionaal Bevelhebber, de werk- en rusttijdenregeling, vervat in het Reglement rechtstoestand dienstplichtigen
      (Stb. 1982, no. 280), met uitzondering van artikel 26 van dat reglement, van overeenkomstige toepassing, met
      dien verstande dat op de feestdagen, genoemd in de regelingen geldende voor landsdienaren, de dienstplichtige in
      beginsel geen werkzaamheden of diensten worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel66
  - number: '66.2'
    text: |-
      Voor de dienstplichtige in werkelijke dienst wordt de vergoeding ter zake van extra beslaglegging geregeld bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel66
  - number: '67'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn, gedurende de tijd dat hij werkelijke dienst verricht onder
      bevel van de Regionaal Bevelhebber, de paragrafen 1, 2, 4 en 5 van hoofdstuk 6 van het Reglement rechtstoestand
      dienstplichtigen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel67
  - number: '68.1'
    text: |-
      Voor de dienstplichtigen worden bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld
      betreffende de bezoldiging en verdere inkomsten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel68
  - number: '68.2'
    text: |-
      Terzake van de vakantie-uitkering zijn de regelingen, die gelden voor de landsdienaren van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel68
  - number: '69'
    text: |-
      Op de dienstplichtige en de gewezen dienstplichtige zijn de bepalingen betreffende de inhouding, het beslag en de
      korting, opgenomen in de [Ambtenarenwet BES][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '70'
    text: |-
      De vrijwillig nadienende dienstplichtige wordt voor zover betreft de regeling van zijn pensioen gelijkgesteld
      met de overheidsdienaar in de zin van de [Pensioenwet ambtenaren BES][ref1], mits hij niet verkeert in een van de
      omstandigheden, bedoeld in het [eerste lid van artikel 6 van die wet][ref2]. De bepalingen van de genoemde wet zijn
      alsdan op hem van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028714
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel6
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028714
      - id: ref2
        bwb_id: BWBR0028714
        artikel: '6'
  - number: '71.1'
    text: |-
      Op de dienstplichtige in werkelijke dienst, alsmede op de niet in werkelijke dienst verblijvende dienstplichtige
      en de gewezen dienstplichtige, die lijden aan een ziekte of een gebrek verband houdende met de uitoefening van de
      dienst, zijn de regelen betreffende aanspraken en verplichtingen in verband met de gezondheidszorg gegeven bij of
      krachtens hoofdstuk 7 van het Reglement rechtstoestand dienstplichtigen van overeenkomstige toepassing, echter met
      uitzondering van het bepaalde bij of krachtens [artikel 66][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel66
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '66'
        hoofdstuk: '5'
  - number: '71.2'
    text: |-
      De in het eerste lid bedoelde regelen zijn ook van toepassing, wanneer de dienstplichtige in werkelijke dienst zich
      anders dan om redenen van dienst buiten Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba bevindt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel71
  - number: '73'
    text: |-
      Hij, die ingevolge de bepalingen van deze titel aanspraak kan doen gelden op een vergoeding van of tegemoetkoming
      in kosten, dan wel op een uitkering, kan in door Onze Minister aan te wijzen gevallen in aanmerking komen voor een
      geldelijk voorschot op de vergoeding, tegemoetkoming of uitkering.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel73
  - number: '74.1'
    text: |-
      Aan de dienstplichtige in werkelijke dienst voor eerste oefening wordt, onder voorwaarden door Onze Minister te
      stellen, van overheidswege huisvesting verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel74
  - number: '74.2'
    text: |-
      Aan de dienstplichtige kan gedurende zijn verblijf in werkelijke dienst anders dan voor eerste oefening, onder
      voorwaarden door Onze Minister te stellen, van overheidswege huisvesting worden verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel74
  - number: '74.3'
    text: |-
      De huisvesting van overheidswege wordt zoveel mogelijk verleend bij de eenheid of het onderdeel waarbij de
      dienstplichtige is tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel74
  - number: '74.4'
    text: |-
      De dienstplichtige in werkelijke dienst voor eerste oefening is verplicht gebruik te maken van de gelegenheid tot
      nachtverblijf die hem krachtens het eerste lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel74
  - number: '74.5'
    text: |-
      Onder voorwaarden door Onze Minister of daartoe door hem aan te wijzen functionarissen te stellen, kan de
      dienstplichtige in werkelijke dienst voor eerste oefening worden vrijgesteld van de verplichting, bedoeld in het
      vorige lid.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel74
  - number: '75.1'
    text: |-
      Aan de dienstplichtige in werkelijke dienst voor eerste oefening wordt gedurende zijn verblijf in werkelijke
      dienst, onder voorwaarden door Onze Minister te stellen, van overheidswege voeding verstrekt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel75
  - number: '75.2'
    text: |-
      Aan de dienstplichtige kan gedurende zijn verblijf in werkelijke dienst anders dan voor eerste oefening onder
      voorwaarden door Onze Minister te stellen, van overheidswege voeding worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister kan bepalen dat de verstrekking van huisvesting van rijkswege geschiedt in combinatie met de
      verstrekking van voeding van overheidswege.2
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel75
  - number: '76'
    text: |-
      De dienstplichtige in werkelijke dienst heeft aanspraak op vervoer van overheidswege bij reizen in zijn persoonlijk
      belang naar de woonplaats van zijn gezin, mits gelegen in Aruba, Curaçao of Sint Maarten of in de openbare lichamen
      Bonaire, Sint Eustatius en Saba, en terug:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: 76.a
    text: bij hem toekomend vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: 76.b
    text: bij permissie voor gezinsbezoek, doch ten hoogste tweemaal gedurende een periode van twaalf kalendermaanden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: 76.c
    text: |-
      indien hij ongehuwd is: wanneer een van zijn ouders, stief- of pleegouders in levensgevaar verkeert of is
      overleden, in het laatste geval slechts indien hij de begrafenis kan bijwonen;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: 76.d
    text: |-
      indien hij gehuwd is: wanneer zijn echtgenote, een van zijn kinderen, stief- of pleegkinderen in levensgevaar
      verkeert of is overleden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: 76.e
    text: |-
      indien hij gehuwd is: wanneer naar het oordeel van Onze Minister omstandigheden in het gezin voortijdige terugkeer
      of overkomst noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel76
  - number: '77.1'
    text: 'De niet in werkelijke dienst verblijvende dienstplichtige en de gewezen dienstplichtige die:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel77
  - number: 77.1.a
    text: |-
      in door Onze Minister aan te wijzen gevallen moeten reizen teneinde te voldoen aan een oproep van het bevoegde
      gezag, of
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel77
  - number: 77.1.b
    text: moeten reizen ter verwezenlijking van geneeskundige verzorging voor rekening van overheid,
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel77
  - number: '77.2'
    text: |-
      Indien een dienstplichtige als bedoeld in het vorige lid naar het oordeel van de functionaris bij wie hij zich moet
      vervoegen, niet alleen kan reizen, zijn de vorige leden van overeenkomstige toepassing op degene die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel77
  - number: '78.1'
    text: 'De niet in werkelijke dienst verblijvende dienstplichtige en de gewezen dienstplichtige die inkomsten derven:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel78
  - number: 78.1.a
    text: wegens het in door Onze Minister aan te wijzen gevallen voldoen aan een oproep van het bevoegde gezag, of
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel78
  - number: 78.1.b
    text: wegens de verwezenlijking van geneeskundige verzorging voor rekening van de overheid,
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel78
  - number: '78.2'
    text: |-
      Indien een dienstplichtige als bedoeld in het vorige lid naar het oordeel van de functionaris bij wie hij zich moet
      vervoegen, niet alleen kan reizen, zijn de vorige leden van overeenkomstige toepassing op degene die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel78
  - number: '79.1'
    text: |-
      Indien een dienstplichtige in werkelijke dienst om redenen van dienst verblijft in Aruba, Curaçao of Sint Maarten
      of in de openbare lichamen Bonaire, Sint Eustatius en Saba en aldaar wordt verpleegd in een ziekeninrichting,
      terwijl de plaats waar hij wordt verpleegd buiten zijn woonplaats is gelegen, kan aan zijn echtgenote en kinderen
      of, indien hij ongehuwd is, aan zijn ouders een tegemoetkoming worden verleend in de noodzakelijk gemaakte
      reiskosten voor het bezoeken van de dienstplichtige indien naar het oordeel van de behandelend arts overkomst
      gewenst is.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: '79.2'
    text: |-
      In het in het vorige lid bedoelde geval kan aan genoemde betrekkingen ook een tegemoetkoming worden verleend in de
      noodzakelijk gemaakte verblijfkosten:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: 79.2.a
    text: wanneer niet in één dag heen en weer kan worden gereisd, ter zake van één overnachting;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: 79.2.b
    text: wanneer er sprake is van levensgevaar, zolang dit gevaar voortduurt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: '79.3'
    text: De in het eerste en tweede lid onder a bedoelde tegemoetkoming wordt maximaal eenmaal per kalendermaand verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: '79.4'
    text: |-
      Bij levensgevaar kan de in het eerste en tweede lid bedoelde tegemoetkoming ook worden verleend indien de
      dienstplichtige zich om redenen van dienst buiten Aruba, Curaçao of Sint Maarten of buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba bevindt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: '79.5'
    text: Onze Minister kan terzake nadere voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel79
  - number: '80.1'
    text: |-
      De dienstplichtige die voor eerste oefening in werkelijke dienst verblijft en die – ten einde zich in zijn vrije
      tijd voor te bereiden op de uitoefening van een beroep of bedrijf na het verlaten van de werkelijke dienst –
      een cursus volgt bij een instelling voor schriftelijk of mondeling onderwijs, heeft, naar voorwaarden door Onze
      Minister te stellen, aanspraak op een tegemoetkoming in de kosten aan lesgelden, studiemateriaal en examengelden,
      die aan het volgen van de cursus zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel80
  - number: '80.2'
    text: |-
      De vrijwillig nadienende dienstplichtige die voor eigen rekening een studie of opleiding volgt of heeft voltooid
      die naar het oordeel van de Regionaal Bevelhebber mede dan wel volledig in het belang van de dienst is, kan,
      volgens regels en onder voorwaarden door Onze Minister te stellen, in aanmerking komen voor een tegemoetkoming in
      de aan de studie of opleiding verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel80
  - number: '81.1'
    text: |-
      De dienstplichtige in werkelijke dienst wiens persoonlijke eigendommen door omstandigheden, verband houdende
      met de uitoefening van de dienst, geheel of gedeeltelijk verloren zijn gegaan of zijn beschadigd, kan deswege,
      in door Onze Minister aan te wijzen gevallen en naar door hem te stellen voorwaarden, aanspraak maken op een
      schadevergoeding, voor zover daarop niet uit anderen hoofde aanspraak bestaat. Het vorenstaande geldt eveneens ten
      aanzien van goederen die door derden aan de zorgen van de dienstplichtige zijn toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel81
  - number: '81.2'
    text: |-
      Bij het bepalen van het bedrag van de vergoeding wordt rekening gehouden met de mate waarin het verlies of de
      beschadiging mede aan de dienstplichtige zelf is te wijten, en met andere door Onze Minister aan te wijzen factoren
      die van invloed kunnen zijn op het bedrag van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel81
  - number: '82.1'
    text: |-
      De dienstplichtige in werkelijke dienst heeft met betrekking tot de uniformkleding en andere goederen, behorende
      tot zijn persoonlijke standaarduitrusting, aanspraak hetzij op een verstrekking van overheidswege en voor rekening
      van de overheid in natura, hetzij op een tegemoetkoming in de kosten van aanschaffing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel82
  - number: '82.2'
    text: |-
      Met betrekking tot de uniformkleding en andere goederen, bedoeld in het vorige lid, die de dienstplichtige in
      eigendom moet hebben, kan hem een tegemoetkoming worden verleend in de kosten van onderhoud en vernieuwing en in de
      kosten van voorgeschreven veranderingen van die kleding en goederen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel82
  - number: '82.3'
    text: |-
      Aan de dienstplichtige kan in door Onze Minister aan te wijzen gevallen een tegemoetkoming in de kosten van
      aanschaffing of van onderhoud en vernieuwing worden verleend terzake van uniformkleding en andere goederen die niet
      tot zijn persoonlijke standaarduitrusting behoren, maar die hij niettemin in eigendom moet hebben, alsmede terzake
      van burgerkleding.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel82
  - number: '82.4'
    text: |-
      De verstrekkingen in natura en die van de tegemoetkomingen, bedoeld in de vorige leden, geschieden, gedurende de
      tijd dat de dienstplichtige dienst verricht onder bevel van de Regionaal Bevelhebber, overeenkomstig de regelen en
      onder de voorwaarden, gesteld krachtens artikel 79, vierde lid, van het Reglement rechtstoestand dienstplichtigen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel82
  - number: '83.1'
    text: |-
      Indien een dienstplichtige om redenen van dienst buiten het eiland verblijft, waar hij zijn woonplaats heeft, en
      aldaar overlijdt, hebben zijn naaste betrekkingen, onder voorwaarden door Onze Minister te stellen, aanspraak op
      een vergoeding van de noodzakelijk gemaakte en te hunnen laste gekomen kosten voor het doen overbrengen van het
      stoffelijk overschot naar een plaats op het eiland van zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel83
  - number: '83.2'
    text: |-
      Voor zover Onze Minister* niet anders bepaalt, is het vorige lid niet van toepassing ten aanzien van degenen die
      zijn overleden terwijl het Koninkrijk zich in feitelijk oorlogsomstandigheden bevond, of die zijn overleden in de
      tijd waarin zij waren ingedeeld bij een eenheid of onderdeel van de krijgsmacht, waaraan de bekendmaking, bedoeld
      in [artikel 71 van het Wetboek van Militair Strafrecht][ref1] (Stb. 1964, no. 9), is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: '84.1'
    text: |-
      Onder voorwaarden door Onze Minister te stellen, kunnen de naaste betrekkingen van een dienstplichtige die
      vermist is geraakt bij de uitoefening van de dienst, dan wel ten gevolge van bijzondere omstandigheden die zich
      bij de uitoefening van de dienst hebben voorgedaan, in aanmerking komen voor bemiddeling van Onze Minister bij
      het uitvoeren van een procedure tot het verkrijgen van een verklaring, dat rechtsvermoeden van overlijden van de
      vermiste dienstplichtige bestaat.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel84
  - number: '84.2'
    text: |-
      De naaste betrekkingen van een dienstplichtige als bedoeld in het vorige lid hebben, indien de procedure, bedoeld
      in dat lid, niet kosteloos kan worden gevoerd, onder voorwaarden door Onze Minister te stellen, aanspraak op een
      vergoeding van de kosten die terzake voor hun rekening zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel84
  - number: '85.1'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn de voor ambtenaren geldende regelen terzake van vrijstelling van
      dienst wegens ziekte, neergelegd in het [Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref1] van
      overeenkomstige toepassing, voor zover daarvan in deze wet niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028606
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0028606
  - number: '85.2'
    text: |-
      De dienstplichtige, in werkelijke dienst, die ingevolge
      [artikel 6, eerste lid, van de Pensioenwet ambtenaren BES][ref1] geen ambtenaar is, wordt voor de toepassing van de
      in het voorgaande lid bedoelde regeling aangemerkt als ambtenaar in tijdelijke dienst, terwijl de dienstplichtige,
      die overheidsdienaar in de zin van genoemde wet is, wordt aangemerkt als ambtenaar in vaste dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel6
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0028714
        artikel: '6'
  - number: 85a
    text: |-
      Het geneeskundig onderzoek tot het vaststellen van blijvende ongeschiktheid als bedoeld in
      [artikel 35, derde lid][ref1], geschiedt door de geneeskundige commissie, bedoeld in artikel 14, derde lid,
      onderdeel a, van de Pensioenwet ambtenaren BES, en in andere gevallen door een of meer geneeskundigen, aan te
      wijzen door Onze Minister. De nadere regels, bedoeld in het vierde lid van het laatstgenoemde artikel, zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
  - number: '86.1'
    text: |-
      Onverminderd het tweede lid, zijn op de gewezen dienstplichtige, wiens dienstverband is
      geëindigd tijdens arbeidsongeschiktheid uit hoofde van een ziekte of gebrek, de bepalingen van
      [artikel 39 van het Rechtspositiebesluit ambtenaren BES][ref1] van overeenkomstige toepassing, met dien verstande
      dat hij in zoverre als gewezen ambtenaar in de zin van die wet wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel39
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '39'
  - number: '86.2'
    text: |-
      De arbeidsongeschiktheid dient te blijken uit een verklaring van de geneeskundige commissie dan wel de
      geneeskundige of geneeskundigen, bedoeld in [artikel 85a][ref1], overeenkomstig de in dat artikel gemaakte
      onderscheidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel85a
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: 85a
        hoofdstuk: '11'
  - number: '86.3'
    text: |-
      Het [tweede lid van artikel 85][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel85
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '85'
        hoofdstuk: '11'
  - number: '87.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de dienstplichtige in werkelijke dienst wordt door of namens Onze
      Minister een bedrag uitgekeerd gelijk aan de uitkering welke belanghebbende op de dag van zijn overlijden genoot,
      berekend over een tijdvak van drie maanden:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel87
  - number: 87.1.a
    text: aan de echtgenote, tenzij de dienstplichtige en zijn echtgenote duurzaam gescheiden leefden;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel87
  - number: 87.1.b
    text: |-
      bij ontstentenis van de onder a bedoelde echtgenote, ten behoeve van de minderjarige kinderen, stiefkinderen en
      pleegkinderen in wier levensonderhoud door belanghebbende geheel werd voorzien;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel87
  - number: 87.1.c
    text: |-
      bij ontstentenis van de onder a en b bedoelde betrekkingen, aan of ten behoeve van de ouders, broers, zusters of
      kinderen van de overledene, voor wie hij naar het oordeel van Onze Minister grotendeels in de noodzakelijke kosten
      van levensonderhoud bijdroeg.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel87
  - number: '87.2'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het vorige lid nalaat, kan Onze Minister het in dat lid
      bedoelde bedrag geheel of gedeeltelijk doen aanwenden ter bestrijding van de kosten van de laatste ziekte en de
      begrafenis of crematie.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel87
  - number: '88.1'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn de voor ambtenaren geldende regelen terzake van reis- , teer-
      en verhuiskosten van overeenkomstige toepassing, met dien verstande dat uitsluitend de dienstplichtige die
      overheidsdienaar in de zin van de [Pensioenwet ambtenaren BES][ref1] is voor een verhuiskostenvergoeding in
      aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028714
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0028714
  - number: '88.2'
    text: 'Voor de toepassing van de in het eerste lid bedoelde regelen worden:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel88
  - number: 88.2.a
    text: manschappen gerangschikt in de derde klasse;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel88
  - number: 88.2.b
    text: onderofficieren gerangschikt in de tweede klasse;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel88
  - number: 88.2.c
    text: officieren gerangschikt in de eerste klasse.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel88
  - number: '89.1'
    text: |-
      Aan de dienstplichtige worden geen voordelen onthouden of nadelen toegebracht ter zake van het niet naleven van
      bepalingen, indien redelijkerwijs moet worden aangenomen dat zij hem niet bekend kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel89
  - number: '89.2'
    text: |-
      Voorts worden aan de dienstplichtige geen voordelen onthouden of nadelen toegebracht in strijd met een bij of
      krachtens deze titel getroffen regeling.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel89
  - number: '89.3'
    text: |-
      De in deze titel genoemde autoriteiten zijn niet gerechtigd van een bij of krachtens deze titel getroffen regeling
      voor een bepaald geval ten nadele van een dienstplichtige af te wijken, tenzij de regeling in de mogelijkheid tot
      afwijking voorziet.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel89
  - number: '90.1'
    text: |-
      De dienstplichtige die zich tijdens het verblijf in werkelijke dienst bijzonder heeft onderscheiden door optreden
      of gedragingen dan wel door buitengewone toewijding of bijzonder loffelijke verrichtingen, kan door de Regionaal
      Bevelhebber worden beloond.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel90
  - number: '90.2'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn, gedurende de tijd dat hij werkelijke dienst verricht onder het
      bevel van de Regionaal Bevelhebber, de bepalingen inzake beloningen, gegeven bij of krachtens artikel 88 van het
      Reglement rechtstoestand dienstplichtigen, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel90
  - number: '91'
    text: |-
      De dienstplichtige in werkelijke dienst wordt, gedurende de tijd dat hij werkelijke dienst verricht onder bevel
      van de Regionaal Bevelhebber, beoordeeld overeenkomstig de regelen, gegeven bij of krachtens artikel 90 van het
      Reglement rechtstoestand dienstplichtigen voor dienstplichtigen der zeemacht in de zin van de Dienstplichtwet.
      (Stb. 1922, no. 43).
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel91
  - number: '92'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn, gedurende de tijd dat hij werkelijke dienst verricht onder
      bevel van de Regionaal Bevelhebber, de bepalingen inzake kleding, gegeven bij of krachtens artikel 91 van het
      Reglement rechtstoestand dienstplichtigen, met uitzondering van artikel 91, vierde lid onder f, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel92
  - number: '93.1'
    text: |-
      Aan de dienstplichtige wordt bij het verlaten van de werkelijke dienst op zijn verzoek door de Regionaal
      Bevelhebber een getuigschrift uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel93
  - number: '93.2'
    text: |-
      Het getuigschrift, bedoeld in het vorige lid, vermeldt de duur van de dienstverhouding en de aard van de verrichtte
      werkzaamheden, alsmede, doch alleen op verzoek van de dienstplichtige, de wijze waarop hij die werkzaamheden heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel93
  - number: '94.1'
    text: |-
      In het belang van de dienst kan de dienstplichtige in werkelijke dienst door de Regionaal Bevelhebber worden
      ingedeeld in een andere functie en – met inachtneming van het daaromtrent in deze wet bepaalde – worden verplaatst.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel94
  - number: '94.2'
    text: |-
      Een indeling in een andere functie en een verplaatsing als bedoeld in het vorige lid kan eveneens plaatsvinden op
      verzoek van de dienstplichtige.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel94
  - number: '95'
    text: |-
      De dienstplichtige in werkelijke dienst is verplicht de hem opgedragen werkzaamheden en/of diensten naar beste
      vermogen te vervullen, en de uit dien hoofde voor hem geldende voorschriften en orders te kennen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95
  - number: 95a.1
    text: |-
      De dienstplichtige onthoudt zich van de uitoefening van de vrijheid van meningsuiting en het recht van vereniging
      en vergadering, indien door de uitoefening van deze rechten de goede vervulling van zijn functie of de goede
      functionering van de openbare dienst, voor zover deze verband houdt met zijn functievervulling, niet in
      redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95a
  - number: 95a.2
    text: |-
      Het bepaalde in het eerste lid is voor wat betreft het recht op vereniging niet van toepassing op het lidmaatschap
      van :
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95a
  - number: 95a.2.a
    text: een politieke groepering;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95a
  - number: 95a.2.b
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95a
  - number: 95b
    text: |-
      De dienstplichtige is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of
      levensovertuiging geldende feest- en rustdagen tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95b
  - number: 95c.1
    text: |-
      Aan de dienstplichtige wordt buitengewoon verlof verleend voor het bijwonen van vergaderingen of zittingen
      van een publiekrechtelijk college, waarin deze is benoemd of gekozen, alsmede voor het verrichten van daar uit
      voortvloeiende werkzaamheden ten behoeve van dit college tenzij de belangen van de dienst vorderen dat zulks niet
      geschiedt. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende het doorbetalen
      van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95c
  - number: 95c.2
    text: |-
      Aan de dienstplichtige wordt buitengewoon verlof verleend voor aan te wijzen activiteiten van of voor een
      vakvereniging van militairen overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels
      tenzij de belangen van de dienst vorderen dat een dergelijk verlof niet wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95c
  - number: 95d.1
    text: |-
      De dienstplichtige is verplicht zich tijdens het verblijf in een gebouw, luchtvaartuig of voertuig alsmede op een
      vaartuig of terrein dat in gebruik is bij of ten behoeve van de krijgsmacht of dat de dienstplichtige tot verblijf
      of gebruik dient bij de vervulling van de dienst, te onderwerpen aan een in het belang van de dienst door de
      commandant gelast onderzoek aan zijn lichaam of kleding of van zijn aldaar aanwezige goederen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95d
  - number: 95d.2
    text: |-
      De commandant op wiens last het in het eerste lid bedoelde onderzoek plaats heeft, neemt de nodige maatregelen ten
      einde daarbij een onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel95d
  - number: '96'
    text: |-
      Naar regelen door de Regionaal Bevelhebber te stellen kan de dienstplichtige in werkelijke dienst worden verplicht
      tot sportbeoefening in dienstverband.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel96
  - number: '97'
    text: |-
      De dienstplichtige in werkelijke dienst kan, naar regelen door Onze Minister te stellen, worden verplicht zodanige
      maatregelen te treffen, dat hij aan per radio, televisie of op andere wijze gedane oproepingen om zich te melden
      onverwijld gevolg kan geven.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel97
  - number: '98.1'
    text: |-
      De dienstplichtige in werkelijke dienst kan worden verplicht, wanneer naar het oordeel van Onze Minister
      het algemeen belang dit vordert, tijdelijk andere werkzaamheden te verrichten dan die welke uit de militaire
      hoedanigheid voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel98
  - number: '98.2'
    text: |-
      Hij kan echter niet worden verplicht werkzaamheden te verrichten in plaats van stakers of uitgeslotenen, tenzij het
      werkzaamheden betreft die naar het oordeel van Onze Minister geen uitstel gedogen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel98
  - number: '99'
    text: |-
      De dienstplichtige in werkelijke dienst kan voor het verrichten van werkzaamheden en/of diensten worden gesteld
      onder een functionaris die niet behoort tot het militaire personeel van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel99
  - number: '100'
    text: |-
      De dienstplichtige is verplicht tot geheimhouding van enig gegeven, de dienst betreffende tegenover een ieder
      die tot kennisneming daarvan niet bevoegd is, voorzover die verplichting uit de aard der zaak volgt of hem
      uitdrukkelijk is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel100
  - number: '101'
    text: |-
      Op de dienstplichtige in werkelijke dienst zijn, gedurende de tijd dat hij werkelijke dienst verricht onder bevel
      van de Regionaal Bevelhebber, de bepalingen inzake schadevergoeding, gegeven bij of krachtens artikel 101 van het
      Reglement rechtstoestand dienstplichtigen, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel101
  - number: '102'
    text: |-
      De dienstplichtige die uit hoofde van zijn functie is belast met het beheer over of de bewaring van aan het Rijk
      toebehorende of toevertrouwde gelden of geldswaarde papieren kan, bij constatering van een tekort, worden verplicht
      dat tekort geheel of gedeeltelijk aan te zuiveren, indien en voor zover hij niet aannemelijk maakt dat het ontstaan
      van dat tekort hem redelijkerwijs niet kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel102
  - number: '103.1'
    text: |-
      Van elk ongeval dat aan een dienstplichtige in werkelijke dienst tijdens de uitoefening van de dienst is overkomen,
      wordt zo spoedig mogelijk een proces-verbaal opgemaakt. De dienstplichtige is verplicht, zodra hij daartoe
      redelijkerwijs in staat is, kennis te geven van een hem overkomen ongeval als vorenbedoeld aan zijn commandant.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel103
  - number: '103.2'
    text: |-
      Van elk ongeval dat aan een dienstplichtige in werkelijke dienst is overkomen en waarvan niet reeds op grond van
      het vorige lid een proces-verbaal* is opgemaakt, wordt, op verzoek van de dienstplichtige, zo spoedig mogelijk
      een proces-verbaal opgemaakt. Bedoeld verzoek kan, indien de dienstplichtige hiertoe niet in staat is, ook
      worden gedaan door zijn naaste betrekkingen. Een proces-verbaal als in dit lid bedoeld kan ook ambtshalve worden
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel103
  - number: '103.3'
    text: |-
      Onze Minister beslist of het ongeval waarop een proces-verbaal betrekking heeft, wordt geacht wel of niet in
      verband te staan met de uitoefening van de dienst, van welke beslissing de dienstplichtige schriftelijk in kennis
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel103
  - number: '104.1'
    text: |-
      Onverminderd [artikelen 103, tweede lid][ref1], is de dienstplichtige in werkelijke dienst verplicht Onze Minister
      onverwijld kennis te geven van elk ongeval dat hem is overkomen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel103
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '103'
        hoofdstuk: '12'
  - number: 104.1.a
    text: bij dat ongeval een derde is betrokken en
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
  - number: 104.1.b
    text: |-
      hij ten gevolge van dat ongeval verhinderd is zijn normale werkzaamheden als dienstplichtige uit te oefenen of
      geneeskundige hulp heeft moeten inroepen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
  - number: '104.2'
    text: |-
      De dienstplichtige, bedoeld in het vorige lid, is eveneens verplicht aan Onze Minister zo spoedig mogelijk kennis
      te geven van elk ongeval dat aan een lid van zijn gezin is overkomen, indien:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
  - number: 104.2.a
    text: bij dat ongeval een derde is betrokken en
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
  - number: 104.2.b
    text: ten gevolge van dat ongeval geneeskundige verstrekkingen zijn of zullen worden verleend op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel104
  - number: '105'
    text: |-
      De dienstplichtige in werkelijke dienst die – anders dan als gevolg van verhindering wegens ziekte – niet in staat
      is zich te begeven naar de plaats, waar de dienst zijn aanwezigheid vereist, is verplicht daarvan onverwijld kennis
      te geven aan zijn commandant of andere functionaris onder wie hij is gesteld of bij wie hij zich zou moeten melden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel105
  - number: '106.1'
    text: |-
      Het is de dienstplichtige verboden ter zake van aangelegenheden, de dienst betreffende, anders dan met goedvinding
      van Onze Minister, vergoedingen, beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te
      nemen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel106
  - number: '106.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk verboden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel106
  - number: '107'
    text: |-
      Het is de dienstplichtige in werkelijke dienst verboden bij een eenheid of onderdeel van de krijgsmacht handel te
      drijven, tenzij hem van dat verbod ontheffing is verleend door Onze Minister of door daartoe door deze aangewezen
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel107
  - number: '108.1'
    text: |-
      Er is een commissie voor georganiseerd overleg voor bij deze titel te regelen aangelegenheden van algemeen belang
      voor de rechtstoestand van dienstplichtigen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel108
  - number: '108.2'
    text: |-
      De commissie behandelt de in het eerste lid bedoelde aangelegenheden, in bespreking met de door Onze Minister
      daartoe aangewezen vertegenwoordigers, alvorens tot vaststelling dan wel wijziging van de desbetreffende regeling
      wordt besloten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel108
  - number: '109.1'
    text: |-
      De commissie bestaat uit door rechtspersoonlijkheid bezittende verenigingen van militairen aangewezen leden
      en plaatsvervangende leden die gelet op hun ledental en de samenstelling daarvan representatief zijn voor de
      officieren, de onderofficieren en/of de manschappen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel109
  - number: '109.2'
    text: |-
      In overleg met bedoelde verenigingen van militairen en met inachtneming van haar ledental wordt bij algemene
      maatregel van bestuur bepaald hoeveel leden en plaatsvervangende leden worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel109
  - number: '109.3'
    text: |-
      De ingevolge het vorige artikel in de commissie te voeren besprekingen staan onder leiding van een bij besluit
      van Onze Minister aangewezen voorzitter of, bij ontstentenis van deze, van een plaatsvervangend voorzitter. De
      besprekingen worden bijgewoond door of namens de Regionaal Bevelhebber;* de voorzitter en de Regionaal Bevelhebber,
      of diens vertegenwoordiger, hebben in de commissie een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel109
  - number: '109.4'
    text: |-
      De commissie wordt bijgestaan door een secretaris en, zo nodig, door een of meer adjunct-secretarissen, bij besluit
      van Onze Minister op aanbeveling van de commissie aangewezen. Zij kunnen niet tevens leden noch adviserende leden
      van de commissie zijn.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel109
  - number: '109.5'
    text: |-
      Bij de behandeling van bepaalde aangelegenheden kunnen op uitnodiging of met toestemming van de voorzitter ook
      anderen aan de bespreking deelnemen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel109
  - number: '110.1'
    text: |-
      De verenigingen van militairen welke van de bevoegdheid tot aanwijzing hebben gebruik gemaakt, doen aan Onze
      Minister mededeling van de door haar aangewezen leden/plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel110
  - number: '110.2'
    text: |-
      De verenigingen van militairen geven bij de aanvang van ieder kalenderjaar Onze Minister kennis van het aantal
      harer leden, behorende tot de dienstplichtigen in de zin van deze titel.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel110
  - number: '111.1'
    text: |-
      De commissie behandelt haar aangelegenheden onmiddellijk nadat deze – voldoende tijdig – haar zijn toegezonden.
      Onze Minister wijst voor de behandeling van elke aangelegenheid de ambtenaren aan, die Onze Minister hierbij zullen
      vertegenwoordigen en brengt dit ter kennis van de voorzitter, die in overleg met deze ambtenaren de vergadering van
      de commissie belegt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel111
  - number: '111.2'
    text: |-
      Onverminderd het bepaalde in [artikel 108, tweede lid][ref1], kan op verzoek van de in dat artikel bedoelde
      vertegenwoordigers de commissie in voorlopige besprekingen met hen treden of aan hen inlichtingen verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel108
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '108'
        hoofdstuk: '13'
  - number: '112'
    text: |-
      De commissie is gerechtigd Onze Minister voorstellen te doen van onderwerpen van bespreking in de zin van dit
      hoofdstuk, welke voorstellen op de voet van het bepaalde in [artikel 108][ref1] aan de commissie kunnen worden
      voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel108
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '108'
        hoofdstuk: '13'
  - number: '113'
    text: |-
      Behoudens het bepaalde in [artikel 111, tweede lid][ref1] vergadert de commissie op plaats, dag en uur, door de
      voorzitter te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel111
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '111'
        hoofdstuk: '13'
  - number: '114.1'
    text: |-
      In overleg met de in [artikel 109, tweede lid of derde lid][ref1], bedoelde autoriteiten kan de commissie een
      reglement van orde vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel109
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '109'
        hoofdstuk: '13'
  - number: '114.2'
    text: |-
      De voorzitter doet de secretaris een advies opstellen, bevattende de gevoelens der meerderheid van het in de
      vergaderingen verhandelde, welk advies met de stukken wordt teruggezonden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
  - number: '114.3'
    text: |-
      Zij die gevoelens hebben uitgebracht, afwijkende van die der meerderheid, en zich hebben voorbehouden afzonderlijke
      adviezen over te leggen om te worden gevoegd bij het advies der commissie, zijn verplicht die adviezen ondertekend,
      zo tijdig aan de secretaris van de commissie ter hand te stellen, dat de inzending van het advies van de commissie
      daardoor generlei vertraging ondergaat.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
  - number: '114.4'
    text: |-
      Indien de stemmen over een voorstel staken, wordt hetgeen voor en tegen het voorstel is aangevoerd ter kennis van
      Onze Minister gebracht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
  - number: '114.5'
    text: |-
      Indien een meer of meer leden zulks verlangen, wordt in een advies melding gemaakt van de uitgebrachte stemmen
      met opgave van aantallen leden die de verenigingen van militairen blijkens de in [artikel 110, tweede lid][ref1],
      bedoelde kennisgeving onder de dienstplichtigen, waarvoor de commissie is ingesteld, hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel110
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '110'
        hoofdstuk: '13'
  - number: '114.6'
    text: De adviezen worden zoveel mogelijk uitgebracht binnen de tijd in het verzoek om advies bepaald.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
  - number: '114.7'
    text: |-
      Indien wordt afgeweken van het advies der commissie, worden de redenen van deze afwijking door Onze Minister ter
      kennis van de commissie gebracht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel114
  - number: '115'
    text: |-
      De voorzitter doet de secretaris bovendien een verslag opmaken, behelzende ene beknopte samenvatting van het in de
      vergadering verhandelde. Met wederzijds goedvinden kunnen deze verslagen telkens worden openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel115
  - number: '116.1'
    text: |-
      De dienstplichtige die rechtstreeks in zijn belang is getroffen door een beslissing gegeven krachtens deze titel
      of krachtens enig voorschrift, berustend op deze titel, kan zijn bezwaren tegen die beslissing, voor zover zij
      niet zijn gericht tegen een algemeen verbindend voorschrift, onder vermelding van de gronden waarop zijn bezwaren
      berusten, schriftelijk ter kennis brengen van:
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.1.a
    text: Onze Minister van Defensie, indien zijn bezwaren betrekking hebben op een over hem opgemaakte beoordeling;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.1.b
    text: |-
      de Regionaal Bevelhebber, indien zijn bezwaren betrekking hebben op een ten aanzien van hem genomen beslissing door
      een militaire autoriteit;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.1.c
    text: |-
      Onze Minister van Defensie, indien zijn bezwaren betrekking hebben op een ten aanzien van hem genomen beslissing
      door een niet-militaire autoriteit.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: '116.2'
    text: |-
      Tegen een door Onze Minister van Defensie genomen beslissing op een bezwaarschrift als bedoeld in het vorige lid,
      onder a, kan beroep worden ingesteld bij het Gerecht in Ambtenarenzaken volgens de voor dit beroep geldende regels.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: '116.3'
    text: |-
      Het bezwaarschrift, gericht aan de autoriteiten bedoeld in het eerste lid, onder b of c, moet worden ingediend
      binnen dertig dagen na de dag waarop de beslissing waartegen de bezwaren zijn gericht, is genomen. Is het
      bezwaarschrift ingediend na die termijn, dan wordt het geacht tijdig te zijn ingediend, indien de belanghebbende
      aantoont dat het is ingediend binnen dertig dagen na de dag waarop hij redelijkerwijs kennis heeft kunnen dragen
      van de beslissing waartegen de bezwaren zijn gericht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: '116.4'
    text: |-
      De autoriteit, bedoeld in het eerste lid, onder b of c neemt zo spoedig mogelijk de beslissing waartegen het
      bezwaarschrift zich richt in het heroverweging en zendt per aangetekende brief een afschrift van zijn beslissing
      aan de belanghebbende die het bezwaarschrift heeft ingediend. Daarbij vermeldt hij dat tegen die beslissing beroep
      kan worden ingesteld bij het Gerecht in Ambtenarenzaken, alsmede binnen welke termijn dat beroep moet worden
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: '116.5'
    text: 'Voor de toepassing van dit artikel wordt onder dienstplichtige mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.5.a
    text: de gewezen dienstplichtige;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.5.b
    text: ieder ander die bij of krachtens deze wet wordt aangemerkt als belanghebbende;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: 116.5.c
    text: |-
      de nagelaten betrekkingen of rechtverkrijgenden van de dienstplichtige, de gewezen dienstplichtige of een persoon
      als bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
  - number: '116.6'
    text: |-
      Beroep kan niet worden ingesteld tegen beslissingen ingevolge de bij of krachtens de
      [Wet militair tuchtrecht][ref1] (P.B. 1990, no. 64) gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: 116a
    text: |-
      Tegen een besluit als bedoeld in [artikel 35][ref1], kan door de vrijwillig nadienende dienstplichtige beroep
      worden ingesteld bij het Gerecht in Ambtenarenzaken. De Regeling ambtenarenrechtspraak 1951 (P.B. 1951, 134) is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel35
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116a
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
  - number: 116b
    text: 'Voor de toepassing van het in deze paragraaf bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116b
  - number: 116b.a
    text: |-
      *klager:* de dienstplichtige, die zich bezwaard voelt over een van een militaire meerdere als bedoeld in
      [artikel 67 van het Wetboek van Militair Strafrecht][ref1] (P.B. 1922, no. 54) ontvangen bevel, dan wel vermeent
      van een zodanig militaire meerdere een krenkende of onbillijke behandeling te hebben ondervonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
  - number: 116b.b
    text: |-
      *klaagschrift:* het door een klager bij de beklagmeerdere ingediend geschrift, houdende een beschrijving van het
      bevel of de handeling waartegen het beklag is gericht;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116b
  - number: 116b.c
    text: |-
      *beklagmeerdere:* de tot straffen bevoegde militaire meerdere, als bedoeld in
      [artikel 49 van de Wet militair tuchtrecht][ref1] (P.B. 1990, no. 64), onder wiens rechtstreeks bevel degene, tegen
      wie het klaagschrift is gericht, is gesteld dan wel een door Onze Minister van Defensie aangewezen functionaris;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '49'
  - number: 116b.d
    text: |-
      *vertrouwensman:* de vertrouwensman als bedoeld in [artikel 57 van de Wet militair tuchtrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel57
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '57'
  - number: 116c.1
    text: |-
      De dienstplichtige die zich bezwaard voelt over een van een militaire meerdere als bedoeld in
      [artikel 67 van het Wetboek van Militair Strafrecht][ref1] ontvangen bevel, dan wel vermeend van een zodanig
      militaire meerdere een krenkende of onbillijke behandeling te hebben ondervonden kan zich door middel van een met
      redenen omkleed klaagschrift beklagen bij de beklagmeerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116c
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
  - number: 116c.2
    text: |-
      Het klaagschrift moet langs de hiërarchieke weg worden ingediend binnen zes weken na de dag waarop het bevel
      bedoeld in het eerste lid is gegeven dan wel de in het eerste lid bedoelde behandeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116c
  - number: 116c.3
    text: |-
      Een na afloop van de in het tweede lid genoemde termijn ingediend klaagschrift wordt geacht tijdig te zijn
      ingediend indien de klager aantoont dat hij het klaagschrift heeft ingediend zo spoedig als redelijkerwijs verlangd
      kon worden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116c
  - number: 116d.1
    text: De beklagmeerdere houdt naar aanleiding van het klaagschrift een onderzoek. Het onderzoek is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.2
    text: |-
      De beklagmeerdere kan een rapporteur met het onderzoek naar het klaagschrift belasten. De rapporteur mag op
      generlei wijze betrokken zijn bij de aangelegenheid die onderwerp is van beklag en moet hoger in rang zijn dan wel
      – bij gelijkheid in rang – ouder in rang zijn dan de militaire meerdere tegen wie het klaagschrift is gericht.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.3
    text: |-
      Tijdens het onderzoek worden de klager, de militaire meerdere tegen wie het beklag is gericht en – voor zover
      hiervoor termen aanwezig zijn – anderen gehoord.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.4
    text: |-
      Indien de beklagmeerdere niet zelf het onderzoek naar het klaagschrift verricht, wordt de klager de gelegenheid
      geboden bij de beklagmeerdere zijn standpunt mondeling nader toe te lichten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.5
    text: |-
      Indien het horen door de beklagmeerdere dan wel door de rapporteur niet mogelijk is dan wel op ernstige bezwaren
      stuit, kan de beklagmeerdere de tot straffen bevoegde militaire meerdere van degene die moet worden gehoord, met
      het horen belasten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.6
    text: |-
      De klager kan zich door een vertrouwensman laten bijstaan. [Artikel 59, eerste lid][ref1], en
      [artikel 60 van de Wet militair tuchtrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel60
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '60'
  - number: 116d.7
    text: Van het onderzoek wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116d.8
    text: De klager en zijn vertrouwensman hebben het recht op inzage van alle stukken die op de zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116d
  - number: 116e.1
    text: |-
      Op het klaagschrift moet binnen een termijn van zes weken na ontvangst schriftelijk worden beslist. Deze beslissing
      kan voor ten hoogste vier weken worden verdaagd. Van de verdaging wordt schriftelijk mededeling gedaan aan de
      klager. De termijn bedraagt twaalf weken indien de klager dan wel de militaire meerdere tegen wie het klaagschrift
      is gericht dan wel getuigen zich om redenen van dienst buiten Aruba, Curaçao of Sint Maarten of buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba bevinden. De klager en de militaire meerdere tegen wie het klaagschrift is
      gericht, worden schriftelijk in kennis gesteld van de beslissing.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116e
  - number: 116e.2
    text: |-
      De beslissing is met redenen omkleed en houdt in dat de klager niet ontvankelijk dan wel de klacht geheel of
      gedeeltelijk gegrond dan wel ongegrond is.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116e
  - number: 116e.3
    text: |-
      De beklagmeerdere zendt zijn beslissing vergezeld van het verslag van het onderzoek langs de hiërarchieke weg aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116e
  - number: 116f
    text: |-
      Beklag is niet mogelijk tegen een op beklag genomen beslissing alsmede niet tegen beslissingen ingevolge de bij of
      krachtens de [Wet militair tuchtrecht][ref1] gegeven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel116f
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '117'
    text: |-
      De op het tijdstip van inwerkingtreding van de landsverordening waarbij [titel II][ref1] is ingevoerd,
      vrijwillig nadienende dienstplichtige, aan wie op dat tijdstip of daarna op grond van [artikel 35][ref2] ontslag
      uit de dienst is verleend, heeft met ingang van de dag waarop dit ontslag ingaat recht op een maandelijkse
      overbruggingsuitkering, bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 68][ref3], te
      regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0028468#Artikel68
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028468
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '35'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0028468
        artikel: '68'
        hoofdstuk: '7'
  - number: '118'
    text: |-
      De termijn gedurende welke een uitkering op grond van het [vorig artikel][ref1] wordt toegekend bedraagt maximaal
      120 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel117
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '117'
        hoofdstuk: '15'
        paragraaf: '1'
  - number: '119'
    text: |-
      Het bedrag van de uitkering is gedurende 12 maanden gelijk aan 90% van de laatstgenoten bezoldiging, gedurende de
      daaropvolgende 12 maanden gelijk aan 80% van die bezoldiging, gedurende de daaropvolgende 36 maanden gelijk aan 70%
      en vervolgens gelijk aan 60% van die bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel119
  - number: '120.1'
    text: |-
      Met betrekking tot deze uitkering wordt onder laatstgenoten bezoldiging verstaan de bezoldiging waarop recht
      bestond op de dag voorafgaande aan het ontslag.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel120
  - number: '120.2'
    text: |-
      Van de datum af, waarop, indien de ontslagen dienstplichtige in dezelfde rang of klasse in dienst was gebleven, de
      laatstgenoten bezoldiging anders dan ten gevolge van wijziging in de voor bezoldiging geldende diensttijd een ander
      bedrag zou hebben belopen, treedt dat andere bedrag in de plaats van de laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel120
  - number: '121'
    text: |-
      Wanneer de belanghebbende op de dag voorafgaande aan het ontslag in het genot is van een suppletie op zijn
      bezoldiging wordt voor de toepassing van deze overbruggingsuitkering, de laatstgenoten bezoldiging verhoogd met de
      suppletie, als bedoeld in [artikel 130][ref1] met dien verstande dat het bedrag van de uitkering omvat gedurende de
      eerste 12 maanden 90% van de suppletie, gedurende de daarop volgende 12 maanden 80% van die suppletie en gedurende
      de daarop volgende 36 maanden 70% van die suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel130
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '130'
        hoofdstuk: '15'
        paragraaf: '3'
  - number: '122.1'
    text: |-
      De inkomsten die de belanghebbende gaat genieten uit of in verband met arbeid of bedrijf worden met de uitkering
      verrekend over de maand waarop bedoelde inkomsten betrekking hebben of geacht kunnen worden betrekking te hebben.
      Deze verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag waarmee de uitkering, vermeerderd
      met die inkomsten, het bedrag van de laatstgenoten bezoldiging vermeerderd met eventuele suppletie, overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel122
  - number: '122.2'
    text: |-
      De belanghebbende is verplicht van het ter hand nemen van enige arbeid of bedrijf terstond mededeling te doen,
      onder opgave, voor zover mogelijk, van de inkomsten die hij uit die werkzaamheden zal genieten.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel122
  - number: '123'
    text: |-
      Indien de belanghebbende tijdens de duur van de uitkering overlijdt eindigt de uitkering met ingang van de dag
      volgende op die van het overlijden.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel123
  - number: '124.1'
    text: |-
      De belanghebbende heeft gedurende de tijd waarover hem een overbruggingsuitkering betaalbaar wordt gesteld,
      aanspraak op kindertoelage en vakantieuitkering op de voet van de regelingen, welke voor hem zouden gelden indien
      hij nog in werkelijke dienst zou zijn.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel124
  - number: '124.2'
    text: |-
      Voor de berekening van de grootte van de kindertoelage en de vakantieuitkering geldt de laatstgenoten bezoldiging
      als genoemd in [artikel 120][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel120
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '120'
        hoofdstuk: '15'
        paragraaf: '1'
  - number: '126'
    text: |-
      Zo spoedig mogelijk na het overlijden van de belanghebbende, aan wie ten tijde van het overlijden een
      overbruggingsuitkering betaalbaar is gesteld, wordt overeenkomstig het bepaalde in [artikel 87][ref1], een bedrag
      uitbetaald gelijk aan bedoelde betaalbaar gestelde uitkering vermeerderd met kindertoelage en vakantieuitkering als
      bedoeld in [artikel 124][ref2], over een tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel124
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '87'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '124'
        hoofdstuk: '15'
        paragraaf: '1'
  - number: '127'
    text: |-
      De in deze paragraaf bedoelde uitkering wordt gelijkgesteld met wachtgeld in de zin van artikel 4 van de
      Wachtgeldenregeling overheidsdienaren (P.B.1986,83)
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel127
  - number: '128'
    text: |-
      Voor de vrijwillig nadienende dienstplichtige, die op de dag voorafgaand aan die waarop de Pensioenlandsverordening
      overheidsdienaren in werking treedt ambtenaar in de zin van de Pensioenverordening Burgerlijke Landsdienaren 1938
      (P.B. 1976, 45) was, wordt de tijd welke hij vanaf de datum van opkomst in werkelijke dienst voor eerste oefening
      heeft doorgebracht als diensttijd, bedoeld in artikel 17 van de Pensioenlandsverordening overheidsdienaren, mede in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel128
  - number: '129'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel129
  - number: '130.1'
    text: |-
      Aan de vrijwillig nadienende dienstplichtige, die op het tijdstip van inwerkingtreding van de landsverordening
      waarbij [titel II][ref1] is ingevoegd, in werkelijke dienst is, zal gedurende de tijd, dat door hem onafgebroken
      werkelijke dienst wordt verricht, ingeval en voorzover zijn netto Nederlandse militaire inkomsten op de dag,
      voorafgaande aan dat tijdstip van inwerkingtreding meer bedragen dan de netto bezoldiging, die hij krachtens de
      voor hem geldende bezoldigingsregeling geniet, het verschil tussen de eerst- en laatstbedoelde inkomsten worden
      aangevuld, echter met dien verstande, dat bij de toepassing van dit artikellid de eerstbedoelde inkomsten de
      algemene salarismaatregelen volgen, die voor het Nederlands rijksoverheidspersoneel worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028468
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028468
  - number: '130.2'
    text: |-
      Bij de bepaling van de in het vorige lid bedoelde suppletie bljven de premie AOV/AWW* en de pensioenbijdrage buiten
      beschouwing, voorzover deze voor rekening van de belanghebbende komen.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel130
  - number: '130.3'
    text: |-
      De vrijwillig nadienende dienstplichtige, die op het tijdstip van inwerkingtreding van de landsverordening
      waarbij [titel II][ref1] in deze landsverordening is ingevoegd, in werkelijke dienst is, behoudt de
      aanspraak op de vakantie-uitkering, die voor hem bestond op de dag, voorafgaande aan dat tijdstip van
      inwerkingtreding, indien en voorzover hij geen vakantie-uitkering uit hoofde van hetgeen is bepaald in
      [artikel 68, tweede lid van titel II][ref2] van deze landsverordening geniet, doch uiterlijk tot het tijdstip van
      zijn ontslag als dienstplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0028468
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel68
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0028468
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '68'
        hoofdstuk: '7'
  - number: '131'
    text: |-
      De dienstplichtige die op het tijdstip van inwerkingtreding van de landsverordening waarbij [titel II][ref1]
      in deze landsverordening is ingevoegd, in werkelijke dienst is, blijft gedurende de tijd dat hij als zodanig
      werkelijke dienst verricht, aanspraak houden op de bezoldiging waarop hij aanspraak had op de dag voorafgaande aan
      dat tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028468
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0028468
  - number: '132.1'
    text: |-
      Met hechtenis van ten hoogste veertien dagen of geldboete van ten hoogste honderdvijftig gulden wordt
      gestraft, hij die niet voldoet aan een ingevolge [artikel 5, eerste lid][ref1], [artikel 9, tweede lid][ref2],
      [artikel 11, tweede lid][ref3] en [artikel 33][ref4] op hem rustende verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028468#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0028468#Artikel33
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '9'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0028468
        artikel: '11'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0028468
        artikel: '33'
        hoofdstuk: VIII
  - number: '132.2'
    text: |-
      Met gevangenisstraf van ten hoogste twee maanden of geldboete van ten hoogste zeshonderd gulden wordt gestraft hij,
      die opzettelijk een der in het eerste lid bedoelde feiten pleegt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel132
  - number: '133.1'
    text: 'Met hechtenis van ten hoogste een maand of geldboete van ten hoogste driehonderd gulden wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel133
  - number: 133.1.a
    text: |-
      hij, die ingevolge deze wet voor de werkelijke dienst heeft moeten opkomen en niet verschijnt op de tijd en de
      plaats, voor zijn verschijning bepaald, tenzij blijkt, dat voor zijn niet verschijning een geldige reden bestond;
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel133
  - number: 133.1.b
    text: |-
      hij, die niet voldoet aan de ingevolge [artikel 23, eerste lid][ref1], op hem rustende verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel23
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '23'
        hoofdstuk: VI
  - number: '133.2'
    text: |-
      Met gevangenisstraf van ten hoogste twee maanden of geldboete van ten hoogste drieduizend gulden wordt gestraft
      hij, die opzettelijk een der in het eerste lid bedoelde feiten pleegt.
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel133
  - number: '134'
    text: |-
      De feiten bij deze wet strafbaar gesteld, worden als overtreding aangemerkt met uitzondering van die strafbaar
      gesteld bij de [artikelen 132, tweede lid][ref1], en [133, tweede lid][ref2], die als misdrijven worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028468#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0028468#Artikel133
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0028468
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0028468
        artikel: '133'
  - number: 134a
    text: |-
      Met de opsporing van de in deze wet strafbare gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de militairen van de Koninklijke marechaussee. Zij
      hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel134a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '135'
    text: 'Deze wet wordt aangehaald als: Dienstplichtwet BES.'
    url: https://wetten.overheid.nl/BWBR0028468/2011-10-09#Artikel135
