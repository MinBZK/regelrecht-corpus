---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_goederenvervoer_over_de_weg
regulatory_layer: WET
publication_date: '2008-12-09'
valid_from: '2008-08-01'
bwb_id: BWBR0005443
url: https://wetten.overheid.nl/BWBR0005443/2008-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de kwaliteit in het goederenvervoer met
    vrachtauto’s wenselijk is een nieuwe regeling te geven voor het beroepsvervoer en het eigen vervoer, die mede kan
    dienen ter uitvoering van verdragen of van besluiten van volkenrechtelijke organisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.b
    text: |-
      NIWO: Stichting Nationale en Internationale Wegvervoer Organisatie, bedoeld in [artikel 55][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel55
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '55'
        hoofdstuk: IX
  - number: 1.1.c
    text: 'SIEV: Stichting Inschrijving Eigen Vervoer opgericht op 13 februari 1954 te ''s-Gravenhage;'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.d
    text: |-
      motorrijtuig: voertuig als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 1.1.e
    text: |-
      vrachtauto: een voor het vervoer van goederen ingericht motorrijtuig of geleed motorrijtuig alsmede een voor het
      vervoer van goederen ingerichte, met een motorrijtuig of geleed motorrijtuig samengevoegde, aanhangwagen;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.f
    text: 'geleed motorrijtuig: samenstel van trekker en oplegger;'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.g
    text: |-
      eigen vervoer: vervoer met vrachtauto’s van goederen, uitsluitend bestemd voor of afkomstig van eigen onderneming
      of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.h
    text: 'beroepsvervoer: vervoer van goederen met vrachtauto’s tegen vergoeding, niet zijnde eigen vervoer;'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.i
    text: |-
      grensoverschrijdend vervoer: eigen vervoer of beroepsvervoer waarbij tussen de plaats waar goederen worden geladen
      en de plaats waar goederen worden gelost tenminste één grens tussen twee landen wordt overschreden, met dien
      verstande dat grensoverschrijdend vervoer tussen twee in Nederland gelegen plaatsen gelijk gesteld wordt met
      binnenlands vervoer;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.j
    text: |-
      ondernemer: de natuurlijke persoon, vennootschap zonder rechtspersoonlijkheid, maatschap of rechtspersoon voor
      wiens rekening en risico het beroepsvervoer of het eigen vervoer wordt verricht;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.k
    text: |-
      communautaire vergunning: communautaire vergunning als bedoeld in [verordening (EEG) nr. 881/92](31992R0881) van de
      Raad van de Europese Gemeenschappen van 26 maart 1992 betreffende de toegang tot de markt van het goederenvervoer
      over de weg in de Gemeenschap van of naar het grondgebied van een Lid-Staat of over het grondgebied van een of meer
      Lid-Staten (*PbEG* L 095);
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: 1.1.l
    text: |-
      verwerken van persoonsgegevens, onderscheidenlijk verantwoordelijke: hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '1.2'
    text: |-
      Onder beroepsvervoer en eigen vervoer wordt mede verstaan het door de ondernemer in een vrachtauto laden of daaruit
      lossen van goederen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald in welke gevallen het in lege toestand verplaatsen van een
      vrachtauto wordt gelijkgesteld met beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel1
  - number: '2.1'
    text: Deze wet is van toepassing op beroepsvervoer en eigen vervoer over voor het openbaar verkeer openstaande wegen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is mede van toepassing op beroepsvervoer en eigen vervoer, dat geheel of ten dele buiten Nederland wordt
      verricht door een in Nederland gevestigde ondernemer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel2
  - number: '3'
    text: |-
      Deze wet is niet van toepassing op beroepsvervoer en eigen vervoer verricht met een vrachtauto waarvan het
      toegestane laadvermogen niet meer bedraagt dan 500 kg.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel3
  - number: '4.1'
    text: |-
      De hoofden of bestuurders van een onderneming zijn verplicht te zorgen, dat in de onderneming
      niet wordt gehandeld in strijd met het bepaalde in de [artikelen 5, eerste en derde lid][ref1],
      [14, eerste lid][ref2][15, eerste lid][ref3], en [21][ref4], en met de voorschriften, krachtens deze wet gegeven,
      voor zover overtreding daarvan een strafbaar feit is.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005443#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005443#Artikel21
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005443
        artikel: '15'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005443
        artikel: '21'
        hoofdstuk: III
  - number: '4.2'
    text: |-
      Gelijke verplichting rust op het toezichthoudend personeel, voor zover het door het hoofd of de bestuurder
      schriftelijk met de zorg voor de naleving van die bepalingen is belast.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel4
  - number: '4.3'
    text: |-
      Aan de verplichting van het hoofd of de bestuurder en van het toezichthoudend personeel is voldaan, wanneer zij
      aantonen, dat door hen de nodige bevelen zijn gegeven, de nodige maatregelen zijn genomen, de nodige middelen zijn
      verschaft en het redelijkerwijze te vorderen toezicht is gehouden om de naleving te verzekeren van de bepalingen,
      voor welke naleving zij verplicht waren te zorgen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel4
  - number: '5.1'
    text: Het is verboden binnenlands beroepsvervoer te verrichten zonder een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het verbod in het eerste lid kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gegeven omtrent de voorwaarden waaronder niet in Nederland gevestigde ondernemers beroepsvervoer op Nederlands
      grondgebied kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel5
  - number: '5.3'
    text: Het is verboden grensoverschrijdend beroepsvervoer te verrichten zonder een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel5
  - number: '5.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen vormen van beroepsvervoer worden aangewezen, waarop de in het eerste en
      derde lid bedoelde verboden niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel5
  - number: '6'
    text: |-
      Indien niet binnen acht weken na het in behandeling nemen van een aanvraag om een vergunning voor binnenlands
      beroepsvervoer en een aanvraag om een communautaire vergunning is beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om een vergunning voor binnenlandse beroepsvervoer en een aanvraag om een communautaire vergunning
      worden afgewezen indien de aanvrager of, indien de aanvraag door de vennoten van een vennootschap zonder
      rechtspersoonlijkheid, de maten van een maatschap dan wel een rechtspersoon wordt ingediend, één der vennoten,
      maten of bestuurders van die rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
  - number: 7.1.a
    text: |-
      houder is geweest van een zodanige vergunning, welke in de periode van twee jaren voorafgaande aan de aanvraag
      is ingetrokken op grond van het feit dat niet meer wordt voldaan aan de eis van betrouwbaarheid als bedoeld in
      [artikel 8, eerste lid, onderdeel ][ref1], of op grond van [artikel 12, eerste lid, onderdeel ][ref2], dan wel op
      grond van deze artikelen intrekking wordt overwogen;


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel12
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '12'
        hoofdstuk: II
  - number: 7.1.b
    text: |-
      ingeschreven is geweest als eigen vervoerder en zijn inschrijving in de periode van twee jaren voorafgaande aan
      de aanvraag is doorgehaald op grond van [artikel 23, eerste lid, onderdeel ][ref1], dan wel een doorhaling op de
      gronden van [artikel 23, eerste lid, onderdeel ][ref2], wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: '7.2'
    text: |-
      Een aanvraag om een vergunning als bedoeld in het eerste lid, kan worden afgewezen in het geval en onder de
      voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '7.3'
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '7.4'
    text: |-
      Het bepaalde in het eerste en tweede lid is eveneens van toepassing indien de aanvrager bestuurder van een
      rechtspersoon, vennoot van een vennootschap zonder rechtspersoonlijkheid, dan wel maat van een maatschap is of is
      geweest en tevens permanent en daadwerkelijk leiding geeft of heeft gegeven aan het vervoer en op de vergunning dan
      wel de inschrijving van die rechtspersoon, vennootschap zonder rechtspersoonlijkheid dan wel maatschap de procedure
      tot intrekking dan wel doorhaling als bedoeld in het eerste en tweede lid, is of wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel7
  - number: '8.1'
    text: 'Een vergunning voor binnenlands beroepsvervoer wordt verleend indien wordt voldaan aan de eisen van:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel8
  - number: 8.1.a
    text: |-
      betrouwbaarheid, door degene die permanent en daadwerkelijk leiding geeft aan het beroepsvervoer of indien deze
      leiding bij meer personen berust, door ieder van hen;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel8
  - number: 8.1.b
    text: |-
      kredietwaardigheid, door de ondernemer of indien meer natuurlijke personen gezamenlijk als ondernemer optreden,
      door hen gezamenlijk; en
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel8
  - number: 8.1.c
    text: |-
      vakbekwaamheid, door degene die permanent en daadwerkelijk leiding geeft aan het beroepsvervoer of indien deze
      leiding bij meer personen berust, door ten minste een van hen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de in het eerste
      lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel8
  - number: '9.1'
    text: |-
      Een communautaire vergunning wordt slechts verleend en is na verlening slechts geldig, indien de aanvrager
      van die vergunning in het bezit is van een vergunning voor binnenlands beroepsvervoer als bedoeld in
      [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid wordt een communautaire vergunning slechts verleend, indien binnen
      de onderneming wordt voldaan aan een bij algemene maatregel van bestuur vast te stellen aanvullende eis van
      vakbekwaamheid voor grensoverschrijdend beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel9
  - number: '10.1'
    text: |-
      Een vergunning voor binnenlands beroepsvervoer wordt, behoudens het bepaalde in [artikel 13, derde lid][ref1],
      verleend voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      Met betrekking tot de in het eerste lid genoemde vergunning worden op aanvraag van de vergunninghouder
      vergunningbewijzen afgegeven. Deze zijn eveneens geldig voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel10
  - number: '10.3'
    text: |-
      Behoudens het bepaalde in [artikel 13, derde lid][ref1], wordt een communautaire vergunning verleend voor vijf jaar
      en kan op aanvraag telkens voor dezelfde periode worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      Met betrekking tot de in het derde lid genoemde vergunning worden aan de vergunninghouder het aantal gewaarmerkte
      kopieën afgegeven dat overeenkomt met het aantal vrachtauto’s waarover hij de beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel10
  - number: '11.1'
    text: |-
      Behoudens het bepaalde in [artikel 13, derde lid][ref1], vervalt een vergunning voor binnenlands beroepsvervoer van
      rechtswege met ingang van het tijdstip van:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: 11.1.a
    text: overlijden dan wel intreden van wettelijke onbekwaamheid van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel11
  - number: 11.1.b
    text: |-
      ontbinding van de vennootschap zonder rechtspersoonlijkheid of beëindiging van de maatschap, waaraan de vergunning
      is verleend; of
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel11
  - number: 11.1.c
    text: ontbinding van de rechtspersoon, waaraan de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel11
  - number: '11.2'
    text: |-
      Behoudens het bepaalde in de [artikelen 10, derde lid][ref1], en [13, derde lid][ref2], vervalt een communautaire
      vergunning van rechtswege met ingang van het tijdstip waarop de vergunning, bedoeld in het eerste lid, vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: '12.1'
    text: 'Een vergunning voor binnenlands beroepsvervoer wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
  - number: 12.1.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
  - number: 12.1.b
    text: indien een vergunning verleend is op grond van onjuiste gegevens;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
  - number: 12.1.c
    text: |-
      indien niet langer wordt voldaan aan de eisen bedoeld in [artikel 8, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
        hoofdstuk: II
  - number: 12.1.d
    text: |-
      indien herhaaldelijk in strijd is gehandeld met het bepaalde in [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      Een vergunning voor binnenlands beroepsvervoer kan worden ingetrokken in het geval en onder de voorwaarden, bedoeld
      in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '12.3'
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, kan het Bureau bevordering integriteitsbeoordelingen door het
      openbaar bestuur, bedoeld in [artikel 8 van de Wet bevordering integere besluitvorming openbaar bestuur][ref1], om
      een advies als bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '12.4'
    text: 'Een communautaire vergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
  - number: 12.4.a
    text: indien de vergunninghouder niet meer in het bezit is van een vergunning voor binnenlands beroepsvervoer; of
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
  - number: 12.4.b
    text: |-
      indien binnen de onderneming niet meer wordt voldaan aan de aanvullende eis van vakbekwaamheid, bedoeld in
      [artikel 9, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel9
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '9'
        hoofdstuk: II
  - number: '12.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven in welke gevallen niet langer wordt
      voldaan aan de eis, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1], alsmede in welke gevallen sprake is van
      herhaaldelijk in strijd handelen met het bepaalde in [artikel 14, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
  - number: '12.4'
    text: |-
      Ter uitvoering van het eerste lid, onderdelen c en d, worden strafrechtelijke persoonsgegevens verwerkt.
      De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of de personen, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], niet langer voldoen aan de eisen van betrouwbaarheid, onderscheidenlijk
      teneinde te kunnen beoordelen of de vergunninghouder herhaaldelijk in strijd met [artikel 14, eerste lid][ref2],
      heeft gehandeld. De NIWO is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Indien als gevolg van overlijden of lichamelijke of wettelijke onbekwaamheid niet meer wordt voldaan aan de eisen
      van betrouwbaarheid en vakbekwaamheid, kan in individuele gevallen op een daartoe strekkende aanvraag ten behoeve
      van een tijdelijke voortzetting van een onderneming een vergunning voor binnenlands beroepsvervoer dan wel een
      communautaire vergunning worden verleend.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel13
  - number: '13.2'
    text: |-
      Met betrekking tot een vergunning, bedoeld in het eerste lid, worden vergunningbewijzen onderscheidenlijk
      gewaarmerkte kopieën afgegeven.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel13
  - number: '13.3'
    text: |-
      Een vergunning, als bedoeld in het eerste lid, wordt verleend voor de periode van een jaar, welke periode in naar
      behoren gemotiveerde speciale gevallen met maximale zes maanden kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel13
  - number: '13.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de in het eerste lid bedoelde
      vergunningen. Deze regels hebben in elk geval betrekking op de omstandigheden, waaronder deze vergunningen kunnen
      worden vervangen door een vergunning als bedoeld in [artikel 5, eerste, onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Het is een vergunninghouder, verboden vervoer te verrichten met gebruikmaking van bestuurders van vrachtauto’s die
      niet bij hem in dienstbetrekking zijn.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: '14.2'
    text: |-
      Ten blijke van de in het eerste lid bedoelde dienstbetrekking wordt door de vergunninghouder en de bestuurder van
      een vrachtauto gezamenlijk een verklaring opgesteld waarin in ieder geval wordt vermeld dat:
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: 14.2.a
    text: het vervoer voor rekening en risico van de vergunninghouder wordt verricht; en
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: 14.2.b
    text: tussen de vergunninghouder en de bestuurder van een vrachtauto sprake is van een loons- en gezagsverhouding.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: '14.3'
    text: Onze Minister stelt het model vast van de in het tweede lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: '14.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven over de gevallen waarin Onze Minister ontheffing kan
      verlenen van het in het eerste lid vermelde verbod, alsmede over de in die gevallen benodigde documenten.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: '14.5'
    text: Een ontheffing kan onder beperkingen worden verleend en aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel14
  - number: '15.1'
    text: Het is verboden eigen vervoer te verrichten zonder als eigen vervoerder te zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel15
  - number: '15.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing ten aanzien van de houder van een vergunning voor
      beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel15
  - number: '15.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen vormen van eigen vervoer worden aangewezen waarop het in het eerste lid
      bedoelde verbod niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel15
  - number: '16'
    text: Bij de inschrijving van eigen vervoer worden vermeld de naam en de aard van de onderneming of het bedrijf.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel16
  - number: '17'
    text: |-
      Indien niet binnen acht weken na het in behandeling nemen van een aanvraag om inschrijving, wijziging of verlenging
      is beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel17
  - number: '18.1'
    text: |-
      Een aanvraag om inschrijving wordt afgewezen indien de aanvrager of, indien de aanvrager door de vennoten van een
      vennootschap zonder rechtspersoonlijkheid, de maten van een maatschap dan wel een rechtspersoon wordt ingediend,
      één der vennoten, maten of bestuurders van die rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel18
  - number: 18.1.a
    text: |-
      in het bezit is geweest van een zodanige inschrijving, welke in de periode van twee jaren voorafgaand
      aan het tijdstip waarop de aanvraag wordt ingediend, is doorgehaald op grond van het bepaalde in
      [artikel 23, eerste lid, onderdeel c][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: 18.1.b
    text: |-
      in het bezit is van een inschrijving, waarvan op het tijdstip waarop de aanvraag wordt ingediend, doorhaling op de
      gronden bedoeld in [artikel 23, eerste lid, onderdeel c][ref1], wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: '18.2'
    text: |-
      Het bepaalde in het eerste lid is eveneens van toepassing indien de aanvrager bestuurder van een rechtspersoon,
      vennoot van een vennootschap zonder rechtspersoonlijkheid dan wel maat van een maatschap is of is geweest
      en tevens verantwoordelijkheid draagt of heeft gedragen voor het vervoer en op de inschrijving van die
      rechtspersoon, vennootschap zonder rechtspersoonlijkheid, dan wel maatschap de procedure bedoeld in
      [artikel 23, eerste lid, onderdeel c][ref1], is of wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: '19.1'
    text: |-
      Tot inschrijving wordt eerst overgegaan indien door de aanvrager is aangetoond dat het vervoer waarvoor de
      inschrijving wordt verzocht, is aan te merken als eigen vervoer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel19
  - number: '19.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven omtrent de voorwaarden waaronder sprake is van eigen
      onderneming of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel19
  - number: '20.1'
    text: Een inschrijving wordt verleend voor een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel20
  - number: '20.2'
    text: |-
      Na afloop van de in het eerste lid genoemde termijn kan de geldigheidsduur van de inschrijving telkens op aanvraag
      van de ondernemer met een zelfde termijn verlengd worden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel20
  - number: '20.3'
    text: |-
      Op aanvraag van de ingeschrevene worden inschrijvingsbewijzen afgegeven. Deze hebben eveneens een geldigheidsduur
      van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel20
  - number: '21'
    text: Het is verboden goederen die niet overeenstemmen met de aard van het bedrijf in eigen vervoer te vervoeren.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel21
  - number: '22'
    text: |-
      Onverminderd het bepaalde in [artikel 23][ref1] vervalt een inschrijving van rechtswege met ingang van het tijdstip
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: 22.a
    text: overlijden dan wel intreden van wettelijke onbekwaamheid van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel22
  - number: 22.b
    text: |-
      ontbinding van de vennootschap zonder rechtspersoonlijkheid of beëindiging van de maatschap, welke is ingeschreven;
      of
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel22
  - number: 22.c
    text: ontbinding van de rechtspersoon, welke is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel22
  - number: '23.1'
    text: 'Een inschrijving wordt doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel23
  - number: 23.1.a
    text: op aanvraag van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel23
  - number: 23.1.b
    text: indien een inschrijving verleend is op grond van onjuiste gegevens; of
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel23
  - number: 23.1.c
    text: |-
      indien herhaaldelijk gehandeld is in strijd met het bepaalde in [artikel 5, eerste lid of derde lid][ref1], dan
      wel [artikel 21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel21
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '21'
        hoofdstuk: III
  - number: '23.2'
    text: Bij algemene maatregel van bestuur worden regels gegeven omtrent het bepaalde in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel23
  - number: '24'
    text: |-
      [Artikel 5, derde lid][ref1], en [artikel 15, eerste lid][ref2], zijn niet van toepassing op grensoverschrijdend
      vervoer door de ondernemer, die niet in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel15
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '15'
        hoofdstuk: III
  - number: '25.1'
    text: |-
      Het is de niet in Nederland gevestigde ondernemer verboden grensoverschrijdend vervoer op Nederlands grondgebied te
      verrichten zonder in het bezit te zijn van een daartoe strekkende machtiging.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel25
  - number: '25.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel25
  - number: 25.2.a
    text: de voorwaarden waaronder de machtiging kan worden verleend en ingetrokken;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel25
  - number: 25.2.b
    text: de mogelijkheid tot verlenen van vrijstelling van deze machtiging;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel25
  - number: 25.2.c
    text: de mogelijkheid de toegang tot Nederland te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel25
  - number: '26.1'
    text: |-
      Het is de in Nederland gevestigde ondernemer verboden grensoverschrijdend vervoer te verrichten zonder in het bezit
      te zijn van bij algemene maatregel van bestuur nader te noemen aanvullende documenten.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel26
  - number: '26.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel26
  - number: 26.2.a
    text: de afgifte, het gebruik en de intrekking van aanvullende documenten;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel26
  - number: 26.2.b
    text: |-
      de mogelijkheid tot het verlenen van vrijstelling van het gebruik van de in onderdeel *a* bedoelde aanvullende
      documenten;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel26
  - number: 26.2.c
    text: |-
      het vervoer dat door een in Nederland gevestigde ondernemer geheel in een ander land, al dan niet onder gelding van
      een speciaal document, wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel26
  - number: '27.1'
    text: |-
      Ter dekking van de kosten die verband houden met de werkzaamheden van de NIWO als bedoeld in
      [artikel 32, onderdelen ][ref1], dan wel de werkzaamheden van de SIEV als bedoeld in [artikel 34][ref2], is de
      aanvrager een vergoeding verschuldigd voor:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel34
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '34'
        hoofdstuk: VI
  - number: 27.1.a
    text: |-
      behandeling van een aanvraag om verlening van een vergunning als bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
  - number: 27.1.b
    text: |-
      behandeling van een aanvraag tot voortzetting van de exploitatie van een onderneming als bedoeld in
      [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: 27.1.c
    text: |-
      afgifte van een vergunningbewijs als bedoeld in [artikel 10, tweede lid][ref1], alsmede een gewaarmerkte kopie als
      bedoeld in [artikel 10, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel10
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
  - number: 27.1.d
    text: |-
      behandeling en afgifte van een document als bedoeld in [artikel 26, eerste lid][ref1], respectievelijk tweede lid,
      onderdeel *c*;


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel26
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '26'
        hoofdstuk: V
  - number: 27.1.e
    text: |-
      behandeling van een aanvraag om machtiging als bedoeld in [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
        hoofdstuk: IV
  - number: 27.1.f
    text: |-
      behandeling van een aanvraag om inschrijving voor eigen vervoer als bedoeld in [artikel 15, eerste lid][ref1], of
      een wijziging of een verlenging daarvan; of


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel15
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '15'
        hoofdstuk: III
  - number: 27.1.g
    text: |-
      afgifte van een inschrijvingsbewijs als bedoeld in [artikel 20, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
        hoofdstuk: III
  - number: '27.2'
    text: |-
      De houder van een vergunning voor binnenlands beroepsvervoer alsmede de houder van een communautaire
      vergunning zijn ter dekking van de kosten die verband houden met de werkzaamheden als bedoeld in
      [artikel 32, onderdeel ][ref1], jaarlijks vergoedingen verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel32
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '32'
        hoofdstuk: VI
  - number: '27.3'
    text: |-
      Onze Minister stelt op voordracht van de NIWO de hoogte van de vergoedingen vast van de in het eerste lid,
      onderdelen *a*, *b*, *c* en *d* en *e* voor wat betreft beroepsvervoer, bedoelde handelingen, en van de
      vergoedingen bedoeld in het tweede lid. Deze vergoedingen worden voldaan aan de NIWO.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
  - number: '27.4'
    text: |-
      Onze Minister stelt op voordracht van de SIEV de hoogte vast van de vergoedingen voor de in het eerste lid,
      onderdelen *f* en *g*, en *d* en *e* voor wat betreft eigen vervoer, bedoelde handelingen. Deze vergoedingen worden
      voldaan aan de SIEV.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
  - number: '27.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de wijze waarop de vergoedingen bedoeld
      in het eerste en het tweede lid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel27
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de aanvraag, inhoud,
      afgifte, het gebruik en de inlevering van de volgende documenten:
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
  - number: 28.1°
    text: |-
      de vergunning als bedoeld in de [artikelen 5, eerste en derde][ref1], onderscheidenlijk [13, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: 28.2°
    text: |-
      het vergunningsbewijs, de gewaarmerkte kopie en het inschrijvingsbewijs, bedoeld in de
      [artikelen 10, tweede lid][ref1], [10, vierde lid][ref2], onderscheidenlijk [20, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005443
        artikel: '20'
        hoofdstuk: III
  - number: 28.3°
    text: |-
      de verklaring van dienstbetrekking, bedoeld in [artikel 14, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
  - number: 28.4°
    text: |-
      het document, bedoeld in [artikel 14, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
        hoofdstuk: II
  - number: 28.5°
    text: |-
      de vrachtbrief, bedoeld in [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel29
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '29'
        hoofdstuk: V
  - number: 28.6°
    text: |-
      de machtiging, bedoeld in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
        hoofdstuk: IV
  - number: '29.1'
    text: |-
      Het is verboden vervoer krachtens een vergunning voor binnenlands beroepsvervoer onderscheidenlijk een
      communautaire vergunning als bedoeld in [artikel 5, eerste lid, onderscheidenlijk derde lid][ref1], te verrichten
      indien met betrekking tot dat vervoer geen vrachtbrief is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
  - number: '29.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen vormen van beroepsvervoer worden aangewezen waarop het in
      het eerste lid bedoelde verbod niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel29
  - number: '30.1'
    text: |-
      De vergunninghouder, en de ingeschrevene zijn verplicht aan Onze Minister gegevens betreffende het vervoer te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel30
  - number: '30.2'
    text: Onze Minister kan omtrent de te verstrekken gegevens en de wijze waarop zij worden verstrekt, nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel30
  - number: '31'
    text: |-
      Het is verboden beroepsvervoer of eigen vervoer te verrichten met een vrachtauto ten aanzien waarvan in strijd
      wordt gehandeld met de bij algemene maatregel van bestuur aangewezen bepalingen die zijn vastgesteld bij of
      krachtens de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '32'
    text: 'De NIWO is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
  - number: 32.a
    text: |-
      verlening en intrekking van vergunningen voor binnenlands beroepsvervoer als bedoeld in [artikel 8][ref1]
      onderscheidenlijk [artikel 12, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel12
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '12'
        hoofdstuk: II
  - number: 32.b
    text: |-
      verlening en intrekking van communautaire vergunningen als bedoeld in [artikel 9][ref1] onderscheidenlijk
      [artikel 12, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel12
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '12'
        hoofdstuk: II
  - number: 32.c
    text: |-
      afgifte van vergunningbewijzen en gewaarmerkte kopieën als bedoeld in
      [artikel 10, tweede, onderscheidenlijk vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel10
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '10'
        hoofdstuk: II
  - number: 32.d
    text: |-
      verlening en intrekking van machtigingen strekkende tot het verrichten van grensoverschrijdend vervoer als bedoeld
      in [artikel 25, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
        hoofdstuk: IV
  - number: 32.e
    text: |-
      afgifte van aanvullende documenten voor grensoverschrijdend beroepsvervoer als bedoeld in
      [artikel 26, eerste lid, respectievelijk tweede lid, onderdeel ][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel26
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '26'
        hoofdstuk: V
  - number: 32.f
    text: |-
      overige bij of krachtens algemene maatregel van bestuur op te dragen werkzaamheden, zowel ten aanzien van het
      binnenlands beroepsvervoer als het grensoverschrijdend beroepsvervoer.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel32
  - number: '33.1'
    text: |-
      Het bestuur van de NIWO is samengesteld uit leden die voor ten hoogste twee jaar worden benoemd door
      representatieve organisaties die de onderscheiden belangen ten aanzien van het beroepsvervoer vertegenwoordigen en
      die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel33
  - number: '33.2'
    text: |-
      De samenstelling van het bestuur dient zodanig te zijn, dat de in het eerste lid bedoelde organisaties in een door
      Onze Minister vast te stellen onderlinge verhouding zijn vertegenwoordigd met dien verstande dat het door eenzelfde
      organisatie te benoemen aantal leden nimmer meer bedraagt dan de helft van het totaal aantal leden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel33
  - number: '33.3'
    text: De organisaties wijzen plaatsvervangers aan voor de door hen benoemde leden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel33
  - number: '33.4'
    text: De vergaderingen van het bestuur kunnen worden bijgewoond door ambtenaren die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel33
  - number: '34'
    text: 'De SIEV is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
  - number: 34.a
    text: |-
      verrichting van inschrijvingen van eigen vervoer alsmede het wijzigen daarvan als bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel17
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '17'
        hoofdstuk: III
  - number: 34.b
    text: |-
      verlenging van de geldigheidsduur van inschrijvingen als bedoeld in [artikel 20, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
        hoofdstuk: III
  - number: 34.c
    text: |-
      afgifte van inschrijvingsbewijzen als bedoeld in [artikel 20, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
        hoofdstuk: III
  - number: 34.d
    text: |-
      doorhaling van inschrijvingen als bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '23'
        hoofdstuk: III
  - number: 34.e
    text: |-
      afgifte en intrekking van machtigingen voor grensoverschrijdend eigen vervoer als bedoeld in
      [artikel 25, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
        hoofdstuk: IV
  - number: 34.f
    text: |-
      afgifte en intrekking van aanvullende documenten voor grensoverschrijdend eigen vervoer als bedoeld in
      [artikel 26, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel26
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '26'
        hoofdstuk: V
  - number: 34.g
    text: |-
      deelname aan onderhandelingen in het kader van bilaterale verdragen met andere Staten, dan wel ter afsluiting van
      bilaterale verdragen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel34
  - number: '35.1'
    text: |-
      Het bestuur van de SIEV is samengesteld uit leden die voor ten hoogste twee jaar worden benoemd door
      representatieve organisaties die de onderscheiden belangen ten aanzien van eigen vervoer vertegenwoordigen en die
      door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel35
  - number: '35.2'
    text: De organisaties wijzen plaatsvervangers aan voor de door hen benoemde leden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel35
  - number: '35.3'
    text: De vergaderingen van het bestuur kunnen worden bijgewoond door ambtenaren die door Onze Minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel35
  - number: '36.1'
    text: |-
      De NIWO onderscheidenlijk de SIEV brengt geen wijziging aan in haar statuten of neemt geen besluit tot opheffing
      dan na instemming door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel36
  - number: '36.2'
    text: |-
      De NIWO onderscheidenlijk de SIEV regelt haar werkzaamheden in een reglement. Dit reglement alsmede wijzigingen
      daarin treden niet in werking dan na instemming door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel36
  - number: '36.3'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '37.1'
    text: |-
      De NIWO onderscheidenlijk de SIEV maakt jaarlijks een begroting van baten en lasten op, die de instemming van
      Onze Minister behoeft. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '37.2'
    text: |-
      De NIWO onderscheidenlijk de SIEV legt jaarlijks rekening en verantwoording af van haar financieel beheer in een
      jaarrekening, dat vergezeld gaat van een rapport van een registeraccountant.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel37
  - number: '38'
    text: |-
      De NIWO onderscheidenlijk de SIEV brengt jaarlijks aan Onze Minister een verslag uit over de uitvoering van
      haar taken en maakt dit gelijktijdig openbaar. Het jaarverslag van de NIWO bevat mede een passage over haar in
      [artikel 32][ref1] omschreven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel32
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '32'
        hoofdstuk: VI
  - number: '39'
    text: Van de beschikkingen van de NIWO en de SIEV wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel39
  - number: '40'
    text: |-
      Voor zover de NIWO onderscheidenlijk de SIEV beleidsregels vaststelt verband houdende met haar in
      [artikel 32][ref1], onderscheidenlijk [artikel 34][ref2] omschreven taken, worden deze bekend gemaakt door
      publikatie in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel34
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '34'
        hoofdstuk: VI
  - number: '41.1'
    text: |-
      Indien naar het oordeel van Onze Minister de NIWO onderscheidenlijk de SIEV haar taken, omschreven in
      [artikel 32][ref1], onderscheidenlijk [artikel 34][ref2] niet langer naar behoren verricht, ontheft Onze Minister
      de NIWO, onderscheidenlijk de SIEV, van haar taken.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel34
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '34'
        hoofdstuk: VI
  - number: '41.2'
    text: |-
      In een geval als bedoeld in het eerste lid draagt Onze Minister zorg voor de uitoefening van de aldaar bedoelde
      taken.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel41
  - number: '42'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel42
  - number: '43'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel43
  - number: 43.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 43.b
    text: de door Onze Minister aangewezen ambtenaren van het Ministerie van Verkeer en Waterstaat; alsmede
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel43
  - number: 43.c
    text: |-
      de door Onze Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister aangewezen
      ambtenaren van het Ministerie van Sociale Zaken en Werkgelegenheid, met dien verstande dat hun bevoegdheid
      krachtens deze wet bij die aanwijzing kan worden beperkt tot een of meer onderdelen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel43
  - number: '49.1'
    text: |-
      De ambtenaren, belast met de opsporing van overtredingen van deze wet, zijn bevoegd het vervoer van goederen dat
      wordt verricht in strijd met het bepaalde in de [artikelen 5, eerste en derde lid][ref1], [15 eerste lid][ref2],
      en [25][ref3] en het bepaalde krachtens [artikel 28, onder 1° en 2°][ref4], te beletten en de vrachtauto waarmee
      de overtreding is gepleegd gedurende ten hoogste 48 uren in bewaring te stellen, teneinde de verboden toestand te
      doen ophouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005443#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0005443#Artikel28
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '15'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005443
        artikel: '25'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0005443
        artikel: '28'
        hoofdstuk: V
  - number: '49.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd de in bewaring gestelde vrachtauto op kosten van de houder
      naar een door hen aangewezen plaats over te brengen of te doen overbrengen. Zo nodig kunnen zij hierbij de hulp van
      de sterke arm inroepen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.3'
    text: |-
      De bestuurder van de vrachtauto is verplicht op eerste vordering van de in het eerste lid bedoelde ambtenaren zijn
      medewerking te verlenen ter zake van de uitvoering van het in de vorige leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.4'
    text: |-
      Van iedere inbewaringstelling maakt de betrokken ambtenaar proces-verbaal op. Hij zendt dit proces-verbaal
      binnen vierentwintig uur aan de officier van justitie bij de rechtbank binnen het rechtsgebied waarvan de
      inbewaringstelling is geschied. Een afschrift van het proces-verbaal wordt gelijktijdig uitgereikt of toegezonden
      aan de bestuurder, alsmede de houder van de vrachtauto.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.5'
    text: 'Tegen een inbewaringstelling kan elke belanghebbende gedurende vier weken een bezwaarschrift indienen op grond dat:'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: 49.5.a
    text: |-
      zij in strijd was met het bepaalde in het eerste lid, of omdat geen redelijk vermoeden van een strafbaar feit als
      daar bedoeld, aanwezig was;
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: 49.5.b
    text: |-
      het belang dat door het overtreden voorschrift werd beschermd in geen redelijke verhouding stond tot het belang dat
      door de inbewaringstelling werd geschaad; dan wel
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: 49.5.c
    text: |-
      de inbewaringstelling anderszins in strijd was met enig in het algemeen rechtsbewustzijn levend beginsel van
      behoorlijk bestuur.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.6'
    text: |-
      Het bezwaarschrift wordt ingediend bij de rechtbank, bedoeld in het vierde lid. De behandeling vindt plaats door
      een economische kamer van die rechtbank. De rechtbank beslist zo spoedig mogelijk nadat de belanghebbende is
      gehoord, althans behoorlijk is opgeroepen. Indien de rechtbank het bezwaarschrift gegrond acht, kan zij bepalen
      dat ten laste van het Rijk een vergoeding zal worden toegekend, onverminderd het recht van de belanghebbende om op
      grond van andere wettelijke bepalingen schadevergoeding te vragen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.7'
    text: |-
      Van de beschikking van de rechtbank kan het Openbaar Ministerie binnen twee weken en de belanghebbende binnen
      twee weken nadat zij hem betekend werd in beroep komen bij het Hof. Het zesde lid is op de behandeling van het
      beroepschrift van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '49.8'
    text: |-
      Van de beschikking van het Hof kan het Openbaar Ministerie binnen twee weken en de belanghebbende binnen twee weken
      nadat zij hem betekend werd beroep in cassatie instellen. De Hoge Raad beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel49
  - number: '50.1'
    text: |-
      De in [artikel 49, tweede lid][ref1], bedoelde kosten kunnen door de Minister worden ingevorderd bij dwangbevel,
      dat op kosten van de schuldenaar bij deurwaarders exploot wordt betekend en ten uitvoer gelegd op de wijze bij het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] ten aanzien van vonnissen en authentieke akten voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '49'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '50.2'
    text: |-
      Binnen vier weken na betekening staat verzet open tegen het dwangbevel door dagvaarding van de Staat. Het verzet
      schorst de tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel50
  - number: '53'
    text: |-
      De Nederlandse strafwet is mede van toepassing op de Nederlander en de in Nederland gevestigde ondernemer die zich
      buiten Nederland schuldig maakt aan een overtreding van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel53
  - number: '54'
    text: |-
      De uitreiking van gerechtelijke mededelingen in zaken betreffende overtredingen van het bepaalde bij of krachtens
      deze wet, begaan door een niet in Nederland gevestigde ondernemer, kan eveneens geschieden aan de bestuurder van
      de betrokken vrachtauto die zich bereid verklaart om de mededeling onverwijld aan degene voor wie zij bestemd is te
      doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel54
  - number: '55'
    text: |-
      Op de dag waarop dit artikel in werking treedt, verlijdt de Raad van Beheer van de Stichting Nederlandsche
      Internationale Wegvervoer Organisatie ten overstaan van een notaris een akte waarbij de statuten van die stichting
      ten minste als volgt worden gewijzigd:
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel55
  - number: 55.a
    text: 'de naam van de stichting wordt gewijzigd in: Stichting Nationale en Internationale Wegvervoer Organisatie;'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel55
  - number: 55.b
    text: de taak van de stichting wordt in overeenstemming gebracht met de haar bij deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel55
  - number: '56'
    text: |-
      Op de dag waarop dit artikel in werking treedt, verlijdt het presidium van de Raad van Bestuur van de Stichting
      Inschrijving Eigen Vervoer ten overstaan van een notaris een akte waarbij de statuten van die stichting in
      overeenstemming worden gebracht met de haar bij deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel56
  - number: '57'
    text: De Wet Autovervoer Goederen (*Stb.* 1987, 97) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel57
  - number: '58'
    text: |-
      Vergunningen die zijn verleend ingevolge artikel 4 van de Wet Autovervoer Goederen dan wel ingevolge artikel 19
      van het Uitvoeringsbesluit autovervoer goederen 1988 (*Stb.* 1988, 209) en die gelden op het tijdstip van het
      in werking treden van deze wet, worden vanaf dat tijdstip aangemerkt als vergunningen voor binnenlands vervoer
      onderscheidenlijk communautaire vergunningen als bedoeld in [artikel 5, eerste onderscheidenlijk derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
        hoofdstuk: II
  - number: '59'
    text: |-
      Voor zover in [artikel 58][ref1] sprake is van tijdelijke vergunningen die gelden op het tijdstip van het in
      werking treden van deze wet, zijn deze, behoudens eerdere intrekking, geldig tot het tijdstip waarop zij hun
      geldigheid ingevolge de Wet Autovervoer Goederen zouden verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel58
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '58'
        hoofdstuk: IX
  - number: '60.1'
    text: |-
      Inschrijvingen voor eigen vervoer ingevolge artikel 4 van de Wet Autovervoer Goederen die gelden op het tijdstip
      van het in werking treden van deze wet, worden vanaf dat tijdstip aangemerkt als inschrijvingen als bedoeld in
      [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
        hoofdstuk: III
  - number: '60.2'
    text: |-
      Inschrijvingsbewijzen afgegeven ingevolge de Wet Autovervoer Goederen behouden hun geldigheid tot het tijdstip
      waarop zij hun geldigheid ingevolge het Uitvoeringsbesluit autovervoer goederen 1988 zouden verliezen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel60
  - number: '60.3'
    text: |-
      Inschrijvingsbewijzen die de eerste maal worden afgegeven met betrekking tot inschrijvingen voor eigen vervoer als
      bedoeld in het eerste lid hebben een geldigheidsduur gelijk aan die van de inschrijving waarop zij berusten.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel60
  - number: '61'
    text: |-
      Tijdelijke inschrijvingen voor grensoverschrijdend eigen vervoer ingevolge artikel 51 van het Uitvoeringsbesluit
      autovervoer goederen 1988, die gelden op het tijdstip van het in werking treden van deze wet, worden vanaf dat
      tijdstip aangemerkt als inschrijving als bedoeld in [artikel 15][ref1], met dien verstande dat zij slechts geldig
      zijn tot het tijdstip waarop zij hun geldigheid ingevolge de Wet Autovervoer Goederen zouden verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel15
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '15'
        hoofdstuk: III
  - number: '62.1'
    text: |-
      De behandeling van en de beslissing op aanvragen en verzoeken ter zake van vergunningen en inschrijvingen, alsmede
      verzoeken tot voortzetting van het bedrijf die zijn ingediend vóór het tijdstip van het in werking treden van deze
      wet geschiedt, voor zover daarop bij het in werking treden van deze wet nog niet is beslist, overeenkomstig de
      bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel62
  - number: '62.2'
    text: |-
      Op verzoeken om ontheffing van de eis van vakbekwaamheid die zijn ingediend vóór het tijdstip van het in werking
      treden van deze wet is [artikel 13][ref1] van deze wet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: '63.1'
    text: |-
      De behandeling van beroepen op beschikkingen ingevolge de Wet Autovervoer Goederen, geschiedt overeenkomstig de
      bepalingen van de Wet Autovervoer Goederen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel63
  - number: '63.2'
    text: |-
      Indien een beroep als bedoeld in het eerste lid gegrond wordt verklaard en zulks tot gevolg heeft dat op de aldaar
      bedoelde aanvraag of het aldaar bedoelde verzoek opnieuw moet worden beslist, geschiedt dit overeenkomstig de
      bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel63
  - number: '64'
    text: |-
      Vakbekwaamheid, op welke wijze dan ook onder de werkingssfeer van de Wet Autovervoer Goederen verworven, alsmede
      ontheffingen welke ter zake zijn verleend, blijven na het in werking treden van deze wet met inbegrip van de in
      voorkomend geval aan deze vakbekwaamheid dan wel ontheffing verbonden beperkingen, behouden.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel64
  - number: '65'
    text: |-
      Beschikkingen die vóór het tijdstip van het in werking treden van deze wet zijn genomen ingevolge artikel 56,
      zesde lid, van de Wet Autovervoer Goederen en die op dat tijdstip nog niet hebben geleid tot intrekking van de
      vergunning, behouden hun geldigheid ook na dat tijdstip, met dien verstande dat met het oog op de feitelijke
      intrekking alsnog een beschikking ingevolge [artikel 12, eerste lid, onderdeel ][ref1], wordt genomen. Daarbij
      worden de termijnen die in de krachtens de Wet Autovervoer Goederen genomen beschikkingen zijn opgenomen, in acht
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel12
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '12'
        hoofdstuk: II
  - number: '66'
    text: |-
      Het bepaalde in [artikel 65][ref1] is van overeenkomstige toepassing ten aanzien van doorhaling van een
      inschrijving als bedoeld in artikel 49, derde lid, van de Wet Autovervoer Goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel65
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '65'
        hoofdstuk: IX
  - number: '67.1'
    text: |-
      Op adviezen van het College van Advies, genomen op grond van artikel 45*a* van de Wet Autovervoer Goederen waarop
      de Commissie Vergunningen Wegvervoer nog niet heeft beslist op het tijdstip van in werking treden van deze wet,
      beslist Onze Minister overeenkomstig het bepaalde in artikel 42*a* van de Wet Autovervoer Goederen.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel67
  - number: '67.2'
    text: |-
      Beschikkingen, genomen op grond van het eerste lid alsmede beschikkingen, die vóór het tijdstip van in werking
      treden van deze wet zijn genomen op grond van artikel 42*a* van de Wet Autovervoer Goederen en op dat tijdstip nog
      niet in werking zijn getreden, worden uitgevoerd overeenkomstig de bepalingen van de Wet Autovervoer Goederen; de
      artikelen 52, 53 en 54*a* van die wet zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel67
  - number: '67.3'
    text: |-
      Beschikkingen, die vóór het tijdstip van in werking treden van deze wet zijn genomen op grond van artikel 49,
      derde lid, van de Wet Autovervoer Goederen en op dat tijdstip nog niet in werking zijn getreden, worden uitgevoerd
      overeenkomstig de bepalingen van die wet; de artikelen 52 en 54*a* van die wet zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel67
  - number: '68.1'
    text: |-
      Ten aanzien van beschikkingen, bedoeld in [artikel 67, eerste en tweede lid][ref1], welke inhouden een blijvende
      intrekking van de vergunning krachtens de Wet Autovervoer Goederen, is [artikel 7][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel7
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '67'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '7'
        hoofdstuk: II
  - number: '68.2'
    text: |-
      Ten aanzien van beschikkingen, welke inhouden een blijvende intrekking van de vergunning krachtens de Wet
      Autovervoer Goederen en genomen op grond van artikel 42*a* van die wet binnen twee jaar vóór het tijdstip van in
      werking treden van deze wet, is [artikel 7][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel7
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '7'
        hoofdstuk: II
  - number: '68.3'
    text: |-
      Ten aanzien van beschikkingen, bedoeld in [artikel 67, derde lid][ref1], welke inhouden een blijvende doorhaling
      van de inschrijving krachtens de Wet Autovervoer Goederen, zijn de [artikelen 7][ref2] en [18][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005443#Artikel18
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '67'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005443
        artikel: '18'
        hoofdstuk: III
  - number: '68.4'
    text: |-
      Ten aanzien van beschikkingen, welke inhouden een blijvende doorhaling van de inschrijving krachtens de Wet
      Autovervoer Goederen en genomen op grond van artikel 49, derde lid, van die wet binnen twee jaar vóór het tijdstip
      van in werking treden van deze wet, zijn de [artikelen 7][ref1] en [18][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel18
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '18'
        hoofdstuk: III
  - number: '69'
    text: |-
      Beschikkingen die vóór het tijdstip van in werking treden van deze wet zijn genomen ingevolge artikel 107, eerste
      of derde lid, van het Uitvoeringsbesluit Autovervoer Goederen 1988, worden aangemerkt als beschikkingen ingevolge
      [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
        hoofdstuk: II
  - number: '72'
    text: |-
      Onze Minister voert over voorstellen van wet, algemene maatregelen van bestuur en ministeriële regelingen op
      het terrein van het vervoer met vrachtauto’s overleg met vertegenwoordigers van representatieve organisaties van
      beroepsvervoerders, werknemers, eigen vervoerders en verladers in het goederenvervoer over de weg.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel72
  - number: '74'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel74
  - number: '75'
    text: |-
      Tot aan het tijdstip, waarop het bij koninklijke boodschap van 28 juni 1989 ingediende voorstel van wet tot
      instelling van een Raad voor verkeer en waterstaat (kamerstuk II, 1989-1990, 21 199) tot wet wordt verheven en in
      werking treedt, wordt het overleg, bedoeld in [artikel 72][ref1], gevoerd met de Adviescommissie Goederenvervoer,
      bedoeld in artikel 6 van de Wet Autovervoer Goederen. In afwijking van [artikel 57][ref2] blijft het bepaalde bij
      of krachtens de artikelen 6 en 7 van die wet tot dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel57
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '72'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '57'
        hoofdstuk: IX
  - number: '76'
    text: 'Deze wet kan worden aangehaald als: Wet goederenvervoer over de weg.'
    url: https://wetten.overheid.nl/BWBR0005443/2008-08-01#Artikel76
