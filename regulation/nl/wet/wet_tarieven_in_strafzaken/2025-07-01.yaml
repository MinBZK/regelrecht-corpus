        artikel: '9'
        paragraaf: '4'
  - number: '11'
    text: |-
      1 Indien de verzoeker in zijn bezwaarschrift de wens te kennen geeft te worden gehoord, wordt hij daartoe
      opgeroepen.

      2 Indien het bezwaarschrift is gericht tegen een beschikking van het openbaar ministerie, wordt dit in de
      gelegenheid gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel11
  - number: '12'
    text: Tegen de beslissing op het bezwaarschrift staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister van Justitie kan nadere regels stellen omtrent de wijze van toekennen van vergoedingen, van
      declareren, van goedkeuren van declaraties en van indienen van bezwaar.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel13
  - number: '14'
    text: |-
      Vergoedingen ten laste van 's Rijks kas worden, nadat de beschikking tot toekenning of goedkeuring van de
      declaratie onherroepelijk is geworden, betaald door de griffier van het gerecht, dat bevoegd is over de zaak te
      oordelen of van het gerecht waarvoor de zaak dient of heeft gediend.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel14
  - number: '15'
    text: |-
      Vergoedingen verschuldigd door de verdachte of de gerekwestreerde worden, nadat de beschikking tot toekenning
      of goedkeuring van de declaratie onherroepelijk is geworden, door deze betaald. De beschikking tot toekenning
      van de vergoeding en de beschikking tot goedkeuring van de declaratie, alsmede de beslissingen op de bezwaren
      tegen deze beschikkingen genomen, zijn op de minuut uitvoerbaar, overeenkomstig de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '16'
    text: |-
      1 De verdachte of de gerekwestreerde kan de krachtens [artikel 14][ref1] bevoegde griffier verzoeken, vergoedingen
      als bedoeld in [artikel 15][ref2] bij wijze van voorschot te zijnen behoeve aan de rechthebbenden te betalen.
      Het verzoek, dat schriftelijk moet worden gedaan, kan worden ingediend binnen 14 dagen nadat de beschikking tot
      toekenning van de vergoeding of de beschikking tot goedkeuring van de declaratie onherroepelijk is geworden. De
      griffier beslist zo spoedig mogelijk.

      2 Het voorschot dient binnen 3 maanden na het eindigen van de zaak te worden terugbetaald. Wordt aan de
      verplichting tot terugbetaling niet binnen de gestelde termijn voldaan, dan geschiedt invordering krachtens een
      door de griffier uit te vaardigen dwangbevel. [Artikel 30 van de Wet griffierechten burgerlijke zaken][ref3] is van
      overeenkomstige toepassing.

      3 In strafzaken wordt na het eindigen van de zaak een verzoek, gedaan ingevolge lid 1, aangemerkt als een verzoek
      als bedoeld in [artikel 529, tweede lid, van het Wetboek van Strafvordering][ref4]. Het wordt door de griffier
      zo spoedig mogelijk overgelegd aan het gerecht, bedoeld in dat artikel. De op grond van dat verzoek toegekende
      vergoeding wordt verrekend met het verleende voorschot.

      4 In zaken, als bedoeld in [artikel 1, lid 1][ref5], sub *b*, kan binnen 3 maanden na het eindigen van de zaak door
      de gewezen gerekwestreerde of zijn erfgenamen een verzoek om vrijstelling van de verplichting tot terugbetaling
      van het voorschot worden ingediend bij het gerecht in feitelijke aanleg, waarvoor de zaak tijdens de beëindiging
      daarvan heeft gediend of anders het laatst heeft gediend. Op het verzoek wordt beslist door de voorzieningenrechter
      of door de kantonrechter. De gevraagde vrijstelling wordt verleend voor zover de aanwending der kosten het belang
      van het onderzoek heeft gediend of door de intrekking van verzoekschrift of rechtsmiddelen door het Openbaar
      Ministerie nutteloos is geworden.

      5 Onze Minister van Justitie kan nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002406#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0028899#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel529
      [ref5]: https://wetten.overheid.nl/BWBR0002406#Artikel1
