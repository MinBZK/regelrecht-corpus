  - number: '17'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld met betrekking tot de vergoedingen,
      door de verdachte, de gewezen verdachte, de gerekwestreerde, de gewezen gerekwestreerde, derden-belanghebbenden
      of andere derden verschuldigd voor afschriften van, uittreksels uit en inzage van vonnissen, arresten,
      registers of andere stukken, waarvan kennisneming geoorloofd is, en voor inlichtingen in zaken, bedoeld in
      [artikel 1, lid 1][ref1], alsmede met betrekking tot het kosteloos bekomen van zodanige afschriften, uittreksels
      of inlichtingen.

      2 Geen recht wordt geheven van openbare colleges en van ambtenaren van openbare lichamen, die afschriften,
      uittreksels of inlichtingen behoeven in het belang van de uitoefening van de dienst, noch in gevallen waarin bij
      bijzondere wetten gratis afgifte van afschriften of uittreksels of verstrekking van inlichtingen is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel1
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel17
    references:
