  - number: '20'
    text: |-
      De wet van 18 april 1874 (*Stb.* 66) tot vaststelling der tarieven van gerechtskosten in strafzaken, waarvan de
      gewone rechter kennis neemt, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel20
  - number: '21'
    text: Deze wet kan worden aangehaald als Wet tarieven in strafzaken.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel21
  - number: IX
    text: |-
      In zaken, als bedoeld in [artikel 1, lid 1][ref1], aanhangig op de dag van inwerkingtreding van deze wet wordt het
      bij en krachtens deze wet bepaalde toegepast met ingang van die dag, met dien verstande dat voor werkzaamheden, die
      zijn verricht na de dag van inwerkingtreding van deze wet, voor tijdverzuim, met inbegrip van de daarmede verband
      houdende noodzakelijke kosten, dat valt na die dag en voor reis- en verblijfkosten, na die dag gemaakt, ingevolge
      een verzoek of opdracht gedaan en gegeven vóór die dag, ook vergoedingen worden toegekend overeenkomstig het bij en
      krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel1
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '1'
        paragraaf: '1'
  - number: X
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip. Wij behouden Ons voor een verschillend tijdstip
      vast te stellen voor verschillende delen van de wet.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#ArtikelX
