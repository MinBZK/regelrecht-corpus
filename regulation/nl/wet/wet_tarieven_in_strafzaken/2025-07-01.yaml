preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 8 april 1874, Stb. 66, tot vaststelling der
    tarieven van gerechtskosten in strafzaken, waarvan de gewone rechter kennis neemt, te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Op de voet van het bij en krachtens deze wet bepaalde worden vergoedingen toegekend voor werkzaamheden, voor
      tijdverzuim alsmede voor daarmede verband houdende noodzakelijke kosten, en voor gemaakte reis- en verblijfkosten,
      voor zover voortvloeiende uit een verzoek of opdracht van de justitie, ten behoeve van:

      a. strafzaken, hieronder begrepen zaken betreffende overtredingen waarvan de burgerlijke rechter kennis neemt;

      b. zaken waarin het openbaar ministerie optreedt ter uitvoering van de wet en waarvan de burgerlijke rechter kennis
      neemt.

      2 Behoudens het bepaalde in lid 3, komen de vergoedingen ten laste van 's Rijks kas, voor zover in bijzondere
      wetten niet anders is bepaald.

      3 Ingeval een verzoek of opdracht, als bedoeld in lid 1, is gedaan of gegeven op verzoek van de verdachte of
      gerekwestreerde en ingeval een verzoek of opdracht van dezelfde strekking zonder tussenkomst van de justitie is
      gedaan of gegeven door de verdachte of de gerekwestreerde, komen te diens laste vergoedingen, overeenkomstig het
      bij en krachtens deze wet bepaalde. Komen deze vergoedingen toe aan opsporingsambtenaren ingevolge een hun gedaan
      verzoek of gegeven opdracht tot het afleggen van een verklaring in een zaak waarin zij als zodanig zijn opgetreden,
      dan komen deze vergoedingen ten laste van 's Rijks kas.

      4 Indien door de justitie, al dan niet op verzoek van de verdachte, opdracht tot oproeping en
      bijstand van een tolk of vertaler is gegeven of bijstand van een tolk is verleend op grond van
      [artikel 28, vijfde lid, van het Wetboek van Strafvordering][ref1], komen deze vergoedingen eveneens ten laste van
      ’s Rijks kas.

      5 Indien door de justitie, al dan niet op verzoek van het slachtoffer, opdracht tot oproeping en
      bijstand van een tolk of vertaler is gegeven of bijstand van een tolk is verleend op grond van
      [artikel 51c, vijfde lid][ref2], [artikel 51ca, eerste, vierde of negende lid][ref3] of op grond van
      [artikel 163, derde of zevende lid, van het Wetboek van Strafvordering][ref4], dan komen de vergoedingen ten laste
      van ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel28
