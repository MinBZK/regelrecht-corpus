  - number: '2'
    text: |-
      Tot het maken van ten laste van 's Rijks kas komende buitengewone, bij en krachtens deze wet niet voorziene
      kosten in de zaken in [artikel 1][ref1] bedoeld wordt vereist een machtiging van de advocaat-generaal bij het
      ressortsparket en, in de zaken die bij de Hoge Raad dienen, van de procureur-generaal bij de Hoge Raad. Zodanige
      machtiging is niet vereist in de gevallen van de [artikelen 151][ref2], [192][ref3], [202][ref4], [212][ref5],
      [318][ref6], [398][ref7] juncto [318][ref8] en [415][ref9] juncto [318 van het Wetboek van Strafvordering][ref10].


