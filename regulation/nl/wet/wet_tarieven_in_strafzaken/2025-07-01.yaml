    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden de tarieven vastgesteld voor vergoedingen voor:

      a. werkzaamheden ingevolge verzoeken en opdrachten als bedoeld in [artikel 1, eerste en derde lid][ref1];

      b. tijdverzuim ingevolge verzoeken en opdrachten als bedoeld in [artikel 1, eerste en derde lid][ref2], van hen
      aan wie werkzaamheden zijn opgedragen, van getuigen, van voogden die wegens een strafzaak tegen een onder hun gezag
      staande minderjarige ingevolge het [Wetboek van Strafvordering][ref3] moeten worden opgeroepen en - ingeval van
      toepassing van [artikel 509][ref4] van dat Wetboek - van curatoren; voorts van noodzakelijke geleiders van deze
      personen en van verdachten of gerekwestreerden, alsmede van met het tijdverzuim verband houdende noodzakelijke
      kosten.

      2 De bedragen, bedoeld in het eerste lid, kunnen bij ministeriële regeling worden gewijzigd voor zover het
      indexcijfer Cao-lonen per uur inclusief bijzondere beloning, Cao-sector overheid, zoals jaarlijks vastgesteld door
      het Centraal Bureau voor de Statistiek, daartoe aanleiding geeft.

      3 Geen vergoeding wordt toegekend voor werkzaamheden:

      a. die deel uitmaken van een taak waarvoor een dienstverband met het Rijk bestaat;

      b. verricht door ambtenaren van politie in diensttijd.

      4 Geen vergoeding wordt toegekend wegens tijdverzuim:

      a. voor de tijd besteed aan werkzaamheden als bedoeld in [artikel 1, eerste en derde lid][ref5];

      b. van personen die rechtens van hun vrijheid zijn beroofd;

      c. van personen in bezoldigde rijksdienst en van militairen in werkelijke dienst, voor zover het tijdverzuim valt
      in diensttijd;

      d. van ambtenaren van politie, voor zover het tijdverzuim valt in diensttijd;

      e. van opsporingsambtenaren, niet behorende tot de sub *c* en *d* bedoelde categorieën, voor zover het tijdverzuim
      voortvloeit uit een hun niet op verzoek van de verdachte of gedaagde gedaan verzoek of gegeven opdracht tot het
      afleggen van een verklaring in een zaak waarin zij als zodanig zijn opgetreden.

      5 Onze Minister van Justitie kan nadere regelen stellen.


