  - number: '4'
    text: |-
      1 Wanneer de autoriteit, die opdracht tot de werkzaamheden heeft gegeven, een daartoe strekkend verzoek doet, stelt
      de gemeente waar de werkzaamheden moeten worden verricht, daarvoor een lokaliteit beschikbaar.

      2 Aan de gemeente komt hiervoor een vergoeding toe overeenkomstig door Ons bij algemene maatregel van bestuur te
      stellen regelen.

      3 Onze Minister van Justitie kan nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel4
  - number: '5'
    text: |-
      Voor werktuigen en gereedschappen, gebruikt bij de opgedragen werkzaamheden, wordt geen vergoeding gegeven, tenzij
      de aard van de werkzaamheden de werktuigen en gereedschappen voor verder gebruik ongeschikt maakt.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel5
  - number: '6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden de tarieven vastgesteld voor vergoedingen voor reis- en
      verblijfkosten, toekomende aan de in [artikel 3, lid 1][ref1], sub *b*, genoemde personen. Onnodig gemaakte reis-
      en verblijfkosten worden niet vergoed.

      2 De bedragen, bedoeld in het eerste lid, kunnen bij ministeriële regeling worden gewijzigd voor zover het
      indexcijfer Cao-lonen per uur inclusief bijzondere beloning, Cao-sector overheid, zoals jaarlijks vastgesteld door
      het Centraal Bureau voor de Statistiek, daartoe aanleiding geeft.

      3 Onze Minister van Justitie kan nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel3
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002406
        artikel: '3'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Indien het gebruik van een bijzonder middel van vervoer noodzakelijk is uit hoofde van leeftijd, ziekte of
      gebreken worden de kosten daarvan vergoed overeenkomstig door Ons bij algemene maatregel van bestuur te stellen
      regelen.

      2 Onze Minister van Justitie kan nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel7
  - number: '8'
    text: |-
      1 Vergoedingen voor tijdverzuim, daarmee verband houdende noodzakelijke kosten en voor reis- en verblijfkosten
      worden terstond toegekend door de griffier van het gerecht, dat bevoegd is over de zaak te oordelen of van het
      gerecht, waarvoor de zaak dient of heeft gediend.

      2 De belanghebbende kan tegen de beschikking van de griffier schriftelijk bezwaar indienen bij de
      voorzieningenrechter van het gerecht en indien het de Hoge Raad betreft, bij de president van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 Vergoedingen voor werkzaamheden worden schriftelijk gedeclareerd.

      2 Wanneer de opdracht is gegeven door de justitie wordt de declaratie onderworpen aan de goedkeuring van de
      autoriteit, die de opdracht tot de werkzaamheden heeft gegeven. Bij afwijzing of bij goedkeuring van slechts een
      deel van het gedeclareerde bedrag wordt de reden daarvan op de declaratie aangegeven en terstond aan de declarant
      medegedeeld.

      3 Wanneer de opdracht is gegeven door de verdachte of de gerekwestreerde wordt de declaratie zo nodig onderworpen
      aan de goedkeuring van de griffier. Bij afwijzing of bij goedkeuring van slechts een deel van het gedeclareerde
      bedrag wordt de reden daarvan op de declaratie aangetekend. De beschikking wordt terstond aan de declarant en aan
      de opdrachtgever medegedeeld.

      4 Tegen de beschikkingen, bedoeld in de leden 2 en 3, kan door de belanghebbende schriftelijk bezwaar worden
      gemaakt. Is de beschikking genomen door de kantonrechter of de rechter-commissaris, dan wordt op het bezwaar
      beslist door de voorzieningenrechter van de rechtbank. Is de beschikking genomen door de voorzieningenrechter van
      de rechtbank of het gerechtshof, dan wordt op het bezwaar beslist door de raadkamer van het betrokken gerecht.
      Is de beschikking genomen door het openbaar ministerie of de griffier, dan wordt op het bezwaar beslist door de
      voorzieningenrechter van het gerecht of, indien het de Hoge Raad betreft, door de president van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel9
  - number: '10'
    text: |-
      Het bezwaar, bedoeld in [de artikelen 8][ref1] en [9][ref2], kan slechts schriftelijk worden ingediend binnen
      veertien dagen na de dag van uitreiking of verzending van de beschikking, waartegen bezwaar wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002406#Artikel9
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel10
