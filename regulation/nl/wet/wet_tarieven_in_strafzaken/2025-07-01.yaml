  - number: '18'
    text: |-
      Wij stellen bij algemene maatregel van bestuur de tarieven vast voor het uitbrengen van exploiten ingevolge
      bijzondere wetten.
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Voor zaken, bedoeld in [artikel 1, lid 1 sub b][ref1] van deze wet, voor zaken aangebonden en verzoeken ingediend
      op grond van enig artikel van deze wet en van het [Wetboek van Strafvordering][ref2], benevens voor niet op grond
      van een bepaling van burgerlijk griffierecht aangebonden zaken betreffende dwangmaatregelen van overheidswege,
      zonder rechterlijk bevel getroffen in verband met de niet-naleving van een wettelijk gebod of verbod, is geen
      griffierecht verschuldigd als bedoeld in [artikel 3 van de Wet griffierechten burgerlijke zaken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0028899#Artikel3
    url: https://wetten.overheid.nl/BWBR0002406/2025-07-01#Artikel19
