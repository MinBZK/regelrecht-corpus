articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *binneninstallatie:* binneninstallatie als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref1];
        - *doorleverancier:* een natuurlijke persoon of rechtspersoon die een overeenkomst heeft gesloten met een
      warmteleverancier ten behoeve van verbruik van warmte of koude door een eindgebruiker;
        - *gebouw:* voor bewoning of mede voor bewoning bestemde gebouwde onroerende zaak, een gedeelte daarvan, of
      gebouwde onroerende zaken of een gedeelte daarvan;
        - *huurwoning:* woongelegenheid als bedoeld in [artikel 1 van de Woningwet][ref2] die is bedoeld voor verhuur;
        - *inpandig leidingstelsel:* inpandig leidingstelsel als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref3];
        - *Kaderbesluit:* [Kaderbesluit BZK-subsidies][ref4];
        - *koopwoning:* woning van een eigenaar-bewoner;
        - *minister:* Minister van Volkshuisvesting en Ruimtelijke Ordening;
        - *vereniging van eigenaars:* vereniging van eigenaars als bedoeld in
      [artikel 112, eerste lid, onder e, van Boek 5 van het Burgerlijk Wetboek][ref5];
        - *verhuurder:* Een natuurlijke persoon of rechtspersoon die een of meer huurwoningen in eigendom heeft;
        - *warmteleverancier:* leverancier als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref6];
        - *warmtenet:* Warmtenet als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref7];
        - *woning:* een huurwoning of koopwoning.


