  - number: 5a
    text: |-
      In afwijking van [artikel 3 van het Kaderbesluit][ref1] kan op grond van deze regeling subsidie worden verstrekt
      aan een gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel3
