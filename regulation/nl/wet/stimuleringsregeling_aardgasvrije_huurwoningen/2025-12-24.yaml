  - number: '12'
    text: |-
      1 De hoogte van het voorschot bij verlening bedraagt:

      a. als de subsidie betrekking heeft op huurwoningen die geen onderdeel uitmaken van een gebouw of gebouwen waarvoor
      een vereniging van eigenaars is opgericht: 50 procent van de subsidie;

      b. als de subsidie betrekking heeft op woningen die onderdeel uitmaken van een gebouw of gebouwen waarvoor een
      vereniging van eigenaars is opgericht: 70 procent van de subsidie.

      2 Bij de aanvraag tot vaststelling wordt door de subsidieontvanger aangetoond dat is voldaan aan [artikel 10][ref1]
      en de subsidieverplichtingen die zijn opgenomen in de verleningsbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0043307#Artikel10
