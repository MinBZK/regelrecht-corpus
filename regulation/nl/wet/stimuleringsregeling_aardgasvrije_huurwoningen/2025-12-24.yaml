  - number: '18'
    text: |-
      1 De subsidieontvanger is verplicht de activiteiten waarvoor subsidie is verstrekt uit te voeren of te laten
      uitvoeren binnen zes jaar na het indienen van de aanvraag.

      2 Indien de uitvoering van de activiteiten binnen de termijn, genoemd in het eerste lid, buiten de schuld van
      de subsidieontvanger niet mogelijk is, kan de minister die termijn op schriftelijk en gemotiveerd verzoek van de
      subsidieontvanger een maal met ten hoogste twaalf maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0043307/2025-12-24#Artikel18
  - number: '19'
    text: |-
      De minister beslist afwijzend op een aanvraag voor zover:

      a. de activiteiten zullen worden verricht in huurwoningen of woningen die onderdeel uitmaken van een gebouw of
      gebouwen waarvoor een vereniging van eigenaars is opgericht en waarin zich ten minste één huurwoning bevindt die
      niet zijn gelegen in Nederland; of

      b. de activiteiten zullen worden verricht in huurwoningen of woningen die onderdeel uitmaken van een gebouw
      of gebouwen waarvoor een vereniging van eigenaars is opgericht en waarin zich ten minste één huurwoning
      bevindt die zijn gebouwd op grond van een omgevingsvergunning die is aangevraagd op of na 1 juli 2018 en
      die niet zijn gelegen in een door college van burgemeester en wethouders aangewezen gebied als bedoeld
      [artikel 10, zevende lid, onder a, van de Gaswet][ref1];

      c. de aanvraag wordt gedaan ten behoeve van woningen waarvoor reeds subsidie is verstrekt op grond van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
