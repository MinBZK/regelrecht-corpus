  - number: '16'
    text: |-
      1 Een subsidie voor de kosten, bedoeld in [artikel 15, eerste lid, onder a tot en met c][ref1], bedraagt ten
      hoogste 40 procent van de subsidiabele kosten, met een maximum van € 2.200 per woning.

      2 Een subsidie voor de kosten, bedoeld in [artikel 15, eerste lid, onder d][ref2], bedraagt ten hoogste 30 procent
      van de subsidiabele kosten, met een maximum van € 3.800 per woning.

      3 De aanvrager van de subsidie mag de kosten als bedoeld in [artikel 7, eerste lid, onder c, onder 7°][ref3],
      opvoeren bij de onder het tweede lid genoemde kosten, met hetzelfde subsidiepercentage en maximum, als:

      a. de aanvrager optreedt als doorleverancier van de warmte geleverd door een andere warmteleverancier; of

      b. de aanvrager kosten maakt voor het aanleggen van een inpandig leidingstelsel en de eigendom of het beheer van
      dit leidingstelsel wordt overgedragen aan de warmteleverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0043307#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0043307#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0043307#Artikel7
