  - number: '2'
    text: |-
      Deze regeling heeft tot doel het stimuleren van het aardgasvrij maken van huurwoningen en huur- en koopwoningen
      die onderdeel uitmaken van een gebouw of gebouwen waarvoor een vereniging van eigenaars is opgericht waarvan een of
      meer leden verhuurder zijn van een woning in dat gebouw of die gebouwen door middel van opschaling en versnelling
      van:

      a. het aardgasvrij maken van woningen en het aansluiten op warmtenetten van die aardgasvrije woningen of gebouwen
      waarvan de woningen onderdeel uitmaken; en

      b. het volledig aardgasvrij maken van woningen die reeds zijn aangesloten op een warmtenet.
    url: https://wetten.overheid.nl/BWBR0043307/2025-12-24#Artikel2
  - number: '3'
    text: |-
      1 Een aanvraag voor een subsidie kan worden ingediend van 24 november 2025 tot en met de dag waarop het
      subsidieplafond wordt bereikt of tot en met 15 december 2025.

      2 Indien de aanvraag wordt gedaan ten behoeve van huur- of koopwoningen die onderdeel uitmaken van een gebouw of
      gebouwen waarvoor een vereniging van eigenaars is opgericht, wordt de aanvraag gedaan door of namens de vereniging
      van eigenaars.

      3 Een aanvraag voor een subsidie wordt ingediend met gebruikmaking van het aanvraagformulier dat door de minister
      ter beschikking is gesteld op de website van de Rijksdienst voor Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0043307/2025-12-24#Artikel3
  - number: '4'
    text: |-
      1 Het subsidieplafond bedraagt € 20.000.000 voor het totaal van:

      a. de aanvragen voor subsidies van € 25.000 of meer als bedoeld in [hoofdstuk 2][ref1]; en

      b. de aanvragen voor subsidies voor uitsluitend het volledig aardgasvrij maken van woningen die reeds zijn
      aangesloten op een warmtenet.

      2 De minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043307#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043307/2025-12-24#Artikel4
