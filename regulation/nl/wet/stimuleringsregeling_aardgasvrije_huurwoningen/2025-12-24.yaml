  - number: '10'
    text: |-
      1 De subsidieontvanger is verplicht:

      a. de activiteiten waarvoor subsidie is verstrekt uit te voeren of te laten uitvoeren binnen zes jaar na indienen
      van de aanvraag voor de subsidie; en

      b. de minister te informeren wanneer de activiteiten zijn verricht waarvoor de subsidie is verstrekt, op de in de
      verleningsbeschikking aangegeven wijze.

      2 Indien de uitvoering van de activiteiten binnen de termijn, genoemd in het eerste lid, onder a, buiten de schuld
      van de subsidieontvanger niet mogelijk is, kan de minister die termijn op schriftelijk en gemotiveerd verzoek van
      de subsidieontvanger een maal met ten hoogste twaalf maanden verlengen.

      3 [Artikel 19 van het Kaderbesluit][ref1] is niet van toepassing op een subsidie als bedoeld in [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0043307#Artikel6
