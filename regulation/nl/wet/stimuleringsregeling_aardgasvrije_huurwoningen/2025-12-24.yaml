  - number: '9'
    text: |-
      1 Een aanvraag bevat:

      a. adresgegevens van de huurwoningen waarop de aanvraag betrekking heeft en indien van toepassing: adresgegevens
      van de koopwoningen die onderdeel uitmaken van een gebouw of gebouwen waarvoor een vereniging van eigenaars is
      opgericht waarvan een of meer leden verhuurder zijn van een woning waarop de aanvraag mede betrekking heeft;

      b. indien van toepassing: het L-nummer van de aanvrager;

      c. indien de aanvrager een natuurlijke persoon is: het burgerservicenummer van de aanvrager;

      d. indien de aanvraag betrekking heeft op een vereniging van eigenaars of één of meer leden van een vereniging van
      eigenaars: een afschrift van het rechtsgeldige besluit van de algemene ledenvergadering tot het aardgasvrij maken
      van alle woningen of toestemming voor het aardgasvrij maken van een deel van de woningen en het aansluiten van
      die aardgasvrije woningen of het gebouw waar de woningen onderdeel van uitmaken op het warmtenet of het volledig
      aardgasvrij maken van woningen die reeds zijn aangesloten op het warmtenet;

      e. een overeenkomst met een warmteleverancier waaruit blijkt:

      1°. hoeveel de kosten als bedoeld in [artikel 7, eerste lid, onder d][ref1], bedragen, met uitzondering van een in
      de overeenkomst opgenomen verhoging van deze kosten in verband met mogelijke stijging van de prijs in de toekomst;

      2°. dat de woningen, bedoeld onder a, of het gebouw waar de woningen onderdeel van uitmaken zullen worden
      aangesloten op een warmtenet; en

      3°. dat het aansluiten van de woningen of het gebouw waar de woningen onderdeel van uitmaken op een warmtenet
      binnen zes jaar na indienen van de aanvraag zal plaatsvinden.

      f. een verklaring waaruit blijkt dat de verhuurder die de aanvraag heeft ingediend of de verhuurder of verhuurders
      die onderdeel uitmaken van een vereniging van eigenaars die de aanvraag heeft ingediend voor de activiteiten
      waarvoor op grond van deze regeling subsidie wordt aangevraagd niet meer steun ontvangt dan is toegestaan op grond
      van de algemene groepsvrijstellingsverordening;

      g. indien de aanvraag betrekking heeft op woningen die onderdeel uitmaken van een gebouw of gebouwen waarvoor een
      vereniging van eigenaars is opgericht: een verklaring waaruit blijkt dat ten minste één woning gedurende de twee
      jaar voorafgaande aan de aanvraag ten minste drie maanden is verhuurd;

      h. indien de aanvraag betrekking heeft op huurwoningen die geen onderdeel uitmaken van een gebouw of gebouwen
      waarvoor een vereniging van eigenaars is opgericht: een verklaring van de verhuurder waaruit blijkt dat de
      huurwoningen gedurende de twee jaar voorafgaande aan de aanvraag ten minste drie maanden zijn verhuurd; en

      i. als de verhuurder die de aanvraag heeft ingediend of een verhuurder die onderdeel uitmaakt van de
      vereniging van eigenaars die de aanvraag heeft ingediend meer dan € 500.000 aanvraagt of ontvangt voor de
      kosten als bedoeld in [artikel 7, eerste lid][ref2]: informatie over de grootte van de onderneming, bedoeld in
      [artikel 6, tweede lid, onder a][ref3], van de algemene groepsvrijstellingsverordening.

      2 In afwijking van het eerste lid, onder e, bevat een aanvraag voor subsidie voor activiteiten ten behoeve van het
      volledig aardgasvrij maken van woningen die reeds zijn aangesloten op een warmtenet een verklaring van de aanvrager
      waaruit blijkt dat de woningen zijn aangesloten op een warmtenet.


