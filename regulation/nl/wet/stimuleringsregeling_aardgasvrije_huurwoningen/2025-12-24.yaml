  - number: '6'
    text: |-
      1 De Minister kan aan verhuurders en verenigingen van eigenaars waarvan een of meer leden verhuurder zijn op
      aanvraag subsidie verstrekken van € 25.000 of meer voor activiteiten ten behoeve van het aardgasvrij maken en
      aansluiten op het warmtenet van meerdere woningen of het gebouw waar de woningen onderdeel van uitmaken of het
      volledig aardgasvrij maken van meerdere woningen die reeds zijn aangesloten op het warmtenet.

      2 Een subsidie kan uitsluitend worden verleend voor activiteiten die:

      a. nog niet zijn aangevangen op het moment van aanvraag van de subsidie;

      b. voor zover deze verricht worden in huurwoningen die geen onderdeel uitmaken van een gebouw of gebouwen
      waarvoor een vereniging van eigenaars is opgericht: betrekking hebben op huurwoningen die gedurende de twee jaar
      voorafgaande aan de aanvraag ten minste drie maanden zijn verhuurd;

      c. voor zover deze verricht worden in woningen die onderdeel uitmaken van een gebouw of gebouwen waarvoor een
      vereniging van eigenaars is opgericht: betrekking hebben op ten minste één huurwoning die gedurende de twee jaar
      voorafgaande aan de aanvraag ten minste drie maanden is verhuurd;

      d. binnen zes jaar na moment van aanvraag van de subsidie kunnen worden afgerond; en

      e. als beoogd resultaat hebben dat woningen na afronding van de activiteiten:

      1°. aardgasvrij zijn; en

      2°. zijn aangesloten op een warmtenet.

      3 Het tweede lid, onder e, onder 2°, is niet van toepassing voor zover de aanvraag betrekking heeft op het volledig
      aardgasvrij maken van woningen die reeds zijn aangesloten op een warmtenet.
    url: https://wetten.overheid.nl/BWBR0043307/2025-12-24#Artikel6
  - number: '7'
    text: |-
      1 Een subsidie kan worden verstrekt voor:

      a. de kosten gerekend door de netbeheerder voor het afkoppelen van de aardgasaansluiting bedoeld voor
      ruimteverwarming, koken of warmtapwater en het verwijderen van de gasmeter;

      b. het aanpassen of vervangen van het ruimteverwarmingssysteem en de voorzieningen voor koken en warmtapwater door
      middel van:

      1°. het verwijderen van de individuele of collectieve CV-ketel inclusief rookgasafvoer;

      2°. het aanpassen van de warmteafgiftesystemen ten behoeve van verwarming met lage temperatuur;

      3°. het verwijderen van het individuele warmtapwatertoestel;

      4°. het verwijderen van het gasfornuis;

      5°. het aanschaffen van een volledig elektrische kookvoorziening; of

      6°. het installeren van een niet-gasgedreven warmtapwatervoorziening;

      c. andere bouwkundige aanpassingen die nodig zijn voor het aardgasvrij maken van de woning of het aansluiten van de
      woning op een warmtenet, inhoudende:

      1°. het aankoppelen van de binneninstallatie aan het warmtenet;

      2°. het aankoppelen van de binneninstallatie aan het inpandig leidingstelsel;

      3°. het aanpassen van de meterkast en leidingen ten behoeve van elektrisch koken;

      4°. het verwijderen van de stijgleidingen;

      5°. bouwkundige aanpassingen ten behoeve van het plaatsen van de afleverset;

      6°. het verwijderen van gasleidingen; of

      7°. het aanleggen van een inpandig leidingstelsel; en

      d. de kosten gerekend door de warmteleverancier voor het aansluiten van de huurwoning of het gebouw waar de
      huurwoningen onderdeel van uitmaken op het warmtenet of indien de aanvraag betrekking heeft op een vereniging
      van eigenaars waarvan een of meer leden verhuurder zijn van een woning in het gebouw waarvoor de vereniging
      van eigenaars is opgericht de kosten gerekend door de warmteleverancier voor het aansluiten van de huurwoning,
      koopwoning of het gebouw waar de woningen onderdeel van uitmaken op het warmtenet.

      2 De kosten, bedoeld in het eerste lid, zijn subsidiabel voor zover het gaat om kosten, die rechtstreeks verband
      houden met het behalen van een hoger niveau van milieubescherming en die als kosten voor de milieu-investering
      binnen de totale investeringskosten als afzonderlijke investering kunnen worden vastgesteld als bedoeld in
      artikel 36, vijfde lid, van de algemene groepsvrijstellingsverordening.

      3 In afwijking van de [artikelen 4, eerste lid][ref1], en [6, vierde lid, van het Kaderbesluit][ref2] en met
      inachtneming van [artikel 11, onder d][ref3], kan subsidie worden verstrekt voor activiteiten als bedoeld in
      [artikel 6, eerste lid][ref4], die ook uit andere hoofde zijn of worden gesubsidieerd of gefinancierd.


