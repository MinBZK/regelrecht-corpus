  - number: '20'
    text: |-
      1 Als een subsidie wordt verleend voor activiteiten die zijn afgerond ten tijde van de aanvraag,
      wordt bij verlening direct een beschikking tot subsidievaststelling afgegeven als bedoeld in
      [artikel 16, tweede lid, onder a, van het Kaderbesluit][ref1].

      2 Als een subsidie wordt verleend voor activiteiten die nog niet zijn afgerond ten tijde van de aanvraag
      wordt de subsidie uiterlijk zes jaar na indienen van de aanvraag ambtshalve vastgesteld als bedoeld in
      [artikel 16, tweede lid, onder b, van het Kaderbesluit][ref2].


