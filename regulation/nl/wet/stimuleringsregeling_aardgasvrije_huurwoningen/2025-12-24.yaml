  - number: '13'
    text: |-
      1 De minister maakt binnen zes maanden na de datum van subsidieverlening de gegevens bekend, bedoeld in artikel 9,
      eerste lid, onderdeel c, van de algemene groepsvrijstellingsverordening, als de subsidie aan de verhuurder die de
      aanvraag heeft ingediend of een verhuurder die onderdeel uitmaakt van de vereniging van eigenaars die de aanvraag
      heeft ingediend meer bedraagt dan € 500.000.

      2 De gegevens, bedoeld in het eerste lid, blijven voor ten minste tien jaar openbaar beschikbaar.
