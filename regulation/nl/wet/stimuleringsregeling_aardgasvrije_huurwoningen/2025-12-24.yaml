  - number: '8'
    text: |-
      1 Een subsidie voor de kosten, bedoeld in [artikel 7, eerste lid, onder a tot en met c][ref1], bedraagt ten hoogste
      40 procent van de subsidiabele kosten, met een maximum van € 2.200 per woning.

      2 Een subsidie voor de kosten, bedoeld in [artikel 7, eerste lid, onder d][ref2], bedraagt ten hoogste 30 procent
      van de subsidiabele kosten, met een maximum van € 3.800 per woning.

      3 De aanvrager van de subsidie mag de kosten als bedoeld in [artikel 7, eerste lid, onder c, onder 7°][ref3],
      opvoeren bij de onder het tweede lid genoemde kosten, met hetzelfde subsidiepercentage en maximum, als:

      a. de aanvrager optreedt als doorleverancier van de warmte geleverd door een andere warmteleverancier; of

      b. de aanvrager kosten maakt voor het aanleggen van leidingen van het warmtenet in het gebouw en de eigendom of het
      beheer van deze leidingen wordt overgedragen aan de warmteleverancier.


