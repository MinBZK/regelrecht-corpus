preamble:
  text: |-
    Gelet op artikel 3 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006539/1994-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaar die is belast met het beheer van de gegevens betreffende personen wier geboorteplaats buiten
      Nederland is gelegen of onbekend is, alsmede betreffende rechtspersonen, vennootschappen, andere verenigingen van
      personen of doelvermogens, wordt aangewezen de directeur van de Centrale Justitiële Documentatiedienst te Almelo.
    url: https://wetten.overheid.nl/BWBR0006539/1994-04-07#Artikel1
  - number: '2'
    text: |-
      Het besluit van 28 november 1988, hoofddirectie organisatie rechtspleging en rechtshulp, no. 1686/888 (Stcrt. 1988,
      nr. 247) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006539/1994-04-07#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking op de tweede dag na de verschijning van de Staatscourant waarin zij wordt
      geplaatst.

      Dit besluit zal in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006539/1994-04-07#Artikel3
