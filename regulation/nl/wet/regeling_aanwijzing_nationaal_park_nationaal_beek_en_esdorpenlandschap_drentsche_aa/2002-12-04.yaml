  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *overlegorgaan:*


              overlegorgaan bedoeld in [artikel 3][ref1];



            c

              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992/93, 22 880, nr. 5,
      pagina 99).


      [ref1]: https://wetten.overheid.nl/BWBR0014354#Artikel3
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014354
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied Nationaal beek- en esdorpenlandschap Drentsche Aa, zoals aangegeven
      op de kaart die als bijlage behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Nationaal beek- en esdorpenlandschap Drentsche Aa.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park Nationaal
      beek- en esdorpenlandschap Drentsche Aa. Daartoe behoort onder meer:

      a. het actualiseren van het beheer-, inrichtings- en ontwikkelingsplan bedoeld in [artikel 5][ref1];

      b. het streven naar onderlinge afstemming van alle voor de inrichting, het beheer en ontwikkeling van belang zijnde
      plannen en activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationale park Nationaal
      beek- en esdorpenlandschap Drentsche Aa beschikbare middelen in het kader van een jaarlijks voortschrijdend
      meerjarenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van het beheer, inrichtings- en ontwikkelingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park Nationaal beek- en esdorpenlandschap Drentsche Aa.


      [ref1]: https://wetten.overheid.nl/BWBR0014354#Artikel5
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014354
        artikel: '5'
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheer-, inrichtings- en ontwikkelingsplan voor het
      nationaal park Nationaal beek- en esdorpenlandschap Drentsche Aa van 14 juni 2002 en met inachtneming van hetgeen
      te dien aanzien door de minister bij brief van 12 juli 2002, kenmerk DNO 2002/4975, is gesteld.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. zes door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1 de provincie Drenthe;

      2 de gemeente Aa en Hunze;

      3 de gemeente Tynaarlo;

      4 de gemeente Assen;

      5 het waterschap Hunze en Aa's;

      6 N.V. Waterbedrijf Groningen;

      c. twee door de minister op voordracht van de Noordelijke Land- en Tuinbouworganisatie te benoemen leden als
      vertegenwoordiger van de bij het nationaal park Nationaal beek- en esdorpenlandschap Drentsche Aa betrokken
      agrariërs;

      d. een door de minister op voordracht van de Vereniging Brede Overleggroep Kleine Dorpen te benoemen lid als
      vertegenwoordiger van de dorpen in het desbetreffende gebied;

      e. twee door de minister op voordracht van het Staatsbosbeheer en de Vereniging Natuurmonumenten te benoemen leden
      als vertegenwoordiger van de terreinbeherende natuurorganisaties;

      f. een door de minister op voordracht van Recreatieschap Drenthe, RECRON Drenthe en Toeristisch Platform Tynaarlo
      te benoemen lid als vertegenwoordiger van recreatiebelangen;

      g. de directeur Noord van het Ministerie van Landbouw, Natuurbeheer en Visserij als vertegenwoordiger van de
      rijksoverheid.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel6
  - number: '7'
    text: |-
      1 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      2 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel7
  - number: '8'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Drenthe te benoemen ambtenaar van die
      provincie.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel8
  - number: '9'
    text: |-
      Indien bij het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel9
  - number: '10'
    text: Het Besluit voorbereiding nationaal beek- en esdorpenlandschap Drentsche Aa wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 4 december 2002.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Nationaal beek- en esdorpenlandschap
      Drentsche Aa.
    url: https://wetten.overheid.nl/BWBR0014354/2002-12-04#Artikel12
