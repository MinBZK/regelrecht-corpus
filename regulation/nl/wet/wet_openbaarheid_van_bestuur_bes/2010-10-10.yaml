articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *bestuursorgaan:*

        - de bestuurorganen van de openbare lichamen die het rechtstreeks aangaat;
        - de Rijksvertegenwoordiger;

      b. *document:* een bij een bestuursorgaan berustend schriftelijk stuk of ander materiaal dat gegevens bevat;

      c. *bestuurlijke aangelegenheid:* een aangelegenheid die betrekking heeft op beleid van een bestuursorgaan,
      daaronder begrepen de voorbereiding en de uitvoering ervan;

      d. *niet-ambtelijke advies-commissie:* een van overheidswege ingestelde commissie, met als taak het adviseren van
      een of meer bestuursorganen en waarvan geen ambtenaren lid zijn, die het bestuursorgaan waaronder zij ressorteren
      adviseren over de onderwerpen die aan de commissie zijn voorgelegd. Ambtenaren, die secretaris of adviserend lid
      zijn van een adviescommissie worden voor de toepassing van deze bepaling niet als leden daarvan beschouwd;

      e. *openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius en Saba;

      f. *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel1
  - number: '2'
    text: Een bestuursorgaan betracht bij de uitvoering van zijn taak openbaarheid en verstrekt hiertoe informatie.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Een ieder kan verzoeken om informatie neergelegd in documenten over een bestuurlijke aangelegenheid richten tot
      een bestuurorgaan of tot de onder verantwoordelijkheid van een bestuursorgaan werkzame departementen, diensten,
      bureaus en instellingen.

      2 De verzoeker vermeldt de bestuurlijke aangelegenheid of het daarop betrekking hebbend document, waarover hij
      informatie wenst te ontvangen.

      3 Bij algemene maatregel van bestuur kan voor de Rijksvertegenwoordiger een informatiepunt worden aangewezen waar
      het verzoek moet worden ingediend. Voor de bestuursorganen van de openbare lichamen kan dit bij eilandbesluit
      houdende algemene maatregelen.

      4 Een verzoek wordt ingewilligd met inachtneming van het bepaalde in de [artikelen 11][ref1] en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028154#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028154#Artikel12
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028154
        artikel: '11'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028154
        artikel: '12'
        paragraaf: '6'
  - number: '4'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een ander bestuurorgaan dan dat
      waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar dat orgaan verwezen. Is het verzoek schriftelijk
      gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 De beslissing op een verzoek wordt genomen door of vanwege het bestuursorgaan.

      2 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek wordt schriftelijk en gemotiveerd aan de
      verzoeker medegedeeld. Ingeval van een mondeling verzoek vindt een dergelijke afwijzing schriftelijk en gemotiveerd
      plaats indien de verzoeker daarom vraagt. De verzoeker wordt op deze mogelijkheid gewezen.

      3 Indien de informatie op een verzoek als bedoeld in het eerste lid, betrekking heeft op een derde, wordt deze
      hiervan op de hoogste gesteld en worden de beslissingen en de informatie, voor zover die op hem betrekking hebben,
      schriftelijk aan deze medegedeeld, indien hij dit verzoekt.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Het bestuursorgaan beslist op het verzoek zo spoedig mogelijk, doch uiterlijk binnen drie weken na de dag waarop
      het verzoek is ontvangen. Het bestuursorgaan kan de beslissing voor ten hoogste drie weken verdagen. Van de
      verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Het bestuursorgaan verstrekt de met betrekking tot documenten verlangde informatie door:

      a. kopie ervan te geven of de letterlijke inhoud ervan in andere vorm te verstrekken,

      b. kennisneming van de inhoud toe te staan,

      c. een schriftelijk uittreksel of een samenvatting van de inhoud te geven, of

      d. mondeling of schriftelijk inlichtingen daaruit te verschaffen.

      2 Bij het kiezen tussen de vormen van informatie, genoemd in het eerste lid, houdt het bestuurorgaan rekening met
      de voorkeur van de verzoeker en met het belang van een vlotte voorgang van de werkzaamheden
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Het bestuursorgaan verschaft uit eigen beweging informatie over het beleid, de voorbereiding en de uitvoering
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 Het bestuursorgaan draagt zorg voor het openbaar maken, zo mogelijk met toelichting, van door niet-ambtelijke
      adviescommissies aan het orgaan uitgebrachte adviezen met het oog op het te vormen beleid, tezamen met de door het
      orgaan aan de commissies voorgelegde adviesaanvragen en voorstellen.

      2 De in het eerste lid bedoelde stukken kunnen openbaar worden gemaakt door deze:

      a. op te nemen in een algemeen verkrijgbare uitgave,

      b. afzonderlijk uit te geven en algemeen verkrijgbaar te stellen, of

      c. ter inzage te leggen, in kopie te verstrekken of uit te lenen.

      3 Zo spoedig mogelijk, doch uiterlijk binnen zes weken nadat de adviezen zijn ontvangen, heeft openbaarmaking
      plaats. Hiervan en van de plaats van tervisieligging wordt mededeling gedaan in een plaatselijk algemeen
      verkrijgbaar dag- of weekblad.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel9
  - number: '11'
    text: |-
      1 Het verstrekken van informatie ingevolge deze wet blijft achterwege voor zover dit:

      a. de eenheid van de Kroon in gevaar zou kunnen brengen;

      b. de veiligheid van de Staat zou kunnen schaden;

      c. bedrijfs- en fabricagegegeven betreft, die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn meegedeeld.

      2 Het verstrekken van informatie ingevolge deze wet blijft eveneens achterwege voor zover het belang daarvan niet
      opweegt tegen de volgende belangen:

      a. de economische of financiële belangen van de Staat of van de openbare lichamen;

      b. de opsporing en vervolging van strafbare feiten;

      c. de inspectie, controle of het toezicht door of vanwege bestuursorganen;

      d. de eerbiediging van de persoonlijke levenssfeer;

      e. het belang, dat de geadresseerde erbij heeft als eerste kennis te kunnen nemen van de informatie;

      f. het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke
      personen of rechtspersonen dan wel van derden.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel11
  - number: '12'
    text: |-
      1 In geval van een verzoek om informatie uit documenten, opgesteld ten behoeve van intern beraad, wordt geen
      informatie verstrekt over tot personen herleidbare beleidsopvattingen. Onder intern beraad wordt verstaan het
      beraad over een bestuurlijke aangelegenheid binnen een bestuursorgaan dan wel een kring van bestuursorganen in het
      kader van de gezamenlijke verantwoordelijkheid voor die bestuurlijke aangelegenheid. Onder tot personen herleidbare
      beleidsopvatting wordt verstaan een opvatting, voorstel, aanbeveling of conclusie van een of meer personen over een
      bestuurlijke aangelegenheid en de daartoe door hen aangevoerde argumenten.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de Rijksvertegenwoordiger en bij eilandsbesluit, houdende algemene
      maatregelen, voor de openbare lichamen, nadere regels worden gesteld omtrent de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de Rijksvertegenwoordiger en bij eilandsbesluit, houdende
      algemene maatregelen, voor de openbare lichamen, regels worden gesteld met betrekking tot in rekening te brengen
      vergoedingen voor het ingevolge een ingekomen verzoek vervaardigen van kopieën van documenten en van uittreksels of
      samenvattingen van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel14
  - number: '15'
    text: |-
      De gezaghebbers van de openbare lichamen zenden jaarlijks voor 1 april aan de eilandsraden een verslag over de
      wijze waarop in het daaraan voorafgaande jaar de wet door de bestuursorganen van de openbare lichamen is toegepast.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel15
  - number: '17'
    text: |-
      Deze wet verplicht niet tot het openbaarmaken van adviezen van niet-ambtelijke adviescommissies die zijn
      uitgebracht voor het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Deze wet is niet van toepassing op procedures die ten tijde van de inwerkingtreding van deze wet aanhangig zijn
      voor de burgerlijke rechter inzake onderwerpen die door deze wet worden geregeld.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba is belast met de beslissing van de geschillen die
      uit deze wet voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Deze landsverordening treedt in werking met ingang van 1 september 1996, met uitzondering van artikel 16, dat in
      werking treedt op een bij landsbesluit te bepalen later tijdstip.
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel20
  - number: '21'
    text: 'Deze wet wordt aangehaald als: Wet openbaarheid van bestuur BES.'
    url: https://wetten.overheid.nl/BWBR0028154/2010-10-10#Artikel21
