preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot integraal bestuur en beheer van de
    openbare universiteiten en tot een kwalitatieve versterking van de organisatie van onderwijs en onderzoek, in welk
    verband het tevens wenselijk is te komen tot het instellen van een raad van toezicht binnen de universiteit;

    dat het voorts wenselijk is het systeem van medebestuur te heroverwegen en te komen tot op de eigen positie van
    studenten en personeel toegesneden vormen van medezeggenschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelAanhef
articles:
  - number: VII.1
    text: |-
      De raad van toezicht van een openbare universiteit als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] wordt door Onze Minister van
      Onderwijs, Cultuur en Wetenschappen dan wel, voor zover het betreft de openbare universiteit te Wageningen door
      Onze Minister van Landbouw, Natuurbeheer en Visserij, benoemd binnen 4 maanden na het tijdstip van inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: VII.2
    text: |-
      Het college van bestuur van een universiteit als bedoeld in het eerste lid, neemt het besluit, bedoeld in
      [artikel 9.30, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], voor de eerste
      maal binnen 6 maanden na het tijdstip van inwerkingtreding van deze wet, op welk besluit de artikelen 9.30, vijfde
      lid, en 9.33 onderdeel *f* van die wet niet van toepassing zijn. Het in de eerste volzin bedoelde besluit behoeft
      de goedkeuring van de raad van toezicht, bedoeld in het eerste lid. In afwijking van artikel 9.30, tweede lid, van
      de in de eerste volzin bedoelde wet neemt het college van bestuur binnen 2 jaar na het in de eerste volzin bedoelde
      besluit opnieuw een besluit als bedoeld in artikel 9.30, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: VII.3
    text: |-
      Het college van bestuur draagt er zorg voor dat [hoofdstuk 9][ref1], [titels 1 en 2, van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek](onbekend) uiterlijk een jaar na het tijdstip van inwerkingtreding van deze
      wet op de desbetreffende universiteit toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        hoofdstuk: '9'
  - number: VII.4
    text: |-
      Tot het tijdstip waarop hoofdstuk 9, titels 1 en 2, van de in het derde lid bedoelde wet op een universiteit
      toepassing vindt, is hoofdstuk 9, titel 1, van die wet op de universiteit van toepassing, zoals laatstbedoelde
      titel luidde op de dag voorafgaande aan het tijdstip van inwerkingtreding van deze wet. Het college van bestuur kan
      besluiten dat een of meer onderdelen van de in het derde lid bedoelde titels eerder toepassing vinden dan het in
      het derde lid bedoelde tijdstip, waarop deze titels uiterlijk toepassing zullen vinden.
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVII
  - number: VII.5
    text: Het college van bestuur regelt de gevolgen van zijn besluit, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVII
  - number: VIII.1
    text: |-
      De verkiezing van de leden van de universiteitsraad, bedoeld in
      [artikel 9.31 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], geschiedt met inachtneming
      van een voorlopig reglement voor de universiteitsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: VIII.2
    text: |-
      Het college van bestuur van een universiteit als bedoeld in [artikel VII, eerste lid][ref1], stelt het voorlopig
      reglement vast. Het in de eerste volzin bedoelde reglement behoeft de goedkeuring van de raad van toezicht van
      die universiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008573#ArtikelVII
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0008573
        artikel: VII
  - number: VIII.3
    text: |-
      In het voorlopig reglement worden de onderwerpen, bedoeld in
      [artikel 9.31 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: VIII.4
    text: |-
      Zo spoedig mogelijk na de verkiezing, bedoeld in het eerste lid, stelt het college van bestuur het reglement,
      bedoeld in [artikel 9.34 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: VIII.5
    text: |-
      Het voorlopig reglement vervalt met ingang van het tijdstip waarop het reglement, bedoeld in het vierde lid, door
      het college van bestuur is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
  - number: VIII.6
    text: |-
      [Artikel 9.34, tweede tot en met vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      blijft buiten toepassing tot het tijdstip, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: IX.1
    text: Er is een tijdelijke commissie voor geschillen inzake universitaire medezeggenschapsaangelegenheden.
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelIX
  - number: IX.2
    text: |-
      De tijdelijke commissie voor geschillen bestaat uit drie leden en drie plaatsvervangende leden. Onze
      Minister van Onderwijs, Cultuur en Wetenschappen, in overeenstemming met Onze Minister van Landbouw,
      Natuurbeheer en Visserij, benoemt, schorst en ontslaat de voorzitter, de leden en de plaatsvervangende leden.
      [Artikel 9.39, derde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: IX.3
    text: |-
      De tijdelijke commissie voor geschillen neemt kennis van geschillen betreffende de invoering van
      [titel 2 van hoofdstuk 9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: IX.4
    text: |-
      De uitspraak van de tijdelijke commissie voor geschillen is bindend voor het
      college van bestuur en de raad van een openbare universiteit als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: IX.5
    text: |-
      De tijdelijke commissie voor geschillen beëindigt haar werkzaamheden met ingang van het tijdstip waarop de commissie
      voor geschillen, bedoeld in [artikel 9.39 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      voor de eerste keer is samengesteld. De tijdelijke commissie voor geschillen handelt de geschillen af waarvan zij
      voorafgaand aan het in de eerste volzin bedoelde tijdstip kennis heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
  - number: X
    text: |-
      De [artikelen 17][ref1], tweede lid, tweede volzin, en [31][ref2] zijn niet van toepassing op studiepunten die de
      studerende vóór 28 augustus 1996 heeft behaald als gevolg van een vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel17f
      [ref2]: https://wetten.overheid.nl/BWBR0003955#Artikel31a
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0003955
        artikel: 17f
      - id: ref2
        bwb_id: BWBR0003955
        artikel: 31a
  - number: XI
    text: |-
      De tekst van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] wordt in het Staatsblad geplaatst.
      Voor de plaatsing in het Staatsblad wordt deze door Onze Minister van Onderwijs, Cultuur en Wetenschappen
      overgebracht in de geldende spelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: XII.1
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst, met uitzondering van de in het tweede, derde en vierde lid genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelXII
  - number: XII.2
    text: |-
      [Artikel I onderdeel N, derde lid][ref1], treedt in werking met ingang van 1 juli 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0008573#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0008573
        artikel: I
  - number: XII.3
    text: |-
      [Artikel I onderdeel R][ref1], wat artikel 9.36 betreft, en [artikel II][ref2] treden in werking op een bij
      koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0008573#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0008573#ArtikelII
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0008573
        artikel: I
      - id: ref2
        bwb_id: BWBR0008573
        artikel: II
  - number: XII.4
    text: |-
      [Artikel IV][ref1] treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin
      deze wet wordt geplaatst, en werkt terug tot en met 3 september 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0008573#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0008573/1998-07-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0008573
        artikel: IV
