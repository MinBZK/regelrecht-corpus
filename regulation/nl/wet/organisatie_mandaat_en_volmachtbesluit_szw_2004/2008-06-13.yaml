  - number: '4.5'
    text: |-
      De secretaris-generaal is eindverantwoordelijk voor het integraal beheer van het Agentschap SZW. Hij bewaakt de
      continuïteit en kwaliteit van de organisatie en stuurt op de doelmatige en rechtmatige besteding van de middelen
      door het Agentschap SZW en op de kwaliteit van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel4
  - number: '5.1'
    text: |-
      De secretaris-generaal is bevoegd om namens een bewindspersoon besluiten te nemen, privaatrechtelijke
      rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: '5.2'
    text: |-
      De bevoegdheden van de secretaris-generaal, bedoeld in het eerste lid, omvatten in elk geval mandaat, volmacht en
      machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: 5.2.a
    text: beslissingen in bezwaar- en beroepsprocedures, met uitzondering van de beslissing op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: 5.2.b
    text: |-
      de in [artikel 4, vierde lid][ref1], genoemde aangelegenheden, met uitzondering van het nemen van besluiten als
      bedoeld in de onderdelen f en g;


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel4
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '4'
        hoofdstuk: '3'
  - number: 5.2.c
    text: |-
