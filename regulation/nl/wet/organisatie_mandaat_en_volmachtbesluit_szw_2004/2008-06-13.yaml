        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      De secretaris-generaal stelt een meerjarenplan voor het ministerie vast. De secretaris-
      generaal stelt voorts de jaarplannen vast van de organisatieonderdelen, genoemd in
      [artikel 2, onderdeel a, onder 1°, 2°, 3° en 4°][ref1]. De secretaris-generaal stelt uitgangspunten
      vast waarbinnen de algemeen directeur van de Arbeidsinspectie jaarplannen kan formuleren, vaststellen en
      uitvoeren. De secretaris-generaal kent aan de plaatsvervangend secretaris-generaal, de directeuren-generaal,
      de inspecteur-generaal en de functionarissen die leiding geven aan de organisatieonderdelen, genoemd in
      [artikel 2, onder a][ref2], de budgetten toe waarover de genoemde functionarissen mogen beschikken. De
      secretaris-generaal bewaakt de voortgang van de uitvoering van het meerjarenplan en van de jaarplannen van de
      organisatieonderdelen, genoemd in [artikel 2, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel4
    references:
