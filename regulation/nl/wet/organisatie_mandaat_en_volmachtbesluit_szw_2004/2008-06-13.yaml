      van vorderingen op derden voorzover het gaat om vorderingen van minder dan € 500.000,–;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: 5.2.d
    text: de kwijtschelding van vorderingen op derden van ten hoogste € 500.000,–.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: '5.3'
    text: |-
      De secretaris-generaal is bevoegd tot uitoefening van alle bevoegdheden die zijn verleend aan onder hem
      ressorterende functionarissen, met dien verstande dat hij gehouden is om door de inspecteur-generaal
      respectievelijk de algemeen directeur van de Arbeidsinspectie aangeboden inspectiebevindingen, jaarplannen,
      meerjarenplannen en jaarverslagen met betrekking tot inspectietaken van de Inspectie Werk en Inkomen
      respectievelijk de Arbeidsinspectie, ongewijzigd door te sturen naar de desbetreffende bewindsperso(o)n(en).
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: '5.4'
    text: |-
      De secretaris-generaal kan departementale projectorganisaties instellen en projectdirecteuren benoemen die leiding
      geven aan deze projectorganisaties.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel5
  - number: '6.1'
    text: |-
      De plaatsvervangend secretaris-generaal vervangt de secretaris-generaal bij diens afwezigheid of verhindering. Hij
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: '6.2'
    text: |-
      De plaatsvervangend secretaris-generaal geeft rechtstreeks leiding aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      De plaatsvervangend secretaris-generaal stelt de jaarplannen vast van de organisatieonderdelen, genoemd in
      [artikel 2, onder b][ref1]. Gegeven het budget dat door de secretaris-generaal aan de plaatsvervangend secretaris-
      generaal ter beschikking is gesteld, kent de plaatsvervangend secretaris-generaal aan de functionarissen die
      leiding geven aan de organisatieonderdelen, genoemd in [artikel 2, onder b][ref2], de budgetten toe waarover zij
      mogen beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van jaarplannen
      van de organisatieonderdelen, genoemd in [artikel 2, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      De plaatsvervangend secretaris-generaal is belast met de beleids- en bedrijfsvoering betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1], en hij is tevens verantwoordelijk voor een
      departementsbrede samenhangende bedrijfsvoering. Het werkterrein van de plaatsvervangend secretaris-generaal omvat
      in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.4.a
    text: het organisatie- en personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.b
    text: het voorlichtings- en communicatiebeleid, inclusief de documentaire informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.c
    text: |-
      de ondersteuning van de directies van het ministerie op het gebied van personeelsbeheer, salarisadministratie,
      documentaire informatievoorziening, financieel beheer, bekostiging en financiële administratie;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.d
    text: de uitvoering van de taken van de departementale Accountantsdienst;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.e
    text: |-
      het huisvestings- en beveiligingsbeleid voor wat betreft de Haagse vestigingen van het ministerie, met inbegrip
      van crisisbeheersing en milieumanagement, en de regie op het huisvestings- en beveilingsbeleid voor het gehele
      ministerie;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.f
    text: het automatiserings- en informatiseringsbeleid;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.g
    text: overige facilitaire diensten, inclusief advisering op het gebied van inkoop en (Europese) aanbestedingen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.h
    text: |-
      het behandelen van bezwaar- en beroepschriften en zaken van de Nationale ombudsman van (ex-)medewerkers van het
      ministerie inzake aangelegenheden verband houdend met de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.i
    text: de secretariële en logistieke ondersteuning van de bewindspersonen en de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.4.j
    text: |-
      het opsporen van zware strafbare feiten op de beleidsterreinen waarvoor de minister verantwoordelijkheid draagt,
      het in het kader van deze opsporing constateren van andere strafbare feiten welke daarmee verband houden, het in
      verband met de opsporing van strafbare feiten voeren van registers als genoemd in de [Wet politieregisters][ref1]
      en het verwerken van persoonsgegevens binnen het kader van de [Wet bescherming persoonsgegevens][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004798
      - id: ref2
        bwb_id: BWBR0011468
  - number: 6.4.k
    text: het toetsen van voorgenomen wet- en regelgeving op handhaafbaarheid en fraudegevoeligheid.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: '6.5'
    text: 'De plaatsvervangend secretaris-generaal is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.5.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de onder hem ressorterende organisatieonderdelen en aan de
      functionarissen die leiding geven aan deze organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.5.b
    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de onder hem ressorterende organisatieonderdelen alsmede de hiervoor bedoelde werkgeversverplichtingen
      voor zover deze centraal georganiseerd zijn;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.5.c
    text: |-
      de personeelsaangelegenheden welke niet ingevolge [artikel 4, vierde lid][ref1],
      aan de secretaris-generaal zijn voorbehouden, dan wel ingevolge
      [artikel 8, tweede lid, van het Besluit taakuitoefening Inspectie Werk en Inkomen][ref2] tot de bevoegdheden van
      de inspecteur-generaal behoren, dan wel ingevolge [artikel 8, derde lid][ref3], tot de taken van een directeur-
      generaal of de inspecteur-generaal behoren;


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013179#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0016199#Artikel8
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013179
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0016199
        artikel: '8'
        hoofdstuk: '3'
  - number: 6.5.d
    text: |-
      het adviseren van de bewindspersonen ten aanzien van zijn werkterrein als bedoeld in het vierde lid en het
      attenderen van de bewindspersonen op politiek of maatschappelijk gevoelige aspecten ten aanzien van zijn
      werkterrein;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.5.e
    text: |-
      het rapporteren aan de secretaris-generaal over de uitvoering van de jaarplannen betreffende de
      organisatieonderdelen, genoemd in [artikel 2, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.5.f
    text: |-
      de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor
      zover deze betrekking hebben op gedragingen van functionarissen van de organisatieonderdelen, genoemd in
      [artikel 2, onder b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel4
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0016199
        artikel: '4'
        hoofdstuk: '3'
  - number: 6.5.g
    text: |-
      de behandeling van klachten over de wijze waarop de bemiddelingsorganisatie, bedoeld in artikel 1, onderdeel f, van
      de Regeling Kinderopvang SZW, uitvoering geeft aan de Regeling Kinderopvang SZW;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
  - number: 6.5.h
    text: |-
      het materieel beheer overeenkomstig de [Regeling materieelbeheer rijksoverheid 2006][ref1] en de
      [Regeling materieelbeheer museale voorwerpen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019767
      [ref2]: https://wetten.overheid.nl/BWBR0020583
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019767
      - id: ref2
        bwb_id: BWBR0020583
  - number: '7.1'
    text: |-
      De plaatsvervangend secretaris-generaal is bevoegd om namens een bewindspersoon besluiten te nemen,
      privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch
      een privaatrechtelijke rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein als bedoeld in
      [artikel 6][ref1] en voor zover zij niet zijn voorbehouden aan een bewindspersoon of de secretaris-generaal. Van de
      volmacht, bedoeld in de eerste volzin, is evenwel uitgezonderd het aangaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel6
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.a
    text: |-
      overeenkomsten met de Landsadvocaat en andere juridische dienstverleners inzake advisering en procureurstelling
      alsmede het instellen van gerechtelijke procedures, tenzij deze overeenkomsten betrekking hebben op beroepschriften
      van (ex-) medewerkers van het ministerie inzake aangelegenheden verband houdende met de dienstbetrekking of op de
      invordering van geldvorderingen van de Staat;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
  - number: 7.1.b
    text: |-
      overeenkomsten met het Centraal bureau voor de statistiek alsmede overeenkomsten met betrekking tot meerjarige,
      structurele beleidsinformatievoorziening die het verzamelen, bewerken en leveren van beleidsinformatie betreffen,
      voor zover deze informatie primair bedoeld is voor ramingen en verdeelmodellen, dan wel verband houdt met
      verplichtingen die voortvloeien uit de Regeling periodiek evaluatieonderzoek en beleidsinformatie 2006 of met
      verplichtingen die voortvloeien uit internationale verdragen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
  - number: '7.2'
    text: |-
      De bevoegdheden van de plaatsvervangend secretaris-generaal, bedoeld in het eerste lid, omvatten in elk geval
      mandaat, volmacht en machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
  - number: 7.2.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op zijn verantwoordelijkheden of
      werkterrein als bedoeld in [artikel 6][ref1], met uitzondering van de beslissing op een beroepschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel6
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.2.b
    text: |-
      de in [artikel 6, vijfde lid][ref1], genoemde aangelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel6
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.2.c
    text: |-
      het benoemen van onder hem ressorterende hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan
      wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor zover het gaat om functies tot
      en met salarisschaal 13 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], mits
      hij van zijn voornemen daartoe vooraf melding heeft gemaakt in de Commissie Management Development;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 7.2.d
    text: |-
      het instellen van tijdelijke projectorganisaties binnen zijn werkterrein als bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel6
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.2.e
    text: |-
      de formatie van de organisatieonderdelen, genoemd in [artikel 2, onder b][ref1], een en ander met inachtneming van
      de daarvoor beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      Elke directeur-generaal en de inspecteur-generaal geven rechtstreeks leiding aan de hoofden van de
      organisatieonderdelen welke ingevolge [artikel 2][ref1] rechtstreeks onder elk van hen ressorteren.


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Elke directeur-generaal en de inspecteur-generaal stellen de jaarplannen vast van de onder elk van hen
      ressorterende organisatieonderdelen. Gegeven het budget dat door de secretaris-generaal aan de betreffende
      directeur-generaal respectievelijk de inspecteur-generaal ter beschikking is gesteld, kennen de directeuren-
      generaal en de inspecteur-generaal aan de functionarissen die leiding geven aan de onder hen ressorterende
      organisatieonderdelen de budgetten toe waarover zij mogen beschikken. De directeuren-generaal en de
      inspecteur-generaal bewaken de voortgang van de uitvoering van jaarplannen van de onder hen ressorterende
      organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: '8.3'
    text: 'De directeuren-generaal en de inspecteur-generaal zijn verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.a
    text: |-
      het bij schriftelijk besluit toedelen van taken aan de onder hen ressorterende organisatieonderdelen en aan de
      functionarissen die leiding geven aan deze organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.b
    text: |-
      de personeelsaangelegenheden van de functionarissen die onder hen ressorteren, voor zover dit niet ingevolge
      [artikel 4, vierde lid][ref1], aan de secretaris-generaal is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel4
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '4'
        hoofdstuk: '3'
  - number: 8.3.c
    text: |-
      de personeelsaangelegenheden van functionarissen die niet meer onder hen ressorteren en ten aanzien van wie geen
      andere verantwoordelijke functionaris binnen het ministerie (meer) aangewezen kan worden, maar die op 31 december
      2002 of later wel onder hen ressorteerden;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.d
    text: |-
      de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de onder hen ressorterende organisatieonderdelen, met uitzondering van de bij de plaatsvervangend
      secretaris-generaal belegde centraal georganiseerde werkgeversverplichtingen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.e
    text: |-
      het zorgdragen voor toedeling van de onder d bedoelde verantwoordelijkheid aan onder hen
      ressorterende functionarissen, voor zover deze functionarissen als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref1] optreden;


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel1
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '1'
  - number: 8.3.f
    text: |-
      het adviseren van de bewindspersonen ten aanzien van hun eigen werkterrein en het attenderen van de bewindspersonen
      op politiek of maatschappelijk gevoelige aspecten ten aanzien van dat werkterrein;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.g
    text: |-
      het rapporteren aan de secretaris-generaal over de uitvoering van de jaarplannen betreffende de onder hen
      ressorterende organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: 8.3.h
    text: |-
      de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 8.3.i
    text: |-
      het materieel beheer overeenkomstig de [Regeling materieelbeheer rijksoverheid 2006][ref1] en de
      [Regeling materieelbeheer museale voorwerpen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019767
      [ref2]: https://wetten.overheid.nl/BWBR0020583
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019767
      - id: ref2
        bwb_id: BWBR0020583
  - number: '8.4'
    text: |-
      De inspecteur-generaal geeft op verzoek van een der kamers van de Staten-Generaal of van een commissie uit een van
      die kamers een toelichting op het jaarverslag of een andere rapportage van de Inspectie Werk en Inkomen nadat het
      desbetreffende stuk aan de kamers ter kennis is gebracht. De inspecteur-generaal beperkt zich daarbij tot het geven
      van inlichtingen van feitelijke aard. De inspecteur-generaal stelt de minister terstond in kennis van een verzoek
      als hier bedoeld.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel8
  - number: '9.1'
    text: |-
      Elke directeur-generaal is bevoegd om namens een bewindspersoon besluiten te nemen, privaatrechtelijke
      rechtshandelingen te verrichten en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met zijn werkterrein en voor zover zij niet zijn voorbehouden
      aan een bewindspersoon of de secretaris-generaal. Van de volmacht, bedoeld in de eerste volzin, is evenwel
      uitgezonderd het aangaan van de volgende overeenkomsten:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.a
    text: |-
      overeenkomsten met de Landsadvocaat en andere juridische dienstverleners inzake advisering en procureurstelling
      alsmede het instellen van gerechtelijke procedures;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.b
    text: |-
      overeenkomsten met het Centraal bureau voor de statistiek alsmede overeenkomsten met betrekking tot meerjarige,
      structurele beleidsinformatievoorziening die het verzamelen, bewerken en leveren van beleidsinformatie betreffen,
      voor zover deze informatie primair bedoeld is voor ramingen en verdeelmodellen, dan wel verband houdt met
      verplichtingen die voortvloeien uit de Regeling periodiek evaluatieonderzoek en beleidsinformatie 2006 of met
      verplichtingen die voortvloeien uit internationale verdragen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.c
    text: |-
      overeenkomsten betreffende de organisatie van voorlichtings- en informatiecampagnes en de productie en distributie
      van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.d
    text: overeenkomsten betreffende externe advisering in het kader van voorlichtingsprojecten;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.e
    text: |-
      overeenkomsten met de arbodienst, het centraal flankerend beleid ten behoeve van herplaatsers en de opvang van
      kinderen van medewerkers van het ministerie;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.f
    text: |-
      overeenkomsten betreffende de technische infrastructuur, de hardware, de kantoorautomatiseringssoftware, de
      datacommunicatievoorzieningen en het technisch beheer van geautomatiseerde systemen, tenzij uit besluitvorming van
      de plaatsvervangend secretaris-generaal anders volgt;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.g
    text: |-
      overeenkomsten betreffende de huisvesting en facilitaire voorzieningen ten behoeve van de Haagse vestigingen van
      het ministerie;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.h
    text: overeenkomsten betreffende de gerechtelijke en buitengerechtelijke invordering van geldvorderingen van de Staat;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.1.i
    text: |-
      overeenkomsten met betrekking tot systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties
      van geautomatiseerde informatie- en salarissystemen, tenzij uit besluitvorming van de plaatsvervangend secretaris-
      generaal anders volgt.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: '9.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op de inspecteur-generaal, met dien verstande
      dat voor hem het volgende geldt. De inspecteur-generaal is ten behoeve van de Inspectie Werk en Inkomen bevoegd
      tot het aangaan van overeenkomsten die betrekking hebben op de productie en distributie van voorlichtingsmateriaal
      gericht op de communicatie van toezichtsbevindingen en tot het aangaan van overeenkomsten met de arbodienst. Tevens
      is de inspecteur-generaal ten behoeve van de Inspectie Werk en Inkomen bevoegd tot het aangaan van overeenkomsten
      die betrekking hebben op systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties van
      voorlichtings- en documentatiesystemen. Voorts is de inspecteur-generaal bevoegd om de overeenkomsten, bedoeld
      in het eerste lid, onder f en g, aan te gaan voor zover geen gebruik wordt gemaakt van de departementale
      infrastructuur en er geen sprake is van huisvesting in een gebouw waar tevens een ander organisatieonderdeel van
      het ministerie, niet zijnde het Agentschap SZW, is gehuisvest.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste en tweede lid bedoelde bevoegdheden van de directeuren-generaal en de inspecteur-generaal omvatten
      in elk geval mandaat, volmacht en machtiging ten aanzien van de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.3.a
    text: |-
      beslissingen in bezwaar- en beroepsprocedures voor zover deze betrekking hebben op hun eigen verantwoordelijkheden
      of werkterrein, met uitzondering van de beslissing op een beroepschrift;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.3.b
    text: |-
      de aangelegenheden, genoemd in [artikel 8, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel8
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '8'
        hoofdstuk: '3'
  - number: 9.3.c
    text: |-
      het benoemen van de onder hen ressorterende hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan
      wie bevoegdheden zijn toegekend met betrekking tot personeelsaangelegenheden, voor zover het gaat om functies tot
      en met salarisschaal 13 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], mits
      zij van hun voornemen daartoe vooraf melding hebben gemaakt in de Commissie Management Development;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 9.3.d
    text: het instellen van tijdelijke projectorganisaties binnen hun eigen werkterrein;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.3.e
    text: |-
      de formatie van de onder hen ressorterende organisatieonderdelen, een en ander met inachtneming van de daarvoor
      beschikbaar gestelde budgetten en desbetreffende aanwijzingen van de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: 9.3.f
    text: |-
      het verlenen en vaststellen van subsidies en rijksvergoedingen, het aangaan van verbetertrajecten en het korten op
      bevoorschotting, voor zover het de uitvoering betreft van regelingen op hun eigen werkterrein.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel9
  - number: '10'
    text: |-
      De directeur-generaal Arbeidsverhoudingen en Internationale Betrekkingen is belast met de beleids- en
      bedrijfsvoering betreffende de organisatieonderdelen, genoemd in [artikel 2, onder c][ref1]. Het werkterrein van de
      directeur-generaal Arbeidsverhoudingen en Internationale Betrekkingen omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: 10.a
    text: het algemeen sociaal-economisch beleid;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel10
  - number: 10.b
    text: |-
      de arbeidsverhoudingen met inbegrip van de aanvullende pensioenen, waaronder het beleid met betrekking tot
      arbeidsvoorwaardenvorming, publiekrechtelijke bedrijfsorganisatie, arbeidsrecht en arbeid en zorg;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel10
  - number: 10.c
    text: |-
      de departementale coördinatie van het internationaal beleid en het uitdragen van en onderhandelen over de
      Nederlandse standpunten in multilateraal en bilateraal verband;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel10
  - number: 10.d
    text: de uitvoering van regelgeving op het gebied van arbeidsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel10
  - number: '11'
    text: |-
      De directeur-generaal Arbeidsomstandigheden en Sociale Verzekeringen is belast met de beleids- en bedrijfsvoering
      betreffende de organisatieonderdelen, genoemd in [artikel 2, onder d][ref1]. Het werkterrein van de directeur-
      generaal Arbeidsomstandigheden en Sociale Verzekeringen omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.a
    text: |-
      het beleid met betrekking tot de bestrijding en preventie van arbeidsrisico’s en arbeidsongeschiktheid in ruime
      zin;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel11
  - number: 11.b
    text: |-
      het beleid ten aanzien van de werknemers- en volksverzekeringen met inbegrip van het beleid met betrekking tot
      grensoverschrijdende verzekeringsposities van personen die naar Nederland komen dan wel uit Nederland vertrekken en
      het beleid met betrekking tot de financiering van de werknemers- en volksverzekeringen en de daarmee samenhangende
      administratieve lasten;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel11
  - number: 11.c
    text: het centraal regisseren van handhavingsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel11
  - number: 11.d
    text: |-
      het coördineren van activiteiten in verband met de vermindering van administratieve lasten voor burgers en het
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel11
  - number: '12'
    text: |-
      De directeur-generaal Arbeidsmarktbeleid en Bijstand is belast met de beleids- en bedrijfsvoering betreffende
      de organisatieonderdelen, genoemd in [artikel 2, onder e][ref1]. Het werkterrein van de directeur-generaal
      Arbeidsmarktbeleid en Bijstand omvat in brede zin:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.a
    text: |-
      het arbeidsmarktbeleid met inbegrip van de problematiek van de arbeidsmigratie, de afwikkeling van de opgeheven
      arbeidsvoorzieningsorganisatie, de werking van de arbeidsbemiddelingsmarkt, het instrumentarium van gesubsidieerde
      arbeid en het beleid rond arbeidsinpassing van arbeidsgehandicapten;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel12
  - number: 12.b
    text: de ontwikkeling van de voorwaarden waarbinnen gemeenten het beleid van werk en inkomen gestalte kunnen geven;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel12
  - number: 12.c
    text: de ontwikkeling van de departementale kaders voor het reïntegratiebeleid;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel12
  - number: 12.d
    text: het beleid met betrekking tot subsidieregelingen op het terrein van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel12
  - number: '13'
    text: |-
      De inspecteur-generaal is belast met de beleids- en bedrijfsvoering betreffende de Inspectie
      Werk en Inkomen. Het werkterrein van de inspecteur-generaal omvat de taken, bedoeld in
      [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], alsmede het aan de minister
      opgedragen toezicht op de toezichtswerkzaamheden van:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
  - number: 13.a
    text: |-
      het College voor toelating van bestrijdingsmiddelen, genoemd in
      [artikel 1a, eerste lid, van de Bestrijdingsmiddelenwet 1962][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel1a
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 1a
  - number: 13.b
    text: |-
      de Sociaal-Economische Raad, genoemd in [artikel 1 van de Wet op de bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel1
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '1'
  - number: 13.c
    text: |-
      door de minister op grond van wet- en regelgeving op het terrein van arbeidsveiligheid, arbeidsgezondheid en
      productveiligheid aangewezen certificatie- en keuringsinstellingen die zijn belast met het verstrekken van
      certificaten, danwel het verrichten van keuringen in het belang van veiligheid en gezondheid in de arbeid.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel13
  - number: '14.1'
    text: |-
      De uitoefening van vertegenwoordigingsbevoegdheden geschiedt binnen de grenzen van de vastgestelde taken en met
      inachtneming van het terzake geldende recht alsmede de voor de rijksdienst en voor het ministerie geldende beleids-
      en uitvoeringsregels.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: '14.2'
    text: |-
      De algemene bepalingen inzake organisatie, mandaat, volmacht en machtiging in dit besluit zijn tevens van
      toepassing ten aanzien van de uitoefening van bevoegdheden die krachtens ondermandaat respectievelijk doorverlening
      van volmacht en machtiging worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: '14.3'
    text: |-
      Het uitoefenen van vertegenwoordigingsbevoegdheden die betrekking hebben op aangelegenheden met (mogelijke)
      financiële gevolgen geschiedt, onverminderd het bepaalde in het eerste lid, met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: 14.3.a
    text: de begrotingswet en de daarbij gegeven financiële ruimte;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: 14.3.b
    text: de voor de vertegenwoordigingsbevoegde geldende jaarplannen en budgetten;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: 14.3.c
    text: |-
      het bepaalde bij en krachtens de [Comptabiliteitswet 2001][ref1] en de aanwijzingen van de directeur Financieel-
      Economische Zaken op grond van die wet en de daarop berustende regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: 14.3.d
    text: door de secretaris-generaal te stellen regels betreffende de (financiële) besturing van het ministerie.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: '14.4'
    text: 'Verleningen van mandaat, volmacht en machtiging zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: 14.4.a
    text: indien bij wettelijk voorschrift is bepaald dat verlening van de betreffende bevoegdheid niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: 14.4.b
    text: indien de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel14
  - number: '15.1'
    text: |-
      De afdoening van alle stukken, waarvan de bewindspersonen aangeven dat zij deze zelf wensen af te doen, geschiedt
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel15
  - number: '15.2'
    text: |-
      Tenzij de bewindspersonen anders te kennen geven worden brieven ter beantwoording van persoonlijke brieven, gericht
      aan (een van) de bewindspersonen, ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel15
  - number: '15.3'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht
      of machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen door opneming
      van de volgende formule: De Minister van Sociale Zaken en Werkgelegenheid, namens deze, functie betrokken
      vertegenwoordigingsbevoegde, handtekening van de betrokken vertegenwoordigingsbevoegde, naam van de betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel15
  - number: '15.4'
    text: |-
      Stukken kunnen met goedvinden van een bewindspersoon overeenkomstig de door hen geparafeerde minute worden
      ondertekend door de secretaris-generaal dan wel door een door de bewindspersoon aan te wijzen andere functionaris.
      Daartoe wordt de volgende formule opgenomen: Overeenkomstig het door de Minister genomen besluit, functie betrokken
      vertegenwoordigingsbevoegde, handtekening van de betrokken vertegenwoordigingsbevoegde, naam van de betrokken
      vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel15
  - number: '15.5'
    text: |-
      In afwijking van het bepaalde in het derde en vierde lid, wordt in de ondertekening van stukken die betrekking
      hebben op een aangelegenheid die volgens de geldende taakverdeling tussen de bewindspersonen behoort tot het
      takenpakket van een staatssecretaris, in plaats van ‘Minister’ vermeld: Staatssecretaris. Indien het ministerie
      meer dan een staatssecretaris heeft, wordt daaraan de naam van de betreffende staatssecretaris toegevoegd.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel15
  - number: '16.1'
    text: 'Stukken, bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.a
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.b
    text: de Raad van State (van het Koninkrijk), voor zover betrekking hebbend op wetgeving;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.c
    text: de Raad van Ministers (van het Koninkrijk);
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.d
    text: de Eerste of Tweede Kamer der Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.e
    text: de Algemene rekenkamer;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.f
    text: de Nationale ombudsman en
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: 16.1.g
    text: een extern advies- of overlegorgaan,
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: '16.2'
    text: |-
      Ministeriële regelingen houdende algemeen verbindende voorschriften worden vastgesteld en ondertekend door een
      bewindspersoon. Indien bij of krachtens de wet waarbij de bevoegdheid tot het vaststellen van een ministeriële
      regeling wordt verleend in de mogelijkheid van mandaatverlening is voorzien kan een ministeriële regeling namens
      de bewindspersoon worden vastgesteld en ondertekend door hetzij de functionaris die daartoe bij of krachtens die
      wetsbepaling is aangewezen, hetzij de functionaris die daarvoor op grond van deze regeling in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: '16.3'
    text: |-
      Besluiten inzake het verlenen van goedkeuring aan, het schorsen of het vernietigen van dan wel het onthouden van
      goedkeuring aan besluiten van een ander bestuursorgaan worden genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: '16.4'
    text: |-
      Besluiten inzake de definitieve buiteninvorderingstelling van vorderingen op derden van meer dan € 500.000,– worden
      genomen en ondertekend door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: '16.5'
    text: |-
      Besluiten inzake kwijtschelding van vorderingen op derden van meer dan € 500.000,– worden genomen en ondertekend
      door een bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
  - number: '16.6'
    text: |-
      Besluiten tot instelling van een externe of interdepartementale commissie of een adviescollege in de zin van de
      [Kaderwet adviescolleges][ref1] en de benoeming van de leden van deze organen dan wel de inschakeling van externe
      personen die op verzoek van een bewindspersoon op persoonlijke titel en op individuele basis een bepaalde taak
      verrichten, worden genomen en ondertekend door een bewindspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008159
  - number: 16a.1
    text: |-
      Een voorstel tot het nemen van een besluit als bedoeld [artikel 16, zesde lid][ref1], wordt na schriftelijke
      instemming van de secretaris-generaal aan een bewindspersoon voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel16
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '16'
        hoofdstuk: '4'
  - number: 16a.2
    text: |-
      Besluiten tot de toekenning van vergoedingen en beloningen aan een externe of interdepartementale commissie, een
      adviescollege in de zin van de [Kaderwet adviescolleges][ref1] dan wel aan externe personen die op verzoek van
      een bewindspersoon op persoonlijke titel en op individuele basis een bepaalde taak verrichten, worden genomen na
      schriftelijke instemming van de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0008159
  - number: '17'
    text: |-
      Bij afwezigheid of verhindering van een vertegenwoordigingsbevoegde worden, voor de duur van de afwezigheid of
      verhindering, diens taken en bevoegdheden waargenomen door een daartoe aan te wijzen plaatsvervanger, behoudens de
      bevoegdheid tot het verlenen, wijzigen of intrekken van mandaten, volmachten en machtigingen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel17
  - number: '18'
    text: |-
      Tenzij in deze regeling anders is bepaald, is de leidinggevende van een vertegenwoordigingsbevoegde te allen tijde
      bevoegd de aan deze verleende bevoegdheden zelf uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel18
  - number: '19'
    text: |-
      Een vertegenwoordigingsbevoegde is niet bevoegd tot het nemen van besluiten over en het vaststellen en ondertekenen
      van stukken op het gebied van personeelsaangelegenheden die betrekking hebben op hemzelf.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel19
  - number: '20.1'
    text: |-
      Er is een Subsidie Expertise Centrum van het Ministerie van Sociale Zaken en Werkgelegenheid. Het Subsidie
      Expertise Centrum is een samenwerkingsverband tussen de directies Financieel-Economische Zaken, Wetgeving,
      Bestuurlijke en Juridische Aangelegenheden, Gemeenschappelijke Organisatie Bedrijfsvoering, de Auditdienst en het
      Agentschap SZW.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel20
  - number: '20.2'
    text: |-
      Indien een organisatieonderdeel het voornemen heeft tot het ontwerpen van een subsidieregeling of tot het verlenen
      van een subsidie op basis van de Kaderwet SZW-subsidies en de Algemene Regeling SZW-subsidies, is voorafgaande
      inschakeling van de directeur Financieel-Economische Zaken, via een adviesaanvraag bij het Subsidie Expertise
      Centrum, verplicht.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel20
  - number: '21.1'
    text: |-
      Het gebruik van een afgesloten raamovereenkomst is verplicht, behoudens toestemming van de houder van de
      raamovereenkomst om hiervan af te wijken.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel21
  - number: '21.2'
    text: |-
      Indien een organisatieonderdeel overweegt om een voorgenomen opdracht met een waarde die minimaal gelijk is aan
      de laagste drempel voor aanbesteding conform de Europese aanbestedingsrichtlijnen niet aan te besteden, omdat het
      van mening is dat de betreffende opdracht niet onder het regiem van één van de EG-aanbestedingsrichtlijnen valt,
      dan wel dat een beroep gedaan kan worden op uitzonderingsbepalingen binnen de richtlijnen, is inschakeling van de
      directeur Wetgeving, Bestuurlijke en Juridische Aangelegenheden verplicht.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel21
  - number: '21.3'
    text: |-
      Indien op een overeenkomst de Europese aanbestedingsregels van toepassing zijn, is inschakeling van de directeur
      Facilitaire Zaken verplicht.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel21
  - number: '21.4'
    text: |-
      Het eerste tot en met het derde lid zijn niet van toepassing ten aanzien van het Agentschap SZW en de Inspectie
      Werk en Inkomen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel21
  - number: '21.5'
    text: |-
      Een opdracht voor de externe inhuur van interim-management, organisatie- en formatieadviezen, communicatieadvies
      of beleidsadvies wordt slechts verleend na voorafgaande instemming van één van de functionarissen, genoemd in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel3
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '3'
        hoofdstuk: '2'
  - number: '22.1'
    text: |-
      De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de inspecteur-generaal
      kunnen hun vertegenwoordigingsbevoegdheden in een door hen te bepalen omvang mandateren of doorverlenen aan onder
      hen ressorterende functionarissen. Zij kunnen daarbij bepalen dat deze ondermandaat kunnen verlenen respectievelijk
      volmacht en machtiging kunnen doorverlenen aan rechtstreeks onder hen ressorterende functionarissen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: '22.2'
    text: |-
      Bevoegdheden ten aanzien van de volgende aangelegenheden kunnen niet worden doorverleend aan andere dan de in
      [artikel 3, eerste lid][ref1], genoemde functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel3
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '3'
        hoofdstuk: '2'
  - number: 22.2.a
    text: het aangaan van overeenkomsten met een waarde van € 500.000,– of meer;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.2.b
    text: |-
      het benoemen van hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan wie bevoegdheden zijn
      toegekend met betrekking tot personeelsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.2.c
    text: |-
      het op grond van [artikel 22a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] toekennen van
      periodieke toeslagen voor zover het gaat om toeslagen om redenen van werving en behoud;


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
  - number: 22.2.d
    text: de voorlopige buiteninvorderingstelling van vorderingen op derden van meer dan € 500.000,–;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.2.e
    text: de formatie van organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.2.f
    text: |-
      het vaststellen en ondertekenen van beleidsregels als bedoeld in
      [artikel 1:3, vierde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '22.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid kunnen de secretaris-generaal, de plaatsvervangend
      secretaris-generaal, de directeuren-generaal en de inspecteur-generaal hun bevoegdheden eveneens doorverlenen aan
      functionarissen die niet onder hen ressorteren, mits de betreffende functionaris daarmee schriftelijk instemt.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: '22.4'
    text: |-
      De (door)verlening van (onder-)mandaat, volmacht en machtiging kan uitsluitend bij een schriftelijk besluit
      geschieden.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: '22.5'
    text: |-
      In afwijking van het bepaalde in het tweede lid kunnen de volgende bevoegdheden worden doorverleend aan de algemeen
      directeur van de Arbeidsinspectie:
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.5.a
    text: het aangaan van overeenkomsten met een waarde van € 500.000,– of meer;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.5.b
    text: |-
      het benoemen van hoofden van afdelingen, subafdelingen en bureaus en van teamleiders aan wie bevoegdheden zij
      toegekend met betrekking tot personeelsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: 22.5.c
    text: de formatie van organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel22
  - number: '23.1'
    text: |-
      De vertegenwoordigingsbevoegde brengt de door hem vastgestelde organisatie- mandaat- en volmachtbesluiten
      onmiddellijk en in elk geval voor de bekendmaking ter kennis aan de mandaat- respectievelijk volmachtgever en –
      indien deze niet tevens de directe leidinggevende is – aan de directe leidinggevende, alsmede aan de secretaris-
      generaal.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel23
  - number: '23.2'
    text: |-
      Binnen het ministerie wordt een mandaat-, volmacht- en machtigingsregister SZW bijgehouden. De
      vertegenwoordigingsbevoegde draagt zorg voor een juiste, volledige en tijdige aanlevering van de door hem
      vastgestelde besluiten tot doorverlening van mandaten, volmachten en machtigingen, alsmede van aanwijzingen
      van plaatsvervangers als bedoeld in [artikel 17][ref1], aan de beheerder van het mandaat-, volmacht- en
      machtigingsregister SZW.


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel17
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016199
        artikel: '17'
        hoofdstuk: '4'
  - number: '24.1'
    text: |-
      Aan de uitoefening van de bij dit besluit opgedragen taken en van de bij en krachtens dit besluit verleende
      bevoegdheden kunnen door iedere leidinggevende algemene en bijzondere aanwijzingen aan zijn ondergeschikten worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel24
  - number: '24.2'
    text: De vertegenwoordigingsbevoegde is gehouden de algemene en bijzondere aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel24
  - number: '24.3'
    text: |-
      Elke leidinggevende is gehouden toe te zien op de naleving door zijn ondergeschikten van deze en andere mandaat-
      en volmachtbesluiten en van de aan de uitoefening van het mandaat, de volmacht of machtiging verbonden algemene en
      bijzondere aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel24
  - number: '24.4'
    text: |-
      De vertegenwoordigingsbevoegde is gehouden met inachtneming van de door zijn leidinggevende(n) te geven algemene
      en bijzondere aanwijzingen aan zijn leidinggevende(n) te rapporteren over de wijze waarop hij zijn taken heeft
      uitgeoefend en van zijn vertegenwoordigingsbevoegdheden gebruik heeft gemaakt. De leidinggevende(n) kan/kunnen
      algemene en bijzondere aanwijzingen geven omtrent de vorm, inhoud, tijdstippen en perioden van de rapportage.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel24
  - number: '24.5'
    text: Alle in deze regeling genoemde bedragen zijn inclusief BTW.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel24
  - number: '25.1'
    text: Het Organisatie-, mandaat- en volmachtbesluit SZW 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
  - number: '25.2'
    text: |-
      Na de inwerkingtreding van deze regeling berusten de volgende regelingen die genomen zijn krachtens
      [artikel 53 van het Organisatie-, mandaat- en volmachtbesluit SZW 2002][ref1] op [artikel 22, eerste lid][ref2],
      van deze regeling:


      [ref1]: https://wetten.overheid.nl/BWBR0013298#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel22
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0013298
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0016199
        artikel: '22'
        hoofdstuk: '4'
  - number: 25.2.a
    text: |-
      het [Mandaatbesluit ter uitvoering van de SZW-Subsidieregeling preventie van arbeidsuitval 2003 door Senter][ref1] ;


      [ref1]: https://wetten.overheid.nl/BWBR0015030
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015030
  - number: 25.2.b
    text: |-
      de __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________;


      [ref1]: https://wetten.overheid.nl/BWBR0014991
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014991
  - number: 25.2.c
    text: |-
      Besluit van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 oktober 2003, Directie Arbeidsveiligheid
      en -gezondheid, nr. A&G/W&P/2003/75944, tot verlening van mandaat aan de directeur-generaal Arbeidsomstandigheden
      en Sociale Verzekeringen.
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
  - number: '25.3'
    text: |-
      Na de inwerkingtreding van deze regeling berusten het [Instellingsbesluit projectorganisatie InterCoach][ref1]
      en het [Instellingsbesluit projectorganisatie Secretaressen bij het Rijk][ref2] op
      [artikel 7, tweede lid, onder d][ref3], en [artikel 22, eerste lid][ref4], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015114
      [ref2]: https://wetten.overheid.nl/BWBR0015113
      [ref3]: https://wetten.overheid.nl/BWBR0016199#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0016199#Artikel22
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel25
