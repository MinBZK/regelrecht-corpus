  - number: '4.2'
    text: |-
      De secretaris-generaal geeft rechtstreeks leiding aan de functionarissen, genoemd in
      [artikel 3, eerste lid, onderdeel b tot en met f][ref1], en aan de functionarissen die leiding geven aan de
      organisatieonderdelen, genoemd in [artikel 2, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016199#Artikel2
    url: https://wetten.overheid.nl/BWBR0016199/2008-06-13#Artikel4
    references:
