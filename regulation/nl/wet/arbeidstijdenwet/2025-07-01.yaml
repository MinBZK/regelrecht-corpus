      1 De arbeid van een jeugdige werknemer wordt zodanig ingericht, dat hij in staat is volgens de voor hem geldende
      wetgeving onderwijs te volgen.

      2 Voor de toepassing van [hoofdstuk 5][ref1] en de daarop berustende bepalingen geldt de tijd waarop een jeugdige
      werknemer onderwijs volgt of pleegt te volgen, de onderbrekingen inbegrepen, als arbeidstijd.

      3 Elk beding waarbij ten nadele van de jeugdige werknemer wordt afgeweken van dit artikel, is nietig.


