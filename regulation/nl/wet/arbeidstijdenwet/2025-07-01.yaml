        paragraaf: '5.3'
  - number: 11:3
    text: |-
      1 Het niet naleven van [artikel 3:2, eerste en vierde lid][ref1], en [3:3, tweede lid][ref2], wordt aangemerkt als
      een strafbaar feit indien een kind bij het verrichten van arbeid een ongeval overkomt dat ernstig lichamelijk of
      geestelijk letsel of de dood ten gevolge heeft of indien redelijkerwijs te verwachten is dat de hiervoor genoemde
      gevolgen aan het verrichten van arbeid zijn verbonden.

      2 Bij arbeid verricht door de in [artikel 5:12, tweede lid][ref3], bedoelde personen wordt het niet naleven
      van de [artikelen 5:3, eerste en tweede lid][ref4], [5:4, eerste lid][ref5], [5:5, eerste en tweede lid][ref6],
      [5:7, eerste en tweede lid][ref7], [5:8, eerste tot en met vijfde lid, zevende en negende lid][ref8],
      [5:9, eerste tot en met zevende lid][ref9], [5:14, derde lid][ref10], [5:15, zevende lid][ref11],
      [5:16, eerste lid][ref12], voor zover het niet naleven van dit artikellid een overtreding oplevert alsmede –
        voor zover aangeduid als overtredingen – de voorschriften krachtens de [artikelen 2:7, eerste lid][ref13], en
      [5:12, tweede lid][ref14], aangemerkt als strafbaar feit, als daardoor de verkeersveiligheid ernstig in gevaar is
      gebracht of redelijkerwijs kan worden aangenomen dat de verkeersveiligheid ernstig in gevaar is gebracht.

      3 Ingeval bij of krachtens deze wet wordt verwezen naar het AETR-verdrag, kan overtreding daarvan ook als strafbaar
      feit worden aangemerkt indien dat verdrag in de Engelse taal is gesteld en bekend gemaakt.


