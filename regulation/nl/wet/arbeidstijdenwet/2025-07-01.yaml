      Deze wet en de daarop berustende bepalingen zijn niet van toepassing op verrichtingen van leerlingen of studenten
      in onderwijsinstellingen of gedeelten daarvan, open ruimten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel23
  - number: 2:4
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder oefening: elk door het defensiepersoneel in de praktijk
      brengen van onderwezen bekwaamheden teneinde aldus de bedrevenheid in het uitvoeren van aan de krijgsmacht
      opgedragen operationele taken te verwerven, te vergroten of te onderhouden.

      2 Deze wet en de daarop berustende bepalingen zijn van toepassing op arbeid verricht door defensiepersoneel, tenzij
      deze arbeid wordt verricht:

      a. ten tijde van buitengewone omstandigheden, alsmede in de gevallen genoemd in
      [artikel 71 van het Wetboek van Militair Strafrecht][ref1];

      b. ter uitvoering van bij wet of daarop berustende bepalingen opgedragen taken, voor zover de toepassing van deze
      wet en de daarop berustende bepalingen een goede taakuitoefening belemmert;

      c. in door Onze Minister van Defensie te bepalen andere gevallen waarin onderdelen van de krijgsmacht worden
      ingezet;

      d. inzake aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden bedoeld in de onderdelen a, b
      en c.

      3 Deze wet en de daarop berustende bepalingen zijn, met uitzondering van [paragraaf 4.3][ref2], niet van toepassing
      op arbeid verricht door defensiepersoneel:

      a. tijdens varen, vliegen en oefeningen;

      b. inzake aangelegenheden die rechtstreeks betrekking hebben op het varen, het vliegen en het houden van
      oefeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel24
