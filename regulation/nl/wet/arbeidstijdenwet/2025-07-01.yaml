      1 Een vrijstelling of een ontheffing kan onder beperkingen worden verleend.

      2 Aan een vrijstelling of een ontheffing kunnen voorschriften worden verbonden.

      3 Een vrijstelling of ontheffing kan worden ingetrokken, wanneer:

      a. één of meer van de redenen waarom zij is verleend is of zijn vervallen;

      b. zich na de verlening zodanige feiten of omstandigheden hebben voorgedaan dat, indien deze ten tijde van de
      verlening bekend waren geweest, de vrijstelling of de ontheffing niet of niet in die vorm zou zijn verleend.

      4 Een ontheffing kan tevens worden ingetrokken, wanneer één of meer van de daaraan verbonden voorschriften niet
      wordt of worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel74
  - number: 7:6
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de goedkeuring, verlening,
      afgifte, weigering, schorsing, intrekking of inname door Onze Minister van Infrastructuur en Waterstaat van het
      middel:

      a. terzake van een deugdelijke registratie als bedoeld in [artikel 4:3, tweede en derde lid][ref1], ten aanzien van
      arbeid verricht door personen werkzaam in of op motorrijtuigen;

      b. ten behoeve van de controle op een deugdelijke registratie van arbeids- en rusttijden ten aanzien van arbeid
      verricht door personen werkzaam in of op motorrijtuigen, bedoeld in [artikel 8:5][ref2];

      c. bedoeld in [artikel 9:2][ref3] ten behoeve van het installeren, onderzoeken of herstellen van een apparaat
      als bedoeld in [artikel 9:1, eerste lid][ref4], alsmede van het vastleggen en doorgeven van de daarin opgeslagen
      gegevens.

      2 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Infrastructuur en Waterstaat.


