  - number: 5:14
    text: |-
      1 Onze Minister kan, indien er zich een situatie voordoet die niet gelegen is in functiegebonden
      omstandigheden van de werknemer van 18 jaar of ouder, maar die voortvloeit uit zeer bijzondere sociaal-
      maatschappelijke privé-omstandigheden van die werknemer, op verzoek van die werknemer ontheffing verlenen van
      [artikel 5:8, achtste en negende lid][ref1], mits het een bestendig en regelmatig arbeids- en rusttijdenpatroon
      betreft waarbij die werknemer in elke periode van 4 achtereenvolgende weken ten hoogste 20 maal arbeid verricht
      in nachtdienst.

      2 De in het eerste lid bedoelde werknemer legt de ontheffing of een afschrift daarvan over aan zijn werkgever.

      3 De werkgever organiseert de arbeid zodanig, dat die werknemer geen arbeid verricht in strijd met de in het eerste
      lid bedoelde ontheffing en de daarbij gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
