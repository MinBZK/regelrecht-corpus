      1 Onze Minister van Infrastructuur en Waterstaat houdt een registratie bij van de in
      [artikel 7:6, eerste lid][ref1], bedoelde middelen en daarbij behorende gegevens van betrokkenen.

      2 De in het eerste lid bedoelde gegevens kunnen worden verwerkt in het belang van een goede uitvoering en
      handhaving van de bij of krachtens deze wet gestelde voorschriften met betrekking tot een rechtmatig bezit en
      gebruik van de in [artikel 7:6, eerste lid][ref2], bedoelde middelen.

      3 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen regels worden gesteld over de verstrekking
