      1 Bij de in [artikel 3:2, tweede lid][ref1], toegestane arbeid neemt de verantwoordelijke persoon te allen tijde
      in acht, dat bij de aldaar toegestane arbeid, de veiligheid van het kind niet in gevaar komt, noch arbeid wordt
      verricht welke een nadelige invloed kan uitoefenen op de lichamelijke of geestelijke ontwikkeling van dat kind.

      2 Bij het stellen van de nadere regels, bedoeld in [artikel 3:2, derde lid][ref2], en het verlenen van een
      ontheffing als bedoeld in [artikel 3:3, eerste lid][ref3], wordt te allen tijde in acht genomen, dat bij de aldaar
      toegestane arbeid, de veiligheid van het kind niet in gevaar komt, noch arbeid wordt verricht welke een nadelige
      invloed kan uitoefenen op de lichamelijke of geestelijke ontwikkeling van dat kind.

      3 Bij het stellen van de nadere regels, bedoeld in [artikel 3:2, derde lid][ref4], en het verlenen van een
      ontheffing als bedoeld in [artikel 3:3, eerste lid][ref5], wordt te allen tijde in acht genomen, dat een kind een
      onafgebroken rusttijd heeft van ten minste 12 uren in elke aaneengesloten periode van 24 uren, waarin is begrepen
      de periode tussen 23.00 uur en 06.00 uur.


