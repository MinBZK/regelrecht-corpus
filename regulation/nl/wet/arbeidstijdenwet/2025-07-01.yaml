      1 Als overtreding wordt aangemerkt het niet naleven van de [artikelen 3:2, eerste en vierde lid][ref1],
      [3:3, tweede lid][ref2], [3:4][ref3], [3:5, eerste lid][ref4], [4:1, zesde lid][ref5], [4:3, eerste lid][ref6],
      [4:6][ref7], [5:3, eerste en tweede lid][ref8],[ 5:4, eerste lid][ref9], [5:5, eerste en tweede lid][ref10],
      [5:7, eerste en tweede lid][ref11], [5:8, eerste tot en met vijfde lid, zevende en negende lid][ref12],
      [5:9, eerste tot en met zevende lid][ref13], [5:14, derde lid][ref14], [5:15, zevende lid][ref15],
      [5:16, eerste lid][ref16], voor zover het niet naleven van dit artikellid een overtreding oplevert,
      [8:6, tweede lid][ref17], alsmede – voor zover aangeduid als overtredingen – de voorschriften
      krachtens de [artikelen 2:7, eerste lid][ref18], [4:3, tweede tot en met vierde lid][ref19],
      [5:12, eerste en tweede lid][ref20], [8:1, vijfde lid][ref21], en [9:2, eerste lid][ref22], ten aanzien van het
      gebruik van middelen ten behoeve van het installeren, onderzoeken of herstellen van een apparaat als bedoeld in
      [artikel 9:1, eerste lid][ref23].

      2 Ingeval een artikel of voorschrift, bedoeld in het eerste lid, verwijst naar het AETR-verdrag, kan overtreding
      daarvan ook worden bestraft met een bestuurlijke sanctie indien dat verdrag in de Engelse taal is gesteld en bekend
      gemaakt.


