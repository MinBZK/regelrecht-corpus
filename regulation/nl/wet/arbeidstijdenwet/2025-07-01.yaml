      De werkgever organiseert de arbeid zodanig, dat een vrouwelijke werknemer:

      a. geen arbeid verricht binnen 28 dagen voor de vermoedelijke datum van de bevalling, zoals die is aangegeven
      in een door de vrouwelijke werknemer aan de werkgever overgelegde schriftelijke verklaring van een arts of
      verloskundige waaruit de vermoedelijke datum van bevalling blijkt. Het in de eerste volzin bedoelde tijdvak wordt
      verlengd met het tijdvak, dat verloopt tussen de vermoedelijke datum van de bevalling en de werkelijke datum van
      de bevalling;

      b. geen arbeid verricht binnen 42 dagen na haar bevalling.
