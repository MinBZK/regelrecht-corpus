      1 De werkgever voert een zo goed mogelijk beleid terzake van arbeids- en rusttijden van de werknemers, en houdt
      daarbij, voor zover dat redelijkerwijs van hem gevergd kan worden, rekening met de persoonlijke omstandigheden
      van die werknemers. Het beleid terzake van arbeids- en rusttijden wordt gevoerd in samenhang met het
      arbeidsomstandighedenbeleid, bedoeld in de [Arbeidsomstandighedenwet][ref1].

      2 De uit het in het eerste lid bedoelde beleid voortvloeiende arbeids- en rusttijdenpatronen worden door de
      werkgever schriftelijk vastgelegd. De werkgever bewaart de op deze wijze vastgelegde arbeids- en rusttijdenpatronen
      op een zodanige wijze, dat iedere werknemer de mogelijkheid heeft hiervan desgewenst kennis te nemen.

      3 De werkgever toetst de tot stand gekomen arbeids- en rusttijdenpatronen aan de ervaringen die daarmee zijn
      opgedaan, alsmede hoe deze ervaringen zich verhouden met nieuwe ontwikkelingen op het gebied van de organisatie van
      arbeids- en rusttijden. Indien daartoe aanleiding is, vindt bijstelling van het beleid, bedoeld in het eerste lid,
      en de daarop gebaseerde arbeids- en rusttijdenpatronen plaats.

      4 [Artikel 5 van de Arbeidsomstandighedenwet][ref2] is van overeenkomstige toepassing.

      5 De toezichthouder kan, indien de in dit artikel neergelegde verplichtingen niet of in onvoldoende mate of op
      onjuiste wijze worden nageleefd, een eis tot naleving stellen. Deze eis tot naleving bevat de termijn waarbinnen er
      aan wordt voldaan.

      6 De werkgever voldoet aan de eis tot naleving.


