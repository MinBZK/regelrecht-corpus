      1 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer een onafgebroken rusttijd heeft van ten
      minste 12 uren in elke aaneengesloten periode van 24 uren, waarin zijn begrepen de uren tussen 23.00 uur en 06.00
      uur.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder een onafgebroken rusttijd heeft
      van ten minste 11 uren in elke aaneengesloten periode van 24 uren, welke rusttijd eenmaal in elke aaneengesloten
      periode van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren, indien de aard van de arbeid of de
      bedrijfsomstandigheden dit met zich brengen.

      3 De in het eerste of tweede lid bedoelde periode vangt aan op het eerste tijdstip van de dag, waarop de werknemer
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel53
  - number: 5:4
    text: |-
      1 De werkgever organiseert de arbeid van een jeugdige werknemer zodanig dat, indien hij meer dan 4,5 uren arbeid
      per dienst verricht, zijn arbeid tijdens de dienst wordt onderbroken door een pauze. De pauze bedraagt ten minste
      30 minuten, die zonodig kan worden gesplitst in pauzes van elk ten minste 15 minuten.

      2 De werkgever organiseert de arbeid van een werknemer van 18 jaar of ouder zodanig, dat indien hij:

      a. meer dan 5,5 uren arbeid per dienst verricht, zijn arbeid wordt onderbroken door een pauze van ten minste 30
      minuten, die kan worden gesplitst in pauzes van elk ten minste 15 minuten;

      b. meer dan 10 uren arbeid per dienst verricht, zijn arbeid wordt onderbroken door een pauze van ten minste 45
      minuten, die kan worden gesplitst in pauzes van elk ten minste 15 minuten.

      3 Bij collectieve regeling kan van het tweede lid worden afgeweken. Daarbij wordt in acht genomen dat de werkgever
      de arbeid zodanig organiseert, dat indien de werknemer meer dan 5,5 uren arbeid per dienst verricht, zijn arbeid
      wordt onderbroken door een pauze van ten minste 15 minuten. Elk beding, waarbij op een andere wijze dan in dit lid
      is bepaald, wordt afgeweken van het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel54
  - number: 5:5
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer een onafgebroken rusttijd heeft van ten
      minste 36 uren in elke aaneengesloten periode van 7 maal 24 uren.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder een onafgebroken rusttijd heeft
      van ten minste:

      a. 36 uren in elke aaneengesloten periode van 7 maal 24 uren, of

      b. 72 uren in elke aaneengesloten periode van 14 maal 24 uren, welke rusttijd kan worden gesplitst in onafgebroken
      rustperioden van elk ten minste 32 uren.

      3 De in het eerste of tweede lid bedoelde periode vangt aan op het eerste tijdstip van de dag, waarop de werknemer
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel55
  - number: 5:6
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat de werknemer op zondag geen arbeid verricht, behalve voor zover
      dat uit de aard van de arbeid voortvloeit en het tegendeel is bedongen.

      2 Indien de bedrijfsomstandigheden dit noodzakelijk maken, kan van het eerste lid worden afgeweken, indien de
      werkgever daartoe overeenstemming heeft bereikt met het medezeggenschapsorgaan of, bij het ontbreken daarvan, met
      de belanghebbende werknemers. De werknemer verricht in de omstandigheden, bedoeld in de vorige zin, uitsluitend
      arbeid op zondag, indien hij daarmee voor dat geval instemt.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer op ten minste 13 zondagen in elke periode van 52
      aaneengesloten weken geen arbeid verricht.

      4 Bij collectieve regeling kan van het derde lid worden afgeweken, met inachtneming van:

      a. het eerste lid, of

      b. het tweede lid.

      Bij toepassing van de aanhef en onderdeel a van de vorige zin, verricht de werknemer uitsluitend op 40 of meer
      zondagen in elke periode van 52 aaneengesloten weken arbeid, indien hij daarmee voor dat geval instemt. Elk beding,
      waarbij op een andere wijze dan in dit lid is bepaald, wordt afgeweken van het derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel56
  - number: 5:7
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer ten hoogste arbeid verricht gedurende:

      a. 9 uren per dienst;

      b. 45 uren per week, en

      c. gemiddeld 40 uren per week in elke periode van 4 aaneengesloten weken.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste arbeid verricht
      gedurende:

      a. 12 uren per dienst;

      b. 60 uren per week, en

      c. gemiddeld 48 uren per week in elke periode van 16 aaneengesloten weken.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste arbeid verricht
      gedurende gemiddeld 55 uren per week in elke periode van 4 aaneengesloten weken.

      4 Bij collectieve regeling kan, met inachtneming van het tweede lid, van het derde lid worden afgeweken. Elk
      beding, waarbij op een andere wijze dan in de vorige zin is bepaald, wordt afgeweken van het derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel57
  - number: 5:8
    text: |-
      1 In afwijking van [artikel 5:7, tweede lid, onderdeel a][ref1], organiseert de werkgever, behoudens het derde lid,
      de arbeid zodanig, dat een werknemer ten hoogste arbeid verricht gedurende 10 uren per nachtdienst.

      2 In elke periode van 16 aaneengesloten weken waarin een werknemer 16 of meer malen arbeid in een nachtdienst
      verricht organiseert de werkgever, in afwijking van [artikel 5:7, tweede lid, onderdeel c][ref2], de arbeid zodanig
      dat ten hoogste gemiddeld 40 uren per week arbeid wordt verricht in die periode van 16 aaneengesloten weken.

      3 In afwijking van het eerste of vierde lid kan de werkgever ten hoogste 5 malen in elke aaneengesloten periode van
      14 maal 24 uren, en ten hoogste 22 malen in elke aaneengesloten periode van 52 weken, de arbeid zodanig organiseren
      dat een werknemer:

      a. ten hoogste arbeid verricht gedurende 12 uren in een nachtdienst, en

      b. aansluitend op die nachtdienst een onafgebroken rusttijd heeft van ten minste 12 uren.

      4 Indien arbeid in een nachtdienst wordt verricht waarbij die dienst eindigt na 02.00 uur, organiseert de werkgever
      die arbeid zodanig, dat na die dienst de werknemer, behoudens het derde lid, een onafgebroken rusttijd heeft van
      ten minste 14 uren, welke rusttijd eenmaal in elke aaneengesloten periode van 7 maal 24 uren mag worden ingekort
      tot ten minste 8 uren, indien de aard van de arbeid of de bedrijfsomstandigheden dit met zich brengen.

      5 De werkgever organiseert de arbeid zodanig, dat een werknemer na het verrichten van een reeks van 3 of meer
      achtereenvolgende nachtdiensten een onafgebroken rusttijd heeft van ten minste 46 uren.

      6 Indien in een reeks van achtereenvolgende diensten een of meer van deze diensten een nachtdienst betreft,
      organiseert de werkgever die arbeid zodanig, dat een werknemer gedurende ten hoogste 7 achtereenvolgende diensten
      arbeid verricht. Bij collectieve regeling kan, met inachtneming van het zevende lid, van de vorige zin worden
      afgeweken. Elk beding, waarbij op een andere wijze dan in de vorige zin is bepaald, wordt afgeweken van dit lid,
      is nietig.

      7 De werkgever organiseert de arbeid zodanig, dat een werknemer ten hoogste 8 achtereenvolgende diensten
      arbeid verricht, indien een of meer van deze diensten een nachtdienst betreft en de aard van de arbeid of
      bedrijfsomstandigheden dit met zich brengen.

      8 De werkgever organiseert de arbeid zodanig, dat een werknemer in elke periode van 16 aaneengesloten weken
      ten hoogste 36 malen arbeid verricht in een nachtdienst die eindigt na 02.00 uur. Bij collectieve regeling
      kan, met inachtneming van het negende lid, van de vorige zin worden afgeweken, indien de aard van de arbeid of
      bedrijfsomstandigheden dit met zich brengen. Elk beding, waarbij op een andere wijze dan in de vorige zin is
      bepaald, wordt afgeweken van dit lid, is nietig.

      9 De werkgever organiseert de arbeid zodanig, dat een werknemer in elke periode van:

      a. 52 aaneengesloten weken ten hoogste 140 malen arbeid verricht in een nachtdienst die eindigt na 02.00 uur, of

      b. 2 aaneengesloten weken ten hoogste 38 uren arbeid verricht tussen 00.00 uur en 06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel57
