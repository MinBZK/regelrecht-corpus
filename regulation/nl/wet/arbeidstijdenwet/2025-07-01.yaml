  - number: 10:17
    text: |-
      De in [artikel 10:16][ref1] bedoelde toezichthouders kunnen vorderen dat de bestuurlijke boete terstond wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1016
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel1017
