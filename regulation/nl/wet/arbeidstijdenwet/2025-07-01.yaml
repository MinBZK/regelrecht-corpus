      1 Een bestuurlijke boete wordt opgelegd door de toezichthouder, bedoeld in [artikel 8:1, eerste lid][ref1], of
      in [artikel 8:1, tweede lid][ref2], ten aanzien van de in [artikel 5:12, tweede lid, onderdeel a][ref3], bedoelde
      personen ten aanzien van arbeid door hen verricht in of op motorrijtuigen.

      2 Onverminderd [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref4] vermeldt de beschikking in ieder
      geval:

      a. het officiële nummer waaronder het desbetreffende voertuig is geregistreerd;

      b. de houder van het kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel81
