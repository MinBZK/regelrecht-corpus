      1 Onze Minister van Infrastructuur en Waterstaat kan een instantie aanwijzen die belast is met het afnemen van
      een examen en het afgeven van een diploma met betrekking tot het installeren, onderzoeken of herstellen van een
      apparaat ter controle als bedoeld in [artikel 9:1, eerste lid][ref1].

      2 De instantie, aangewezen op grond van het eerste lid, kan een tarief vaststellen voor het examen, bedoeld in
      dat lid.

      3 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen regels worden gesteld met betrekking tot
      het examen en het diploma, bedoeld in het eerste lid.


