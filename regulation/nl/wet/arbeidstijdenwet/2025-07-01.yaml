      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanvraag en het gebruik
      van middelen door toezichthouders ten behoeve van de controle op een deugdelijke registratie van arbeids- en
      rusttijden ten aanzien van arbeid verricht door personen werkzaam in of op motorrijtuigen.

      2 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel85
  - number: 8:6
    text: |-
      1 Een toezichthouder kan afgifte vorderen van een middel terzake van de deugdelijke registratie, bedoeld in
      [artikel 4:3, derde lid][ref1], dat betrekking heeft op arbeid verricht door personen in of op motorrijtuigen, in
      bij algemene maatregel van bestuur omschreven gevallen van onrechtmatig bezit en gebruik van dat middel.

      2 Een ieder is op eerste vordering verplicht tot afgifte van een door hem gehouden middel als bedoeld in het eerste
      lid.

      3 Een ingevorderd middel wordt met een door de toezichthouder opgemaakt rapport inzake de toedracht van vordering
      tot afgifte gezonden aan Onze Minister van Infrastructuur en Waterstaat.

      4 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
