  - number: 8:3a
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van
      een voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld of
      op grond van de [Wet op de economische delicten][ref1] strafbaar is gesteld, aan de werkgever een schriftelijke
      waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding van eenzelfde in de
      waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene maatregel van bestuur
      aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd dat door hem
      aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden aangevangen.
      [Artikel 8:1, tweede lid][ref2], is van overeenkomstige toepassing.

      2 Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid,
      aan de werkgever bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt opgevolgd met
      ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens de eerste
      overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd of een proces-verbaal is
      opgemaakt.

      3 De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport of
      proces-verbaal.

      4 De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken.

      5 De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid,
      met inbegrip van de oplegging van een last onder bestuursdwang, de nodige maatregelen te treffen, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.

      6 Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en
      een maatregel of aanwijzing als bedoeld in het vijfde lid.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel81
