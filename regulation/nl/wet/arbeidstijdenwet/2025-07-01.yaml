  - number: 10:13
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is vastgesteld, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel1013
  - number: 10:14
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. voertuig: een motorrijtuig en een trekker;

      b. kenteken: het kenteken waaronder een voertuig in het buitenland is geregistreerd.

      2 Voor de toepassing van deze paragraaf wordt verstaan onder «motorrijtuig», «trekker» en «bestuurder»,
      hetgeen daaronder wordt verstaan in artikel 4, onderdeel b, onderscheidenlijk onderdeel c, van Verordening (EG)
      nr. 561/2006.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel1014
  - number: 10:15
    text: |-
      1 In afwijking van de [paragrafen 10.2 tot en met 10.4][ref1], met uitzondering van
      [artikel 10:7, eerste en zesde lid][ref2], kan deze paragraaf worden toegepast:

      a. indien de overtreding heeft plaatsgevonden met of door middel van een voertuig waarvan aannemelijk is dat de
      houder van het kenteken of de bestuurder geen bekende woon- of verblijfplaats in Nederland heeft, of

      b. in geval van een in Nederland vastgestelde overtreding, begaan door een bestuurder van een motorrijtuig die
      geen bekende woon- of verblijfplaats in Nederland heeft danwel in opdracht van een niet in Nederland gevestigde
      werkgever, voor zover het betreft vervoer waarop verordening (EG) nr. 561/2006 of het AETR-verdrag van toepassing
      is.

      2 In geval van vaststelling van een overtreding als bedoeld in het eerste lid, onderdeel b, wordt geen bestuurlijke
      boete opgelegd indien voor die overtreding reeds een sanctie is opgelegd dan wel een procedure tot het opleggen van
      een sanctie is gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel107
