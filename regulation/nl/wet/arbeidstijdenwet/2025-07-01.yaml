    text: |-
      De toezichthouders zijn, behoudens tegenover hen aan wier gezag zij uit hoofde van hun ambt zijn onderworpen,
      verplicht tot geheimhouding van de namen van de personen door wie een klacht is ingediend of aangifte is gedaan
      van een economische delict als bedoeld in [artikel 2, eerste lid, van de Wet op de economische delicten][ref1]
      voor zover betrekking hebbend op deze wet en de daarop berustende bepalingen, behoudens wanneer deze personen hen
      schriftelijk hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel2
