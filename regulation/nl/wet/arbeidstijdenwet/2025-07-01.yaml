  - number: 8:2
    text: |-
      1 Een toezichthouder kan bevelen, dat, indien [artikel 3:2, eerste lid][ref1], naar zijn oordeel in ernstige mate
      wordt overtreden of dreigt te worden overtreden, een kind de arbeid staakt of niet aanvangt.

      2 Een toezichthouder kan bevelen dat, indien arbeid wordt verricht of dreigt te worden verricht die
      naar zijn oordeel in ernstige mate in strijd is met de bij deze wet en de daarop berustende bepalingen
      gegeven regels inzake arbeids- en rusttijden of deugdelijke registratie, voor zover aangeduid als
      overtredingen in de zin van [artikel 10:1][ref2] of zijn aangemerkt als economische delicten als bedoeld in
      [artikel 2, eerste lid, van de Wet op de economisch delicten][ref3], een kind, de werknemer of een persoon
      als bedoeld in [artikel 2:7][ref4], die arbeid staakt of niet aanvangt tot op een nader te bepalen tijdstip.
      Het tijdstip wordt niet later gesteld dan dat, waarop hervatting van de arbeid wettelijk weer geoorloofd is
      onderscheidenlijk deugdelijk kan worden uitgevoerd.

      3 Voor zover het in het eerste en tweede lid bedoelde bevel op enigerlei andere wijze dan schriftelijk wordt
      gegeven, wordt zij binnen 7 dagen, nadat het bevel is gegeven, schriftelijk bevestigd.

      4 Degene, die een bevel als bedoeld in het eerste en tweede lid, heeft gegeven, is bevoegd met betrekking tot de
      uitvoering ervan de nodige maatregelen te treffen, met inbegrip van de oplegging van een last onder bestuursdwang,
      de nodige aanwijzingen te geven en de hulp van de sterke arm in te roepen.

      5 Degene die het bevel heeft gegeven, kan dit bevel te allen tijde intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel27
