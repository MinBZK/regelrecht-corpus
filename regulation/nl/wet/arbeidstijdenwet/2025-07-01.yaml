  - number: 11:1
    text: |-
      1 De Nederlandse strafwet is mede van toepassing op iedere bestuurder van een motorrijtuig ongeacht de woon- of
      verblijfplaats, alsmede iedere werkgever ongeacht de plaats van vestiging, die zich buiten Nederland schuldig
      maakt aan een overtreding van de regels, welke voortvloeien uit de op de [artikelen 2:7, eerste lid][ref1],
      [4:3, tweede tot en met vierde lid][ref2], en [5:12, tweede lid][ref3], berustende bepalingen, voor zover:

      a. deze regels betrekking hebben op arbeid verricht door personen, werkzaam in of op motorrijtuigen, en

      b. het een economisch delict betreft als bedoeld in de Wet op de economische delicten.

      2 De Nederlandse strafwet is mede van toepassing op de bestuurder van een motorrijtuig die geen bekende woon- of
      verblijfplaats in Nederland heeft alsmede op de niet in Nederland gevestigde werkgever, die zich schuldig maakt aan
      een overtreding buiten Nederland van de in het eerste lid bedoelde regels, indien:

      a. het vervoer betreft waarop verordening (EG) nr. 561/2006 dan wel het AETR-verdrag van toepassing is;

      b. de overtreding in Nederland wordt vastgesteld, en

      c. het een economisch delict betreft als bedoeld in de [Wet op de economische delicten][ref4].

      3 In geval van vaststelling van een overtreding als bedoeld in het tweede lid, onderdeel b, wordt geen vervolging
      ingesteld indien voor de overtreding reeds een sanctie is opgelegd dan wel een procedure tot het opleggen van een
      sanctie is gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
