      1 Een werkgever en een persoon als bedoeld in [artikel 2:7, eerste lid][ref1], voert een deugdelijke registratie
      terzake van de arbeids- en rusttijden welke het toezicht op de naleving van deze wet en de daarop berustende
      bepalingen mogelijk maakt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld welke aangeven op welke wijze
      aan de in het eerste lid neergelegde verplichting wordt voldaan. Deze regels kunnen voor verschillende sectoren
      verschillend worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het door de werknemer en de
      persoon, bedoeld in [artikel 2:7, eerste lid][ref2], houden van een middel terzake van een deugdelijke registratie,
      de wijze waarop een middel terzake van een deugdelijke registratie wordt gebruikt alsmede de aanvraag van dit
      middel.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het bewaren van de gegevens
      en bescheiden met betrekking tot de in dit artikel neergelegde registratieverplichting.

      5 Indien de algemene maatregel van bestuur, bedoeld in het tweede tot en met vierde lid, betrekking heeft op de
      in [artikel 5:12, tweede lid][ref3], onderscheiden categorieën van arbeid, wordt de voordracht van die algemene
      maatregel van bestuur Ons gedaan door Onze Minister van Infrastructuur en Waterstaat en Onze Minister tezamen.


