  - number: 10:5
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt de bestuurlijke boete op
      aan de natuurlijke of rechtspersoon op wie de verplichtingen rusten welke voortvloeien uit deze wet en de daarop
      berustende bepalingen, voor zover het niet naleven daarvan is aangeduid als overtreding.

      2 Voor zover het de in [artikel 5:12, tweede lid][ref1], onderscheiden categorieën van arbeid betreft legt
      een daartoe door Onze Minister van Infrastructuur en Waterstaat en Onze Minister tezamen aangewezen ambtenaar
      de bestuurlijke boete op aan de natuurlijke persoon of rechtspersoon op wie de verplichtingen rusten welke
      voortvloeien uit deze wet en de daarop berustende bepalingen, voor zover het niet naleven daarvan is aangeduid
      als overtreding.

      3 De ter zake van deze wet en de daarop berustende bepalingen gestelde overtredingen gelden ten opzichte van elke
      persoon, met of ten aanzien van wie de overtreding is begaan, en met betrekking tot elke dag in de loop waarvan
      deze overtreding is begaan.

      4 Indien een werknemer die in dienst is van een buiten Nederland gevestigde werkgever in diens opdracht arbeid
      verricht voor een in Nederland gevestigde werkgever, rusten de verplichtingen welke voortvloeien uit deze wet en
      de daarop berustende bepalingen, voor zover deze zijn aangeduid als overtredingen, mede op de hiervoor bedoelde in
      Nederland gevestigde werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel105
