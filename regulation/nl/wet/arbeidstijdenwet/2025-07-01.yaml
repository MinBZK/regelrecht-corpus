  - number: 5:10
    text: |-
      1 Deze paragraaf en de op [artikel 5:12, eerste lid][ref1], berustende bepalingen zijn niet van toepassing
      op een werknemer van 18 jaar en ouder die arbeid verricht in verband met een zich plotseling voordoende
      onvoorziene situatie waarbij personen ernstig letsel oplopen, dan wel daartoe de onmiddellijke dreiging bestaat,
      of buitengewoon ernstige schade aan goederen ontstaat, dan wel onmiddellijk dreigt te ontstaan, en die arbeid
      geen uitstel duldt en door andere maatregelen redelijkerwijs niet is te voorkomen. De [artikelen 5:6][ref2],
      [5:7, tweede lid, aanhef en onderdeel c][ref3], en[ 5:9][ref4] zijn in afwijking van de eerste zin van toepassing.

      2 De eerste zin van het eerste lid geldt slechts voor zover de toepassing van deze wet en de daarop berustende
      bepalingen een goede uitoefening van de in dat lid bedoelde arbeid belemmert.

      3 Bij toepassing van dit artikel organiseert de werkgever de arbeid zodanig, dat de door een werknemer niet genoten
      dagelijkse of wekelijkse onafgebroken rusttijd alsnog kan worden genoten.


