  - number: 1:7
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. defensiepersoneel:

      1°. de in werkelijke dienst zijnde militaire ambtenaren in de zin van
      [artikel 1, eerste lid, onderdelen a en b, van de Wet ambtenaren defensie][ref1];

      2°. de in werkelijke dienst zijnde dienstplichtigen in de zin van de [artikelen 18][ref2], [19][ref3] en
      [21 van de Kaderwet dienstplicht][ref4];

      3°. het burgerpersoneel, werkzaam bij het ministerie van Defensie;

      c. dienst: een aaneengesloten periode waarin arbeid wordt verricht en die gelegen is tussen twee opeenvolgende
      onafgebroken rusttijden van ten minste 8 uren;

      d. nachtdienst: een dienst waarin meer dan een uur arbeid wordt verricht tussen 00.00 uur en 06.00 uur;

      e. pauze: een periode van ten minste 15 achtereenvolgende minuten, waarmee de arbeid tijdens de dienst wordt
      onderbroken en de werknemer geen enkele verplichting heeft ten aanzien van de bedongen arbeid;

      f. Dienst Wegverkeer: de dienst, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref5];

      g. consignatie: een periode tussen twee opeenvolgende diensten of tijdens een pauze, waarin de werknemer
      uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op oproep zo spoedig
      mogelijk de bedongen arbeid te verrichten;

      h. toezichthouder: de toezichthouder, bedoeld in de [Algemene wet bestuursrecht][ref6], en als zodanig aangewezen
      op grond van [artikel 8:1, eerste of tweede lid][ref7];

      i. Verordening (EG) nr. 561/2006: Verordening (EG) nr. 561/2006 van het Europees Parlement en de Raad van de
      Europese Unie van 15 maart 2006 tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer,
      tot wijziging van Verordeningen (EEG) nr. 3821/85 en (EG) nr. 2135/98 van de Raad en tot intrekking van Verordening
      (EEG) nr. 3820/85 van de Raad (PbEU L 102);

      j. AETR-verdrag: de op 1 juli 1970 te Genève tot stand gekomen Europese Overeenkomst nopens de arbeidsvoorwaarden
      voor de bemanningen van motorrijtuigen in het Internationale vervoer over de weg (Trb. 1994, 123);

      k. arbeidstijd: de tijd dat de werknemer onder gezag van de werkgever arbeid verricht;

      l. rusttijd: de tijd die geen arbeidstijd is.

      2 Een wijziging van het AETR-verdrag gaat voor de toepassing van deze wet en de daarop berustende bepalingen gelden
      met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip is vastgesteld.


