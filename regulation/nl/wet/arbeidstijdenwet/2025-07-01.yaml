  - number: 2:8
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing:

      a. op arbeid verricht op of vanaf een mijnbouwinstallatie op het continentaal plat als bedoeld in de
      [Mijnbouwwet][ref1];

      b. op arbeid welke geheel of ten dele buiten Nederland wordt verricht door personen, werkzaam aan boord van
      zeeschepen die op grond van voor Nederland geldende rechtsregels gerechtigd zijn de vlag van het Koninkrijk te
      voeren;

      c. op duikwerkzaamheden ten behoeve van mijnbouwinstallaties op het continentaal plat, bedoeld in de
      [Mijnbouwwet][ref2], verricht op of vanaf een zeeschip;

      d. op arbeid, welke voor een in Nederland gevestigde werkgever, geheel of ten dele buiten Nederland wordt verricht
      door personen, werkzaam:

      1°. aan boord van luchtvaartuigen;

      2°. in of op motorrijtuigen;

      3°. in of op spoorvoertuigen;

      e. arbeid verricht binnen de exclusieve economische zone, met uitzondering van de arbeid, bedoeld onder a en c.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014168
      - id: ref2
        bwb_id: BWBR0014168
  - number: 2:9
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn niet van toepassing op arbeid verricht aan boord van een
      zeeschip, dat niet op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren en dat zich bevindt in de exclusieve economische zone, in de territoriale zee, op een van de in
      [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref1] bedoelde scheepvaartwegen, op de Westerschelde, haar
      mondingen of op het Kanaal van Gent naar Terneuzen, door personen die behoren tot de bemanning van dat zeeschip.

      2 In afwijking van het eerste lid is deze wet van toepassing op havensleepboten en op duikwerkzaamheden ten behoeve
      van mijnbouwinstallaties, verricht op of vanaf zeeschepen.

      3 Deze wet en de daarop berustende bepalingen zijn niet van toepassing op arbeid, welke voor een buiten Nederland
      gevestigde werkgever, wordt verricht door personen, werkzaam aan boord van een luchtvaartuig dat zich in het
      Nederlandse luchtruim of op het Nederlandse territoir bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel29
