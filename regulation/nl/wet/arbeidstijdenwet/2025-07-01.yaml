  - number: 8:1
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen onder hem ressorterende ambtenaren.

      2 Met betrekking tot door Onze Minister aangewezen categorieën van arbeid zijn met het toezicht op de naleving van
      het bepaalde bij of krachtens deze wet belast of mede belast de door hem aangewezen andere ambtenaren dan de in
      het eerste lid bedoelde. Indien ambtenaren worden aangewezen die ressorteren onder een andere minister, wordt het
      besluit tot aanwijzing van die ambtenaren genomen door Onze Minister en die andere minister gezamenlijk. Indien
      Onze Minister ambtenaren van provincies, gemeenten of waterschappen aanwijst, doet hij dit in overeenstemming met
      de desbetreffende besturen.

      3 In afwijking van het tweede lid wordt het aldaar bedoelde besluit, voor zover het de in
      [artikel 5:12, tweede lid][ref1], onderscheiden categorieën van arbeid betreft, genomen door Onze Minister van
      Infrastructuur en Waterstaat en Onze Minister tezamen.

      4 Van een aanwijzingsbesluit als bedoeld in de voorgaande leden wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.

      5 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in de bij of krachtens die maatregel te
      bepalen gevallen en wijze degene die arbeid verricht of doet verrichten in de territoriale zee of de exclusieve
      economische zone, verplicht is de ambtenaren, bedoeld in het eerste of tweede lid, bij de uitoefening van hun
      bevoegdheden te vervoeren naar door deze ambtenaren aan te duiden plaatsen waar deze arbeid wordt of zal worden
      verricht. [Artikel 4:3, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel43
