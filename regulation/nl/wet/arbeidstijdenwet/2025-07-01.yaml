        bwb_id: BWBR0007671
        artikel: 11:3
        hoofdstuk: '11'
  - number: 10:7
    text: |-
      1 De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].

      2 Onverminderd het eerste lid verhoogt de op grond van [artikel 10:5, eerste of tweede lid][ref2], aangewezen
      ambtenaar de op te leggen bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het
      zesde lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een
      eerdere overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet
      naleven van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden,
      is geconstateerd en de bestuurlijke boete wegens de eerdere overtreding onherroepelijk is geworden.

      3 De verhoging van de bestuurlijke boete, bedoeld in het tweede lid, bedraagt 200 procent indien zowel de
      overtreding als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn
      aangewezen als ernstige overtredingen.

      4 Onverminderd het eerste lid verhoogt de op grond van [artikel 10:5, eerste of tweede lid][ref3], aangewezen
      ambtenaar de op te leggen bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het
      zesde lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee
      maal een eerdere overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of
      het niet naleven van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en
      verboden, is geconstateerd en de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk zijn geworden.

      5 In afwijking van het tweede en vierde lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.

      6 Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      Voor overtredingen begaan door personen, bedoeld in [artikel 5:12, tweede lid][ref4], stellen Onze Minister
      van Infrastructuur en Waterstaat en Onze Minister tezamen beleidsregels vast waarin de boetebedragen voor die
      overtredingen worden vastgesteld. [Artikel 5:53 van de Algemene wet bestuursrecht][ref5] is van toepassing indien
      een artikel gesteld bij of krachtens de wet op grond waarvan een bestuurlijke boete kan worden opgelegd, niet is
      nageleefd.

      7 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref6] kan de rechter in beroep of hoger beroep
      de hoogte van de boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel105
