      _______________________ waarbij bepalingen van een collectieve arbeidsovereenkomst algemeen verbindend zijn
      verklaard;

      b. een regeling als bedoeld in de [artikelen 5][ref3] en [6 van de Wet op de loonvorming][ref4].


