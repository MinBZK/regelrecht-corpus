  - number: 10:10
    text: |-
      De persoon aan wie een bestuurlijke boete is opgelegd, verstrekt desgevraagd aan de daartoe op grond van
      [artikel 10:5, eerste of tweede lid][ref1], aangewezen ambtenaar de inlichtingen die redelijkerwijs voor de
      tenuitvoerlegging van de bestuurlijke boete nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel1010
