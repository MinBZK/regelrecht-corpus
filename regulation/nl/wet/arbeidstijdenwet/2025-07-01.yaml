  - number: 5:15
    text: |-
      1 Indien een werknemer tijdens een dienst arbeid verricht waarop meerdere regels van toepassing zijn die
      voortvloeien uit deze wet of de daarop berustende bepalingen, geldt tijdens die dienst elk van die regels op de
      onderscheiden categorieën van arbeid.

      2 Indien een werknemer tijdens een dienst arbeid verricht waarop meerdere regels van toepassing zijn en een van die
      regels van toepassing is op ten minste driekwart van de arbeidstijd, met een minimum van 1 uur, geldt in afwijking
      van het eerste lid, gedurende de gehele dienst uitsluitend die regel.

      3 Indien een werknemer tijdens een dienst, die ten minste 1 uur duurt, arbeid verricht waarop meerdere regels van
      toepassing zijn en het tweede lid niet van toepassing is, geldt, indien het een:

      a. jeugdige werknemer betreft, dat hij tijdens die dienst ten hoogste 9 uren arbeid verricht en hij na die dienst
      een onafgebroken rusttijd heeft van ten minste 12 uren;

      b. werknemer van 18 jaar of ouder betreft, dat hij tijdens die dienst ten hoogste 12 uren arbeid verricht en hij
      na die dienst een onafgebroken rusttijd heeft van ten minste 11 uren, welke rusttijd eenmaal in elke aaneengesloten
      periode van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren, indien de aard van de arbeid of de
      bedrijfsomstandigheden dit met zich brengen.

      4 Indien een werknemer arbeid verricht in een dienst waarop een regel als bedoeld in het eerste lid van toepassing
      is en deze dienst wordt gevolgd door een andere dienst waarop een andere regel als bedoeld in het eerste lid van
      toepassing is, geldt, indien het een:

      a. jeugdige werknemer betreft, dat hij tussen deze diensten een onafgebroken rusttijd heeft van ten minste 12 uren;

      b. werknemer van 18 jaar of ouder betreft, dat hij tussen deze diensten een onafgebroken rusttijd heeft van ten
      minste 11 uren, welke rusttijd eenmaal in elke aaneengesloten periode van 7 maal 24 uren mag worden ingekort tot
      ten minste 8 uren, indien de aard van de arbeid of de bedrijfsomstandigheden dit met zich brengen.

      5 Indien een werknemer tijdens een dienst arbeid verricht waarop meerdere regels van toepassing zijn die
      voortvloeien uit [artikel 5:12, tweede lid, onder a][ref1], voor zover het betreft motorrijtuigen, geldt dat hij:

      a. tijdens die dienst ten hoogste 12 uren arbeid verricht;

      b. binnen 24 uren na aanvang van deze dienst een onafgebroken rusttijd van ten minste 11 uren heeft; en

      c. in elke aaneengesloten periode van 7 maal 24 uren een onafgebroken rusttijd van ten minste 45 uren heeft,
      waarbij deze periode aanvangt op het eerste tijdstip van de dag waarop dit lid van toepassing is.

      6 De werknemer die bij meer dan één werkgever arbeid verricht, verstrekt aan ieder van die werkgevers uit eigen
      beweging tijdig de voor de naleving van deze wet en de daarop berustende bepalingen nodige inlichtingen betreffende
      zijn arbeid.

      7 Iedere werkgever organiseert de arbeid zodanig, dat de werknemer geen arbeid verricht in strijd met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
