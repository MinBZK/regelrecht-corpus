  - number: 3:1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder verantwoordelijke
      persoon:

      a. de werkgever;

      b. een ieder, die over een kind het ouderlijk gezag of de voogdij uitoefent of in wiens huishouding een kind is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel31
  - number: 3:2
    text: |-
      1 De verantwoordelijke persoon zorgt er voor, dat een kind geen arbeid verricht.

      2 Het eerste lid geldt niet ten aanzien van het verrichten van

      a. arbeid in het kader van een alternatieve sanctie door een kind van 12 jaar of ouder, voor zover deze arbeid niet
      wordt verricht gedurende de schooltijd;

      b. niet-industriële arbeid van lichte aard door een kind van 13 jaar of ouder:

      1°. voor zover deze arbeid niet wordt verricht gedurende de schooltijd, of

      2°. in het kader van een maatschappelijke stage als bedoeld in
      [artikel 2.32 van de Wet voortgezet onderwijs 2020][ref1];

      c. arbeid van lichte aard door een kind van 14 jaar of ouder voor zover deze arbeid verricht wordt naast en in
      samenhang met het onderwijs;

      d. arbeid bestaande uit het bezorgen van ochtendkranten door een kind van 15 jaar, voor zover deze arbeid niet
      wordt verricht gedurende de schooltijd.

      3 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het tweede lid.

      4 De verantwoordelijke persoon leeft de nadere regels, bedoeld in het derde lid na.


