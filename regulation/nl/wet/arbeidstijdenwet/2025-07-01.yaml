    text: |-
      Voor deze wet en de daarop berustende bepalingen treedt voor de toepassing van de [afdelingen 3.6][ref1]. en
      [4.1.2. van de Algemene wet bestuursrecht][ref2] een medezeggenschapsorgaan in de plaats van de belanghebbende
      werknemers, tenzij het een beschikking betreft die zich richt tot een nader aangeduide werknemer.


