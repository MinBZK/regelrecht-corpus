    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen, worden voor het bepalen van het aantal
      uren dat arbeid wordt verricht meegeteld de uren waarop de werknemer de bedongen arbeid zou hebben verricht,
      maar deze door de uitoefening van zijn taak in het kader van het medezeggenschapsorgaan, ziekte, vakantie,
