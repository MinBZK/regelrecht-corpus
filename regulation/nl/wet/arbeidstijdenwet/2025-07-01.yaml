  - number: 8:7
    text: |-
      1 Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan Onze Minister en de toezichthouder
      kosteloos alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering en het
      toezicht op de naleving van het bepaalde bij of krachtens deze wet en dit noodzakelijk is ten behoeve van een
      samenwerkingsverband tussen twee of meer van de voornoemde instanties.

      2 Onze Minister en de toezichthouder verstrekken andere bestuursorganen kosteloos alle gegevens en inlichtingen,
      die zijn verkregen door de uitvoering of het toezicht op de naleving van het bepaalde bij of krachtens deze wet,
      welke noodzakelijk zijn voor de uitvoering van hun wettelijke taak en dit noodzakelijk is ten behoeve van een
      samenwerkingsverband tussen twee of meer van de voornoemde instanties.

      3 Onze Minister, bestuursorganen en de toezichthouder kunnen bij het verwerken van persoonsgegevens gebruik maken
      van het burgerservicenummer.

      4 De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt niet plaats indien de persoonlijke
      levenssfeer van de betrokkene daardoor onevenredig wordt geschaad.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel87
  - number: 9:1
    text: |-
      1 De Dienst Wegverkeer is belast met het erkennen van natuurlijke of rechtspersonen die een apparaat ter controle
      van de naleving van de bij of krachtens de in de [artikelen 2:7][ref1] en [5:12, tweede lid][ref2], bedoelde
      algemene maatregel van bestuur gegeven voorschriften, voor zover het betreft arbeid verricht door personen,
      werkzaam in of op motorrijtuigen, installeren, onderzoeken of herstellen.

      2 De Dienst Wegverkeer is belast met het toezicht op het installeren, onderzoeken en herstellen van de in het
      eerste lid bedoelde apparaten door de in dat artikellid bedoelde erkende natuurlijke of rechtspersonen.

      3 De Dienst Wegverkeer is belast met het goedkeuren van registratiebladen en van de in het eerste lid bedoelde
      apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
