      1 Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval:

      a. de bij de overtreding betrokken persoon of personen;

      b. het officiële nummer waaronder het desbetreffende vervoermiddel is geregistreerd, voor zover in verband met de
      overtreding van belang.

      2 Het rapport wordt toegezonden aan de op grond van [artikel 10:5, eerste of tweede lid][ref2], aangewezen
      ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel548
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel105
