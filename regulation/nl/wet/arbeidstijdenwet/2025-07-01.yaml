  - number: 5:9
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat consignatie uitsluitend aan een werknemer van 18 jaar of ouder
      wordt opgelegd.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke aaneengesloten periode van 28 maal 24 uren
      ten minste:

      a. 14 maal een periode van 24 aaneengesloten uren geen consignatie wordt opgelegd, en

      b. 2 maal een aaneengesloten periode van 48 uren geen arbeid verricht noch consignatie wordt opgelegd.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer geen consignatie wordt opgelegd gedurende:

      a. 11 aaneengesloten uren voor elke nachtdienst, en

      b. 14 aaneengesloten uren na elke nachtdienst.

      4 In aanvulling op [artikel 5:7, tweede lid, onderdeel a][ref1], organiseert de werkgever de arbeid zodanig, dat
      de werknemer aan wie consignatie is opgelegd ten hoogste 13 uren in elke periode van 24 aaneengesloten uren arbeid
      verricht.

      5 In afwijking van [artikel 5:7, tweede lid, onderdeel c][ref2], organiseert de werkgever de arbeid zodanig, dat
      een werknemer aan wie in een periode van 16 aaneengesloten weken 16 of meer malen consignatie is opgelegd, welke
      consignatie telkens geheel of gedeeltelijk perioden tussen 00.00 uur en 06.00 uur omvat, in die periode van 16
      aaneengesloten weken ten hoogste gemiddeld 40 uren per week arbeid verricht.

      6 In plaats van het vijfde lid kan de werkgever de arbeid van een werknemer aan wie in een periode van 16
      aaneengesloten weken 16 of meer malen consignatie is opgelegd, die telkens geheel of gedeeltelijk perioden tussen
      00.00 uur en 06.00 uur omvat, ook zodanig organiseren dat de werknemer:

      a. na de laatste oproep die is aangevangen tussen 00.00 uur en 06.00 uur, een onafgebroken rusttijd heeft van ten
      minste 8 uren, dan wel, indien zijn dienst aanvangt direct aansluitend op een oproep die is aangevangen tussen
      00.00 uur en 06.00 uur, in de direct aaneengesloten periode van 18 uren welke periode begint om 06.00 uur, een
      onafgebroken rusttijd heeft van ten minste 8 uren, en

      b. in die periode van 16 aaneengesloten weken ten hoogste gemiddeld 45 uren arbeid per week verricht.

      7 Voor de toepassing van het tweede tot en met zesde lid vangt de arbeid tijdens consignatie aan op het moment
      van een oproep. Indien binnen een half uur na beëindiging van de arbeid die voortvloeit uit een oproep tijdens
      consignatie, opnieuw een dergelijke oproep wordt gedaan, is de tussenliggende tijd arbeid. Indien binnen een half
      uur een of meer malen arbeid voortvloeiend uit een oproep tijdens consignatie wordt verricht, wordt de arbeid
      geacht ten minste een half uur te bedragen.

      8 De arbeid die voortvloeit uit een oproep tijdens consignatie wordt voor de toepassing van de
      [artikelen 5:3, tweede lid][ref3], [5:4, tweede of derde lid][ref4], [5:5, tweede lid][ref5], en
      [5:8, vierde en vijfde lid][ref6], alsmede van de voorschriften bij of krachtens [artikel 5:12][ref7] ten aanzien
      van de rusttijd en de pauze, buiten beschouwing gelaten.

      9 Op de arbeid die voortvloeit uit een oproep tijdens consignatie is
      [artikel 5:8, zesde tot en met negende lid][ref8], en de bij of krachtens [artikel 5:12][ref9] gestelde regels ten
      aanzien van het aantal malen dat arbeid in nachtdienst wordt verricht, niet van toepassing.


