  - number: 12:1
    text: |-
      Waar in deze wet niet anders wordt bepaald, wordt de voordracht tot een algemene maatregel van bestuur Ons gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel121
  - number: 12:2
    text: |-
      1 Onze Minister stelt de vergoeding vast die verschuldigd is voor de kosten van de stukken, opgemaakt op grond van
      deze wet en de daarop berustende bepalingen alsmede de vergoeding, verschuldigd voor de kosten van de behandeling
      van een ontheffingsaanvraag, tenzij zulks betrekking heeft op de in [artikel 5:12, tweede lid][ref1], onderscheiden
      categorieën van arbeid.

      2 Onze Minister van Infrastructuur en Waterstaat stelt de vergoeding vast die verschuldigd is voor de kosten van
      de stukken, opgemaakt of middelen afgegeven, op grond van deze wet en de daarop berustende bepalingen voor de in
      [artikel 5:12, tweede lid][ref2], onderscheiden categorieën van arbeid, alsmede de vergoeding, verschuldigd voor de
      kosten van de behandeling van een ontheffingsaanvraag voor die onderscheiden categorieën van arbeid.

      3 Het aan het goedkeuren, aan het toezicht en aan de erkenning, bedoeld in [artikel 9:1][ref3], verbonden
      tarief alsmede de wijze van betaling daarvan worden vastgesteld door de Dienst Wegverkeer en kunnen voor
      verschillende vormen van toezicht en verschillende soorten van erkenningen verschillend worden gesteld.
      [Artikel 4q, eerste lid, van de Wegenverkeerswet 1994][ref4] is van overeenkomstige toepassing.


