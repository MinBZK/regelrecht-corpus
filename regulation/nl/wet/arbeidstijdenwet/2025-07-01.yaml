  - number: 10:6
    text: |-
      Geen bestuurlijke boete wordt opgelegd, indien een gedraging die in strijd is met deze wet of de daarop berustende
      bepalingen, tevens een strafbaar feit als bedoeld in [artikel 11:3][ref1] oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel113
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel106
