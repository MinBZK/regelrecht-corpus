  - number: 4:1a
    text: |-
      De werkgever houdt, voor zover dat redelijkerwijs van hem kan worden gevergd, bij de vaststelling van het
      arbeidstijdpatroon van de werknemer rekening met de persoonlijke omstandigheden van de werknemer buiten de arbeid,
      waaronder in elk geval begrepen de zorg(taken) voor kinderen, (afhankelijke) familieleden, verwanten en naasten
      alsmede maatschappelijke verantwoordelijkheden die door de werknemer worden gedragen.
    url: https://wetten.overheid.nl/BWBR0007671/2025-07-01#Artikel41a
  - number: 4:2
    text: |-
      1 De werkgever die een arbeids- en rusttijdenpatroon voor de bij hem werkzame werknemers vaststelt of opnieuw
      vaststelt, deelt dit zo tijdig mogelijk aan de werknemers mee. Met betrekking tot de tijdigheid geldt hetgeen
      daaromtrent bij collectieve regeling is bepaald of, indien geen collectieve regeling van toepassing is dan wel de
      collectieve regeling terzake geen bepaling bevat, telkens met instemming van de betrokken werknemer is bepaald.

      2 Indien een bepaling inzake de tijdigheid, bedoeld in de tweede zin van het eerste lid, ontbreekt, deelt de
      werkgever het arbeids- en rusttijdenpatroon ten minste 28 dagen van te voren aan de werknemer mee.

      3 Indien in verband met de aard van de arbeid toepassing van het tweede lid onmogelijk is, deelt de werkgever ten
      minste 28 dagen van te voren aan de werknemer mee op welke dag de rusttijd, bedoeld in de [artikelen 5:5][ref1]
      en [5:6][ref2], begint. Tevens maakt hij aan die werknemer ten minste 4 dagen van te voren de tijdstippen bekend
      waarop hij arbeid moet verrichten.


