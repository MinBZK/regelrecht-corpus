      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder medezeggenschapsorgaan:

      a. de ondernemingsraad, ingesteld overeenkomstig de [Wet op de ondernemingsraden][ref1];

      b. een personeelsvertegenwoordiging als bedoeld in de [Wet op de ondernemingsraden][ref2];

      c. een medezeggenschapscommissie ingesteld op grond van de krachtens de
      [artikelen 125, eerste lid, van de Ambtenarenwet][ref3] en [12 van de Wet ambtenaren defensie][ref4] gestelde
      regels;

      d. het uit en door het personeel gekozen deel van de medezeggenschapsraad, deelraad, dienstraad, universiteitsraad
      of faculteitsraad als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];

      e. het uit en door het personeel gekozen deel van de medezeggenschapsraad, bedoeld in de
      [Wet medezeggenschap op scholen][ref6];

      f. een medezeggenschapsregeling voor de in [artikel 53b van de Wet op de ondernemingsraden][ref7] bedoelde
      ambtenaren.


