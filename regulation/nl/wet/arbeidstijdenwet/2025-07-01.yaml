    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de erkenning van de natuurlijke of rechtspersonen, bedoeld in [artikel 9:1, eerste lid][ref1], de aanvraag
      van een erkenning, de voor een erkenning gestelde eisen, en de aan een erkenning te verbinden voorschriften en de
      intrekking of schorsing van een erkenning;

      b. de aanvraag en het gebruik van middelen ten behoeve van het installeren, onderzoeken of herstellen van een
      apparaat als bedoeld in [artikel 9:1, eerste lid][ref2], alsmede van het vastleggen en doorgeven van de daarin
      opgeslagen gegevens;

      c. de aanvraag van een goedkeuring als bedoeld in [artikel 9:1, derde lid][ref3].

      2 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel91
