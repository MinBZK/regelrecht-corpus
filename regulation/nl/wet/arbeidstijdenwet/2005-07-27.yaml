  - number: 10:2
    text: |-
      1 Beboetbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.

      2 Indien een beboetbaar feit wordt begaan door een rechtspersoon, kan de boete worden opgelegd aan:

      1°. de rechtspersoon, of

      2°. degene die opdracht heeft gegeven tot de gedraging waardoor de verplichtingen die voortvloeien uit deze wet of
      de daarop berustende bepalingen niet zijn nageleefd alsmede tegen hem die feitelijke leiding heeft gegeven aan die
      gedraging, of

      3°. de onder 1° en 2° genoemde tezamen.

      3 Voor de toepassing van het eerste en tweede lid wordt met een rechtspersoon gelijkgesteld:

      1°. de vennootschap zonder rechtspersoonlijkheid,

      2°. de maatschap,

      3°. de rederij en

      4°. het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel102
  - number: 10:3
    text: |-
      1 Indien een toezichthouder constateert, dat een beboetbaar feit is begaan, maakt hij daarvan zo spoedig mogelijk
      een rapport op.

      2 Het rapport is gedagtekend en vermeldt in ieder geval:

      a. de naam van degene die het beboetbare feit heeft gepleegd;

      b. de aard van het beboetbare feit onder vermelding van het wettelijke voorschrift dat niet is nageleefd;

      c. de aanduiding van de plaats waar en het tijdstip waarop het beboetbare feit is begaan;

      d. de bij het beboetbare feit betrokken persoon of personen;

      e. de natuurlijke of rechtspersoon op wie de verplichting rust tot naleving van het beboetbare wettelijke
      voorschrift;

      f. het officiële nummer waaronder het betreffende vervoermiddel is geregistreerd, voor zover in verband met het
      beboetbare feit van belang.

      3 Indien de toezichthouder, bedoeld in het eerste lid, jegens de in het tweede lid, onderdeel e, bedoelde persoon
      een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat jegens hem wegens het
      begaan van een beboetbaar feit een rapport als bedoeld in het eerste lid zal worden opgemaakt, is die persoon niet
      langer verplicht terzake enige verklaring af te leggen. De in de eerste volzin bedoelde persoon wordt hiervan in
      kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.

      4 Het rapport wordt toegezonden aan de op grond van [artikel 10:5, eerste en tweede lid][ref1], aangewezen
      ambtenaar.

      5 Gelijktijdig met de toezending, bedoeld in het vierde lid, wordt het rapport in afschrift toegezonden of
      uitgereikt aan de persoon, bedoeld in het tweede lid, onderdeel e.

      6 Indien de in het vijfde lid bedoelde persoon het rapport wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, zorgt de ambtenaar, bedoeld in het eerste lid, er zoveel mogelijk voor dat de in het rapport
      vermelde informatie aan hem wordt medegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel103
