  - number: 10:7
    text: |-
      1 De boete die ten hoogste voor een beboetbaar feit kan worden opgelegd, is, indien begaan door:

      a. een natuurlijke persoon, gelijk aan de geldsom van ten hoogste € 11 250,

      b. een rechtspersoon, gelijk aan de geldsom van ten hoogste € 45 000.

      2 Onverminderd het eerste lid verhoogt de op grond van [artikel 10:5][ref1] aangewezen ambtenaar de boete met 50%
      van de geldsom, indien terzake van het plegen van het beboetbare feit nog geen 24 maanden zijn verstreken nadat
      het feit is geconstateerd en het opleggen van een vroegere boete wegens het niet naleven van eenzelfde wettelijke
      verplichting onherroepelijk is geworden.

      3 Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de beboetbare feiten worden vastgesteld.
      Voor beboetbare feiten begaan door personen, bedoeld in [artikel 5:12, tweede lid][ref2], stellen Onze Minister van
      Verkeer en Waterstaat en Onze Minister tezamen beleidsregels vast waarin de boetebedragen voor die feiten worden
      vastgesteld.

      4 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref3] kan de rechter in beroep of hoger beroep
      de hoogte van de boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel512
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel869
