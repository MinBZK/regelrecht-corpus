  - number: 5:12
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot bepaalde
      arbeid of arbeid onder bepaalde omstandigheden die afwijken van of strekken tot aanvulling van het bij
      [paragraaf 5.2][ref1] bepaalde, ten aanzien van:

      a. de rusttijd;

      b. arbeid op zondag;

      c. de arbeidstijd;

      d. de referentieperiode, waarover de gemiddelde arbeidstijd wordt berekend;

      e. de pauze;

      f. arbeid in nachtdienst;

      g. de consignatie.

      2 Bij of krachtens algemene maatregel van bestuur kunnen, met uitzondering van arbeid verricht door
      defensiepersoneel, regels worden gesteld die afwijken van, in de plaats komen van of strekken tot aanvulling van
      het bij [paragraaf 5.2][ref2] bepaalde, ten aanzien van arbeid verricht door:

      a. personen, werkzaam in of op railvoertuigen of motorrijtuigen;

      b. personen, werkzaam aan boord van luchtvaartuigen, zee- of binnenschepen;

      c. loodsen.

      3 De voordracht van een algemene maatregel van bestuur als bedoeld in het tweede lid wordt Ons gedaan door Onze
      Minister van Verkeer en Waterstaat en Onze Minister tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
