  - number: 5:9
    text: |-
      1 Van de [artikelen 5:7][ref1] en [5:8][ref2] kan, uitsluitend ten aanzien van de arbeidstijd, worden
      afgeweken, indien zich een onvoorziene wijziging van omstandigheden, incidenteel en niet-periodiek, voordoet,
      of de aard van de arbeid, incidenteel en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt. In
      dat geval verricht de werknemer van 18 jaar of ouder ten hoogste 11 uren per dienst, 54 uren per week en
      in elke periode van 13 achtereenvolgende weken gemiddeld 45 uren per week arbeid. Indien die arbeid geheel
      of gedeeltelijk wordt verricht in nachtdienst, geldt, met inachtneming van hetgeen in de vorige volzin is
      bepaald, dat de werknemer van 18 jaar of ouder ten hoogste 9 uren per nachtdienst en in elke periode van 13
      achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht. Op de afwijking, bedoeld in de eerste volzin,
      is [artikel 5:10, derde lid, onderdelen ][ref3], niet van toepassing. Indien door toepassing van de eerste volzin
      arbeid wordt verricht in nachtdienst, welke arbeid eindigt voor of op 02.00 uur zijn de bij of krachtens deze wet
      gestelde regels ten aanzien van de arbeid in nachtdienst niet van toepassing.

      2 Van het eerste lid, tweede tot en met vierde volzin, kan, met inachtneming van het derde lid, slechts bij
      collectieve regeling worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt
      afgeweken van het eerste lid, tweede tot en met vierde volzin, is nietig.

      3 Met inachtneming van het eerste lid, eerste volzin, organiseert de werkgever de arbeid zodanig, dat de
      werknemer van 18 jaar of ouder ten hoogste 12 uren per dienst, 60 uren per week en in elke periode van 13
      achtereenvolgende weken gemiddeld 48 uren per week arbeid verricht. Indien die arbeid geheel of gedeeltelijk
      wordt verricht in nachtdienst, geldt, met inachtneming van hetgeen in de vorige volzin is bepaald, dat de
      werknemer van 18 jaar of ouder ten hoogste 10 uren per nachtdienst en in elke periode van 13 achtereenvolgende
      weken gemiddeld 40 uren per week arbeid verricht. Op de afwijking, bedoeld in het eerste lid, eerste volzin, is
      [artikel 5:8, derde lid, onderdeel ][ref4], niet van toepassing. Indien door toepassing van het eerste lid, eerste
      volzin, arbeid wordt verricht in nachtdienst, welke arbeid eindigt voor of op 02.00 uur zijn de bij of krachtens
      deze wet gestelde regels ten aanzien van de arbeid in nachtdienst niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
