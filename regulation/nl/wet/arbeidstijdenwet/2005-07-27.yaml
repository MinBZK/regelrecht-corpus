        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: 5:12
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 11:2
    text: |-
      1 Indien een werknemer die in dienst is van een buiten Nederland gevestigde werkgever in diens opdracht arbeid
      verricht voor een in Nederland gevestigde werkgever, rusten de verplichtingen welke voortvloeien uit deze wet en de
      daarop berustende bepalingen, voor zover deze zijn aangeduid als strafbare feiten, mede op de hiervoor bedoelde in
      Nederland gevestigde werkgever.

      2 Indien een werknemer een tot hem in de op grond van [artikel 5:12, tweede lid][ref1], vastgestelde algemene
      maatregel van bestuur gerichte bepaling niet naleeft, kan in die maatregel worden bepaald, dat de werkgever wordt
      aangemerkt als degene die die bepaling niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:12
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 11:3
    text: |-
      1 Het niet naleven van een bepaling, genoemd in [artikel 10:1][ref1] wordt aangemerkt als een strafbaar feit,
      indien tweemaal binnen een daaraan voorafgaande periode van 48 maanden, met respectievelijke tussenliggende
      perioden van ten hoogste 24 maanden, voor een zelfde feit, een bestuurlijke boete is opgelegd die onherroepelijk is
      geworden, behoudens in bij algemene maatregel van bestuur te bepalen gevallen.

      2 Het niet naleven van [artikel 3:2, eerste en vierde lid][ref2], en [3:3, derde en vierde lid][ref3], wordt
      aangemerkt als een strafbaar feit indien een kind bij het verrichten van arbeid een ongeval overkomt dat ernstig
      lichamelijk of geestelijk letsel of de dood ten gevolge heeft of indien redelijkerwijs te verwachten is dat de
      hiervoor genoemde gevolgen aan het verrichten van arbeid zijn verbonden.

      3 Bij arbeid verricht door de in [artikel 5:12, tweede lid][ref4], bedoelde personen wordt het
      niet naleven van de [artikelen 5:3, eerste en tweede lid][ref5], [5:4, derde en vierde lid][ref6],
      [5:5][ref7], [5:6][ref8], [5:7, derde lid][ref9], [5:8, derde lid][ref10], [5:9, derde lid][ref11],
      [5:10, eerste, tweede en zevende lid][ref12], [5:11, tweede tot en met vijfde lid][ref13],
      [5:13, tweede lid][ref14], [5:14, derde lid][ref15], [5:15, zesde lid][ref16], [5:16, eerste lid][ref17], voorzover
      het niet naleven van dit artikellid een beboetbaar feit oplevert alsmede – voor zover aangeduid als beboetbare
      feiten – de voorschriften krachtens de [artikelen 2:7, eerste lid][ref18], en [5:12, tweede lid][ref19], aangemerkt
      als strafbaar feit, als daardoor de verkeersveiligheid ernstig in gevaar is gebracht of redelijkerwijs kan worden
      aangenomen dat de verkeersveiligheid ernstig in gevaar is gebracht.

      4 Een strafbaar feit als bedoeld in dit artikel is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel101
