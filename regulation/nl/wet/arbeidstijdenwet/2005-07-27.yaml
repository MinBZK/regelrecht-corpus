    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat deze wet en de daarop berustende bepalingen geheel
      of gedeeltelijk niet van toepassing zijn op bij die maatregel omschreven arbeid of arbeid onder daarbij omschreven
      omstandigheden.

      2 Het geheel of gedeeltelijk niet van toepassing zijn van deze wet en de daarop berustende bepalingen, bepaald bij
      de in het eerste lid bedoelde maatregel kan afhankelijk worden gesteld van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel21
  - number: 2:2
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn niet van toepassing op arbeid verricht in verband met:

      a. een ramp of een zwaar ongeval als bedoeld in [artikel 1, onderdeel ][ref1];

      b. een voorval als bedoeld in [artikel 1, onderdeel f, van de Rijkswet Onderzoeksraad voor veiligheid][ref2];

      c. een ramp of ongeval als bedoeld in [artikel 1, vierde lid, van de Marine-scheepsongevallenwet][ref3];

      d. een ongeval als bedoeld in [artikel 1, eerste lid, onderdeel ][ref4];

      e. aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden, bedoeld in de onderdelen a tot en met
      d.

      2 Het eerste lid geldt slechts voor zover de toepassing van deze wet en de daarop berustende bepalingen een goede
      uitoefening van de in dat lid bedoelde arbeid belemmert.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017613#Artikel1
