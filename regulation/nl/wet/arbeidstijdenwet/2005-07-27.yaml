  - number: 5:16
    text: |-
      1 Indien een werknemer naast het verrichten van arbeid in Nederland tevens buiten Nederland arbeid verricht, zorgt
      de in Nederland gevestigde werkgever ervoor, dat die werknemer geen arbeid verricht in strijd met deze wet en de
      daarop berustende bepalingen.

      2 De werknemer, bedoeld in het eerste lid, verstrekt aan de in Nederland gevestigde werkgever uit eigen beweging
      tijdig de voor de naleving van deze wet en de daarop berustende bepalingen nodige inlichtingen betreffende zijn
      arbeid.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel516
  - number: 6:1
    text: |-
      De werkgever die een arbeidstijdpatroon vaststelt, wijzigt of intrekt, bespreekt dit bij het ontbreken van een
      medezeggenschapsorgaan vooraf met de belanghebbende werknemers.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel61
  - number: 6:2
    text: |-
      1 De werkgever brengt binnen 7 dagen de inhoud van een verzoek om ontheffing of van een op andere wijze dan
      schriftelijk gegeven bevel tot het staken van de arbeid alsmede van een beschikking bij gedagtekend schrijven
      ter kennis van het medezeggenschapsorgaan of, bij het ontbreken daarvan, van de belanghebbende werknemers en van
      werknemers, andere personen en diensten als bedoeld in [artikel 14 van de Arbeidsomstandighedenwet 1998][ref1].

      2 De in het eerste lid bedoelde termijn van 7 dagen vangt aan op de dag volgend op die waarop het verzoek om
      ontheffing is ingediend of het op een andere wijze dan schriftelijk gegeven bevel tot het staken van de arbeid is
      gegeven of de beschikking aan de werkgever bekend is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 6:3
    text: |-
      De werkgever stelt de leden van een medezeggenschapsorgaan in verband met hun taak inzake arbeids- en rusttijden in
      de gelegenheid:

      a. om de toezichthouders tijdens hun bezoek te vergezellen, behoudens voor zover deze laatstbedoelden te kennen
      geven, dat daartegen vanwege een goede uitoefening van hun taak bedenkingen bestaan, alsmede

      b. om zich buiten tegenwoordigheid van anderen met deze toezichthouders te onderhouden.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel63
  - number: 7:1
    text: |-
      Voor deze wet en de daarop berustende bepalingen treden voor de toepassing van de [afdelingen 3.6][ref1]. en
      [4.1.2. van de Algemene wet bestuursrecht][ref2] een medezeggenschapsorgaan in de plaats van de belanghebbende
      werknemers, tenzij het een beschikking betreft die zich richt tot een nader aangeduide werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel71
