  - number: 10:13
    text: |-
      Indien een boete ten onrechte is opgelegd, wordt de betaalde geldsom, vermeerderd met de wettelijke rente, binnen 6
      weken nadat is vastgesteld dat de boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1013
  - number: 10:14
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. [Verordening (EEG) nr. 3820/85](31985R3820): [Verordening (EEG) nr. 3820/85](31985R3820) van de Raad van de
      Europese gemeenschappen van 20 december 1985 tot harmonisatie van bepaalde voorschriften van sociale aard voor het
      wegvervoer (PbEG L 370);

      b. voertuig: een motorrijtuig en een trekker;

      c. kenteken: het kenteken waaronder een voertuig in het buitenland is geregistreerd.

      2 Voor de toepassing van deze paragraaf wordt verstaan onder «bestuurder», «motorrijtuig» en «trekker» hetgeen
      daaronder wordt verstaan in artikel 1, onderdeel 3, onderscheidenlijk artikel 1, onderdeel 2, aanhef en onderdelen
      a en b, van [Verordening (EEG) nr. 3820/85](31985R3820) (PbEG L 370).
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1014
  - number: 10:15
    text: |-
      In afwijking van de [paragrafen 10.2 tot en met 10.4][ref1], met uitzondering van de
      [artikelen 10:7 eerste en derde lid][ref2], en [10:9][ref3], kan deze paragraaf worden toegepast indien het
      beboetbare feit heeft plaatsgevonden met of door middel van een voertuig waarvan aannemelijk is dat de houder
      van het kenteken geen bekende woon- of verblijfplaats in Nederland heeft of dat de bestuurder van een voertuig in
      Nederland geen bekende woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel109
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1015
