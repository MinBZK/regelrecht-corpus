  - number: 11:4
    text: |-
      De terzake van deze wet in de [Wet op de economische delicten][ref1] strafbaar gestelde feiten, gelden ten opzichte
      van elk persoon, met of ten aanzien van wie de overtreding van deze wet en de daarop berustende bepalingen is
      gepleegd, en met betrekking tot elke dag in de loop waarvan deze overtreding is gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: 11:5
    text: |-
      De uitreiking van gerechtelijke mededelingen in zaken betreffende overtredingen, welke voortvloeien uit een
      op de [artikelen 4:3, tweede tot en met vierde lid][ref1], en [5:12, tweede lid][ref2], berustende bepaling,
      met betrekking tot personen, werkzaam in of op een motorrijtuig, begaan door een niet in Nederland gevestigde
      werkgever, kan eveneens geschieden aan de bestuurder van dat motorrijtuig die zich bereid verklaart om de
      mededeling onverwijld aan degene voor wie zij is bestemd te doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel115
