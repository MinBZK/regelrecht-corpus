  - number: 7:7
    text: |-
      1 Onze Minister van Verkeer en Waterstaat houdt een registratie bij van de in [artikel 7:6, eerste lid][ref1],
      bedoelde middelen en daarbij behorende gegevens van betrokkenen.

      2 De in het eerste lid bedoelde gegevens kunnen worden verwerkt in het belang van een goede uitvoering en
      handhaving van de bij of krachtens deze wet gestelde voorschriften met betrekking tot een rechtmatig bezit en
      gebruik van de in [artikel 7:6, eerste lid][ref2], bedoelde middelen.

      3 Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen regels worden gesteld over de verstrekking van de
      in het eerste lid bedoelde gegevens aan belanghebbenden voor zover zulks in het belang is van een goede uitvoering
      en handhaving van de bij of krachtens deze wet gestelde voorschriften met betrekking tot een rechtmatig bezit
      en gebruik van de in [artikel 7:6, eerste lid][ref3], bedoelde middelen en over de wijze van verwerken van deze
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel76
