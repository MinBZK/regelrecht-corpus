  - number: 7:2
    text: |-
      1 Tegen een beschikking op grond van deze wet van een ambtenaar als bedoeld in [artikel 8:1, tweede lid][ref1], kan
      administratief beroep worden ingesteld bij Onze Minister, met uitzondering van beschikkingen die betrekking hebben
      op:

      a. arbeid verricht door personen als bedoeld in [artikel 5:12, tweede lid][ref2], alsmede

      b. arbeid in bedrijven of inrichtingen die rechtstreeks betrekking heeft op arbeid verricht in of op motorrijtuigen
      als bedoeld in [artikel 5:12, tweede lid, onderdeel a][ref3].

      2 Een beschikking op grond van deze wet van een ambtenaar als bedoeld in de [artikelen 8:1, eerste lid][ref4], en
      [10:5, eerste lid][ref5], wordt genomen namens Onze Minister.


