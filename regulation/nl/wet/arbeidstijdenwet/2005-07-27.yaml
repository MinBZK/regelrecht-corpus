  - number: 4:5
    text: |-
      1 De arbeid van een zwangere werknemer wordt zodanig ingericht, dat rekening wordt gehouden met haar specifieke
      omstandigheden. De werkgever voldoet, met inachtneming van het tweede tot en met vijfde lid, aan de voor hem
      uit de eerste volzin voortvloeiende verplichting binnen een redelijke termijn nadat een verzoek daartoe door de
      zwangere werknemer is gedaan. Bij dit verzoek wordt desgevraagd een schriftelijke verklaring overgelegd van een
      geneeskundige of een verloskundige waaruit blijkt, dat de betrokken werknemer zwanger is.

      2 De zwangere werknemer heeft het recht de arbeid af te wisselen met één of meer pauzes buiten die bedoeld
      in [artikel 5:10][ref1] of de bij of krachtens [artikel 5:12][ref2] voorgeschreven pauzes. Deze extra pauze
      onderscheidenlijk pauzes bedragen tezamen ten hoogste één achtste deel van de voor haar geldende arbeidstijd per
      dienst. De in de vorige volzin bedoelde pauzes gelden voor de toepassing van deze wet en de daarop berustende
      bepalingen als arbeidstijd.

      3 De zwangere werknemer heeft het recht arbeid te verrichten in een bestendig en regelmatig arbeids- en
      rusttijdenpatroon.

      4 De zwangere werknemer kan niet verplicht worden arbeid te verrichten anders dan op grond van de
      [artikelen 5:6][ref3] en [5:7][ref4] of de bij of krachtens [artikel 5:12][ref5] in afwijking of ter aanvulling
      hiervan gestelde regels ten aanzien van de arbeidstijd is toegestaan.

      5 De zwangere werknemer kan niet verplicht worden arbeid te verrichten in nachtdienst, tenzij de werkgever
      aannemelijk maakt dat dit redelijkerwijs niet van hem kan worden gevergd.

      6 De werkgever stelt de zwangere werknemer in de gelegenheid de noodzakelijke zwangerschapsonderzoeken te
      ondergaan. Zij behoudt haar aanspraak op het naar tijdruimte vastgesteld loon, indien zij door het bedoelde
      zwangerschapsonderzoek verhinderd is geweest haar arbeid te verrichten.

      7 Elk beding waarbij ten nadele van de zwangere werknemer wordt afgeweken van het eerste tot en met zesde lid,
      is nietig.


