      De werkgever zorgt ervoor dat een ieder, die over een kind het ouderlijk gezag of de voogdij uitoefent of in wiens
      huishouding een kind is opgenomen, doeltreffend wordt ingelicht over de aard van de arbeid en de daaraan verbonden
      mogelijke gevaren en over de maatregelen die er op gericht zijn deze gevaren te voorkomen of te beperken.
