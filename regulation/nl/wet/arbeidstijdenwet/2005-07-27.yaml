  - number: 10:5
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar legt de boete op aan de natuurlijke
      of rechtspersoon op wie de verplichtingen rusten welke voortvloeien uit deze wet en de daarop berustende
      bepalingen, voor zover het niet naleven daarvan is aangeduid als beboetbaar feit.

      2 Voor zover het de in [artikel 5:12, tweede lid][ref1], onderscheiden categorieën van arbeid betreft legt een
      daartoe door Onze Minister van Verkeer en Waterstaat en Onze Minister tezamen aangewezen ambtenaar de boete op
      aan de natuurlijke persoon of rechtspersoon op wie de verplichtingen rusten welke voortvloeien uit deze wet en de
      daarop berustende bepalingen, voor zover het niet naleven daarvan is aangeduid als beboetbaar feit.

      3 De terzake van deze wet en de daarop berustende bepalingen gestelde beboetbare feiten, gelden ten opzichte van
      elk persoon, met of ten aanzien van wie het beboetbare feit is begaan, en met betrekking tot elke dag in de loop
      waarvan dit beboetbare feit is begaan.

      4 Indien een werknemer die in dienst is van een buiten Nederland gevestigde werkgever in diens opdracht arbeid
      verricht voor een in Nederland gevestigde werkgever, rusten de verplichtingen welke voortvloeien uit deze wet en de
      daarop berustende bepalingen, voor zover deze zijn aangeduid als beboetbare feiten, mede op de hiervoor bedoelde in
      Nederland gevestigde werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel105
