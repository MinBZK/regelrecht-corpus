  - number: 2:8
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing:

      a. op arbeid verricht op of vanaf een mijnbouwinstallatie op het continentaal plat als bedoeld in de
      [Mijnbouwwet][ref1];

      b. op arbeid welke geheel of ten dele buiten Nederland wordt verricht door personen, werkzaam aan boord van
      zeeschepen die op grond van Nederlandse rechtsregels gerechtigd zijn de Nederlandse vlag te voeren;

      c. op duikwerkzaamheden ten behoeve van mijnbouwinstallaties op het continentaal plat, bedoeld in de
      [Mijnbouwwet][ref2], verricht op of vanaf een zeeschip;

      d. op arbeid, welke voor een in Nederland gevestigde werkgever, geheel of ten dele buiten Nederland wordt verricht
      door personen, werkzaam:

      1°. aan boord van luchtvaartuigen;

      2°. in of op motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014168
      - id: ref2
        bwb_id: BWBR0014168
  - number: 2:9
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn niet van toepassing op arbeid verricht
      aan boord van een zeeschip, dat niet op grond van Nederlandse rechtsregels gerechtigd is de
      Nederlandse vlag te voeren en dat zich bevindt in de territoriale zee, op een van de andere in
      [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref1] bedoelde scheepvaartwegen, of in de haven van
      Scheveningen, door personen die behoren tot de bemanning van dat zeeschip.

      2 In afwijking van het eerste lid is deze wet van toepassing op havensleepboten en op duikwerkzaamheden ten behoeve
      van mijnbouwinstallaties, verricht op of vanaf zeeschepen.

      3 Deze wet en de daarop berustende bepalingen zijn niet van toepassing op arbeid, welke voor een buiten Nederland
      gevestigde werkgever, wordt verricht door personen, werkzaam aan boord van een luchtvaartuig dat zich in het
      Nederlandse luchtruim of op het Nederlandse territoir bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
  - number: 3:1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder verantwoordelijke
      persoon:

      a. de werkgever;

      b. een ieder, die over een kind het ouderlijk gezag of de voogdij uitoefent of in wiens huishouding een kind is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel31
  - number: 3:2
    text: |-
      1 De verantwoordelijke persoon zorgt er voor, dat een kind geen arbeid verricht.

      2 Het eerste lid geldt niet ten aanzien van het verrichten van

      a. arbeid in het kader van een alternatieve sanctie door een kind van 12 jaar of ouder, voor zover deze arbeid niet
      wordt verricht gedurende de schooltijd;

      b. niet-industriële arbeid van lichte aard door een kind van 13 jaar of ouder, voor zover deze arbeid niet wordt
      verricht gedurende de schooltijd;

      c. arbeid van lichte aard door een kind van 14 jaar of ouder voor zover deze arbeid verricht wordt naast en in
      samenhang met het onderwijs;

      d. arbeid bestaande uit het bezorgen van ochtendkranten door een kind van 15 jaar, voor zover deze arbeid niet
      wordt verricht gedurende de schooltijd.

      3 Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot het tweede lid.

      4 De verantwoordelijke persoon leeft de nadere regels, bedoeld in het derde lid na.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel32
  - number: 3:3
    text: |-
      1 Onze Minister kan vrijstelling verlenen van [artikel 3:2, eerste lid][ref1], voor door hem aangewezen soorten van
      industriële arbeid van lichte aard, te verrichten door kinderen van 13 jaar of ouder, voor zover deze arbeid niet
      wordt verricht gedurende de schooltijd.

      2 Een daartoe aangewezen ambtenaar als bedoeld in [artikel 8:1, eerste lid][ref2], kan ontheffing verlenen van
      [artikel 3:2, eerste lid][ref3], ten aanzien van het door een kind verrichten van arbeid, bestaande uit het
      verlenen van medewerking aan uitvoeringen van culturele, wetenschappelijke, opvoedkundige of artistieke aard, aan
      modeshows, aan audio-, visuele of audio-visuele opnamen en daarmee vergelijkbare niet-industriële arbeid van lichte
      aard. Een verzoek om ontheffing wordt gedaan door de werkgever.

      3 De verantwoordelijke persoon leeft de voorschriften verbonden aan de vrijstelling na.

      4 De werkgever leeft de voorschriften verbonden aan de ontheffing na.


