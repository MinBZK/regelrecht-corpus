  - number: 10:16
    text: |-
      1 Een boete wordt opgelegd bij beschikking van de in [artikel 8:1, eerste lid][ref1], en in
      [artikel 8:1, tweede lid][ref2], ten aanzien van de in [artikel 5:12, tweede lid, onderdeel a][ref3], ten aanzien
      van arbeid verricht in of op motorrijtuigen, bedoelde toezichthouder.

      2 In de beschikking wordt in ieder geval vermeld:

      a. de naam van degene die het beboetbare feit heeft gepleegd;

      b. de aanduiding van de plaats waar en het tijdstip waarop het beboetbare feit is begaan;

      c. het beboetbare feit ter zake waarvan de boete opgelegd wordt;

      d. de hoogte van de boete;

      e. het officiële nummer waaronder het betreffende voertuig is geregistreerd;

      f. de houder van het kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1016
