  - number: 12:39
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen,
      onderdelen of subonderdelen verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1239
