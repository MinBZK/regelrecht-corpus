  - number: 5:15
    text: |-
      1 Indien een werknemer tijdens een dienst arbeid verricht waarop meerdere regels, welke voortvloeien uit de
      op [artikel 5:12, tweede lid][ref1], of [artikel 5:12, eerste lid][ref2], en [paragraaf 5.4][ref3] berustende
      bepalingen of [paragraaf 5.2][ref4] van toepassing zijn, geldt elk van die regels op de onderscheiden categorieën
      van arbeid.

      2 Indien een werknemer tijdens een dienst arbeid verricht waarop meerdere regels, welke hetzij voortvloeien uit de
      op [artikel 5:12, tweede lid][ref5], berustende bepalingen, hetzij voortvloeien uit [paragraaf 5.2][ref6] en de op
      [artikel 5:12, eerste lid][ref7], en [paragraaf 5.4][ref8] berustende bepalingen, ten aanzien van dezelfde arbeid
      van toepassing zijn, en waarbij één van die regels op ten minste driekwart van de arbeid tijdens die dienst van
      toepassing is met een minimum van ten minste 1 uur, geldt uitsluitend die regel gedurende die gehele dienst.

      3 Indien het tweede lid niet van toepassing is en een werknemer tijdens een dienst arbeid verricht waarop meerdere
      regels, welke hetzij voortvloeien uit de op [artikel 5:12, tweede lid][ref9], berustende bepalingen, hetzij
      voortvloeien uit [paragraaf 5.2][ref10] en de op [artikel 5:12, eerste lid][ref11], en [paragraaf 5.4][ref12]
      berustende bepalingen, ten aanzien van dezelfde arbeid van toepassing zijn, en waarbij twee of meer van die regels
      elk ten minste 1 uur tijdens het verrichten van die arbeid van toepassing zijn, geldt:

      a. indien het een jeugdige werknemer betreft, dat hij tijdens die dienst ten hoogste 9 uren arbeid verricht en hij
      na die dienst een onafgebroken rusttijd heeft van ten minste 12 uren,

      b. indien het een werknemer van 18 jaar of ouder betreft, dat hij tijdens die dienst ten hoogste 10 uren arbeid
      verricht en hij na die dienst een onafgebroken rusttijd heeft van ten minste 11 uren.

      4 Indien een werknemer arbeid verricht in een dienst waarop een regel, welke voortvloeit uit een op
      [artikel 5:12, tweede lid][ref13], of [artikel 5:12, eerste lid][ref14], en [paragraaf 5.4][ref15] berustende
      bepaling, of [paragraaf 5.2][ref16], ten aanzien van dezelfde arbeid van toepassing is en deze dienst wordt
      gevolgd door een dienst waarop een andere regel, welke voortvloeit uit een op [artikel 5:12, tweede lid][ref17],
      of [artikel 5:12, eerste lid][ref18], en [paragraaf 5.4][ref19] berustende bepaling, of [paragraaf 5.2][ref20], ten
      aanzien van dezelfde arbeid van toepassing is, geldt:

      a. indien het een jeugdige werknemer betreft, dat hij tussen deze 2 diensten een onafgebroken rusttijd heeft van
      ten minste 12 uren,

      b. indien het een werknemer van 18 jaar of ouder betreft, dat hij tussen deze 2 diensten een onafgebroken rusttijd
      heeft van ten minste 11 uren.

      5 De werknemer die bij meer dan één werkgever arbeid verricht, verstrekt aan ieder van die werkgevers uit eigen
      beweging tijdig de voor de naleving van deze wet en de daarop berustende bepalingen nodige inlichtingen betreffende
      zijn arbeid.

      6 De werkgever organiseert de arbeid zodanig, dat de werknemer geen arbeid verricht in strijd met dit artikel.


