  - number: 10:17
    text: |-
      De in [artikel 10:16][ref1] bedoelde toezichthouders kunnen vorderen dat de boete terstond wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1016
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1017
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 10:16
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 10:18
    text: |-
      De in [artikel 10:16][ref1] bedoelde toezichthouders zijn bevoegd bij wijze van voorlopige maatregel het voertuig
      naar een door hen aangewezen plaats te doen overbrengen en in bewaring te stellen, dan wel aan het voertuig een
      mechanisch hulpmiddel te doen aanbrengen, waardoor verhinderd wordt dat het voertuig wordt weggereden. Zij kunnen
      vorderen dat, alvorens het voertuig aan de bestuurder wordt teruggegeven, naast de kosten van overbrenging en
      bewaring eveneens de boete zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel1016
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1018
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 10:16
        hoofdstuk: '10'
        paragraaf: '10.6'
  - number: 11:1
    text: |-
      De Nederlandse strafwet is mede van toepassing op de Nederlander en de in Nederland gevestigde werkgever
      die zich buiten Nederland schuldig maakt aan een overtreding van de regels, welke voortvloeien uit de op de
      [artikelen 2:7, eerste lid][ref1], [4:3, tweede tot en met vierde lid][ref2], en [5:12, tweede lid][ref3],
      berustende bepalingen, voor zover deze regels betrekking hebben op arbeid verricht door personen, werkzaam in of
      op motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel111
    references:
