  - number: 10:9
    text: |-
      1 De bevoegdheid om een boete op te leggen vervalt na verloop van 2 jaren na de dag waarop het beboetbare feit
      is geconstateerd.

      2 De beslissing om een boete op te leggen stuit de in het eerste lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel109
  - number: 10:10
    text: |-
      1 De boete wordt betaald binnen 6 weken nadat de beschikking, bedoeld in [artikel 10:8][ref1], is bekendgemaakt.

      2 Degene aan wie een boete is opgelegd, verstrekt desgevraagd aan de daartoe op grond van
      [artikel 10:5, eerste en tweede lid][ref2], aangewezen ambtenaar de inlichtingen die redelijkerwijs voor de
      tenuitvoerlegging van de boete nodig zijn.

      3 Bij overlijden van de natuurlijke persoon aan wie een boete is opgelegd, vervalt de opgelegde boete voor zover
      deze nog niet is geïnd.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel105
