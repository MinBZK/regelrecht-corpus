      1 Voor de toepassing van deze wet en de daarop berustende bepalingen geldt een collectieve regeling als bedoeld in
      de [artikelen 1:3, eerste lid][ref1], en [1:4, eerste lid][ref2], gedurende 5 jaren, te rekenen van het tijdstip
      waarop die regeling ingaat. Bij wijziging van de in de eerste volzin bedoelde collectieve regeling binnen 5 jaren
      na inwerkingtreding, wordt het in de eerste volzin bedoelde tijdvak beëindigd op het tijdstip van inwerkingtreding
      van de gewijzigde collectieve regeling.

      2 Het eerste lid, eerste volzin, is van overeenkomstige toepassing op de collectieve regeling als bedoeld in
      [artikel 1:3, tweede lid][ref3], met dien verstande dat:

      a. bij de inwerkingtreding van een overeenkomstige nieuwe collectieve regeling binnen 5 jaren na inwerkingtreding
      van de in de aanhef bedoelde collectieve regeling, het in de eerste volzin van het eerste lid bedoelde tijdvak
      wordt beëindigd;

      b. deze regeling te allen tijde eindigt op het tijdstip, dat er geen overeenkomstige collectieve regeling als
      bedoeld in [artikel 1:3, eerste lid][ref4], geldt op grond van het eerste lid, eerste volzin.


