  - number: 5:10
    text: |-
      1 De arbeid van een jeugdige werknemer wordt, indien hij meer dan 4,5 uur arbeid per dienst verricht, afgewisseld
      door een pauze.

      2 De arbeid van een werknemer van 18 jaar of ouder wordt, indien hij meer dan 5,5 uur arbeid per dienst verricht,
      afgewisseld door een pauze.

      3 Met inachtneming van het eerste en tweede lid wordt de arbeid van een werknemer:

      a. indien hij niet meer dan 8 uren arbeid per dienst verricht, afgewisseld door pauzes van tezamen ten minste een
      half uur;

      b. indien hij meer dan 8 uren, doch niet meer dan 10 uren arbeid per dienst verricht, afgewisseld door pauzes van
      tezamen ten minste 45 minuten;

      c. indien hij meer dan 10 uren arbeid per dienst verricht, afgewisseld door pauzes van tezamen ten minste 1 uur.

      4 Eén van de pauzes, bedoeld in het derde lid, bedraagt ten minste een half uur aaneengesloten.

      5 De pauzes, bedoeld in het eerste tot en met derde lid, vangen aan en eindigen in de periode, gelegen tussen 2
      uren na de aanvang en 2 uren voor het einde van de arbeid.

      6 Van het derde tot en met vijfde lid kan, met inachtneming van het zevende lid, slechts bij collectieve regeling
      worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het
      derde tot en met vijfde lid, is nietig.

      7 De werkgever organiseert de arbeid zodanig, dat de in het eerste en tweede lid bedoelde pauze ten minste een half
      uur aaneengesloten bedraagt, welke mag worden gesplitst in twee pauzes.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel510
  - number: 5:11
    text: |-
      1 Onder consignatie wordt in dit artikel verstaan: een tijdruimte tussen twee elkaar opeenvolgende diensten of
      tijdens een pauze, waarin de werknemer uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene
      omstandigheden op oproep zo spoedig mogelijk de bedongen arbeid te verrichten.

      2 De werkgever organiseert de arbeid zodanig, dat de consignatie uitsluitend een werknemer van 18 jaar of ouder
      wordt opgelegd.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten minste gedurende 2 maal een aaneengesloten tijdruimte van 7 maal 24 uren in elke aaneengesloten periode van
      28 maal 24 uren geen consignatie wordt opgelegd;

      b. tijdens de bij deze wet en de daarop berustende bepalingen voorgeschreven onafgebroken rusttijd direct
      voorafgaand aan een nachtdienst en direct volgend op een nachtdienst geen consignatie wordt opgelegd;

      c. ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren en 60 uren per week arbeid verricht;

      d. ten hoogste gemiddeld 45 uren per week in elke periode van 13 achtereenvolgende weken arbeid verricht.

      De in onderdeel a bedoelde periode vangt aan op het eerste tijdstip waarop de werknemer consignatie krijgt
      opgelegd.

      4 Indien de consignatie geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, organiseert de
      werkgever in afwijking van het derde lid, onderdeel *d*, de arbeid zodanig, dat de werknemer ten hoogste gemiddeld
      40 uren per week in elke periode van 13 achtereenvolgende weken arbeid verricht.

      5 Voor de toepassing van het derde en vierde lid vangt de arbeidstijd aan op het moment van oproep als bedoeld
      in het eerste lid. Indien binnen een half uur na beëindiging van de arbeidstijd die voortvloeit uit een oproep
      als bedoeld in het eerste lid, opnieuw een dergelijke oproep wordt gedaan, is de tussenliggende tijd arbeidstijd.
      Indien binnen een half uur één of meer keren arbeid voortvloeiend uit een oproep als bedoeld in het eerste lid
      wordt verricht, wordt de arbeidstijd geacht ten minste een half uur te bedragen.

      6 De arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid wordt voor de toepassing van
      de [artikelen 5:3, tweede lid][ref1], [5:5, tweede lid][ref2], [5:8, eerste lid, onderdelen ][ref3], en
      [5:10, tweede en zevende lid][ref4], alsmede van de voorschriften krachtens [artikel 5:12][ref5] ten aanzien van de
      rusttijd en de pauze, buiten beschouwing gelaten.

      7 Op de arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid, is
      [artikel 5:8, eerste lid, onderdeel b, en derde lid, onderdeel b][ref6] en de bij of krachtens
      [artikel 5:12][ref7], gestelde regels ten aanzien van het aantal malen dat arbeid in nachtdienst wordt verricht,
      niet van toepassing.


