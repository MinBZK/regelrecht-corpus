  - number: 2:5
    text: |-
      Deze wet en de daarop berustende bepalingen zijn van toepassing op arbeid verricht door personeel in burgerlijke
      openbare dienst, tenzij de toepassing van deze wet en de daarop berustende bepalingen een goede uitoefening van de
      bij wet en de daarop berustende bepalingen gegeven taken, dan wel het handhaven van de rechtsorde en het opsporen
      van strafbare feiten door dit personeel belemmert.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel25
  - number: 2:6
    text: |-
      Deze wet en de daarop berustende bepalingen zijn van toepassing op arbeid verricht door brandweerpersoneel, tenzij
      dit personeel repressief optreedt bij brand en ongevallen.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel26
  - number: 2:7
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat voor de bij die maatregel en de daarop berustende
      bepalingen omschreven arbeid of arbeid onder daarbij omschreven omstandigheden, deze wet en de daarop berustende
      bepalingen geheel of gedeeltelijk mede moeten worden nageleefd door een persoon die, zonder werkgever of werknemer
      te zijn in de zin van deze wet, deze arbeid verricht, indien zulks noodzakelijk is ter voorkoming van ernstig
      gevaar voor de veiligheid of de gezondheid van andere personen.

      2 [Artikel 2:8, onderdelen b, c en d][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel28
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel27
