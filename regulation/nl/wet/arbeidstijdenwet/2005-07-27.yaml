  - number: 8:1
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen onder hem ressorterende ambtenaren.

      2 Met betrekking tot door Onze Minister aangewezen categorieën van arbeid zijn met het toezicht op de naleving van
      het bepaalde bij of krachtens deze wet belast of mede belast de door hem aangewezen andere ambtenaren dan de in
      het eerste lid bedoelde. Indien ambtenaren worden aangewezen die ressorteren onder een andere minister, wordt het
      besluit tot aanwijzing van die ambtenaren genomen door Onze Minister en die andere minister gezamenlijk.

      3 In afwijking van het tweede lid wordt het aldaar bedoelde besluit, voor zover het de in
      [artikel 5:12, tweede lid][ref1], onderscheiden categorieën van arbeid betreft, genomen door Onze Minister van
      Verkeer en Waterstaat en Onze Minister tezamen.

      4 Van een aanwijzingsbesluit als bedoeld in de voorgaande leden wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:12
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 8:2
    text: |-
      1 Een toezichthouder kan bevelen, dat, indien [artikel 3:2, eerste lid][ref1], naar zijn oordeel in ernstige mate
      wordt overtreden, een kind de arbeid staakt.

      2 Een toezichthouder kan bevelen dat, indien arbeid wordt verricht die naar zijn oordeel in ernstige mate in
      strijd is met de bij deze wet en de daarop berustende bepalingen gegeven regels inzake arbeids- en rusttijden of
      deugdelijke registratie, voor zover aangeduid als beboetbare of strafbare feiten, een kind, de werknemer of een
      persoon als bedoeld in [artikel 2:7][ref2], die arbeid staakt tot op een nader te bepalen tijdstip. Het tijdstip
      wordt niet later gesteld dan dat, waarop hervatting van de arbeid wettelijk weer geoorloofd is onderscheidenlijk
      deugdelijk kan worden uitgevoerd.

      3 Voor zover het in het eerste en tweede lid bedoelde bevel op enigerlei andere wijze dan schriftelijk wordt
      gegeven, wordt zij binnen 7 dagen, nadat het bevel is gegeven, schriftelijk bevestigd.

      4 Degene, die een bevel als bedoeld in het eerste en tweede lid, heeft gegeven, is bevoegd met betrekking tot de
      uitvoering ervan de nodige maatregelen te treffen, met inbegrip van de toepassing van bestuursdwang, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.

      5 Degene die het bevel heeft gegeven, kan dit bevel te allen tijde intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel27
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel82
