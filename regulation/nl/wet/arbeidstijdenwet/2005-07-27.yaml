        paragraaf: '8.2'
  - number: 8:4
    text: |-
      De toezichthouders zijn, behoudens tegenover hen aan wier gezag zij uit hoofde van hun ambt zijn onderworpen,
      verplicht tot geheimhouding van de namen van de personen door wie een klacht is ingediend of aangifte is gedaan van
      een overtreding van deze wet en de daarop berustende bepalingen, behoudens wanneer deze personen hen schriftelijk
      hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel84
  - number: 8:5
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanvraag en het gebruik
      van middelen door toezichthouders ten behoeve van de controle op een deugdelijke registratie van arbeids- en
      rusttijden ten aanzien van arbeid verricht door personen werkzaam in of op motorrijtuigen.

      2 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Verkeer en Waterstaat en Onze Minister tezamen.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel85
  - number: 8:6
    text: |-
      1 Een toezichthouder kan afgifte vorderen van een middel terzake van de deugdelijke registratie, bedoeld in
      [artikel 4:3, derde lid][ref1], dat betrekking heeft op arbeid verricht door personen in of op motorrijtuigen, in
      bij algemene maatregel van bestuur omschreven gevallen van onrechtmatig bezit en gebruik van dat middel.

      2 Een ieder is op eerste vordering verplicht tot afgifte van een door hem gehouden middel als bedoeld in het eerste
      lid.

      3 Een ingevorderd middel wordt met een door de toezichthouder opgemaakt rapport inzake de toedracht van vordering
      tot afgifte gezonden aan Onze Minister van Verkeer en Waterstaat.

      4 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Minister van Verkeer en Waterstaat en Onze Minister tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 4:3
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9:1
    text: |-
      1 De Dienst Wegverkeer is belast met het erkennen van natuurlijke of rechtspersonen die een apparaat ter controle
      van de naleving van de bij of krachtens de in de [artikelen 2:7][ref1] en [5:12, tweede lid][ref2], bedoelde
      algemene maatregel van bestuur gegeven voorschriften, voor zover het betreft arbeid verricht door personen,
      werkzaam in of op motorrijtuigen, installeren, onderzoeken of herstellen.

      2 De Dienst Wegverkeer is belast met het toezicht op het installeren, onderzoeken en herstellen van de in het
      eerste lid bedoelde apparaten door de in dat artikellid bedoelde erkende natuurlijke of rechtspersonen.

      3 De Dienst Wegverkeer is belast met het goedkeuren van registratiebladen en van de in het eerste lid bedoelde
      apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
