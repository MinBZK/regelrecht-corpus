  - number: 8:3
    text: |-
      1 Een ieder, wie zulks aangaat, gedraagt zich overeenkomstig een bevel als bedoeld in
      [artikel 8:2, eerste en tweede lid][ref1], en een maatregel of aanwijzing als bedoeld in het vierde lid van dat
      artikel.

      2 Een gedraging in strijd met het eerste lid is een misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel82
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel83
    references:
