  - number: 5:13
    text: |-
      1 Onze Minister kan, op verzoek van partijen bij een collectieve regeling en indien daartoe gegronde redenen
      aanwezig zijn, vrijstelling verlenen van [paragraaf 5.2][ref1] van de wet, mits het een bestendig en regelmatig
      arbeidstijdpatroon betreft dat niet ongunstiger is dan een arbeidstijdpatroon dat voldoet aan de in die paragraaf
      gegeven voorschriften.

      2 De werkgever organiseert de arbeid zodanig, dat geen arbeid wordt verricht in strijd met de in het eerste lid
      bedoelde regeling en de daarbij gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
