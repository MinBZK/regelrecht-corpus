  - number: 4:8
    text: |-
      1 Een vrouwelijke werknemer, die een borstkind voedt, heeft, indien zij de werkgever hiervan in kennis heeft
      gesteld, gedurende de eerste 9 levensmaanden van dat kind het recht de arbeid te onderbreken ten einde in de
      nodige rust en afzondering haar kind te zogen dan wel de borstvoeding te kolven. De werkgever biedt haar daartoe de
      gelegenheid en stelt, waar nodig, een geschikte af te sluiten besloten ruimte ter beschikking.

      2 De onderbrekingen, bedoeld in het eerste lid, vinden plaats zo vaak en zo lang als nodig is doch bedragen
      gezamenlijk ten hoogste een vierde van de arbeidstijd per dienst. De vaststelling van het tijdstip en de duur van
      de onderbrekingen vindt plaats door de betrokken vrouwelijke werknemer na overleg met de werkgever.

      3 De duur van de onderbrekingen, bedoeld in dit artikel, gelden voor de toepassing van deze wet en de daarop
      berustende bepalingen als arbeidstijd, waarover de vrouwelijke werknemer haar aanspraak op het naar tijdruimte
      vastgesteld loon behoudt.

      4 Elk beding waarbij ten nadele van de vrouwelijke werknemer wordt afgeweken van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel48
  - number: 4:9
    text: |-
      1 Indien uit arbeidsgezondheidskundig onderzoek blijkt, dat de gezondheidsproblemen van een werknemer voortvloeien
      uit het verrichten van nachtdiensten, wordt de arbeid van die werknemer binnen redelijke termijn zodanig ingericht,
      dat hij arbeid verricht anders dan in nachtdienst. Elk beding waarbij wordt afgeweken van dit lid, is nietig.

      2 De werkgever voldoet aan de voor hem uit het eerste lid voortvloeiende verplichting, tenzij hij aannemelijk
      maakt, dat de in dat lid bedoelde inrichting van de arbeid redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel49
  - number: 5:1
    text: |-
      1 Dit hoofdstuk en de daarop berustende bepalingen vinden ten aanzien van de zondag voor werknemers, die in verband
      met hun godsdienstige of levensbeschouwelijke opvattingen, de wekelijkse rustdag op een andere dag dan de zondag
      vieren, overeenkomstige toepassing voor die dag in plaats van ten aanzien van de zondag, indien die werknemers een
      daartoe strekkend schriftelijk verzoek tot de werkgever hebben gericht.

      2 Elk beding waarbij wordt afgeweken van het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel51
  - number: 5:2
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen, worden voor het bepalen van het aantal
      uren dat arbeid wordt verricht meegeteld de uren waarop de werknemer de bedongen arbeid zou hebben verricht, maar
      deze door de uitoefening van zijn taak in het kader van het medezeggenschapsorgaan, ziekte, vakantie, de vervulling
      van door wet of overheid opgelegde verplichting, welke niet in zijn vrije tijd kon geschieden, of als gevolg van
      zeer bijzondere persoonlijke omstandigheden, bedoeld in [artikel 4:1, eerste lid, van de Wet arbeid en zorg][ref1],
      niet heeft verricht.

      2 Elk beding waarbij wordt afgeweken van het eerste lid, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel41
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel52
