  - number: 10:4
    text: |-
      1 Indien de op grond van [artikel 10:5][ref1] aangewezen ambtenaar voornemens is om de natuurlijke persoon of
      rechtspersoon op wie de verplichtingen rusten welke voortvloeien uit deze wet en de daarop berustende bepalingen,
      voor zover het niet naleven daarvan is aangeduid als beboetbaar feit, een boete op te leggen, wordt deze hiervan
      schriftelijk in kennis gesteld onder vermelding van de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref2] stelt de op grond van
      [artikel 10:5][ref3] aangewezen ambtenaar binnen een door hem te bepalen termijn de persoon, bedoeld in het eerste
      lid, in de gelegenheid om schriftelijk of zo nodig mondeling zijn zienswijze naar voren te brengen alvorens de
      boete wordt opgelegd.

      3 Indien de persoon, bedoeld in het tweede lid, zijn zienswijze mondeling naar voren brengt en hij de Nederlandse
      taal onvoldoende begrijpt, zorgt de op grond van [artikel 10:5][ref4] aangewezen ambtenaar ervoor dat een tolk
      wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel105
