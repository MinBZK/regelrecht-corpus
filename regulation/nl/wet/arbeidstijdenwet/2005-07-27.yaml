preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het met het oog op de veiligheid, de gezondheid en het welzijn in
    verband met de arbeid, zulks mede in verband met de tenuitvoerlegging van de Richtlijnen van de Raad van de
    Europese Unie van 23 november 1993 betreffende een aantal aspecten van de organisatie van de arbeidstijd (PbEG
    1993, L 307) en van 22 juni 1994 betreffende de bescherming van jongeren op het werk (PbEG 1994, L 216), en mede
    ter bevordering van de combineerbaarheid van arbeid en zorgtaken, alsmede andere verantwoordelijkheden buiten de
    arbeid, noodzakelijk is wettelijke regelen te stellen inzake arbeids- en rusttijden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. werkgever:

      1°. degene jegens wie een ander krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is tot het
      verrichten van arbeid, behalve indien die ander aan een derde ter beschikking wordt gesteld voor het verrichten van
      arbeid, welke die derde gewoonlijk doet verrichten;

      2°. degene aan wie een ander ter beschikking wordt gesteld voor het verrichten van arbeid als bedoeld onder 1°;

      b. werknemer: de ander bedoeld onder *a*.

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:

      a. werkgever: degene die zonder werkgever of werknemer in de zin van het eerste lid te zijn, een ander onder zijn
      gezag arbeid doet verrichten;

      b. werknemer: de ander bedoeld onder *a*.

      3 In deze wet en de daarop berustende bepalingen wordt onder jeugdige werknemer verstaan: een werknemer van 16 of
      17 jaar.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel11
  - number: 1:2
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder kind: een persoon jonger dan 16 jaar.

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder arbeid: de verrichtingen van een kind
      ter naleving van een overeenkomst.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel12
  - number: 1:3
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder collectieve regeling:

      a. een collectieve arbeidsovereenkomst als bedoeld in
      [artikel 1 van de Wet op de collectieve arbeidsovereenkomst][ref1];

      b. een rechtspositieregeling van werknemers in dienst van de overheid alsmede een overeenkomstige
      rechtspositieregeling van werknemers, werkzaam in instellingen van bijzonder onderwijs of wetenschappelijk
      onderzoek;

      c. een verordening als bedoeld in de [artikelen 16, derde lid][ref2], [86, derde lid][ref3], en
      [93, tweede lid, onder d, van de Wet op de bedrijfsorganisatie][ref4].

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder collectieve regeling:

      a. een besluit als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________ waarbij bepalingen van een collectieve arbeidsovereenkomst algemeen verbindend zijn
      verklaard;

      b. een regeling als bedoeld in de [artikelen 5][ref6] en [6 van de Wet op de loonvorming][ref7].


