  - number: 12:1
    text: |-
      1 De Arbeidswet 1919 wordt ingetrokken.

      2 De Stuwadoorswet en de Wet van 13 juli 1951, *Stb.* 281, houdende vervanging van de bezettingsregeling
      betreffende een wekelijkse rustdag voor toonkunstenaars, die dans- en amusementsmuziek ten gehore brengen, worden
      ingetrokken.

      3 De Rijtijdenwet 1936 wordt ingetrokken.

      4 De Wet arbeids- en rusttijden zeescheepvaart wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel121
  - number: 12:2
    text: De Phosphorluciferwet 1901 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel122
  - number: 12:36
    text: |-
      Waar in deze wet niet anders wordt bepaald, wordt de voordracht tot een algemene maatregel van bestuur Ons gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1236
  - number: 12:37
    text: |-
      Onze Minister zendt binnen 5 jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1237
  - number: 12:38
    text: |-
      1 Onze Minister stelt de vergoeding vast die verschuldigd is voor de kosten van de stukken, opgemaakt op grond van
      deze wet en de daarop berustende bepalingen alsmede de vergoeding, verschuldigd voor de kosten van de behandeling
      van een ontheffingsaanvraag, tenzij zulks betrekking heeft op de in [artikel 5:12, tweede lid][ref1], onderscheiden
      categorieën van arbeid.

      2 Onze Minister van Verkeer en Waterstaat en Onze Minister tezamen stellen de vergoeding vast die verschuldigd
      is voor de kosten van de stukken, opgemaakt of middelen afgegeven, op grond van deze wet en de daarop berustende
      bepalingen voor de in [artikel 5:12, tweede lid][ref2], onderscheiden categorieën van arbeid, alsmede de
      vergoeding, verschuldigd voor de kosten van de behandeling van een ontheffingsaanvraag voor die onderscheiden
      categorieën van arbeid.

      3 Het aan het goedkeuren, aan het toezicht en aan de erkenning, bedoeld in [artikel 9:1][ref3], verbonden tarief
      alsmede de wijze van betaling daarvan worden vastgesteld door de Dienst Wegverkeer en kunnen voor verschillende
      vormen van toezicht en verschillende soorten van erkenningen verschillend worden gesteld. [Artikel 4][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel512
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel512
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1238
