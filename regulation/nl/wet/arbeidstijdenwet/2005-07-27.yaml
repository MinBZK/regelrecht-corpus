  - number: 1:7
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. defensiepersoneel:

      1°. de in actieve dienst zijnde militaire ambtenaren in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];

      2°. de in werkelijke dienst zijnde dienstplichtigen in de zin van de [artikelen 18][ref2], [19][ref3] en
      [21 van de Kaderwet dienstplicht][ref4];

      3°. het burgerpersoneel, werkzaam bij het ministerie van Defensie;

      c. dienst: een aaneengesloten tijdruimte waarin arbeid wordt verricht en die gelegen is tussen twee bij deze wet en
      de daarop berustende bepalingen voorgeschreven opeenvolgende onafgebroken rusttijden;

      d. nachtdienst: een dienst waarin de uren tussen 00.00 uur en 06.00 uur geheel of gedeeltelijk zijn begrepen;

      e. pauze: een tijdruimte van ten minste 15 achtereenvolgende minuten, waarmee de arbeid tijdens de dienst wordt
      onderbroken en de werknemer geen enkele verplichting heeft ten aanzien van de bedongen arbeid;

      f. Dienst Wegverkeer: de dienst, bedoeld in [artikel 4][ref5].

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. beboetbaar feit: een handelen of nalaten waardoor deze wet en de daarop berustende bepalingen niet worden
      nageleefd en terzake waarvan een boete kan worden opgelegd;

      b. boete: de bestuurlijke sanctie die bestaat uit de onvoorwaardelijke verplichting tot het betalen van een
      bepaalde geldsom aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
