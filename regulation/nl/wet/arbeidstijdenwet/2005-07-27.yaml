    text: |-
      Bij algemene maatregel van bestuur als bedoeld in de [artikelen 2:7, eerste lid][ref1],
      [4:3, tweede tot en met vierde lid][ref2], en [5:12, tweede lid][ref3], kan aan Onze Minister en Onze Minister
      van Verkeer en Waterstaat tezamen of aan één van beiden de bevoegdheid worden toegekend omtrent het verlenen van
      vrijstellingen en ontheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel512
