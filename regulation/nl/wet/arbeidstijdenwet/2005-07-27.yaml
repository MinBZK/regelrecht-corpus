  - number: 10:8
    text: |-
      1 Een boete wordt opgelegd bij beschikking van de op grond van [artikel 10:5][ref1] aangewezen ambtenaar.

      2 In de beschikking wordt in ieder geval vermeld:

      a. de hoogte van de boete;

      b. het beboetbare feit ter zake waarvan de boete opgelegd wordt;

      c. de bij het beboetbare feit betrokken persoon of personen;

      d. degene op wie de verplichting rust tot naleving van deze wet en de daarop berustende bepalingen, voor zover deze
      zijn aangeduid als beboetbare feiten.

      e. de termijn waarbinnen de boete moet worden betaald.

      3 De beschikking wordt gegeven binnen 13 weken na dagtekening van het boeterapport, bedoeld in
      [artikel 10:3][ref2].

      4 Indien de in het tweede lid, onderdeel d, bedoelde persoon die de inhoud van de beschikking wegens zijn
      gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, zorgt de ambtenaar, bedoeld in het eerste lid,
      er zoveel mogelijk voor dat de in die beschikking vermelde informatie aan hem wordt medegedeeld in een voor hem
      begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel103
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel108
