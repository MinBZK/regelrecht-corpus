  - number: 4:1a
    text: |-
      1 De werkgever houdt, voor zover dat redelijkerwijs van hem kan worden gevergd, bij de vaststelling van het
      arbeidstijdpatroon van de werknemer rekening met de persoonlijke omstandigheden van de werknemer buiten de arbeid,
      waaronder in elk geval begrepen de zorg(taken) voor kinderen, (afhankelijke) familieleden, verwanten en naasten
      alsmede maatschappelijke verantwoordelijkheden die door de werknemer worden gedragen.

      2 De werkgever organiseert, voor zover dat redelijkerwijs van hem kan worden gevergd, de arbeid zodanig
      dat de werknemer zijn arbeid in een bestendig en regelmatig patroon kan verrichten, mede met het oog op
      verantwoordelijkheden van de individuele werknemer buiten de arbeid.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel41a
  - number: 4:2
    text: |-
      1 De werkgever die een arbeidstijdpatroon voor de bij hem werkzame werknemer vaststelt of opnieuw vaststelt, deelt
      dit arbeidstijdpatroon ten minste 28 dagen van te voren aan die werknemer mede.

      2 Indien de aard van de arbeid toepassing van het eerste lid onmogelijk maakt, deelt de werkgever ten minste
      28 dagen van te voren aan de werknemer mede op welke dag de rusttijd, bedoeld in de [artikelen 5:3][ref1] en
      [5:4][ref2], aanvangt. Tevens maakt hij aan die werknemer ten minste 4 dagen van te voren de tijdstippen bekend
      waarop hij arbeid moet verrichten.

      3 Van het eerste en tweede lid kan uitsluitend bij collectieve regeling of, indien geen collectieve regeling
      van toepassing is dan wel de collectieve regeling geen bepalingen terzake bevat, telkens met instemming van de
      betrokken werknemer worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel54
