  - number: 1:6
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder medezeggenschapsorgaan:

      a. de ondernemingsraad, ingesteld overeenkomstig de [Wet op de ondernemingsraden][ref1];

      b. een personeelsvertegenwoordiging als bedoeld in de [Wet op de ondernemingsraden][ref2];

      c. een overlegorgaan als bedoeld in het [Algemeen militair ambtenarenreglement][ref3] en een overlegorgaan,
      ingesteld krachtens [artikel 23 van de Kaderwet dienstplicht][ref4], alsmede een dienstcommissie als bedoeld in het
      [Burgerlijk ambtenarenreglement defensie][ref5];

      d. de dienstcommissie, het uit en door het personeel gekozen deel van de medezeggenschapsraad en de personeelsraad,
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6];

      e. het uit en door het personeel gekozen deel van de medezeggenschapsraad, bedoeld in de
      [Wet medezeggenschap onderwijs 1992][ref7];

      f. een medezeggenschapsregeling voor de in [artikel 53][ref8] bedoelde ambtenaren.


