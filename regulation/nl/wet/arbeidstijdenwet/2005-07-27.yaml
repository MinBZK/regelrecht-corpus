  - number: 10:11
    text: |-
      1 Bij gebreke van betaling maant de op grond van [artikel 10:5][ref1] aangewezen ambtenaar degene aan wie de
      boete is opgelegd schriftelijk aan binnen een termijn van 2 weken alsnog aan zijn verplichtingen te voldoen. De
      verschuldigde boete wordt verhoogd met de kosten die op de aanmaning betrekking hebben.

      2 De aanmaning bevat de aanzegging, dat de boete, voor zover deze binnen de in de aanmaning gestelde termijn niet
      wordt voldaan, wordt ingevorderd overeenkomstig [artikel 10:12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel1012
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1011
