  - number: 5:3
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer een onafgebroken rusttijd heeft van ten
      minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder een onafgebroken rusttijd heeft
      van hetzij ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in
      elke aaneengesloten tijdruimte van 9 maal 24 uren welke rusttijd éénmaal in elke periode van 5 achtereenvolgende
      weken mag worden bekort tot 32 uren.

      3 De in het eerste en tweede lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de
      werknemer arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel53
  - number: 5:4
    text: |-
      1 De werknemer verricht op zondag geen arbeid, behalve voor zover het tegendeel is bedongen en uit de aard van
      de arbeid voortvloeit. Indien de bedrijfsomstandigheden dit noodzakelijk maken, kan van de vorige volzin worden
      afgeweken, indien de werkgever daartoe overeenstemming heeft bereikt met het medezeggenschapsorgaan of, bij het
      ontbreken daarvan, met de belanghebbende werknemers. De werknemer verricht, onder de omstandigheden bedoeld in de
      vorige volzin, uitsluitend arbeid op zondag indien hij daar voor dat geval mee instemt. De werknemer verricht in
      ieder geval op ten minste 4 zondagen in elke periode van 13 achtereenvolgende weken geen arbeid.

      2 Van het eerste lid, vierde volzin, kan, met inachtneming van het derde lid, slechts bij collectieve regeling
      worden afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het
      eerste lid, vierde volzin, is nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer op ten minste 13 zondagen in elke periode van 52
      achtereenvolgende weken geen arbeid verricht.

      4 Indien een jeugdige werknemer op zondag arbeid verricht, organiseert de werkgever de arbeid zodanig, dat hij op
      de dag voorafgaande aan die zondag geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel54
  - number: 5:5
    text: |-
      1 De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer een onafgebroken rusttijd heeft van ten
      minste 12 uren in elke periode van 24 achtereenvolgende uren, waarin de periode tussen hetzij 22.00 uur en 06.00
      uur, hetzij 23.00 uur en 07.00 uur begrepen is.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder een onafgebroken rusttijd heeft
      van ten minste 11 uren in een aaneengesloten tijdruimte van 24 uren, welke rusttijd éénmaal in elke aaneengesloten
      tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren. De in de vorige volzin bedoelde tijdruimte
      vangt aan op het eerste tijdstip van de dag, waarop de werknemer arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel55
  - number: 5:6
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de jeugdige werknemer ten hoogste 9 uren per dienst, 45 uren per
      week en in elke periode van 4 achtereenvolgende weken gemiddeld 40 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel56
  - number: 5:7
    text: |-
      1 De werknemer van 18 jaar of ouder verricht ten hoogste 9 uren per dienst, 45 uren per week en in elke periode van
      13 achtereenvolgende weken gemiddeld 40 uren per week arbeid.

      2 Van het eerste lid kan, met inachtneming van het derde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het eerste lid, is
      nietig.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer van 18 jaar of ouder ten hoogste 10 uren per
      dienst, in elke periode van 4 achtereenvolgende weken gemiddeld 50 uren per week en in elke periode van 13
      achtereenvolgende weken gemiddeld 45 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel57
  - number: 5:8
    text: |-
      1 Met inachtneming van [artikel 5:7, eerste lid][ref1], geldt ten aanzien van de werknemer van 18 jaar of ouder,
      die arbeid verricht in nachtdienst, dat hij:

      a. ten hoogste 8 uren per nachtdienst arbeid verricht;

      b. in elke periode van 4 achtereenvolgende weken:

      1°. indien de arbeid eindigt vóór of op 02.00 uur: ten hoogste 16 maal arbeid in nachtdienst verricht;

      2°. in andere gevallen: ten hoogste 10 maal arbeid in nachtdienst verricht, waarbij in elke periode van 13
      achtereenvolgende weken ten hoogste 25 maal arbeid in nachtdienst wordt verricht;

      c. na het verrichten van arbeid in nachtdienst, welke arbeid eindigt ná 02.00 uur, een onafgebroken rusttijd heeft
      van ten minste 14 uren;

      d. een onafgebroken rusttijd heeft van ten minste 48 uren:

      1°. indien de arbeid eindigt vóór of op 02.00 uur: na een reeks van ten minste 3 en ten hoogste 6 maal achtereen
      arbeid te hebben verricht in nachtdienst;

      2°. in andere gevallen: na een reeks van ten minste 3 en ten hoogste 5 maal achtereen arbeid te hebben verricht
      in nachtdienst.

      2 Van het eerste lid kan, met inachtneming van het derde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het eerste lid, is
      nietig.

      3 Met inachtneming van [artikel 5:7, derde lid][ref2], organiseert de werkgever de arbeid zodanig, dat een
      werknemer van 18 jaar of ouder die arbeid verricht in nachtdienst:

      a. ten hoogste 9 uren per nachtdienst en in elke periode van 13 achtereenvolgende weken gemiddeld 40 uren per week
      arbeid verricht;

      b. in elke periode van 13 achtereenvolgende weken:

      1°. indien de arbeid eindigt vóór of op 02.00 uur: niet meer dan ten hoogste 52 maal arbeid in nachtdienst
      verricht;

      2°. in andere gevallen: niet meer dan ten hoogste 28 maal arbeid in nachtdienst verricht;

      c. na het verrichten van arbeid in nachtdienst, welke arbeid eindigt ná 02.00 uur, een onafgebroken rusttijd heeft
      van ten minste 14 uren, welke rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden
      bekort tot ten minste 8 uren;

      d. na een reeks van ten minste 3 en ten hoogste 7 maal achtereen arbeid te hebben verricht in nachtdienst, een
      onafgebroken rusttijd heeft van ten minste 48 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel57
