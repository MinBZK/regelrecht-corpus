      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met een collectieve regeling als bedoeld
      in [artikel 1:3][ref1] gelijkgesteld een regeling waaromtrent de werkgever schriftelijk overeenstemming heeft
      bereikt met het medezeggenschapsorgaan.

      2 Indien een collectieve regeling als bedoeld in [artikel 1:3][ref2] van toepassing is en geen bepaling terzake
      van één van de in de onderdelen *a* of *b* gegeven onderwerpen bevat, geldt de in het eerste lid bedoelde
      gelijkstelling niet ten aanzien van:

      a. de rusttijd en de pauze;

      b. de arbeidstijd, arbeid op zondag en arbeid in nachtdienst.

      3 Indien zowel een regeling als bedoeld in het eerste lid, als een collectieve regeling als bedoeld in
      [artikel 1:3][ref3] gelden, zijn de in die regelingen gegeven bepalingen naast elkaar van toepassing. In geval van
      strijd zijn de bepalingen in de collectieve regeling, bedoeld in [artikel 1:3][ref4], van toepassing.


