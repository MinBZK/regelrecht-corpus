  - number: 10:6
    text: |-
      1 Geen boete wordt opgelegd indien de natuurlijke persoon op wie de verplichtingen rusten welke voortvloeien uit
      deze wet en de daarop berustende bepalingen, bedoeld in [artikel 10:1][ref1], is overleden.

      2 Geen boete wordt opgelegd, indien een beboetbaar feit tevens een strafbaar feit, als bedoeld in
      [artikel 11:3, eerste tot en met derde lid][ref2], oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel113
