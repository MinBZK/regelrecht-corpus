        artikel: 10:5
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 10:12
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: 10:12
    text: |-
      1 Bij gebreke van betaling vordert de op grond van [artikel 10:5][ref1] aangewezen ambtenaar van degene aan wie
      de boete is opgelegd de verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking hebbende
      kosten, bij dwangbevel in.

      2 Het dwangbevel wordt op kosten van de natuurlijke persoon of rechtspersoon aan wie de boete
      is opgelegd bij deurwaardersexploit betekend en levert een executoriale titel op in de zin van
      [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      3 Gedurende 6 weken na de dag van betekening van het dwangbevel staat verzet tegen het dwangbevel open door
      dagvaarding van de Staat.

      4 Het verzet kan niet worden gegrond op de stelling dat de beschikking, bedoeld in [artikel 10:10][ref3], niet is
      ontvangen of dat de bij die beschikking opgelegde boete ten onrechte of op een te hoge geldsom is vastgesteld.

      5 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter desgevraagd anders beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel1010
    url: https://wetten.overheid.nl/BWBR0007671/2005-07-27#Artikel1012
