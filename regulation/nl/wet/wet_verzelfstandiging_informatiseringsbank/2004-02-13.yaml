  - number: '2'
    text: |-
      1 Er is een Informatie Beheer Groep, die is gevestigd te Groningen.

      2 De Informatie Beheer Groep bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel2
  - number: '3'
    text: |-
      1 De Informatie Beheer Groep is belast met de uitvoering van:

      a. de [Wet studiefinanciering 2000][ref1], de [Wet op de studiefinanciering][ref2],
      het [Besluit studiefinanciering 2000][ref3], het Besluit studiefinanciering, de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref4], de Wet tegemoetkoming studiekosten, het
      Besluit tegemoetkoming onderwijsbijdrage en schoolkosten, het [Besluit tegemoetkoming studiekosten][ref5],
      de [Les- en cursusgeldwet][ref6], het [Uitvoeringsbesluit les- en cursusgeldwet 2000][ref7], het
      [Rechtspositiebesluit onderwijspersoneel][ref8], hoofdstuk II van de Tijdelijke regeling WWV-vervangende
      uitkering, het [Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref9], het [Examenbesluit m.b.o.][ref10], het
      [Eindexamenbesluit m.h.n.o.][ref11], het Besluit dagscholen v.w.o.-h.a.v.o.-m.a.v.o., het Interimbesluit m.t.o.,
      het Eindexamenbesluit dagscholen m.e.a.o., het Eindexamenbesluit m.m.o., de Wet van 25 december 1878, houdende
      regeling der voorwaarden tot verkrijging der bevoegdheid van arts, tandmeester, apotheker, vroedvrouw en apothekers-
      bediende (Stb. 1878, 222), het Besluit van 12 februari 1879, tot regeling der examens als arts, tandmeester,
      apotheker, vroedvrouw en apothekersbediende (Stb. 1879, 36), het Besluit staatsexamens v.w.o.-h.a.v.o.-m.a.v.o.
      1978, het Besluit staatsexamens m.e.a.o., het [Staatsexamenbesluit SPD bedrijfsadministratie][ref12], het Besluit
      van 18 maart 1972 houdende staatsexamen diploma's handvaardigheid (Stb. 1972, 155), het Besluit van 16 september
      1949 houdende instelling van examens ter verkrijging van een getuigschrift van tolk-vertaler (Stb. 1949, J428), het
      Besluit van 5 mei 1958 tot instelling van een Staatsdiploma voor leraar in het machineschrijven en tot regeling van
      het examen ter verkrijging van dat diploma (Stb. 1958, 229), het Besluit van 4 augustus 1955 tot instelling van een
      Staatsdiploma voor leraar in de stenografie en tot regeling van het examen ter verkrijging van dat diploma (Stb.
      1955, 366), het Besluit examenprogramma's middelbare akten wiskunde (Stb. 1958, 9), het Besluit examenprogramma
      middelbare akte plant- en dierkunde (Stb. 1958, 271), het Besluit examenprogramma middelbare akte lichamelijke
      oefening (Stb. 1958, 472), het Besluit examenprogramma's middelbare akten tekenen (Stb. 1958, 8), het Besluit van
      10 mei 1938, houdende vaststelling van een reglement en een programma voor het examen, bedoeld in artikel 77*bis*
      der middelbaar-onderwijswet (Stb. 1938, 391) en het Besluit Nederlands als tweede taal, alsmede eventuele op die
      wetten en algemene maatregelen van bestuur berustende ministeriële regelingen;

      b. de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref13] met betrekking tot het Centraal register
      opleidingen hoger onderwijs en de beperking van inschrijving op grond van de beschikbare onderwijscapaciteit of de
      behoefte van de arbeidsmarkt;

      c. het beheer van het basisregister;

      d. andere bij de wet opgedragen taken.

      2 De Informatie Beheer Groep kan met toestemming van Onze minister andere taken uitvoeren, dan die welke
      rechtstreeks voortvloeien uit de in het eerste lid genoemde, mits deze taken:

      a. liggen op het terrein van de uitvoering van bestuurlijke taken en nauw verband houden met de in het eerste lid
      genoemde taken van de Informatie Beheer Groep;

      b. toepassingen met zich brengen van produktiemiddelen, die de Informatie Beheer Groep voor de vervulling van haar
      in het eerste lid genoemde taken, voorhanden heeft;

      c. niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en

      d. tegen kostendekkende tarieven worden verricht.

      3 Onze minister kan bij het verlenen van de toestemming, bedoeld in het tweede lid, voorwaarden stellen.


