  - number: '10'
    text: |-
      1 Onze minister stelt jaarlijks aan de Informatie Beheer Groep ten laste van de begroting van het Ministerie
      van Onderwijs, Cultuur en Wetenschap middelen ter beschikking ten behoeve van de vervulling van haar taken,
      voortvloeiend uit [artikel 3, eerste lid, onder a, b en c][ref1], alsmede, voor zover opgedragen door Onze
      minister, voortvloeiend uit [artikel 3, eerste lid, onder d][ref2].

      2 Onze minister stelt jaarlijks voor 1 september van enig kalenderjaar, doch niet dan nadat hij daarover met de
      Informatie Beheer Groep heeft overlegd, het bedrag vast dat voor het daaropvolgende kalenderjaar aan de Informatie
      Beheer Groep ter beschikking zal worden gesteld en neemt dit bedrag op in het voorstel van wet tot vaststelling van
      de begroting van het Ministerie van Onderwijs, Cultuur en Wetenschap.

      3 Het boekjaar van de Informatie Beheer Groep valt samen met het kalenderjaar.

      4 Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste en tweede lid, niet in werking is
      getreden, verstrekt Onze minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, een
      voorschot aan de Informatie Beheer Groep, in de vorm van maandelijkse termijnen.

      5 De Informatie Beheer Groep trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn.
      In afwijking van de vorige volzin is het de Informatie Beheer Groep toegestaan ter overbrugging van
      tijdelijke kastekorten in verband met haar apparaatskosten bij een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref3] tijdelijke kredieten
      in rekening-courant op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
