  - number: 9a
    text: |-
      1 Er is een basisregister onderwijs, dat ten doel heeft:

      a. Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van
      de bekostiging van scholen en instellingen en de begrotings- en beleidsvoorbereiding, alsmede de planning en
      bekostiging van de instellingen voor hoger onderwijs;

      b. de Informatie Beheer Groep gegevens te verstrekken ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 3, eerste lid][ref1];

      c. de inspectie van het onderwijs en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw
      en de natuurlijke omgeving, de inspectie van het landbouwonderwijs, gegevens te verstrekken ten behoeve van het
      toezicht op het onderwijs; en

      d. het Centraal bureau voor de statistiek gegevens te verstrekken teneinde het Centraal bureau voor de statistiek
      in staat te stellen:

      1°. Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van de
      beleidsvoorbereiding;

      2°. de gemeenten gegevens te verstrekken ten behoeve van de toekenning van bedragen aan instellingen, bedoeld
      in [artikel 2.3.4 van de Wet educatie en beroepsonderwijs][ref2], en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.

      2 Met betrekking tot de verwerking van persoonsgegevens, bedoeld in dit hoofdstuk, is de hoofddirectie van de
      Informatie Beheer Groep de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
