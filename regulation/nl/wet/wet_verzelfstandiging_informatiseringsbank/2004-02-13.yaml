        artikel: '3'
        hoofdstuk: '1'
  - number: '18'
    text: |-
      Onze minister stelt na overleg met de Informatie Beheer Groep een informatiestatuut vast. Het informatiestatuut
      bevat regels met betrekking tot de informatievoorziening tussen Onze minister en de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel18
  - number: '19'
    text: |-
      1 De Informatie Beheer Groep stelt jaarlijks vóór 1 april een verslag op omtrent haar werkzaamheden en het
      gevoerde beheer en beleid in het afgelopen kalenderjaar. Het jaarverslag omvat mede het voorgenomen beleid ten
      aanzien van de werkzaamheden. Zij biedt dit verslag aan Onze minister en aan Onze minister van Landbouw, Natuur en
      Voedselkwaliteit alsmede aan de beide Kamers der Staten-Generaal aan en stelt het algemeen verkrijgbaar.

      2 In het jaarverslag wordt in ieder geval aandacht besteed aan de doelmatigheid en doeltreffendheid van de wijze
      waarop in het afgelopen kalenderjaar de technische en organisatorische maatregelen, bedoeld in [artikel 9c][ref1],
      ten uitvoer zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9c
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9c
        hoofdstuk: IIA
  - number: '20'
    text: |-
      Indien de Informatie Beheer Groep haar taken, voortvloeiend uit [artikel 3, eerste lid][ref1], naar het oordeel van
      Onze minister verwaarloost, kan deze voorzieningen treffen. Onze minister doet hiervan terstond mededeling aan de
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel20
