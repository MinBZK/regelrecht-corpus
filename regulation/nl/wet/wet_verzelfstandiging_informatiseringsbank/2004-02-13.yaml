  - number: 9e
    text: |-
      1 Uit het basisregister worden kosteloos persoonsgegevens en andere gegevens verstrekt aan Onze minister en de
      inspectie van het onderwijs dan wel, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw
      en de natuurlijke omgeving, aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit en de inspectie van het
      landbouwonderwijs, voorzover dat bij wet is vereist of wordt toegestaan.

      2 Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt aan burgemeester en
      wethouders, voorzover dat verplicht is op grond van [artikel 64 van de Wet werk en bijstand][ref1],
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3].

      3 Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt aan de Sociale Verzekeringsbank,
      voorzover dat noodzakelijk is voor de uitvoering van de [Algemene Kinderbijslagwet][ref4].

      4 Uit het basisregister worden kosteloos persoonsgegevens aan het Centraal bureau voor de statistiek verstrekt. Het
      Centraal bureau voor de statistiek gebruikt deze gegevens in ieder geval om:

      a. Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van de
      beleidsvoorbereiding; en

      b. de gemeenten gegevens te verstrekken ten behoeve van de toekenning van bedragen aan instellingen, bedoeld
      in [artikel 2.3.4 van de Wet educatie en beroepsonderwijs][ref5], en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.

      5 Het Centraal bureau voor de statistiek mag de gegevens die het op grond van het vierde lid heeft ontvangen,
      openbaar maken in de vorm van overzichten die betrekking hebben op afzonderlijke scholen, instellingen of
      opleidingen, mits aan deze overzichten geen herkenbare gegevens over een afzonderlijk persoon of een afzonderlijk
      huishouden kunnen worden ontleend.

      6 Onverminderd [artikel 178d van de Wet op het primair onderwijs][ref6],
      [artikel 164d van de Wet op de expertisecentra][ref7], [artikel 103e van de Wet op het voortgezet onderwijs][ref8],
      [artikel 2.5.5d van de Wet educatie en beroepsonderwijs][ref9] en
      [artikel 7.52c van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10], wordt aan de instellingen
      en organen, genoemd in het eerste tot en met het vierde lid, geen rechtstreekse toegang tot het basisregister
      verleend.

      7 De Informatie Beheer Groep verstrekt uit het basisregister geen persoonsgebonden nummer van een leerling,
      deelnemer, student of extraneus ter uitvoering van [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref11].


