    text: |-
      1 De kosten van de uitkeringen, vergoedingen en tegemoetkomingen die worden verstrekt op grond van de in
      [artikel 3][ref1] genoemde regelingen, komen ten laste van het Rijk.

      2 De ontvangsten voortvloeiend uit de uitvoering van de in [artikel 3][ref2] genoemde regelingen, komen ten gunste
      van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
