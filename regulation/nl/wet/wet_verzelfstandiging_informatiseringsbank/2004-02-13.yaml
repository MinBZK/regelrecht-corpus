  - number: '11'
    text: |-
      1 De apparaatskostenbegroting van de Informatie Beheer Groep bevat een raming van alle baten en lasten,
      de investeringsuitgaven en de financiering. De ramingen worden zoveel mogelijk onderbouwd aan de hand van
      kostencomponenten en prestatie-elementen.

      2 De begroting bestaat uit:

      a. de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;

      b. het financiële meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel11
  - number: '12'
    text: |-
      1 De Raad dient jaarlijks voor 1 april bij Onze minister een jaarrekening in waarin rekening en verantwoording
      wordt afgelegd van het financieel beheer over het afgelopen begrotingsjaar ten aanzien van het apparaatsbudget.

      2 De jaarrekening wordt ingericht overeenkomstig het gestelde in
      [titel 9, boek 2, van het Burgerlijk Wetboek][ref1].

      3 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de Raad
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. De
      verklaring heeft mede betrekking op de rechtmatige besteding van het apparaatsbudget. Bij de aanwijzing van de
      accountant wordt bedongen dat aan Onze minister dan wel aan een door hem aangewezen accountant als bedoeld in het
      vierde lid, op diens verzoek inzicht wordt geboden in de controlewerkzaamheden van de accountant.

      4 Onze minister wijst een accountant aan die wordt belast met een onderzoek naar de controlewerkzaamheden van
      de accountant, bedoeld in het derde lid. Onze minister kan de door hem aangewezen accountant belasten met een
      onderzoek naar de doelmatigheid van het beheer, de organisatie en het beleid van de Informatie Beheer Groep. Aan
      de accountant, bedoeld in dit lid, wordt ten behoeve van een onderzoek naar de doelmatigheid desgevraagd inzage
      gegeven van de boeken en bescheiden en worden alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak
      nodig oordeelt.

      5 Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet kan Onze minister bepalen dat de
      daarmee gemoeide bedragen in mindering worden gebracht op het apparaatsbudget.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel12
