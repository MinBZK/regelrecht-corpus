  - number: '14'
    text: |-
      1 De Informatie Beheer Groep legt jaarlijks voor 1 april en zonodig tussentijds bij Onze minister rekening en
      verantwoording af van het financiële beheer van de voor de uitvoering van de in [artikel 3, eerste lid][ref1],
      genoemde regelingen beschikbare programmabudgetten.

      2 Onze minister kan met betrekking tot de programmabudgetten algemene aanwijzingen geven over het te voeren
      financieel beheer en de verantwoording daarover.

      3 Onze minister wijst een accountant aan die wordt belast met de controle van de rekening en verantwoording door
      de Informatie Beheer Groep. De accountant, genoemd in [de eerste volzin][ref2], wijdt aandacht aan de doelmatigheid
      van het beheer, de organisatie en het beleid van de Informatie Beheer Groep. Aan de accountant wordt desgevraagd
      inzage gegeven van de boeken en bescheiden en worden alle inlichtingen verstrekt die hij voor de uitvoering van
      zijn taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel14
