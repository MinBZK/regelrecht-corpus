  - number: '15'
    text: |-
      De Raad verstrekt Onze minister, dan wel, voor zover het landbouwonderwijs betreft, Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit, alle inlichtingen met betrekking tot de werkzaamheden van de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel15
  - number: '16'
    text: |-
      Onze minister kan de Raad algemene aanwijzingen geven met betrekking tot de uitvoering door de Informatie Beheer
      Groep van de regelingen, bedoeld in [artikel 3, eerste lid, onder ][ref1], alsmede, voor zover het door Onze
      minister opgedragen taken betreft, bedoeld in [artikel 3, eerste lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel16
