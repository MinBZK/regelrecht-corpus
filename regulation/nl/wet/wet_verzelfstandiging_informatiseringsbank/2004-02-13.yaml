        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '17'
    text: |-
      Onze minister, dan wel, voor zover het landbouwonderwijs betreft, Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, geeft de Informatie Beheer Groep inzage van de gegevens die bij hem berusten, voor zover die
      gegevens noodzakelijk zijn voor een goede vervulling van de taken, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel17
    references:
      - id: ref1
