preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot externe verzelfstandiging van het
    dienstonderdeel Informatiseringsbank van het Ministerie van Onderwijs en Wetenschappen door oprichting van een
    zelfstandig bestuursorgaan en in verband daarmee enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. de Raad: de Raad van Toezicht, bedoeld in [artikel 5][ref1];

      c. persoonsgebonden nummer: het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref2], dan wel het door de Informatie
      Beheer Groep uitgegeven onderwijsnummer, indien is gebleken dat aan de betrokkene niet van overheidswege een
      sociaal-fiscaalnummer is verstrekt;

      d. basisregister: het basisregister onderwijs, bedoeld in [artikel 9a][ref3].


