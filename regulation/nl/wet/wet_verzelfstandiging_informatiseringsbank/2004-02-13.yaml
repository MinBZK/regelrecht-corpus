  - number: '5'
    text: |-
      1 De Raad van Toezicht bestaat uit vijf leden, de voorzitter daaronder begrepen.

      2 De leden worden door Onze minister benoemd en ontslagen.

      3 De Raad doet Onze minister voor iedere te vervullen plaats in de Raad een voordracht van twee personen. Omtrent
      de voordracht besluiten de leden van de Raad met meerderheid van stemmen. De voorzitter of het lid neemt niet deel
      aan de vaststelling van de voordracht, indien hij wordt voorgedragen voor herbenoeming.

      4 De benoeming geschiedt voor de duur van vier jaren. De leden zijn na afloop van die periode terstond éénmaal
      herbenoembaar.

      5 De leden kunnen door Onze minister om zwaarwichtige redenen worden geschorst of tussentijds ontslagen. Voorts kan
      tussentijds ontslag op eigen verzoek van het lid van de Raad worden verleend.

      6 Bij tussentijdse beëindiging van het lidmaatschap treedt het lid dat wordt benoemd ter vervulling van een
      opengevallen plaats, af op het tijdstip waarop degene in wiens plaats hij is benoemd, had moeten aftreden. Hij is
      terstond herbenoembaar.

      7 Zolang in een vacature in de Raad niet is voorzien, vormen de overblijvende leden de Raad, met de bevoegdheden
      van de voltallige Raad.

      8 De leden hebben op persoonlijke titel zitting in de Raad en oefenen hun functie uit zonder last of ruggespraak.

      9 De Raad stelt regels vast omtrent zijn werkwijze en de openbaarheid van zijn vergaderingen. Deze regels behoeven
      de instemming van Onze minister.

      10 Onverminderd het bepaalde in het zevende lid, kan de Raad geen rechtsgeldige besluiten nemen indien niet
      tenminste vier leden ter vergadering aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel5
  - number: '6'
    text: |-
      1 De Informatie Beheer Groep draagt zorg voor de administratieve ondersteuning van de Raad.

      2 Onze minister kent de leden van de Raad, ten laste van de Informatie Beheer Groep, een vergoeding toe voor hun
      werkzaamheden.

      3 De leden van de Raad hebben aanspraak op vergoeding door de Informatie Beheer Groep van de door hen in de
      uitoefening van hun functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel6
  - number: '7'
    text: |-
      1 De hoofddirectie bestaat uit ten hoogste drie leden.

      2 De leden van de hoofddirectie worden aangesteld, geschorst en ontslagen door de Raad. De aanstelling is voor
      onbepaalde tijd.

      3 Bij schorsing of ontstentenis van een lid van de hoofddirectie voorziet de Raad in de waarneming van diens
      functie. De leden van de Raad zijn van waarneming uitgesloten.

      4 De leden van de hoofddirectie vertegenwoordigen de Informatie Beheer Groep in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006320/2004-02-13#Artikel7
  - number: '8'
    text: |-
      1 De hoofddirectie is verantwoording verschuldigd aan de Raad. Zij verstrekt de Raad alle inlichtingen en andere
      gegevens over de uitvoering van haar taken.

      2 De hoofddirectie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de Raad aanleiding
      bestaat, aan de Raad verantwoording af over het door haar gevoerde beleid.

      3 De hoofddirectie stelt regels vast omtrent:

      a. de inrichting en de wijze van bedrijfsvoering van de Informatie Beheer Groep,

      b. de onderlinge verdeling van de werkzaamheden, en

      c. de afbakening van de bevoegdheden tussen de hoofddirectie en de Raad.

      De regels, bedoeld in de onderdelen b en c, behoeven de instemming onderscheidenlijk goedkeuring van de Raad.

      4 Goedkeuring dan wel instemming van de Raad behoeven de besluiten dan wel beslissingen van de hoofddirectie
      betreffende:

      a. de regels, bedoeld in [artikelen 9, tweede lid][ref1], en [9d, derde lid][ref2];

      b. de investeringen die buiten de door de Raad vast te stellen grenzen vallen;

      c. de apparaatskostenbegroting, bedoeld in [artikel 11][ref3];

      d. de jaarrekening en het jaarverslag, bedoeld in respectievelijk [artikel 12][ref4] en [artikel 19][ref5];

      e. wijzigingen in de rechtspositie van het personeel;

      f. het meerjarenbeleidsplan;

      g. het verrichten van andere taken als bedoeld in [artikel 3, tweede lid][ref6], alsmede over de ten aanzien van
      die taken te hanteren tarieven.

      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.

      5 Indien binnen vier weken na ontvangst van het besluit dan wel de beslissing door de Raad niet anders is beslist,
      wordt de Raad geacht te hebben goedgekeurd onderscheidenlijk ingestemd.


