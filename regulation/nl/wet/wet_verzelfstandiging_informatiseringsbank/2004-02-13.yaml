        artikel: '13'
  - number: 9d
    text: |-
      1 Uit het basisregister kunnen persoonsgegevens worden verstrekt aan de betrokkene en diens wettelijke
      vertegenwoordiger, alsmede aan de school of instelling waar de betrokkene als leerling, deelnemer, student
      of extraneus is of was ingeschreven, voorzover de gegevens betrekking hebben op de periode waarin hij aan de
      desbetreffende school of instelling is of was ingeschreven.

      2 Binnen de organisatie van de Informatie Beheer Groep worden uit het basisregister uitsluitend persoonsgegevens
      verstrekt aan personen of organen, voorzover dat:

      a. bij wet is vereist of wordt toegestaan; of

      b. in het belang is van de uitoefening van de taken, bedoeld in [artikel 3, eerste lid][ref1], en de persoonlijke
      levenssfeer van de betrokkene daardoor niet onevenredig wordt geschaad.

      3 De hoofddirectie stelt, met inachtneming van het bepaalde krachtens [artikel 9c][ref2], regels omtrent de wijze
      van verstrekking van gegevens aan de personen of organen, bedoeld in het tweede lid, en omtrent de toegang van deze
      personen of organen tot het basisregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9c
