        bwb_id: BWBR0002399
        artikel: 103b
  - number: 9b.2.d
    text: |-
      [artikel 2.3.6a, derde en zesde lid][ref1], of
      [2.5.5a, tweede of zevende lid, van de Wet educatie en beroepsonderwijs][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
