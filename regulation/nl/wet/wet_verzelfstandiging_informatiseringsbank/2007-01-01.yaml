preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot externe verzelfstandiging van het
    dienstonderdeel Informatiseringsbank van het Ministerie van Onderwijs en Wetenschappen door oprichting van een
    zelfstandig bestuursorgaan en in verband daarmee enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      de Raad: de Raad van Toezicht, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '5'
        hoofdstuk: II
  - number: 1.c
    text: |-
      persoonsgebonden nummer: het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref1], dan wel het door de Informatie
      Beheer Groep uitgegeven onderwijsnummer, indien is gebleken dat aan de betrokkene niet van overheidswege een
      sociaal-fiscaalnummer is verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 1.d
    text: |-
      basisregister: het basisregister onderwijs, bedoeld in [artikel 9a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
        hoofdstuk: IIA
  - number: '2.1'
    text: Er is een Informatie Beheer Groep, die is gevestigd te Groningen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel2
  - number: '2.2'
    text: De Informatie Beheer Groep bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel2
  - number: '3.1'
    text: 'De Informatie Beheer Groep is belast met de uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de [Algemene wet erkenning EG-beroepsopleidingen][ref1], de
      [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2], de [Les- en cursusgeldwet][ref3],
      de [Wet educatie en beroepsonderwijs][ref4], de [Wet op de expertisecentra][ref5], de
      [Wet op de studiefinanciering][ref6], de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7],
      de [Wet op het primair onderwijs][ref8], de [Wet op het voortgezet onderwijs][ref9], de
      [Wet studiefinanciering 2000][ref10], de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref11], alsmede de
      Wet tegemoetkoming studiekosten;


      [ref1]: https://wetten.overheid.nl/BWBR0006781
      [ref2]: https://wetten.overheid.nl/BWBR0006317
      [ref3]: https://wetten.overheid.nl/BWBR0004188
      [ref4]: https://wetten.overheid.nl/BWBR0007625
      [ref5]: https://wetten.overheid.nl/BWBR0003549
      [ref6]: https://wetten.overheid.nl/BWBR0003955
      [ref7]: https://wetten.overheid.nl/BWBR0008573
      [ref8]: https://wetten.overheid.nl/BWBR0003420
      [ref9]: https://wetten.overheid.nl/BWBR0002399
      [ref10]: https://wetten.overheid.nl/BWBR0011453
      [ref11]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
    references:
      - id: ref1
