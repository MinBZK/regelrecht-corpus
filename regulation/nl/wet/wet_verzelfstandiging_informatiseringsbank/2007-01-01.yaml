  - number: 9a.2
    text: |-
      Met betrekking tot de verwerking van persoonsgegevens, bedoeld in dit hoofdstuk, is de hoofddirectie van de
      Informatie Beheer Groep de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1].


