        artikel: '7'
  - number: 9b.3
    text: |-
      De persoonsgegevens van de leerlingen, deelnemers, studenten en extraneï die niet langer zijn ingeschreven aan
      een school of instelling als bedoeld in het eerste lid, onder a tot en met f, worden tot vijf jaren na beëindiging
      van de laatste inschrijving bewaard in het basisregister in een vorm die het mogelijk maakt de betrokkene te
      identificeren. [Artikel 10, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is niet van toepassing.
      In afwijking van de eerste volzin geldt voor de geslachtsnaam, voornamen, geboortedatum, instelling voor hoger
      onderwijs waar een opleiding is gevolgd, naam van die opleiding, datum diploma en het aantal jaren genoten hoger
      onderwijs van studenten die niet langer zijn ingeschreven aan een instelling als bedoeld in het eerste lid, onder
      f, een bewaartermijn van vijftig jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel10
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '10'
  - number: 9c
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de technische en organisatorische
      maatregelen, bedoeld in [artikel 13 van de Wet bescherming persoonsgegevens][ref1], die de hoofddirectie ten
      uitvoer moet leggen om de in het basisregister opgenomen persoonsgegevens te beveiligen tegen verlies of tegen
      enige vorm van onrechtmatige verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel13
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '13'
  - number: 9d.1
    text: |-
      Uit het basisregister kunnen persoonsgegevens worden verstrekt aan de betrokkene en diens wettelijke
      vertegenwoordiger, alsmede aan de school of instelling waar de betrokkene als leerling, deelnemer, student
      of extraneus is of was ingeschreven, voorzover de gegevens betrekking hebben op de periode waarin hij aan de
      desbetreffende school of instelling is of was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9d
  - number: 9d.2
    text: |-
      Binnen de organisatie van de Informatie Beheer Groep worden uit het basisregister uitsluitend persoonsgegevens
      verstrekt aan personen of organen, voorzover dat:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9d
  - number: 9d.2.a
    text: bij wet is vereist of wordt toegestaan; of
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9d
  - number: 9d.2.b
    text: |-
      in het belang is van de uitoefening van de taken, bedoeld in [artikel 3, eerste lid][ref1], en de persoonlijke
      levenssfeer van de betrokkene daardoor niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: 9d.3
    text: |-
      De hoofddirectie stelt, met inachtneming van het bepaalde krachtens [artikel 9c][ref1], regels omtrent de wijze
      van verstrekking van gegevens aan de personen of organen, bedoeld in het tweede lid, en omtrent de toegang van deze
      personen of organen tot het basisregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9c
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9c
        hoofdstuk: IIA
  - number: 9e.1
    text: |-
      Uit het basisregister worden kosteloos persoonsgegevens en andere gegevens verstrekt aan Onze minister en de
      inspectie van het onderwijs dan wel, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw
      en de natuurlijke omgeving, aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit en de inspectie van het
      landbouwonderwijs, voorzover dat bij wet is vereist of wordt toegestaan.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.2
    text: |-
      Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt aan burgemeester en
      wethouders, voorzover dat verplicht is op grond van [artikel 64 van de Wet werk en bijstand][ref1],
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel45
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '45'
  - number: 9e.3
    text: |-
      Uit het basisregister kunnen maandelijks aan burgemeester en wethouders de naam, het adres, het sociaal-
      fiscaalnummer, de behaalde diploma’s, het laatst genoten onderwijs, de laatst bezochte school of instelling en de
      data van in- en uitschrijving bij die school of instelling worden verstrekt van degenen van wie in de voorafgaande
      maand een in- of uitschrijving is verwerkt in het basisregister en die
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.3.a
    text: |-
      woonachtig zijn in de desbetreffende gemeente of in een gemeente die behoort tot de regio waarvan de desbetreffende
      gemeente contactgemeente is als bedoeld in [artikel 162b, derde lid, van de Wet op de expertisecentra][ref1],
      [118h, derde lid, van de Wet op het voortgezet onderwijs][ref2] en
      [8.3.2, derde lid, van de Wet educatie en beroepsonderwijs][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
