        artikel: '8'
  - number: 9e.3.b
    text: ouder dan vier jaar en jonger dan 23 jaar zijn,
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.3.c
    text: beschikken over een sociaal-fiscaalnummer en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.3.d
    text: |-
      nog niet in het bezit zijn van een diploma voorbereidend wetenschappelijk onderwijs of
      hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref2], dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9e.4
    text: |-
      De Informatie Beheer Groep kan desgevraagd aan burgemeester en wethouders meedelen of een persoon die voldoet aan
      de voorwaarden, genoemd in het derde lid, onderdelen a en b, ook voldoet aan de voorwaarde, genoemd in het derde
      lid, onderdeel d. Daarbij kan de Informatie Beheer Groep desgevraagd tevens de gegevens, bedoeld in de aanhef van
      het derde lid, verstrekken.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.5
    text: |-
      Uit het basisregister worden persoonsgegevens verstrekt aan door de minister aangewezen instellingen ten behoeve
      van onderzoeksactiviteiten naar de kwaliteit en de toegankelijkheid van het beroepsonderwijs, de educatie en het
      hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.6
    text: |-
      Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt aan de Sociale Verzekeringsbank,
      voorzover dat noodzakelijk is voor de uitvoering van de [Algemene Kinderbijslagwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 9e.7
    text: |-
      Uit het basisregister worden kosteloos persoonsgegevens aan het Centraal bureau voor de statistiek verstrekt. Het
      Centraal bureau voor de statistiek gebruikt deze gegevens in ieder geval om:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.7.a
    text: |-
      Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van de
      beleidsvoorbereiding; en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.7.b
    text: |-
      de gemeenten gegevens te verstrekken ten behoeve van de toekenning van bedragen aan instellingen, bedoeld
      in [artikel 2.3.4 van de Wet educatie en beroepsonderwijs][ref1], en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 9e.8
    text: |-
      Het Centraal bureau voor de statistiek mag de gegevens die het op grond van het zevende lid heeft ontvangen,
      openbaar maken in de vorm van overzichten die betrekking hebben op afzonderlijke scholen, instellingen of
      opleidingen, mits aan deze overzichten geen herkenbare gegevens over een afzonderlijk persoon of een afzonderlijk
      huishouden kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
  - number: 9e.9
    text: |-
      Onverminderd [artikel 178d van de Wet op het primair onderwijs][ref1],
      [artikel 164d van de Wet op de expertisecentra][ref2], [artikel 103e van de Wet op het voortgezet onderwijs][ref3],
      [artikel 2.5.5d van de Wet educatie en beroepsonderwijs][ref4] en
      [artikel 7.52c van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], wordt aan de instellingen
      en organen, genoemd in het eerste tot en met het zevende lid, geen rechtstreekse toegang tot het basisregister
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel178d
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel164d
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103e
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 178d
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 164d
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 103e
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 9e.10
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister geen persoonsgebonden nummer van een leerling,
      deelnemer, student of extraneus ter uitvoering van [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '10.1'
    text: |-
      Onze minister stelt jaarlijks aan de Informatie Beheer Groep ten laste van de begroting van het Ministerie
      van Onderwijs, Cultuur en Wetenschap middelen ter beschikking ten behoeve van de vervulling van haar taken,
      voortvloeiend uit [artikel 3, eerste lid, onder a, b en c][ref1], alsmede, voor zover opgedragen door Onze
      minister, voortvloeiend uit [artikel 3, eerste lid, onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '10.2'
    text: |-
      Onze Minister stelt jaarlijks voor 1 september, na overleg met de Informatie Beheer Groep en onder voorbehoud van
      goedkeuring van de in het eerste lid bedoelde begroting, een voorlopig bedrag vast dat voor het daaropvolgende
      kalenderjaar aan de Informatie Beheer Groep ter beschikking zal worden gesteld. Hij neemt dit bedrag op in het
      voorstel van wet tot vaststelling van die begroting.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 31 december in overeenstemming met de Informatie Beheer Groep de in het
      daaropvolgende kalenderjaar te realiseren prestatie- en kwaliteitsdoelen vast. Voorts stelt hij onder voorbehoud
      van goedkeuring van de in het eerste lid bedoelde begroting het definitieve bedrag vast dat voor het daaropvolgende
      kalenderjaar aan de Informatie Beheer Groep ter beschikking zal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
  - number: '10.4'
    text: Het boekjaar van de Informatie Beheer Groep valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
  - number: '10.5'
    text: |-
      Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste lid, niet in werking is getreden, verstrekt
      Onze minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, een voorschot aan de Informatie
      Beheer Groep, in de vorm van maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
  - number: '10.6'
    text: |-
      De Informatie Beheer Groep trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van
      de vorige volzin is het de Informatie Beheer Groep toegestaan dergelijke gelden bij het Rijk op te nemen onder de
      voorwaarden van de [Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: '10.7'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie stelt jaarlijks aan de Informatie Beheer Groep ten laste van
      de begroting van het Ministerie van Justitie middelen ter beschikking ten behoeve van de vervulling van haar taken,
      voortvloeiend uit [artikel 3, eerste lid, onder d][ref1]. Het tweede lid, met uitzondering van de laatste volzin,
      en het derde tot en met het vijfde lid zijn van overeenkomstige toepassing, met dien verstande dat voor «Onze
      minister» telkens wordt gelezen: Onze Minister voor Vreemdelingenzaken en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '11.1'
    text: |-
      De apparaatskostenbegroting van de Informatie Beheer Groep bevat een raming van alle baten en lasten, de
      investeringsuitgaven en de financiering. De ramingen worden zoveel mogelijk onderbouwd aan de hand van
      kostencomponenten en prestatie-elementen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel11
  - number: '11.2'
    text: 'De begroting bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel11
  - number: 11.2.a
    text: de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel11
  - number: 11.2.b
    text: de financiële paragraaf uit het meerjarenbedrijfsplan.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Raad stelt jaarlijks een jaarrekening vast en dient deze voor 1 mei in bij Onze Minister. Van de jaarrekening
      maakt de in het zesde lid bedoelde afrekening deel uit. De jaarrekening behoeft de instemming van Onze Minister,
      welke instemming niet wordt gegeven dan nadat Onze Minister voor Vreemdelingenzaken en Integratie met de in het
      zesde lid bedoelde afrekening heeft ingestemd. Instemming kan slechts worden onthouden wegens strijd met het recht.
      In de jaarrekening wordt rekening en verantwoording afgelegd over het financieel beheer over het afgelopen boekjaar
      ten aanzien van het apparaatsbudget.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      De hoofddirectie stelt de jaarrekening op. De jaarrekening wordt ingericht overeenkomstig het gestelde in
      [titel 9, boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '12.3'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de Raad
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De
      verklaring heeft mede betrekking op de rechtmatige besteding van het apparaatsbudget. Bij de aanwijzing van de
      accountant wordt bedongen dat aan Onze minister dan wel aan een door hem aangewezen accountant als bedoeld in het
      vierde lid, op diens verzoek inzicht wordt geboden in de controlewerkzaamheden van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '12.4'
    text: |-
      Onze minister wijst een accountant aan die wordt belast met een onderzoek naar de controlewerkzaamheden van
      de accountant, bedoeld in het derde lid. Onze minister kan de door hem aangewezen accountant belasten met een
      onderzoek naar de doelmatigheid van het beheer, de organisatie en het beleid van de Informatie Beheer Groep. Aan
      de accountant, bedoeld in dit lid, wordt ten behoeve van een onderzoek naar de doelmatigheid desgevraagd inzage
      gegeven van de boeken en bescheiden en worden alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet kan Onze minister bepalen dat de
      daarmee gemoeide bedragen in mindering worden gebracht op het apparaatsbudget.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
  - number: '12.6'
    text: |-
      De hoofddirectie stelt jaarlijks een afrekening op waarin rekening en verantwoording wordt afgelegd over het
      financieel beheer over het afgelopen begrotingsjaar ten aanzien van het apparaatsbudget, voorzover het de middelen
      betreft die zijn aangewend ter vervulling van de taken, voortvloeiend uit [artikel 3, eerste lid, onder d][ref1],
      en dient deze voor 1 april bij Onze Minister voor Vreemdelingenzaken en Integratie in. Het tweede lid, tweede
      volzin, derde lid, vierde lid, eerste volzin, en vijfde lid zijn van overeenkomstige toepassing, met dien verstande
      dat voor «Onze minister» telkens wordt gelezen: Onze Minister voor Vreemdelingenzaken en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '13.1'
    text: |-
      De kosten van de uitkeringen, vergoedingen en tegemoetkomingen die worden verstrekt op grond van de in
      [artikel 3][ref1] bedoelde regelingen, komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '13.2'
    text: |-
      De ontvangsten voortvloeiend uit de uitvoering van de in [artikel 3][ref1] bedoelde regelingen, komen ten gunste
      van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '14.1'
    text: |-
      De Informatie Beheer Groep legt jaarlijks voor 1 maart en zonodig tussentijds bij Onze minister
      rekening en verantwoording af van het financiële beheer van de voor de uitvoering van de in
      [artikel 3, eerste lid, onder a tot en met c][ref1] bedoelde regelingen beschikbare programmabudgetten.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '14.2'
    text: |-
      Onze minister kan met betrekking tot de programmabudgetten algemene aanwijzingen geven over het te voeren
      financieel beheer en de verantwoording daarover.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel14
  - number: '14.3'
    text: |-
      Onze minister wijst een accountant aan die wordt belast met de controle van de rekening en verantwoording door de
      Informatie Beheer Groep. De accountant, genoemd in de eerste volzin, wijdt aandacht aan de doelmatigheid van het
      beheer, de organisatie en het beleid van de Informatie Beheer Groep. Aan de accountant wordt desgevraagd inzage
      gegeven van de boeken en bescheiden en worden alle inlichtingen verstrekt die hij voor de uitvoering van zijn taak
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel14
  - number: '14.4'
    text: |-
      De Informatie Beheer Groep legt jaarlijks voor 1 maart en zo nodig tussentijds bij Onze Minister voor
      Vreemdelingenzaken en Integratie rekening en verantwoording af van het financiële beheer van de voor de uitvoering
      van de in [artikel 3, eerste lid, onder d][ref1], bedoelde regelingen beschikbare programmabudgetten. Het tweede en
      derde lid zijn van overeenkomstige toepassing, met dien verstande dat voor «Onze minister» telkens wordt gelezen:
      Onze Minister voor Vreemdelingenzaken en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '15'
    text: |-
      De Raad verstrekt Onze minister, dan wel, voor zover het landbouwonderwijs betreft, Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit, dan wel, voor zover het de uitvoering van de taken, bedoeld in
      [artikel 3, eerste lid, onder d][ref1], betreft, Onze Minister voor Vreemdelingenzaken en Integratie, alle
      inlichtingen met betrekking tot de werkzaamheden van de Informatie Beheer Groep.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      Onze minister kan de Raad algemene aanwijzingen geven met betrekking tot de uitvoering door de Informatie Beheer
      Groep van de regelingen, bedoeld in [artikel 3, eerste lid, onder a en b][ref1], alsmede, voor zover het door Onze
      minister opgedragen taken betreft, bedoeld in [artikel 3, eerste lid, onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '16.2'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie kan de Raad algemene aanwijzingen geven met betrekking tot de
      uitvoering door de Informatie Beheer Groep van de regelingen, bedoeld in [artikel 3, eerste lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '17'
    text: |-
      Onze minister, dan wel, voor zover het landbouwonderwijs betreft, Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit, dan wel, voor zover het de uitvoering van de taken, bedoeld in
      [artikel 3, eerste lid, onder d][ref1], betreft, Onze Minister voor Vreemdelingenzaken en Integratie, geeft de
      Informatie Beheer Groep inzage van de gegevens die bij hem berusten, voor zover die gegevens noodzakelijk zijn voor
      een goede vervulling van de taken, bedoeld in [artikel 3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '18.1'
    text: |-
      Onze minister stelt na overleg met de Informatie Beheer Groep een informatiestatuut vast. Het informatiestatuut
      bevat regels met betrekking tot de informatievoorziening tussen Onze minister en de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie stelt na overleg met de Informatie Beheer Groep een
      informatiestatuut vast. Het informatiestatuut bevat regels met betrekking tot de informatievoorziening tussen Onze
      Minister voor Vreemdelingenzaken en Integratie en de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel18
  - number: '19.1'
    text: 'De Informatie Beheer Groep stelt jaarlijks voor 1 mei een verslag op over het afgelopen kalenderjaar van:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel19
  - number: 19.1.a
    text: haar werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel19
  - number: 19.1.b
    text: het gevoerde beheer en beleid, en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel19
  - number: 19.1.c
    text: de kwaliteit van haar dienstverlening jegens opdrachtgever en burger.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel19
  - number: '19.2'
    text: |-
      In het jaarverslag wordt in ieder geval aandacht besteed aan de doelmatigheid en doeltreffendheid van de wijze
      waarop in het afgelopen kalenderjaar de technische en organisatorische maatregelen, bedoeld in [artikel 9c][ref1],
      ten uitvoer zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9c
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9c
        hoofdstuk: IIA
  - number: '20.1'
    text: |-
      Indien de Informatie Beheer Groep haar taken, voortvloeiend uit [artikel 3, eerste lid, onder a, b, c en e][ref1],
      naar het oordeel van Onze minister verwaarloost, kan deze voorzieningen treffen. Onze minister doet hiervan
      terstond mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '20.3'
    text: |-
      Indien de Informatie Beheer Groep haar taken, voortvloeiend uit [artikel 3, eerste lid, onder d][ref1], naar het
      oordeel van Onze Minister voor Vreemdelingenzaken en Integratie verwaarloost, kan deze voorzieningen treffen. Onze
      Minister voor Vreemdelingenzaken en Integratie doet hiervan terstond mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '28.1'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet zijn de ambtenaren van het Ministerie van Onderwijs en
      Wetenschappen, die werkzaam zijn bij het dienstonderdeel Informatiseringsbank, van wie de naam is vermeld op een
      door Onze minister en de Informatiseringsbank gezamenlijk vastgestelde lijst, van rechtswege in dienst van de
      Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel28
  - number: '28.2'
    text: |-
      De overgang van de in het eerste lid bedoelde ambtenaren vindt plaats in dezelfde salarispositie, op dezelfde voet
      en ook overigens in dezelfde rechtstoestand als voor elk van die ambtenaren gold bij het Ministerie van Onderwijs
      en Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel28
  - number: '28.3'
    text: |-
      Op de overgang, bedoeld in het tweede lid, is het sociaal beleidskader ter zake van de reorganisatie van het
      Ministerie van Onderwijs en Wetenschappen in 1991 van toepassing. De verplichtingen die voortvloeien uit dit
      sociaal beleidskader gaan over op de Informatie Beheer Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel28
  - number: '29.1'
    text: |-
      Bezittingen, rechten en verplichtingen van de Staat der Nederlanden, die kennelijk zijn verworven,
      onderscheidenlijk aangegaan ten behoeve van het dienstonderdeel Informatiseringsbank van het Ministerie van
      Onderwijs en Wetenschappen, gaan voor zover zij zijn opgenomen in een door Onze minister in overeenstemming met de
      Informatiseringsbank op te stellen lijst en voor zover nodig voorzien van in die lijst op te nemen garanties, vanaf
      de datum van inwerkingtreding van deze wet over op de Informatie Beheer Groep zonder dat daarvoor een nadere akte
      of betekening wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel29
  - number: '29.2'
    text: De Informatie Beheer Groep verkrijgt de door de Staat der Nederlanden aan haar toegescheiden bezittingen om niet.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel29
  - number: '30'
    text: |-
      Lopende wettelijke procedures of rechtsgedingen omtrent de toepassing van de regelingen genoemd in
      [artikel 3, eerste lid][ref1], waarbij de diensteenheid Informatiseringsbank van het Ministerie van Onderwijs en
      Wetenschappen namens Onze minister optreedt, dan wel vorderingen van Onze minister voortvloeiend uit de regelingen,
      genoemd in [artikel 3, eerste lid][ref2], worden met ingang van de datum van inwerkingtreding van deze wet door de
      Informatie Beheer Groep voortgezet, onderscheidenlijk overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: 30a.1
    text: |-
      In aanvulling op [artikel 3, eerste lid, onderdelen a en b][ref1], is de Informatie Beheer Groep belast met het
      verrichten van alle activiteiten die samenhangen met renteloze voorschotten die aan studerenden zijn verstrekt op
      grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: 30a.1.a
    text: het Reglement rijksstudietoelagen 1960;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30a
  - number: 30a.1.b
    text: het Besluit studietoelagen WVO;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30a
  - number: 30a.1.c
    text: |-
      [artikel 7 van de Experimentenwet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel7
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '7'
  - number: 30a.2
    text: |-
      In aanvulling op [artikel 3, eerste lid, onderdelen a en b][ref1], is de Informatie Beheer Groep belast met het
      verrichten van alle activiteiten die samenhangen met verstrekkingen waarop door studerenden aanspraak is gemaakt op
      grond van de Regeling tegemoetkoming studiekosten TS 17- en de Regeling tegemoetkoming studiekosten TS 21+, zoals
      vastgesteld op grond van [artikel 121 van de Wet op het voortgezet onderwijs][ref2], van het Besluit studietoelagen
      WVO en op grond van [artikel 7 van de Experimentenwet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0002718#Artikel7
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0002718
        artikel: '7'
  - number: '31.1'
    text: |-
      Onze minister draagt zorg dat binnen 2 maanden na het tijdstip van inwerkingtreding van deze wet een Raad van
      Toezicht tot stand komt overeenkomstig [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '5'
        hoofdstuk: II
  - number: '31.2'
    text: |-
      Bij de eerste samenstelling van de Raad benoemt Onze minister, in afwijking van
      [artikel 5, derde lid, de leden][ref1], waaronder de voorzitter, zonder dat de Raad is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '5'
        hoofdstuk: II
  - number: '32'
    text: |-
      In afwijking van de benoemingstermijn van de leden van de Raad, genoemd in [artikel 5, vierde lid][ref1], worden
      bij de eerste samenstelling van de Raad twee leden voor een periode van twee jaren benoemd. Zij zijn terstond
      herbenoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '5'
        hoofdstuk: II
  - number: '36'
    text: |-
      Onze minister zendt binnen 5 jaar na de inwerkingtreding van deze wet, en vervolgens telkens na 5 jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel36
  - number: '37'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1994. Indien het *Staatsblad* waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 1993, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel37
  - number: '38'
    text: 'Deze wet kan worden aangehaald als: Wet verzelfstandiging Informatiseringsbank.'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel38
