    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9b
  - number: 9b.1.h
    text: |-
      de gegevens over het verblijfsrecht van de vreemdeling zoals die over de personen, bedoeld in de onderdelen e en f,
      zijn opgenomen in de gemeentelijke basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9b
  - number: 9b.2
    text: |-
      Indien de in het eerste lid, onderdeel g, bedoelde gegevens van een leerling, deelnemer, student of extraneus
      aan een school of instelling als bedoeld in het eerste lid, onder a tot en met f, niet zijn opgenomen in de
      gemeentelijke basisadministratie persoonsgegevens worden in het basisregister alleen opgenomen de gegevens die het
      bevoegd gezag verstrekt op basis van
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9b
  - number: 9b.2.a
    text: |-
      [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref1],


