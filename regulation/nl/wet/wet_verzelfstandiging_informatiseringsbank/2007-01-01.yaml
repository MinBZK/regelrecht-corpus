  - number: '9.4'
    text: |-
      Indien de hoofddirectie in gebreke blijft bij de vaststelling van de in het tweede lid bedoelde regels, is Onze
      minister bevoegd de Raad uit te nodigen die regels vast te stellen. Blijft ook de Raad in gebreke, dan geschiedt de
      vaststelling van bedoelde regels door Onze minister.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: 9a.1
    text: 'Er is een basisregister onderwijs, dat ten doel heeft:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
  - number: 9a.1.a
    text: |-
      Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van
      de bekostiging van scholen en instellingen en de begrotings- en beleidsvoorbereiding, alsmede de planning en
      bekostiging van de instellingen voor hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
  - number: 9a.1.b
    text: |-
      de Informatie Beheer Groep gegevens te verstrekken ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: 9a.1.c
    text: |-
      de inspectie van het onderwijs en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de
      natuurlijke omgeving, de inspectie van het landbouwonderwijs, gegevens te verstrekken ten behoeve van het toezicht
      op het onderwijs; en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
  - number: 9a.1.d
    text: |-
      het Centraal bureau voor de statistiek gegevens te verstrekken teneinde het Centraal bureau voor de statistiek in
      staat te stellen:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
  - number: 9a.1.d.1°
    text: |-
      Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van de
      beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
  - number: 9a.1.d.2°
    text: |-
      de gemeenten gegevens te verstrekken ten behoeve van de toekenning van bedragen aan instellingen, bedoeld
      in [artikel 2.3.4 van de Wet educatie en beroepsonderwijs][ref1], en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9a
    references:
