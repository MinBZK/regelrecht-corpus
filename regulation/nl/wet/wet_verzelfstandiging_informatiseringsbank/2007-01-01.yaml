      - id: ref11
        bwb_id: BWBR0012438
  - number: 3.1.b
    text: de op de onder a genoemde wetten gebaseerde algemene maatregelen van bestuur en ministeriële regelingen;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.1.c
    text: het beheer van het basisregister;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.1.d
    text: |-
      de bij de [Wet inburgering][ref1] en daarop gebaseerde algemene maatregelen van bestuur en ministeriële regelingen
      aan de Informatie Beheer Groep opgedragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 3.1.e
    text: andere bij de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Informatie Beheer Groep kan met toestemming van Onze minister andere taken uitvoeren, dan die welke rechtstreeks
      voortvloeien uit de in het eerste lid genoemde, mits deze taken:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.2.a
    text: |-
      liggen op het terrein van de uitvoering van bestuurlijke taken en nauw verband houden met de in het eerste lid
      genoemde taken van de Informatie Beheer Groep;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.2.b
    text: |-
      toepassingen met zich brengen van produktiemiddelen, die de Informatie Beheer Groep voor de vervulling van haar in
      het eerste lid genoemde taken, voorhanden heeft;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.2.c
    text: niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3.2.d
    text: tegen kostendekkende tarieven worden verricht.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: '3.3'
    text: Onze minister kan bij het verlenen van de toestemming, bedoeld in het tweede lid, voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3
  - number: 3a
    text: |-
      Voor het oprichten van of deelnemen in andere rechtspersonen door de Informatie Beheer Groep is voorafgaande
      toestemming van Onze Minister en van Onze Minister van Financiën vereist. Onze Minister past daarbij
      [artikel 34 van de Comptabiliteitswet 2001][ref1] overeenkomstig toe.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
  - number: 3b
    text: |-
      De Informatie Beheer Groep kan bij de uitoefening van de taken, bedoeld in [artikel 3, eerste lid][ref1], het
      persoonsgebonden nummer van een persoon gebruiken als registratienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.1'
    text: De bestuursorganen van de Informatie Beheer Groep zijn de Raad van Toezicht en de hoofddirectie.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      De Raad ziet toe op de werkzaamheden van de hoofddirectie en staat die met raad terzijde. Hij kan aan
      de hoofddirectie algemene aanwijzingen geven met betrekking tot de uitvoering van de taken, bedoeld in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.3'
    text: |-
      De hoofddirectie is belast met de dagelijkse leiding van de Informatie Beheer Groep. Zij draagt zorg voor een goede
      uitvoering van de taken, bedoeld in [artikel 3][ref1], en voor een goede kwaliteit van de dienstverlening van de
      Informatie Beheer Groep.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.4'
    text: |-
      De hoofddirectie oefent de taken en bevoegdheden uit die bij of krachtens de wet aan de Informatie Beheer Groep
      zijn opgedragen, voor zover bij of krachtens deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel4
  - number: '5.1'
    text: De Raad van Toezicht bestaat uit vijf leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      De leden worden door Onze Minister benoemd, de Raad gehoord. Een van de leden heeft affiniteit met de
      studentenwereld. Wat dit lid betreft, worden tevens de daarvoor in aanmerking komende belangenorganisaties van
      studenten gehoord.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      De benoeming geschiedt voor de duur van vier jaren. De leden zijn na afloop van die periode terstond éénmaal
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.4'
    text: |-
      De leden kunnen door Onze minister om zwaarwichtige redenen worden geschorst of tussentijds ontslagen. Voorts kan
      tussentijds ontslag op eigen verzoek van het lid van de Raad worden verleend.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij tussentijdse beëindiging van het lidmaatschap wordt het lid dat ter vervulling van de opengevallen plaats wordt
      benoemd, benoemd voor de duur van vier jaren. Dit lid is na afloop van die periode terstond éénmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.6'
    text: |-
      Zolang in een vacature in de Raad niet is voorzien, vormen de overblijvende leden de Raad, met de bevoegdheden van
      de voltallige Raad.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.7'
    text: De leden hebben op persoonlijke titel zitting in de Raad en oefenen hun functie uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.8'
    text: |-
      De Raad stelt regels vast omtrent zijn werkwijze en de openbaarheid van zijn vergaderingen. Deze regels behoeven de
      instemming van Onze minister.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '5.9'
    text: |-
      Onverminderd het bepaalde in het zesde lid, kan de Raad geen rechtsgeldige besluiten nemen indien niet tenminste
      vier leden ter vergadering aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel5
  - number: '6.1'
    text: De Informatie Beheer Groep draagt zorg voor de administratieve ondersteuning van de Raad.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze minister kent de leden van de Raad, ten laste van de Informatie Beheer Groep, een vergoeding toe voor hun
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel6
  - number: '6.3'
    text: |-
      De leden van de Raad hebben aanspraak op vergoeding door de Informatie Beheer Groep van de door hen in de
      uitoefening van hun functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel6
  - number: '7.1'
    text: De hoofddirectie bestaat uit ten hoogste drie leden.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      De leden van de hoofddirectie worden aangesteld, geschorst en ontslagen door de Raad. De aanstelling is voor
      onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij schorsing of ontstentenis van een lid van de hoofddirectie voorziet de Raad in de waarneming van diens functie.
      De leden van de Raad zijn van waarneming uitgesloten.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7
  - number: '7.4'
    text: De leden van de hoofddirectie vertegenwoordigen de Informatie Beheer Groep in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7
  - number: 7a.1
    text: |-
      Een lid van de hoofddirectie vervult geen nevenfuncties die ongewenst zijn met het oog op een goede vervulling van
      zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Een lid van de hoofddirectie meldt het voornemen tot het aanvaarden van een nevenfunctie anders dan uit hoofde van
      zijn functie aan de Raad.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Nevenfuncties van een lid van de hoofddirectie anders dan uit hoofde van zijn functie worden openbaar gemaakt.
      Openbaarmaking geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij de Informatie Beheer
      Groep.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel7a
  - number: '8.1'
    text: |-
      De hoofddirectie is verantwoording verschuldigd aan de Raad. Zij verstrekt de Raad alle inlichtingen en andere
      gegevens over de uitvoering van haar taken.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: '8.2'
    text: |-
      De hoofddirectie legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de Raad aanleiding
      bestaat, aan de Raad verantwoording af over het door haar gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: '8.3'
    text: 'De hoofddirectie stelt regels vast omtrent:'
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.3.a
    text: de inrichting en de wijze van bedrijfsvoering van de Informatie Beheer Groep,
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.3.b
    text: de onderlinge verdeling van de werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.3.c
    text: de afbakening van de bevoegdheden tussen de hoofddirectie en de Raad.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: '8.4'
    text: |-
      Goedkeuring dan wel instemming van de Raad behoeven de besluiten dan wel beslissingen van de hoofddirectie
      betreffende:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.4.a
    text: |-
      de regels, bedoeld in [artikelen 9, tweede lid][ref1], en [9d, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9d
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006320
        artikel: 9d
        hoofdstuk: IIA
  - number: 8.4.b
    text: de investeringen die buiten de door de Raad vast te stellen grenzen vallen;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.4.c
    text: |-
      de apparaatskostenbegroting, bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel11
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8.4.d
    text: |-
      het jaarverslag, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel19
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '19'
        hoofdstuk: IV
  - number: 8.4.e
    text: wijzigingen in de rechtspositie van het personeel;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.4.f
    text: het meerjarenbedrijfsplan;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8.4.g
    text: |-
      het verrichten van andere taken als bedoeld in [artikel 3, tweede lid][ref1], alsmede over de ten aanzien van die
      taken te hanteren tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: '8.5'
    text: |-
      Indien binnen vier weken na ontvangst van het besluit dan wel de beslissing door de Raad niet anders is beslist,
      wordt de Raad geacht te hebben goedgekeurd onderscheidenlijk ingestemd.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8
  - number: 8a
    text: |-
      De hoofddirectie benoemt een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: '9.1'
    text: |-
      Het personeel van de Informatie Beheer Groep, de leden van de hoofddirectie daaronder begrepen, is ambtenaar
      in de zin van de [Ambtenarenwet][ref1] 1929, behoudens degenen met wie een arbeidsovereenkomst is gesloten naar
      burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '9.2'
    text: De hoofddirectie stelt regels vast omtrent de rechtstoestand van het personeel.
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, bevatten de regels, bedoeld in het tweede lid, in
      ieder geval voorschriften betreffende de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: 9.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: 9.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: 9.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0006320/2007-01-01#Artikel9
  - number: 9.3.d
