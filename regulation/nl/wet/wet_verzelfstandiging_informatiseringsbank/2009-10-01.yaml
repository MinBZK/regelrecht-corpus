  - number: 9e
    text: |-
      1 Uit het basisregister worden kosteloos persoonsgegevens en andere gegevens verstrekt aan Onze minister en de
      inspectie van het onderwijs dan wel, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw
      en de natuurlijke omgeving, aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit en de inspectie van het
      landbouwonderwijs, voorzover dat bij wet is vereist of wordt toegestaan.

      2 Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt
      aan burgemeester en wethouders, voorzover dat verplicht is op grond van
      [artikel 64 van de Wet werk en bijstand][ref1], [artikel 49 van de Wet investeren in jongeren][ref2],
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] en
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4].

      3 Uit het basisregister worden aan burgemeester en wethouders de naam, het adres, het persoonsgebonden nummer,
      de behaalde diploma’s, het laatst genoten onderwijs, de laatst bezochte school of instelling, de data van in- en
      uitschrijving bij die school of instelling en de reden van uitstroom verstrekt van degenen die:

      a. woonachtig zijn in de desbetreffende gemeente of in een gemeente die behoort
      tot de regio waarvan de desbetreffende gemeente contactgemeente is als bedoeld
      in [artikel 8.3.2, derde lid, van de Wet educatie en beroepsonderwijs][ref5],
      [artikel 162b, derde lid, van de Wet op de expertisecentra][ref6] en
      [artikel 118h, derde lid, van de Wet op het voortgezet onderwijs][ref7],

      b. ouder dan vier jaar en jonger dan 23 jaar zijn,

      c. niet in het bezit zijn van een startkwalificatie en niet behoren tot de jongeren, bedoeld in
      [artikel 4a, tweede lid, van de Leerplichtwet 1969][ref8].

      4 In afwijking van het derde lid worden van degenen die wel voldoen aan het derde lid, onderdelen a en b, maar die
      niet voldoen aan het derde lid, onderdeel c, de in de aanhef van het derde lid bedoelde gegevens aan burgemeester
      en wethouders verstrekt, indien dit de eerste verstrekking uit het basisregister aan burgemeester en wethouders
      betreft waaruit blijkt dat diegenen niet voldoen aan het derde lid, onderdeel c.

      5 Uit het basisregister worden persoonsgegevens verstrekt aan door de minister aangewezen instellingen ten behoeve
      van onderzoeksactiviteiten naar de kwaliteit en de toegankelijkheid van het beroepsonderwijs, de educatie en het
      hoger onderwijs.

      6 Uit het basisregister onderwijs worden desgevraagd kosteloos persoonsgegevens verstrekt aan:

      a. de Sociale verzekeringsbank, voor zover dat noodzakelijk is
      voor de uitvoering van de [Algemene Kinderbijslagwet][ref9] en
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________;

      b. het Uitvoeringsinstituut werknemersverzekeringen, voor zover dat noodzakelijk is voor de uitvoering van de
      taken, bedoeld in [artikel 30, eerste lid][ref11], [30a, eerste en tweede lid][ref12], [30b][ref13], [30d][ref14],
      en [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref15].

      7 Uit het basisregister worden kosteloos persoonsgegevens aan het Centraal bureau voor de statistiek verstrekt. Het
      Centraal bureau voor de statistiek gebruikt deze gegevens in ieder geval om:

      a. Onze minister en, voorzover het betreft onderwijs en onderzoek op het gebied van de landbouw en de natuurlijke
      omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, gegevens te verstrekken ten behoeve van de
      beleidsvoorbereiding; en

      b. de gemeenten gegevens te verstrekken ten behoeve van de toekenning van uitkeringen, bedoeld in
      [artikel 2 van de Wet participatiebudget][ref16], aan instellingen, en ten behoeve van de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van het onderwijs.

      8 Het Centraal bureau voor de statistiek mag de gegevens die het op grond van het zevende lid heeft ontvangen,
      openbaar maken in de vorm van overzichten die betrekking hebben op afzonderlijke scholen, instellingen of
      opleidingen, mits aan deze overzichten geen herkenbare gegevens over een afzonderlijk persoon of een afzonderlijk
      huishouden kunnen worden ontleend.

      9 Uit het basisregister worden desgevraagd kosteloos persoonsgegevens verstrekt aan de rijksbelastingdienst, voor
      zover dat noodzakelijk is voor de uitvoering van de wetgeving op het gebied van rijksbelastingen zoals bedoeld in
      [artikel 1, tweede lid, van de Algemene wet inzake rijksbelastingen][ref17].

      10 Uit het basisregister worden kosteloos aan kenniscentra beroepsonderwijs bedrijfsleven als
      bedoeld in [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref18] de gegevens, bedoeld in
      [artikel 2.5.5a, tweede lid, onderdelen c, d, i en j, van die wet][ref19], alsmede de leeftijd van de deelnemer bij
      aanvang van de beroepspraktijkvorming verstrekt.

      11 Onverminderd [artikel 178d van de Wet op het primair onderwijs][ref20],
      [artikel 164d van de Wet op de expertisecentra][ref21], [artikel 103e van de Wet op het voortgezet onderwijs][ref22],
      [artikel 2.5.5d van de Wet educatie en beroepsonderwijs][ref23] en
      [artikel 7.52c van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref24], wordt aan de instellingen
      en organen, genoemd in het eerste tot en met tiende lid, geen rechtstreekse toegang tot het basisregister verleend.

      12 De Informatie Beheer Groep verstrekt uit het basisregister geen persoonsgebonden nummer van een leerling,
      deelnemer, student of extraneus ter uitvoering van [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref25].

      13 Uit het basisregister worden aan het meldingsregister relatief verzuim toegevoegd de persoonsgebonden nummers
      van de leerlingen en deelnemers, bedoeld in [artikel 9b, onderdelen a tot en met e][ref26], met van elke leerling
      of deelnemer de naam, het geslacht, de geboortedatum, het adres en het gegeven of betrokkene al dan niet beschikt
      over een startkwalificatie.

      14 De toevoeging, bedoeld in het dertiende lid, gebeurt op het moment van de kennisgeving,
      bedoeld in [artikel 21a, eerste lid, van de Leerplichtwet 1969][ref27], of de opgave,
      bedoeld in [artikel 8.1.8a, eerste lid, van de Wet educatie en beroepsonderwijs][ref28],
      [artikel 47b, eerste lid, van de Wet op de expertisecentra][ref29] en
      [artikel 28a, eerste lid, van de Wet op het voortgezet onderwijs][ref30].

      15 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het derde en vierde lid.


