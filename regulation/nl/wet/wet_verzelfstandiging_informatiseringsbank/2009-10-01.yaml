      2 Indien de Informatie Beheer Groep haar taken, voortvloeiend uit [artikel 3, eerste lid, onder d][ref2], naar
      het oordeel van Onze Minister voor Wonen, Wijken en Integratie verwaarloost, kan deze voorzieningen treffen. Onze
