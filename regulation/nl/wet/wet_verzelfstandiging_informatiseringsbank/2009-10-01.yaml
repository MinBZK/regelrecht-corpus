  - number: 9b
    text: |-
      1 In het basisregister zijn de volgende gegevens opgenomen:

      a. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit
      de openbare kas bekostigde school als bedoeld in de [Wet op het primair onderwijs][ref1], tezamen met de andere
      gegevens, genoemd in [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref2];

      b. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit de
      openbare kas bekostigde school als bedoeld in de [Wet op de expertisecentra][ref3], tezamen met de andere gegevens,
      genoemd in [artikel 164a, tweede en achtste lid, van de Wet op de expertisecentra][ref4];

      c. de persoonsgebonden nummers van de leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan een uit
      de openbare kas bekostigde school als bedoeld in de [Wet op het voortgezet onderwijs][ref5], tezamen met de andere
      gegevens, genoemd in [artikel 103b, tweede en achtste lid, van de Wet op het voortgezet onderwijs][ref6];

      d. de persoonsgebonden nummers van de deelnemers aan een opleiding educatie die zijn ingeschreven
      of ingeschreven zijn geweest aan een instelling waaraan door het gemeentebestuur op grond van
      [artikel 2 van de Wet participatiebudget][ref7] uitkeringen zijn toegekend, tezamen met de andere gegevens, genoemd
      in [artikel 2.3.6a, derde en zesde lid, van de Wet educatie en beroepsonderwijs][ref8];

      e. de persoonsgebonden nummers van de deelnemers aan een beroepsopleiding die zijn ingeschreven
      of ingeschreven zijn geweest aan een uit 's Rijks kas bekostigde instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref9], tezamen met de andere gegevens, genoemd in
      [artikel 2.5.5a, tweede en zevende lid, van de Wet educatie en beroepsonderwijs][ref10];

      f. de persoonsgebonden nummers van de studenten en extraneï die zijn ingeschreven of
      ingeschreven zijn geweest aan een uit 's Rijks kas bekostigde instelling voor hoger onderwijs
      als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11],
      met uitzondering van de Open Universiteit, tezamen met de andere gegevens, genoemd in
      [artikel 7.52, tweede en vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12];

      g. de hierna te noemen gegevens zoals die over de personen, bedoeld in de onderdelen a tot en met f, zijn opgenomen
      in de gemeentelijke basisadministratie persoonsgegevens:

      1°. geslachtsnaam, voornamen, geboortedatum, geboorteland, geslacht, overlijdensdatum, geboorteland moeder en
      geboorteland vader;

      2°. de gegevens over de nationaliteit;

      3°. de gegevens over het verblijf in Nederland en het vertrek uit Nederland;

      h. de gegevens over het verblijfsrecht van de vreemdeling zoals die over de personen, bedoeld in de onderdelen e en
      f, zijn opgenomen in de gemeentelijke basisadministratie.

      2 Indien de in het eerste lid, onderdeel g, bedoelde gegevens van een leerling, deelnemer, student of extraneus
      aan een school of instelling als bedoeld in het eerste lid, onder a tot en met f, niet zijn opgenomen in de
      gemeentelijke basisadministratie persoonsgegevens worden in het basisregister alleen opgenomen de gegevens die het
      bevoegd gezag verstrekt op basis van

      a. [artikel 178a, tweede en zevende lid, van de Wet op het primair onderwijs][ref13],

      b. [artikel 164a, tweede en achtste lid, van de Wet op de expertisecentra][ref14],

      c. [artikel 103b, tweede en achtste lid, van de Wet op het voortgezet onderwijs][ref15],

      d. [artikel 2.3.6a, derde en zesde lid][ref16], of
      [2.5.5a, tweede of zevende lid, van de Wet educatie en beroepsonderwijs][ref17], of

      e. [artikel 7.52, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18].

      3 De persoonsgegevens van de leerlingen, deelnemers, studenten en extraneï die niet langer zijn ingeschreven aan
      een school of instelling als bedoeld in het eerste lid, onder a tot en met f, worden tot vijf jaren na beëindiging
      van de laatste inschrijving bewaard in het basisregister in een vorm die het mogelijk maakt de betrokkene te
      identificeren. [Artikel 10, tweede lid, van de Wet bescherming persoonsgegevens][ref19] is niet van toepassing.
      In afwijking van de eerste volzin geldt voor de geslachtsnaam, voornamen, geboortedatum, instelling voor hoger
      onderwijs waar een opleiding is gevolgd, naam van die opleiding, datum diploma en het aantal jaren genoten hoger
      onderwijs van studenten die niet langer zijn ingeschreven aan een instelling als bedoeld in het eerste lid, onder
      f, een bewaartermijn van vijftig jaren.


