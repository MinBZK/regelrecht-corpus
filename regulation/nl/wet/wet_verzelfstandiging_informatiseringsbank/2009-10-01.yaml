  - number: '19'
    text: |-
      1 De Informatie Beheer Groep stelt jaarlijks voor 1 mei een verslag op over het afgelopen kalenderjaar van:

      a. haar werkzaamheden,

      b. het gevoerde beheer en beleid, en

      c. de kwaliteit van haar dienstverlening jegens opdrachtgever en burger.

      Het jaarverslag omvat mede het voorgenomen beleid ten aanzien van de werkzaamheden. Zij biedt dit verslag aan Onze
      minister , Onze Minister van Landbouw, Natuur en Voedselkwaliteit en Onze Minister voor Wonen, Wijken en Integratie
      alsmede aan de beide Kamers der Staten-Generaal aan en stelt het algemeen verkrijgbaar.

      2 In het jaarverslag wordt in ieder geval aandacht besteed aan de doelmatigheid en doeltreffendheid van de wijze
      waarop in het afgelopen kalenderjaar de technische en organisatorische maatregelen, bedoeld in [artikel 9c][ref1],
      ten uitvoer zijn gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9c
