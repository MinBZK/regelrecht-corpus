  - number: '2'
    text: |-
      1 Er is een Informatie Beheer Groep, die is gevestigd te Groningen.

      2 De Informatie Beheer Groep bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel2
  - number: '3'
    text: |-
      1 De Informatie Beheer Groep is belast met de uitvoering van:

      a. de [Algemene wet erkenning EG-beroepskwalificaties][ref1], de [Les- en cursusgeldwet][ref2],
      de [Wet educatie en beroepsonderwijs][ref3], de [Wet op de expertisecentra][ref4], de
      [Wet op de studiefinanciering][ref5], de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
      de [Wet op het primair onderwijs][ref7], de [Wet op het voortgezet onderwijs][ref8], de
      [Wet studiefinanciering 2000][ref9], de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref10], alsmede de
      Wet tegemoetkoming studiekosten;

      b. de op de onder a genoemde wetten gebaseerde algemene maatregelen van bestuur en ministeriële regelingen;

      c. het beheer van het basisregister en het meldingsregister relatief verzuim;

      d. de bij de [Wet inburgering][ref11] en daarop gebaseerde algemene maatregelen van bestuur en ministeriële
      regelingen aan de Informatie Beheer Groep opgedragen taken;

      e. andere bij de wet opgedragen taken.

      2 De Informatie Beheer Groep kan met toestemming van Onze minister andere taken uitvoeren, dan die welke
      rechtstreeks voortvloeien uit de in het eerste lid genoemde, mits deze taken:

      a. liggen op het terrein van de uitvoering van bestuurlijke taken en nauw verband houden met de in het eerste lid
      genoemde taken van de Informatie Beheer Groep;

      b. toepassingen met zich brengen van produktiemiddelen, die de Informatie Beheer Groep voor de vervulling van haar
      in het eerste lid genoemde taken, voorhanden heeft;

      c. niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en

      d. tegen kostendekkende tarieven worden verricht.

      3 Onze minister kan bij het verlenen van de toestemming, bedoeld in het tweede lid, voorwaarden stellen.


