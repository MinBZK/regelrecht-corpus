      2 Onze Minister voor Wonen, Wijken en Integratie stelt na overleg met de Informatie Beheer Groep een
      informatiestatuut vast. Het informatiestatuut bevat regels met betrekking tot de informatievoorziening tussen Onze
      Minister voor Wonen, Wijken en Integratie en de Informatie Beheer Groep.
