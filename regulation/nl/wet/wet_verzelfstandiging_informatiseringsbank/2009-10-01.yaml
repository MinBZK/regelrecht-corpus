        bwb_id: BWBR0013891
        artikel: '34'
  - number: 3b
    text: |-
      De Informatie Beheer Groep kan bij de uitoefening van de taken, bedoeld in [artikel 3, eerste lid][ref1], het
      persoonsgebonden nummer van een persoon gebruiken als registratienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
