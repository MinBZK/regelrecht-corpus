  - number: '10'
    text: |-
      1 Onze minister stelt jaarlijks aan de Informatie Beheer Groep ten laste van de begroting van het Ministerie
      van Onderwijs, Cultuur en Wetenschap middelen ter beschikking ten behoeve van de vervulling van haar taken,
      voortvloeiend uit [artikel 3, eerste lid, onder a, b en c][ref1], alsmede, voor zover opgedragen door Onze
      minister, voortvloeiend uit [artikel 3, eerste lid, onder e][ref2].

      2 Onze Minister stelt jaarlijks voor 1 september, na overleg met de Informatie Beheer Groep en onder voorbehoud
      van goedkeuring van de in het eerste lid bedoelde begroting, een voorlopig bedrag vast dat voor het daaropvolgende
      kalenderjaar aan de Informatie Beheer Groep ter beschikking zal worden gesteld. Hij neemt dit bedrag op in het
      voorstel van wet tot vaststelling van die begroting.

      3 Onze Minister stelt jaarlijks uiterlijk op 31 december in overeenstemming met de Informatie Beheer Groep de
      in het daaropvolgende kalenderjaar te realiseren prestatie- en kwaliteitsdoelen vast. Voorts stelt hij onder
      voorbehoud van goedkeuring van de in het eerste lid bedoelde begroting het definitieve bedrag vast dat voor het
      daaropvolgende kalenderjaar aan de Informatie Beheer Groep ter beschikking zal worden gesteld.

      4 Het boekjaar van de Informatie Beheer Groep valt samen met het kalenderjaar.

      5 Zolang de wet tot vaststelling van de begroting, bedoeld in het eerste lid, niet in werking is getreden,
      verstrekt Onze minister met ingang van het kalenderjaar waarop de begroting betrekking heeft, een voorschot aan de
      Informatie Beheer Groep, in de vorm van maandelijkse termijnen.

      6 De Informatie Beheer Groep trekt geen gelden aan die dagelijks of op termijn opvorderbaar zijn. In afwijking van
      de vorige volzin is het de Informatie Beheer Groep toegestaan dergelijke gelden bij het Rijk op te nemen onder de
      voorwaarden van de [Comptabiliteitswet 2001][ref3].

      7 Onze Minister voor Wonen, Wijken en Integratie stelt jaarlijks aan de Informatie Beheer Groep ten laste van de
      begroting van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer middelen ter beschikking
      ten behoeve van de vervulling van haar taken, voortvloeiend uit [artikel 3, eerste lid, onder d][ref4]. Het tweede
      lid, met uitzondering van de laatste volzin, en het derde tot en met het vijfde lid zijn van overeenkomstige
      toepassing, met dien verstande dat voor «Onze minister» telkens wordt gelezen: Onze Minister voor Wonen, Wijken
      en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013891
      [ref4]: https://wetten.overheid.nl/BWBR0006320#Artikel3
