  - number: '32'
    text: |-
      In afwijking van de benoemingstermijn van de leden van de Raad, genoemd in [artikel 5, vierde lid][ref1], worden
      bij de eerste samenstelling van de Raad twee leden voor een periode van twee jaren benoemd. Zij zijn terstond
      herbenoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: '5'
        hoofdstuk: II
  - number: '36'
    text: |-
      Onze minister zendt binnen 5 jaar na de inwerkingtreding van deze wet, en vervolgens telkens na 5 jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel36
  - number: '37'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1994. Indien het *Staatsblad* waarin deze wet wordt geplaatst,
      wordt uitgegeven na 31 december 1993, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst, en werkt zij terug tot en met 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel37
  - number: '38'
    text: 'Deze wet kan worden aangehaald als: Wet verzelfstandiging Informatiseringsbank.'
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel38
