        bwb_id: BWBR0006320
        artikel: '3'
        hoofdstuk: '1'
  - number: 30a
    text: |-
      1 In aanvulling op [artikel 3, eerste lid, onderdelen a en b][ref1], is de Informatie Beheer Groep belast met het
      verrichten van alle activiteiten die samenhangen met renteloze voorschotten die aan studerenden zijn verstrekt op
      grond van:

      a. het Reglement rijksstudietoelagen 1960;

      b. het Besluit studietoelagen WVO;

      c. [artikel 7 van de Experimentenwet onderwijs][ref2].

      2 In aanvulling op [artikel 3, eerste lid, onderdelen a en b][ref3], is de Informatie Beheer Groep belast met het
      verrichten van alle activiteiten die samenhangen met verstrekkingen waarop door studerenden aanspraak is gemaakt op
      grond van de Regeling tegemoetkoming studiekosten TS 17- en de Regeling tegemoetkoming studiekosten TS 21+, zoals
      vastgesteld op grond van [artikel 121 van de Wet op het voortgezet onderwijs][ref4], van het Besluit studietoelagen
      WVO en op grond van [artikel 7 van de Experimentenwet onderwijs][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002718#Artikel7
