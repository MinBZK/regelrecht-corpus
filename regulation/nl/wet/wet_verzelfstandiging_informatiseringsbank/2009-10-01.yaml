  - number: '4'
    text: |-
      1 De bestuursorganen van de Informatie Beheer Groep zijn de Raad van Toezicht en de hoofddirectie.

      2 De Raad ziet toe op de werkzaamheden van de hoofddirectie en staat die met raad terzijde. Hij kan aan
      de hoofddirectie algemene aanwijzingen geven met betrekking tot de uitvoering van de taken, bedoeld in
      [artikel 3][ref1].

      3 De hoofddirectie is belast met de dagelijkse leiding van de Informatie Beheer Groep. Zij draagt zorg voor een
      goede uitvoering van de taken, bedoeld in [artikel 3][ref2], en voor een goede kwaliteit van de dienstverlening van
      de Informatie Beheer Groep.

      4 De hoofddirectie oefent de taken en bevoegdheden uit die bij of krachtens de wet aan de Informatie Beheer Groep
      zijn opgedragen, voor zover bij of krachtens deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel3
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel4
