        artikel: '62'
  - number: '9'
    text: |-
      1 Het personeel van de Informatie Beheer Groep, de leden van de hoofddirectie daaronder begrepen, is ambtenaar
      in de zin van de [Ambtenarenwet][ref1] 1929, behoudens degenen met wie een arbeidsovereenkomst is gesloten naar
      burgerlijk recht.

      2 De hoofddirectie stelt regels vast omtrent de rechtstoestand van het personeel.

      3 Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, bevatten de regels, bedoeld in het tweede lid, in
      ieder geval voorschriften betreffende de volgende onderwerpen:

      a. aanstelling;

      b. schorsing;

      c. ontslag;

      d. het onderzoek naar de geschiktheid en de bekwaamheid;

      e. bezoldiging;

      f. wachtgeld;

      g. diensttijden;

      h. verlof en vakantie;

      i. voorzieningen in verband met ziekte;

      j. bescherming bij de arbeid;

      k. woon-, verblijfs- en bereikbaarheidsverplichtingen;

      l. medezeggenschap;

      m. overige rechten en verplichtingen van het personeel;

      n. disciplinaire straffen;

      o. de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gevoerd over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van de
      Informatie Beheer Groep;

      p. een geschillenregeling met betrekking tot [de onder ][ref2] en [][ref3] genoemde onderwerpen.

      4 Indien de hoofddirectie in gebreke blijft bij de vaststelling van de in het tweede lid bedoelde regels, is Onze
      minister bevoegd de Raad uit te nodigen die regels vast te stellen. Blijft ook de Raad in gebreke, dan geschiedt de
      vaststelling van bedoelde regels door Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006320#Artikel9
