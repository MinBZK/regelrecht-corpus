  - number: '31'
    text: |-
      1 Onze minister draagt zorg dat binnen 2 maanden na het tijdstip van inwerkingtreding van deze wet een Raad van
      Toezicht tot stand komt overeenkomstig [artikel 5][ref1].

      2 Bij de eerste samenstelling van de Raad benoemt Onze minister, in afwijking van
      [artikel 5, derde lid, de leden][ref2], waaronder de voorzitter, zonder dat de Raad is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel5
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel31
