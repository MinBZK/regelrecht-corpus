  - number: 3a
    text: |-
      Voor het oprichten van of deelnemen in andere rechtspersonen door de Informatie Beheer Groep is voorafgaande
      toestemming van Onze Minister en van Onze Minister van Financiën vereist. Onze Minister past daarbij
      [artikel 34 van de Comptabiliteitswet 2001][ref1] overeenkomstig toe.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0006320/2009-10-01#Artikel3a
    references:
