articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AeMC:* luchtvaartgeneeskundig centrum als bedoeld in bijlage VII bij verordening (EU) nr. 1178/2011 en bijlage
      III bij verordening (EU) nr. 2015/340 (Aero-medical centre);
        - *AME:* luchtvaart medische keuringsarts als bedoeld in bijlage IV bij verordening (EU) nr. 1178/2011 en bijlage
      IV bij verordening (EU) nr. 2015/340 (Aero-medical examiner);
        - *ATO:* erkende opleidingsorganisatie als bedoeld in bijlage I bij verordening (EU) nr. 1178/2011 (Approved
      Training Organisation);
        - *gedelegeerde verordening (EU) 2020/723:* gedelegeerde [verordening (EU) 2020/723](32623R2020) van de Commissie
      van 4 maart 2020 tot vaststelling van gedetailleerde regels met betrekking tot de erkenning van pilootcertificaten
      van derde landen en tot wijziging van [Verordening (EU) nr. 1178/2011](32011R1178) (PbEU 2020, L 170);
        - *uitvoeringsverordening (EU) 2018/1976:* uitvoerings[verordening (EU) 2018/1976](31976R2018) van de Commissie
      van 14 december 2018 tot vaststelling van gedetailleerde regels voor vluchtuitvoeringen met zweefvliegtuigen (PbEU
      2018, L 326);
        - *uitvoeringsverordening (EU) nr. 2019/947:* Uitvoeringsverordening (EU) nr. 2019/947 van de Commissie van 24 mei
      2019 inzake de regels en procedures voor de exploitatie van onbemande luchtvaartuigen (PbEU 2019, L 152);
        - *uurtarief*: hoogte van de vergoeding per uur per persoon met betrekking tot werkzaamheden als bedoeld in deze
      regeling;
        - *vast tarief*: hoogte van de vergoeding die niet afhankelijk is van de tijdsbesteding;
        - *verordening (EU) nr. 965/2012*: verordening van de Commissie van 5 oktober 2012 tot vaststelling van technische
      eisen en administratieve procedures voor vluchtuitvoering, overeenkomstig Verordening (EG) nr. 216/2008 van het
      Europees Parlement en de Raad (PbEU L 296);
        - *verordening (EG) nr. 3922/1991:* verordening van de Raad van 16 december 1991 inzake de harmonisatie van
      technische voorschriften en administratieve procedures op het gebied van de burgerluchtvaart;
        - *verordening (EU) 2018/395:* [verordening (EU) 2018/395](32295R2018) van de Commissie van 13 maart 2018 tot
      vaststelling van gedetailleerde regels voor vluchtuitvoeringen met ballonnen (PbEU 2018, L 71);
        - *verordening (EU) nr. 139/2014:* verordening van de Commissie van 12 februari 2014 tot vaststelling van eisen en
      administratieve procedures met betrekking tot luchtvaartterreinen, overeenkomstig Verordening (EG) nr. 216/2008 van
      het Europees parlement en de Raad (PbEU L 44);
        - *verordening (EU) nr. 2015/445:* verordening van de Commissie van 17 maart 2015 tot wijziging van Verordening
      (EU) nr. 1178/2011 voor wat de technische eisen en administratieve procedures met betrekking tot de bemanning van
      burgerluchtvaartuigen betreft (PbEU L 74);
        - *verordening (EU) nr. 2015/1088:* verordening van de Commissie van 3 juli 2015 tot wijziging van Verordening (EU)
      nr. 1321/2014 met betrekking tot een versoepeling van de onderhoudsprocedures voor luchtvaartuigen voor de algemene
      luchtvaart (PbEU L 176);
        - *verordening (EU) nr. 2015/1536:* verordening van de Commissie van 16 september 2015 tot wijziging van
      Verordening (EU) nr. 1321/2014 met betrekking tot aanpassing van de regels voor permanente luchtwaardigheid
      aan Verordening (EG) nr. 216/2008, kritische onderhoudstaken en toezicht op de permanente luchtwaardigheid van
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0023145/2022-10-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 1.7, tweede lid][ref1], [6.55, zesde lid][ref2], [6.58, zesde lid][ref3],
      [8.12, vijfde lid][ref4], [8a.4, vierde lid][ref5], [10.11, eerste lid, onderdeel b][ref6], en
      [11.2a, derde lid, van de Wet luchtvaart][ref7], de [artikelen 8, derde lid][ref8], [13, tweede lid][ref9],
      [20, derde lid][ref10], en [30, derde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref11],
      [artikel 22, tweede en derde lid, van het Besluit luchtvaartuigen 2008][ref12] en
      [artikel 5 van het Besluit vluchtuitvoering][ref13].


