      1 Voor de behandeling van een aanvraag voor de afgifte van een:

      a. ATPL;

      b. CPL;

      c. MPL (A), met daarop weergegeven een of meerdere bevoegdverklaringen als bedoeld in verordening (EU) nr.
      1178/2011 is een vast tarief verschuldigd van € 568.

      2 Voor de behandeling van een aanvraag voor de afgifte van een:

      a. PPL;

      b. BPL, met daarop weergegeven een of meerdere bevoegdverklaringen als bedoeld in de [verordening (EU) nr.
      1178/2011](32011R1178), [uitvoeringsverordening (EU) 2018/1976](31976R2018) en [verordening (EU) 2018/395]
      (32295R2018) is een vast tarief verschuldigd van € 547.

      3 Voor de behandeling van een aanvraag voor de afgifte van een:

      a. RPL;

      b. LAPL(A);

      c. LAPL(H), met daarop weergegeven een of meerdere bevoegdverklaringen als bedoeld in de verordening (EU) nr.
      1178/2011 is een vast tarief verschuldigd van € 547.

      4 Voor de behandeling van een aanvraag voor de afgifte, verlenging of hernieuwde afgifte van een bevoegdverklaring
      als bedoeld in het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] en in verordening (EU) nr.
      1178/2011, niet zijnde de bevoegdverklaring RT of LPE, is een vast tarief verschuldigd van € 115.

      5 Voor de behandeling van een aanvraag voor de afgifte dan wel voor de verlenging of
      hernieuwde afgifte van een instructeurbevoegdverklaring voor luchtvarenden als bedoeld in het
      [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2] of een certificaat als instructeur als bedoeld in
      verordening (EU) nr. 1178/2011 is een vast tarief verschuldigd van € 147.

      6 Voor de behandeling van een aanvraag voor de afgifte, verlenging of hernieuwde afgifte van een
      bevoegdverklaring RT en een bevoegdverklaring LPE met de bijbehorende taalvaardigheid als bedoeld in het
      [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref3] en in verordening (EU) nr. 1178/2011 is een vast tarief
      verschuldigd van € 59.

      7 Voor de behandeling van een aanvraag voor validatie en conversie van bewijzen van bevoegdheid als bedoeld in
      gedelegeerde [verordening (EU) nr. 2020/723](32623R2020) is een vast tarief verschuldigd van € 67.

      8 Voor de vernieuwing van een document als bedoeld in het
      [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref4] en in verordening (EU) nr. 1178/2011 is een vast tarief
      verschuldigd van € 67.

      9 Voor de behandeling van een aanvraag voor de afgifte, met daarop weergegeven een of meerdere bevoegdverklaringen,
      verlenging, hernieuwde afgifte of wijziging van een SPL is een vast tarief verschuldigd van € 67.

      10 Voor de behandeling van een aanvraag voor de afgifte van een RPA-L met daarop weergegeven een of meer
      bevoegdverklaringen als bedoeld in het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref5] is een vast
      tarief verschuldigd van € 134.

      11 Voor de behandeling van een aanvraag om afgifte, verlenging of hernieuwde afgifte van een op een RPA-L te
      vermelden bevoegdverklaring als bedoeld in het [Besluit bewijzen van bevoegdheid voor de luchtvaart][ref6] is, in
      afwijking van het vierde lid, een vast tarief verschuldigd van € 101.


