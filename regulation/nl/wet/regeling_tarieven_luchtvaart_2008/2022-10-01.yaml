      1 Voor de behandeling van een aanvraag om ontheffing te verlenen van het verbod als bedoeld in:

      a. part 21, subpart P, van verordening (EU) nr. 748/2012 om de luchtvaart uit te oefenen met een luchtvaartuig,
      dat niet luchtwaardig is (*Permit to Fly*), is een vast tarief verschuldigd van € 305, tenzij de behandeling van
      de aanvraag meer dan twee uur in beslag neemt. Voor elk volgend uur zal dan een uurprijs van € 160 gerekend worden
      additioneel aan het vaste tarief;

      b. part 21, subpart P, van verordening (EU) nr. 748/2012 voor het vaststellen van de voorwaarden voor het uitvoeren
      van de vlucht met een niet luchtwaardig luchtvaartuig (*Approval Flight Conditions*) om de luchtvaart uit te
      oefenen, is een vast tarief verschuldigd van € 996, tenzij de behandeling van de aanvraag meer dan vijf uur in
      beslag neemt. Voor elk volgend uur zal dan een uurprijs van € 160 gerekend worden additioneel aan het vaste tarief;

      c. [artikel 3.8, eerste lid, onderdeel a, van de Wet luchtvaart][ref1] om de luchtvaart uit te oefenen met een
      luchtvaartuig, dat niet luchtwaardig is, zijn de volgende vaste tarieven verschuldigd:

      1° € 243 voor helikopters ≤ 2.700 kg en voor overige luchtvaartuigen ≤ 5.700 kg; en

      2° € 996 voor helikopters > 2.700 kg en voor overige luchtvaartuigen > 5.700 kg;

      d. [artikel 3.8, eerste lid, onderdeel b, van de Wet luchtvaart][ref2] om de luchtvaart uit te oefenen met een
      luchtvaartuig dat niet is voorzien van een geldig bewijs van luchtwaardigheid, is een vast tarief verschuldigd van
      € 73;

      e. [artikel 16d, van de Luchtvaartwet][ref3] om luchtvervoer te mogen uitvoeren zonder vergunning is een vast
      tarief verschuldigd van € 672;

      f. de bij of krachtens [titel 6.5 van de Wet luchtvaart][ref4] gegeven regels inzake het
      vervoer van gevaarlijke stoffen of een wijziging van zulk een ontheffing als bedoeld in
      [artikel 6.58, eerste respectievelijk zesde lid, van de Wet luchtvaart][ref5] is een vast tarief verschuldigd van
      € 1.896;

      g. [artikel 8.12 van de Wet luchtvaart][ref6] om objecten op te richten of te plaatsen
      waarvoor geen omgevingsvergunning voor een bouw- of aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b, van de Wet algemene bepalingen omgevingsrecht][ref7] is vereist, zijn de
      volgende vaste tarieven verschuldigd:


                Tabel 1






                        – Obstakel(s) beneden LIB veiligheidsvlakken (geen luchtvaarttechnische studie nodig)


                        € 569




                        – Obstakel(s) door LIB veiligheidsvlakken (luchtvaarttechnische studie nodig) Certificaat voor
      luchthaven Schiphol


                        € 1.679






      h. [artikel 1 van de Regeling modelvliegen][ref8] is een vast tarief verschuldigd van € 69.

