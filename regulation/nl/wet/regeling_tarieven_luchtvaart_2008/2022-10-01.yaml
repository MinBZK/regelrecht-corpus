  - number: '25'
    text: |-
      Bij exploitatie van een luchtvaartuig van historische waarde voor niet commerciële doeleinden, mits voorzien van
      een Nederlandse registratie, worden de volgende kortingen verleend:

      a. afgifte en verlenging Bewijs van Luchtwaardigheid: 100%;

      b. afgifte Bewijs van Inschrijving: 100%;

      c. luchtwaardigheidsonderzoek/certificaties: 75%;

      d. ontheffing Bewijs van Luchtwaardigheid: 100%;

      e. toezicht op erkende bedrijven, eerste erkenning, wijziging en verlenging: 75%;

      f. ontheffing om luchtvervoer te mogen uitvoeren: 100%.
    url: https://wetten.overheid.nl/BWBR0023145/2022-10-01#Artikel25
  - number: 25a
    text: |-
      Bij een aanvraag voor eerste afgifte of wijziging van de erkenning in verband met splitsing of fusie van erkende
      rechtspersonen, benoemd in de [artikelen 8][ref1] (AeMC), [11][ref2] (ATO), [16][ref3] (MOA), [17][ref4] (AOC),
      [18][ref5] (CAMO), of een aanvraag voor eerste afgifte of wijziging na doorstart vanuit surseance of faillissement
      van een der voornoemde erkende rechtspersonen, is een uurtarief van € 160 verschuldigd. Het te betalen tarief voor
      een erkenning in geval van een doorstart vanuit surseance of faillissement zal het tarief voor de eerste afgifte
      niet te boven gaan.


