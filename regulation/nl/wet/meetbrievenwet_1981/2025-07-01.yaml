---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: meetbrievenwet_1981
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2025-07-01'
bwb_id: BWBR0003378
url: https://wetten.overheid.nl/BWBR0003378/2025-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de uitvoering van het Internationaal Verdrag
    betreffende de meting van schepen 1969, Trb. 1970, 122 en 194, wenselijk is de bepalingen betreffende de meting van
    zeeschepen opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.b
    text: '"Verdrag": het Internationaal Verdrag betreffende de meting van schepen, 1969, *Trb.* 1970, 122 en 194;'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.c
    text: |-
      "Verdrag van Oslo 1947": Het Internationaal Verdrag nopens een eenvormig stelsel voor de meting van zeeschepen,
      laatstelijk *Trb.* 1970, 55;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.d
    text: '"de datum van inwerkingtreding van het Verdrag": het tijdstip bedoeld in artikel 17, lid (1), van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.e
    text: |-
      "schip": een zeeschip in de zin van [artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] of een
      binnenschip in de zin van [artikel 3, eerste lid, van Boek 8 van dat Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel3
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '3'
  - number: 1.f
    text: '"Nederlands schip":'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.f.1°
    text: |-
      een zeeschip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te
      voeren, dan wel
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.f.2°
    text: |-
      een binnenschip dat voldoet aan tenminste een der in het
      [eerste lid van artikel 784 van Boek 8 van het Burgerlijk Wetboek][ref1] gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '784'
  - number: 1.g
    text: 'inspecteur-generaal: inspecteur-generaal van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.h
    text: |-
      de ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaren van de Inspectie
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.i
    text: |-
      "het ondernemen van een reis": het buitengaats brengen van een schip als bedoeld in
      [artikel 1, eerste lid, van de Schepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.j
    text: |-
      "Internationale Meetbrief (1969)": de meetbrief, door Onze Minister dan wel door de administratie van een andere
      Staat, aangesloten bij het Verdrag, afgegeven overeenkomstig de bepalingen van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.k
    text: |-
      "bijzondere meetbrief": de meetbrief, anders dan bedoeld onder *j*, vermeldende de bruto- en netto-tonnage van een
      schip, door Onze Minister afgegeven ten behoeve van een schip;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.l
    text: |-
      "voorlopige meetbrief": de meetbrief, anders dan bedoeld onder *j* en *k*, voor een tijdsduur van ten hoogste zes
      maanden door Onze Minister afgegeven ten behoeve van een Nederlands schip;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.m
    text: |-
      "nieuw schip": een schip waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium van aanbouw
      bevindt op of na de datum van inwerkingtreding van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.n
    text: '"bestaand schip": een schip, dat niet is een nieuw schip;'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: 1.o
    text: |-
      "lengte (L)": 96 procent van de lengte (L) van de lastlijn op 85 procent van de kleinste holte naar de mal gemeten
      vanaf de bovenzijde van de kielplaat, dan wel de lengte (L) van de voorzijde van de voorsteven tot aan de hartlijn
      van de roerkoning op deze lastlijn gemeten, indien deze laatste lengte (L) groter is. Bij schepen die met stuurlast
      zijn ontworpen moet de lastlijn waarop deze lengte (L) wordt gemeten, evenwijdig aan de constructie-waterlijn
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel1
  - number: '2.1'
    text: |-
      Tenzij in deze wet anders is bepaald, is deze wet uitsluitend van toepassing op Nederlandse schepen, voor zover
      deze schepen bestemd of gebezigd worden voor het ondernemen van een reis.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel2
  - number: '2.2'
    text: Deze wet is niet van toepassing op oorlogsschepen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel2
  - number: '2.3'
    text: Deze wet is mede van toepassing op Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel2
  - number: '3'
    text: De bepalingen van deze paragraaf zijn van toepassing op alle Nederlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel3
  - number: '4.1'
    text: |-
      Er wordt geen reis ondernomen tenzij ten behoeve van het schip overeenkomstig de bij of krachtens deze wet gegeven
      bepalingen een meetbrief is afgegeven, welke nog geldig is op het ogenblik van vertrek, te weten:
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.a
    text: 'voor schepen met een lengte van 24 meter of meer een Internationale Meetbrief (1969) ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.a.1e
    text: nieuwe schepen;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.a.2e
    text: |-
      bestaande schepen, die veranderingen of wijzigingen ondergaan of hebben ondergaan welke door Onze Minister worden
      geacht een aanzienlijke afwijking te vormen van hun bestaande bruto-tonnage;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.a.3e
    text: |-
      bestaande schepen, indien de eigenaar of de rompbevrachter zulks verlangt, in welk geval de tonnages van
      deze schepen na deze afgifte niet meer kunnen worden vastgesteld overeenkomstig de bepalingen die door de
      Scheepsmetingsdienst werden toegepast vóór de datum van inwerkingtreding van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.a.4e
    text: |-
      alle bestaande schepen, twaalf jaar na de datum van inwerkingtreding van het Verdrag, met dien verstande dat deze
      schepen, met uitzondering van de onder 2e en 3e bedoelde, hun alsdan bestaande tonnages behouden voor de toepassing
      van de daarmee verband houdende bepalingen van andere bestaande internationale verdragen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.b
    text: |-
      een bijzondere meetbrief, afgegeven door Onze Minister ingevolge de bepalingen van de Meetbrievenwet 1948 ten
      behoeve van alle bestaande schepen, niet vallende onder 2e, 3e en 4e van het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.c
    text: |-
      voor nieuwe schepen met een lengte van minder dan 24 meter een bijzondere meetbrief, afgegeven door Onze Minister
      ingevolge de bepalingen van deze wet, met uitzondering van pleziervaartuigen, welke uitsluitend als zodanig worden
      gebezigd, voor zover zij geen passagiers tegen vergoeding vervoeren, tenzij de eigenaar of de rompbevrachter een
      bijzondere meetbrief verlangt;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: 4.1.d
    text: |-
      voor schepen die hebben gevaren onder de vlag van een andere Staat een voorlopige meetbrief, welke door Onze
      Minister kan worden afgegeven voordat de tonnages zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: '4.2'
    text: |-
      De meetbrieven bedoeld in het eerste lid worden op verzoek van de eigenaar of de rompbevrachter afgegeven door Onze
      Minister tegen betaling van de kosten, berekend volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
  - number: '4.3'
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de afgifte van meetbrieven als
      bedoeld in het eerste lid, onderdeel b en c, voor zover het gaat om de afgifte van duplicaten van eerder afgegeven
      meetbrieven die verloren zijn geraakt of door slijtage ongeldig zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '5'
    text: |-
      De bepalingen van deze paragraaf zijn van toepassing op Nederlandse schepen als bedoeld in
      [artikel 4, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
        hoofdstuk: II
        paragraaf: A
  - number: '6.1'
    text: |-
      Voor de afgifte van een Internationale Meetbrief (1969) stelt Onze Minister de tonnages vast volgens bij of
      krachtens algemene maatregel van bestuur te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de afgifte van een bijzondere meetbrief, speciaal ingericht ten gebruike voor de vaart door het Suezkanaal
      of het Panamakanaal, kan Onze Minister de tonnnages vaststellen overeenkomstig de metingsvoorschriften voor de
      betreffende kanalen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel6
  - number: '6.3'
    text: |-
      De bijzondere meetbrieven, bedoeld in het tweede lid van dit artikel, dienen een verklaring te bevatten inhoudende
      overeenkomstig welke bepalingen de tonnages van het schip, waarvoor de meetbrief is afgegeven, zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel6
  - number: '7'
    text: |-
      Indien de aanvrager van een meetbrief, als bedoeld in [artikel 6][ref1], van mening is, dat de vaststelling van
      de bruto- en netto-tonnage opgenomen in de meetbrief, niet juist is, kan hij binnen twee weken na afgifte van de
      meetbrief aan Onze Minister een nieuwe vaststelling verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel6
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '6'
        hoofdstuk: II
        paragraaf: B
  - number: '8'
    text: |-
      Onze Minister kan, in afwijking van het bepaalde in [artikel 6, eerste lid][ref1], een Staat, aangesloten bij
      het Verdrag, verzoeken de bruto- en netto-tonnage van een schip vast te stellen en ten behoeve van dit schip
      overeenkomstig het Verdrag een Internationale Meetbrief (1969) af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel6
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '6'
        hoofdstuk: II
        paragraaf: B
  - number: '9.1'
    text: |-
      Een Internationale Meetbrief (1969) verliest zijn geldigheid en wordt door Onze Minister ingetrokken indien
      zodanige wijzigingen hebben plaatsgevonden in de inrichting, de bouw, de capaciteit, het benutten van ruimten, het
      totale aantal passagiers dat het schip volgens zijn veiligheidscertificaat voor passagiersschepen mag vervoeren,
      het vastgestelde vrijboord of de toegestane diepgang, dat daaruit noodzakelijkerwijs een vermeerdering van de
      bruto- of netto-tonnage voortvloeit.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      Een door Onze Minister ten behoeve van een schip afgegeven Internationale Meetbrief (1969) verliest zijn geldigheid
      indien zulk een schip de vlag van een andere Staat gaat voeren, behoudens het bepaalde in het derde en het vijfde
      lid.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien een schip de vlag van een andere Staat, aangesloten bij het Verdrag, gaat voeren, blijft de Internationale
      Meetbrief (1969) van kracht voor een periode van ten hoogste twaalf weken of wel tot het tijdstip waarop die andere
      Staat een andere Internationale Meetbrief (1969) ter vervanging uitgeeft, al naar gelang welk tijdstip eerder valt.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister doet zo spoedig mogelijk, nadat het schip de vlag van de andere Staat is gaan voeren, aan die
      andere Staat een afschrift toekomen van de op het tijdstip van de verandering van de vlag door het schip gevoerde
      meetbrief en een afschrift van de hierop betrekking hebbende berekening van de tonnage.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel9
  - number: '9.5'
    text: |-
      Indien een schip, de vlag voerende van een andere Staat, aangesloten bij het Verdrag, een Nederlands schip wordt,
      blijft de Internationale Meetbrief (1969) van kracht voor een periode van ten hoogste twaalf weken ofwel tot het
      tijdstip waarop Onze Minister een Internationale Meetbrief (1969) ter vervanging uitgeeft, al naar gelang welk
      tijdstip eerder valt.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel9
  - number: '10'
    text: |-
      De bepalingen van deze paragraaf zijn van toepassing op Nederlandse schepen, als bedoeld in
      [artikel 4, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
        hoofdstuk: II
        paragraaf: A
  - number: '11.1'
    text: |-
      Voor de afgifte van een bijzondere meetbrief, als bedoeld in [artikel 4, eerste lid, onder b ][ref1], ten behoeve
      van een bestaand schip, kan Onze Minister tot het tijdstip, twaalf jaar na de datum van de inwerkingtreding van het
      Verdrag, de tonnages vaststellen overeenkomstig de bepalingen, die door de Scheepsmetingsdienst werden toegepast
      voor de datum van de inwerkingtreding van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
        hoofdstuk: II
        paragraaf: A
  - number: '11.2'
    text: |-
      Voor de afgifte van een bijzondere meetbrief, speciaal ingericht ten gebruike voor de vaart door het Suezkanaal
      of het Panamakanaal, kan Onze Minister de tonnages vaststellen overeenkomstig de metingsvoorschriften voor de
      betreffende kanalen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      De bijzondere meetbrieven, bedoeld in het tweede lid van dit artikel, dienen een verklaring te bevatten inhoudende
      overeenkomstig welke bepalingen de tonnages van het schip, waarvoor de meetbrief is afgegeven, zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel11
  - number: '12'
    text: |-
      Indien de aanvrager van een meetbrief, als bedoeld in [artikel 11][ref1], van mening is, dat de vaststelling van
      de bruto- en netto-tonnage opgenomen in de meetbrief, niet juist is, kan hij binnen twee weken na afgifte van de
      meetbrief aan Onze Minister een nieuwe vaststelling verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel11
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '11'
        hoofdstuk: II
        paragraaf: C
  - number: '13'
    text: |-
      De bepalingen van deze paragraaf zijn van toepassing op Nederlandse schepen, als bedoeld in
      [artikel 4, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
        hoofdstuk: II
        paragraaf: A
  - number: '14.1'
    text: |-
      Voor de afgifte van een bijzondere meetbrief, als bedoeld in [artikel 4, eerste lid, onder c ][ref1], stelt Onze
      Minister de tonnages vast volgens bij of krachtens algemene maatregel van bestuur te geven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
        hoofdstuk: II
        paragraaf: A
  - number: '14.2'
    text: |-
      Voor de afgifte van een bijzondere meetbrief, speciaal ingericht ten gebruike voor de vaart door het Suezkanaal
      of het Panamakanaal, kan Onze Minister de tonnages vaststellen overeenkomstig de metingsvoorschriften voor de
      betreffende kanalen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel14
  - number: '14.3'
    text: |-
      De bijzondere meetbrieven, bedoeld in het tweede lid van dit artikel, dienen een verklaring te bevatten inhoudende
      overeenkomstig welke bepalingen de tonnages van het schip waarvoor de meetbrief is afgegeven, zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel14
  - number: '15'
    text: |-
      Indien de aanvrager van een meetbrief als bedoeld in [artikel 14][ref1] van mening is, dat de vaststelling van
      de bruto- en netto-tonnage opgenomen in de meetbrief niet juist is, kan hij binnen twee weken na afgifte van de
      meetbrief aan Onze Minister een nieuwe vaststelling verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel14
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '14'
        hoofdstuk: II
        paragraaf: D
  - number: '16'
    text: |-
      De bepalingen van deze paragraaf zijn uitsluitend van toepassing op schepen, andere dan Nederlandse schepen, waarop
      het Verdrag van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      Op verzoek van een Staat, aangesloten bij het Verdrag, kan Onze Minister de bruto- en netto-tonnage van een schip
      vaststellen en ten behoeve van dit schip overeenkomstig het Verdrag een Internationale Meetbrief (1969) afgeven,
      zulks tegen betaling van de kosten, berekend volgens een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      Een afschrift van de in het eerste lid bedoelde meetbrief alsmede een afschrift van de berekeningen van de tonnages
      zullen zo spoedig mogelijk aan de Staat, die de vaststelling en afgifte heeft verzocht, worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel17
  - number: '17.3'
    text: |-
      Een meetbrief, afgegeven op de wijze, bedoeld in het eerste lid, moet een verklaring bevatten inhoudende dat de
      meetbrief is afgegeven op verzoek van de Staat wiens vlag het schip voert of zal gaan voeren.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel17
  - number: '17.4'
    text: |-
      Ten behoeve van een schip, de vlag voerende van een Staat, niet aangesloten bij het Verdrag, wordt geen
      Internationale Meetbrief (1969) afgegeven.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel17
  - number: '18'
    text: |-
      De Internationale Meetbrief (1969), afgegeven door een andere Staat, aangesloten bij het Verdrag, wordt, behoudens
      het bepaalde in [artikel 9][ref1], door Nederland erkend en voor alle doelstellingen, waarop het Verdrag betrekking
      heeft, door Nederland geacht dezelfde geldigheid te bezitten als de door Onze Minister, dan wel de inspecteur-
      generaal afgegeven meetbrieven.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel9
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '9'
        hoofdstuk: II
        paragraaf: B
  - number: '19.1'
    text: |-
      Op verzoek van een Staat, aangesloten bij het Verdrag, kan, voor de afgifte van een bijzondere meetbrief, speciaal
      ingericht ten gebruike voor de vaart door het Suezkanaal of het Panamakanaal, Onze Minister de tonnages vaststellen
      overeenkomstig de metingsvoorschriften voor de betreffende kanalen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel19
  - number: '19.2'
    text: |-
      De bijzondere meetbrieven, bedoeld in het eerste lid van dit artikel, dienen een verklaring te bevatten, inhoudende
      overeenkomstig welke bepalingen de tonnages van het schip, waarvoor de meetbrief is afgegeven, zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel19
  - number: '20'
    text: |-
      De bepalingen van deze paragraaf zijn uitsluitend van toepassing op schepen, andere dan Nederlandse schepen, waarop
      het Verdrag niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel20
  - number: '21.1'
    text: |-
      Op verzoek van een Staat, kan Onze Minister ten behoeve van een schip, geen Nederlands schip zijnde, een bijzondere
      meetbrief afgeven, zulks tegen betaling van de kosten, berekend volgens een door Onze Minister vast te stellen
      tarief.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel21
  - number: '21.2'
    text: |-
      Op de bijzondere meetbrief, afgegeven ingevolge het eerste lid van dit artikel, is het bepaalde in
      [artikel 17, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel17
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '17'
        hoofdstuk: III
        paragraaf: A
  - number: '21.3'
    text: |-
      De bijzondere meetbrief, bedoeld in het eerste lid van dit artikel, dient een verklaring te bevatten, inhoudende
      overeenkomstig welke bepalingen de tonnages van het schip, waarvoor de meetbrief is afgegeven, zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel21
  - number: '22'
    text: |-
      Bijzondere meetbrieven, afgegeven ingevolge [artikel 21, eerste lid][ref1], kunnen voor een bepaalde termijn of
      onder beperkingen worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel21
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '21'
        hoofdstuk: III
        paragraaf: B
  - number: '23'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot het in stand
      houden van merken op ladingruimten en het inleveren van ongeldig geworden meetbrieven.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel23
  - number: '24.1'
    text: |-
      Bij vertrek uit en bij binnenkomst in een Nederlandse haven moet elk schip, ongeacht welke vlag het voert, zijn
      voorzien van een geldige meetbrief.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: '24.2'
    text: |-
      De in het eerste lid bedoelde meetbrief moet worden getoond aan de ambtenaren van de rijksbelastingdienst, bevoegd
      inzake douane, bij gebreke waarvan deze ambtenaren geen expeditie verlenen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: '24.3'
    text: 'Als geldige meetbrieven worden alleen aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: 24.3.a
    text: Internationale Meetbrieven (1969);
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: 24.3.b
    text: meetbrieven afgegeven ingevolge de Meetbrievenwet 1948;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: 24.3.c
    text: |-
      Internationale Meetbrieven, afgegeven ingevolge het Verdrag van Oslo 1947, tot twaalf jaar na de datum van
      inwerkingtreding van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: 24.3.d
    text: door de inspecteur-generaal afgegeven of aanvaarde meetbrieven;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: 24.3.e
    text: door Onze Minister afgegeven of aanvaarde meetbrieven.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel24
  - number: '25.1'
    text: |-
      Met het toezicht op de naleving van de in [artikel 24, eerste lid][ref1], bedoelde verplichting zijn belast de
      ambtenaren van de Inspectie Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel24
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '24'
        hoofdstuk: V
  - number: '25.2'
    text: |-
      De toezichthouder dan wel de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1], oefent zijn bevoegdheden slechts uit ten
      aanzien van een schip, ongeacht welke vlag het voert, dat zich in een Nederlandse haven bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '25.3'
    text: |-
      De uitoefening van het toezicht dan wel de douanecontrole op de naleving mag in geen geval vertraging voor het
      schip meebrengen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien blijkt, dat de voornaamste kenmerken van het schip afwijken van die vermeld op de Internationale Meetbrief
      (1969), in dier voege, dat dit tot een vermeerdering van de bruto- of netto-tonnage leidt, wordt de Staat wiens
      vlag het schip voert hiervan door Onze Minister onmiddellijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel25
  - number: '25.5'
    text: |-
      Indien niet is voldaan aan de in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] of
      [artikel 1:5 van de Algemene douanewet][ref2] in samenhang met artikel 15, eerste lid, van Verordening
      (EU) nr. 952/2013 van het Europees Parlement en van de Raad van 9 oktober 2013 tot vaststelling van het
      douanewetboek van de Unie (PbEU 2013, L 269) bedoelde verplichting, verleent de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref3], geen expeditie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '26.1'
    text: |-
      Elk schip, ongeacht welke vlag het voert, dat zich bevindt in een Nederlandse haven en niet is voorzien van een
      meetbrief als bedoeld in [artikel 24, derde lid][ref1], is verplicht te voldoen aan een vordering van de ambtenaren
      van de Inspectie Verkeer en Waterstaat tot vaststelling van de bruto- en netto-tonnage van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel24
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '24'
        hoofdstuk: V
  - number: '26.2'
    text: |-
      Zolang de in het eerste lid bedoelde vaststelling niet heeft plaatsgevonden, verlenen de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane, geen expeditie.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel26
  - number: '27'
    text: |-
      De kapitein van een Nederlands schip, die daarmee een reis onderneemt zonder dat het schip is voorzien van een
      overeenkomstig de bij of krachtens deze wet gegeven voorschriften afgegeven meetbrief, welke geldig is op het
      ogenblik van vertrek, wordt gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel27
  - number: '28'
    text: |-
      De kapitein van een Nederlands schip, dat niet voldoet aan een der verplichtingen, vermeld in de
      [artikelen 25, eerste lid][ref1], en [26, eerste lid][ref2], wordt gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003378#Artikel26
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '25'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003378
        artikel: '26'
        hoofdstuk: V
  - number: '29'
    text: |-
      Overtreding van de voorschriften ingevolge [artikel 23][ref1] bij of krachtens algemene maatregel van bestuur
      vastgesteld, wordt, voor zover uitdrukkelijk als strafbaar feit aangemerkt, gestraft met geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel23
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '23'
        hoofdstuk: IV
  - number: '30'
    text: De bij of krachtens deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel30
  - number: '31'
    text: 'Met de opsporing van de feiten, strafbaar gesteld bij of krachtens deze wet, zijn belast:'
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel31
  - number: 31.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 31.b
    text: de ambtenaren van de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel31
  - number: 31.c
    text: de Nederlandse diplomatieke en consulaire ambtenaren;
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel31
  - number: 31.d
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel31
  - number: '32.1'
    text: Op meetbrieven, afgegeven ingevolge het bepaalde in de Meetbrievenwet 1948, blijft die wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel32
  - number: '32.2'
    text: Op Internationale Meetbrieven, afgegeven ingevolge het Verdrag van Oslo 1947, blijft dat Verdrag van toepassing.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel32
  - number: '33'
    text: |-
      De Meetbrievenwet 1948 en de nadere regelen ter uitvoering van deze wet worden ingetrokken met ingang van de datum,
      gelegen twaalf jaar na de datum van inwerkingtreding van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel33
  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van een goede uitvoering van deze wet nadere
      regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel34
  - number: '35'
    text: |-
      Deze wet, welke kan worden aangehaald als "Meetbrievenwet" onder vermelding van het jaartal van het *Staatsblad*
      waarin de wet is geplaatst, treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003378/2025-07-01#Artikel35
