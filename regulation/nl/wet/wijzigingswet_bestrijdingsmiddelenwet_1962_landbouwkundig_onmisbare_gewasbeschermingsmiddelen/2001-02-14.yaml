        artikel: 25c
      - id: ref2
        bwb_id: BWBR0002380
        artikel: 25c
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met dien verstande dat artikel II, eerste lid, terugwerkt tot en met 10 mei 2000.
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelIV
