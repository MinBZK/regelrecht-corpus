preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een voorziening dient te worden getroffen voor gewasbeschermingsmiddelen
    die landbouwkundig onmisbaar zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Gewasbeschermingsmiddelen, waarvan de werkzame stof of stoffen in de bijlage bij deze wet zijn
      opgenomen, zijn een gewasbeschermingsmiddel in de zin van de [Bestrijdingsmiddelenwet 1962][ref1]
      en zijn, in afwijking van de bij of krachtens de artikelen [3][ref2] en
      [3a van de Bestrijdingsmiddelenwet 1962][ref3] gestelde regelen of beginselen inzake de toelatingscriteria,
      bedoeld in [artikel 3, eerste lid, onderdeel a, ten negende en ten tiende, van voornoemde wet][ref4], en
      [artikel 4, eerste lid, van voornoemde wet][ref5], van rechtswege toegelaten in de zin van die wet voor de in
      de bijlage vermelde doeleinden voor een periode die eindigt met ingang van 1 juli 2001, met dien verstande dat
      [artikel 25c, tweede lid, van de Bestrijdingsmiddelenwet 1962][ref6] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0002380#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0002380#Artikel25c
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
