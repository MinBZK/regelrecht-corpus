      - id: ref3
        bwb_id: BWBR0002380
        artikel: '5'
  - number: II.5
    text: 'Onze Minister van Landbouw, Natuurbeheer en Visserij doet mededeling in de Staatscourant van:'
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
  - number: II.5.a
    text: het vervallen van een toelating als bedoeld in het eerste lid, indien niet voldaan is aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
  - number: II.5.b
    text: de toelating van rechtswege, indien aan het tweede lid is voldaan;
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
  - number: II.5.c
    text: |-
      een communautaire maatregel als bedoeld in het vierde lid, de gevolgen daarvan en het tijdstip waarop deze gevolgen
      intreden.
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
  - number: II.6
    text: |-
      Op gewasbeschermingsmiddelen, waarvan de werkzame stof door Onze betrokken Minister is aangewezen, is dit artikel
      voor de bij die aanwijzing vermelde doeleinden van overeenkomstige toepassing. Voor aanwijzing komen uitsluitend in
      aanmerking werkzame stoffen met betrekking tot gewasbeschermingsmiddelen en doeleinden daarvan ten aanzien waarvan
      zich een situatie als bedoeld in [artikel 25c, eerste lid, onderdeel a, van de Bestrijdingsmiddelenwet 1962][ref1]
      naar de mening van Onze betrokken Minister voor kan doen, met dien verstande dat
      [artikel 25c, tweede lid, van de Bestrijdingsmiddelenwet 1962][ref2] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel25c
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
    references:
