        artikel: 25c
  - number: II.2
    text: |-
      Indien vóór 1 juli 2001 een volledige aanvraag tot toelating op grond van
      [artikel 25c van de Bestrijdingsmiddelenwet 1962][ref1] is ingediend met overlegging van de vereiste gegevens en
      indien aan de overige bij of krachtens [artikel 4 van die wet][ref2] gestelde regels is voldaan, eindigt de in het
      eerste lid bedoelde periode van toelating met ingang van 1 juli 2002 of zoveel eerder als omtrent de aanvraag een
      beslissing is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 25c
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '4'
  - number: II.3
    text: |-
      Met betrekking tot de in het eerste en tweede lid bedoelde gewasbeschermingsmiddelen is het, onverminderd het
      in de bijlage bepaalde met betrekking tot de doeleinden waarvoor het middel mag worden gebruikt, verboden te
      handelen in strijd met de krachtens [artikel 5, tweede en derde lid, van de Bestrijdingsmiddelenwet 1962][ref1]
      gegeven voorschriften zoals deze golden tot het moment van beëindiging van de toelating en met de krachtens
      [artikel 13 van de Bestrijdingsmiddelenwet 1962][ref2] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel13
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '13'
  - number: II.4
    text: |-
      Ter uitvoering van een communautaire maatregel wordt, onverminderd het bepaalde in de artikelen [5][ref1] en
      [7, tweede lid, van de Bestrijdingsmiddelenwet 1962][ref2], een toelating, bedoeld in het eerste of tweede lid,
      ingetrokken of worden de voorschriften, bedoeld in [artikel 5, tweede lid, van die wet][ref3] gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002380#Artikel5
    url: https://wetten.overheid.nl/BWBR0012188/2001-02-14#ArtikelII
    references:
      - id: ref1
