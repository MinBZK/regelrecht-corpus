  - number: '15'
    text: |-
      De Regeling van de Minister van Sociale Zaken en Werkgelegenheid en de Minister van Verkeer en Waterstaat van 13
      december 1994, houdende regelen met betrekking tot de vaartijden en bemanningssterkte binnenvaart (Stcrt. 1994,
      248) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel15
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 2002.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Regeling vaartijden en bemanningssterkte binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel17
