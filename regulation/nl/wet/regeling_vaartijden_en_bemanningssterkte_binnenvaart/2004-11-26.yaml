---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vaartijden_en_bemanningssterkte_binnenvaart
regulatory_layer: WET
publication_date: '2008-05-15'
valid_from: '2004-11-26'
bwb_id: BWBR0014085
url: https://wetten.overheid.nl/BWBR0014085/2004-11-26
preamble:
  text: |-
    Gelet op de artikelen 6, eerste lid, en 9 van de Wet vaartijden en bemanningssterkte binnenvaart en de artikelen 1,
    onderdeel u, 19, derde lid, 21, derde lid, 23, eerste lid, 24, tweede en negende lid, en 26, eerste en achtste lid,
    van het Besluit vaartijden en bemanningssterkte binnenvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder besluit: [Besluit vaartijden en bemanningssterkte binnenvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007124
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007124
  - number: '2'
    text: |-
      Ten aanzien van de procedure voor de afgifte van een geneeskundige verklaring is het
      [Reglement Rijnpatenten 1998][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008934
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008934
  - number: '3'
    text: |-
      Ten aanzien van de kosten voor de afgifte van een geneeskundige verklaring is [artikel 1 van het Besluit][ref1],
      houdende vaststelling tarief kosten geneeskundig onderzoek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
  - number: '4.1'
    text: |-
      Het dienstboekje, het vaartijdenboek en de verklaring uitgifte vaartijdenboek worden afgegeven door de divisie
      Vervoer van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
  - number: '4.2'
    text: |-
      Indien een dienstboekje of een vaartijdenboek geheel of gedeeltelijk onleesbaar is dan wel
      verloren is geraakt of teniet gegaan, wordt met inachtneming van het derde en vierde lid en
      tegen betaling van de bedragen, bedoeld in [artikel 2, eerste lid][ref1], onderscheidenlijk
      __REF001___________________________________________________________________________________________________________
      _____ een vervangend exemplaar afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009085#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009085#Artikel3
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009085
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009085
        artikel: '3'
  - number: '4.3'
    text: |-
      Het vervangende exemplaar treedt in de plaats van het eerder afgegeven document en wordt niet eerder afgegeven
      dan nadat het geheel of ten dele onleesbaar geworden exemplaar, waarvoor het wordt afgegeven, is ingeleverd bij de
      divisie Vervoer van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
  - number: '4.4'
    text: |-
      In het geval dat een document verloren is geraakt of teniet is gegaan, wordt aan de divisie
      Vervoer van de Inspectie Verkeer en Waterstaat een bewijs overgelegd dat daarvan aangifte
      is gedaan bij een ambtenaar, aangesteld voor de uitvoering van de politietaak, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de Politiewet 1993][ref1]. Op bladzijde 1 van het vervangende exemplaar
      van het dienstboekje en het vaartijdenboek wordt aangetekend dat het hiervoor bedoelde bewijs is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '4.5'
    text: |-
      In het geval dat bij de verkoop van een schip de verkoper in gebreke blijft het bij het schip behorende
      vaartijdenboek aan de koper te leveren, kan dit bewijs van aangifte worden vervangen door een door de koper en de
      divisie Vervoer van de Inspectie Verkeer en Waterstaat te ondertekenen verklaring.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
  - number: '4.6'
    text: |-
      Indien het volgnummer van het te vervangen vaartijdenboek onbekend is bij de divisie Vervoer van de Inspectie
      Verkeer en Waterstaat wordt het nieuwe vaartijdenboek voorzien van het volgnummer 1.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel4
  - number: '5'
    text: |-
      Ten aanzien van de tachograaf, bedoeld in [artikel 1, onderdeel u, van het besluit][ref1] is de
      [Regeling typegoedkeuring en installatie tachografen Rijnvaart 1995][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007382
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007382
  - number: '6'
    text: |-
      Voor de behandeling van een aanvraag voor een ontheffing als bedoeld in [artikel 7, eerste lid, van de wet][ref1]
      is de aanvrager aan het Rijk een bedrag verschuldigd van € 42.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel7
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '7'
  - number: '7.1'
    text: |-
      Ten aanzien van motorschepen met een lengte van minder dan 55 meter wordt vrijstelling verleend van de ingevolge
      [artikel 12, eerste lid, van het besluit][ref1] voorgeschreven minimumbemanning, mits voldaan wordt aan de volgende
      voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
  - number: 7.1.a
    text: 'hetzij:'
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.1º
    text: de minimumbemanning bestaat uit een schipper;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.2º
    text: de maximale vaartijd van het schip bedraagt 12 uur per dag en 50 uur per kalenderweek;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.3º
    text: |-
      de minimale dagelijkse ononderbroken rusttijd van de schipper bedraagt ten minste 12 uur in elke periode van 24
      uur, te rekenen vanaf het einde van iedere rustperiode van ten minste 12 uur;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.4º
    text: |-
      het schip onderbreekt de vaart gedurende een periode van 12 uur waarin de periode van 22.00 uur tot 6.00 uur is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.5º
    text: er is een vanuit het stuurhuis bedienbaar reserve-toplicht aanwezig;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.6º
    text: |-
      het schip is uitgerust met een goed functionerende tachograaf die in werking is gesteld vanaf het begin van de
      voorafgaande ten minste 8 aaneengesloten uren durende onderbreking van de vaart en waarvan de gegevens gedurende
      ten minste zes maanden na de laatste aantekening daarop in chronologische volgorde aan boord worden bewaard;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.7º
    text: |-
      vervoer van stoffen waarvoor op grond van het ADNR een certificaat van goedkeuring als bedoeld in
      [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1] is vereist, is niet
      toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: 7.1.a.8º
    text: er wordt niet gevaren op de Westerschelde;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.a.9º
    text: |-
      het schip voldoet aan [artikel 13 van het besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel13
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '13'
  - number: 7.1.a.10º
    text: |-
      voor zover het motorschip een lengte heeft van meer dan 33 meter, is actieve boegbesturing bedienbaar vanuit het
      stuurhuis aanwezig;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.b
    text: 'hetzij:'
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.b.1º
    text: de minimumbemanning bestaat uit een schipper en een lichtmatroos of deksman;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.b.2º
    text: indien tussen 22.00 en 06.00 wordt gevaren, is de onder 1° bedoelde lichtmatroos of deksman18 jaar of ouder; en
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.1.b.3º
    text: de voorschriften, bedoeld in onderdeel a, onder 7° tot en met 10°, worden in acht genomen
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: '7.2'
    text: |-
      Een wisseling van de vaart met gebruikmaking van de vrijstelling onder de voorschriften van het eerste lid,
      onderdeel a, naar de exploitatiewijze A1, A2 of B, is slechts toegestaan indien:
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.2.a
    text: de schipper is afgelost, of
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: 7.2.b
    text: |-
      bij controle kan worden aangetoond dat het voor de exploitatiewijze A1, A2 of B bestemde bemanningslid dat niet
      is afgelost, onmiddellijk voor de wisseling een onafgebroken rusttijd van 8 uur buiten de vaartijd in acht heeft
      genomen, en de voor deze exploitatiewijzen voorgeschreven minimumbemanning zich aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: '7.3'
    text: |-
      Van de exploitatiewijze A1, A2 of B mag slechts naar de vaart met gebruikmaking van de vrijstelling onder de
      voorschriften van het eerste lid, onderdeel a, worden overgegaan, indien de voor de vaart onder de in het eerste
      lid, onderdeel a, bedoelde vrijstelling voorgeschreven schipper onmiddellijk voor de wisseling geen deel heeft
      uitgemaakt van de bemanning van het schip, dan wel bij controle kan worden aangetoond dat de schipper, indien deze
      niet is afgelost, onmiddellijk voor de wisseling een rusttijd van 12 uur buiten de vaartijd van het schip in acht
      heeft genomen.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: '7.4'
    text: |-
      Een schip kan onmiddellijk in aansluiting op de vaart met gebruikmaking van de vrijstelling onder de voorschriften
      van het eerste lid, onderdeel a, voor een identieke vaart worden ingezet indien de schipper wordt vervangen door
      een andere schipper.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: '7.5'
    text: |-
      Het aantonen van de rusttijd, bedoeld in het eerste lid, onderdeel a, onder 3°, derde en vierde lid, geschiedt door
      middel van het vaartijdenboek van het schip.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel7
  - number: '8'
    text: |-
      Ten aanzien van schepen in gebruik bij het Rijk, de provincie, de gemeente, het havenschap Havenbedrijf
      Rotterdam N.V. voorzover ingezet voor de uitoefening van een publiekrechtelijke taak of bij een van de regionale
      politiekorpsen bedoeld in [artikel 21, derde lid, van de Politiewet 1993][ref1], wordt vrijstelling verleend van de
      [artikelen 9 tot en met 11][ref2] en [24 tot en met 28 van het besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007124#Artikel24
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007124
        artikel: '24'
  - number: '9.1'
    text: |-
      Ten aanzien van passagiersschepen die in de exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 12b, eerste lid, van het besluit][ref1] voorgeschreven minimumbemanning, mits voldaan wordt aan de
      volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: 12b
  - number: 9.1.a
    text: |-
      de minimumbemanning bestaat uit: - voor de passagiersschepen uit groep 4 die minder dan 601 passagiers aan boord
      hebben: de minimumbemanning uit groep 3 voor de exploitatiewijze A1;
        - voor de passagiersschepen uit groep 3 die minder dan 251 passagiers aan boord hebben: de minimumbemanning uit
      groep 2 voor de exploitatiewijze A1;
        - voor de passagiersschepen uit groep 2 die minder dan 76 passagiers aan boord hebben: de minimumbemanning uit
      groep 1 voor de exploitatiewijze A1; en
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel9
  - number: 9.1.b
    text: |-
      voor het begin van de vaart en telkens na elke onderbreking van de vaart wanneer passagiers embarkeren of
      debarkeren legt de schipper het aantal passagiers dat aan boord is schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel9
  - number: '9.3'
    text: |-
      Ten aanzien van de in het tweede lid bedoelde passagierschepen is in geval van vaart zonder
      passagiers [artikel 7, eerste lid, onderdeel a, en tweede lid][ref1], van overeenkomstige toepassing,
      onder voorwaarde dat het schip beschikt over vrij toegankelijke gangboorden die voldoen aan de in
      [bijlage II, artikel 11.15, derde lid, van het Binnenschepenbesluit][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0014085#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014085
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004196
  - number: '10.1'
    text: |-
      Ten aanzien van rondvaartboten van het Amsterdamse grachtentype als bedoeld in
      [artikel 1, tweede lid, van de Regeling rondvaartboten van het Amsterdamse grachtentype][ref1]
      wordt, voor zover zij in de exploitatiewijze A1 varen, vrijstelling verleend van de ingevolge
      [artikel 12b, eerste lid, van het besluit][ref2] voorgeschreven bemanning, mits de minimumbemanning bestaat uit
      een schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0004942#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004942
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: 12b
  - number: '10.2'
    text: |-
      Ten aanzien van open rondvaartboten als bedoeld in
      [artikel 1, tweede lid, van de Regeling open rondvaartboten][ref1] wordt, voor zover zij in de exploitatiewijze
      A1 varen, vrijstelling verleend van de ingevolge [artikel 12b, eerste lid, van het besluit][ref2] voorgeschreven
      bemanning, en van [artikel 13 van het besluit][ref3], mits de minimumbemanning bestaat uit een schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0004941#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0007124#Artikel13
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004941
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: 12b
      - id: ref3
        bwb_id: BWBR0007124
        artikel: '13'
  - number: '12'
    text: |-
      Ten aanzien van schepen, bestemd of gebruikt voor het bedrijfsmatig vervoer van meer dan 12 personen buiten
      de bemanning en ingericht om hoofdzakelijk door middel van zeilen te worden voortbewogen, wordt, voorzover zij
      in exploitatiewijze A1 varen, vrijstelling verleend van [artikel 10 van het besluit][ref1] en van de ingevolge
      [artikel 12b, eerste en derde lid, van het besluit][ref2] voor groep 1 voorgeschreven minimumbemanning, mits deze
      bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: 12b
  - number: 12.a
    text: een schipper, en
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel12
  - number: 12.b
    text: een lichtmatroos of deksman, die ten minste 18 jaar is.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel12
  - number: '13'
    text: |-
      Van de ingevolge [artikel 12b, eerste lid, van het besluit][ref1] voorgeschreven bemanning en van
      [artikel 13 van het besluit][ref2], wordt vrijstelling verleend mits de minimumbemanning bestaat uit een schipper,
      ten aanzien van schepen die:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel13
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: 12b
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '13'
  - number: 13.a
    text: zijn bestemd of worden gebezigd voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de bemanning;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel13
  - number: 13.b
    text: zijn ingericht voor de sportvisserij;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel13
  - number: 13.c
    text: |-
      varen op, dan wel op weg zijn van of naar de binnenwateren, ingedeeld in `Nederland Zone 2', bedoeld in
      [bijlage I van het Binnenschepenbesluit][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: 13.d
    text: in exploitatiewijze A1 varen.
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel13
  - number: '14.1'
    text: |-
      Ten aanzien van motorschepen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 12, eerste lid, van het besluit][ref1] voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt
      aan de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '12'
  - number: 14.1.1º
    text: de minimumbemanning bestaat uit een schipper en een stuurman;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel14
  - number: 14.1.2º
    text: het schip onderbreekt de vaart gedurende de periode tussen 22.00 uur en 06.00 uur;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel14
  - number: 14.1.3º
    text: |-
      het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip;
    url: https://wetten.overheid.nl/BWBR0014085/2004-11-26#Artikel14
  - number: 14.1.4º
    text: |-
