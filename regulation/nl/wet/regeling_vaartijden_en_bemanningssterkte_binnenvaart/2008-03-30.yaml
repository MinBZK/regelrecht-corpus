  - number: '14'
    text: |-
      1 Ten aanzien van motorschepen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 12, eerste lid, van het besluit][ref1] voor groep 3 voorgeschreven minimumbemanning, mits voldaan wordt
      aan de volgende voorschriften:

      1º. de minimumbemanning bestaat uit een schipper en een stuurman;

      2º. het schip onderbreekt de vaart gedurende de periode tussen 22.00 uur en 06.00 uur;

      3º. het schip is bij het begin van de vaart vaarklaar en tijdens de vaart worden geen werkzaamheden verricht die
      betrekking hebben op het laad- of losklaar maken van het schip;

      4º. het schip is voorzien van de optische hulpmiddelen om te kunnen voldoen aan
      [artikel 1.09, derde lid, van het Binnenvaartpolitiereglement][ref2];

      5º. het schip is uitgerust met een éénmansstuurstelling voor het varen op radar en voldoet aan de daarop
      betrekking hebbende artikelen in hoofdstuk 7 van het Besluit Reglement onderzoek schepen op de Rijn 1995 dan wel
      [Bijlage II, artikel 9.10, van het Binnenschepenbesluit][ref3]; en

      6º. het schip voldoet blijkens een verklaring van de inspecteur-generaal van de Inspectie Verkeer en Waterstaat,
      zoals genoemd in [artikel 13, tweede lid, van het besluit][ref4], aan de eisen van de Standaard S2.

      2 Ten aanzien van motorschepen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 12, eerste lid, van het besluit][ref5], voorgeschreven minimumbemanning, mits voldaan wordt aan de
      volgende voorschriften:

      1º. de minimumbemanning bestaat uit twee schippers en één matroos; en

      2º. de voorschriften, bedoeld in het eerste lid onder 5° en 6°.

      3 Ten aanzien van hechte samenstellen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolgde [artikel 12a, eerste lid, van het besluit][ref6] voor groep 3 voorgeschreven minimumbemanning, mits
      voldaan wordt aan de volgende voorschriften:

      1º. de minimumbemanning bestaat uit een schipper en een stuurman;

      2º. de voorschriften, bedoeld in het eerste lid, onder 2° tot en met 5°; en

      3º. het schip voldoet blijkens een verklaring van de inspecteur-generaal van de Inspectie Verkeer en Waterstaat als
      bedoeld in [artikel 13, tweede lid, van het besluit][ref7], aan de eisen van de Standaard S2.

      4 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 12a, eerste lid, van het besluit][ref8] voor groep 3 voorgeschreven minimumbemanning, mits
      voldaan wordt aan de volgende voorschriften:

      1º. de minimumbemanning bestaat uit twee schippers en een matroos; en

      2º. de voorschriften, bedoeld in het eerste lid, onder 5°, en het derde lid, onder 3°.

      5 Ten aanzien van hechte samenstellen die in exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 12a, eerste lid, van het besluit][ref9] voor groep 4 voorgeschreven minimumbemanning, mits
      voldaan wordt aan de volgende voorschriften:

      1º. de minimumbemanning bestaat uit een schipper, een stuurman en een matroos; en

      2º. de voorschriften, bedoeld in het eerste lid, onder 5°, en het derde lid, onder 3°.

      6 Ten aanzien van hechte samenstellen die in exploitatiewijze A2 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 12a, eerste lid, van het besluit][ref10] voor groep 4 voorgeschreven minimumbemanning, mits
      wordt voldaan aan de volgende voorschriften:

      1º. de minimumbemanning bestaat uit twee schippers en twee matrozen; en

      2º. de voorschriften, bedoeld in het eerste lid, onder 5°, en het derde lid, onder 3°.


