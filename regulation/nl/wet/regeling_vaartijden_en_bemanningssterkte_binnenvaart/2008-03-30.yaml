  - number: '2'
    text: |-
      Ten aanzien van de procedure voor de afgifte van een geneeskundige verklaring geldt de
      [Regeling medische keuringen binnenvaart 2008][ref1] en is het [Reglement Rijnpatenten 1998][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023699
      [ref2]: https://wetten.overheid.nl/BWBR0008934
    url: https://wetten.overheid.nl/BWBR0014085/2008-03-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023699
      - id: ref2
        bwb_id: BWBR0008934
  - number: '3'
    text: |-
      Ten aanzien van de kosten voor de afgifte van een geneeskundige verklaring is [artikel 1 van het Besluit][ref1],
      houdende vaststelling tarief kosten geneeskundig onderzoek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0014085/2008-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
  - number: '4'
    text: |-
      1 Het dienstboekje, het vaartijdenboek en de verklaring uitgifte vaartijdenboek worden afgegeven door de
      inspecteur-generaal van de Inspectie Verkeer en Waterstaat.

      2 Indien een dienstboekje of een vaartijdenboek geheel of gedeeltelijk onleesbaar is dan wel verloren is geraakt
      of teniet gegaan, wordt met inachtneming van het derde en vierde lid en tegen betaling van de door de Minister van
      Verkeer en Waterstaat vastgestelde tarieven een vervangend exemplaar afgegeven.

      3 Het vervangende exemplaar treedt in de plaats van het eerder afgegeven document en wordt niet eerder afgegeven
      dan nadat het geheel of ten dele onleesbaar geworden exemplaar, waarvoor het wordt afgegeven, is ingeleverd bij de
      instelling die dit document uitgeeft.

      4 In het geval dat een document verloren is geraakt of teniet is gegaan, wordt aan de instelling die dit document
      uitgeeft een bewijs overgelegd dat daarvan aangifte is gedaan bij een ambtenaar, aangesteld voor de uitvoering van
      de politietaak, bedoeld in [artikel 3, eerste lid, onderdeel a, van de Politiewet 1993][ref1]. Op bladzijde 1 van
      het vervangende exemplaar van het dienstboekje en het vaartijdenboek wordt aangetekend dat het hiervoor bedoelde
      bewijs is overgelegd.

      5 In het geval dat bij de verkoop van een schip de verkoper in gebreke blijft het bij het schip behorende
      vaartijdenboek aan de koper te leveren, kan dit bewijs van aangifte worden vervangen door een door de koper en de
      instelling die dit document uitgeeft te ondertekenen verklaring.

      6 Indien het volgnummer van het te vervangen vaartijdenboek onbekend is bij de instelling die dit document uitgeeft
      wordt het nieuwe vaartijdenboek voorzien van het volgnummer 1.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0014085/2008-03-30#Artikel4
    references:
