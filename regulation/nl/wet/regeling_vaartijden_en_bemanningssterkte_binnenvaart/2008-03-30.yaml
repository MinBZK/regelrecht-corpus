      1 Ten aanzien van rondvaartboten van het Amsterdamse grachtentype als bedoeld in
      [artikel 1, tweede lid, van de Regeling rondvaartboten van het Amsterdamse grachtentype][ref1]
      wordt, voor zover zij in de exploitatiewijze A1 varen, vrijstelling verleend van de ingevolge
      [artikel 12b, eerste lid, van het besluit][ref2] voorgeschreven bemanning, mits de minimumbemanning bestaat uit
      een schipper.

      2 Ten aanzien van open rondvaartboten als bedoeld in
      [artikel 1, tweede lid, van de Regeling open rondvaartboten][ref3] wordt, voor zover zij in de exploitatiewijze
      A1 varen, vrijstelling verleend van de ingevolge [artikel 12b, eerste lid, van het besluit][ref4] voorgeschreven
      bemanning, en van [artikel 13 van het besluit][ref5], mits de minimumbemanning bestaat uit een schipper.


