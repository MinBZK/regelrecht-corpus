      1 Ten aanzien van passagiersschepen die in de exploitatiewijze A1 varen, wordt vrijstelling verleend van de
      ingevolge [artikel 12b, eerste lid, van het besluit][ref1] voorgeschreven minimumbemanning, mits voldaan wordt aan
      de volgende voorschriften:

      a. de minimumbemanning bestaat uit:

        - voor de passagiersschepen uit groep 4 die minder dan 601 passagiers aan boord hebben: de minimumbemanning uit
      groep 3 voor de exploitatiewijze A1;
        - voor de passagiersschepen uit groep 3 die minder dan 251 passagiers aan boord hebben: de minimumbemanning uit
      groep 2 voor de exploitatiewijze A1;
        - voor de passagiersschepen uit groep 2 die minder dan 76 passagiers aan boord hebben: de minimumbemanning uit
      groep 1 voor de exploitatiewijze A1; en

      b. voor het begin van de vaart en telkens na elke onderbreking van de vaart wanneer passagiers embarkeren of
      debarkeren legt de schipper het aantal passagiers dat aan boord is schriftelijk vast.

      2

      Ten aanzien van passagiersschepen uit groep 1 met een lengte van maximaal 45 meter en een capaciteit van
      maximaal 40 personen die in de exploitatiewijze A1 varen, wordt vrijstelling verleend van de ingevolge
      [artikel 12b, eerste en derde lid, van het besluit][ref2] voorgeschreven minimumbemanning, mits de minimumbemanning
      bestaat uit een schipper en een lichtmatroos of een deksman van ten minste 18 jaar en het schip de vaart
      onderbreekt gedurende een periode van ten minste 16 uur, waarin de periode van 22.00 uur tot 06.00 uur is gelegen.

      3 Ten aanzien van de in het tweede lid bedoelde passagierschepen is in geval van vaart zonder
      passagiers [artikel 7, eerste lid, onderdeel a, en tweede lid][ref3], van overeenkomstige toepassing,
      onder voorwaarde dat het schip beschikt over vrij toegankelijke gangboorden die voldoen aan de in
      [bijlage II, artikel 11.15, derde lid, van het Binnenschepenbesluit][ref4] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
