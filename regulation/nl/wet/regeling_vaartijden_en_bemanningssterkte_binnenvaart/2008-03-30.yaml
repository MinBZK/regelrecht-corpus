  - number: '13'
    text: |-
      Van de ingevolge [artikel 12b, eerste lid, van het besluit][ref1] voorgeschreven bemanning en van
      [artikel 13 van het besluit][ref2], wordt vrijstelling verleend mits de minimumbemanning bestaat uit een schipper,
      ten aanzien van schepen die:

      a. zijn bestemd of worden gebezigd voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de bemanning;

      b. zijn ingericht voor de sportvisserij;

      c. varen op, dan wel op weg zijn van of naar de binnenwateren, ingedeeld in `Nederland Zone 2', bedoeld in
      [bijlage I van het Binnenschepenbesluit][ref3]; en

      d. in exploitatiewijze A1 varen.


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel13
