---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vrijstellingsregeling_grootverpakkingen_zuigelingenvoeding
regulatory_layer: WET
publication_date: '2007-09-28'
valid_from: '1996-07-12'
bwb_id: BWBR0008155
url: https://wetten.overheid.nl/BWBR0008155/1996-07-12
preamble:
  text: |-
    Handelende mede namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op artikel 15, eerste lid, van het Landbouwkwaliteitsbesluit zuigelingenvoeding;

    Gezien het advies van:

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder:

             bestuur:

              centraal bestuur van de Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;



             grootverpakking:

              verpakking van meer dan 10 kg die niet bestemd of geschikt is om rechtstreeks aan de eindverbruiker te
      worden geleverd, niet zijnde een verzendverpakking.
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel1
  - number: '2'
    text: |-
      Voor zuigelingenvoeding welke is verpakt in een grootverpakking wordt vrijstelling verleend van het bepaalde in de
      artikelen 14, 15, 16, 17 en 18 van de Landbouwkwaliteitsregeling zuigelingenvoeding 1994 voorzover voldaan is aan
      de [artikelen 3][ref1] en [4][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008155#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008155#Artikel4
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008155
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008155
        artikel: '4'
  - number: '3.1'
    text: |-
      In afwijking van het [Warenwet][ref1]-besluit Etikettering van levensmiddelen is in Nederland verpakte
      zuigelingenvoeding verpakt in een grootverpakking voorzien van aanduidingen:


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 3.1.a
    text: |-
      ter zake van de aard en samenstelling, zulks op zodanige wijze dat deze kwalitatief en kwantitatief voldoende
      duidelijk zijn;
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel3
  - number: 3.1.b
    text: |-
      zoals genoemd in artikel 68, eerste lid, onder b tot en met d, van de Landbouwkwaliteitsregeling poedervormige
      melkprodukten.
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid genoemde aanduidingen zijn duidelijk leesbaar, als zodanig herkenbaar en onuitwisbaar
      aangebracht op de verpakking.
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel3
  - number: '3.3'
    text: |-
      Door of namens het bestuur kan van het bepaalde in het eerste en tweede lid ontheffing worden verleend, uitsluitend
      voorzover in het land van bestemming ter zake andere regels zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel3
  - number: '4'
    text: |-
      De aanduidingen, bedoeld in [artikel 3][ref1], worden in een geschikte taal aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008155#Artikel3
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008155
        artikel: '3'
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Vrijstellingsregeling grootverpakkingen zuigelingenvoeding.'
    url: https://wetten.overheid.nl/BWBR0008155/1996-07-12#Artikel6
