preamble:
  text: |-
    Gelet op richtlijn 92/66/EEG van de Raad van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van de ziekte van Newcastle (PbEG L 260) en richtlijn 90/539/EEG van de Raad van 15 oktober 1990 tot
    vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit
    derde landen van pluimvee en broedeieren (PbEG L 303);

    Gelet op de artikelen 17, 18 en 30 van de Gezondheids- en welzijnswet voor dieren, op artikel 19 van de Landbouwwet
    en op de artikelen 2 en 3 van het Besluit gebruik sera en entstoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012614/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *Minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *dieren:*


              kippen en kalkoenen;



            c

              *pluimveebedrijf:*


              inrichting die wordt gebruikt voor het anders dan voor recreatieve of educatieve doeleinden fokken,
      opfokken of houden van fokdieren, vleesdieren of legdieren;



            d

              *koppel:*


              groep dieren met dezelfde gezondheids- en immuniteitsstatus, die in eenzelfde lokaal of een zelfde
      uitloopruimte wordt opgefokt en die een epizoötiologische eenheid vormen;



            e

              *eendagskuikens:*


              dieren die nog geen 72 uur oud zijn en die nog niet zijn gevoerd;



            f

              *vleeskuikens:*


              kippen van 72 uur en ouder die worden opgefokt voor de productie van vlees;



            g

              *vleeskalkoenen:*


              kalkoenen van 72 uur en ouder die worden opgefokt voor de productie van vlees;



            h

              *richtlijn 92/66/EEG:*


              [Richtlijn 92/66/EEG](31992L0066) van de Raad van 14 juli 1992 tot vaststelling van communautaire
      maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L 260);



            i
            leghennen:

              dieren bestemd voor productie van consumptie-eieren;



            j
             reproductiedieren:

              dieren bestemd voor productie van broedeieren;



            k
             koppel vleeskuikens:

              vleeskuikens, gehuisvest op een locatie met hetzelfde UBN, met dezelfde gezondheids- en immuniteitsstatus
      die binnen een periode van drie achtereenvolgende dagen zijn geboren;



            l
             koppel vleeskalkoenen:

              vleeskalkoenen van hetzelfde geslacht, gehuisvest op een locatie met hetzelfde UBN, met dezelfde
      gezondheids- en immuniteitsstatus, die binnen een periode van drie achtereenvolgende dagen zijn geboren;



            m
            UBN:

              een, ter identificatie van het bedrijf, door de Minister erkend uniek bedrijfsnummer;



            n
            VWA:

              de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);



            o

              *NCD:*


              Newcastle disease (pseudovogelpest).
    url: https://wetten.overheid.nl/BWBR0012614/2003-01-01#Artikel1
  - number: '2'
    text: |-
      1 De ondernemer vaccineert de op zijn pluimveebedrijf aanwezige dieren ten genoegen van de Minister onder
      verantwoordelijkheid van een dierenarts overeenkomstig een van de in [bijlage I][ref1] bedoelde methoden en
      overeenkomstig de in die bijlage bedoelde voorschriften tegen NCD.

      2 Het eerste lid is niet van toepassing op dieren die voorafgaand aan de aanvoer op het pluimveebedrijf van de
      ondernemer overeenkomstig het eerste lid zijn gevaccineerd en waarvan de ondernemer ten genoegen van de Minister
      aantoont dat ze aan de in het vierde lid bedoelde waarde voldoen, en op eendagskuikens waarvan de ouderdieren aan
      deze waarde voldoen.

      3 De ondernemer laat van de dieren van zijn pluimveebedrijf bloed afnemen en laat dit, met gebruikmaking van een
      ingevuld en ondertekend formulier overeenkomstig het in [bijlage IV][ref2] bedoelde model, ten genoegen van de
      Minister en bij een door de Minister aangewezen laboratorium onderzoeken op de aanwezigheid van antistoffen tegen
      NCD, overeenkomstig de in [bijlage II][ref3] bedoelde voorschriften en overeenkomstig de in bijlage 3, hoofdstuk 5,
      van [richtlijn 92/66/EEG](31992L0066) bedoelde methode.

      4 Bij koppels, niet zijnde koppels vleeskuikens en koppels vleeskalkoenen, voldoet vanaf een leeftijd van 28 dagen
      ten minste één van de dertig onderzochte monsters en vanaf een leeftijd van 70 dagen ten minste 90% van het aantal
      onderzochte monsters aan de waarde gemeten in de haemagglutinatie-inhibitie-test van 1:8.

      5 Bij koppels vleeskuikens en koppels vleeskalkoenen voldoet vanaf een leeftijd van 28 dagen ten minste één van de
      dertig onderzochte monsters aan de waarde gemeten in de haemagglutinatie-inhibitie-test van 1:8.

      6 Indien uit het in het derde lid bedoelde onderzoek blijkt dat de immuniteit van de desbetreffende dieren, niet
      zijnde koppels vleeskuikens en koppels vleeskalkoenen, niet voldoet aan de in het vierde lid bedoelde waarde
      zorgt de ondernemer terstond voor het door een dierenarts vaccineren van de dieren overeenkomstig een van de
      in [bijlage I][ref4] bedoelde methoden en overeenkomstig de in die bijlage bedoelde voorschriften en laat de
      ondernemer de dieren uiterlijk twee weken na het vaccineren opnieuw onderzoeken overeenkomstig het derde lid.

      7 Indien uit het in het derde lid bedoelde onderzoek van vleeskuikens en vleeskalkoenen blijkt dat de immuniteit
      van de desbetreffende dieren niet voldoet aan de in het vijfde lid bedoelde waarde zorgt de ondernemer voor het
      vaccineren van het eerstvolgende koppel door een dierenarts overeenkomstig een van de in [bijlage I][ref5] bedoelde
      methoden en overeenkomstig de in die bijlage bedoelde voorschriften.

      8 Indien uit het in het derde lid bedoelde onderzoek blijkt dat de immuniteit van het in het zevende lid bedoelde
      eerstvolgende koppel niet voldoet aan de in het vijfde lid bedoelde waarde zorgt de ondernemer gedurende één jaar
      voor het vaccineren van alle koppels vleeskuikens of vleeskalkoenen die op zijn bedrijf worden gehouden door een
      dierenarts overeenkomstig de in [bijlage V][ref6] bedoelde voorschriften.


