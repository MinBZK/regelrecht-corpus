  - number: '5'
    text: |-
      Vaccinatieverklaringen die overeenkomstig artikel 9, eerste lid, van de Verordening N.C.D.-bestrijding 1976 van
      het Landbouwschap zijn ingevuld en ondertekend, worden beschouwd als vaccinatieverklaringen in de zin van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0012614/2003-01-01#Artikel5
