  - number: '3'
    text: |-
      1 De ondernemer draagt terstond nadat de vaccinaties zijn verricht zorg voor het invullen en ondertekenen van een
      vaccinatieverklaring overeenkomstig het in [bijlage III][ref1] bedoelde model.

      2 De ondernemer overlegt in de periode van 72 tot 24 uur vóór het slachten aan de keuringsdierenarts of diens
      assistent in het slachthuis een kopie van de op de desbetreffende dieren betrekking hebbende vaccinatieverklaringen
      en een kopie van de uitslagen van het in [artikel 2, derde lid][ref2], bedoelde onderzoek van bloed van de
      desbetreffende dieren.

      3 In afwijking van het tweede lid overlegt de ondernemer in de periode van 72 tot 24 uur vóór het slachten aan
      de keuringsdierenarts of diens assistent in het slachthuis van koppels, voorzover het betreft vleeskuikens en
      vleeskalkoenen, de uitslagen van het in [artikel 2, derde lid][ref3], bedoelde onderzoek van bloed van het vorige
      koppel dat ter slacht is aangeboden.

      4 De ondernemer bewaart de in het eerste lid bedoelde vaccinatieverklaringen en van de uitslagen van het in
      [artikel 2, derde lid][ref4], bedoelde onderzoek gedurende een periode van vijf jaren op zijn bedrijf.

      5 In afwijking van het vierde lid bewaart de ondernemer die leghennen dan wel reproductiedieren houdt gedurende
      een periode van vijf jaren op zijn bedrijf de in het eerste lid bedoelde vaccinatieverklaringen en de uitslagen
      van het in [artikel 2, derde lid][ref5], bedoelde onderzoek, voorzover de genoemde gegevens betrekking hebben
      op vaccinaties en bloedonderzoeken die op het bedrijf of op een bedrijf waar de dieren eerder zijn gehouden zijn
      verricht.


