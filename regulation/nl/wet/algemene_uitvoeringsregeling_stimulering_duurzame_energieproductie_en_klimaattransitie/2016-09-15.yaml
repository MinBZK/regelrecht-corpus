  - number: '4'
    text: |-
      De subsidie-ontvanger meet de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas per
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0023563/2016-09-15#Artikel4
  - number: '6'
    text: |-
      1 Indien aan een subsidieontvanger die een productie-installatie bedrijft waarin door middel van thermische
      conversie vloeibare biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare warmte uitsluitend
      subsidie wordt verstrekt voor zover de subsidieontvanger per levering aantoont dat de gebruikte vloeibare biomassa
      voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn hernieuwbare energie,
      toont de subsidieontvanger dit aan met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      2 Een subsidie-ontvanger toont door middel van certificaten, afgegeven op basis van een certificeringsysteem
      waarvan de Europese Commissie op grond van artikel 18, vierde lid, van de richtlijn hernieuwbare energie heeft
      besloten dat deze accurate gegevens bevat met het oog op de toepassing van artikel 17 van de richtlijn hernieuwbare
      energie, aan dat vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0023563/2016-09-15#Artikel6
  - number: '7'
    text: |-
      Een subsidieontvanger die een productie-installatie bedrijft voor de productie van stoom door middel van
      verbranding van houtpellets in een ketel met een vermogen groter dan of gelijk aan 10 MW, of die een productie-
      installatie bedrijft waarin vaste of gasvormige biomassa wordt omgezet in hernieuwbare elektriciteit, of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van
      elektriciteit door middel van kolen waarin biomassa wordt meegestookt, maakt gebruik van biomassa die aantoonbaar
      per levering voldoet aan de duurzaamheidseisen, bedoeld in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2016-09-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7b
    text: |-
      1 De subsidie-ontvanger die een productie-installatie bedrijft waarin vaste of gasvormige biomassa wordt omgezet in
      hernieuwbare elektriciteit, of hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door een productie-
      installatie voor de productie van elektriciteit door middel van kolen waarin biomassa wordt meegestookt of
      een productie-installatie bedrijft waarin vaste biomassa wordt omgezet in hernieuwbare warmte door middel van
      verbranding van houtpellets geproduceerd uit vaste biomassa in een ketel met een vermogen groter dan of gelijk
      aan 10 MW, zendt binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot wordt verstrekt
      aan de minister een verklaring waaruit blijkt dat de gebruikte biomassa aan de duurzaamheidscriteria, bedoeld in
      [artikel 7][ref1], voldoet, met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      2 De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid die kleiner is dan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op regionaal niveau
      of op het niveau van de bosbeheereenheid aan dat aan de duurzaamheidscriteria is voldaan, met uitzondering van:

      a. de laatste twee jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2015 of 2016 in gebruik of opnieuw in gebruik is genomen, waarvoor op het
      niveau van de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidscriteria is voldaan,

      b. de laatste drie jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2017 of 2018 in gebruik of opnieuw in gebruik is genomen, waarvoor op het
      niveau van de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidscriteria is voldaan,

      c. de laatste vier jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2019 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van
      de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidscriteria is voldaan,

      d. de laatste vijf jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2020 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van
      de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidscriteria is voldaan,

      e. een subsidie-ontvanger die een productie-installatie bedrijft die na 2020 in gebruik of opnieuw in gebruik is
      genomen, waarvoor voor de gehele subsidieperiode op het niveau van de bosbeheereenheid wordt aangetoond dat aan de
      duurzaamheidscriteria is voldaan.

      3 De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid groter dan of gelijk aan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op het niveau
      van de bosbeheereenheid aan dat aan de duurzaamheidscriteria is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
