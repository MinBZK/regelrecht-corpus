    text: |-
        - *besluit:* [Besluit stimulering duurzame energieproductie][ref1];
        - *cumulatietoets:* toets aan de steunruimte zoals die is gemaximeerd in de Communautaire richtsnoeren inzake
      staatssteun voor milieubescherming (PbEG 2008 C 82);
        - *bosbeheereenheid:* een of meer bospercelen die als één geheel worden beheerd;
        - *ean-code:* uniek 18-cijferig nummer dat dient om een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of hernieuwbaar gas of een aansluiting van een productie-installatie of een
      productie-eenheid op het net te identificeren;
        - *garantiebeheerinstantie:* garantiebeheerinstantie als bedoeld in
      [artikel 75 van de Elektriciteitswet 1998][ref2];
        - *gasnetbeheerder:* netbeheerder als bedoeld in [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref3];
        - *groen gas hub:* verzameling van productie-installaties voor de productie van hernieuwbaar gas waarvoor voor de
      invoeding van het hernieuwbaar gas op een gasnet gezamenlijk een of meerdere aansluitingen worden gebruikt, waarmee
      gezamenlijk hernieuwbare warmte wordt geproduceerd die nuttig wordt gebruikt of waarmee gezamenlijk hernieuwbare
      elektriciteit wordt geproduceerd die op een elektriciteitsnet of installatie, met uitzondering van de productie-
      installatie, wordt ingevoed;
        - *levering:* hoeveelheid biomassa die is ingezet voor energieproductie en waarvoor de fysieke en
      duurzaamheidseigenschappen voor de gehele levering gelijk zijn;
        - *meetrapport:* rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat;
        - *milieu- en energiesteunkader:* Richtsnoeren staatssteun ten behoeve van milieubescherming en energie 2014-2020
      (PbEU 2014, C 200);
        - *minister:* Minister van Economische Zaken;
        - *NTA 8003:2008:* Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;
        - *nuttig gebruik van hernieuwbare warmte:* nuttig aangewende warmte als bedoeld in
      __REF003___________________________________________________________________________________________________________
      ___________;
        - *P50-waarde voor de netto elektriciteitsproductie:* netto elektriciteitsproductie waarbij de verwachte
      jaarlijkse energieproductie voor een gegeven combinatie van locatie en windturbine dient te zijn bepaald met een
      waarschijnlijkheid van 50%;
        - *productie-eenheid:* deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken van
      hernieuwbare elektriciteit, hernieuwbare warmte of de productie van hernieuwbaar gas;
        - *richtlijn hernieuwbare energie:* richtlijn nr. 2009/28/EG van het Europees Parlement en de Raad van 23 april
      2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
      Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140);
        - *systeemgrens van de productie-installatie:* fictieve gesloten omhulling van één of meer productie-eenheden die
      dezelfde wijze van opwekking van warmte gebruiken.


