  - number: 8a
    text: |-
      1 De productie, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], in verband met een beschikking op een
      aanvraag die op of na 1 december 2015 is ingediend, wordt verminderd met het aantal kWh dat is ingevoed op een
      elektriciteitsnet gedurende elke periode waarin de prijs van elektriciteit negatief is, tenzij desbetreffende
      periode korter dan zes uur duurt.

      2 Het eerste lid is niet van toepassing ten aanzien van een subsidieontvanger van wie het nominaal geïnstalleerd
      vermogen voor elektriciteitsproductie per aansluiting op het elektriciteitsnet minder dan 500 kW bedraagt of,
      indien het de productie van elektriciteit uit windenergie betreft, minder dan 3 MW bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel8
