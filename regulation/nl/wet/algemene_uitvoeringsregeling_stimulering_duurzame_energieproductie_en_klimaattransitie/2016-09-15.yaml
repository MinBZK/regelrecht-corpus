  - number: '2'
    text: |-
      1 Het plan, bedoeld in [artikel 56, tweede lid, onderdeel d, van het besluit][ref1] bevat in ieder geval:

      a. een uitgewerkt tijdschema betreffende de ingebruikname van de productie-installatie dat de volgende gedateerde
      ijkmomenten bevat:

      1°. het verstrekken van de opdrachten voor de levering van onderdelen voor de bouw van de productie-installatie;

      2°. de aanvang van de bouw van de productie-installatie;

      3°. de aanvang van de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas;

      4°. de datum waarop de periode waarover subsidie wordt verstrekt moet aanvangen;

      b. een exploitatieberekening die ten minste bevat:

      1°. een specificatie van de investeringskosten per component van de productie-installatie;

      2°. een overzicht van alle kosten- en baten van de productie-installatie; en

      3°. een berekening van het projectrendement over de subsidielooptijd.

      2 In aanvulling op het eerste lid bevat het plan:

      a. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare energie uit
      waterkracht of biomassa, een energieopbrengstberekening;

      b. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbaar gas, een
      verklaring met prijsindicatie van de netbeheerder voor het invoeden van hernieuwbaar gas;

      c. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare warmte, een
      onderbouwing van de warmteafzet;

      d. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte, door middel van
      geothermie, een geologisch rapport dat voldoet aan:

      1°. het Model Geologisch Onderzoek SDE+, dat wordt opgesteld met gebruikmaking van het formulier dat is opgenomen
      in de bij deze regeling behorende [bijlage 7][ref2],

      2° het Model Geologisch Onderzoek, dat wordt opgesteld met gebruikmaking van het formulier dat is opgenomen
      in bijlage D, behorende bij het Aanvraagformulier Subsidieregeling Energie en Innovatie Risico’s dekken voor
      aardwarmte, opgenomen in [bijlage 3.4.1. van de Subsidieregeling energie en innovatie][ref3], zoals deze luidde
      voor 2 oktober 2014, of

      3°. het Model Geologisch Onderzoek, dat wordt opgesteld met gebruikmaking van het Model Geologisch Onderzoek dat is
      opgenomen in [Bijlage 4.3.1, behorend bij artikel 4.3.1 van de Subsidieregeling nationale EZ-subsidies][ref4];

      e. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie op zee, een windenergie-opbrengstberekening die is opgesteld door een
      onafhankelijke organisatie met expertise op het gebied van windenergie-opbrengstberekeningen, waarbij gebruik wordt
      gemaakt van gerenommeerde rekenmodellen, omgevingsmodellen, windmodellen en windkaarten en dat tenminste bevat:

      1°. de locatiegegevens van het windpark,

      2°. de technische specificaties van de beoogde windturbines (merk, type, ashoogte, rotordiameter en
      vermogenscurve),

      3°. de lokale windgegevens voor het windpark, en

      4°. een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van het windpark, waarin
      de beschikbaarheid, zogeffecten, elektriciteitsverliezen, eigen consumptie, omgevingseffecten op de windturbine,
      turbinerendement en terugregelverliezen zijn opgenomen;

      f. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie op zee, informatie die aannemelijk maakt dat tijdig zal zijn voldaan aan
      [artikel 6:16d, eerste lid, onderdeel c, van het Waterbesluit][ref5];

      g. indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie in de categorieën wind op land, wind op primaire waterkering en
      wind in meer, een windenergie-opbrengstberekening die is opgesteld door een organisatie met expertise op het
      gebied van windenergie-opbrengstberekeningen, waarbij gebruik wordt gemaakt van gerenommeerde rekenmodellen,
      omgevingsmodellen, windmodellen en windkaarten en dat tenminste bevat:

      1°. de locatiegegevens van het windpark;

      2°. de technische specificaties van de beoogde windturbines;

      3°. de lokale windgegevens voor het windpark, en

      4°. een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van het windpark, waarbij
      voor de windopbrengst per windturbinelocatie op de beoogde ashoogte ten hoogste een gemiddelde windsnelheid
      wordt gehanteerd volgens een middel dat door de minister ter beschikking wordt gesteld, aangeeft en waarin de
      beschikbaarheid, zogeffecten, elektriciteitsverliezen, eigen consumptie, omgevingseffecten op de windturbine,
      turbinerendement en terugregelverliezen zijn opgenomen.

      3 De financiële onderbouwing, bedoeld in [artikel 56, tweede lid, onderdeel e, van het besluit][ref6] voldoet ten
      minste aan de volgende eisen:

      a. het bevat een financieringsplan voor de productie-installatie waarvoor subsidie wordt aangevraagd;

      b. het biedt inzicht in het eigen vermogen van de aanvrager;

      c. indien het aandeel van het eigen vermogen minder dan 20% van de investering in de productie-installatie
      bedraagt, bevat het een intentieverklaring van een financier voor de financiering van de productie-installatie
      waarvoor subsidie wordt aangevraagd, of in geval het een aanvraag om subsidieverlening voor een productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee betreft een
      intentieverklaring van een financier voor de financiering van het resterende deel van die 20%.

      4 Indien de aanvraag wordt ingediend voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie op zee is de omvang van het eigen vermogen, bedoeld in het derde
      lid, onderdeel c, gelijk aan de overeenkomstig [artikel 5 van de Regeling windenergie op zee 2016](onbekend)
      vastgestelde omvang van het eigen vermogen.

      5 Het overzicht, bedoeld in [artikel 56, tweede lid, onderdeel f, van het besluit][ref7] wordt in geval van een
      aanvraag om subsidieverlening voor een productie-installatie voor de productie van hernieuwbare elektriciteit door
      middel van windenergie op zee ondertekend door elk van de deelnemers aan het samenwerkingsverband.

      6 Bij de berekening van de P50-waarde, bedoeld in het tweede lid, onderdeel e, onder 4°, van een productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee wordt voor het
      zogeffect, uitsluitend rekening gehouden met de desbetreffende productie-installatie en met andere productie-
      installaties voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee die in gebruik
      zijn genomen voor 1 juli 2016.

      7 Het inzicht in het eigen vermogen, bedoeld in het derde lid, onderdeel b, wordt in geval van een aanvraag om
      subsidieverlening voor een productie-installatie voor de productie van hernieuwbare elektriciteit door middel van
      windenergie op zee geboden door verstrekking van de meest recent vastgestelde jaarrekening van de aanvrager, diens
      moederonderneming of de deelnemers aan het samenwerkingsverband. Het jaar waarop die jaarrekening betrekking heeft
      ligt ten hoogste drie kalenderjaren voor het jaar waarin de subsidie-aanvragen ten laatste worden ontvangen.


