  - number: '9'
    text: |-
      1 Het in [artikel 68, eerste lid, van het besluit][ref1] bedoelde maandelijkse bedrag bedraagt één-twaalfde van 80%
      van het product van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie, waar
      de minister op verzoek van de producent, het aantal kWh, bedoeld in [artikel 15, derde of vierde lid][ref2],
      [23, derde of vierde lid][ref3], [32, derde of vierde lid][ref4], [40, derde of vierde lid][ref5],
      [48, derde of vierde lid][ref6], of [55, derde of vierde lid, van het besluit][ref7], bij op kan tellen, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref8],
      [28, derde lid, onderdeel c][ref9], of [44, derde lid, onderdeel c, van het besluit][ref10] het basisbedrag
      behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd met de bij ministeriële
      regeling vastgestelde correcties op grond van [artikel 14, vijfde lid][ref11], [31, vijfde lid][ref12], of
      [47, vijfde lid, van het besluit][ref13],

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 22, vijfde lid][ref14], [39, vijfde lid][ref15], of [54, vijfde lid, van het besluit][ref16], of

      3°. fasebedrag, verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 14, vijfde lid][ref17], [31, vijfde lid][ref18], of [47, vijfde lid, van het besluit][ref19].

      2 Het in [artikel 68, eerste lid, van het besluit][ref20] bedoelde jaarlijkse bedrag bedraagt 80% van het product
      van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie, waar
      de minister op verzoek van de producent, het aantal kWh, bedoeld in [artikel 15, derde of vierde lid][ref21],
      [23, derde of vierde lid][ref22], [32, derde of vierde lid][ref23], [40, derde of vierde lid][ref24],
      [48, derde of vierde lid][ref25], of [55, derde of vierde lid, van het besluit][ref26], bij op kan tellen, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref27],
      [28, derde lid, onderdeel c][ref28], of [44, derde lid, onderdeel c, van het besluit][ref29] het basisbedrag
      behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd met de bij ministeriële
      regeling vastgestelde correcties op grond van [artikel 14, vijfde lid][ref30], [31, vijfde lid][ref31], of
      [47, vijfde lid, van het besluit][ref32],

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 22, vijfde lid][ref33], [39, vijfde lid][ref34], of [54, vijfde lid, van het besluit][ref35], of

      3°. fasebedrag, verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 14, vijfde lid][ref36], [31, vijfde lid][ref37], of [47, vijfde lid, van het besluit][ref38].

      3 Indien de subsidieperiode start op een andere datum dan 1 januari of eindigt op een andere datum dan 31 december
      bedraagt voor het eerste jaar respectievelijk het laatste jaar van de periode waarover subsidie wordt verstrekt het
      maandelijkse of jaarlijkse bedrag een evenredig deel van het aantal maanden of van het jaar waarover het voorschot
      wordt verstrekt.

      4 De minister kan het maandelijkse of jaarlijkse bedrag herberekenen indien:

      a. de subsidie-ontvanger een verzoek tot ontheffing als bedoeld in [artikel 62, derde lid, van het besluit][ref39],
      indient;

      b. de maandelijkse productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas gedurende ten
      minste twee maanden ten minste 50 procent zal achterblijven dan wel achter is gebleven ten opzichte van de in de
      beschikking tot voorschotverlening opgenomen maximum productie in kWh aardgasequivalent;

      c. de minister na het begin van de voorschotverlening meer dan een maand geen productiegegevens heeft ontvangen
      over de betreffende productie-installatie, of

      d. de cumulatieve productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas in het
      betreffende kalenderjaar ten minste 20% zal achterblijven dan wel achter is gebleven ten opzichte van de in de
      beschikking tot voorschotverlening opgenomen maximum productie in kWh aardgasequivalent.

      5 In afwijking van het bepaalde in het eerste lid, onderdeel b, ten eerste, kan de Minister van een lager
      basisbedrag uitgaan indien het rendement van de productie-installatie gedurende ten minste twee jaar structureel is
      achtergebleven ten opzichte van het in de beschikking tot voorschotverlening opgenomen rendement.


