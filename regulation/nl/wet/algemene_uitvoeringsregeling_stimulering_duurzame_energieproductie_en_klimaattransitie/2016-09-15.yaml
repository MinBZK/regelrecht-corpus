  - number: '13'
    text: |-
      1 De Minister deelt de garantiebeheerinstantie per productie-installatie voor hernieuwbare elektriciteit
      waarvoor subsidie op grond van het [besluit][ref1] is verleend de locatiegegevens, de ean-code en andere voor de
      subsidieverlening relevante informatie mee.

      2 De garantiebeheerinstantie deelt de Minister per productie-installatie voor hernieuwbare elektriciteit waarvoor
      subsidie op grond van het [besluit][ref2] is verleend het aantal kWh waarvoor garanties van oorsprong is verstrekt
      mee.

      3 De garantiebeheerinstantie verstrekt op verzoek van de Minister alle overige voor de subsidieverlening relevante
      informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
      [ref2]: https://wetten.overheid.nl/BWBR0022735
