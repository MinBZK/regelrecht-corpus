  - number: 14d
    text: |-
      1 Indien een subsidie die op grond van het besluit wordt verleend, staatssteun bevat die door het milieu – en
      energiesteunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      gegevens, bedoeld in paragraaf 5.2.7, onderdeel 104, van het milieu- en energiesteunkader, bekend.

      2 De gegevens, bedoeld in het eerste lid, blijven voor ten minste tien jaar openbaar beschikbaar.
    url: https://wetten.overheid.nl/BWBR0023563/2016-09-15#Artikel14d
