  - number: 14a
    text: |-
      1 Productie-installaties, met uitzondering van productie-installaties voor de productie
      van hernieuwbare elektriciteit met behulp van windenergie, waarvoor subsidie is verstrekt
      op grond van de [Regeling aanwijzing categorieën duurzame energieproductie 2008][ref1],
      de [Regeling aanwijzing categorieën duurzame energieproductie 2009][ref2], de
      [Regeling aanwijzing categorieën duurzame energieproductie 2010][ref3] en de
      [Regeling aanwijzing categorieën duurzame energieproductie 2011][ref4], worden met ingang van 1 januari 2012
      aangewezen als productie-installaties als bedoeld in de [artikelen 15, derde lid][ref5], [32, derde lid][ref6], of
      [48, derde lid, van het besluit][ref7].

      2 Bij de toepassing van de [artikelen 15, derde lid][ref8], [23, derde lid][ref9], [32, derde lid][ref10],
      [40, derde lid][ref11], [48, derde lid][ref12], [55, derde lid, van het besluit][ref13] bedraagt het aantal kWh dat
      het desbetreffende jaar voor subsidie in aanmerking komt, indien de subsidieperiode start op een andere datum dan
      1 januari voor het eerste jaar waarover subsidie wordt verstrekt, een evenredig deel van het aantal maanden of van
      het jaar waarover subsidie wordt verstrekt.


