  - number: 2c
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee worden bij de aanvraag tevens de volgende gegevens toegevoegd:

      a. indien de aanvrager een samenwerkingsverband betreft een door elke deelnemer ondertekende verklaring van
      deelname aan het samenwerkingsverband;

      b. de meest recent vastgestelde jaarrekening van de aanvrager, diens moederonderneming, de deelnemers aan het
      samenwerkingsverband of hun moederondernemingen waarbij de jaarrekening betrekking heeft op een jaar dat ten
      hoogste drie kalenderjaren voor het jaar waarin de aanvraag wordt ingediend;

      c. de bescheiden waarmee voldoende aannemelijk wordt gemaakt dat aan het van toepassing zijnde kavelbesluit wordt
      voldaan, en

      d. het projectplan waaruit de voornemens van de aanvrager blijken inzake de wijze waarop en de partijen waardoor de
      productie-installatie wordt gerealiseerd en geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0023563/2019-01-01#Artikel2c
  - number: '3'
    text: |-
      1 De subsidie-ontvanger verstrekt de opdrachten voor de levering van onderdelen voor de bouw van de productie-
      installatie binnen 18 maanden na de datum van inwerkingtreding van de beschikking tot subsidieverlening en zendt
      een afschrift aan de Minister.

      2 De subsidie-ontvanger rapporteert na de datum van de beschikking tot subsidieverlening tot
      het moment van ingebruikname jaarlijks over de voortgang van de realisatie van het op grond van
      [artikel 56, vierde lid, onderdeel f, van het besluit][ref1] in de aanvraag opgenomen tijdschema.

      3 De subsidie-ontvanger zendt de Minister binnen een jaar na de datum van ingebruikname van de productie-
      installatie een overzicht van de daadwerkelijke investeringskosten, van de reeds ontvangen subsidies en overige
      steun en van de nog te ontvangen subsidies en overige steun. Indien de verleende subsidie als bedoeld in de
      [artikelen 16][ref2], [24][ref3], [33][ref4], [41][ref5], [49][ref6] en [55a van het besluit][ref7] meer bedraagt
      dan € 125.000, gaat het overzicht vergezeld van een accountantsverklaring. De accountantsverklaring wordt opgesteld
      conform het model en het controleprotocol die zijn opgenomen in de bij deze regeling behorende [bijlage 1][ref8].

      4 Het eerste lid is niet van toepassing op de ontvanger van subsidie voor een productie-installatie voor de
      productie van hernieuwbare elektriciteit door middel van windenergie op zee.

      5 Het derde lid is niet van toepassing als de subsidieontvanger geen andere subsidie heeft ontvangen
      dan die op grond van het besluit en geen andere overige steun heeft ontvangen dan die op grond van
      [artikel 3.42 van de Wet op de inkomstenbelasting 2001][ref9].


