  - number: '4'
    text: |-
      De subsidie-ontvanger meet de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas per
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0023563/2019-01-01#Artikel4
  - number: '6'
    text: |-
      1 Indien aan een subsidieontvanger die een productie-installatie bedrijft waarin door middel van thermische
      conversie vloeibare biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare warmte uitsluitend
      subsidie wordt verstrekt voor zover de subsidieontvanger per levering aantoont dat de gebruikte vloeibare biomassa
      voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn hernieuwbare energie,
      toont de subsidieontvanger dit aan met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      2 Een subsidie-ontvanger toont door middel van certificaten, afgegeven op basis van een certificeringsysteem
      waarvan de Europese Commissie op grond van artikel 18, vierde lid, van de richtlijn hernieuwbare energie heeft
      besloten dat deze accurate gegevens bevat met het oog op de toepassing van artikel 17 van de richtlijn hernieuwbare
      energie, aan dat vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0023563/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Dit artikel is van toepassing op een subsidieontvanger die een daartoe bij een openstellingsregeling aangewezen
      categorie productie-installatie bedrijft:

      a. voor de productie van industriële stoom door middel van verbranding van houtpellets in een ketel;

      b. waarin vaste of gasvormige biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare elektriciteit en
      hernieuwbare warmte;

      c. voor de productie van elektriciteit door middel van kolen waarin biomassa mee wordt gestookt, of

      d. voor de productie van hernieuwbare warmte, of hernieuwbare elektriciteit en hernieuwbare warmte door middel van
      verbranding van houtpellets met een brander in een ketel, een oven of een fornuis.

      2 Een subsidieontvanger maakt gebruik van vaste biomassa die per levering vergezeld gaat van
      de benodigde conformiteitsverklaringen van een erkende conformiteitsbeoordelingsinstantie
      afhankelijk van de van toepassing zijnde duurzaamheidseisen, bedoeld in
      [artikel 2 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1], en ten aanzien
      van elke aard van vaste biomassa.

      3 Van de totale massa vaste biomassa die in een kalenderjaar voor subsidie in aanmerking komt,
      is ten hoogste 30% aangemerkt als gecontroleerde biomassa als bedoeld in onderdeel 12.6 van
      [bijlage B, van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref2].


