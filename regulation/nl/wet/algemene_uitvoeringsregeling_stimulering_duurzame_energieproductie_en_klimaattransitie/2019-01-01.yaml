  - number: '2'
    text: |-
      1 De aanvraag om subsidieverlening gaat vergezeld van:

      a. vergunningen die noodzakelijk zijn voor de realisatie van de productie-installatie, en

      b. de aanvraag van de vergunning krachtens de [Wet algemene bepalingen omgevingsrecht][ref1], indien het project op
      grond van die wet vergunningplichtig is.

      2 Het eerste lid is niet van toepassing indien de aanvraag betrekking heeft op een productie-installatie voor de
      productie van hernieuwbare elektriciteit door middel van windenergie op zee.

      3 Het eerste lid, onderdeel b, is niet van toepassing indien de aanvraag betrekking heeft op een productie-
      installatie voor de productie van hernieuwbare energie door middel van zonne-energie.

      4 Voor de uitvoering van het eerste lid worden tijdelijke vergunningen die zijn verleend op grond van
      [artikel 2.12, eerste lid, onderdeel a, onderdeel 2°, van de Wet algemene bepalingen omgevingsrecht][ref2] niet in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
