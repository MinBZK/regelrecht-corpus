  - number: 7a
    text: |-
      De private conformiteitsbeoordelingsverklaring, bedoeld in [artikel 63a, eerste lid, van het besluit][ref1]
      wordt afgegeven door een erkende conformiteitsbeoordelingsinstantie als bedoeld in
      [artikel 1 van het Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref2] op basis van
      verificatie overeenkomstig paragraaf 2.6 van het verificatieprotocol.


