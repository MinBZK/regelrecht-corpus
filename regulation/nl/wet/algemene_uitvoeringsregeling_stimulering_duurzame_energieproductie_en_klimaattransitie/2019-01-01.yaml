  - number: 7b
    text: |-
      1 De subsidie-ontvanger die een productie-installatie bedrijft waarin vaste of gasvormige biomassa wordt omgezet in
      hernieuwbare elektriciteit, of hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door een productie-
      installatie voor de productie van elektriciteit door middel van kolen waarin biomassa wordt meegestookt of
      een productie-installatie bedrijft waarin vaste biomassa wordt omgezet in hernieuwbare warmte door middel van
      verbranding van houtpellets geproduceerd uit vaste biomassa in een ketel met een vermogen groter dan of gelijk
      aan 5 MW, zendt binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot wordt verstrekt aan de
      minister een verklaring waaruit blijkt dat de gebruikte biomassa aan [artikel 7][ref1] voldoet, met gebruikmaking
      van een middel dat door de minister beschikbaar wordt gesteld.

      2 De verklaring, bedoeld in het eerste lid, wordt opgesteld overeenkomstig paragraaf 2.6 van
      het verificatieprotocol door een erkende conformiteitsbeoordelingsinstantie als bedoeld in
      [artikel 1 van het Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref2].

      3 De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid die kleiner is dan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op regionaal niveau
      of op het niveau van de bosbeheereenheid aan dat aan de duurzaamheidseisen is voldaan, met uitzondering van:

      a. de laatste twee jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2015 of 2016 in gebruik of opnieuw in gebruik is genomen, waarvoor op het
      niveau van de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,

      b. de laatste drie jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2017 of 2018 in gebruik of opnieuw in gebruik is genomen, waarvoor op het
      niveau van de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,

      c. de laatste vier jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2019 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van
      de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,

      d. de laatste vijf jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een
      productie-installatie bedrijft die in 2020 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van
      de bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,

      e. een subsidie-ontvanger die een productie-installatie bedrijft die na 2020 in gebruik of opnieuw in gebruik is
      genomen, waarvoor voor de gehele subsidieperiode op het niveau van de bosbeheereenheid wordt aangetoond dat aan de
      duurzaamheidseisen is voldaan.

      4 De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid groter dan of gelijk aan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op het niveau
      van de bosbeheereenheid aan dat aan de duurzaamheidseisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
