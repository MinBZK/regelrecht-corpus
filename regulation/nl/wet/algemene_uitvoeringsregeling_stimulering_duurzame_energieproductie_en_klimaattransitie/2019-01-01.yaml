      1 In aanvulling op de voor de subsidieverstrekking toegestane biomassastromen kunnen subsidie-ontvangers aan wie
      subsidie is verstrekt op grond van:

      a. [artikel 29, eerste lid, onderdeel b][ref1], of
      [42, eerste lid, onderdeel b, van de Regeling aanwijzing categorieën duurzame energieproductie 2008][ref2],

      b. [artikel 29, eerste lid, onderdeel b][ref3], of
      [51, eerste lid, onderdeel a, van de Regeling aanwijzing categorieën duurzame energieproductie 2009][ref4] of

      c. [artikel 29, eerste lid, onderdeel b][ref5], of
      [54, eerste lid, onderdeel a, van de Regeling aanwijzing categorieën duurzame energieproductie 2010][ref6],

      met ingang van 1 juli 2011 ten hoogste 50 procent van de massa die wordt vergist laten bestaan uit biomassastromen
      als bedoeld in de NTA 8003:2017, met uitzondering van de nummers 410, 420, 500, 550 tot en met 559.

      2 In aanvulling op de voor de subsidieverstrekking toegestane biomassastromen kunnen subsidie-ontvangers aan wie
      subsidie is verstrekt op grond van:

      a. [artikel 29, eerste lid, onderdeel c][ref7], of
      [51, eerste lid, onderdeel c, van de Regeling aanwijzing categorieën duurzame energieproductie 2009][ref8] of

      b. [artikel 29, eerste lid, onderdeel c,][ref9] of
      [54, eerste lid, onderdeel c, van de Regeling aanwijzing categorieën duurzame energieproductie 2010][ref10],

      met ingang van 1 juli 2011 biomassastromen als bedoeld in de NTA 8003:2017: 430, 512 en 587 gebruiken.

      3 In aanvulling op de voor de subsidieverstrekking toegestane biomassastromen kunnen subsidie-
      ontvangers aan wie subsidie is verstrekt op grond van [artikel 21, eerste lid, onderdeel c][ref11], of
      [44, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2011][ref12] met ingang van 1
      januari 2011 biomassastromen als bedoeld in de NTA 8003:2017: 512 en 587 gebruiken.

      4 In aanvulling op de voor de subsidieverstrekking toegestane biomassastromen kunnen subsidie-ontvangers
      met een productie-installatie op een landbouwbedrijf aan wie subsidie is verstrekt op grond van
      __REF000___________________________________________________________________________________________________________
      __, met ingang van 4 april 2013 tevens uitsluitend plantaardige stoffen vermeld onder de categorieën A tot en met
      G1 onder categorie 1 van [Bijlage Aa, onderdeel IV, van de Uitvoeringsregeling Meststoffenwet][ref14] vergisten.

      5 Als productie-installaties als bedoeld in [artikel 15, zesde lid, van het besluit][ref15] worden aangewezen
      productie-installaties waarvoor subsidie is verstrekt op grond van:

      a. [artikelen 3, eerste lid][ref16],[15, eerste lid][ref17],
      [22, eerste lid][ref18]__REF003____________________________________________________________________________________
      ___;

      b. [artikel 2, eerste lid][ref20], [7a, eerste en tweede lid][ref21],
      [15, eerste lid][ref22], [22, eerste lid][ref23], [29, eerste lid][ref24],
      [35, eerste lid, van de regeling aanwijzing categorieën duurzame energieproductie 2009][ref25];

      c. [artikel 2, eerste lid][ref26], [15, eerste lid][ref27], [22, eerste lid][ref28], [29, eerste lid][ref29],
      [35, eerste lid, van de regeling aanwijzing categorieën duurzame energieproductie 2010][ref30], en

      d. [artikel 4, eerste lid][ref31], [10, eerste lid][ref32], [16, eerste lid][ref33],
      [21, eerste lid][ref34], [26, eerste lid][ref35], [31, eerste lid][ref36],
