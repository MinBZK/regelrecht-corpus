  - number: '11'
    text: |-
      1 Voor de toepassing van [artikel 3, eerste en tweede lid, van het besluit][ref1] geldt dat geen sprake is van
      dezelfde productie-installatie wanneer:

      a. het een productie-installatie op een andere locatie betreft;

      b. het een productie-installatie met een andere opwekkingstechnologie betreft.

      2 Onverminderd het eerste lid geldt voor de toepassing van [artikel 3, eerste en tweede lid, van het besluit][ref2]
      dat geen sprake is van dezelfde productie-installatie wanneer het een productie-installatie betreft waarvan het
      vermogen meer dan 20% afwijkt ten opzichte van het vermogen van een productie-installatie waarvoor eerder een
      beschikking tot subsidieverlening is verstrekt, indien de beschikking tot subsidieverlening voor 1 juli 2011 is
      ingetrokken of de subsidie voor 1 juli 2011 is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel3
