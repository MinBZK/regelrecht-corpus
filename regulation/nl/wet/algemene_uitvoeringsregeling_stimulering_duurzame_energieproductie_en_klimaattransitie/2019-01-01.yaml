  - number: 2a
    text: |-
      1 Indien de aanvraag om subsidieverlening betrekking heeft op een productie-installatie met een vermogen van ten
      minste 500 kW gaat de aanvraag vergezeld van een haalbaarheidsstudie.

      2 De haalbaarheidsstudie, bedoeld in het eerste lid, bevat in ieder geval:

      a. een omschrijving van de productie-installatie;

      b. een exploitatieberekening;

      c. een financieringsplan voor de productie-installatie waarvoor de subsidie wordt aangevraagd;

      d. inzicht in het eigen vermogen van de aanvrager, en

      e. indien het eigen vermogen minder dan 20% van de investering in de productie-installatie of indien de aanvrager
      meer dan één aanvraag per openstellingsperiode heeft ingediend minder dan 20% van de som van de investeringen in
      de productie-installaties bedraagt een intentieverklaring van een financier ter financiering van de productie-
      installatie waarvoor subsidie wordt aangevraagd.

      3 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee heeft in afwijking van het tweede lid, onderdeel e, de intentieverklaring van de
      financier betrekking op de financiering van het restant dat nodig is om 20% van de investering te bereiken.

      4 De exploitatieberekening, bedoeld in het tweede lid, onderdeel b, omvat:

      a. een specificatie van de investeringskosten per component van de productie-installatie,

      b. een overzicht van alle kosten en baten van de productie-installatie, en

      c. een berekening van het projectrendement over de subsidielooptijd of, indien de aanvraag betrekking heeft op
      een productie-installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee, de
      looptijd van het project.

      5 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee wordt als de aanvrager in de aanvraag dit aangeeft tot het eigen vermogen,
      bedoeld in het tweede lid, onderdeel d, meegerekend:

      a. indien de aanvrager een samenwerkingsverband is de eigen vermogens van de deelnemers aan het
      samenwerkingsverband;

      b. indien de subsidie-aanvrager of een deelnemer aan een samenwerkingsverband een dochteronderneming is en de
      moederonderneming daarmee schriftelijk instemt het overige eigen vermogen van de moederonderneming.

      6 Voor de bepaling van de omvang van het eigen vermogen overeenkomstig het vijfde lid, wordt het eigen vermogen
      van een deelnemer aan een samenwerkingsverband of van een moederonderneming meegerekend in het eigen vermogen van
      ten hoogste twee subsidie-aanvragers. Indien het eigen vermogen van dezelfde entiteit op grond van het vijfde lid
      voor de aanvragen van meer dan twee subsidie-aanvragers zou worden meegerekend, wordt dat eigen vermogen bij alle
      aanvragen buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0023563/2019-01-01#Artikel2a
  - number: 2b
    text: |-
      1 In aanvulling op [artikel 2a, tweede lid][ref1], bevat de haalbaarheidsstudie tevens:

      a. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit waterkracht of hernieuwbare energie uit biomassa een energieopbrengstberekening;

      b. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbaar gas met een
      aansluiting met een doorlaatwaarde groter dan 40m3(n) per uur een verklaring met prijsindicatie van de netbeheerder
      voor het invoeden van hernieuwbaar gas;

      c. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare warmte een
      onderbouwing van de warmteafzet;

      d. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte door middel van geothermie
      een geologisch rapport;

      e. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie op zee:

      1°. een windenergie-opbrengstberekening, en

      2°. informatie die aannemelijk maakt dat tijdig zal zijn voldaan aan
      [artikel 6:16d, eerste lid, onderdeel c, van het Waterbesluit][ref2];

      f. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie, niet zijnde windenergie op zee, een windenergie-opbrengstberekening.

      2 Het geologisch rapport, bedoeld in het eerste lid, onderdeel d, voldoet aan het model ‘Specificaties geologisch
      onderzoek voor geothermieprojecten - rapportagevereisten SDE+ en RNES’ van 18 april 2017 van TNO zoals gepubliceerd
      op de website van de Rijksdienst van ondernemend Nederland.

      3 De windenergie-opbrengstberekening, bedoeld in het eerste lid, onderdelen e en f, is opgesteld door een
      organisatie met expertise op het gebied van windenergie-opbrengstberekeningen, met gebruikmaking van gerenommeerde
      rekenmodellen, omgevingsmodellen, windmodellen en windkaarten en bevat ten minste:

      a. de locatiegegevens van het windpark;

      b. de technische specificaties waaronder merk, type, ashoogte, rotordiameter en vermogenscurve van de beoogde
      windturbines;

      c. de lokale windgegevens voor het windpark, en

      d. een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van het windpark.

      4 Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, zijn voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, en terugregelverliezen opgenomen en is de organisatie met expertise op het
      gebied van windenergie-opbrengstberekeningen, bedoeld in het derde lid, onafhankelijk.

      5 Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, wordt voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie, niet zijnde windenergie
      op zee, voor de windopbrengst per windturbinelocatie op de beoogde ashoogte ten hoogste een gemiddelde windsnelheid
      gehanteerd volgens een middel dat door de minister ter beschikking wordt gesteld en zijn de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, eigen consumptie, omgevingseffecten op de windturbine, turbinerendement en
      terugregelverliezen opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel2a
