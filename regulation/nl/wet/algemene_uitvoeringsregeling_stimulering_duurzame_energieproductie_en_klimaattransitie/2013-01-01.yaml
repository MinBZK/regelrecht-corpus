  - number: 7g
    text: |-
      Indien de subsidie-ontvanger voor de productie van hernieuwbare warmte gebruik maakt van warmte brengt het
      toegelaten meetbedrijf de hoeveelheid gebruikte warmte in mindering op de hoeveelheid geproduceerde hernieuwbare
      warmte.
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel7g
  - number: 7h
    text: |-
      1 Indien in een productie-installatie voor de productie van hernieuwbare warmte zuivere biomassa wordt
      verwerkt, verklaart de subsidie-ontvanger bij de overlegging van het resultaat van de vaststelling, bedoeld in
      [artikel 7e, eerste lid][ref1], dat hij door middel van een daartoe geëigende methode aan de hand van bemonstering
      per partij vaststelt dat het materiaal waaruit de duurzame warmte wordt opgewekt, is aan te merken als zuivere
      biomassa.

      2 In afwijking van het eerste lid, hanteert de subsidie-ontvanger, indien in de productie-installatie biomassa die
      een behandeling heeft ondergaan, zoals pyrolyse, torrefactie, carbonisatie, wordt verwerkt, een daartoe geëigende
      methode om vast te stellen dat de biomassa vóór bewerking is aan te merken als zuivere biomassa.

      3 Indien in de productie-installatie voor de productie van hernieuwbare warmte niet-zuivere biomassa wordt
      verwerkt, verklaart de subsidie-ontvanger bij de overlegging van het resultaat van de vaststelling, bedoeld in
      [artikel 7e, eerste lid][ref2], dat hij door middel van een daartoe geëigende methode aan de hand van bemonstering
      per partij vaststelt wat het biologisch afbreekbare gedeelte is van de niet-zuivere biomassa waaruit de
      hernieuwbare warmte wordt opgewekt. Het biologisch afbreekbare gedeelte dient te worden bepaald op grond van de
      energiebasis met twee decimalen nauwkeurigheid.

      4 Indien de hernieuwbare warmte wordt geproduceerd door middel van naar haar aard zuivere biomassa of naar zijn
      aard zuiver biogas, verklaart de subsidie-ontvanger bij de overlegging van het resultaat van de vaststelling,
      bedoeld in [artikel 7e, eerste lid][ref3], dat hij gedurende de periode waarop de verklaring betrekking heeft, door
      middel van naar haar aard zuivere biomassa of naar zijn aard zuiver biogas hernieuwbare warmte zal produceren.

      5 Indien in een productie-installatie voor de productie van hernieuwbare warmte niet naar zijn aard zuiver biogas
      of niet-zuiver biogas wordt verwerkt, hanteert de subsidie-ontvanger ten aanzien van de grondstof die bij het
      ontstaan van dit biogas gebruikt een daartoe geëigende methode om aan de hand van bemonstering per partij vast te
      stellen dat het materiaal waaruit de duurzame warmte is opgewekt, is aan te merken als zuivere of als niet-zuivere
      biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7e
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel7e
      [ref3]: https://wetten.overheid.nl/BWBR0023563#Artikel7e
