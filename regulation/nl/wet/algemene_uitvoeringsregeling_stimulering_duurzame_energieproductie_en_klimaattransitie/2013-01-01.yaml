    text: |-
      Het plan, bedoeld in [artikel 56, tweede lid, onderdeel d, van het besluit][ref1] bevat in ieder geval een
      uitgewerkt tijdschema betreffende de ingebruikname van de productie-installatie dat de volgende gedateerde
      ijkmomenten bevat:

      a. het verstrekken van de opdrachten voor de levering van onderdelen voor en voor de bouw van de productie-
      installatie;

      b. de aanvang van de bouw van de productie-installatie;

      c. de aanvang van de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas;

      d. de datum waarop de periode waarover subsidie wordt verstrekt moet aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel2
