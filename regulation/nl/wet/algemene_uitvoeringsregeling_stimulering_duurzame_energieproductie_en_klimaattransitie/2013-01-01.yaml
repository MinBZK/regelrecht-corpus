  - number: 7a
    text: |-
      1 Een subsidie-ontvanger wiens productie-installatie voor de productie van hernieuwbaar gas onderdeel is van een
      groen gas hub draagt er zorg voor dat het aandeel van de productie-installatie in de totale productie van de groen
      gas hub gemeten wordt door:

      a. het volume te meten volgens de methode van de Meetvoorwaarden Gas – RNB;

      b. het methaangehalte of de calorische waarde van een productie-installatie met een productiecapaciteit die groter
      is dan genoemd in kolom 1 en kleiner is dan of gelijk is aan genoemd in kolom 2 ten minste elke 15 minuten te meten
      met een maximale onnauwkeurigheid genoemd in kolom 3.









                    Kolom 1


                    Kolom 2


                    Kolom 3






                    0 Nm3/uur


                    40 Nm3/uur


                    5,3%




                    40 Nm3/uur


                    200 Nm3/uur


                    3,2%




                    200 Nm3/uur


                    1200 Nm3/uur


                    1,3%




                    1200 Nm3/uur


                    onbepaald


                    1,0%






      2 De metingen, bedoeld in het eerste lid, worden gedaan op de grens tussen de productie-installatie en de gedeelde
      voorzieningen van de groen gas hub.

      3 De subsidie-ontvanger draagt er zorg voor dat de metingen, bedoeld in het eerste lid, bij alle productie-
      installaties die onderdeel zijn van de groen gas hub worden gedaan.

      4 Het aantal Nm3 aardgasequivalent dat voor subsidie in aanmerking komt wordt per productie-installatie van een
      groen gas hub bepaald door het totaal aantal Nm3 aardgasequivalent dat door de groen gas hub wordt ingevoed op een
      gastransportnet als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1] naar rato van de geleverde
      energie, uitgedrukt in methaangehalte of calorische waarde, over de productie-installaties die onderdeel zijn van
      de groen gas hub te verdelen.

      5 De subsidie-ontvanger die met zijn productie-installatie voor de productie van hernieuwbaar gas onderdeel is van
      een groen gas hub waarmee hernieuwbaar gas op een gasnet wordt ingevoegd, draagt er zorg voor dat:

      a. de aansluiting van de groens gas hub voldoet aan de eisen van de Aansluit- en transportvoorwaarden Gas – RNB of
      de Aansluitvoorwaarden Gas – LNB;

      b. de hoeveelheid Nm3 aardgasequivalent die op het net wordt ingevoed, gemeten wordt volgens de Meetvoorwaarden Gas
      – RNB of de Meetvoorwaarden Gas – LNB.

      6 [Artikel 7, eerste lid][ref2], is niet van toepassing op subsidie-ontvangers die met hun productie-installatie
      voor de productie van hernieuwbaar gas onderdeel uitmaken van een groen gas hub.

      7 Het aantal GJ dat voor subsidie in aanmerking komt wordt per productie-installatie van een groen gas hub bepaald
      door het totaal aantal GJ hernieuwbare warmte die nuttig wordt gebruikt of hernieuwbare elektriciteit dat door de
      groen gas hub wordt geproduceerd die op een elektriciteitsnet of installatie, met uitzondering van de productie-
      installatie, wordt ingevoed, naar rato van de geleverde energie, uitgedrukt in methaangehalte of calorische waarde,
      over de productie-installaties die onderdeel zijn van de groen gas hub te verdelen.

      8 De subsidie-ontvanger wiens productie-installatie voor de productie van hernieuwbaar gas onderdeel is van een
      groen gas hub draagt er zorg voor dat de gegevens, bedoeld in het vierde of zevende lid, uiterlijk vier maanden na
      afloop van het kwartaal waarop de gegevens betrekking hebben aan de minister worden overgelegd. Indien met de groen
      gas hub hernieuwbare elektriciteit of hernieuwbare elektriciteit en hernieuwbare warmte worden geproduceerd, draagt
      de subsidie-ontvanger er zorg voor dat de gegevens, bedoeld in het vierde of vijfde lid, worden overgelegd middels
      de voor de geproduceerde hernieuwbare elektriciteit of hernieuwbare warmte geboekte garanties van oorsprong als
      bedoeld in [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
