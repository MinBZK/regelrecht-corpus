  - number: '4'
    text: |-
      De subsidie-ontvanger meet de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas per
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel4
  - number: '6'
    text: |-
      1 De subsidie-ontvanger die een productie-installatie bedrijft waarin biomassa wordt omgezet in hernieuwbare
      warmte of hernieuwbaar gas, zendt binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot wordt
      verstrekt aan de minister een verklaring over de gebruikte biomassa met gebruikmaking van het origineel van een
      ondertekend formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref1].

      2 Indien aan een subsidie-ontvanger die een productie-installatie bedrijft waarin door middel van thermische
      conversie vloeibare biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare warmte uitsluitend
      subsidie wordt verstrekt voor zover de subsidie-ontvanger aantoont dat de gebruikte vloeibare biomassa voldoet
      aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn hernieuwbare energie,
      toont de subsidie-ontvanger dit aan middels de verklaring, bedoeld in het eerste lid, of middels voor de
      geproduceerde hernieuwbare elektriciteit of hernieuwbare warmte geboekte garanties van oorsprong als bedoeld in
      [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref2].

      3 Een subsidie-ontvanger kan aantonen dat vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in
      artikel 17, eerste lid van de richtlijn hernieuwbare energie door:

      a. aan te tonen dat voor de gebruikte vloeibare biomassa die vervaardigd is uit niet van landbouw, aquacultuur,
      visserij of bosbouw afkomstige afvalstoffen en residuen, een standaardwaarde voor de broeikasgasemissiereductie met
      betrekking tot de productieketen is vastgesteld in bijlage V van de richtlijn hernieuwbare energie of

      b. dit aan te tonen middels certificaten op basis van een certificeringssysteem dat accuraat is bevonden door de
      Europese Commissie op grond van artikel 18, vierde lid, van de richtlijn hernieuwbare energie.

      4 Tot het moment dat een certificeringssysteem als bedoeld in het derde lid, onderdeel b, beschikbaar is, worden
      certificeringssystemen die ter toetsing zijn voorgelegd aan de Europese Commissie geacht certificeringssystemen als
      bedoeld in het derde lid te zijn.

      5 De verklaring, bedoeld in het eerste lid, gaat vergezeld van een assurancerapport van een externe accountant dat
      is opgesteld met inachtneming van het onderzoeksprotocol assurancerapport biomassa, opgenomen in [bijlage 3][ref3],
      tenzij het een productie-installatie voor de productie van hernieuwbare warmte met een vermogen kleiner dan of
      gelijk aan 3 MW thermisch betreft.

      6 Uit het assurancerapport blijkt eenduidig per kalendermaand welke biomassagrondstoffen zijn ingezet en wat de
      aard en de verhouding van de in de productie-installatie verwerkte brandstoffen is in honderdste van procenten
      nauwkeurig.

      7 Indien [paragraaf 3.3][ref4] van toepassing is gaat de accountant ten behoeve van het bepalen van de gegevens,
      bedoeld in het zesde lid, na of een juiste toepassing is gegeven aan de geëigende methode, bedoeld in de
      [artikelen 7h][ref5] en [7i][ref6].


