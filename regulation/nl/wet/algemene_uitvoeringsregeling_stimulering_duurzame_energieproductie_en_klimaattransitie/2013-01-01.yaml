  - number: '7'
    text: |-
      1 De subsidie-ontvanger die met zijn productie-installatie hernieuwbaar gas produceert, draagt er zorg voor dat:

      a. de aansluiting van zijn productie-installatie voldoet aan de eisen van de Aansluit- en transportvoorwaarden Gas
        - RNB of de Aansluitvoorwaarden Gas - LNB;

      b. de hoeveelheid Nm3 aardgasequivalent die hij op het net invoedt, gemeten wordt volgens de Meetvoorwaarden Gas -
      RNB of de Meetvoorwaarden Gas - LNB;

      c. de erkende meetverantwoordelijke als bedoeld in de Meetvoorwaarden Gas - RNB of de Meetvoorwaarden Gas - LNB de
      voor zijn productie-installatie opgestelde en door de netbeheerder gecorrigeerde meetgegevens onder vermelding van
      de locatie-gegevens en de ean-code van de aansluiting uiterlijk twee maanden na afloop van de kalendermaand waarop
      de meetgegevens betrekking hebben aan de Minister stuurt.

      2 De subsidie-ontvanger die met zijn productie-installatie hernieuwbaar gas produceert overlegt iedere vijf jaar
      na de datum van subsidieverlening een actuele beschrijving van de installatie aan de Minister waaruit blijkt dat de
      installatie nog steeds voldoet aan de subsidievoorwaarden.

      3 Een productie-installatie voor het produceren van hernieuwbaar gas is voorzien van een nippel waarop gasanalyse
      apparatuur kan worden aangesloten.

      4 De subsidie-ontvanger kan de minister om toestemming verzoeken om in afwijking van het eerste lid, onderdeel c,
      [artikel 6, eerste lid][ref1], of [artikel 7a, achtste lid, eerste volzin][ref2], de gegevensverstrekking via een
      voldoende gekwalificeerde derde te laten verlopen. Indien de toestemming wordt verleend, is het tweede lid niet van
      toepassing en hoeft het formulier, bedoeld in artikel 6, eerste lid, niet te worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel7a
