  - number: 7i
    text: |-
      1 De methode van vaststelling, bedoeld in de [artikel 7h, eerste, derde en vijfde lid][ref1], is geëigend als de
      subsidie-ontvanger ter zake van de werkzaamheden voor de bepaling van het biologisch afbreekbare gedeelte van de
      biomassa beschikt over:

      a. een productcertificaat als bedoeld in de Kiwa-beoordelingsrichtlijn BRL-K 10016 voor de vaststelling van het
      aandeel biomassa in secundaire brandstoffen of

      b. een schriftelijk bewijs dat hij voldoet aan vergelijkbare procesnormen als vastgelegd in de Kiwa-
      beoordelingsrichtlijn BRL-K 10016.

      2 De methode van vaststelling, bedoeld in [artikel 7h, tweede lid][ref2], is geëigend als de subsidie-ontvanger
      beschikt over:

      a. een certificaat behorend bij de biomassa die een behandeling heeft ondergaan, afgegeven door een
      certificeringsinstantie, waaruit blijkt dat de oorsprong van de biomassa van die partijen volledig is aan te merken
      als zuivere biomassa, en

      b. het certificaat voldoet aan de eis dat dit per partij wordt aangebracht en gevolgd en gereproduceerd kan worden.

      3 De certificeringinstantie is onafhankelijk en werkt volgens kwaliteitsstandaarden die zijn gecertificeerd door
      een organisatie die is geaccrediteerd door een accreditatie-instantie die is aangesloten bij de European co-
      operation for Accredition of het International Accreditation Forum.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7h
