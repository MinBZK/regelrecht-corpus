  - number: 7c
    text: |-
      1 Deze paragraaf is van toepassing op subsidie-ontvangers die een productie-installatie bedrijven waarmee
      hernieuwbare warmte en geen hernieuwbare elektriciteit wordt geproduceerd.

      2 De subsidie-ontvanger wiens productie-installatie voor de productie van hernieuwbaar gas onderdeel is van een
      groen gas hub waarmee gezamenlijk hernieuwbare warmte en geen hernieuwbare elektriciteit wordt geproduceerd, draagt
      er zorg voor dat deze paragraaf op overeenkomstige wijze wordt nageleefd voor de groen gas hub.
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel7c
  - number: 7d
    text: |-
      1 Een subsidie-ontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte wordt geproduceerd
      draagt er zorg voor dat ten aanzien van zijn installatie iedere vijf jaar een meetprotocol opgesteld wordt dat
      voldoet aan de meetvoorwaarden, opgenomen in [bijlage 4][ref1] en laat het meetprotocol voor de eerste dag van
      de kalendermaand waarin hij de productie-installatie in gebruik neemt of indien een nieuw meetprotocol wordt
      opgesteld, goedkeuren door een toegelaten meetbedrijf.

      2 Indien de subsidie-ontvanger, bedoeld in het eerste lid, voornemens is een aanpassing door te voeren die een
      wijziging van het meetprotocol tot gevolg heeft, draagt hij er zorg voor dat alvorens hij die aanpassing doorvoert,
      een nieuw meetprotocol wordt opgesteld en wordt goedgekeurd door een toegelaten meetbedrijf. De termijn van vijf
      jaar, bedoeld in het eerste lid, vangt aan op het moment van goedkeuring van het nieuwe meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7e
    text: |-
      1 Een subsidie-ontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte wordt geproduceerd,
      verzoekt het toegelaten meetbedrijf iedere vijf jaar vast te stellen of de productie-installatie geschikt is
      voor de opwekking van hernieuwbare warmte alsmede of de inrichting om te meten geschikt is voor de meting van
      de hernieuwbare warmte die met de productie-installatie wordt geproduceerd en die nuttig wordt gebruikt, met
      gebruikmaking van formulier dat is opgenomen in [bijlage 6][ref1].

      2 De subsidie-ontvanger deelt het resultaat van de vaststelling binnen vier weken na afloop van de termijn, bedoeld
      in het eerste lid, mee aan de minister.

      3 Indien de subsidie-ontvanger voornemens is een aanpassing door te voeren die een wijziging van een van de
      onderdelen 3 en 4 van het formulier, bedoeld in het eerste lid, ten gevolge heeft, verzoekt de subsidie-ontvanger
      het toegelaten meetbedrijf om een nieuwe vaststelling als bedoeld in het eerste lid alvorens hij die aanpassing
      daadwerkelijk doorvoert. In dat geval deelt de subsidie-ontvanger alvorens de aanpassing door te voeren het
      resultaat van de vaststelling mee aan de minister, vervalt de eerder verrichte vaststelling en vangt de termijn van
      vijf jaar, bedoeld in het eerste lid, aan op het moment waarop de subsidie-ontvanger het toegelaten meetbedrijf om
      de vaststelling verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2013-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7f
    text: |-
      1 Een subsidie-ontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte wordt geproduceerd
      draagt er zorg voor dat alle energiestromen die zijn omschreven in de meetvoorwaarden, opgenomen in
      [bijlage 4][ref1],en die de systeemgrens passeren, gemeten worden volgens het meetprotocol.

      2 De subsidie-ontvanger draagt er zorg voor dat onder toepassing van het meetprotocol een meetrapport wordt
      opgesteld, dat:

      a. voldoet aan de meetvoorwaarden, opgenomen in [bijlage 4][ref2],

      b. de wijze van totstandkoming van de meetgegevens beschrijft en

      c. geverifieerd wordt door een toegelaten meetbedrijf.

      3 Een subsidie-ontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte wordt geproduceerd:

      a. met een nominaal thermisch vermogen gelijk aan of groter dan 3 MWth meet de hoeveelheid geproduceerde
      hernieuwbare warmte die nuttig wordt gebruikt ten minste iedere kalendermaand en laat over ieder kwartaal een
      meetrapport als bedoeld in het tweede lid opstellen;

      b. met een nominaal vermogen kleiner dan 3 MWth meet de hoeveelheid geproduceerde hernieuwbare warmte die nuttig
      wordt gebruikt ten minste ieder jaar en laat over ieder jaar een meetrapport als bedoeld in het tweede lid
      opstellen.

      4 Indien de duurzame warmte jaarlijks wordt gemeten, verdeelt het toegelaten meetbedrijf de meetgegevens in gelijke
      delen over de twaalf voorafgaande kalendermaanden, tenzij de subsidie-ontvanger aantoont dat deze meetgegevens op
      een andere wijze over de twaalf voorafgaande kalendermaanden verdeeld moeten worden.

      5 De subsidie-ontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte wordt geproduceerd:

      a. met een nominaal thermisch vermogen gelijk aan of groter dan 3 MWth legt het meetrapport uiterlijk vier maanden
      na afloop van het kwartaal waarop het meetrapport betrekking heeft over aan de minister.

      b. met een nominaal thermisch vermogen kleiner dan 3 MWth legt het meetrapport uiterlijk vier maanden na afloop van
      het kalenderjaar waarop het meetrapport betrekking heeft over aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
      [ref2]: https://wetten.overheid.nl/BWBR0023563
