  - number: '9'
    text: |-
      1 Het in [artikel 68, eerste lid, van het besluit][ref1] bedoelde maandelijkse bedrag bedraagt één-twaalfde van 80%
      van het product van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref2],
      [28, derde lid, onderdeel c][ref3], of [44, derde lid, onderdeel c, van het besluit][ref4] het basisbedrag
      behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd met de bij ministeriële
      regeling vastgestelde correcties op grond van [artikel 14, zesde lid][ref5], [31, vijfde lid][ref6], of
      [47, vijfde lid, van het besluit][ref7], of

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 22, zesde lid][ref8], [39, vijfde lid][ref9], of [54, vijfde lid, van het besluit][ref10].

      2 Het in [artikel 68, eerste lid, van het besluit][ref11] bedoelde jaarlijkse bedrag bedraagt 80% van het product
      van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref12],
      [28, derde lid, onderdeel c][ref13], of [44, derde lid, onderdeel c, van het besluit][ref14] het basisbedrag
      behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd met de bij ministeriële
      regeling vastgestelde correcties op grond van [artikel 14, zesde lid][ref15], [31, vijfde lid][ref16], of
      [47, vijfde lid, van het besluit][ref17], of

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op grond van
      [artikel 22, zesde lid][ref18], [39, vijfde lid][ref19], of [54, vijfde lid, van het besluit][ref20].

      3 Indien de subsidieperiode start op een andere datum dan 1 januari of eindigt op een andere datum dan 31 december
      bedraagt voor het eerste jaar respectievelijk het laatste jaar van de periode waarover subsidie wordt verstrekt het
      maandelijkse of jaarlijkse bedrag een evenredig deel van het aantal maanden of van het jaar waarover het voorschot
      wordt verstrekt.

      4 De minister kan het maandelijkse of jaarlijkse bedrag herberekenen indien:

      a. de subsidie-ontvanger een verzoek tot ontheffing als bedoeld in [artikel 62, derde lid][ref21], indient;

      b. de productie van hernieuwbare elektriciteit, hernieuwbare warmte of hernieuwbaar gas gedurende ten minste twee
      maanden ten minste 50 procent zal achterblijven dan wel achter is gebleven ten opzichte van de in de beschikking
      tot voorschotverlening opgenomen maximum productie in kWh, GJ of Nm3 aardgasequivalent.

      5 In afwijking van het bepaalde in het eerste lid, onderdeel b, ten eerste, kan de Minister van een lager
      basisbedrag uitgaan indien het rendement van de productie-installatie gedurende ten minste twee jaar structureel is
      achtergebleven ten opzichte van het in de beschikking tot voorschotverlening opgenomen rendement.


