        artikel: '56'
  - number: '3'
    text: |-
      1 De subsidie-ontvanger verstrekt de opdrachten, bedoeld in [artikel 2, onderdeel a][ref1], binnen een jaar na de
      datum van de beschikking tot subsidieverlening en zendt een afschrift aan de Minister.

      2 De subsidie-ontvanger rapporteert na de datum van de beschikking tot subsidieverlening tot het moment
      van ingebruikname jaarlijks over de voortgang van de realisatie van de in het plan als bedoeld in
      [artikel 56, tweede lid, onderdeel d, van het besluit][ref2] opgenomen ijkmomenten.

      3 De subsidie-ontvanger zendt de Minister binnen een jaar na de datum van ingebruikname van de productie-
      installatie een overzicht van de daadwerkelijke investeringskosten, van de reeds ontvangen subsidies en overige
      steun en van de nog te ontvangen subsidies en overige steun. Indien de verleende subsidie als bedoeld in de
      [artikelen 16][ref3], [24][ref4], [33][ref5], [41][ref6], [49][ref7] en [55a van het besluit][ref8] meer bedraagt
      dan € 125.000, gaat het overzicht vergezeld van een accountantsverklaring. De accountantsverklaring wordt opgesteld
      conform het model en het controleprotocol die zijn opgenomen in de bij deze regeling behorende [bijlage 1][ref9].

      4 Het derde lid is niet van toepassing als de subsidieontvanger geen andere subsidie heeft ontvangen
      dan die op grond van het besluit en geen andere overige steun heeft ontvangen dan die op grond van
      [artikel 3.42 van de Wet op de inkomstenbelasting 2001][ref10].


