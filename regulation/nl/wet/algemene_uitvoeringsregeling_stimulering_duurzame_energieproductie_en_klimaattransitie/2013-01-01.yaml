  - number: 7b
    text: |-
      Indien een subsidie-ontvanger aan wie subsidie is verstrekt voor een productie-installatie die geen onderdeel
      is van een groen gas hub, onderdeel gaat uitmaken van een groen gas hub, meldt de subsidie-ontvanger dit vooraf
      aan de Minister. Vanaf het moment dat de productie-installatie onderdeel uitmaakt van een groen gas hub is
      [artikel 7a][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7a
