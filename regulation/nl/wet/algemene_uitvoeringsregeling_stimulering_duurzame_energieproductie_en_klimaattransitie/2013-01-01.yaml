articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Economische Zaken, Landbouw en Innovatie;

      b. besluit: het [Besluit stimulering duurzame energieproductie][ref1];

      c. garantiebeheerinstantie: de garantiebeheerinstantie als bedoeld in
      [artikel 75 van de Elektriciteitswet 1998][ref2];

      d. cumulatietoets: de toets aan de steunruimte zoals die is gemaximeerd in de Communautaire kaderregeling inzake
      staatssteun ten behoeve van het milieu (PbEG 2001 C 37);

      e. gasnetbeheerder: een netbeheerder als bedoeld in [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref3];

      f. productie-eenheid: een deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken
      van hernieuwbare elektriciteit, hernieuwbare warmte of de productie van hernieuwbaar gas;

      g. ean-code: uniek 18-cijferig nummer dat dient om een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of hernieuwbaar gas of een aansluiting van een productie-installatie of een
      productie-eenheid op het net te identificeren;

      h. richtlijn hernieuwbare energie: richtlijn nr. 2009/28/EG van het Europees Parlement en de Raad van 23 april
      2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
      Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140);

      i. groen gas hub: een verzameling van productie-installaties voor de productie van hernieuwbaar gas waarvoor voor
      de invoeding van het hernieuwbaar gas op een gasnet gezamenlijk een of meerdere aansluitingen worden gebruikt,
      waarmee gezamenlijk hernieuwbare warmte wordt geproduceerd die nuttig wordt gebruikt of waarmee gezamenlijk
      hernieuwbare elektriciteit wordt geproduceerd die op een elektriciteitsnet of installatie, met uitzondering van de
      productie-installatie, wordt ingevoed;

      j. NTA 8003: 2008: de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;

      k. zuivere biomassa: producten, afvalstoffen en residuen van de landbouw – met inbegrip van plantaardige en
      dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, die geheel biologisch afbreekbaar zijn, alsmede
      industrieel en huishoudelijk afval dat geheel biologisch afbreekbaar is;

      l. naar haar aard zuivere biomassa: de zuivere biomassa opgenomen in de NTA 8003:2008, met uitzondering van de
      groepsnummers 701, 709, 729, 800 tot en met 804, 809, 900 tot en met 904 en 909, waarbij brandstof na pyrolyse,
      torrefactie en carbonisatie worden toegevoegd aan de nummers 802, 803 en 804;

      m. naar zijn aard zuiver biogas: stortgas, rioolwaterzuiveringsgas en biogas dat is ontstaan door inwerking van
      micro-organismen op biologisch afbreekbare materialen;

      n. partij: de op basis van één specificatie geleverde hoeveelheid materiaal die voor controle op het aandeel
      onvermijdbare kunststoffen en ander materiaal van langcyclisch organische oorsprong door de producent, die door
      middel van het materiaal warmte opwekt, gedurende een door hem vastgestelde periode als eenheid wordt aangemerkt en
      als zodanig identificeerbaar is;

      o. meetprotocol: een document waarin beschreven zijn de bemetering van een productie-installatie, de wijze van
      meten en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden warmte en, voor zover
      van toepassing, de hoeveelheden brandstof die de installatie verbruikt en de wijze van bepaling van de calorische
      waarde van de brandstof;

      p. meetrapport: een rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat;

      q. systeemgrens van de productie-installatie: een fictieve gesloten omhulling van één of meer productie-eenheden
      die dezelfde wijze van opwekking van warmte gebruiken;

      r. toegelaten meetbedrijf: een meetbedrijf dat op grond van de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref4], is toegelaten.

      2 Onder nuttig gebruik van hernieuwbare warmte als bedoeld in [artikel 1, derde lid][ref5], van het besluit wordt
      verstaan: 'de warmte, uitgedrukt in GJ die vrijkomt uit hernieuwbare energiebronnen en die wordt aangewend voor:'

      a. gebouwklimatisering van de binnenruimten van gebouwen;

      b. tapwaterverwarming en verwarming van water dat wordt ingezet in bedrijfsprocessen, met uitzondering van het
      gebruik als voedingswater voor een productie-installatie waarmee elektriciteit wordt opgewekt;

      c. verwarming in industriële processen en van tuinbouwkassen, met uitzondering van:

      1°. de inzet in een turbine of organische rankine cyclus waarmee elektriciteit wordt opgewekt;

      2°. de inzet bij aardgasexpansie;

      3°. het drogen en verwarmen van inputstromen van een productie-installatie voor het opwekken van elektriciteit,
      inclusief het voorverwarmen van verbrandingslucht;

      4°. de inzet voor rookgasreiniging en waterzuivering van een productie-installatie voor het opwekken van
      elektriciteit;

      5°. de verwarming van een installatie of een onderdeel daarvan, waarmee energie of een energiedrager wordt
      geproduceerd;

      6°. de verwarming van opslagtanks van grondstoffen en producten die gebruikt worden om energie mee op te wekken;

      d. klimaatregeling van koelcellen en industriële koelingstoepassingen;

      e. levering aan een warmtenet, mits de producent aannemelijk kan maken dat de warmte gebruikt wordt voor een van de
      toepassingen bedoeld onder ten eerste tot en met ten vierde.

      3 Voor de toepassing van het eerste lid, onderdeel k, worden producten, afvalstoffen en residuen van de landbouw,
      met inbegrip van plantaardige en dierlijke stoffen, de bosbouw en aanverwante bedrijfstakken, alsmede industrieel
      en huishoudelijk afval, met een aandeel onvermijdbare kunststoffen en ander materiaal van langcyclisch organische
      oorsprong van ten hoogste 3,00 massaprocent per partij geacht geheel biologisch afbreekbaar te zijn.


