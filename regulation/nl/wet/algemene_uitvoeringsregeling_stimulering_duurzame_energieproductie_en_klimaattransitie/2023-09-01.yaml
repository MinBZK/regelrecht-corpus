      1 De subsidie-ontvanger meet de productie van elektriciteit, warmte, gas, waterstof of geavanceerde hernieuwbare
      brandstof, dan wel de vermindering van koolstofdioxide per beschikking tot subsidieverlening.

      2 De minister kan ontheffing verlenen van de verplichting, bedoeld in het eerste lid, indien de beschikking
      betrekking heeft op een productie-installatie:

      a. die is zijn aangewezen onder [artikel 3, tweede lid, onderdeel a, van het besluit][ref1]; of

      b. die in capaciteit wordt uitgebreid.

      3 Aan de ontheffing kunnen voorwaarden en voorschriften verbonden worden.


