        artikel: '3'
  - number: '13'
    text: |-
      1. De Minister deelt de op grond van [artikel 74 van de Elektriciteitswet 1998][ref1],
      [artikel 66j van de Gaswet][ref2] of [artikel 26 van de Warmtewet][ref3] gemandateerde per productie-installatie de
      locatiegegevens, de ean-code en andere voor de subsidieverlening relevante informatie mee.

      2. De op grond van [artikel 74 van de Elektriciteitswet 1998][ref4], [artikel 66j van de Gaswet][ref5] of
      [artikel 26 van de Warmtewet][ref6] gemandateerde deelt de Minister per productie-installatie het aantal kWh
      waarvoor garanties van oorsprong is verstrekt en andere voor de subsidieverlening relevante informatie mee.


