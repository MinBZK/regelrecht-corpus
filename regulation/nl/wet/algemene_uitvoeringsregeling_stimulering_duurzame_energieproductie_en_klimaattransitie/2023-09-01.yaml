  - number: 7d
    text: |-
      1 Een subsidie-ontvanger dient bij het meetbedrijf een verzoek in om een oordeel omtrent de geschiktheid van
      diens productie-installatie voor de opwekking van koolstofdioxide-arme warmte, de afvang en permanente opslag
      van koolstofdioxide, de afvang en het gebruik van koolstofdioxide, de productie van waterstof of de productie van
      geavanceerde hernieuwbare brandstof met gebruikmaking van het formulier, bedoeld in [bijlage 8][ref1].

      2 Een oordeel omtrent de geschiktheid is vijf jaar geldig of tot het moment waarop de subsidie-ontvanger een
      aanpassing heeft doorgevoerd in zijn productie-installatie die een wijziging van een van de gegevens, vermeld
      in het verzoek, bedoeld in het eerste lid, ten gevolge heeft. Een subsidie-ontvanger verricht een nieuw verzoek,
      bedoeld in het eerste lid, voordat de geldigheidsduur van het oordeel is verlopen.

      3 De subsidie-ontvanger bepaalt in het verzoek, bedoeld in het eerste lid, de systeemgrens van iedere productie-
      installatie, waarvoor subsidie is aangevraagd, op dusdanige wijze dat de subsidiabele productie kan worden gemeten.

      4 Een wijziging van de systeemgrens van een productie-installatie leidt er niet toe dat één of meer productie-
      eenheden van de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.

      5 De subsidie-ontvanger stelt het meetbedrijf in staat het onderzoek te verrichten ten behoeve van de beoordeling
      van de geschiktheid.

      6 De minister verstrekt het eerste voorschot aan een subsidie-ontvanger niet eerder dan nadat de subsidie-ontvanger
      het oordeel omtrent de geschiktheid overlegt of doet overleggen aan de minister.

      7 De minister verstrekt uitsluitend een voorschot indien een subsidie-ontvanger over een geldig oordeel omtrent de
      geschiktheid beschikt.


