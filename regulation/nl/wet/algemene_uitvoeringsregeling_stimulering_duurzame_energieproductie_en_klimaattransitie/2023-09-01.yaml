  - number: 7k
    text: |-
      1 Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en permanent opslaat of gebruikt, waarbij gebruik wordt gemaakt van gasvormig transport van koolstofdioxide en van
      een basisinfrastructuur voor koolstofdioxide.

      2 De subsidie-ontvanger meet elke kalendermaand de hoeveelheid koolstofdioxide die wordt ingevoed in de
      basisinfrastructuur voor koolstofdioxide volgens de meetvoorwaarden, opgenomen in [bijlage 9][ref1], en draagt er
      zorg voor dat deze uiterlijk twintig dagen na afloop van de kalendermaand aan de Minister wordt overgedragen.

      3 De meting, bedoeld in het tweede lid, wordt gedaan op de grens tussen de productie-installatie en de gedeelde
      voorzieningen van de basisinfrastructuur voor koolstofdioxide.

      4 De subsidie-ontvanger draagt er zorg voor dat de meting, bedoeld in het tweede lid, plaatsvindt bij alle
      productie-installaties die aangesloten zijn op de basisinfrastructuur voor koolstofdioxide.

      5 Indien de subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt en permanent opslaat, stelt
      de Minister de hoeveelheid koolstofdioxide die voor subsidie in aanmerking komt per productie-installatie vast
      door de hoeveelheid koolstofdioxide die in de basisinfrastructuur voor koolstofdioxide permanent wordt opgeslagen
      te verdelen naar rato van de geleverde koolstofdioxide, uitgedrukt in 1.000 kg koolstofdioxide, over de productie-
      installaties die aangesloten zijn op de desbetreffende basisinfrastructuur voor koolstofdioxide.

      6 Indien er sprake is van meerdere productie-installaties met één aansluiting op een basisinfrastructuur voor
      koolstofdioxide en van meerdere subsidie-ontvangers wijzen de subsidie-ontvangers voor de meting, bedoeld in het
      tweede lid, tezamen één meetbedrijf aan.

      7 Indien een subsidie-ontvanger is aangesloten op een basisinfrastructuur voor koolstofdioxide waar zowel
      productie-installaties voor de afvang en de permanente opslag van koolstofdioxide als productie-installaties
      voor de afvang en het gebruik van koolstofdioxide zijn aangesloten, verstrekt hij uiterlijk tien dagen na afloop
      van de kalendermaand aan het meetbedrijf, bedoeld in het vijfde lid, een overzicht over welk deel van de totale
      hoeveelheid koolstofdioxide permanent is opgeslagen en welk deel van de productie nuttig is aangewend.


