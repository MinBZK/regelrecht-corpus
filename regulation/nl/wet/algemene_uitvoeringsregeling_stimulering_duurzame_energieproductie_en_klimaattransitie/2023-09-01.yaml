  - number: 2c
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee worden bij de aanvraag tevens de volgende gegevens toegevoegd:

      a. indien de aanvrager een samenwerkingsverband betreft een door elke deelnemer ondertekende verklaring van
      deelname aan het samenwerkingsverband;

      b. de meest recent vastgestelde jaarrekening van de aanvrager, diens moederonderneming, de deelnemers aan het
      samenwerkingsverband of hun moederondernemingen waarbij de jaarrekening betrekking heeft op een jaar dat ten
      hoogste drie kalenderjaren voor het jaar waarin de aanvraag wordt ingediend;

      c. de bescheiden waarmee voldoende aannemelijk wordt gemaakt dat aan het van toepassing zijnde kavelbesluit wordt
      voldaan, en

      d. het projectplan waaruit de voornemens van de aanvrager blijken inzake de wijze waarop en de partijen waardoor de
      productie-installatie wordt gerealiseerd en geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel2c
  - number: 2d
    text: |-
      1 Indien de aanvraag betrekking heeft op een productie-installatie op een locatie waarbij de subsidieaanvrager niet
      de eigenaar van de locatie is, gaat de aanvraag vergezeld van:

      a. de toestemming van de eigenaar of eigenaren dat de desbetreffende productie-installatie op desbetreffende
      locatie wordt gevestigd met gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld;

      b. een gedoogplichtbeschikking op grond van
      [artikel 2, vijfde lid, of artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref1] met betrekking tot de
      desbetreffende locatie voor het vestigen van de desbetreffende productie-installatie;

      c. een afgesloten voorovereenkomst of grondovereenkomst met het Rijksvastgoedbedrijf met betrekking tot de
      desbetreffende locatie voor het vestigen van de desbetreffende productie-installatie.

      2 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, waterkracht of windenergie, of een productie-installatie waarbij sprake is van gecombineerde
      opwekking van hernieuwbare elektriciteit en hernieuwbare warmte uit biomassavergisting die wordt aangesloten op een
      elektriciteitsnet met een aansluiting met een totale doorlaatwaarde van meer dan 3*80 A, gaat de aanvraag vergezeld
      van de verklaring van de netbeheerder over de beschikbaarheid van transportcapaciteit voor de nauwkeurig omschreven
      productie-installatie met gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld.

      3 Het eerste en tweede lid zijn niet van toepassing indien de aanvraag betrekking heeft op een productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee.

      4 Indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide gaat de aanvraag vergezeld van de verklaring of de verklaringen over de beschikbaarheid van
      transport- en opslagcapaciteit van de partij of partijen die het transport of de permanente opslag van de
      koolstofdioxide uitvoeren met betrekking tot de desbetreffende productie-installatie.

      5 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, gaat de aanvraag vergezeld van toestemming van de aanvrager op het delen van informatie tussen
      de netbeheerder en de minister over het bij de netbeheerder gecontracteerde terugleververmogen en de ean-code van
      de productie-installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
