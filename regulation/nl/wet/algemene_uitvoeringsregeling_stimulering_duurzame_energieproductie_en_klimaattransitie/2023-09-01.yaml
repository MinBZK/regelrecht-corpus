  - number: 7n
    text: |-
      1 Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en gebruikt.

      2 De subsidie-ontvanger draagt er zorg voor dat de productie van koolstofdioxide nuttig wordt aangewend.

      3 De subsidie-ontvanger overlegt uiterlijk vier maanden na afloop van het kalenderjaar de meetgegevens van de
      beheerder van de basisinfrastructuur voor koolstofdioxide over de hoeveelheid nuttig aangewende koolstofdioxide aan
      de Minister.

      4 Indien sprake is voor vloeibaar transport van koolstofdioxide, draagt de subsidie-ontvanger er zorg voor dat hij
      beschikt over transportdocumenten, waaruit sluitend de afleverlocatie en de afleverhoeveelheid van het transport
      door haar en derde partijen en de nuttige aanwending van koolstofdioxide blijkt.
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel7n
  - number: 7o
    text: |-
      1 Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie geavanceerde
      hernieuwbare brandstof produceert.

      2 De hoeveelheid geavanceerde hernieuwbare brandstof die voor subsidie in aanmerking komt, wordt bepaald op basis
      van het register hernieuwbare energie vervoer.

      3 Uiterlijk vier maanden na afloop van het kalenderjaar overlegt de subsidie-ontvanger aan de Minister:

      a. de dubbeltellingsverklaringen, bedoeld in [artikel 1 van het Besluit energie vervoer][ref1], behorend bij de
      geproduceerde hoeveelheid geavanceerde hernieuwbare brandstof;

      b. de gegevens uit het register hernieuwbare energie vervoer, waaruit blijkt welke hoeveelheid geavanceerde
      hernieuwbare brandstof, omschreven in het meetrapport, bedoeld in [artikel 7g][ref2], is geleverd in Nederland aan
      wegvoertuigen of binnenvaartschepen;

      c. een overzicht waaruit per kalendermaand de hoeveelheid, aard en, in honderdsten van procenten nauwkeurig, de
      verhouding van de in de productie-installatie ingezette grondstoffen blijkt, gerapporteerd volgens de NTA 8003:2017
      met gebruikmaking van het middel dat door de Minister beschikbaar wordt gesteld.

      4 De subsidie-ontvanger mengt de geavanceerde hernieuwbare brandstof die in aanmerking komt voor subsidie, niet met
      andere brandstoffen die niet voor subsidie in aanmerking komen.


