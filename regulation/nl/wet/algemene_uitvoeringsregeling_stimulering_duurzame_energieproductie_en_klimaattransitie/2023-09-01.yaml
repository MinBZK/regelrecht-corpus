  - number: '3'
    text: |-
      1 De subsidie-ontvanger verstrekt de opdrachten voor de levering van onderdelen voor de bouw van de productie-
      installatie binnen 18 maanden na de datum van inwerkingtreding van de beschikking tot subsidieverlening en zendt
      een afschrift aan de minister.

      2 De subsidie-ontvanger rapporteert na de datum van de beschikking tot subsidieverlening tot
      het moment van ingebruikname jaarlijks over de voortgang van de realisatie van het op grond van
      [artikel 56, vierde lid, onderdeel f, van het besluit][ref1] in de aanvraag opgenomen tijdschema.

      3 De subsidie-ontvanger zendt de minister binnen een jaar na de datum van ingebruikname van de productie-
      installatie of op verzoek van de minister een overzicht van de daadwerkelijke investeringskosten, van de
      overige kosten en baten gedurende de exploitatie, van de reeds ontvangen subsidies en overige steun en
      van de nog te ontvangen subsidies en overige steun. Het overzicht wordt gezonden met gebruikmaking van
      een middel dat door de minister beschikbaar wordt gesteld. Indien de verleende subsidie meer bedraagt
      dan € 125.000, gaat het overzicht vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref2]. De verklaring wordt opgesteld met gebruikmaking van een
      controleprotocol dat door de minister ter beschikking wordt gesteld.

      4 De minister kan de termijn, bedoeld in het derde lid, op verzoek van de subsidie-ontvanger eenmalig verlengen met
      ten minste zes weken.

      5 De subsidie-ontvanger meldt iedere wijziging van reeds ontvangen subsidies en overige steun en van de nog te
      ontvangen subsidies en overige steun aan de minister.

      6 Het eerste lid is niet van toepassing op de ontvanger van subsidie voor een productie-installatie voor de
      productie van hernieuwbare elektriciteit door middel van windenergie op zee.

      7 Het derde lid is niet van toepassing indien de subsidie-ontvanger geen andere subsidie heeft ontvangen dan die op
      grond van het besluit en geen andere overige steun, met uitzondering van het financieel voordeel dat is behaald op
      grond van de [Regeling groenprojecten 2016][ref3] of de [Regeling groenprojecten 2022][ref4], tenzij sprake is van:

      a. een productie-installatie voor restwarmte, de productie van koolstofdioxide-arme warmte met een elektroboiler
      of een industriële warmtepomp met 3.000 vollasturen, waterstof uit elektrolyse, de afvang en permanente opslag
      van koolstofdioxide of de afvang en het gebruik van koolstofdioxide of de productie van hernieuwbare warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte door middel van thermische conversie van vaste of vloeibare
      biomassa waarvoor via verlengde levensduur opnieuw subsidie is gegeven;

      b. een productie-installatie met een nominaal vermogen gelijk aan of groter dan 1 MW voor de productie van
      hernieuwbaar gas uit biomassa, de productie van hernieuwbare warmte uit biomassa, de gecombineerde opwekking
      van hernieuwbare elektriciteit en hernieuwbare warmte uit biomassa of de productie van geavanceerde hernieuwbare
      brandstof, indien er indicaties zijn dat de marktprijs voor biomassa waarvan de minister is uitgegaan bij het
      vaststellen van het basisbedrag meer dan 15% op jaarbasis is gedaald.

      8 De productie-installatie wordt in stand gehouden in Nederland of binnen de Nederlandse exclusieve economische
      zone.

      9 In afwijking van het eerste lid verstrekt de subsidie-ontvanger de opdrachten voor de levering van onderdelen
      voor de bouw van de productie-installatie voor de productie van hernieuwbare warmte of koolstofdioxide-warmte door
      middel van geothermie, voor de afvang en permanente opslag van koolstofdioxide of voor de afvang en het gebruik
      van koolstofdioxide binnen 36 maanden na de datum van inwerkingtreding van de beschikking tot subsidieverlening en
      zendt deze een afschrift aan de minister.

      10 Indien sprake is van een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide of voor de afvang en het gebruik van koolstofdioxide, gaat het afschrift,
      bedoeld in het negende lid, vergezeld van vergunningen die noodzakelijk zijn voor de
      realisatie van de productie-installatie, met uitzondering van de vergunning die op grond van
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref5] vereist is voor de
      realisatie van het ondergrondse opslagvoorkomen voor koolstofdioxide, voor zover de aanvraag om subsidieverlening
      niet vergezeld ging van deze vergunningen.

      11 De subsidie-ontvanger met een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide verstrekt binnen twaalf maanden na de datum van inwerkingtreding van de beschikking tot
      subsidieverlening een afschrift van de in behandeling genomen aanvraag voor de vergunning die op grond van
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref6] noodzakelijk is voor de
      realisatie van het ondergrondse opslagvoorkomen voor koolstofdioxide.


