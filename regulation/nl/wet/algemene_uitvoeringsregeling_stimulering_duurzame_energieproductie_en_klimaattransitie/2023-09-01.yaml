  - number: 14b
    text: |-
      Productie-installaties, met uitzondering van productie-installaties voor de productie
      van hernieuwbare elektriciteit met behulp van windenergie, waarvoor subsidie is verstrekt
      op grond van de [Regeling aanwijzing categorieën duurzame energieproductie 2008][ref1],
      de [Regeling aanwijzing categorieën duurzame energieproductie 2009][ref2],
      de [Regeling aanwijzing categorieën duurzame energieproductie 2010][ref3],
      de [Regeling aanwijzing categorieën duurzame energieproductie 2011][ref4],
      de [Regeling aanwijzing categorieën duurzame energieproductie 2012][ref5], de
      [Regeling aanwijzing categorieën duurzame energieproductie 2013][ref6] en de
      [Regeling aanwijzing categorieën duurzame energieproductie 2014][ref7], worden met ingang van 1 januari 2015
      aangewezen als productie-installaties als bedoeld in de [artikelen 15, vierde lid][ref8], [32, vierde lid][ref9],
      of [48, vierde lid, van het besluit][ref10], met dien verstande dat het verschil in kWh dat bij het aantal
      geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in de artikel 15, vierde lid, 32, vierde lid,
      of 48, vierde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor
      subsidie in aanmerking komt.


