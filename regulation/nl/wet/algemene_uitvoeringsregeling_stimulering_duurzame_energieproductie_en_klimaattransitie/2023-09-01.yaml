  - number: '8'
    text: |-
      1 De Minister stelt een voorschot binnen zes maanden na afloop van het kalenderjaar bij aan de hand van:

      a. het aantal kWh of kg verminderde broeikasgas dat in het betreffende kalenderjaar voor subsidie in aanmerking
      komt;

      b. de voor het betreffende kalenderjaar vastgestelde correcties op grond van [artikelen 14, vierde lid][ref1],
      [22, vierde lid][ref2], [31, vierde lid][ref3], [39, vierde lid][ref4], [47, vierde lid][ref5],
      [54, vierde lid][ref6], [55i, derde lid][ref7] en [55p, derde lid van het besluit][ref8],

      c. indien [artikel 11, derde lid, onderdeel a, b of c][ref9], [28, derde lid, onderdeel a, b of c][ref10], of
      [44, derde lid, onderdeel a, b, of c, van het besluit][ref11] van toepassing is, het aantal geproduceerde kWh
      die voor subsidie in aanmerking komt, het aantal gerealiseerde vollasturen van de productie-installatie of het
      gerealiseerde rendement van de productie-installatie en

      d. indien [artikel 55f, derde lid van het besluit][ref12] van toepassing is, het aantal verminderde kg broeikasgas
      in Nederland, het gerealiseerde aantal vollasturen van de productie-installatie of het gerealiseerde rendement van
      de productie-installatie.

      2 De Minister verrekent een tekort aan verstrekte maandelijkse bedragen of een tekort op het jaarlijkse bedrag, als
      bedoeld in [artikel 68, tweede lid, van het besluit][ref13], door het te weinig betaalde bedrag aan het voorschot
      binnen zes weken na de datum van bijstelling van het voorschot aan de subsidie-ontvanger te verstrekken.

      3 De minister verrekent een in een kalenderjaar teveel aan verstrekte maandelijkse bedragen of een teveel op het
      verstrekte jaarlijkse bedrag als bedoeld in [artikel 68, tweede lid, van het besluit][ref14], door het bedrag van
      het teveel betaalde voorschot geheel of deels terug te vorderen van de subsidie-ontvanger in het daaropvolgende
      kalenderjaar of kalenderjaren voor zoveel als nodig is om het teveel betaalde voorschot volledig te verrekenen,
      of door het teveel betaalde voorschot aan de subsidie-ontvanger in mindering te brengen op het eerst volgende te
      verstrekken maandelijkse bedrag of op het eerst volgende te verstrekken jaarlijkse bedrag en vervolgens op zoveel
      maandelijkse of jaarlijkse bedragen als nodig is om het teveel betaalde voorschot volledig te verrekenen.

      4 De minister kan op verzoek van de subsidieontvanger een teveel aan verstrekte maandelijkse bedragen of een
      teveel op het verstrekte jaarlijkse bedrag als bedoeld in [artikel 68, tweede lid, van het besluit][ref15], tot
      het teveel betaalde bedrag volledig is verrekend, verrekenen door het bedrag van het teveel betaalde voorschot aan
      de subsidieontvanger in delen in mindering te brengen op de volgende te verstrekken maandelijkse bedragen of op
      de volgende te verstrekken jaarlijkse bedragen. Indien geen maandelijkse of jaarlijkse bedragen meer verschuldigd
      zijn, wordt een teveel betaald voorschot teruggevorderd.

      5 Indien toepassing is gegeven aan [artikel 12, vierde lid, van het besluit][ref16], waarbij de
      productie, bedoeld in het eerste lid, onderdeel a, de in de subsidiebeschikking opgenomen maximale
      productie die voor subsidie in aanmerking komt en de productie die in voorkomend geval bij toepassing van
      [artikel 15, derde lid, van het besluit][ref17] bij de maximale productie wordt opgeteld, overschrijdt, verdeelt
      de Minister bij de bijstelling van een voorschot als bedoeld in het eerste lid, de productie die voor subsidie in
      aanmerking komt evenredig aan de productie die is ingevoed en de productie die niet is ingevoed.


