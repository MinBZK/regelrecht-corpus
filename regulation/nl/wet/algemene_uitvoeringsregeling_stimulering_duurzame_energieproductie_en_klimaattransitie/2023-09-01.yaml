  - number: 2a
    text: |-
      1 De aanvraag om subsidieverlening gaat vergezeld van een haalbaarheidsstudie.

      2 De haalbaarheidsstudie, bedoeld in het eerste lid, bevat in ieder geval:

      a. een omschrijving van de productie-installatie;

      b. een exploitatieberekening;

      c. een financieringsplan voor de productie-installatie waarvoor de subsidie wordt aangevraagd;

      d. inzicht in het eigen vermogen van de aanvrager, en

      e. indien het eigen vermogen minder dan 20% van de investering in de productie-installatie of indien de aanvrager
      meer dan één aanvraag per openstellingsperiode heeft ingediend minder dan 20% van de som van de investeringen in
      de productie-installaties bedraagt een intentieverklaring van een financier ter financiering van de productie-
      installatie waarvoor subsidie wordt aangevraagd.

      3 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee heeft in afwijking van het tweede lid, onderdeel e, de intentieverklaring van de
      financier betrekking op de financiering van het restant dat nodig is om 20% van de investering te bereiken.

      4 De exploitatieberekening, bedoeld in het tweede lid, onderdeel b, omvat:

      a. een specificatie van de investeringskosten per component van de productie-installatie,

      b. een overzicht van alle kosten en baten van de productie-installatie, en

      c. een berekening van het projectrendement over de subsidielooptijd of, indien de aanvraag betrekking heeft op
      een productie-installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee, de
      looptijd van het project.

      5 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee wordt als de aanvrager in de aanvraag dit aangeeft tot het eigen vermogen,
      bedoeld in het tweede lid, onderdeel d, meegerekend:

      a. indien de aanvrager een samenwerkingsverband is de eigen vermogens van de deelnemers aan het
      samenwerkingsverband;

      b. indien de subsidie-aanvrager of een deelnemer aan een samenwerkingsverband een dochteronderneming is en de
      moederonderneming daarmee schriftelijk instemt het overige eigen vermogen van de moederonderneming.

      6 Voor de bepaling van de omvang van het eigen vermogen overeenkomstig het vijfde lid, wordt het eigen vermogen
      van een deelnemer aan een samenwerkingsverband of van een moederonderneming meegerekend in het eigen vermogen van
      ten hoogste twee subsidie-aanvragers. Indien het eigen vermogen van dezelfde entiteit op grond van het vijfde lid
      voor de aanvragen van meer dan twee subsidie-aanvragers zou worden meegerekend, wordt dat eigen vermogen bij alle
      aanvragen buiten beschouwing gelaten.

      7 Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van fotovoltaïsche zonnepanelen, met een gezamenlijke vermogen van minder dan 1 MWp, bevat de
      haalbaarheidsstudie, in afwijking van het tweede lid, in ieder geval:

      a. een omschrijving van de productie-installatie; en

      b. een financieringsplan met uitgesplitste begroting van alle noodzakelijke kosten voor de productie-installatie
      waarvoor de subsidie is aangevraagd.
