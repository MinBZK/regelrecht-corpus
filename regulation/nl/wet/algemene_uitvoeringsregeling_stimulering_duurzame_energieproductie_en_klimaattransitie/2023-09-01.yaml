  - number: '2'
    text: |-
      1 De aanvraag om subsidieverlening gaat vergezeld van vergunningen die noodzakelijk zijn voor de realisatie van de
      productie-installatie.

      2 Het eerste lid is niet van toepassing indien de aanvraag betrekking heeft op:

      a. een productie-installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee;

      b. een productie-installatie voor de afvang en de permanente opslag van koolstofdioxide en het een vergunning
      betreft die op grond van [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref1]
      noodzakelijk is voor de realisatie van het ondergrondse opslagvoorkomen voor koolstofdioxide.

      3 Indien sprake is van een vergunning die op grond van
      [artikel 2.1, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref2]
      noodzakelijk is voor de realisatie van de productie-installatie, is die vergunning verleend op grond van
      __REF001___________________________________________________________________________________________________________
      __.

      4 Indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en het gebruik van
      koolstofdioxide of voor de afvang en de permanente opslag van koolstofdioxide en op het moment van indienen van
      de aanvraag vergunningen die noodzakelijk zijn voor de realisatie van die productie-installatie nog niet zijn
      verleend, gaat de aanvraag vergezeld van:

      a. de vergunning die op grond van
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref4] noodzakelijk is voor
      de realisatie van de afvanginstallatie en, indien van toepassing, de vervloeiingsinstallatie of de installatie
      voor zuivering van de afgevangen koolstofdioxide, of indien die vergunning nog niet is verleend, de in behandeling
      genomen aanvraag voor die vergunning; en

      b. de vergunningen die al zijn verleend.

      5 Indien de aanvraag betrekking heeft op een productie-installatie die wordt gerealiseerd op een
      perceel dat in eigendom is van het Rijk en waarop het recht van opstal is verkregen bij een openbare
      gunningsprocedure, waarbij de hoogte van de aangevraagde subsidie op basis van [het besluit][ref5] onderdeel
      was van de gunningscriteria, en op het moment van indienen van de aanvraag de vergunning die op grond van
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref6] noodzakelijk is voor
      de realisatie van de productie-installatie, nog niet is verleend, gaat de aanvraag vergezeld van het ontwerpbesluit
      van die vergunning.


