  - number: '7'
    text: |-
      1 Dit artikel is van toepassing op een subsidieontvanger die een daartoe bij een openstellingsregeling aangewezen
      categorie productie-installatie bedrijft:

      a. voor de productie van stoom door middel van verbranding van houtpellets in een ketel;

      b. waarin vaste of gasvormige biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare elektriciteit en
      hernieuwbare warmte;

      c. voor de productie van elektriciteit door middel van kolen waarin biomassa mee wordt gestookt, of

      d. voor de productie van hernieuwbare warmte, of hernieuwbare elektriciteit en hernieuwbare warmte door middel van
      verbranding van houtpellets met een brander in een ketel, een oven of een fornuis.

      2 Een subsidieontvanger maakt gebruik van vaste biomassa die per biomassalevering vergezeld gaat van de
      benodigde conformiteitsbeoordelingsverklaringen afgegeven op grond van een certificatieschema, bedoeld
      in [artikel 10 van het Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1],
      of op grond van het verificatieprotocol, bedoeld in
      [artikel 4 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref2],
      afhankelijk van de van toepassing zijnde duurzaamheidseisen, bedoeld in
      [artikel 2 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref3], en ten aanzien
      van elke aard van vaste biomassa.

      3 Van de totale massa houtige biomassa uit bosbeheereenheden die in een kalenderjaar voor subsidie in aanmerking
      komt, hoeft ten hoogste 30% te voldoen aan de duurzaamheidscriteria en broeikasgasemissiereductiecriteria, bedoeld
      in artikel 29, eerste lid, van [richtlijn (EU) 2018/2001](32018L2001), waarbij voor een subsidie-ontvanger met
      een beschikking tot subsidieverlening die is afgegeven op een aanvraag om subsidieverlening die is ontvangen voor
      inwerkingtreding van de Regeling aanwijzing categorieën duurzame energieproductie en klimaattransitie 2023, wordt
      uitgegaan van [richtlijn (EU) 2018/2001](32018L2001), naar de tekst zoals deze bij die richtlijn is vastgesteld.

      4 In afwijking van het tweede lid geldt voor een subsidieontvanger die een productie-installatie bedrijft met een
      totaal nominaal thermisch ingangsvermogen kleiner dan 7,5 MW, het bepaalde in eis 1.1b, tweede en derde volzin, van
      [bijlage B van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref4], niet.


