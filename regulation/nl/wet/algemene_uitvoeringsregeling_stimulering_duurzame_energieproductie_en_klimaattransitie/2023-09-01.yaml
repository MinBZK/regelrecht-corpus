  - number: '10'
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het origineel van een ondertekend
      formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: '11'
    text: |-
      1 Voor de toepassing van [artikel 3, eerste en tweede lid, van het besluit][ref1] geldt dat geen sprake is van
      dezelfde productie-installatie wanneer:

      a. het een productie-installatie op een andere locatie betreft;

      b. het een productie-installatie met een andere opwekkingstechnologie betreft;

      c. het een productie-installatie betreft die, zonder dat daarvoor een technische aanpassing nodig is, geschikt
      is voor permanente opslag van koolstofdioxide en voor gebruik van koolstofdioxide, voor die productie-installatie
      subsidie voor beide technologieën wordt aangevraagd gedurende dezelfde openstellingsperiode en bij het aanwijzen
      van de categorie productie-installaties op grond van [artikel 2 van het besluit][ref2] is bepaald dat het
      combineren van beide technologieën mogelijk is.

      2 Onverminderd het eerste lid geldt voor de toepassing van [artikel 3, eerste en tweede lid, van het besluit][ref3]
      dat geen sprake is van dezelfde productie-installatie wanneer het een productie-installatie betreft waarvan het
      vermogen meer dan 20% afwijkt ten opzichte van het vermogen van een productie-installatie waarvoor eerder een
      beschikking tot subsidieverlening is verstrekt, indien de beschikking tot subsidieverlening voor 1 juli 2011 is
      ingetrokken of de subsidie voor 1 juli 2011 is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel11
