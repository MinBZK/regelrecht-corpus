  - number: 7l
    text: |-
      1 Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en permanente opslaat of gebruikt, waarbij gebruik wordt gemaakt van vloeibaar transport.

      2 De subsidie-ontvanger overlegt aan de Minister een verificatierapport dat betrekking heeft op het voorgaande
      kalenderjaar, van een verificateur als bedoeld in artikel 3, onderdeel 3, van de Verordening verificatie en
      accreditatie emissiehandel uiterlijk vier maanden na afloop van het kalenderjaar waarop het verificatierapport
      betrekking heeft.

      3 Voor het opstellen van het verificatierapport wordt gebruikgemaakt van een door de Minister beschikbaar gesteld
      middel.

      4 Indien de subsidie-ontvanger met de productie-installatie koolstofdioxide afvangt en permanent opslaat, blijkt
      uit het verificatierapport dat de gemeten hoeveelheden koolstofdioxide, beschreven in het meetrapport, bedoeld in
      [artikel 7g][ref1], permanent zijn opgeslagen.

      5 Indien de subsidie-ontvanger met de productie-installatie koolstofdioxide afvangt en gebruikt, blijkt uit
      het verificatierapport dat de gemeten hoeveelheden koolstofdioxide, beschreven in het meetrapport, bedoeld in
      [artikel 7g][ref2], nuttig zijn aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7g
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel7g
