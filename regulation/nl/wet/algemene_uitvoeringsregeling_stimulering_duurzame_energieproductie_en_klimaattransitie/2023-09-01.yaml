  - number: '6'
    text: |-
      1 Dit artikel is van toepassing op een subsidieontvanger die een productie-installatie bedrijft waarvoor subsidie
      wordt verstrekt onder de voorwaarde dat de subsidieontvanger aantoont dat de gebruikte biomassa voldoet aan de
      duurzaamheidscriteria en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van [richtlijn (EU)
      2018/2001](32018L2001).

      2 Een subsidieontvanger maakt gebruik van biomassa die per biomassalevering vergezeld gaat van de benodigde
      conformiteitsbeoordelingsverklaringen, afgegeven op grond van een certificatieschema waarvan de Europese Commissie
      op grond van artikel 30, vierde lid, van [richtlijn (EU) 2018/2001](32018L2001) heeft besloten dat deze accurate
      gegevens verschaft met het oog op de toepassing van artikel 29 van [richtlijn (EU) 2018/2001](32018L2001) of
      op grond van een nationaal systeem, waarvan de Europese Commissie op grond van artikel 30, zesde lid, van de
      [richtlijn (EU) 2018/2001](32018L2001) heeft besloten dat dit voldoet aan de in die richtlijn bepaalde voorwaarden,
      afhankelijk van de van toepassing zijnde criteria, bedoeld in het eerste lid.

      3 Voor de toepassing van het eerste en tweede lid wordt voor een subsidie-ontvanger met een beschikking tot
      subsidieverlening die is afgegeven op een aanvraag om subsidieverlening die is ontvangen voor inwerkingtreding
      van de [Regeling aanwijzing categorieën duurzame energieproductie en klimaattransitie 2023][ref1], uitgegaan van
      [richtlijn (EU) 2018/2001](32018L2001), naar de tekst zoals deze bij die richtlijn is vastgesteld.

      4 In afwijking van het tweede lid kan een subsidieontvanger voor biomassa als bedoeld in de nummers 170 tot en met
      179, 300 tot en met 329 en 410 van NTA 8003:2017 gebruik maken van biomassa die per biomassalevering vergezeld gaat
      van de benodigde conformiteitsbeoordelingsverklaringen afgegeven op grond van het verificatieprotocol, bedoeld in
      [artikel 7ba, eerste lid][ref2].

      5 De subsidieontvanger zendt binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot
      wordt verstrekt aan de minister een jaarlijkse conformiteitsbeoordelingsverklaring afgegeven op grond van het
      verificatieprotocol, bedoeld in [artikel 7ba, eerste lid][ref3].


