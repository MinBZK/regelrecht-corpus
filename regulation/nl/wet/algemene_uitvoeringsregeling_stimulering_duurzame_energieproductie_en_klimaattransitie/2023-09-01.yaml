  - number: 7e
    text: |-
      1 Een subsidie-ontvanger stelt een meetprotocol op met inachtneming van de meetvoorwaarden voor koolstofdioxide-
      arme warmte, voor waterstof, voor koolstofdioxide en voor geavanceerde hernieuwbare brandstof, genoemd in
      [bijlage 9][ref1].

      2 De subsidie-ontvanger laat het meetprotocol beoordelen door een meetbedrijf.

      3 Het meetprotocol heeft een geldigheid van vijf jaar of tot het moment dat de subsidie-ontvanger een aanpassing
      van de productie-installatie of het productieproces doorvoert die een wijziging van het meetprotocol tot gevolg
      heeft. De subsidie-ontvanger stelt voorafgaand aan het verlopen van de geldigheidsduur een nieuw meetprotocol op.

      4 De minister verstrekt het eerste voorschot aan een subsidie-ontvanger niet eerder dan nadat de subsidie-ontvanger
      het beoordeelde meetprotocol overlegt of doet overleggen aan de minister.

      5 De minister verstrekt uitsluitend een voorschot indien een subsidie-ontvanger over een geldig meetprotocol
      beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7f
    text: |-
      1 De subsidie-ontvanger draagt er zorg voor dat alle energie- of productiestromen die zijn omschreven in de
      meetvoorwaarden, bedoeld in [bijlage 9][ref1] en die de systeemgrens passeren, worden gemeten in overeenstemming
      met het meetprotocol.

      2 De minister kan het meetbedrijf verzoeken afwijkingen van het meetprotocol te melden aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
