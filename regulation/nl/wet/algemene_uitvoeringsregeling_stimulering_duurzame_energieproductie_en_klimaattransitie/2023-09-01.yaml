  - number: '12'
    text: |-
      1 Onder ingrijpende uitbreiding als bedoeld in
      [artikel 3, eerste lid, onderdeel b, tweede lid, onderdeel b, en derde lid, onderdeel b, van het besluit][ref1]
      wordt verstaan een uitbreiding van een bestaande productie-installatie met ten minste één productie-eenheid.

      2 In afwijking van het eerste lid wordt bij een afvalverbrandingsinstallatie onder ingrijpende uitbreiding
      verstaan een uitbreiding met tenminste een nieuwe verbrandingsoven met bijbehorende ketel en een
      rookgasreiniginginstallatie.

      3 Onder gehele vervanging als bedoeld in
      [artikel 3, eerste lid, onderdeel b, tweede lid, onderdeel b, en derde lid, onderdeel b, van het besluit][ref2]
      wordt verstaan het vervangen van de gehele productie-installatie door een nieuwe productie-installatie.

      4 Onder renovatie als bedoeld in
      [artikel 3, eerste lid, onderdeel c, tweede lid, onderdeel c, en derde lid, onderdeel c, van het besluit][ref3]
      wordt verstaan het in nieuwstaat brengen van die voorzieningen van een productie-installatie die zorg dragen voor
      broeikasgasreductie of voor de omzetting van hernieuwbare energiebronnen in elektriciteit, gas of warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel12
