  - number: '9'
    text: |-
      1 Het in [artikel 68, eerste lid, van het besluit][ref1] bedoelde maandelijkse bedrag bedraagt één-twaalfde van 80%
      van het product van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie,
      waar de minister op verzoek van de producent, het aantal kWh of het verschil in kg broeikasgas, bedoeld in
      [artikel 15, derde of vierde lid][ref2], [23, derde of vierde lid][ref3], [32, derde of vierde lid][ref4],
      [40, derde of vierde lid][ref5], [48, derde of vierde lid][ref6], [55, derde of vierde lid][ref7],
      [55j, derde of vierde lid][ref8] of [55q, derde of vierde lid, van het besluit][ref9], bij op kan tellen, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref10],
      [28, derde lid, onderdeel c][ref11], [44, derde lid, onderdeel c][ref12], of [55f, derde lid van het besluit][ref13]
      het basisbedrag behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd
      met de bij ministeriële regeling vastgestelde correcties op grond van [artikel 14, vijfde lid][ref14],
      [31, vijfde lid][ref15], [47, vijfde lid][ref16], of [55i, vierde lid, van het besluit][ref17],

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op
      grond van [artikel 22, vijfde lid][ref18], [39, vijfde lid][ref19], [54, vijfde lid][ref20], of
      [55p, vierde lid, van het besluit][ref21], of

      3°. fasebedrag, verminderd met de bij ministeriële regeling vastgestelde correcties op grond
      van [artikel 14, vijfde lid][ref22], [31, vijfde lid][ref23], [47, vijfde lid][ref24], of
      [55i, vierde lid, van het besluit][ref25].

      2 Het in [artikel 68, eerste lid, van het besluit][ref26] bedoelde jaarlijkse bedrag bedraagt 80% van het product
      van:

      a. de in beschikking tot subsidieverlening voor het betreffende kalenderjaar opgenomen maximum productie, waar
      de minister op verzoek van de producent, het aantal kWh, bedoeld in [artikel 15, derde of vierde lid][ref27],
      [23, derde of vierde lid][ref28], [32, derde of vierde lid][ref29], [40, derde of vierde lid][ref30],
      [48, derde of vierde lid][ref31], of [55, derde of vierde lid, van het besluit][ref32], bij op kan tellen, en

      b. het voor de subsidie-ontvanger geldende:

      1°. basisbedrag, of bij toepassing van [artikel 11, derde lid, onderdeel c][ref33],
      [28, derde lid, onderdeel c][ref34], [44, derde lid, onderdeel c][ref35], of [55f, derde lid van het besluit][ref36]
      het basisbedrag behorende bij het in de beschikking tot subsidieverlening opgenomen rendement, verminderd
      met de bij ministeriële regeling vastgestelde correcties op grond van [artikel 14, vijfde lid][ref37],
      [31, vijfde lid][ref38], [47, vijfde lid][ref39], of [55i, vierde lid, van het besluit][ref40],

      2°. het tenderbedrag verminderd met de bij ministeriële regeling vastgestelde correcties op
      grond van [artikel 22, vijfde lid][ref41], [39, vijfde lid][ref42], [54, vijfde lid][ref43], of
      [55p, vierde lid, van het besluit][ref44], of

      3°. fasebedrag, verminderd met de bij ministeriële regeling vastgestelde correcties op grond
      van [artikel 14, vijfde lid][ref45], [31, vijfde lid][ref46], [47, vijfde lid][ref47], of
      [55i, vierde lid, van het besluit][ref48].

      3 Indien de subsidieperiode start op een andere datum dan 1 januari of eindigt op een andere datum dan 31 december
      bedraagt voor het eerste jaar respectievelijk het laatste jaar van de periode waarover subsidie wordt verstrekt het
      maandelijkse of jaarlijkse bedrag een evenredig deel van het aantal maanden of van het jaar waarover het voorschot
      wordt verstrekt.

      4 De minister kan het maandelijkse of jaarlijkse bedrag herberekenen indien:

      a. de subsidie-ontvanger een verzoek tot ontheffing als bedoeld in [artikel 62, derde lid, van het besluit][ref49],
      indient;

      b. de maandelijkse productie van hernieuwbare elektriciteit, hernieuwbare warmte, hernieuwbaar gas of de
      maandelijkse vermindering van broeikasgas gedurende ten minste twee maanden ten minste 50 procent zal achterblijven
      dan wel achter is gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen maximum productie
      in kWh;

      c. de minister na het begin van de voorschotverlening meer dan een maand geen productiegegevens heeft ontvangen
      over de betreffende productie-installatie;

      d. de cumulatieve productie van hernieuwbare elektriciteit, hernieuwbare warmte, hernieuwbaar gas of de cumulatieve
      vermindering van broeikasgas in het betreffende kalenderjaar ten minste 20% zal achterblijven dan wel achter is
      gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen maximum productie in kWh;

      e. de subsidie-ontvanger een producent van geavanceerde hernieuwbare brandstof is als bedoeld in
      [artikel 9.7.1.1 van de Wet milieubeheer][ref50]; of

      f. de subsidie-ontvanger niet heeft voldaan aan de verplichting, bedoeld in [artikel 3, derde lid][ref51].

      5 In afwijking van het bepaalde in het eerste lid, onderdeel b, ten eerste, kan de Minister van een lager
      basisbedrag uitgaan indien het rendement van de productie-installatie gedurende ten minste twee jaar structureel is
      achtergebleven ten opzichte van het in de beschikking tot voorschotverlening opgenomen rendement.


