        bwb_id: BWBR0023563
  - number: 7g
    text: |-
      1 De subsidie-ontvanger stelt elke kalendermaand een meetrapport op met inachtneming van het meetprotocol dat:

      a. de wijze van totstandkoming van de meetgegevens beschrijft, en

      b. geverifieerd wordt door een meetbedrijf, waarbij het desbetreffende meetbedrijf ten minste de meetgegevens en
      het gerealiseerde energetische rendement ten opzichte van de geproduceerde energie bevestigt.

      2 Het meetrapport bevat voor een productie-installatie voor waterstof uit elektrolyse met een aansluiting op het
      elektriciteitsnet de meetgegevens van de in- en uitgaande energiestromen van het elektrolyseproces en het aantal
      productie-uren.

      3 Het meetrapport bevat voor een productie-installatie voor de productie van koolstofdioxide-arme warmte met een
      elektroboiler voor warmte het aantal productie-uren.
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel7g
  - number: 7h
    text: |-
      1 Een subsidie-ontvanger draagt er zorg voor dat het meetrapport uiterlijk 20 dagen na afloop van de kalendermaand
      waarop het meetrapport betrekking heeft, wordt overgedragen aan de Minister.

      2 De minister stelt na ontvangst van het meetrapport op verzoek van een subsidie-ontvanger die een productie-
      installatie voor de productie van koolstofdioxide-arme warmte in stand houdt de nuttig aangewende koolstofdioxide-
      arme warmte in MWh vast.

      3 Indien de subsidie-ontvanger die een productie-installatie voor de productie van koolstofdioxide-arme warmte
      in stand houdt, gebruik maakt van warmte afkomstig van een andere bron, draagt de subsidie-ontvanger er zorg
      voor dat het meetbedrijf de hoeveelheid gebruikte warmte in mindering brengt op de hoeveelheid geproduceerde
      koolstofdioxide-arme warmte.
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel7h
  - number: 7i
    text: |-
      1 Bij een productie-installatie voor restwarmte zonder warmtepompsysteem, wordt de productie gemeten bij de uitgang
      van het warmteoverdrachtsstation.

      2 Bij een productie-installatie voor restwarmtebenutting met een warmtepomp wordt de productie gemeten bij de
      uitgang van de warmtepomp.

      3 Bij een productie-installatie voor de productie van koolstofdioxide-arme warmte door middel van elektriciteit in
      een hybride glasoven worden alleen de ingaande energiestromen gemeten.
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel7i
  - number: 7j
    text: |-
      1 De [artikelen 7d tot en met 7h][ref1] zijn niet van toepassing op een productie-installatie die waterstof
      produceert met behulp van elektrolyse met een directe aansluiting op een productie-installatie die elektriciteit
      produceert met behulp van windenergie of een productie-installatie die elektriciteit produceert uit zonlicht door
      middel van fotovoltaïsche zonnepanelen.

      2 Het aantal kg verminderde broeikasgas dat in elk kalenderjaar voor subsidie in aanmerking komt bij een productie-
      installatie die waterstof produceert als bedoeld in het eerste lid wordt bepaald op basis van het aantal kWh
      waarvoor garanties van oorsprong zijn verstrekt die aantonen dat de producent met de hiervoor bedoelde productie-
      installatie in het betreffende kalenderjaar een hoeveelheid waterstof heeft geproduceerd met een directe
      aansluiting op een productie-installatie die elektriciteit produceert met behulp van windenergie of een productie-
      installatie die elektriciteit produceert uit zonlicht door middel van fotovoltaïsche zonnepanelen.


