  - number: 8a
    text: |-
      1 De productie, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], in verband met een beschikking op een
      aanvraag om subsidieverlening wordt verminderd met het aantal kWh dat is ingevoed op een elektriciteitsnet
      gedurende elke periode waarin de waarde voor elektriciteit negatief is.

      2 Het eerste lid is niet van toepassing indien de beschikking tot subsidieverlening betrekking heeft op een
      productie-installatie waarvan het nominaal geïnstalleerd vermogen voor elektriciteitsproductie per aansluiting op
      het elektriciteitsnet minder dan 200 kW bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel8
    url: https://wetten.overheid.nl/BWBR0023563/2023-09-01#Artikel8a
