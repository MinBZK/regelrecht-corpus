  - number: 7c
    text: |-
      De subsidieontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte, hernieuwbare
      elektriciteit, hernieuwbare elektriciteit en hernieuwbare warmte, hernieuwbaar gas of geavanceerde hernieuwbare
      brandstof wordt geproduceerd door middel van vergisting en co-vergisting van dierlijke meststoffen:

      a. voldoet aan de [artikelen 33][ref1] en [39 van het Uitvoeringsbesluit Meststoffenwet][ref2]
      en de [artikelen 38, vierde lid][ref3], [40, tweede lid][ref4], [46, achtste lid][ref5], en
      [47, eerste lid, van de Uitvoeringsregeling Meststoffenwet][ref6];

      b. produceert slechts product dat beantwoordt aan
      [Bijlage Aa, onderdeel IV, categorie 1 van de Uitvoeringsregeling Meststoffenwet][ref7];

      c. gebruikt slechts coproducten, genoemd in
      [Bijlage Aa, onderdeel IV, van de Uitvoeringsregeling Meststoffenwet][ref8];

      d. voldoet bij gebruik van coproducten, genoemd in
      [Bijlage Aa, onderdeel IV, categorie 1, onder G, van de Uitvoeringsregeling Meststoffenwet][ref9] aan de eisen
      bedoeld in [bijlage II, tabel 1, en tabel 4, van het Uitvoeringsbesluit Meststoffenwet][ref10]; en

      e. gebruikt bij nakoming van
      __REF000___________________________________________________________________________________________________________
      __________ dezelfde benamingen en coderingen, genoemd in
      [Bijlage Aa van de Uitvoeringsregeling Meststoffenwet][ref12].


