  - number: 14h
    text: |-
      1 Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen voor
      inwerkingtreding van de Regeling van de Minister voor Klimaat en Energie van 21 april 2022, tot wijziging van de
      Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie in verband met wijzigingen
      in aan te leveren gegevens en enkele andere wijzigingen (Stct. 2022, 11413) blijft [artikel 3, negende lid][ref1],
      van toepassing zoals dat luidde voor de inwerkingtreding van die regeling.

      2 Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen
      voor inwerkingtreding van de Regeling van de Minister voor Klimaat en Energie van 21 april 2022, tot
      wijziging van de Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie
      in verband met wijzigingen in aan te leveren gegevens en enkele andere wijzigingen (Stct. 2022, 11413), is
      [artikel 7g, tweede en derde lid][ref2], is niet van toepassing.

      3 Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen voor
      inwerkingtreding van de Regeling aanwijzing categorieën duurzame energieproductie en klimaattransitie 2023
      zijn de [artikelen 3, zevende lid, 7, vierde, vijfde en zesde lid][ref3], en [8a][ref4] van toepassing zoals
      deze luidden voor de inwerkingtreding van de Regeling van de Minister voor Klimaat en Energie van 13 juli 2023,
      nr. WJZ/ 26784474, tot wijziging van de Algemene uitvoeringsregeling stimulering duurzame energieproductie en
      klimaattransitie in verband met terugvorderen voorschotten, meetellen uren met negatieve elektriciteitsprijs en
      enkele andere wijzigingen (Stct. 2023, nummer 20349).


