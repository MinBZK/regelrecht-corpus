  - number: 7m
    text: |-
      1 Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en permanent opslaat.

      2 De subsidie-ontvanger verzekert zich dat de hoeveelheid koolstofdioxide die permanent wordt opgeslagen wordt
      gemeten volgens de meetvoorwaarden, opgenomen in [bijlage 9][ref1].

      3 De subsidie-ontvanger overlegt uiterlijk vier maanden na afloop van het kalenderjaar de meetgegevens van de
      beheerder van de basisinfrastructuur voor koolstofdioxide over de hoeveelheid permanent opgeslagen koolstofdioxide
      aan de Minister.

      4 Indien er sprake is van een vloeibaar transport van koolstofdioxide waarbij koolstofdioxide van meerdere
      productie-installaties wordt gemengd, wijst de subsidie-ontvanger voor de meting, bedoeld in het tweede lid, één
      meetbedrijf aan.

      5 Indien er sprake is van een vloeibaar transport van koolstofdioxide, draagt de subsidie-ontvanger er zorg voor
      dat hij beschikt over transportdocumenten, waaruit sluitend de afleverlocatie en de afleverhoeveelheid van het
      transport door hem en derde partijen en de permanente opslag van koolstofdioxide blijkt.


