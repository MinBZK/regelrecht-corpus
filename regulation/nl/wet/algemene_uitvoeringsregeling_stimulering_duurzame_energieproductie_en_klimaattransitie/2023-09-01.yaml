  - number: 2b
    text: |-
      1 In aanvulling op [artikel 2a, tweede lid][ref1], bevat de haalbaarheidsstudie tevens:

      a. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit waterkracht, hernieuwbare energie uit biomassa of de vermindering van broeikasgas een energie-
      of productopbrengstberekening;

      b. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbaar gas met een
      aansluiting met een doorlaatwaarde groter dan 40m3(n) per uur een verklaring met prijsindicatie van de netbeheerder
      voor het invoeden van hernieuwbaar gas;

      c. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare of
      koolstofdioxide-arme warmte een onderbouwing van de warmteafzet;

      d. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare of
      koolstofdioxide-arme warmte door middel van geothermie een geologisch rapport;

      e. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie op zee:

      1°. een windenergie-opbrengstberekening, en

      2°. informatie die aannemelijk maakt dat tijdig zal zijn voldaan aan
      [artikel 6:16d, eerste lid, onderdeel c, van het Waterbesluit][ref2];

      f. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie, niet zijnde windenergie op zee, met een vermogen van ten minste 100 kW
      een windenergie-opbrengstberekening;

      g. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit zonne-energie met een vermogen groter dan of gelijk aan 1 MWp door middel van zonnepanelen met
      een zonvolgsysteem, een zonne-energieopbrengstberekening;

      h. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of koolstofdioxide-arme warmte uit zonne-energie, anders dan zonthermie voor
      warmte met toepassing in een daglichtkas, een gedetailleerde tekening op schaal van de locatie van de productie-
      installatie waarop de zonnepanelen of zonnecollectoren nauwkeurig zijn ingetekend;

      i. indien de aanvraag betrekking heeft op een productie-installatie voor de benutting van restwarmte een kaart
      waarop het tracé van de transportleiding is ingetekend;

      j. indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en de permanente opslag van
      koolstofdioxide een rapport over de infrastructuur voor transport en de opslag;

      k. indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en het gebruik van
      koolstofdioxide een onderbouwing van de koolstofdioxide-afzet;

      l. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van windenergie met hoogtebeperking, een onderbouwing dat er op de locatie van de
      productie-installatie sprake is van een hoogterestrictie bij of krachtens landelijke wet- en regelgeving in verband
      met de aanwezigheid van een luchthaven in de omgeving waardoor de tiphoogte van de windturbine beperkt is tot 150
      meter of lager;

      m. indien de aanvraag betrekking heeft op een productie-installatie van waterstof een onderbouwing dat de
      installatie in staat is, terwijl deze gereed is voor gebruik, om minder dan 1% elektriciteit van het maximale
      vermogen van de productie-installatie te verbruiken;

      n. indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of koolstofdioxide-arme warmte uit zonne-energie, anders dan zonthermie voor
      warmte met toepassing in een daglichtkas, waarbij sprake is van plaatsing op daken of bevestiging aan gevels, een
      verklaring van een constructeur over de belastbaarheid van het dak of de gevel volgens het [Bouwbesluit 2012][ref3]
      met gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld.

      2 Het geologisch rapport, bedoeld in het eerste lid, onderdeel d, voldoet aan het model ‘Specificaties geologisch
      onderzoek voor geothermieprojecten - rapportagevereisten SDE+ en RNES’ van 18 april 2017 van TNO zoals gepubliceerd
      op de website van de Rijksdienst voor Ondernemend Nederland.

      3 De windenergie-opbrengstberekening, bedoeld in het eerste lid, onderdelen e en f, is opgesteld door een
      organisatie met expertise op het gebied van windenergie-opbrengstberekeningen, met gebruikmaking van gerenommeerde
      rekenmodellen, omgevingsmodellen, windmodellen en windkaarten en bevat ten minste:

      a. de locatiegegevens van het windpark;

      b. de technische specificaties waaronder merk, type, ashoogte, rotordiameter en vermogenscurve van de beoogde
      windturbines;

      c. de lokale windgegevens voor het windpark, en

      d. een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van het windpark.

      4 Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, zijn voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, en terugregelverliezen opgenomen en is de organisatie met expertise op het
      gebied van windenergie-opbrengstberekeningen, bedoeld in het derde lid, onafhankelijk.

      5 Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, wordt voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie, niet zijnde windenergie
      op zee, voor de windenergie-opbrengstberekening per windturbinelocatie op de beoogde ashoogte de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, eigen consumptie, turbinerendement, terugregelverliezen en een berekende
      windsnelheid opgenomen, waarbij de berekende windsnelheid:

      a. gebaseerd is op de omgevingseffecten en lokale windgegevens voor de windturbinelocatie over een aaneengesloten
      periode van minimaal 10 jaar; en

      b. niet hoger is dan de gemiddelde windsnelheid volgens een middel dat door de minister ter beschikking wordt
      gesteld.

      6 De zonne-energieopbrengstberekening, bedoeld in het eerste lid, onderdeel g, is gebaseerd op een gemiddelde
      jaarlijkse instraling op een horizontaal vlak van ten hoogste 1.000 kWh per m2 en bevat ten minste:

      a. technische specificaties van de zonnepanelen, waaronder minimaal het piekvermogen en het aantal panelen;

      b. technische specificaties van het automatische zonvolgsysteem, waaronder minimaal een beschrijving of verstelling
      van de hellingshoek, verstelling in oost-westoriëntatie of verstelling van de hellingshoek en verstelling in oost-
      westoriëntatie van de zonnepanelen wordt toegepast;

      c. het totale vermogen van omvormers en het aansluitvermogen van de netaansluiting;

      d. verliezen ten gevolge van reflectie, schaduwwerking, vervuiling en degradatie van de zonnepanelen; en

      e. een berekening van gemiddelde netto elektriciteitsproductie op jaarbasis, rekening houdend met de verliezen,
      bedoeld in onderdeel d, over een periode van 15 jaar van het zonne-energiesysteem.

      7 Het rapport over de infrastructuur voor transport en opslag, bedoeld in het eerste lid, onderdeel j, voldoet aan
      het model ‘Vereiste informatie transport- en opslagverklaring’, gepubliceerd op de website van de Rijksdienst voor
      Ondernemend Nederland.


