  - number: '8.2'
    text: |-
      De Minister verrekent een tekort aan verstrekte maandelijkse bedragen of een tekort op het jaarlijkse bedrag, als
      bedoeld in [artikel 68, tweede lid, van het besluit][ref1], door het te weinig betaalde bedrag aan het voorschot
      binnen zes weken na de datum van bijstelling van het voorschot aan de subsidie-ontvanger te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel68
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '68'
  - number: '8.3'
    text: |-
      De minister verrekent een in een kalenderjaar teveel aan verstrekte maandelijkse bedragen of een teveel op het
      verstrekte jaarlijkse bedrag als bedoeld in [artikel 68, tweede lid, van het besluit][ref1], door het bedrag van
      het teveel betaalde voorschot geheel of deels terug te vorderen van de subsidie-ontvanger in het daaropvolgende
      kalenderjaar of kalenderjaren voor zoveel als nodig is om het teveel betaalde voorschot volledig te verrekenen,
      of door het teveel betaalde voorschot aan de subsidie-ontvanger in mindering te brengen op het eerst volgende te
      verstrekken maandelijkse bedrag of op het eerst volgende te verstrekken jaarlijkse bedrag en vervolgens op zoveel
      maandelijkse of jaarlijkse bedragen als nodig is om het teveel betaalde voorschot volledig te verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel68
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '68'
  - number: '8.4'
    text: |-
      De minister kan op verzoek van de subsidieontvanger een teveel aan verstrekte maandelijkse bedragen of een teveel
      op het verstrekte jaarlijkse bedrag als bedoeld in [artikel 68, tweede lid, van het besluit][ref1], tot het
      teveel betaalde bedrag volledig is verrekend, verrekenen door het bedrag van het teveel betaalde voorschot aan
      de subsidieontvanger in delen in mindering te brengen op de volgende te verstrekken maandelijkse bedragen of op
      de volgende te verstrekken jaarlijkse bedragen. Indien geen maandelijkse of jaarlijkse bedragen meer verschuldigd
      zijn, wordt een teveel betaald voorschot teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel68
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '68'
  - number: '8.5'
    text: |-
      Indien toepassing is gegeven aan [artikel 12, vierde lid, van het besluit][ref1], waarbij de productie,
      bedoeld in het eerste lid, onderdeel a, de in de subsidiebeschikking opgenomen maximale productie
      die voor subsidie in aanmerking komt en de productie die in voorkomend geval bij toepassing van
      [artikel 15, derde lid, van het besluit][ref2] bij de maximale productie wordt opgeteld, overschrijdt, verdeelt
      de Minister bij de bijstelling van een voorschot als bedoeld in het eerste lid, de productie die voor subsidie in
      aanmerking komt evenredig aan de productie die is ingevoed en de productie die niet is ingevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel15
