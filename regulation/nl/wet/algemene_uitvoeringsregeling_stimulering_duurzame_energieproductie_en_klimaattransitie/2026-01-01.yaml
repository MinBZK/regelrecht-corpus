  - number: 14h.1
    text: |-
      Op beschikkingen tot subsidieverlening die zijn afgegeven op aanvragen voor subsidie die zijn ontvangen voor
      inwerkingtreding van de Regeling van de Minister voor Klimaat en Energie van 21 april 2022, tot wijziging van de
      Algemene uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie in verband met wijzigingen
      in aan te leveren gegevens en enkele andere wijzigingen (Stct. 2022, 11413) blijft [artikel 3, negende lid][ref1],
      van toepassing zoals dat luidde voor de inwerkingtreding van die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel3
