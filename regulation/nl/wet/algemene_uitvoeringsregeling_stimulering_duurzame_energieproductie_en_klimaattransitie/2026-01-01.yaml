        artikel: 71a
  - number: 1b
    text: |-
      Indien een subsidie-ontvanger voldoet aan de in [artikel 3, vierde lid van het besluit SDEK][ref1] genoemde
      voorwaarden, maakt de minister gebruik van de mogelijkheid om subsidie te verstrekken als bedoeld in dat
      artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '3'
  - number: '2.1'
    text: |-
      De aanvraag om subsidieverlening gaat vergezeld van vergunningen die noodzakelijk zijn voor de realisatie van de
      productie-installatie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: '2.2'
    text: 'Het eerste lid is niet van toepassing indien de aanvraag betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.2.a
    text: een productie-installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.2.b
    text: |-
      een productie-installatie voor de afvang en de permanente opslag van koolstofdioxide en het een vergunning betreft
      die noodzakelijk is voor de realisatie van het ondergrondse opslagvoorkomen voor koolstofdioxide;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.2.c
    text: |-
      een productie-installatie voor de productie van hernieuwbare warmte, hernieuwbare elektriciteit en
      hernieuwbare warmte of koolstofdioxide-arme warmte, indien er sprake is van een melding als bedoeld in
      [artikel 12b, eerste lid, van de Warmtewet][ref1], en het gaat om de productie van warmte waarmee een leverancier
      of een producent als bedoeld in artikel 12b van de Warmtewet opnieuw aan zijn wettelijke verplichtingen als bedoeld
      in die wet kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12b
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12b
  - number: '2.3'
    text: |-
      Voor de uitvoering van het eerste lid worden omgevingsvergunningen voor een omgevingsplanactiviteit als bedoeld in
      de [Omgevingswet][ref1] waaraan een termijn is verbonden als bedoeld in [artikel 5.36 van die wet][ref2] niet in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '2.4'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie die wordt gerealiseerd op een perceel dat
      in eigendom is van het Rijk en waarop het recht van opstal is verkregen bij een openbare gunningsprocedure,
      waarbij de hoogte van de aangevraagde subsidie op basis van het [besluit][ref1] onderdeel was van
      de gunningscriteria, en op het moment van indienen van de aanvraag de vergunning die op grond van
      [artikel 5.1., tweede lid, onderdeel b, van de Omgevingswet][ref2] noodzakelijk is voor de realisatie van de
      productie-installatie, nog niet is verleend, gaat de aanvraag vergezeld van het ontwerpbesluit van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0022735
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022735
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '2.5'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de afvang, niet zijnde afvang
      uit omgevingslucht, en het gebruik van koolstofdioxide of voor de afvang, niet zijnde afvang uit
      omgevingslucht, en de permanente opslag van koolstofdioxide en op het moment van indienen van de aanvraag
      vergunningen die noodzakelijk zijn voor de realisatie van die productie-installatie nog niet zijn
      verleend, gaat, in afwijking van het eerste lid, de aanvraag vergezeld van de vergunning die op grond van
      [artikel 5.1, tweede lid, onderdeel b van de Omgevingswet][ref1] noodzakelijk is voor de realisatie van de
      afvanginstallatie en, indien van toepassing, de vervloeiingsinstallatie of de installatie voor zuivering van de
      afgevangen koolstofdioxide, of indien die vergunning nog niet is verleend, de in behandeling genomen aanvraag voor
      die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '2.6'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare warmte,
      hernieuwbare elektriciteit en hernieuwbare warmte of koolstofdioxide-arme warmte en er een melding als
      bedoeld in [artikel 12b, eerste lid, van de Warmtewet][ref1] is gedaan en op het moment van indienen van de
      aanvraag vergunningen die noodzakelijk zijn voor de realisatie van die productie-installatie nog niet zijn
      verleend, gaat, in afwijking van het eerste lid, de aanvraag vergezeld van de vergunning die op grond van
      [artikel 5.1, tweede lid, van de Omgevingswet][ref2] noodzakelijk is voor de realisatie van de productie-
      installatie, of indien die vergunning nog niet is verleend, de in behandeling genomen aanvraag voor die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12b
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '2.7'
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonlicht uitsluitend door middel van fotovoltaïsche zonnepanelen die natuurinclusief wordt gerealiseerd, zijn
      in de vergunning die op grond van [artikel 5.1, eerste lid, onderdeel a van de Omgevingswet][ref1] noodzakelijk
      is voor de realisatie van de productie-installatie de volgende voorwaarden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 2.7.a
    text: er is van bovenaf gezien minimaal 25% open ruimte tussen de tafels met zonnepanelen aanwezig;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.7.b
    text: |-
      er is een inrichtingsplan en beheerplan dat ten doel heeft om verslechtering van de bodemkwaliteit, waterkwaliteit
      en ecologische kwaliteit te voorkomen, waarbij deze voorwaarden in ieder geval betrekking hebben op de periode
      waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.7.c
    text: |-
      de vergunninghouder monitort de effecten van de productie-installatie op de bodemkwaliteit, waterkwaliteit
      en biodiversiteit en neemt, indien nodig, aanvullende maatregelen om verslechtering van de bodemkwaliteit,
      waterkwaliteit en ecologische kwaliteit te voorkomen, waarbij deze voorwaarden in ieder geval betrekking hebben op
      de periode waarvoor subsidie wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2.7.d
    text: |-
      de vergunninghouder voert een nulmeting uit om de huidige waarde van de bodemkwaliteit, de waterkwaliteit en de
      ecologische kwaliteit vast te stellen.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2
  - number: 2a.1
    text: De aanvraag om subsidieverlening gaat vergezeld van een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2
    text: 'De haalbaarheidsstudie, bedoeld in het eerste lid, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2.a
    text: een omschrijving van de productie-installatie;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2.b
    text: een exploitatieberekening;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2.c
    text: een financieringsplan voor de productie-installatie waarvoor de subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2.d
    text: inzicht in het eigen vermogen van de aanvrager, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.2.e
    text: |-
      indien het eigen vermogen minder dan 20% van de investering in de productie-installatie of indien de aanvrager
      meer dan één aanvraag per openstellingsperiode heeft ingediend minder dan 20% van de som van de investeringen in
      de productie-installaties bedraagt een intentieverklaring van een financier ter financiering van de productie-
      installatie waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.3
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee heeft in afwijking van het tweede lid, onderdeel e, de intentieverklaring van de
      financier betrekking op de financiering van het restant dat nodig is om 20% van de investering te bereiken.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.4
    text: 'De exploitatieberekening, bedoeld in het tweede lid, onderdeel b, omvat:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.4.a
    text: een specificatie van de investeringskosten per component van de productie-installatie,
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.4.b
    text: een overzicht van alle kosten en baten van de productie-installatie, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.4.c
    text: |-
      een berekening van het projectrendement over de subsidielooptijd of, indien de aanvraag betrekking heeft op een
      productie-installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee, de
      looptijd van het project.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.5
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee wordt als de aanvrager in de aanvraag dit aangeeft tot het eigen vermogen,
      bedoeld in het tweede lid, onderdeel d, meegerekend:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.5.a
    text: indien de aanvrager een samenwerkingsverband is de eigen vermogens van de deelnemers aan het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.5.b
    text: |-
      indien de subsidie-aanvrager of een deelnemer aan een samenwerkingsverband een dochteronderneming is en de
      moederonderneming daarmee schriftelijk instemt het overige eigen vermogen van de moederonderneming.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2a.6
    text: |-
      Voor de bepaling van de omvang van het eigen vermogen overeenkomstig het vijfde lid, wordt het eigen vermogen
      van een deelnemer aan een samenwerkingsverband of van een moederonderneming meegerekend in het eigen vermogen van
      ten hoogste twee subsidie-aanvragers. Indien het eigen vermogen van dezelfde entiteit op grond van het vijfde lid
      voor de aanvragen van meer dan twee subsidie-aanvragers zou worden meegerekend, wordt dat eigen vermogen bij alle
      aanvragen buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2a
  - number: 2b.1
    text: |-
      In aanvulling op [artikel 2a, tweede lid][ref1], bevat de haalbaarheidsstudie tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel2a
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 2a
        paragraaf: '2'
  - number: 2b.1.a
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit waterkracht, hernieuwbare energie uit biomassa, waterstof uit afval of de vermindering van broeikasgas een
      energie- of productopbrengstberekening;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.b
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbaar gas met een
      aansluiting met een doorlaatwaarde groter dan 40m3(n) per uur een verklaring met prijsindicatie van de netbeheerder
      voor het invoeden van hernieuwbaar gas;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.c
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare of
      koolstofdioxide-arme warmte een onderbouwing van de warmteafzet en, indien sprake is van levering van warmte aan
      derden, een verklaring van de intentie van afname door die derden;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.d
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare of
      koolstofdioxide-arme warmte door middel van geothermie een geologisch rapport;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.e
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.e.1°
    text: een windenergie-opbrengstberekening, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.e.2°
    text: |-
      informatie die aannemelijk maakt dat tijdig zal zijn voldaan aan
      [artikel 7.34, tweede lid, onder c, van het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel7
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '7'
  - number: 2b.1.f
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie, niet zijnde windenergie op zee, met een vermogen van ten minste 100 kW een
      windenergie-opbrengstberekening;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.g
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie met een vermogen groter dan of gelijk aan 1 MWp door middel van zonnepanelen met een
      zonvolgsysteem, een zonne-energieopbrengstberekening;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.h
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit,
      hernieuwbare warmte of koolstofdioxide-arme warmte uit zonne-energie, een gedetailleerde tekening op schaal van de
      locatie van de productie-installatie waarop de zonnepanelen of zonnecollectoren nauwkeurig zijn ingetekend;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.i
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de benutting van restwarmte een kaart waarop
      het tracé van de transportleiding is ingetekend;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.j
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en de permanente opslag van
      koolstofdioxide een rapport over de infrastructuur voor transport en de opslag;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.k
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en het gebruik van koolstofdioxide
      een onderbouwing van de koolstofdioxide-afzet;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.l
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie met hoogtebeperking, een onderbouwing dat er op de locatie van de productie-installatie
      sprake is van een hoogterestrictie waardoor de tiphoogte van de windturbine beperkt is tot 150 meter of lager;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.m
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van waterstof, waarbij sprake is
      van levering van waterstof aan derden, een verklaring van de intentie van afname door die derden;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.1.n
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of koolstofdioxide-arme warmte uit zonne-energie, anders dan zonthermie
      voor warmte met toepassing in een daglichtkas, waarbij sprake is van plaatsing op daken of bevestiging
      aan gevels, een verklaring van een constructeur over de belastbaarheid van het dak of de gevel volgens het
      [Besluit bouwwerken leefomgeving][ref1] met gebruikmaking van het middel dat door de minister beschikbaar wordt
      gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0041297
  - number: 2b.1.o
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, waarbij het dak van een bestaand gebouw constructief wordt aangepast of een draagconstructie
      wordt toegepast die het dak ontlast en waarbij deze constructieve aanpassing noodzakelijk is voor de realisatie
      van de productie-installatie, danwel bij het gebruik van het dak van een bestaand gebouw gebruik wordt gemaakt
      van een productie-installatie met een maximaal gewicht van 10 kilogram per vierkante meter bedekt dakoppervlak,
      een verklaring van een constructeur over de belastbaarheid van het dak of de gevel volgens de normen van het
      [Besluit bouwwerken leefomgeving][ref1] met gebruikmaking van het middel dat door de minister beschikbaar wordt
      gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0041297
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0041297
  - number: 2b.1.p
    text: |-
      indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare warmte,
      hernieuwbare elektriciteit en hernieuwbare warmte of koolstofdioxide-arme warmte, waarbij sprake is van een melding
      als bedoeld in [artikel 12b, eerste lid, van de Warmtewet][ref1], een kopie van deze melding.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12b
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12b
  - number: 2b.2
    text: |-
      Het geologisch rapport, bedoeld in het eerste lid, onderdeel d, voldoet aan het model ‘Specificaties geologisch
      onderzoek voor geothermieprojecten - rapportagevereisten SDE+ en RNES’ van 18 april 2017 van TNO zoals gepubliceerd
      op de website van de Rijksdienst voor Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.3
    text: |-
      De windenergie-opbrengstberekening, bedoeld in het eerste lid, onderdelen e en f, is opgesteld door een
      organisatie met expertise op het gebied van windenergie-opbrengstberekeningen, met gebruikmaking van gerenommeerde
      rekenmodellen, omgevingsmodellen, windmodellen en windkaarten en bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.3.a
    text: de locatiegegevens van het windpark;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.3.b
    text: |-
      de technische specificaties waaronder merk, type, ashoogte, rotordiameter en vermogenscurve van de beoogde
      windturbines;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.3.c
    text: de lokale windgegevens voor het windpark, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.3.d
    text: een berekening van de P50-waarde voor de netto elektriciteitsproductie op jaarbasis van het windpark.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.4
    text: |-
      Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, zijn voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, en terugregelverliezen opgenomen en is de organisatie met expertise op het
      gebied van windenergie-opbrengstberekeningen, bedoeld in het derde lid, onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.5
    text: |-
      Bij de berekening van de P50-waarde, bedoeld in het derde lid, onderdeel d, wordt voor wat betreft de productie-
      installatie voor de productie van hernieuwbare elektriciteit door middel van windenergie, niet zijnde windenergie
      op zee, voor de windenergie-opbrengstberekening per windturbinelocatie op de beoogde ashoogte de beschikbaarheid,
      zogeffecten, elektriciteitsverliezen, eigen consumptie, turbinerendement, terugregelverliezen en een berekende
      windsnelheid opgenomen, waarbij de berekende windsnelheid:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.5.a
    text: |-
      gebaseerd is op de omgevingseffecten en lokale windgegevens voor de windturbinelocatie over een aaneengesloten
      periode van minimaal 10 jaar; en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.5.b
    text: niet hoger is dan de gemiddelde windsnelheid volgens een middel dat door de minister ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6
    text: |-
      De zonne-energieopbrengstberekening, bedoeld in het eerste lid, onderdeel g, is gebaseerd op een gemiddelde
      jaarlijkse instraling op een horizontaal vlak van ten hoogste 1.000 kWh per m2 en bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6.a
    text: technische specificaties van de zonnepanelen, waaronder minimaal het piekvermogen en het aantal panelen;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6.b
    text: |-
      technische specificaties van het automatische zonvolgsysteem, waaronder minimaal een beschrijving of verstelling
      van de hellingshoek, verstelling in oost-westoriëntatie of verstelling van de hellingshoek en verstelling in oost-
      westoriëntatie van de zonnepanelen wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6.c
    text: het totale vermogen van omvormers en het aansluitvermogen van de netaansluiting;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6.d
    text: verliezen ten gevolge van reflectie, schaduwwerking, vervuiling en degradatie van de zonnepanelen; en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.6.e
    text: |-
      een berekening van gemiddelde netto elektriciteitsproductie op jaarbasis, rekening houdend met de verliezen,
      bedoeld in onderdeel d, over een periode van 15 jaar van het zonne-energiesysteem.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2b.7
    text: |-
      Het rapport over de infrastructuur voor transport en opslag, bedoeld in het eerste lid, onderdeel j, voldoet aan
      het model ‘Vereiste informatie transport- en opslagverklaring’, gepubliceerd op de website van de Rijksdienst voor
      Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2b
  - number: 2c
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      door middel van windenergie op zee worden bij de aanvraag tevens de volgende gegevens toegevoegd:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2c
  - number: 2c.a
    text: |-
      indien de aanvrager een samenwerkingsverband betreft een door elke deelnemer ondertekende verklaring van deelname
      aan het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2c
  - number: 2c.b
    text: |-
      de meest recent vastgestelde jaarrekening van de aanvrager, diens moederonderneming, de deelnemers aan het
      samenwerkingsverband of hun moederondernemingen waarbij de jaarrekening betrekking heeft op een jaar dat ten
      hoogste drie kalenderjaren voor het jaar waarin de aanvraag wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2c
  - number: 2c.c
    text: |-
      de bescheiden waarmee voldoende aannemelijk wordt gemaakt dat aan het van toepassing zijnde kavelbesluit wordt
      voldaan, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2c
  - number: 2c.d
    text: |-
      het projectplan waaruit de voornemens van de aanvrager blijken inzake de wijze waarop en de partijen waardoor de
      productie-installatie wordt gerealiseerd en geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2c
  - number: 2d.1
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie op een locatie waarbij de subsidieaanvrager niet
      de eigenaar van de locatie is, gaat de aanvraag vergezeld van:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.1.a
    text: |-
      de toestemming van de eigenaar of eigenaren dat de desbetreffende productie-installatie op desbetreffende locatie
      wordt gevestigd met gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.1.b
    text: |-
      een gedoogplichtbeschikking op grond van [artikel 10.21, eerste lid, van de Omgevingswet][ref1] met betrekking tot
      de desbetreffende locatie voor het vestigen van de desbetreffende productie-installatie;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel10
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '10'
  - number: 2d.1.c
    text: |-
      een afgesloten voorovereenkomst of grondovereenkomst met het Rijksvastgoedbedrijf met betrekking tot de
      desbetreffende locatie voor het vestigen van de desbetreffende productie-installatie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.2
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, waterkracht of windenergie, of een productie-installatie waarbij sprake is van gecombineerde
      opwekking van hernieuwbare elektriciteit en hernieuwbare warmte uit biomassavergisting die wordt aangesloten op een
      elektriciteitsnet met een aansluiting met een totale doorlaatwaarde van meer dan 3*80 A, gaat de aanvraag vergezeld
      van de verklaring van de netbeheerder over de beschikbaarheid van transportcapaciteit voor de nauwkeurig omschreven
      productie-installatie met gebruikmaking van het middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien de aanvraag betrekking heeft op een productie-installatie
      voor de productie van hernieuwbare elektriciteit door middel van windenergie op zee.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.4
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide gaat de aanvraag vergezeld van de verklaring of de verklaringen over de beschikbaarheid van
      transport- en opslagcapaciteit van de partij of partijen die het transport of de permanente opslag van de
      koolstofdioxide uitvoeren met betrekking tot de desbetreffende productie-installatie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: 2d.5
    text: |-
      Indien de aanvraag betrekking heeft op een productie-installatie voor de productie van hernieuwbare elektriciteit
      uit zonne-energie, gaat de aanvraag vergezeld van toestemming van de aanvrager op het delen van informatie tussen
      de netbeheerder en de minister over het bij de netbeheerder gecontracteerde terugleververmogen en de ean-code van
      de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel2d
  - number: '3.1'
    text: |-
      De subsidie-ontvanger verstrekt de opdrachten voor de levering van onderdelen voor de bouw van de productie-
      installatie binnen 18 maanden na de datum van inwerkingtreding van de beschikking tot subsidieverlening en zendt
      een afschrift aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De subsidie-ontvanger rapporteert na de datum van de beschikking tot subsidieverlening tot het
      moment van ingebruikname jaarlijks over de voortgang van de realisatie van het op grond van
      [artikel 56, vierde lid, onderdeel f, van het besluit][ref1] in de aanvraag opgenomen tijdschema.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel56
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '56'
  - number: '3.3'
    text: |-
      De subsidie-ontvanger zendt de minister binnen een jaar na de datum van ingebruikname van de productie-installatie
      of op verzoek van de minister een overzicht van de daadwerkelijke investeringskosten, van de overige kosten en
      baten gedurende de exploitatie, van de reeds ontvangen subsidies en overige steun en van de nog te ontvangen
      subsidies en overige steun. Het overzicht wordt gezonden met gebruikmaking van een middel dat door de minister
      beschikbaar wordt gesteld. Indien de verleende subsidie meer bedraagt dan € 125.000, gaat het overzicht vergezeld
      van een verklaring van een accountant als bedoeld in [artikel 1 van de Wet op het accountantsberoep][ref1]. De
      verklaring wordt opgesteld met gebruikmaking van een controleprotocol dat door de minister ter beschikking wordt
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
  - number: '3.4'
    text: |-
      De minister kan de termijn, bedoeld in het derde lid, op verzoek van de subsidie-ontvanger eenmalig verlengen met
      ten minste zes weken.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.5'
    text: |-
      De subsidie-ontvanger meldt iedere wijziging van reeds ontvangen subsidies en overige steun en van de nog te
      ontvangen subsidies en overige steun aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.6'
    text: |-
      Het eerste lid is niet van toepassing op de ontvanger van subsidie voor een productie-installatie voor de productie
      van hernieuwbare elektriciteit door middel van windenergie op zee.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.7'
    text: |-
      Het derde lid is niet van toepassing indien de subsidie-ontvanger geen andere subsidie heeft ontvangen dan die op
      grond van het besluit en geen andere overige steun, met uitzondering van het financieel voordeel dat is behaald op
      grond van de [Regeling groenprojecten 2016][ref1] of de [Regeling groenprojecten 2022][ref2], tenzij sprake is van:


      [ref1]: https://wetten.overheid.nl/BWBR0037778
      [ref2]: https://wetten.overheid.nl/BWBR0046599
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037778
      - id: ref2
        bwb_id: BWBR0046599
  - number: 3.7.a
    text: |-
      een productie-installatie voor restwarmte, de productie van koolstofdioxide-arme warmte met een elektroboiler,
      een procesgeïntegreerde warmtepomp in een verdampingsproces of een industriële warmtepomp met 3.000 vollasturen,
      waterstof, de afvang en permanente opslag van koolstofdioxide of de afvang en het gebruik van koolstofdioxide of de
      productie van hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte door middel van thermische
      conversie van vaste of vloeibare biomassa waarvoor via verlengde levensduur opnieuw subsidie is gegeven;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: 3.7.b
    text: |-
      een productie-installatie met een nominaal vermogen gelijk aan of groter dan 1 MW voor de productie van
      hernieuwbaar gas uit biomassa, de productie van hernieuwbare warmte uit biomassa, de gecombineerde opwekking
      van hernieuwbare elektriciteit en hernieuwbare warmte uit biomassa of de productie van geavanceerde hernieuwbare
      brandstof, indien er indicaties zijn dat de marktprijs voor biomassa waarvan de minister is uitgegaan bij het
      vaststellen van het basisbedrag meer dan 15% op jaarbasis is gedaald.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.8'
    text: |-
      De productie-installatie wordt in stand gehouden in Nederland of binnen de Nederlandse exclusieve economische zone,
      met dien verstande dat in het geval het subsidieverlening betreft voor een productie-installatie voor de afvang en
      de permanente opslag van koolstofdioxide het ondergrondse opslagvoorkomen voor koolstofdioxide zich ook daarbuiten
      binnen de Europese Unie mag bevinden of in een land dat lid is van de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.9'
    text: |-
      In afwijking van het eerste lid verstrekt de subsidie-ontvanger de opdrachten voor de levering van onderdelen
      voor de bouw van de productie-installatie voor de productie van hernieuwbare warmte of koolstofdioxide-warmte
      door middel van geothermie, voor de afvang en permanente opslag van koolstofdioxide of voor de afvang, niet zijnde
      uit omgevingslucht, en het gebruik van koolstofdioxide binnen 36 maanden na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening en zendt deze een afschrift aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '3.10'
    text: |-
      Indien sprake is van een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide of voor de afvang, niet zijnde uit omgevingslucht, en het gebruik van
      koolstofdioxide, gaat het afschrift, bedoeld in het negende lid, vergezeld van vergunningen
      die noodzakelijk zijn voor de realisatie van de productie-installatie, met uitzondering van de
      vergunningen die op grond van [artikel 5.1, tweede lid, onderdeel b, van de Omgevingswet][ref1] en
      [artikel 25, eerst lid, van de Mijnbouwwet][ref2] en de [Omgevingswet][ref3] vereist zijn voor de realisatie van
      het ondergrondse opslagvoorkomen voor koolstofdioxide, voor zover de aanvraag om subsidieverlening niet vergezeld
      ging van deze vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0037885
  - number: '3.11'
    text: |-
      In afwijking van het zevende lid, aanhef en onderdeel b, is het derde lid niet van toepassing indien het een
      productie-installatie als bedoeld in dat onderdeel betreft met een nominaal vermogen kleiner dan 6 MW en de
      productie-installatie volledig in eigendom is van een kleine of middelgrote onderneming als bedoeld in artikel 2,
      van [Verordening (EU) nr. 651/2014](32014R0651) van de Commissie van 17 juni 2014 waarbij bepaalde categorieën
      steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt verenigbaar worden verklaard (PbEU
      2014, L 187) of van een hernieuwbare energie-gemeenschap als bedoeld in artikel 2, punt 16, van [richtlijn (EU)
      2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      De subsidie-ontvanger meet de productie van elektriciteit, warmte, gas, waterstof of geavanceerde hernieuwbare
      brandstof, dan wel de vermindering van koolstofdioxide per beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      De minister kan ontheffing verlenen van de verplichting, bedoeld in het eerste lid, indien de beschikking
      betrekking heeft op een productie-installatie:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel4
  - number: 4.2.a
    text: |-
      die is zijn aangewezen onder [artikel 3, tweede lid, onderdeel a, van het besluit][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '3'
  - number: 4.2.b
    text: die in capaciteit wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel4
  - number: '4.3'
    text: Aan de ontheffing kunnen voorwaarden en voorschriften verbonden worden.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      De subsidie-ontvanger verstrekt de minister op aanvraag gegevens over de verkoopprijs van de met de gesubsidieerde
      productie samenhangende garanties van oorsprong.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      De verklaring, bedoeld in [artikel 63b, eerste lid, van het besluit](onbekend) komt overeen met de gegevens die
      zijn geregistreerd bij de Nederlandse Emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      Dit artikel is van toepassing op een subsidieontvanger die een productie-installatie bedrijft waarvoor subsidie
      wordt verstrekt onder de voorwaarde dat de subsidieontvanger aantoont dat de gebruikte biomassa voldoet aan de
      duurzaamheidscriteria en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van [richtlijn (EU)
      2018/2001](32018L2001).
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een subsidieontvanger maakt gebruik van biomassa die per biomassalevering vergezeld gaat van de benodigde
      conformiteitsbeoordelingsverklaringen, afgegeven op grond van een certificatieschema waarvan de Europese Commissie
      op grond van artikel 30, vierde lid, van [richtlijn (EU) 2018/2001](32018L2001) heeft besloten dat deze accurate
      gegevens verschaft met het oog op de toepassing van artikel 29 van [richtlijn (EU) 2018/2001](32018L2001) of
      op grond van een nationaal systeem, waarvan de Europese Commissie op grond van artikel 30, zesde lid, van de
      [richtlijn (EU) 2018/2001](32018L2001) heeft besloten dat dit voldoet aan de in die richtlijn bepaalde voorwaarden,
      afhankelijk van de van toepassing zijnde criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt voor een subsidie-ontvanger met een beschikking tot
      subsidieverlening die is afgegeven op een aanvraag om subsidieverlening die is ontvangen voor inwerkingtreding
      van de [Regeling aanwijzing categorieën duurzame energieproductie en klimaattransitie 2023][ref1], uitgegaan van
      [richtlijn (EU) 2018/2001](32018L2001), naar de tekst zoals deze bij die richtlijn is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0048477
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048477
  - number: '6.4'
    text: |-
      In afwijking van het tweede lid kan een subsidieontvanger voor biomassa als bedoeld in de nummers 170 tot en met
      179, 300 tot en met 329 en 410 van NTA 8003:2017 gebruik maken van biomassa die per biomassalevering vergezeld gaat
      van de benodigde conformiteitsbeoordelingsverklaringen afgegeven op grond van het verificatieprotocol, bedoeld in
      [artikel 7ba, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7ba
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 7ba
        paragraaf: '3'
  - number: '6.5'
    text: |-
      De subsidieontvanger zendt binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot wordt
      verstrekt aan de minister een jaarlijkse conformiteitsbeoordelingsverklaring afgegeven op grond van het
      verificatieprotocol, bedoeld in [artikel 7ba, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7ba
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 7ba
        paragraaf: '3'
  - number: '7.1'
    text: |-
      Dit artikel is van toepassing op een subsidieontvanger die een daartoe bij een voor 1 januari 2023 in de
      Staatscourant gepubliceerde openstellingsregeling aangewezen categorie productie-installatie bedrijft:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: 7.1.a
    text: voor de productie van stoom door middel van verbranding van houtpellets in een ketel;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: 7.1.b
    text: |-
      waarin vaste of gasvormige biomassa wordt omgezet in hernieuwbare elektriciteit of hernieuwbare elektriciteit en
      hernieuwbare warmte;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: 7.1.c
    text: voor de productie van elektriciteit door middel van kolen waarin biomassa mee wordt gestookt, of
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: 7.1.d
    text: |-
      voor de productie van hernieuwbare warmte, of hernieuwbare elektriciteit en hernieuwbare warmte door middel van
      verbranding van houtpellets met een brander in een ketel, een oven of een fornuis.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een subsidieontvanger maakt gebruik van vaste biomassa die per biomassalevering vergezeld gaat van de
      benodigde conformiteitsbeoordelingsverklaringen afgegeven op grond van een certificatieschema, bedoeld
      in [artikel 10 van het Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1],
      of op grond van het verificatieprotocol, bedoeld in
      [artikel 4 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref2],
      afhankelijk van de van toepassing zijnde duurzaamheidseisen, bedoeld in
      [artikel 2 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref3], en ten aanzien
      van elke aard van vaste biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0040431#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0040431#Artikel2
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0040431
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0040431
        artikel: '2'
  - number: '7.3'
    text: |-
      Van de totale massa houtige biomassa uit bosbeheereenheden die in een kalenderjaar voor subsidie in aanmerking
      komt, hoeft ten hoogste 30% te voldoen aan de duurzaamheidscriteria en broeikasgasemissiereductiecriteria, bedoeld
      in artikel 29, eerste lid, van [richtlijn (EU) 2018/2001](32018L2001), waarbij voor een subsidie-ontvanger met
      een beschikking tot subsidieverlening die is afgegeven op een aanvraag om subsidieverlening die is ontvangen voor
      inwerkingtreding van de Regeling aanwijzing categorieën duurzame energieproductie en klimaattransitie 2023, wordt
      uitgegaan van [richtlijn (EU) 2018/2001](32018L2001), naar de tekst zoals deze bij die richtlijn is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het tweede lid geldt voor een subsidieontvanger die een productie-installatie bedrijft met een
      totaal nominaal thermisch ingangsvermogen kleiner dan 7,5 MW, het bepaalde in eis 1.1b, tweede en derde volzin, van
      [bijlage B van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1], niet.


      [ref1]: https://wetten.overheid.nl/BWBR0040431
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040431
  - number: 7b.1
    text: |-
      De subsidie-ontvanger die een productie-installatie bedrijft, bedoeld in [artikel 7, eerste lid][ref1], zendt
      binnen vier maanden na afloop van ieder kalenderjaar waarover een voorschot wordt verstrekt aan de minister een
      verklaring waaruit blijkt dat de gebruikte biomassa aan artikel 7 voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '7'
        paragraaf: '3'
  - number: 7b.2
    text: |-
      De verklaring is een jaarlijkse conformiteitsbeoordelingsverklaring afgegeven op grond van het verificatieprotocol,
      bedoeld in [artikel 4 van de Regeling conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040431#Artikel4
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0040431
        artikel: '4'
  - number: 7b.3
    text: |-
      De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid die kleiner is dan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op regionaal niveau
      of op het niveau van de bosbeheereenheid aan dat aan de duurzaamheidseisen is voldaan, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.3.a
    text: |-
      de laatste twee jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een productie-
      installatie bedrijft die in 2015 of 2016 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van de
      bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.3.b
    text: |-
      de laatste drie jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een productie-
      installatie bedrijft die in 2017 of 2018 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van de
      bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.3.c
    text: |-
      de laatste vier jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een productie-
      installatie bedrijft die in 2019 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van de
      bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.3.d
    text: |-
      de laatste vijf jaar van de periode waarover subsidie wordt verstrekt aan een subsidie-ontvanger die een productie-
      installatie bedrijft die in 2020 in gebruik of opnieuw in gebruik is genomen, waarvoor op het niveau van de
      bosbeheereenheid wordt aangetoond dat aan de duurzaamheidseisen is voldaan,
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.3.e
    text: |-
      een subsidie-ontvanger die een productie-installatie bedrijft die na 2020 in gebruik of opnieuw in gebruik is
      genomen, waarvoor voor de gehele subsidieperiode op het niveau van de bosbeheereenheid wordt aangetoond dat aan de
      duurzaamheidseisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7b.4
    text: |-
      De subsidie-ontvanger toont voor het deel van de rapportage betreffende houtige biomassa afkomstig uit een
      bosbeheereenheid groter dan of gelijk aan 500 hectare dat betrekking heeft op het duurzaam bosbeheer op het niveau
      van de bosbeheereenheid aan dat aan de duurzaamheidseisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7b
  - number: 7ba.1
    text: |-
      Het verificatieprotocol, bedoeld in [artikel 63a, vijfde lid, van het besluit][ref1] is het verificatieprotocol
      dat op de website van Rijksdienst voor Ondernemend Nederland geplaatst is onder de naam Verificatieprotocol
      duurzaamheid biomassa – Aantonen van REDII-duurzaamheid voor SDE en EU-ETS.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel63a
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7ba
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: 63a
  - number: 7ba.2
    text: |-
      [Artikel 14 van het Besluit conformiteitsbeoordeling vaste biomassa voor energietoepassingen][ref1] is van
      toepassing op het verificatieprotocol in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040209#Artikel14
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7ba
    references:
      - id: ref1
        bwb_id: BWBR0040209
        artikel: '14'
  - number: 7bb
    text: |-
      De inspecteurs van de Nederlandse emissieautoriteit worden aangewezen als ambtenaren, belast met het toezicht op de
      naleving, bedoeld in [artikel 71a van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel71a
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7bb
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: 71a
  - number: 7c
    text: |-
      De subsidieontvanger die een productie-installatie bedrijft waarmee hernieuwbare warmte, hernieuwbare
      elektriciteit, hernieuwbare elektriciteit en hernieuwbare warmte, hernieuwbaar gas of geavanceerde hernieuwbare
      brandstof wordt geproduceerd door middel van vergisting en co-vergisting van dierlijke meststoffen:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
  - number: 7c.a
    text: |-
      voldoet aan de [artikelen 33][ref1] en [39 van het Uitvoeringsbesluit Meststoffenwet][ref2]
      en de [artikelen 38, vierde lid][ref3], [40, tweede lid][ref4], [46, achtste lid][ref5], en
      [47, eerste lid, van de Uitvoeringsregeling Meststoffenwet][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0018989#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0018989#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0018989#Artikel47
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0018989
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0018989
        artikel: '40'
      - id: ref5
        bwb_id: BWBR0018989
        artikel: '46'
      - id: ref6
        bwb_id: BWBR0018989
        artikel: '47'
  - number: 7c.b
    text: |-
      produceert slechts product dat beantwoordt aan
      [Bijlage Aa, onderdeel IV, categorie 1 van de Uitvoeringsregeling Meststoffenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0018989
  - number: 7c.c
    text: |-
      gebruikt slechts coproducten, genoemd in [Bijlage Aa, onderdeel IV, van de Uitvoeringsregeling Meststoffenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0018989
  - number: 7c.d
    text: |-
      voldoet bij gebruik van coproducten, genoemd in
      [Bijlage Aa, onderdeel IV, categorie 1, onder G, van de Uitvoeringsregeling Meststoffenwet][ref1] aan de eisen
      bedoeld in [bijlage II, tabel 1, en tabel 4, van het Uitvoeringsbesluit Meststoffenwet][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0019031
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0018989
      - id: ref2
        bwb_id: BWBR0019031
  - number: 7c.e
    text: |-
      gebruikt bij nakoming van
      __REF000___________________________________________________________________________________________________________
      _________ dezelfde benamingen en coderingen, genoemd in
      [Bijlage Aa van de Uitvoeringsregeling Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0018989
  - number: 7d.1
    text: |-
      Een subsidie-ontvanger dient bij het meetbedrijf met gebruikmaking van het formulier, bedoeld in bijlage 8, een
      verzoek in om een oordeel omtrent de geschiktheid van diens productie-installatie voor:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.a
    text: de opwekking van koolstofdioxide-arme warmte;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.b
    text: de afvang en permanente opslag van koolstofdioxide;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.c
    text: de afvang en het gebruik van koolstofdioxide;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.d
    text: de productie van waterstof uit afval;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.e
    text: |-
      de productie van waterstof door middel van elektrolyse die met een aansluiting is gekoppeld aan het
      elektriciteitsnet, voor wat betreft subsidieaanvragen die door de subsidie-ontvanger tot 10 september 2024 zijn
      ingediend;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.1.f
    text: de productie van geavanceerde hernieuwbare brandstof.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.2
    text: |-
      Een oordeel omtrent de geschiktheid is vijf jaar geldig of tot het moment waarop de subsidie-ontvanger een
      aanpassing heeft doorgevoerd in zijn productie-installatie die een wijziging van een van de gegevens, vermeld
      in het verzoek, bedoeld in het eerste lid, ten gevolge heeft. Een subsidie-ontvanger verricht een nieuw verzoek,
      bedoeld in het eerste lid, voordat de geldigheidsduur van het oordeel is verlopen.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.3
    text: |-
      De subsidie-ontvanger bepaalt in het verzoek, bedoeld in het eerste lid, de systeemgrens van iedere productie-
      installatie, waarvoor subsidie is aangevraagd, op dusdanige wijze dat de subsidiabele productie kan worden gemeten.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.4
    text: |-
      Een wijziging van de systeemgrens van een productie-installatie leidt er niet toe dat één of meer productie-
      eenheden van de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.5
    text: |-
      De subsidie-ontvanger stelt het meetbedrijf in staat het onderzoek te verrichten ten behoeve van de beoordeling van
      de geschiktheid.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.6
    text: |-
      De minister verstrekt het eerste voorschot aan een subsidie-ontvanger niet eerder dan nadat de subsidie-ontvanger
      het oordeel omtrent de geschiktheid overlegt of doet overleggen aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7d.7
    text: |-
      De minister verstrekt uitsluitend een voorschot indien een subsidie-ontvanger over een geldig oordeel omtrent de
      geschiktheid beschikt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7d
  - number: 7e.1
    text: |-
      Een subsidie-ontvanger stelt een meetprotocol op met inachtneming van de meetvoorwaarden voor koolstofdioxide-
      arme warmte, voor waterstof, voor koolstofdioxide en voor geavanceerde hernieuwbare brandstof, genoemd in
      [bijlage 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7e.2
    text: De subsidie-ontvanger laat het meetprotocol beoordelen door een meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7e
  - number: 7e.3
    text: |-
      Het meetprotocol heeft een geldigheid van vijf jaar of tot het moment dat de subsidie-ontvanger een aanpassing van
      de productie-installatie of het productieproces doorvoert die een wijziging van het meetprotocol tot gevolg heeft.
      De subsidie-ontvanger stelt voorafgaand aan het verlopen van de geldigheidsduur een nieuw meetprotocol op.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7e
  - number: 7e.4
    text: |-
      De minister verstrekt het eerste voorschot aan een subsidie-ontvanger niet eerder dan nadat de subsidie-ontvanger
      het beoordeelde meetprotocol overlegt of doet overleggen aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7e
  - number: 7e.5
    text: |-
      De minister verstrekt uitsluitend een voorschot indien een subsidie-ontvanger over een geldig meetprotocol
      beschikt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7e
  - number: 7f.1
    text: |-
      De subsidie-ontvanger draagt er zorg voor dat alle energie- of productiestromen die zijn omschreven in de
      meetvoorwaarden, bedoeld in [bijlage 9][ref1] en die de systeemgrens passeren, worden gemeten in overeenstemming
      met het meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7f
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7f.2
    text: De minister kan het meetbedrijf verzoeken afwijkingen van het meetprotocol te melden aan de minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7f
  - number: 7g.1
    text: 'De subsidie-ontvanger stelt elke kalendermaand een meetrapport op met inachtneming van het meetprotocol dat:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7g
  - number: 7g.1.a
    text: de wijze van totstandkoming van de meetgegevens beschrijft, en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7g
  - number: 7g.1.b
    text: |-
      geverifieerd wordt door een meetbedrijf, waarbij het desbetreffende meetbedrijf ten minste de meetgegevens en het
      gerealiseerde energetische rendement ten opzichte van de geproduceerde energie bevestigt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7g
  - number: 7g.2
    text: |-
      Het meetrapport bevat voor een productie-installatie voor waterstof uit elektrolyse met een aansluiting op het
      elektriciteitsnet de meetgegevens van de in- en uitgaande energiestromen van het elektrolyseproces en het aantal
      productie-uren.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7g
  - number: 7g.3
    text: |-
      Het meetrapport bevat voor een productie-installatie voor de productie van koolstofdioxide-arme warmte met een
      elektroboiler voor warmte het aantal productie-uren.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7g
  - number: 7h.1
    text: |-
      Een subsidie-ontvanger draagt er zorg voor dat het meetrapport uiterlijk 20 dagen na afloop van de kalendermaand
      waarop het meetrapport betrekking heeft, wordt overgedragen aan de Minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7h
  - number: 7h.2
    text: |-
      De minister stelt na ontvangst van het meetrapport op verzoek van een subsidie-ontvanger die een productie-
      installatie voor de productie van koolstofdioxide-arme warmte in stand houdt de nuttig aangewende koolstofdioxide-
      arme warmte in MWh vast.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7h
  - number: 7h.3
    text: |-
      Indien de subsidie-ontvanger die een productie-installatie voor de productie van koolstofdioxide-arme warmte
      in stand houdt, gebruik maakt van warmte afkomstig van een andere bron, draagt de subsidie-ontvanger er zorg
      voor dat het meetbedrijf de hoeveelheid gebruikte warmte in mindering brengt op de hoeveelheid geproduceerde
      koolstofdioxide-arme warmte.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7h
  - number: 7i.1
    text: |-
      Bij een productie-installatie voor restwarmte zonder warmtepompsysteem, wordt de productie gemeten bij de uitgang
      van het warmteoverdrachtsstation.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7i
  - number: 7i.2
    text: |-
      Bij een productie-installatie voor restwarmtebenutting met een warmtepomp wordt de productie gemeten bij de uitgang
      van de warmtepomp.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7i
  - number: 7i.3
    text: |-
      Bij een productie-installatie voor de productie van koolstofdioxide-arme warmte geproduceerd door een productie-
      installatie voor de productie van warmte waarbij warmte wordt hergebruikt in een op het moment van de aanvraag
      bestaand verdampingsproces wordt de productie gemeten met een meting van de ingaande elektriciteit, waarna deze met
      een factor 3,0 in kWhth wordt omgezet.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7i
  - number: 7k.1
    text: |-
      Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en permanent opslaat of gebruikt, waarbij gebruik wordt gemaakt van gasvormig transport van koolstofdioxide en van
      een basisinfrastructuur voor koolstofdioxide.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7k.2
    text: |-
      De subsidie-ontvanger meet elke kalendermaand de hoeveelheid koolstofdioxide die wordt ingevoed in de
      basisinfrastructuur voor koolstofdioxide volgens de meetvoorwaarden, opgenomen in [bijlage 9][ref1], en draagt er
      zorg voor dat deze uiterlijk twintig dagen na afloop van de kalendermaand aan de Minister wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7k.3
    text: |-
      De meting, bedoeld in het tweede lid, wordt gedaan op de grens tussen de productie-installatie en de gedeelde
      voorzieningen van de basisinfrastructuur voor koolstofdioxide.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7k.4
    text: |-
      De subsidie-ontvanger draagt er zorg voor dat de meting, bedoeld in het tweede lid, plaatsvindt bij alle productie-
      installaties die aangesloten zijn op de basisinfrastructuur voor koolstofdioxide.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7k.5
    text: |-
      Indien de subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt en permanent opslaat, stelt de
      Minister de hoeveelheid koolstofdioxide die voor subsidie in aanmerking komt per productie-installatie vast door
      de hoeveelheid koolstofdioxide die in de basisinfrastructuur voor koolstofdioxide permanent wordt opgeslagen te
      verdelen naar rato van de geleverde koolstofdioxide, uitgedrukt in 1.000 kg koolstofdioxide, over de productie-
      installaties die aangesloten zijn op de desbetreffende basisinfrastructuur voor koolstofdioxide.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7k.6
    text: |-
      Indien er sprake is van meerdere productie-installaties met één aansluiting op een basisinfrastructuur voor
      koolstofdioxide en van meerdere subsidie-ontvangers wijzen de subsidie-ontvangers voor de meting, bedoeld in het
      tweede lid, tezamen één meetbedrijf aan.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7k.7
    text: |-
      Indien een subsidie-ontvanger is aangesloten op een basisinfrastructuur voor koolstofdioxide waar zowel productie-
      installaties voor de afvang en de permanente opslag van koolstofdioxide als productie-installaties voor de
      afvang en het gebruik van koolstofdioxide zijn aangesloten, verstrekt hij uiterlijk tien dagen na afloop van
      de kalendermaand aan het meetbedrijf, bedoeld in het vijfde lid, een overzicht over welk deel van de totale
      hoeveelheid koolstofdioxide permanent is opgeslagen en welk deel van de productie nuttig is aangewend.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7k
  - number: 7l.1
    text: |-
      Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt,
      permanent opslaat, doet opslaan of gebruikt, waarbij gebruik wordt gemaakt van vloeibaar transport.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7l
  - number: 7l.2
    text: |-
      De subsidie-ontvanger overlegt aan de Minister een verificatierapport dat betrekking heeft op het voorgaande
      kalenderjaar, van een verificateur als bedoeld in artikel 3, onderdeel 3, van de Verordening verificatie en
      accreditatie emissiehandel uiterlijk vier maanden na afloop van het kalenderjaar waarop het verificatierapport
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7l
  - number: 7l.3
    text: |-
      Voor het opstellen van het verificatierapport wordt gebruikgemaakt van een door de Minister beschikbaar gesteld
      middel.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7l
  - number: 7l.4
    text: |-
      Indien de subsidie-ontvanger met de productie-installatie koolstofdioxide afvangt en permanent opslaat of
      doet opslaan, blijkt uit het verificatierapport dat de gemeten hoeveelheden koolstofdioxide, beschreven in het
      meetrapport, bedoeld in [artikel 7g][ref1], permanent zijn opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7g
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7l
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 7g
        paragraaf: '3'
  - number: 7l.5
    text: |-
      Indien de subsidie-ontvanger met de productie-installatie koolstofdioxide afvangt en gebruikt, blijkt uit
      het verificatierapport dat de gemeten hoeveelheden koolstofdioxide, beschreven in het meetrapport, bedoeld in
      [artikel 7g][ref1], nuttig zijn aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7g
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7l
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 7g
        paragraaf: '3'
  - number: 7m.1
    text: |-
      Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en permanent opslaat.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7m
  - number: 7m.2
    text: |-
      De subsidie-ontvanger verzekert zich dat de hoeveelheid koolstofdioxide die permanent wordt opgeslagen wordt
      gemeten volgens de meetvoorwaarden, opgenomen in [bijlage 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7m
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: 7m.3
    text: |-
      De subsidie-ontvanger overlegt uiterlijk vier maanden na afloop van het kalenderjaar de meetgegevens van de
      beheerder van de basisinfrastructuur voor koolstofdioxide over de hoeveelheid permanent opgeslagen koolstofdioxide
      aan de Minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7m
  - number: 7m.4
    text: |-
      Indien er sprake is van een vloeibaar transport van koolstofdioxide waarbij koolstofdioxide van meerdere productie-
      installaties wordt gemengd, wijst de subsidie-ontvanger voor de meting, bedoeld in het tweede lid, één meetbedrijf
      aan.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7m
  - number: 7m.5
    text: |-
      Indien er sprake is van een vloeibaar transport van koolstofdioxide, draagt de subsidie-ontvanger er zorg voor
      dat hij beschikt over transportdocumenten, waaruit sluitend de afleverlocatie en de afleverhoeveelheid van het
      transport door hem en derde partijen en de permanente opslag van koolstofdioxide blijkt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7m
  - number: 7n.1
    text: |-
      Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie koolstofdioxide afvangt
      en gebruikt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7n
  - number: 7n.2
    text: De subsidie-ontvanger draagt er zorg voor dat de productie van koolstofdioxide nuttig wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7n
  - number: 7n.3
    text: |-
      De subsidie-ontvanger overlegt uiterlijk vier maanden na afloop van het kalenderjaar de meetgegevens van de
      beheerder van de basisinfrastructuur voor koolstofdioxide over de hoeveelheid nuttig aangewende koolstofdioxide aan
      de Minister.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7n
  - number: 7n.4
    text: |-
      Indien sprake is voor vloeibaar transport van koolstofdioxide, draagt de subsidie-ontvanger er zorg voor dat hij
      beschikt over transportdocumenten, waaruit sluitend de afleverlocatie en de afleverhoeveelheid van het transport
      door haar en derde partijen en de nuttige aanwending van koolstofdioxide blijkt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7n
  - number: 7o.1
    text: |-
      Dit artikel is van toepassing indien een subsidie-ontvanger met een productie-installatie geavanceerde hernieuwbare
      brandstof produceert.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
  - number: 7o.2
    text: |-
      De hoeveelheid geavanceerde hernieuwbare brandstof die voor subsidie in aanmerking komt, wordt bepaald op basis van
      het register hernieuwbare energie vervoer.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
  - number: 7o.3
    text: 'Uiterlijk vier maanden na afloop van het kalenderjaar overlegt de subsidie-ontvanger aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
  - number: 7o.3.a
    text: |-
      de dubbeltellingsverklaringen, bedoeld in [artikel 1 van het Besluit energie vervoer][ref1], behorend bij de
      geproduceerde hoeveelheid geavanceerde hernieuwbare brandstof;


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel1
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '1'
  - number: 7o.3.b
    text: |-
      de gegevens uit het register hernieuwbare energie vervoer, waaruit blijkt welke hoeveelheid geavanceerde
      hernieuwbare brandstof, omschreven in het meetrapport, bedoeld in [artikel 7g][ref1], is geleverd in Nederland aan
      wegvoertuigen of binnenvaartschepen;


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7g
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: 7g
        paragraaf: '3'
  - number: 7o.3.c
    text: |-
      een overzicht waaruit per kalendermaand de hoeveelheid, aard en, in honderdsten van procenten nauwkeurig, de
      verhouding van de in de productie-installatie ingezette grondstoffen blijkt, gerapporteerd volgens de NTA 8003:2017
      met gebruikmaking van het middel dat door de Minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
  - number: 7o.4
    text: |-
      De subsidie-ontvanger mengt de geavanceerde hernieuwbare brandstof die in aanmerking komt voor subsidie, niet met
      andere brandstoffen die niet voor subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7o
  - number: 7p.1
    text: |-
      Dit artikel is van toepassing op subsidie-ontvangers aan wie subsidie is verleend op grond van subsidieaanvragen
      die vanaf 10 september 2024 zijn ingediend voor het produceren met een productie-installatie voor de productie
      van waterstof door middel van elektrolyse die met een aansluiting is gekoppeld aan het elektriciteitsnet en op
      subsidieaanvragen voor het produceren met een productie-installatie van waterstof door middel van elektrolyse die
      met een directe aansluiting op een productie-installatie die elektriciteit produceert met behulp van windenergie of
      een productie-installatie die elektriciteit produceert uit zonlicht door middel van fotovoltaïsche zonnepanelen.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.2
    text: |-
      De subsidieontvanger is vanaf de datum van ingebruikname van de productie installatie tot aan de datum van de
      beschikking tot subsidievaststelling in het bezit van een geldig certificaat dat aantoont dat:
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.2.a
    text: |-
      de waterstofproductie-installatie zodanig is ontworpen en de elektriciteits- en waterstofstromen zodanig worden
      gemeten en geadministreerd dat aantoonbaar volledig hernieuwbare waterstof kan worden geproduceerd;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.2.b
    text: de te produceren waterstof als volledig hernieuwbaar kan worden aangemerkt; en
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.2.c
    text: |-
      indien met de productie-installatie ook waterstof die niet volledig hernieuwbaar is zal worden geproduceerd, de
      broeikasgasemissiereductie van het totaal aan te produceren volledig hernieuwbare waterstof en waterstof die niet
      volledig hernieuwbaar is samen tenminste 70% is.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.3
    text: |-
      Indien door de Europese Commissie twee of meer vrijwillige nationale of internationale systemen voor hernieuwbare
      brandstoffen van niet-biologische oorsprong zijn erkend op basis van artikel 30, vierde lid, van [richtlijn (EU)
      2018/2001](32018L2001), is het certificaat opgesteld met een van deze vrijwillige nationale of internationale
      systemen.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.4
    text: |-
      Indien door de Europese Commissie minder dan twee vrijwillige nationale of internationale systemen voor
      hernieuwbare brandstoffen van niet-biologische oorsprong zijn erkend op basis van artikel 30, vierde lid, van
      [richtlijn (EU) 2018/2001](32018L2001), is het certificaat opgesteld met een erkend vrijwillig nationaal of
      internationaal systeem voor hernieuwbare gasvormige brandstoffen van niet-biologische oorsprong of met een
      vrijwillig nationaal of internationaal systeem voor hernieuwbare brandstoffen van niet-biologische oorsprong dat de
      vaststellingsprocedure door de Europese Commissie, bedoeld in artikel 30, vierde en vijfde lid, van die richtlijn
      doorloopt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.5
    text: |-
      De subsidieontvanger zendt vanaf de datum van ingebruikname van de waterstofproductie-installatie tot aan de
      subsidievaststelling telkens binnen vijf maanden na afloop van ieder kalenderjaar aan de minister een verklaring
      waaruit blijkt dat de geproduceerde volledig hernieuwbare waterstof voldoet aan de eisen die zien op volledige
      hernieuwbaarheid, en dat, indien met de productie-installatie ook waterstof wordt geproduceerd die niet volledig
      hernieuwbaar is, de broeikasgasemissiereductie van het totaal aan geproduceerde volledig hernieuwbare waterstof en
      waterstof die niet volledig hernieuwbaar is tenminste 70% is.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.6
    text: De verklaring wordt overgelegd met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.7
    text: |-
      De verklaring bevat ten minste de informatie, bedoeld in artikel 8 van gedelegeerde [verordening (EU) 2023/1184]
      (32023R1184), over het voorgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.8
    text: |-
      De subsidieontvanger laat de verklaring verifiëren en ondertekenen door de instantie die het certificaat, bedoeld
      in het tweede lid, afgeeft.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: 7p.9
    text: |-
      De subsidieontvanger verstrekt de minister de hernieuwbare stroomafnameovereenkomsten voor wind- of zonne-
      energie voor de elektriciteit die gedurende de eerste vijf jaar zal worden gebruikt voor de productie van volledig
      hernieuwbare waterstof.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel7p
  - number: '8.1'
    text: 'De Minister stelt een voorschot binnen zes maanden na afloop van het kalenderjaar bij aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel8
