    text: |-
      Op een aanvraag om subsidie als bedoeld in [artikel 2 van de Regeling windenergie op zee 2015][ref1] blijft
      [artikel 2][ref2] van deze regeling van toepassing zoals dat luidde op het tijdstip van indienen van die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0036785#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel2
