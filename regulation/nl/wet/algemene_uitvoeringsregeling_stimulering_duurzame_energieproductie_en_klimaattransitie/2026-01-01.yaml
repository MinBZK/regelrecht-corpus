articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *basisinfrastructuur voor koolstofdioxide:* infrastructuur voor het
      transport en de permanente opslag van koolstofdioxide of voor het transport en het gebruik van koolstofdioxide
      die wordt gebruikt door meerdere gebruikers met een productie-installatie voor de afvang en permanente opslag van
      koolstofdioxide of met een subsidie-ontvanger die koolstofdioxide afvangt en gebruikt;
        - *besluit:* [Besluit stimulering duurzame energieproductie en klimaattransitie][ref1];
        - *biomassalevering:* hoeveelheid biomassa die is ingezet voor energieproductie en waarvoor de fysieke en
      duurzaamheidseigenschappen voor de gehele levering gelijk zijn;
        - *bioraffinage:* proces waarbij biomassa wordt gescheiden in verschillende stromen waarbij het hoofdproduct,
      eventueel na verdere verwerking, wordt gebruikt ter verdringing van grondstoffen van fossiele oorsprong en waarbij
      restproducten zoals lignine kunnen ingezet worden voor energietoepassingen;
        - *bosbeheereenheid:* een of meer bospercelen die als één geheel worden beheerd;
        - *ean-code:* uniek 18-cijferig nummer dat dient om een productie-installatie voor de productie van hernieuwbare
      elektriciteit, hernieuwbare warmte of hernieuwbaar gas of een aansluiting van een productie-installatie of een
      productie-eenheid op het net te identificeren;
        - *meetbedrijf:* meetbedrijf als bedoeld in
      [artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref2]
      of [artikel 24a van de Warmtewet][ref3], of meetverantwoordelijke partij als bedoeld in
      [artikel 1.1 van de Energiewet][ref4];
        - *meetprotocol:* document waarin de bemetering van een productie-installatie, de wijze van meten en de wijze
      van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden elektriciteit, gas, warmte, waterstof,
      koolstofdioxide of mechanische energie die de installatie opwekt, de hoeveelheden brandstof die de installatie
      verbruikt en de wijze van bepaling van de calorische waarde van de brandstof beschreven zijn;
        - *meetrapport:* rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat;
        - *milieu- en energiesteunkader:* Richtsnoeren staatssteun ten behoeve van klimaat, milieubescherming en energie
      2022 (PbEU 2022/C 80/010);
        - *minister:* Minister van Klimaat en Groene Groei;
        - *NTA 8003:2017:* de Nederlands Technische Afspraak 8003, Classificatie van biomassa voor energietoepassingen,
      uitgegeven door het Nederlands Normalisatie-Instituut, zoals deze luidde op 30 november 2017;
        - *nuttig aangewende koolstofdioxide:* koolstofdioxide die wordt aangewend voor koolstofdioxidebemesting in
      tuinbouwkassen, voor zover daarmee uitsluitend het gebruik van fossiele brandstoffen voor koolstofdioxidebemesting
      wordt voorkomen;
        - *nuttig aangewende koolstofdioxide-arme warmte:* warmte, uitgedrukt in GJ of MWh, die vrijkomt uit productie-
      installaties voor vermindering van broeikasgas en die, voor zover daarmee de uitstoot van broeikasgas wordt
      voorkomen en die buiten de systeemgrens van de productie-installatie wordt aangewend, wordt aangewend voor:
      a. gebouwklimatisering van de binnenruimten van gebouwen; b. tapwaterverwarming en verwarming van water dat
      wordt ingezet in bedrijfsprocessen, met uitzondering van het gebruik als voedingswater voor een productie-
      installatie waarmee elektriciteit wordt opgewekt; c. verwarming in industriële processen en van tuinbouwkassen, met
      uitzondering van: 1°. de inzet in een turbine of organische rankine cyclus waarmee elektriciteit wordt opgewekt;
      2°. het drogen en verwarmen van inputstromen van een productie-installatie voor het opwekken van elektriciteit,
      inclusief het voorverwarmen van verbrandingslucht; 3°. de inzet voor rookgasreiniging en waterzuivering van een
      productie-installatie; d. klimaatregeling van koelcellen en industriële koelingstoepasssingen; e. levering aan
      een warmtenet, mits de producent aannemelijk kan maken dat de warmte gebruikt wordt voor een van de toepassingen,
      bedoeld onder a tot en met d;
        - *oordeel omtrent de geschiktheid:* op verzoek van een producent door een meetbedrijf afgegeven oordeel dat:
      a. een productie-installatie geschikt is voor de opwekking van koolstofdioxide-arme warmte, de productie van
      waterstof, de afvang en permanente opslag van koolstofdioxide, de afvang en het gebruik van koolstofdioxide of de
      productie van geavanceerde hernieuwbare brandstof; en b. een meetinrichting geschikt is voor de meting van warmte
      die met een productie-installatie wordt opgewekt en nuttig wordt aangewend, van waterstof die met de productie-
      installatie wordt geproduceerd, van koolstofdioxide die met de productie-installatie wordt afgevangen en permanent
      wordt opgeslagen of wordt gebruikt of van geavanceerde hernieuwbare brandstof die met de productie-installatie
      wordt geproduceerd;
        - *P50-waarde voor de netto elektriciteitsproductie:* netto elektriciteitsproductie waarbij de verwachte
      jaarlijkse energieproductie voor een gegeven combinatie van locatie en windturbine dient te zijn bepaald met een
      waarschijnlijkheid van 50%;
        - *productie-eenheid:* deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken van
      hernieuwbare elektriciteit, hernieuwbare warmte of de productie van hernieuwbaar gas;
        - *productie-uren:* som van de tijdsperioden waarin een productie-installatie in deellast of op vol vermogen
      produceert;
        - *register hernieuwbare energie vervoer:* register als bedoeld in [artikel 9.7.5.1 van de Wet milieubeheer][ref5];
        - *richtlijn (EU) 2018/2001:* [richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *systeemgrens van de productie-installatie:* fictieve gesloten omhulling van één of meer productie-eenheden die
      dezelfde wijze van vermindering van broeikasgas toepassen;
        - *Verordening verificatie en accreditatie emissiehandel:* Uitvoerings[verordening (EU) 2018/2067](32067R2018) van
      de Commissie van 19 december 2018 inzake de verificatie van gegevens en de accreditatie van verificateurs krachtens
      [Richtlijn 2003/87/EG](32003L0087) van het Europees parlement en de Raad (PbEU 2018, L 334).


