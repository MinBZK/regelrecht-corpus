    text: |-
      Deze regeling berust mede op [artikel 63a, derde, vijfde en zesde lid][ref1], en
      [artikel 71a van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel71a
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel1a
