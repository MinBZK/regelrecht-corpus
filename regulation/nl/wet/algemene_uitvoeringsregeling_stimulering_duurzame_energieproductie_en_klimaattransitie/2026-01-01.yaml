  - number: '9.3'
    text: |-
      Indien de subsidieperiode start op een andere datum dan 1 januari of eindigt op een andere datum dan 31 december
      bedraagt voor het eerste jaar respectievelijk het laatste jaar van de periode waarover subsidie wordt verstrekt het
      maandelijkse of jaarlijkse bedrag een evenredig deel van het aantal maanden of van het jaar waarover het voorschot
      wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: '9.4'
    text: 'De minister kan het maandelijkse of jaarlijkse bedrag herberekenen indien:'
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: 9.4.a
    text: |-
      de subsidie-ontvanger een verzoek tot ontheffing als bedoeld in [artikel 62, derde lid, van het besluit][ref1],
      indient;


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel62
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '62'
  - number: 9.4.b
    text: |-
      de maandelijkse productie van hernieuwbare elektriciteit, hernieuwbare warmte, hernieuwbaar gas of de maandelijkse
      vermindering van broeikasgas gedurende ten minste twee maanden ten minste 50 procent zal achterblijven dan wel
      achter is gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen maximum productie in kWh;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: 9.4.c
    text: |-
      de minister na het begin van de voorschotverlening meer dan een maand geen productiegegevens heeft ontvangen over
      de betreffende productie-installatie;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: 9.4.d
    text: |-
      de cumulatieve productie van hernieuwbare elektriciteit, hernieuwbare warmte, hernieuwbaar gas of de cumulatieve
      vermindering van broeikasgas in het betreffende kalenderjaar ten minste 20% zal achterblijven dan wel achter is
      gebleven ten opzichte van de in de beschikking tot voorschotverlening opgenomen maximum productie in kWh;
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: 9.4.e
    text: |-
      de subsidie-ontvanger een producent van geavanceerde hernieuwbare brandstof is als bedoeld in
      [artikel 9.7.1.1 van de Wet milieubeheer][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 9.4.f
    text: |-
      de subsidie-ontvanger niet heeft voldaan aan de verplichting, bedoeld in [artikel 3, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '3'
        paragraaf: '3'
  - number: '9.5'
    text: |-
      In afwijking van het bepaalde in het eerste lid, onderdeel b, ten eerste, kan de Minister van een lager
      basisbedrag uitgaan indien het rendement van de productie-installatie gedurende ten minste twee jaar structureel is
      achtergebleven ten opzichte van het in de beschikking tot voorschotverlening opgenomen rendement.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het origineel van een ondertekend
      formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: '12'
    text: |-
      Onder renovatiekosten als bedoeld in [artikel 3, tweede lid, onderdeel b, van het besluit][ref1] wordt verstaan
      de kosten voor het in nieuwstaat brengen van die voorzieningen van een productie-installatie die zorg dragen voor
      broeikasgasreductie of voor de omzetting van hernieuwbare energiebronnen in elektriciteit, gas of warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel12
