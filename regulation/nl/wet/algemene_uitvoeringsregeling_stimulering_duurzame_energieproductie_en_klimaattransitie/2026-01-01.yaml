  - number: 14e.1
    text: |-
      Indien een subsidie die op grond van het besluit wordt verleend, staatssteun bevat die door het milieu – en
      energiesteunkader wordt gerechtvaardigd, maakt de minister binnen zes maanden na de datum van subsidieverlening de
      gegevens, bedoeld in paragraaf 3.1.2.4, onderdeel 58, onderdeel (a), van het milieu- en energiesteunkader, bekend,
      voor zover de individuele steun meer bedraagt dan € 100.000.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel14e
  - number: 14e.2
    text: De gegevens, bedoeld in het eerste lid, blijven voor ten minste tien jaar openbaar beschikbaar.
    url: https://wetten.overheid.nl/BWBR0023563/2026-01-01#Artikel14e
  - number: 14g.1
    text: |-
      Een subsidieontvanger aan wie subsidie is verstrekt voor de inzet van vaste biomassa
      in een productie-installatie als bedoeld in [artikel 7, eerste lid][ref1], op grond
      van de [Regeling aanwijzing categorieën duurzame energieproductie 2015][ref2], de
      [Regeling aanwijzing categorieën duurzame energieproductie voorjaar 2016][ref3], de
      [Regeling aanwijzing categorieën duurzame energieproductie najaar 2016][ref4], de
      [Regeling aanwijzing categorieën duurzame energieproductie voorjaar 2017][ref5], de
      [Regeling aanwijzing categorieën duurzame energieproductie najaar 2017][ref6], de
      [Regeling aanwijzing categorieën duurzame energieproductie voorjaar 2018][ref7], de
      [Regeling aanwijzing categorieën duurzame energieproductie najaar 2018][ref8], met een thermisch ingangsvermogen
      gelijk aan of groter dan 20 MW, kan gebruik maken van [artikel 7, tweede tot en met zesde lid][ref9], waarbij
      het vierde, vijfde en zesde lid van dat artikel luiden zoals ze luidden voor inwerkingtreding van de Regeling
      van de Minister voor Klimaat en Energie van 13 juli 2023, nr. WJZ/ 26784474, tot wijziging van de Algemene
      uitvoeringsregeling stimulering duurzame energieproductie en klimaattransitie in verband met terugvorderen
      voorschotten, meetellen uren met negatieve elektriciteitsprijs en enkele andere wijzigingen (Stct. 2023, nummer
      20349) met dien verstande dat bij de toepassing van dat vierde of zesde lid, voor ‘kleiner dan 20 MW’ wordt gelezen
      ‘gelijk aan of groter dan 20 MW’.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
