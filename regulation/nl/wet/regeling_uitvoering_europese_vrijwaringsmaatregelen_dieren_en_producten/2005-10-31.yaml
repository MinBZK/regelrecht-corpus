---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_uitvoering_europese_vrijwaringsmaatregelen_dieren_en_producten
regulatory_layer: WET
publication_date: '2005-12-22'
valid_from: '2005-10-31'
valid_to: '2005-12-31'
bwb_id: BWBR0018875
url: https://wetten.overheid.nl/BWBR0018875/2005-10-31
preamble:
  text: |-
    Gelet op richtlijn nr. 91/496/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling
    van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen die in de
    Gemeenschap worden gebracht en tot wijziging van de richtlijnen 89/662/EEG, 90/425/EEG en 90/675/EEG (PbEG L 268)
    en richtlijn nr. 97/78/EG van de Raad van de Europese Unie van 18 december 1997 tot vaststelling van de beginselen
    voor de organisatie van de veterinaire controles voor producten die uit derde landen in de Gemeenschap worden
    binnengebracht (PbEG L 24);

    Gelet op artikel 10, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. [richtlijn nr. 91/496/EEG](31991L0496): [richtlijn nr. 91/496/EEG](31991L0496) van de Raad van de Europese
      Gemeenschappen van 15 juli 1991 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles
      voor dieren uit derde landen die in de Gemeenschap worden gebracht en tot wijziging van de [richtlijnen 89/662/EEG]
      (31989L0662), [90/425/EEG](31990L0425) en [90/675/EEG](31990L0675) (PbEG L 268);

      b. [richtlijn nr. 97/78/EG](31997L0078): [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van
      18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten
      die uit derde landen in de Gemeenschap worden binnengebracht (PbEG L 24);

      c. [verordening nr. 998/2003](32003R0998): [verordening (EG) nr. 998/2003](32003R0998) van het Europees Parlement
      en de Raad van 26 mei 2003 inzake veterinairrechtelijke voorschriften voor het niet-commerciële verkeer van
      gezelschapsdieren en houdende wijziging van [Richtlijn 92/65/EEG](31992L0065) van de Raad (PbEU L 146);

      d. communautaire uitvoeringsmaatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het
      Verdrag tot oprichting van de Europese Gemeenschap vastgesteld krachtens artikel 18 van [richtlijn nr. 91/496/EEG]
      (31991L0496), artikel 22 van [richtlijn nr. 97/78/EG](31997L0078) of artikel 18, tweede alinea, van [verordening
      nr. 998/2003](32003R0998).
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel1
  - number: '2'
    text: |-
      Het is verboden dieren, producten van dierlijke oorsprong en andere producten en voorwerpen die dragers van een
      smetstof kunnen zijn, vanuit een derde land, of een deel daarvan, in Nederland te brengen ingeval op grond van een
      communautaire uitvoeringsmaatregel voor lidstaten een verplichting geldt om:

      a. de invoer van de desbetreffende diersoort, dan wel het desbetreffende product of voorwerp, uit het
      desbetreffende land of een deel daarvan te schorsen;

      b. bijzondere voorwaarden aan de invoer van desbetreffende dieren, producten dan wel voorwerpen uit het
      desbetreffende land of een deel daarvan te stellen, indien niet is voldaan aan de bij deze communautair
      uitvoeringsmaatregel voorgeschreven voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel2
    machine_readable:
      execution:
        parameters:
          - name: is_invoer_geschorst
            type: boolean
            required: true
            description: Geeft aan of de communautair uitvoeringsmaatregel de invoer schorst
          - name: is_voorwaarden_niet_voldaan
            type: boolean
            required: true
            description: Geeft aan of niet is voldaan aan de bij de communautaire uitvoeringsmaatregel voorgeschreven voorwaarden
        output:
          - name: invoer_verboden
            type: boolean
            description: Geeft aan of de invoer verboden is op grond van de communautair uitvoeringsmaatregel
        actions:
          - output: invoer_verboden
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_invoer_geschorst
                    value: true
                  then: true
                - when:
                    operation: EQUALS
                    subject: $is_voorwaarden_niet_voldaan
                    value: true
                  then: true
              default: false
  - number: '3'
    text: |-
      1 De bevoegde autoriteit, bedoeld in een communautair uitvoeringsmaatregel, is de minister.

      2 In afwijking van het eerste lid is, ingeval een communautair uitvoeringsmaatregel de bevoegde autoriteit een
      taak opdraagt die niet bestaat in het nemen van een besluit, de bevoegde autoriteit de Voedsel en Waren Autoriteit.

      3 De officiële dierenarts, bedoeld in een communautair uitvoeringsmaatregel, is een dierenarts, verbonden aan de
      Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel3
    machine_readable:
      execution:
        parameters:
          - name: taak_bestaat_uit_besluit
            type: boolean
            required: true
            description: Geeft aan of de taak bestaat in het nemen van een besluit
        output:
          - name: bevoegde_autoriteit
            type: string
            description: De bevoegde autoriteit op grond van de communautair uitvoeringsmaatregel
        actions:
          - output: bevoegde_autoriteit
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $taak_bestaat_uit_besluit
                    value: true
                  then: minister
                - when:
                    operation: EQUALS
                    subject: $taak_bestaat_uit_besluit
                    value: false
                  then: Voedsel- en Warenautoriteit
              default: minister
  - number: '4'
    text: |-
      Een communautair uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel4
    machine_readable:
      execution:
        parameters:
          - name: uiterlijk_uitvoeringsdag
            type: date
            required: false
            description: De dag waarop uiterlijk uitvoering moet zijn gegeven
          - name: vaststellingsdag
            type: date
            required: true
            description: De dag-Hop de communautair uitvoeringsmaatregel is vastgesteld
        output:
          - name: ingangsdatum
            type: date
            description: De ingangsdatum van de communautair uitvoeringsmaatregel
        actions:
          - output: ingangsdatum
            value:
              operation: IF
              cases:
                - when:
                    operation: IS_NULL
                    subject: $uiterlijk_uitvoeringsdag
                  then:
                    operation: VALUE
                    value: $vaststellingsdag
              default:
                operation: VALUE
                value: $uiterlijk_uitvoeringsdag
  - number: '5'
    text: |-
      De [Tijdelijke regeling maatregelen in verband met Aviaire Influenza 2004][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016343
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016343
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling uitvoering Europese vrijwaringsmaatregelen dieren en producten.'
    url: https://wetten.overheid.nl/BWBR0018875/2005-10-31#Artikel7
