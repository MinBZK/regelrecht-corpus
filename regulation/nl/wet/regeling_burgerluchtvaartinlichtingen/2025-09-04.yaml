  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Defensie,

    Gelet op artikel 61 van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Aeronautical Fixed Service (AFS):* een communicatie-netwerk voor luchtverkeersdiensten;

      b. *Aeronautical Information Regulation and Control (AIRAC):* een vooraf vastgesteld tijdpad met algemene
      ingangsdata voor luchtvaartinlichtingen met een interval van 28 dagen;

      c. *Aeronautical Information Services (AIS):* een dienstverlening, uitgevoerd door luchtvaartinlichtingendiensten,
      met als doel het verzekeren van de verstrekking van die inlichtingen nodig voor een veilig, ordelijk en vlot
      verloop van het luchtverkeer;

      d. *Aeronautical Information Circular (AIC):* een circulaire voor de luchtvaart met inlichtingen die niet in
      aanmerking komen voor publicatie in een NOTAM of luchtvaartgids, maar wel in verband staan met de vliegveiligheid,
      vluchtuitvoering of technische, administratieve of wetgevende aangelegenheden;

      e. *AIS unit:* een vluchtvoorlichtingsdienst die is belast met het geven van luchtvaartinlichtingen voor de vlucht
      en het in ontvangst nemen daarvan na de vlucht;

      f. *amendement:* permanente veranderingen van de inlichtingen in de luchtvaartgids;

      g. *bijlage 4:* aeronautical charts, bijlage 4 bij het Verdrag inzake de internationale burgerluchtvaart (ICAO)
      gesloten op 7 december 1944 te Chicago (Trb. 1973, 109);

      h. *bijlage 15:* aeronautical information services, bijlage 15 bij het Verdrag inzake de internationale
      burgerluchtvaart (ICAO) gesloten op 7 december 1944 te Chicago (Trb. 1973, 109);

      i. *homebriefing:* het door gebruikers met een toegangsaccount opvragen van luchtvaartinlichtingen op hun eigen pc,
      tablet of telefoon;

      j. *International NOTAM office:* de luchtvaartinlichtingendienst die door de Minister van Infrastructuur en Milieu
      is aangewezen voor het internationaal uitwisselen van NOTAM;

      k. *luchtvaartinlichtingendiensten:* de onderdelen van de LVNL die zijn belast met de taak omschreven in
      [artikel 2][ref1];

      l. *luchtvaartkaart:* een afbeelding van een deel van de aarde, de bebouwing en verhevenheid, specifiek bestemd om
      aan de eisen van de luchtvaartnavigatie te voldoen.

      m. *Notice to Airmen (NOTAM):* een bericht aan luchtvarenden gedistribueerd middels AFS met inlichtingen over
      de instelling, toestand, of verandering van enige luchtvaartfaciliteit, -dienstverlening, -procedure of -gevaar,
      waarvan het noodzakelijk is dat personen die betrokken zijn bij de vluchtvoorbereiding en -uitvoering tijdig kennis
      nemen;

      n. *Preflight Information Bulletin (PIB):* een presentatie van actuele NOTAM-informatie van operationele aard,
      welke wordt beschikbaar gesteld vóór de vlucht;

      o. *supplement:* tijdelijke veranderingen van de inlichtingen in de luchtvaartgids, gedrukt op speciale pagina's;


      [ref1]: https://wetten.overheid.nl/BWBR0010154#Artikel2
