  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 6][ref1] en [26, tweede lid, van het Besluit luchtverkeer 2014][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035899#Artikel26
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0035899
        artikel: '26'
  - number: '2'
    text: |-
      1 De luchtvaartinlichtingendiensten hebben tot taak door middel van het verstrekken van luchtvaartinlichtingen
      en het uitgeven van luchtvaartpublicaties en luchtvaartkaarten, een veilig, ordelijk en vlot verloop van het
      luchtverkeer te bevorderen.

      2 De luchtvaartinlichtingendiensten zijn belast met het overeenkomstig bijlage 15 ontvangen of produceren,
      het nauwkeurig vergelijken, samenvoegen, persklaar maken, indelen, uitgeven en bewaren en verspreiden van
      luchtvaartinlichtingen, die het gehele vluchtinformatiegebied Amsterdam betreffen.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel2
  - number: '3'
    text: |-
      1 AIS units zijn belast met het geven van luchtvaartinlichtingen voor de vlucht en het in ontvangst nemen daarvan
      na de vlucht.

      2 Op luchthavens waar geen AIS unit is gevestigd is de exploitant van de luchthaven verantwoordelijk voor het
      beschikbaar stellen van luchtvaartinlichtingen, die vrij toegankelijk zijn, voor de vlucht en het in ontvangst
      nemen daarvan na de vlucht.

      3 De exploitant van de luchthaven, die informatie over de staat en werking van luchtvaartnavigatiefaciliteiten
      heeft ontvangen, draagt er zorg voor dat deze informatie wordt doorgegeven aan een AIS unit.

      4 Een AIS unit die informatie over de staat en werking van luchtvaartnavigatiefaciliteiten heeft ontvangen, draagt
      zorg voor:

      a. doorgifte aan de instantie, verantwoordelijk voor de staat en werking ervan;

      b. een zodanige verspreiding als de omstandigheden vereisen.

      5 De exploitant van de luchthaven is verantwoordelijk voor het bijhouden van de luchtvaartinlichtingen.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel3
  - number: '4'
    text: |-
      Luchtvaartinlichtingen van blijvende aard die essentieel zijn voor de vluchtuitvoering binnen het
      vluchtinformatiegebied Amsterdam, worden door de LVNL verstrekt middels de luchtvaartgids, overeenkomstig bijlagen
      4 en 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel4
  - number: '5'
    text: |-
      Permanente aanpassingen van de luchtvaartgids worden verstrekt middels een amendement, overeenkomstig bijlagen 4
      en 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel5
  - number: '6'
    text: |-
      Tijdelijke aanpassingen van de luchtvaartgids worden verstrekt middels een supplement, overeenkomstig bijlagen 4
      en 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel6
  - number: '7'
    text: |-
      Inlichtingen over de instelling, toestand of verandering van enige luchtvaartfaciliteit, dienstverlening, procedure
      of gevaar, waarvan het noodzakelijk is dat personen die betrokken zijn bij de vluchtvoorbereiding en -uitvoering
      tijdig kennis nemen, worden verstrekt middels NOTAM, door middel van communicatie, overeenkomstig bijlage 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel7
  - number: '8'
    text: |-
      1 Inlichtingen, die niet in aanmerking komen voor verstrekking middels NOTAM of voor opname in de luchtvaartgids,
      en die betrekking hebben op vliegveiligheid, vluchtuitvoering, technische, administratieve of juridische zaken,
      worden in een AIC verstrekt, overeenkomstig bijlage 15.

      2 In een AIC, serie A worden de inlichtingen opgenomen die zowel voor Nederlandse als niet-Nederlandse natuurlijke
      en rechtspersonen van belang zijn. Een AIC, serie A wordt internationaal verspreid.

      3 In een AIC, serie B worden de inlichtingen opgenomen die alleen voor Nederlandse natuurlijke en rechtspersonen
      van belang zijn. Een AIC serie B wordt op aanvraag verspreid. De AIC, serie B wordt in de Engelse en de Nederlandse
      taal gesteld.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel8
  - number: '9'
    text: |-
      Een luchtvaartkaart van het vluchtinformatiegebied Amsterdam voor VFR-vluchten, op een schaal van 1:500.000,
      geproduceerd overeenkomstig bijlage 4, wordt jaarlijks verstrekt.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel9
  - number: '10'
    text: |-
      Een presentatie van actuele NOTAM-informatie van operationele aard, wordt vóór de vlucht verstrekt in de vorm van
      een PIB, overeenkomstig bijlage 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel10
  - number: '11'
    text: |-
      De luchtvaartinlichtingen worden in de volgende samenstellingen verstrekt:

      1. Luchtvaartgids met als doelgroep vliegers met een abonnement op:

      a. amendements op de luchtvaartgids,

      b. supplements op de luchtvaartgids,

      c. AIC's serie A

      d. maandelijkse samenvatting van de op dat moment geldige NOTAM's.

      2. AIC's serie B met een abonnement.

      3. Een luchtvaartkaart, voor VFR-vluchten, op de schaal van 1:500.000.

      4. NOTAM middels AFS.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel11
  - number: '12'
    text: |-
      Luchtvaartinlichtingen van operationele aard, of die cartografische werkzaamheden of wijziging van
      gegevensbestanden voor luchtvaartnavigatie inhouden, en van kracht worden op een latere vastgestelde datum, worden
      gepubliceerd volgens het AIRAC systeem, overeenkomstig bijlage 15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel12
  - number: '13'
    text: |-
      1 Als burgerluchtvaartinlichtingendiensten zijn aangewezen onderdelen van de LVNL, die zijn belast met de taak
      omschreven in [artikel 2][ref1].

      2 Als AIS-unit zijn aangewezen:

      a. de AIS-unit Schiphol;

      b. de AIS-unit Eelde;

      c. de AIS-unit Rotterdam;

      d. de AIS-unit Maastricht;

      e. de burger AIS-unit Eindhoven;

      f. de AIS-unit Lelystad.


      [ref1]: https://wetten.overheid.nl/BWBR0010154#Artikel2
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010154
        artikel: '2'
        hoofdstuk: '1'
  - number: '14'
    text: Als International NOTAM office is aangewezen de AIS-unit Schiphol.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel14
  - number: '15'
    text: |-
      1 a. Luchtvaartinlichtingen worden verstrekt via een homebriefing account.

      b. De in onderdeel a bedoelde luchtvaartinlichtingen omvatten:

      1°. geïntegreerde pakketten luchtvaartinlichtingen met wereldwijde dekking;

      2º. luchtvaartkaarten;

      3º. inlichtingen voor de vlucht in de vorm van een PIB;

      4º. briefing;

      5º. het in ontvangst nemen van inlichtingen na de vlucht.

      2 Indien homebriefing ontoereikend is, worden luchtvaartinlichtingen op aanvraag verstrekt en in ontvangst genomen
      door de AIS-unit Schiphol.

      3 De AIS-unit Schiphol is aangewezen als centrale bibliotheek voor luchtvaartinlichtingen, overeenkomstig bijlage
      15.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel15
  - number: '16'
    text: |-
      1 Luchtvaartinlichtingen ten behoeve van de vluchtvoorbereiding en vluchtuitvoering worden, overeenkomstig
      [artikel 15][ref1], verstrekt aan:

      a. luchtvarenden;

      b. luchtvaartmaatschappijen;

      c. vluchtafhandelaars;

      d. luchtverkeersdiensten belast met vluchtinformatieverstrekking;

      e. exploitanten of havendiensten van luchthavens;

      f. buitenlandse luchtvaartinlichtingendiensten.

      2 Luchtvaartinlichtingen worden op aanvraag verstrekt aan:

      a. reddings- en opsporingscentra;

      b. de Onderzoeksraad voor veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref2];

      c. Dienst specialistische operaties van de Eenheid landelijke expertise en operaties van de politie;

      d. de Inspectie Leefomgeving en Transport.


      [ref1]: https://wetten.overheid.nl/BWBR0010154#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010154
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '17'
    text: |-
      1 Het international NOTAM office is aangesloten op AFS.

      2 Het international NOTAM office is via AFS verbonden met de volgende punten binnen zijn werkgebied:

      a. luchtverkeersdiensten;

      b. de volgende luchthavens:

      i. Schiphol;

      ii. Lelystad;

      iii. Eelde;

      iv. Maastricht;

      v. Rotterdam;

      vi. Eindhoven.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel17
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010154/2025-09-04#Artikel18
