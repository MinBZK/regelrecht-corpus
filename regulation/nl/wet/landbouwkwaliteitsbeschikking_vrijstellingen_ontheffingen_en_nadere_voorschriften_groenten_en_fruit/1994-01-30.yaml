valid_from: '1994-01-30'
bwb_id: BWBR0003128
url: https://wetten.overheid.nl/BWBR0003128/1994-01-30
preamble:
  text: |-
    Gelet op de artikelen 6, tweede en derde lid, en 14, tweede lid, van het Landbouwkwaliteitsbesluit groenten en
    fruit (Stb. 1977, 490),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *besluit:*


              [Landbouwkwaliteitsbesluit groenten en fruit][ref1] (Stb. 1977, 490);


      [ref1]: https://wetten.overheid.nl/BWBR0003120
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003120
  - number: '2'
    text: |-
      Het produktschap is bevoegd vrijstelling en, op aanvrage, ontheffing te verlenen van het bepaalde bij
      [artikel 3][ref1], met uitzondering van de bepaling dat groenten en fruit gezond moeten zijn, alsmede van het
      bepaalde krachtens de [artikelen 6, eerste lid][ref2], en [8, eerste en tweede lid][ref3] van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003128#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003120#Artikel8
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003128
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003120
        artikel: '8'
  - number: '3.1'
    text: |-
      Besluiten, tot het verlenen van vrijstelling, als bedoeld in [artikel 2][ref1], alsmede nadere voorschriften
      vastgesteld krachtens verordening, bedoeld in [artikel 6, eerste lid][ref2], van het besluit, behoeven de
      goedkeuring van de directeur-generaal Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0003128#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003120#Artikel6
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003128
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003120
        artikel: '6'
  - number: '3.2'
    text: |-
      Van andere dan de in het eerste lid bedoelde besluiten, die door het produktschap zijn genomen krachtens het
      besluit, wordt mededeling gedaan aan de genoemde directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel3
  - number: '4.1'
    text: |-
      Deze beschikking kan worden aangehaald als: Landbouwkwaliteitsregeling vrijstellingen, ontheffingen en nadere
      voorschriften groenten en fruit.
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel4
  - number: '4.2'
    text: Zij treedt in werking met ingang van de dag waarop het besluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003128/1994-01-30#Artikel4
