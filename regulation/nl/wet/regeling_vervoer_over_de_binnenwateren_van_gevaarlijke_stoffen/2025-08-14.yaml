        artikel: '2'
  - number: '5'
    text: |-
      1 Met de in de bij deze regeling behorende [bijlagen 1 tot en met 3][ref1] vastgestelde technische normen of
      technische eisen worden gelijkgesteld daaraan gelijkwaardige technische normen of technische eisen, vastgesteld
      door of vanwege een andere lidstaat van de Europese Unie dan wel door of vanwege een staat die partij is bij de
      overeenkomst inzake de Europese Economische Ruimte.

      2 Met de in de bij deze regeling behorende [bijlagen 1 tot en met 3][ref2] geëiste typegoedkeuringen worden
      gelijkgesteld daaraan gelijkwaardige typegoedkeuringen, geëist door of vanwege een andere lid-staat van de Europese
      Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
      [ref2]: https://wetten.overheid.nl/BWBR0010115
