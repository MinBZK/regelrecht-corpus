  - number: '2'
    text: |-
      1 Bij deze regeling behoren de volgende bijlagen:

      a. [bijlage 1][ref1]: voorschriften betreffende het vervoer van gevaarlijke stoffen over de binnenwateren, zijnde
      de Nederlandse vertaling van het ADN en de daarvan deel uitmakende bijlagen;

      b. [bijlage 2][ref2]: Regeling vervoer gevaarlijke stoffen met zeeschepen;

      c. [bijlage 3][ref3]: voorschriften in aanvulling op [bijlage 1][ref4];

      d. [bijlage 4][ref5]: erkende instanties, bedoeld in [artikel 1, eerste lid, onderdeel b, 2°][ref6].

      2 [Bijlage 1][ref7] is van toepassing op de binnenwateren, voor zover [bijlage 2][ref8] niet van toepassing is.

      3 De [bijlagen 1][ref9] en [2][ref10] zijn niet van toepassing op handelingen, genoemd in
      [artikel 3B.1, eerste lid, van het Vuurwerkbesluit][ref11].


