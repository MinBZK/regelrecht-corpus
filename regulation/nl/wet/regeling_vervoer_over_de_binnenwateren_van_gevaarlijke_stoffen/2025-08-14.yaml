  text: |-
    Gelet op artikel 26, eerste lid, van de Wet vervoer gevaarlijke stoffen, en op de artikelen 2 en 5, derde lid, van
    het Besluit vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *Minister:* Minister van Infrastructuur en Milieu;

      b. *bevoegde autoriteit:*

      1°. Minister,

      2°. een in [bijlage 4][ref1] bij deze regeling erkende instantie, of

      3°. een met toepassing van de [Regeling erkende instanties vervoer gevaarlijke stoffen][ref2] erkende instantie;

      c. *ADN:* Accord Européen relatif au Transport International des Marchandises Dangereuses par voie de Navigation
      (ADN).

      2 De in [bijlage 1][ref3] opgenomen begripsbepalingen zijn van toepassing op de [bijlagen 2][ref4], [3][ref5] en
      [4][ref6], voor zover daarin niet anders is bepaald.


