        bwb_id: BWBR0003628
        artikel: '6.28'
  - number: B3:5
    text: |-
      1 Duwstellen, waarvan de afmetingen 195 bij 24 meter overschrijden, mogen geen tankschepen bevatten, die
      gevaarlijke goederen vervoeren of niet ontgast zijn.

      2 Stoffen of voorwerpen, bedoeld in randnummer 7.1.5.1.2 van [bijlage 1][ref1] mogen slechts dan met duwstellen of
      gekoppelde samenstellen worden vervoerd indien de afmetingen ervan niet groter zijn dan 195 bij 24 meter. Tijdelijk
      voorspan is echter toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: B3:6
    text: |-
      De werkgever bewaart de dossiers, bedoeld in randnummers 1.3.3 en 1.10.2.4 van [bijlage 1][ref1] gedurende de
      arbeidsrelatie met de werknemer, die de opleiding heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: B3:7
    text: |-
      In geval het vervoer van gevaarlijke stoffen uitsluitend binnen Nederland plaatsvindt, is het toegestaan dat de
      documenten die op basis van het ADN verplicht aan boord moeten worden meegevoerd, uitsluitend zijn gesteld in de
      Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel7
  - number: B3:8
    text: |-
      De voorschriften onder randnummer 1.8.3 van [bijlage 1][ref1] zijn niet van toepassing op ondernemingen als bedoeld
      in randnummer 1.8.3.2.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel8
    references:
