    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel8
  - number: B3:1
    text: |-
      De bepalingen van deze bijlage zijn van toepassing op vervoer van gevaarlijke stoffen over de binnenwateren en
      hebben voorrang boven de bepalingen van [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: B3:1a
    text: |-
      1 Niet-grensoverschrijdend vervoer mag plaatsvinden overeenkomstig multilaterale overeenkomsten als bedoeld in
      randnummer 1.5.1.1 van [bijlage 1][ref1], die door Nederland zijn ondertekend.

      2 Bij het vervoer dat voldoet aan de in het eerste lid bedoelde multilaterale overeenkomsten worden de
      voorschriften met betrekking tot het vervoer in acht genomen die in deze overeenkomst zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: B3:3
    text: |-
      1 Het is verboden stofnummer 9000, Ammoniak, watervrij, sterk gekoeld, Klasse 2, 3TC, of brandbare gassen van de
      Klasse 2 te vervoeren met tankschepen langs Dordrecht, Zwijndrecht of Papendrecht, anders dan over de Dordtse Kil.

      2 Het eerste lid is niet van toepassing op:

      a. tankschepen die minder dan 25 ton vervoeren;

      b. tankschepen die volledig voldoen aan randnummer 9.3.1.11.2 van het ADN conform het Certificaat van Goedkeuring,
      of

      c. vervoer uitsluitend tussen de Volkeraksluizen en Amsterdam, mits het betrokken schip zich ten minste één uur
      voor het opvaren van de Oude Maas meldt bij de Regionale Verkeerscentrale Dordrecht.
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel3
  - number: B3:4
    text: |-
      Op het vervoer van gevaarlijke stoffen op de Westerschelde en haar mondingen, op het Kanaal van
      Gent naar Terneuzen en in de buitenvoorhavens te Terneuzen, op de Eems en op de Dollard zijn de
      voorschriften bij of krachtens de [artikelen 3.14][ref1], [3.21][ref2], [3.32][ref3], [4.04][ref4] en
      [6.28, negende en tiende lid van het Binnenvaartpolitiereglement][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel3.14
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel3.21
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel3.32
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel4.04
      [ref5]: https://wetten.overheid.nl/BWBR0003628#Artikel6.28
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel4
    references:
