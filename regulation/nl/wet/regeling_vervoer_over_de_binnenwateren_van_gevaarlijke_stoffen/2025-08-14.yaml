  - number: '3'
    text: |-
      Met voorwaardelijk tot het vervoer over de binnenwateren toegelaten gevaarlijke stoffen als bedoeld in
      [bijlage 1][ref1] mogen de handelingen, bedoeld in [artikel 2 van het Besluit vervoer gevaarlijke stoffen][ref2],
      worden verricht, mits de in deze regeling gestelde voorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
      [ref2]: https://wetten.overheid.nl/BWBR0008080#Artikel2
    url: https://wetten.overheid.nl/BWBR0010115/2025-08-14#Artikel3
