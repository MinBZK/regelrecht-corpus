articles:
  - number: '1'
    text: |-
      De opgavebussen als bedoeld in artikel 2, vierde lid, onderdeel a, van de Regeling bijhouden EEG-logboek en opgave
      zeevis 1987 (Stcrt. 194) zijn geplaatst dan wel opgehangen in de volgende plaatsen:

        - Breskens (gemeente Oostburg), aan de noordzijde van het gebouw van de visafslag
        - Vlissingen aan de noordzijde van het gebouw van de visafslag,
        - Nieuwdorp (gemeente Borsele), naast de toegangsdeur van het kantoor van de Algemene Inspectiedienst van het
      Ministerie van Landbouw, Natuurbeheer en Visserij, aan de Bijleveldkade 9,
        - Colijnsplaat (gemeente Kortgene), aan de noordzijde van het gebouw van de visafslag,
        - Stellendam (gemeente Goedereede), aan de noordzijde van het gebouw van de visafslag,
        - Scheveningen (gemeente 's-Gravenhage), aan de oostzijde, op de loswalkade, van het gebouw van de visafslag, en
      aan de muurzijde van het gebouw ‘De 4master’ aan de Dr. Lelykade 10b,
        - IJmuiden (gemeente Velzen), aan de westzijde van het havenkantoor van Zeehaven IJmuiden N.V., in de visafslag van
      de Hollandse Visveiling IJmuiden B.V. in de gevel aan de zuidzijde van hal D3 en de gevel aan de zuidzijde van hal
      E5 en aan het havenkantoor zuidzijde van Zeehaven IJmuiden N.V., gelegen aan de Trawlerkade,
        - Den Helder, aan de waterzijde van de visafslag en aan de Onderzeebootkade ter hoogte van steiger 38 en aan het
      Nieuwe Diep ter hoogte van steiger 44,
        - Den Oever, (gemeente Wieringen), nabij de ingang aan de noordwestzijde, oude gedeelte van het gebouw van de
      visafslag,
        - Harlingen, aan de oostzijde van het gebouw van de visafslag en aan de achterzijde van loods SSM aan de Nieuwe
      Willemshaven,
        - Lauwersoog (gemeente Ulrum), nabij de ingang aan de zuidzijde van het gebouw van de visafslag en aan de
      oostzijde, nieuwe oostvleugel, van het gebouw van de visafslag en nabij de garnalenzeef op de binnenzijde van de
      noordmuur van de visafslag Lauwersoog,
        - Delfzijl, aan de noordzijde van de loods aan de Handelskade West 12 en in de hal van het havenkantoor aan de
      Farnsummerhaven,
        - Termunterzijl (gemeente Delfzijl), aan de zuidzijde van de muur van het afvaleiland, gevestigd aan het Plankpad
      tegenover de lossteiger,
        - Eemshaven (gemeente Eemsmond), naast de toegangsdeur van het kantoor van het Veem- en factorbedrijf Eemshaven BV
      aan de Eemshornweg 9,
        - Urk, aan de noordzijde van het gebouw van de ‘oude visafslag’, Burg. J. Schipperkade 4, en aan het hek van de
      hoofdingang van de ‘nieuwe visafslag’ (NV Visafslag Urk), Westwal 2,
        - Schore (gemeente Kapelle): bij de oprit van de noordelijke toegangsweg naar de loswal, Bergsediepsluis (gemeente
      Tholen): bij de meest westelijk gelegen lossteiger van de Buitenvoorhaven,
        - Noordpolderzijl (gemeente Eemsmond), in de hal van de visafslag aan de Zijlweg 2,
        - Terneuzen, aan de brug bij de losponton in de haven.
    url: https://wetten.overheid.nl/BWBR0003750/2000-11-17#Artikel1
  - number: '2'
    text: Deze regeling kan worden aangehaald als de regeling plaatsing opgavebussen.
    url: https://wetten.overheid.nl/BWBR0003750/2000-11-17#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de dag volgend op die van haar bekendmaking in de Nederlandse
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003750/2000-11-17#Artikel3
