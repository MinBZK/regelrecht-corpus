  - number: '8'
    text: |-
      1 De aanvraag wordt afgewezen indien niet of niet volledig is voldaan aan de voorwaarden, bedoeld in
      [artikel 6][ref1], met dien verstande dat indien de aanvraag onvolledig is de minister de aanvrager in de
      gelegenheid stelt de aanvraag binnen twee weken na indiening aan te vullen.

      2 De minister geeft een beschikking tot subsidieverlening op de aanvraag binnen drie maanden na afloop van de
      periode, bedoeld in [artikel 6, zesde lid][ref2], waarin de aanvraag is ingediend. Indien de minister niet binnen
      drie maanden kan beslissen, deelt hij de aanvrager mede binnen welke termijn de beslissing wel tegemoet kan worden
      gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010048#Artikel6
