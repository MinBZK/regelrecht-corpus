  - number: '7'
    text: |-
      De beoordeling van een project gebeurt op grond van onderstaande criteria:

      a. het project is gericht op de doelstelling, bedoeld in [artikel 2][ref1];

      b. het project wordt uitgevoerd door een consortium dat over de vereiste deskundigheid beschikt om het project
      succesvol te kunnen uitvoeren, waarbij in voldoende mate de betrokkenheid van docenten en praktijkbegeleiders
      en het management en de dagelijkse leiding van de instellingen en de vertegenwoordigingen van het bedrijfsleven
      verzekerd is;

      c. het projectvoorstel bevat de afspraken die de leden van het consortium hebben vastgelegd omtrent het na afloop
      van het project onderhouden en op peil houden van de ontwikkelde projectopbrengsten;

      d. door de aanvrager is co-financiering gegarandeerd tot een bedrag dat tenminste gelijk is aan 50% van de kosten
      van het project;

      e. de voorgestelde opbrengst van het project is duidelijk en concreet beschreven en controleerbaar;

      f. het projectvoorstel bevat een beschrijving van de mogelijkheden van een brede toepasbaarheid van de opbrengst;

      g. Het projectvoorstel bevat een beschrijving van de wijze waarop de publieke beschikbaarheid en verspreiding van
      de opbrengst van het project totstandkomt, waaronder in ieder geval de verspreiding van de projectopbrengsten via
      BVE-net en Kennisnet.

      h. de projectuitvoering is duidelijk en concreet beschreven en voldoet aan eisen van kwaliteit en soliditeit;

      i. de projectuitvoering start binnen zes maanden na verlening van de subsidie;

      j. de hierboven genoemde voorwaarden zijn evenwichtig en op een duidelijke en heldere wijze in het projectplan
      uitgewerkt en onderling afgestemd, en

      k. de aanvrager stemt in met de voorwaarden die de minister stelt met betrekking tot informatieverschaffing,
      verantwoording, verslaglegging en intrekking of wijziging van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel2
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel7
