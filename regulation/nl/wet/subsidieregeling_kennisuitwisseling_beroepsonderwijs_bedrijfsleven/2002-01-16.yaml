  - number: '14'
    text: |-
      1 De subsidie wordt uitsluitend besteed aan de projectactiviteiten waarvoor zij blijkens de subsidieverlening is
      bestemd.

      2 Het is de aanvrager niet toegestaan uit de verleende subsidie vermogen, fondsen of reserveringen te vormen.
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel14
  - number: '15'
    text: |-
      De minister geeft een beschikking tot vaststelling van de subsidie binnen drie maanden na ontvangst van de aanvraag
      tot subsidie-vaststelling, bedoeld in [artikel 12, zevende lid][ref1], dan wel drie maanden nadat de voor het
      indienen ervan geldende termijn is verstreken. Indien de beschikking niet binnen drie maanden na ontvangst van de
      aanvraag tot subsidievaststelling of binnen drie maanden na het verstrijken van de in de eerste volzin bedoelde
      termijn, kan worden gegeven, stelt de minister de betrokkene daarvan in kennis en noemt hij daarbij een redelijke
      termijn waarbinnen de beschikking tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel12
