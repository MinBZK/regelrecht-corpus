articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              de Minister van Onderwijs, Cultuur en Wetenschappen;



            b
            wet:

              de [Wet educatie en beroepsonderwijs][ref1];



            c
            instelling:

              een instelling als bedoeld in [artikel 1.3.1][ref2], [artikel 1.4.1][ref3], of artikel 1.4.1a van
      de wet, of een instituut als bedoeld in [artikel 12.3.8 van de wet][ref4], of een hogeschool als bedoeld in
      [artikel 12.3.9 van de wet][ref5];



            d
             landelijk orgaan:

              een landelijk orgaan als bedoeld in [artikel 1.5.1 van de wet][ref6];



            e
             onderwijsondersteunende instelling:

              het Centrum voor Innovatie van Opleidingen, genoemd in
      [artikel 12, vierde lid, van de Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref7],
      dan wel een instelling als bedoeld in
      [artikel 12, eerste lid, van de Wet subsidiëring landelijke onderwijsondersteunende activiteiten][ref8];



            f
             ondernemer:

              een natuurlijke persoon voor wiens rekening of mede voor wiens rekening een onderneming in de zin van de
      Wet op de inkomstenbelasting 1964 wordt gedreven, dan wel een rechtspersoon in de zin van [artikel 3][ref9], Boek 2
      van het Burgerlijk Wetboek;



            g
            brancheorganisatie:

              een niet-publiekrechtelijke rechtspersoon met volledige rechtsbevoegdheid, die blijkens zijn statuten als
      doel heeft de belangen te behartigen van ondernemers die behoren tot eenzelfde bedrijfstak, daaronder niet begrepen
      de primaire landbouw en visserij of een samenhangend deel daarvan, en die niet bedrijfsmatig werkzaam is;



            h
             een project:

              een samenhangend geheel van activiteiten gericht op de doelstelling, bedoeld in [artikel 2][ref10];



            i
             consortium:

              een geen rechtspersoonlijkheid bezittend samenwerkingsverband van een instelling, een ondernemer,
      een brancheorganisatie, een representant van een regionale bundeling van bedrijven, een kennisinstelling, een
      landelijk orgaan of een onderwijsondersteunende instelling, waarvan tenminste een instelling en een ondernemer of
      brancheorganisatie uit het afnemend bedrijfsleven deel uit maken;



            j
             aanvrager:

              het bevoegd gezag van een instelling of landelijk orgaan of het bevoegde orgaan van een brancheorganisatie
      dat namens het consortium de subsidieaanvraag indient en na goedkeuring van het project als subsidieontvanger
      optreedt;



            k
             samenwerkingsovereenkomst:

              een door de bevoegde organen van de leden van het consortium ondertekend document afkomstig van de daarin
      genoemde aanvrager, waaruit het voornemen van het consortium blijkt van gezamenlijke uitvoering voor gezamenlijke
      rekening, van een op de doelstelling van deze regeling gericht project;



            l
             Senter:

              het agentschap van het Ministerie van Economische Zaken waar de uitvoering van de regeling is
      ondergebracht;



            m
             co-financiering:

              de bijdrage aan de kosten van het project door het consortium of door derden die niet bij de uitvoering van
      het project betrokken zijn;



            n
            apparaatskosten:

              kosten ten behoeve van de uitvoering van de regeling;



            o
             Awb:

              de [Algemene wet bestuursrecht][ref11];



            p
             subsidie:

              het bedrag, bedoeld in [artikel 2.2.3, derde lid, van de wet][ref12], dat als aanvullende
      bekostiging aan de rijksbijdrage wordt toegevoegd ingeval het een instelling als bedoeld in
      [artikel 1.3.1, in artikel 12.3.8 of in artikel 12.3.9 van de wet][ref13] betreft, of, het bedrag, dat op grond
      van [artikel 2.7 van de wet][ref14] als subsidie wordt toegekend ingeval het een instelling als bedoeld in artikel
      1.4.1 of in artikel 1.4.1a van de wet, een landelijk orgaan, of een brancheorganisatie betreft.


