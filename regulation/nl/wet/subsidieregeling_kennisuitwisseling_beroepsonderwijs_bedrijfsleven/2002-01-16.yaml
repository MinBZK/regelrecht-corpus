  - number: '2'
    text: |-
      Het doel van de regeling is het verstrekken van een subsidie ter stimulering van projecten die gericht zijn
      op het tot stand brengen van nieuwe vormen van kennisuitwisseling tussen het beroepsonderwijs en het afnemend
      bedrijfsleven. Deze kennisuitwisseling moet resulteren in de ontwikkeling en implementatie van innovatieve
      leermiddelen/methoden of daarmee vergelijkbare instrumenten voor bestaande beroepsopleidingen die de aansluiting
      tussen het beroepsonderwijs en de beroepspraktijk verbeteren.
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel2
  - number: '3'
    text: |-
      Op de subsidie is [Titel 4.2][ref1], met uitzondering van [afdeling 4.2.8, van de Awb][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
