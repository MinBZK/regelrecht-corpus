  - number: '9'
    text: |-
      1 De minister wint omtrent een aanvraag het advies in van de Adviescommissie Kennisuitwisseling Beroepsonderwijs
      Bedrijfsleven.

      2 De commissie geeft aan de minister in ieder geval een negatief advies:

      a. indien de aanvraag niet voldoet aan deze regeling en de daarop berustende bepalingen;

      b. indien de commissie van mening is dat in onvoldoende mate sprake is van het vermogen een verbetering aan te
      brengen in de aansluiting van het initiële onderwijs op de beroepspraktijk door het ingediende projectvoorstel;

      c. indien de samenstelling van het consortium, de samenwerkingsbereidheid en de aanwezige deskundigheid binnen
      het consortium naar het oordeel van de commissie geen vertrouwen biedt in het tot een goed einde brengen van het
      project.

      3 De commissie rangschikt de aanvragen waaromtrent zij positief adviseert zodanig, dat een aanvraag in een periode
      hoger gerangschikt wordt naar de mate waarin het project meer geschikt is om bij te dragen aan de doelstelling van
      de regeling, en voor zover de helft van het totale bedrag genoemd in [artikel 5, eerste lid][ref1], in de eerste
      periode en het totale bedrag, genoemd in [artikel 5, eerste lid][ref2], in de tweede periode, door verlening van
      de gevraagde subsidie niet wordt overschreden. De commissie vergelijkt de aanvragen en let daarbij in het bijzonder
      op:

      a. samenwerking;

      b. inhoud;

      c. verstrekkendheid van het project, en

      d. de kwaliteit van de projectorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010048#Artikel5
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel9
