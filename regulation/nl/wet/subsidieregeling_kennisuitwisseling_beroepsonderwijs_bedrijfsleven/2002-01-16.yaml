  - number: '10'
    text: |-
      1 De minister beslist op de aanvraag en wijkt niet dan gemotiveerd af van het advies van de commissie.

      2 De minister beslist in ieder geval afwijzend op een aanvraag indien de commissie een negatief advies heeft
      uitgebracht, behoudens het gestelde in [artikel 11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel11
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel10
