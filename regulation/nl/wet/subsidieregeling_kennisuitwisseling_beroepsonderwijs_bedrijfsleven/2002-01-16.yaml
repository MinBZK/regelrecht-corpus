        artikel: '11'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 De minister verdeelt het beschikbare bedrag, bedoeld in [artikel 5, eerste lid][ref1], in de volgorde van de door
      de commissie bepaalde rangschikking, bedoeld in [artikel 9, derde lid][ref2].

      2 De minister kan afwijken van het door de commissie uitgebrachte advies, indien het advies in strijd is met deze
      regeling dan wel niet op zorgvuldige wijze tot stand is gekomen.

      3 Subsidieverlening geschiedt onder de voorwaarde dat bij de vaststelling of goedkeuring van de begroting van het
      Ministerie van Onderwijs, Cultuur en Wetenschappen voldoende gelden ter beschikking worden gesteld.

      4 Bij het niet vervullen van de voorwaarde, bedoeld in het derde lid, worden de op grond van [artikel 6][ref3]
      verleende subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de
      begroting van het Ministerie van Onderwijs, Cultuur en Wetenschappen ter beschikking staat, een en ander naar rato
      van het aantal subsidieaanvragers aan wie subsidie is verleend en van de hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010048#Artikel9
