  - number: '4'
    text: |-
      1 Er is een Adviescommissie Kennisuitwisseling Beroepsonderwijs Bedrijfsleven die tot taak heeft de minister op
      zijn verzoek te adviseren omtrent de aanvragen om subsidie op grond van deze regeling.

      2 De commissie bestaat uit een voorzitter, drie andere leden en een ambtelijk secretaris.

      3 De voorzitter en de andere leden worden door de minister voor een termijn van ten hoogste twee jaar benoemd. Zij
      zijn te allen tijde opnieuw benoembaar.

      4 De commissie stelt haar eigen werkwijze vast, met dien verstande dat per vergadering minimaal drie leden,
      waaronder bij voorkeur de voorzitter, aanwezig zijn.

      5 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      6 In het secretariaat van de commissie wordt door de minister voorzien.

      7 De bescheiden betreffende de werkzaamheden van de commissie worden na beëindiging van de werkzaamheden van de
      commissie opgeborgen in het archief van het Ministerie van Onderwijs, Cultuur en Wetenschappen.

      8 De commissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      9 De commissie stelt jaarlijks voor 15 november een verslag op van de werkzaamheden en het gevoerde beleid
      in de voorliggende periode. Het verslag wordt aan de minister toegezonden en met inachtneming van de
      [Wet openbaarheid van bestuur][ref1] algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '5'
    text: |-
      1 Voor subsidieverlening op grond van deze regeling is in 1999 een bedrag van f 11.000.000,- beschikbaar inclusief
      apparaatskosten.

      2 De minister maakt jaarlijks voor 31 december in het officiële publicatieblad van het Ministerie van Onderwijs,
      Cultuur en Wetenschappen bekend welk bedrag in het eerstvolgende kalenderjaar beschikbaar is voor subsidieverlening
      op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel5
  - number: '6'
    text: |-
      1 De minister verleent op aanvraag aan een aanvrager een subsidie voor een door het consortium uit te voeren
      project als bedoeld in [artikel 2][ref1], dat op grond van het advies van de adviescommissie, bedoeld in
      [artikel 4][ref2], door de minister is geselecteerd.

      2 Binnen het project bedraagt de ontwikkelingsfase van innovatieve leermiddelen/methoden of daarmee vergelijkbare
      instrumenten ten hoogste twee jaar. De implementatiefase binnen het project bedraagt ten hoogste een jaar.

      3 De subsidie voor een project bedraagt minimaal EUR 20.000 en maximaal EUR 300.000.

      4 Indien voor het project, vanwege een gemeente, een provincie, of de overheid, alsmede op grond van de aanvraag,
      bedoeld in het eerste lid, een subsidie is of wordt verstrekt, wordt slechts een zodanig bedrag aan subsidie ter
      beschikking gesteld, dat per project het totale bedrag aan subsidies niet meer bedraagt dan vijftig procent van de
      kosten van het project.

      5 Een aanvraag om subsidie voor 1999 wordt in de periode van 4 januari 1999 tot en met 1 april 1999, of in de
      periode van 6 april 1999 tot en met 17 september 1999 ingediend bij Senter met gebruikmaking van een volledig
      ingevuld origineel van een ondertekend formulier dat bij Senter verkrijgbaar is, en de bijlagen, bedoeld in het
      zevende lid.

      6 De minister maakt in de publicatie, bedoeld in [artikel 5, tweede lid][ref3], tevens de periodes van indiening
      van de aanvraag op grond van deze regeling voor het eerstvolgende kalenderjaar bekend.

      7 Een aanvraag gaat vergezeld van:

      a. een projectplan voor de duur van het project dat voldoet aan de opzet zoals weergegeven in de door Senter
      geschreven handleiding;

      b. een of meer samenwerkingsovereenkomsten;

      c. een machtiging van de leden van het consortium ten behoeve van de aanvrager,

      d. een begroting, en

      e. een tijd-kostenplan.

      8 De begroting biedt inzicht in de inkomsten en uitgaven van de aanvrager, voor zover deze betrekking hebben op de
      projectactiviteiten waarvoor subsidie wordt gevraagd.

      9 De begroting is voorzien van een toelichting per post in de vorm van een uitgewerkt activiteitenplan.

      10 Voor de berekening van de hoogte van de subsidie komen als subsidiabele kosten van het project uitsluitend in
      aanmerking:

      a. loonkosten van personeel van een of meer organisaties of natuurlijke personen van het consortium;

      b. aan derden verschuldigde kosten terzake van door hen verrichte arbeid in het kader van het project;

      c. een opslag voor algemene kosten, niet hoger dan 40% van de onder a bedoelde loonkosten van het project;

      d. materiaalkosten van het project met uitzondering van kosten gemaakt voor hardware.

      11 Het aandeel in de kosten van het project dat aan derden als bedoeld in het tiende lid, onder b, wordt besteed,
      bedraagt maximaal 25% van de subsidiabele kosten van het project.

      12 Het aandeel in de kosten van het project dat aan materiaalkosten als bedoeld in het tiende lid, onder d, wordt
      besteed, bedraagt maximaal 15% van de subsidiabele kosten van het project.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010048#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010048#Artikel5
