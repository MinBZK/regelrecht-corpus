  - number: '12'
    text: |-
      1 Het consortium voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft behoudens voorafgaande schriftelijke ontheffing van de minister voor het vertragen, essentieel wijzigen, of
      stopzetten van het project

      2 De aanvrager verstrekt de minister en door deze aangewezen personen de gevraagde inlichtingen.

      3 De aanvrager draagt er zorg voor dat de minister en door deze aangewezen personen volledige inzage hebben in de
      boeken en bescheiden voor de totale projectkosten.

      4 De aanvrager verleent de minister en door deze aangewezen personen toegang tot de door hem gebruikte plaatsen.

      5 Zolang de subsidie niet is vastgesteld stelt de aanvrager de minister onverwijld in kennis van na de aanvraag tot
      subsidieverlening opgekomen of bekend geworden feiten of omstandigheden die redelijkerwijs van belang zijn voor de
      vaststelling van de subsidie.

      6 De aanvrager dient elke zes maanden gedurende de looptijd van het project een rapportage in, waarin de voortgang
      van het project inhoudelijk en financieel beschreven is.

      7 De aanvrager dient binnen twee maanden na afloop van het project zijn aanvraag tot subsidie-vaststelling als
      bedoeld in [artikel 4:44 van de Awb][ref1] in.

      8 De aanvraag tot subsidie-vaststelling bestaat uit een financieel verslag en een verslag van de
      projectactiviteiten, waarin de aanvrager rekening en verantwoording aflegt omtrent de verrichte projectactiviteiten
      en de daaraan verbonden uitgaven en inkomsten, voor zover deze voor de vaststelling van de subsidie van belang
      zijn.

      9 In het financieel verslag en het verslag van de projectactiviteiten wordt tot uitdrukking gebracht in hoeverre
      sprake is van een behoorlijke uitvoering van de projectactiviteiten waarvoor subsidie is verstrekt en van de
      daarmee behaalde resultaten alsmede van een doelmatige aanwending van de subsidie.

      10 Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant
      als bedoeld in artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek. De verklaring heeft tevens
      betrekking op het onderzoek van de naleving van de aan de subsidie verbonden voorwaarden.

      11 Het verslag van de projectactiviteiten bevat een overzicht van de werkzaamheden waarvoor subsidie is verstrekt
      en van de daarmee bereikte resultaten.

      12 Het verslag van de projectactiviteiten bevat, voorzover van toepassing, een analyse van de verschillen tussen de
      voorgenomen projectactiviteiten en beoogde resultaten, vermeld in het projectplan, en de feitelijke realisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel444
    url: https://wetten.overheid.nl/BWBR0010048/2002-01-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:44
  - number: '13'
    text: |-
      Zolang de subsidie nog niet is vastgesteld, verleent de minister voorschotten op de subsidie volgens de volgende
      verdeling:

      a. het eerste voorschot wordt uitgekeerd binnen vier weken na de subsidieverlening en bedraagt veertig procent van
      de verleende subsidie,

      b. het tweede voorschot wordt uitgekeerd na voltooiing van de ontwikkelingsfase, mits de tussenrapportages, bedoeld
      in [artikel 12, zesde lid][ref1], positief zijn beoordeeld, en bedraagt veertig procent van de verleende subsidie,
      en

      c. het derde voorschot wordt uitgekeerd na goedkeuring van het verslag van de projectactiviteiten en ontvangst van
      het financieel verslag, bedoeld in [artikel 12, negende lid][ref2], met goedkeurende verklaring van de accountant,
      bedoeld in [artikel 12, tiende lid][ref3], en bedraagt twintig procent van de verleende subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0010048#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010048#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0010048#Artikel12
