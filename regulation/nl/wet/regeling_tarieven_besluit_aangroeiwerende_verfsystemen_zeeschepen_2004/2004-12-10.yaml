preamble:
  text: |-
    Gelet op artikel 3 van het Besluit aangroeiwerende verfsystemen zeeschepen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder certificaat: een AFS-certificaat als bedoeld in
      [artikel 2, tweede lid, van het Besluit aangroeiwerende verfsystemen zeeschepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017553#Artikel2
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017553
        artikel: '2'
  - number: '2'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van het certificaat, is een tarief
      verschuldigd van € 270.
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel2
  - number: '3'
    text: |-
      1 Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor een tussentijdse aanpassing van een
      certificaat, is een tarief verschuldigd van € 270.

      2 Voor de werkzaamheden nodig voor het verstrekken van een extra exemplaar, een tussentijdse vervanging of de
      afgifte van een certificaat, zonder dat daarvoor een onderzoek aan boord plaatsvindt, is een tarief verschuldigd
      van € 183.

      3 Indien ten behoeve van een schip tegelijkertijd meerdere documenten als bedoeld in het tweede lid worden
      verstrekt, zonder dat hiervoor een onderzoek aan boord plaatsvindt, is voor elk volgend document een tarief
      verschuldigd van € 118.

      4 Voor de vervanging van certificaten die door een scheepsongeval verloren zijn gegaan, is geen vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel3
  - number: '4'
    text: |-
      De [artikelen 46][ref1] en [47 van de Regeling Nederlandse tarieven Schepenwet 2004][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016086#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0016086#Artikel47
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016086
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0016086
        artikel: '47'
  - number: '5'
    text: |-
      Indien het bij koninklijke boodschap van 3 juli 2003 ingediende voorstel van wet tot wijziging van de Wet voorkoming
      Wet voorkoming verontreiniging door schepen, de Wet verontreiniging zeewater en de Scheepvaartverkeerswet in
      verband met de instelling van de Nederlandse exclusieve economische zone en enkele andere onderwerpen (28 984)
      tot wet is verheven en artikel I, onderdeel U, van die wet in werking treedt, berust deze regeling na die
      inwerkingtreding op [artikel 40, tweede lid, van de Wet voorkoming verontreiniging door schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel40
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '40'
  - number: '6'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit aangroeiwerende verfsystemen zeeschepen][ref1]
      in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017553
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017553
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven Besluit aangroeiwerende verfsystemen zeeschepen 2004.'
    url: https://wetten.overheid.nl/BWBR0017600/2004-12-10#Artikel7
