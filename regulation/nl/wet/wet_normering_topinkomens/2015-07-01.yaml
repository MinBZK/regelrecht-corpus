      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 7.4.2
    text: |-
      Indien Onze Minister wie het aangaat niet voor 1 januari 2015 de bedragen, bedoeld in het eerste lid, voor
      het kalenderjaar 2015 heeft vastgesteld, dan blijven, in afwijking van [artikel 2.6, eerste lid][ref1], en
      [artikel 2.7, tweede lid][ref2], de bedragen die Onze Minister wie het aangaat krachtens die artikelen heeft
      vastgesteld voor het kalenderjaar 2014, van kracht voor het kalenderjaar 2015, ook indien deze bedragen hoger zijn
      dan het wettelijke bezoldigingsmaximum, bedoeld in [artikel 2.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.4
