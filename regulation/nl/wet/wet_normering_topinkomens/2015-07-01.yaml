  - number: 7.4a.2
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld over het overgangsrecht
      ten aanzien van voorafgaande aan de inwerkingtreding van de algemene maatregel van bestuur tussen partijen
      overeengekomen bezoldigingen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.4a
  - number: '7.5'
    text: |-
      In geval van uitkeringen in verband met beëindiging van het dienstverband als bedoeld in
      [artikel 4.2, derde lid, onderdeel b][ref1], waarbij het betreffende dienstverband is geëindigd voorafgaand aan
      de inwerkingtreding van deze wet, vermeldt de verantwoordelijke de in artikel 4.2, derde lid, genoemde gegevens
      indien het totaal van de uitkeringen wegens beëindiging van het dienstverband meer bedraagt of zal bedragen dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref2], dat betrekking heeft op het jaar waarin deze wet in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.5
