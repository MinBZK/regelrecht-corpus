        artikel: '2'
        paragraaf: '2'
  - number: 2.3.1
    text: De bezoldiging van een topfunctionaris bedraagt per kalenderjaar ten hoogste € 178.000,–.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt telkens per 1 januari van elk jaar bij ministeriële regeling aangepast
      aan de ontwikkeling van de contractuele loonkosten voor de overheid zoals deze in het jaar van vaststellen
      van de ministeriële regeling voor het daaraan voorafgaande jaar door het Centraal Bureau voor de Statistiek is
      vastgesteld, en wordt afgerond op een duizendvoud in euro’s.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt niet op grond van het tweede lid gewijzigd, indien de toepassing van
      het tweede lid niet leidt tot een verhoging van het bedrag.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      De ministeriële regeling, bedoeld in het tweede lid, wordt bekend gemaakt vóór 1 november voorafgaand aan het jaar
      waarop de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Onze Minister wie het aangaat en Onze Minister, kunnen gezamenlijk besluiten dat partijen een bij dat besluit vast
      te stellen hogere bezoldiging mogen overeenkomen dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.4.2
    text: |-
      Onze Minister wie het aangaat en Onze Minister nemen een besluit als bedoeld in het eerste lid ten aanzien van een
      publiekrechtelijke rechtspersoon of een rechtspersoon als bedoeld in [artikel 1.3, eerste lid, onderdeel a][ref1],
      in overeenstemming met het gevoelen van de ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 2.4.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.4
  - number: '2.5'
    text: |-
      Onze Minister wie het aangaat en Onze Minister kunnen gezamenlijk bij ministeriële regeling, in overeenstemming
      met het gevoelen van de ministerraad, voor een of meer functies van topfunctionarissen bij een rechtspersoon
      of instelling een maximum vaststellen dat hoger is dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1],
      indien de bijzondere arbeidsmarktomstandigheden een hoger bedrag rechtvaardigen, doch niet hoger dan de
      maximumbezoldiging, bedoeld in artikel 2.3, eerste lid, zoals dit artikel luidde op de dag voorafgaande aan de
      inwerkingtreding van de [Wet verlaging bezoldigingsmaximum WNT][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036047
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036047
  - number: 2.6.1
    text: |-
      Onze Minister wie het aangaat kan, gehoord Onze Minister, bij ministeriële regeling voor
      rechtspersonen en instellingen als bedoeld in [artikel 1.2, onderdelen e tot en met h][ref1],
      [artikel 1.3, onderdelen a, b en c][ref2], en de bijlagen bij artikel 1.3, eerste lid, onderdelen d en e, een lager
      bedrag vaststellen dan het bezoldigingsmaximum, bedoeld in [artikel 2.3][ref3]. Onze Minister wie het aangaat stelt
      dat bedrag jaarlijks vast in de maand november voorafgaand aan het jaar waarop dat bedrag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.2
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het bedrag, bedoeld in het eerste lid. Het bedrag is niet hoger dan het bezoldigingsmaximum,
      bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.3
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Bij ministeriële regeling van Onze Minister wie het aangaat kunnen de verschillende rechtspersonen of organisaties
      binnen een bij [artikel 1.3, eerste lid, onderdeel d][ref1], aangewezen categorie worden ingedeeld in klassen op
      grond van criteria die betrekking hebben op onder meer de omvang van de rechtspersonen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 2.7.2
    text: |-
      Onze Minister wie het aangaat kan, gehoord Onze Minister, voor de verschillende klassen een lager bedrag
      vaststellen dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], of het bedrag, bedoeld in
      [artikel 2.6, eerste lid][ref2]. Onze Minister wie het aangaat stelt de bedragen jaarlijks vast in de maand
      november voorafgaand aan het jaar waarop de bedragen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.3
    text: |-
      Onze Minister wie het aangaat kan ten aanzien van een rechtspersoon of instelling besluiten dat de toepassing
      van de criteria leidt tot indeling in een bepaalde klasse. Een rechtspersoon of instelling kan Onze Minister wie
      het aangaat verzoeken om in een andere klasse te worden ingedeeld. De ministeriële regeling bevat regels over de
      procedure.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.7
  - number: 2.7.4
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het toepasselijke bedrag, bedoeld in het tweede of derde lid. Het bedrag is niet hoger dan het
      bezoldigingsmaximum, bedoeld in [artikel 2.3][ref1]. Bij ministeriële regeling kunnen regels worden gesteld over
      de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.5
    text: Van een besluit als bedoeld in het derde en vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.7
  - number: '2.8'
    text: |-
      Onze Minister wie het aangaat kan bij ministeriële regeling voor rechtspersonen en instellingen als bedoeld in
      [artikel 2.6, eerste lid][ref1], voor de toepassing van [artikel 2.1, tweede lid][ref2], een getal vaststellen
      dat geldt als de omvang van het dienstverband van de leden van toezichthoudende organen als bedoeld in
      [artikel 1.1, onderdeel b, onder 4° en 5°][ref3]. Het getal kan voor voorzitters van toezichthoudende organen
      hoger worden vastgesteld. Het getal is niet hoger dan de in [artikel 2.2][ref4] genoemde percentages, tenzij de
      rechtspersoon of instelling krachtens artikel 2.2 is uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.1
    text: |-
      De betrokken rechtspersonen of instellingen, bedoeld in [artikel 1.2, onderdelen e tot en met h][ref1],
      [artikel 1.3, onderdelen a, b en c][ref2], en de bijlagen bij artikel 1.3, eerste lid, onderdelen d en e, of een
      samenwerkingsverband van deze rechtspersonen of instellingen, kunnen uiterlijk in de maand september voorafgaand
      aan het jaar waarop het bedrag betrekking heeft, aan Onze Minister wie het aangaat een voorstel doen voor het
      bedrag, bedoeld in [artikel 2.6, eerste lid][ref3], of de bedragen, bedoeld in [artikel 2.7, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.2
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in [artikel 2.6, eerste lid][ref1], of
      [artikel 2.7, tweede lid][ref2], houdt Onze Minister wie het aangaat rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.2.a
    text: |-
      de bezoldiging voor vergelijkbare functies bij lichamen als bedoeld in [artikel 1.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 2.9.2.b
    text: de bezoldiging in relevante andere sectoren van de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
  - number: 2.9.2.c
    text: de verhouding met de bezoldiging van het overige personeel binnen de betreffende rechtspersonen of instellingen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
  - number: 2.9.2.d
    text: maatschappelijke opvattingen over de hoogte.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Partijen komen geen uitkeringen overeen wegens beëindiging van het dienstverband, die gezamenlijk meer bedragen dan
      de som van de beloning en de voorzieningen ten behoeve van beloningen betaalbaar op termijn over de twaalf maanden
      voorafgaand aan de beëindiging van het dienstverband, tot ten hoogste € 75 000. In geval van een dienstverband met
      een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse dienstverband bedragen de uitkeringen
      ten hoogste € 75 000, vermenigvuldigd met het aantal uren waarop het dienstverband betrekking heeft en gedeeld door
      het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister kan het bedrag, genoemd in het eerste lid,
      worden gewijzigd, indien de loonontwikkeling hiertoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Voor de toepassing van deze wet wordt bezoldiging over een periode waarin de topfunctionaris vooruitlopend op de
      beëindiging van het dienstverband geen taken meer vervult, aangemerkt als uitkering wegens beëindiging van het
      dienstverband en wordt de datum waarop de topfunctionaris de uitoefening van zijn taken beëindigt aangemerkt als
      datum waarop het dienstverband beëindigt.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      Partijen komen geen winstdelingen, bonusbetalingen of andere vormen van variabele beloning overeen, tenzij die
      overeenkomst betrekking heeft op bij of krachtens algemene maatregel van bestuur bepaalde uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.11
  - number: 3.1.1
    text: |-
      Partijen komen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door Onze Minister wie het
      aangaat voor de toepasselijke in de bijlage bij [artikel 1.4, eerste lid][ref1], aangewezen categorie voor dat jaar
      vastgesteld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.2
    text: |-
      Indien toepassing is gegeven aan [artikel 3.4, eerste lid][ref1], komen partijen geen bezoldiging overeen die
      per kalenderjaar meer bedraagt dan het door Onze Minister wie het aangaat voor de betreffende rechtspersoon of
      organisatie voor dat jaar vastgesteld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.1.3
    text: |-
      In geval van een dienstverband met een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse
      dienstverband, komen partijen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door Onze
      Minister wie het aangaat voor dat jaar vastgestelde bedrag, vermenigvuldigd met het aantal uren waarop het
      dienstverband betrekking heeft en gedeeld door het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
  - number: 3.1.4
    text: |-
      In geval van een dienstverband met een kortere duur dan een kalenderjaar, komen partijen geen bezoldiging overeen
      die meer bedraagt dan het door Onze Minister wie het aangaat voor dat jaar vastgesteld bedrag, vermenigvuldigd met
      het aantal dagen waarop het dienstverband betrekking heeft en gedeeld door 365.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
  - number: 3.1.5
    text: |-
      In geval de functie van topfunctionaris in een periode van achttien maanden voor meer dan twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking, komen partijen met ingang van de eerste dag van de dertiende
      maand in de periode van achttien maanden geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door
      Onze Minister wie het aangaat voor dat jaar vastgestelde bedrag. Het derde en vierde lid zijn van overeenkomstige
      toepassing. Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de maximale bezoldiging voor
      het geval de functie van topfunctionaris in een periode van achttien maanden voor maximaal twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
  - number: 3.1.6
    text: |-
      Een topfunctionaris die tevens werkzaam is bij een gelieerde rechtspersoon, de betreffende verantwoordelijke
      en de verantwoordelijke van de gelieerde rechtspersoon komen geen bezoldiging overeen voor zover de som van
      de bezoldigingen meer bedraagt dan het voor de op de bijlage bij [artikel 1.4, eerste lid][ref1], genoemde
      rechtspersoon geldende bedrag, bedoeld in [artikel 3.3][ref2] of [artikel 3.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.1
    text: |-
      In afwijking van [artikel 3.1, eerste lid][ref1] komen partijen met betrekking tot de leden,
      onderscheidenlijk voorzitters, van de hoogste toezichthoudende organen van een rechtspersoon of
      instelling als bedoeld in [artikel 1.4][ref2] geen bezoldiging overeen die per kalenderjaar meer bedraagt
      dan tien, onderscheidenlijk vijftien procent van de voor de rechtspersoon of instelling op grond van
      [artikel 3.1, eerste lid][ref3], [artikel 3.4][ref4] of [artikel 3.5][ref5] geldende maximale bezoldiging. Bij of
      krachtens algemene maatregel van bestuur worden uitzonderingen vastgesteld ten aanzien waarvan de vorige volzin
      buiten toepassing wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.2
    text: |-
      [Artikel 3.1, vierde en vijfde lid][ref1], eerste volzin, is van overeenkomstige toepassing op de bezoldiging van
      de in het eerste lid bedoelde leden, onderscheidenlijk voorzitters.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: '3.3'
    text: |-
      Onze Minister wie het aangaat stelt, gehoord Onze Minister, een bedrag als bedoeld in
      [artikel 3.1, eerste lid][ref1], jaarlijks vast in de maand november voorafgaand aan het jaar waarop het bedrag
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.1
    text: |-
      Bij ministeriële regeling van Onze Minister wie het aangaat kunnen de verschillende rechtspersonen of organisaties
      binnen een in de bijlage bij [artikel 1.4, eerste lid][ref1], aangewezen categorie worden ingedeeld in klassen op
      grond van criteria die betrekking hebben op onder meer de omvang van de rechtspersonen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.4.2
    text: |-
      Onze Minister wie het aangaat kan, gehoord Onze Minister, gelijktijdig met het bedrag, bedoeld in
      [artikel 3.3][ref1], voor de verschillende klassen een lager bedrag vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.3
    text: |-
      Onze Minister wie het aangaat kan ten aanzien van een rechtspersoon of instelling besluiten dat de toepassing
      van de criteria leidt tot indeling in een bepaalde klasse. Een rechtspersoon of instelling kan Onze Minister wie
      het aangaat verzoeken om in een andere klasse te worden ingedeeld. De ministeriële regeling bevat regels over de
      procedure.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het toepasselijke bedrag, bedoeld in het tweede of derde lid. Het bedrag is niet hoger dan het
      bezoldigingsmaximum, bedoeld in [artikel 3.1][ref1]. Bij ministeriële regeling kunnen regels worden gesteld over
      de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.5
    text: Van een besluit als bedoeld in het derde en vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      Onze Minister wie het aangaat kan bij ministeriële regeling voor rechtspersonen en instellingen als bedoeld in
      [artikel 3.4, eerste lid][ref1], voor de toepassing van [artikel 3.1, derde lid][ref2], een getal vaststellen
      dat geldt als de omvang van het dienstverband van de leden van toezichthoudende organen als bedoeld in
      [artikel 1.1, onderdeel b, onder 4° en 5°][ref3]. Het getal kan voor voorzitters van toezichthoudende organen
      hoger worden vastgesteld. Het getal is niet hoger dan de in [artikel 3.2][ref4] genoemde percentages, tenzij de
      rechtspersoon of instelling krachtens artikel 3.2 is uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      De betrokken rechtspersonen of instellingen, bedoeld in de bijlage bij [artikel 1.4, eerste lid][ref1], of een
      samenwerkingsverband van deze rechtspersonen of instellingen, kunnen uiterlijk in de maand september voorafgaand
      aan het jaar waarop het bedrag betrekking heeft, aan Onze Minister wie het aangaat een voorstel doen voor het
      bedrag, bedoeld in [artikel 3.3][ref2] of de bedragen, bedoeld in [artikel 3.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.2
    text: |-
      Bij de vaststelling van een bedrag als bedoeld in [artikel 3.3][ref1] of [artikel 3.4, tweede lid][ref2], houdt
      Onze Minister wie het aangaat rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.2.a
    text: |-
      de bezoldiging voor vergelijkbare functies bij lichamen als bedoeld in [artikel 1.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.6.2.b
    text: de bezoldiging in relevante andere sectoren van de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
  - number: 3.6.2.c
    text: de verhouding met de bezoldiging van het overige personeel binnen de betreffende rechtspersonen of instellingen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
  - number: 3.6.2.d
    text: maatschappelijke opvattingen over de hoogte.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Partijen komen geen uitkeringen overeen wegens beëindiging van het dienstverband, die gezamenlijk meer bedragen dan
      de som van de beloning en de voorzieningen ten behoeve van beloningen betaalbaar op termijn over de twaalf maanden
      voorafgaand aan de beëindiging van het dienstverband, tot ten hoogste € 75 000. In geval van een dienstverband met
      een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse dienstverband bedragen de uitkeringen
      ten hoogste € 75 000, vermenigvuldigd met het aantal uren waarop het dienstverband betrekking heeft en gedeeld door
      het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister kan het bedrag, genoemd in het eerste lid,
      worden gewijzigd, indien de loonontwikkeling hiertoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Voor de toepassing van deze wet wordt bezoldiging over een periode waarin de topfunctionaris vooruitlopend op de
      beëindiging van het dienstverband geen taken meer vervult, aangemerkt als uitkering wegens beëindiging van het
      dienstverband en wordt de datum waarop de topfunctionaris de uitoefening van zijn taken beëindigt aangemerkt als
      datum waarop het dienstverband beëindigt.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.7
  - number: '3.8'
    text: |-
      Partijen komen geen winstdelingen, bonusbetalingen of andere vormen van variabele beloning overeen, tenzij die
      overeenkomst betrekking heeft op bij of krachtens algemene maatregel van bestuur bepaalde uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel3.8
  - number: 4.1.1
    text: |-
      De verantwoordelijke vermeldt in het financieel verslaggevingsdocument van iedere topfunctionaris en iedere gewezen
      topfunctionaris de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.b
    text: de beloning;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.c
    text: de belastbare vaste en variabele onkostenvergoedingen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.d
    text: de voorzieningen ten behoeve van beloningen betaalbaar op termijn;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.e
    text: de functie of functies;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.1.f
    text: de duur en omvang van het dienstverband in het boekjaar.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.2
    text: |-
      In geval de functie wordt vervuld anders dan op grond van een dienstbetrekking, vermeldt de verantwoordelijke in
      afwijking van het eerste lid van iedere topfunctionaris en iedere gewezen topfunctionaris:
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.2.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.2.b
    text: de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.2.c
    text: de functie of functies;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.2.d
    text: de duur en omvang van de functievervulling in het boekjaar.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.3
    text: |-
      De verantwoordelijke vermeldt in het financieel verslaggevingsdocument van iedere topfunctionaris en iedere gewezen
      topfunctionaris de in het boekjaar verrichte uitkeringen wegens beëindiging van het dienstverband, alsmede de
      naam en functie of functies die tijdens het dienstverband zijn bekleed en het jaar waarin het dienstverband is
      geëindigd.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Indien de bezoldiging van een topfunctionaris of een gewezen topfunctionaris meer bedraagt dan de voor de
      instelling bij of krachtens deze wet bepaalde maximale bezoldiging of het totaal van de uitkeringen wegens
      beëindiging van het dienstverband van een topfunctionaris of een gewezen topfunctionaris meer bedraagt of zal
      bedragen dan het bedrag, bedoeld in [artikel 2.10, eerste lid][ref1], of [artikel 3.7, eerste lid][ref2], motiveert
      de verantwoordelijke deze overschrijding in het financieel verslaggevingsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 4.1.5
    text: |-
      De verantwoordelijke zendt langs elektronische weg uiterlijk op 1 juli van het jaar volgend op het boekjaar, de
      gegevens bedoeld in het eerste tot en met vierde lid aan Onze Minister, tenzij Onze Minister wie het aangaat de
      mogelijkheid tot elektronische verstrekking heeft opengesteld.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.1
  - number: 4.2.1
    text: |-
      De verantwoordelijke vermeldt in het financieel verslaggevingsdocument van eenieder in dienstbetrekking
      van wie de bezoldiging niet reeds op grond van [artikel 4.1][ref1] in het financieel verslaggevingdocument
      is opgenomen en van wie de bezoldiging van zijn functie of functies de maximale bezoldiging, bedoeld in
      [artikel 2.3, eerste lid][ref2], te boven is gegaan, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.1.a
    text: de beloning;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.1.b
    text: de belastbare vaste en variabele onkostenvergoedingen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.1.c
    text: de voorzieningen ten behoeve van beloningen betaalbaar op termijn;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.1.d
    text: de functie of functies;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.1.e
    text: de duur en omvang van het dienstverband in het boekjaar.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval van een dienstbetrekking van een kleinere omvang
      dan het bij de verantwoordelijke gebruikelijke voltijds dienstverband, en waarbij de bezoldiging meer bedraagt
      dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], vermenigvuldigd met het aantal uren waarop de
      dienstbetrekking betrekking heeft en gedeeld door het aantal uren van een voltijds dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.3
    text: |-
      De verantwoordelijke vermeldt in het financieel verslaggevingsdocument de in het boekjaar verrichte uitkeringen
      wegens beëindiging van het dienstverband, alsmede de functie of functies die tijdens het dienstverband zijn bekleed
      en het jaar waarin het dienstverband is geëindigd van eenieder in dienstbetrekking van wie de bezoldiging niet
      reeds op grond van [artikel 4.1][ref1] in het financieel verslaggevingdocument is opgenomen en


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: 4.2.3.a
    text: |-
      wiens gegevens in enig voorafgaand jaar op grond van het eerste lid of op grond van
      [artikel 6, eerste lid, van de Wet openbaarmaking uit publieke middelen gefinancierde topinkomens][ref1], zoals dat
      artikel luidde voorafgaand aan de inwerkingtreding van dit artikel, in het financieel verslaggevingsdocument zijn
      opgenomen of hadden moeten worden opgenomen, of


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0019562
        artikel: '6'
  - number: 4.2.3.b
    text: |-
      van wie het totaal van de uitkeringen wegens beëindiging van het dienstverband meer bedraagt of zal bedragen dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref1], dat gold in het jaar waarin het dienstverband is geëindigd,
      indien van toepassing herrekend overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.4
    text: |-
      Indien het boekjaar niet overeenkomt met een kalenderjaar, betreft de vermelding, bedoeld in het eerste lid, de
      bezoldiging, de functie of functies die betrekking hebben op het kalenderjaar direct voorafgaande aan het boekjaar.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.5
    text: |-
      In de gevallen, bedoeld in het eerste of het derde lid, onderdeel b, motiveert de verantwoordelijke in het
      financieel verslaggevingsdocument de overschrijding van de maximale bezoldiging, bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.6
    text: |-
      De verantwoordelijke vermeldt in het financieel verslaggevingsdocument tevens van hen van wie de bezoldiging, de
      functie of functies en de duur van het dienstverband vermeld wordt, deze gegevens over het kalenderjaar voorafgaand
      aan het jaar waarop de verplichting in het eerste en tweede lid betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 4.2.7
    text: |-
      De verantwoordelijke zendt langs elektronische weg uiterlijk op 1 juli van het jaar volgend op het boekjaar, de
      gegevens bedoeld in het eerste, derde, vijfde en zesde lid aan Onze Minister, tenzij Onze Minister wie het aangaat
      de mogelijkheid tot elektronische verstrekking heeft opengesteld.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel4.2
  - number: 5.1.1
    text: |-
      Met het toezicht op de naleving van deze wet zijn belast de bij besluit van Onze Minister wie het aangaat
      aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.1
  - number: 5.1.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.1
  - number: 5.2.1
    text: |-
      De accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], meldt een
      onverschuldigde betaling aan Onze Minister, of aan Onze Minister wie het aangaat indien deze de mogelijkheid
      tot elektronische verstrekking heeft opengesteld, indien een vordering op een topfunctionaris of gewezen
      topfunctionaris en, in de gevallen, bedoeld in de [artikelen 2.1, vierde lid][ref2], en [3.1, vijfde lid][ref3], de
      natuurlijke persoon of rechtspersoon die de topfunctionaris ter beschikking stelt uit onverschuldigde betaling:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 5.2.1.a
    text: niet in het financieel verslaggevingsdocument is opgenomen, of
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.2
  - number: 5.2.1.b
    text: |-
      op het tijdstip waarop de accountant zijn oordeel geeft over het financieel verslaggevingsdocument
      door de betrokken topfunctionaris, gewezen topfunctionaris, of, in de gevallen, bedoeld in de
      [artikelen 2.1, vierde lid][ref1], en [3.1, vijfde lid][ref2], de natuurlijke persoon of rechtspersoon die de
      topfunctionaris ter beschikking stelt nog niet is terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 5.2.2
    text: |-
      Indien het financieel verslaggevingsdocument niet de juiste in de [artikelen 4.1][ref1] en [4.2][ref2]
      voorgeschreven gegevens of de in artikel 4.2, vijfde lid, bedoelde motivering bevat, meldt de accountant de
      ontbrekende gegevens of het ontbreken van de motivering aan Onze Minister, of aan Onze Minister wie het aangaat
      indien deze de mogelijkheid tot elektronische verstrekking heeft opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      De Belastingdienst, pensioenfondsen, alsmede verzekeraars aan wie ten behoeve van een topfunctionaris betalingen
      zijn verricht ten behoeve van een beloning betaalbaar op termijn of een uitkering wegens beëindiging van het
      dienstverband, zijn verplicht desgevraagd aan Onze Minister wie het aangaat kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Onze Minister wie het aangaat is ter handhaving van de [paragrafen 2][ref1] en [3][ref2] bevoegd om partijen een
      last onder dwangsom op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        paragraaf: '3'
  - number: 5.4.2
    text: |-
      Van een last onder dwangsom als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Onze Minister wie het aangaat kan verbeurde dwangsommen verrekenen met bestaande vorderingen van de rechtspersoon
      die de dwangsom heeft verbeurd op Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Indien de opgelegde last niet wordt uitgevoerd, eist Onze Minister wie het aangaat, onder intrekking van de
      last onder dwangsom, de in de last vermelde onverschuldigde betalingen op van de topfunctionaris of de gewezen
      topfunctionaris. Met de bekendmaking van het besluit tot opeisen vervalt de vordering uit onverschuldigde betaling.
      De opgeëiste bedragen komen toe aan de Staat.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.5
  - number: 5.5.2
    text: |-
      In de gevallen, bedoeld in de [artikelen 2.1, vierde lid][ref1], en [3.1, vijfde lid][ref2], kan de onverschuldigde
      betaling worden opgeëist van de topfunctionaris of de gewezen topfunctionaris en de natuurlijke of rechtspersoon
      die de topfunctionaris of de gewezen topfunctionaris ter beschikking heeft gesteld gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 5.5.3
    text: |-
      De opgeëiste bedragen worden binnen drie weken voldaan. Onze Minister wie het aangaat kan de opgeëiste bedragen
      bij dwangbevel invorderen. De [artikelen 5:38][ref1] en [5:39 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.5.4
    text: |-
      Onze Minister wie het aangaat eist geen onverschuldigde betaling op als de vordering uit onverschuldigde betaling
      is verjaard. De last, bedoeld in [artikel 5.4][ref1], stuit de verjaring. Onze Minister wie het aangaat kan de
      verjaring van de vordering uit onverschuldigde betaling stuiten door hiervan mededeling te doen aan partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '5'
        paragraaf: '5'
  - number: 5.6.1
    text: |-
      Onze Minister wie het aangaat is bevoegd tot openbaar maken van de gegevens voor zover deze op grond van de
      [artikelen 4.1][ref1] en [4.2][ref2] hadden moeten worden opgenomen in het financieel verslaggevingsdocument.
      Openbaarmaking geschiedt zoveel mogelijk op de voor het financieel verslaggevingsdocument voorgeschreven wijze,
      alsmede door publicatie in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: 5.6.2
    text: |-
      De verantwoordelijke is de kosten verbonden aan de openbaarmaking, bedoeld in het eerste lid, verschuldigd.
      Onder deze kosten zijn mede begrepen de kosten van het opstellen van het openbaar te maken document. Bij algemene
      maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop het bedrag van de kosten wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.6
  - number: 5.6.3
    text: |-
      Onze Minister wie het aangaat kan van de verantwoordelijke bij dwangbevel de ingevolge het tweede lid verschuldigde
      kosten invorderen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel5.6
  - number: 6.1.1
    text: Er is een adviescollege normeringbeleid bezoldigingen topfunctionarissen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.1
  - number: 6.1.2
    text: Het college bestaat uit een voorzitter en ten hoogste vijf andere leden.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.1
  - number: 6.2.1
    text: 'Het college heeft tot taak de regering te adviseren over:'
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.2
  - number: 6.2.1.a
    text: het beleid betreffende de bezoldiging van topfunctionarissen in de zin van deze wet;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.2
  - number: 6.2.1.b
    text: de toepassing van deze wet door partijen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Het college brengt ten minste eenmaal per vier jaar een advies uit aan de regering over het bezoldigingsbeleid
      van topfunctionarissen in de publieke en semipublieke sector en over de verbetering van de toepassing en de
      effectiviteit van deze wet.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel6.2
  - number: '7.1'
    text: |-
      Jaarlijks voor 31 december wordt aan de Staten-Generaal een overzicht gezonden over de uitvoering van de wet. Onze
      Minister coördineert de verzending. Het overzicht bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.1
  - number: 7.1.a
    text: |-
      per rechtspersoon of instelling de gegevens die op grond van [artikel 4.1, eerste tot en met vierde lid][ref1],
      zijn of hadden moeten worden opgenomen in het financieel verslaggevingsdocument over het voorafgaande jaar, met
      uitzondering van de naam van de topfunctionaris of gewezen topfunctionaris, voor zover de bezoldiging van de
      topfunctionaris of de gewezen topfunctionaris de maximale bezoldiging bedoeld in [artikel 2.3, eerste lid][ref2],
      te boven is gegaan, dan wel, indien deze lager is, de voor hem bij of krachtens deze wet bepaalde maximale
      bezoldiging overschrijdt, of het totaal van de uitkeringen wegens beëindiging van het dienstverband het bedrag,
      bedoeld in [artikel 2.10, eerste lid][ref3], of [artikel 3.7, eerste lid][ref4], overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 7.1.b
    text: |-
      per rechtspersoon of instelling de gegevens die op grond van [artikel 4.2, eerste tot en met zesde lid][ref1], zijn
      of hadden moeten worden opgenomen in het financieel verslaggevingsdocument over het voorafgaande jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: 7.1.c
    text: de gegevens betreffende de uitzonderingen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.1
  - number: 7.1.d
    text: de gegevens betreffende overtredingen en handhavingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.1
  - number: '7.2'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na drie jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.2
  - number: 7.3.1
    text: |-
      In afwijking van [artikel 2.1][ref1] onderscheidenlijk [artikel 3.1][ref2], is een voorafgaand aan
      de inwerkingtreding van deze wet tussen partijen overeengekomen bezoldiging die meer bedraagt dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref3], zoals dit artikel luidde op de dag voorafgaande aan
      de inwerkingtreding van de [Wet verlaging bezoldigingsmaximum WNT][ref4], onderscheidenlijk het bedrag,
      bedoeld in [artikel 3.3][ref5], toegestaan voor ten hoogste vier jaar na inwerkingtreding van deze wet. De
      bezoldiging, bedoeld in de vorige volzin, wordt slechts verhoogd, indien deze verhoging en de wijze waarop
      deze wordt berekend voorafgaand aan de inwerkingtreding van deze wet tussen partijen zijn overeengekomen. De
      [artikelen 5.4 tot en met 5.6][ref6] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0036047
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3
    references:
