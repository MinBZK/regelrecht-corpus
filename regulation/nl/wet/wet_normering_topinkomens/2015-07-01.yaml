  - number: 7.3.8
    text: |-
      Indien door de verlening van een subsidie, bedoeld in [artikel 1.3, eerste lid, onderdeel c][ref1], deze
      wet van toepassing wordt op een rechtspersoon, is in afwijking van [artikel 2.1 ][ref2]onderscheidenlijk
      [artikel 3.1][ref3], een voorafgaand aan de aanvraag van die beschikking tussen partijen overeengekomen bezoldiging
      die meer bedraagt dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref4], toegestaan voor ten hoogste vier
      jaar na de bekendmaking van de subsidiebeschikking. De bezoldiging, bedoeld in de vorige volzin, wordt slechts
      verhoogd, indien deze verhoging en de wijze waarop deze wordt berekend voorafgaand aan de aanvraag van die
      beschikking tussen partijen zijn overeengekomen. De [artikelen 5.4 tot en met 5.6][ref5] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
