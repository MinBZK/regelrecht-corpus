  - number: 7.3.9
    text: |-
      Indien een in het eerste tot en met het vijfde lid bedoelde periode van vier jaar is verstreken, wordt de
      overeengekomen bezoldiging in een periode van drie jaar teruggebracht tot het voor de rechtspersoon of instelling
      geldende maximum. In het eerste jaar bedraagt de verlaging een vierde deel van het verschil tussen de bezoldiging
      die op grond van het eerste tot en met het vierde lid werd genoten en het geldende maximum. In het tweede jaar
      bedraagt de verlaging een derde deel van het verschil tussen de bezoldiging uit het eerste jaar en het geldende
      maximum. In het derde jaar bedraagt de verlaging een tweede deel van het verschil tussen de bezoldiging uit het
      tweede jaar en het geldende maximum. Een eventuele overeengekomen verhoging als bedoeld in het eerste tot en met
      vierde lid, blijft buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3
  - number: 7.3.10
    text: |-
      Indien een dienstverband waarop dit artikel van toepassing is, wordt verlengd, blijft dit artikel na de verlenging
      buiten verdere toepassing.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3
  - number: 7.3.11
    text: |-
      Voor de toepassing van dit artikel blijft buiten beschouwing iedere wijziging in de bezoldiging, of de duur
      van het dienstverband die wordt overeengekomen tussen 6 december 2011 en 1 januari 2013, tenzij de wijziging
      betrekking heeft op een bezoldiging die niet hoger is dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1],
      onderscheidenlijk het bedrag, bedoeld in [artikel 3.3][ref2], dan wel het krachtens [artikel 2.6][ref3] van
      toepassing zijnde bedrag, zoals deze golden met ingang van 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3
