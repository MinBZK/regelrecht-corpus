  - number: 7.8.1
    text: |-
      De [Wet openbaarmaking uit publieke middelen gefinancierde topinkomens][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019562
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0019562
  - number: 7.8.2
    text: |-
      De verantwoordelijke is bevoegd in het financieel verslaggevingsdocument over 2012 de gegevens, bedoeld in
      [artikel 6 van de Wet openbaarmaking uit publieke middelen gefinancierde topinkomens][ref1], zoals dat artikel
      luidde op 31 december 2012, te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0019562
        artikel: '6'
  - number: '7.9'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel 2.3][ref1], dat in werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst. Bij dat besluit kunnen de in artikel 2.3, eerste lid, genoemde bedragen overeenkomstig
      artikel 2.3, derde lid, worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.9
