  - number: 2.2.2
    text: |-
      [Artikel 2.1, derde en vierde lid, eerste volzin][ref1], is van overeenkomstige toepassing op de bezoldiging van de
      in het eerste lid bedoelde leden, onderscheidenlijk voorzitters, met dien verstande dat in deze artikelleden voor
      «[artikel 2.3][ref2]» wordt gelezen «[artikel 2.2][ref3] of [2.8][ref4]».


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
