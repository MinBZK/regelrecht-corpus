  - number: 1.3.1.c
    text: |-
      in Nederland gevestigde rechtspersonen waaraan voor een periode van ten minste drie achtereenvolgende kalenderjaren
      een of meer subsidies zijn verleend, die samen per kalenderjaar ten minste € 500.000 bedragen en ten minste
      50% uitmaken van de inkomsten van de rechtspersoon in dat kalenderjaar, met uitzondering van die rechtspersonen
      die zijn opgenomen in de bijlagen bij de [artikelen 1.4, eerste lid][ref1], en [1.5, eerste lid][ref2], en met
      uitzondering van naamloze en besloten vennootschappen die een op winst gerichte onderneming drijven;


