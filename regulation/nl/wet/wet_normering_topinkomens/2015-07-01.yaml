  - number: 7.3a.1
    text: |-
      Indien op grond van [artikel 7.3][ref1], zoals dat artikel luidde op de dag voorafgaande aan de inwerkingtreding
      van de [Wet verlaging bezoldigingsmaximum WNT][ref2] een hogere bezoldiging was toegestaan dan de maximale
      bezoldiging van [artikel 2.3][ref3] dan wel het op grond van een ministeriële regeling als bedoeld in
      [artikel 2.6, eerste lid][ref4], [artikel 2.7, tweede lid][ref5] of [artikel 2.8][ref6], geldend bedrag, en
      dat bedrag gelijktijdig met de inwerkingtreding van de Wet verlaging bezoldigingsmaximum WNT of overeenkomstig
      [artikel 7.4, tweede lid][ref7], wordt verlaagd, wordt in artikel 7.3, negende lid, voor «het voor de rechtspersoon
      of instelling geldende maximum» of «het geldende maximum» telkens gelezen: het op de dag voorafgaande aan de
      inwerkingtreding van de Wet verlaging bezoldigingsmaximum WNT voor de rechtspersoon of instelling geldende maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0036047
