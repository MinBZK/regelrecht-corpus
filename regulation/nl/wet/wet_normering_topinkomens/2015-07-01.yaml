        artikel: '5'
        paragraaf: '5'
  - number: 7.3.2
    text: |-
      Indien door wijziging van de bijlage bij [artikel 1.3, eerste lid, onderdeel d of e][ref1], of
      [artikel 1.4, eerste lid][ref2], deze wet van toepassing wordt op de tussen partijen overeengekomen bezoldiging, is
      in afwijking van [artikel 2.1][ref3] onderscheidenlijk [artikel 3.1][ref4], een voorafgaand aan de inwerkingtreding
      van die wijziging tussen partijen overeengekomen bezoldiging die meer bedraagt dan de maximale bezoldiging, bedoeld
      in [artikel 2.3][ref5], onderscheidenlijk het bedrag, bedoeld in [artikel 3.3][ref6], toegestaan voor ten hoogste
      vier jaar na inwerkingtreding van de wijziging van de bijlage. De bezoldiging, bedoeld in de vorige volzin, wordt
      slechts verhoogd, indien deze verhoging en de wijze waarop deze wordt berekend voorafgaand aan de inwerkingtreding
      van die wijziging tussen partijen zijn overeengekomen. De [artikelen 5.4 tot en met 5.6][ref7] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3
