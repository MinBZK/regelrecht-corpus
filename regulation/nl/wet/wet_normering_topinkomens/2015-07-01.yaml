        artikel: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0036047
  - number: 7.3a.3
    text: |-
      Dit artikel is niet van toepassing ten aanzien van de in [artikel 2.2][ref1] bedoelde leden, onderscheidenlijk
      voorzitters van de hoogste toezichthoudende organen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.3a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 7.4.1
    text: |-
      Indien de [Wet verlaging bezoldigingsmaximum WNT][ref1] met ingang van 1 januari 2015 in werking treedt, kan, in
      afwijking van [artikel 2.6, eerste lid][ref2], of [artikel 2.7, tweede lid][ref3], Onze Minister wie het aangaat de
      ministeriële regeling tot vaststelling van de bedragen, bedoeld in artikel 2.6, eerste lid, en artikel 2.7, tweede
      lid, met betrekking tot het kalenderjaar 2015, uiterlijk in december 2014 vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0036047
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0036047
      - id: ref2
