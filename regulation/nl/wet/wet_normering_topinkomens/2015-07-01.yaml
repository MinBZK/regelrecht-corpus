  - number: 7.3.7
    text: |-
      In afwijking van [artikel 2.11][ref1] of [artikel 3.8][ref2] is een winstdeling, bonusbetaling of
      andere variabele beloning die tussen partijen is overeengekomen voorafgaand aan de inwerkingtreding
      van deze wet, dan wel voorafgaand aan de inwerkingtreding van de wijziging van de bijlage bij
      [artikel 1.3, eerste lid, onderdeel d of e][ref3], of [artikel 1.4, eerste lid][ref4], waardoor deze wet van
      toepassing is geworden op de betreffende rechtspersoon of instelling, toegestaan voor ten hoogste vier jaar na
      inwerkingtreding van deze wet of de wijziging van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
