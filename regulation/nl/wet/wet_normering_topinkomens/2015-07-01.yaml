  - number: 1.6.1
    text: |-
      Voor zover partijen een hogere bezoldiging overeenkomen dan bij of krachtens deze wet is toegestaan, bedraagt de
      bezoldiging van rechtswege het bedrag dat ten hoogste is toegestaan. Betalingen die dat bedrag overschrijden, zijn
      onverschuldigd betaald.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Voor zover partijen een hogere uitkering wegens beëindiging van het dienstverband overeenkomen dan bij of krachtens
      deze wet is toegestaan, bedraagt de uitkering van rechtswege het bedrag dat ten hoogste is toegestaan. Betalingen
      die dat bedrag overschrijden, zijn onverschuldigd betaald, tenzij de betaling voortvloeit uit een rechterlijke
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.6
  - number: 1.6.3
    text: |-
      Voor zover partijen een winstdeling, bonus of andere vorm van variabele beloning overeenkomen, is deze overeenkomst
      nietig, tenzij die overeenkomst betrekking heeft op uitzonderingen krachtens de algemene maatregel van bestuur,
      bedoeld in [artikel 2.11][ref1] of [artikel 3.8][ref2]. De betaling van een winstdeling, bonus of andere vorm
      van variabele beloning is nietig, tenzij die betaling betrekking heeft op bij of krachtens algemene maatregel van
      bestuur bepaalde uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 1.6.4
    text: |-
      Ieder beding tussen partijen houdende kwijtschelding van een onverschuldigde betaling of een schenking die met de
      onverschuldigde betaling wordt verrekend, is nietig.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.6
  - number: 1.7.1
    text: |-
      Voor zover zulks niet reeds uit een ander wettelijk voorschrift voortvloeit, worden de op grond van deze wet in het
      financieel verslaggevingsdocument op te nemen gegevens onderworpen aan het oordeel van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.7.2
    text: |-
      In het financieel verslaggevingsdocument worden onverschuldigde betalingen als bedoeld in [artikel 1.6][ref1]
      opgenomen als vorderingen op de betrokken topfunctionaris of de betrokken gewezen topfunctionaris, en, in de
      gevallen, bedoeld in de [artikelen 2.1, vierde lid][ref2], en [3.1, vijfde lid][ref3], tevens de natuurlijke
      persoon of rechtspersoon die de topfunctionaris ter beschikking stelt en altijd afzonderlijk vermeld in de
      toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: '1.8'
    text: |-
      Ten aanzien van personen over wie Onze Minister zulks besluit, wordt tot de bezoldiging in de zin van deze wet niet
      gerekend de loonbestanddelen die betrekking hebben op getroffen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.8
  - number: 1.9.1
    text: 'Onze Minister kan bij ministeriële regeling nadere regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
  - number: 1.9.1.a
    text: hetgeen tot de bezoldiging wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
  - number: 1.9.1.b
    text: de toerekening van onderdelen van de bezoldiging aan enig kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
  - number: 1.9.1.c
    text: hetgeen tot de uitkeringen wegens beëindiging van het dienstverband wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
  - number: 1.9.1.d
    text: |-
      de controle van het financieel verslaggevingsdocument door de accountant op de naleving van deze wet en de daarop
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Onverminderd de [artikelen 2.11][ref1] en [3.8][ref2], kunnen bij algemene maatregel van bestuur
      inkomensbestanddelen worden aangewezen die geen onderdeel van de bezoldiging vormen, indien sprake is van
      incidentele inkomensbestanddelen die voortvloeien uit reguliere arbeidsvoorwaarden en die redelijkerwijs niet als
      bezoldiging aangemerkt behoren te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: '1.10'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister wie het aangaat, beleidsregels vaststellen met betrekking
      tot de uitoefening van een op grond van deze wet of de daarop berustende bepalingen aan Onze Minister wie het
      aangaat toekomende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.10
  - number: 2.1.1
    text: |-
      Partijen komen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de maximale bezoldiging, bedoeld
      in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.2
    text: |-
      In geval van een dienstverband met een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse
      dienstverband, komen partijen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de maximale
      bezoldiging, bedoeld in [artikel 2.3][ref1], vermenigvuldigd met het aantal uren waarop het dienstverband
      betrekking heeft en gedeeld door het aantal uren van een voltijds dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.3
    text: |-
      In geval van een dienstverband met een kortere duur dan een kalenderjaar, komen partijen geen bezoldiging overeen
      die meer bedraagt dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], vermenigvuldigd met het aantal dagen
      waarop het dienstverband betrekking heeft en gedeeld door 365.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.4
    text: |-
      In geval de functie van topfunctionaris in een periode van achttien maanden voor meer dan twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking, komen partijen met ingang van de eerste dag van de dertiende
      maand in de periode van achttien maanden geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref1]. Het tweede en derde lid zijn van overeenkomstige toepassing.
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de maximale bezoldiging voor het geval
      de functie van topfunctionaris in een periode van achttien maanden voor maximaal twaalf maanden wordt vervuld
      anders dan op grond van een dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.5
    text: |-
      Een topfunctionaris die tevens werkzaam is bij een gelieerde rechtspersoon of bij een rechtspersoon als bedoeld
      in [artikel 1.3, eerste lid, onderdeel b][ref1], de betreffende verantwoordelijke en de verantwoordelijke van
      de gelieerde rechtspersoon of de rechtspersoon, bedoeld in artikel 1.3, eerste lid, onderdeel b, komen geen
      bezoldiging overeen voor zover de som van de bezoldigingen meer bedraagt dan de maximale bezoldiging, bedoeld in
      [artikel 2.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.6
    text: |-
      Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing indien voor partijen op grond van
      [artikel 2.4][ref1], [2.6][ref2] of [2.7][ref3] een van [artikel 2.3][ref4] afwijkend bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.2.1
    text: |-
      In afwijking van [artikel 2.1, eerste lid,][ref1] komen partijen met betrekking tot de leden, onderscheidenlijk
      voorzitters, van de hoogste toezichthoudende organen van een rechtspersoon of instelling als bedoeld in
      [artikel 1.2, onderdelen f, g en h][ref2] en [artikel 1.3][ref3] geen bezoldiging overeen die per kalenderjaar
      meer bedraagt dan tien, onderscheidenlijk vijftien procent van de voor de rechtspersoon of instelling op grond van
      [artikel 2.3][ref4], [artikel 2.5][ref5], [artikel 2.6][ref6] of [artikel 2.7][ref7] geldende maximale bezoldiging.
      Bij of krachtens algemene maatregel van bestuur worden uitzonderingen vastgesteld ten aanzien waarvan de vorige
      volzin buiten toepassing wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel2
