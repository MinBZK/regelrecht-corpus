  - number: 1.3.2
    text: |-
      Op de voordracht van Onze minister in overeenstemming met Onze minister(s) wie het mede aangaat, kan bij algemene
      maatregel van bestuur de bijlage bij het eerste lid, onderdeel d, in de volgende gevallen worden gewijzigd:
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.3
  - number: 1.3.2.a
    text: |-
      rechtspersonen of instellingen kunnen aan de bijlage worden toegevoegd indien de bekostiging van deze
      rechtspersonen of instellingen middellijk of rechtstreeks geheel of in aanzienlijke mate uit publieke middelen
      plaatsvindt of heeft plaatsgevonden of indien deze rechtspersonen of instellingen een wettelijke taak vervullen of
      anderszins een publiek belang dienen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.3
  - number: 1.3.2.b
    text: |-
      rechtspersonen of instellingen kunnen aan de bijlage worden toegevoegd indien sprake is van gelieerde
      rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.3
  - number: 1.3.2.c
    text: |-
      rechtspersonen of instellingen kunnen van de bijlage worden verwijderd indien de grond voor opname op de bijlage
      niet langer bestaat;
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.3
  - number: 1.3.2.d
    text: wegens wijziging van in de bijlage gebruikte aanduidingen of in geval van redactionele verbeteringen.
    url: https://wetten.overheid.nl/BWBR0032249/2015-07-01#Artikel1.3
