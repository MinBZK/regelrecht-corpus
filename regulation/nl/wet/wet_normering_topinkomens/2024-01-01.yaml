  - number: 7.3.5
    text: |-
      Indien een in een klasse als bedoeld in [artikel 2.7, eerste lid][ref1], of [3.4, eerste lid][ref2], ingedeelde
      rechtspersoon of instelling op enig moment op grond van ongewijzigde criteria is ingedeeld in een klasse
      waarvoor een lager bedrag is vastgesteld, gaat die indeling in met ingang van 1 januari van het daarop volgende
      kalenderjaar. Een voorafgaande aan de wijziging van de indeling tussen partijen overeengekomen bezoldiging die
      meer bedraagt dan het voor de toepasselijke klasse geldende bedrag is toegestaan voor ten hoogste vier jaar na
      de wijziging van de indeling. De bezoldiging, bedoeld in de vorige volzin, wordt slechts verhoogd, indien deze
      verhoging en de wijze waarop deze wordt berekend voorafgaand aan de wijziging van de indeling tussen partijen zijn
      overeengekomen. De [artikelen 5.4 tot en met 5.6][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.3
    references:
