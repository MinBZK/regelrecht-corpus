  - number: 7.3.3
    text: |-
      Een bezoldiging voor de leden van de hoogste toezichthoudende organen van een rechtspersoon of instelling die
      afwijkt van [artikel 2.2][ref1], onderscheidenlijk [artikel 3.2][ref2], is, indien de bezoldiging is overeengekomen
      voorafgaand aan de inwerkingtreding van deze wet, dan wel voorafgaand aan de inwerkingtreding van de wijziging van
      de bijlagen bij [artikel 1.3, eerste lid, onderdeel d of e][ref3], of [artikel 1.4, eerste lid][ref4], waardoor
      deze wet van toepassing is geworden op de betreffende rechtspersoon of instelling, toegestaan voor ten hoogste vier
      jaar na de inwerkingtreding van deze wet of de inwerkingtreding van de wijziging van de bijlage. De bezoldiging,
      bedoeld in de vorige volzin, wordt slechts verhoogd, indien deze verhoging en de wijze waarop deze wordt berekend
      voorafgaand aan de inwerkingtreding van deze wet, onderscheidenlijk de wijziging van de bijlage, tussen partijen
      zijn overeengekomen. Het tweede lid is van overeenkomstige toepassing. De [artikelen 5.4 tot en met 5.6][ref5] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
