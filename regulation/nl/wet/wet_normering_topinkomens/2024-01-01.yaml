  - number: 7.3.4
    text: |-
      Indien de [Wet verlaging bezoldigingsmaximum WNT][ref1] in werking treedt of toepassing wordt
      gegeven aan [artikel 2.6, eerste lid][ref2], [artikel 2.7, tweede lid][ref3], [artikel 2.8][ref4],
      [artikel 3.4, tweede lid][ref5], of [artikel 3.5][ref6], is een tussen partijen overeengekomen bezoldiging die
      meer bedraagt dan het van toepassing zijnde bedrag, toegestaan, indien de overeenkomst is gesloten voorafgaand aan
      de inwerkingtreding van die wet of de ministeriële regeling, dan wel voorafgaand aan de inwerkingtreding van de
      wijziging van de bijlage bij [artikel 1.3, eerste lid, onderdeel d of e][ref7], of [artikel 1.4, eerste lid][ref8],
      waardoor deze wet van toepassing is geworden op de betreffende rechtspersoon of instelling, voor ten hoogste vier
      jaar na inwerkingtreding van die wet of de ministeriële regeling dan wel de wijziging van de bijlage, tenzij op
      grond van het eerste tot en met vijfde lid reeds eerder een periode van ten hoogste vier jaar is aangevangen. De
      bezoldiging, bedoeld in de vorige volzin, wordt slechts verhoogd, indien deze verhoging en de wijze waarop deze
      wordt berekend voorafgaand aan de inwerkingtreding van die wet of de ministeriële regeling, dan wel voorafgaand
      aan de inwerkingtreding van de wijziging van de betreffende bijlage, tussen partijen zijn overeengekomen. De
      [artikelen 5.4 tot en met 5.6][ref9] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036047
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
