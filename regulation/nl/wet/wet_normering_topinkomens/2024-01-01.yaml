        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.2.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien de functie van lid, onderscheidenlijk
      voorzitter van de hoogste toezichthoudende organen wordt vervuld anders dan op grond van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.2
  - number: 2.3.1
    text: De bezoldiging van een topfunctionaris bedraagt per kalenderjaar ten hoogste € 233.000.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt telkens per 1 januari van elk jaar bij ministeriële regeling gewijzigd
      aan de ontwikkeling van de contractuele loonkosten voor de overheid zoals deze in het jaar van vaststellen
      van de ministeriële regeling voor het daaraan voorafgaande jaar door het Centraal Bureau voor de Statistiek is
      vastgesteld, en wordt naar boven afgerond op een duizendvoud in euro’s.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt niet op grond van het tweede lid gewijzigd, indien de toepassing van
      het tweede lid niet leidt tot een verhoging van het bedrag.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.3
  - number: 2.3.4
    text: |-
      De ministeriële regeling, bedoeld in het tweede lid, wordt bekend gemaakt vóór 1 november voorafgaand aan het jaar
      waarop de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Onze Minister wie het aangaat en Onze Minister kunnen in overeenstemming met het gevoelen van de ministerraad
      gezamenlijk besluiten dat partijen een bij dat besluit vast te stellen bezoldiging mogen overeenkomen die hoger is
      dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.4.2
    text: |-
      Een verzoek tot het nemen van een besluit als bedoeld in het eerste lid wordt ingediend bij Onze Minister wie het
      aangaat.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Onze Minister wie het aangaat kan zelfstandig besluiten tot afwijzing van een verzoek als bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.4
  - number: 2.4.4
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Onze Minister wie het aangaat en Onze Minister kunnen gezamenlijk bij ministeriële regeling, in overeenstemming
      met het gevoelen van de ministerraad, voor een of meer functies van topfunctionarissen bij een rechtspersoon of
      instelling een maximum vaststellen dat hoger is dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], indien
      de bijzondere arbeidsmarktomstandigheden een hoger bedrag rechtvaardigen, doch niet hoger dan 130 procent van de
      maximale bezoldiging, bedoeld in artikel 2.3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.1
    text: |-
      Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister, bij ministeriële regeling
      voor rechtspersonen en instellingen als bedoeld in [artikel 1.2, onderdelen e tot en met h][ref1],
      [artikel 1.3, onderdelen a, b en c][ref2], en de bijlagen bij artikel 1.3, eerste lid, onderdelen d en e, een lager
      bedrag vaststellen dan het bezoldigingsmaximum, bedoeld in [artikel 2.3][ref3]. Onze Minister wie het aangaat stelt
      dat bedrag jaarlijks vast uiterlijk in de maand november voorafgaand aan het jaar waarop dat bedrag betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.2
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het bedrag, bedoeld in het eerste lid. Het bedrag is niet hoger dan het bezoldigingsmaximum,
      bedoeld in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.6.3
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Bij regeling van Onze Minister wie het aangaat, in overeenstemming met Onze Minister, kunnen de verschillende
      rechtspersonen of organisaties binnen een bij [artikel 1.3, eerste lid, onderdeel d][ref1], aangewezen
      categorie worden ingedeeld in klassen op grond van criteria die betrekking hebben op onder meer de omvang van de
      rechtspersonen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 2.7.2
    text: |-
      Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister, voor de verschillende klassen een
      lager bedrag vaststellen dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], of het bedrag, bedoeld in
      [artikel 2.6, eerste lid][ref2]. Onze Minister wie het aangaat stelt de bedragen jaarlijks vast uiterlijk in de
      maand november voorafgaand aan het jaar waarop de bedragen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.3
    text: |-
      Onze Minister wie het aangaat kan ten aanzien van een rechtspersoon of instelling besluiten dat de toepassing
      van de criteria leidt tot indeling in een bepaalde klasse. Een rechtspersoon of instelling kan Onze Minister wie
      het aangaat verzoeken om in een andere klasse te worden ingedeeld. De ministeriële regeling bevat regels over de
      procedure.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.7
  - number: 2.7.4
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het toepasselijke bedrag, bedoeld in het tweede of derde lid. Het bedrag is niet hoger dan het
      bezoldigingsmaximum, bedoeld in [artikel 2.3][ref1]. Bij ministeriële regeling kunnen regels worden gesteld over
      de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.7.5
    text: Van een besluit als bedoeld in het derde en vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      Onze Minister wie het aangaat kan bij ministeriële regeling voor rechtspersonen en instellingen als bedoeld in
      [artikel 2.6, eerste lid][ref1], voor de toepassing van [artikel 2.1, tweede lid][ref2], een getal vaststellen
      dat geldt als de omvang van het dienstverband van de leden van toezichthoudende organen als bedoeld in
      [artikel 1.1, onderdeel b, onder 4° en 5°][ref3]. Het getal kan voor voorzitters van toezichthoudende organen
      hoger worden vastgesteld. Het getal is niet hoger dan de in [artikel 2.2][ref4] genoemde percentages, tenzij de
      rechtspersoon of instelling krachtens artikel 2.2 is uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.1
    text: |-
      De betrokken rechtspersonen of instellingen, bedoeld in [artikel 1.2, onderdelen e tot en met h][ref1],
      [artikel 1.3, onderdelen a, b en c][ref2], en de bijlagen bij artikel 1.3, eerste lid, onderdelen d en e, of een
      samenwerkingsverband van deze rechtspersonen of instellingen, kunnen uiterlijk in de maand september voorafgaand
      aan het jaar waarop het bedrag betrekking heeft, aan Onze Minister wie het aangaat een voorstel doen voor het
      bedrag, bedoeld in [artikel 2.6, eerste lid][ref3], of de bedragen, bedoeld in [artikel 2.7, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.2
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in [artikel 2.6, eerste lid][ref1], of
      [artikel 2.7, tweede lid][ref2], houdt Onze Minister wie het aangaat rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.9.2.a
    text: |-
      de bezoldiging voor vergelijkbare functies bij lichamen als bedoeld in [artikel 1.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 2.9.2.b
    text: de bezoldiging in relevante andere sectoren van de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
  - number: 2.9.2.c
    text: de verhouding met de bezoldiging van het overige personeel binnen de betreffende rechtspersonen of instellingen;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
  - number: 2.9.2.d
    text: maatschappelijke opvattingen over de hoogte.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Partijen komen geen uitkeringen overeen wegens beëindiging van het dienstverband, die gezamenlijk meer bedragen dan
      de som van de beloning en de voorzieningen ten behoeve van beloningen betaalbaar op termijn over de twaalf maanden
      voorafgaand aan de beëindiging van het dienstverband, tot ten hoogste € 75 000. In geval van een dienstverband met
      een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse dienstverband bedragen de uitkeringen
      ten hoogste € 75 000, vermenigvuldigd met het aantal uren waarop het dienstverband betrekking heeft en gedeeld door
      het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister kan het bedrag, genoemd in het
      eerste lid, worden gewijzigd, indien de loonontwikkeling hiertoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Voor de toepassing van deze wet wordt bezoldiging over een periode waarin de topfunctionaris vooruitlopend op de
      beëindiging van het dienstverband geen taken meer vervult, aangemerkt als uitkering wegens beëindiging van het
      dienstverband en wordt de datum waarop de topfunctionaris de uitoefening van zijn taken beëindigt aangemerkt als
      datum waarop het dienstverband is geëindigd.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      Het derde lid is niet van toepassing indien de topfunctionaris, in de periode vooruitlopend op de beëindiging
      van het dienstverband, geen taken meer vervult op grond van een algemene bepaling van een collectieve
      arbeidsovereenkomst, een van toepassing zijnde collectieve regeling die is overeengekomen met verenigingen van
      werknemers of ambtenaren die bevoegd zijn afspraken te maken over arbeidsvoorwaarden, of een wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      In afwijking van het eerste lid komen partijen met betrekking tot leden, onderscheidenlijk
      voorzitters, van de hoogst toezichthoudende organen van een rechtspersoon of instelling als bedoeld in
      [artikel 1.2, onderdelen f, g en h][ref1], en [artikel 1.3][ref2] geen uitkeringen wegens beëindiging van een
      dienstverband overeen die meer bedragen dan tien, onderscheidenlijk vijftien procent van de op grond van het eerste
      lid geldende maximale uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.1
    text: |-
      Partijen komen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door Onze Minister wie het
      aangaat voor de toepasselijke in de bijlage bij [artikel 1.4, eerste lid][ref1], aangewezen categorie voor dat jaar
      vastgesteld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.2
    text: |-
      Indien toepassing is gegeven aan [artikel 3.4, eerste lid][ref1], komen partijen geen bezoldiging overeen die
      per kalenderjaar meer bedraagt dan het door Onze Minister wie het aangaat voor de betreffende rechtspersoon of
      organisatie voor dat jaar vastgesteld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.1.3
    text: |-
      In geval van een dienstverband met een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse
      dienstverband, komen partijen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door Onze
      Minister wie het aangaat voor dat jaar vastgestelde bedrag, vermenigvuldigd met het aantal uren waarop het
      dienstverband betrekking heeft en gedeeld door het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      In geval van een dienstverband met een kortere duur dan een kalenderjaar, komen partijen geen bezoldiging overeen
      die meer bedraagt dan het door Onze Minister wie het aangaat voor dat jaar vastgesteld bedrag, vermenigvuldigd met
      het aantal dagen waarop het dienstverband betrekking heeft en gedeeld door 365.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
  - number: 3.1.5
    text: |-
      In geval de functie van topfunctionaris in een periode van achttien maanden voor meer dan twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking, komen partijen met ingang van de eerste dag van de dertiende
      maand in de periode van achttien maanden geen bezoldiging overeen die per kalenderjaar meer bedraagt dan het door
      Onze Minister wie het aangaat voor dat jaar vastgestelde bedrag. Het derde en vierde lid zijn van overeenkomstige
      toepassing. Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de maximale bezoldiging voor
      het geval de functie van topfunctionaris in een periode van achttien maanden voor maximaal twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
  - number: 3.1.6
    text: |-
      Een topfunctionaris die een dienstverband heeft of die werkzaam is bij een gelieerde rechtspersoon, de betreffende
      verantwoordelijke en de verantwoordelijke van de gelieerde rechtspersoon komen geen bezoldiging overeen voor
      zover de som van de bezoldigingen meer bedraagt dan het voor de op de bijlage bij [artikel 1.4, eerste lid][ref1],
      genoemde rechtspersoon geldende bedrag, bedoeld in [artikel 3.3][ref2] of [artikel 3.4, tweede lid][ref3].
      Een topfunctionaris die bij dezelfde op de bijlage bij [artikel 1.4, eerste lid][ref4], genoemde
      rechtspersoon een ander dienstverband heeft of werkzaamheden verricht in een functie anders dan bedoeld in
      [artikel 1.1, onderdeel b][ref5], en de verantwoordelijke komen geen bezoldiging overeen die meer bedraagt dan het
      voor die rechtspersoon geldende bedrag, bedoeld in [artikel 3.3][ref6] of [artikel 3.4, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.1.7
    text: |-
      Het tweede tot en met zesde lid zijn van overeenkomstige toepassing indien voor partijen op grond van
      [artikel 3.4][ref1] een van [artikel 3.1][ref2] afwijkend bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.1
    text: |-
      In afwijking van [artikel 3.1, eerste lid][ref1], komen partijen met betrekking tot de leden, onderscheidenlijk
      voorzitters, van de hoogste toezichthoudende organen van een rechtspersoon of instelling als bedoeld in
      [artikel 1.4][ref2] geen bezoldiging overeen die per kalenderjaar meer bedraagt dan tien, onderscheidenlijk
      vijftien procent van de voor de rechtspersoon of instelling op grond van [artikel 3.1, eerste lid][ref3] of
      [artikel 3.4][ref4] geldende maximale bezoldiging. Bij of krachtens algemene maatregel van bestuur worden
      uitzonderingen vastgesteld ten aanzien waarvan de vorige volzin buiten toepassing wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.2
    text: |-
      [Artikel 3.1, vierde lid][ref1], is van overeenkomstige toepassing op de bezoldiging van de in het eerste lid
      bedoelde leden, onderscheidenlijk voorzitters.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien de functie van lid, onderscheidenlijk
      voorzitter van de hoogste toezichthoudende organen wordt vervuld anders dan op grond van een dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Onze Minister wie het aangaat stelt, in overeenstemming met Onze Minister, een bedrag als bedoeld in
      [artikel 3.1, eerste lid][ref1], jaarlijks vast uiterlijk in de maand november voorafgaand aan het jaar waarop het
      bedrag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.1
    text: |-
      Bij regeling van Onze Minister wie het aangaat, in overeenstemming met Onze Minister, kunnen de verschillende
      rechtspersonen of organisaties binnen een in de bijlage bij [artikel 1.4, eerste lid][ref1], aangewezen
      categorie worden ingedeeld in klassen op grond van criteria die betrekking hebben op onder meer de omvang van de
      rechtspersonen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.4.2
    text: |-
      Onze Minister wie het aangaat kan, in overeenstemming met Onze Minister, gelijktijdig met het bedrag, bedoeld in
      [artikel 3.3][ref1], voor de verschillende klassen een lager bedrag vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.3
    text: |-
      Onze Minister wie het aangaat kan ten aanzien van een rechtspersoon of instelling besluiten dat de toepassing
      van de criteria leidt tot indeling in een bepaalde klasse. Een rechtspersoon of instelling kan Onze Minister wie
      het aangaat verzoeken om in een andere klasse te worden ingedeeld. De ministeriële regeling bevat regels over de
      procedure.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Onze Minister wie het aangaat kan besluiten dat partijen een bij dat besluit vast te stellen hoger bedrag mogen
      overeenkomen dan het toepasselijke bedrag, bedoeld in het tweede of derde lid. Het bedrag is niet hoger dan het
      bezoldigingsmaximum, bedoeld in [artikel 3.1][ref1]. Bij ministeriële regeling kunnen regels worden gesteld over
      de procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.4.5
    text: Van een besluit als bedoeld in het derde en vierde lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      Onze Minister wie het aangaat kan bij ministeriële regeling voor rechtspersonen en instellingen als bedoeld in
      [artikel 3.4, eerste lid][ref1], voor de toepassing van [artikel 3.1, derde lid][ref2], een getal vaststellen
      dat geldt als de omvang van het dienstverband van de leden van toezichthoudende organen als bedoeld in
      [artikel 1.1, onderdeel b, onder 4° en 5°][ref3]. Het getal kan voor voorzitters van toezichthoudende organen
      hoger worden vastgesteld. Het getal is niet hoger dan de in [artikel 3.2][ref4] genoemde percentages, tenzij de
      rechtspersoon of instelling krachtens artikel 3.2 is uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      De betrokken rechtspersonen of instellingen, bedoeld in de bijlage bij [artikel 1.4, eerste lid][ref1], of een
      samenwerkingsverband van deze rechtspersonen of instellingen, kunnen uiterlijk in de maand september voorafgaand
      aan het jaar waarop het bedrag betrekking heeft, aan Onze Minister wie het aangaat een voorstel doen voor het
      bedrag, bedoeld in [artikel 3.3][ref2] of de bedragen, bedoeld in [artikel 3.4, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.2
    text: |-
      Bij de vaststelling van een bedrag als bedoeld in [artikel 3.3][ref1] of [artikel 3.4, tweede lid][ref2], houdt
      Onze Minister wie het aangaat rekening met:


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.2.a
    text: |-
      de bezoldiging voor vergelijkbare functies bij lichamen als bedoeld in [artikel 1.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 3.6.2.b
    text: de bezoldiging in relevante andere sectoren van de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
  - number: 3.6.2.c
    text: de verhouding met de bezoldiging van het overige personeel binnen de betreffende rechtspersonen of instellingen;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
  - number: 3.6.2.d
    text: maatschappelijke opvattingen over de hoogte.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Partijen komen geen uitkeringen overeen wegens beëindiging van het dienstverband, die gezamenlijk meer bedragen dan
      de som van de beloning en de voorzieningen ten behoeve van beloningen betaalbaar op termijn over de twaalf maanden
      voorafgaand aan de beëindiging van het dienstverband, tot ten hoogste € 75 000. In geval van een dienstverband met
      een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse dienstverband bedragen de uitkeringen
      ten hoogste € 75 000, vermenigvuldigd met het aantal uren waarop het dienstverband betrekking heeft en gedeeld door
      het aantal uren van een voltijds dienstverband.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister kan het bedrag, genoemd in het
      eerste lid, worden gewijzigd, indien de loonontwikkeling hiertoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Voor de toepassing van deze wet wordt bezoldiging over een periode waarin de topfunctionaris vooruitlopend op de
      beëindiging van het dienstverband geen taken meer vervult, aangemerkt als uitkering wegens beëindiging van het
      dienstverband en wordt de datum waarop de topfunctionaris de uitoefening van zijn taken beëindigt aangemerkt als
      datum waarop het dienstverband is geëindigd.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Het derde lid is niet van toepassing indien de topfunctionaris, in de periode vooruitlopend op de beëindiging
      van het dienstverband, geen taken meer vervult op grond van een algemene bepaling van een collectieve
      arbeidsovereenkomst, van een van toepassing zijnde collectieve regeling die is overeengekomen met verenigingen van
      werknemers of ambtenaren die bevoegd zijn afspraken te maken over arbeidsvoorwaarden, of een wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.7
  - number: 3.7.5
    text: |-
      In afwijking van het eerste lid komen partijen met betrekking tot leden, onderscheidenlijk
      voorzitters, van de hoogst toezichthoudende organen van een rechtspersoon of instelling als bedoeld in
      [artikel 1.2, onderdelen f, g en h][ref1], en [artikel 1.3][ref2] geen uitkeringen wegens beëindiging van een
      dienstverband overeen die meer bedragen dan tien, onderscheidenlijk vijftien procent van de op grond van het eerste
      lid geldende maximale uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '1'
        paragraaf: '1'
  - number: 4.1.1
    text: |-
      In het financieel verslaggevingsdocument worden van iedere topfunctionaris de bij regeling van Onze Minister vast
      te stellen gegevens inzake bezoldiging of uitkering wegens beëindiging van het dienstverband vermeld. De gegevens
      over een topfunctionaris bevatten in ieder geval diens naam.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      In het financieel verslaggevingsdocument worden ten aanzien van een ieder in dienstbetrekking, anders dan degenen
      bedoeld in het eerste lid, en van wie de bezoldiging van diens functie of functies de maximale bezoldiging, bedoeld
      in [artikel 2.3, eerste lid][ref1], te boven is gegaan de bij regeling van Onze Minister vast te stellen gegevens
      vermeld, waarbij [artikel 2.1, tweede lid][ref2], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 4.1.3
    text: |-
      Met het oog op het beperken van de informatieverplichtingen op grond van deze wet kunnen bij regeling van Onze
      Minister nadere regels worden gesteld ten aanzien van het eerste en tweede lid, alsmede kan worden voorzien in een
      beperking of vrijstelling van de in het eerste en tweede lid bedoelde openbaarmakingsplicht.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Het in het eerste en tweede lid genoemde financieel verslaggevingsdocument wordt openbaar gemaakt. Bij regeling van
      Onze Minister worden hiertoe nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Bij ministeriële regeling van Onze Minister wie het aangaat kan worden bepaald dat de verantwoordelijke tevens
      langs elektronische weg uiterlijk op 1 juli van het jaar volgend op het boekjaar de gegevens bedoeld in het eerste
      en tweede lid aan Onze Minister wie het aangaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Rechtspersonen en instellingen die de op grond van [artikel 4.1, eerste en tweede lid][ref1], vastgestelde gegevens
      inzake bezoldiging of uitkering wegens beëindiging van het dienstverband in het financieel verslaggevingsdocument
      opnemen, kunnen afzien van het opnemen in dat document van de verantwoording van bezoldigingsinformatie op grond
      van de [artikel 383, eerste lid][ref2], en [artikel 383c van Boek 2 van het Burgerlijk Wetboek][ref3] voor zover op
      hen van toepassing. Bij regeling van Onze Minister kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel383c
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 383c
  - number: 5.1.1
    text: |-
      Met het toezicht op de naleving van deze wet zijn belast de bij besluit van Onze Minister wie het aangaat
      aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.1
  - number: 5.1.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      De accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], meldt
      een onverschuldigde betaling aan Onze Minister indien een vordering uit onverschuldigde betaling op een
      topfunctionaris, en in de gevallen waarin een topfunctionaris de opgedragen taken vervult anders dan op grond van
      een dienstbetrekking, op de natuurlijke persoon of rechtspersoon die de topfunctionaris ter beschikking stelt:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 5.2.1.a
    text: niet in het financieel verslaggevingsdocument is opgenomen, of
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.2
  - number: 5.2.1.b
    text: |-
      op het tijdstip waarop de accountant zijn oordeel geeft over het financieel verslaggevingsdocument door de
      betrokken topfunctionaris of, in de gevallen waarin een topfunctionaris de opgedragen taken vervult anders dan
      op grond van een dienstbetrekking, de natuurlijke persoon of rechtspersoon die de topfunctionaris ter beschikking
      stelt nog niet is terugbetaald.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
      Indien het financieel verslaggevingsdocument bedoeld in [artikel 4.1][ref1], niet de juiste voorgeschreven gegevens
      bevat, meldt de accountant de ontbrekende gegevens aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      De Belastingdienst, het Uitvoeringsinstituut Werknemersverzekeringen, pensioenfondsen, alsmede verzekeraars aan wie
      betalingen zijn verricht ten behoeve van een beloning betaalbaar op termijn of een uitkering wegens beëindiging van
      het dienstverband, zijn verplicht desgevraagd aan Onze Minister wie het aangaat kosteloos opgaven en inlichtingen
      te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Onze Minister wie het aangaat is ter handhaving van deze wet bevoegd om partijen een last onder dwangsom op te
      leggen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Van een last onder dwangsom als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Onze Minister wie het aangaat kan verbeurde dwangsommen verrekenen met bestaande vorderingen van de rechtspersoon
      die de dwangsom heeft verbeurd op Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Indien de opgelegde last niet wordt uitgevoerd, eist Onze Minister wie het aangaat, onder intrekking van de last
      onder dwangsom, de in de last vermelde onverschuldigde betalingen op van de topfunctionaris. Met de bekendmaking
      van het besluit tot opeisen vervalt de vordering uit onverschuldigde betaling. De opgeëiste bedragen komen toe aan
      de Staat.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.5
  - number: 5.5.2
    text: |-
      In de gevallen waarin een topfunctionaris de opgedragen taken uitvoert anders dan op grond van een dienstbetrekking
      kan de onverschuldigde betaling worden opgeëist van de topfunctionaris en de natuurlijke of rechtspersoon die de
      topfunctionaris ter beschikking heeft gesteld gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      De opgeëiste bedragen worden binnen drie weken voldaan. Onze Minister wie het aangaat kan de opgeëiste bedragen
      bij dwangbevel invorderen. De [artikelen 5:38][ref1] en [5:39 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.5.4
    text: |-
      Onze Minister wie het aangaat eist geen onverschuldigde betaling op als de vordering uit onverschuldigde betaling
      is verjaard. De last, bedoeld in [artikel 5.4][ref1], stuit de verjaring. Onze Minister wie het aangaat kan de
      verjaring van de vordering uit onverschuldigde betaling stuiten door hiervan mededeling te doen aan partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel5
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '5'
        paragraaf: '5'
  - number: 5.6.1
    text: |-
      Onze Minister wie het aangaat is bevoegd tot openbaar maken van de gegevens voor zover deze op grond van
      [artikel 4.1][ref1] hadden moeten worden opgenomen in het financieel verslaggevingsdocument. Openbaarmaking
      geschiedt zoveel mogelijk op de voor het financieel verslaggevingsdocument voorgeschreven wijze, alsmede door
      publicatie in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
        paragraaf: '4'
  - number: 5.6.2
    text: |-
      De verantwoordelijke is de kosten verbonden aan de openbaarmaking, bedoeld in het eerste lid, verschuldigd.
      Onder deze kosten zijn mede begrepen de kosten van het opstellen van het openbaar te maken document. Bij algemene
      maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop het bedrag van de kosten wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.6
  - number: 5.6.3
    text: |-
      Onze Minister wie het aangaat kan van de verantwoordelijke bij dwangbevel de ingevolge het tweede lid verschuldigde
      kosten invorderen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel5.6
  - number: 7.1.1
    text: |-
      Onze Minister zendt jaarlijks voor 31 december aan de Staten-Generaal een overzicht van de geconstateerde
      overtredingen en de getroffen handhavingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Ten behoeve van het overzicht, bedoeld in het eerste lid, verstrekken Onze Ministers wie het aangaan aan Onze
      Minister alle gegevens van de geconstateerde overtredingen en de getroffen handhavingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Onze Minister zendt in 2020, en vervolgens telkens na vijf jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      In afwijking van [artikel 2.1][ref1] onderscheidenlijk [artikel 3.1][ref2], is een voorafgaand aan
      de inwerkingtreding van deze wet tussen partijen overeengekomen bezoldiging die meer bedraagt dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref3], zoals dit artikel luidde op de dag voorafgaande aan
      de inwerkingtreding van de [Wet verlaging bezoldigingsmaximum WNT][ref4], onderscheidenlijk het bedrag,
      bedoeld in [artikel 3.3][ref5], toegestaan voor ten hoogste vier jaar na inwerkingtreding van deze wet. De
      bezoldiging, bedoeld in de vorige volzin, wordt slechts verhoogd, indien deze verhoging en de wijze waarop
      deze wordt berekend voorafgaand aan de inwerkingtreding van deze wet tussen partijen zijn overeengekomen. De
      [artikelen 5.4 tot en met 5.6][ref6] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
