        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039454
  - number: 7.3b.2
    text: |-
      Indien een dienstverband waarop dit artikel van toepassing is wordt verlengd, blijft dit artikel na de verlenging
      buiten verdere toepassing.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.3b
  - number: 7.4.1
    text: |-
      Indien op enig moment de bezoldiging van een minister ten minste € 500 hoger is dan het bedrag genoemd in
      [artikel 2.3, eerste lid][ref1], kan dat bedrag bij regeling van Onze Minister worden gewijzigd in het bedrag van
      de bezoldiging van een minister, en wordt naar boven afgerond op een duizendvoud in euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 7.4.2
    text: |-
      De ministeriële regeling, bedoeld in het eerste lid, treedt in werking met ingang van 1 januari van het jaar
      volgend op het jaar waarin de verhoging van de bezoldiging van een minister in werking is getreden. Indien
      de verhoging van de bezoldiging van een minister in enig jaar van kracht is geworden voor 1 december, wordt
      terugwerkende kracht verleend aan deze ministeriële regeling tot 1 januari van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.4
  - number: 7.4a.1
    text: |-
      Zolang de algemene maatregel van bestuur, bedoeld in de [artikelen 2.1, vierde lid][ref1], en
      [3.1, vijfde lid][ref2], nog niet in werking is getreden, blijven deze wet en de daarop rustende bepalingen,
      zoals deze luidden op de dag voor de inwerkingtreding van de [Wet verlaging bezoldigingsmaximum WNT][ref3],
      van toepassing ten aanzien van topfunctionarissen die hun functie vervullen anders dan op grond van een
      dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0036047
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0036047
  - number: 7.4a.2
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld over het overgangsrecht
      ten aanzien van voorafgaande aan de inwerkingtreding van de algemene maatregel van bestuur tussen partijen
      overeengekomen bezoldigingen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.4a
  - number: '7.5'
    text: |-
      Een verzoek tot het nemen van een besluit als bedoeld in de [artikelen 2.4, eerste lid][ref1],
      [2.6, tweede lid][ref2], [2.7, derde en vierde lid][ref3], en [3.4, derde en vierde lid][ref4], wordt genomen
      binnen zestien weken na ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel3
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.5
