  - number: 1.3.1.c
    text: |-
      in Nederland gevestigde rechtspersonen die voor een periode van drie achtereenvolgende kalenderjaren een of meer
      subsidies hebben ontvangen, die samen per kalenderjaar ten minste € 500.000 bedragen en ten minste 50% uitmaken van
      de opbrengsten van de rechtspersoon in dat kalenderjaar, met uitzondering van die rechtspersonen die zijn opgenomen
      in de bijlagen bij de [artikelen 1.4, eerste lid][ref1], en [1.5, eerste lid][ref2], en met uitzondering van
      naamloze en besloten vennootschappen die een op winst gerichte onderneming drijven;


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.3
