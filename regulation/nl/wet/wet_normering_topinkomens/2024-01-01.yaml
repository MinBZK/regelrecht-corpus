  - number: 7.3.6
    text: |-
      Een beding in afwijking van [artikel 2.10, eerste lid][ref1], onderscheidenlijk [artikel 3.7, eerste lid][ref2],
      is, indien het beding is overeengekomen voorafgaand aan de inwerkingtreding van deze wet, dan wel voorafgaand
      aan de inwerkingtreding van de wijziging van de bijlage bij [artikel 1.3, eerste lid, onderdeel d of e][ref3],
      of [artikel 1.4, eerste lid][ref4], waardoor deze wet van toepassing is geworden op de betreffende rechtspersoon
      of instelling, dan wel voorafgaand aan de aanvraag van de subsidiebeschikking waardoor deze wet van toepassing is
      geworden op de betreffende rechtspersoon of instelling, toegestaan voor ten hoogste vier jaar na inwerkingtreding
      van deze wet dan wel de wijziging van de bijlage dan wel de bekendmaking van de subsidiebeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel1
