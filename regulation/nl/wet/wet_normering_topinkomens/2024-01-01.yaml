$id: wet_normering_topinkomens
regulatory_layer: WET
publication_date: '2015-05-08'
valid_from: '2024-01-01'
bwb_id: BWBR0032249
url: https://wetten.overheid.nl/BWBR0032249/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat de regels betreffende de openbaarmaking van
    topinkomens in de publieke en semipublieke sector worden uitgebreid met regels betreffende de hoogte van deze
    inkomens;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *verantwoordelijke:* 1°. Onze Ministers,
      bedoeld in de [artikelen 2.1, tweede lid][ref1], en [2.8, tweede lid, van de Comptabiliteitswet 2016][ref2];
      2°. gedeputeerde staten van de provincies; 3°. de colleges van burgemeester en wethouders van de gemeenten; 4°.
      de dagelijkse besturen van de waterschappen; 5°. de dagelijkse besturen van de openbare lichamen voor beroep
      en bedrijf; 6°. de organen van een rechtspersoon als bedoeld in [artikel 1.2, onderdelen f, g en h][ref3], die
      eindverantwoordelijk zijn voor de binnen de rechtspersoon betaalde bezoldiging of bij of krachtens de wet belast
      zijn met het vaststellen van een financieel verslaggevingsdocument, en 7°. de organen van een rechtspersoon of het
      bevoegd gezag van een instelling als bedoeld in [artikel 1.3][ref4], [artikel 1.4][ref5] of [artikel 1.5][ref6],
      die eindverantwoordelijk zijn voor de binnen de rechtspersoon of organisatie betaalde bezoldiging of bij of
      krachtens de wet belast zijn met het vaststellen van een financieel verslaggevingsdocument;
        - *topfunctionaris:* 1°. de secretarissen-generaal, de directeuren-generaal, de inspecteurs-generaal en de
      overige leden van de topmanagementgroep bij het Rijk, de vice-admiraals, de generaals, de luitenant-admiraals
      en de luitenant-generaals, degene of degenen die zijn belast met de dagelijkse leiding van de colleges, bedoeld
      in [artikel 1.1, van de Comptabiliteitswet 2016][ref7], alsmede de leden van een zelfstandig bestuursorgaan
      zonder rechtspersoonlijkheid en de hoogste ondergeschikte of de leden van de groep hoogste ondergeschikten aan
      dat orgaan en degene of degenen die zijn belast met de dagelijkse leiding van dat orgaan; 2°. de secretarissen
      bij de provincies, de gemeenten en de waterschappen en de griffiers bij de provincies en de gemeenten; 3°. de
      voorzitters en secretarissen van de openbare lichamen voor beroep en bedrijf, de hoogste ondergeschikte of de
      leden van de groep hoogste ondergeschikten aan het bestuur en degene of degenen belast met de dagelijkse leiding
      van het gehele openbaar lichaam; 4°. de leden van de hoogste uitvoerende en toezichthoudende organen van een
      rechtspersoon als bedoeld in [artikel 1.2, onderdelen f, g en h][ref8], alsmede de hoogste ondergeschikte of de
      leden van de groep hoogste ondergeschikten aan dat orgaan en degene of degenen belast met de dagelijkse leiding van
      de gehele rechtspersoon; 5°. de leden van de hoogste uitvoerende en toezichthoudende organen van een rechtspersoon
      of instelling als bedoeld in [artikel 1.3][ref9], [artikel 1.4][ref10] of [artikel 1.5][ref11], alsmede de hoogste
      ondergeschikte of de leden van de groep hoogste ondergeschikten aan dat orgaan en degene of degenen belast met
      de dagelijkse leiding van de gehele rechtspersoon of de gehele instelling; 6°. degene die een functie als bedoeld
      onder 1° tot en met 5° voor een periode van ten minste twaalf kalendermaanden heeft vervuld en daarna bij dezelfde
      rechtspersoon of instelling een dienstverband behoudt, voor een periode van vier jaar vanaf het tijdstip dat niet
      langer de functie als bedoeld onder 1° tot en met 5° wordt vervuld, met uitzondering van bij regeling van Onze
      Minister aan te wijzen functies;
        - *partijen:* de rechtspersoon waartoe de verantwoordelijke behoort en de topfunctionaris die een bezoldiging zijn
      overeengekomen als tegenprestatie voor de uitvoering van de aan de topfunctionaris opgedragen taken en, ingeval
      een topfunctionaris de opgedragen taken vervult anders dan op grond van een dienstbetrekking, tevens de natuurlijke
      persoon of rechtspersoon die de topfunctionaris ter beschikking stelt;
        - *dienstverband:* aanstelling, arbeidsovereenkomst of andere titel op grond waarvan de topfunctionaris tegen
      betaling zijn opgedragen taken vervult;
        - *bezoldiging:* de som van de beloning, de belastbare vaste en variabele onkostenvergoedingen en de beloningen
      betaalbaar op termijn, met uitzondering van de omzetbelasting, dan wel, indien een functie wordt vervuld anders dan
      op grond van een dienstbetrekking, de som van de vergoedingen voor het vervullen van de functie, met uitzondering
      van de vergoedingen die bij een functievervulling op grond van een dienstbetrekking onbelast zouden zijn, en met
      uitzondering van de omzetbelasting;
        - *beloning:* de som van de periodiek betaalde beloningen en de winstdelingen en bonusbetalingen, met uitzondering
      van belastbare vaste en variabele onkostenvergoedingen en met uitzondering van door werkgevers wettelijk of
      krachtens een algemeen verbindend verklaarde collectieve arbeidsovereenkomst verschuldigde niet op de beloning
      ingehouden sociale verzekeringspremies;
        - *dienstbetrekking:* dienstbetrekking of fictieve dienstbetrekking in de zin van de
      [Wet op de loonbelasting 1964][ref12];
        - *beloningen betaalbaar op termijn:* het werkgeversdeel van de beloningen betaalbaar op termijn met uitzondering
      van het werkgeversdeel van de beloningen betaalbaar op termijn die betrekking hebben op de beëindiging van het
      dienstverband;
        - *uitkeringen wegens beëindiging van het dienstverband:* de som van uitkeringen bij beëindiging van het
      dienstverband en beloningen betaalbaar op termijn die betrekking hebben op de beëindiging van het dienstverband,
      met uitzondering van uitkeringen die voortvloeien uit een algemene bepaling van een collectieve arbeidsovereenkomst
      of van een van toepassing zijnde collectieve regeling die is overeengekomen met verenigingen van werknemers of
      ambtenaren die bevoegd zijn afspraken te maken over arbeidsvoorwaarden, of uit een wettelijk voorschrift;
        - *financieel verslaggevingsdocument:* jaarverslag als bedoeld in
      [artikel 2.31 van de Comptabiliteitswet 2016][ref13], jaarrekening als bedoeld in
      [artikel 201 van de Provinciewet][ref14], jaarrekening als bedoeld in [artikel 197 van de Gemeentewet][ref15] of
      jaarrekening in de zin van [Boek 2, titel 9, van het Burgerlijk Wetboek][ref16] dan wel, indien deze artikelen niet
      van toepassing zijn, een ander bij of krachtens de wet voorgeschreven document dat jaarlijks wordt opgesteld tot
      verschaffing van inzicht in de financiële positie van een rechtspersoon of een organisatie van een rechtspersoon;
        - *betaling:* ten laste van de rechtspersoon waartoe de verantwoordelijke behoort verrichte betaling wegens
      bezoldiging of uitkering wegens beëindiging van het dienstverband 1°. aan de topfunctionaris, of 2°. ingeval
      een topfunctionaris de opgedragen taken vervult anders dan op grond van een dienstbetrekking, aan de natuurlijke
      persoon of rechtspersoon die de topfunctionaris ter beschikking stelt, of 3°. ten behoeve van de topfunctionaris
      aan derden;
        - *boekjaar:* het jaar waarop het financieel verslaggevingsdocument betrekking heeft;
        - *gelieerde rechtspersoon:* andere dan krachtens publiekrecht ingestelde rechtspersoon, waarop niet reeds op grond
      van een andere bepaling van deze wet [paragrafen 2][ref17], [3][ref18] of [4][ref19] van toepassing zijn, 1°. die
      door een in de bijlage bij [artikel 1.3, eerste lid, onderdeel d of e][ref20], of [artikel 1.4, eerste lid][ref21],
      opgenomen rechtspersoon is opgericht of mede is opgericht, of 2°. waarin een orgaan of functionaris van een in
      de bijlage bij [artikel 1.3, eerste lid, onderdeel d of e][ref22], of [artikel 1.4, eerste lid][ref23], opgenomen
      rechtspersoon namens de rechtspersoon een of meer leden in het bestuur benoemt of op andere wijze invloed van
      betekenis heeft op het beheer of beleid;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *Onze minister wie het aangaat:* 1°. ten aanzien van de rechtspersonen, bedoeld in
      [artikel 1.2, eerste lid][ref24]: Onze minister, dan wel, ten aanzien van de zelfstandige bestuursorganen
      zonder rechtspersoonlijkheid, de openbare lichamen, bedoeld in artikel 1.2, eerste lid, onderdelen e en f,
      onderscheidenlijk de rechtspersonen, bedoeld in artikel 1.2, eerste lid, onderdeel h, Onze minister op wiens
      beleidsterrein het zelfstandig bestuursorgaan, het openbaar lichaam, het andere lichaam of de rechtspersoon
      werkzaam is, of, ten aanzien van een openbaar lichaam ingesteld op grond van de Wet gemeenschappelijke regelingen:
      Onze minister; 2°. ten aanzien van de rechtspersonen, bedoeld in [artikel 1.3, eerste lid, onderdeel a][ref25]:
      Onze minister op wiens beleidsterrein het betreffende orgaan werkzaam is; 3°. ten aanzien van de
      rechtspersonen, bedoeld in [artikel 1.3, eerste lid, onderdeel b][ref26]: Onze minister die het orgaan,
      bedoeld in [artikel 1.3, eerste lid, onderdeel b][ref27], is dat een of meer leden van het bestuur van de
      rechtspersoon benoemt of op andere wijze invloed heeft op het beheer of beleid van de rechtspersoon, dan
      wel, indien het orgaan geen minister is, Onze minister; 4°. ten aanzien van de rechtspersonen, bedoeld in
      [artikel 1.3, eerste lid, onderdeel c][ref28]: Onze minister, dan wel, indien de rechtspersoon ten laste van de
      begroting van een van Onze andere ministers een of meer subsidies ontvangt van ten minste € 500.000, Onze andere
      minister die de hoogste subsidie verstrekt; 5°. ten aanzien van de rechtspersonen en instellingen, bedoeld in de
      [artikelen 1.3, eerste lid, onderdeel d][ref29], [1.4, eerste lid][ref30] en [artikel 1.5, eerste lid][ref31]:
      Onze minister die belast is met de leiding van het in de bijlage aangegeven ministerie; 6°. ten aanzien van de
      rechtspersonen, bedoeld in [artikel 1.3, eerste lid, onderdeel e][ref32]: Onze minister van Onderwijs, Cultuur
      en Wetenschap.


