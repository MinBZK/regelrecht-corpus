      [ref1]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0032249
  - number: 1.3.1.e
    text: |-
      de in [bijlage 2][ref1] bij deze wet opgenomen verenigingen van onderwijsinstellingen die voor hun leden optreden
      als werkgeversvertegenwoordiger bij collectieve arbeidsovereenkomsten of als vertegenwoordiger in overleg met de
      centrale overheid.


