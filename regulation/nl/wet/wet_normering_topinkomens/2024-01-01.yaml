  - number: 2.1.6
    text: |-
      Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing indien voor partijen op grond van
      [artikel 2.4][ref1], [2.5][ref2], [2.6][ref3] of [2.7][ref4] een van [artikel 2.3][ref5] afwijkend bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
