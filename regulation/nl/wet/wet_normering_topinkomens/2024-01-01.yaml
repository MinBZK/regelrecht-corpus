  - number: 7.3a.2
    text: |-
      In het geval, bedoeld in het eerste lid, wordt na het verstrijken van de periode van drie jaar, bedoeld in
      [artikel 7.3, achtste lid][ref1], de bezoldiging in een periode van twee jaar teruggebracht naar het voor de
      rechtspersoon of instelling geldende maximum. Met ingang van het eerste jaar wordt de bezoldiging verlaagd naar
      het op de dag voorafgaande aan de inwerkingtreding van de [Wet verlaging bezoldigingsmaximum WNT][ref2] voor de
      rechtspersoon of instelling geldende maximum. In het tweede jaar bedraagt de verlaging de helft van het verschil
      tussen het op de dag voorafgaand aan de inwerkingtreding van de Wet verlaging bezoldigingsmaximum WNT geldende
      maximum en het geldende maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0036047
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.3a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0036047
  - number: 7.3a.3
    text: |-
      Dit artikel is niet van toepassing ten aanzien van de in [artikel 2.2][ref1] bedoelde leden, onderscheidenlijk
      voorzitters van de hoogste toezichthoudende organen.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.3a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 7.3b.1
    text: |-
      [Artikel 1.1, onderdeel b, onder 6°][ref1], is niet van toepassing op de functionaris met een dienstverband als
      topfunctionaris dat is aangegaan voor inwerkingtreding van de [Evaluatiewet WNT][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039454
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel7.3b
    references:
