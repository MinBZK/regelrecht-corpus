  - number: 2.2.1
    text: |-
      In afwijking van [artikel 2.1, eerste lid,][ref1] komen partijen met betrekking tot de leden, onderscheidenlijk
      voorzitters, van de hoogste toezichthoudende organen van een rechtspersoon of instelling als bedoeld in
      [artikel 1.2, onderdelen f, g en h][ref2] en [artikel 1.3][ref3] geen bezoldiging overeen die per kalenderjaar
      meer bedraagt dan tien, onderscheidenlijk vijftien procent van de voor de rechtspersoon of instelling op grond van
      [artikel 2.3][ref4], [artikel 2.5][ref5], [artikel 2.6][ref6] of [artikel 2.7][ref7] geldende maximale bezoldiging.
      Bij of krachtens algemene maatregel van bestuur worden uitzonderingen vastgesteld ten aanzien waarvan de vorige
      volzin buiten toepassing wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
