  - number: 1.5a
    text: |-
      Deze wet is niet van toepassing op het deel van de werkzaamheden als arts, tandarts of apotheker als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], de werkzaamheden in een specialisme
      van die beroepen als bedoeld bij of krachtens [artikel 14 van die wet][ref2] alsmede de werkzaamheden als klinisch
      chemicus of als klinisch fysicus van degene die bij of krachtens [artikel 34 van die wet][ref3] gerechtigd is die
      titel te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.5a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0006251
        artikel: '34'
  - number: 1.6.1
    text: |-
      Voor zover partijen een hogere bezoldiging overeenkomen dan bij of krachtens deze wet is toegestaan, bedraagt de
      bezoldiging van rechtswege het bedrag dat ten hoogste is toegestaan. Betalingen die dat bedrag overschrijden, zijn
      onverschuldigd betaald.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Voor zover partijen een hogere uitkering wegens beëindiging van het dienstverband overeenkomen dan bij of krachtens
      deze wet is toegestaan, bedraagt de uitkering van rechtswege het bedrag dat ten hoogste is toegestaan. Betalingen
      die dat bedrag overschrijden, zijn onverschuldigd betaald, tenzij de betaling voortvloeit uit een rechterlijke
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6
  - number: 1.6.3
    text: |-
      Indien een onverschuldigde betaling niet ongedaan is gemaakt voor 1 juli van het jaar volgend op het jaar waarin de
      onverschuldigde betaling heeft plaatsgevonden, wordt over de onverschuldigde betaling rente in rekening gebracht.
      Deze rente is gelijk aan de ingevolge [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1]
      bij algemene maatregel van bestuur vastgestelde wettelijke rente, bedoeld in
      [artikel 119 van Boek 6 van dat wetboek][ref2], met dien verstande dat die ten minste vier procent bedraagt. Deze
      rente wordt enkelvoudig berekend over het tijdvak dat aanvangt op 1 januari van het jaar nadat de onverschuldigde
      betaling heeft plaatsgevonden en eindigt op de dag voorafgaand aan die van ongedaanmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '119'
  - number: 1.6.4
    text: |-
      Ieder beding tussen partijen houdende kwijtschelding van een onverschuldigde betaling of een schenking die met de
      onverschuldigde betaling wordt verrekend, is nietig.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6
  - number: 1.6a.1
    text: |-
      Indien een topfunctionaris met verschillende rechtspersonen of instellingen waarop [paragraaf 2][ref1]
      of [3][ref2] van toepassing is een dienstbetrekking aangaat als topfunctionaris, niet zijnde als
      lid, onderscheidenlijk voorzitter van de hoogste toezichthoudende organen van die rechtspersonen of
      instellingen, bedraagt de som van de bezoldigingen niet meer dan de maximale bezoldiging, bedoeld in
      [artikel 2.3, eerste lid][ref3], dan wel een voor een van de dienstbetrekkingen van toepassing zijnd hogere
      bezoldigingsmaximum.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6a
    references:
      - id: ref1
        bwb_id: BWBR0032249
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032249
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 1.6a.2
    text: |-
      Voor zover partijen een hogere bezoldiging overeenkomen dan op grond van het eerste lid is toegestaan, is het
      deel van de betalingen dat dit maximum overschrijdt ten aanzien van de meest recent overeengekomen bezoldiging
      onverschuldigd betaald.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6a
  - number: 1.6a.3
    text: |-
      Indien het eerste lid van toepassing is informeert de topfunctionaris onverwijld de rechtspersoon of instelling
      waarbij hij reeds een dienstbetrekking heeft, alsmede de rechtspersoon of instelling met waarmee hij een
      dienstbetrekking aangaat.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.6a
  - number: '1.7'
    text: |-
      Voor zover zulks niet reeds uit een ander wettelijk voorschrift voortvloeit, worden de bij of krachtens deze wet
      in het financieel verslaggevingsdocument op te nemen gegevens onderworpen aan het oordeel van een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], tenzij bij regeling van Onze
      Minister anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '1.8'
    text: |-
      Ten aanzien van personen over wie Onze Minister zulks besluit, wordt tot de bezoldiging in de zin van deze wet niet
      gerekend de loonbestanddelen die betrekking hebben op getroffen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.8
  - number: '1.9'
    text: 'Onze Minister kan bij ministeriële regeling nadere regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.9
  - number: 1.9.a
    text: hetgeen tot de bezoldiging wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.9
  - number: 1.9.b
    text: de toerekening van onderdelen van de bezoldiging aan enig kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.9
  - number: 1.9.c
    text: hetgeen tot de uitkeringen wegens beëindiging van het dienstverband wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.9
  - number: 1.9.d
    text: |-
      de controle van het financieel verslaggevingsdocument door de accountant op de naleving van deze wet en de daarop
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.9
  - number: '1.10'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister wie het aangaat, beleidsregels vaststellen met betrekking
      tot de uitoefening van een op grond van deze wet of de daarop berustende bepalingen aan Onze Minister wie het
      aangaat toekomende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel1.10
  - number: 2.1.1
    text: |-
      Partijen komen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de maximale bezoldiging, bedoeld
      in [artikel 2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.2
    text: |-
      In geval van een dienstverband met een kleinere omvang dan het bij de verantwoordelijke gebruikelijk voltijdse
      dienstverband, komen partijen geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de maximale
      bezoldiging, bedoeld in [artikel 2.3][ref1], vermenigvuldigd met het aantal uren waarop het dienstverband
      betrekking heeft en gedeeld door het aantal uren van een voltijds dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.3
    text: |-
      In geval van een dienstverband met een kortere duur dan een kalenderjaar, komen partijen geen bezoldiging overeen
      die meer bedraagt dan de maximale bezoldiging, bedoeld in [artikel 2.3][ref1], vermenigvuldigd met het aantal dagen
      waarop het dienstverband betrekking heeft en gedeeld door 365.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.4
    text: |-
      In geval de functie van topfunctionaris in een periode van achttien maanden voor meer dan twaalf maanden wordt
      vervuld anders dan op grond van een dienstbetrekking, komen partijen met ingang van de eerste dag van de dertiende
      maand in de periode van achttien maanden geen bezoldiging overeen die per kalenderjaar meer bedraagt dan de
      maximale bezoldiging, bedoeld in [artikel 2.3][ref1]. Het tweede en derde lid zijn van overeenkomstige toepassing.
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de maximale bezoldiging voor het geval
      de functie van topfunctionaris in een periode van achttien maanden voor maximaal twaalf maanden wordt vervuld
      anders dan op grond van een dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
    url: https://wetten.overheid.nl/BWBR0032249/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
        paragraaf: '2'
  - number: 2.1.5
    text: |-
      Een topfunctionaris die een dienstverband heeft of die werkzaam is bij een gelieerde rechtspersoon of bij een
      rechtspersoon als bedoeld in [artikel 1.3, eerste lid, onderdeel b][ref1], de betreffende verantwoordelijke en de
      verantwoordelijke van de gelieerde rechtspersoon of de rechtspersoon, bedoeld in artikel 1.3, eerste lid, onderdeel
      b, komen geen bezoldiging overeen voor zover de som van de bezoldigingen meer bedraagt dan de maximale bezoldiging,
      bedoeld in [artikel 2.3][ref2]. Een topfunctionaris die bij dezelfde rechtspersoon een ander dienstverband
      heeft of werkzaamheden verricht in een functie anders dan bedoeld in [artikel 1.1, onderdeel b][ref3], en
      de verantwoordelijke komen geen bezoldiging overeen die meer bedraagt dan de maximale bezoldiging bedoeld in
      [artikel 2.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0032249#Artikel2
