  - number: '8'
    text: |-
      Het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1], met inbegrip van de regels die zijn toepasselijkheid in
      internationale gevallen bepalen, is van toepassing met betrekking tot de arbeidsovereenkomst van een werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002014
    url: https://wetten.overheid.nl/BWBR0005703/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002014
  - number: '10'
    text: |-
      1 Onverminderd het bepaalde in de [derde afdeling van de tweede titel van het eerste boek](onbekend) en de [tweede
      afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend) is de
      kantonrechter van de rechtbank te Alkmaar bevoegd kennis te nemen van geschillen terzake van de arbeidsovereenkomst
      van een werknemer en omtrent de toepassing van deze wet.

      2 Uitspraken over dergelijke geschillen kunnen met toepassing van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op het continentaal plat worden ten uitvoer gelegd. Onverminderd
      het bepaalde in [artikel 438 van het Wetboek van Burgerlijke Rechtsvordering][ref2] is de rechtbank te Alkmaar
      bevoegd kennis te nemen van geschillen die in verband met een executie van deze uitspraken rijzen. Onverminderd
      het bepaalde in [artikel 700 van het genoemde wetboek][ref3] kan verlof voor het leggen van conservatoir beslag op
      goederen gelegen op het continentaal plat worden verzocht aan de voorzieningenrechter van deze rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel438
