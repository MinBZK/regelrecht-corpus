  - number: '2'
    text: |-
      Het Nederlandse arbeidsovereenkomstenrecht, met inbegrip van de daarop betrekking hebbende regels van
      internationaal privaatrecht, is van toepassing met betrekking tot de arbeidsovereenkomst van een werknemer. Voor
      de toepassing van de regels van internationaal privaatrecht geldt arbeid verricht door een werknemer als arbeid
      verricht op het grondgebied van Nederland.
    url: https://wetten.overheid.nl/BWBR0005703/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Dit artikel is van toepassing op werknemers die niet verzekerd zijn ingevolge de [Ziektewet][ref1] en op wie niet
      enige daarmee overeenkomende wettelijke regeling van een lidstaat van de Europese Unie van toepassing is en op wier
      arbeidsovereenkomst het Nederlandse arbeidsovereenkomstenrecht van toepassing is althans de dwingend rechtelijke
      bepalingen daarvan.

      2 De werknemer die ten gevolge van ziekte verhinderd is de bedongen arbeid te verrichten, heeft het in
      [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] bedoelde recht op loon gedurende een tijdvak
      van 104 weken, ongeacht of zijn arbeidsovereenkomst gedurende dat tijdvak eindigt.

      3 Van de bepalingen van dit artikel kan niet ten nadele van de werknemer worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0005703/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
  - number: '4'
    text: |-
      1 Dit artikel is van toepassing op werknemers op wie terzake van geneeskundige verzorging niet van toepassing is
      de [Zorgverzekeringswet][ref1] of enige daarmee overeenkomende wettelijke regeling van een lidstaat van de Europese
      Gemeenschappen, en op wier arbeidsovereenkomst het Nederlands arbeidsovereenkomstenrecht van toepassing is althans
      de dwingend rechtelijke bepalingen daarvan.

      2 De werkgever is verplicht er op toe te zien dat een werknemer voldoende verzekerd is tegen het risico van kosten
      van

      a. zijn geneeskundige verzorging en behandeling gedurende de arbeidsovereenkomst en

      b. zijn voortgezette geneeskundige verzorging en behandeling gedurende ten hoogste 52 weken na het einde van de
      arbeidsovereenkomst.

      3 Voor de toepassing van het tweede lid wordt onder voldoende verzekering verstaan een verzekering die, wat betreft
      de soort en de omvang van de verzekerde risico's, een dekking geeft die vergelijkbaar is met hetgeen daaromtrent
      bij of krachtens de [Zorgverzekeringswet][ref2] is bepaald. Onze Minister van Sociale Zaken en Werkgelegenheid kan
      nadere regelen stellen betreffende een zodanige verzekering.

      4 Indien de werkgever zijn in de voorgaande leden bedoelde verplichting niet of niet voldoende is nagekomen, is hij
      jegens de werknemer aansprakelijk voor de in het tweede lid onder *a* en *b* genoemde kosten, indien en voorzover
      deze niet door verzekering zijn gedekt.

      5 De werkgever die heeft voldaan aan zijn in het tweede lid bedoelde verplichting en daarvoor kosten heeft
      gemaakt, kan die kosten op het loon van de werknemer inhouden tot tot ten hoogste het bij of krachtens
      [artikel 2, derde lid, van de Wet op de zorgtoeslag][ref3] voor een verzekerde zonder partner vastgestelde
      percentage van het loon.

      6 Van de bepalingen van dit artikel kan niet ten nadele van de werknemer worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel2
