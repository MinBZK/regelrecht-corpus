preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enkele wettelijke bepalingen vast te stellen met
    betrekking tot arbeid verricht in verband met de mijnbouw op de Noordzee;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005703/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

        - continentaal plat en mijnbouwinstallatie: hetgeen daaronder wordt verstaan in de [Mijnbouwwet][ref1];
        - arbeid: arbeid verricht bij een verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte dan
      wel het opslaan van stoffen als bedoeld in de [Mijnbouwwet][ref2];
        - werknemer: een persoon die krachtens een arbeidsovereenkomst arbeid verricht op of vanaf een mijnbouwinstallatie
      op het continentaal plat; een persoon, niet zijnde een persoon als bedoeld onder 1°, die krachtens een
      arbeidsovereenkomst is aangesteld om arbeid te verrichten gedurende een periode van ten minste 30 dagen op of vanaf
      een schip dat zich in de territoriale wateren dan wel boven het continentaal plat bevindt.

      2 Bij algemene maatregel van bestuur kunnen mede als werknemer worden aangewezen andere dan in het eerste lid
      bedoelde personen die krachtens arbeidsovereenkomst arbeid verrichten binnen de territoriale wateren dan wel op het
      continentaal plat.

      3 Deze wet is niet van toepassing op de werknemer die als kapitein of schepeling krachtens een arbeidsovereenkomst
      met de zeewerkgever op een schip werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0005703/2006-01-01#Artikel1
    references:
