      In noordelijke richting is het eindpunt van de grenslijn punt A, en in zuidelijke richting is het eindpunt van
      de grenslijn punt W, die de snijpunten vormen van de grenslijnen tussen de zeegebieden van het land Curaçao, het
      openbaar lichaam Bonaire, en de Republiek Venezuela.
    url: https://wetten.overheid.nl/BWBR0028093/2018-09-01#Artikel2
