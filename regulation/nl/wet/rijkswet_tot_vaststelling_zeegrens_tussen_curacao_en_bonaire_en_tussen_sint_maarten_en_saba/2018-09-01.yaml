preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met het verkrijgen door Curaçao en Sint Maarten van
    de hoedanigheid van land in het Koninkrijk, wenselijk is om een grens vast te stellen tussen de zeegebieden,
    met inbegrip van de daaronder gelegen zeebodem en ondergrond, van Curaçao enerzijds en Bonaire anderzijds,
    respectievelijk Sint Maarten enerzijds en Saba anderzijds;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028093/2018-09-01#ArtikelAanhef
