  - number: '2'
    text: |-
      Op Onzen last wordt het nieuwe [Wetboek van Strafvordering][ref1] met de daarin gebrachte wijzigingen en
      aanvullingen in een doorloopend genummerde reeks van boeken, titels, afdeelingen, paragrafen en artikelen
      samengevat en wordt de aanhaling daarvan, zoo in dit Wetboek als in andere wetten en wettelijke voorschriften, in
      verband daarmede voor zoover noodig gewijzigd.

      De gewijzigde tekst van het nieuwe [Wetboek van Strafvordering][ref2] wordt op Onzen last in het *Staatsblad*
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel2
