  - number: '218'
    text: In verzekeringgestelde mannen en vrouwen worden zoveel mogelijk van elkander gescheiden.
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel218
  - number: '219'
    text: |-
      In verzekering gestelde personen, die in gemeenschap geplaatst zijn, worden zooveel mogelijk gedurende den nacht
      onderling afgezonderd.
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel219
  - number: '220'
    text: |-
      De inrichting der plaatsen, voor de inverzekeringstelling bestemd, beantwoordt aan de eischen van een eenvoudig,
      doch voldoende dag- en nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel220
  - number: '221'
    text: |-
      Met betrekking tot het ondergaan van inverzekeringstelling overeenkomstig artikel 491, eerste lid, van het Wetboek
      van Strafvordering, blijven de [artikelen 218-220][ref1] buiten toepassing, doch worden, voor zoover noodig, in het
      bevel voorzieningen getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel218
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '218'
  - number: '224'
    text: |-
      Met betrekking tot het ondergaan van voorloopige hechtenis overeenkomstig
      [artikel 491, eerste lid, van het Wetboek van Strafvordering][ref1], worden, voor zoover noodig, in het bevel
      voorzieningen getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel491
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '491'
  - number: '226'
    text: |-
      Ter bepaling van de bevoegdheid van den rechter en de wijze van rechtspleging wordt uitsluitend de oude wetgeving
      toegepast, indien vóór het tijdstip der inwerkingtreding van deze wet:

      a. voor zooveel betreft zaken waarvan de militaire rechter kennis neemt, de verwijzing naar den militairen rechter
      heeft plaats gehad;

      b. voor zooveel betreft andere zaken, hetzij het inwinnen van voorloopige informatiën, hetzij het verleenen van
      rechtsingang is gevorderd, hetzij voor de eerste maal rauwelijks voor de openbare terechtzitting is gedagvaard.
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel226
  - number: '227'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, met uitzondering echter van [artikel 2][ref1],
      hetwelk in werking treedt met ingang van den dag volgende op dien der afkondiging van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001926#Artikel2
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0001926
        artikel: '2'
