  - number: '116'
    text: |-
      Worden afgeschaft:

      1°. het oude [Wetboek van Strafvordering][ref1];

      2°.

      3°. de wet van 22 Mei 1873 (*Staatsblad* n°. 67), tot aanvulling van de algemeene wet van 26 Augustus 1822
      (*Staatsblad* n°. 31), over de heffing der rechten van in-, uit- en doorvoer en van de accijnzen, alsmede van het
      tonnengeld der zeeschepen;

      4°.

      5°.

      6°.

      7°.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel116
    references:
