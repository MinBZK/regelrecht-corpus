preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat volgens de slotbepaling van het nieuwe Wetboek van Strafvordering het
    in werking treden van dat Wetboek nader bij de wet wordt geregeld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze, vast te stellen de volgende bepalingen, welke zullen uitmaken
    de:
  url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het nieuwe [Wetboek van Strafvordering][ref1] treedt in werking op een door Ons te bepalen tijdstip.

      Wij behouden Ons echter voor de inwerkingtreding der [artikelen 48][ref2], [49][ref3] en
      [275 van het Wetboek][ref4] te bepalen op een later tijdstip dan dat bedoeld in [het eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel275
      [ref5]: https://wetten.overheid.nl/BWBR0001926#Artikel1
    url: https://wetten.overheid.nl/BWBR0001926/2002-03-01#Artikel1
