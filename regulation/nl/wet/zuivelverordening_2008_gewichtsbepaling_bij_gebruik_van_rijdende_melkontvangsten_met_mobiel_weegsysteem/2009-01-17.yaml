  - number: '19'
    text: Deze verordening treedt in werking op de dag na publicatie in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel19
  - number: '20'
    text: |-
      Deze verordening wordt aangehaald als Zuivelverordening 2008, Gewichtsbepaling bij gebruik van rijdende
