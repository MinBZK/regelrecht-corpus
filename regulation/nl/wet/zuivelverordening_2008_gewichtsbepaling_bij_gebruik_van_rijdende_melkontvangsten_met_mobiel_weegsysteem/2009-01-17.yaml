  - number: '2.1'
    text: |-
      Indien voor de bepaling van het gewicht van de geleverde hoeveelheid boerderijmelk, als bedoeld in
      [artikel 7 van de Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1], gebruik wordt gemaakt van
      een rijdende melkontvangst (RMO) met een mobiel weegsysteem voor melk, wordt het bepaalde in deze verordening in
      acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017209#Artikel7
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017209
        artikel: '7'
  - number: '2.2'
    text: |-
      Met de in deze verordening bedoelde RMO’s met mobiel weegsysteem worden gelijkgesteld RMO’s met mobiel weegsysteem,
      die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie, dan wel
      rechtmatig zijn vervaardigd in een staat die partij is bij de overeenkomst inzake de Europese Ruimte, en die aan
      ten minste gelijkwaardige technische eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel2
  - number: '3'
    text: |-
      De ontvanger van boerderijmelk maakt gebruik van RMO’s voorzien van een mobiel weegsysteem dat voldoet aan de
      hiernavolgende eisen.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel3
  - number: 3.a
    text: |-
      voorzien van een mobiel weegsysteem dat voldoet aan de in [artikel 4][ref1] genoemde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel4
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '4'
        paragraaf: '3'
  - number: 3.b
    text: |-
      voorzien van een doelmatige ruimte, waarin de monsters diepgekoelde boerderijmelk kunnen worden gekoeld en bewaard
      op een temperatuur van tenminste 0,0 °C en ten hoogste 4,0 °C;
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel3
  - number: 3.c
    text: |-
      op een duidelijk zichtbare plaats voorzien van een verzegelbare opschriftenplaat, waarop de merktekens en de
      vereiste aanvullende gegevens zoals bepaald bij of krachtens de [Metrologiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: '4.1'
    text: |-
      De RMO is voorzien van een mobiel weegsysteem met een typegoedkeuring en moet zijn geconstrueerd overeenkomstig
      de door de leverancier van het weegsysteem opgestelde voorschriften. Deze voorschriften moeten doelmatig zijn in
      relatie tot het realiseren van de wegingen en moeten voldoen aan de eisen bij of krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel4
  - number: '4.2'
    text: |-
      Wanneer de maximale belasting van het mobiel weegsysteem wordt overschreden vindt een signalering en registratie
      hiervan plaats; wanneer de overschrijding van de maximale belasting meer dan 9e bedraagt wordt de inname
      geblokkeerd.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel4
  - number: '5'
    text: |-
      Voordat een nieuwe RMO voorzien van een mobiel weegsysteem in gebruik wordt genomen moet een voorinregeling worden
      uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel5
  - number: '5.1'
    text: |-
      Een voorinregeling van het weegsysteem moet door de ontvanger van boerderijmelk worden uitgevoerd. Hierbij wordt de
      instructie van de leverancier van het weegsysteem gevolgd.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel5
  - number: '5.2'
    text: |-
      De ontvanger van boerderijmelk controleert voorafgaand aan de voorinregeling of is voldaan aan het bepaalde in
      [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel4
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '4'
        paragraaf: '3'
  - number: '5.3'
    text: Voor de uitvoering van de voorinregeling maakt de ontvanger van boerderijmelk gebruik van de erkende keurder.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel5
  - number: '5.4'
    text: |-
      Voorafgaand aan de uitvoering van de eerste keuring ondergaat de RMO een setting. De setting duurt minimaal 2 weken
      en maximaal 6 weken. In deze periode legt de RMO onder praktijkomstandigheden minimaal 2.000 km af. Bij aanvang van
      de setting moet de eerste keuring zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel5
  - number: '6.1'
    text: |-
      Na de in [artikel 5, lid 4][ref1], genoemde periode van setting wordt door de ontvanger van boerderijmelk
      voorafgaand aan de keuring een fijninregeling uitgevoerd. Hierbij worden de instructies van de leverancier van het
      weegsysteem gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel5
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '5'
        paragraaf: '4'
  - number: '6.2'
    text: Voor de fijninregeling maakt de ontvanger van boerderijmelk gebruik van de diensten van de erkende keurder.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel6
  - number: '6.3'
    text: |-
      Voor de uitvoering van de eerste keuring maakt de ontvanger van boerderijmelk eveneens gebruik van de diensten
      van de erkende keurder. De eerste keuring wordt uitgevoerd overeenkomstig het bepaalde bij of krachtens de
      [Metrologiewet][ref1]. Bij de eerste keuring voldoet de RMO voorzien van een mobiel weegsysteem aan de nieuwnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: '7.1'
    text: |-
      Elk mobiel weegsysteem moet tenminste één keer per jaar worden onderworpen aan een zuivelkeuring. Voor de
      zuivelkeuring maakt de ontvanger van boerderijmelk gebruik van de diensten van de erkende keurder.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel7
  - number: '7.2'
    text: |-
      Wanneer de weegresultaten van het weegsysteem tijdens de zuivelkeuring niet voldoen aan de gebruiksnorm, dient de
      afwijking te worden opgespoord en worden verholpen. Na het verbreken van de verzegeling moet het mobiel weegsysteem
      opnieuw worden gekeurd.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel7
  - number: '7.3'
    text: |-
      Wanneer de reguliere keuring wordt uitgevoerd kan dit in de plaats worden gesteld van een zuivelkeuring als bedoeld
      in lid 1. Bij de zuivelkeuring en de reguliere keuring voldoet het weegsysteem aan de gebruiksnorm.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel7
  - number: '8.1'
    text: |-
      Een gewijzigde RMO wordt door de ontvanger van boerderijmelk direct aan een weegcontrole onderworpen. Deze
      weegcontrole moet worden uitgevoerd overeenkomstig de werkwijze als omschreven in [artikel 9][ref1]. Indien tijdens
      deze meting niet wordt voldaan aan de in [artikel 9, lid 4][ref2], vastgelegde nauwkeurigheidscriteria moet de
      RMO binnen een periode van 5 werkdagen voor de uitvoering van een voorinregeling bij de erkende keurder worden
      aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025378#Artikel9
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025378
        artikel: '9'
        paragraaf: '4'
  - number: '8.2'
    text: |-
      Indien wel wordt voldaan aan de in [artikel 9, lid 4][ref1], vastgestelde nauwkeurigheidscriteria moet de RMO
      binnen 8 weken voor een reguliere keuring door de erkende keurder worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel9
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '9'
        paragraaf: '4'
  - number: '8.3'
    text: 'Van een gewijzigde RMO is sprake indien:'
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
  - number: 8.3.a
    text: een weegcel is vervangen;
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
  - number: 8.3.b
    text: |-
      bij schade aan het chassis, waardoor de weegframes een andere stand hebben aangenomen. In dergelijke gevallen zal
      het chassis uitgelijnd moeten worden;
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
  - number: 8.3.c
    text: bij schade aan de tank tussen de weegcellen, waardoor de ruimte tussen de weegcellen is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
  - number: 8.3.d
    text: na een reparatie die van invloed is op het weegresultaat.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel8
  - number: '9.1'
    text: |-
      Minimaal één keer per maand wordt van elke in gebruik zijnde RMO die is voorzien van een mobiel weegsysteem, een
      weegcontrole uitgevoerd. De weegcontrole wordt uitgevoerd door de ontvanger van boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.2'
    text: Voor de uitvoering van de weegcontrole wordt gebruik gemaakt van een zuivelgekeurde weegbrug dan wel tanksnelweger.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.3'
    text: 'Voor de uitvoering van een tussentijdse meting moet de volgende werkwijze worden gevolgd:'
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: 9.3.a
    text: |-
      na beëindiging van een melkrit wordt eerst het gewicht van een geladen RMO vastgesteld, alvorens het gewicht van de
      lege RMO (tarragewicht) te bepalen, of
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: 9.3.b
    text: |-
      voor de aanvang van een melkrit wordt het gewicht van de lege RMO (tarragewicht) vastgesteld en na beëindiging van
      de melkrit het gewicht van de geladen RMO bepaald;
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: 9.3.c
    text: |-
      bij de vaststelling van de afwijking wordt rekening gehouden met het verbruik van dieselolie door de RMO; hierbij
      wordt uitgegaan van een verbruik van 1 kg op 3 kilometer.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.4'
    text: |-
      Het verschil tussen de gemeten hoeveelheid door de RMO en de gemeten hoeveelheid door middel van de weegbrug/
      tanksnelweger mag niet meer zijn dan 0,5 %.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.5'
    text: |-
      Als het verschil tussen de gemeten hoeveelheid door de RMO en de gemeten hoeveelheid door middel van de weegbrug/
      tanksnelweger meer is dan 0,5 % vindt opnieuw een weging op een weegbrug dan wel tanksnelweger plaats.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.6'
    text: |-
      Wanneer wederom een verschil groter dan 0,5 % wordt gevonden, moet binnen 5 werkdagen een zuivelkeuring worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '9.7'
    text: |-
      De gegevens van de tussentijdse metingen worden door de ontvanger van boerderijmelk bewaard en zijn ter inzage van
      het COKZ.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel9
  - number: '10'
    text: |-
      De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar voldoet aan de
      bepalingen bij deze verordening. Dit kwaliteitssysteem is vastgelegd in een door de ontvanger van boerderijmelk
      opgesteld handboek.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel10
  - number: '11'
    text: |-
      Aan de erkende keurder wordt de voorwaarde verbonden dat deze instelling de in de
      [artikelen 12 tot en met 17][ref1] omschreven bepalingen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel12
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '12'
        paragraaf: '6'
  - number: '12'
    text: |-
      De erkende keurder toont ten genoegen van het bestuur, gehoord het COKZ, aan dat het beschikt over een terzake
      deskundige leiding, over een voor het te verrichten onderzoek voldoende outillage, alsmede over een gedocumenteerd
      en adequaat functionerend kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel12
  - number: '13'
    text: De erkende keurder verricht de keuringen overeenkomstig het bepaalde in deze verordening.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel13
  - number: '14'
    text: |-
      De resultaten van de keuringen worden vastgelegd op een voor het COKZ toegankelijke en overzichtelijke wijze. De
      resultaten worden gedurende ten minste vier jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel14
  - number: '15'
    text: |-
      De erkende keurder verleent aan het COKZ alle medewerking en verstrekt alle gegevens welke het voor een goede
      controle noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel15
  - number: '16'
    text: |-
      Voor het aanbrengen van de vereiste kenmerken is de erkende keurder in het bezit van een door de toezichthoudende
      instantie verleende bevoegdheid; het door deze instantie goed te keuren kwaliteitshandboek is hiervan een
      onderdeel.
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel16
  - number: '17'
    text: |-
      De erkenning van de keuringsinstelling kan worden ingetrokken, indien niet aan de in de
      [artikelen 12 tot en met 16][ref1] gestelde voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025378#Artikel12
    url: https://wetten.overheid.nl/BWBR0025378/2009-01-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025378
        artikel: '12'
        paragraaf: '6'
  - number: '18'
    text: |-
