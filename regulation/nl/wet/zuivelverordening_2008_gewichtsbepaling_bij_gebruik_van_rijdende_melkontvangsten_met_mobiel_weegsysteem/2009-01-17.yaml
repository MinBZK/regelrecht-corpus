articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1]. Voorts wordt in deze verordening verstaan
      onder:






                  [Metrologiewet][ref2]:


                  Wet van 2 februari 2006, houdende regels omtrent meeteenheden en omtrent het in de handel brengen en
      het gebruik van meetinstrumenten. (Stb. 2006, 137).




                  toezichthoudende instantie:


                  Een in Nederland gevestigde rechtspersoon die op grond van [artikel 27 van de Metrologiewet][ref3]
      door de Minister van Economische Zaken is aangewezen en tot taak heeft gekregen zorg te dragen voor de
      uitoefening van het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 5][ref4] en
      [artikel 39 van de Metrologiewet][ref5].




                  type goedkeuring:


                  keuring van het type weegsysteem overeenkomstig de [Metrologiewet][ref6].




                  mobiel weegsysteem:


                  een RMO uitgerust met een weegsysteem waarmee het mogelijk is om direct de ingenomen kilogrammen melk
      te bepalen.




                  voorinregeling:


                  het inregelen van een RMO voorzien van een type goedgekeurd mobiel weegsysteem voorafgaand aan de
      periode van setting.




                  setting:


                  de periode waarin het mobiel weegsysteem wordt gebruikt voor het innemen van boerderijmelk voorafgaand
      aan de eerste keuring.




                  fijninregeling:


                  het inregelen van een RMO voorzien van een mobiel weegsysteem.




                  eerste keuring:


                  Overeenstemmingsbeoordeling van een nieuwe RMO als bedoeld in [artikel 6 van de Metrologiewet][ref7].




                  reguliere keuring:


                  Overeenstemmingsbeoordeling (keuring) van een in gebruik zijnde RMO als bedoeld in
      [artikel 7 van de Metrologiewet][ref8].




                  herkeuring:


                  Overeenstemmingsbeoordeling (keuring) van een gewijzigde RMO zoals vastgelegd in deze verordening.




                  e:


                  de ijkeenheid zoals is vermeld op de opschriftenplaat van het mobiele weegsysteem.




                  zuivelkeuring:


                  keuring van een mobiel weegsysteem zoals vastgelegd in deze verordening.




                  nieuwnorm:


                  de bandbreedte van de weegcurve vereist bij nieuwe RMO’s.




                  gebruiksnorm:


                  de bandbreedte van de weegcurve bij in gebruik zijnde RMO’s.




                  gewijzigde RMO:


                  een in gebruik zijnde RMO waaraan wijzigingen hebben plaatsgevonden, die het weegresultaat kunnen
      beïnvloeden, of een RMO waarbij schending van ijkmerken heeft plaatsgevonden.




                  in gebruik zijnde RMO:


                  een RMO die, met goed resultaat, een eerste keuring heeft ondergaan.




                  maximale belasting:


                  maximale belasting van het weegsysteem, zoals aangegeven op de opschriftenplaat.




                  opbouwvoorschriften:


                  eisen die worden gesteld aan de opbouw van een mobiel weegsysteem.




                  erkende keurder:


                  de erkende instelling voor de keuring van mobiele weegsystemen.




                  zuivelgekeurde weegbrug:


                  een weegbrug die is voorzien van de wettelijke kenmerken en voldoet aan de nauwkeurigheidseisen voor de
      ingebruikname van nieuwe weegwerktuigen, zoals bepaald bij of krachtens de [Metrologiewet][ref9].




                  tanksnelweger:


                  weegtank met een afleeseenheid groter dan of gelijk aan 10 kg die is voorzien van de wettelijke
      kenmerken en die voldoet aan de nauwkeurigheidseisen voor de ingebruikname van nieuwe weegwerktuigen, zoals bepaald
      bij of krachtens de [Metrologiewet][ref10] of een weegtank met een afleeseenheid kleiner dan 10 kg die is voorzien
      van wettelijke kenmerken en die voldoet aan de nauwkeurigheidseisen voor de keuring van reeds in gebruik zijnde
      weegwerktuigen, zoals bepaald bij of krachtens de [Metrologiewet][ref11].




                  opweging:


                  weging met toenemende belasting.




                  neerweging:


                  weging met afnemende belasting.


