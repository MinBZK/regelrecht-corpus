preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het financieel toetsingskader voor pensioenfondsen aan
    te passen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036084/2015-01-01#ArtikelAanhef
articles:
  - number: IIIa.1
    text: |-
      Een langetermijnherstelplan als bedoeld in [artikel 138 van de Pensioenwet][ref1] dan wel
      [artikel 133 van de Wet verplichte beroepspensioenregeling][ref2] of een kortetermijnherstelplan als bedoeld in
      [artikel 140 van de Pensioenwet][ref3] dan wel [artikel 135 van de Wet verplichte beroepspensioenregeling][ref4],
      zoals deze artikelen luidden voor het tijdstip van inwerkingtreding van [artikel I, onderdeel P][ref5], dan wel
      [artikel II, onderdeel N][ref6], vervalt op het tijdstip van inwerkingtreding van artikel I, onderdeel P, dan
      wel artikel II, onderdeel N. Een op het kortetermijnherstelplan gebaseerde vermindering van pensioenaanspraken
      en pensioenrechten waarvan de effectuering zal plaatsvinden na het tijdstip van inwerkingtreding wordt alsnog
      uitgevoerd conform het kortetermijnherstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel133
