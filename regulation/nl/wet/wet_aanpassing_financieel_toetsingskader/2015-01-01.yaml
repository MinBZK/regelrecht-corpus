  - number: IIIa.2
    text: |-
      Een pensioenfonds of beroepspensioenfonds stelt op het tijdstip van inwerkingtreding
      van [artikel I, onderdeel P][ref1], dan wel [artikel II, onderdeel N][ref2], vast of
      voldaan wordt aan de bij of krachtens [artikel 132 van de Pensioenwet][ref3] dan wel
      [artikel 127 van de Wet verplichte beroepspensioenregeling][ref4] gestelde eisen aan de hand van de
      beleidsdekkingsgraad per het einde van het kalenderkwartaal voorafgaand aan dit tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0036084#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0036084#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel132
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0036084/2015-01-01#ArtikelIIIa
