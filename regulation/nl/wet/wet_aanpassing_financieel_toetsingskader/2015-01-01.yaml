  - number: IIIa.3
    text: |-
      Een pensioenfonds of beroepspensioenfonds dat op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel P][ref1], dan wel [artikel II, onderdeel N][ref2], niet voldoet aan de bij of krachtens
      [artikel 132 van de Pensioenwet][ref3] dan wel [artikel 127 van de Wet verplichte beroepspensioenregeling][ref4]
      gestelde eisen, dient, in afwijking van [artikel 138, tweede lid, van de Pensioenwet][ref5] dan wel
      [artikel 133, tweede lid, van de Wet verplichte beroepspensioenregeling][ref6], binnen zes maanden een herstelplan
      in. In afwijking van artikel 138, zesde lid, van de Pensioenwet dan wel artikel 133, zesde lid, van de Wet
      verplichte beroepspensioenregeling, gaat dit herstelplan in na uiterlijk negen maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0036084#ArtikelI
