  - number: IIIa.5
    text: |-
      De uitvoeringsovereenkomst of het uitvoeringsreglement van een op het tijdstip van inwerkingtreding
      van [artikel I, onderdeel B][ref1], dan wel [artikel II, onderdeel B][ref2], bestaand pensioenfonds of
      beroepspensioenfonds voldoet uiterlijk zes maanden na het tijdstip van inwerkingtreding van artikel I, onderdeel B,
      dan wel artikel II, onderdeel B, aan deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0036084#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0036084#ArtikelII
