preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het financieel toetsingskader voor pensioenfondsen aan
    te passen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036084/2015-01-01#ArtikelAanhef
articles:
  - number: IIIa
    text: |-
      1 Een langetermijnherstelplan als bedoeld in [artikel 138 van de Pensioenwet][ref1] dan wel
      [artikel 133 van de Wet verplichte beroepspensioenregeling][ref2] of een kortetermijnherstelplan als bedoeld in
      [artikel 140 van de Pensioenwet][ref3] dan wel [artikel 135 van de Wet verplichte beroepspensioenregeling][ref4],
      zoals deze artikelen luidden voor het tijdstip van inwerkingtreding van [artikel I, onderdeel P][ref5], dan wel
      [artikel II, onderdeel N][ref6], vervalt op het tijdstip van inwerkingtreding van artikel I, onderdeel P, dan
      wel artikel II, onderdeel N. Een op het kortetermijnherstelplan gebaseerde vermindering van pensioenaanspraken
      en pensioenrechten waarvan de effectuering zal plaatsvinden na het tijdstip van inwerkingtreding wordt alsnog
      uitgevoerd conform het kortetermijnherstelplan.

      2 Een pensioenfonds of beroepspensioenfonds stelt op het tijdstip van inwerkingtreding
      van [artikel I, onderdeel P][ref7], dan wel [artikel II, onderdeel N][ref8], vast of
      voldaan wordt aan de bij of krachtens [artikel 132 van de Pensioenwet][ref9] dan wel
      [artikel 127 van de Wet verplichte beroepspensioenregeling][ref10] gestelde eisen aan de hand van de
      beleidsdekkingsgraad per het einde van het kalenderkwartaal voorafgaand aan dit tijdstip.

      3 Een pensioenfonds of beroepspensioenfonds dat op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel P][ref11], dan wel [artikel II, onderdeel N][ref12], niet voldoet aan de bij of krachtens
      [artikel 132 van de Pensioenwet][ref13] dan wel [artikel 127 van de Wet verplichte beroepspensioenregeling][ref14]
      gestelde eisen, dient, in afwijking van [artikel 138, tweede lid, van de Pensioenwet][ref15] dan wel
      [artikel 133, tweede lid, van de Wet verplichte beroepspensioenregeling][ref16], binnen zes maanden een herstelplan
      in. In afwijking van artikel 138, zesde lid, van de Pensioenwet dan wel artikel 133, zesde lid, van de Wet
      verplichte beroepspensioenregeling, gaat dit herstelplan in na uiterlijk negen maanden.

      4 Een op het tijdstip van inwerkingtreding van [artikel I, onderdeel O][ref17], dan wel
      [artikel II, onderdeel M][ref18], bestaand pensioenfonds of beroepspensioenfonds voldoet uiterlijk
      zes maanden na dit tijdstip aan [artikel 137, eerste lid, van de Pensioenwet][ref19] dan wel
      [artikel 132, eerste lid, van de Wet verplichte beroepspensioenregeling][ref20].

      5 De uitvoeringsovereenkomst of het uitvoeringsreglement van een op het tijdstip van inwerkingtreding
      van [artikel I, onderdeel B][ref21], dan wel [artikel II, onderdeel B][ref22], bestaand pensioenfonds of
      beroepspensioenfonds voldoet uiterlijk zes maanden na het tijdstip van inwerkingtreding van artikel I, onderdeel B,
      dan wel artikel II, onderdeel B, aan deze wet.

      6 De actuariële en bedrijfstechnische nota van een op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel W][ref23], dan wel [artikel II, onderdeel U][ref24], bestaand pensioenfonds of
      beroepspensioenfonds voldoet uiterlijk zes maanden na dit tijdstip aan [artikel 145 van de Pensioenwet][ref25] dan
      wel [artikel 140 van de Wet verplichte beroepspensioenregeling][ref26].


