  - number: IIIa.4
    text: |-
      Een op het tijdstip van inwerkingtreding van [artikel I, onderdeel O][ref1], dan wel
      [artikel II, onderdeel M][ref2], bestaand pensioenfonds of beroepspensioenfonds voldoet uiterlijk
      zes maanden na dit tijdstip aan [artikel 137, eerste lid, van de Pensioenwet][ref3] dan wel
      [artikel 132, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4].


