  - number: IIIa.6
    text: |-
      De actuariële en bedrijfstechnische nota van een op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel W][ref1], dan wel [artikel II, onderdeel U][ref2], bestaand pensioenfonds of
      beroepspensioenfonds voldoet uiterlijk zes maanden na dit tijdstip aan [artikel 145 van de Pensioenwet][ref3] dan
      wel [artikel 140 van de Wet verplichte beroepspensioenregeling][ref4].


