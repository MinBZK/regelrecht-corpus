        artikel: '8'
  - number: '6'
    text: |-
      1 De minister en de minister van VWS sturen jaarlijks voor 15 juli een opdrachtbrief aan de DG-VWA met:

      a. een indicatie van de opdrachtverlening aan de VWA; en

      b. het daarvoor beschikbare budget.

      2 De DG-VWA dient jaarlijks voor 1 november een werkprogramma in bij de minister, waarin zijn opgenomen de
      activiteiten van de VWA.

      3 Het werkprogramma:

      a. heeft betrekking op het eerstkomende volle kalenderjaar;

      b. bevat een vooruitblik op de navolgende drie kalenderjaren; en

      c. bevat een afzonderlijke opsomming en uitwerking van de activiteiten van de in [artikelen 3][ref1], [4][ref2] en
      [5][ref3] genoemde taken en werkzaamheden.

      4 Over de delen van het werkprogramma vindt vóór de indiening ervan overleg plaats met:

      a. de minister van VWS, voorzover een direct verband bestaat met:

      1º de regelgeving, genoemd in [artikel 3, tweede lid, onder a][ref4], 1°, 2°, 6°, 8°, 9° of 10°;

      2º de bij of krachtens de [Bestrijdingsmiddelenwet][ref5] vastgestelde regels inzake biociden;

      3º de [Regeling residuen van bestrijdingsmiddelen][ref6];

      4º de regelgeving, genoemd in [artikel 3, tweede lid, onder b][ref7];

      b. de minister, voorzover een direct verband bestaat met de regelgeving, genoemd in:

      1º [artikel 3, tweede lid, onder a][ref8], 3°, 4°, 5°, 11°, 12° of 13°;

      2º [artikel 3, tweede lid, onder a][ref9], 7°, met uitzondering van de
      [Regeling residuen van bestrijdingsmiddelen][ref10] en de bij of krachtens de [Bestrijdingsmiddelenwet][ref11]
      vastgestelde regels inzake biociden;

      c. de minister en de minister van VWS, voor zover een direct verband bestaat met de regelgeving, genoemd in
      [artikel 3, tweede lid, onder c][ref12].

      5 Het werkprogramma behoeft binnen twee maanden na indiening de goedkeuring van de minister en de minister van VWS.
      Wijzigingen in een goedgekeurd werkprogramma, al dan niet op verzoek van de minister of de minister van VWS, worden
      slechts aangebracht na instemming van de minister en de minister van VWS.


