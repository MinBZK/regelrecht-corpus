  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
            minister van VWS:

              Minister van Volksgezondheid, Welzijn en Sport;



            c
            VWA:

              de Voedsel en Waren Autoriteit;



            d
            DG-VWA:

              de directeur-generaal van het Ministerie van Landbouw, Natuur en Voedselkwaliteit die de leiding heeft van
      de VWA;



            e
             KvW:

              de Keuringsdienst van Waren;



            f
            RVV:

              de Rijksdienst voor de keuring van Vee en Vlees;



            g
            waren:

              hetgeen daaronder wordt verstaan in de [Warenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '2'
    text: |-
      1 Er is een Voedsel en Waren Autoriteit die ressorteert onder de minister.

      2 De leiding van de VWA berust bij de DG-VWA.

      3 De VWA bestaat naast een centrale overkoepelende eenheid uit de volgende afzonderlijke dienstonderdelen:

      a. de KvW;

      b. de [RVV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '3'
    text: |-
      1 De ambtenaren van de VWA zijn belast met de handhaving van de in het tweede lid bedoelde wettelijke
      voorschriften, voor zover die ambtenaren daarmee bij of krachtens wettelijk voorschrift zijn belast.

      2 De in het eerste lid bedoelde wettelijke voorschriften zijn:

      a. de bij of krachtens de volgende wetten gestelde voorschriften:

      1º de [Warenwet][ref1];

      2º de [Vleeskeuringswet][ref2];

      3º de [Veewet][ref3];

      4º de [Destructiewet][ref4];

      5º de [Landbouwwet][ref5];

      6º de [Wet op de dierproeven][ref6];

      7º de [Bestrijdingsmiddelenwet 1962][ref7];

      8º de [Wet Milieugevaarlijke stoffen][ref8], uitsluitend hoofdstuk 4, paragraaf 2;

      9º de [Drank- en Horecawet][ref9];

      10º de [Tabakswet][ref10];

      11º de [Diergeneesmiddelenwet][ref11];

      12º de [Gezondheids- en welzijnswet voor dieren][ref12];

      13º de [Landbouwkwaliteitswet][ref13];

      14º de [Kernenergiewet][ref14];

      15º de [Absintwet 1909][ref15];

      b. het [Warenwetbesluit attractie- en speeltoestellen][ref16];

      c. krachtens de [Wet op de Bedrijfsorganisatie][ref17] door publiekrechtelijke bedrijfsorganisaties vastgestelde
      verordeningen.

      3 Ter uitvoering van de in het tweede lid bedoelde regelgeving is de VWA tevens belast met:

      a. het erkennen van ondernemingen;

      b. het keuren van levende en geslachte dieren en producten hiervan;

      c. het houden van toezicht op bedrijfskeuringen;

      d. het verlenen van erkenning, registraties en vergunningen aan bedrijven, veewagens en personen, en het afgeven
      van certificaten;

      e. het uitvoeren van bedrijfscontroles.


