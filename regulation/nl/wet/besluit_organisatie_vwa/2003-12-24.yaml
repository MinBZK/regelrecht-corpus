      De DG-VWA zendt jaarlijks voor 1 juni een verslag van de werkzaamheden van de VWA in het afgelopen jaar aan de
      minister en de minister van VWS.
    url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#Artikel9
  - number: '11'
