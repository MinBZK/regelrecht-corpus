  - number: '7'
    text: |-
      1 De ambtenaren van de [RVV][ref1] zijn met inachtneming van het tweede lid gehouden opdrachten van de minister
      uit te voeren ten tijde van crises in de bestrijding van vee- of dierziekten als bedoeld in [hoofdstuk II][ref2],
      [afdeling 3, van de Gezondheids- en welzijnswet voor dieren][ref3].

      2 Het eerste lid is slechts van toepassing nadat de DG-VWA door de minister in kennis is gesteld van diens
      voornemen een opdracht uit te vaardigen als bedoeld in het eerste lid.

      3 Zodra sprake is van een in het eerste lid bedoelde crisis, dient de DG-VWA binnen één maand een aangepast
      werkprogramma in de bij de minister. [Artikel 6, derde, vierde en vijfde lid][ref4], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Afdeling3
      [ref4]: https://wetten.overheid.nl/BWBR0013865#Artikel6
