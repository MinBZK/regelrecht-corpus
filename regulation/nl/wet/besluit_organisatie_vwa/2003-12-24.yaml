  - number: '8'
    text: |-
      1 De DG-VWA is bevoegd de leiding van de in [artikel 2, derde lid][ref1], genoemde dienstonderdelen, algemene of
      bijzondere aanwijzingen te geven over de uitvoering van de werkzaamheden van de desbetreffende dienst.

      2 De DG-VWA kan één of meer uit [artikel 36 van de Gezondheidswet][ref2] of dit besluit voortvloeiende bevoegdheden
      overdragen aan de leiding van de in [artikel 2, derde lid][ref3], genoemde dienstonderdelen.


