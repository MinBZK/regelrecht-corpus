      2 In afwijking van het eerste lid treedt [artikel 2, derde lid, onder b][ref1], in werking met ingang van 1 januari
      2003.

      3 In afwijking van het eerste lid treedt [artikel 6][ref2] in werking met ingang van 1 januari 2003.


