  - number: '4'
    text: |-
      De VWA is ter bescherming van de volksgezondheid tevens belast met de navolgende taken en daarmee samenhangende
      werkzaamheden:

      a. het programmeren en coördineren van het onderzoek op het terrein van de voedselveiligheid ten behoeve van
      de risicobeoordeling dat direct verband houdt met de in [artikel 3, tweede lid, onder a en b][ref1], bedoelde
      voorschriften;

      b. het verstrekken of doen verstrekken van informatie over de in dit besluit geregelde taken en werkzaamheden;

      c. het periodiek rapporteren over de hoedanigheid van waren in het algemeen en voedsel en de grondstoffen daarvoor
      in het bijzonder, alsmede over de kwaliteit van de functievervulling van de feitelijk met de handhaving ter zake
      belaste dienstonderdelen, bedoeld in [artikel 2, derde lid][ref2];

      d. het uitvoeren van andere door de minister of de minister van VWS op te dragen werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013865#Artikel2
    url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#Artikel4
