  - number: 7a
    text: |-
      1 Met de uitoefening van het Staatstoezicht op de volksgezondheid, bedoeld in
      [artikel 36 van de Gezondheidswet][ref1], worden belast de door de minister van VWS aan te wijzen ambtenaren van
      de VWA.

      2 De overeenkomstig het eerste lid aangewezen ambtenaren zijn gehouden opdrachten van de minister van VWS uit te
      voeren. [Artikel 7, tweede lid][ref2], is met betrekking tot de eerste volzin van overeenkomstige toepassing, met
      dien verstande dat in plaats van ‘de minister van LNV’ wordt gelezen: de minister van VWS.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0013865#Artikel7
    url: https://wetten.overheid.nl/BWBR0013865/2003-12-24#Artikel7a
