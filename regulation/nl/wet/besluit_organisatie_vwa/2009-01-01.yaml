        artikel: '5'
        paragraaf: '2'
  - number: '6.4'
    text: 'Over de delen van het werkprogramma vindt vóór de indiening ervan overleg plaats met:'
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.4.a
    text: 'de minister van VWS, voorzover een direct verband bestaat met:'
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.4.a.1º
    text: |-
      de regelgeving, genoemd in [artikel 3, tweede lid, onder a, 1°, 6°, 8°, 9° of 10°][ref1];


