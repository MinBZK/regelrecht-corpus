      [artikel 3, tweede lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
    references:
      - id: ref1
