    text: |-
      In dit besluit wordt verstaan onder:

            a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
            minister van VWS:

              Minister van Volksgezondheid, Welzijn en Sport;



            c
            VWA:

              de Voedsel en Waren Autoriteit;



            d
            IG-VWA:

              de inspecteur-generaal van het Ministerie van Landbouw, Natuur en Voedselkwaliteit die de leiding heeft van
      de VWA;



            e
            waren:

              hetgeen daaronder wordt verstaan in de [Warenwet][ref1].


