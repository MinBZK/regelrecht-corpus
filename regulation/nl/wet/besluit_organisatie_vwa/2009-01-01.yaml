        bwb_id: BWBR0013865
        artikel: '2'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid treedt [artikel 6][ref1] in werking met ingang van 1 januari 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel6
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel11
    references:
