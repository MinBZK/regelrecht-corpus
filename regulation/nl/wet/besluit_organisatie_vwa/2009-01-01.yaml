      [Warenwetregeling residuen van bestrijdingsmiddelen][ref2] en de bij of krachtens de
      [Wet gewasbeschermingsmiddelen en biociden][ref3] vastgestelde regels inzake biociden;


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003658
      [ref3]: https://wetten.overheid.nl/BWBR0021670
