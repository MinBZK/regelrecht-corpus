        paragraaf: '2'
  - number: '6.5'
    text: |-
      Het werkprogramma behoeft binnen twee maanden na indiening de goedkeuring van de minister en de minister van VWS.
      Wijzigingen in een goedgekeurd werkprogramma, al dan niet op verzoek van de minister of de minister van VWS, worden
      slechts aangebracht na instemming van de minister en de minister van VWS.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: '7.1'
    text: |-
      De ambtenaren van de VWA zijn met inachtneming van het tweede lid gehouden opdrachten van de
      minister uit te voeren ten tijde van crises in de bestrijding van vee- of dierziekten als bedoeld in
      [hoofdstuk II, afdeling 3, van de Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Afdeling3
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005662
        afdeling: '3'
  - number: '7.2'
    text: |-
      Het eerste lid is slechts van toepassing nadat de IG-VWA door de minister in kennis is gesteld van diens voornemen
      een opdracht uit te vaardigen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel7
  - number: '7.3'
    text: |-
      Zodra sprake is van een in het eerste lid bedoelde crisis, dient de IG-VWA binnen één maand een aangepast
      werkprogramma in de bij de minister. [Artikel 6, derde, vierde en vijfde lid][ref1], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel6
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013865
        artikel: '6'
        paragraaf: '2'
  - number: 7a.1
    text: |-
      Met de uitoefening van het Staatstoezicht op de volksgezondheid, bedoeld in
      [artikel 36 van de Gezondheidswet][ref1], worden belast de door de minister van VWS aan te wijzen ambtenaren van
      de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
  - number: 7a.2
    text: |-
      De overeenkomstig het eerste lid aangewezen ambtenaren zijn gehouden opdrachten van de minister van VWS uit te
      voeren. [Artikel 7, tweede lid][ref1], is met betrekking tot de eerste volzin van overeenkomstige toepassing, met
      dien verstande dat in plaats van ‘de minister van LNV’ wordt gelezen: de minister van VWS.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel7
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0013865
        artikel: '7'
        paragraaf: '2'
  - number: '9'
    text: |-
      De IG-VWA zendt jaarlijks voor 1 juni een verslag van de werkzaamheden van de VWA in het afgelopen jaar aan de
      minister en de minister van VWS.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel9
  - number: '11.1'
    text: Dit besluit treedt in werking met ingang van 10 juli 2002.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid treedt [artikel 2, derde lid, onder b][ref1], in werking met ingang van 1 januari
      2003.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel2
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel11
    references:
