  - number: '3.3'
    text: 'Ter uitvoering van de in het tweede lid bedoelde regelgeving is de VWA tevens belast met:'
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: 3.3.a
    text: het erkennen van ondernemingen;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: 3.3.b
    text: het keuren van levende en geslachte dieren en producten hiervan;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: 3.3.c
    text: het houden van toezicht op bedrijfskeuringen;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: 3.3.d
    text: |-
      het verlenen van erkenning, registraties en vergunningen aan bedrijven, veewagens en personen, en het afgeven van
      certificaten;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: 3.3.e
    text: het uitvoeren van bedrijfscontroles.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel3
  - number: '4'
    text: |-
      De VWA is ter bescherming van de volksgezondheid tevens belast met de navolgende taken en daarmee samenhangende
      werkzaamheden:
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel4
  - number: 4.a
    text: |-
      het programmeren en coördineren van het onderzoek op het terrein van de voedselveiligheid ten behoeve van de
      risicobeoordeling dat direct verband houdt met de in [artikel 3, tweede lid, onder a en b][ref1], bedoelde
      voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013865
        artikel: '3'
        paragraaf: '2'
  - number: 4.b
    text: het verstrekken of doen verstrekken van informatie over de in dit besluit geregelde taken en werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel4
  - number: 4.c
    text: |-
      het periodiek rapporteren over de hoedanigheid van waren in het algemeen en voedsel en de grondstoffen
      daarvoor in het bijzonder, alsmede over de kwaliteit van de wijze waarop de handhaving, bedoeld in
      [artikel 3, eerste lid][ref1], plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013865
        artikel: '3'
        paragraaf: '2'
  - number: 4.d
    text: het uitvoeren van andere door de minister of de minister van VWS op te dragen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel4
  - number: '5'
    text: |-
      De VWA zal op grond van een door de minister van LNV met inachtneming van de
      [artikelen 10:1 tot en met 10:12 van de Algemene wet bestuursrecht][ref1] te verlenen mandaat, het
      Rijkstoezicht uitoefenen op het Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel, dat krachtens
      [artikel 8 van de Landbouwkwaliteitswet][ref2] is aangewezen als controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '6.1'
    text: 'De minister en de minister van VWS sturen jaarlijks voor 15 juli een opdrachtbrief aan de IG-VWA met:'
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.1.a
    text: een indicatie van de opdrachtverlening aan de VWA; en
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.1.b
    text: het daarvoor beschikbare budget.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: '6.2'
    text: |-
      De IG-VWA dient jaarlijks voor 1 november een werkprogramma in bij de minister, waarin zijn opgenomen de
      activiteiten van de VWA.
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: '6.3'
    text: 'Het werkprogramma:'
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.3.a
    text: heeft betrekking op het eerstkomende volle kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.3.b
    text: bevat een vooruitblik op de navolgende drie kalenderjaren; en
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
  - number: 6.3.c
    text: |-
      bevat een afzonderlijke opsomming en uitwerking van de activiteiten van de in [artikelen 3][ref1], [4][ref2] en
      [5][ref3] genoemde taken en werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013865#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013865#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013865#Artikel5
    url: https://wetten.overheid.nl/BWBR0013865/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013865
        artikel: '3'
        paragraaf: '2'
      - id: ref2
