---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_tarieven_onderzoek_binnenschepen_2004
regulatory_layer: WET
publication_date: '2004-12-27'
valid_from: '2004-01-01'
bwb_id: BWBR0016081
url: https://wetten.overheid.nl/BWBR0016081/2004-01-01
preamble:
  text: |-
    Gelet op de artikelen 12, derde lid, en 12a, tweede lid, van de Binnenschepenwet, de artikelen 15 en 18 van het
    Binnenschepenbesluit, artikel 49, tweede lid, van de Wet vervoer gevaarlijke stoffen en artikel 9 van de Wet
    vaartijden en bemanningssterkte binnenvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
  - number: 1.a
    text: |-
      certificaat van onderzoek: het certificaat, bedoeld in [artikel 5, eerste lid, van de Binnenschepenwet][ref1] en
      [artikel 1.03 van het Reglement onderzoek schepen op de Rijn 1995][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel1
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '1'
  - number: 1.b
    text: |-
      certificaat van goedkeuring: het certificaat, bedoeld in bijlage 1, B1, Rn. 10.282 en bijlage 1, B2, Rn. 210.282,
      van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
  - number: 1.c
    text: |-
      communautair certificaat: het certificaat, bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel1
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '1'
  - number: 1.d
    text: |-
      communautair aanvullend certificaat: het certificaat, bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel1
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '1'
  - number: 1.e
    text: |-
      uitgebreide proefvaart: beproeving tijdens de vaart teneinde aan te tonen dat wordt voldaan aan de gestelde eisen
      die niet bij een stilliggend schip zijn vast te stellen;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
  - number: 1.f
    text: |-
      beperkte proefvaart: beproeving tijdens een kortdurende vaart teneinde aan te tonen dat wordt voldaan aan eisen die
      worden gesteld aan een stuurinrichting, dan wel aan de maximaal toelaatbare geluidsniveaus;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
  - number: 1.g
    text: |-
      verklaring minimumbemanning: de verklaring, bedoeld in
      [artikel 23.09, tweede lid, van het Reglement onderzoek schepen op de Rijn 1995][ref1] en
      [artikel 13, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel13
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '13'
  - number: '2.1'
    text: 'Voor het onderzoek en verdere werkzaamheden nodig voor de eerste afgifte van:'
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel2
  - number: 2.1.a
    text: |-
      een certificaat van onderzoek, een communautair certificaat, of een communautair aanvullend certificaat ten behoeve
      van nieuw gebouwde schepen is het tarief verschuldigd, genoemd in onderstaande tabel, kolom 1;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel2
  - number: 2.1.b
    text: |-
      een certificaat van goedkeuring in combinatie met een van de certificaten, genoemd in onderdeel a, ten behoeve van
      nieuw gebouwde schepen, is het tarief verschuldigd, genoemd in onderstaande tabel, kolom 2.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij annulering of het later aanpassen van een schriftelijke aanvraag zullen naast de kosten voor reeds uitgevoerde
      werkzaamheden, berekend volgens het gestelde in [artikel 3][ref1], standaard twee werkuren in rekening worden
      gebracht tegen een tarief van € 66 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0016081#Artikel3
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016081
        artikel: '3'
  - number: '2.3'
    text: |-
      Indien een scheepstype niet is genoemd in de in het eerste lid opgenomen tabel, wordt door het hoofd van de
      Scheepvaartinspectie het verschuldigde tarief gebaseerd op het tarief van het scheepstype dat hiermee het meest
      overeenkomt.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor het onderzoek en verdere werkzaamheden nodig voor de eerste of hernieuwde afgifte van een certificaat van
      onderzoek, een communautair certificaat, een communautair aanvullend certificaat of een certificaat van goedkeuring
      ten behoeve van bestaande schepen, dan wel voor het wijzigen van voornoemde certificaten ten behoeve van deze
      schepen is een tarief verschuldigd dat wordt berekend aan de hand van het aantal inspecties aan boord van het
      schip.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.2'
    text: 'Voor de inspecties aan boord van het schip zijn de volgende tarieven verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.2.a
    text: voor de eerste inspectie, voor de eerste afgifte of vernieuwing van de geldigheidsduur van een certificaat € 243;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.2.b
    text: voor de tweede en volgende inspecties en voor inspecties gedurende de looptijd van een certificaat € 211;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.2.c
    text: in afwijking van onderdeel a, voor open rondvaartboten, voor de eerste inspectie € 211.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien bij de inspecties aan boord van het schip gelijktijdig een elektrotechnisch onderzoek en een
      scheepsbouwkundig onderzoek plaatsvindt, worden deze onderzoeken als afzonderlijke inspecties aangemerkt.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien het onderzoek, bedoeld in het eerste lid, plaatsvindt ten behoeve van de afgifte of wijziging van een
      certificaat van onderzoek of een communautair certificaat in combinatie met de eerste afgifte of verlenging van de
      geldigheidsduur van een certificaat van goedkeuring, wordt het verschuldigde tarief voor deze inspectie verhoogd
      met € 180.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien het onderzoek, bedoeld in het eerste lid, plaatsvindt ten behoeve van de afgifte of wijziging van een
      certificaat van onderzoek in combinatie met de eerste afgifte of verlenging van de geldigheidsduur van een
      communautair aanvullend certificaat, wordt het verschuldigde tarief voor de eerste inspectie verhoogd met € 130.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien een uitgebreide proefvaart deel uitmaakt van een inspectie aan boord van het schip, wordt het verschuldigde
      tarief voor die inspectie, ongeacht het aantal gelijktijdig uitgevoerde onderzoeken, bedoeld in het derde lid,
      verhoogd met € 309.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.7'
    text: |-
      Indien een beperkte proefvaart, een hellingproef of een diepgangscontrole deel uitmaakt van een inspectie aan boord
      van het schip, wordt het verschuldigde tarief voor die inspectie verhoogd met € 144.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.8'
    text: |-
      Indien een droogzetting deel uitmaakt van een inspectie als bedoeld in het tweede lid, wordt het verschuldigde
      tarief voor die inspectie, tenzij het een open rondvaartboot betreft, verhoogd met de volgende bedragen:
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.8.a
    text: |-
      indien het een schip betreft met een lengte van minder dan 35 meter en er geen volledige diktemeting door de
      Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 147;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.8.b
    text: |-
      indien het een schip betreft met een lengte van minder dan 35 meter en er een volledige diktemeting door de Divisie
      Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 213;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.8.c
    text: |-
      indien het een schip betreft met een lengte van 35 meter of meer en er geen volledige diktemeting door de Divisie
      Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 213;
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: 3.8.d
    text: |-
      indien het een schip betreft met een lengte van 35 meter of meer en er een volledige diktemeting door de Divisie
      Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 279.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.9'
    text: |-
      Voor het opmaken of wijzigen van de in dit artikel genoemde certificaten is een tarief verschuldigd van € 52 per
      certificaat.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.10'
    text: |-
      Voor werkzaamheden op verzoek zoals het afstempelen van plaatjes, het opnieuw verzegelen van lensafsluiters e.d. is
      een tarief per uur verschuldigd van € 66.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '3.11'
    text: |-
      Indien een inspectie aan boord van het schip niet kan plaatsvinden op de geplande tijd en plaats, doordat het schip
      of de eigenaar van het schip of zijn vertegenwoordiger niet aanwezig is, is voor de wachttijd van de expert een
      tarief verschuldigd van € 66 per uur. Indien de inspectie geheel vervalt zullen standaard twee werkuren tegen € 66
      per uur in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor een onderzoek voor keuring van onderdelen of uitrustingsstukken waarvoor de goedkeuring van het hoofd van de
      Scheepvaartinspectie of de Commissie van Deskundigen voor de Rijnvaart is voorgeschreven is een tarief verschuldigd
      van € 203.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor het aanwijzen van bedrijven om namens de Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat
      installaties en onderdelen van objecten te mogen keuren wordt een tarief van € 66 in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel4
  - number: '5'
    text: |-
      Voor het keuren van een tekening, een stabiliteitsberekening of een lekberekening is een tarief verschuldigd van
      € 92.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel5
  - number: '6'
    text: |-
      Voor de afgifte en het wijzigen van een certificaat van onderzoek, een certificaat van goedkeuring,
      een communautair certificaat of een communautair aanvullend certificaat, waarbij geen inspectie
      plaatsvindt, en voor de afgifte van een ontheffing, bedoeld in de [artikelen 5a, tweede lid][ref1], en
      [13a, tweede lid, van de Binnenschepenwet][ref2], waarbij geen inspectie plaatsvindt, is, per certificaat, bijlage
      bij een certificaat of verklaring, een tarief verschuldigd van € 52.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel13a
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 13a
  - number: '7'
    text: |-
      Voor de afgifte van een verklaring met betrekking tot de minimumbemanning is een tarief verschuldigd van € 52. Dit
      tarief wordt niet in rekening gebracht, indien gelijktijdig een inspectie aan boord van het schip plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel7
  - number: '8'
    text: |-
      Voor de afgifte van een duplicaat, uittreksel, of gewaarmerkt afschrift van een certificaat van onderzoek, een
      certificaat van goedkeuring, een communautair certificaat, een communautair aanvullend certificaat of een bijlage
      bij een certificaat of verklaring is een tarief verschuldigd van € 63.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk in het buitenland worden uitgevoerd, is een
      aanvullend tarief verschuldigd van € 66 per uur per ambtenaar voor de duur van de reis van en naar het buitenland
      en de eventuele wachttijd tijdens het verblijf aldaar. Bij de berekening van de tijdsduur van de reis van en naar
      het buitenland en het verblijf aldaar wordt uitgegaan van maximaal acht uren per etmaal.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel9
  - number: '9.2'
    text: |-
      De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken in
      het buitenland komen voor rekening van de opdrachtgever. Deze kosten worden afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel9
  - number: '9.3'
    text: |-
      In afwijking van het eerste en tweede lid is het aanvullende tarief niet verschuldigd, indien het onderzoek
      plaatsvindt in België of Duitsland, binnen een afstand van 50 km van de Nederlands-Belgische grens of Nederlands-
      Duitse grens.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen 18.00
      uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1] daaraan
      gelijkgestelde dag, is een aanvullend tarief van € 33 per uur per ambtenaar verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '10.2'
    text: |-
      Het in het eerste lid genoemde tarief is eveneens voor uitgevoerde onderzoeken in het buitenland buiten de daar ter
      plaatse geldende werktijden verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel10
  - number: '11'
    text: |-
      Alvorens een onderzoek of keuring wordt aangevangen, kan vooruitbetaling van het naar verwachting verschuldigde
      tarief worden verlangd.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel11
  - number: '12'
    text: De [Regeling tarieven onderzoek binnenschepen 2003](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel12
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling tarieven onderzoek binnenschepen 2004.'
    url: https://wetten.overheid.nl/BWBR0016081/2004-01-01#Artikel14
