      2 Bij annulering of het later aanpassen van een schriftelijke aanvraag zullen naast de kosten voor reeds
      uitgevoerde werkzaamheden, berekend volgens het gestelde in [artikel 3][ref1], standaard twee werkuren in rekening
      worden gebracht tegen een tarief van € 66 per uur.

      3 Indien een scheepstype niet is genoemd in de in het eerste lid opgenomen tabel, wordt door de inspecteur-generaal
      van de Inspectie Verkeer en Waterstaat het verschuldigde tarief gebaseerd op het tarief van het scheepstype dat
      hiermee het meest overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0016081#Artikel3
