articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. certificaat van onderzoek: het certificaat, bedoeld in [artikel 5, eerste lid, van de Binnenschepenwet][ref1] en
      [artikel 1.03 van het Reglement onderzoek schepen op de Rijn 1995][ref2];

      b. certificaat van goedkeuring: het certificaat, bedoeld in bijlage 1, B1, Rn. 10.282 en bijlage 1, B2, Rn.
      210.282, van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen;

      c. communautair certificaat: het certificaat, bedoeld in [artikel 1, eerste lid, onder ][ref3];

      d. communautair aanvullend certificaat: het certificaat, bedoeld in [artikel 1, eerste lid, onder ][ref4];

      e. uitgebreide proefvaart: beproeving tijdens de vaart teneinde aan te tonen dat wordt voldaan aan de gestelde
      eisen die niet bij een stilliggend schip zijn vast te stellen;

      f. beperkte proefvaart: beproeving tijdens een kortdurende vaart teneinde aan te tonen dat wordt voldaan aan eisen
      die worden gesteld aan een stuurinrichting, dan wel aan de maximaal toelaatbare geluidsniveaus;

      g. verklaring minimumbemanning: de verklaring, bedoeld in
      [artikel 23.09, tweede lid, van het Reglement onderzoek schepen op de Rijn 1995][ref5] en
      [artikel 13, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref6].


