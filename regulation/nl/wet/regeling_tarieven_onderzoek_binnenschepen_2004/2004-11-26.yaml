  - number: '11'
    text: |-
      Alvorens een onderzoek of keuring wordt aangevangen, kan vooruitbetaling van het naar verwachting verschuldigde
      tarief worden verlangd.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel11
