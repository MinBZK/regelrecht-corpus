      behoeve van nieuw gebouwde schepen is het tarief verschuldigd, genoemd in onderstaande tabel, kolom 1;

      b. een certificaat van goedkeuring in combinatie met een van de certificaten, genoemd in onderdeel a, ten behoeve
      van nieuw gebouwde schepen, is het tarief verschuldigd, genoemd in onderstaande tabel, kolom 2.









