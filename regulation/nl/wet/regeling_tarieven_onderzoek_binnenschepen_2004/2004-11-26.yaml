  - number: '3'
    text: |-
      1 Voor het onderzoek en verdere werkzaamheden nodig voor de eerste of hernieuwde afgifte van een certificaat van
      onderzoek, een communautair certificaat, een communautair aanvullend certificaat of een certificaat van goedkeuring
      ten behoeve van bestaande schepen, dan wel voor het wijzigen van voornoemde certificaten ten behoeve van deze
      schepen is een tarief verschuldigd dat wordt berekend aan de hand van het aantal inspecties aan boord van het
      schip.

      2 Voor de inspecties aan boord van het schip zijn de volgende tarieven verschuldigd:

      a. voor de eerste inspectie, voor de eerste afgifte of vernieuwing van de geldigheidsduur van een certificaat
      € 243;

      b. voor de tweede en volgende inspecties en voor inspecties gedurende de looptijd van een certificaat € 211;

      c. in afwijking van onderdeel a, voor open rondvaartboten, voor de eerste inspectie € 211.

      3 Indien bij de inspecties aan boord van het schip gelijktijdig een elektrotechnisch onderzoek en een
      scheepsbouwkundig onderzoek plaatsvindt, worden deze onderzoeken als afzonderlijke inspecties aangemerkt.

      4 Indien het onderzoek, bedoeld in het eerste lid, plaatsvindt ten behoeve van de afgifte of wijziging van een
      certificaat van onderzoek of een communautair certificaat in combinatie met de eerste afgifte of verlenging van de
      geldigheidsduur van een certificaat van goedkeuring, wordt het verschuldigde tarief voor deze inspectie verhoogd
      met € 180.

      5 Indien het onderzoek, bedoeld in het eerste lid, plaatsvindt ten behoeve van de afgifte of wijziging van
      een certificaat van onderzoek in combinatie met de eerste afgifte of verlenging van de geldigheidsduur van een
      communautair aanvullend certificaat, wordt het verschuldigde tarief voor de eerste inspectie verhoogd met € 130.

      6 Indien een uitgebreide proefvaart deel uitmaakt van een inspectie aan boord van het schip, wordt het
      verschuldigde tarief voor die inspectie, ongeacht het aantal gelijktijdig uitgevoerde onderzoeken, bedoeld in het
      derde lid, verhoogd met € 309.

      7 Indien een beperkte proefvaart, een hellingproef of een diepgangscontrole deel uitmaakt van een inspectie aan
      boord van het schip, wordt het verschuldigde tarief voor die inspectie verhoogd met € 144.

      8 Indien een droogzetting deel uitmaakt van een inspectie als bedoeld in het tweede lid, wordt het verschuldigde
      tarief voor die inspectie, tenzij het een open rondvaartboot betreft, verhoogd met de volgende bedragen:

      a. indien het een schip betreft met een lengte van minder dan 35 meter en er geen volledige diktemeting door de
      Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 147;

      b. indien het een schip betreft met een lengte van minder dan 35 meter en er een volledige diktemeting door de
      Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 213;

      c. indien het een schip betreft met een lengte van 35 meter of meer en er geen volledige diktemeting door de
      Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 213;

      d. indien het een schip betreft met een lengte van 35 meter of meer en er een volledige diktemeting door de Divisie
      Scheepvaart van de Inspectie Verkeer en Waterstaat wordt uitgevoerd: € 279.

      9 Voor het opmaken of wijzigen van de in dit artikel genoemde certificaten is een tarief verschuldigd van € 52
      per certificaat.

      10 Voor werkzaamheden op verzoek zoals het afstempelen van plaatjes, het opnieuw verzegelen van lensafsluiters e.d.
      is een tarief per uur verschuldigd van € 66.

      11 Indien een inspectie aan boord van het schip niet kan plaatsvinden op de geplande tijd en plaats, doordat het
      schip of de eigenaar van het schip of zijn vertegenwoordiger niet aanwezig is, is voor de wachttijd van de expert
      een tarief verschuldigd van € 66 per uur. Indien de inspectie geheel vervalt zullen standaard twee werkuren tegen €
      66 per uur in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel3
  - number: '4'
    text: |-
      1 Voor een onderzoek voor keuring van onderdelen of uitrustingsstukken waarvoor de goedkeuring van de inspecteur-
      generaal van de Inspectie Verkeer en Waterstaat of de Commissie van Deskundigen voor de Rijnvaart is voorgeschreven
      is een tarief verschuldigd van € 203.

      2 Voor het aanwijzen van bedrijven om namens de Divisie Scheepvaart van de Inspectie Verkeer en Waterstaat
      installaties en onderdelen van objecten te mogen keuren wordt een tarief van € 66 in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel4
  - number: '5'
    text: |-
      Voor het keuren van een tekening, een stabiliteitsberekening of een lekberekening is een tarief verschuldigd van
      € 92.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel5
  - number: '6'
    text: |-
      Voor de afgifte en het wijzigen van een certificaat van onderzoek, een certificaat van goedkeuring,
      een communautair certificaat of een communautair aanvullend certificaat, waarbij geen inspectie
      plaatsvindt, en voor de afgifte van een ontheffing, bedoeld in de [artikelen 5a, tweede lid][ref1], en
      [13a, tweede lid, van de Binnenschepenwet][ref2], waarbij geen inspectie plaatsvindt, is, per certificaat, bijlage
      bij een certificaat of verklaring, een tarief verschuldigd van € 52.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel13a
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0003443
        artikel: 13a
  - number: '7'
    text: |-
      Voor de afgifte van een verklaring met betrekking tot de minimumbemanning is een tarief verschuldigd van € 52. Dit
      tarief wordt niet in rekening gebracht, indien gelijktijdig een inspectie aan boord van het schip plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel7
  - number: '8'
    text: |-
      Voor de afgifte van een duplicaat, uittreksel, of gewaarmerkt afschrift van een certificaat van onderzoek, een
      certificaat van goedkeuring, een communautair certificaat, een communautair aanvullend certificaat of een bijlage
      bij een certificaat of verklaring is een tarief verschuldigd van € 63.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel8
  - number: '9'
    text: |-
      1 Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk in het buitenland worden uitgevoerd,
      is een aanvullend tarief verschuldigd van € 66 per uur per ambtenaar voor de duur van de reis van en naar het
      buitenland en de eventuele wachttijd tijdens het verblijf aldaar. Bij de berekening van de tijdsduur van de reis
      van en naar het buitenland en het verblijf aldaar wordt uitgegaan van maximaal acht uren per etmaal.

      2 De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de opdrachtgever. Deze kosten worden afzonderlijk in rekening gebracht.

      3 In afwijking van het eerste en tweede lid is het aanvullende tarief niet verschuldigd, indien het onderzoek
      plaatsvindt in België of Duitsland, binnen een afstand van 50 km van de Nederlands-Belgische grens of Nederlands-
      Duitse grens.
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel9
  - number: '10'
    text: |-
      1 Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief van € 33 per uur per ambtenaar verschuldigd.

      2 Het in het eerste lid genoemde tarief is eveneens voor uitgevoerde onderzoeken in het buitenland buiten de daar
      ter plaatse geldende werktijden verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016081/2004-11-26#Artikel10
