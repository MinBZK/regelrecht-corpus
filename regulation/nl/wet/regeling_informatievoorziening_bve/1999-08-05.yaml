articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet:

      de Wet educatie en beroepsonderwijs;

      b. minister:

      de minister van onderwijs, cultuur en wetenschappen;

      c. instelling:

      een instelling als bedoeld in artikel 1.3.1 van de wet, een instituut als bedoeld in artikel 12.3.8 van de wet, of
      een hogeschool als bedoeld in artikel 12.3.9 van de wet;

      d. gemeentebestuur:

      een bestuur van een gemeente als bedoeld in artikel 2.3.1 van de wet;

      e. landelijk orgaan:

      een landelijk orgaan als bedoeld in artikel 1.5.1 van de wet;

      f. kengetallen:

      de gegevens, bedoeld in de artikelen 2.3.6, derde lid, 2.5.5, derde lid, en 2.5.10, eerste lid, juncto artikel
      2.5.5, van de wet.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel1
  - number: '2'
    text: |-
      Het doel van de regeling is het vaststellen van voorschriften omtrent:

      a. de wijze van ordening van de informatie waarover de besturen en de bevoegde gezagsorganen als bedoeld in de
      artikelen 2.3.6, eerste lid, 2.5.5, eerste lid, 2.5.10, eerste lid, 12.3.8, eerste lid, en 12.3.9, eerste lid, van
      de wet beschikken.

      b. de kengetallen waarover informatie beschikbaar is of wordt verstrekt, en

      c. de wijze van beschikbaarstellen van de gegevens.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel2
  - number: '3'
    text: |-
      1 De informatieverzameling, bedoeld in de artikelen 2.3.6, 2.5.5 en 2.5.3, negende lid, van de wet, waarover
      het bevoegd gezag van de instelling dient te beschikken, bevat de gegevens volgens de beschrijving in het
      gegevenswoordenboek dat is opgenomen in de bijlagen 1 en 1a tot en met 1e bij deze regeling.

      2 De informatieverzameling, bedoeld in artikel 2.3.6 van de wet, waarover het gemeentebestuur dient te beschikken,
      bevat de gegevens volgens de beschrijving in het gegevenswoordenboek dat is opgenomen in bijlage 2 bij deze
      regeling.

      3 De informatieverzameling, bedoeld in artikel 2.5.10 juncto de artikelen 2.5.5 en 2.5.3, negende lid, van de wet,
      waarover het bestuur van het landelijk orgaan dient te beschikken, bevat de gegevens volgens de beschrijving in het
      gegevenswoordenboek dat is opgenomen in bijlage 3 bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel3
  - number: '4'
    text: |-
      1 Op verzoek van de minister stelt het bevoegd gezag van de instelling de gegevens die zijn verzameld, aan hem ter
      beschikking overeenkomstig de modellen van formulieren die op het beroepsonderwijs en de educatie van toepassing
      zijn en die zijn opgenomen in bijlage 4 bij deze regeling.

      2 Op verzoek van de minister stelt het gemeentebestuur de gegevens die zijn verzameld, aan hem ter beschikking
      overeenkomstig de modellen van formulieren die op de educatie van toepassing zijn en die zijn opgenomen in bijlage
      5 bij deze regeling.

      3 Op verzoek van de minister stelt het bestuur van het landelijk orgaan de gegevens die zijn verzameld, aan hem
      ter beschikking overeenkomstig de modellen van formulieren die opde werkzaamheden van het landelijk orgaan van
      toepassing zijn en die zijn opgenomen in bijlage 6 bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag van de instelling, het gemeentebestuur en het bestuur van het landelijk orgaan bewaren de
      boeken en bescheiden en informatie op andere informatiedragers die verband houden met de toepassing van deze
      regeling gedurende 5 jaar.

      2 Het bevoegd gezag van de instelling, het gemeentebestuur en het bestuur van het landelijk orgaan bewaren de
      gegevens op zodanige wijze dat daaruit de voor de vaststelling van de geaggregeerde gegevens van belang zijnde
      gegevens kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel5
  - number: '6'
    text: |-
      Deze regeling zal met de toelichting in Uitleg OCenW-Regelingen worden geplaatst, met uitzondering van de bijlagen
      die ter inzage worden gelegd in de bibliotheek van het Ministerie van Onderwijs, Cultuur en Wetenschappen. Van deze
      plaatsing en terinzagelegging zal mededeling worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de derde dag na de datum van uitgifte van Uitleg OCenW-Regelingen,
      waarin deze regeling is geplaatst en werkt met uitzondering van artikel 4 terug tot en met 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling Informatievoorziening BVE'
    url: https://wetten.overheid.nl/BWBR0009777/1999-08-05#Artikel8
