preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van. Oranje-Nassau, enz. enz. enz.

    Allen, die dezen zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de eigen bijdrage in de huurtoeslag met ingang van
    1 januari 2024 te verlagen door een jaarlijks wisselend bedrag op de normhuren in mindering te brengen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049106/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De overeenkomstig [artikel 16 van de Wet op de huurtoeslag][ref1] berekende basishuur wordt:

      a. in 2024 verlaagd met € 37,72;

      b. in 2025 verlaagd met € 37,14;

      c. in 2026 verlaagd met € 48,15;

      d. in 2027 verlaagd met € 47,57;

      e. in 2028 verlaagd met € 46,99;

      f. in 2029 en latere jaren verlaagd met € 46,42.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel16
    url: https://wetten.overheid.nl/BWBR0049106/2026-01-01#Artikel1
    references:
