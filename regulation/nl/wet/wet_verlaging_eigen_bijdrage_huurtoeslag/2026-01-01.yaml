        artikel: '16'
  - number: '2'
    text: Deze wet treedt in werking met ingang van 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0049106/2026-01-01#Artikel2
  - number: '3'
    text: 'Deze wet wordt aangehaald als: Wet verlaging eigen bijdrage huurtoeslag.'
