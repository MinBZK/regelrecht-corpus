preamble:
  text: |-
    Gelet op artikel 11.10, eerste en vierde lid, van de Telecommunicatiewet en artikel 9, onderdeel b, van Richtlijn
    nr. 97/66/EG van het Europees Parlement en de Raad van de Europese Unie van 15 december 1997 betreffende de
    verwerking van persoonsgegevens en de bescherming van de persoonlijke levenssfeer in de telecommunicatiesector
    (PbEG 1998, L24),

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009991/2004-05-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als beheerders van de alarmnummers voor publieke diensten, bedoeld in
      [artikel 11.10, eerste lid, van de Telecommunicatiewet][ref1], worden aangewezen de korpsbeheerders, bedoeld in
      [artikel 23 van de Politiewet 1993][ref2], en de Minister van Justitie als beheerder van het Korps landelijke
      politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel23
    url: https://wetten.overheid.nl/BWBR0009991/2004-05-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '23'
  - number: '2'
    text: |-
      Als publieke diensten belast met hulpverleningstaken, bedoeld in
      [artikel 11.10, vijfde lid, van de Telecommunicatiewet][ref1], worden aangewezen de gemeentelijke en regionale
      brandweerkorpsen, de ambulancediensten aan wie krachtens de [Wet Ambulancevervoer][ref2] vergunning is verleend
      voor het verrichten van ambulancevervoer, de regionale politiekorpsen en het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002757
    url: https://wetten.overheid.nl/BWBR0009991/2004-05-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002757
  - number: '3'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop [artikel 11.10 van de Telecommunicatiewet][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
    url: https://wetten.overheid.nl/BWBR0009991/2004-05-19#Artikel3
