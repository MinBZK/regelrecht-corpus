        artikel: '27'
  - number: '2'
    text: |-
      Als publieke diensten belast met hulpverleningstaken, bedoeld in
      [artikel 11.10, vijfde lid, van de Telecommunicatiewet][ref1], worden aangewezen de
      gemeentelijke en regionale brandweerkorpsen, de Regionale Ambulancevoorzieningen, bedoeld in
      [artikel 4 van de Wet ambulancezorgvoorzieningen][ref2], en de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel4
    url: https://wetten.overheid.nl/BWBR0009991/2022-09-24#Artikel2
