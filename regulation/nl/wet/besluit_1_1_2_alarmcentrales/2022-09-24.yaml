articles:
  - number: '1'
    text: |-
      Als beheerder van de alarmnummers voor publieke diensten, bedoeld in
      [artikel 11.10, eerste lid, van de Telecommunicatiewet][ref1], wordt aangewezen de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0009991/2022-09-24#Artikel1
