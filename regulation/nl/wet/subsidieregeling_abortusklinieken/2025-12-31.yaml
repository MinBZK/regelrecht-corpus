---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_abortusklinieken
regulatory_layer: WET
publication_date: '2014-08-07'
valid_from: '2025-12-31'
bwb_id: BWBR0035433
url: https://wetten.overheid.nl/BWBR0035433/2025-12-31
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet VWS-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.a
    text: '*minister:* Minister voor Medische Zorg;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.c
    text: |-
      *zwangerschapsafbreking:* behandeling, gericht op het afbreken van zwangerschap, met inbegrip van de daaraan
      verbonden gesprekken, nazorg en nacontrole;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.d
    text: '*eerste trimesterbehandeling:* zwangerschapsafbreking tot en met 12 weken en 6 dagen amenorroe;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.e
    text: '*tweede trimesterbehandeling:* zwangerschapsafbreking vanaf 13 weken amenorroe;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.f
    text: |-
      *consult:* gesprek met een arts in verband met het voornemen om een zwangerschap af te breken zonder dat in die
      zwangerschap in die betreffende kliniek een afbreking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.g
    text: |-
      *PSA (procedurele sedatie en/of analgesie):* het toedienen van een sedativum of (sederend) analgeticum in het kader
      van een zwangerschapsafbreking;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.h
    text: |-
      *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 1.1.i
    text: |-
      *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.1.j
    text: '*langdurige anticonceptie:* een intra-uterien hulpmiddel of etonogestrel implantatiestaafje;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.k
    text: |-
      *algehele anesthesie:* het door middel van narcotica teweegbrengen van een omkeerbare en gecontroleerde toestand
      van bewusteloosheid, pijnloosheid en uitschakeling van lichaamsreflexen;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.l
    text: |-
      *abortushulpverlening:* de activiteiten, bedoeld in [artikel 4][ref1], voor zowel personen die overeenkomstig
      de [Wet langdurige zorg][ref2] zijn verzekerd als personen die niet overeenkomstig de Wet langdurige zorg zijn
      verzekerd;


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035917
  - number: 1.1.m
    text: '*opbrengsten:* baten uit gesubsidieerde abortushulpverlening en baten uit niet-gesubsidieerde abortushulpverlening;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.n
    text: '*kosten:* kosten van abortushulpverlening;'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.o
    text: |-
      *resultaat uit abortushulpverlening:* het verschil tussen baten uit en kosten van abortushulpverlening blijkend uit
      de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.p
    text: |-
      *resultaat uit gesubsidieerde abortushulpverlening:* het resultaat uit abortushulpverlening vermenigvuldigd met de
      baten uit gesubsidieerde abortushulpverlening gedeeld door baten uit abortushulpverlening;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.q
    text: |-
      *egalisatiereserve:* het bedrag dat wordt gevormd door een toevoeging bij een positief resultaat uit gesubsidieerde
      abortushulpverlening en een onttrekking bij een negatief resultaat uit gesubsidieerde abortushulpverlening;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1.1.r
    text: '*richtlijnen:* de Richtlijnen voor de Jaarverslaggeving, zoals vastgesteld door de Raad voor de Jaarverslaggeving.'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: '1.2'
    text: Voor de toepassing van deze regeling wordt onder zwangerschapsafbreking tevens verstaan overtijdbehandeling.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1
  - number: 1a
    text: |-
      Op deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 1b.1
    text: |-
      Het verrichten van de activiteiten, bedoeld in [artikel 2][ref1], wordt aangewezen als een dienst van algemeen
      economisch belang in de zin van artikel 106, tweede lid, van het Verdrag betreffende de werking van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel2
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '2'
        paragraaf: '1'
  - number: 1b.2
    text: |-
      Subsidie wordt uitsluitend verstrekt indien de aanvrager met de Staat een overeenkomst sluit waarbij de Staat hem
      belast met en hij zich verplicht tot het verrichten van de dienst van algemeen economisch belang, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel1b
  - number: '2.1'
    text: |-
      De minister kan op aanvraag aan een abortuskliniek als bedoeld in
      [artikel 1 van de Wet afbreking zwangerschap][ref1] subsidie verlenen voor het verrichten van de in
      [artikel 4][ref2] genoemde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: '2.2'
    text: |-
      De subsidie wordt slechts verstrekt ten behoeve van een abortuskliniek met een vergunning als bedoeld in
      [artikel 2 van de Wet afbreking zwangerschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel2
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003396
        artikel: '2'
  - number: '2.3'
    text: |-
      Zwangerschapsafbrekingen komen slechts voor subsidie in aanmerking indien deze worden verleend aan personen die
      overeenkomstig de Wet langdurige zorg zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
  - number: '2.4'
    text: 'Zwangerschapsafbrekingen komen voorts slechts voor subsidie in aanmerking indien deze worden verricht:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
  - number: 2.4.a
    text: onder verantwoordelijkheid van de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
  - number: 2.4.b
    text: in de abortuskliniek ten behoeve waarvan de subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel2
  - number: '3.1'
    text: 'Subsidie wordt slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel3
  - number: 3.1.a
    text: |-
      naar het oordeel van de minister mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen worden
      bereikt;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel3
  - number: 3.1.b
    text: de aanvrager naar het oordeel van de minister de behoefte aan subsidie heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel3
  - number: 3.1.c
    text: |-
      de aanvrager aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen zijn
      om de voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel3
  - number: '3.2'
    text: Het eerste lid, onderdelen b en c, zijn niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel3
  - number: '4.1'
    text: 'De subsidie voor een activiteit als hieronder vermeld, bedraagt maximaal:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.a
    text: € 57 per consult;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.b
    text: € 551 per eerste trimesterbehandeling, indien de zwangerschapsafbreking medicamenteus wordt verricht;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.c
    text: |-
      € 733 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht zonder PSA of algehele anesthesie;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.d
    text: |-
      € 864 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een abortusarts;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.e
    text: |-
      € 896 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht, waarbij PSA of algehele anesthesie wordt toegepast door een anesthesioloog;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.f
    text: |-
      € 1.053 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 13 tot en met
      17 weken en 6 dagen amenorroe wordt verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een
      abortusarts;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.g
    text: |-
      € 1.142 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 13 tot en met
      17 weken en 6 dagen amenorroe wordt verricht, waarbij PSA of algehele anesthesie wordt toegepast door een
      anesthesioloog;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.h
    text: |-
      € 1.351 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 18 weken amenorroe
      wordt verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een abortusarts;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.i
    text: |-
      € 1.499 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 18 weken amenorroe
      wordt verricht, waarbij PSA of algehele anesthesie wordt toegepast door een anesthesioloog;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.j
    text: |-
      € 97 voor het plaatsen van langdurige anticonceptie binnen een periode van acht weken aansluitend op een
      zwangerschapsafbreking;
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: 4.1.k
    text: € 67 per anticonceptieconsult.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid, onder b tot en met j, vermelde bedragen omvatten mede de kosten van gesprekken, nazorg en
      nacontrole.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel4
  - number: '5.1'
    text: De subsidie wordt voor de periode van een boekjaar verleend.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel5
  - number: '5.2'
    text: |-
      De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar, tenzij bij de subsidieverlening anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel5
  - number: '6.1'
    text: |-
      De aanvraag tot verlening van de subsidie wordt ingediend uiterlijk dertien weken voor de aanvang van het boekjaar
      waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
  - number: '6.2'
    text: De minister kan vrijstelling en ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
  - number: '6.3'
    text: Voor een aanvraag tot verlening van de subsidie wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
  - number: '6.4'
    text: |-
      Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
  - number: '6.5'
    text: 'De aanvraag tot verlening van de subsidie gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
  - number: 6.5.a
    text: |-
      een overzicht van het aantal te verrichten activiteiten, bedoeld in [artikel 4][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 6.5.b
    text: |-
      een ondertekende overeenkomst voor het vestigen van een dienst van algemeen economisch belang, als bedoeld in
      [artikel 1b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel1b
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: 1b
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Indien de aanvraag tot verlening van de subsidie wordt ingediend door een privaatrechtelijke rechtspersoon waaraan
      de minister geen subsidie heeft verstrekt ten behoeve van het boekjaar voorafgaand aan het boekjaar waarvoor de
      subsidie wordt aangevraagd, gaat de aanvraag voorts vergezeld van:
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel7
  - number: 7.1.a
    text: |-
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd en
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel7
  - number: 7.1.b
    text: |-
      de laatst opgemaakte jaarrekening dan wel de balans en de staat van baten en lasten en de toelichting daarop of,
      indien deze bescheiden ontbreken, een verslag over de financiële positie van de aanvrager op het moment van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel7
  - number: '7.2'
    text: De minister kan vrijstelling en ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel7
  - number: '8'
    text: De minister besluit binnen dertien weken na ontvangst van de aanvraag over de verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel8
  - number: '9'
    text: 'De minister bepaalt bij het besluit tot verlening van de subsidie:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
  - number: 9.a
    text: voor welke periode de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
  - number: 9.b
    text: |-
      voor welke activiteiten, bedoeld in [artikel 4][ref1], de subsidie wordt verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 9.c
    text: |-
      het aantal activiteiten, bedoeld in [artikel 4][ref1], waarvoor subsidie wordt verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 9.d
    text: |-
      het bedrag dat per activiteit, bedoeld in [artikel 4][ref1], aan subsidie wordt verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 9.e
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat de activiteiten, bedoeld in [artikel 4][ref1], waarvoor de
      subsidie is verleend, zijn verricht en


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 9.f
    text: |-
      op welke wijze de subsidieontvanger kan aantonen dat voldaan is aan de verplichtingen die verbonden zijn aan de
      verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel9
  - number: '10.1'
    text: |-
      De minister verleent bij het besluit tot verlening van een subsidie ambtshalve tevens de volgende voorschotten:
      in januari 8%, februari 8%, maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%, oktober 8%,
      november 8% en december 7% van het bedrag van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel10
  - number: '10.2'
    text: |-
      Op verzoek van de subsidieontvanger of indien een aanvraag van een subsidie later is ingediend dan in
      [artikel 6][ref1] is bepaald, kan de minister van het eerste lid afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel6
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '6'
        paragraaf: '2'
  - number: '11'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '12'
    text: |-
      De subsidieontvanger draagt er zorg voor dat geen betalingen van verzekerden als bedoeld in
      [artikel 2, derde lid][ref1], worden gevraagd voor de gesubsidieerde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel2
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '2'
        paragraaf: '1'
  - number: '13'
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel13
  - number: 13.a
    text: de doelstellingen van de gesubsidieerde activiteiten op doelmatige wijze worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel13
  - number: 13.b
    text: de uitvoering van de gesubsidieerde activiteiten op verantwoorde wijze wordt bestuurd en
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel13
  - number: 13.c
    text: de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden beheerd.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel13
  - number: '14.1'
    text: 'De subsidieontvanger neemt het volgende op in zijn administratie:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel14
  - number: 14.1.a
    text: |-
      het aantal verrichte activiteiten, bedoeld in [artikel 4][ref1], per zwangerschap van een cliënt alsmede de datum
      waarop de activiteiten zijn verricht en


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 14.1.b
    text: de ontvangsten en betalingen, duidelijk traceerbaar naar bron en bestemming.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel14
  - number: '14.2'
    text: De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel14
  - number: '14.3'
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel14
  - number: '15.1'
    text: 'De subsidieontvanger meldt meteen aan de minister als:'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel15
  - number: 15.1.a
    text: |-
      het tijdens de periode waarvoor de subsidie is verleend aannemelijk is geworden dat de activiteiten waarvoor de
      subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel15
  - number: 15.1.b
    text: het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan of
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel15
  - number: 15.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel15
  - number: '15.2'
    text: |-
      De melding wordt schriftelijk gedaan. De melding wordt voorzien van een toelichting. Bij de melding worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel15
  - number: '16'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel16
  - number: '17'
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen
      te verschaffen:
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel17
  - number: 17.a
    text: die van belang zijn voor het nemen van een besluit over het verstrekken van de subsidie of
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel17
  - number: 17.b
    text: voor de ontwikkeling van het beleid van de minister of
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel17
  - number: 17.c
    text: |-
      voor het berekenen van tarieven voor de activiteiten, bedoeld in [artikel 4][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: 17.d
    text: |-
      voor het verkrijgen van een volledig en recent overzicht van de financiële situatie van de subsidieontvanger,
      alsook van de rechtspersoon of rechtspersonen waarover de subsidieontvanger direct of indirect zeggenschap
      uitoefent.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel17
  - number: '18.1'
    text: |-
      De subsidieontvanger verzekert haar roerende en onroerende zaken op afdoende wijze tegen het risico van diefstal en
      brand alsmede tegen het risico van wettelijke aansprakelijkheid tegenover derden.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel18
  - number: '18.2'
    text: |-
      De subsidieontvanger verzekert de wettelijke aansprakelijkheid van vrijwilligers die werkzaamheden verrichten in
      het kader van de gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel18
  - number: '18.3'
    text: Op verzoek van de subsidieontvanger kan de minister ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel18
  - number: '19'
    text: |-
      [Artikel 4:71 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met uitzondering van het
      eerste lid, onderdelen b, c, d, e, g, h, i en j.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '20'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verstrekt geheel of gedeeltelijk worden beëindigd of indien
      de subsidie wordt beëindigd, verstrekt de subsidieontvanger aan de minister op diens verzoek alle gegevens,
      bescheiden, informatie, medewerking en gebruiksrechten op auteursrechten die redelijkerwijs verlangd kan worden of
      kunnen worden voor de continuïteit van de activiteiten waarvoor de subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel20
  - number: '21.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een door de minister te bepalen vergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.2'
    text: |-
      De subsidieontvanger meldt meteen aan de minister als zich een geval, bedoeld in
      [artikel 4:41, tweede lid, onder a, b, c en e, van de Algemene wet bestuursrecht][ref1], voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.3'
    text: |-
      Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de zaken en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt, met
      dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: 21.3.a
    text: de waarde van de egalisatiereserve gelijk is aan het bedrag van de egalisatiereserve,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: 21.3.b
    text: |-
      de waarde van een schadevergoeding voor verlies of beschadiging van zaken gelijk is aan het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen, en
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: 21.3.c
    text: |-
      de waarde van onroerende zaken wordt bepaald door drie onafhankelijke deskundigen. De minister en de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: '21.4'
    text: |-
      De vergoeding aan de minister voor goederen en andere vermogensbestanddelen, waaronder de egalisatiereserve, die
      geheel zijn gevormd met de subsidie, is gelijk aan hun waarde. De vergoeding aan de minister voor goederen en
      andere vermogensbestanddelen, die gedeeltelijk zijn gevormd met de subsidie, is gelijk aan de waarde waarmee de
      subsidiëring door de minister in verhouding tot andere middelen aan de vorming van dat vermogen heeft bijgedragen.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: '21.5'
    text: De minister kan de vergoeding in afwijking van het vierde lid op een lager bedrag bepalen.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel21
  - number: '22'
    text: |-
      De minister kan bij de verlening van de subsidie verplichtingen opleggen als bedoeld in de [artikelen 4:38][ref1]
      en [4:39 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '23.1'
    text: |-
      De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het boekjaar waarvoor de subsidie is verleend
      een aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel23
  - number: '23.2'
    text: De minister kan vrijstelling en ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel23
  - number: '24.1'
    text: Voor een aanvraag van de vaststelling van een subsidie wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: '24.2'
    text: |-
      Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: '24.3'
    text: |-
      De aanvraag tot vaststelling van de subsidie gaat vergezeld van een jaarverantwoording van de subsidieontvanger,
      bestaande uit:
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: 24.3.a
    text: een bestuursverslag,
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: 24.3.b
    text: een jaarrekening met inbegrip van door de minister vastgestelde modellen en
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: 24.3.c
    text: |-
      een controleverklaring bij de jaarrekening opgesteld door een accountant overeenkomstig een door de minister
      vastgesteld model met inachtneming van een door de minister vastgesteld protocol, indien de subsidieverlening
      € 125.000 of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
  - number: '24.4'
    text: |-
      Op de jaarverantwoording van de subsidieontvanger is[ Titel 9 Boek 2 van het Burgerlijk Wetboek][ref1] van
      overeenkomstige toepassing, met uitzondering van de [afdelingen 1][ref2], [10][ref3], [11][ref4], [12][ref5],
      [14][ref6], [15][ref7] en [16][ref8], een en ander voor zover in deze regeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling10
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Afdeling14
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Afdeling15
      [ref8]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '10'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref5
        bwb_id: BWBR0003045
        afdeling: '12'
      - id: ref6
        bwb_id: BWBR0003045
        afdeling: '14'
      - id: ref7
        bwb_id: BWBR0003045
        afdeling: '15'
      - id: ref8
        bwb_id: BWBR0003045
        afdeling: '16'
  - number: '25.1'
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt de minister een
      besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel25
  - number: '25.2'
    text: |-
      De subsidie wordt vastgesteld op de bedragen per activiteit, bedoeld in [artikel 4, eerste lid][ref1],
      voor het aantal activiteiten dat is verricht in het jaar waarvoor de subsidie is verleend, verminderd met
      de eventuele overschrijding van de maximaal toegestane toevoeging aan de egalisatiereserve als bedoeld in
      [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel28
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035433
        artikel: '28'
        paragraaf: '7'
  - number: '26.1'
    text: De subsidieontvanger vormt in de jaarrekening als onderdeel van het eigen vermogen een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel26
  - number: '26.2'
    text: |-
      De egalisatiereserve bedraagt ten minste € 0 en ten hoogste 10% van het bij het besluit tot vaststelling bepaalde
      bedrag van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel26
  - number: '26.3'
    text: |-
      Voor een periode van drie jaar na aanvang van het boekjaar waarvoor de subsidie voor het eerst is verstrekt
      bedraagt de egalisatiereserve ten hoogste 20% van het bij het besluit tot vaststelling bepaalde bedrag van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel26
  - number: '27.1'
    text: |-
      De egalisatiereserve wordt in een boekjaar uitsluitend besteed aan activiteiten waarvoor de subsidie in dat
      boekjaar is verleend.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel27
  - number: '27.2'
    text: De besteding van de egalisatiereserve wordt verantwoord in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel27
  - number: '28.1'
    text: |-
      De maximale toevoeging aan de egalisatiereserve is het bedrag dat aan de egalisatiereserve kan worden toegevoegd
      zonder de maximale omvang daarvan te overschrijden. De maximale onttrekking aan de egalisatiereserve is het bedrag
      van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel28
  - number: '28.2'
    text: |-
      Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt dat bedrag bij de
      vaststelling in mindering gebracht op de subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel28
  - number: '28.3'
    text: |-
      Voor de toepassing van de vorige leden worden uitsluitend in aanmerking genomen de kosten en opbrengsten uit
      gesubsidieerde abortushulpverlening.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel28
  - number: '28.4'
    text: |-
      Kosten die worden veroorzaakt door toevoegingen aan voorzieningen zijn geen onderdeel van het resultaat uit
      gesubsidieerde abortushulpverlening, tenzij de minister met deze toevoegingen schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel28
  - number: '29'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel29
  - number: '30'
    text: Deze regeling treedt in werking met ingang van 1 januari 2021 en vervalt met ingang van 1 januari 2031.
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel30
  - number: '31'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling abortusklinieken.'
    url: https://wetten.overheid.nl/BWBR0035433/2025-12-31#Artikel31
