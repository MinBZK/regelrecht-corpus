  - number: '25'
    text: |-
      1 Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt de minister een
      besluit op de aanvraag.

      2 De subsidie wordt vastgesteld op de bedragen per activiteit, bedoeld in [artikel 4, eerste lid][ref1],
      voor het aantal activiteiten dat is verricht in het jaar waarvoor de subsidie is verleend, verminderd met
      de eventuele overschrijding van de maximaal toegestane toevoeging aan de egalisatiereserve als bedoeld in
      [artikel 28, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel28
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035433
        artikel: '28'
        paragraaf: '7'
  - number: '26'
    text: |-
      1 De subsidieontvanger vormt in de jaarrekening als onderdeel van het eigen vermogen een egalisatiereserve.

      2 De egalisatiereserve bedraagt ten minste € 0 en ten hoogste 10% van het bij het besluit tot verlening bepaalde
      bedrag van de subsidie.

      3 Voor een periode van drie jaar na oprichting van de subsidieontvanger bedraagt de egalisatiereserve ten hoogste
      20% van het bij het besluit tot verlening bepaalde bedrag van de subsidie.

      4 Indien de subsidie wordt verlaagd wegens het niet of niet geheel verrichten van de activiteiten waarvoor de
      subsidie is verleend, wordt de maximaal toegestane egalisatiereserve berekend op basis van de verlaagde subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel26
  - number: '27'
    text: |-
      1 De egalisatiereserve wordt in een boekjaar uitsluitend besteed aan activiteiten waarvoor de subsidie in dat
      boekjaar is verleend.

      2 De besteding van de egalisatiereserve wordt verantwoord in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel27
  - number: '28'
    text: |-
      1 De maximale toevoeging aan de egalisatiereserve is het bedrag dat aan de egalisatiereserve kan worden toegevoegd
      zonder de maximale omvang daarvan te overschrijden. De maximale onttrekking aan de egalisatiereserve is het bedrag
      van de egalisatiereserve.

      2 Voor zover het voor de toevoeging beschikbare bedrag hoger is dan de maximale toevoeging, wordt dat bedrag bij de
      vaststelling in mindering gebracht op de subsidie.

      3 Voor de toepassing van de vorige leden worden uitsluitend in aanmerking genomen de kosten en opbrengsten uit
      gesubsidieerde abortushulpverlening.

      4 Kosten die worden veroorzaakt door toevoegingen aan voorzieningen zijn geen onderdeel van het resultaat uit
      gesubsidieerde abortushulpverlening, tenzij de minister met deze toevoegingen schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel28
  - number: '29'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel29
  - number: '30'
    text: Deze regeling treedt in werking met ingang van 1 januari 2021 en vervalt met ingang van 31 december 2025.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel30
  - number: '31'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling abortusklinieken.'
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel31
