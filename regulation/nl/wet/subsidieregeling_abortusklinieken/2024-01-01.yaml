  - number: '23'
    text: |-
      1 De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het boekjaar waarvoor de subsidie is verleend
      een aanvraag tot vaststelling van de subsidie in.

      2 De minister kan vrijstelling en ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel23
  - number: '24'
    text: |-
      1 Voor een aanvraag van de vaststelling van een subsidie wordt een door de minister vastgesteld formulier gebruikt.

      2 Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.

      3 De aanvraag tot vaststelling van de subsidie gaat vergezeld van een jaarverantwoording van de subsidieontvanger,
      bestaande uit:

      a. een bestuursverslag,

      b. een jaarrekening met inbegrip van door de minister vastgestelde modellen en

      c. een controleverklaring bij de jaarrekening opgesteld door een accountant overeenkomstig een door de minister
      vastgesteld model met inachtneming van een door de minister vastgesteld protocol, indien de subsidieverlening
      € 125.000 of meer bedraagt.

      4 Op de jaarverantwoording van de subsidieontvanger is[ Titel 9 Boek 2 van het Burgerlijk Wetboek][ref1] van
      overeenkomstige toepassing, met uitzondering van de [afdelingen 1][ref2], [10][ref3], [11][ref4], [12][ref5],
      [14][ref6], [15][ref7] en [16][ref8], een en ander voor zover in deze regeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
