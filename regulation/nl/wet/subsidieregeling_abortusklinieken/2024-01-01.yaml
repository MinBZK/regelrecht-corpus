  - number: '11'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '12'
    text: |-
      De subsidieontvanger draagt er zorg voor dat geen betalingen van verzekerden als bedoeld in
      [artikel 2, derde lid][ref1], worden gevraagd voor de gesubsidieerde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel2
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '2'
        paragraaf: '1'
  - number: '13'
    text: |-
      De subsidieontvanger zorgt ervoor dat:

      a. de doelstellingen van de gesubsidieerde activiteiten op doelmatige wijze worden nagestreefd,

      b. de uitvoering van de gesubsidieerde activiteiten op verantwoorde wijze wordt bestuurd en

      c. de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden
      beheerd.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidieontvanger neemt het volgende op in zijn administratie:

      a. het aantal verrichte activiteiten, bedoeld in [artikel 4][ref1], per zwangerschap van een cliënt alsmede de
      datum waarop de activiteiten zijn verricht en

      b. de ontvangsten en betalingen, duidelijk traceerbaar naar bron en bestemming.

      2 De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.

      3 De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: '15'
    text: |-
      1 De subsidieontvanger meldt meteen aan de minister als:

      a. het tijdens de periode waarvoor de subsidie is verleend aannemelijk is geworden dat de activiteiten waarvoor de
      subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht,

      b. het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan of

      c. zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.

      2 De melding wordt schriftelijk gedaan. De melding wordt voorzien van een toelichting. Bij de melding worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel15
  - number: '16'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel16
  - number: '17'
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen
      te verschaffen:

      a. die van belang zijn voor het nemen van een besluit over het verstrekken van de subsidie of

      b. voor de ontwikkeling van het beleid van de minister of

      c. voor het berekenen van tarieven voor de activiteiten, bedoeld in [artikel 4][ref1], of

      d. voor het verkrijgen van een volledig en recent overzicht van de financiële situatie van de subsidieontvanger,
      alsook van de rechtspersoon of rechtspersonen waarover de subsidieontvanger direct of indirect zeggenschap
      uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
  - number: '18'
    text: |-
      1 De subsidieontvanger verzekert haar roerende en onroerende zaken op afdoende wijze tegen het risico van diefstal
      en brand alsmede tegen het risico van wettelijke aansprakelijkheid tegenover derden.

      2 De subsidieontvanger verzekert de wettelijke aansprakelijkheid van vrijwilligers die werkzaamheden verrichten in
      het kader van de gesubsidieerde activiteiten.

      3 Op verzoek van de subsidieontvanger kan de minister ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel18
  - number: '19'
    text: |-
      [Artikel 4:71 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met uitzondering van het
      eerste lid, onderdelen b, c, d, e, g, h, i en j.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel471
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:71
  - number: '20'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verstrekt geheel of gedeeltelijk worden beëindigd of indien
      de subsidie wordt beëindigd, verstrekt de subsidieontvanger aan de minister op diens verzoek alle gegevens,
      bescheiden, informatie, medewerking en gebruiksrechten op auteursrechten die redelijkerwijs verlangd kan worden of
      kunnen worden voor de continuïteit van de activiteiten waarvoor de subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel20
  - number: '21'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger aan de minister een door de minister te bepalen vergoeding verschuldigd.

      2 De subsidieontvanger meldt meteen aan de minister als zich een geval, bedoeld in
      [artikel 4:41, tweede lid, onder a, b, c en e, van de Algemene wet bestuursrecht][ref2], voordoet.

      3 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de zaken en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt, met
      dien verstande dat:

      a. de waarde van de egalisatiereserve gelijk is aan het bedrag van de egalisatiereserve,

      b. de waarde van een schadevergoeding voor verlies of beschadiging van zaken gelijk is aan het bedrag dat als
      schadevergoeding door de subsidieontvanger wordt ontvangen, en

      c. de waarde van onroerende zaken wordt bepaald door drie onafhankelijke deskundigen. De minister en de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.

      4 De vergoeding aan de minister voor goederen en andere vermogensbestanddelen, waaronder de egalisatiereserve,
      die geheel zijn gevormd met de subsidie, is gelijk aan hun waarde. De vergoeding aan de minister voor goederen en
      andere vermogensbestanddelen, die gedeeltelijk zijn gevormd met de subsidie, is gelijk aan de waarde waarmee de
      subsidiëring door de minister in verhouding tot andere middelen aan de vorming van dat vermogen heeft bijgedragen.

      5 De minister kan de vergoeding in afwijking van het vierde lid op een lager bedrag bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel21
    references:
      - id: ref1
