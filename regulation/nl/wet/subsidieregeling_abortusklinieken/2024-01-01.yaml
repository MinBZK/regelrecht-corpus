  - number: '3'
    text: |-
      1 Subsidie wordt slechts verleend indien:

      a. naar het oordeel van de minister mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen worden
      bereikt;

      b. de aanvrager naar het oordeel van de minister de behoefte aan subsidie heeft aangetoond, en

      c. de aanvrager aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen
      zijn om de voorgenomen activiteiten uit te voeren.

      2 Het eerste lid, onderdelen b en c, zijn niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel3
  - number: '4'
    text: |-
      1 De subsidie voor een activiteit als hieronder vermeld, bedraagt maximaal:

      a. € 51 per consult;

      b. € 504 per eerste trimesterbehandeling, indien de zwangerschapsafbreking medicamenteus wordt verricht;

      c. € 671 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht zonder PSA of algehele anesthesie;

      d. € 791 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een abortusarts;

      e. € 820 per eerste trimesterbehandeling, indien de zwangerschapsafbreking door middel van vacuümaspiratie wordt
      verricht, waarbij PSA of algehele anesthesie wordt toegepast door een anesthesioloog;

      f. € 964 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 13 tot en met
      17 weken en 6 dagen amenorroe wordt verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een
      abortusarts;

      g. € 1.045 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 13 tot en
      met 17 weken en 6 dagen amenorroe wordt verricht, waarbij PSA of algehele anesthesie wordt toegepast door een
      anesthesioloog;

      h. € 1.237 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 18 weken amenorroe
      wordt verricht, waarbij PSA wordt toegepast onder verantwoordelijkheid van een abortusarts;

      i. € 1.372 per tweede trimesterbehandeling, indien de zwangerschapsafbreking in de periode vanaf 18 weken amenorroe
      wordt verricht, waarbij PSA of algehele anesthesie wordt toegepast door een anesthesioloog;

      j. € 91 voor het plaatsen van langdurige anticonceptie aansluitend op een zwangerschapsafbreking;

      k. € 60 per anticonceptieconsult dat plaatsvindt in de periode van 1 juli 2023 tot en met 31 december 2024.

      2 De in het eerste lid, onder b tot en met j, vermelde bedragen omvatten mede de kosten van gesprekken, nazorg
      en nacontrole.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel4
  - number: '5'
    text: |-
      1 De subsidie wordt voor de periode van een boekjaar verleend.

      2 De subsidieontvanger stelt het boekjaar gelijk aan het kalenderjaar, tenzij bij de subsidieverlening anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel5
  - number: '6'
    text: |-
      1 De aanvraag tot verlening van de subsidie wordt ingediend uiterlijk dertien weken voor de aanvang van het
      boekjaar waarvoor de subsidie wordt aangevraagd.

      2 De minister kan vrijstelling en ontheffing verlenen van het eerste lid.

      3 Voor een aanvraag tot verlening van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      4 Het aanvraagformulier wordt ondertekend door de aanvrager of door een persoon die bevoegd is de aanvrager te
      vertegenwoordigen.

      5 De aanvraag tot verlening van de subsidie gaat vergezeld van:

      a. een overzicht van het aantal te verrichten activiteiten, bedoeld in [artikel 4][ref1] en

      b. een ondertekende overeenkomst voor het vestigen van een dienst van algemeen economisch belang, als bedoeld in
      [artikel 1b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel1b
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035433
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035433
        artikel: 1b
        paragraaf: '1'
  - number: '7'
    text: |-
      1 Indien de aanvraag tot verlening van de subsidie wordt ingediend door een privaatrechtelijke rechtspersoon
      waaraan de minister geen subsidie heeft verstrekt ten behoeve van het boekjaar voorafgaand aan het boekjaar
      waarvoor de subsidie wordt aangevraagd, gaat de aanvraag voorts vergezeld van:

      a. een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd en

      b. de laatst opgemaakte jaarrekening dan wel de balans en de staat van baten en lasten en de toelichting daarop
      of, indien deze bescheiden ontbreken, een verslag over de financiële positie van de aanvrager op het moment van
      de aanvraag.

      2 De minister kan vrijstelling en ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel7
  - number: '8'
    text: De minister besluit binnen dertien weken na ontvangst van de aanvraag over de verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel8
  - number: '9'
    text: |-
      De minister bepaalt bij het besluit tot verlening van de subsidie:

      a. voor welke periode de subsidie wordt verleend,

      b. voor welke activiteiten, bedoeld in [artikel 4][ref1], de subsidie wordt verleend,

      c. het aantal activiteiten, bedoeld in [artikel 4][ref2], waarvoor subsidie wordt verleend,

      d. het bedrag dat per activiteit, bedoeld in [artikel 4][ref3], aan subsidie wordt verleend,

      e. op welke wijze de subsidieontvanger kan aantonen dat de activiteiten, bedoeld in [artikel 4][ref4], waarvoor de
      subsidie is verleend, zijn verricht en

      f. op welke wijze de subsidieontvanger kan aantonen dat voldaan is aan de verplichtingen die verbonden zijn aan de
      verleende subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0035433#Artikel4
