  - number: '10'
    text: |-
      1 De minister verleent bij het besluit tot verlening van een subsidie ambtshalve tevens de volgende voorschotten:
      in januari 8%, februari 8%, maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%, oktober 8%,
      november 8% en december 7% van het bedrag van de verleende subsidie.

      2 Op verzoek van de subsidieontvanger of indien een aanvraag van een subsidie later is ingediend dan in
      [artikel 6][ref1] is bepaald, kan de minister van het eerste lid afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel6
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel10
