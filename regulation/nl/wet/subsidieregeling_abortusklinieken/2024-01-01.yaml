  - number: 1a
    text: |-
      Op deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 1b
    text: |-
      1 Het verrichten van de activiteiten, bedoeld in [artikel 2][ref1], wordt aangewezen als een dienst van algemeen
      economisch belang in de zin van artikel 106, tweede lid, van het Verdrag betreffende de werking van de Europese
      Unie.

      2 Subsidie wordt uitsluitend verstrekt indien de aanvrager met de Staat een overeenkomst sluit waarbij de Staat hem
      belast met en hij zich verplicht tot het verrichten van de dienst van algemeen economisch belang, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035433#Artikel2
    url: https://wetten.overheid.nl/BWBR0035433/2024-01-01#Artikel1b
    references:
