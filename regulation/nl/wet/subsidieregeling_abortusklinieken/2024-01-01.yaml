        artikel: '2'
        paragraaf: '1'
  - number: '2'
    text: |-
      1 De minister kan op aanvraag aan een abortuskliniek als bedoeld in
      [artikel 1 van de Wet afbreking zwangerschap][ref1] subsidie verlenen voor het verrichten van de in
      [artikel 4][ref2] genoemde activiteiten.

      2 De subsidie wordt slechts verstrekt ten behoeve van een abortuskliniek met een vergunning als bedoeld in
      [artikel 2 van de Wet afbreking zwangerschap][ref3].

      3 Zwangerschapsafbrekingen komen slechts voor subsidie in aanmerking indien deze worden verleend aan personen die
      overeenkomstig de Wet langdurige zorg zijn verzekerd.

      4 Zwangerschapsafbrekingen komen voorts slechts voor subsidie in aanmerking indien deze worden verricht:

      a. onder verantwoordelijkheid van de subsidieontvanger,

      b. in de abortuskliniek ten behoeve waarvan de subsidie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003396#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035433#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003396#Artikel2
