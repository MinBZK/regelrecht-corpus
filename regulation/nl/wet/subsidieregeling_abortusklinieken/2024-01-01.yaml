articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *minister:* Minister voor Medische Zorg;

      b.

      c. *zwangerschapsafbreking:* behandeling, gericht op het afbreken van zwangerschap, met inbegrip van de daaraan
      verbonden gesprekken, nazorg en nacontrole;

      d. *eerste trimesterbehandeling:* zwangerschapsafbreking tot en met 12 weken en 6 dagen amenorroe;

      e. *tweede trimesterbehandeling:* zwangerschapsafbreking vanaf 13 weken amenorroe;

      f. *consult:* gesprek met een arts in verband met het voornemen om een zwangerschap af te breken zonder dat in die
      zwangerschap in die betreffende kliniek een afbreking plaatsvindt;

      g. *PSA (procedurele sedatie en/of analgesie):* het toedienen van een sedativum of (sederend) analgeticum in het
      kader van een zwangerschapsafbreking;

      h. *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1];

      i. *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2];

      j. *langdurige anticonceptie:* een intra-uterien hulpmiddel of etonogestrel implantatiestaafje;

      k. *algehele anesthesie:* het door middel van narcotica teweegbrengen van een omkeerbare en gecontroleerde toestand
      van bewusteloosheid, pijnloosheid en uitschakeling van lichaamsreflexen;

      l. *abortushulpverlening:* de activiteiten, bedoeld in [artikel 4][ref3], voor zowel personen die overeenkomstig
      de [Wet langdurige zorg][ref4] zijn verzekerd als personen die niet overeenkomstig de Wet langdurige zorg zijn
      verzekerd;

      m. *opbrengsten:* baten uit gesubsidieerde abortushulpverlening en baten uit niet-gesubsidieerde
      abortushulpverlening;

      n. *kosten:* kosten van abortushulpverlening;

      o. *resultaat uit abortushulpverlening:* het verschil tussen baten uit en kosten van abortushulpverlening blijkend
      uit de jaarrekening;

      p. *resultaat uit gesubsidieerde abortushulpverlening:* het resultaat uit abortushulpverlening vermenigvuldigd met
      de baten uit gesubsidieerde abortushulpverlening gedeeld door baten uit abortushulpverlening;

      q. *egalisatiereserve:* het bedrag dat wordt gevormd door een toevoeging bij een positief resultaat uit
      gesubsidieerde abortushulpverlening en een onttrekking bij een negatief resultaat uit gesubsidieerde
      abortushulpverlening;

      r. *richtlijnen:* de Richtlijnen voor de Jaarverslaggeving, zoals vastgesteld door de Raad voor de
      Jaarverslaggeving.

      2 Voor de toepassing van deze regeling wordt onder zwangerschapsafbreking tevens verstaan overtijdbehandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
