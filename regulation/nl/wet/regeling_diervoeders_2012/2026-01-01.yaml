  - number: '23'
    text: |-
      Voorschriften van EU-verordeningen als bedoeld in [artikel 6.2, eerste lid, van de wet][ref1] zijn de artikelen 3,
      eerste tot en met vierde lid, en 16 van [verordening (EG) nr. 1831/2003](32003R1831).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
  - number: '24'
    text: |-
      Voorschriften van EU-verordeningen als bedoeld in [artikel 6.2, eerste lid, van de wet][ref1] zijn de artikel 4,
      5, eerste en tweede lid, 6, eerste lid, 8, 9, 11, 13, 14, eerste en tweede lid, 15, 16, 17, eerste en tweede lid,
      18, 19, 20, eerste lid, 22, eerste lid, 23, 24, vijfde lid, tweede volzin, en zesde lid, en 25, vierde lid, van
      [verordening (EG) nr. 767/2009](32009R0767).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
  - number: '26.1'
    text: 'De volgende aanvragen worden bij de minister ingediend:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel26
  - number: 26.1.a
    text: |-
      een aanvraag tot erkenning of registratie als bedoeld in [artikel 14][ref1], dan wel tot wijziging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel14
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 26.1.b
    text: |-
      een aanvraag tot erkenning als bedoeld in [artikel 15][ref1], dan wel tot wijziging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel15
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Een aanvraag wordt in behandeling genomen nadat de op grond van de Regeling NVWA-tarieven verschuldigde retributie
      is betaald.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel26
  - number: '27'
    text: |-
      De houder van een erkenning, registratie of goedkeuring stelt de minister zo spoedig mogelijk, doch uiterlijk
      binnen een maand schriftelijk in kennis van wijziging van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel27
  - number: 27.a
    text: naam, adres of zetel van de houder;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel27
  - number: 27.b
    text: naam, adres of zetel van een bedrijf waarop de erkenning, registratie of goedkeuring betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel27
  - number: 27.c
    text: stopzetting van de activiteit waarop de erkenning, registratie of goedkeuring betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel27
  - number: 27.d
    text: opheffing van zijn onderneming.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel27
  - number: '28'
    text: 'In een openbaar register, dat ter inzage ligt bij de minister, worden de volgende gegevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28
  - number: 28.a
    text: naam, adres en zetel van de houder van een erkenning of registratie;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28
  - number: 28.b
    text: naam, adres en zetel van een bedrijf waarop een erkenning of registratie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28
  - number: 28.c
    text: de bij de erkenning of registratie behorende erkennings-, onderscheidenlijk registratienummers.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28
  - number: 28a.1
    text: |-
      De producent van mengvoeders voor pluimvee bemonstert voedermiddelen bij de aanvoer per productielocatie, indien de
      jaarproductie van die locatie:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.a
    text: 'ten hoogste 4.000 ton bedraagt: ten minste eenmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.b
    text: 'ten hoogste 8.000 ton bedraagt: ten minste tweemaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.c
    text: 'ten hoogste 10.000 ton bedraagt: ten minste driemaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.d
    text: 'ten hoogste 20.000 ton bedraagt: ten minste vijfmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.e
    text: 'ten hoogste 30.000 ton bedraagt: ten minste achtmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.f
    text: 'ten hoogste 40.000 ton bedraagt: ten minste tienmaal per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.1.g
    text: 'meer dan 40.000 ton bedraagt: ten minste 13 maal per kwartaal.'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28a.2
    text: Een monster als bedoeld in het eerste lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28a
  - number: 28b.1
    text: |-
      De producent van mengvoeders voor pluimvee bemonstert van de af te leveren partijen mengvoer van 24 ton die bestemd
      zijn voor:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.1.a
    text: 'vermeerderingsdieren die worden gehouden als grootouderdier of overgrootouderdier: ten minste 50%;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.1.b
    text: 'kippen of kalkoenen die worden opgefokt tot andere vermeerderingsdieren dan bedoeld in onderdeel a: ten minste 20%;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.1.c
    text: 'kippen of kalkoenen die worden gehouden als vermeerderingsdier: ten minste 10%;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.1.d
    text: 'vleeskuikens, leghennen en dieren die worden opgefokt tot leghen: ten minste 5%;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.1.e
    text: 'vleeskalkoenen: ten minste 1 op de 30.'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.2
    text: |-
      De leverancier van voedermiddelen die aan pluimveehouderijen worden geleverd, bemonstert van de af te leveren
      partijen voedermiddelen van 24 ton ten minste 1 op de 30 partijen.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.3
    text: De monsters, bedoeld in het eerste en tweede lid, worden genomen uit de productstroom.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.4
    text: |-
      In aanvulling op het eerste en tweede lid bemonstert de producent van mengvoeders en de leverancier van
      voedermiddelen voor pluimvee ten minste elke zes maanden op kritische punten in het productieproces of het
      logistieke proces, bedoeld in artikel 6 van [verordening (EG) nr. 183/2005](32005R0183) van het Europees Parlement
      en de Raad van 12 januari 2005 tot vaststelling van voorschriften voor diervoederhygiëne (PbEU 2005, L 35).
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28b.5
    text: Een monster als bedoeld in het eerste tot en met vierde lid weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28b
  - number: 28c.1
    text: |-
      De producent van mengvoeders die bestemd zijn voor herkauwende dieren, eenhoevigen of varkens neemt uit de
      productstroom per productielocatie waarvan de jaarproductie:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.a
    text: 'ten hoogste 4.000 ton bedraagt: ten minste twee monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.b
    text: 'ten hoogste 6.000 ton bedraagt: ten minste drie monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.c
    text: 'ten hoogste 8.000 ton bedraagt: ten minste vier monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.d
    text: 'ten hoogste 10.000 ton bedraagt: ten minste vijf monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.e
    text: 'ten hoogste 20.000 ton bedraagt: ten minste tien monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.f
    text: 'ten hoogste 30.000 ton bedraagt: ten minste 15 monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.g
    text: 'ten hoogste 40.000 ton bedraagt: ten minste 20 monsters per kwartaal;'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.1.h
    text: 'meer dan 40.000 ton bedraagt: ten minste 25 monsters per kwartaal.'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.2
    text: Ten minste 50% van de monsters, bedoeld in het eerste lid, worden genomen van mengvoeders.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28c.3
    text: Een monster, bedoeld in het eerste lid, weegt ten minste 60 gram.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28c
  - number: 28d.1
    text: |-
      De producent en de leverancier van voedermiddelen die bestemd zijn voor herkauwende dieren, eenhoevigen of varkens
      nemen per product per toeleverancier een monster van ten minste 60 gram per kwartaal.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.2
    text: |-
      De producent en de leverancier kunnen ten aanzien van een partij voedermiddelen schriftelijk overeenkomen dat de
      bemonstering, bedoeld in het eerste lid, door de producent of de leverancier plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.3
    text: |-
      Bij seizoensgebonden of incidentele producten start de bemonstering, bedoeld in het eerste lid, bij de eerste
      lading.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.4
    text: 'Het eerste lid is niet van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.4.a
    text: de zuurtegraad van de voedermiddelen ten hoogste 4,5 pH bedraagt bij spontane melkzuurfermentatie;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.4.b
    text: de zuurtegraad van de voedermiddelen ten hoogste 4 pH bedraagt, indien organische zuren zijn toegevoegd;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.4.c
    text: de zuurtegraad van de voedermiddelen ten hoogste 3,5 pH bedraagt, indien anorganische zuren zijn toegevoegd; of
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28d.4.d
    text: |-
      de producent of de leverancier aantoont dat de zuurtegraad voldoende is om salmonella in de voedermiddelen te
      inactiveren.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28d
  - number: 28e.1
    text: De producent en de leverancier, bedoeld in dit hoofdstuk, laten de monsters onderzoeken in een laboratorium.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2
    text: |-
      De producent en de leverancier laten monsters waarin, na onderzoek als bedoeld in het eerste lid, de aanwezigheid
      van Salmonella is geconstateerd nader onderzoeken op de volgende serotypes:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.a
    text: Salmonella enteritidis;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.b
    text: Salmonella typhimurium;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.c
    text: Salmonella hadar;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.d
    text: Salmonella infantis;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.e
    text: Salmonella Virchow; en
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.2.f
    text: Salmonella java.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
  - number: 28e.3
    text: |-
      De serotypering van de monsters, bedoeld in het tweede lid, vindt plaats in een laboratorium dat daarvoor op grond
      van [artikel 3 van de Regeling erkenning veterinaire laboratoria][ref1] is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0045052#Artikel3
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28e
    references:
      - id: ref1
        bwb_id: BWBR0045052
        artikel: '3'
  - number: 28f.1
    text: |-
      De producent en de leverancier bewaren de uitslag van het onderzoek, bedoeld in [artikel 28e][ref1], gedurende een
      periode van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel28e
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: 28e
        hoofdstuk: 3a
  - number: 28f.2
    text: |-
      Geconstateerde aanwezigheid van de serotypes, bedoeld in [artikel 28e, tweede lid][ref1], wordt onverwijld door de
      producent of de leverancier aan de minister en de betrokken pluimveehouder doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel28e
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel28f
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: 28e
        hoofdstuk: 3a
  - number: '29'
    text: |-
      Het is verboden toevoegingsmiddelen als bedoeld in artikel 2, tweede lid, onderdeel a, van verordening (EG)
      nr. 1831/2003, voormengsels als bedoeld in artikel 2, tweede lid, onderdeel e, van verordening (EG) nr. 1831/2003,
      en diervoeders als bedoeld in artikel 3, onder 4, van verordening (EG) nr. 178/2002, waaronder de substanties,
      bedoeld in artikel 2, tweede lid, onderdelen b, c, d, en g, van verordening (EG) nr. 1831/2003, in of buiten
      Nederland te brengen in strijd met het bepaalde in:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.a
    text: artikel 7, bijlage IV en bijlage IX, hoofdstuk D, afdeling B, subonderdeel c, van verordening (EG) nr. 999/2001;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.b
    text: de artikelen 11, 12, 15, eerste lid, 16, 17, eerste lid, 18 en 20 van verordening (EG) nr. 178/2002;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.c
    text: hoofdstuk III van verordening (EG) nr. 1829/2003;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.d
    text: de artikelen 4 en 5 van verordening (EG) nr. 1830/2003;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.e
    text: de artikelen 3, 10, 16, bijlage III van verordening (EG) nr. 1831/2003;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.f
    text: artikel 24 van verordening (EG) nr. 183/2005; en
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.g
    text: |-
      elke andere EU-rechtshandeling, die bepaalt dat de controles op het voldoen aan de daarin neergelegde voorschriften
      voor substanties als bedoeld in de aanhef plaatsvinden volgens de bepalingen van verordening (EU) nr. 2017/625;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: 29.h
    text: de artikelen 9, 10 en 11 van [uitvoeringsverordening (EU) 2019/1793](33693R2019).
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel29
  - number: '30.1'
    text: 'Toevoegingsmiddelen, voormengsels en diervoeders die afkomstig zijn uit een derde land, gaan vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel30
  - number: 30.1.a
    text: documenten waaruit de aard, oorsprong en geografische bestemming van de producten blijkt;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel30
  - number: 30.1.b
    text: |-
      een document waarin de aard en de uitkomst van uitgevoerde controles zijn aangegeven en in voorkomend geval de
      resultaten van laboratoriumonderzoek, ingeval de producten voor het eerst in een lidstaat, niet zijnde Nederland,
      op het douanegebied van de Europese Economische Ruimte zijn binnengebracht.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel30
  - number: '30.2'
    text: |-
      In de documenten, bedoeld in het eerste lid, onderdeel a, wordt verwezen naar het document, bedoeld in het eerste
      lid, onderdeel b, ingeval het laatstgenoemde onderdeel van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel30
  - number: '30.3'
    text: |-
      Het document, bedoeld in het eerste lid, onderdeel b, vergezelt de toevoegingsmiddelen, voormengsels of diervoeders
      waarop het betrekking heeft tot het tijdstip waarop deze producten in het vrije verkeer worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel30
  - number: '55'
    text: |-
      Als instellingen als bedoeld in [artikel 10.2 van de wet][ref1] voor het onderzoek van de door met controle of
      toezicht belaste ambtenaren genomen monsters worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 55.a
    text: RIKILT, instituut voor voedselveiligheid, onderdeel van Stichting Dienst Landbouwkundig Onderzoek;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
  - number: 55.b
    text: Laboratorium van de Nederlandse Voedsel- en Warenautoriteit;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
  - number: 55.c
    text: het Belastingdienst/Douane West/Douane Laboratorium te Amsterdam;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
  - number: 55.d
    text: LabCo B.V. te Europoort;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
  - number: 55.e
    text: TNO-Voeding te Zeist.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel55
  - number: '56'
    text: |-
      Als bemonsterings- en analysemethoden als bedoeld in artikel 34, eerste en tweede lid, van verordening (EU) nr.
      2017/625 worden aangemerkt de methoden, genoemd in:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel56
  - number: 56.a
    text: |-
      [bijlage 1][ref1] bij deze regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0028123
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028123
  - number: 56.b
    text: |-
      [bijlage 2][ref1] bij deze regeling, met dien verstande dat deze worden toegepast binnen de toepassingsgebieden en
      in de titels genoemde onderwerpen in genoemde bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0028123
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028123
  - number: 56a
    text: |-
      De Minister is bevoegd tot aanwijzing van nationale referentielaboratoria als bedoeld in artikel 100, eerste lid,
      eerste zin, van verordening (EU) 2017/625, ten aanzien van onderwerpen die diervoeders betreffen.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel56a
  - number: '57.1'
    text: 'Het is een houder van een dier verboden een diervoeder te vervoederen dat:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
  - number: 57.1.a
    text: |-
      een stof bevat in strijd met een voorschrift als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel3
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '3'
        hoofdstuk: '2'
  - number: 57.1.b
    text: |-
      onveilig is of onveilig wordt geacht als bedoeld in artikel 15, eerste lid, van verordening (EG) nr. 178/2002,
      onverminderd artikel 20;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
  - number: 57.1.c
    text: |-
      in strijd met de algemene verplichting, bedoeld in artikel 4, tweede lid, van verordening (EG) nr. 183/2005,
      verontreinigingen bevat, onverminderd [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel13
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 57.1.d
    text: |-
      in strijd met de goede praktijken voor het voederen van dieren, bedoeld in artikel 5, vijfde lid, en bijlage III,
      van verordening (EG) nr. 183/2005, wordt vervoederd aan voedselproducerende dieren, onverminderd artikel 13;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
  - number: 57.1.e
    text: |-
      in strijd met etiketteringsvoorschriften als bedoeld in artikel 3, eerste lid, onderdeel c, van verordening (EG)
      nr. 1831/2003, onverminderd artikel 23.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
  - number: '57.2'
    text: |-
      Indien het vervoederen van een diervoeder als bedoeld in het eerste lid, aanhef, is toegestaan krachtens een EU-
      verordening als bedoeld in [artikel 1.1 van het besluit][ref1] of [artikel 2][ref2] door een besluit van een
      bevoegde instantie en aan dat besluit voorschriften zijn verbonden, worden deze voorschriften nageleefd door degene
      op wie dat besluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028123#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028123
        artikel: '2'
        hoofdstuk: '1'
  - number: 57a.1
    text: |-
      Het verbod van [artikel 2.17, eerste lid, van de Wet dieren][ref1] is van overeenkomstige toepassing op de houder
      die producent is van koemelk bestemd voor consumptie of verwerking, voor het ontvangen van mengvoeder voor runderen
      dat gemiddeld tussen 15 november 2017 en 1 januari 2018 meer dan 4,3 gram bruto fosfor per kilogram mengvoeder
      bevat en waarvan de verhouding tussen het fosfor en ruw eiwit hoger dan 2,2 is.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 57a.2
    text: |-
      Het eerste lid is niet van toepassing indien gemiddeld over het jaar 2017 in het totale rantsoen aantoonbaar minder
      dan 3,5 gram bruto fosfor per kilogram droge stof aan runderen is vervoederd.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: 57a.3
    text: |-
      Aantonen dat in 2017 minder dan 3,5 gram bruto fosfor per kilogram droge stof aan runderen is vervoederd, is
      uitsluitend mogelijk indien:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: 57a.3.a
    text: de houder zich voor 1 december 2017 bij de minister meldt;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: 57a.3.b
    text: |-
      de houder de minister machtigt voor inzage en gebruik van gegevens van de houder over het jaar 2017, die zijn
      opgenomen in de database Kringloopwijzer;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: 57a.3.c
    text: |-
      de database Kringloopwijzer kuilanalyses van de houder bevat van het bruto fosforgehalte van het ruwvoer dat in
      2017 op het bedrijf aanwezig was, die via geautomatiseerde datakoppelingen door een laboratorium zijn ingelezen;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: 57a.3.d
    text: |-
      de gegevens in de database Kringloopwijzer over de hoeveelheden en het bruto fosforgehalte van voeders voor
      runderen, enkelvoudige voeders, vochtrijke voeders en ruwvoeders, geautomatiseerd worden aangeleverd via
      datakoppelingen met leveranciers. Indien datakoppelingen niet aanwezig zijn dient een jaaroverzicht van het
      betreffende geleverde voedermiddel te kunnen worden overlegd om de in de database Kringloopwijzer opgenomen waarden
      te kunnen onderbouwen.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel57a
  - number: '59.1'
    text: |-
      Voor de behandeling van een aanvraag voor toestemming als bedoeld in artikel 3, tweede lid, van [verordening (EG)
      nr. 1831/2003](32003R1831) is de aanvrager aan de minister een retributie verschuldigd van € 151,00 per uur dat aan
      de behandeling is besteed.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel59
  - number: '59.2'
    text: |-
      Een aanvraag tot toestemming voor een onderzoek voor wetenschappelijke doeleinden als bedoeld in artikel 3,
      tweede lid, van verordening (EG) nr. 1831/2003 wordt in behandeling genomen nadat het ingevolge het eerste lid
      verschuldigde bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel59
  - number: '60'
    text: |-
      Bij een aanvraag als bedoeld in [artikel 59][ref1] wordt een dossier gevoegd dat is samengesteld overeenkomstig de
      richtsnoeren, bedoeld in artikel 3, tweede lid, van [verordening (EG) nr. 1831/2003](32003R1831).


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel59
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 60a.1
    text: |-
      De minister kan toestemming verlenen voor een proefneming met een product dat mogelijk een ongewenste stof bevat
      voor de vaststelling van een verhoogd gehalte, een maximumgehalte of een actiedrempel als bedoeld in artikel 4,
      tweede lid, eerste alinea, van richtlijn nr. 2002/32/EG.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel60a
  - number: 60a.2
    text: |-
      De minister draagt bij het verlenen van een toestemming als bedoeld in het eerste lid, zorg voor toepassing van
      artikel 4, tweede lid, tweede alinea, van richtlijn nr. 2002/32/EG.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel60a
  - number: 60a.3
    text: Het is verboden in strijd te handelen met aan een toestemming verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel60a
  - number: '61.1'
    text: |-
      Een aanvraag tot het doen van verrichtingen op verzoek wordt schriftelijk ingediend bij de minister, onder
      vermelding van:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: 61.1.a
    text: de soorten te verrichten bedrijfsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: 61.1.b
    text: de soorten en hoeveelheden van de goederen;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: 61.1.c
    text: de datum en het tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen aanvangen;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: 61.1.d
    text: de datum en het tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen eindigen, en
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: 61.1.e
    text: de locatie(s) waarop de bedrijfsactiviteiten zullen plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: '61.2'
    text: |-
      De aanbieder meldt de gewenste verrichtingen, uiterlijk vóór 07:00 uur op de werkdag voorafgaand aan de dag van de
      voorgenomen uitvoering.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel61
  - number: '62'
    text: |-
      De inlichtingen die ingevolge artikel 20, derde lid, van verordening (EG) nr. 178/2002 worden verstrekt bevatten
      ten minste:
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel62
  - number: 62.a
    text: |-
      gegevens die een nauwkeurige identificatie van de producten waarop de inlichtingen betrekking hebben mogelijk
      maken;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel62
  - number: 62.b
    text: een zo volledig mogelijke beschrijving van het risico dat de producten opleveren;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel62
  - number: 62.c
    text: gegevens die kunnen worden gebruikt om de producten op te sporen.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel62
  - number: '63'
    text: |-
      Inlichtingen als bedoeld in artikel 20, derde lid, van verordening (EG) nr. 178/2002 die op een andere wijze worden
      verstrekt dan door toezending van een schriftelijke en ondergetekende verklaring, of een elektronisch verzonden
      verklaring waaruit de authenticiteit van het origineel genoegzaam blijkt, worden onverwijld bevestigd door middel
      van een schriftelijke en ondergetekende verklaring.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel63
  - number: 63a.1
    text: |-
      Een exploitant van een diervoederbedrijf geeft bij het verlenen van een opdracht aan een laboratorium tot het
      verrichten van onderzoek naar een diervoeder of een grondstof voor de bereiding daarvan, de bestemming aan van het
      te onderzoeken product en verstrekt informatie over de samenstelling en identificatie van het onderzoeksmonster.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel63a
  - number: 63a.2
    text: |-
      Bij het verstrekken van de informatie over de identificatie van het onderzoeksmonster, vermeldt de exploitant
      identificatienummers van het product, indien voorhanden.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel63a
  - number: '64'
    text: |-
      Een belanghebbende kan binnen zeven dagen nadat aan hem het resultaat van het onderzoek, bedoeld in
      [artikel 5:18, zesde lid, van de Algemene wet bestuursrecht][ref1], bekend is gemaakt, bij de minister een verzoek
      om heronderzoek indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '65'
    text: |-
      [Hoofdstuk 8 van de Landbouwkwaliteitsregeling 2007][ref1] is van overeenkomstige toepassing op de vaststelling van
      tarieven door de Stichting Skal voor de onderwerpen, bedoeld in [artikel 2.5 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022543#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0032346#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0022543
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0032346
        artikel: '2'
  - number: 65a
    text: |-
      De Regeling diervoeders zoals die luidde bij de inwerkingtreding van deze regeling blijft van toepassing op
      diervoeder, bestemd voor gezelschapsdieren, voorzover een diervoeder voor 1 september 2011 in de handel is
      gebracht, in overeenstemming met die regeling is geëtiketteerd en de voorraad van dat diervoeder nog niet is
      uitgeput.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel65a
  - number: '70'
    text: De Regeling diervoeders wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel70
  - number: '71'
    text: Deze regeling treedt in werking met ingang van 1 september 2010.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel71
  - number: '72'
    text: 'Deze regeling wordt aangehaald als: Regeling diervoeders 2012.'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel72
