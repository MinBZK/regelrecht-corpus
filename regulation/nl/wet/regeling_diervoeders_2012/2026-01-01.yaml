  - number: '3.1'
    text: |-
      Het is eenieder verboden met diervoeders als bedoeld in artikel 3, onder 4, van verordening (EG) nr. 178/2002
      een handeling als bedoeld in [artikel 2.18, tweede lid, onderdeel a, van de wet][ref1], waaronder handelingen als
      bedoeld in [artikel 2.17 van de wet][ref2], te verrichten, indien dat diervoeder:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '2'
  - number: 3.1.a
    text: |-
      een stof bevat met een gehalte dat een maximumgehalte overschrijdt dat voor eet- of drinkwaren is opgenomen in
      bijlage II bij de Warenwetregeling residuen van bestrijdingsmiddelen, met betrekking tot eet- of drinkwaren die
      tevens diervoeder zijn, met uitzondering van een stof waarvoor op grond van [artikel 3.2 van het besluit][ref1] een
      maximumgehalte geldt;


