    text: |-
      een gehalte bevat dat afwijkt van de toegestane tolerantie, bedoeld in bijlage IV van verordening (EG)
      nr. 767/2009.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Op een gehalte, bedoeld in het eerste lid, onderdeel a, is
      [bijlage I bij de Warenwetregeling residuen van bestrijdingsmiddelen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003658
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003658
  - number: '3.3'
    text: Water dat wordt gebruikt voor het bereiden, bewerken of verwerken van een diervoeder is van voldoende kwaliteit.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien een handeling met een diervoeder als bedoeld in het eerste lid, aanhef, is toegestaan krachtens een EU-
      verordening als bedoeld in [artikel 1.1 van het besluit][ref1] of [artikel 2][ref2] door een besluit van een
      bevoegde instantie en aan dat besluit voorschriften zijn verbonden, worden deze voorschriften nageleefd door degene
      op wie dat besluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0032346#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028123#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032346
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028123
        artikel: '2'
        hoofdstuk: '1'
  - number: '5'
    text: |-
      Overeenkomstig [artikel 16, eerste lid, van het Landbouwkwaliteitsbesluit 2007][ref1] en indien naar zijn oordeel
      aan de orde, geeft de minister de bevestiging, bedoeld in bijlage II, deel II, punten 1.9.3.1, onderdeel c, en
      1.9.4.2, onderdeel c, van verordening (EU) nr. 2018/848 dat biologische eiwithoudende diervoeders voor varkens en
      pluimvee niet in voldoende hoeveelheid beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel16
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '16'
  - number: 6a.1
    text: |-
      Onverminderd [artikel 6.3, tweede lid, van de wet][ref1] is de minister bevoegd uitvoering te geven aan een
      voorschrift van een EU-verordening als bedoeld in [artikel 2.1 van het besluit][ref2] dat een tot de overheid
      behorend orgaan of een door de overheid aangesteld persoon de opdracht geeft, de keuze laat of als ontvanger van
      informatie aanwijst, indien die uitvoering niet bestaat uit het nemen van een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0032334
        artikel: '2'
  - number: 6a.2
    text: Het eerste lid is niet van toepassing, indien in deze regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel6a
  - number: '7.1'
    text: 'Voorschriften van EU-verordeningen als bedoeld in artikel 6.2, eerste lid, van de wet zijn:'
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel7
  - number: 7.1.a
    text: artikel 7, eerste en tweede lid, van [verordening (EG) nr. 999/2001](32001R0999);
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel7
  - number: 7.1.b
    text: de hoofdstukken I, II, III, IV en V, onderdelen B, C, D en E van bijlage IV bij verordening (EG) nr. 999/2001;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel7
  - number: 7.1.c
    text: bijlage VII, hoofdstuk B, onderdeel 2.2.2, onder a, van [verordening (EG) nr. 999/2001](32001R0999).
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, aanhef en onderdelen a en b, zijn niet van toepassing ten aanzien van activiteiten, genoemd in
      bijlage IV bij verordening (EG) nr. 999/2001, mits is voldaan aan de in die bijlage gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel7
  - number: '13'
    text: |-
      Voorschriften van EU-verordeningen als bedoeld in [artikel 6.2, eerste lid, van de wet][ref1] zijn de artikelen 4,
      5, eerste, tweede, derde, vijfde en zesde lid, 6, eerste en derde lid, 7, eerste lid, 9, eerste en tweede lid, 10,
      11, 23, eerste lid, en 24 van de [verordening (EG) nr. 183/2005](32005R0183).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
  - number: 13a
    text: |-
      Als een levering van kleine hoeveelheden aan lokale veehouderijen als bedoeld in artikel 2, tweede lid, onderdeel
      d, van [verordening (EG) nr. 183/2005](32005R0183) wordt aangemerkt een levering in Nederland binnen een jaarlijks
      totaal van vijf ton geleverde diervoeder.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel13a
  - number: '14'
    text: |-
      Het is eenieder verboden met diervoeders die vallen binnen de werkingssfeer, bedoeld in artikel 2 van verordening
      (EG) nr. 183/2005, een diervoederbedrijf te exploiteren zonder erkenning of registratie als bedoeld in artikel 9,
      respectievelijk 10, van verordening (EG) nr. 183/2005.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel14
  - number: '15'
    text: |-
      Indien een inrichting een activiteit als bedoeld in artikel 10, onder 1, van verordening (EG) nr. 183/2005
      verricht, is een erkenning als bedoeld in [artikel 14][ref1] vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel14
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      Indien aan een bedrijf een erkenning voor een activiteit, als bedoeld in [artikel 15][ref1] is verleend, dan is
      voor diezelfde activiteit geen registratie, bedoeld in [artikel 14][ref2], meer nodig.


      [ref1]: https://wetten.overheid.nl/BWBR0028123#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028123#Artikel14
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028123
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028123
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17'
    text: |-
      Een besluit omtrent erkenning, dan wel wijziging daarvan, wordt genomen binnen zes maanden na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel17
  - number: '20'
    text: |-
