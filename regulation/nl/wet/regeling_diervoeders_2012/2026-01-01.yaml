    text: |-
      van zoogdieren afkomstige eiwitten als bedoeld in artikel 7 en bijlage IV van verordening (EG) nr. 999/2001 bevat,
      tenzij deze eiwitten overeenkomstig die verordening in het diervoeder zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
  - number: 3.1.c
    text: niet voldoet aan de artikelen 18, eerste lid, 19 en 20 van verordening (EG) nr. 396/2005;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
  - number: 3.1.d
    text: |-
      niet voldoet aan een gebruik van dierlijke bijproducten en afgeleide producten als bedoeld in artikel 11, van
      verordening (EG) 1069/2009;
    url: https://wetten.overheid.nl/BWBR0028123/2026-01-01#Artikel3
  - number: 3.1.e
    text: |-
