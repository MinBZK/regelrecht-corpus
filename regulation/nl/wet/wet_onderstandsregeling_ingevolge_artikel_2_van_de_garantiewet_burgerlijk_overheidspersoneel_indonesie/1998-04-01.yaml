        artikel: '2'
  - number: '7'
    text: |-
      Indien bij het bereiken van de leeftijd van 45 jaar aanspraak is verkregen op de in [artikel 6][ref1] bedoelde
      blijvende onderstand, welke, eventueel vermeerderd met toelagen, als genoemd in [Hoofdstuk IV][ref2], meer bedraagt
      dan de op dit tijdstip ingevolge het bepaalde in de[ artikelen 3][ref3] en [4][ref4] genoten onderstand, eventueel
      vermeerderd met toelagen als genoemd in [Hoofdstuk IV][ref5], wordt met ingang van dat tijdstip de blijvende
      onderstand toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002083#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0002083#Artikel3
