  - number: '5'
    text: |-
      Aan hem, die ten tijde van het ontslag een leeftijd van tenminste 40 jaar en een voor pensioen tellende diensttijd
      van tenminste 10 jaar heeft bereikt en bij het verstrijken van het tijdvak, waarover onderstand ingevolge het
      bepaalde in de[ artikelen 3][ref1] en [4][ref2] is genoten, de leeftijd van 45 jaar nog niet heeft bereikt,
      wordt tot en met de maand, waarin de laatstgenoemde leeftijd wordt bereikt, een overbruggingsonderstand toegekend,
      bedragende:

      a. indien hij ten tijde van het ontslag kostwinner was en deze hoedanigheid gedurende het tijdvak, genoemd in
      [artikel 4][ref3], heeft behouden, voorzolang hij deze hoedanigheid ook verder blijft behouden, 25 ten honderd,

      b. in andere gevallen 20 ten honderd, *a*. en *b*. van de activiteitswedde, voorzover deze een bedrag van f
      1250.- 's maands niet te boven gaat, met dien verstande, dat deze onderstand niet kan uitgaan boven de blijvende
      onderstand, bedoeld in de[ artikelen 6][ref4] en [7][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002083#Artikel4
