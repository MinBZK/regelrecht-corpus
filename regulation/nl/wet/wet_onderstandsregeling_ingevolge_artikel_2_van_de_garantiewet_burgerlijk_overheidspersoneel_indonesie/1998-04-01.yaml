        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002083
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '9'
    text: |-
      1 De aflopende onderstand bedraagt voor hem, die ten tijde van het ontslag kostwinner is en voorzolang hij deze
      hoedanigheid behoudt, 30 ten honderd van de activiteitswedde, voorzover deze een bedrag van f 900.- 's maands niet
      te boven gaat.

      2 Voor een niet-kostwinner bedraagt het percentage, bedoeld in het vorige lid, 25.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel9
  - number: '10'
    text: |-
      Behoudens het bepaalde in [artikel 13][ref1] wordt de in [artikel 9][ref2] bedoelde onderstand toegekend voor de
      duur van één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel9
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002083
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '11'
    text: |-
      1 Een blijvende onderstand wordt toegekend aan hem, die ten tijde van het ontslag een leeftijd van tenminste 45
      jaar en een diensttijd van tenminste 20 jaar heeft bereikt.

      2 De in het vorige lid bedoelde onderstand wordt toegekend in aansluiting op de onderstand, bedoeld in
      de[ artikelen 9][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel10
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel11
