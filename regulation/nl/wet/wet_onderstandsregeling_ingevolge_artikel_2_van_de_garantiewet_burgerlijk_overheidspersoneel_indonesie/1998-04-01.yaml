        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '12'
    text: |-
      1 De onderstand, bedoeld in [artikel 11][ref1], bedraagt voor hem, die ten tijde van het ontslag kostwinner was
      en deze hoedanigheid gedurende het genot van de onderstand, bedoeld in de[ artikelen 9][ref2] en [10][ref3], heeft
      behouden, voorzolang hij deze hoedanigheid ook verder behoudt:

      80 ten honderd van het bedrag van het evenredige pensioen, hetwelk hem, ware hij in vaste dienst, volgens de alsdan
      voor hem op 5 Augustus 1949 van kracht zijnde bepalingen bij ontslag wegens welbewezen ziels- of lichaamsgebreken
      zou zijn toegekend.

      2 Voor een niet-kostwinner bedraagt deze onderstand 60 ten honderd van het in lid 1 bedoelde evenredige pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002083#Artikel10
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel12
