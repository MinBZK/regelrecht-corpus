  - number: '13'
    text: |-
      Indien de blijvende onderstand ingevolge het bepaalde in de[ artikelen 11][ref1] en [12][ref2], eventueel
      vermeerderd met toelagen als genoemd in [Hoofdstuk IV][ref3], meer bedraagt dan de aflopende onderstand
      ingevolge het bepaalde in de[ artikelen 9][ref4] en [10][ref5], eventueel vermeerderd met toelagen als genoemd in
      [Hoofdstuk IV][ref6], treedt de eerstgenoemde onderstand daarvoor in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel11
