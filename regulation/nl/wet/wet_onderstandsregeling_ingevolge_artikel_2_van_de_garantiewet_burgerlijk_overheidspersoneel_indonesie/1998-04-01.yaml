  - number: '8'
    text: |-
      Aan overheidsdienaren in tijdelijke dienst sedert een aan 1 Maart 1942 voorafgaand tijdstip, die een
      diensttijd hebben van tenminste 10 jaar en niet voldoen aan de voor eervol ontslag uit de dienst met
      aanspraak op onderstand bij wijze van pensioen gestelde voorwaarden, wordt bij dienstbeëindiging als
      bedoeld in [artikel 2, lid 4 van de Garantiewet][ref1] een onderstand toegekend volgens het bepaalde in
      de[ artikelen 9 tot en met 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002060#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel9
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel8
    references:
      - id: ref1
