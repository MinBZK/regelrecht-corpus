  - number: '15'
    text: |-
      Voorzover en voorzolang uitkeringen ingevolge deze wet worden genoten in het rechtsgebied van de Republiek
      Indonesië, zomede in Nieuw-Guinea, worden zij verhoogd met de duurte-, gezins- en kindertoelagen, volgens de ter
      plaatse geldende regelingen.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel15
  - number: '16'
    text: |-
      Voorzover een aflopende onderstand ingevolge deze wet wordt genoten in het Koninkrijk, met uitzondering van Nieuw-
      Guinea, wordt die onderstand verhoogd met de kindertoelage op de voet van het bepaalde in artikel 21 van het
      Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel16
  - number: 16a
    text: |-
      Het bepaalde in [artikel 16][ref1] blijft buiten toepassing ten aanzien van kindertoelage voor kinderen, voor
      wie aanspraak bestaat op kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref2], de Kinderbijslagwet voor
      loontrekkenden, of de algemene maatregel van bestuur bedoeld in artikel 10 van laatstgenoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002368
  - number: '17'
    text: |-
      1 De uitkeringen ingevolge deze wet worden op schriftelijk verzoek van de betrokkene toegekend, indien hij zich
      ten tijde van zijn ontslag in het Koninkrijk bevindt, door Onze Minister voor Uniezaken en Overzeese Rijksdelen, en
      indien hij zich ten tijde van zijn ontslag in Indonesië bevindt, door Onze Hoge Commissaris bij de Regering van de
      Republiek Indonesië.

      2 Het tijdstip van ingang van de uitkering wordt bij de toekenning bepaald.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel17
  - number: '18'
    text: |-
      De blijvende onderstand eindigt met het einde van de maand, volgende op die van overlijden en in de gevallen,
      bedoeld in [artikel 19][ref1], met het einde van het maand, waarin de oorzaak tot beëindiging is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel19
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '19'
        hoofdstuk: V
  - number: '19'
    text: |-
      De blijvende onderstand vervalt, wanneer hij, die deze onderstand geniet:

      a. buiten Onze toestemming zich in andere dan Nederlandse krijgsdienst begeeft of een door een andere dan de
      Nederlandse Overheid opgedragen openbare bediening aanneemt;

      b. in het genot van een pensioen wordt gesteld, bij de berekening waarvan mede als diensttijd in rekening is
      gebracht de diensttijd, welke voor de bepaling van de onderstand in aanmerking is genomen, met dien verstande, dat,
      wanneer het pensioen minder bedraagt dan de genoten onderstand, deze wordt teruggebracht tot het verschil.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel19
  - number: '20'
    text: |-
      1 Wanneer iemand, in het genot van een blijvende onderstand, veroordeeld is tot plaatsing in een door het openbaar
      gezag ingestelde werkinrichting, tot een vrijheidsstraf voor de tijd van drie maanden of tot enige zwaardere straf,
      mist hij gedurende de tijd, dat hij zijn straf ondergaat of zich daaraan onttrekt, het genot van die onderstand.

      2 Ten aanzien van hem, die zijn straf ondergaat of zich door de vlucht aan de tenuitvoerlegging van het vonnis
      onttrekt, is Onze Minister voor Uniezaken en Overzeese Rijksdelen bevoegd om:

      a. gedurende die tijd over de onderstand van de veroordeelde te beschikken ten behoeve van zijn vrouw of van zijn
      minderjarige afstammelingen in de rechte linie tot wie hij in familierechtelijke betrekking staat of van zijn
      bloedverwanten in de opgaande linie;

      b. voorzover van de onder *a* bedoelde bevoegdheid geen gebruik wordt gemaakt, hem, die uit de werkinrichting of
      uit de gevangenis is ontslagen, in het genot te stellen van een uitkering, welke bij een straftijd van minder dan
      een jaar de helft van het bedrag van de onderstand over die straftijd, en bij een straftijd van langere duur de
      helft van het jaarlijkse bedrag van de onderstand niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel20
  - number: '22'
    text: |-
      Deze wet treedt in werking met ingang van de dag, volgende op die van haar afkondiging en werkt terug tot 9 Juli
      1950.
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel22
