  - number: '6'
    text: |-
      Na beëindiging van de in de[ artikelen 2 tot en met 4][ref1] bedoelde onderstand wordt aan hem, die ten tijde van
      het ontslag op een voor pensioen tellende diensttijd van tenminste 10 jaren kan wijzen, een blijvende onderstand
      toegekend, indien hij op het tijdstip van die beeindiging de leeftijd van tenminste 45 jaar heeft bereikt of,
      indien hij op dat tijdstip nog geen 45 jaar oud is, zodra hij die leeftijd heeft bereikt. Deze blijvende onderstand
      is gelijk aan het bedrag van het evenredig pensioen, waarop hij volgens de voor hem op 5 Augustus 1949 van
      kracht zijnde bepalingen aanspraak zou hebben bij ontslag wegens welbewezen ziels- of lichaamsgebreken, met dien
      verstande, dat de blijvende onderstand niet kan worden gesteld op een hoger percentage van de grondslag dan het met
      vier verminderde percentage van de grondslag, waarop het pensioen zou zijn gesteld, indien bij dienstbeëindiging op
      hetzelfde tijdstip het bepaalde in [artikel 2, lid 1, sub ][ref2] zou zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel2
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel6
    references:
      - id: ref1
