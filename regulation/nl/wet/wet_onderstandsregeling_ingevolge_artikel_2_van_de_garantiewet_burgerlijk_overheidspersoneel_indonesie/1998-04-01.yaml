  - number: '14'
    text: |-
      1 Bij dienstbeëindiging als bedoeld in [artikel 2, lid 2 van de Garantiewet][ref1] worden, in afwachting van de
      beslissing van een commissie als bedoeld in [artikel 8 van die wet][ref2], de volgende onderstanden toegekend:

      a. aan overheidsdienaren in vaste dienst een onderstand, berekend als in de[ artikelen 3][ref3] en [4][ref4] is
      aangegeven;

      b. aan overheidsdienaren in tijdelijke dienst sedert een aan 1 Maart 1942 voorafgaand tijdstip, een onderstand,
      berekend als in de[ artikelen 9][ref5] en [10][ref6] is aangegeven;

      c. aan hen, die werkzaam waren op een kortverband, waaraan recht op vrije overtocht naar Nederland is verbonden,
      een onderstand, berekend als in de[ artikelen 9][ref7] en [10][ref8] is aangegeven, met dien verstande, dat deze
      onderstand vervalt, indien de betrokkene zich niet binnen een maand na dienstneerlegging tot de bevoegde commissie,
      als bedoeld in [artikel 8 van de Garantiewet][ref9], heeft gewend.

      2 Indien aan de betrokken overheidsdienaren op grond van [artikel 2 van de Garantiewet][ref10] een andere uitkering
      wordt toegekend, treedt de laatstgenoemde uitkering, gerekend van de datum van dienstbeëindiging in de plaats van
      de onderstand, bedoeld in het vorige lid.


