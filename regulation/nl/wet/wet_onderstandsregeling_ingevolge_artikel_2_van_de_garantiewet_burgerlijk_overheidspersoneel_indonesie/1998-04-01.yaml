preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ingevolge artikel 2, lid 8 van de "Garantiewet Burgerlijk
    Overheidspersoneel Indonesië" nodig is Ons besluit van 27 Juni 1950 (Staatsblad No. K 268) tot vaststelling van een
    algemene maatregel van bestuur als bedoeld in artikel 2 van die wet, te bevestigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      "Garantiewet": de [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1];

      "overheidsdienaren": hetgeen daaronder wordt verstaan in [artikel 1 van de Garantiewet][ref2];

      "activiteitswedde": de nominale activiteitswedde, vermeerderd met voor pensioen medetellende toelagen, welke op
      het tijdstip van dienstbeëindiging wordt dan wel zou zijn genoten op basis van de op 5 Augustus 1949 bestaande
      bezoldigingsregeling;

      "normaal pensioen": het pensioen, waarop recht wordt verkregen bij het bereiken van een diensttijd van 20 en
      een leeftijd van 50 jaar onderscheidenlijk van een diensttijd van 25 en een leeftijd van 55 jaar, naar gelang de
      betrokken overheidsdienaar volgens de op 5 Augustus 1949 voor hem van kracht zijnde pensioenregeling behoort tot
      pensioengroep I onderscheidenlijk pensioengroep II.


      [ref1]: https://wetten.overheid.nl/BWBR0002060
      [ref2]: https://wetten.overheid.nl/BWBR0002060#Artikel1
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002060
      - id: ref2
        bwb_id: BWBR0002060
        artikel: '1'
  - number: '2'
    text: |-
      Aan overheidsdienaren in vaste dienst, die nog geen recht hebben op normaal pensioen, wordt bij dienstbeëindiging
      als bedoeld in [artikel 2, lid 4 van de Garantiewet](onbekend) een aflopende onderstand toegekend volgens het
      bepaalde in de[ artikelen 3 tot en met 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel3
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: I
  - number: '3'
    text: |-
      1 De onderstand, bedoeld in [artikel 2][ref1], bedraagt voor hem, die ten tijde van het ontslag kostwinner is en
      voorzolang hij deze hoedanigheid behoudt:

      a. gedurende twee jaren 60 ten honderd van de eerste f 500.- en 40 ten honderd van het restant,

      b. gedurende de resterende termijn 40 ten honderd van de eerste f 500.- en 30 ten honderd van het restant, *a.* en
      *b.* van de activiteitswedde, voorzover deze een bedrag van f 1250.- 's maands niet te boven gaat.

      2 Voor een niet-kostwinner bedragen de percentages, bedoeld in lid 1, onder:

      a. onderscheidenlijk 50 en 30,

      b. onderscheidenlijk 35 en 25.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel2
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002083
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: I
  - number: '4'
    text: |-
      1 Behoudens het bepaalde in [artikel 7][ref1] wordt de in [artikel 3][ref2] bedoelde onderstand toegekend,
      uiterlijk tot het tijdstip, waarop bij doordienen recht op normaal pensioen zou zijn verkregen, voor de duur van:

      bij een diensttijd van minder dan 6 jaren: 2 jaren

      bij een diensttijd van 6 tot aan 7 jaren: 2 jaren en 3 maanden

      bij een diensttijd van 7 tot aan 8 jaren: 2 jaren en 6 maanden

      bij een diensttijd van 8 tot aan 9 jaren: 2 jaren en 9 maanden

      bij een diensttijd van 9 of meer jaren: 3 jaren.

      2 Indien daartoe in bijzondere gevallen in verband met de noodzakelijk te achten duur der herscholing aanleiding
      bestaat, kunnen de in het voorafgaande lid bedoelde termijnen op schriftelijk verzoek van belanghebbenden door
      Onze Minister voor Uniezaken en Overzeese Rijksdelen in overleg met Onze Minister van Onderwijs, Kunsten en
      Wetenschappen worden verlengd met een termijn van ten hoogste 1 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002083#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002083#Artikel3
    url: https://wetten.overheid.nl/BWBR0002083/1998-04-01#Artikel4
    references:
      - id: ref1
