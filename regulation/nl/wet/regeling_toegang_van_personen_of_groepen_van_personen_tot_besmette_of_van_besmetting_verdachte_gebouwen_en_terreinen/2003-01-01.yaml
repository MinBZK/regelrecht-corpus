preamble:
  text: |-
    Gelet op Richtlijn nr. 80/217/EEG van de Raad van de Europese Gemeenschap-pen van 22 januari 1980 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van klassieke varkenspest (PbEG L 47), Richtlijn nr. 85/511/
    EEG van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling van gemeenschappelijke
    maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), Richtlijn nr. 92/40/EEG van de Raad van de
    Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van
    aviaire influenza (PbEG L 167), Richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen van 14 juli
    1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle (PbEG L
    260), Richtlijn 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van
    algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke maatregelen ten
    aanzien van vesiculaire varkensziekte (PbEG 1993, L 62) en Richtlijn nr. 93/53/EEG van de Raad van de Europese
    Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de bestrijding van
    bepaalde visziekten (PbEG L 175);

    Gelet op artikel 25, tweede lid, van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap Vee en Vlees,
    het Produktschap voor Pluimvee en Eieren, het Produktschap voor Vis en Visprodukten, het Bedrijfschap voor de
    Pluimveehandel en- industrie en het Bedrijfschap voor de Handel in Vee;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007934/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0007934/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      Als personen of groepen van personen die toegang hebben tot gebouwen, terreinen of gedeelten van gebouwen of
      terreinen waar een kenteken als bedoeld in artikel 22, eerste lid, van de wet is geplaatst, worden aangewezen:

      a. de houder van de dieren, die zich in de gebouwen, op de terreinen dan wel de gedeelten van gebouwen of terreinen
      bevinden;

      b. de ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij;

      c. de ambtenaren van de Voedsel en Waren Autoriteit;

      d. de dierenarts, die de dieren behandelt;

      e. de medewerkers van de Stichting Gezondsheidszorg voor dieren.
    url: https://wetten.overheid.nl/BWBR0007934/2003-01-01#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking met ingang van de dag waarop artikel 25 van de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007934/2003-01-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling wordt aangehaald als: Regeling toegang van personen of groepen van personen tot besmette of van
      besmetting verdachte gebouwen en terreinen.
    url: https://wetten.overheid.nl/BWBR0007934/2003-01-01#Artikel4
