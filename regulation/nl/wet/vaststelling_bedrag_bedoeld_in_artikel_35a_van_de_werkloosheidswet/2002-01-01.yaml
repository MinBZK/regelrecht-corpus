preamble:
  text: >-
    Gelet op artikel 35a van de Werkloosheidswet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0007525/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het bedrag bedoeld in [artikel 35a van de Werkloosheidswet][ref1] wordt gesteld op € 23 per kalenderweek gedurende
      welke de opleiding of scholing is of wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
    url: https://wetten.overheid.nl/BWBR0007525/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 35a
  - number: '2'
    text: |-
      [Artikel 1][ref1] is niet van toepassing indien de bedrijfsvereniging, als bedoeld in artikel 1, onderdeel e, van
      de Organisatiewet sociale verzekeringen zoals die gold op 25 augustus 1995 de in artikel 35a bedoelde opleiding of
      scholing noodzakelijk heeft geacht voor de inwerkingtredingsdatum van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007525#Artikel1
    url: https://wetten.overheid.nl/BWBR0007525/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007525
        artikel: '1'
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 oktober 1995.
    url: https://wetten.overheid.nl/BWBR0007525/2002-01-01#Artikel3
