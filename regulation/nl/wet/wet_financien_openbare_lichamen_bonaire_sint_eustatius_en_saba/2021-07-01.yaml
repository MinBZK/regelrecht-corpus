        artikel: '8'
  - number: '73.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen de kosten van vervolging worden bepaald als bedoeld in
      [artikel 8.39, tweede lid, van de Belastingwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '74.1'
    text: |-
      Met betrekking tot de bij wege van aanslag en bij wege van voldoening op aangifte geheven eilandbelastingen
      moet het aangiftebiljet binnen een bij de belastingverordening gestelde termijn worden ingeleverd bij de
      eilandambtenaar, bedoeld in [artikel 67, tweede lid, onderdeel b][ref1]. De belastingverordening kan bepalen dat
      de in de vorige volzin bedoelde eilandambtenaar voor de termijn, genoemd in de belastingverordening, een kortere
      termijn in de plaats kan stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '74.2'
    text: |-
      Als de belastingverordening geen regeling bevat omtrent het inleveren van het aangiftebiljet is [artikel 8.4][ref1]
      of [artikel 8.5 van de Belastingwet BES][ref2] onverkort van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '74.3'
    text: |-
      Onverminderd [artikel 8.3, vijfde lid, van de Belastingwet BES][ref1], kan in afwijking van artikel 8.3, eerste
      en vierde lid, van de Belastingwet BES de in [artikel 67, tweede lid, onderdeel b][ref2], bedoelde eilandambtenaar
      vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een verzoek om uitreiking van een
      aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 74.3.a
    text: |-
      worden de door de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar gevraagde bescheiden
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 74.3.b
    text: |-
      kan de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar vorderen dat een van de mondelinge
      aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte geacht wordt niet te
      zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '74.4'
    text: |-
      Indien het derde lid toepassing vindt, kan de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde
      eilandambtenaar voor de termijnen, bedoeld in het eerste lid, eerste volzin, en tweede lid, kortere termijnen in de
      plaats stellen en is [artikel 8.9 van de Belastingwet BES][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '75.1'
    text: |-
      Met betrekking tot de bij wege van voldoening op aangifte geheven eilandbelastingen bepaalt de belastingverordening
      binnen welke termijn de verschuldigde belasting moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel75
  - number: '75.2'
    text: |-
      Voor zover de belastingverordening geen termijn noemt als bedoeld in het eerste lid is
      [artikel 8.11 van de Belastingwet BES][ref1] onverkort van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '75.3'
    text: |-
      Bij toepassing van [artikel 74, derde lid][ref1], kan de in [artikel 67, tweede lid, onderdeel b][ref2], bedoelde
      eilandambtenaar voor de termijnen, bedoeld in het eerste en tweede lid, een kortere termijn in de plaats stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '74'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '76.1'
    text: |-
      De in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar is bevoegd voor eenzelfde
      belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op verschillende
      belastingen, op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '76.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel76
  - number: '77.1'
    text: |-
      Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf, kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven en
      op dat tijdstip nog geen aanslagbiljet is uitgereikt of is toegezonden, binnen zes weken na de dagtekening van het
      aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen bij
      de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '77.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel77
  - number: '77.3'
    text: |-
      De in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar beslist op de aanvraag bij voor bezwaar
      vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '78'
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Minister en Onze Minister van Financiën,
      het internationale gebruik daartoe noodzaakt, wordt vrijstelling van eilandbelastingen verleend. Onze genoemde
      Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel78
  - number: '79'
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf kan de in
      [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar ook een in de belastingverordening voorziene
      vrijstelling ambtshalve verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '80.1'
    text: 'Met betrekking tot eilandbelastingen kunnen bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel80
  - number: 80.1.a
    text: |-
      regels worden gesteld waarbij de [artikelen 8.83, tweede tot en met vijfde lid][ref1], [8.86][ref2], [8.87][ref3],
      en [8.91 van de Belastingwet BES][ref4] geheel of gedeeltelijk van toepassing worden verklaard, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
  - number: 80.1.b
    text: regels worden gesteld die overeenkomen met die in de in onderdeel a genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel80
  - number: '80.2'
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting rust,
      alsmede van de eilandbelasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel80
  - number: '81.1'
    text: |-
      De belastingverordening bepaalt binnen welke termijnen een belastingaanslag invorderbaar is.
      Voor zover de belastingverordening geen termijnen noemt als bedoeld in de vorige volzin is
      [artikel 8.43 van de Belastingwet BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '81.2'
    text: |-
      Bij toepassing van [artikel 74, derde lid][ref1], kan de in [artikel 67, tweede lid, onderdeel b][ref2], bedoelde
      eilandambtenaar voor de termijnen, bedoeld in het eerste en tweede lid, een kortere termijn in de plaats stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '74'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '81.3'
    text: |-
      De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel81
  - number: '81.4'
    text: |-
      Het eerste tot en met derde lid vinden overeenkomstige toepassing ingeval de belasting op andere wijze wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel81
  - number: '82'
    text: |-
      De verrekening van aan de belastingschuldige uit te betalen en van hem te innen bedragen ter zake van
      eilandbelastingen op de voet van [artikel 8.59 van de Belastingwet BES][ref1] is ook mogelijk indien de in
      [artikel 8.43 van de Belastingwet BES][ref2] gestelde termijn, dan wel de krachtens [artikel 81, eerste lid][ref3],
      gestelde termijn nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel81
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '81'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '83.1'
    text: |-
      Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel83
  - number: '83.2'
    text: |-
      Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de
      met de invordering van eilandbelastingen belaste eilandambtenaar de belastingaanslag op de gehele onroerende zaak
      verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de rechten van de
      overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel83
  - number: '83.3'
    text: |-
      De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt met
      zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel83
  - number: '83.4'
    text: |-
      Tegen een met toepassing van het eerste lid vastgestelde belastingaanslag kan mede bezwaar en beroep als bedoeld in
      [titel 8 van hoofdstuk VIII van de Belastingwet BES][ref1] worden ingesteld door de belastingplichtige wiens naam
      niet op het aanslagbiljet staat vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: '83.5'
    text: Van het derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel83
  - number: '84.1'
    text: |-
      De in [artikel 8.58 van de Belastingwet BES][ref1] bedoelde kwijtschelding wordt met betrekking tot
      eilandbelastingen verleend door de in [artikel 67, tweede lid, onderdeel c][ref2], bedoelde eilandambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '84.2'
    text: De eilandsraad kan bepalen dat in het geheel geen dan wel gedeeltelijke kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel84
  - number: '84.3'
    text: |-
      Het bestuurscollege kan de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit
      ontheft de eilandambtenaar belast met de invordering van eilandbelastingen van de verplichting verder pogingen tot
      invordering te doen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel84
  - number: '85'
    text: |-
      Indien ter zake van een eilandbelasting exploot moet worden gedaan, een akte van vervolging betekend of
      een dwangbevel ten uitvoer gelegd in een gemeente, of in een ander openbaar lichaam dan die aan welke de
      belasting is verschuldigd, is daartoe naast de belastingdeurwaarder van laatstbedoeld openbaar lichaam mede de
      belastingdeurwaarder van de desbetreffende gemeente en van het andere openbaar lichaam bevoegd en desgevraagd
      verplicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel85
  - number: '86'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake alle eilandbelastingen in het kader van deze
      paragraaf passende nadere regels worden gegeven ter aanvulling van de in deze paragraaf geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel86
  - number: '87.1'
    text: |-
      Indien beleidsvoornemens van het Rijk leiden tot een wijziging van de uitoefening van taken of activiteiten door
      de openbare lichamen wordt in een afzonderlijk onderdeel van de bijbehorende toelichting met redenen omkleed en met
      kwantitatieve gegevens gestaafd welke de financiële gevolgen zijn voor de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel87
  - number: '87.2'
    text: |-
      In de toelichting wordt tevens aangegeven via welke bekostigingswijze de financiële gevolgen voor de openbare
      lichamen kunnen worden opgevangen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel87
  - number: '87.3'
    text: Over de toepassing van het eerste en tweede lid vindt tijdig overleg plaats met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel87
  - number: '88.1'
    text: Er is een BES-fonds.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.2'
    text: |-
      Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: '88.3'
    text: |-
      Bij de begrotingswet van het het fonds wordt ten aanzien van ieder uitkeringsjaar een bedrag aan middelen van het
      Rijk ten behoeve van het fonds afgezonderd, dat als ontvangst in de begroting wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.4'
    text: |-
      De begroting van het fonds vermeldt het bedrag voor het totaal aan uitkeringen als bedoeld in het zesde en het
      achtste lid aan de openbare lichamen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.5'
    text: |-
      In afwijking van [artikel 2.1, achtste lid, van de Comptabiliteitswet 2016][ref1] bevat de begroting van het fonds
      de ramingen van de uitgaven en de ontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: '88.6'
    text: |-
      Een openbaar lichaam heeft over het uitkeringsjaar recht op een vrije uitkering ten laste van het BES-fonds in de
      vorm van een vast bedrag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.7'
    text: De vrije uitkering komt ten goede aan de algemene middelen van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.8'
    text: |-
      Uit het BES-fonds kunnen uitkeringen aan een of meer openbare lichamen worden verstrekt op een andere wijze dan
      door middel van een vrije uitkering als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '88.9'
    text: Onze Minister beheertde begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel88
  - number: '89.1'
    text: |-
      Onze Minister wie het aangaat kan een renteloze lening verschaffen aan een openbaar lichaam, ten behoeve van het
      doen van een investering ten behoeve van de uitoefening van de publieke taak.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel89
  - number: '89.2'
    text: |-
      Een aanvraag tot het verschaffen van een lening als bedoeld in het eerste lid wordt door de eilandsraad van het
      openbaar lichaam ingediend bij Onze Minister wie het aangaat, door tussenkomst van het College financieel toezicht.
      Het College financieel toezicht voorziet de aanvraag van zijn advies.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel89
  - number: '89.3'
    text: Over toepassing van het eerste en tweede lid vindt tijdig overleg plaats met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel89
  - number: '89.4'
    text: |-
      Onze Ministers stellen jaarlijks ten aanzien van ieder van de openbare lichamen vast welk bedrag verschuldigd is
      aan aflossing van de renteloze leningen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel89
  - number: '90.1'
    text: |-
      Onze Minister doet betalingen aan de openbare lichamen in verband met de vrije uitkering, bij wijze van voorschot,
      over het lopende begrotingsjaar, zoveel mogelijk in twaalf gelijke maandelijkse delen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel90
  - number: '90.2'
    text: |-
      Indien over enig uitkeringsjaar verrichte betalingen aan een openbaar lichaam hoger of lager zijn dan de over dat
      jaar voor het openbaar lichaam vastgestelde uitkering, wordt het verschil teruggevorderd of uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel90
  - number: '90.3'
    text: |-
      Bij het doen van betalingen kan verrekening plaatsvinden in verband met andere verplichtingen als bedoeld in dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel90
  - number: '91.1'
    text: |-
      Een bijzondere uitkering is een bijdrage uit ’s Rijks kas die door Onze Minister wie het aangaat onder voorwaarden
      wordt verstrekt ten behoeve van een bepaalde publieke taak.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel91
  - number: '91.2'
    text: |-
      Bijzondere uitkeringen worden vastgesteld in US dollars en kunnen worden verstrekt aan een openbaar lichaam voor de
      bestrijding van in de regeling van de uitkering aangeduide kosten van de ontvangers.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel91
  - number: '91.3'
    text: Omtrent een voorstel tot regeling van een bijzondere uitkering vindt tijdig overleg plaats met Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel91
  - number: '92.1'
    text: Bijzondere uitkeringen worden geregeld bij of krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: '92.2'
    text: Het eerste lid is niet van toepassing
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: 92.2.a
    text: |-
      in afwachting van de totstandkoming van een wettelijk voorschrift gedurende ten hoogste een jaar of totdat een
      binnen dat jaar bij de Staten-Generaal ingediend wetsvoorstel is verworpen of tot wet is verheven en in werking
      is getreden;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: 92.2.b
    text: |-
      indien de uitkering rechtstreeks op grond van een door de Raad van de Europese Unie, het Europees Parlement en de
      Raad gezamenlijk of de Europese Commissie vastgesteld programma wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: 92.2.c
    text: |-
      indien de begroting de ontvanger van de uitkering en het bedrag waarop de uitkering ten hoogste kan worden
      vastgesteld, vermeldt, of
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: 92.2.d
    text: in incidentele gevallen, mits de uitkering voor ten hoogste vier jaren wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: '92.3'
    text: |-
      Tijdelijke bijzondere uitkeringen kunnen worden geregeld bij algemene maatregel van bestuur. Krachtens de maatregel
      kan de verdeling van de uitkering nader worden bepaald.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: '92.4'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid vervalt vier jaren nadat hij in werking is
      getreden, tenzij voor dat tijdstip een voorstel van wet bij de Staten-Generaal is ingediend waarin de bijzondere
      uitkering wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: '92.5'
    text: Eenmalige bijzondere uitkeringen kunnen worden geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel92
  - number: '93'
    text: |-
      [Artikel 214 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] is niet van toepassing
      op de regeling van de informatievoorziening ten aanzien van een bijzondere uitkering als bedoeld in
      [artikel 92, derde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel92
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '214'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '92'
        hoofdstuk: V
        paragraaf: '3'
  - number: '94'
    text: |-
      Onze Ministers publiceren jaarlijks uiterlijk op de derde woensdag van mei een overzicht van de bijzondere
      uitkeringen, met de daarvoor in de lopende begroting beschikbare bedragen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel94
  - number: '95'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel95
  - number: 95.a
    text: de toepassing van de in dit hoofdstuk gehanteerde begrippen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel95
  - number: 95.b
    text: de procedure tot vaststelling en verstrekking van uitkeringen als bedoeld in dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel95
  - number: 95.c
    text: het verzamelen en vaststellen van gegevens ten behoeve van uitkeringen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel95
  - number: 95.d
    text: |-
      het doen van mededelingen en het verschaffen van inlichtingen in verband met de vaststelling en verstrekking van
      uitkeringen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel95
  - number: '96'
    text: Op een uitkering als bedoeld in dit hoofdstuk kan geen beslag onder de Staat worden gelegd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel96
  - number: '99.1'
    text: |-
      De regels voor de inrichting van de begroting, de begrotingswijzigingen, de jaarrekening en het jaarverslag,
      gesteld in en krachtens [artikel 13][ref1], worden voor het eerst toegepast voor het begrotingsjaar 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel13
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '2'
  - number: '99.2'
    text: |-
      Op de inrichting van de begroting, de begrotingswijzigingen, de jaarrekening en het jaarverslag voor
      de begrotingsjaren tot en met 2011 blijven de regels van toepassing zoals die golden op de dag voor de
      inwerkingtreding van [hoofdstuk III][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028151
        hoofdstuk: III
  - number: '99.3'
    text: |-
      Op besluiten die op grond van het [Besluit tijdelijk financieel toezicht BES][ref1] ter beoordeling zijn voorgelegd
      aan het College financieel toezicht, maar waarover het College bij de inwerkingtreding van [hoofdstuk III][ref2]
      van deze wet nog geen beslissing heeft meegedeeld, zijn de regels van deze wet van toepassing. Voor zover daarbij
      termijnen gelden waarbinnen een beslissing moet zijn genomen of meegedeeld beginnen die termijnen te lopen op de
      datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0022921
      [ref2]: https://wetten.overheid.nl/BWBR0028151#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0022921
      - id: ref2
        bwb_id: BWBR0028151
        hoofdstuk: III
  - number: '100'
    text: |-
      Na de inwerkingtreding van [hoofdstuk III][ref1] van deze wet berust de
      [Regeling rekening-courant en leningenbeheer][ref2] mede op [artikel 37, vijfde lid][ref3], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0021734
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel37
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0028151
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0021734
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '37'
        hoofdstuk: III
        afdeling: '3'
  - number: '101'
    text: |-
      Het door het bestuurscollege van een eilandgebied voor het tijdstip van transitie ten behoeve van een openbaar
      lichaam ter kennis brengen van Onze Minister van Financiën van een besluit tot het invoeren, wijzigen of afschaffen
      van opcenten op de hoofdsom van de vastgoedbelasting wordt met ingang van het tijdstip van transitie aangemerkt
      als het door het bestuurscollege van het desbetreffende openbaar lichaam ter kennis brengen van Onze Minister van
      Financiën van het betreffende besluit.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101
  - number: 101a
    text: |-
      In de [artikelen 101b tot en met 101g][ref1] wordt verstaan onder - *tijdstip van transitie:* het tijdstip waarop
      __REF001___________________________________________________________________________________________________________
      _____ in werking treedt;
        - *tijdstip van inwerkingtreding:* het tijdstip waarop [hoofdstuk IV][ref3] van deze wet in werking treedt;
        - *overgangsperiode:* de periode vanaf het tijdstip van transitie tot het tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0028151#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028249
        artikel: I
      - id: ref3
        bwb_id: BWBR0028151
        hoofdstuk: IV
  - number: 101b.1
    text: |-
      Voor zover de belastingplichtige of inhoudingsplichtige op het tijdstip van transitie rechten en verplichtingen
      heeft ingevolge:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.a
    text: |-
      de Grondbelastingverordening 1908 of een eilandsverordening tot het heffen van opcenten op de grondbelasting als
      bedoeld in artikel 2a, eerste lid, onderdeel B, van de Eilandenregeling Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.b
    text: |-
      de Landsverordening Speelvergunningsrecht Hazardspelen 1957 of daarop gebaseerde regelgeving van de eilandgebieden
      Bonaire, Sint Eustatius of Saba;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.c
    text: de Overdrachtslandsverordening Loterijwezen, de Loterijverordening Bonaire of de daarop gebaseerde regelgeving;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.d
    text: de landsverordening slacht- en vleeskeuring Bonaire;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e
    text: |-
      een van de volgende eilandsverordeningen of eilandsbesluiten houdende algemene maatregelen alsmede daarop
      gebaseerde regelgeving van het eilandgebied Bonaire:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.1°
    text: Motorrijtuigbelastingverordening Bonaire 1954;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.2°
    text: Logeergastenbelastingverordening Bonaire;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.3°
    text: Verhuurautobelastingverordening Bonaire;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.4°
    text: Hondenbelastingverordening 1961;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.5°
    text: Eilandsbesluit heffing afvalstoffen 2005;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.6°
    text: |-
      Eilandsbesluit van 15 mei 1957, no. 1, houdende algemene maatregelen tot vaststelling van de rechten, welke
      ingevolge de Wegenverkeersverordening Bonaire worden geheven;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.7°
    text: Loods- lig- en meerverordening Bonaire;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.8°
    text: Algemene Retributieverordening Bonaire;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.9°
    text: Drank- en horecaverordening;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.10°
    text: |-
      Eilandsbesluit houdende algemene maatregelen van de 4e januari 1963, no. 5, regelende de heffing en inning van
      bioscooprechten;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.e.11°
    text: Verordening marien milieu;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.f
    text: |-
      een van de volgende eilandsverordeningen of eilandsbesluiten houdende algemene maatregelen alsmede daarop
      gebaseerde regelgeving van het eilandgebied Sint Eustatius:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.f.1°
    text: Motorrijtuigbelastingverordening St. Eustatius;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.f.2°
    text: Retributieverordening Sint Eustatius 1997;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.g
    text: |-
      een van de volgende eilandsverordeningen of eilandsbesluiten houdende algemene maatregelen alsmede daarop
      gebaseerde regelgeving van het eilandgebied Saba:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.g.1
    text: Motorrijtuigenbelastingverordening Saba;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.1.g.2
    text: Retributieverordening Saba 2007,
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.2
    text: |-
      Op de rechten en verplichtingen, bedoeld in het eerste lid, blijven tevens van toepassing de Algemene
      landsverordening landsbelastingen, de Invorderingsverordening 1961, de Invorderingsverordening 1970, en de overige
      heffings- en invorderingsbepalingen die op het tijdstip dat onmiddellijk voorafgaat aan het tijdstip van transitie
      in de desbetreffende eilandgebieden van toepassing zijn op de betreffende rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.3
    text: |-
      Het eerste lid en het tweede lid zijn van overeenkomstige toepassing op, op het tijdstip dat onmiddellijk
      voorafgaat aan het tijdstip van transitie, bestaande rechtsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.4
    text: |-
      Indien het tijdstip van transitie is gelegen voor het tijdstip van inwerkingtreding, blijven in de overgangsperiode
      de in het eerste lid, onderdelen a tot en met g, en in het tweede lid bedoelde verordeningen en de daarop
      gebaseerde regelgeving van toepassing in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101b.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101b
  - number: 101c.1
    text: |-
      Op het tijdstip van transitie gaat de bevoegdheid tot het heffen van de belastingen en rechten, genoemd in de in
      [artikel 101b][ref1] genoemde verordeningen en de daarop gebaseerde regelgeving, over op de ambtenaar, bedoeld in
      [artikel 67, tweede lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 101c.2
    text: |-
      Op het tijdstip van transitie gaat de bevoegdheid tot het invorderen van de belastingen en rechten, genoemd in de
      in [artikel 101b][ref1] genoemde verordeningen en de daarop gebaseerde regelgeving, over op de ambtenaar, bedoeld
      in [artikel 67, tweede lid, onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 101c.3
    text: |-
      Indien het tijdstip van transitie is gelegen voor het tijdstip van inwerkingtreding gaan gedurende de
      overgangsperiode, in afwijking van het eerste en tweede lid, de bevoegdheden met betrekking tot heffing en
      invordering van de belastingen en rechten, genoemd in de in [artikel 101b][ref1] genoemde verordeningen, en de
      daarop gebaseerde regelgeving, van de in die verordeningen en de daarop gebaseerde regelgeving genoemde organen
      en functionarissen van de eilandgebieden Bonaire, Sint Eustatius en Saba, over op de overeenkomstige organen en
      functionarissen van de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
  - number: 101d
    text: |-
      De bepalingen van de verordeningen, bedoeld in [artikel 101b][ref1], blijven van toepassing op de in die
      verordeningen strafbaar gestelde feiten die zich hebben voorgedaan vóór het tijdstip van transitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101d
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
  - number: 101e.1
    text: |-
      Voor zover belastingen of rechten op grond van verordeningen als bedoeld in de [artikelen 101b][ref1] en
      [101g][ref2] zijn verschuldigd voor een bepaald tijdvak, eindigt dat tijdvak uiterlijk op het tijdstip van
      inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel101g
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0028151
        artikel: 101g
        hoofdstuk: VII
  - number: 101e.2
    text: |-
      Indien een in het eerste lid bedoelde verordening een tijdvak kent dat mede een periode na het tijdstip
      van inwerkingtreding omvat, worden de voor dat tijdvak verschuldigde belastingen of rechten tijdsevenredig
      berekend. Voor zover belastingen of rechten reeds zijn betaald over het deel van het tijdvak na het tijdstip van
      inwerkingtreding, bestaat voor dat deel aanspraak op tijdsevenredige teruggaaf.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101e
  - number: 101e.3
    text: Bedragen van minder dan USD 5 worden niet geheven of teruggegeven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101e
  - number: 101f.1
    text: |-
      In afwijking in zoverre van hetgeen daarover wordt bepaald in de verordeningen, genoemd in [artikel 101b][ref1],
      treedt de Raad van Beroep voor belastingzaken, bedoeld in [Hoofdstuk VIII van de Belastingwet BES][ref2], op het
      tijdstip van transitie in de plaats van de Raad van Beroep voor Belastingzaken, bedoeld in de Landsverordening op
      het beroep in belastingzaken 1940.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101b
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101f
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 101f.2
    text: |-
      Indien het tijdstip van transitie is gelegen voor het tijdstip van inwerkingtreding van
      [titel 8 van hoofdstuk VIII van de Belastingwet BES][ref1] wordt gedurende de overgangsperiode in
      het eerste lid voor «bedoeld in [Hoofdstuk VIII van de Belastingwet BES][ref2]» gelezen: bedoeld in
      [paragraaf 2b van de Wet geldstelsel BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029244
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0028551#Paragraaf2b
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101f
    references:
      - id: ref1
        bwb_id: BWBR0029244
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0028551
        paragraaf: 2b
  - number: 101g
    text: |-
      De [artikelen 101a tot en met 101f][ref1] zijn mede van toepassing op bij ministeriële regeling aan te wijzen
      andere landsverordeningen en eilandsverordeningen en daaraan opgehangen regelingen van de eilandgebieden Bonaire,
      Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel101a
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel101g
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: 101a
        hoofdstuk: VII
  - number: '102'
    text: |-
      Onze Minister zendt binnen zes jaar na het tijdstip van transitie aan de beide kamers der Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel102
  - number: '103'
    text: |-
      Indien het [Besluit tijdelijk financieel toezicht BES][ref1] is vervallen blijft het van toepassing voor de
      begrotingsjaren waarvoor het heeft gegolden.


      [ref1]: https://wetten.overheid.nl/BWBR0022921
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0022921
  - number: '104'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel104
  - number: '105'
    text: 'Deze wet wordt aangehaald als: Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel105
