      [ref10]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref12]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref13]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref14]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref15]: https://wetten.overheid.nl/BWBR0029244#Artikel8
