      [ref18]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref19]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel73
