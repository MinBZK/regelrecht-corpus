$id: wet_financien_openbare_lichamen_bonaire_sint_eustatius_en_saba
regulatory_layer: WET
publication_date: '2022-12-16'
valid_from: '2021-07-01'
bwb_id: BWBR0028151
url: https://wetten.overheid.nl/BWBR0028151/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de financiële
    functie van de openbare lichamen Bonaire, Sint Eustatius en Saba, hun bevoegdheid tot het heffen van belastingen en
    hun financiële verhouding met het Rijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder - *Onze Minister:* Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties;
        - *Onze Ministers:* Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën;
        - *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *College financieel toezicht:* College financieel toezicht Bonaire, Sint Eustatius en Saba, bedoeld in
      [artikel 2][ref1];
        - *geconsolideerde schuld:* de gezamenlijke schulden van de collectieve sector van een openbaar lichaam in de vorm
      van leningen en kredieten, met uitzondering van de onderlinge schulden binnen de desbetreffende collectieve sector;
        - *rentelast:* de uitgaven aan rente toerekenbaar aan een begrotingsjaar over de geconsolideerde schuld van de
      collectieve sector van een openbaar lichaam;
        - *collectieve sector:* gezamenlijkheid van de rechtspersonen die op basis van het System of National Accounts van
      de Verenigde Naties tot de sector overheid worden gerekend;
        - *rentelastnorm:* de gemiddeld per begrotingsjaar toegestane rentelast voor de collectieve sector van een openbaar
      lichaam, als percentage van de gemiddelde gerealiseerde inkomsten van de collectieve sector van het openbaar
      lichaam over de drie jaren voorafgaand aan het jaar waarin de begroting wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel2
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '2'
        hoofdstuk: II
  - number: '1.2'
    text: |-
      In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel1
  - number: '2.1'
    text: Er is een College financieel toezicht Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.2'
    text: Het College bestaat uit een voorzitter en twee andere leden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      De voorzitter en de andere leden worden op grond van deskundigheid en in overeenstemming met het gevoelen van de
      ministerraad benoemd bij koninklijk besluit op de voordracht van Onze Minister op basis van de volgende procedure:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: 2.3.a
    text: de voorzitter op aanbeveling van Onze Minister-President;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: 2.3.b
    text: een lid namens Bonaire, Sint Eustatius en Saba gezamenlijk en
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: 2.3.c
    text: een lid namens Nederland.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.4'
    text: De leden worden benoemd voor een periode van drie jaar. Herbenoeming is mogelijk.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.5'
    text: Een lid wordt op eigen verzoek ontslagen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.6'
    text: |-
      Een lid kan worden geschorst of ontslagen wegens ongeschiktheid voor de vervulde functie, dan wel wegens andere
      zwaarwegende in zijn persoon gelegen redenen, dan wel wegens het aanvaarden van een ambt, betrekking of functie als
      bedoeld in [artikel 3, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel3
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '3'
        hoofdstuk: II
  - number: '2.7'
    text: Schorsing en ontslag geschieden bij koninklijk besluit op voordracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.8'
    text: |-
      Voorafgaande aan een ontslag of een schorsing wordt het College gehoord, tenzij de omstandigheden met betrekking
      tot het ontslag of de schorsing dat horen belemmeren.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
  - number: '2.9'
    text: |-
      Onze Minister stelt de vaste vergoeding van de leden van het College vast. Hierbij wordt de toepasselijke
      salarisschaal van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren][ref1] en de toepasselijke
      deeltijdfactor aangegeven. De leden hebben voorts overeenkomstig het [Reisbesluit binnenland][ref2] en het
      [Reisbesluit buitenland][ref3] recht op vergoeding van reis- en verblijfskosten. Daarnaast hebben de leden op
      declaratiebasis recht op vergoeding van kosten van internationale telefoongesprekken die zij maken in het kader van
      de werkzaamheden voor het College.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0005889
      [ref3]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0005889
      - id: ref3
        bwb_id: BWBR0006842
  - number: '3.1'
    text: 'Een lid van het College financieel toezicht kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.a
    text: Gouverneur of Rijksvertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.b
    text: minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.c
    text: commissaris van de Koning of gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.d
    text: lid van een vertegenwoordigend orgaan of van een daarmee vergelijkbaar orgaan van Nederland;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.e
    text: burgemeester of wethouder dan wel gezaghebber of eilandgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.f
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.g
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: 3.1.h
    text: |-
      Nationale ombudsman of substituut-ombudsman als bedoeld in
      [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 3.1.i
    text: ambtenaar bij een ministerie, alsmede de daaronder ressorterende instellingen, diensten en bedrijven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Een lid vervult ook overigens geen andere betrekking of nevenfunctie die overigens ongewenst is met het oog op een
      goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: '3.3'
    text: Een lid meldt het voornemen tot het aanvaarden van een andere betrekking of nevenfunctie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
  - number: '3.4'
    text: |-
      Het College maakt de nevenfuncties van een lid openbaar. Openbaarmaking geschiedt bij zijn benoeming en voorts door
      jaarlijkse publicatie van een opgave van deze nevenfuncties in de Staatscourant en in het afkondigingsblad, bedoeld
      in [artikel 2, vierde lid, van de Bekendmakingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '4.1'
    text: 'De taken van het College financieel toezicht zijn, onverminderd de in andere artikelen genoemde taken:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: 4.1.a
    text: |-
      adviseren van de openbare lichamen en Onze Minister in het kader van het toezicht op de toepassing van de bij deze
      wet vastgestelde normen ter zake van de voorbereiding, de uitvoering en de verantwoording van de begroting door het
      openbaar lichaam, alsmede van het toezicht op de verbetering van het financieel beheer, de inrichting en de werking
      van de administraties en het betalingsverkeer;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: 4.1.b
    text: |-
      het toezicht op het dagelijks beheer door de bestuurscolleges en in dat verband het toetsen of aan de bij deze wet
      vastgestelde voorwaarden is voldaan voor het aangaan van kredieten door een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: 4.1.c
    text: |-
      het in opdracht van Onze Minister uitvoeren van taken in het kader van de uitvoering van deze wet en de daarop
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het College legt eens per half jaar schriftelijk verantwoording af over zijn werkzaamheden aan Onze Minister. Het
      College zendt een afschrift van dit verslag aan de betrokken bestuurscolleges en eilandsraden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het College verstrekt desgevraagd inlichtingen over zijn werkzaamheden aan Onze Minister, aan Onze Minister van
      Financiën en aan het desbetreffende bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan, na overleg met het betrokken bestuurscollege, beleidsregels vaststellen en algemene en
      bijzondere aanwijzingen geven ten aanzien van de uitoefening van de in en op grond van deze wet en de daarop
      berustende bepalingen aan het College toegekende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het College financieel toezicht stelt een bestuursreglement vast, waarin in ieder geval regels over zijn
      besluitvorming, werkwijze en procedures zijn opgenomen. In het reglement worden tevens regels opgenomen over de
      verdeling van de werkzaamheden bij de voorbereiding van de besluiten van het College.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Voorafgaande aan de vaststelling van het bestuursreglement en van wijzigingen daarvan, overlegt het College
      hierover met de bestuurscolleges.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      De voorzitter heeft de dagelijkse leiding en ziet toe op een doelmatige en voortvarende uitvoering van de taken van
      het College.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
  - number: '5.4'
    text: Indien bij het nemen van besluiten door het College de stemmen staken, heeft de voorzitter de doorslaggevende stem.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
  - number: '5.5'
    text: |-
      Voor het bestuursreglement alsmede elke wijziging daarvan is de goedkeuring van Onze Minister vereist. De
      goedkeuring kan slechts worden onthouden wegens strijd met het recht of op de grond dat het bestuursreglement een
      goede taakuitoefening kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
  - number: '5.6'
    text: |-
      Het bestuursreglement wordt na de goedkeuring bekendgemaakt in de Staatscourant en in het afkondigingsblad, bedoeld
      in [artikel 2, vierde lid, van de Bekendmakingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '6.1'
    text: Het College financieel toezicht heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '6.2'
    text: Aan de secretaris kunnen medewerkers worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      De secretaris en de medewerkers staan onder gezag van de voorzitter van het College en leggen uitsluitend aan hem
      verantwoording af.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '6.4'
    text: Onze Minister benoemt de secretaris en de medewerkers na overleg met het College.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '6.5'
    text: De secretaris en de medewerkers zijn geen lid van het College.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '6.6'
    text: |-
      De secretaris en de medewerkers zijn in dienst van Onze Minister, dan wel worden vanwege Onze Minister aan het
      College ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      De bezoldiging van de leden, de secretaris en de medewerkers van het College financieel toezicht, alsmede de
      bekostiging van de overige apparaatsuitgaven komen ten laste van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      De uitgaven en ontvangsten, samenhangende met het verstrekken van rekening-courantkredieten door het College aan
      een openbaar lichaam, komen ten laste respectievelijk ten gunste van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      De valutarisico’s, samenhangende met het verstrekken van rekening-courantkredieten door het College aan een
      openbaar lichaam, komen voor rekening van de begroting van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      Indien naar het oordeel van Onze Minister het College financieel toezicht bij de uitoefening van zijn taak ernstig
      in gebreke blijft, kan Onze Minister ten aanzien van het College of een of meer van de leden van het College
      financieel toezicht tijdelijk de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Deze voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het College,
      onderscheidenlijk het lid, in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog
      zijn taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      In dit artikel wordt onder deelnemen in een privaatrechtelijke rechtspersoon verstaan: het houden van aandelen in
      of het onderdeel uitmaken van het bestuur van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Het eilandsbestuur neemt een besluit tot het oprichten van of het deelnemen in een privaatrechtelijke rechtspersoon
      of een maatschap alleen indien dit bijzonder aangewezen is voor het verrichten van de beoogde activiteit of ten
      behoeve van vervreemding van bezittingen van het openbaar lichaam. Het bestuurscollege neemt een besluit als
      bedoeld in de eerste volzin niet dan nadat de eilandsraad een ontwerpbesluit is toegezonden en in de gelegenheid is
      gesteld zijn wensen en bedenkingen ter kennis van het bestuurscollege te brengen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      Een besluit tot het oprichten van of het deelnemen in een privaatrechtelijke rechtspersoon of een maatschap behoeft
      de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of indien niet aannemelijk is dat is voldaan aan de
      voorwaarde, genoemd in de eerste volzin van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.5'
    text: |-
      Ambtenaren, door of vanwege het openbaar lichaam aangesteld of daaraan ondergeschikt, en politieke ambtsdragers
      van het openbaar lichaam hebben geen zitting in het bestuur van een privaatrechtelijke rechtspersoon waarin het
      openbaar lichaam deelneemt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.6'
    text: |-
      Besluiten tot het benoemen en herbenoemen van vertegenwoordigers van een bestuurscollege of een openbaar lichaam
      in een privaatrechtelijke rechtspersoon worden niet genomen dan nadat van Onze Minister een verklaring is ontvangen
      dat deze geen bezwaar heeft tegen die benoeming of herbenoeming.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.7'
    text: |-
      Onze Minister kan de verklaring, bedoeld in het zesde lid, weigeren wegens strijd met het vijfde lid, of als naar
      zijn oordeel de betreffende beoogde vertegenwoordiger niet over voldoende deskundigheid beschikt of overigens niet
      voldoet aan de eisen die voortvloeien uit de beginselen van goed ondernemingsbestuur.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.8'
    text: |-
      Onze Minister kan op grond van overwegingen van deugdelijk beheer aanwijzingen geven aan de vertegenwoordiger
      van een bestuurscollege of een openbaar lichaam in een privaatrechtelijke rechtspersoon met het oog op de
      standpuntbepaling in de aandeelhouders- of bestuursvergadering op het terrein van het dividendbeleid, de benoeming,
      het ontslag en de salarissen van bestuurders. De vertegenwoordiger neemt in elk geval het standpunt in dat
      investeringen en desinvesteringen door de rechtspersoon voor goedkeuring aan de algemene aandeelhoudersvergadering,
      respectievelijk het bestuur worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '9.9'
    text: |-
      Het bestuurscollege stelt de jaarrekeningen van de privaatrechtelijke rechtspersonen waarin het college of het
      openbaar lichaam deelneemt uiterlijk zes maanden na afloop van het boekjaar aan het College financieel toezicht
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel9
  - number: '10.1'
    text: |-
      Vervreemding van bezittingen van een openbaar lichaam op welke wijze dan ook geschiedt tegen marktconforme
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Besluiten tot vervreemding van onroerende zaken, aandelen, obligaties en concessies, en roerende zaken behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of met het financieel belang van het openbaar
      lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister kan ten aanzien van door hem aan te geven soorten besluiten aangeven dat die de in het tweede lid
      bedoelde goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      Geldleningen kunnen niet ten name of ten laste van een openbaar lichaam worden aangegaan, gegarandeerd of
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel11
  - number: '11.2'
    text: De rentelastnorm voor de collectieve sector van een openbaar lichaam bedraagt 0% gemiddeld per begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een dreigende overschrijding van de rentelastnorm wordt veroorzaakt door uitgaven- en
      inkomstenontwikkelingen in de collectieve sector, niet zijnde een openbaar lichaam, kan Onze Minister aanwijzingen
      geven aan een of meer rechtspersonen binnen de collectieve sector ter beheersing van de rentelasten van de
      collectieve sector.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      Ter beoordeling van deze uitgaven- en inkomstenontwikkeling rapporteert het College financieel toezicht in
      samenwerking met het Centraal Bureau voor de Statistiek aan Onze Minister, gelijktijdig met het doorzenden van
      de jaarrekeningen van de openbare lichamen als bedoeld in [artikel 31, eerste lid][ref1], over de voorlopige
      uitgaven-, inkomsten-, tekort- en schuldcijfers van de collectieve sector van de openbare lichamen. Daarbij zijn de
      definities van het System of National Accounts leidend.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel31
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '12.1'
    text: Het openbaar lichaam heeft een rekening-courant bij het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      Liquiditeitstekorten ten gevolge van afwijkingen in de gerealiseerde uitgaven en ontvangsten van de gewone dienst
      worden, na instemming van het College financieel toezicht, gedekt door het toestaan van een tekort op de rekening-
      courant.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel12
  - number: '12.3'
    text: |-
      Het College financieel toezicht stelt per maand, per kwartaal of per half jaar een maximum vast van het tekort
      op een rekening-courant, dan wel het minimum van het tegoed op een rekening-courant, zodanig dat het toegestane
      rekening-courantkrediet niet leidt tot overschrijding van de geldende rentelastnorm in het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel12
  - number: '12.4'
    text: Een openbaar lichaam is niet bevoegd kredieten anders dan bij het College financieel toezicht op te nemen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      De begroting, de begrotingswijzigingen, de jaarrekening en het jaarverslag worden ingericht op basis van een
      stelsel van baten en lasten, overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen nadere
      regels.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: '13.2'
    text: |-
      In de raming van baten en lasten wordt per begrotingspost opgenomen het gerealiseerde bedrag van het voorvorige
      begrotingsjaar, het geraamde bedrag van het vorige begrotingsjaar na wijziging en het geraamde bedrag van het
      begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: '13.3'
    text: 'De begroting bevat voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: 13.3.a
    text: een post onvoorzien;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: 13.3.b
    text: een meerjarenraming met toelichting voor ten minste drie op het begrotingsjaar volgende jaren;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: 13.3.c
    text: een paragraaf weerstandsvermogen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel13
  - number: '14'
    text: Aan de openbare lichamen kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      De eilandsraad brengt voor alle taken en activiteiten jaarlijks op de begroting de bedragen die hij daarvoor
      beschikbaar stelt, alsmede de financiële middelen die hij naar verwachting kan aanwenden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel15
  - number: '15.2'
    text: De begroting is in evenwicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel15
  - number: '15.3'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel15
  - number: '15.4'
    text: De dienst van het kalenderjaar wordt gesloten op 31 december van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel15
  - number: '16'
    text: 'Verplichte uitgaven van het openbaar lichaam zijn:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel16
  - number: 16.a
    text: opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel16
  - number: 16.b
    text: de uitgaven die bij of krachtens de wet aan het openbaar lichaam zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel16
  - number: 16.c
    text: |-
      de uitgaven die voortvloeien uit de van het openbaar lichaam gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het bestuurscollege zendt jaarlijks voor een door het College financieel toezicht te bepalen datum de
      ontwerpbegroting voor het komende jaar aan het College.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel17
  - number: '17.2'
    text: |-
      Het College financieel toezicht toetst de ontwerpbegroting aan de criteria, genoemd in
      [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel19
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '17.3'
    text: |-
      Het College financieel toezicht zendt binnen twee weken na ontvangst van de ontwerpbegroting aan het
      bestuurscollege een advies, bevattende zijn bevindingen met betrekking tot de uitgevoerde toetsing en eventuele
      aanbevelingen met betrekking tot aanpassing van de ontwerpbegroting.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel17
  - number: '17.4'
    text: |-
      Het bestuurscollege biedt jaarlijks uiterlijk op 1 september van het jaar, voorafgaand aan het begrotingsjaar, de
      ontwerpbegroting aan de eilandsraad aan en geeft daarbij aan op welke wijze rekening is gehouden met de bevindingen
      en aanbevelingen van het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel17
  - number: '17.5'
    text: |-
      De ontwerpbegroting en de overige in het eerste en derde lid bedoelde stukken liggen, zodra zij aan de
      eilandsraad zijn aangeboden, voor eenieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel17
  - number: '18.1'
    text: |-
      De eilandsraad beraadslaagt over de ontwerpbegroting niet eerder dan twee weken na de openbare kennisgeving,
      bedoeld in [artikel 17, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '18.2'
    text: |-
      Over voorstellen tot amendering van de ontwerpbegroting wordt geen besluit genomen dan nadat het College
      financieel toezicht in de gelegenheid is gesteld over die voorstellen een advies uit te brengen. Daartoe zendt
      het bestuurscollege voorstellen tot amendering van de ontwerpbegroting onmiddellijk na indiening daarvan aan het
      College financieel toezicht. Het College financieel toezicht brengt binnen drie dagen na ontvangst een advies uit
      als bedoeld in [artikel 17, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '18.3'
    text: De eilandsraad stelt de begroting vast in het jaar voorafgaande aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel18
  - number: '19.1'
    text: De begroting behoeft de goedkeuring van Onze Minister. De goedkeuring kan gedeeltelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.2'
    text: 'Onze Minister toetst de begroting in ieder geval aan de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: 19.2.a
    text: |-
      de begroting is in overeenstemming met de [artikelen 11 tweede lid][ref1], [13][ref2] en [15][ref3] en de daarop
      berustende bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel15
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: 19.2.b
    text: de begroting is toelaatbaar uit een oogpunt van een rechtmatig, doelmatig en controleerbaar financieel beheer;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: 19.2.c
    text: |-
      de in de begroting opgenomen baten en lasten zijn in overeenstemming met de best mogelijke inschatting van reeds
      aangegane financiële verplichtingen en van te verwachten externe ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: 19.2.d
    text: |-
      de in de begroting opgenomen financiële verplichtingen en lasten brengen geen onaanvaardbare risico’s met zich mee
      voor toekomstige begrotingsjaren;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: 19.2.e
    text: de begroting voldoet overigens aan de geldende regelgeving.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het financieel belang van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.4'
    text: |-
      Het bestuurscollege zendt de door de eilandsraad vastgestelde begroting binnen twee weken na de vaststelling, maar
      in ieder geval vóór 15 november van het jaar voorafgaande aan dat waarvoor de begroting dient, aan Onze Minister,
      door tussenkomst van het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister maakt binnen twee weken na ontvangst van de vastgestelde begroting het besluit omtrent goedkeuring
      bekend aan de eilandsraad die de begroting heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.6'
    text: Het nemen van een besluit omtrent goedkeuring kan eenmaal voor ten hoogste twee weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.7'
    text: |-
      Een besluit tot goedkeuring wordt geacht te zijn genomen, indien binnen de in het vijfde lid genoemde termijn
      geen besluit omtrent goedkeuring of geen besluit tot verdaging, dan wel binnen de termijn waarvoor het besluit is
      verdaagd, geen besluit omtrent goedkeuring is bekendgemaakt aan de eilandsraad die de begroting heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.8'
    text: |-
      Als Onze Minister aan de begroting geheel of gedeeltelijk goedkeuring onthoudt stelt het bestuurscollege zo spoedig
      mogelijk na ontvangst van dat besluit een nieuwe ontwerpbegroting op, rekening houdend met het besluit van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
  - number: '19.9'
    text: |-
      Het eerste en tweede lid alsmede de [artikelen 17, tweede en vierde lid][ref1], en [18][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel18
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '20.1'
    text: |-
      Als het College financieel toezicht op de in [artikel 19, vierde lid][ref1], genoemde datum nog geen begroting ter
      goedkeuring heeft ontvangen bericht het Onze Minister daarover. Dat bericht bevat een door het College opgesteld
      ontwerp voor de begroting voor het eerstvolgende begrotingsjaar, zoals die naar het oordeel van het College
      vastgesteld zou moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel19
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '20.2'
    text: |-
      Als Onze Minister een week na de in [artikel 19, vierde lid][ref1], genoemde datum nog geen begroting ter
      goedkeuring heeft ontvangen stelt hij zelf de begroting van het desbetreffende openbare lichaam voor het
      eerstvolgende begrotingsjaar vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel19
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '21.1'
    text: Een besluit tot wijziging van de begroting behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      De [artikelen 17][ref1], [18][ref2] en [19][ref3] zijn van overeenkomstige toepassing. Onze Minister betrekt bij de
      beoordeling de ontwikkeling van het saldo op de rekening-courant, bedoeld in [artikel 12, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0028151#Artikel12
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0028151
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '21.3'
    text: |-
      Indien dit nodig is in verband met het herstel van schade veroorzaakt door buitengewone gebeurtenissen, waaronder
      natuurrampen, kan Onze Minister, na overleg met het desbetreffende bestuurscollege een tekort op de begroting of
      een overschrijding van de rentelastnorm toestaan.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel21
  - number: '21.4'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting ter goedkeuring aan Onze Minister wordt
      aangeboden, de begroting nog niet is goedgekeurd, vangt de in [artikel 19, vijfde lid][ref1], bedoelde termijn aan
      op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel19
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '22.1'
    text: |-
      Het bestuurscollege zendt uiterlijk drie weken na afloop van ieder kwartaal uitvoeringsrapportages aan Onze
      Minister, door tussenkomst van het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Zo nodig gaan de uitvoeringsrapportages vergezeld van ontwerpen van begrotingswijzigingen als bedoeld in
      [artikel 21][ref1]. Ontwerpen van begrotingswijzigingen worden in ieder geval voorgelegd met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel21
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: 22.2.a
    text: wijzigingen in de ramingen van de verplichtingen, de baten en lasten van het lopende jaar;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel22
  - number: 22.2.b
    text: voornemens tot nieuw beleid;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel22
  - number: 22.2.c
    text: |-
      compensatie van inmiddels in de rekening van het voorafgaande begrotingsjaar gebleken tekorten op de gewone dienst
      of op de kapitaaldienst, of van een gebleken overschrijding van de rentelastnorm.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel22
  - number: '23.1'
    text: |-
      Behoudens de [artikelen 24][ref1] en [26][ref2] kunnen ten laste van het openbaar lichaam geen uitgaven worden
      gedaan die niet zijn geraamd bij goedgekeurde begroting of een goedgekeurde begrotingswijziging dan wel in een door
      Onze Minister overeenkomstig [artikel 20][ref3] vastgestelde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028151#Artikel20
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '26'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028151
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '23.2'
    text: |-
      Het bestuurscollege legt het voornemen tot het aangaan van een financiële verplichting voor advies voor aan het
      hoofd Financiën van het openbaar lichaam of, bij zijn afwezigheid, aan zijn eerste of tweede plaatsvervanger. Een
      positief advies wordt verleend indien de lasten die samenhangen met de financiële verplichting zijn voorzien in
      een goedgekeurde begroting of goedgekeurd besluit tot wijziging van de begroting dan wel in een door Onze Minister
      overeenkomstig [artikel 20][ref1] vastgestelde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel20
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '23.3'
    text: |-
      Als de voorgenomen financiële verplichting niet is voorzien in een goedgekeurde begroting of goedgekeurd besluit
      tot wijziging van de begroting dan wel in een door Onze Minister overeenkomstig [artikel 20][ref1] vastgestelde
      begroting dient het bestuurscollege zo snel mogelijk een voorstel tot wijziging van de begroting in bij de
      eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel20
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '24.1'
    text: |-
      Voor het aangaan van verplichtingen die niet voorzien zijn in een goedgekeurde begroting of goedgekeurd besluit
      tot wijziging van de begroting dan wel in een door Onze Minister overeenkomstig [artikel 20][ref1] vastgestelde
      begroting behoeft het openbaar lichaam de toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel20
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '24.2'
    text: |-
      Een aanvraag tot toepassing van het eerste lid kan door Onze Minister slechts worden afgewezen wegens strijd met
      het recht of met het financieel belang.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel24
  - number: '24.3'
    text: |-
      Onze Minister beslist op de aanvraag binnen twee weken na de verzending van de aanvraag, bedoeld in het tweede
      lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het openbaar lichaam
      is verzonden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel24
  - number: '24.4'
    text: Onze Minister kan aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister kan bepalen voor welke posten en tot welk bedrag het openbaar lichaam de toestemming, bedoeld in het
      eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel24
  - number: '25.1'
    text: |-
      In gevallen van dringende spoed kan, indien de eilandsraad daartoe besluit, een verplichting worden aangegaan
      voordat de desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt Onze Minister,
      door tussenkomst van het College financieel toezicht toegezonden. Is de aangegane verplichting geraamd bij een
      begrotingswijziging die nog niet ter goedkeuring is ingezonden, dan wordt deze begrotingswijziging tezamen met het
      besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel25
  - number: '25.2'
    text: Over het in het eerste lid bedoelde besluit beslist de eilandsraad bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel25
  - number: '26.1'
    text: |-
      Indien de eilandsraad [artikel 25][ref1] heeft toegepast en Onze Minister zijn goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthoudt, kan hij binnen een maand nadat zijn besluit onherroepelijk is geworden,
      de leden van de eilandsraad die hun stem vóór het in [artikel 25][ref2] bedoelde besluit hebben uitgebracht, ieder
      voor een gelijk deel, persoonlijk voor deze verplichting aansprakelijk stellen tegenover het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel25
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '26.2'
    text: |-
      De werking van het besluit tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel26
  - number: '26.3'
    text: |-
      De Rijksvertegenwoordiger stelt zonodig namens en ten laste van het openbaar lichaam een rechtsvordering in tot
      betaling van de krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel26
  - number: '27.1'
    text: |-
      Af- en overschrijving op de posten van de begroting is alleen toegestaan voor zover daartoe machtiging is verleend
      in de begroting zelf of bij een afzonderlijk besluit van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel27
  - number: '27.2'
    text: |-
      Opdrachten tot af- en overschrijvingen waartoe machtiging is verleend in de begroting behoeven de instemming van
      de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel27
  - number: '27.3'
    text: Bij algemene maatregel van bestuur kan de bevoegdheid tot overschrijving aan voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel27
  - number: '27.4'
    text: |-
      Een afzonderlijk besluit als bedoeld in het eerste lid behoeft de goedkeuring van Onze Minister.
      [Artikel 19, tweede, derde, en vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel19
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '28.1'
    text: |-
      Het bestuurscollege legt aan de eilandsraad over elk begrotingsjaar verantwoording af over het door hem gevoerde
      bestuur, onder overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel28
  - number: '28.2'
    text: |-
      De jaarrekening, het jaarverslag en de in [artikel 38, vierde en vijfde lid][ref1], bedoelde stukken liggen,
      zodra zij aan de eilandsraad zijn aangeboden, voor eenieder ter inzage en zijn algemeen verkrijgbaar. Van de
      terinzagelegging en de verkrijgbaarstelling wordt openbaar kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
        hoofdstuk: III
        afdeling: '3'
  - number: '28.3'
    text: |-
      De eilandsraad beraadslaagt over de in het eerste en tweede lid bedoelde stukken niet eerder dan twee weken na de
      openbare kennisgeving, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel28
  - number: '29.1'
    text: |-
      De eilandsraad stelt de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De
      jaarrekening betreft alle baten en lasten van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel29
  - number: '29.2'
    text: |-
      Indien de eilandsraad tot het standpunt komt dat in de jaarrekening opgenomen baten, lasten of balansmutaties, die
      niet rechtmatig tot stand zijn gekomen, aan de vaststelling van de jaarrekening in de weg staan, brengt hij dit
      terstond ter kennis van het bestuurscollege met vermelding van de gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel29
  - number: '29.3'
    text: |-
      Het bestuurscollege zendt de eilandsraad binnen twee maanden na ontvangst van het standpunt, bedoeld in het
      tweede lid, een voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij de eilandsraad gerezen
      bedenkingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel29
  - number: '29.4'
    text: |-
      Indien het bestuurscollege een voorstel voor een indemniteitsbesluit heeft gedaan, stelt de eilandsraad de
      jaarrekening niet vast dan nadat hij heeft besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel29
  - number: '30'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden ontlast de vaststelling van de jaarrekening de leden van het
      bestuurscollege van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel30
  - number: '31.1'
    text: |-
      Het bestuurscollege zendt de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in
      [artikel 28][ref1] bedoelde stukken binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het
      jaar, volgend op het begrotingsjaar, aan Onze Minister, door tussenkomst van het College financieel toezicht. Het
      bestuurscollege voegt daarbij, indien van toepassing, het besluit van de eilandsraad over een voorstel voor een
      indemniteitsbesluit met de reactie, bedoeld in [artikel 29, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel29
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '28'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '31.2'
    text: |-
      Het College financieel toezicht kan een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] onderzoek laten doen naar de rechtmatigheid
      en doelmatigheid van het gevoerde bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '31.3'
    text: |-
      Indien uit de jaarrekening blijkt dat sprake is van een tekort op de gewone dienst of op de kapitaaldienst of
      van een overschrijding van de rentelastnorm, geeft het College financieel toezicht aan het bestuurscollege een
      advies voor wijziging van de begroting voor het lopende jaar en voor de begroting voor het komende jaar. Het
      bestuurscollege betrekt dit advies bij de eerstvolgende uitvoeringsrapportage, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel22
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '32'
    text: |-
      Indien de eilandsraad de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststelt,
      zendt het bestuurscollege de jaarrekening, vergezeld van de overige in [artikel 28][ref1] bedoelde stukken,
      respectievelijk het indemniteitsbesluit ter vaststelling aan Onze Minister, door tussenkomst van het
      College financieel toezicht. Onze Minister stelt in dat geval de jaarrekening en in voorkomende gevallen het
      indemniteitsbesluit vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '28'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '33.1'
    text: |-
      Beleidsmaatregelen die gevolgen hebben voor de baten of lasten op de begroting, worden door het bestuurscollege en
      de eilandsraad uitgevoerd door middel van een daartoe geëigende voorziening.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '33.2'
    text: |-
      Indien het bestuurscollege de in het eerste lid bedoelde voorziening niet tijdig vaststelt implementeert of
      uitvoert en daardoor de haalbaarheid van de uitgaven- en inkomstenramingen in gevaar komt, brengt het College
      financieel toezicht dit onder de aandacht van het bestuurscollege. Het rapport kan aanbevelingen bevatten met
      betrekking tot de te treffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '33.3'
    text: |-
      Het bestuurscollege deelt binnen veertien dagen aan het College financieel toezicht mee op welke wijze rekening
      wordt gehouden met het rapport, bedoeld in het tweede lid en, indien aan de orde, onder vermelding van de termijnen
      die daarbij in acht zullen worden genomen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '33.4'
    text: |-
      Het College financieel toezicht rapporteert aan Onze Minister indien uit de mededeling van het bestuurscollege,
      bedoeld in het derde lid, blijkt dat het bestuurscollege of de eilandsraad een voorziening als bedoeld in het
      eerste lid niet treft of dat op een zodanig tijdstip doet dat de haalbaarheid van de uitgaven- en inkomstenramingen
      in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '33.5'
    text: |-
      Het College financieel toezicht zendt het desbetreffende bestuurscollege en de desbetreffende eilandsraad een
      afschrift van het rapport.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '33.6'
    text: |-
      Onze Minister kan in afwachting van de totstandkoming of implementatie van de bedoelde voorziening, besluiten het
      College financieel toezicht te belasten met het vaststellen van bijzondere maatregelen en het zelfstandig uitvoeren
      hiervan.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel33
  - number: '34.1'
    text: |-
      De eilandsraad stelt bij eilandsverordening de uitgangspunten vast voor het financieel beheer en voor de inrichting
      van de financiële organisatie. Deze eilandsverordening waarborgt dat wordt voldaan aan de eisen van rechtmatigheid,
      doelmatigheid, verantwoording en controle.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.2'
    text: De eilandsverordening wordt na vaststelling gezonden aan het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.3'
    text: |-
      Het College financieel toezicht kan te allen tijde een onderzoek instellen naar het beheer en de inrichting van de
      financiële organisatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.4'
    text: |-
      Het College financieel toezicht kan met een bestuurscollege afspraken maken ter verbetering van het financieel
      beheer, het materieel beheer en de daarvoor bij te houden administraties.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.5'
    text: |-
      Onze Minister kan het bestuurscollege ter zake van de in het vierde lid genoemde onderwerpen algemene en bijzondere
      aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.6'
    text: |-
      Onze Minister geeft deze aanwijzingen op het terrein van het financieel beheer met inachtneming van de bevindingen
      van de accountants, bedoeld in de [artikelen 38, derde lid][ref1], en [31, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel31
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '34.7'
    text: Het bestuurscollege neemt de aanwijzingen, bedoeld in het vijfde en zesde lid, in acht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '34.8'
    text: |-
      Voor de afspraken inzake de verbeteringen in het financieel beheer maakt het College financieel toezicht gebruik
      van de bevindingen van de accountants, bedoeld in de [artikelen 38, derde lid][ref1], en [31, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel31
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '38'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '34.9'
    text: |-
      Het College financieel toezicht houdt toezicht op de inrichting van de controle die plaatsvindt in het kader van de
      uitvoering van de begroting.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel34
  - number: '35.1'
    text: |-
      Uitsluitend het hoofd Financiën van het openbaar lichaam of zijn eerste of tweede plaatsvervanger kunnen
      gemandateerd worden namens het openbaar lichaam privaatrechtelijke rechtshandelingen te verrichten die voortvloeien
      uit een besluit tot het aangaan van een financiële verplichting en waarover een positief advies is verleend als
      bedoeld in [artikel 23, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel23
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '35.2'
    text: |-
      Indien het bestuurscollege zonder een positief advies, bedoeld in het eerste lid, de in dat lid bedoelde
      functionarissen niettemin opdraagt een verplichting aan te gaan of de daarmee verband houdende privaatrechtelijke
      rechtshandelingen te verrichten, informeert de betrokken functionaris Onze Minister daarover, door tussenkomst van
      het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.3'
    text: |-
      Onze Minister geeft ter zake van de door de betrokken functionaris voorgelegde aangelegenheden een aanwijzing. Het
      bestuurscollege en de betrokken functionaris nemen deze aanwijzing in acht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.4'
    text: |-
      Het bestuurscollege deponeert de namen en functies van de personen, bedoeld in het eerste lid, bij het College
      financieel toezicht. Het College financieel toezicht houdt hiervan een register bij en publiceert dit register na
      de vaststelling ervan, na elke wijziging, maar in elk geval iedere zes maanden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.5'
    text: |-
      Onze Minister kan begrotingen of begrotingsartikelen aanwijzen ten laste waarvan geen financiële verplichtingen
      mogen worden aangegaan, voordat hij daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.6'
    text: |-
      De inhoud van de aangewezen begrotingen of begrotingsartikelen, bedoeld in het vijfde lid, worden, zolang ze zijn
      aangewezen, opgenomen in het register, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.7'
    text: |-
      Privaatrechtelijke rechtshandelingen betreffende het aangaan van financiële verplichtingen als bedoeld in dit
      artikel zijn niet geldig indien:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: 35.7.a
    text: de regels in dit besluit omtrent de bevoegdheid van de handelende personen niet zijn nageleefd, of
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: 35.7.b
    text: |-
      deze handelingen begrotingen of begrotingsartikelen betreffen die ingevolge het zesde lid zijn opgenomen in het
      register, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '35.8'
    text: |-
      In geval van het aangaan van financiële verplichtingen en het verrichten van privaatrechtelijke rechtshandelingen
      waartoe door de eilandsraad is besloten, is dit artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel35
  - number: '36.1'
    text: |-
      Namens het openbaar lichaam is uitsluitend het hoofd Financiën van het openbaar lichaam of, bij zijn afwezigheid,
      zijn eerste of tweede plaatsvervanger, bevoegd tot het verrichten van betalingen die voortvloeien uit door een
      bestuursorgaan aangegane financiële verplichtingen. Zij kunnen de ontvanger van het openbaar lichaam machtigen de
      genoemde betalingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.2'
    text: |-
      [Artikel 35, tweede en derde lid][ref1], is van overeenkomstige toepassing op opdrachten van het bestuurscollege
      tot het doen van betalingen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel35
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '35'
        hoofdstuk: III
        afdeling: '3'
  - number: '36.3'
    text: |-
      In afwijking van het eerste lid kunnen betalingen door anderen dan de in dat lid genoemde functionarissen worden
      verricht voor zover zij contant betalen of gebruik maken van een bankpas of creditcard, onverminderd het bepaalde
      in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.4'
    text: |-
      Betalingen namens het openbaar lichaam, zowel onderling als aan derde partijen, worden uitsluitend verricht via het
      bancaire betalingsverkeer, behoudens het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.5'
    text: |-
      Met de schriftelijke instemming van het College financieel toezicht en onder door hem te stellen voorwaarden kan
      van het vierde lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.6'
    text: |-
      Het bestuurscollege bevordert dat derde partijen hun betalingen aan het openbaar lichaam verrichten ten gunste van
      de betrokken inkomstenrekening van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.7'
    text: |-
      Ontvangen contante gelden en cheques worden op de dag van ontvangst gestort op de inkomstenrekening van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.8'
    text: |-
      Het doen van contante betalingen, het gebruik van bankpassen, creditcards, chippassen en andere elektronische
      betaalwijzen is, zonder voorafgaande schriftelijke instemming van het College financieel toezicht, niet toegestaan.
      In overleg met het bestuurscollege kan het College financieel toezicht voor het gebruik van een creditcard een
      bestedingslimiet vaststellen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.9'
    text: Betalingen namens het openbaar lichaam geschieden tegen voldoende kwijting.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.10'
    text: |-
      Het als geldelijke betaling in ontvangst nemen van niet-geldelijke zaken is niet toegestaan. Met de schriftelijke
      instemming van het College financieel toezicht kan hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.11'
    text: |-
      Het afgeven aan derden en het in ontvangst nemen van derden van geldswaardige papieren in de vorm van aandelen en
      obligaties geschiedt tegen een voldoende kwijting.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '36.12'
    text: |-
      Het verlenen van voorschotten op aan derde partijen te verrichten betalingen geschiedt met inachtneming van door
      het College financieel toezicht na overleg met het bestuurscollege op te stellen regels inzake het verlenen van
      voorschotten.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel36
  - number: '37.1'
    text: |-
      Met ingang van een door het College financieel toezicht te bepalen datum draagt het bestuurscollege, in
      overeenstemming met het College financieel toezicht, er zorg voor:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: 37.1.a
    text: |-
      dat voor het doen van betalingen en het incasseren van inkomsten aparte bankrekeningen zijn geopend bij een of meer
      banken, al naar gelang de doelmatigheid dat vereist;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: 37.1.b
    text: |-
      dat creditsaldi op de bankrekeningen dagelijks aan het eind van de dag worden overgeboekt naar de bankrekening van
      het College financieel toezicht;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: 37.1.c
    text: dat het College financieel toezicht dagelijks afschriften ontvangt van de mutaties op de bankrekeningen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: '37.2'
    text: |-
      Het College financieel toezicht draagt er zorg voor dat debetsaldi op de bankrekeningen dagelijks aan het eind van
      de dag worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: '37.3'
    text: |-
      De mutaties op de in het eerste lid, onder b, bedoelde bankrekening worden door het College financieel toezicht
      voor elk van de openbare lichamen bijgehouden op de rekening-courant, bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel12
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '37.4'
    text: |-
      Het College financieel toezicht vergoedt over creditsaldi op de rekening-courant een creditrente en brengt over
      debetsaldi een debetrente in rekening. Het percentage van de creditrente en van de debetrente zijn aan elkaar
      gelijk en gelijk aan de Euro Overnight Index Average.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: '37.5'
    text: |-
      Bij regeling van Onze Minister van Financiën kunnen nadere regels gesteld worden met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel37
  - number: '38.1'
    text: |-
      De eilandsraad stelt bij eilandsverordening regels vast voor de controle op het financiële beheer en op de
      inrichting van de financiële organisatie. Deze eilandsverordening waarborgt dat de rechtmatigheid van het
      financiële beheer en van de inrichting van de financiële organisatie wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.2'
    text: De eilandsverordening wordt na vaststelling gezonden aan het College financieel toezicht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.3'
    text: |-
      De eilandsraad wijst een of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 28][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het uitbrengen
      van een verslag van bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '28'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '38.4'
    text: 'De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.4.a
    text: |-
      de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en samenstelling van het
      vermogen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.4.b
    text: de baten, lasten en balansmutaties rechtmatig tot stand zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.4.c
    text: |-
      de jaarrekening is opgesteld in overeenstemming met de bij of krachtens algemene maatregel van bestuur te stellen
      regels, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel13
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '2'
  - number: '38.5'
    text: 'Het verslag van bevindingen bevat in ieder geval bevindingen over:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.5.a
    text: |-
      de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken en
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.5.b
    text: onrechtmatigheden in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.6'
    text: |-
      De accountant zendt de accountantsverklaring en het verslag van bevindingen aan de eilandsraad en een afschrift
      daarvan aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.8'
    text: |-
      Accountants als bedoeld in het derde lid kunnen in dienst van het openbaar lichaam worden aangesteld en worden in
      dat geval door de eilandsraad benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '38.9'
    text: |-
      Indien de eilandsraad op grond van het derde lid accountants heeft aangewezen die in dienst van het openbaar
      lichaam zijn aangesteld, is:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: 38.9.a
    text: |-
      het bepaalde bij en krachtens de [artikelen 25][ref1], [25a][ref2] en
      [27 van de Wet toezicht accountantsorganisaties][ref3] van overeenkomstige toepassing op deze accountants;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '27'
  - number: 38.9.b
    text: |-
      het bepaalde bij en krachtens de [artikelen 14][ref1], [18][ref2], [19][ref3], [20][ref4] en
      [21 van de Wet toezicht accountantsorganisaties][ref5] van overeenkomstige toepassing op het openbaar lichaam, en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel21
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0019468
        artikel: '21'
  - number: 38.9.c
    text: |-
      het bepaalde bij en krachtens de [artikelen 15][ref1] en [16 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van het openbaar
      lichaam waarbij de in de aanhef bedoelde accountants werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: '38.10'
    text: |-
      Indien een openbaar lichaam wordt aangewezen als organisatie van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Wet toezicht accountantsorganisaties][ref1], zijn de
      [artikelen 22 tot en met 24 van die wet][ref2] van overeenkomstige toepassing op dit openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '22'
  - number: '38.11'
    text: De gezamenlijke rekenkamer is belast met het toezicht op de naleving van het negende lid.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel38
  - number: '39.1'
    text: |-
      Het bestuurscollege verstrekt Onze Minister en het College financieel toezicht alle inlichtingen die het voor de
      uitoefening van zijn taken nodig acht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel39
  - number: '39.2'
    text: |-
      Het bestuurscollege verleent Onze Minister en het College financieel toezicht dan wel door hen aangewezen
      vertegenwoordigers te allen tijde toegang tot dan wel inzage in alle goederen, administraties, documenten en andere
      informatiedragers.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel39
  - number: '39.3'
    text: |-
      Onze Minister kan aanwijzingen geven over de verstrekking van gegevens door de collectieve sector, niet zijnde een
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel39
  - number: '40'
    text: |-
      De eilandsraad besluit tot het invoeren, wijzigen of afschaffen van een eilandbelasting door het vaststellen van
      een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel40
  - number: '41'
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel41
  - number: '42.1'
    text: |-
      Behalve de eilandbelastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen andere
      eilandbelastingen geheven dan die bedoeld in de tweede en derde paragraaf van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel42
  - number: '42.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de tweede en derde paragraaf van dit hoofdstuk kunnen de
      eilandbelastingen worden geheven naar in de belastingverordening te bepalen heffingsmaatstaven, met dien verstande
      dat het bedrag van een eilandbelasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het
      vermogen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel42
  - number: '43.1'
    text: 'Ter zake van binnen het openbaar lichaam gelegen onroerende zaken kunnen worden geheven:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
  - number: 43.1.a
    text: |-
      onder de naam grondbelasting, een eilandbelasting van degenen die bij het begin van het kalenderjaar het genot
      hebben krachtens eigendom, bezit of beperkt recht van:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
  - number: 43.1.a.1°
    text: |-
      onroerende zaken die als eigen woning worden aangemerkt als bedoeld in
      [artikel 4 van de Wet inkomstenbelasting BES][ref1] en die een in de aanhef bedoelde rechthebbende als
      hoofdverblijf ter beschikking staan;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel4
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '4'
  - number: 43.1.a.2°
    text: |-
      onroerende zaken die tot het vermogen van een onderneming behoren waarmee die onderneming opbrengst als bedoeld in
      [artikel 6 van de Wet inkomstenbelasting BES][ref1] verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel6
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '6'
  - number: 43.1.b
    text: |-
      opcenten op de hoofdsom van de vastgoedbelasting, bedoeld in [artikel 4.1 van de Belastingwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
  - number: '43.2'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onder a, wordt als genothebbende krachtens eigendom, bezit of
      beperkt recht aangemerkt degene die bij het begin van het kalenderjaar als zodanig in de kadastrale registratie is
      vermeld, tenzij blijkt dat op dat tijdstip een ander genothebbende krachtens eigendom, bezit of beperkt recht is.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel43
  - number: '44.1'
    text: De grondbelasting wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: '44.2'
    text: 'Een aanslag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.a
    text: de naam, het adres en de woon- of vestigingsplaats van degene aan wie de aanslag wordt opgelegd;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.b
    text: een aanduiding van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.c
    text: de heffingsmaatstaf;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.d
    text: de waardepeildatum;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.e
    text: het kalenderjaar waarvoor de aanslag geldt, en
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44.2.f
    text: het te betalen belastingbedrag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: '44.3'
    text: Het niet naleven van de voorschriften van het tweede lid brengt geen nietigheid van de aanslag mee.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44
  - number: 44a.1
    text: |-
      Besluiten tot het invoeren, wijzigen of afschaffen van opcenten op de hoofdsom van de vastgoedbelasting treden
      in werking met ingang van 1 januari van enig jaar. Een desbetreffend besluit wordt vóór 30 november van het
      voorafgaande jaar in afschrift ter kennis gebracht van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44a
  - number: 44a.2
    text: |-
      Een in het eerste lid bedoeld besluit heeft geen gevolgen voor de opcenten die zijn betaald over een tijdvak dat
      vóór de datum van inwerkingtreding van dat besluit is aangevangen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel44a
  - number: '45'
    text: 'Voor de toepassing van dit hoofdstuk wordt als één onroerende zaak aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel45
  - number: 45.a
    text: een gebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel45
  - number: 45.b
    text: een ongebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel45
  - number: 45.c
    text: |-
      een gedeelte van een in onderdeel a of onderdeel b bedoeld eigendom dat blijkens zijn indeling is bestemd om als
      een afzonderlijk geheel te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel45
  - number: 45.d
    text: |-
      een samenstel van twee of meer van de in onderdeel a of onderdeel b bedoelde eigendommen of in onderdeel c bedoelde
      gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden beoordeeld,
      bij elkaar behoren.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel45
  - number: '46.1'
    text: |-
      De heffingsmaatstaf voor de grondbelasting is de waarde die aan de onroerende zaak dient te worden toegekend,
      indien de volle en onbezwaarde eigendom daarvan zou kunnen worden overgedragen en de verkrijger de zaak in de staat
      waarin die zich bevindt, onmiddellijk en in volle omvang in gebruik zou kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel46
  - number: '46.2'
    text: |-
      In afwijking in zoverre van het eerste lid wordt de waarde van een onroerende zaak bepaald op de vervangingswaarde
      indien dit leidt tot een hogere waarde dan die ingevolge het eerste lid. Bij de berekening van de vervangingswaarde
      wordt rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel46
  - number: 46.2.a
    text: de aard en de bestemming van de zaak;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel46
  - number: 46.2.b
    text: |-
      de sedert de stichting van de zaak opgetreden technische en functionele veroudering, waarbij de invloed van latere
      wijzigingen in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel46
  - number: '47.1'
    text: |-
      De waarde van de onroerende zaken ter zake waarvan de grondbelasting wordt geheven wordt vastgesteld door de in
      [artikel 67, tweede lid, onderdeel b][ref1], bedoelde eilandambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '47.2'
    text: |-
      De waarde wordt bepaald naar de waarde die de onroerende zaak op de waardepeildatum heeft naar de staat waarin de
      zaak op die datum verkeert.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel47
  - number: '47.3'
    text: De waardepeildatum ligt één jaar voor het begin van het tijdvak waarvoor de waarde wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel47
  - number: '47.4'
    text: De waarde geldt voor een tijdvak van vijf achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel47
  - number: '48'
    text: |-
      Indien een onroerende zaak in het jaar voorafgaand aan het tijdvak of in de loop van het tijdvak wijzigt als gevolg
      van bouw, verbouwing, verbetering, afbraak of vernietiging wordt in afwijking van [artikel 47][ref1] de waarde
      bepaald naar de staat van die zaak bij het begin van het kalenderjaar volgend op dat waarin de genoemde wijziging
      zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel47
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '47'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '49.1'
    text: |-
      In afwijking van [artikel 46][ref1] wordt bij de bepaling van de heffingsmaatstaf voor de grondbelasting buiten
      aanmerking gelaten, de waarde van:


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel46
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '46'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 49.1.a
    text: de delfstoffen in de bodem en de door natuurvorming in of boven de grond aanwezige meststoffen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.b
    text: |-
      onroerende zaken die in hoofdzaak zijn bestemd voor de openbare eredienst met uitzondering van delen van zodanige
      onroerende zaken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.c
    text: |-
      natuurterreinen, waaronder mede worden verstaan duinen, heidevelden, zandverstuivingen, moerassen en plassen, die
      door rechtspersonen met volledige rechtsbevoegdheid welke zich uitsluitend of nagenoeg uitsluitend het behoud van
      natuurschoon ten doel stellen, beheerd worden;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.d
    text: openbare land- en waterwegen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.e
    text: |-
      waterverdedigings- en waterbeheersingswerken die worden beheerd door organen, instellingen of diensten van
      publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.f
    text: |-
      werken die zijn bestemd voor de levering van water, de inzameling en zuivering van riool- en ander afvalwater of
      de levering van elektriciteit en die worden beheerd door organen, instellingen of diensten van publiekrechtelijke
      rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: 49.1.g
    text: |-
      werktuigen die van een onroerende zaak kunnen worden afgescheiden zonder dat beschadiging van betekenis aan die
      werktuigen wordt toegebracht en die niet op zichzelf als gebouwde eigendommen zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel49
  - number: '50.1'
    text: De grondbelasting bedraagt een percentage van de heffingsgrondslag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
  - number: '50.2'
    text: |-
      De opcenten, bedoeld in [artikel 43, eerste lid, onderdeel b][ref1], worden uitgedrukt in een percentage van de
      hoofdsom van de vastgoedbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '50.3'
    text: |-
      Het tarief van de belastingen, bedoeld in [artikel 43, eerste lid][ref1], wordt gelijkelijk vastgesteld voor
      onderscheidenlijk:


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 50.3.a
    text: |-
      de grondbelasting, voor zover het betreft onroerende zaken als bedoeld in
      [artikel 43, eerste lid, onderdeel a, onder 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 50.3.b
    text: |-
      de grondbelasting, voor zover het betreft onroerende zaken als bedoeld in
      [artikel 43, eerste lid, onderdeel a, onder 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 50.3.c
    text: |-
      de opcenten op de vastgoedbelasting. bedoeld in [artikel 43, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '51.1'
    text: |-
      In de belastingverordening kan worden bepaald dat geen grondbelasting wordt geheven indien de heffingsmaatstaf
      blijft beneden een bedrag van USD 12 000 dan wel een in de belastingverordening te bepalen lager bedrag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel51
  - number: '51.2'
    text: |-
      In de belastingverordening kunnen belastingbedragen tot maximaal USD 10 worden opgenomen waarvoor geen invordering
      zal plaatsvinden. Voor de toepassing van de vorige volzin kan in de belastingverordening worden bepaald dat het
      totaal van op één aanslagbiljet verenigde verschuldigde bedragen wordt aangemerkt als één belastingbedrag.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel51
  - number: '52'
    text: |-
      Bij gehele of gedeeltelijke vernieling van gebouwen door onvoorziene rampen wordt op verzoek aan de
      belastingschuldige een vermindering of teruggaaf van grondbelasting verleend naar evenredigheid van het resterende
      deel van het belastingjaar waarop de grondbelasting betrekking heeft en van de vermindering in waarde.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel52
  - number: '53.1'
    text: |-
      Onder de naam toeristenbelasting kan een eilandbelasting worden geheven ter zake van verblijf binnen het
      grondgebied van het openbaar lichaam door niet-ingezetenen van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: '53.2'
    text: |-
      Voor zover een eilandbelasting wordt geheven van degene die gelegenheid tot verblijf biedt is deze bevoegd de
      belasting als zodanig te verhalen op degene ter zake van wiens verblijf de belasting verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: '53.3'
    text: 'Voor de toepassing van dit artikel wordt als degene die gelegenheid tot verblijf biedt in ieder geval aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: 53.3.a
    text: |-
      de eigenaar van een onroerende zaak waar een niet-ingezetene verblijft, indien deze onroerende zaak door de
      eigenaar zelf wordt geëxploiteerd,
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: 53.3.b
    text: de exploitant van een onroerende zaak waar een niet-ingezetene verblijft,
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: 53.3.c
    text: |-
      de schipper of gezagvoerder die een vaartuig onder zijn verantwoordelijkheid heeft of de beheerder of gebruiker van
      het vaartuig.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel53
  - number: '54.1'
    text: |-
      Onder de naam verhuurbelasting motorrijtuigen kan ter zake van de verhuur van een motorrijtuig op twee of meer
      wielen een eilandbelasting worden geheven van degene, die als verhuurder de huurovereenkomst ter zake van dat
      motorrijtuig sluit.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel54
  - number: '54.2'
    text: De belasting kan als zodanig verhaald worden op degene die het motorrijtuig huurt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel54
  - number: '55.1'
    text: |-
      Ter zake van het houden van een motorrijtuig kan onder de naam motorrijtuigenbelasting een belasting worden geheven
      van degene die bij aanvang van een tijdvak het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: '55.2'
    text: |-
      Onder motorrijtuig wordt verstaan een personenauto, motorrijwiel, autobus, vrachtauto of bestelauto, die naar zijn
      aard voor gebruik op de openbare weg is bestemd en overeenkomstig deze bestemming binnen of op het grondgebied van
      het openbaar lichaam wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: '55.3'
    text: Het tarief van de motorrijtuigenbelasting kan afhankelijk worden gesteld van
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: 55.3.a
    text: de massa van het motorrijtuig,
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: 55.3.b
    text: de aard van de brandstof van het motorrijtuig,
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: 55.3.c
    text: de aard van de aandrijving van het motorrijtuig, alsmede
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: 55.3.d
    text: het soort motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: '55.4'
    text: |-
      Het in het eerste lid bedoelde tijdvak is een kalenderjaar dan wel, indien het houderschap in de loop van een
      kalenderjaar aanvangt, het aantal nog in dat kalenderjaar resterende gehele of gedeeltelijke kalenderkwartalen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel55
  - number: '56.1'
    text: 'In het kader van de parkeerregulering kunnen de volgende belastingen worden geheven:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: 56.1.a
    text: |-
      een belasting ter zake van het parkeren van een voertuig op een bijde belastingverordening dan wel krachtens de
      belastingverordening in de daarin aangewezen gevallen door het bestuurscollege te bepalen plaats, tijdstip en
      wijze;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: 56.1.b
    text: |-
      een belasting ter zake van een vanwege het openbaar lichaam verleende vergunning voor het parkeren van een voertuig
      op de in die vergunning aangegeven plaats en wijze.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder parkeren verstaan het gedurende een aaneengesloten periode
      doen of laten staan van een voertuig, anders dan gedurende de tijd die nodig is voor en gebruikt wordt tot het
      onmiddellijk in- en uitstappen van personen dan wel het onmiddellijk laden of lossen van zaken, op de binnen het
      openbaar lichaam gelegen voor het openbaar verkeer openstaande terreinen of weggedeelten, waarop dit doen of laten
      staan niet ingevolge een wettelijk voorschrift is verboden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.3'
    text: De belasting, bedoeld in het eerste lid, onderdeel a, wordt geheven van degene die het voertuig heeft geparkeerd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.4'
    text: |-
      Als degene die het voertuig heeft geparkeerd wordt mede aangemerkt degene die de belasting voldoet dan wel te
      kennen geeft of heeft gegeven de belasting te willen voldoen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.5'
    text: |-
      Zolang geen voldoening van de in het eerste lid, onderdeel a, bedoelde belasting heeft plaatsgevonden wordt
      de houder van het voertuig aangemerkt als degene die het voertuig heeft geparkeerd. Met betrekking tot een
      motorrijtuig ter zake waarvan motorrijtuigenbelasting als bedoeld in [artikel 55][ref1] wordt geheven wordt als
      houder aangemerkt degene die ter zake van dat motorrijtuig belastingplichtig is voor de motorrijtuigenbelasting.
      De tweede volzin vindt geen toepassing indien een voor ten hoogste drie maanden aangegane huurovereenkomst wordt
      overgelegd waaruit blijkt wie ten tijde van het parkeren ingevolge deze overeenkomst de huurder van het voertuig
      was, in welk geval de huurder wordt aangemerkt als degene die het voertuig heeft geparkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel55
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '55'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '56.6'
    text: |-
      De belasting wordt niet geheven van degene die ingevolge het vijfde lid is aangemerkt als degene die het voertuig
      heeft geparkeerd, indien deze aannemelijk maakt dat ten tijde van het parkeren een ander tegen zijn wil van het
      voertuig gebruik heeft gemaakt en dat hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.7'
    text: De belasting, bedoeld in het eerste lid, onderdeel b, wordt geheven van degene die de vergunning heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '56.8'
    text: |-
      Het tarief van de in het eerste lid bedoelde belastingen kan afhankelijk worden gesteld van de parkeerduur, van de
      parkeertijd, van de ingenomen oppervlakte en van de ligging van de terreinen of weggedeelten.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel56
  - number: '57'
    text: |-
      Onder de naam afvalstoffenheffing kan ter bestrijding van de kosten die voor het openbaar lichaam verbonden
      zijn aan het beheer van afvalstoffen een belasting worden geheven van degenen die, al dan niet krachtens
      een zakelijk of persoonlijk recht, feitelijk gebruik maken van een perceel ten aanzien waarvan krachtens
      [artikel 4.7, derde lid, onderdeel a, van de Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref1]
      een verplichting geldt tot het inzamelen van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
  - number: 57a
    text: |-
      Onder de naam rioolheffing kan ter bestrijding van de kosten die voor het openbaar lichaam verbonden
      zijn aan het beheer van afvalwater een belasting worden geheven van degenen die, al dan niet krachtens
      een zakelijk of persoonlijk recht, feitelijk gebruik maken van een perceel ten aanzien waarvan krachtens
      [artikel 4.25 van de Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref1] een verplichting geldt
      tot het inzamelen van huishoudelijk afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
  - number: '58.1'
    text: Ter zake van het houden van een hond kan van de houder een hondenbelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel58
  - number: '58.2'
    text: De belasting wordt geheven naar het aantal honden dat wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel58
  - number: '58.3'
    text: |-
      Voor de toepassing van het eerste lid wordt het houden van een hond door een lid van een huishouden aangemerkt als
      het houden van een hond door een door de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van het
      openbaar lichaam aan te wijzen lid van dat huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '59'
    text: Ter zake van openbare aankondigingen zichtbaar vanaf de openbare weg kan een reclamebelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel59
  - number: '60'
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde grond van het openbaar
      lichaam kan een precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel60
  - number: '61'
    text: |-
      Onder de naam havenbelasting kan een belasting worden geheven ter zake van degene, die als schipper of gezagvoerder
      het vaartuig onder zijn verantwoordelijkheid heeft, of van de beheerder of gebruiker van het vaartuig ter zake van:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel61
  - number: 61.a
    text: |-
      het liggen of meren van vaartuigen in havens of aan kaden en terreinen, welke bij het openbaar lichaam in eigendom
      of in beheer en onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel61
  - number: 61.b
    text: |-
      het ankeren in de territoriale wateren, bedoeld in de
      [Rijkswet uitbreiding territoriale zee van het Koninkrijk][ref1] voor zover deze wateren grenzen aan het openbaar
      lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003749
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003749
  - number: '62.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel62
  - number: 62.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde bezittingen van het openbaar lichaam
      of van voor de openbare dienst bestemde werken of inrichtingen die bij het openbaar lichaam in beheer of in
      onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel62
  - number: 62.1.b
    text: het genot van door of vanwege het openbaar lichaam verstrekte diensten.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel62
  - number: '62.2'
    text: Voor de toepassing van dit hoofdstuk worden de in het eerste lid bedoelde rechten aangemerkt als eilandbelastingen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel62
  - number: '63'
    text: |-
      De rechten, bedoeld in [artikel 62][ref1], kunnen worden geheven door het openbaar lichaam dat het gebruik van de
      bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare feit zich binnen
      of buiten het grondgebied van het openbaar lichaam voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel62
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '64.1'
    text: |-
      In belastingverordeningen op grond waarvan rechten als bedoeld in [artikel 62][ref1] worden geheven, worden de
      tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel62
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '62'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '64.2'
    text: |-
      Onder de in het eerste lid bedoelde lasten worden mede verstaan bijdragen aan bestemmingsreserves en voorzieningen
      voor noodzakelijke vervanging van de betrokken activa.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel64
  - number: '65'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de eilandbelastingen, bedoeld in de tweede en derde
      paragraaf van dit hoofdstuk, nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel65
  - number: '66'
    text: |-
      In deze paragraaf wordt verstaan onder heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of
      bij wege van voldoening op aangifte.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel66
  - number: '67.1'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van
      eilandbelastingen, andere dan die bedoeld in [artikel 43, eerste lid, onderdeel b][ref1], met toepassing van de
      [hoofdstukken I][ref2] en [VIII van de Belastingwet BES][ref3] als waren die belastingen BES belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '67.2'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen van de hierna
      vermelde, in de [Belastingwet BES][ref1] genoemde functionarissen, met betrekking tot de eilandbelastingen voor de
      daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: 67.2.a
    text: 'Onze Minister van Financiën en de directeur: het bestuurscollege;'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
  - number: 67.2.b
    text: 'de inspecteur: de eilandambtenaar, belast met de heffing van eilandbelastingen;'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
  - number: 67.2.c
    text: |-
      de ontvanger of een inzake BES belastingen bevoegde ontvanger: de eilandambtenaar belast met de invordering van
      eilandbelastingen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
  - number: 67.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de eilandambtenaren belast met de heffing of de invordering van
      eilandbelastingen;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
  - number: 67.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen eilandambtenaar.'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
  - number: '67.3'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot eilandbelastingen in de
      [Belastingwet BES][ref1] voor «algemene maatregel van bestuur» en voor «ministeriële regeling» ge lezen: besluit
      van het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: '67.4'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot eilandbelastingen in
      de [Belastingwet BES][ref1] onder «belastingwet» mede verstaan: een belastingverordening, bedoeld in
      [artikel 40][ref2], en de daarop berustende bepalingen, alsmede andere algemeen verbindende voorschriften of
      besluiten van algemene strekking met betrekking tot de in [paragraaf 1][ref3] bedoelde eilandbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0028151#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0029244
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '40'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028151
        hoofdstuk: IV
        paragraaf: '1'
  - number: '68.1'
    text: |-
      Het bestuurscollege kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      [artikel 8.2, eerste lid, van de Belastingwet BES][ref1] voor de in [artikel 67, tweede lid, onderdeel c][ref2],
      bedoelde ambtenaar een andere eilandambtenaar in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '68.2'
    text: |-
      De colleges van twee of meer openbare lichamen kunnen met betrekking tot een of meer eilandbelastingen bepalen dat
      ambtenaren van een van die openbare lichamen worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
  - number: 68.2.a
    text: |-
      de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van die openbare lichamen voor de uitvoering
      van enige wettelijke bepaling betreffende de heffing van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.2.b
    text: |-
      de in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van die openbare lichamen voor de uitvoering
      van enige wettelijke bepaling betreffende de invordering van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.2.c
    text: |-
      de in [artikel 67, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van die openbare lichamen voor de uitvoering
      van enige wettelijke bepaling betreffende de heffing of de invordering van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.2.d
    text: |-
      de in [artikel 67, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van die openbare lichamen, voor de uitvoering
      van enige wettelijke bepaling betreffende de invordering van eilandbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '68.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het bestuurscollege van het openbaar lichaam
      waarvan de ambtenaar, belast met de invordering van eilandbelastingen op grond van het tweede lid, onderdeel b,
      wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
  - number: '68.4'
    text: |-
      Indien voor de heffing of de invordering van eilandbelastingen een gemeenschappelijke regeling is getroffen en bij
      die regeling een openbaar lichaam is ingesteld, kan bij of krachtens die regeling worden bepaald dat een daartoe
      aangewezen ambtenaar van dat openbare lichaam wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
  - number: 68.4.a
    text: |-
      de in [artikel 67, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van het openbaar lichaam dat de
      desbetreffende taken heeft overgedragen, voor de uitvoering van enige wettelijke bepaling betreffende de heffing
      van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.4.b
    text: |-
      de in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van het openbaar lichaam dat de
      desbetreffende taken heeft overgedragen, voor de uitvoering van enige wettelijke bepaling betreffende de
      invordering van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.4.c
    text: |-
      de in [artikel 67, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van het openbaar lichaam dat de
      desbetreffende taken heeft overgedragen, voor de uitvoering van enige wettelijke bepaling betreffende de heffing of
      de invordering van eilandbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 68.4.d
    text: |-
      de in [artikel 67, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van het openbaar lichaam dat de
      desbetreffende taken heeft overgedragen, voor de uitvoering van enige wettelijke bepaling betreffende de
      invordering van eilandbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '68.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      dat is ingesteld op grond van de [Wet gemeenschappelijke regelingen][ref1] waarvan een ambtenaar op grond van het
      vierde lid, onderdeel b, wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '69'
    text: |-
      Eilandbelastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op andere
      wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel69
  - number: '70.1'
    text: |-
      Indien de eilandbelastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke wijze
      deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan bepalen dat het bestuurscollege omtrent de uitvoering van een en ander nadere regels
      geeft.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel70
  - number: '70.2'
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Belastingwet BES][ref1] aangemerkt als bij
      wege van aanslag geheven belastingen, met dien verstande dat wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: 70.2.a
    text: |-
      *de aanslag, de voorlopige aanslag en de navorderingsaanslag:* het gevorderde, het voorlopig gevorderde,
      onderscheidenlijk het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel70
  - number: 70.2.b
    text: '*het aanslagbiljet:* de kennisgeving van het in onderdeel a bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel70
  - number: 70.2.c
    text: |-
      *de dagtekening van het aanslagbiljet:* de dagtekening van de schriftelijke kennisgeving van het in onderdeel a
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel70
  - number: '71.1'
    text: |-
      De belasting, bedoeld in [artikel 56, eerste lid, onder a][ref1], wordt geheven bij wege van voldoening op aangifte
      dan wel op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel56
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '56'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '71.2'
    text: |-
      Als voldoening op aangifte wordt uitsluitend aangemerkt het bij de aanvang van het parkeren in werking stellen
      van een parkeermeter of een parkeerautomaat op de daartoe bestemde wijze en met inachtneming van de door het
      bestuurscollege gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '71.3'
    text: |-
      In afwijking van [artikel 8.92, eerste lid, van de Belastingwet BES][ref1] kan geen bezwaarschrift worden ingediend
      inzake het bedrag dat overeenkomstig het tweede lid, onderdeel a, op aangifte is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '71.4'
    text: |-
      Ingeval een naheffingsaanslag wordt opgelegd, wordt deze berekend over een parkeerduur van een uur, tenzij
      aannemelijk is dat het voertuig langer dan een uur zonder betaling geparkeerd heeft gestaan.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '71.5'
    text: |-
      De [artikelen 8.22, tweede en derde lid][ref1], [8.23][ref2] en [8.26 van de Belastingwet BES][ref3] blijven buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '71.6'
    text: |-
      Ter zake van het opleggen van een naheffingsaanslag worden kosten in rekening gebracht. Deze kosten maken onderdeel
      uit van de naheffingsaanslag en worden afzonderlijk op het aanslagbiljet vermeld. Ten aanzien van hetzelfde
      voertuig worden per aaneengesloten periode de kosten niet vaker dan eenmaal per kalenderdag in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '71.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot de wijze van berekening en de
      maximale hoogte van de in het zesde lid bedoelde kosten. In de belastingverordening wordt het bedrag van de in
      rekening te brengen kosten bepaald.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '71.8'
    text: |-
      Indien het niet mogelijk is het aanslagbiljet terstond aan de belastingschuldige uit te reiken, kan worden volstaan
      met het aanbrengen van het aanslagbiljet op of aan het voertuig. Alsdan vermeldt het aanslagbiljet niet de naam van
      de belastingschuldige maar het kenteken van het voertuig. Bij gebreke van een kenteken vermeldt het aanslagbiljet
      een of meer gegevens die kenmerkend zijn voor het geparkeerde voertuig.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '71.9'
    text: De naheffingsaanslag is dadelijk en ineens invorderbaar.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel71
  - number: '72.1'
    text: |-
      Na afloop van een in de belastingverordening te bepalen termijn, die ten minste 24 uren bedraagt
      nadat het aanslagbiljet aan de belastingschuldige is uitgereikt dan wel nadat het aanslagbiljet,
      overeenkomstig [artikel 71, achtste lid][ref1], aan het voertuig is aangebracht, is de in
      [artikel 67, tweede lid, onderdeel c][ref2], bedoelde eilandambtenaar bevoegd het voertuig naar een door hem
      aangewezen plaats te doen overbrengen en in bewaring te doen stellen. Ter zake van de in de eerste volzin bedoelde
      overbrenging en bewaring wordt procesverbaal opgemaakt en worden kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '71'
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.2'
    text: |-
      De in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar draagt er zorg voor dat in een daartoe
      aangelegd register aantekening wordt gemaakt van de gevallen waarin de in het eerste lid bedoelde bevoegdheid wordt
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.3'
    text: |-
      De in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar draagt zorg voor de bewaring van de
      ingevolge het eerste lid in bewaring gestelde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.4'
    text: |-
      De in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar geeft het voertuig terug aan de
      rechthebbende, nadat de naheffingsaanslag, en de kosten van overbrenging en bewaring zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.5'
    text: |-
      Wanneer het voertuig binnen 48 uren na het in bewaring stellen niet is afgehaald, geeft de in
      [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar zo mogelijk binnen zeven dagen van de
      overbrenging en bewaring kennis:


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 72.5.a
    text: |-
      indien het voertuig een motorrijtuig is ter zake waarvan motorrijtuigenbelasting wordt geheven, aan degene die ter
      zake van dat motorrijtuig belastingplichtig is voor de motorrijtuigenbelasting;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: 72.5.b
    text: |-
      indien blijkt dat ter zake van het voertuig aangifte van vermissing is gedaan, aan degene die aangifte heeft
      gedaan;
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: 72.5.c
    text: in nader door Onze Minister te bepalen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '72.6'
    text: |-
      De kosten van opsporing van degene aan wie de kennisgeving wordt gezonden en die van het doen van de kennisgeving
      worden voor de toepassing van dit artikel gerekend tot de kosten van overbrenging en bewaring.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '72.7'
    text: |-
      Wanneer het voertuig binnen drie maanden na het in bewaring stellen niet is afgehaald, is de in
      [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar bevoegd het te verkopen of, indien verkoop
      naar hun oordeel niet mogelijk is, het voertuig om niet aan een derde in eigendom over te dragen of te laten
      vernietigen. Gelijke bevoegdheid heeft de in artikel 67, tweede lid, onderdeel c, bedoelde eilandambtenaar
      ook binnen die termijn, zodra het gezamenlijke bedrag van de naheffingsaanslag en de kosten van overbrenging
      en bewaring, vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde
      kosten, in verhouding tot de waarde van het voertuig naar zijn mening onevenredig hoog zou worden. Verkoop,
      eigendomsoverdracht om niet of vernietiging vindt niet plaats binnen twee weken nadat de kennisgeving als
      bedoeld in het vijfde lid is uitgegaan. Voor de toepassing van de volgende leden worden de kosten van verkoop,
      eigendomsoverdracht om niet of vernietiging gerekend tot de kosten van overbrenging en bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.8'
    text: |-
      Gedurende drie jaren na het tijdstip van de verkoop heeft degene, die op dat tijdstip eigenaar was, recht op de
      opbrengst van het voertuig, met dien verstande dat eerst de kosten van het bewaren van het voertuig en vervolgens
      de naheffingsaanslag met die opbrengst worden verrekend. Na het verstrijken van die termijn vervalt het eventueel
      batige saldo aan het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '72.9'
    text: |-
      In de belastingverordening wordt bepaald tot welke bedragen de kosten van het overbrengen en bewaren van het
      voertuig in rekening worden gebracht. Bij algemene maatregel van bestuur kunnen regels gesteld worden met
      betrekking tot de wijze van berekening van die kosten.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '72.10'
    text: |-
      De in [artikel 67, tweede lid, onderdeel c][ref1], bedoelde eilandambtenaar stelt het bedrag van de in rekening te
      brengen kosten vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel67
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '67'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '72.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden omtrent de overbrenging, bewaring,
      verkoop, eigendomsoverdracht om niet en vernietiging, het inrichten en aanhouden van het in het tweede lid bedoelde
      register, alsmede omtrent hetgeen verder voor de uitvoering van dit artikel wenselijk is.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '72.12'
    text: |-
      Indien aantoonbaar is dat tijdens de overbrenging en bewaring schade aan het voertuig is toegebracht, is het
      openbaar lichaam gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028151/2021-07-01#Artikel72
  - number: '73.1'
    text: |-
      Bij de heffing en invordering van eilandbelastingen blijven de [artikelen 8.1][ref1],
      [8.4, eerste en tweede lid][ref2], [8.5, tweede lid][ref3], [8.11, eerste, vierde en vijfde lid][ref4],
      [8.43][ref5], [8.55][ref6], [8.77, tweede lid][ref7], [8.79, tweede en derde lid][ref8],
      [8.80, tweede tot en met vierde lid][ref9], [8.81][ref10], [8.83, tweede tot en met vijfde lid][ref11],
      [8.86][ref12], [8.87][ref13], [8.91][ref14] en [8.120 tot en met 8.129 van de Belastingwet BES][ref15] buiten
      toepassing. Bij de heffing van eilandbelastingen die op andere wijze worden geheven, blijven bovendien de
      [artikelen 8.2, eerste lid][ref16], [8.3][ref17], [8.7, eerste lid][ref18], en [8.9 van die wet][ref19] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0029244#Artikel8
