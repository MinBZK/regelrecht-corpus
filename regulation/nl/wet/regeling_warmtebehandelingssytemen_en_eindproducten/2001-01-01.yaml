---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_warmtebehandelingssytemen_en_eindproducten
regulatory_layer: WET
publication_date: '2003-09-05'
valid_from: '2001-01-01'
bwb_id: BWBR0008612
url: https://wetten.overheid.nl/BWBR0008612/2001-01-01
preamble:
  text: |-
    Gelet op de artikelen 18, tweede lid, en 28, eerste lid, van het Destructiebesluit 1996;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder ’toezichthoudende ambtenaar’: een met toepassing van
      [artikel 24 van de Destructiewet][ref1] aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel24
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '24'
  - number: '2'
    text: |-
      Hoog-risico-materiaal en laag-risico-materiaal van zoogdieren wordt zodanig verwarmd dat de deeltjes gedurende
      minimaal 20 minuten een inwendige temperatuur van ten minste 133° C hebben bij een druk van 3 bar en wordt verwerkt
      in een continu- of batchsysteem. Alvorens de warmtebehandeling wordt toegepast, wordt de deeltjesgrootte van het
      materiaal teruggebracht tot ten hoogste 50 mm.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2
  - number: 2a
    text: |-
      [Artikel 2][ref1] is niet van toepassing op bloed en op het volgende laag-risico-materiaal:


      [ref1]: https://wetten.overheid.nl/BWBR0008612#Artikel2
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008612
        artikel: '2'
  - number: 2a.a)
    text: laag-risico-materiaal dat wordt gebruikt voor de bereiding van voeder voor gezelschapsdieren;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.b)
    text: |-
      laag-risico-materiaal bestemd voor voederen van dieren, waarvan de eigenaar of houder, dan wel een bedrijf dat
      voeder voor edelpelsdieren bereidt, op grond van [artikel 13, vierde lid, van de Destructiewet][ref1] van de
      Minister van Volksgezondheid, Welzijn en Sport een daartoe strekkende ontheffing heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel13
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '13'
  - number: 2a.c)
    text: ontvette beenderen voor de vervaardiging van gelatine;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.d)
    text: huiden en vellen voor de vervaardiging van gelatine, collageen en gehydrolyseerd eiwit, hoeven, hoorns en haar;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.e)
    text: klieren, weefsel en organen voor de bereiding van farmaceutische producten;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.f)
    text: bloedproducten;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.g)
    text: melk- en zuivelproducten;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.h)
    text: |-
      dierlijke afvallen van niet-herkauwers voor de vervaardiging van gesmolten vet, met uitzondering van bij die
      vervaardiging verkregen kanen;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.i)
    text: |-
      laag-risico-materiaal van herkauwers voor de vervaardiging van gesmolten vet, met uitzondering van bij die
      vervaardiging verkregen kanen;
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2a.j)
    text: |-
      dierlijke afvallen voor de vervaardiging van producten ten aanzien waarvan kan worden gegarandeerd dat zij niet in
      de voedselketen voor mens of dier zullen komen en dat zij evenmin als meststoffen zullen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Het uit hoog-risico-materiaal en uit laag-risico-materiaal van herkauwers gesmolten vet, wordt zodanig gezuiverd
      dat het maximumgehalte aan nog resterende onoplosbare onzuiverheden niet meer dan 0,15 gewichtspercent bedraagt.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2b
  - number: 2b.2
    text: |-
      Het eerste lid en [artikel 2][ref1] zijn niet van toepassing op het uit hoog-risico-materiaal en uit laag-risico-
      materiaal van herkauwers gesmolten vet, voor zover dat vet wordt verwerkt met een methode die ten minste voldoet
      aan de criteria van één van de in bijlage II van beschikking nr. 99/534/EG van de Raad van de Europese Unie van 19
      juli 1999, betreffende op de verwerking van bepaalde dierlijke afvallen toepasselijke maatregelen ter bescherming
      tegen overdraagbare spongiforme encefalopathieën en tot wijziging van beschikking 97/735/EG van de Commissie van
      de Europese Gemeenschappen (PbEG L 204) beschreven procédés, of kan worden gegarandeerd dat het vet niet in de
      voedselketen voor mens of dier komt.


      [ref1]: https://wetten.overheid.nl/BWBR0008612#Artikel2
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0008612
        artikel: '2'
  - number: '3.1'
    text: |-
      Monsters van de eindproducten van hoog-risico-materiaal die onmiddellijk na de warmtebehandeling van dat materiaal
      worden genomen, zijn vrij van hittebestendige ziekteverwekkende sporen van bacteriën.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel3
  - number: '3.2'
    text: |-
      Monsters van de eindproducten die zijn verkregen door de verwerking van destructiemateriaal in een bedrijf, die
      worden genomen tijdens of na afloop van de opslag in het bedrijf, voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel3
  - number: 3.2.a
    text: 'salmonella: afwezig in 25g, n=5, c=0, m=o, M=o;'
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel3
  - number: 3.2.b
    text: 'enterobacteriaceae: n=5, c=2, m=10, M=3x102/g.'
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de toepassing van het tweede lid wordt verstaan onder:

              a
               n:

                het aantal deelmonsters waaruit een monster bestaat;



              b
               m:

                de drempelwaarde voor het aantal bacteriën;



              c
              M:

                de maximumwaarde voor het aantal bacteriën;



              d
               c:

                het aantal deelmonsters waarvoor de bacterietelling een resultaat tussen m en M te zien geeft.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel3
  - number: '4.1'
    text: |-
      De minister draagt ervoor zorg dat de analyses en de tests die de toezichthoudende ambtenaren doen uitvoeren naar
      aanleiding van monsters, genomen tijdens door hen verrichte periodieke inspecties of tijdens door hen verrichte,
      op aselecte steekproeven gebaseerde, periodieke controles in bedrijven geschieden volgens ter zake internationaal
      erkende methoden.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel4
  - number: '4.2'
    text: |-
      De toezichthoudende ambtenaren bewaren de geregistreerde gegevens van de bedrijven betreffende de behandelingsduur,
      de temperatuur, de druk en deeltjesgrootte gedurende ten minste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel4
  - number: '5.1'
    text: |-
      De beheerder van een bedrijf neemt representatieve monsters van iedere verwerkte partij ten einde te kunnen nagaan
      of aan [artikel 3][ref1] is voldaan en of er geen fysisch-chemische residuen in het eindproduct aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008612#Artikel3
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008612
        artikel: '3'
  - number: '5.2'
    text: |-
      De beheerder maakt aantekening van de door hem uitgevoerde controles op de eindproducten en bewaart de
      aantekeningen gedurende ten minste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel5
  - number: '5.3'
    text: |-
      Hij zet een systeem op dat het mogelijk maakt een verband te leggen tussen een partij eindproducten die het bedrijf
      verlaat en het tijdstip waarop die partij is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien uit een monsterneming als bedoeld in [artikel 5, eerste lid][ref1], blijkt dat niet is voldaan aan
      [artikel 3][ref2], stelt de beheerder de toezichthoudende ambtenaar daarvan onmiddellijk in kennis. De beheerder
      draagt ervoor zorg dat de vermoedelijk besmette partijen eindproducten het bedrijf niet verlaten zonder dat ten
      genoegen van de toezicht houdende ambtenaar is aangetoond dat wel is voldaan aan [artikel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008612#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008612#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008612#Artikel3
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008612
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008612
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008612
        artikel: '3'
  - number: '6.2'
    text: |-
      Indien uit een monster, genomen door de toezichthoudende ambtenaar, blijkt dat niet is voldaan aan
      [artikel 3][ref1], verstrekt de beheerder, desgevraagd, aan de toezichthoudende ambtenaar informatie over de
      aard van het behandelde materiaal waarvan het monster is genomen of de partij waartoe het bemonsterde eindproduct
      behoort. De tweede volzin van het eerste lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008612#Artikel3
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008612
        artikel: '3'
  - number: '6.3'
    text: |-
      Partijen eindproducten als bedoeld in het eerste lid die niet meer kunnen worden verwerkt, worden niet gebruikt
      als diervoeder.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling warmtebehandelingssytemen en eindproducten.'
    url: https://wetten.overheid.nl/BWBR0008612/2001-01-01#Artikel8
