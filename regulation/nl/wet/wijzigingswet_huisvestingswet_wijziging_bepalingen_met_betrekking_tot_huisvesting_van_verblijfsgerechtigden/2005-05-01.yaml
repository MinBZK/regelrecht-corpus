preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Huisvestingswet zodanig te wijzigen dat de
    huisvesting van verblijfsgerechtigden voortvarender ter hand kan worden genomen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018067/2005-05-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Het in [artikel 60f, eerste lid, van de Huisvestingswet][ref1], zoals [die wet][ref2] luidt na de inwerkingtreding
      van deze wet, bedoelde verslag wordt voor de eerste maal opgesteld nadat sedert het tijdstip van inwerkingtreding
      van deze wet een geheel kalenderhalfjaar is verstreken. Over het daaraan voorafgaande kalenderhalfjaar
      wordt verslag uitgebracht op de wijze als is aangegeven in [artikel 60f van de Huisvestingswet][ref3], zoals
      [die wet][ref4] laatstelijk luidde voor de inwerkingtreding van deze wet.


