preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de algehele herziening van het adviesstelsel aanleiding geeft
    de taak, samenstelling en werkwijze van een aantal bestuursorganen op het terrein van de volksgezondheid te
    wijzigen en dat het derhalve wenselijk is daartoe de Ziekenfondswet, de Wet tarieven gezondheidszorg en deWet
    ziekenhuisvoorzieningen alsmede enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010370/2001-08-31#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      1 De Ziekenfondsraad, bedoeld in [artikel 50 van de Ziekenfondswet][ref1], zoals die wet luidde onmiddellijk
      voor het tijdstip van inwerkingtreding van deze wet, wordt als rechtspersoon gehandhaafd en is het College voor
      zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref2], zoals deze door de inwerkingtreding van deze wet is komen
      te luiden.

      Besluiten krachtens delegatie genomen door een orgaan van de Ziekenfondsraad worden na inwerkingtreding van deze
      wet toegerekend aan het bevoegde orgaan van het College.

      2 Het Centraal orgaan tarieven gezondheidszorg, bedoeld in [artikel 18 van de Wet tarieven gezondheidszorg][ref3],
      zoals die wet luidde onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, wordt als rechtspersoon
      gehandhaafd en is het College tarieven gezondheidszorg, bedoeld in de [Wet tarieven gezondheidszorg][ref4], zoals
      deze door de inwerkingtreding van deze wet is komen te luiden.

      3 Het College voor ziekenhuisvoorzieningen, bedoeld in [artikel 2 van de Wet ziekenhuisvoorzieningen][ref5],
      zoals die wet luidde onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, wordt als rechtspersoon
      gehandhaafd en is het College bouw ziekenhuisvoorzieningen, bedoeld in de [Wet ziekenhuisvoorzieningen][ref6],
      zoals deze door de inwerkingtreding van deze wet is komen te luiden.

      4 De Commissie sanering ziekenhuisvoorzieningen, bedoeld in [artikel 18b van de Wet ziekenhuisvoorzieningen][ref7],
      zoals die wet luidde onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, is het College sanering
      ziekenhuisvoorzieningen, bedoeld in de [Wet ziekenhuisvoorzieningen][ref8], zoals deze door de inwerkingtreding van
      deze wet is komen te luiden.


