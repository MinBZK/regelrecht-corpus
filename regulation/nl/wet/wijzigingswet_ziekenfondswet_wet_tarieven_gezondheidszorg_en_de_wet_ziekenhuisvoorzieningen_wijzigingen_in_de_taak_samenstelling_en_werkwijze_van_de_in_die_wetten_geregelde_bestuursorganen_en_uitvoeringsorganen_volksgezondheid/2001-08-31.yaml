  - number: XVIII
    text: |-
      1 Een vergunning als bedoeld in [artikel 6 van de Wet ziekenhuisvoorzieningen][ref1], zoals die wet luidde
      onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, afgegeven door Onze Minister wordt gelijkgesteld
      met een vergunning afgegeven door het College bouw ziekenhuisvoorzieningen.

      2 Een goedkeuring van het programma van eisen of van het schetsontwerp als bedoeld in
      [artikel 7 van de Wet ziekenhuisvoorzieningen][ref2], zoals die wet luidde onmiddellijk voor het tijdstip van
      inwerkingtreding van deze wet, afgegeven door Onze Minister wordt gelijkgesteld met zodanige goedkeuring afgegeven
      door het College bouw ziekenhuisvoorzieningen.

      3 De bouwmaatstaven, door Onze Minister vastgesteld op grond van
      [artikel 15, vierde lid, van de Wet ziekenhuisvoorzieningen][ref3], zoals die wet luidde onmiddellijk voor het
      tijdstip van inwerkingtreding van deze wet, worden gelijkgesteld met door Onze Minister goedgekeurde bouwmaatstaven
      op grond van [artikel 15a van de Wet ziekenhuisvoorzieningen][ref4], zoals deze door de inwerkingtreding van deze
      wet is komen te luiden.


