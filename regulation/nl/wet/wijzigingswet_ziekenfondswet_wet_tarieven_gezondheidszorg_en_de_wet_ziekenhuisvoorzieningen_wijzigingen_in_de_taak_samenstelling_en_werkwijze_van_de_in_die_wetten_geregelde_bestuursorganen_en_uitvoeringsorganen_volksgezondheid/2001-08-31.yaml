  - number: XX
    text: |-
      1 De vaststelling door het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1], van een
      bestuursreglement als bedoeld in [artikel 1c][ref2] onderscheidenlijk een werkprogramma als bedoeld in
      [artikel 1e][ref3] en een begroting als bedoeld in [artikel 1f van die wet][ref4], vindt plaats zo spoedig mogelijk
      onderscheidenlijk vindt voor het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in het
      Staatsblad is geplaatst.

      2 De vaststelling door het College tarieven gezondheidszorg, bedoeld in de [Wet tarieven gezondheidszorg][ref5],
      van een bestuursreglement als bedoeld in [artikel 20][ref6] onderscheidenlijk een werkprogramma als bedoeld in
      [artikel 22][ref7] en een begroting als bedoeld in [artikel 23 van die wet][ref8], vindt plaats zo spoedig mogelijk
      onderscheidenlijk vindt voor het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in het
      Staatsblad is geplaatst.

      3 De vaststelling door het College bouw ziekenhuisvoorzieningen en het College sanering ziekenhuisvoorzieningen,
      bedoeld in de [Wet ziekenhuisvoorzieningen][ref9], van een bestuursreglement als bedoeld in [artikel 2b][ref10]
      onderscheidenlijk een werkprogramma als bedoeld in [artikel 2d][ref11] en een begroting als bedoeld in
      [artikel 2f van die wet][ref12], vindt plaats zo spoedig mogelijk onderscheidenlijk vindt voor het eerst plaats ten
      aanzien van het kalenderjaar na dat waarin deze wet in het Staatsblad is geplaatst.

      4 Onze Minister stelt voor het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref13],
      het College tarieven gezondheidszorg, bedoeld in de [Wet tarieven gezondheidszorg][ref14], het
      College bouw ziekenhuisvoorzieningen en het College sanering ziekenhuisvoorzieningen, bedoeld in de
      [Wet ziekenhuisvoorzieningen][ref15], een voorlopig bestuursreglement vast. Het voorlopig reglement geldt totdat
      het bestuursreglement van het betrokken college de goedkeuring van Onze Minister heeft verkregen.


