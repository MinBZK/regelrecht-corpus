  - number: XV
    text: |-
      1 Een toelating van een instelling door Onze Minister ingevolge [artikel 8a van de Ziekenfondswet][ref1]
      of [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref2] voor het tijdstip van inwerkingtreding
      van deze wet wordt gelijkgesteld met toelating door het College voor zorgverzekeringen, bedoeld
      in de [Ziekenfondswet][ref3], ingevolge [artikel 8a van de Ziekenfondswet][ref4] onderscheidenlijk
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref5], zoals deze door de inwerkingtreding van deze wet
      zijn komen te luiden.

      2 Een aanvraag om toelating, voor het tijdstip van inwerkingtreding van deze wet bij Onze Minister ingediend
      ingevolge [artikel 8a van de Ziekenfondswet][ref6] of [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref7],
      wordt gelijk gesteld met een aanvraag, ingediend bij het College voor zorgverzekeringen, bedoeld in de
      [Ziekenfondswet][ref8], zoals deze door de inwerkingtreding van deze wet zijn komen te luiden.


