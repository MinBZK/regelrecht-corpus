  - number: XVI
    text: |-
      1 Een toelating van een ziekenfonds onderscheidenlijk ziektekostenverzekeraar door
      Onze Minister ingevolge [artikel 34 van de Ziekenfondswet][ref1] onderscheidenlijk
      [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref2] voor het tijdstip van inwerkingtreding
      van deze wet wordt gelijkgesteld met toelating door het College voor zorgverzekeringen, bedoeld
      in de [Ziekenfondswet][ref3], ingevolge [artikel 34 van de Ziekenfondswet][ref4] onderscheidenlijk
      [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref5], zoals deze door de inwerkingtreding van deze wet
      zijn komen te luiden.

      2 Een aanmelding van een uitvoerend orgaan bij Onze Minister ingevolge
      [artikel 38 van de Algemene Wet Bijzondere Ziektekosten][ref6] voor het tijdstip van inwerkingtreding van deze wet
      wordt gelijkgesteld met aanmelding bij het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref7],
      ingevolge [artikel 38 van de Algemene Wet Bijzondere Ziektekosten][ref8], zoals deze door de inwerkingtreding van
      deze wet is komen te luiden.

      3 Een aanvraag om toelating als ziekenfonds onderscheidenlijk ziektekostenverzekeraar, voor het tijdstip van
      inwerkingtreding van deze wet bij Onze Minister ingediend ingevolge [artikel 34 van de Ziekenfondswet][ref9]
      onderscheidenlijk [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref10], wordt gelijkgesteld met een
      aanvraag, ingediend bij het College voor zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref11], zoals deze door
      de inwerkingtreding van deze wet is komen te luiden.


