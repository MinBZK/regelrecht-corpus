  - number: XXI
    text: |-
      Voor zover de artikelen XIV tot en met XX daarin niet voorzien, stelt Onze Minister regels met betrekking tot
      de gevolgen van de inwerkingtreding van deze wet. Deze regels gelden tot en met 31 december van het kalenderjaar
      na dat waarin zij inwerking zijn getreden. Van het vaststellen van deze regels wordt kennis gegeven aan de beide
      kamers der Staten-Generaal. Indien voor het tijdstip, bedoeld in de tweede volzin, een voorstel van wet tot
      regeling van het betrokken onderwerp bij de Staten-Generaal is ingediend, vervalt de regeling op het tijdstip
      waarop een van beide kamers der Staten-Generaal besluit het wetsvoorstel niet aan te nemen of op het tijdstip
      waarop het wetsvoorstel kracht van wet krijgt.
    url: https://wetten.overheid.nl/BWBR0010370/2001-08-31#ArtikelXXI
  - number: XXIII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor verschillende artikelen
      verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0010370/2001-08-31#ArtikelXXIII
