        artikel: '2'
        paragraaf: '2'
  - number: '2'
    text: |-
      1 De minister kan, in overeenstemming met de Minister van Financiën, aan een instelling ten behoeve van een
      tentoonstelling of van een langdurige bruikleen een aanspraak op financiële middelen verlenen onder de opschortende
      voorwaarde van verlies van of schade aan de door derden in bruikleen afgestane voorwerpen.

      2 De aanspraak wordt verleend:

      a. in geval van een tentoonstelling: voorzover de exploitatie van die tentoonstelling een tekort vertoont, of

      b. in geval van een langdurige bruikleen: voorzover een door de instelling verschuldigde eigen bijdrage wordt
      overschreden.

      3 Het totaal van de aanspraken op financiële middelen in een begrotingsjaar op grond van indemniteitsverklaringen
      gaat op enig moment het bedrag van € 230.000.000 niet te boven.

      4 Van het bedrag, bedoeld in het derde lid, kan in een begrotingsjaar ten hoogste tien procent worden bestemd voor
      langdurige bruikleen.
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel2
  - number: '3'
    text: |-
      1 Een indemniteitsverklaring kan slechts worden verleend indien een instelling naar het oordeel van de minister, in
      overeenstemming met de Minister van Financiën, heeft aangetoond, dat een indemniteitsverklaring een besparing op de
      verzekeringskosten ter zake van de desbetreffende tentoonstelling of van de langdurige bruikleen ten gevolge heeft.

      2 Een indemniteitsverklaring kan voorts slechts worden verleend indien er naar het oordeel van de minister
      een acceptabele verhouding aanwezig is tussen enerzijds het belang van de tentoonstelling of van de langdurige
      bruikleen en de besparing, bedoeld in het eerste lid, en anderzijds het door de Staat te aanvaarden risico.

      3 De voorwaarden die gelden voor de verzekering in verband waarmee de indemniteitsverlaring wordt verleend, zijn
      van overeenkomstige toepassing op de indemniteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel3
  - number: '4'
    text: |-
      1 De aanvraag voor een indemniteitsverklaring gaat, onverminderd [artikel 11 van het Besluit][ref1], vergezeld van
      tenminste één verzekeringsofferte.

      2 Een aanvraag die verschillende voorwerpen betreft, gaat tevens vergezeld van een lijst van in bruikleen te geven
      voorwerpen.

      3 In geval van een aanvraag ten behoeve van een tentoonstelling wordt tevens een tentoonstellingsplan overgelegd.

      4 Bij de beoordeling van een aanvraag en de voorbereiding van de verlening van een indemniteitsverklaring kan de
      minister verzoeken om een actuele risico-inventarisatie en -analyse over te leggen, om informatie te verschaffen
      over de in acht te nemen veiligheid, beveiliging en bewaking van de bruiklenen waarop de aanvraag betrekking heeft,
      of om hem op locatie de organisatorische, bouwkundige en elektronische veiligheidsvoorzieningen te tonen, een en
      ander als bedoeld onder 1, 4 en 5, van de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel11
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '11'
  - number: '5'
    text: Op de aanvragen wordt beslist in de volgorde waarin zij door de minister zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel5
  - number: '6'
    text: |-
      Een indemniteitsverklaring vervalt, indien de instelling waaraan die verklaring is verleend, niet binnen vier
      maanden na het einde van de desbetreffende tentoonstelling of langdurige bruikleen aan de minister heeft bericht,
      dat zich naar haar oordeel verlies van of schade heeft voorgedaan aan voorwerpen waarop de indemniteitsverklaring
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel6
  - number: '7'
    text: |-
      Onverminderd de verplichtingen, bedoeld in [hoofdstuk IV van het Besluit][ref1], zijn voor de instelling waaraan
      een indemniteitsverklaring wordt verleend, aan die verlening de verplichtingen verbonden die met het oog op de
      veiligheid van tentoon te stellen voorwerpen zijn opgenomen in de bijlage die bij deze regeling hoort.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        hoofdstuk: IV
  - number: '8'
    text: |-
      Indien zich in de periode waarvoor een indemniteitsverklaring geldt, verlies van of schade aan voorwerpen waarop
      de indemniteitsverklaring betrekking heeft, voordoet, zendt de subsidieontvanger aan de minister naast een
      activiteitenverslag als bedoeld in [artikel 33, eerste lid, onder a, van het Besluit][ref1] een overzicht met een
      berekening van de geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '33'
  - number: '9'
    text: |-
