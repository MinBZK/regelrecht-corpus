preamble:
  text: |-
    Gelet op de artikelen 2, 5, 5b, 11, vijfde lid, 12, tweede lid, 32, eerste lid, 33, eerste lid, onder a, 48 en 49
    van het Bekostigingsbesluit cultuuruitingen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Onderwijs, Cultuur en Wetenschap;

      b. Besluit: het [Bekostigingsbesluit cultuuruitingen][ref1];

      c. instelling: een in belangrijke mate door de Staat of een ander overheidslichaam structureel gefinancierde
      instelling die gespecialiseerd is in het beheren van museale collecties, het organiseren van tentoonstellingen, of
      het tentoonstellen van langdurig in bruikleen gegeven voorwerpen;

      d. voorwerp: een voorwerp van cultuurhistorische betekenis met de daarbij behorende verpakking, lijst, raam, kader,
      sokkel en dergelijke;

      e. tentoonstelling: een tijdelijke tentoonstelling in Nederland, georganiseerd door een instelling, die naar het
      oordeel van de minister van uitzonderlijk belang is door:

      1°. een belangrijke visie te bieden op periodes, kwesties, personen of produkten van cultuurhistorische betekenis;

      2°. een overtuigende waardering op te willen wekken voor de onder 1° genoemde zaken of personen; en

      3°. een omvangrijke compilatie te bieden van belangrijke voorwerpen in een samenhang die men normaliter niet in
      Nederland te zien krijgt;

      f. langdurige bruikleen: het gedurende tenminste een jaar en ten hoogste vijf jaar in bruikleen geven aan een
      instelling van een uit het buitenland afkomstig voorwerp dat naar het oordeel van de minister van uitzonderlijk
      belang is door een presentatie bij die instelling van dat voorwerp in een samenhang die men normaliter niet in
      Nederland te zien krijgt;

      g. indemniteitsverklaring: beschikking waarbij een voorwaardelijke aanspraak op financiële middelen als bedoeld in
      [artikel 2][ref2] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006759
      [ref2]: https://wetten.overheid.nl/BWBR0017308#Artikel2
    url: https://wetten.overheid.nl/BWBR0017308/2007-02-05#Artikel1
    references:
      - id: ref1
