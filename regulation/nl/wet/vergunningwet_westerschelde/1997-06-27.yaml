preamble:
  text: |-
    Allen, die deze zullen zien of horen lezen saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat op 17 januari 1995 is totstandgekomen het Verdrag tussen het Koninkrijk
    der Nederlanden en het Vlaams Gewest inzake de verruiming van de vaarweg in de Westerschelde (Trb. 1995, nr.
    51), goedgekeurd bij Wet van 27 juni 1996 (Stb. 332), en dat het aan het goede nabuurschap verbonden belang van
    een spoedige uitvoering van dat Verdrag een bijzonder voorziening nodig maakt met betrekking tot de op grond
    van de Nederlandse wetgeving vereiste vergunningen voor de voor die verruiming en het onderhoud van de vaarweg
    noodzakelijke baggerwerken en het daarmee verband houdende storten van baggerspecie; dat bovendien een voorziening
    noodzakelijk is voor de daaraan verbonden uitvoering van oeververdedigingswerken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ter voldoening aan artikel 3, derde lid, van het Verdrag inzake de verruiming van de vaarweg in de Westerschelde,
      wordt aan het Vlaams Gewest tot en met 30 juni 2001 vergunning verleend voor de uitvoering van de in artikel 2,
      tweede lid, onderdeel *d*, van dat Verdrag bedoelde werken en voor de storting van baggerspecie afkomstig van die
      werken, zoals aangeduid in bijlage 1 bij deze wet. Aan deze vergunning zijn de voorschriften verbonden welke zijn
      opgenomen in bijlage 2 bij deze wet.

      2 De in het eerste lid bedoelde vergunning wordt voor de handhaving van de daaraan verbonden voorschriften
      gelijkgesteld met een vergunning die is verleend krachtens enig ten deze toepasselijk wettelijk voorschrift op
      grond waarvan vergunning is vereist.

      3 De in het eerste lid bedoelde bijlagen kunnen worden gewijzigd bij algemene maatregel van bestuur. Een krachtens
      de eerste volzin vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan twee weken na de
      datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel1
  - number: '2'
    text: |-
      Op de in [artikel 1][ref1] bedoelde uitvoering van werken en storting van baggerspecie zijn, onverminderd het
      bepaalde in [artikel 1, tweede lid][ref2], de wettelijke voorschriften krachtens welke daarvoor een vergunning is
      vereist niet van toepassing, behoudens voorzover met toepassing van die voorschriften vergunning is verleend bij
      een of meer voor het tijdstip van de inwerkingtreding van deze wet onherroepelijk geworden besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008748#Artikel1
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008748
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008748
        artikel: '1'
  - number: '3'
    text: |-
      Met betrekking tot de werken, bedoeld in artikel 2, tweede lid, onder *b*, van het in
      [artikel 1, eerste lid][ref1], bedoelde Verdrag – zoals die nader zijn aangeduid in bijlage 1 bij deze wet – is
      Onze Minister van Verkeer en Waterstaat gemachtigd om reeds aan te vangen met de uitvoering zolang over de daarvoor
      krachtens wettelijk voorschrift vereiste vergunningen nog niet is beslist doch daarop redelijkerwijs niet kan
      worden gewacht vanwege de gevolgen van de werken als bedoeld in artikel 2, tweede lid, onder *d*, van het Verdrag.
      Van het voornemen tot het gebruik van de in de vorige volzin bedoelde machtiging doet Onze Minister voornoemd
      onverwijld mededeling aan het gezag dat anders dan hijzelf de vergunning heeft verleend. De bevoegdheid tot het
      gebruik van die machtiging vervalt met ingang van 1 juli 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0008748#Artikel1
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008748
        artikel: '1'
  - number: '4'
    text: |-
      Besluiten, waarbij voor de in [artikel 1][ref1] bedoelde uitvoering van werken onderscheidenlijk storting van
      baggerspecie een vergunning is verleend en die voor het tijdstip van de inwerkingtreding van deze wet nog niet
      onherroepelijk zijn geworden, vervallen van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0008748#Artikel1
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008748
        artikel: '1'
  - number: '5'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel5
  - number: '6'
    text: 'Deze wet wordt aangehaald als: Vergunningwet Westerschelde.'
    url: https://wetten.overheid.nl/BWBR0008748/1997-06-27#Artikel6
