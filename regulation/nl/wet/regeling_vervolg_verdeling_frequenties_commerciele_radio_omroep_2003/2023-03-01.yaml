        artikel: '1'
  - number: 1.c
    text: |-
      landelijke commerciële radio-omroep: commerciële radio-omroep via FM-frequenties die betrekking heeft op het
      verzorgen en uitzenden van radioprogramma’s, bestemd voor een landelijk publiek;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.d
    text: |-
      ongeclausuleerde landelijke commerciële radio-omroep: landelijke commerciële radio-omroep, waarvoor op grond van
      de [Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1] zoals deze luidde vóór
      de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van 24 februari
      2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van Economische Zaken en Klimaat,
      tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003 in verband met
      modernisering van de clausuleringen geen gebruiksvoorschriften gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0014740
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
  - number: 1.e
    text: |-
      geclausuleerde landelijke commerciële radio-omroep: landelijke commerciële radio-omroep waarvoor op grond van de
      __REF000___________________________________________________________________________________________________________
      ___ zoals deze luidde vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen gebruiksvoorschriften gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel2
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '2'
  - number: 1.f
    text: |-
      klassieke muziek of jazz-muziek: programmacategorie van geclausuleerde landelijke commerciële radio-omroep als
      bedoeld in [artikel 4 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1]
      zoals deze luidde vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs, Cultuur en
      Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel4
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '4'
  - number: 1.g
    text: |-
      niet-landelijke commerciële radio-omroep: commerciële radio-omroep via FM-frequenties die
      betrekking heeft op het verzorgen en uitzenden van radio-programma’s waarvoor op grond van
      [artikel 7 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van
      24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van Economische Zaken
      en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003 in
      verband met modernisering van de clausuleringen gebruiksvoorschriften gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '7'
  - number: 1.h
    text: |-
      commerciële radio-omroep middengolf: commerciële radio-omroep via middengolffrequenties die betrekking heeft op het
      verzorgen en uitzenden van radio-programma’s;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.i
    text: |-
      aanvraag: aanvraag voor een of meer vergunningen voor het gebruik van frequentieruimte ten behoeve van commerciële
      radio-omroep;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.j
    text: 'aanvrager: degene die een aanvraag doet;'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.k
    text: |-
      aanvraagdocument: document als bedoeld in [artikel 5, eerste lid, van het Frequentiebesluit][ref1] ten behoeve van
      de verdeling van frequentieruimte voor commerciële radio-omroep;


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel5
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '5'
  - number: 1.l
    text: |-
      kavel: frequentie of samenstel van frequenties, ter beschikking voor de uitvoering van een vergunning, waarvan de
      aanspraken op het gebruiksrecht worden toegekend door middel van de procedure van vergelijkende toets;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.m
    text: |-
      demografisch bereik: het percentage van het aantal inwoners van Nederland dat bij benadering de uitzendingen via
      een etherfrequentie of een samenstel van etherfrequenties in het dekkingsgebied, berekend via de technische Zero
      Base-planningsnorm, kan ontvangen;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: 1.n
    text: |-
      notaris: de notaris, genoemd in [artikel 6, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: 1.o
    text: |-
      financieel bod: het bedrag dat de aanvrager als onderdeel van zijn aanvraag onvoorwaardelijk en onherroepelijk op
      een kavel uitbrengt.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel1
  - number: '2.1'
    text: |-
      Een aanvraag voor een vergunning voor geclausuleerde landelijke commerciële radio-omroep kan worden ingediend voor
      kavel A8. Deze kavel is beschreven in [bijlage 1, tabel 1, bij deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '2.2'
    text: |-
      De Minister van Economische Zaken besluit in overeenstemming met de minister dat de bestemming van kavel A8
      wijzigt van geclausuleerde landelijke commerciële radio-omroep in ongeclausuleerde landelijke commerciële radio-
      omroep, indien is vastgesteld dat geen van de ingediende aanvragen op die kavel betrekking heeft, dan wel dat alle
      aanvragen betrekking hebbend op die kavel niet in behandeling zijn genomen of zijn afgewezen. Een dergelijk besluit
      wordt aan de aanvragers van kavel A8 schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel2
  - number: '2.3'
    text: |-
      Een aanvrager kan kavel A8 met de bestemming geclausuleerde landelijke commerciële radio-omroep slechts verwerven,
      indien hij niet reeds over een vergunning voor frequentieruimte met deze bestemming of met de bestemming niet-
      landelijke commerciële radio-omroep beschikt.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel2
  - number: '2.4'
    text: |-
      Indien het tweede lid wordt toegepast, kan een aanvrager kavel A8 met de bestemming ongeclausuleerde landelijke
      commerciële radio-omroep slechts verwerven, indien hij niet reeds over een vergunning voor frequentieruimte met
      deze bestemming of met de bestemming niet-landelijke commerciële radio-omroep beschikt.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel2
  - number: '2.5'
    text: |-
      Voor zover een aanvrager zodanig verbonden is met een andere instelling dat er sprake is van eenzelfde instelling
      als bedoeld in [artikel 82f, eerste lid, van de Mediawet][ref1] is het derde en vierde lid op laatstbedoelde
      instelling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '3.1'
    text: |-
      Een aanvraag voor een vergunning voor niet-landelijke commerciële radio-omroep kan worden ingediend voor de kavels
      B2, B11 en B26. Deze kavels zijn beschreven in [bijlage 1, tabel 2, bij deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '3.2'
    text: |-
      Een aanvrager kan slechts één of meer van de kavels B2, B11 of B26 verwerven, indien dit tezamen met één van de
      kavels waarvoor hij reeds een vergunning voor niet-landelijke commerciële radio-omroep heeft verkregen, niet leidt
      tot een verboden combinatie als beschreven in [bijlage 2a bij deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '3.3'
    text: |-
      Een aanvrager kan slechts één of meer van de kavels B2, B11 of B26 verwerven, indien het demografisch bereik
      van deze kavels tezamen met het demografisch bereik van de kavels waarvoor hij reeds een vergunning voor niet-
      landelijke commerciële radio-omroep heeft verkregen, de dertig procent niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel3
  - number: '3.4'
    text: |-
      Een aanvrager kan slechts één of meer van de kavels B2, B11 of B26 verwerven, indien hij niet reeds over een
      vergunning voor frequentieruimte met de bestemming landelijke commerciële radio-omroep beschikt.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel3
  - number: '3.5'
    text: |-
      Voor zover een aanvrager zodanig verbonden is met een andere instelling dat er sprake is van eenzelfde instelling
      als bedoeld in [artikel 82f, eerste lid, van de Mediawet][ref1] is het tweede tot en met het vierde lid op
      laatstbedoelde instelling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '4'
    text: |-
      Een aanvraag voor een vergunning voor commerciële radio-omroep middengolf kan worden ingediend voor de kavels C7,
      C10 en C11. Deze kavels zijn beschreven in [bijlage 1, tabel 3, bij deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '5'
    text: De vergunningen voor commerciële radio-omroep worden verleend door middel van de procedure van vergelijkende toets.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel5
  - number: '6.1'
    text: |-
      Degene die in aanmerking wenst te komen voor een vergunning verzoekt de minister per aangetekende brief of
      per brief die wordt overhandigd op het in het vierde lid genoemde adres om het beschikbaar stellen van een
      aanvraagdocument. In deze brief vermeldt hij zowel zijn post- als bezorgadres, zijn telefoonnummer, de naam van
      een contactpersoon en, indien hij over een fax beschikt, zijn faxnummer. Het aanvraagdocument kan worden opgevraagd
      met ingang van 15 augustus 2003, 09.00 uur. Het verzoek wordt uiterlijk op 12 september 2003 vóór 14.00 uur door de
      minister ontvangen. Het aanvraagdocument wordt afgehaald op het in het vierde lid genoemde adres. Indien daar in de
      brief om is verzocht wordt het aanvraagdocument aangetekend toegezonden.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '6.2'
    text: |-
      Het verzoek wordt als volgt geadresseerd: De Minister van Onderwijs, Cultuur en Wetenschappen p/a mr. C.A. de
      Zeeuw, notaris Pels Rijcken & Droogleever Fortuijn Postbus 11756 2502 AT Den Haag Nederland
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '6.3'
    text: |-
      Voor de beschikbaarstelling van het aanvraagdocument is een bedrag van € 175 verschuldigd. Het bedrag wordt voldaan
      door middel van contante betaling bij het afhalen van het aanvraagdocument dan wel door middel van overboeking naar
      het volgende bankrekeningnummer: 22.81.75.720 t.n.v. Pels Rijcken & Droogleever Fortuijn derdengelden notariaat
      inzake procedure vergelijkende toets radiofrequenties.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '6.4'
    text: |-
      Beschikbaarstelling van het aanvraagdocument door overhandiging bij het afhalen dan wel door toezending geschiedt
      nadat het in het derde lid genoemde bedrag is voldaan. Het afhalen geschiedt op het volgende adres: Minister van
      Onderwijs, Cultuur en Wetenschappen p/a mr. C.A. de Zeeuw, notaris Pels Rijcken & Droogleever Fortuijn Koningin
      Julianaplein 30 Gebouw Babylon Kantoren A, 5e verdieping Den Haag Nederland
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '6.5'
    text: Het bedrag, genoemd in het derde lid, wordt niet geretourneerd.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '6.6'
    text: |-
      De identiteit van degene die in aanmerking wenst te komen voor een vergunning is tot het moment dat de aanvraag is
      ingediend alleen aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel6
  - number: '7.1'
    text: |-
      Eenieder aan wie het aanvraagdocument overeenkomstig [artikel 6][ref1] is verstrekt, kan met betrekking tot dat
      document vragen stellen aan de minister. De vragen worden uitsluitend schriftelijk ingediend met gebruikmaking
      van de daarvoor bestemde enveloppen die in het aanvraagdocument zijn opgenomen en gaan vergezeld van een diskette
      met daarop een elektronische versie van de vragen. Indien er verschillen bestaan tussen de schriftelijke en de
      elektronische versie van de vragen, is de schriftelijke versie bindend. De vragen worden uiterlijk op 22 augustus
      2003, vóór 14.00 uur, door tussenkomst van de notaris op het in [artikel 6, tweede lid][ref2], genoemde adres, door
      de minister ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De vragen worden zodanig geformuleerd dat ze niet tot de identiteit van de vragensteller herleidbaar zijn en worden
      in de Nederlandse taal gesteld. De identiteit van de vragensteller is alleen aan de notaris bekend.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel7
  - number: '7.3'
    text: |-
      Uiterlijk op 3 september 2003 zendt de minister aan eenieder aan wie het aanvraagdocument is verstrekt schriftelijk
      antwoord op de vragen die tijdig zijn ontvangen en die voldoen aan de eisen, bedoeld in het eerste en tweede lid,
      vergezeld van de niet tot de identiteit van de vragensteller herleidbare versie van de vragen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel7
  - number: '8.1'
    text: |-
      De aanvraag wordt ingedeeld overeenkomstig [bijlage 3 bij deze regeling][ref1]. De aanvraag bevat de algemene
      gegevens en bescheiden, bedoeld in [bijlage 3, onderdelen I tot en met III en VIII, bij deze regeling][ref2],
      en bevat daarnaast per kavel waarop de aanvraag betrekking heeft de gegevens en bescheiden, bedoeld in
      [bijlage 3, onderdeel IV, V, VI of VII, bij deze regeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
      [ref2]: https://wetten.overheid.nl/BWBR0015414
      [ref3]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015414
      - id: ref2
        bwb_id: BWBR0015414
      - id: ref3
        bwb_id: BWBR0015414
  - number: '8.2'
    text: |-
      De gegevens en bescheiden, bedoeld in [bijlage 3, onderdelen IV tot en met VII][ref1], dienen afzonderlijk
      gebundeld zijn ten opzichte van de andere op grond van [deze bijlage][ref2] in de aanvraag op te nemen gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
      [ref2]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015414
      - id: ref2
        bwb_id: BWBR0015414
  - number: '8.3'
    text: |-
      De aanvraag geeft aan op welke bestemming of bestemmingen en daarbinnen op welke specifieke kavel of kavels deze
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '8.4'
    text: |-
      De aanvraag is in de Nederlandse taal gesteld en aangeduid als het originele exemplaar. Dit exemplaar wordt
      ondertekend door de aanvrager en losbladig aangeleverd.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '8.5'
    text: |-
      In afwijking van het vierde lid, mogen de gegevens en bescheiden, bedoeld in het eerste en tweede lid, die van
      anderen dan de aanvrager zelf afkomstig zijn in de Engelse taal gesteld zijn.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '8.6'
    text: De aanvraag gaat vergezeld van zeven als zodanig aangeduide afschriften.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '8.7'
    text: Indien er verschillen bestaan tussen het originele exemplaar en de afschriften, is het originele exemplaar bindend.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '8.8'
    text: |-
      De aanvrager informeert de minister per brief die wordt geadresseerd op de in [artikel 6, tweede lid][ref1],
      genoemde wijze onmiddellijk over wijzigingen met betrekking tot de gegevens en bescheiden, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: '8.9'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het eerste lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel8
  - number: '9'
    text: 'De aanvraag heeft uitsluitend betrekking op:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.a
    text: kavel A8 als kavel voor geclausuleerde landelijke commerciële radio-omroep;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.b
    text: |-
      kavel A8 voor het geval zich een bestemmingswijziging als bedoeld in [artikel 2, tweede lid][ref1], voordoet en
      deze kavel als gevolg daarvan bestemd is voor ongeclausuleerde landelijke commerciële radio-omroep;


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel2
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
  - number: 9.c
    text: één of meer van de kavels B2, B11 en B26 voor niet-landelijke commerciële radio-omroep;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.d
    text: één of meer van de kavels C7, C10 en C11 voor commerciële radio-omroep middengolf;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.e
    text: een combinatie van a en b;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.f
    text: een combinatie van a, b, en d;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.g
    text: een combinatie van a en d;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.h
    text: een combinatie van b en d; of
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: 9.i
    text: een combinatie van c en d.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel9
  - number: '10.1'
    text: |-
      De aanvraag die betrekking heeft op niet-landelijke commerciële radio-omroep en zich daarbinnen op meer dan één
      kavel richt, geeft op de in het tweede lid genoemde wijze per kavel aan welke voorkeur aan het verkrijgen van die
      kavel wordt gegeven ten opzichte van de andere kavels waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel10
  - number: '10.2'
    text: |-
      Het aangeven van de voorkeuren vindt plaats door de kavels op basis van voorkeur oplopend te nummeren, beginnend
      met het getal één voor de kavel waarvoor de belangstelling het grootst is.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel10
  - number: '11.1'
    text: Elke aanvrager dient slechts één aanvraag in.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
  - number: '11.2'
    text: |-
      De aanvraag kan uitsluitend met ingang van 15 augustus 2003, 09.00 uur worden ingediend, en wordt uiterlijk op 12
      september 2003 vóór 14.00 uur ontvangen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
  - number: '11.3'
    text: |-
      Indiening van de aanvraag geschiedt uitsluitend door aflevering op het adres, genoemd in
      [artikel 6, vierde lid][ref1], behoudens indien de aanvraag op 12 september 2003 na 13.00 uur wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: '11.4'
    text: |-
      Indien de aanvraag op 12 september 2003 na 13.00 uur wordt ingediend, geschiedt dit uitsluitend door aflevering op
      het volgende adres: Minister van Onderwijs, Cultuur en Wetenschappen p/a mr. C.A. de Zeeuw, notaris Pels Rijcken &
      Droogleever Fortuijn Koningin Julianaplein 30 Gebouw Babylon Kantoren A, begane grond bij de beveiligingsbalie Den
      Haag Nederland
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
  - number: '11.5'
    text: |-
      In de aanvraag vermeldt de aanvrager zowel zijn post- als bezorgadres, zijn telefoonnummer, de naam van een
      contactpersoon en, indien hij over een fax beschikt, zijn faxnummer.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
  - number: '11.6'
    text: De minister bevestigt onverwijld schriftelijk de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel11
  - number: '12.1'
    text: Elke aanvrager brengt op iedere kavel waarop zijn aanvraag betrekking heeft een financieel bod uit.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel12
  - number: '12.2'
    text: |-
      Het financieel bod komt overeen met het model in [bijlage 4 van de regeling][ref1] en maakt deel uit van de
      aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '12.3'
    text: De aanvrager is onvoorwaardelijk en onherroepelijk aan zijn bod gebonden.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel12
  - number: '13'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de eisen, gesteld in [artikel 11, tweede tot en met vierde lid][ref1],
      wordt de aanvraag afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel11
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '11'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Indien de aanvrager niet heeft voldaan aan de in de [artikelen 6, eerste lid, eerste volzin, en derde lid][ref1],
      [8][ref2] en [11, eerste en vijfde lid][ref3], gestelde eisen, stelt de minister de aanvrager gedurende vijf
      werkdagen in de gelegenheid dit verzuim te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel11
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '11'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De termijn bedoeld in het eerst lid, vangt aan met ingang van de dag na die waarop de minister de aanvrager in de
      gelegenheid heeft gesteld het verzuim te herstellen en verstrijkt op de vijfde werkdag vóór 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel14
  - number: '14.3'
    text: |-
      Indien het verzuim niet is hersteld binnen de termijn bedoeld in het eerste en tweede lid, wordt de aanvraag niet
      in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel14
  - number: '14.4'
    text: |-
      In afwijking van het derde lid wordt, indien het verzuim [artikel 11, eerste lid][ref1], betreft, door middel van
      loting bepaald welke aanvraag in behandeling blijft. De overige aanvragen worden niet in behandeling genomen. De
      loting geschiedt door de notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel11
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '11'
        paragraaf: '2'
  - number: '15'
    text: |-
      De Minister van Economische Zaken deelt de aanvrager zo spoedig mogelijk na de dag waarop de aanvrager op grond van
      [artikel 11, tweede lid][ref1], de aanvraag uiterlijk kon indienen mee of de aanvraag in behandeling wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel11
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '11'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      De aanvrager is een privaatrechtelijke rechtspersoon als bedoeld in
      [artikel 3 van boek 2 van het Burgerlijk Wetboek][ref1] dan wel een natuurlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: '16.2'
    text: Een aanvrager is geen instelling voor publieke omroep.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: '16.3'
    text: |-
      Met een privaatrechtelijke rechtspersoon naar Nederlands recht wordt gelijkgesteld het equivalent daarvan volgens
      het recht van een van de overige lidstaten van de Europese Unie of een van de overige lidstaten die partij zijn bij
      de overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: '16.4'
    text: 'Indien de aanvrager een rechtspersoon is:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: 16.4.a
    text: |-
      wordt deze beheerst door het recht van een van de lidstaten van de Europese Unie of een van de overige lidstaten
      die partij zijn bij de overeenkomst betreffende de Europese Economische Ruimte; en
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: 16.4.b
    text: |-
      heeft deze zijn statutaire zetel, zijn hoofdbestuur of zijn hoofdvestiging binnen een van de lidstaten van
      de Europese Unie of een van de overige lidstaten die partij zijn bij de overeenkomst betreffende de Europese
      Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: '16.5'
    text: 'Indien de aanvrager een natuurlijk persoon is:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: 16.5.a
    text: |-
      heeft deze zijn werkelijke woonplaats binnen een van de lidstaten van de Europese Unie of een van de overige
      lidstaten die partij zijn bij de overeenkomst betreffende de Europese Economische ruimte, en
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: 16.5.b
    text: is deze meerderjarig.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel16
  - number: '17.1'
    text: 'Ten aanzien van de financiële positie van de aanvrager worden de volgende eisen gesteld:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.a
    text: de aanvrager verkeert niet in staat van faillissement;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.b
    text: |-
      er is geen beslag gelegd op een of meer goederen van de aanvrager die tezamen een aanmerkelijk deel van zijn
      vermogen vormen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.c
    text: 'indien de aanvrager een rechtspersoon is:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.c.1°
    text: is aan de aanvrager geen surséance van betaling verleend;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.c.2°
    text: verkeert de aanvrager niet in liquidatie;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.d
    text: 'indien de aanvrager een natuurlijk persoon is:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.d.1°
    text: |-
      is deze handelingsbekwaam ter zake van de onderhavige procedure van vergelijkende toets alsmede het verzorgen en
      uitzenden van radioprogramma’s;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.d.2°
    text: is ten aanzien van de aanvrager geen schuldsaneringsregeling natuurlijke personen van toepassing;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.d.3°
    text: |-
      heeft de aanvrager niet door onderbewindstelling van een of meer goederen het vrije beheer over zijn vermogen
      verloren;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: 17.1.d.4°
    text: |-
      overlegt de aanvrager een verklaring omtrent het gedrag als bedoeld in de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: '17.2'
    text: |-
      Met een aanvrager die voldoet aan de eisen, bedoeld in het eerste lid, wordt gelijkgesteld een aanvrager die aan
      zodanige eisen voldoet krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de
      andere staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel17
  - number: '18.1'
    text: |-
      Ten aanzien van de financiële positie van de aanvrager van kavel A8 wordt de eis gesteld dat hij een bankgarantie
      overlegt die overeenkomt met het model in [bijlage 5 van deze regeling][ref1], ter zekerheid voor de nakoming
      van de betaling van het bedrag van de eerste en tweede termijn van het financieel bod zoals nader bepaald in
      [artikel 42 van deze regeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015414
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel42
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015414
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '42'
        paragraaf: '8'
  - number: '18.2'
    text: |-
      Indien de aanvrager kavel A8 met de bestemming geclausuleerde landelijke commerciële radio-omroep aanvraagt, is de
      hoogte van het bedrag van de bankgarantie als bedoeld in het eerste lid gelijk aan de optelsom van de bedragen van
      de eerste en tweede termijn van betaling van het financieel bod dat de aanvrager voor die kavel heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de aanvrager kavel A8 aanvraagt voor het geval dat [artikel 2, tweede lid][ref1], wordt toegepast en de
      bestemming van die kavel mitsdien wijzigt in ongeclausuleerde landelijke commerciële radio-omroep, is het tweede
      lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel2
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
  - number: '18.4'
    text: |-
      Indien de aanvrager kavel A8 zowel aanvraagt met de bestemming geclausuleerde landelijke commerciële radio-
      omroep als met de bestemming ongeclausuleerde landelijke commerciële radio-omroep voor het geval dat
      [artikel 2, tweede lid][ref1], wordt toegepast, is de hoogte van het bedrag van de bankgarantie als bedoeld in het
      eerste lid gelijk aan de optelsom van de bedragen van de eerste en tweede termijn van betaling van de hoogste van
      beide financiële biedingen die de aanvrager op kavel A8 heeft uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel2
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
  - number: '19.1'
    text: |-
      Ten aanzien van de kennis en ervaring van de aanvrager voor een vergunning voor kavel A8 voor klassieke muziek
      of jazz-muziek, wordt de eis gesteld dat de aanvrager aantoonbaar kan beschikken over kennis en ervaring met
      betrekking tot de productie en exploitatie van een radioprogramma dat overwegend bestaat uit klassieke muziek of
      jazz-muziek.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel19
  - number: '19.2'
    text: |-
      Ten aanzien van de kennis en ervaring van de aanvrager voor een vergunning voor kavel A8 voor ongeclausuleerde
      landelijke commerciële radio-omroep dan wel voor commerciële radio-omroep middengolf wordt de eis gesteld dat
      hij aantoonbaar kan beschikken over kennis en ervaring met betrekking tot de productie en exploitatie van een
      radioprogramma.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel19
  - number: '19.3'
    text: |-
      Ten aanzien van de kennis en ervaring van de aanvrager voor een vergunning voor niet-landelijke commerciële radio-
      omroep wordt de eis gesteld dat de aanvrager aantoonbaar kan beschikken over kennis en ervaring met betrekking tot
      de productie en exploitatie van een regionaal radioprogramma.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel19
  - number: '19.4'
    text: |-
      Ten aanzien van de technische middelen van de aanvrager wordt de eis gesteld dat de aanvrager aantoonbaar kan
      beschikken over technische middelen met betrekking tot de productie en exploitatie van een radioprogramma.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel19
  - number: '20.1'
    text: |-
      Ten aanzien van de hoedanigheid van de aanvrager als commerciële omroep wordt de eis gesteld dat
      de aanvrager beschikt over de vereiste toestemming van het Commissariaat voor de Media, bedoeld in
      [artikel 71a van de Mediawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
  - number: '20.2'
    text: |-
      Een aanvrager die ten tijde van het indienen van zijn aanvraag nog niet beschikt over de vereiste toestemming,
      bedoeld in het eerste lid, overlegt gelijktijdig met zijn aanvraag een bewijs dat die toestemming is aangevraagd.
      Uiterlijk op 3 oktober 2003 wordt de vereiste toestemming overgelegd door aflevering op het adres, genoemd in
      [artikel 6, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: '21.1'
    text: |-
      De aanvrager van een vergunning voor landelijke commerciële radio-omroep overlegt een door hem ondertekende
      verklaring die overeenkomt met het model van [bijlage 6 bij deze regeling][ref1], waaruit blijkt dat een krachtens
      deze regeling aan hem verleende vergunning voor commerciële radio-omroep zal worden gebruikt voor het uitzenden van
      een radioprogramma van een commerciële omroepinstelling:


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: 21.1.a
    text: |-
      dat, voor zover het gepresenteerde programmaonderdelen tussen 07.00 uur en 19.00 uur betreft, voor ten minste 50
      procent in de Nederlandse of Friese taal wordt gepresenteerd, en
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel21
  - number: 21.1.b
    text: |-
      waarin tussen 07.00 uur en 23.00 uur, voor zover in deze uren wordt uitgezonden, ten minste éénmaal per uur op het
      hele uur een programmaonderdeel geheel bestaande uit nieuws is opgenomen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel21
  - number: '21.2'
    text: |-
      De aanvrager van een vergunning voor niet-landelijke commerciële radio-omroep overlegt een door hem ondertekende
      verklaring die overeenkomt met het model van [bijlage 7 bij deze regeling][ref1], waaruit blijkt dat een krachtens
      deze regeling aan hem verleende vergunning voor commerciële radio-omroep zal worden gebruikt voor het uitzenden
      van een radioprogramma van een commerciële omroepinstelling dat, voor zover het gepresenteerde programmaonderdelen
      tussen 07.00 uur en 19.00 uur betreft, voor ten minste 50% in de Nederlandse of Friese taal wordt gepresenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '22'
    text: |-
      Indien uit de aanvraag blijkt dat voor een kavel niet is voldaan aan de eisen, bedoeld in de
      [artikelen 16 tot en met 21][ref1], wijst de Minister van Economische Zaken de aanvraag voor het deel dat op die
      kavel betrekking heeft, af.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel16
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '16'
        paragraaf: '3'
  - number: '23'
    text: |-
      Indien uit de aanvraag blijkt dat voor een kavel is voldaan aan de eisen, bedoeld in de
      [artikelen 16 tot en met 21][ref1], stelt de Minister van Economische Zaken de aanvrager hiervan schriftelijk in
      kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel16
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '16'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Indien de aanvragen van twee of meer aanvragers die als eenzelfde instelling als bedoeld in
      [artikel 82f van de Mediawet][ref1] moeten worden beschouwd, tezamen niet voldoen aan [artikel 9][ref2] stelt
      de minister deze aanvragers gedurende vijf werkdagen in de gelegenheid hun aanvragen in overeenstemming met
      [artikel 9][ref3] te brengen door het geheel of gedeeltelijk intrekken van één of meer aanvragen. Voor zover
      het gaat om niet-landelijke commerciële radio-omroep geven deze aanvragers daarbij tevens hun voorkeuren voor de
      aangevraagde kavels op overeenkomstig [artikel 10][ref4] als betreft het één aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0015414#Artikel10
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015414
        artikel: '10'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Geheel of gedeeltelijke intrekking van aanvragen en het aangeven van voorkeuren conform het eerste lid, geschiedt
      door schriftelijke kennisgeving daarvan aan de minister op het in [artikel 6, tweede lid][ref1], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel6
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '6'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      Indien geheel of gedeeltelijke intrekking van aanvragen niet overeenkomstig het eerste lid binnen de daar genoemde
      termijn is geschied, wordt door middel van loting bepaald welke aanvraag verder in behandeling blijft. De overige
      aanvragen worden afgewezen. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel24
  - number: '24.4'
    text: |-
      Indien de opgave van voorkeuren niet overeenkomstig het eerste lid binnen de daar genoemde termijn is geschied,
      wordt door middel van loting bepaald wat de voorkeuren voor de kavels zijn. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel24
  - number: '25.1'
    text: |-
      Indien de aanvragen van twee of meer aanvragers voor niet-landelijke commerciële radio-omroep die als eenzelfde
      instelling als bedoeld in [artikel 82f van de Mediawet][ref1] moeten worden beschouwd, tezamen voldoen
      aan [artikel 9][ref2], geven deze aanvragers hun voorkeuren voor de aangevraagde kavels op overeenkomstig
      [artikel 10][ref3] als betreft het één aanvraag. De minister stelt deze aanvragers hiertoe gedurende vijf werkdagen
      in de gelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel10
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '10'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Indien de opgave van voorkeuren niet overeenkomstig het eerste lid binnen de daar genoemde termijn is geschied,
      wordt door middel van loting bepaald wat de voorkeuren voor de kavels zijn. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel25
  - number: '26.1'
    text: |-
      Indien een aanvraag betrekking heeft op kavel A8 als kavel voor geclausuleerde landelijke commerciële radio-
      omroep waarop de aanvraag van een andere aanvrager eveneens betrekking heeft, wordt die kavel in de procedure van
      vergelijkende toets bedoeld in de [artikelen 27][ref1], [28][ref2] en [36][ref3] betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel36
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '27'
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '28'
        paragraaf: 5a
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '36'
        paragraaf: 6a
  - number: '26.2'
    text: |-
      Indien een aanvraag betrekking heeft op kavel A8 als kavel voor ongeclausuleerde landelijke commerciële radio-
      omroep waarop de aanvraag van een andere aanvrager eveneens betrekking heeft, wordt die kavel in de procedure van
      vergelijkende toets bedoeld in de [artikelen 29][ref1], [30][ref2] en [37][ref3] betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel37
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '29'
        paragraaf: 5b
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '30'
        paragraaf: 5b
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '37'
        paragraaf: 6b
  - number: '26.3'
    text: |-
      Indien een aanvraag betrekking heeft op ten minste één of meer van de kavels B2, B11 en B26 voor niet-landelijke
      commerciële radio-omroep waarop de aanvraag van een andere aanvrager eveneens betrekking heeft, worden die kavels
      in de procedure van vergelijkende toets bedoeld in de [artikelen 31][ref1], [32][ref2], [35][ref3] en [38][ref4]
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0015414#Artikel38
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '31'
        paragraaf: 5c
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '32'
        paragraaf: 5c
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '35'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0015414
        artikel: '38'
        paragraaf: 6c
  - number: '26.4'
    text: |-
      Indien een aanvraag betrekking heeft op ten minste één of meer van de kavels C7, C10 en C11 voor commerciële radio-
      omroep middengolf waarop de aanvraag van een andere aanvrager eveneens betrekking heeft, worden die kavels in de
      procedure van vergelijkende toets bedoeld in de [artikelen 33 tot en met 35][ref1] en [artikel 39][ref2] betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel39
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '33'
        paragraaf: 5d
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '39'
        paragraaf: 6d
  - number: '26.5'
    text: |-
      Indien de procedure van vergelijkende toets voor niet-landelijke commerciële radio-omroep bedoeld
      in de [artikelen 31][ref1], [32][ref2], [35][ref3] en [38][ref4] niet van toepassing is, krijgt de
      aanvrager met inachtneming van het bepaalde in de [artikelen 2, derde tot en met vijfde lid][ref5], en
      [3, tweede tot en met vijfde lid][ref6], de kavels toegewezen op volgorde van voorkeur.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0015414#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0015414#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0015414#Artikel3
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '31'
        paragraaf: 5c
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '32'
        paragraaf: 5c
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '35'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0015414
        artikel: '38'
        paragraaf: 6c
      - id: ref5
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0015414
        artikel: '3'
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Bij de uitvoering van de vergelijkende toets voor kavel A8 als kavel voor geclausuleerde
      landelijke commerciële radio-omroep wordt getoetst in hoeverre de aanvrager
      programmatisch meer biedt dan hetgeen voor die kavel is voorgeschreven op grond van de
      [artikel 4 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van
      24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van Economische Zaken
      en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003 in
      verband met modernisering van de clausuleringen.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel4
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '4'
  - number: '27.2'
    text: |-
      Voorts wordt het overeenkomstig [bijlage 8][ref1] in de aanvraag opgenomen bedrijfsplan voor kavel A8 getoetst op
      financiële haalbaarheid. Bij deze toets wordt tevens de samenhang en het realiteitsgehalte van het bedrijfsplan
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '27.3'
    text: |-
      Bij de toets op financiële haalbaarheid van het bedrijfsplan wordt beoordeeld in hoeverre de aanvrager de kavel
      gedurende de looptijd van de vergunning kan exploiteren.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: '27.4'
    text: 'Het bedrijfsplan bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.a
    text: de programmatische voornemens van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.b
    text: de doelgroep waarop de aanvrager zich met zijn programmatische voornemens richt;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.c
    text: de kennis van de luisteraarmarkt en adverteerdermarkt waarbinnen de aanvrager opereert;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.d
    text: de inrichting van de organisatie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.e
    text: de te verwachten netto omzet en kosten;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.f
    text: de investeringen;
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: 27.4.g
    text: de financieringsbehoefte en de wijze waarop daarin is of wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel27
  - number: '28.1'
    text: |-
      Bij de toetsing aan de criteria, bedoeld in [artikel 27][ref1], beoordeelt de minister de programmatische
      voornemens voor een kavel met een nul (0) dan wel een plus (+), en daarnaast het bedrijfsplan voor diezelfde kavel
      met een nul (0) dan wel een plus (+).


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel27
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '27'
        paragraaf: 5a
  - number: '28.2'
    text: |-
      Voor zover dat noodzakelijk is voor de toepassing van de [artikelen 35 tot en met 39][ref1] wordt voor iedere kavel
      een rangorde tussen de aanvragers aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel35
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '35'
        paragraaf: '6'
  - number: '28.3'
    text: |-
      Een aanvrager die met twee maal een plus (++) voor een kavel is beoordeeld, is voor die kavel hoger in rangorde dan
      een aanvrager die met minder dan twee maal een plus voor die kavel is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '28.4'
    text: |-
      Indien meerdere aanvragers met twee maal een plus (++) voor een kavel zijn beoordeeld, bepaalt de hoogte van het
      financieel bod voor die kavel de rangorde tussen deze aanvragers, waarbij de aanvrager met het hoogste financieel
      bod het hoogste in rangorde is.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '28.5'
    text: |-
      Indien meerdere aanvragers voor een kavel met twee maal een plus (++) zijn beoordeeld en het door hen uitgebrachte
      financieel bod voor die kavel van gelijke hoogte is, wordt door middel van loting bepaald wat de rangorde tussen
      deze aanvragers is. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '28.6'
    text: |-
      Een aanvrager die met een plus (+) op de programmatische voornemens en met een nul (0) op het bedrijfsplan
      voor een kavel is beoordeeld, is voor die kavel hoger in rangorde dan een aanvrager die met een nul (0) op de
      programmatische voornemens en met een plus (+) op het bedrijfsplan voor die kavel is beoordeeld, of een aanvrager
      die voor beide onderdelen met een nul (00) is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '28.7'
    text: |-
      Een aanvrager die met een nul (0) op de programmatische voornemens en met een plus (+) op het bedrijfsplan voor een
      kavel is beoordeeld, is voor die kavel hoger in rangorde dan een aanvrager die voor beide onderdelen met een nul
      (00) is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '28.8'
    text: |-
      Voor het bepalen van de rangorde tussen aanvragers als bedoeld in het zesde dan wel zevende lid, die een gelijke
      beoordeling hebben gekregen, is het vierde en vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel28
  - number: '29'
    text: |-
      Indien [artikel 2, tweede lid][ref1], wordt toegepast, wordt bij de uitvoering van de vergelijkende
      toets het in de aanvraag overeenkomstig [bijlage 8][ref2] opgenomen bedrijfsplan voor kavel A8 als
      kavel voor ongeclausuleerde landelijke commerciële radio-omroep getoetst op financiële haalbaarheid.
      [Artikel 27, tweede tot en met vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015414
      [ref3]: https://wetten.overheid.nl/BWBR0015414#Artikel27
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015414
      - id: ref3
        bwb_id: BWBR0015414
        artikel: '27'
        paragraaf: 5a
  - number: '30.1'
    text: |-
      Bij de toetsing aan de criteria, bedoeld in [artikel 29][ref1], beoordeelt de minister het bedrijfsplan voor een
      kavel met een nul (0) of een plus (+).


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel29
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '29'
        paragraaf: 5b
  - number: '30.2'
    text: |-
      Voor zover dat noodzakelijk is voor de toepassing van de [artikelen 35 tot en met 39][ref1] wordt voor iedere kavel
      een rangorde tussen de aanvragers aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel35
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '35'
        paragraaf: '6'
  - number: '30.3'
    text: |-
      Een aanvrager die met een plus (+) voor een kavel is beoordeeld, is hoger in rangorde dan een aanvrager die met een
      nul (0) voor die kavel is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
  - number: '30.4'
    text: |-
      Indien er meerdere aanvragers met een plus (+) voor een kavel zijn beoordeeld, bepaalt de hoogte van het financieel
      bod voor die kavel de rangorde tussen deze aanvragers, waarbij de aanvrager met het hoogste financieel bod het
      hoogste in rangorde is.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
  - number: '30.5'
    text: |-
      Indien meerdere aanvragers voor een kavel met een plus (+) zijn beoordeeld en het door hen uitgebrachte financieel
      bod voor die kavel van gelijke hoogte is, wordt door middel van loting bepaald wat de rangorde tussen deze
      aanvragers is. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
  - number: '30.6'
    text: |-
      Voor het bepalen van de rangorde tussen meerdere aanvragers die met nul (0) zijn beoordeeld, is het vierde en
      vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel30
  - number: '31.1'
    text: |-
      Bij de uitvoering van de vergelijkende toets voor niet-landelijke commerciële radio-omroep wordt getoetst in hoeverre
      de aanvrager programmatisch meer biedt dan hetgeen voor de kavels B2, B11 of B26 is voorgeschreven op grond van
      __REF000___________________________________________________________________________________________________________
      __________ zoals deze luidde vóór de inwerkingtreding van de Regeling van de Staatssecretaris van Onderwijs,
      Cultuur en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister
      van Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen.


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '7'
  - number: '31.2'
    text: |-
      Voorts wordt overeenkomstig [bijlage 8][ref1] in de aanvraag opgenomen bedrijfsplan voor de kavels B2, B11 of
      B26 getoetst op financiële haalbaarheid. [Artikel 27, tweede tot en met vierde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel27
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015414
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '27'
        paragraaf: 5a
  - number: '32.1'
    text: |-
      Bij de toetsing aan de criteria, bedoeld in [artikel 31][ref1], beoordeelt de minister de programmatische
      voornemens voor een kavel met een nul (0), dan wel een plus (+), en daarnaast het bedrijfsplan voor diezelfde kavel
      met een nul (0) dan wel een plus (+).


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel31
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '31'
        paragraaf: 5c
  - number: '32.2'
    text: |-
      [Artikel 28, tweede tot en met achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel28
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '28'
        paragraaf: 5a
  - number: '33.1'
    text: |-
      Bij de uitvoering van de vergelijkende toets voor commerciële radio-omroep middengolf wordt het in de aanvraag
      overeenkomstig [bijlage 8][ref1] opgenomen bedrijfsplan voor de kavels C7, C10 of C11 getoetst op:


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: 33.1.a
    text: financiële haalbaarheid; en
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel33
  - number: 33.1.b
    text: |-
      de mate waarin de aanvrager zich met zijn programmatische voornemens specifiek richt op een toepassing voor
      commerciële radio-omroep middengolf.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel33
  - number: '33.2'
    text: |-
      [Artikel 27, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel27
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '27'
        paragraaf: 5a
  - number: '34.1'
    text: |-
      Bij de toetsing aan de criteria, bedoeld in [artikel 33][ref1], beoordeelt de minister het bedrijfsplan voor een
      kavel met een nul (0) of een plus (+), en daarnaast of aan de aanvrager een plus (+) kan worden toegekend voor de
      in het bedrijfsplan opgenomen programmatische voornemens, bedoeld in [artikel 33, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel33
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '33'
        paragraaf: 5d
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '33'
        paragraaf: 5d
  - number: '34.2'
    text: |-
      Voor zover dat noodzakelijk is voor de toepassing van de [artikelen 35 tot en met 39][ref1] wordt voor iedere kavel
      een rangorde tussen de aanvragers aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel35
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '35'
        paragraaf: '6'
  - number: '34.3'
    text: |-
      Een aanvrager die met twee maal een plus (++) voor een kavel is beoordeeld, is hoger in rangorde dan een aanvrager
      die met één maal een plus (+) voor die kavel is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
  - number: '34.4'
    text: |-
      Indien er meerdere aanvragers met twee maal een plus (++) voor een kavel zijn beoordeeld, bepaalt de hoogte van het
      financieel bod voor die kavel de rangorde tussen deze aanvragers, waarbij de aanvrager met het hoogste financieel
      bod het hoogste in rangorde is.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
  - number: '34.5'
    text: |-
      Indien meerdere aanvragers voor een kavel met twee maal een plus (++) zijn beoordeeld en het door hen uitgebrachte
      financieel bod voor die kavel van gelijke hoogte is, wordt door middel van loting bepaald wat de rangorde tussen
      deze aanvragers is. De loting geschiedt door de notaris.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
  - number: '34.6'
    text: |-
      Een aanvrager die met éénmaal een plus (+) voor een kavel is beoordeeld, is hoger in rangorde dan de aanvrager die
      met een nul (0) voor die kavel is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
  - number: '34.7'
    text: |-
      Voor het bepalen van de rangorde tussen meerdere aanvragers die met een plus (+) dan wel een nul (0) zijn
      beoordeeld, is het vierde en vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel34
  - number: '35'
    text: |-
      De aanvrager wordt voor de kavels die in de procedure van vergelijkende toets zijn betrokken en waarop uitsluitend
      zijn aanvraag betrekking heeft, als hoogste in rangorde beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel35
  - number: '36.1'
    text: |-
      De minister wijst de kavel A8 als kavel voor geclausuleerde landelijke commerciële radio-omroep toe aan de
      aanvrager die daarvoor als hoogste in rangorde is beoordeeld.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel36
  - number: '36.2'
    text: 'Bij de toewijzing, bedoeld in het eerste lid, blijft de aanvrager buiten beschouwing die:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel36
  - number: 36.2.a
    text: |-
      reeds over een vergunning voor frequentieruimte met de bestemming geclausuleerde landelijke commerciële radio-
      omroep dan wel met de bestemming niet-landelijke commerciële radio-omroep beschikt, of
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel36
  - number: 36.2.b
    text: |-
      zodanig verbonden is met een andere instelling dat er sprake is van eenzelfde instelling als bedoeld in
      [artikel 82f, eerste lid, van de Mediawet][ref1], en laatstgenoemde instelling over een vergunning beschikt als
      bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '37.1'
    text: |-
      Indien [artikel 2, tweede lid][ref1], wordt toegepast, wijst de minister kavel A8 als kavel voor ongeclausuleerde
      landelijke commerciële radio-omroep toe aan de aanvrager die daarvoor als hoogste in rangorde is beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel2
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '2'
        paragraaf: '1'
  - number: '37.2'
    text: 'Bij de toewijzing, bedoeld in het eerste lid, blijft de aanvrager buiten beschouwing die:'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel37
  - number: 37.2.a
    text: |-
      reeds over een vergunning voor frequentieruimte met deze bestemming dan wel met de bestemming niet-landelijke
      commerciële radio-omroep beschikt, of
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel37
  - number: 37.2.b
    text: |-
      zodanig verbonden is met een andere instelling dat er sprake is van eenzelfde instelling als bedoeld in
      [artikel 82f, eerste lid, van de Mediawet][ref1], en laatstgenoemde instelling over een vergunning beschikt als
      bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '38.1'
    text: |-
      De minister wijst aan een aanvrager de kavel toe waarvoor hij als hoogste in rangorde is beoordeeld en waaraan
      hij tevens de eerste voorkeur heeft gegeven. Daarbij geldt dat de kavel niet wordt toegewezen, indien de aanvrager
      reeds over een vergunning beschikt voor landelijke commerciële radio-omroep.Voorts geldt dat de kavel niet wordt
      toegewezen, indien dit tezamen met één van de kavels waarvoor de aanvrager reeds een vergunning heeft verworven,
      leidt tot een verboden combinatie als bedoeld in [artikel 3, tweede lid][ref1], of tot overschrijding van dertig
      procent demografisch bereik als genoemd in [artikel 3, derde lid][ref2]. Indien een aanvrager een kavel niet krijgt
      toegewezen op grond van de vorige volzin, dan blijft deze kavel bij de verdere toewijzing van de kavels voor deze
      aanvrager buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015414#Artikel3
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015414
        artikel: '3'
        paragraaf: '1'
  - number: '38.2'
    text: |-
      Voor zover een aanvrager zodanig verbonden is met een andere instelling dat er sprake is van eenzelfde instelling
      als bedoeld in [artikel 82f, eerste lid, van de Mediawet][ref1] wordt voor de toepassing van het eerste lid,
      rekening gehouden met de vergunningen waarover laatstbedoelde instelling beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '38.3'
    text: |-
      Vervolgens wordt het eerste lid tezamen met het tweede lid opnieuw toegepast, waarbij de in het eerste lid genoemde
      eerste voorkeur bij iedere nieuwe toepassing met één voorkeursnummer wordt verhoogd tot de toewijzing aan deze
      aanvrager stagneert, omdat de aanvrager voor die kavel niet de hoogste in rangorde.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
  - number: '38.4'
    text: Vervolgens wordt ten aanzien van de overblijvende kavels bepaald welke aanvragers de hoogste in rangorde zijn.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
  - number: '38.5'
    text: |-
      Ten aanzien van de overblijvende kavels worden het eerste tot en met vierde lid telkens opnieuw toegepast tot
      op grond van deze leden verdere verdeling niet meer mogelijk is, met dien verstande dat de verdeling voor een
      aanvrager die op grond van de vorige leden al een of meer kavels toegewezen heeft gekregen, voor hem wordt hervat
      met de kavel waarvoor de toewijzing aan hem is gestagneerd op grond van het derde lid.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
  - number: '38.6'
    text: |-
      Ten aanzien van de overblijvende kavels wordt het vijfde lid telkens opnieuw toegepast tot op grond van dat lid
      verdere verdeling niet meer mogelijk is. Daarbij blijft bij iedere nieuwe toepassing de kavel met het laagste
      overblijvende voorkeursnummer van de aanvrager buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel38
  - number: '39'
    text: |-
      De minister wijst de kavels voor commerciële radio-omroep middengolf toe aan de aanvragers die daarvoor als hoogste
      in rangorde zijn beoordeeld. De aanvrager die voor meerdere kavels als hoogste in rangorde is beoordeeld krijgt
      alle desbetreffende kavels toegewezen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel39
  - number: '40'
    text: |-
      De minister draagt de aanvragers aan wie de kavels zijn toegewezen voor het verlenen van een vergunning voor aan de
      Minister van Economische Zaken. Vervolgens verleent de Minister van Economische Zaken de vergunningen.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel40
  - number: '41'
    text: De Minister van Economische Zaken wijst de overige aanvragen af.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel41
  - number: '42.1'
    text: |-
      De aanvrager aan wie een vergunning wordt verleend, is verplicht om het financieel bod als bedoeld in
      [artikel 12][ref1] volledig te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel12
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '12'
        paragraaf: '2'
  - number: '42.2'
    text: |-
      De vergunninghouder betaalt binnen tien werkdagen volgende op de verlening van de vergunning een bedrag van 1/8
      gedeelte van het financieel bod, met dien verstande dat dit bedrag alsdan is ontvangen op bankrekeningnummer
      22.81.75.720 t.n.v. Pels Rijcken & Droogleever Fortuijn, derdengelden notariaat inzake procedure vergelijkende
      toets radiofrequenties.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel42
  - number: '42.3'
    text: |-
      Onverminderd het bepaalde in het vorige lid, is de vergunninghouder verplicht om een bedrag van 7/8 van het
      financieel bod in zeven gelijke termijnen te betalen. Daartoe dient de vergunninghouder met ingang van het
      jaar 2004 ieder opvolgend jaar een bedrag gelijk aan 1/8 van het financieel bod te betalen op de dag gelijk
      aan de dag van de verlening van de vergunning. Alsdan moet het bedrag zijn bijgeschreven op bankrekeningnummer
      22.81.75.720 t.n.v Pels Rijcken & Droogleever Fortuijn, derdengelden notariaat inzake procedure vergelijkende toets
      radiofrequenties.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel42
  - number: '42.4'
    text: |-
      Indien een vergunninghouder in verzuim is door het bedrag als bedoeld in het tweede lid dan wel de eerst daarop
      volgende betaling overeenkomstig het derde lid niet of niet geheel te betalen, wordt de door hem overgelegde
      bankgarantie voor betaling aangewend.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel42
  - number: '43.1'
    text: |-
      Indien een aanvraag van een vergunning voor landelijke commerciële radio-omroep niet in behandeling is genomen
      of is afgewezen, wordt de door de aanvrager overgelegde bankgarantie aan de bank teruggegeven door middel van de
      procedure zoals beschreven in het als [bijlage 5 bij deze regeling][ref1] opgenomen model van de bankgarantie. De
      Minister van Economische Zaken stelt de aanvrager onverwijld op de hoogte van het teruggeven van de bankgarantie.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '43.2'
    text: |-
      Indien de vergunninghouder de verplichtingen tot zekerheid waartoe de bankgarantie strekt is nagekomen, wordt deze
      bankgarantie teruggegeven aan de bank die deze bankgarantie heeft afgegeven door middel van de procedure zoals
      beschreven in het model van de bankgarantie. De Minister van Economische Zaken stelt de vergunninghouder onverwijld
      op de hoogte van het teruggeven van de bankgarantie.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel43
  - number: '44.1'
    text: |-
      Voor zover een vergunninghouder een bankgarantie heeft overgelegd op grond van [artikel 18][ref1], waarvan het
      bedrag ter zekerheidsstelling hoger is dan de uiteindelijke betalingsverplichting waartoe de bankgarantie dient,
      wordt het bedrag van de bankgarantie verlaagd met het verschil hiertussen.


      [ref1]: https://wetten.overheid.nl/BWBR0015414#Artikel18
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0015414
        artikel: '18'
        paragraaf: '3'
  - number: '44.2'
    text: |-
      Voor zover een vergunninghouder een deel van zijn verplichtingen tot zekerheid waartoe de bankgarantie strekt
      is nagekomen, wordt het bedrag van de bankgarantie verlaagd met een bedrag gelijk aan het bedrag dat de
      vergunninghouder heeft betaald.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel44
  - number: '44.3'
    text: |-
      De Minister van Economische Zaken stelt de vergunninghouder onverwijld op de hoogte van het verlagen van het bedrag
      van de bankgarantie.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel44
  - number: '45.1'
    text: |-
      Indien een aanvrager een combinatie van kavels als bedoeld in [bijlage 2b][ref1] verkrijgt, zendt deze instelling
      een programma-onderdeel, met uitzondering van nieuwsuitzendingen en reclameblokken, dat op de frequentie of
      frequenties van een van die kavels tussen 06.00 en 19.00 uur is uitgezonden, niet binnen een aaneengesloten periode
      van 30 minuten uit op de frequentie of frequenties van een van de andere kavels.


      [ref1]: https://wetten.overheid.nl/BWBR0015414
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015414
  - number: '45.2'
    text: |-
      Indien een vergunning wordt verleend aan een aanvrager voor commerciële radio-omroep middengolf en die aanvrager
      zodanig verbonden is met één of meer vergunninghouders voor landelijke commerciële radio-omroep, niet-landelijke
      commerciële radio-omroep of commerciële radio-omroep middengolf dat sprake is van eenzelfde instelling is het
      eerste lid van overeenkomstige toepassing op die aanvragers.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel45
  - number: '45.3'
    text: |-
      Voor de bepaling of er sprake is van eenzelfde instelling als bedoeld in het tweede lid, is
      [artikel 53c, eerste lid, onderdelen a en b, van het Mediabesluit][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel53c
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: 53c
  - number: '46'
    text: |-
      De minister kan aan een aanvrager om nadere gegevens en bescheiden verzoeken, die voor de beslissing op een
      aanvraag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel46
  - number: '47'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel47
  - number: '48'
    text: 'Deze regeling wordt aangehaald als: Regeling vervolg verdeling frequenties commerciële radio-omroep 2003.'
    url: https://wetten.overheid.nl/BWBR0015414/2023-03-01#Artikel48
