  - number: '2'
    text: |-
      1 Het UWV kan op aanvraag aan de werkgever die met een niet-uitkeringsgerechtigde herbeoordeelde, die een
      indicatiebeschikking heeft als bedoeld in het derde lid, een dienstbetrekking, niet zijnde een dienstbetrekking
      als bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2], aangaat of is aangegaan na de
      inwerkingtreding van deze regeling, subsidie voor loonkosten verlenen indien de dienstbetrekking een duur van ten
      minste twaalf maanden heeft.

      2 Indien de dienstbetrekking, bedoeld in het eerste lid, een uitzendovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref3] betreft, verstrekt het UWV slechts subsidie indien de
      derde, in wiens opdracht de niet-uitkeringsgerechtigde herbeoordeelde ter beschikking wordt gesteld om arbeid
      te verrichten, zich jegens de werkgever verplicht de niet-uitkeringsgerechtigde herbeoordeelde tenminste twaalf
      maanden arbeid te laten verrichten.

      3 Het UWV kan van de niet-uitkeringsgerechtigde herbeoordeelde vaststellen dat hij in aanmerking komt voor
      toepassing van het eerste lid, indien het UWV van oordeel is dat met het oog op de inschakeling in de arbeid
      geen andere voorziening of instrument meer geschikt is. De vaststelling, bedoeld in de eerste zin, geschiedt bij
      indicatiebeschikking.

      4 Het UWV verstrekt de subsidie slechts:

      a. indien naar het oordeel van het UWV reële behoefte bestaat aan de arbeid die op grond van de dienstbetrekking,
      bedoeld in het eerste lid, zal worden verricht en die arbeid geen additionele arbeid betreft;

      b. indien er naar het oordeel van het UWV een reëel uitzicht is op continuering van de dienstbetrekking voor ten
      minste zes maanden na afloop van de periode waarover de loonkostensubsidie wordt verstrekt, dan wel op een op die
      dienstbetrekking aansluitende dienstbetrekking van dezelfde of grotere omvang voor ten minste zes maanden; en

      c. indien ten behoeve van de niet-uitkeringsgerechtigde herbeoordeelde in de vijf jaar voorafgaand aan de
      indicatiebeschikking, bedoeld in het derde lid, niet eerder loonkostensubsidie op grond van deze regeling
      of het [Tijdelijk besluit brugbanen herbeoordeelden][ref4] is verstrekt en hij in die periode niet eerder
      werkzaamheden op een proefplaats als bedoeld in [artikel 65g van de WAO][ref5], [artikel 67e van de WAZ][ref6],
      [artikel 59h van de WAJONG][ref7] of [artikel 76a van de WW][ref8] heeft verricht.

      5 Onder additionele arbeid als bedoeld in het vierde lid, onderdeel a, wordt verstaan primair op de
      arbeidsinschakeling gerichte arbeid of het naast of in aanvulling op reguliere arbeid verrichten van werkzaamheden
      die niet leiden tot verdringing op de arbeidsmarkt.

      6 De subsidie bedraagt ten hoogste 50% van het wettelijk minimumloon, bedoeld in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref9] of, indien het een werknemer
      jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon, bedoeld in [artikel 7, derde lid][ref10],
      en [artikel 8, derde lid, van laatstgenoemde wet][ref11]. Het bedrag, bedoeld in de eerste zin, wordt naar
      evenredigheid verminderd, indien de overeengekomen arbeidsduur korter is dan de normale arbeidsduur, bedoeld in
      [artikel 12 van de Wet minimumloon en minimumvakantiebijslag][ref12].

      7 De subsidie kan voor maximaal twaalf maanden worden verstrekt.


