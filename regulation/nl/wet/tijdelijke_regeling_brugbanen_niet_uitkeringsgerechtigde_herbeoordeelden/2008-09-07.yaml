  - number: '4'
    text: |-
      Het maximaal beschikbare bedrag voor het verlenen van subsidie bedraagt voor de periode 1 februari 2008 tot en met
      31 december 2010 € 3,8 miljoen.
    url: https://wetten.overheid.nl/BWBR0023539/2008-09-07#Artikel4
  - number: '5'
    text: |-
      Indien de dienstbetrekking, bedoeld in [artikel 2, eerste lid][ref1], is aangegaan alvorens een aanvraag om
      subsidie voor loonkosten met betrekking tot die dienstbetrekking wordt ingediend, wordt de aanvraag om subsidie
      uiterlijk binnen drie maanden na de eerste dag van het verrichten van arbeid ingediend.


