  text: |-
    Gelet op de artikelen 3, eerste lid, en 8 van de Kaderwet SZW-subsidies en de artikelen 30, eerste lid, onderdeel
    i, en 77 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

