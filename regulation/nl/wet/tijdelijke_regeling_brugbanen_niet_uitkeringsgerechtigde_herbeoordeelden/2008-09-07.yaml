  - number: '6'
    text: In de uitvoering van deze regeling wordt voorzien door het UWV.
    url: https://wetten.overheid.nl/BWBR0023539/2008-09-07#Artikel6
  - number: '7'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door het Rijk.

      2 De middelen worden ter beschikking gesteld aan het UWV via de rekening-courant bij de Minister van Financiën, die
      het UWV op grond van [artikel 120, eerste lid, van de Wet financiering sociale verzekeringen][ref1] aanhoudt.

      3 [Artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] en
      [artikel 120, derde lid, van de Wet financiering sociale verzekeringen][ref3] zijn van overeenkomstige toepassing
      bij de uitvoering van deze regeling.

      4 Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.

      5 Met inachtneming van het zesde lid brengt het UWV de uitgaven voor de subsidies en de uitvoeringskosten in
      rekening bij de Minister.

      6 Uiterlijk op de vijftiende dag van de eerste maand van een kwartaal verstrekt het UWV aan de Minister een opgave
      van de gerealiseerde uitgaven verbonden aan de uitvoering van deze regeling over het afgelopen kwartaal. In deze
      opgave worden afzonderlijk vermeld:

      a. het totaalbedrag aan uitbetaalde subsidies op grond van deze regeling inclusief de uitgaven en ontvangsten die
      betrekking hebben op wettelijke rente, proceskosten en rentelasten, en

      b. het totaalbedrag aan gerealiseerde uitvoeringskosten op grond van deze regeling.

      7 Met als valutadag de vijftiende dag van de eerste maand van een kwartaal draagt de Minister de gerealiseerde
      uitgaven, bedoeld in het zesde lid, af aan het UWV. De Minister kan, na overleg met het UWV, van het bedrag aan
      gerealiseerde uitgaven afwijken.

      8 Uiterlijk op 1 juni en gelijktijdig met de afrekening, bedoeld in [artikel 5.34 van de Regeling Wfsv][ref4], van
      het Wajong-fonds, bedoeld in [artikel 5.23, onderdeel d, van de Regeling Wfsv][ref5], dient het UWV de afrekening
      over het afgelopen kalenderjaar bij de Minister in.

      9 In de afrekening maakt het UWV, op basis van de jaarrekening, bedoeld in
      [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6], de kasstroom inzichtelijk aan de
      Minister, met afzonderlijke vermelding van de subsidies op grond van deze regeling en de kosten verbonden aan de
      uitvoering van deze regeling.

      10 Op grond van de afrekening, bedoeld in het negende lid, vindt voor 15 juli een betaling plaats ten gunste of ten
      laste van het UWV.


