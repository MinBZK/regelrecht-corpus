  - number: '3'
    text: |-
      Indien de niet-uitkeringsgerechtigde herbeoordeelde, bedoeld in [artikel 2][ref1], ziekengeld ontvangt op grond
      van de [Ziektewet][ref2] wordt het, naar werkdagen herleide, aan de werkgever verstrekte subsidiebedrag, bedoeld in
      [artikel 2][ref3], verminderd met dit ziekengeld.


