articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - Minister: de Minister van Sociale Zaken en Werkgelegenheid;
        - niet-uitkeringsgerechtigde herbeoordeelde: de persoon: a. wiens arbeidsongeschiktheidsuitkering
      is ingetrokken als gevolg van de toepassing van [artikel 34, vierde lid, van de WAO][ref1],
      [artikel 35, vijfde lid, van de WAZ][ref2] of [artikel 28, vijfde lid, van de WAJONG][ref3] alsmede de persoon,
      bedoeld in [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref4],
      wiens arbeidsongeschiktheidsuitkering is ingetrokken; b. die op de dag voorafgaand aan de eerste
      dag van de dienstbetrekking met betrekking waartoe loonkostensubsidie wordt aangevraagd, geen
      uitkering ontvangt op grond van een wet waaraan uitvoering wordt gegeven door het UWV of de
      [Wet werk en bijstand][ref5]; en c. die op de dag voorafgaand aan de eerste dag van de dienstbetrekking
      met betrekking waartoe loonkostensubsidie wordt aangevraagd geen tegemoetkoming ontvangt op grond van de
      [Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten][ref6];
        - UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];
        - valutadag: de op de rekening-courantafschriften aangegeven dag van betaling;
        - WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref8];
        - WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9];
        - WAJONG: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref10].


