  - number: '5'
    text: |-
      1 [Artikel 4, eerste lid, onderdelen c, d en e][ref1], zijn niet van toepassing indien:

      a. de hoeveelheid beschikbare nuttige warmte of de warmtevraag, bij een afstand tussen de industriële installatie
      en het warmtenet of koudenet van meer dan één kilometer maar niet meer dan drie kilometer, minder dan 2500 GJ per
      jaar bedraagt;

      b. de hoeveelheid beschikbare nuttige warmte of de warmtevraag, bij een afstand tussen de industriële installatie
      en het warmtenet of koudenet van meer dan drie kilometer, minder dan 25000 GJ per jaar bedraagt.

      2 [Artikel 4, eerste lid][ref2], is niet van toepassing op:

      a. een inrichting als bedoeld in [artikel 15, aanhef en onder b, van de Kernenergiewet][ref3];

      b. een productie-installatie als bedoeld in [artikel 1, eerste lid, onder ah, van de Elektriciteitswet 1998][ref4],
      voor zover deze installatie een functie heeft als noodvoorziening en de opvang van piekverbruik en deze installatie
      in die hoedanigheid volgens plan minder dan 1500 bedrijfsuren per jaar, als voortschrijdend gemiddelde over een
      periode van vijf jaar, in bedrijf is;

      c. een installatie die dichtbij een CO-opslagcomplex als bedoeld in [artikel 1, onder s, van de Mijnbouwwet][ref5],
      waaraan op grond van [hoofdstuk 3 van de Mijnbouwwet][ref6] een opslagvergunning is verleend, dient te liggen.


