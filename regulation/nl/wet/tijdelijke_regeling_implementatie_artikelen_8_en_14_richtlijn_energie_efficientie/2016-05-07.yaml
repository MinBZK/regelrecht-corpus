      1 Het bevoegd gezag beoordeelt of aan de verplichtingen, bedoeld in de [artikelen 2][ref1] en [4][ref2], is
      voldaan. De Rijksdienst voor Ondernemend Nederland dient het bevoegd gezag hierbij zo nodig van advies.

      2 Het bevoegd gezag zendt jaarlijks voor 1 februari de door hem in het voorgaande kalenderjaar ontvangen verslagen
      van de energie-audit en resultaten van de kosten-batenanalyse aan de Rijksdienst voor Ondernemend Nederland.


