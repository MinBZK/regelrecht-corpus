  - number: '2'
    text: |-
      1 Degene die een onderneming drijft, draagt er zorg voor dat:

      a. de onderneming een energie-audit ondergaat die uiterlijk op 5 december 2015, en vervolgens ten minste elke vier
      jaar, wordt uitgevoerd;

      b. van de energie-audit een verslag wordt gemaakt.

      2 De uitvoering van de energie-audit voldoet aan de minimum-criteria, bedoeld in bijlage VI bij de richtlijn.

      3 Het verslag van de energie-audit bevat ten minste de volgende gegevens:

      a. een schematisch overzicht van alle binnen de onderneming bestaande energiestromen, de omvang en verdeling naar
      functie van die energiestromen en alle omzettingen naar andere energiedragers welke zijn gebaseerd op actuele,
      gemeten en traceerbare gegevens betreffende het energieverbruik en elektriciteitsbelastingprofielen;

      b. een beschrijving van de belangrijkste interne en externe factoren die het energieverbruik door de onderneming
      positief en negatief beïnvloeden;

      c. een gekwantificeerd overzicht van het energiebesparingspotentieel van de onderneming ten aanzien van de komende
      vier jaren;

      d. een beschrijving van mogelijke kosteneffectieve energiebesparingsmaatregelen.

      4 Het verslag van de energie-audit wordt binnen vier weken na de totstandkoming ervan toegezonden aan het bevoegd
      gezag.

      5 Het bevoegd gezag beoordeelt of aan de verplichtingen, bedoeld in het eerste tot en met het derde lid, is
      voldaan.
    url: https://wetten.overheid.nl/BWBR0036841/2016-05-07#Artikel2
  - number: '3'
    text: |-
      Van de verplichtingen, bedoeld in [artikel 2, eerste lid][ref1], is vrijgesteld degene die een onderneming drijft:

      a. en met die onderneming is toegetreden tot de Meerjarenafspraak energie-efficiëntie 2001–2020 of de
      Meerjarenafspraak energie-efficiëntie ETS-ondernemingen;

      b. en die een energiebeheersysteem als bedoeld in artikel 2, onder 11, van de richtlijn toepast dat volgens
      Europese of internationale normen is gecertificeerd en dat een energie-audit omvat die voldoet aan de minimum-
      criteria, bedoeld in bijlage VI bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0036841#Artikel2
