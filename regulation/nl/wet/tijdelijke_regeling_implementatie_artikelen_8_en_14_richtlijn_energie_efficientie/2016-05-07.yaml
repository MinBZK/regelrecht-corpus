    text: |-
      In deze regeling wordt verstaan onder:

      a. *energie-audit:* de energie-audit, bedoeld in artikel 2, onder 25, van de richtlijn;

      b. *Europese norm:* norm als bedoeld in artikel 2, onder 12, van de richtlijn;

      c. *hoogrenderende warmtekrachtkoppeling:* hoogrenderende warmtekrachtkoppeling als bedoeld in artikel 2, onder 34,
      van de richtlijn;

      d. *ingrijpende renovatie:* ingrijpende renovatie als bedoeld in artikel 2, onder 44, van de richtlijn, niet zijnde
      het aanbrengen van voorzieningen voor de afvang van door een verbrandingsinstallatie geproduceerde koolstofdioxide
      met het oog op geologische opslag als bepaald in [richtlijn 2009/31/EG](32009L0031) van het Europees Parlement en
      de Raad van 23 april 2009 (PbEU 2009, L 140);

      e. *inrichting:* inrichting als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1];

      f. *internationale norm:* norm als bedoeld in artikel 2, onder 13, van de richtlijn;

      g. *kosten-batenanalyse:* de kosten-batenanalyse, bedoeld in artikel 14, vijfde lid, van de richtlijn;

      h. *koudenet:* koudenet als bedoeld in
      [artikel 1, onder c, van de Wet implementatie EU-richtlijnen energie-efficiëntie][ref2];

      i. *nuttige warmte:* nuttige warmte als bedoeld in artikel 2, onder 32, van de richtlijn;

      j. *onderneming:* een inrichting als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref3], die
      tevens is aan te merken als een onderneming als bedoeld in titel I van de bijlage bij Aanbeveling 2003/361/EG
      van de Europese Commissie van 6 mei 2003 (PbEU 2003, L 124) en die niet tevens behoort tot de categorie kleine en
      middelgrote ondernemingen, bedoeld in artikel 2, onder 26, van de richtlijn;

      k. *richtlijn:* [richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU 2012,
      L 315);

      l. *stookinstallatie:* stookinstallatie als bedoeld in
      [artikel 1.1, eerste lid, van het Activiteitenbesluit milieubeheer][ref4];

      m. *warmtenet:* warmtenet als bedoeld in [artikel 1, onder c, van de Warmtewet][ref5].


