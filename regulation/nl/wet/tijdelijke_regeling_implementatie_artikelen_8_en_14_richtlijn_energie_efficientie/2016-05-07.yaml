  - number: '4'
    text: |-
      1 Degene die een inrichting drijft, voert een kosten-batenanalyse uit indien hij voornemens is:

      a. een nieuwe stookinstallatie voor elektriciteitsopwekking met een totaal thermisch inputvermogen van meer dan 20
      MW op te richten, teneinde de kosten en baten te berekenen van de werking van die installatie als een installatie
      met hoogrenderende warmtekrachtkoppeling;

      b. ten aanzien van een bestaande stookinstallatie voor elektriciteitsopwekking met een totaal nominaal thermisch
      inputvermogen van meer dan 20 MW een ingrijpende renovatie uit te voeren, teneinde de kosten en baten van het
      ombouwen van die installatie tot een installatie met hoogrenderende warmtekrachtkoppeling te berekenen;

      c. een nieuwe industriële stookinstallatie met een totaal thermisch inputvermogen van meer dan 20 MW die
      afvalwarmte op een bruikbare temperatuur genereert, op te richten, dan wel ten aanzien van een dergelijke
      installatie een ingrijpende renovatie toe te passen, teneinde de kosten en baten te berekenen van het gebruik van
      afvalwarmte om te voldoen aan een economisch aantoonbare vraag als bedoeld in artikel 2, onder 31, van de richtlijn
      naar warmte en van de aansluiting van die installatie op een warmtenet of koudenet;

      d. een nieuw warmtenet of koudenet op te richten, dan wel ten aanzien van een dergelijk net een ingrijpende
      renovatie toe te passen, teneinde de kosten en baten te berekenen van het gebruik van afvalwarmte uit nabijgelegen
      industriële installaties;

      e. in een warmtenet of koudenet een nieuwe stookinstallatie voor de productie van energie met een totaal thermisch
      inputvermogen van meer dan 20 MW op te richten, dan wel ten aanzien van een dergelijke installatie een ingrijpende
      renovatie toe te passen, teneinde de kosten en baten te berekenen van het gebruik van afvalwarmte uit nabijgelegen
      industriële installaties.

      2 De uitvoering van de kosten-batenanalyse voldoet aan de beginselen, bedoeld in deel 2 van bijlage IX bij de
      richtlijn.

      3 In afwijking van het eerste lid wordt een kosten-batenanalyse niet uitgevoerd indien uit een voorlopige analyse
      volgt dat uitvoering van de kosten-batenanalyse vermoedelijk niet tot resultaat heeft dat de som van de verwachte
      voordelen groter is dan de som van de verwachte kosten. Een voorlopige analyse omvat, waar van toepassing, een
      onderzoek naar:

      a. de aanwezigheid van in de nabijheid gelegen warmte- of koudenetten waarop zou kunnen worden aangesloten en de
      technische mogelijkheid daartoe;

      b. de beschikbare ruimte in een in de nabijheid gelegen warmte- of koudenet;

      c. de organisatorische, juridische en economische haalbaarheid van hoogrenderende warmtekrachtkoppeling, het
      gebruik van afvalwarmte of een aansluiting op een in de nabijheid gelegen warmte- of koudenet.

      4 Degene op wie een verplichting als bedoeld in het eerste lid rust, dient de resultaten
      van de kosten-batenanalyse in bij het bevoegd gezag, tezamen met de melding, bedoeld in
      [artikel 1.10 van het Activiteitenbesluit milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1.10
