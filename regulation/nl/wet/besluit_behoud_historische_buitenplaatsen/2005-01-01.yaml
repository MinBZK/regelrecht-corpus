---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_behoud_historische_buitenplaatsen
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-01-01'
bwb_id: BWBR0010610
url: https://wetten.overheid.nl/BWBR0010610/2005-01-01
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

            a
             beschermde historische buitenplaats:

              in het register, bedoeld in [artikel 6 van de Monumentenwet 1988][ref1] als zodanig vermeld of op de
      aangepaste lijst van de Subcommissie Buitenplaatsen van afdeling III, de Rijkscommissie voor de Monumenten van de
      Raad voor het Cultuurbeheer voorkomend complex waarin van oorsprong één of meer gebouwen een compositorisch geheel
      vormen met een tuin of met een park van tenminste 1 hectare, waarvan de aanleg dateert van vóór 1850 en herkenbaar
      aanwezig is;



            b
            particulier eigenaar:

              natuurlijke persoon die het recht van eigendom of een ander zakelijk recht heeft op een beschermde
      historische buitenplaats;
      naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid die voldoet aan de eisen, genoemd
      in [artikel 7a, eerste lid, onderdelen a tot en met c, en derde lid van de Natuurschoonwet 1928][ref2], en die het
      recht van eigendom of een ander zakelijk recht heeft op een beschermde historische buitenplaats;
      rechtspersoon die krachtens privaatrecht is ingesteld en die het recht van eigendom of een ander zakelijk recht op
      een beschermde historische buitenplaats heeft verkregen van een natuurlijk persoon als bedoeld onder 1 of van een
      vennootschap als bedoeld onder 2, en die zich uitsluitend of nagenoeg uitsluitend ten doel stelt die buitenplaats
      in stand te houden;



            c
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            d
             Stichting:

              Stichting tot behoud van Particuliere Historische Buitenplaatsen te Heerde, statutair gevestigd te ’s-
      Hertogenbosch.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel7a
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: 7a
  - number: '2'
    text: |-
      De aanvraag tot subsidieverlening voor projecten, bedoeld in
      [artikel 2 van de Kaderregeling subsidiëring natuurprojecten][ref1], kan worden ingediend voor het thema ’Behoud
      historische buitenplaatsen’.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel2
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '2'
  - number: '3'
    text: 'Subsidie kan worden verstrekt voor projecten die een bijdrage leveren:'
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel3
  - number: 3.a
    text: aan de instandhouding van beschermde historische buitenplaatsen toebehorend aan particuliere eigenaren;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel3
  - number: 3.b
    text: |-
      aan het vergroten en verbeteren van de kennis en de deskundigheid ten behoeve van het behoud van beschermde
      historische buitenplaatsen toebehorend aan particuliere eigenaren.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel3
  - number: '4'
    text: |-
      Voor het in [artikel 2][ref1] genoemde thema is voor het jaar 1999 een bedrag van f 3.337.411,- beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel2
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '2'
  - number: '5.1'
    text: |-
      Voor subsidieverlening komen in aanmerking projecten die beschermde historische buitenplaatsen betreffen waarvoor
      een door de minister goedgekeurd beheersplan voor een periode van tien jaren bestaat.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: '5.2'
    text: 'Het beheersplan, bedoeld in het eerste lid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: 5.2.a
    text: een inventarisatie van cultuurhistorische, tuin- en landschapsarchitectonische en natuur- en recreatieve waarden;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: 5.2.b
    text: |-
      een beheersvisie die aangeeft welke elementen van belang zijn voor de beschermde historische buitenplaats en de
      wijze waarop deze in stand moeten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: 5.2.c
    text: |-
      een meerjarenplanning ten behoeve van het reguliere en periodiek onderhoud van de beschermde historische
      buitenplaats.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      De aanvraag tot subsidieverlening gaat vergezeld van een verklaring dat werkzaamheden ten behoeve van projecten als
      bedoeld in [artikel 3, onderdeel a][ref1], verricht worden op beschermde historische buitenplaatsen waarvoor een
      beheersplan als bedoeld in het eerste lid aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel3
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '3'
  - number: '5.4'
    text: |-
      Indien een beheersplan als bedoeld in het eerste lid niet aanwezig is en bij de aanvraag genoegzaam is aangetoond
      dat een dergelijk plan daadwerkelijk in voorbereiding is, kan de minister in afwijking van het eerste lid subsidie
      verlenen. Het derde lid is in dit geval niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel5
  - number: '6'
    text: Subsidie wordt uitsluitend verleend aan de Stichting.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Werkzaamheden ten behoeve van projecten als bedoeld in [artikel 3, onderdeel a][ref1], worden alleen verricht
      indien daartoe een verzoek van de particulier eigenaar aan de Stichting gedaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel3
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '3'
  - number: '7.2'
    text: Aanvragen tot subsidieverlening gaan vergezeld van een kopie van een verklaring als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een subsidie voor projecten als bedoeld in [artikel 2][ref1] kan worden verleend voor de volgende met het project
      verband houdende kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel2
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '2'
  - number: 8.1.a
    text: loonkosten van het betrokken personeel in dienst van de Stichting;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: 8.1.b
    text: huisvestingskosten;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: 8.1.c
    text: kosten van verbruikte materialen of hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: 8.1.d
    text: aan derden verschuldigde kosten;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: 8.1.e
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: 8.1.f
    text: de voor de vaststelling van de subsidie benodigde accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      De kosten, bedoeld in het eerste lid, worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting
      indien de aanvrager de omzetbelasting niet kan verrekenen met de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Voorzover een subsidie verleend wordt voor kosten waarvan de hoogte afhankelijk is van de lonen wordt de subsidie
      ieder jaar gecorrigeerd voor inflatie op basis van het consumentenprijsindexcijfer alle huishoudens zoals
      laatstelijk in het betreffende jaar is gepubliceerd door het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel8
  - number: '9.1'
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel9
  - number: 9.1.a
    text: |-
      voor projecten als bedoeld in [artikel 3, onderdeel a][ref1], € 13.600,- (f 29.970,46) per beschermde historische
      buitenplaats waarvoor een beheersplan als bedoeld in [artikel 5, eerste lid][ref2], aanwezig is dan wel bij de
      aanvraag genoegzaam is aangetoond dat een dergelijk beheersplan daadwerkelijk in voorbereiding is;


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010610#Artikel5
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010610
        artikel: '5'
  - number: 9.1.b
    text: |-
      voor projecten als bedoeld in [artikel 3, onderdeel b][ref1], € 1.361,34 per aangesloten beschermde historische
      buitenplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel3
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '3'
  - number: '9.2'
    text: |-
      De minister kan voor beschermde historische buitenplaatsen waarop het beheer arbeidsintensief is, afwijken van de
      maximale subsidiebedragen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel9
  - number: '10'
    text: |-
      De Stichting draagt er zorg voor dat op ten minste 80% van het aantal beschermde historische buitenplaatsen
      waarvoor beheersplannen als bedoeld in [artikel 5, eerste lid][ref1], aanwezig zijn of aantoonbaar in voorbereiding
      zijn, hovenierswerk wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel5
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '5'
  - number: '11'
    text: |-
      De Stichting draagt er zorg voor dat de te subsidiëren activiteiten conform de aanwezige of aantoonbaar in
      voorbereiding zijnde beheersplannen uitgevoerd worden.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien voor een project waarvoor op grond van dit besluit subsidie is verleend, andere subsidies door de
      rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van dit besluit verstrekt, dat de som van
      de subsidies het in [artikel 9][ref1] genoemde bedrag niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0010610#Artikel9
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010610
        artikel: '9'
  - number: '12.2'
    text: |-
      Indien voor een project waarvoor op grond van dit besluit subsidie is verleend, subsidies door anderen dan de
      rijksoverheid dan wel financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een zodanig
      bedrag op grond van dit besluit verstrekt, dat de som van de subsidies dan wel de financiële middelen niet meer
      bedraagt dan 100% van de totale kosten van het project.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel12
  - number: '13.1'
    text: |-
      De aanvraag tot subsidieverlening wordt ingediend vóór 1 november voorafgaand aan het jaar waarvoor de subsidie
      wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel13
  - number: '13.2'
    text: De minister kan nadere aanvraagperioden vaststellen.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      In afwijking van [artikel 3, derde lid, van de Kaderregeling subsidiëring natuurprojecten][ref1] kan de minister
      in geval van toepassing van het tweede lid voor de daar bedoelde aanvraagperioden een subsidieplafond vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel3
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '3'
  - number: '13.4'
    text: De minister geeft van de besluiten, bedoeld in het tweede en derde lid, kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel13
  - number: '13.5'
    text: In afwijking van het eerste lid wordt de aanvraag voor 1999 ingediend vóór 23 juli 1999.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen. Bij de aanvraag
      wordt gebruik gemaakt van het daarvoor beschikbare aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel14
  - number: '15.1'
    text: |-
      Bij de bescheiden die in het kader van [artikel 4:45, tweede lid, van de Algemene wet bestuursrecht][ref1] bij de
      aanvraag tot subsidievaststelling worden verstrekt, wordt tevens melding gedaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 15.1.a
    text: het aantal beschermde historische buitenplaatsen dat bij de Stichting is aangesloten en
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel15
  - number: 15.1.b
    text: |-
      het aantal beschermde historische buitenplaatsen waarvoor een beheersplan is aanwezig is dan wel aantoonbaar in
      voorbereiding is.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel15
  - number: '15.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, onderdelen a en b, gaan in ieder geval vergezeld van een verklaring van een
      accountant als bedoeld 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit behoud historische buitenplaatsen.'
    url: https://wetten.overheid.nl/BWBR0010610/2005-01-01#Artikel17
