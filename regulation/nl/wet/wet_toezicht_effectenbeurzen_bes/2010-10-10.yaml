  - number: '10'
    text: |-
      1 Gegevens en inlichtingen omtrent afzonderlijke ondernemingen en instellingen die ingevolge [artikel 16][ref1] of
      [artikel 7, tweede lid][ref2], zijn verkregen, zijn geheim.

      2 Een ieder die is betrokken bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028366#Artikel7
