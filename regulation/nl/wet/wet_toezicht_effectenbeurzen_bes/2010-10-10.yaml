  - number: '7'
    text: |-
      1 De Autoriteit Financiële Markten is, in afwijking van [artikel 10][ref1], bevoegd gegevens en inlichtingen,
      verkregen bij de uitvoering van deze wet, te verstrekken aan het bevoegd gezag dat in andere delen van het
      Koninkrijk of in andere staten met het toezicht op het effectenwezen is belast, mits de geheimhouding van deze
      gegevens en inlichtingen in voldoende mate is verzekerd.

      2 De Autoriteit Financiële Markten is, voor zover dat voor de vervulling van haar taak redelijkerwijs nodig is,
      bevoegd gegevens en inlichtingen te vragen bij het bevoegd gezag dat in andere delen van het Koninkrijk of in
      andere staten met het toezicht op het effectenwezen is belast.

      3 Voor zover het verstrekken van gegevens en inlichtingen, bedoeld in het eerste lid, of het vragen van gegevens
      en inlichtingen, bedoeld in het tweede lid, verband houdt met handel met voorwetenschap, hanteert de Autoriteit
      Financiële Markten voor zover mogelijk de regels, opgenomen in het Verdrag inzake handel met voorkennis
      (Straatsburg 20 april 1989, Trb. 1993, 111).


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel10
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel7
    references:
      - id: ref1
