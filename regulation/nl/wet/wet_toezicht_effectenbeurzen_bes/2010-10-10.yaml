  - number: '6'
    text: |-
      1 Van het verlenen of het intrekken van een vergunning als bedoeld in [artikel 2, eerste lid][ref1], wordt door
      Onze Minister mededeling gedaan in de Staatscourant.

      2 Met het oog op een adequate functionering van de effectenmarkten en de positie van de beleggers op die markten
      is de Autoriteit Financiële Markten, voor zover nodig in afwijking van [artikel 10][ref2], bevoegd in voorkomende
      gevallen ter openbare kennis te brengen, dat:

      a. de houder van een effectenbeurs niet over een vergunning als bedoeld in [artikel 2, eerste lid][ref3], beschikt,
      of

      b. een vergunning als bedoeld in [artikel 2, eerste lid][ref4], is geweigerd.

      c. een vergunning als bedoeld in [artikel 2, eerste lid][ref5], al dan niet tijdelijk, is ingetrokken.


