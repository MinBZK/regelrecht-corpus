  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *effecten:*

      1°. aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, optiebewijzen, warrants en soortgelijke
      waardepapieren;

      2° rechten van deelgenootschap, opties, rechten op overdracht op termijn van zaken, inschrijvingen in aandelen- en
      schuldregisters en soortgelijke, al dan niet voorwaardelijke, rechten;

      3° rechten uit overeenkomsten tot verrekening van een koers- of prijsverschil en soortgelijke verhandelbare rechten
      en waarden;

      4° certificaten en recepissen van waarden als hiervoor bedoeld, met uitzondering van waarden die uitsluitend het
      karakter van betaalmiddel dragen en appartementsrechten;

      b. *effectenbedrijf:* de natuurlijke of rechtspersoon, die beroeps- of bedrijfsmatig bemiddelt of handelt in
      effecten, dan wel in het kader van vermogensbeheer voor rekening van een ander transacties in effecten verricht;

      c. *effectenbeurs:* een aan regels onderworpen markt die bestemd is voor het bijeenbrengen van vraag en aanbod
      van effecten;

      d. *voorwetenschap:* de bekendheid met een bijzonderheid omtrent de rechtspersoon, vennootschap of instelling
      waarop effecten betrekking hebben of omtrent de handel in effecten:

      1° die niet openbaar is gemaakt, en

      2° waarvan openbaarmaking, naar redelijkerwijs is te verwachten, invloed zou kunnen hebben op de koers van de
      effecten, ongeacht de richting van die koers;

      e. *Onze Minister:* Onze Minister van Financiën;

      f. *Autoriteit Financiële Markten:* Stichting Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden een effectenbeurs te houden zonder een daartoe door Onze Minister verleende vergunning.

      2 Het verzoek om vergunning wordt schriftelijk aan Onze Minister gericht onder overlegging van de gegevens die
      nodig zijn om te beoordelen of aan de in het derde lid bedoelde vereisten wordt voldaan.

      3 De vergunning wordt, gehoord de Autoriteit Financiële Markten, verleend indien het houden van de effectenbeurs,
      de voor de effectenbeurs te hanteren regels en hun toepassing, en de controle op de naleving van die regels zullen
      voldoen aan hetgeen nodig is met het oog op een adequate functionering van de effectenmarkten en de positie van de
      beleggers op die markten.

      4 Met het oog op een adequate functionering van de effectenmarkten en de positie van de beleggers op die markten:

      a. kan de vergunning onder beperkingen worden verleend;

      b. kunnen aan de vergunning voorschriften worden verbonden.

      5 Onze Minister kan op verzoek geheel of gedeeltelijk ontheffing verlenen van het eerste lid, indien de verzoeker
      aantoont dat de doeleinden die deze wet beoogt te bereiken, anderszins worden bereikt.
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden de regels of de controle, bedoeld in [artikel 2, derde lid][ref1], te wijzigen zonder dat de
      houder van de desbetreffende effectenbeurs een daartoe strekkende goedkeuring door Onze Minister, gehoord de
      Autoriteit Financiële Markten, heeft verkregen.

      2 De Autoriteit Financiële Markten kan met het oog op een adequate functionering van de effectenmarkten en
      de positie van de beleggers op die markten alsmede ter uitvoering van internationale afspraken en verdragen,
      aanwijzingen geven aan de houder van een effectenbeurs met betrekking tot de voor die effectenbeurs te hanteren
      regels, hun toepassing, en de controle op de naleving van deze regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel2
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel3
