  - number: '4'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 2, eerste lid][ref1], is verplicht periodiek aan de
      Autoriteit Financiële Markten gegevens te verstrekken die de Autoriteit Financiële Markten redelijkerwijs voor de
      vervulling van haar taak nodig heeft, overeenkomstig door de Autoriteit Financiële Markten te geven aanwijzingen
      met betrekking tot de inhoud van bedoelde gegevens en met betrekking tot de frequentie waarin en de wijze waarop
      die gegevens worden verstrekt.

      2 Alvorens de in het eerste lid bedoelde aanwijzingen te geven, stelt de Autoriteit Financiële Markten de houder
      van de vergunning op wie de aanwijzingen betrekking hebben, in de gelegenheid daaromtrent te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel2
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028366
        artikel: '2'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Onze Minister kan, gehoord de Autoriteit Financiële Markten, een vergunning als bedoeld in
      [artikel 2, eerste lid][ref1], tijdelijk, gedurende een door hem te bepalen periode, dan wel definitief intrekken,
      indien door de vergunninghouder:

      a. voor het houden van de desbetreffende effectenbeurs onvoldoende waarborgen worden geboden met het oog op een
      adequate functionering van de effectenmarkten of de positie van de beleggers op die markten;

      b. niet of niet genoegzaam de beperkingen of voorschriften, bedoeld in [artikel 2, vierde lid][ref2], worden
      nageleefd;

      c. het in [artikel 3, eerste lid][ref3], vervatte verbod, wordt overtreden;

      d. niet of niet genoegzaam de op grond van [artikel 3, tweede lid][ref4], gestelde aanwijzingen worden nageleefd;

      e. niet of niet genoegzaam het in [artikel 4, eerste lid][ref5], vervatte voorschrift wordt nageleefd.

      2 De liquidatie van de effectenbeurs waarvan de vergunning is ingetrokken, wordt onder toezicht en volgens de
      aanwijzingen van de Autoriteit Financiële Markten uitgevoerd.


