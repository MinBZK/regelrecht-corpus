  - number: 12a
    text: |-
      De Autoriteit Financiële Markten verstrekt Onze Minister desgevraagd de gegevens of inlichtingen die deze behoeft
      om zich over de uitvoering van deze wet in de praktijk of over de uitvoerbaarheid van beleidsvoornemens of
      voorgenomen wettelijke voorschriften een oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel12a
  - number: '13'
    text: |-
      1 Van een beslissing van de houder van een effectenbeurs omtrent de toelating van effecten tot of het doen
      vervallen van effecten uit de notering aan die effectenbeurs, staat voor belanghebbenden beroep open bij de
      Autoriteit Financiële Markten.

      2 Indien de houder van een effectenbeurs niet binnen zes maanden na ontvangst van een aanvraag om toelating tot
      de officiële notering of – indien hij om nadere gegevens heeft verzocht – binnen zes maanden na ontvangst van die
      gegevens op de aanvraag heeft beslist, wordt het uitblijven van een beslissing met een afwijzing gelijkgesteld.

      3 Het beroep moet worden ingesteld binnen een termijn van zes weken, gerekend vanaf de datum van de bekendmaking
      van de beslissing van de houder van de desbetreffende effectenbeurs.

      4 Het beroep heeft geen schorsende werking.

      5 De Autoriteit Financiële Markten neemt ter zake geen beschikking dan na de houder van de desbetreffende
      effectenbeurs en de belanghebbende in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Degene die rechtstreeks in zijn belang wordt getroffen door een op grond van [artikel 13][ref1] door de Autoriteit
      Financiële Markten gegeven beschikking, kan tegen de beschikking beroep instellen bij het Gerecht in eerste aanleg
      van Bonaire, Sint Eustatius en Saba binnen zes weken na de dag waarop deze is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel13
