  - number: '15'
    text: |-
      1 Handelen in strijd met op grond van [artikel 3, tweede lid][ref1] gegeven aanwijzingen,
      [artikel 4, eerste lid][ref2], en [artikel 10, tweede lid][ref3], is, voor zover niet opzettelijk begaan, een
      overtreding en wordt gestraft met hechtenis van ten hoogste een jaar of met een geldboete van de vijfde categorie.

      2 Handelen in strijd met op grond van [artikel 3, tweede lid][ref4] gegeven aanwijzingen,
      [artikel 4, eerste lid][ref5], en [artikel 10, tweede lid][ref6], is, voor zover opzettelijk begaan, een misdrijf
      en wordt gestraft met een gevangenisstraf van ten hoogste vier jaren of met een geldboete van de vijfde categorie.

      3 Overtreding van het in de [artikelen 2, eerste lid][ref7], en [artikel 3, eerste lid][ref8], gestelde verbod
      is een misdrijf en wordt gestraft met een gevangenisstraf van ten hoogste vier jaren of met een geldboete van de
      vijfde categorie.

      4 Overtreding van het in de [artikelen 8, eerste lid][ref9], en [artikel 9, eerste lid][ref10], gestelde verbod is
      een misdrijf en wordt gestraft hetzij met een gevangenisstraf van ten hoogste vier jaren, hetzij met een geldboete
      van de vijfde categorie, hetzij met beide straffen.


