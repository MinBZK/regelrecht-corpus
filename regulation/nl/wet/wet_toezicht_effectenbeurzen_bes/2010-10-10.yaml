  - number: '11'
    text: |-
      1 De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een
      vergoeding verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.

      2 Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet. Bij de maatregel kan worden bepaald dat die kosten mede ten
      laste komen van de aan een effectenbeurs verbonden effectenbedrijven.
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel11
  - number: '12'
    text: |-
      1 De Autoriteit Financiële Markten stelt jaarlijks een begroting, een jaarrekening en een jaarverslag op
      terzake van de haar op grond van deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De
      [artikelen 1:30 tot en met 1:33][ref1], [1:35][ref2] en [1:36 van de Wet op het financieel toezicht][ref3] zijn van
      overeenkomstige toepassing.

      2 Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening staat geen beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel130
