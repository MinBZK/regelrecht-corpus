        artikel: '10'
        hoofdstuk: V
  - number: '8'
    text: |-
      1 Het is een ieder verboden om, beschikkende over voorwetenschap, in of vanuit de openbare lichamen Bonaire, Sint
      Eustatius en Saba een transactie te verrichten of te bewerkstelligen in:

      a. effecten die zijn genoteerd aan een effectenbeurs voor het houden waarvan een vergunning als bedoeld in
      [artikel 2, eerste lid][ref1], is verleend dan wel aan een buiten de openbare lichamen Bonaire, Sint Eustatius en
      Saba gevestigde en van overheidswege toegelaten effectenbeurs of effecten waarvan aannemelijk is dat deze spoedig
      aan een zodanige beurs zullen worden genoteerd; of

      b. effecten waarvan de waarde mede wordt bepaald door de waarde van onder a bedoelde effecten.

      2 Het verbod van het eerste lid is niet van toepassing:

      a. op de tussenpersoon die, slechts over voorwetenschap beschikkend met betrekking tot de handel, volgens de regels
      van de goede trouw handelt ter bediening van opdrachtgevers.

      b. op de rechtspersoon, vennootschap of instelling waarvan de werknemers die zijn betrokken bij het verrichten of
      bewerkstelligen van de transactie slechts beschikken over voorwetenschap met betrekking tot de handel; en

      c. op degene die een transactie verricht of bewerkstelligt ter nakoming van een opeisbare verbintenis die reeds
      bestond op het tijdstip waarop hij kennis kreeg van de in het tweede lid bedoelde bijzonderheid.

      3 Bij algemene maatregel van bestuur kunnen categorieën van transacties worden aangewezen, waarop het in het eerste
      lid bedoelde verbod niet van toepassing is, Daarbij kan binnen een aan te wijzen categorie onderscheid worden
      gemaakt naar de personen door wie en de omstandigheden waaronder de transacties worden verricht of bewerkstelligd.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel2
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028366
        artikel: '2'
        hoofdstuk: II
  - number: '9'
    text: |-
      1 Het is een ieder die beschikt over voorwetenschap omtrent een rechtspersoon, vennootschap of
      instelling als bedoeld in [artikel 1, onder d][ref1], of omtrent de handel in effecten als bedoeld in
      [artikel 8, eerste lid][ref2], die op die rechtspersoon, vennootschap of instelling betrekking hebben, verboden om,
      anders dan in de normale uitoefening van zijn werk, beroep of functie:

      a. deze voorwetenschap aan een derde mee te delen, of

      b. een derde aan te bevelen transacties te verrichten of te bewerkstelligen in die effecten.

      2 Het verbod, bedoeld in het eerste lid, aanhef en onder b, is niet van toepassing op de rechtspersoon,
      vennootschap of instelling, waarvan de werknemers die zijn betrokken bij het aanbevelen niet over voorwetenschap
      beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0028366#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028366#Artikel8
    url: https://wetten.overheid.nl/BWBR0028366/2010-10-10#Artikel9
