  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder werkloze werknemer de persoon die werkloos is
      en de leeftijd van 65 jaar nog niet heeft bereikt en:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
  - number: 2.a
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
  - number: 2.a.1°
    text: na het bereiken van de leeftijd van 50 jaar werkloos is geworden;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
  - number: 2.a.2°
    text: |-
      in verband met die werkloosheid recht heeft gekregen op een uitkering op grond van
      [hoofdstuk II van de Werkloosheidwet][ref1] met een duur van meer dan drie maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 2.a.3°
    text: |-
      nadien de volledige uitkeringsduur, bedoeld in [hoofdstuk II van de Werkloosheidswet][ref1], inclusief
      een eventuele verlenging van deze duur op grond van [artikel 76 van die wet][ref2], heeft bereikt,
      tenzij op dat tijdstip een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref3] van toepassing is; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '27'
  - number: 2.b.1°
    text: |-
      die na het bereiken van de leeftijd van 50 jaar recht heeft gekregen op een
      loongerelateerde werkhervattingsuitkering gedeeltelijk arbeidsongeschikten als bedoeld in
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: 2.b.2°
    text: |-
      wiens recht op werkhervattingsuitkering gedeeltelijk arbeidsongeschikten nadien is geëindigd omdat zijn mate van
      arbeidsongeschiktheid niet langer ten minste 35% bedraagt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel2
  - number: '3.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.1.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.1.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.1.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '3.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.2.a
    text: |-
      als echtgenoot aangemerkt degene die niet duurzaam gescheiden leeft van de werkloze werknemer met wie hij gehuwd
      is;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.2.b
    text: |-
      als echtgenoot mede aangemerkt de niet met de werkloze werknemer gehuwde persoon met wie de werkloze werknemer een
      gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in de
      tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '3.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee meerderjarigen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '3.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht als de belanghebbenden hun hoofdverblijf hebben
      in dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.4.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: 3.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '3.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel3
  - number: '4'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4
  - number: 4.a
    text: |-
      thuisinwonende werkloze werknemer: de niet gehuwde dan wel duurzaam gescheiden levende werkloze werknemer van 18
      tot en met 20 jaar, die behoort tot het huishouden van zijn ouder(s) of pleegouder(s) en die niet een gezamenlijke
      huishouding voert als bedoeld in [artikel 3, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
  - number: 4.b
    text: |-
      alleenstaande werkloze werknemer: de niet gehuwde dan wel duurzaam gescheiden levende werkloze werknemer, die niet
      een gezamenlijke huishouding voert als bedoeld in [artikel 3, derde lid][ref1], tenzij het betreft een bloedverwant
      in de eerste graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in de tweede
      graad sprake is van zorgbehoefte, en die niet is een thuisinwonende werkloze werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
  - number: 4.c
    text: |-
      kind: het kind jonger dan 18 jaar, dat niet als eigen kind, aangehuwd kind of pleegkind tot het huishouden
      van een ander dan de werkloze werknemer behoort en voor wie de werkloze werknemer op grond van de
      [Algemene kinderbijslagwet][ref1] kinderbijslag ontvangt dan wel zal ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 4a.1
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4a
  - number: 4a.1.a
    text: |-
      arbeidsinschakeling: het verkrijgen van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een
      voorziening als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: 4a.1.b
    text: |-
      sociale activering: het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4a
  - number: 4a.1.c
    text: |-
      startkwalificatie: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref1] of
      een diploma hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 7][ref2] onderscheidenlijk [8 van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
  - number: 4a.2
    text: |-
      Voor de toepassing van deze wet wordt niet als algemeen geaccepteerde arbeid beschouwd arbeid op grond van een
      dienstbetrekking als bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2]. Voor de
      toepassing van de [artikelen 34 tot en met 36][ref3] wordt voor personen die blijkens een indicatiebeschikking of
      herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref4] onder een voorziening
      gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van arbeid in een
      dienstbetrekking als bedoeld in de [artikelen 2][ref5] en [7 van die wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0008903
      [ref5]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0008903
      - id: ref5
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0008903
        artikel: '7'
  - number: '5.1'
    text: |-
      Recht op uitkering hebben, indien het inkomen per maand minder bedraagt dan de overeenkomstig het derde, vierde en
      vijfde lid vastgestelde grondslag:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.1.a
    text: de werkloze werknemer en de echtgenoot met of zonder kinderen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.1.b
    text: de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer met een of meer kinderen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.1.c
    text: de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer zonder kinderen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.2'
    text: |-
      Het recht op uitkering komt de werkloze werknemer en de echtgenoot gezamenlijk toe. De uitkering wordt aan de
      werkloze werknemer en de echtgenoot ieder voor de helft uitbetaald, dan wel op hun gezamenlijk verzoek aan een van
      hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.3'
    text: 'De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.3.a
    text: |-
      voor de werkloze werknemer en de echtgenoot die beiden 21 jaar of ouder zijn, de helft van de grondslag netto
      gelijk is aan € 647,54;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.3.b
    text: |-
      deze voor de werkloze werknemer en de echtgenoot, waarvan een of elk van beiden jonger dan 21 jaar is, de som
      bedraagt van de grondslagen die voor elk van hen als een alleenstaande werknemer of een thuisinwonende werkloze
      werknemer zou gelden doch ten hoogste de grondslag als bedoeld in onderdeel *a*.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.4'
    text: 'De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.4.a
    text: |-
      voor de alleenstaande werkloze werknemer van 21 jaar of ouder met een of meer kinderen netto gelijk is aan €
      1.165,56;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.4.b
    text: voor de alleenstaande werkloze werknemer van 23 jaar of ouder zonder kinderen netto gelijk is aan € 906,55;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.4.c
    text: voor de alleenstaande werkloze werknemer van 22 jaar zonder kinderen netto gelijk is aan € 744,68;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.4.d
    text: voor de alleenstaande werkloze werknemer van 21 jaar zonder kinderen netto gelijk is aan € 652,85.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.5'
    text: 'De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.5.a
    text: |-
      voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan €
      1.130,40;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.5.b
    text: |-
      voor de thuisinwonende werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan
      € 847,22;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.5.c
    text: voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar zonder kinderen netto gelijk is aan € 628,00;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: 5.5.d
    text: voor de thuisinwonende werkloze werknemer zonder kinderen netto gelijk is aan € 344,82.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.6'
    text: |-
      De in het derde lid, onderdeel a, vierde lid, onderdeel a en b, en vijfde lid, genoemde bedragen worden gewijzigd
      met ingang van de dag waarop het netto minimumloon wijzigt met het percentage van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '5.7'
    text: |-
      De in het vierde lid, onderdeel c en d, genoemde bedragen worden gewijzigd met ingang van de dag waarop het netto
      minimumjeugdloon wijzigt met het percentage van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel5
  - number: '6.1'
    text: 'Geen recht op uitkering heeft de werkloze werknemer die:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
  - number: 6.1.a
    text: buiten Nederland woont of aldaar anders dan tijdelijk verblijf houdt;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
  - number: 6.1.b
    text: |-
      niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.1.c
    text: die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
  - number: 6.1.d
    text: |-
      onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die met
      die persoon gehuwd is, ter hoogte van het bedrag van het verlies van inkomen uit arbeid als gevolg van het
      genieten van dat verlof, tenzij belanghebbende alleenstaande ouder is en hij verlof geniet als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '6.2'
    text: |-
      Geen recht op uitkering heeft de echtgenoot, indien ten aanzien van deze, dan wel ten aanzien van de werkloze
      werknemer zich een omstandigheid voordoet als omschreven in het eerste lid. Indien zich ten aanzien van de
      echtgenoot een omstandigheid voordoet als omschreven in het eerste lid, wordt de werkloze werknemer aangemerkt
      als alleenstaande.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan die
      bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], recht op uitkering hebben,
      onverminderd de overige vereisten voor dat recht:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.3.a
    text: ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
  - number: 6.3.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.4'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '7'
    text: |-
      Indien het recht op uitkering als gevolg van werkaanvaarding van de werkloze werknemer of de echtgenoot is
      geëindigd, en vervolgens opnieuw werkloosheid ontstaat, herleeft het recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel7
  - number: '8.1'
    text: 'Als inkomen wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel8
  - number: 8.1.a
    text: |-
      voor de werkloze werknemer en de echtgenoot: de som van het inkomen uit of in verband met arbeid in het bedrijfs-
      en beroepsleven van hemzelf en van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel8
  - number: 8.1.b
    text: |-
      voor de alleenstaande en de thuisinwonende werkloze werknemer: zijn inkomen uit of in verband met arbeid in het
      bedrijfs- en beroepsleven.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel8
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere en zonodig afwijkende regels gesteld met betrekking tot het
      inkomen, bedoeld in het eerste lid. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot de
      vaststelling van het inkomen, bedoeld in het eerste lid, alsmede de periode waarop die vaststelling betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel8
  - number: '9.1'
    text: De uitkering bedraagt het verschil tussen de van toepassing zijnde grondslag en het inkomen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel9
  - number: '9.2'
    text: |-
      In de in het eerste lid bedoelde uitkering is begrepen een vakantie-uitkering ter hoogte van 8/108 van die
      uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, wordt de in het
      tweede lid genoemde verhouding dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '9.4'
    text: |-
      Indien de hoogte van de uitkering vastgesteld op grond van [artikel 47 van de Werkloosheidswet][ref1] en de toeslag
      op grond van [artikel 8, vierde lid, van de Toeslagenwet][ref2], gezamenlijk minder bedroeg dan de uitkering
      bedoeld in het eerste en tweede lid, wordt de uitkering vastgesteld op dat lagere bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '8'
  - number: '9.5'
    text: |-
      Het vierde lid is niet van toepassing, voor zover het recht op uitkering op grond van de [Werkloosheidswet][ref1]
      gedeeltelijk is geëindigd door het verrichten van werkzaamheden als lid van de Eerste Kamer der Staten-Generaal,
      van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam dat bij rechtstreekse verkiezing wordt
      samengesteld, of van een algemeen bestuur van een waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '10.1'
    text: |-
      Op de uitkering wordt een bedrag ingehouden dat gelijk is aan het bedrag van de premie dat een werkgever op
      grond van [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1] op het overeenkomstige loon van een
      werknemer, die verzekerd is op grond van die wet, inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '10.2'
    text: |-
      Indien ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1] een premie wordt ingehouden
      waarvan het percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur
      te stellen regels bij ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      Onze Minister kan nadere en zo nodig afwijkende regels stellen met betrekking tot de berekening van de op grond van
      het eerste lid op de aldaar bedoelde uitkering in te houden bedragen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel10
  - number: '11'
    text: |-
      Het recht op uitkering bestaat jegens het college van de gemeente waar de belanghebbende woonplaats heeft als
      bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: 11a.1
    text: |-
      Een aanvraag is gericht tot burgemeester en wethouders en wordt overeenkomstig
      [artikel 30c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend
      bij het Uitvoeringsinstituut werknemersverzekeringen. Na de overdracht van de aanvraag door
      de het Uitvoeringsinstituut werknemersverzekeringen aan burgemeester en wethouders ingevolge
      [artikel 30c, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag
      verder behandeld door burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 11a.2
    text: |-
      De gemeenteraad kan, in overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede lid, bij het Uitvoeringsinstituut
      werknemersverzekeringen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel11a
  - number: '12.1'
    text: |-
      Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en deze van
      oordeel zijn dat zij evenmin de aanvraag dienen te behandelen, terwijl er geen zekerheid kan worden verkregen over
      de in [artikel 11][ref1] bedoelde woonplaats, draagt het college die de doorgezonden aanvraag hebben ontvangen, er
      zorg voor dat het geschil aanhangig wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '12.2'
    text: |-
      In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      uitkering jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel12
  - number: '12.3'
    text: |-
      Het[ eerste lid van artikel 16][ref1] is van overeenkomstige toepassing, met dien verstande dat de daar genoemde
      termijn begint te lopen vanaf de mededeling van die doorzending of beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel16
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '16'
        hoofdstuk: II
        paragraaf: '3'
  - number: '12.4'
    text: Uitkeringskosten verleend ingevolge het tweede lid worden vergoed door de gemeente waarvan de taak is waargenomen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel12
  - number: '13.1'
    text: |-
      De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling en het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag van
      de uitkering dat aan hem wordt betaald. De verplichting geldt niet indien die feiten en omstandigheden door
      burgemeester en wethouders kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek
      aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij
      ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel13
  - number: '13.2'
    text: |-
      De belanghebbende is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel13
  - number: '13.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '13.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '14.1'
    text: |-
      Onverminderd
      [artikel 30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepalen burgemeester en wethouders welke gegevens ten behoeve van de verlening van de uitkering dan wel de
      voortzetting daarvan door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden
      overgelegd, alsmede de wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt. De gegevens en
      bewijsstukken worden door burgemeester en wethouders niet verkregen van de belanghebbende voor zover ze zijn
      verkregen door het Uitvoeringsinstituut werknemersverzekeringen dan wel voor zover zij verkregen kunnen worden uit
      de polisadministratie, bedoeld in [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      de verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref3], alsmede uit de gemeentelijke
      basisadministratie persoonsgegevens, tenzij hierdoor een goede vervulling van de taak van burgemeester en
      wethouders op grond van dit artikel wordt belet of bij wettelijk voorschrift anders is bepaald. Bij of krachtens
      algemene maatregel van bestuur kunnen andere administraties worden aangewezen waarvoor de tweede zin van toepassing
      is, worden regels gesteld over de gegevens die het betreft en kunnen administraties worden aangewezen waarvoor de
      tweede zin tijdelijk niet van toepassing is. Indien het authentieke gegevens uit andere basisregistraties betreft,
      is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
  - number: '14.2'
    text: |-
      Het college onderzoekt de juistheid en volledigheid van de verkregen gegevens en stellen zonodig een onderzoek in
      naar andere gegevens die voor de vaststelling van het recht op uitkering noodzakelijk zijn. Indien het onderzoek
      daartoe aanleiding geeft besluit het college tot herziening van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
  - number: '14.3'
    text: |-
      Het college verricht regelmatig een heronderzoek naar de voor het recht op uitkering van belang zijnde gegevens.
      Het heronderzoek strekt zich mede uit tot de naleving van de aan de uitkering verbonden verplichtingen. Het college
      beoordeelt tevens of er aanleiding bestaat de verplichtingen aan te vullen dan wel te wijzigen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
  - number: '14.4'
    text: |-
      Het in het tweede en derde lid bedoelde onderzoek omvat, tenzij op grond van [artikel 37a][ref1] ontheffing is
      verleend van de verplichtingen gericht op inschakeling in de arbeid in dienstbetrekking, mede een onderzoek naar de
      mogelijkheden van de belanghebbende om door arbeid zelfstandig in het bestaan te voorzien alsmede de wijze waarop
      deze mogelijkheden kunnen worden vergroot.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 37a
        hoofdstuk: III
  - number: '14.5'
    text: |-
      Bij beëindiging van de uitkering neemt het college, na onderzoek, tijdig een besluit met betrekking tot de
      wederzijds tussen de gemeente en de belanghebbende resterende verplichtingen en de afwikkeling daarvan.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
  - number: '14.6'
    text: |-
      Het college onderzoekt regelmatig de financiële omstandigheden van degene aan wie zij betalingsverplichtingen
      hebben opgelegd met betrekking tot de verleende uitkering. Indien het onderzoek daartoe aanleiding geeft, besluit
      het college tot wijziging van de opgelegde betalingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
  - number: '14.7'
    text: |-
      De voordracht voor een krachtens het eerste lid, derde zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
  - number: '14.8'
    text: |-
      Voor de toepassing van het vierde lid wordt niet als arbeid beschouwd arbeid op grond van een dienstbetrekking als
      bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '15.1'
    text: Het college stelt het recht op uitkering op schriftelijke aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel15
  - number: '15.2'
    text: |-
      De uitkering wordt door de werkloze werknemer en de echtgenoot gezamenlijk aangevraagd, dan wel door een van hen
      met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel15
  - number: '16.1'
    text: |-
      Het college stelt binnen acht weken na ontvangst van de aanvraag door het Uitvoeringsinstituut
      werknemersverzekeringen bij een aanvraag als bedoeld in [artikel 11a, eerste of derde lid][ref1], of door het
      college bij een aanvraag als bedoeld in [artikel 11a, tweede lid][ref2], vast of recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 11a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 11a
        hoofdstuk: II
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Het college besluit niet tot toekenning van de uitkering dan nadat de juistheid en volledigheid van de door de
      belanghebbende verstrekte gegevens is onderzocht.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16
  - number: '16.3'
    text: |-
      Als buiten toedoen van de belanghebbende het onderzoek naar de juistheid en volledigheid van de door hem verstrekte
      gegevens niet binnen de beslistermijn kan worden voltooid, besluit het college op de aanvraag op voet van de dan
      bekende gegevens.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16
  - number: 16a.1
    text: |-
      Indien door het college is vastgesteld dat recht op uitkering bestaat, wordt de uitkering toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om uitkering aan te vragen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16a
  - number: 16a.2
    text: |-
      De belanghebbende heeft zich gemeld als zijn naam, adres en woonplaats zijn geregistreerd en hij in staat is
      gesteld zijn aanvraag in te dienen bij het Uitvoeringsinstituut werknemersverzekeringen, als het een aanvraag
      betreft als bedoeld in [artikel 11a, eerste of derde lid][ref1], of bij het college, als het een aanvraag betreft
      als bedoeld in [artikel 11a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 11a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 11a
        hoofdstuk: II
        paragraaf: '3'
  - number: 16a.3
    text: |-
      Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de uitkering wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel16a
  - number: '17.1'
    text: |-
      Indien de belanghebbende de voor de verlening van de uitkering van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent aan het onderzoek, schort het college het recht op
      uitkering op:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: 17.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: 17.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: '17.2'
    text: |-
      Het college doet mededeling van de opschorting aan de belanghebbende en nodigen hem uit binnen een door hen te
      stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: '17.3'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet het college een dergelijk besluit of trekt het dat
      in:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: 17.3.a
    text: |-
      indien een gedraging als bedoeld in [artikel 20, eerste lid][ref1], of het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 13, eerste lid][ref2], of
      [artikel 30c, tweede en derde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 17.3.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: '17.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, trekt het college na het verstrijken van deze termijn het besluit tot toekenning van uitkering in met
      ingang van de eerste dag waarover het recht op uitkering is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: '17.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17
  - number: 17a.1
    text: |-
      Indien bij de beoordeling van het recht op uitkering blijkt, dat het door een belanghebbende verstrekte adres van
      hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schort het college het recht op uitkering op.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: 17a.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: 17a.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: 17a.2.b
    text: indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: 17a.3
    text: |-
      Het college doet schriftelijk mededeling van de opschorting aan de belanghebbende, en stelt hem daarbij in de
      gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen adresgegevens te doen aanpassen
      binnen een door het college te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: 17a.4
    text: |-
      De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het derde lid gestelde termijn nog bestaat, herziet het college het besluit tot
      toekenning van de uitkering, of trekt het deze in, met ingang van de eerste dag waarover het recht op uitkering
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel17a
  - number: '19.1'
    text: 'Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
  - number: 19.1.a
    text: |-
      de periode die de opschorting van de bijstand, bedoeld in [artikel 17, eerste lid][ref1], ten hoogste mag duren;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel17
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.1.b
    text: |-
      de termijn waarbinnen het college de onderzoeken verricht, bedoeld in
      [artikel 14, derde, vijfde en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel14
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: '19.2'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
  - number: 19.2.a
    text: |-
      de wijze waarop het college toepassing geeft aan [artikel 14, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel14
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.2.b
    text: |-
      de inhoud van de onderzoeken, bedoeld in [artikel 14, tweede, derde, vijfde en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel14
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.2.c
    text: |-
      de voorwaarden waaronder van de in het eerste lid, onderdeel b, bedoelde termijnen kan worden afgeweken ten aanzien
      van de onderzoeken, bedoeld in [artikel 14, derde en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel14
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.2.d
    text: |-
      de gevallen waarin kan worden afgezien van het onderzoek, bedoeld in [artikel 14, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel14
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Het college weigert de uitkering blijvend naar de mate waarin de belanghebbende uit of in verband met arbeid
      inkomen als bedoeld in of op grond van [artikel 8][ref1] zou hebben kunnen verwerven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.1.a
    text: |-
      aan de beëindiging van zijn dienstbetrekking een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref1] en de belanghebbende ter zake een verwijt kan worden
      gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 20.1.b
    text: |-
      de dienstbetrekking is beëindigd door of op verzoek van de belanghebbende zonder dat aan de voortzetting ervan
      zodanige bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem zou kunnen worden gevergd. In
      afwijking van de eerste zin weigert het college de uitkering over een periode van 26 weken gedeeltelijk door het
      bedrag van de uitkering te verlagen met 50% van het inkomen, bedoeld in de eerste zin, indien het eindigen van de
      dienstbetrekking belanghebbende niet in overwegende mate kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
  - number: '20.2'
    text: |-
      Het college weigert de uitkering blijvend naar de mate waarin de belanghebbende met het verrichten van deze arbeid
      inkomen zou hebben kunnen verwerven als bedoeld bij of krachtens [artikel 8][ref1] indien de belanghebbende nalaat
      algemeen geaccepteerde arbeid te aanvaarden of door eigen toedoen geen algemeen geaccepteerde arbeid verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.3'
    text: |-
      Het college weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk ter zake van het niet of niet
      behoorlijk nakomen door de belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen
      op arbeid in dienstbetrekking van een verplichting als bedoeld in [artikel 13, tweede lid][ref1], of een op
      grond van [hoofdstuk III][ref2] aan de uitkering verbonden verplichting, anders dan de verplichting, bedoeld
      in [artikel 37, eerste lid, onderdeel c, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3],
      dan wel ter zake van het niet binnen de door het college, onderscheidenlijk de Centrale
      organisatie werk en inkomen daarvoor vastgestelde termijn nakomen van de verplichting,
      bedoeld in [artikel 13, eerste lid][ref4], of de [artikelen 28, tweede lid][ref5], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004044#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '20.4'
    text: |-
      Een maatregel als bedoeld in het derde lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      belanghebbende de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
  - number: '20.5'
    text: |-
      Het niet voeren van verweer door de belanghebbende tegen of het instemmen van de belanghebbende met een beëindiging
      van de dienstbetrekking door of op verzoek van de werkgever leidt niet tot het opleggen van een maatregel op grond
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
  - number: '20.6'
    text: |-
      Het college kan afzien van het opleggen van een maatregel als bedoeld in het derde lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de
      verplichting, bedoeld in [artikel 13, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], indien het niet tijdig nakomen
      van de verplichting, niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering,
      tenzij het niet tijdig nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de
      datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '20.7'
    text: |-
      Burgemeester en wethouders kunnen afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
  - number: '20.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het derde en het vierde lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20
  - number: 20a.1
    text: |-
      Het college legt een bestuurlijke boete op van ten hoogste € 2 269 ter zake van
      het niet of niet behoorlijk nakomen door de belanghebbende van de verplichting,
      bedoeld in [artikel 13, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] door geen, onjuiste of
      onvolledige mededelingen te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 20a.2
    text: |-
      Het college kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen door de
      belanghebbende van de verplichting, bedoeld in [artikel 13, eerste lid][ref1], indien dit niet heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van uitkering, tenzij het niet of niet behoorlijk nakomen
      van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 20a.3
    text: Het college kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20a
  - number: 20a.4
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan het college de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20a
  - number: 20a.5
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20a
  - number: 20f.1
    text: |-
      Het college verrekent de bestuurlijke boete met een uitkering op grond van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1] of de
      [Wet werk en inkomen kunstenaars][ref2] of algemene bijstand op grond van de [Wet werk en bijstand][ref3] die de
      overtreder ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163
      [ref2]: https://wetten.overheid.nl/BWBR0017837
      [ref3]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0004163
      - id: ref2
        bwb_id: BWBR0017837
      - id: ref3
        bwb_id: BWBR0015703
  - number: 20f.2
    text: |-
      Indien degene aan wie een bestuurlijke boete is opgelegd inmiddels bijstand of uitkering als bedoeld in het eerste
      lid ontvangt van een andere gemeente dan de gemeente waarvan het college de bestuurlijke boete heeft opgelegd,
      betaalt die andere gemeente het bedrag van die bestuurlijke boete, zonder dat daarvoor machtiging nodig is van de
      belanghebbende, op verzoek van het college aan de gemeente die de bestuurlijke boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
  - number: 20f.3
    text: |-
      Indien degene aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet werk en inkomen naar arbeidsvermogen][ref5], de [Wet op de arbeidsongeschiktheidsverzekering][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], de [Wet arbeid en zorg][ref8], de [Toeslagenwet][ref9],
      de [Algemene Ouderdomswet][ref10] of de [Algemene nabestaandenwet][ref11], betaalt het Uitvoeringsinstituut
      werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank het bedrag van die bestuurlijke boete,
      zonder dat daarvoor een machtiging nodig is van de belanghebbende, op verzoek van het college aan de gemeente die
      de bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0002822
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004043
      [ref10]: https://wetten.overheid.nl/BWBR0002221
      [ref11]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0002822
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004043
      - id: ref10
        bwb_id: BWBR0002221
      - id: ref11
        bwb_id: BWBR0007795
  - number: 20f.4
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 20f.5
    text: |-
      Zolang de belanghebbende zijn verplichting, bedoeld in [artikel 20a, vierde lid][ref1], niet of niet behoorlijk
      nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 20a
        hoofdstuk: II
        paragraaf: 3a
  - number: 20f.5.a
    text: |-
      is het college, in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot
      verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 20f.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.1'
    text: Het college betaalt de uitkering in het algemeen per maand.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel21
  - number: '21.2'
    text: |-
      Het college is bevoegd de uitkering over een kortere periode te betalen, indien voorheen over die kortere periode
      loon of uitkering werd ontvangen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid wordt de vakantie-uitkering, voor zover niet reeds eerder betaald, jaarlijks
      betaald in de maand juni over de aan die maand voorafgaande 12 maanden, dan wel in de maand waarin de uitkering
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel21
  - number: '22'
    text: |-
      De uitkering wordt betaald tot de eerste dag van de maand, waarin de werkloze werknemer de leeftijd van 65 jaar
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel22
  - number: '23.1'
    text: |-
      In geval van overlijden van de echtgenoot van de werkloze werknemer wordt de uitkering tot en met één maand na de
      dag van het overlijden, betaald naar de voordien vastgestelde grondslag.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel23
  - number: '23.2'
    text: |-
      In geval van overlijden van de werkloze werknemer wordt de uitkering tot en met één maand na de dag van het
      overlijden, betaald naar de voordien vastgestelde grondslag aan:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel23
  - number: 23.2.a
    text: de echtgenoot van de werkloze werknemer;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel23
  - number: 23.2.b
    text: bij ontstentenis van de onder *a* bedoelde persoon, het kind of de kinderen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel23
  - number: '24.1'
    text: De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel24
  - number: '24.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel24
  - number: '24.3'
    text: Elk beding strijdig met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel24
  - number: '25.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 17, derde of vierde lid][ref1], of
      [artikel 20][ref2] ten onrechte of tot een te hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is
      betaald, wordt van de belanghebbende teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel20
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.2'
    text: Het college is bevoegd tot verrekening van de in de voorafgaande drie maanden ontvangen middelen met de uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25
  - number: '25.3'
    text: |-
      De uitkering wordt van de belanghebbende teruggevorderd indien blijkt dat deze over dezelfde periode waarover een
      uitkering op grond van deze wet is verleend, later inkomsten ontvangt waarmede bij de vaststelling van de uitkering
      rekening zou zijn gehouden.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25
  - number: '25.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van terugvordering
      af te zien.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25
  - number: 25a.1
    text: |-
      In afwijking van [artikel 25][ref1] kan het college, op verzoek van belanghebbende, besluiten gedeeltelijk van
      terugvordering of gedeeltelijk van verdere terugvordering van de uitkering af te zien bij medewerking aan een
      schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25a.1.a
    text: |-
      redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.1.c
    text: |-
      de vordering van de gemeente wegens teruggevorderde uitkering ten minste zal worden voldaan naar evenredigheid met
      de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.1.d
    text: |-
      een naar het oordeel van het college betrouwbare schuldregeling tot stand is gekomen door tussenkomst van een
      schuldhulpverlener als bedoeld in [artikel 48 van de Wet op het consumentenkrediet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 25a.1.e
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 25a.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de belanghebbende
      van de verplichting, bedoeld in [artikel 13][ref1], en hiervoor een boete als bedoeld in [artikel 20a][ref2] is
      opgelegd, dan wel met betrekking tot het niet naleven van die verplichting aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 20a
        hoofdstuk: II
        paragraaf: 3a
      - id: ref3
        bwb_id: BWBR0001854
  - number: 25a.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering treedt niet in werking voordat een
      schuldregeling overeenkomstig het eerste lid tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.4
    text: |-
      Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering wordt ingetrokken of ten nadele van de belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.4.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die voldoet
      aan de eisen bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.4.b
    text: de belanghebbende zijn schuld aan de gemeente niet overeenkomstig de schuldregeling voldoet; of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.4.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25a.5
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25a
  - number: 25b
    text: |-
      In afwijking van [artikel 25][ref1] kan het college, onder voorwaarden die Onze Minister kan stellen, besluiten van
      terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen bedrag niet te
      boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25c.1
    text: |-
      In afwijking van [artikel 25][ref1] kan het college besluiten van terugvordering of van verdere terugvordering af
      te zien, indien de belanghebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25c.1.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: 25c.1.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: 25c.1.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: 25c.1.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: 25c.2
    text: 'De in het eerste lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: 25c.2.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 25c.2.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 13, eerste lid][ref1], of
      [artikel 30c, tweede en derde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 25c.3
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel25c
  - number: '26.1'
    text: |-
      Indien de uitkering met inachtneming van [artikel 3][ref1] is verleend, worden voor de toepassing van deze
      paragraaf als belanghebbenden aangemerkt de in dat artikel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
  - number: '26.2'
    text: |-
      Indien de uitkering met inachtneming van [artikel 3][ref1], had moeten worden verleend,
      maar zulks achterwege is gebleven omdat de belanghebbende onjuiste of onvolledige
      inlichtingen heeft verstrekt, dan wel de verplichting, bedoeld in [artikel 13][ref2], of
      [artikel 30c, tweede en derde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of
      niet behoorlijk is nagekomen, wordt de gedurende het betrokken tijdvak ten onrechte verleende uitkering mede
      teruggevorderd van de persoon met wiens inkomen bij de verlening van de uitkering rekening had moeten worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '26.3'
    text: |-
      De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van de ten
      onrechte verleende uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel26
  - number: '27'
    text: |-
      De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het college de inlichtingen te verstrekken die
      voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel27
  - number: '28.1'
    text: |-
      Het college kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 25, eerste lid,][ref1] invorderen bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: '28.2'
    text: |-
      [Artikel 20f][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het college de
      aflossingsbedragen lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20f
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 20f
        hoofdstuk: II
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '30.1'
    text: |-
      De vorderingen ingevolge deze paragraaf zijn bevoorrecht en volgen onmiddellijk na die in [artikel 288 van Boek 3
      van het Burgerlijk Wetboek](onbekend) omschreven.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel30
  - number: '30.2'
    text: |-
      Indien de uitkeringen op verschillende tijdvakken betrekking hebben, heeft de terugvordering over het vroegste
      tijdvak voorrang.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel30
  - number: '31'
    text: |-
      Onder uitkering in de zin van deze paragraaf wordt verstaan de uitkering, bedoeld in [artikel 9][ref1],
      verminderd met de inhouding op grond van [artikel 10][ref2] en vermeerderd met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '34.1'
    text: 'Het college is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
  - number: 34.1.a
    text: |-
      het ondersteunen van personen die een uitkering op grond van deze wet ontvangen bij arbeidsinschakeling en,
      indien het college daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling noodzakelijk acht, voor het bepalen en aanbieden van deze voorziening, en;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
  - number: 34.1.b
    text: |-
      het verlenen van een uitkering aan de werkloze werknemer, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel2
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
  - number: '34.2'
    text: |-
      Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
  - number: '34.3'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
  - number: '34.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel34
  - number: '35.1'
    text: |-
      De gemeenteraad stelt bij verordening regels met betrekking tot het ondersteunen bij arbeidsinschakeling en het
      aanbieden van voorzieningen gericht op arbeidsinschakeling, bedoeld in [artikel 34, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: '35.2'
    text: |-
      De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op de taken vermeld in
      [artikel 34, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: '36.1'
    text: |-
      Belanghebbenden die een uitkering ontvangen, hebben overeenkomstig de verordening, bedoeld in
      [artikel 35, eerste lid][ref1], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het oordeel van
      het college noodzakelijk geachte voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel35
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '35'
        hoofdstuk: III
  - number: '36.2'
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '37.1'
    text: |-
      De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding, bedoeld in [artikel 16a, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 16a
        hoofdstuk: II
        paragraaf: '3'
  - number: 37.1.a
    text: naar vermogen te trachten algemeen geaccepteerde arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
  - number: 37.1.b
    text: |-
      ervoor te zorgen dat hij als werkzoekende geregistreerd is bij het Uitvoeringsinstituut
      werknemersverzekeringen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30b
  - number: 37.1.c
    text: algemeen geaccepteerde arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
  - number: 37.1.d
    text: na te laten hetgeen inschakeling in de arbeid belemmert;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
  - number: 37.1.e
    text: |-
      gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
  - number: '37.2'
    text: |-
      Indien uitkering wordt verleend aan echtgenoten gelden de verplichtingen bedoeld in het eerste lid voor ieder van
      hen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37
  - number: 37a.1
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een of meer verplichtingen als bedoeld in [artikel 37][ref1]. Zorgtaken kunnen als dringende redenen
      worden aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als bedoeld
      in [artikel 34, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: 37a.2
    text: |-
      De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37a
  - number: 37a.3
    text: |-
      De verplichtingen, bedoeld in [artikel 37][ref1], zijn niet van toepassing op de persoon die
      blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort van de
      [Wet sociale werkvoorziening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008903
  - number: '38.1'
    text: |-
      Onverminderd [artikel 37a, eerste lid][ref1], verleent het college aan een alleenstaande ouder die de volledige
      zorg heeft voor een tot zijn last komend kind tot vijf jaar op diens verzoek ontheffing van de verplichtingen,
      bedoeld in [artikel 37, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 37a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: '38.2'
    text: De ontheffing, bedoeld in het eerste lid, wordt eenmalig verleend.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: '38.3'
    text: |-
      De ontheffing, bedoeld in het eerste lid, wordt niet verleend voor zover uit houding en
      gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [artikel 37, eerste lid, onderdeel e][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: '38.4'
    text: |-
      De ontheffing, bedoeld in het eerste lid, geldt zolang het jongste kind van de alleenstaande ouder de leeftijd van
      vijf jaar nog niet heeft bereikt. Onverminderd de eerste zin geldt de ontheffing gedurende ten hoogste zes jaar.
      Bij verhuizing naar een andere woonplaats wordt op deze periode in mindering gebracht de periode, dan wel perioden,
      waarin de alleenstaande ouder in de voorgaande woonplaats, dan wel de voorgaande woonplaatsen, gebruik heeft
      gemaakt van de ontheffing bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: '38.5'
    text: 'De ontheffing, bedoeld in het eerste lid, wordt, indien de volledige duur van zes jaar nog niet volledig is benut:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: 38.5.a
    text: van rechtswege opgeschort, met ingang van de datum waarop het jongste kind de leeftijd van vijf jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: 38.5.b
    text: van rechtswege opgeschort indien niet langer recht op bijstand bestaat;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: 38.5.c
    text: |-
      door het college opgeschort op een daartoe strekkend verzoek van de alleenstaande ouder aan wie de ontheffing,
      bedoeld in het eerste lid, is verleend; of
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: 38.5.d
    text: |-
      door het college opgeschort indien uit houding en gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat
      hij zijn verplichtingen, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: '38.6'
    text: |-
      Op een daartoe strekkend verzoek van de alleenstaande ouder met een kind tot vijf jaar beëindigt het college een
      opschorting als bedoeld in het vijfde lid indien de daarin genoemde omstandigheden niet langer van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: '38.7'
    text: |-
      Het college stelt binnen zes maanden na ontvangst van het verzoek, bedoeld in het eerste lid, een plan van
      aanpak op voor de invulling van de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], voor de
      alleenstaande ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: '38.8'
    text: |-
      Het college vult de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], voor de alleenstaande
      ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid en die niet beschikt over een
      startkwalificatie ten minste in met scholing of opleiding die de toegang tot de arbeidsmarkt bevordert, tenzij
      naar het oordeel van het college een dergelijke scholing of opleiding de krachten of bekwaamheden van betrokkene te
      boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: '38.9'
    text: |-
      Op verzoek van de alleenstaande ouder die beschikt over een startkwalificatie en aan wie een ontheffing is
      verleend als bedoeld in het eerste lid, vult het college de voorziening in met een opleiding, als bedoeld in
      [artikel 7.2.2., tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref1], die de toegang tot de
      arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of
      bekwaamheden van de alleenstaande ouder te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '38.10'
    text: |-
      De alleenstaande ouder met een kind tot vijf jaar die op de dag voorafgaand aan de inwerkingtreding van de
      [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1] op grond van [artikel 37a, eerste lid][ref2],
      tijdelijk ontheven is van een of meer verplichtingen als bedoeld in [artikel 37][ref3], behoudt die tijdelijke
      ontheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0025029
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel37
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025029
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 37a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
  - number: 38.10.a
    text: |-
      tot het tijdstip dat in de desbetreffende beschikking is bepaald, doch uiterlijk tot twaalf maanden na
      inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: 38.10.b
    text: |-
      indien vóór het bereiken van het van toepassing zijnde tijdstip, bedoeld onder a, door de alleenstaande ouder een
      verzoek als bedoeld in het eerste lid wordt ingediend, tot het tijdstip waarop op dat verzoek door het college
      is beslist.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
  - number: '38.11'
    text: |-
      Indien de alleenstaande ouder een verzoek tot ontheffing als bedoeld in het eerste lid heeft ingediend binnen
      zes maanden na inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1] stelt het
      college, in afwijking van het zevende lid, uiterlijk twaalf maanden na inwerkingtreding van die wet een plan van
      aanpak op als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: '38.12'
    text: |-
      Het tiende en elfde lid en dit lid vervallen met ingang van de eerste dag van de dertiende kalendermaand na de
      datum van inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: 38a
    text: |-
      Het college kan ter uitvoering van [artikel 34, eerste lid, onderdeel a][ref1], degene die uitkering op grond van
      deze wet ontvangt en voor wie de kans op inschakeling in het arbeidsproces gering is en die daardoor vooralsnog niet
      bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten gedurende maximaal twee
      jaar. [Artikel 10a, tweede tot en met zesde en achtste tot en met tiende lid, van de Wet werk en bijstand][ref2]
      alsmede de regels, bedoeld in [artikel 8, eerste lid, onderdelen e en f, van die wet][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '8'
  - number: '39'
    text: Gereserveerd
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel39
  - number: '40'
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van
      [hoofdstukken IV, paragraaf 4][ref3], en [V][ref4], in de plaats van de betrokken burgemeesters en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004044#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0004044#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004044
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004044
        hoofdstuk: V
  - number: '41.1'
    text: |-
      Het college voert ten behoeve van een getrouwe weergave van de uitvoering en een effectief uitvoeringsproces een
      zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel41
  - number: 41.1.a
    text: |-
      de besluiten over aanvragen, onderzoeken, uitkeringen, vorderingen en verplichtingen en de hieruit voortvloeiende
      betalingen en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel41
  - number: 41.1.b
    text: de hierop betrekking hebbende bescheiden;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel41
  - number: 41.1.c
    text: |-
      het onderzoek dat is verricht naar de juistheid en de volledigheid van de verstrekte gegevens en de overgelegde
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister stelt, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels aangaande
      de in het eerste lid bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel41
  - number: '42'
    text: |-
      Het college draagt zorg voor de realisatie en vormgeving van cliëntenparticipatie bij de uitvoering van de wet, met
      inachtneming van [artikel 150 van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '44.1'
    text: |-
      Ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen te
      verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte
      van een persoon te wiens behoeve een uitkering is gevraagd of wordt verleend en die in zijn dienst dan wel voor
      hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich mede uit tot de
      inkomsten van een persoon van wie uitkeringen ingevolge [hoofdstuk II, paragraaf 5][ref1], worden of kunnen worden
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: '44.2'
    text: |-
      De opgaven en inlichtingen moeten desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel44
  - number: '45.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.b
    text: het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.c
    text: de belastingdienst;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 45.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 45.1.f
    text: |-
      de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 45.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 45.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister voor Wonen, Wijken en Integratie betreffende
      de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 45.1.i
    text: |-
      de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref1],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] en de [Wet inburgering][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0005682
      [ref4]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
      - id: ref3
        bwb_id: BWBR0005682
      - id: ref4
        bwb_id: BWBR0020611
  - number: 45.1.j
    text: Onze Minister van Justitie voorzover het betreft de persoon die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.k
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.l
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.1.m
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.2'
    text: |-
      Het vragen door burgemeester en wethouders en het verstrekken door de in het eerste lid bedoelde instanties van de
      in het eerste lid bedoelde opgaven en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.3'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college
      kosteloos alle gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken
      die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.4'
    text: 'De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.4.a
    text: |-
      van wie kosten van uitkeringen worden of kunnen worden teruggevorderd ingevolge [hoofdstuk II, paragraaf 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: 45.4.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.4.b.1°
    text: te wiens behoeve een uitkering ingevolge deze wet is gevraagd of wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: 45.4.b.2°
    text: |-
      van wie kosten van uitkering worden of kunnen worden teruggevorderd ingevolge [hoofdstuk II, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: '45.5'
    text: |-
      De in het eerste en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.6'
    text: |-
      De in het eerste lid, onderdeel a tot en met j, genoemde instanties treffen desgevraagd met het college en met het
      Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud en
      vormgeving van de in het zesde lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde
      lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste tot en met zevende lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven met betrekking tot inkomen en vermogen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.10'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het negende lid kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
  - number: '45.11'
    text: |-
      Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is
      ontnomen, onverwijld en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen,
      die van invloed kunnen zijn op het recht op uitkering, aan het college, door tussenkomst van het
      Inlichtingenbureau, waarbij hij gebruik kan maken van het het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '46.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt medegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: '46.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: 46.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: 46.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: 46.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: '46.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer van de belanghebbenden daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
  - number: '46.4'
    text: |-
      Degene die op grond van de[ artikelen 44 tot en met 48][ref1] gegevens verstrekt dient na te gaan of degene aan wie
      de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel44
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '47'
    text: |-
      Het college is verplicht, indien zij bij de uitvoering van deze wet het gegronde vermoeden krijgen van een misdrijf
      dat is gepleegd ten nadele van een uitvoeringsorgaan van de sociale verzekeringswetten of van een overheidsorgaan,
      voorzover dit is belast met het verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van
      bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel47
  - number: '48.1'
    text: |-
      Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet
      aan de hieronder vermelde organen en derden kosteloos de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van de hierbij vermelde wetten of wettelijke regelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 48.1.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref2], en [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 48.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 48.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de
      [Wet werk en bijstand][ref1], de [Wet investeren in jongeren][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] en de
      [Wet werk en inkomen kunstenaars][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0026054
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0026054
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0017837
  - number: 48.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2], de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4], voor de uitvoering van de [Zorgverzekeringswet][ref5] of de
      [Algemene Wet Bijzondere Ziektekosten][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0018450
      - id: ref6
        bwb_id: BWBR0002614
  - number: 48.1.e
    text: |-
      derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: 48.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: 48.1.g
    text: |-
      bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: 48.1.h
    text: |-
      de Informatie Beheer Groep voor de uitvoering van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '48.2'
    text: |-
      Het verstrekken door burgemeester en wethouders aan de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: '48.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      belanghebbenden daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: '48.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel48
  - number: '49.1'
    text: |-
      In de administratie van de gemeente en van het Inlichtingenbureau terzake van de uitvoering van deze wet wordt
      het burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1]
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '49.2'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in [artikel 45][ref1] en [48][ref2]
      genoemde organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel48
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '52.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel52
  - number: 52.1.a
    text: de rechtmatigheid van de uitvoering van deze wet door het college;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel52
  - number: 52.1.b
    text: de doeltreffendheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel52
  - number: '52.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '53'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Onze Minister treedt daarbij niet in de besluitvorming inzake
      individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in
      overeenstemming heeft gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel53
  - number: 53a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel53a
  - number: '54.1'
    text: |-
      Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '54.2'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel54
  - number: '54.3'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel54
  - number: '55.1'
    text: |-
      Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het toezicht,
      de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel55
  - number: '55.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel55
  - number: '55.3'
    text: |-
      De inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in [artikel 54][ref1], worden
      kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel54
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '56.1'
    text: |-
      Onze Minister vergoedt, ten laste van 's Rijks kas, 75% van de in een kalenderjaar ten laste van het college
      gebleven kosten van uitkeringen, waaronder begrepen de premies volksverzekeringen die daarover verschuldigd zijn
      en de in [artikel 46 van de Zorgverzekeringswet][ref1] bedoelde vergoedingen van de inkomensafhankelijke bijdragen
      daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '56.2'
    text: |-
      Onder ten laste van het college gebleven kosten, bedoeld in het eerste lid, wordt verstaan, de in een kalenderjaar
      door de gemeente verleende uitkering, bedoeld in het eerste lid, verminderd met alle ontvangsten van de gemeente
      in dat jaar in verband met de verlening van uitkering, waaronder begrepen de bedragen die de gemeente ontvangt door
      toepassing van [artikel 20a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 20a
        hoofdstuk: II
        paragraaf: 3a
  - number: '57.1'
    text: |-
      Onze Minister stelt regels met betrekking tot het verlenen van voorschotten op de vergoeding, bedoeld in
      [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
  - number: '57.2'
    text: |-
      Indien de uitvoering van deze wet door het college, of de administratie, bedoeld in [artikel 41][ref1] ernstige
      tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te stellen dan uit de op grond van
      het eerste lid gestelde regels voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel41
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '58.1'
    text: |-
      Voor de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 56][ref1], die op grond van het
      [eerste lid van dat artikel][ref2] niet voor vergoeding in aanmerking komen, verstrekt Onze Minister jaarlijks ten
      laste van 's Rijks kas aan de gemeente een uitkering. De uitkering wordt ten minste drie maanden voorafgaande aan
      het kalenderjaar waarop zij betrekking heeft door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel56
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
  - number: '58.2'
    text: |-
      Het bedrag van de uitkering wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      berekend aan de hand van het voor ieder jaar bij wet vast te stellen totale bedrag dat beschikbaar is voor de
      uitkeringen, bedoeld in het eerste lid. Bij of krachtens deze maatregel kunnen regels worden gesteld omtrent het
      verzamelen van gegevens noodzakelijk voor de berekening van het bedrag van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel58
  - number: '59.1'
    text: |-
      Het totale bedrag, bedoeld in [artikel 58, tweede lid][ref1], kan in het jaar waarop het bedrag betrekking heeft
      en in het daaropvolgende jaar bij wet worden verhoogd indien de ontwikkeling van de uitkeringslasten daartoe
      aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: '59.2'
    text: |-
      Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 58, eerste lid][ref1], wordt verhoogd binnen een periode van vier weken na de herziening door Onze
      Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: '59.3'
    text: |-
      Indien toepassing is gegeven aan het tweede lid, wordt voor de toepassing van de [artikelen 59a][ref1] en
      [59b][ref2], onder het bedrag van de uitkering verstaan: het bedrag van de uitkering inclusief de verhoging,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel59a
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel59b
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 59a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 59b
        hoofdstuk: V
        paragraaf: '2'
  - number: 59a.1
    text: |-
      Indien bij de vaststelling van de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 59c][ref1],
      blijkt, dat de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 58, eerste lid][ref2], in een
      kalenderjaar meer bedragen dan 115% van het bedrag van de uitkering, bedoeld in [artikel 58][ref3], of meer
      dan het totaal van het bedrag van de uitkering en het bedrag dat wordt verkregen door een bedrag van € 6,81 te
      vermenigvuldigen met het aantal inwoners in die gemeente op 1 januari van het desbetreffende kalenderjaar, wordt
      door Onze Minister ten laste van 's Rijks kas aan de gemeente een aanvullende uitkering toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel59c
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 59c
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: 59a.2
    text: 'De hoogte van de aanvullende uitkering is:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
  - number: 59a.2.a
    text: |-
      gelijk aan het verschil tussen het bedrag van de ten laste van de gemeente gebleven kosten, bedoeld in
      [artikel 58, eerste lid][ref1], en 115% van het bedrag van de uitkering, of, indien dit groter is,


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: 59a.2.b
    text: |-
      gelijk aan het verschil tussen het bedrag van de ten laste van de gemeente gebleven kosten, bedoeld in
      [artikel 58, eerste lid][ref1], en het in het eerste lid bedoelde totaalbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: 59a.3
    text: |-
      Het percentage en het met het aantal inwoners te vermenigvuldigen bedrag, bedoeld in het eerste en tweede lid,
      kunnen bij algemene maatregel van bestuur worden verhoogd of verlaagd.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
  - number: 59a.4
    text: |-
      Het aantal inwoners, bedoeld in het eerste lid, wordt ontleend aan de statistiek «Bevolking der gemeenten in
      Nederland op 1 januari» van het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59a
  - number: 59b
    text: 'Onze Minister stelt regels inzake de betaling van:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59b
  - number: 59b.a
    text: |-
      de uitkering, bedoeld in [artikel 58, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel58
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
  - number: 59b.b
    text: |-
      het bedrag waarmee de uitkering op grond van [artikel 59][ref1] wordt verhoogd;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel59
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '59'
        hoofdstuk: V
        paragraaf: '2'
  - number: 59b.c
    text: |-
      de aanvullende uitkering, bedoeld in [artikel 59a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel59a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 59a
        hoofdstuk: V
        paragraaf: '2'
  - number: 59c.1
    text: |-
      Onze Minister stelt de ten laste van de gemeente gebleven kosten, bedoeld in de [artikelen 56][ref1] en [58][ref2],
      de vergoeding, bedoeld in [artikel 56][ref3] en de aanvullende uitkering, bedoeld in [artikel 59a][ref4],
      vast, binnen een jaar na ontvangst door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van de
      verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel59a
      [ref5]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004044
        artikel: 59a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 59c.2
    text: |-
      Indien de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1],
      niet of niet volledig is ontvangen door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties binnen 18
      maanden na het kalenderjaar waarop het betrekking heeft, worden de ten laste van de gemeente gebleven kosten
      ambtshalve vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59c
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 59c.2
    text: |-
      Indien het verslag niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft of niet
      is voorzien van een daarop betrekking hebbende verklaring worden de ten laste van de gemeente gebleven kosten
      ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59c
  - number: 59d.1
    text: |-
      De volgens opgave van het college ten laste gebleven kosten worden bij de vaststelling, bedoeld in
      [artikel 59c, eerste lid][ref1], buiten aanmerking gelaten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel59c
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 59c
        hoofdstuk: V
        paragraaf: '3'
  - number: 59d.1.a
    text: |-
      het een uitkering betreft die is verleend in strijd met bij of krachtens deze wet gestelde regels, of die niet of
      niet volledig overeenkomstig [hoofdstuk II, paragraaf 5][ref1], is of wordt teruggevorderd;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: 59d.1.b
    text: |-
      niet is voldaan aan de bij of krachtens de [artikelen 20][ref1] of [20a][ref2] gestelde regels, voor een bedrag
      gelijk aan het bedrag waarmee de kosten zouden zijn verlaagd indien het college op een juiste wijze toepassing zou
      hebben gegeven aan deze artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 20a
        hoofdstuk: II
        paragraaf: 3a
  - number: 59d.2
    text: |-
      Indien als gevolg van het niet hebben voldaan door het college aan de bij of krachtens de
      [artikelen 13 tot en met 19][ref1] en [41][ref2] gestelde regels, niet kan worden vastgesteld of en voor welk
      bedrag de ten laste van de gemeenten gebleven kosten buiten aanmerking moeten worden gelaten, wordt volgens door
      Onze Minister te stellen regels hiervoor een bedrag vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel41
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '41'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 59d.3
    text: 'Het eerste en tweede lid zijn niet van toepassing voorzover naar het oordeel van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
  - number: 59d.3.a
    text: de tekortkomingen van bijzondere aard zijn;
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
  - number: 59d.3.b
    text: het college zich voldoende heeft ingespannen om de tekortkomingen op te heffen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59d
  - number: 59e
    text: |-
      Het college brengt de kosten van voorzieningen als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1],
      niet zijnde uitvoeringskosten, ten laste van de uitkering, bedoeld in
      [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
  - number: '60'
    text: |-
      Voor de toepassing van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt met een besluit
      gelijkgesteld het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of
      terugvordering van de uitkering of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 60a
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 60b.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van [artikel 3, tweede tot en met zesde lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
  - number: 60b.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel60b
  - number: 62a
    text: |-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel62a
  - number: '63.1'
    text: |-
      Onverminderd het derde lid wordt tot een bij ministeriële regeling bepaald tijdstip, dat voor verschillende
      groepen personen verschillend kan worden vastgesteld, onder werkloze werknemer in deze wet en de daarop
      berustende bepalingen mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1] op grond van [artikel 2, onderdeel c of d][ref2],
      zoals dat luidde op die dag, werd aangemerkt als werkloze werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel2
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
  - number: '63.2'
    text: |-
      Onder werkloze werknemer in deze wet en de daarop berustende bepaling wordt
      mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      werd aangemerkt als werkloze werknemer op grond van [artikel 2, onderdeel c of d][ref2], en die op grond van
      [artikel 3 van de Toeslagenwet][ref3] geen recht heeft op een toeslag op grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '3'
  - number: '63.3'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op de persoon die als gevolg van de inwerkingtreding van
      [artikel 1.11, onderdeel A, van de Wet Invoering en financiering Wet werk en inkomen][ref2] naar arbeidsvermogen
      geen werkloze werknemer is en de echtgenoot van die persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '1'
  - number: 63a
    text: |-
      Voor de toepassing van [artikel 9, vierde lid][ref1], wordt, indien [artikel 130h van de Werkloosheidswet][ref2]
      op de in dat lid bedoelde uitkering van toepassing was, voor «[artikel 47][ref3] of
      [artikel 52i van de Werkloosheidswet][ref4]» gelezen: [artikel 52 van de Werkloosheidswet][ref5], zoals dat artikel
      luidde op 31 december 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel130h
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel52i
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel52
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 130h
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 52i
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '52'
  - number: 63b
    text: |-
      De [artikelen 2][ref1] en [9][ref2] zoals deze luidden op de dag voor inwerkingtreding van artikel II van de
      Wet wijziging WW-stelsel, blijven van toepassing op de persoon wiens eerste werkloosheidsdag als bedoeld in de
      [Werkloosheidswet][ref3] is gelegen op of voor die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '64.1'
    text: |-
      In het belang van een goede uitvoering van het bij en krachtens deze wet bepaalde kunnen bij algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel64
  - number: '64.2'
    text: |-
      Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een in
      het eerste lid bedoelde algemene maatregel van bestuur te doen en naar zijn oordeel een gewichtige reden een
      onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regels stellen.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel64
  - number: '64.3'
    text: |-
      De regeling bedoeld in het tweede lid blijft, behoudens eerdere intrekking, van kracht totdat de in het eerste
      lid bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot 12 maanden na de dag van
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel64
  - number: '65'
    text: Deze wet treedt in werking op een bij of krachtens wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel65
  - number: '66'
    text: |-
      Deze wet kan worden aangehaald als Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
      werknemers.
    url: https://wetten.overheid.nl/BWBR0004044/2009-10-01#Artikel66
