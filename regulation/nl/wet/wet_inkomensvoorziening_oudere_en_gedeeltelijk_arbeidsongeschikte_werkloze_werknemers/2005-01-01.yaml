  - number: '27'
    text: |-
      1 Het besluit tot terugvordering vermeldt hetgeen teruggevorderd wordt, de termijn of termijnen waarbinnen
      moet worden betaald, alsmede dat het besluit, bij gebreke van tijdige betaling, op de wijze als omschreven in
      [artikel 28][ref1] zal worden tenuitvoergelegd.

      2 De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen
      te verstrekken die voor terugvordering ingevolge deze paragraaf van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel28
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel27
    references:
