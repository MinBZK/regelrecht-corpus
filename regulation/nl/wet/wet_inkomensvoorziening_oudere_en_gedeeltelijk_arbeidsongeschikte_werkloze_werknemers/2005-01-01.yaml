  - number: '56'
    text: |-
      1 Onze Minister vergoedt, ten laste van 's Rijks kas, 75% van de in een kalenderjaar ten laste van burgemeester
      en wethouders gebleven kosten van uitkeringen, waaronder begrepen de premies volksverzekeringen en de
      ziekenfondspremie die daarover verschuldigd zijn.

      2 Onder ten laste van burgemeester en wethouders gebleven kosten, bedoeld in het eerste lid, wordt verstaan, de in
      een kalenderjaar door de gemeente verleende uitkering, bedoeld in het eerste lid, verminderd met alle ontvangsten
      van de gemeente in dat jaar in verband met de verlening van uitkering, waaronder begrepen de bedragen die de
      gemeente ontvangt door toepassing van [artikel 20a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel56
