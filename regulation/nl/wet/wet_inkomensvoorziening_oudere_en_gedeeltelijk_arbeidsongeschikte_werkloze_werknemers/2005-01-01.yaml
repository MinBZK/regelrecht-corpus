  - number: '5'
    text: |-
      1 Recht op uitkering hebben, indien het inkomen per maand minder bedraagt dan de overeenkomstig het derde, vierde
      en vijfde lid vastgestelde grondslag:

      a. de werkloze werknemer en de echtgenoot met of zonder kinderen;

      b. de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer met een of meer kinderen;

      c. de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer zonder kinderen.

      2 Het recht op uitkering komt de werkloze werknemer en de echtgenoot gezamenlijk toe. De uitkering wordt aan de
      werkloze werknemer en de echtgenoot ieder voor de helft uitbetaald, dan wel op hun gezamenlijk verzoek aan een van
      hen voor het geheel.

      3 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat:

      a. voor de werkloze werknemer en de echtgenoot die beiden 21 jaar of ouder zijn, de helft van de grondslag netto
      gelijk is aan € 574,92;

      b. deze voor de werkloze werknemer en de echtgenoot, waarvan een of elk van beiden jonger dan 21 jaar is, de som
      bedraagt van de grondslagen die voor elk van hen als een alleenstaande werknemer of een thuisinwonende werkloze
      werknemer zou gelden doch ten hoogste de grondslag als bedoeld in onderdeel *a*.

      4 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:

      a. voor de alleenstaande werkloze werknemer van 21 jaar of ouder met een of meer kinderen netto gelijk is aan
      € 1.034,85;

      b. voor de alleenstaande werkloze werknemer van 23 jaar of ouder zonder kinderen netto gelijk is aan € 804,88;

      c. voor de alleenstaande werkloze werknemer van 22 jaar zonder kinderen netto gelijk is aan € 656,91;

      d. voor de alleenstaande werkloze werknemer van 21 jaar zonder kinderen netto gelijk is aan € 578,31.

      5 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:

      a. voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan
      € 1.005,66;

      b. voor de thuisinwonende werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan
      € 753,47;

      c. voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar zonder kinderen netto gelijk is aan € 558,70;

      d. voor de thuisinwonende werkloze werknemer zonder kinderen netto gelijk is aan € 306,51.

      6 De in het derde lid, onderdeel *a*, vierde lid, onderdeel *a* en *b*, en vijfde lid, genoemde bedragen worden
      gewijzigd met ingang van de dag waarop het netto minimumloon wijzigt met het percentage van deze wijziging.

      7 De in het vierde lid, onderdeel *c* en *d*, genoemde bedragen worden gewijzigd met ingang van de dag waarop het
      netto minimumjeugdloon wijzigt met het percentage van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Geen recht op uitkering heeft de werkloze werknemer die:

      a. buiten Nederland woont of aldaar anders dan tijdelijk verblijf houdt;

      b. niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1];

      c. die rechtens zijn vrijheid is ontnomen;

      d. onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref2] of die met
      die persoon gehuwd is, ter hoogte van het bedrag van het verlies van inkomen uit arbeid als gevolg van het
      genieten van dat verlof, tenzij belanghebbende alleenstaande ouder is en hij verlof geniet als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref3].

      2 Geen recht op uitkering heeft de echtgenoot, indien ten aanzien van deze, dan wel ten aanzien van de werkloze
      werknemer zich een omstandigheid voordoet als omschreven in het eerste lid. Indien zich ten aanzien van de
      echtgenoot een omstandigheid voordoet als omschreven in het eerste lid, wordt de werkloze werknemer aangemerkt
      als alleenstaande.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan
      die bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref4], recht op uitkering
      hebben, onverminderd de overige vereisten voor dat recht:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref5], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref6].

      4 Het eerste lid, onderdeel c, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref7].


