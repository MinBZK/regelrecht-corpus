        artikel: 20a
        hoofdstuk: II
        paragraaf: 3a
  - number: '57'
    text: |-
      1 Onze Minister stelt regels met betrekking tot het verlenen van voorschotten op de vergoeding, bedoeld in
      [artikel 56][ref1].

      2 Indien de uitvoering van deze wet door burgemeester en wethouders, of de administratie, bedoeld in
      [artikel 41][ref2] ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te
      stellen dan uit de op grond van het eerste lid gestelde regels voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel41
