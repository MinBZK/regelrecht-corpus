  - number: 59c
    text: |-
      1 Onze Minister stelt de ten laste van de gemeente gebleven kosten, bedoeld in de [artikelen 56][ref1]
      en [58][ref2], de vergoeding, bedoeld in [artikel 56][ref3] en de aanvullende uitkering, bedoeld in
      [artikel 59a][ref4], vast, binnen een jaar na ontvangst van het verslag en de daarop betrekking hebbende verklaring
      bedoeld in [artikel 54, eerste lid][ref5].

      2 Indien het verslag niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft of niet
      is voorzien van een daarop betrekking hebbende verklaring worden de ten laste van de gemeente gebleven kosten
      ambtshalve vastgesteld.


