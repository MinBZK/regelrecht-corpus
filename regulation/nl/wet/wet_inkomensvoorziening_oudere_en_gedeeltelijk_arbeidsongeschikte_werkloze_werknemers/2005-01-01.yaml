  - number: '47'
    text: |-
      Burgemeester en wethouders zijn verplicht, indien zij bij de uitvoering van deze wet het gegronde vermoeden krijgen
      van een misdrijf dat is gepleegd ten nadele van een uitvoeringsorgaan van de sociale verzekeringswetten of van een
      overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het doen van verstrekkingen dan wel
      het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel47
  - number: '48'
    text: |-
      1 Burgemeester en wethouders zijn bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet
      aan de hieronder vermelde organen en derden kosteloos de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van de hierbij vermelde wetten of wettelijke regelingen:

      a. de Centrale organisatie voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de
      Sociale verzekeringsbank voor de uitvoering van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      of de wettelijke regelingen, bedoeld in de [artikelen 30, eerste lid, onderdeel a][ref3], en
      [34, eerste lid, onderdeel a, van die wet][ref4];

      b. de belastingdienst voor de heffing of invordering van enige rijksbelasting of premies volksverzekeringen;

      c. burgemeester en wethouders van andere gemeenten voor de uitvoering van deze wet, de [Wet werk en bijstand][ref5],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6] en de
      [Wet werk en inkomen kunstenaars][ref7];

      d. het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref8], het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 1u van de Ziekenfondswet][ref9],
      en de ziekenfondsen, de ziektekostenverzekeraars en de uitvoeringsorganen, bedoeld in
      [artikel 4 van de Algemene Wet Bijzondere Ziektekosten][ref10], voor de uitvoering van de [Ziekenfondswet][ref11]
      en de [Algemene Wet Bijzondere Ziektekosten][ref12];

      e. derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen;

      f. buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;

      g. bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang.

      2 De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      belanghebbenden daardoor onevenredig wordt geschaad.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens dienen te worden verstrekt.


