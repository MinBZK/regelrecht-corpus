        artikel: 20b
        hoofdstuk: II
        paragraaf: 3a
  - number: 20f
    text: |-
      1 Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het [Tweede Boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend). De titel heeft mede betrekking op de rente en kosten, bedoeld
      in het zevende lid.

      2 Indien degene aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1] of de
      [Wet werk en inkomen kunstenaars][ref2] of algemene bijstand op grond van de [Algemene bijstandswet][ref3], wordt
      het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met die uitkering of bijstand.

      3 Indien degene aan wie een boete is opgelegd inmiddels uitkering of bijstand als bedoeld in het tweede lid
      ontvangt van een andere gemeente dan de gemeente die de boete heeft opgelegd, betaalt die andere gemeente het
      bedrag van die boete, zonder dat daarvoor een machtiging nodig is van de belanghebbende, op haar verzoek aan de
      gemeente die de boete heeft opgelegd.

      4 Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de [Werkloosheidswet][ref4],
      de [Ziektewet][ref5], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref8], de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9],
      de [Wet arbeid en zorg][ref10], de [Toeslagenwet][ref11], de [Algemene Ouderdomswet][ref12] of de
      [Algemene nabestaandenwet][ref13], betaalt het Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk
      de Sociale verzekeringsbank het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van de
      belanghebbende, op haar verzoek aan de gemeente die de boete heeft opgelegd.

      5 Indien degene aan wie een boete is opgelegd geen uitkering of bijstand als bedoeld in het tweede of vierde lid
      ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde en vierde lid niet
      mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref14] op zijn kosten betekend en tenuitvoergelegd.

      6 De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede,
      derde of vierde lid, dan wel van het vijfde lid, dan wel van het tweede, derde of vierde lid in combinatie met het
      vijfde lid.

      7 Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.

      8 De betekening en tenuitvoerlegging ingevolge het vijfde lid kan geschieden door de deurwaarder, bedoeld in
      [artikel 231, tweede lid, onderdeel e, van de Gemeentewet][ref15]. [Artikel 256 van die wet][ref16] is van
      overeenkomstige toepassing.

      9 Op het executoriaal beslag ingevolge dit artikel door burgemeester en wethouders op loon,
      sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan
      degene aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref17], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref18] van overeenkomstige toepassing.
      De in [artikel 479g][ref19] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      burgemeester en wethouders.

      10 De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de belanghebbende
      blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de [artikelen 475c][ref20] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref21].

      11 Het tiende lid geldt niet zolang de belanghebbende zijn verplichting bedoeld in
      [artikel 20a, vijfde lid][ref22], niet of niet behoorlijk nakomt.


