  - number: 59b
    text: |-
      Onze Minister stelt regels inzake de betaling van:

      a. de uitkering, bedoeld in [artikel 58, eerste lid][ref1];

      b. het bedrag waarmee de uitkering op grond van [artikel 59][ref2] wordt verhoogd;

      c. de aanvullende uitkering, bedoeld in [artikel 59a][ref3].


