  - number: '55'
    text: |-
      1 Burgemeester en wethouders en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij
      voor het toezicht, de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig
      heeft.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop burgemeester en
      wethouders en de gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan
      worden bepaald dat categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.

      3 De inlichtingen, bedoeld in het eerste lid, en de bescheiden, bedoeld in [artikel 54][ref1], worden kosteloos
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel54
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel55
