        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
  - number: '12'
    text: |-
      1 Indien doorzending van de aanvraag naar burgemeester en wethouders van een andere gemeente heeft plaatsgevonden
      en deze van oordeel zijn dat zij evenmin de aanvraag dienen te behandelen, terwijl er geen zekerheid kan worden
      verkregen over de in [artikel 11][ref1] bedoelde woonplaats, dragen burgemeester en wethouders die de doorgezonden
      aanvraag hebben ontvangen, er zorg voor dat het geschil aanhangig wordt gemaakt.

      2 In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      uitkering jegens burgemeester en wethouders van de gemeente waar de belanghebbende werkelijk verblijft.

      3 Het[ eerste lid van artikel 16][ref2] is van overeenkomstige toepassing, met dien verstande dat de daar genoemde
      termijn begint te lopen vanaf de mededeling van die doorzending of beslissing.

      4 Uitkeringskosten verleend ingevolge het tweede lid worden vergoed door de gemeente waarvan de taak is
      waargenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel16
