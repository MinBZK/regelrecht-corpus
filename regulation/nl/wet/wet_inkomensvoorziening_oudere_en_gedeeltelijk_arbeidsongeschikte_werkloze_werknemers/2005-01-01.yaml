  - number: '58'
    text: |-
      1 Voor de ten laste van de gemeente gebleven kosten, bedoeld in [artikel 56][ref1], die op grond van het
      [eerste lid van dat artikel][ref2] niet voor vergoeding in aanmerking komen, verstrekt Onze Minister jaarlijks ten
      laste van 's Rijks kas aan de gemeente een uitkering. De uitkering wordt ten minste drie maanden voorafgaande aan
      het kalenderjaar waarop zij betrekking heeft door Onze Minister vastgesteld.

      2 Het bedrag van de uitkering wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      berekend aan de hand van het voor ieder jaar bij wet vast te stellen totale bedrag dat beschikbaar is voor de
      uitkeringen, bedoeld in het eerste lid. Bij of krachtens deze maatregel kunnen regels worden gesteld omtrent het
      verzamelen van gegevens noodzakelijk voor de berekening van het bedrag van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel56
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel58
