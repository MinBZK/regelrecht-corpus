  - number: 17a
    text: |-
      1 Indien bij de beoordeling van het recht op uitkering blijkt, dat het door een belanghebbende verstrekte adres
      van hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schorten burgemeester en wethouders het recht op uitkering
      op.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;

      b. indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 Burgemeester en wethouders doen schriftelijk mededeling van de opschorting aan de belanghebbende, en stellen hem
      daarbij in de gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen adresgegevens te
      doen aanpassen binnen een door burgemeester en wethouders te stellen termijn.

      4 De opschorting wordt beëindigd zodra het aan burgemeester en wethouders gebleken is dat de afwijking niet meer
      bestaat. Indien de afwijking ook na de krachtens het derde lid gestelde termijn nog bestaat, herzien burgemeester
      en wethouders het besluit tot toekenning van de uitkering, of trekken zij dit in, met ingang van de eerste dag
      waarover het recht op uitkering is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel17a
  - number: '19'
    text: |-
      1 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot:

      a. de periode die de opschorting van de bijstand, bedoeld in [artikel 17, eerste lid][ref1], ten hoogste mag duren;

      b. de termijn waarbinnen burgemeester en wethouders de onderzoeken verrichten, bedoeld in
      [artikel 14, derde, vijfde en zesde lid][ref2].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. de wijze waarop burgemeester en wethouders toepassing geven aan [artikel 14, eerste lid][ref3];

      b. de inhoud van de onderzoeken, bedoeld in [artikel 14, tweede, derde, vijfde en zesde lid][ref4];

      c. de voorwaarden waaronder van de in het eerste lid, onderdeel b, bedoelde termijnen kan worden afgeweken ten
      aanzien van de onderzoeken, bedoeld in [artikel 14, derde en zesde lid][ref5];

      d. de gevallen waarin kan worden afgezien van het onderzoek, bedoeld in [artikel 14, zesde lid][ref6].


