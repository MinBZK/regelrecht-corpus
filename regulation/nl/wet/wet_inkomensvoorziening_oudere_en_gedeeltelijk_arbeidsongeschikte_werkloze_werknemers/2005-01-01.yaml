        bwb_id: BWBR0002460
  - number: '34'
    text: |-
      1 Burgemeester en wethouders zijn verantwoordelijk voor:

      a. het ondersteunen van personen die een uitkering op grond van deze wet ontvangen bij arbeidsinschakeling en,
      indien burgemeester en wethouders daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering,
      gericht op arbeidsinschakeling noodzakelijk achten, voor het bepalen en aanbieden van deze voorziening, en;

      b. het verlenen van een uitkering aan de werkloze werknemer, bedoeld in [artikel 2][ref1].

      2 Burgemeester en wethouders werken bij de uitvoering van het eerste lid, onderdeel a, samen met de Centrale
      organisatie werk en inkomen en het Uitvoeringsinstituut werknemersverzekeringen.

      3 Burgemeester en wethouders laten werkzaamheden die in het kader van de voorzieningen, bedoeld in het eerste lid,
      onderdeel a, worden uitgevoerd, zo veel mogelijk verrichten door derden die in het kader van de uitoefening van
      beroep of bedrijf de inschakeling van personen in de arbeid bevorderen.

      4 Burgemeester en wethouders kunnen de uitvoering van deze wet, behoudens de vaststelling van de rechten en
      plichten van de belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden
      laten verrichten. Burgemeester en wethouders kunnen de in de eerste volzin bedoelde vaststelling en beoordeling
      mandateren aan bestuursorganen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede tot
      en met het vierde lid, waarbij kan worden bepaald dat een deel van de werkzaamheden, bedoeld in het derde lid, niet
      door derden hoeft te worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel2
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
  - number: '35'
    text: |-
      1 De gemeenteraad stelt bij verordening regels met betrekking tot het ondersteunen bij arbeidsinschakeling en het
      aanbieden van voorzieningen gericht op arbeidsinschakeling, bedoeld in [artikel 34, eerste lid, onderdeel a][ref1].

      2 De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op de taken vermeld in
      [artikel 34, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel35
    references:
      - id: ref1
