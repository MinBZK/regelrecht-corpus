  - number: '15'
    text: |-
      1 Burgemeester en wethouders stellen het recht op uitkering op schriftelijke aanvraag vast.

      2 De uitkering wordt door de werkloze werknemer en de echtgenoot gezamenlijk aangevraagd, dan wel door een van hen
      met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel15
  - number: '16'
    text: |-
      1 Burgemeester en wethouders stellen binnen acht weken na ontvangst van de aanvraag door de Centrale organisatie
      werk en inkomen bij een aanvraag als bedoeld in [artikel 11a, eerste of derde lid][ref1], of door burgemeester en
      wethouders bij een aanvraag als bedoeld in [artikel 11a, tweede lid][ref2], vast of recht op uitkering bestaat.

      2 Burgemeester en wethouders besluiten niet tot toekenning van de uitkering dan nadat de juistheid en volledigheid
      van de door de belanghebbende verstrekte gegevens is onderzocht.

      3 Als buiten toedoen van de belanghebbende het onderzoek naar de juistheid en volledigheid van de door hem
      verstrekte gegevens niet binnen de beslistermijn kan worden voltooid, besluiten burgemeester en wethouders op de
      aanvraag op voet van de dan bekende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel16
