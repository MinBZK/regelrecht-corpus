        artikel: '1'
  - number: '14'
    text: |-
      1 Onverminderd [artikel 28, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepalen burgemeester en wethouders welke gegevens ten behoeve van de verlening dan wel voortzetting van de
      uitkering door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede
      de wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt.

      2 Burgemeester en wethouders onderzoeken de juistheid en volledigheid van de verkregen gegevens en stellen zonodig
      een onderzoek in naar andere gegevens die voor de vaststelling van het recht op uitkering noodzakelijk zijn. Indien
      het onderzoek daartoe aanleiding geeft besluiten burgemeester en wethouders tot herziening van de uitkering.

      3 Burgemeester en wethouders verrichten regelmatig een heronderzoek naar de voor het recht op uitkering van
      belang zijnde gegevens. Het heronderzoek strekt zich mede uit tot de naleving van de aan de uitkering verbonden
      verplichtingen. Burgemeester en wethouders beoordelen tevens of er aanleiding bestaat de verplichtingen aan te
      vullen dan wel te wijzigen.

      4 Het in het tweede en derde lid bedoelde onderzoek omvat, tenzij op grond van [artikel 37a][ref2] ontheffing is
      verleend van de verplichtingen gericht op inschakeling in de arbeid in dienstbetrekking, mede een onderzoek naar de
      mogelijkheden van de belanghebbende om door arbeid zelfstandig in het bestaan te voorzien alsmede de wijze waarop
      deze mogelijkheden kunnen worden vergroot.

      5 Bij beëindiging van de uitkering nemen burgemeester en wethouders, na onderzoek, tijdig een besluit met
      betrekking tot de wederzijds tussen de gemeente en de belanghebbende resterende verplichtingen en de afwikkeling
      daarvan.

      6 Burgemeester en wethouders onderzoeken regelmatig de financiële omstandigheden van degene aan wie zij
      betalingsverplichtingen hebben opgelegd met betrekking tot de verleende uitkering. Indien het onderzoek daartoe
      aanleiding geeft, besluiten burgemeester en wethouders tot wijziging van de opgelegde betalingsverplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel37a
