  - number: '53'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan burgemeester en wethouders, nadat zij gedurende acht weken in de gelegenheid zijn gesteld hun
      zienswijze naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake
      individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen burgemeester en wethouders de
      uitvoering in overeenstemming hebben gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel53
  - number: '54'
    text: |-
      1 Burgemeester en wethouders dienen jaarlijks bij Onze Minister een verslag in over de uitvoering van deze
      wet. Het verslag omvat mede een opgave van de ten laste van burgemeester en wethouders gebleven kosten,
      bedoeld in [artikel 56, eerste lid][ref1] en is voorzien van een verklaring van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref2] voorgeschreven controle omtrent de getrouwheid van de verstrekte gegevens en
      de rechtmatigheid van de uitvoering van de wet, alsmede van een oordeel van de gemeenteraad over de uitvoering van
      de wet.

      2 Voorafgaand aan het verslag, bedoeld in het eerste lid, dienen burgemeester en wethouders bij Onze Minister een
      voorlopig verslag in over de uitvoering.

      3 Bij ministeriële regeling worden regels gesteld inzake het voorlopig verslag, het verslag en over de verklaring
      en het onderzoek dat resulteert in deze verklaring. Deze regels kunnen voor categorieën van gemeenten verschillen,
      waarbij kan worden bepaald dat de verplichting het verslag te voorzien van een verklaring niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
