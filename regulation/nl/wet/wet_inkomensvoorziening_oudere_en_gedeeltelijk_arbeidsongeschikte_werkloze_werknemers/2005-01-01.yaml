  - number: '20'
    text: |-
      1 Indien de belanghebbende zich verwijtbaar zodanig heeft gedragen dat hij redelijkerwijs heeft moeten begrijpen,
      dat dit gedrag de beëindiging van zijn dienstbetrekking tot gevolg zou kunnen hebben, dan wel indien de
      dienstbetrekking eindigt of is beëindigd zonder dat aan de voortzetting ervan zodanige bezwaren zijn verbonden,
      dat deze voortzetting redelijkerwijs niet van hem zou kunnen worden gevergd, weigeren burgemeester en wethouders
      de uitkering blijvend naar de mate waarin de belanghebbende uit of in verband met deze arbeid inkomen zou hebben
      kunnen verwerven als bedoeld bij of krachtens [artikel 8][ref1], tenzij het eindigen van de dienstbetrekking
      belanghebbende niet in overwegende mate kan worden verweten. In dat geval weigeren burgemeester en wethouders de
      uitkering over een periode van 26 weken gedeeltelijk door het bedrag van de uitkering te verlagen met 50% van het
      inkomen bedoeld in de eerste volzin.

      2 Indien de belanghebbende nalaat algemeen geaccepteerde arbeid te aanvaarden of door eigen toedoen geen algemeen
      geaccepteerde arbeid verkrijgt, weigeren burgemeester en wethouders de uitkering blijvend naar de mate waarin de
      belanghebbende met het verrichten van deze arbeid inkomen zou hebben kunnen verwerven als bedoeld bij of krachtens
      [artikel 8][ref2].

      3 Indien de belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in
      dienstbetrekking de verplichting, bedoeld in [artikel 13, eerste lid][ref3], of de [artikelen 28, tweede lid][ref4],
      en [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], niet binnen de door
      burgemeester en wethouders, onderscheidenlijk de Centrale organisatie werk en inkomen, daarvoor vastgestelde
      termijn is nagekomen, dan wel een verplichting als bedoeld in [artikel 13, tweede lid][ref6], of een op grond
      van [hoofdstuk III][ref7] aan de uitkering verbonden verplichting, anders dan de verplichting bedoeld in
      [artikel 37, eerste lid, onderdeel c][ref8], niet of niet behoorlijk is nagekomen, weigeren burgemeester en
      wethouders de uitkering tijdelijk of blijvend, geheel of gedeeltelijk.

      4 Een maatregel als bedoeld in het derde lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      belanghebbende de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      5 Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 13, eerste lid][ref9], of de [artikelen 28, tweede lid][ref10], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref11], niet heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van uitkering, kunnen burgemeester en wethouders afzien
      van het opleggen van een maatregel als bedoeld in het derde lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet tijdig nakomen van die verplichting, tenzij het niet tijdig nakomen van
      de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.

      6 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel.

      7 Bij algemene maatregel van bestuur kunnen met betrekking tot het derde en het vierde lid nadere regels worden
      gesteld.


