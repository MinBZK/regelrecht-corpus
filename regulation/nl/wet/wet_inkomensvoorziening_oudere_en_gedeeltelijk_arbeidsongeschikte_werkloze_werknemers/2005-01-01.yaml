  - number: '13'
    text: |-
      1 De belanghebbende doet aan burgemeester en wethouders op verzoek of onverwijld uit eigen beweging mededeling van
      alle feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op
      zijn arbeidsinschakeling en het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag van de
      uitkering dat aan hem wordt betaald.

      2 De belanghebbende is verplicht aan burgemeester en wethouders desgevraagd de medewerking te verlenen die
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      3 Burgemeester en wethouders stellen bij de uitvoering van deze wet de
      identiteit van de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].

      4 Een ieder is verplicht aan burgemeester en wethouders desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel13
