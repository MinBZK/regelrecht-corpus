  - number: '3'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. gehuwd: als partner geregistreerd;

      d. gehuwde: als partner geregistreerde.

      2 In deze wet en de daarop berustende bepalingen wordt:

      a. als echtgenoot aangemerkt degene die niet duurzaam gescheiden leeft van de werkloze werknemer met wie hij gehuwd
      is;

      b. als echtgenoot mede aangemerkt de niet met de werkloze werknemer gehuwde persoon met wie de werkloze werknemer
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in
      de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte.

      3 Van een gezamenlijke huishouding is sprake indien twee meerderjarigen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      4 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht als de belanghebbenden hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding bedoeld in het derde lid.

      5 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel *d*.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel3
  - number: '4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. thuisinwonende werkloze werknemer: de niet gehuwde dan wel duurzaam gescheiden levende werkloze werknemer van 18
      tot en met 20 jaar, die behoort tot het huishouden van zijn ouder(s) of pleegouder(s) en die niet een gezamenlijke
      huishouding voert als bedoeld in [artikel 3, derde lid][ref1];

      b. alleenstaande werkloze werknemer: de niet gehuwde dan wel duurzaam gescheiden levende werkloze werknemer,
      die niet een gezamenlijke huishouding voert als bedoeld in [artikel 3, derde lid][ref2], tenzij het betreft een
      bloedverwant in de eerste graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in
      de tweede graad sprake is van zorgbehoefte, en die niet is een thuisinwonende werkloze werknemer;

      c. kind: het kind jonger dan 18 jaar, dat niet als eigen kind, aangehuwd kind of pleegkind tot het
      huishouden van een ander dan de werkloze werknemer behoort en voor wie de werkloze werknemer op grond van de
      [Algemene kinderbijslagwet][ref3] kinderbijslag ontvangt dan wel zal ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002368
