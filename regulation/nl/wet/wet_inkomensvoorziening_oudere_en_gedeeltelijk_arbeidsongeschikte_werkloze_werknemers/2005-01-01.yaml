  - number: 59e
    text: |-
      Burgemeester en wethouders brengen de kosten van voorzieningen als bedoeld in
      [artikel 34, eerste lid, onderdeel a][ref1], niet zijnde uitvoeringskosten, ten laste van de uitkering, bedoeld in
      [artikel 69, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2].


