        bwb_id: BWBR0002656
        artikel: '11'
  - number: 11a
    text: |-
      1 Een aanvraag is gericht tot burgemeester en wethouders en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend bij de Centrale organisatie
      werk en inkomen. Na de overdracht van de aanvraag door de Centrale organisatie werk en inkomen aan burgemeester
      en wethouders ingevolge [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      wordt de aanvraag verder behandeld door burgemeester en wethouders.

      2 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van aanvragen worden aangewezen die, in
      afwijking van het eerste lid, bij burgemeester en wethouders worden ingediend.

      3 Het gemeentebestuur kan, in overeenstemming met de Centrale organisatie werk en inkomen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede lid, bij de Centrale organisatie werk en
      inkomen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel11a
    references:
      - id: ref1
