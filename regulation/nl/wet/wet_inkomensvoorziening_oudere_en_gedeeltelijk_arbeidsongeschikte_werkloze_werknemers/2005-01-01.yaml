preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een inkomensvoorziening te treffen voor oudere
    en gedeeltelijk arbeidsongeschikte werkloze werknemers van wie het recht op een uitkering op grond van de
    Werkloosheidswet is geëindigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. burgemeester en wethouders: burgemeester en wethouders van de gemeente, bedoeld in [artikel 11][ref1];

      c. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. het Inlichtingenbureau: het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      g. netto minimumloon: de som van het netto minimumloon en de netto aanspraak op de minimumvakantiebijslag als
      bedoeld in [artikel 37, eerste lid, van de Wet werk en bijstand][ref6];

      h. netto minimumjeugdloon: het voor de betreffende leeftijd geldende minimumloon als bedoeld in
      [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref7], verhoogd met de aanspraak op
      vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref8] over dat minimumloon ten minste
      aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting, premies volksverzekeringen, premies
      werknemersverzekeringen en het werknemersaandeel in de ziekenfondspremie.

      2 De in het eerste lid, onderdeel h, bedoelde loonbelasting en premies volksverzekeringen worden berekend
      voor een werknemer, jonger dan 65 jaar, rekening houdend met uitsluitend de algemene heffingskorting, bedoeld
      in [artikel 22 van de Wet op de loonbelasting 1964][ref9], over het minimumjeugdloon en de aanspraak op
      vakantiebijslag daarover, vermeerderd met het werkgeversaandeel in de ziekenfondspremie en verminderd met de
      premies werknemersverzekeringen. De loonbelasting en premies volksverzekeringen, in te houden van de aanspraak op
      vakantiebijslag over het minimumloon, worden berekend met toepassing van de tabel voor bijzondere beloningen waarin
      de arbeidskorting, bedoeld in [artikel 22a van de Wet op de loonbelasting 1964][ref10], niet is verwerkt.

      3 Indien ingevolge een van de sociale-verzekeringswetten een premie wordt ingehouden waarvan het percentage
      per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het tweede lid een gemiddeld percentage vastgesteld.


