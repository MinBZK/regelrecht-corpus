        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: '36'
    text: |-
      1 Belanghebbenden die een uitkering ontvangen, hebben overeenkomstig de verordening, bedoeld in
      [artikel 35, eerste lid][ref1], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het oordeel van
      burgemeester en wethouders noodzakelijk geachte voorziening gericht op arbeidsinschakeling.

      2 [Artikel 11][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel11
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '37'
    text: |-
      1 De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding, bedoeld in [artikel 16a, tweede lid][ref1], verplicht:

      a. naar vermogen te trachten algemeen geaccepteerde arbeid te verkrijgen;

      b. ervoor te zorgen dat hij als werkzoekende geregistreerd is bij de Centrale organisatie
      werk en inkomen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 25, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      c. algemeen geaccepteerde arbeid te aanvaarden;

      d. na te laten hetgeen inschakeling in de arbeid belemmert;

      e. gebruik te maken van een door burgemeester en wethouders aangeboden voorziening, waaronder begrepen sociale
      activering, gericht op arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot
      arbeidsinschakeling.

      2 Indien uitkering wordt verleend aan echtgenoten gelden de verplichtingen bedoeld in het eerste lid voor ieder
      van hen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: 16a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '25'
  - number: 37a
    text: |-
      1 Indien daarvoor dringende redenen aanwezig zijn, kunnen burgemeester en wethouders in individuele gevallen
      tijdelijk ontheffing verlenen van een of meer verplichtingen als bedoeld in [artikel 37][ref1]. Zorgtaken kunnen
      als dringende redenen worden aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van
      een voorziening als bedoeld in [artikel 34, eerste lid, onderdeel a][ref2]. Indien de tijdelijke ontheffing een
      alleenstaande ouder betreft maken burgemeester en wethouders in het bijzonder een afweging tussen het belang van
      arbeidsinschakeling en de invulling die de ouder wenst te geven aan de zorgplicht.

      2 De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
  - number: '39'
    text: Gereserveerd
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel39
  - number: '41'
    text: |-
      1 Burgemeester en wethouders voeren ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:

      a. de besluiten over aanvragen, onderzoeken, uitkeringen, vorderingen en verplichtingen en de hieruit
      voortvloeiende betalingen en ontvangsten;

      b. de hierop betrekking hebbende bescheiden;

      c. het onderzoek dat is verricht naar de juistheid en de volledigheid van de verstrekte gegevens en de overgelegde
      bescheiden.

      2 Onze Minister stelt, na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels aangaande
      de in het eerste lid bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel41
  - number: '42'
    text: |-
      Burgemeester en wethouders dragen zorg voor de realisatie en vormgeving van cliëntenparticipatie bij de uitvoering
      van de wet, met inachtneming van [artikel 150 van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '44'
    text: |-
      1 Ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan burgemeester en wethouders kosteloos opgaven en
      inlichtingen te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet
      ten opzichte van een persoon te wiens behoeve een uitkering is gevraagd of wordt verleend en die in zijn dienst dan
      wel te zijnen behoeve werkt of heeft gewerkt. De verplichting strekt zich mede uit tot de inkomsten van een persoon
      van wie uitkeringen ingevolge [hoofdstuk II, paragraaf 5][ref1], worden of kunnen worden teruggevorderd.

      2 De opgaven en inlichtingen moeten desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door burgemeester en wethouders schriftelijk te stellen termijn worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: '45'
    text: |-
      1 De hieronder vermelde instanties zijn verplicht desgevraagd aan burgemeester en wethouders of, indien
      burgemeester en wethouders op grond van [artikel 43, derde lid][ref1], aan de Centrale organisatie werk en inkomen
      mandaat hebben verleend tot het nemen van besluiten inzake de verlening van uitkering, aan de Centrale organisatie
      werk en inkomen, kosteloos opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van
      deze wet:

      a. burgemeester en wethouders van andere gemeenten;

      b. de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank;

      c. de belastingdienst;

      d. het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref2], het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 1u van de Ziekenfondswet][ref3],
      de ziekenfondsen, de ziektekostenverzekeraars en de uitvoeringsorganen, bedoeld in
      [artikel 4 van de Algemene Wet Bijzondere Ziektekosten][ref4];

      e. de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5] als
      inkomen worden aangemerkt;

      f. de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 1996][ref6] vastgestelde vergoeding;

      g. de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref7];

      h. Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer betreffende de toepassing van de
      [Huursubsidiewet][ref8] en de [Wet bevordering eigenwoningbezit][ref9];

      i. de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref10],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref11], en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12];

      j. Onze Minister van Justitie voorzover het betreft de persoon die rechtens zijn vrijheid is ontnomen;

      k. de instanties en personen die woonruimte verhuren;

      l. de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;

      m. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen.

      2 Het vragen door burgemeester en wethouders en het verstrekken door de in het eerste lid bedoelde instanties van
      de in het eerste lid bedoelde opgaven en inlichtingen geschiedt in bij of krachtens algemene maatregel van bestuur
      te bepalen gevallen door tussenkomst van het Inlichtingenbureau. Het Inlichtingenbureau voert ten behoeve van de
      verwerking van deze opgaven en inlichtingen een administratie.

      3 Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan burgemeester
      en wethouders of, indien burgemeester en wethouders op grond van [artikel 43, derde lid][ref13], aan de Centrale
      organisatie werk en inkomen mandaat hebben verleend tot het nemen van besluiten inzake de verlening van uitkering,
      aan de Centrale organisatie werk en inkomen, kosteloos alle gegevens en uittreksels of afschriften van uitspraken,
      registers en andere stukken te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.

      4 De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:

      a. van wie kosten van uitkeringen worden of kunnen worden teruggevorderd ingevolge
      [hoofdstuk II, paragraaf 5][ref14];

      b. die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:

      1°. te wiens behoeve een uitkering ingevolge deze wet is gevraagd of wordt verleend;

      2°. van wie kosten van uitkering worden of kunnen worden teruggevorderd ingevolge
      [hoofdstuk II, paragraaf 5][ref15].

      5 De in het eerste en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.

      6 De in het eerste lid, onderdeel a tot en met j, genoemde instanties treffen desgevraagd met burgemeester en
      wethouders en met het Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder
      aan hen gevraagde opgaven en inlichtingen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud
      en vormgeving van de in het zesde lid bedoelde regelingen.

      8 Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties worden
      aangewezen die ten behoeve van aan burgemeester en wethouders te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.

      9 Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde
      lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste tot en met zevende lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven met betrekking tot inkomen en vermogen.

      10 Bij de algemene maatregel van bestuur, bedoeld in het negende lid kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.

      11 Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen,
      onverwijld en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed kunnen
      zijn op het recht op uitkering, aan het college, of, indien het college aan de Centrale organisatie werk en inkomen
      mandaat heeft verleend tot het nemen van besluiten inzake de verlening van uitkering, aan de Centrale organisatie
      werk en inkomen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik kan maken van het sociaal-
      fiscaalnummer.


