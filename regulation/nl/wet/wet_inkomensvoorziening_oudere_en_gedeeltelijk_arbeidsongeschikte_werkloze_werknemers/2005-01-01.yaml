        artikel: 475d
  - number: '30'
    text: |-
      1 De vorderingen ingevolge deze paragraaf zijn bevoorrecht en volgen onmiddellijk na die in [artikel 288 van Boek 3
      van het Burgerlijk Wetboek](onbekend) omschreven.

      2 Indien de uitkeringen op verschillende tijdvakken betrekking hebben, heeft de terugvordering over het vroegste
      tijdvak voorrang.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel30
  - number: '31'
    text: |-
      Onder uitkering in de zin van deze paragraaf wordt verstaan de uitkering, bedoeld in [artikel 9][ref1], verminderd
      met de inhouding op grond van [artikel 10][ref2] en vermeerderd met het werkgeversaandeel in de premie ingevolge
      de [Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002460
