  - number: '7'
    text: |-
      Indien het recht op uitkering als gevolg van werkaanvaarding van de werkloze werknemer of de echtgenoot is
      geëindigd, en vervolgens opnieuw werkloosheid ontstaat, herleeft het recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Als inkomen wordt aangemerkt:

      a. voor de werkloze werknemer en de echtgenoot: de som van het inkomen uit of in verband met arbeid in het
      bedrijfs- en beroepsleven van hemzelf en van zijn echtgenoot;

      b. voor de alleenstaande en de thuisinwonende werkloze werknemer: zijn inkomen uit of in verband met arbeid in het
      bedrijfs- en beroepsleven.

      2 Bij algemene maatregel van bestuur worden nadere en zonodig afwijkende regels gesteld met betrekking tot het
      inkomen, bedoeld in het eerste lid. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot de
      vaststelling van het inkomen, bedoeld in het eerste lid, alsmede de periode waarop die vaststelling betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 De uitkering bedraagt het verschil tussen de van toepassing zijnde grondslag en het inkomen.

      2 In de in het eerste lid bedoelde uitkering is begrepen een vakantie-uitkering ter hoogte van 8/108 van die
      uitkering.

      3 Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, wordt de in het
      tweede lid genoemde verhouding dienovereenkomstig aangepast.

      4 Indien de som van de uitkering krachtens [artikel 52 van de Werkloosheidswet][ref2] en de toeslag krachtens
      [artikel 8, vierde lid, van de Toeslagenwet][ref3], minder bedroeg dan de uitkering bedoeld in het eerste en tweede
      lid, wordt de uitkering vastgesteld op dat lagere bedrag.

      5 Indien met betrekking tot de werkloze werknemer, bedoeld in [artikel 2, eerste lid, onderdeel ][ref4],
      de som van de uitkering krachtens [artikel 47 van de Werkloosheidswet][ref5], en de toeslag krachtens
      [artikel 8, vierde lid, van de Toeslagenwet][ref6] minder bedroeg dan de uitkering bedoeld in het eerste en tweede
      lid, wordt de uitkering vastgesteld op dat lagere bedrag.

      6 Het vierde en vijfde lid zijn niet van toepassing, voor zover het recht op uitkering op grond van de
      [Werkloosheidswet][ref7] gedeeltelijk is geëindigd door het verrichten van werkzaamheden als lid van de
      Eerste Kamer der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam dat bij
      rechtstreekse verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
