  - number: 20d
    text: |-
      1 Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.

      2 De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de belanghebbende
      een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht
      tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      3 Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en tweede lid mededeling aan
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 20e
    text: |-
      1 Een boete wordt opgelegd binnen een jaar nadat burgemeester en wethouders de belanghebbende overeenkomstig
      [artikel 20][ref1], in de gelegenheid hebben gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte
      is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na die waarop
      het openbaar ministerie aan burgemeester en wethouders heeft medegedeeld dat geen strafvervolging wordt ingesteld.

      2 Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20b
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel20e
