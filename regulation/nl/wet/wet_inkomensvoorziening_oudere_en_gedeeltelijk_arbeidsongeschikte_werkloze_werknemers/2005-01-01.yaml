  - number: '10'
    text: |-
      1 Op de uitkering wordt een bedrag ingehouden dat gelijk is aan het bedrag van de premie dat een werkgever op grond
      van de [Werkloosheidswet][ref1] op het overeenkomstige loon van een werknemer, die verzekerd is op grond van die
      wet, inhoudt.

      2 Indien ingevolge de [Werkloosheidswet][ref2] een premie wordt ingehouden waarvan het percentage per bedrijfstak
      verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij ministeriële
      regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.

      3 Onze Minister kan nadere en zo nodig afwijkende regels stellen met betrekking tot de berekening van de op grond
      van het eerste lid op de aldaar bedoelde uitkering in te houden bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '11'
    text: |-
      Het recht op uitkering bestaat jegens burgemeester en wethouders van de gemeente waar de belanghebbende woonplaats
      heeft als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
