  - number: '21'
    text: |-
      1 Burgemeester en wethouders betalen de uitkering in het algemeen per maand.

      2 Burgemeester en wethouders zijn bevoegd de uitkering over een kortere periode te betalen, indien voorheen over
      die kortere periode loon of uitkering werd ontvangen.

      3 In afwijking van het eerste lid wordt de vakantie-uitkering, voor zover niet reeds eerder betaald, jaarlijks
      betaald in de maand juni over de aan die maand voorafgaande 12 maanden, dan wel in de maand waarin de uitkering
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel21
  - number: '22'
    text: |-
      De uitkering wordt betaald tot de eerste dag van de maand, waarin de werkloze werknemer de leeftijd van 65 jaar
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel22
  - number: '23'
    text: |-
      1 In geval van overlijden van de echtgenoot van de werkloze werknemer wordt de uitkering tot en met één maand na de
      dag van het overlijden, betaald naar de voordien vastgestelde grondslag.

      2 In geval van overlijden van de werkloze werknemer wordt de uitkering tot en met één maand na de dag van het
      overlijden, betaald naar de voordien vastgestelde grondslag aan:

      a. de echtgenoot van de werkloze werknemer;

      b. bij ontstentenis van de onder *a* bedoelde persoon, het kind of de kinderen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel23
  - number: '24'
    text: |-
      1 De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      3 Elk beding strijdig met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel24
  - number: '25'
    text: |-
      1 De uitkering die als gevolg van een besluit als bedoeld in [artikel 17, derde of vierde lid][ref1], of
      [artikel 20][ref2] ten onrechte of tot een te hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is
      betaald, wordt van de belanghebbende teruggevorderd.

      2 Het in aanmerking nemen van in de voorafgaande drie maanden ontvangen inkomen, wordt niet als terugvordering
      beschouwd.

      3 De uitkering wordt van de belanghebbende teruggevorderd indien blijkt dat deze over dezelfde periode waarover een
      uitkering op grond van deze wet is verleend, later inkomsten ontvangt waarmede bij de vaststelling van de uitkering
      rekening zou zijn gehouden.

      4 Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of
      gedeeltelijk van terugvordering af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel20
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: 25a
    text: |-
      1 In afwijking van [artikel 25][ref1] kunnen burgemeester en wethouders, op verzoek van belanghebbende, besluiten
      gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering van de uitkering af te zien, indien:

      a. redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen; en

      c. de vordering van de gemeente wegens teruggevorderde uitkering ten minste zal worden voldaan naar evenredigheid
      met de vorderingen van de schuldeisers van gelijke rang.

      2 Het eerste lid is niet van toepassing ten aanzien van de terugvordering van uitkering als gevolg van verwijtbaar
      gedrag van de belanghebbende.

      3 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering treedt niet in werking voordat een schuldregeling overeenkomstig het eerste lid tot stand is
      gekomen.

      4 Het besluit tot het gedeeltelijk afzien van terugvordering of tot het gedeeltelijk afzien van verdere
      terugvordering wordt ingetrokken of ten nadele van de belanghebbende gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling is tot stand gekomen die
      voldoet aan de eisen bedoeld in het eerste lid;

      b. de belanghebbende zijn schuld aan de gemeente niet overeenkomstig de schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      5 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25b
    text: |-
      In afwijking van [artikel 25][ref1] kunnen burgemeester en wethouders, onder voorwaarden die Onze Minister kan
      stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te
      stellen bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
    url: https://wetten.overheid.nl/BWBR0004044/2005-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25c
    text: |-
      1 In afwijking van [artikel 25][ref1] kunnen burgemeester en wethouders besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de belanghebbende:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      2 De in het eerste lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c][ref2] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 13, eerste lid][ref4], of de [artikelen 28, tweede lid][ref5], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6].

      3 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
