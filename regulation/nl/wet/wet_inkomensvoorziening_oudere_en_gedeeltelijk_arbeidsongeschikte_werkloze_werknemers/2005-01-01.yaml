  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder werkloze werknemer:

      a. de persoon die:

      1°. werkloos is en de leeftijd van 65 jaar nog niet heeft bereikt;

      2°. na het bereiken van de leeftijd van 50 jaar werkloos is geworden, en

      3°. nadien de volledige uitkeringsduur bedoeld in [hoofdstuk II](onbekend) (Stb. 1987, 93), inclusief
      een eventuele verlenging van deze duur op grond van [artikel 76 van die wet][ref1], heeft bereikt,
      tenzij op dat tijdstip een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref2] van toepassing is;

      b. de persoon die:

      1°. werkloos is en de leeftijd van 65 jaar nog niet heeft bereikt;

      2°. na het bereiken van de leeftijd van 57,5 jaar werkloos is geworden, en

      3°. nadien de volledige uitkeringsduur bedoeld in [hoofdstuk II](onbekend), inclusief een
      eventuele verlenging van deze duur op grond van [artikel 76 van die wet][ref3], heeft bereikt,
      tenzij op dat tijdstip een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref4] van toepassing is;

      c. de persoon die:

      1°. werkloos is en de leeftijd van 65 jaar nog niet heeft bereikt;

      2°. voor het bereiken van de leeftijd van 50 jaar werkloos is geworden;

      3°. na de dag waarop hij werkloos is geworden de volledige uitkeringsduur bedoeld in [hoofdstuk II]
      (onbekend), inclusief een eventuele verlenging van deze duur op grond van [artikel 76 van die wet][ref5],
      heeft bereikt, tenzij op dat tijdstip een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref6] van toepassing is, en

      4°. recht heeft op uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref7], de
      [Liquidatiewet ongevallenwetten][ref8] of de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9], berekend
      naar een mate van arbeidsongeschiktheid van minder dan 80%;

      d. de persoon die:

      1°. werkloos is en de leeftijd van 65 jaar nog niet heeft bereikt;

      2°. recht heeft op uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref10],
      berekend naar een arbeidsongeschiktheid van minder dan 80%.


