  - number: 59d
    text: |-
      1 De volgens opgave van burgemeester en wethouders ten laste gebleven kosten worden bij de vaststelling, bedoeld in
      [artikel 59c, eerste lid][ref1], buiten aanmerking gelaten indien:

      a. het een uitkering betreft die is verleend in strijd met bij of krachtens deze wet gestelde regels, of die niet
      of niet volledig overeenkomstig [hoofdstuk II, paragraaf 5][ref2], is of wordt teruggevorderd;

      b. niet is voldaan aan de bij of krachtens de [artikelen 20][ref3] of [20a][ref4] gestelde regels, voor een bedrag
      gelijk aan het bedrag waarmee de kosten zouden zijn verlaagd indien burgemeester en wethouders op een juiste wijze
      toepassing zouden hebben gegeven aan deze artikelen.

      2 Indien als gevolg van het niet hebben voldaan door burgemeester en wethouders aan de bij of krachtens de
      [artikelen 13 tot en met 19][ref5] en [41][ref6] gestelde regels, niet kan worden vastgesteld of en voor welk
      bedrag de ten laste van de gemeenten gebleven kosten buiten aanmerking moeten worden gelaten, wordt volgens door
      Onze Minister te stellen regels hiervoor een bedrag vastgesteld.

      3 Het eerste en tweede lid zijn niet van toepassing voorzover naar het oordeel van Onze Minister:

      a. de tekortkomingen van bijzondere aard of geringe betekenis zijn;

      b. burgemeester en wethouders zich voldoende hebben ingespannen om de tekortkomingen op te heffen.


