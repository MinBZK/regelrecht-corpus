        artikel: '56'
        hoofdstuk: V
        paragraaf: '1'
  - number: '59'
    text: |-
      1 Het totale bedrag, bedoeld in [artikel 58, tweede lid][ref1], kan in het jaar waarop het bedrag betrekking
      heeft en in het daaropvolgende jaar bij wet worden verhoogd indien de ontwikkeling van de uitkeringslasten daartoe
      aanleiding geeft.

      2 Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 58, eerste lid][ref2], wordt verhoogd binnen een periode van vier weken na de herziening door Onze
      Minister vastgesteld.

      3 Indien toepassing is gegeven aan het tweede lid, wordt voor de toepassing van de [artikelen 59a][ref3] en
      [59b][ref4], onder het bedrag van de uitkering verstaan: het bedrag van de uitkering inclusief de verhoging,
      bedoeld in het tweede lid.


