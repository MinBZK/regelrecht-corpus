  - number: '52'
    text: |-
      1 Onze Minister houdt toezicht op:

      a. de rechtmatigheid van de uitvoering van deze wet door burgemeester en wethouders;

      b. de doeltreffendheid van deze wet.

      2 Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


