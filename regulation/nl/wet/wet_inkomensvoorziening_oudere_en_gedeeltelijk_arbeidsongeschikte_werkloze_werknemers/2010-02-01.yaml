  - number: 48.1.e
    text: |-
      derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: 48.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: 48.1.g
    text: |-
      bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: 48.1.h
    text: |-
      Onze Minister voor Wonen, Wijken en Integratie voor de uitvoering van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '48.2'
    text: |-
      Het verstrekken door burgemeester en wethouders aan de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: '48.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      belanghebbenden daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: '48.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel48
  - number: '49.1'
    text: |-
      In de administratie van de gemeente en van het Inlichtingenbureau terzake van de uitvoering van deze wet wordt
      het burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1]
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '49.2'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in [artikel 45][ref1] en [48][ref2]
      genoemde organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel48
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '52.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel52
  - number: 52.1.a
    text: de rechtmatigheid van de uitvoering van deze wet door het college;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel52
  - number: 52.1.b
    text: de doeltreffendheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel52
  - number: '52.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '53'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Onze Minister treedt daarbij niet in de besluitvorming inzake
      individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in
      overeenstemming heeft gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel53
  - number: 53a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel53a
  - number: '54.1'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel54
  - number: '54.2'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel54
  - number: '55.1'
    text: |-
      Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het toezicht,
      de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel55
  - number: '55.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel55
  - number: '55.3'
    text: |-
      De inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in [artikel 54][ref1], worden
      kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel54
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 59e
    text: |-
      Ten behoeve van de kosten van voorzieningen als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1], niet zijnde
      uitvoeringskosten, ontvangt het college een uitkering op grond van de [Wet participatiebudget][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel59e
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0025039
  - number: '60'
    text: |-
      Voor de toepassing van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt met een besluit
      gelijkgesteld het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of
      terugvordering van de uitkering of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 60b.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van [artikel 3, tweede tot en met zesde lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
  - number: 60b.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel60b
  - number: '61'
    text: |-
      [Paragraaf 3 van Hoofdstuk V][ref1] blijft van toepassing op de vaststelling van de vergoeding, uitkering en
      kosten, bedoeld in [artikel 59c][ref2], zoals dit artikel luidde voor inwerkingtreding van de Wet van 17 december
      2009 tot bundeling van uitkeringen inkomensvoorziening aan gemeenten (Stb. 592), voor kosten die betrekking hebben
      op kalenderjaren gelegen voor die van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel59c
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 59c
        hoofdstuk: V
        paragraaf: '3'
  - number: 62a
    text: |-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel62a
  - number: '63.1'
    text: |-
      Onverminderd het derde lid wordt tot een bij ministeriële regeling bepaald tijdstip, dat voor verschillende
      groepen personen verschillend kan worden vastgesteld, onder werkloze werknemer in deze wet en de daarop
      berustende bepalingen mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1] op grond van [artikel 2, onderdeel c of d][ref2],
      zoals dat luidde op die dag, werd aangemerkt als werkloze werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel2
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
  - number: '63.2'
    text: |-
      Onder werkloze werknemer in deze wet en de daarop berustende bepaling wordt
      mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      werd aangemerkt als werkloze werknemer op grond van [artikel 2, onderdeel c of d][ref2], en die op grond van
      [artikel 3 van de Toeslagenwet][ref3] geen recht heeft op een toeslag op grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel3
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '3'
  - number: '63.3'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op de persoon die als gevolg van de inwerkingtreding van
      [artikel 1.11, onderdeel A, van de Wet Invoering en financiering Wet werk en inkomen][ref2] naar arbeidsvermogen
      geen werkloze werknemer is en de echtgenoot van die persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '1'
  - number: 63a
    text: |-
      Voor de toepassing van [artikel 9, vierde lid][ref1], wordt, indien [artikel 130h van de Werkloosheidswet][ref2]
      op de in dat lid bedoelde uitkering van toepassing was, voor «[artikel 47][ref3] of
      [artikel 52i van de Werkloosheidswet][ref4]» gelezen: [artikel 52 van de Werkloosheidswet][ref5], zoals dat artikel
      luidde op 31 december 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel130h
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel52i
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel52
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 130h
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 52i
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '52'
  - number: 63b
    text: |-
      De [artikelen 2][ref1] en [9][ref2] zoals deze luidden op de dag voor inwerkingtreding van artikel II van de
      Wet wijziging WW-stelsel, blijven van toepassing op de persoon wiens eerste werkloosheidsdag als bedoeld in de
      [Werkloosheidswet][ref3] is gelegen op of voor die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
  - number: 63c_bis
    text: |-
      De [artikelen 3, zevende en achtste lid][ref1], en [4, tweede lid][ref2], zijn niet van toepassing, indien voor
      de inwerkingtreding van deze artikelleden, op grond van [artikel 5][ref3] recht bestaat op een uitkering voor de
      werkloze werknemer en de echtgenoot, omdat de ongehuwde uitkeringsgerechtigde wegens een gezamenlijke huishouding
      met een meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind is aangemerkt als echtgenoot, voor
      zolang dit recht op uitkering bestaat, tenzij toepassing van de genoemde artikelleden leidt tot een hogere
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel5
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '4'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 63c
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van de Wet tot invoering
      en wijziging van de Wet inkomensvoorziening oudere werklozen (Stb. PM), blijft van toepassing met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 63c.a
    text: een recht op uitkering dat voor 1 december 2009 is ontstaan;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63c
  - number: 63c.b
    text: |-
      een recht op uitkering dat voor 1 december 2009 is ontstaan, daarna is geëindigd en na 1 december 2009 op grond van
      artikel 7 van die wet is herleefd, of;
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63c
  - number: 63c.c
    text: personen die voor 1 december 2009 voldoen aan artikel 2 maar die voor die datum geen recht hebben op een uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel63c
  - number: '64.1'
    text: |-
      In het belang van een goede uitvoering van het bij en krachtens deze wet bepaalde kunnen bij algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel64
  - number: '64.2'
    text: |-
      Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een in
      het eerste lid bedoelde algemene maatregel van bestuur te doen en naar zijn oordeel een gewichtige reden een
      onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regels stellen.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel64
  - number: '64.3'
    text: |-
      De regeling bedoeld in het tweede lid blijft, behoudens eerdere intrekking, van kracht totdat de in het eerste
      lid bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot 12 maanden na de dag van
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel64
  - number: '65'
    text: Deze wet treedt in werking op een bij of krachtens wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004044/2010-02-01#Artikel65
  - number: '66'
    text: |-
