  - number: 4a
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. arbeidsinschakeling: het verkrijgen van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van
      een voorziening als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1];

      b. sociale activering: het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie;

      c. startkwalificatie: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref2] of
      een diploma hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 7][ref3] onderscheidenlijk [8 van de Wet op het voortgezet onderwijs][ref4].

      2 Voor de toepassing van deze wet wordt niet als algemeen geaccepteerde arbeid beschouwd arbeid op grond van
      een dienstbetrekking als bedoeld in [hoofdstuk 2][ref5] of [3 van de Wet sociale werkvoorziening][ref6]. Voor de
      toepassing van de [artikelen 34 tot en met 36][ref7] wordt voor personen die blijkens een indicatiebeschikking of
      herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref8] onder een voorziening
      gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van arbeid in een
      dienstbetrekking als bedoeld in de [artikelen 2][ref9] en [7 van die wet][ref10].


