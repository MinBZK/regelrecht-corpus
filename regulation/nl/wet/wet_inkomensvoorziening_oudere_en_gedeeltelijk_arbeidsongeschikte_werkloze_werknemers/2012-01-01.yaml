  - number: 17a
    text: |-
      1 Indien bij de beoordeling van het recht op uitkering blijkt, dat het door een belanghebbende verstrekte adres
      van hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schort het college het recht op uitkering op.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;

      b. indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 Het college doet schriftelijk mededeling van de opschorting aan de belanghebbende, en stelt hem daarbij in de
      gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen adresgegevens te doen aanpassen
      binnen een door het college te stellen termijn.

      4 De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het derde lid gestelde termijn nog bestaat, herziet het college het besluit tot
      toekenning van de uitkering, of trekt het deze in, met ingang van de eerste dag waarover het recht op uitkering
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel17a
  - number: '20'
    text: |-
      1 Het college kan de uitkering blijvend of tijdelijk weigeren naar de mate waarin de belanghebbende inkomen als
      bedoeld in of op grond van [artikel 8][ref1] zou hebben kunnen verwerven, indien:

      a. aan de beëindiging van zijn dienstbetrekking een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref2] en de belanghebbende ter zake een verwijt kan worden
      gemaakt;

      b. de dienstbetrekking is beëindigd door of op verzoek van de belanghebbende zonder dat aan de voortzetting ervan
      zodanige bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem zou kunnen worden gevergd;

      c. de belanghebbende nalaat algemeen geaccepteerde arbeid te aanvaarden; of

      d. de belanghebbende door eigen toedoen geen algemeen geaccepteerde arbeid verkrijgt.

      2 Het college verlaagt de uitkering overeenkomstig de verordening, bedoeld in
      [artikel 35, eerste lid, onderdeel b][ref3], ter zake van het niet of onvoldoende nakomen
      door de belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen
      op arbeid in dienstbetrekking, van een verplichting als bedoeld in [artikel 13][ref4] of in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], of een op
      grond van [hoofdstuk III][ref6] aan de uitkering verbonden verplichting, anders dan de verplichting, bedoeld in
      [artikel 37, eerste lid, onderdelen a en c][ref7], waaronder begrepen het zich jegens het college zeer ernstig
      misdragen.

      3 Van een weigering als bedoeld in het eerste lid en een verlaging als bedoeld in het tweede lid wordt afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.

      4 Het niet voeren van verweer door de belanghebbende tegen of het instemmen van de belanghebbende met een
      beëindiging van de dienstbetrekking door of op verzoek van de werkgever leidt niet tot het opleggen van een
      maatregel op grond van het eerste lid.


