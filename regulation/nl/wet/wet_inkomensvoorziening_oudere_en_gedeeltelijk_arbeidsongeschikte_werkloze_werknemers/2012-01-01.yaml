  - number: '13'
    text: |-
      1 De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op
      zijn arbeidsinschakeling en het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag
      van de uitkering dat aan hem wordt betaald. De verplichting geldt niet indien die feiten en omstandigheden
      door burgemeester en wethouders kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek
      aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij
      ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.

      2 De belanghebbende is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van deze wet.

      3 Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].

      4 Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
