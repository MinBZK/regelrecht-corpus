  - number: 63c
    text: |-
      [Artikel 9, vierde en vijfde lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van de Wet tot invoering
      en wijziging van de Wet inkomensvoorziening oudere werklozen (Stb. PM), blijft van toepassing met betrekking tot:

      a. een recht op uitkering dat voor 1 december 2009 is ontstaan;

      b. een recht op uitkering dat voor 1 december 2009 is ontstaan, daarna is geëindigd en na 1 december 2009 op grond
      van artikel 7 van die wet is herleefd, of;

      c. personen die voor 1 december 2009 voldoen aan artikel 2 maar die voor die datum geen recht hebben op een
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel9
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel63c
