      het burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1]
      opgenomen.

      2 Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in [artikel 45][ref2] en
      [48][ref3] genoemde organen en personen wordt, indien daartoe bevoegd, gebruik gemaakt van dit burgerservicenummer.


