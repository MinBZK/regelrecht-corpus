    text: |-
      1 In het belang van een goede uitvoering van het bij en krachtens deze wet bepaalde kunnen bij algemene maatregel
      van bestuur nadere regels worden gesteld.

      2 Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een in
      het eerste lid bedoelde algemene maatregel van bestuur te doen en naar zijn oordeel een gewichtige reden een
      onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regels stellen.

      3 De regeling bedoeld in het tweede lid blijft, behoudens eerdere intrekking, van kracht totdat de in het eerste
      lid bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot 12 maanden na de dag van
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel64
  - number: '65'
    text: Deze wet treedt in werking op een bij of krachtens wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel65
  - number: '66'
    text: |-
      Deze wet kan worden aangehaald als Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze
      werknemers.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel66
