  - number: '10'
    text: |-
      1 Op de uitkering wordt een bedrag ingehouden dat gelijk is aan het bedrag van de premie dat een werkgever op
      grond van [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1] op het overeenkomstige loon van een
      werknemer, die verzekerd is op grond van die wet, inhoudt.

      2 Indien ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2] een premie wordt ingehouden
      waarvan het percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur
      te stellen regels bij ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage
      vastgesteld.

      3 Onze Minister kan nadere en zo nodig afwijkende regels stellen met betrekking tot de berekening van de op grond
      van het eerste lid op de aldaar bedoelde uitkering in te houden bedragen.


