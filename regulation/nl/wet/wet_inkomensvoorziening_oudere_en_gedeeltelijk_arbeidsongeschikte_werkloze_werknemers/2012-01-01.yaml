  - number: '12'
    text: |-
      1 Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en deze van
      oordeel zijn dat zij evenmin de aanvraag dienen te behandelen, terwijl er geen zekerheid kan worden verkregen over
      de in [artikel 11][ref1] bedoelde woonplaats, draagt het college die de doorgezonden aanvraag hebben ontvangen, er
      zorg voor dat het geschil aanhangig wordt gemaakt.

      2 In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      uitkering jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.

      3 Het[ eerste lid van artikel 16][ref2] is van overeenkomstige toepassing, met dien verstande dat de daar genoemde
      termijn begint te lopen vanaf de mededeling van die doorzending of beslissing.

      4 Uitkeringskosten verleend ingevolge het tweede lid worden vergoed door de gemeente waarvan de taak is
      waargenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel11
