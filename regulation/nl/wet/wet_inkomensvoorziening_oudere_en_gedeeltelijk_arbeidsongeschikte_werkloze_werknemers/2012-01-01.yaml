  - number: '6'
    text: |-
      1 Geen recht op uitkering heeft de werkloze werknemer die:

      a. buiten Nederland woont of aldaar anders dan tijdelijk verblijf houdt;

      b. niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1];

      c. die rechtens zijn vrijheid is ontnomen;

      d. zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;

      e. onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref2] of die met
      die persoon gehuwd is, ter hoogte van het bedrag van het verlies van inkomen uit arbeid als gevolg van het
      genieten van dat verlof, tenzij belanghebbende alleenstaande ouder is en hij verlof geniet als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref3].

      2 Geen recht op uitkering heeft de echtgenoot, indien ten aanzien van deze, dan wel ten aanzien van de werkloze
      werknemer zich een omstandigheid voordoet als omschreven in het eerste lid. Indien zich ten aanzien van de
      echtgenoot een omstandigheid voordoet als omschreven in het eerste lid, wordt de werkloze werknemer aangemerkt
      als alleenstaande.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan
      die bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref4], recht op uitkering
      hebben, onverminderd de overige vereisten voor dat recht:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref5], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref6].

      4 Het eerste lid, onderdeel c, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref7].


