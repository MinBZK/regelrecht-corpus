  - number: '37'
    text: |-
      1 De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding, bedoeld in [artikel 16a, tweede lid][ref1], verplicht:

      a. naar vermogen te trachten algemeen geaccepteerde arbeid te verkrijgen;

      b. ervoor te zorgen dat hij als werkzoekende geregistreerd is bij het Uitvoeringsinstituut
      werknemersverzekeringen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      c. algemeen geaccepteerde arbeid te aanvaarden;

      d. na te laten hetgeen inschakeling in de arbeid belemmert;

      e. gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht
      op arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling;

      f. naar vermogen door het college opgedragen onbeloonde maatschappelijk nuttige werkzaamheden te verrichten die
      worden verricht naast of in aanvulling op reguliere arbeid en die niet leiden tot verdringing op de arbeidsmarkt.

      2 Indien uitkering wordt verleend aan echtgenoten gelden de verplichtingen bedoeld in het eerste lid voor ieder
      van hen.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel37
