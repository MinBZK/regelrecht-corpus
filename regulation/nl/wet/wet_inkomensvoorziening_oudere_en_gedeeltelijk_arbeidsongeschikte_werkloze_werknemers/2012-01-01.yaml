  - number: '21'
    text: |-
      1 Het college betaalt de uitkering in het algemeen per maand.

      2 Het college is bevoegd de uitkering over een kortere periode te betalen, indien voorheen over die kortere periode
      loon of uitkering werd ontvangen.

      3 In afwijking van het eerste lid wordt de vakantie-uitkering, voor zover niet reeds eerder betaald, jaarlijks
      betaald in de maand juni over de aan die maand voorafgaande maanden, dan wel in de maand waarin de uitkering
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel21
  - number: '22'
    text: |-
      De uitkering wordt betaald tot de eerste dag van de maand, waarin de werkloze werknemer de leeftijd van 65 jaar
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 In geval van overlijden van de echtgenoot van de werkloze werknemer wordt de uitkering tot en met één maand na de
      dag van het overlijden, betaald naar de voordien vastgestelde grondslag.

      2 In geval van overlijden van de werkloze werknemer wordt de uitkering tot en met één maand na de dag van het
      overlijden, betaald naar de voordien vastgestelde grondslag aan:

      a. de echtgenoot van de werkloze werknemer;

      b. bij ontstentenis van de onder *a* bedoelde persoon, het kind of de kinderen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel23
  - number: '24'
    text: |-
      1 De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      3 Elk beding strijdig met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 De uitkering die als gevolg van een besluit als bedoeld in [artikel 17, derde of vierde lid][ref1], of
      [artikel 20][ref2] ten onrechte of tot een te hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is
      betaald, kan van de belanghebbende worden teruggevorderd.

      2 De uitkering kan van de belanghebbende worden teruggevorderd indien blijkt dat deze over dezelfde periode
      waarover een uitkering op grond van deze wet is verleend, later inkomsten ontvangt waarmede bij de vaststelling van
      de uitkering rekening zou zijn gehouden.

      3 Het college is bevoegd tot verrekening van in de voorgaande drie maanden ontvangen middelen met de uitkering.

      4 Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering betrekking
      hebbende kosten. Loonbelasting en premies volksverzekeringen waarvoor het college dat de uitkering verstrekt
      krachtens de [Wet op de loonbelasting 1964][ref3] inhoudingsplichtige is, alsmede de vergoeding, bedoeld
      in [artikel 46 van de Zorgverzekeringswet][ref4], kunnen worden teruggevorderd, voor zover deze belasting,
      premies en vergoeding niet verrekend kunnen worden met de door het college af te dragen loonbelasting, premies
      volksverzekeringen en vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002471
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
