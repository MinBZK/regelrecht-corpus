  - number: 11a
    text: |-
      Een aanvraag is gericht tot burgemeester en wethouders en wordt overeenkomstig
      [artikel 30c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend
      bij het Uitvoeringsinstituut werknemersverzekeringen. Na de overdracht van de aanvraag door
      de het Uitvoeringsinstituut werknemersverzekeringen aan burgemeester en wethouders ingevolge
      [artikel 30c, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag
      verder behandeld door burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
