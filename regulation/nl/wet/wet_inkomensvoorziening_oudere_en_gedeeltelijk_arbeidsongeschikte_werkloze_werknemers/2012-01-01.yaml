preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een inkomensvoorziening te treffen voor oudere
    en gedeeltelijk arbeidsongeschikte werkloze werknemers van wie het recht op een uitkering op grond van de
    Werkloosheidswet is geëindigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. college: het college van burgemeester en wethouders, bedoeld in [artikel 11][ref1];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. het Inlichtingenbureau: het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. netto minimumloon: het netto minimumloon, bedoeld in [artikel 37, eerste lid, van de Wet werk en bijstand][ref5];

      g. netto minimumjeugdloon: het netto minimumloon, bedoeld in
      [artikel 37, eerste lid, van de Wet werk en bijstand][ref6], waarbij onder het minimumloon
      per maand wordt verstaan het voor de betreffende leeftijd geldende minimumloon, bedoeld in
      [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref7], met dien verstande, dat voor de
      berekening, bedoeld in [artikel 37, tweede lid, van de Wet werk en bijstand][ref8], rekening wordt gehouden met
      uitsluitend de algemene heffingskorting;

      h. vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf
      of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref9].


