  - number: '47'
    text: |-
      Het college is verplicht, indien zij bij de uitvoering van deze wet het gegronde vermoeden krijgen van een misdrijf
      dat is gepleegd ten nadele van een uitvoeringsorgaan van de sociale verzekeringswetten of van een overheidsorgaan,
      voorzover dit is belast met het verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van
      bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel47
  - number: '48'
    text: |-
      1 Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet
      aan de hieronder vermelde organen en derden kosteloos de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van de hierbij vermelde wetten of wettelijke regelingen:

      a. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van
      de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref3], en [34, eerste lid, onderdeel a, van die wet][ref4];

      b. de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref5],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref6] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref7];

      c. het college van andere gemeenten voor de uitvoering van deze wet, de [Wet werk en bijstand][ref8] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref9];

      d. het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref10],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref11], de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref12] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref13], voor de uitvoering van de [Zorgverzekeringswet][ref14] of de
      [Algemene Wet Bijzondere Ziektekosten][ref15];

      e. derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen;

      f. buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;

      g. bestuursorganen van Aruba, Curaçao, en Sint Maarten voor de vervulling van een taak van zwaarwegend algemeen
      belang;

      h. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor de uitvoering van de [Wet inburgering][ref16];

      i. Onze Minister van Veiligheid en Justitie in verband met de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen.

      2 Het verstrekken door burgemeester en wethouders aan de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.

      3 De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      belanghebbenden daardoor onevenredig wordt geschaad.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens dienen te worden verstrekt.


