  - number: '38'
    text: |-
      1 Onverminderd [artikel 37a, eerste lid][ref1], verleent het college aan een alleenstaande ouder die de volledige
      zorg heeft voor een tot zijn last komend kind tot vijf jaar op diens verzoek ontheffing van de verplichtingen,
      bedoeld in [artikel 37, eerste lid, onderdelen a tot en met d][ref2].

      2 De ontheffing, bedoeld in het eerste lid, wordt eenmalig verleend.

      3 De ontheffing, bedoeld in het eerste lid, wordt niet verleend voor zover uit houding en
      gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [artikel 37, eerste lid, onderdeel e][ref3], niet wil nakomen.

      4 De ontheffing, bedoeld in het eerste lid, geldt zolang het jongste kind van de alleenstaande ouder de leeftijd
      van vijf jaar nog niet heeft bereikt. Onverminderd de eerste zin geldt de ontheffing gedurende ten hoogste vijf
      jaar. Bij verhuizing naar een andere woonplaats wordt op deze periode in mindering gebracht de periode, dan wel
      perioden, waarin de alleenstaande ouder in de voorgaande woonplaats, dan wel de voorgaande woonplaatsen, gebruik
      heeft gemaakt van de ontheffing bedoeld in het eerste lid.

      5 De ontheffing, bedoeld in het eerste lid, wordt, indien de volledige duur van vijf jaar nog niet volledig is
      benut:

      a. van rechtswege opgeschort, met ingang van de datum waarop het jongste kind de leeftijd van vijf jaar bereikt;

      b. van rechtswege opgeschort indien niet langer recht op bijstand bestaat;

      c. door het college opgeschort op een daartoe strekkend verzoek van de alleenstaande ouder aan wie de ontheffing,
      bedoeld in het eerste lid, is verleend; of

      d. door het college ingetrokken indien uit houding en gedragingen van de alleenstaande ouder ondubbelzinnig blijkt
      dat hij zijn verplichtingen, bedoeld in [artikel 37, eerste lid, onderdeel e][ref4], niet wil nakomen.

      6 Op een daartoe strekkend verzoek van de alleenstaande ouder met een kind tot vijf jaar beëindigt het college een
      opschorting als bedoeld in het vijfde lid, onderdelen a tot en met c, indien de daarin genoemde omstandigheden niet
      langer van toepassing zijn.

      7 Het college stelt binnen zes maanden na ontvangst van het verzoek, bedoeld in het eerste lid, een plan van
      aanpak op voor de invulling van de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref5], voor de
      alleenstaande ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid.

      8 Het college verricht na het opstellen van het plan van aanpak, bedoeld in het zevende lid, iedere zes
      maanden een heronderzoek naar de in het van toepassing zijnde plan van aanpak opgenomen voorziening, bedoeld in
      [artikel 37, eerste lid, onderdeel e][ref6]. Het heronderzoek strekt zich mede uit tot de naleving van de in het
      van toepassing zijnde plan van aanpak opgenomen voorziening. Het college beoordeelt tevens bij het verrichten van
      het heronderzoek of er aanleiding bestaat de voorziening te wijzigen.

      9 Indien het heronderzoek, bedoeld in het achtste lid, daartoe aanleiding geeft stelt het college een gewijzigd
      plan van aanpak op.

      10 Het college vult de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref7], voor de alleenstaande
      ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid en die niet beschikt over een
      startkwalificatie ten minste in met scholing of opleiding die de toegang tot de arbeidsmarkt bevordert, tenzij
      naar het oordeel van het college een dergelijke scholing of opleiding de krachten of bekwaamheden van betrokkene te
      boven gaat.

      11 Op verzoek van de alleenstaande ouder die beschikt over een startkwalificatie en aan wie een ontheffing is
      verleend als bedoeld in het eerste lid, vult het college de voorziening in met een opleiding, als bedoeld in
      [artikel 7.2.2., tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref8], die de toegang tot de
      arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of
      bekwaamheden van de alleenstaande ouder te boven gaat.

      12 Het college verlaagt de uitkering overeenkomstig de verordening, bedoeld in
      [artikel 35, eerste lid, onderdeel d][ref9], indien het college de ontheffing, bedoeld in het eerste lid, heeft
      ingetrokken op grond van het vijfde lid, onderdeel d. Van een verlaging wordt afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.


