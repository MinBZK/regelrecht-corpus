  - number: '44'
    text: |-
      1 Ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen
      te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte
      van een persoon te wiens behoeve een uitkering is gevraagd of wordt verleend en die in zijn dienst dan wel voor
      hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich mede uit tot de
      inkomsten van een persoon van wie uitkeringen ingevolge [hoofdstuk II, paragraaf 5][ref1], worden of kunnen worden
      teruggevorderd.

      2 De opgaven en inlichtingen moeten desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004044
        hoofdstuk: II
        paragraaf: '5'
  - number: '45'
    text: |-
      1 De hieronder vermelde instanties zijn verplicht desgevraagd aan het college kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet:

      a. het college van andere gemeenten;

      b. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;

      c. de belastingdienst;

      d. het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4];

      e. de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5] als
      inkomen worden aangemerkt;

      f. de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref6] vastgestelde vergoeding;

      g. de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref7];

      h. de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref8] en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      betreffende de toepassing van de [Wet bevordering eigenwoningbezit][ref9];

      i. Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel, voor zover het betreft
      het onderwijs of onderzoek op het gebied van de landbouw en de natuurlijke omgeving, Onze
      Minister van Economische Zaken, Landbouw en Innovatie betreffende de toepassing van de
      [Wet studiefinanciering 2000][ref10], de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref11] en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12];

      j. Onze Minister van Veiligheid en Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel;

      k. de instanties en personen die woonruimte verhuren;

      l. de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;

      m. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;

      n. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties betreffende de toepassing van de
      [Wet inburgering][ref13].

      2 Het vragen door burgemeester en wethouders en het verstrekken door de in het eerste lid bedoelde instanties van
      de in het eerste lid bedoelde opgaven en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.

      3 Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college
      kosteloos alle gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken
      die noodzakelijk zijn voor de uitvoering van deze wet.

      4 De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:

      a. van wie kosten van uitkeringen worden of kunnen worden teruggevorderd ingevolge
      [hoofdstuk II, paragraaf 5][ref14];

      b. die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:

      1°. te wiens behoeve een uitkering ingevolge deze wet is gevraagd of wordt verleend;

      2°. van wie kosten van uitkering worden of kunnen worden teruggevorderd ingevolge
      [hoofdstuk II, paragraaf 5][ref15].

      5 De in het eerste en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.

      6 De in het eerste lid, onderdeel a tot en met j, genoemde instanties treffen desgevraagd met het college en met
      het Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud
      en vormgeving van de in het zesde lid bedoelde regelingen.

      8 Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.

      9 Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde
      lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste tot en met zevende lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven met betrekking tot inkomen en vermogen.

      10 Bij de algemene maatregel van bestuur, bedoeld in het negende lid kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.

      11 Onze Minister van Veiligheid en Justitie verstrekt ten aanzien van de persoon die rechtens zijn
      vrijheid is ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel, onverwijld en kosteloos de beschikbare informatie en alle overige opgaven
      en inlichtingen, die van invloed kunnen zijn op het recht op uitkering, aan het college, door tussenkomst
      van het Inlichtingenbureau, waarbij hij gebruik kan maken van het het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref16].


