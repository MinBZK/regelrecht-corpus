  - number: '5'
    text: |-
      1 Recht op uitkering hebben, indien het inkomen per maand minder bedraagt dan de overeenkomstig het derde tot en
      met zesde lid en het negende lid vastgestelde grondslag:

      a. de werkloze werknemer en de echtgenoot met of zonder kinderen;

      b. de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer met een of meer kinderen;

      c. de alleenstaande werkloze werknemer en de thuisinwonende werkloze werknemer zonder kinderen.

      2 Het recht op uitkering komt de werkloze werknemer en de echtgenoot gezamenlijk toe. De uitkering wordt aan de
      werkloze werknemer en de echtgenoot ieder voor de helft uitbetaald, dan wel op hun gezamenlijk verzoek aan een van
      hen voor het geheel.

      3 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat:

      a. voor de werkloze werknemer en de echtgenoot die beiden 21 jaar of ouder zijn, de helft van de grondslag netto
      gelijk is aan € 668,21;

      b. deze voor de werkloze werknemer en de echtgenoot, waarvan een of elk van beiden jonger dan 21 jaar is, de som
      bedraagt van de grondslagen die voor elk van hen als een alleenstaande werknemer of een thuisinwonende werkloze
      werknemer zou gelden doch ten hoogste de grondslag als bedoeld in onderdeel *a*.

      4 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:

      a. voor de alleenstaande werkloze werknemer van 21 jaar of ouder met een of meer kinderen netto gelijk is aan
      € 1.202,78;

      b. voor de alleenstaande werkloze werknemer van 23 jaar of ouder zonder kinderen netto gelijk is aan € 935,49;

      c. voor de alleenstaande werkloze werknemer van 22 jaar zonder kinderen netto gelijk is aan € 770,04;

      d. voor de alleenstaande werkloze werknemer van 21 jaar zonder kinderen netto gelijk is aan € 676,10.

      5 De grondslag, bedoeld in het eerste lid, wordt door Onze Minister zodanig vastgesteld dat deze:

      a. voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan
      € 1.165,05;

      b. voor de thuisinwonende werkloze werknemer van 18, 19 of 20 jaar met een of meer kinderen netto gelijk is aan
      € 873,02;

      c. voor de alleenstaande werkloze werknemer van 18, 19 of 20 jaar zonder kinderen netto gelijk is aan € 647,25;

      d. voor de thuisinwonende werkloze werknemer zonder kinderen netto gelijk is aan € 355,22.

      6 Indien dat lager is dan de grondslag, vastgesteld op grond van het derde tot en met vijfde lid, bedraagt de
      grondslag, bedoeld in het eerste lid, 10/7 x A + B, waarbij:

      A staat voor de uitkeringen ontvangen door de werkloze werknemer op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3]
      en de [Wet werk en inkomen naar arbeidsvermogen][ref4] in de kalendermaand voorafgaande aan de dag
      waarop de geldende uitkeringsduur op grond van de Werkloosheidswet of de geldende uitkeringsduur
      van de loongerelateerde werkhervattingsuitkering gedeeltelijk arbeidsgeschikten als bedoeld in
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref5] is verstreken;

      B staat voor het loon uit dienstbetrekking dat de werkloze werknemer in die kalendermaand verdiende, waarbij A
      wordt herzien op de wijze als bedoeld in [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref6].

      7 Voor de toepassing van het zesde lid wordt onder uitkering op grond van de [Werkloosheidswet][ref7] tevens
      verstaan inkomen dat op grond van [artikel 34 van de Werkloosheidswet][ref8] geheel in mindering is gebracht op de
      uitkering op grond van de [Werkloosheidswet][ref9].

      8 Voor de toepassing van het zesde lid worden de uitkeringen op grond van de [Werkloosheidswet][ref10] en de
      [Ziektewet][ref11] vermenigvuldigd met 21,75 en vervolgens gedeeld door het aantal werkdagen in die betreffende
      kalendermaand.

      9 Het zesde lid is niet van toepassing, voor zover de uitkomst van de berekening op grond van dat lid minder
      bedroeg dan de van toepassing zijnde grondslag op grond van het derde tot en met vijfde lid, als gevolg van een
      gedeeltelijke eindiging van een recht op uitkering op grond van de [Werkloosheidswet][ref12] door het verrichten
      van werkzaamheden als lid van de Eerste Kamer der Staten-Generaal, van een vertegenwoordigend orgaan van een
      publiekrechtelijk lichaam dat bij rechtstreekse verkiezing wordt samengesteld, of van een algemeen bestuur van
      een waterschap.

      10 De in het derde lid, onderdeel a, vierde lid, onderdeel a en b, en vijfde lid, genoemde bedragen worden
      gewijzigd met ingang van de dag waarop het netto minimumloon wijzigt met het percentage van deze wijziging.

      11 De in het vierde lid, onderdeel c en d, genoemde bedragen worden gewijzigd met ingang van de dag waarop het
      netto minimumjeugdloon wijzigt met het percentage van deze wijziging.

      12 Voor zover het recht op uitkering op grond van de [Werkloosheidswet][ref13] gedeeltelijk is geëindigd door het
      verrichten van werkzaamheden als bedoeld in [artikel 8, tweede lid, van die wet][ref14], wordt bij de toepassing
      van het zesde lid voor de vaststelling van factor A uitgegaan van het bedrag aan loondervingsuitkering dat zou zijn
      genoten indien die werkzaamheden niet zouden zijn verricht.

      13 Het twaalfde lid is van overeenkomstige toepassing indien de loongerelateerde
      uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref15], is verlaagd als gevolg van het verrichten
      van werkzaamheden uit hoofde waarvan de werkloze werknemer geen werknemer is als bedoeld in de [artikelen 8][ref16]
      en [9 van die wet][ref17].


