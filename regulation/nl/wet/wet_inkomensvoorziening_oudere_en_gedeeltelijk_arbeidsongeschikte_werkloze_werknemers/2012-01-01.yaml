  - number: '63'
    text: |-
      1 Onverminderd het derde lid wordt tot een bij ministeriële regeling bepaald tijdstip, dat voor verschillende
      groepen personen verschillend kan worden vastgesteld, onder werkloze werknemer in deze wet en de daarop
      berustende bepalingen mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1] op grond van [artikel 2, onderdeel c of d][ref2],
      zoals dat luidde op die dag, werd aangemerkt als werkloze werknemer.

      2 Onder werkloze werknemer in deze wet en de daarop berustende bepaling wordt
      mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref3]
      werd aangemerkt als werkloze werknemer op grond van [artikel 2, onderdeel c of d][ref4], en die op grond van
      [artikel 3 van de Toeslagenwet][ref5] geen recht heeft op een toeslag op grond van die wet.

      3 [Artikel 7][ref6] is niet van toepassing op de persoon die als gevolg van de inwerkingtreding van
      [artikel 1.11, onderdeel A, van de Wet Invoering en financiering Wet werk en inkomen][ref7] naar arbeidsvermogen
      geen werkloze werknemer is en de echtgenoot van die persoon.


