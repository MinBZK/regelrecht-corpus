  - number: '26'
    text: |-
      1 Indien de uitkering met inachtneming van [artikel 3][ref1] is verleend, worden voor de toepassing van deze
      paragraaf als belanghebbenden aangemerkt de in dat artikel bedoelde personen.

      2 Indien de uitkering met inachtneming van [artikel 3][ref2], had moeten worden verleend,
      maar zulks achterwege is gebleven omdat de belanghebbende onjuiste of onvolledige
      inlichtingen heeft verstrekt, dan wel de verplichting, bedoeld in [artikel 13][ref3], of
      [artikel 30c, tweede en derde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4], niet of
      niet behoorlijk is nagekomen, kan de gedurende het betrokken tijdvak ten onrechte verleende uitkering mede worden
      teruggevorderd van de persoon met wiens inkomen bij de verlening van de uitkering rekening had moeten worden
      gehouden.

      3 De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van de ten
      onrechte verleende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel3
