  - number: '34'
    text: |-
      1 Het college is verantwoordelijk voor:

      a. het ondersteunen van personen die een uitkering op grond van deze wet ontvangen bij arbeidsinschakeling en,
      indien het college daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling noodzakelijk acht, voor het bepalen en aanbieden van deze voorziening, en;

      b. het verlenen van een uitkering aan de werkloze werknemer, bedoeld in [artikel 2][ref1].

      2 Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met het Uitvoeringsinstituut
      werknemersverzekeringen.

      3 Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel2
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '2'
        hoofdstuk: I
  - number: '35'
    text: |-
      1 De gemeenteraad stelt bij verordening regels met betrekking tot:

      a. het ondersteunen bij arbeidsinschakeling en het aanbieden van voorzieningen gericht op arbeidsinschakeling,
      bedoeld in [artikel 34, eerste lid, onderdeel a][ref1];

      b. de weigering en verlaging, bedoeld in [artikel 20][ref2];

      c. de bestrijding van het ten onrechte ontvangen van een uitkering alsmede van misbruik en oneigenlijk gebruik van
      de wet in het kader van het financiële beheer;

      d. het verlagen van de uitkering, bedoeld in [artikel 38, twaalfde lid][ref3].

      2 De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op de taken vermeld in
      [artikel 34, eerste lid, onderdeel a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel34
