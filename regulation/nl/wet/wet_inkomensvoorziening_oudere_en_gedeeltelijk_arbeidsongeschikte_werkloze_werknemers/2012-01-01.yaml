  - number: '27'
    text: |-
      De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het college de inlichtingen te verstrekken die
      voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het college kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 25, eerste en tweede lid][ref1],
      invorderen bij dwangbevel.

      2 Indien degene van wie de uitkering wordt teruggevorderd algemene bijstand
      op grond van de [Wet werk en bijstand][ref2] of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref4] ontvangt, is het college bevoegd tot verrekening van die
      uitkering met die algemene bijstand of uitkering.

      3 Indien degene van wie de uitkering wordt teruggevorderd een uitkering of algemene bijstand
      ontvangt van een andere gemeente dan de gemeente waarvan het college de uitkering terugvordert,
      dan wel een uitkering of inkomensvoorziening ontvangt op grond van de [Werkloosheidswet][ref5],
      de [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet werk en inkomen naar arbeidsvermogen][ref9], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10], de [Wet arbeidsongeschiktheidsvoorziening militairen][ref11],
      de [Wet arbeid en zorg][ref12], de [Wet inkomensvoorziening oudere werklozen][ref13], de [Toeslagenwet][ref14],
      de [Algemene Ouderdomswet][ref15] of de [Algemene nabestaandenwet][ref16], betaalt dat college, het
      Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Sociale verzekeringsbank het bedrag van de
      terugvordering, zonder dat daarvoor een machtiging nodig is van de belanghebbende, op verzoek aan het college, dat
      besluit tot terugvordering.

      4 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref17] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref18], door middel van toezending per post aan
      degene van wie uitkering wordt teruggevorderd.

      5 Zolang de belanghebbende de verplichting, bedoeld in [artikel 27][ref19], niet of niet behoorlijk nakomt:

      a. is het college, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref20], bevoegd
      tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref21], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref22], niet bij invordering van de onverschuldigd betaalde
      uitkering bij dwangbevel.


