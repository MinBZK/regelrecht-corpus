  - number: '15'
    text: |-
      1 Het college stelt het recht op uitkering op schriftelijke aanvraag vast.

      2 De uitkering wordt door de werkloze werknemer en de echtgenoot gezamenlijk aangevraagd, dan wel door een van hen
      met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel15
  - number: 16a
    text: |-
      1 Indien door het college is vastgesteld dat recht op uitkering bestaat, wordt de uitkering toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om uitkering aan te vragen.

      2 De belanghebbende heeft zich gemeld als zijn naam, adres en woonplaats zijn geregistreerd en hij in staat is
      gesteld zijn aanvraag in te dienen bij het Uitvoeringsinstituut werknemersverzekeringen.

      3 Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de uitkering wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel16a
  - number: '17'
    text: |-
      1 Indien de belanghebbende de voor de verlening van de uitkering van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien
      de belanghebbende anderszins onvoldoende medewerking verleent aan het onderzoek, kan het college het recht op
      uitkering opschorten:

      a. vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of

      b. vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.

      2 Het college doet mededeling van de opschorting aan de belanghebbende en nodigen hem uit binnen een door hen te
      stellen termijn het verzuim te herstellen.

      3 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, kan het college een dergelijk besluit herzien of intrekken:

      a. indien een gedraging als bedoeld in [artikel 20, eerste lid][ref1], of het niet of
      niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 13, eerste lid][ref2], of
      [artikel 30c, tweede en derde lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;

      b. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.

      4 Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor
      gestelde termijn, kan het college na het verstrijken van deze termijn het besluit tot toekenning van uitkering
      intrekken met ingang van de eerste dag waarover het recht op uitkering is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel17
