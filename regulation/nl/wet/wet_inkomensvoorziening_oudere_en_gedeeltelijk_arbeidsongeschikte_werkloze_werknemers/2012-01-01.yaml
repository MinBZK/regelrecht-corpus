  - number: '7'
    text: |-
      Indien het recht op uitkering als gevolg van werkaanvaarding van de werkloze werknemer of de echtgenoot is
      geëindigd, en vervolgens opnieuw werkloosheid ontstaat, herleeft het recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt onder inkomen verstaan:

      a. voor de werkloze werknemer en de echtgenoot: de som van het inkomen uit arbeid of overig inkomen van hemzelf en
      zijn echtgenoot;

      b. voor de alleenstaande en de thuiswonende werkloze werknemer: zijn inkomen uit arbeid of overig inkomen.

      2 In afwijking van het eerste lid wordt niet als inkomen uit arbeid beschouwd het inkomen uit arbeid gedurende
      zes aangesloten maanden tot 25 procent van dit inkomen, met een maximum van € 291,04  per maand, voor
      zover een uitkering wordt ontvangen en dit naar het oordeel van burgemeester en wethouders bijdraagt aan de
      arbeidsinschakeling.

      3 Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder inkomen uit arbeid of overig inkomen
      als bedoeld in het eerste lid. Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk,
      niet, of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van
      betrokkene in aanmerking wordt genomen alsof het wel volledig wordt genoten.

      4 Onze Minister herziet het bedrag, genoemd in het tweede lid, met ingang van een door hem te bepalen dag, voor
      zover de ontwikkeling van het in [artikel 31, tweede lid, onderdeel n, van de Wet werk en bijstand][ref1] genoemde
      bedrag daartoe aanleiding geeft.

      5 In afwijking van het eerste lid wordt niet als inkomen uit arbeid beschouwd het inkomen uit arbeid van een
      alleenstaande ouder tot 12,5 procent van dit inkomen, met een maximum van € 187,28  per maand, gedurende een
      aaneengesloten periode van maximaal 30 maanden, voor zover hij een uitkering ontvangt, ingeval:

      a. hij de volledige zorg heeft voor zijn kind tot 12 jaar,

      b. de periode van zes aaneengesloten maanden, bedoeld in het tweede lid, is verstreken, en

      c. dit volgens het college bijdraagt aan zijn arbeidsinschakeling.

      6 Onze Minister herziet het bedrag, genoemd in het vijfde lid, met ingang van een door hem te bepalen dag, voor
      zover de ontwikkeling van het in [artikel 31, tweede lid, onderdeel r, van de Wet werk en bijstand][ref2] genoemde
      bedrag daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
