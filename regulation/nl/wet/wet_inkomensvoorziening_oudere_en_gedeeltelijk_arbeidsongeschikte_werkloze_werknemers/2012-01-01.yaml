  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder werkloze werknemer de persoon die werkloos is
      en de leeftijd van 65 jaar nog niet heeft bereikt en:

      a. die:

      1°. na het bereiken van de leeftijd van 50 jaar werkloos is geworden;

      2°. in verband met die werkloosheid recht heeft gekregen op een uitkering op grond van
      [hoofdstuk II van de Werkloosheidwet][ref1] met een duur van meer dan drie maanden, en

      3°. nadien de volledige uitkeringsduur, bedoeld in [hoofdstuk II van de Werkloosheidswet][ref2],
      inclusief een eventuele verlenging van deze duur op grond van [artikel 76 van die wet][ref3], heeft
      bereikt, tenzij op dat tijdstip een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref4] van toepassing is; of

      b. 1°. die na het bereiken van de leeftijd van 50 jaar recht heeft gekregen op een
      loongerelateerde werkhervattingsuitkering gedeeltelijk arbeidsongeschikten als bedoeld in
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref5], en

      2°. wiens recht op werkhervattingsuitkering gedeeltelijk arbeidsgeschikten nadien is geëindigd omdat zijn mate van
      arbeidsongeschiktheid niet langer ten minste 35% bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
