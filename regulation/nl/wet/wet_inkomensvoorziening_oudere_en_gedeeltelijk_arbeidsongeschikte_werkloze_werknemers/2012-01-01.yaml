  - number: '53'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Onze Minister treedt daarbij niet in de besluitvorming inzake
      individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in
      overeenstemming heeft gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel53
  - number: 53a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel53a
  - number: '54'
    text: |-
      1 Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.

      2 Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel54
  - number: '55'
    text: |-
      1 Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het
      toezicht, de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.

      3 De inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in [artikel 54][ref1], worden
      kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel54
    url: https://wetten.overheid.nl/BWBR0004044/2012-01-01#Artikel55
