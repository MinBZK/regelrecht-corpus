        artikel: 1.2.2
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt op een door de Minister van Infrastructuur en Milieu te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0034098/2013-10-30#Artikel2
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling ex artikel 1.1.1, derde lid, Vuurwerkbesluit.'
