preamble:
  text: |-
    Gelet op artikel 1.1.1, derde lid, van het Vuurwerkbesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0034098/2013-10-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder professioneel vuurwerk wordt mede verstaan vuurwerk dat niet behoort tot categorie 1, 2 of 3 en wel behoort
      tot:

      a. professioneel vuurwerk als bedoeld in [artikel 1.1.1 van het Vuurwerkbesluit][ref1], zoals dat artikel luidde op
      3 juli 2010,

      b. vuurwerk bestemd voor particulier gebruik als bedoeld in
      [artikel 1.2.2, zevende lid, van het Vuurwerkbesluit][ref2] of

      c. vuurwerk waarvan de bestemming niet kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0013360#Artikel1.2.2
    url: https://wetten.overheid.nl/BWBR0034098/2013-10-30#Artikel1
    references:
      - id: ref1
