        artikel: 5:44
  - number: V
    text: |-
      Voor de plaatsing van deze wet in het Staatsblad stelt Onze Minister van Justitie de nummering van de artikelen in
      de [titels 4.4][ref1], [5.1][ref2] en [5.4][ref3] en in [afdeling 10.1.3][ref4] opnieuw vast en brengt hij de in
      deze wet voorkomende aanhalingen van deze artikelen met de nieuwe nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
