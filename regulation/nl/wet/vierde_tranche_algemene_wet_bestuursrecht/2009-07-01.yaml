preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op artikel 107, tweede lid, van de Grondwet wenselijk
    is de Algemene wet bestuursrecht aan te vullen met bepalingen inzake bestuursrechtelijke geldschulden, inzake
    bestuurlijke handhaving, in het bijzonder de bestuurlijke boete, en inzake attributie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026016/2009-07-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Op een verplichting tot betaling van een geldsom aan of door een bestuursorgaan die is vastgesteld of ontstaan
      voor het tijdstip van inwerkingtreding van deze wet, blijft het recht zoals dat gold voor dat tijdstip van
      toepassing.

      2 Op een verplichting tot betaling aan of door een bestuursorgaan in verband met een subsidie die voor het tijdstip
      van inwerkingtreding van deze wet is verleend, blijft het recht zoals dat gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0026016/2009-07-01#ArtikelIII
  - number: IV
    text: |-
      1 Indien een bestuurlijke sanctie wordt opgelegd wegens een overtreding die plaatsvond voor het tijdstip van
      inwerkingtreding van deze wet, blijft het recht zoals dat gold voor dat tijdstip van toepassing.

      2 [Artikel 5:44, eerste lid][ref1], is van overeenkomstige toepassing indien het recht tot strafvervolging is
      vervallen doordat is voldaan aan de voorwaarden die krachtens een wettelijk voorschrift zijn gesteld ter voorkoming
      van strafvervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel544
    url: https://wetten.overheid.nl/BWBR0026016/2009-07-01#ArtikelIV
    references:
      - id: ref1
