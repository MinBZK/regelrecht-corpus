  - number: VI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026016/2009-07-01#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Vierde tranche Algemene wet bestuursrecht.'
    url: https://wetten.overheid.nl/BWBR0026016/2009-07-01#ArtikelVII
