preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat integriteitskwesties en aanhoudende bestuurlijke problemen het gezag
    en functioneren van het decentraal bestuur aantasten en het daarom wenselijk is een regeling te treffen die de
    integriteit en bestuurbaarheid van het decentraal bestuur waarborgt;


    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047451/2023-04-01#ArtikelAanhef
articles:
  - number: VI
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0047451/2023-04-01#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Wet bevorderen integriteit en functioneren decentraal bestuur.'
    url: https://wetten.overheid.nl/BWBR0047451/2023-04-01#ArtikelVII
