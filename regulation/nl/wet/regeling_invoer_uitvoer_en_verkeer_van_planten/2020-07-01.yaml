  - number: '3'
    text: |-
      De [artikelen 4][ref1] tot en met [20][ref2] gelden, voor zover niet anders is bepaald, voor hout:


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel20
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '20'
        paragraaf: '5'
  - number: 3.a
    text: |-
      slechts indien dit, geheel of gedeeltelijk, zijn natuurlijke ronde oppervlak, met of zonder schors, heeft behouden,
      dan wel de vorm heeft van plakjes, spanen, kleine stukjes, zaagsel, restanten en afval van hout,
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel3
  - number: 3.b
    text: |-
      in de vorm van een stuwmateriaal, tussenschotten, laadborden of verpakkingsmateriaal die worden gebruikt bij
      het vervoer van voorwerpen van allerlei aard, voor zover het hout vanuit plantenziektenkundig oogpunt een gevaar
      inhoudt.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel3
  - number: '4.1'
    text: 'Planten, plantaardige produkten of andere materialen, die in het verkeer worden gebracht moeten:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: 4.1.a
    text: vrij zijn van schadelijke organismen, genoemd in bijlage I, deel A, bij [richtlijn 2000/29/EG](32000L0029);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: 4.1.b
    text: |-
      voor zover genoemd in bijlage II, deel A, bij [richtlijn 2000/29/EG](32000L0029) vrij zijn van de daarbij in dat
      deel van die bijlage genoemde schadelijke organismen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: 4.1.c
    text: |-
      vrij zijn van schadelijke organismen, voor zover deze een acuut gevaar voor planten of plantaardige produkten
      opleveren;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: 4.1.d
    text: |-
      voldoen aan de bijzondere eisen, genoemd in bijlage IV, deel A, rubriek II, bij [richtlijn 2000/29/EG](32000L0029),
      die daarbij in dat deel van die bijlage worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: '4.2'
    text: |-
      Op planten, plantaardige producten of andere materialen, genoemd in bijlage V, deel A, bij [richtlijn nr.
      2000/29/EG](32000L0029), en zaad, genoemd in bijlage IV bij [richtlijn nr. 2000/29/EG](32000L0029) dan wel op
      de verpakkingen waarin of de vervoermiddelen waarmee zij worden vervoerd, die beroepshalve in het verkeer worden
      gebracht, het plaatselijk verkeer uitgezonderd, is een plantenpaspoort aangebracht.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: '4.3'
    text: |-
      Onder plaatselijk verkeer als bedoeld in het tweede lid wordt verstaan het verkeer door degene, die niet uit hoofde
      van zijn beroep of bedrijf bij de produktie van planten is betrokken, van hout van Castanea Mill en hout, ook
      wanneer het hout zijn natuurlijke ronde oppervlak niet heeft behouden, van Platanus L naar de eindverbruiker, die
      uit hoofde van zijn beroep of bedrijf evenmin bij de produktie van planten is betrokken.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden planten, plantaardige produkten of andere materialen genoemd in bijlage III, deel B, bij [richtlijn
      2000/29/EG](32000L0029) in de daarbij in die bijlage genoemde beschermde gebieden te brengen, indien deze van
      oorsprong zijn uit de daarbij genoemde landen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd de eisen, genoemd in [artikel 4][ref1] worden in beschermde gebieden uitsluitend die planten,
      plantaardige producten of andere materialen in het verkeer gebracht die:


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel4
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '4'
        paragraaf: '2'
  - number: 5.2.a
    text: vrij zijn van schadelijke organisme, genoemd in bijlage I, deel B, bij [richtlijn nr. 2000/29/EG](32000L0029);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5.2.b
    text: vrij zijn van schadelijke organismen, genoemd in bijlage II, deel B bij [richtlijn nr. 2000/29/EG](32000L0029);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5.2.c
    text: voldoen aan de eisen genoemd, in bijlage IV, deel B, bij [richtlijn nr. 2000/29/EG](32000L0029).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: '5.3'
    text: |-
      Op de planten, plantaardige producten of andere materialen, genoemd in bijlage V, deel A, bij [richtlijn
      nr. 2000/29/EG](32000L0029), en zaad, genoemd in bijlage IV bij [richtlijn nr. 2000/29/EG](32000L0029), die
      beroepshalve in het verkeer worden gebracht in een beschermd gebied, dan wel op de verpakkingen waarin of de
      vervoermiddelen waarmee zij worden vervoerd, is een plantenpaspoort aangebracht.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: '5.4'
    text: |-
      In afwijking van het derde lid kunnen planten, plantaardige produkten of andere materialen via een beschermd
      gebied naar een eindbestemming buiten dat gebied worden vervoerd zonder een plantenpaspoort voor het betreffende
      beschermde gebied, indien is voldaan aan de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5.4.a
    text: |-
      de gebruikte verpakking, dan wel het voertuig waarin deze planten, plantaardige produkten of andere materialen
      worden vervoerd, moet schoon zijn en vrij van schadelijke organismen, genoemd bij het betreffende beschermde gebied
      in [richtlijn 92/76/EEG](31992L0076), en moet van zodanige aard zijn dat er geen gevaar bestaat voor verspreiding
      van deze schadelijke organismen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5.4.b
    text: |-
      zodra deze planten, plantaardige produkten of andere materialen zijn verpakt, moet de verpakking, dan wel het
      voertuig waarin zij worden vervoerd, overeenkomstig strenge fytosanitaire normen en ten genoegen van de Minister
      zo worden gesloten en tijdens het vervoer door het betrokken beschermd gebied gesloten blijven, dat er geen gevaar
      bestaat voor de verspreiding van schadelijke organismen in het betrokken beschermde gebied en dat hun identiteit
      gegarandeerd is en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5.4.c
    text: |-
      de planten, plantaardige produkten of andere materialen moeten vergezeld gaan van een in het handelsverkeer normaal
      gebruikt document waarin is aangegeven dat de produkten niet van oorsprong zijn uit het betrokken beschermde gebied
      en een bestemming hebben buiten dat beschermde gebied.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5
  - number: 5bis
    text: |-
      Bacterievuurwaardplanten voldoen uitsluitend aan de bijzondere eisen, bedoeld in
      [artikel 5, tweede lid, onderdeel c][ref1], indien zij zijn aangewezen door de Minister en worden geteeld in door
      hem aangewezen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel5
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel5bis
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '5'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Een plantenpaspoort wordt door de minister afgegeven, indien na grondig onderzoek van planten, plantaardige
      producten of andere materialen, genoemd in bijlage V, deel A, bij [richtlijn nr. 2000/29/EG](32000L0029), en zaad,
      genoemd in bijlage IV bij [richtlijn nr. 2000/29/EG](32000L0029), alsmede van de verpakking daarvan geheel of
      gedeeltelijk aan de hand van een representatief monster en zonodig aan de gebruikte vervoermiddelen is gebleken dat
      de planten, plantaardige producten of andere materialen, genoemd in bijlage V, deel A, bij [richtlijn nr. 2000/29/
      EG](32000L0029), en zaad, genoemd in bijlage IV bij [richtlijn nr. 2000/29/EG](32000L0029):
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: 6.1.a
    text: |-
      niet zijn aangetast door de in bijlage I, deel A, rubriek II, bij [richtlijn 2000/29/EG](32000L0029) genoemde
      schadelijke organismen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: 6.1.b
    text: |-
      voor zover genoemd in bijlage II, deel A, rubriek II, bij [richtlijn 2000/29/EG](32000L0029) niet zijn aangetast
      door de schadelijke organismen, die daarbij in dat deel van die bijlage worden genoemd;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: 6.1.c
    text: |-
      voldoen aan de bijzondere eisen gesteld in bijlage IV, deel A, rubriek II bij [richtlijn 2000/29/EG](32000L0029),
      die daarbij in dat deel van die bijlage worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: '6.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid kan van afgifte van een plantenpaspoort voor zaad worden afgezien
      overeenkomstig een door de Commissie genomen besluit.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: '6.3'
    text: |-
      Een plantenpaspoort wordt niet verstrekt indien uit het onderzoek, bedoeld in het eerste lid, blijkt dat de
      planten, plantaardige produkten of andere materialen:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: 6.3.a
    text: |-
      zijn aangetast door de in bijlage I, deel A, rubriek I, bij [richtlijn 2000/29/EG](32000L0029) genoemde schadelijke
      organismen, of
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: 6.3.b
    text: |-
      voor zover genoemd in bijlage II, deel A, rubriek I, bij [richtlijn 2000/29/EG](32000L0029), zijn aangetast door de
      schadelijke organismen, die daarbij in dat deel van die bijlage worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: '6.4'
    text: |-
      Met betrekking tot beschermde gebieden zijn het eerste en tweede lid van overeenkomstige toepassing, met dien
      verstande dat uit het onderzoek tevens moet zijn gebleken, dat de planten en plantaardige produkten of ander
      materialen voldoen aan de eisen, gesteld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel5
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '5'
        paragraaf: '2'
  - number: '6.5'
    text: |-
      Wanneer uit onderzoek van de planten, plantaardige produkten of andere materialen blijkt, dat een deel van
      de planten of plantaardige produkten, die door de producent worden geteeld, geproduceerd of gebruikt, of die
      anderszins op zijn bedrijf aanwezig zijn danwel een deel van het op het bedrijf gebruikte groeimedium, geen gevaar
      voor verspreiding van schadelijke organismen kunnen opleveren wordt, in afwijking van het eerste en tweede lid,
      uitsluitend voor dat deel een plantenpaspoort afgegeven.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
  - number: '6.6'
    text: |-
      Een onderzoek als bedoeld in het eerste lid geschiedt uitsluitend bij de natuurlijke of rechtspersoon, die in het
      officiële register, bedoeld in [artikel 18][ref1], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel18
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '18'
        paragraaf: '4'
  - number: '6.7'
    text: |-
      In afwijking van het tweede lid wordt voor planten, plantaardige produkten of andere materialen waarvoor een
      ontheffing als bedoeld in [artikel 2, derde lid][ref1], is verleend, een plantenpaspoort verstrekt indien,
      behoudens het onderwerp van de ontheffing, de planten, plantaardige produkten of andere materialen voldoen aan
      het bepaalde in het eerste lid. Op het plantenpaspoort wordt vermeld: Dit materiaal wordt op grond van richtlijn
      2008/61/EG naar een andere plaats overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel2
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '2'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Een plantenpaspoort als bedoeld in [artikel 6][ref1] bestaat uit een label en een begeleidend document, waarop de
      gegevens, voorgeschreven in de bijlage van [richtlijn 92/105/EEG](31992L0105), staan vermeld, waarbij op het label
      minimaal de in de punten 1 tot en met 5 en op het begeleidend document minimaal de in de punten 1 tot en met 10 van
      de bijlage bij [richtlijn 92/105/EEG](31992L0105) genoemde gegevens zijn aangegeven, danwel alleen een label, mits
      daarop alle in de punten 1 tot en met 10 van de bijlage bij [richtlijn 92/105/EEG](31992L0105) genoemde gegevens
      zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel6
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '6'
        paragraaf: '2'
  - number: '7.2'
    text: Een plantenpaspoort moet zijn gesteld in een der officiële talen van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
  - number: '7.3'
    text: |-
      Een plantenpaspoort is slechts geldig, indien is voldaan aan de vereisten gesteld in artikel 1, tweede lid,
      onderdelen a en c, artikel 2, tweede lid en artikel 3, tweede lid, van [richtlijn 92/105/EEG](31992L0105).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
  - number: '7.4'
    text: |-
      Een plantenpaspoort kan door een ander plantenpaspoort worden vervangen overeenkomstig het bepaalde in artikel 10,
      derde lid, van [richtlijn 2000/29/EG](32000L0029).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
  - number: '7.5'
    text: |-
      Een plantenpaspoort wordt aangemaakt, gedrukt of nadien bewaard door de Nederlandse Voedsel- en Warenautoriteit,
      een door de Minister aangewezen instantie, dan wel door een geregistreerde producent, handelaar of importeur die
      daartoe schriftelijke toestemming van de Minister heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
  - number: '7.6'
    text: |-
      Een producent, handelaar of importeur, welke toestemming heeft verkregen overeenkomstig het vijfde lid, kan het
      plantenpaspoort gebruiken wanneer het plantenpaspoort is afgegeven overeenkomstig [artikel 6, eerste lid][ref1],
      indien genoemde producent, handelaar of importeur daartoe schriftelijke toestemming van de Minister heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel6
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '6'
        paragraaf: '2'
  - number: '8'
    text: |-
      Commerciële kopers van planten, plantaardige producten of andere materialen bewaren, als eindgebruikers die uit
      hoofde van hun beroep bij de plantaardige productie betrokken zijn, de desbetreffende plantenpaspoorten ten minste
      één jaar en vermelden de referentiegegevens in hun administratie.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel8
  - number: '9'
    text: |-
      Alvorens zaad, genoemd in bijlage IV, deel A, rubriek II, bij [richtlijn 2000/29/EG](32000L0029) in het
      verkeer wordt gebracht, stelt de Nederlandse Voedsel- en Warenautoriteit of een onder haar verantwoordelijkheid
      functionerende instelling een onderzoek in ten einde zekerheid te verkrijgen dat het zaad voldoet aan de bijzondere
      eisen die daarop betrekking hebben en in dat deel van die bijlage worden vermeld.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel9
  - number: '10.1'
    text: |-
      Planten, plantaardige produkten of andere materialen, mogen slechts worden ingevoerd uit derde landen, indien zij
      voldoen aan:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
  - number: 10.1.a
    text: |-
      de vereisten, genoemd in [artikel 4, eerste lid, onderdelen a, b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel4
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '4'
        paragraaf: '2'
  - number: 10.1.b
    text: |-
      de bijzondere eisen, genoemd in bijlage IV, deel A, rubriek I, bij [richtlijn 2000/29/EG](32000L0029), die daarbij
      in dat deel van die bijlage worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
  - number: '10.2'
    text: |-
      Het is verboden planten, plantaardige produkten of andere materialen genoemd in bijlage III, deel A, bij [richtlijn
      2000/29/EG](32000L0029) uit derde landen in te voeren, indien deze van oorsprong zijn uit de daarbij genoemde
      landen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
  - number: '10.3'
    text: |-
      Het tweede lid vindt geen toepassing bij doorvoer, voor zover geen gevaar bestaat voor verspreiding van schadelijke
      organismen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
  - number: '10.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op hout, in de vorm van stuwmateriaal, tussenschotten,
      laadborden of verpakkingsmateriaal dat daadwerkelijk gebruikt wordt bij het vervoer van voorwerpen van allerlei
      aard.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel10
  - number: '11.1'
    text: |-
      In beschermde gebieden mogen uitsluitend die planten, plantaardige produkten of andere materialen worden gebracht
      uit derde landen, die voldoen aan de vereisten, genoemd in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel5
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '5'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      [Artikel 5, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel5
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '5'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Onverminderd artikel 134, eerste lid, van het Douanewetboek van de Unie worden planten, plantaardige producten of
      andere materialen, van herkomst uit een derde land en genoemd in bijlage V, deel B, van [richtlijn nr. 2000/29/
      EG](32000L0029) onder één van de douaneregelingen, vermeld in artikel 5, zestiende lid, onderdelen a en b, van het
      Douanewetboek van de Unie geplaatst als deze voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: 12.1.a
    text: |-
      de planten, plantaardige producten of andere materialen zijn, blijkens onderzoek, niet besmet met in bijlage I,
      deel A, bij richtlijn nr. 2000/29/EG genoemde schadelijke organismen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: 12.1.b
    text: |-
      de planten en plantaardige producten zijn, blijkens onderzoek, niet besmet met in bijlage II, deel A, bij richtlijn
      nr. 2000/29/EG genoemde schadelijke organismen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: 12.1.c
    text: |-
      de planten, plantaardige producten of andere materialen, blijkens onderzoek, voldoen aan de eisen genoemd in
      bijlage IV, deel A;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: 12.1.d
    text: |-
      de planten, plantaardige producten of ander materialen gaan, blijkens onderzoek, vergezeld van een fytosanitair
      certificaat of een fytosanitair certificaat voor wederuitvoer als bedoeld in [artikel 13][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel13
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '13'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Indien de zending bestemd is voor een beschermd gebied, dan is het eerste lid van overeenkomstige toepassing
      met dien verstande, dat het onderzoek zich tevens richt op de in deel B van bijlagen I, II en IV bij [richtlijn
      2000/29/EG](32000L0029) genoemde schadelijke organismen en bijzondere eisen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.3'
    text: |-
      Controle op de identiteit van de zending, alsmede op het inachtnemen van [artikel 10, tweede lid][ref1],
      [artikel 11, tweede lid][ref2], en [artikel 13][ref3] wordt uitgevoerd op het tijdstip dat de zending wordt
      ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005997#Artikel13
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005997
        artikel: '13'
        paragraaf: '3'
  - number: '12.4'
    text: |-
      De controles van de documenten, bedoeld in het eerste lid, onderdeel d, worden afgewikkeld op de plaats van
      binnenkomst.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.5'
    text: |-
      De controles van de identiteit en de fytosanitaire controles, bedoeld in het eerste lid, onderdelen a tot en met c
      en het tweede lid, worden uitgevoerd op de plaats van binnenkomst of op een andere dichtbij gelegen plaats die door
      de douaneautoriteiten en door de minister is erkend overeenkomstig [richtlijn nr. 2004/103/EG](32004L0103).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het vijfde lid kunnen de controles van de identiteit en de fytosanitaire controles, als bedoeld in
      het eerste lid, onderdelen a tot en met c en het tweede lid, worden uitgevoerd op de plaats van bestemming die door
      de douaneautoriteiten en door de minister is erkend overeenkomstig [richtlijn nr. 2004/103/EG](32004L0103).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.7'
    text: |-
      In afwijking van het vijfde lid kunnen, in het geval van douanevervoer van niet-communautaire goederen de controles
      van de identiteit en de fytosanitaire controles, als bedoeld in het eerste lid, onderdelen a tot en met c en
      het tweede lid, worden uitgevoerd overeenkomstig artikel 13 quater, tweede lid, onderdeel c, van [richtlijn nr.
      2000/29/EG](32000L0029) en overeenkomstig [richtlijn nr. 2004/103/EG](32004L0103).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.8'
    text: De minister erkent de plaats als bedoeld in het vijfde tot en met zevende lid.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.9'
    text: Een aanvraag tot erkenning wordt ingediend bij de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.10'
    text: |-
      De zending wordt op de plaats van onderzoek bijeen en duidelijk afgescheiden van andere planten en de grond
      gehouden totdat de minister schriftelijk heeft verklaard, dat dit niet meer wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.11'
    text: |-
      Onverminderd het eerste lid, onderdeel d, is dit artikel is tevens van toepassing op planten, plantaardige
      producten of andere materialen, van herkomst uit een derde land en genoemd in bijlage V, deel B, van [richtlijn nr.
      2000/29/EG](32000L0029) die onder één van de douanebestemmingen, vermeld in artikel 4, vijftiende lid, onderdelen
      b, c, d, en e of onder een van de douaneregelingen vermeld in artikel 4, zestiende lid, onderdelen b en c van het
      communautair douanewetboek worden geplaatst indien er gevaar voor verspreiding van schadelijke organismen bestaat.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.12'
    text: |-
      In afwijking van het eerste lid kan voor een deel van de zendingen, overeenkomstig een door de Commissie genomen
      besluit, afkomstig uit derde landen de vrijgave als bedoeld in het tiende lid worden afgeven na het uitvoeren van
      een onderzoek als bedoeld in het eerste lid, onder d.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: '12.13'
    text: |-
      Dit artikel is niet van toepassing bij doorvoer en het binnenbrengen in de Gemeenschap van planten, plantaardige
      producten of andere materialen welke zonder enige wijziging in hun douanestatus via het grondgebied van een derde
      land worden overgebracht van een plaats in de gemeenschap naar een andere plaats in de Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12
  - number: 12a.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.1.a
    text: |-
      *uitvoeringsbesluit 2011/787/EU:* Uitvoeringsbesluit 2011/787/EU van de Commissie van 29 november 2011 tot
      machtiging van de lidstaten om tijdelijk noodmaatregelen te nemen tegen de verspreiding van Ralstonia solanacearum
      (Smith) Yabuuchi et al., wat Egypte betreft (PbEU 2011, L 319);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.1.b
    text: '*schadelijk organisme:* Ralstonia solanacearum (Smith) Yabuuchi et al.'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2
    text: |-
      Knollen van Solanum tuberosum L., andere dan bestemd voor opplant, van oorsprong uit Egypte mogen slechts in de
      Europese Unie worden binnengebracht indien zij:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2.a
    text: |-
      zijn gekweekt in een gebied dat is opgenomen in de lijst van ziektevrijegebieden, bedoeld in artikel 1, tweede lid,
      van uitvoeringsbesluit 2011/787/EU;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2.b
    text: voldoen aan de voorschriften van de bijlage van uitvoeringsbesluit 2011/787/EU;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2.c
    text: worden binnengebracht in Eemshaven, Harlingen, Beverwijk, Amsterdam, Rotterdam of Vlissingen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2.d
    text: |-
      geïnspecteerd zijn op de aanwezigheid van het schadelijke organisme overeenkomstig de bijlage bij
      uitvoeringsbesluit 2013/413/EU en geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.2.e
    text: |-
      voorzien zijn van een etiket in een officiële taal van de Europese Unie met de vermelding dat ze uit Egypte komen,
      de naam van het schadelijk organisme vrij gebied, de naam en het identificatienummer van de producent en het nummer
      van de partij.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12a.3
    text: |-
      De afvalstoffen die overblijven na het verpakken en verwerken in de Europese Unie van knollen van Solanum tuberosum
      L., andere dan bestemd voor opplant, van oorsprong uit Egypte worden zo verwijderd dat het schadelijk organisme
      zich niet in de Europese Unie kan vestigen of verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12a
  - number: 12b
    text: |-
      [Artikel 12, eerste lid][ref1], is van overeenkomstige toepassing op snijbloemen van Orchidaceae van oorsprong
      uit Thailand, met dien verstande dat het onderzoek, bedoeld in onderdeel d, mede omvat het onderzoek of de zending
      vergezeld gaat van een fytosanitair certificaat dat voldoet aan de bijzondere eisen van beschikking 98/109/EG van
      de Commissie van de Europese Gemeenschappen van 2 februari 1998 tot machtiging van de lidstaten om ten aanzien van
      Thailand tijdelijk spoedmaatregelen te nemen tegen de verspreiding van Thrips palmi Karny.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 12c.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.1.a
    text: |-
      *uitvoeringsbesluit 2018/638:* Uitvoeringsbesluit (EU) 2018/638 van de Commissie van 23 april 2018 tot vaststelling
      van noodmaatregelen om het binnenbrengen en de verspreiding in de Unie van het schadelijke organisme Spodoptera
      frugiperda (Smith) te voorkomen (PbEU 2018, L 105);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.1.b
    text: '*schadelijk organisme:* Spodoptera frugiperda (Smith);'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.1.c
    text: |-
      *gevoelige planten:* vruchten van Capsicum L., Momordica L., Solanum aethiopicum L., Solanum macrocarpon L. en
      Solanum melongena L., en planten, met uitzondering van levende pollen, plantenweefselcultures, zaden en granen, van
      Zea mays L. van oorsprong uit derde landen met uitzondering van Zwitserland.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.2
    text: 'Gevoelige planten mogen slechts in de Europese Unie worden binnengebracht indien:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.2.a
    text: |-
      ze vergezeld gaan van een fytosanitair certificaat als bedoeld in artikel 13, eerste lid, punt ii), van [richtlijn
      2000/29/EG](32000L0029);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.2.b
    text: de oorsprong voldoet aan het bepaalde in artikel 4 van uitvoeringsbesluit 2018/638, en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
  - number: 12c.2.c
    text: |-
      zij, onverminderd [artikel 12][ref1], bij binnenkomst in de Europese Unie overeenkomstig artikel 5 van
      uitvoeringsbesluit 2018/638 worden geïnspecteerd op de aanwezigheid van het schadelijke organisme en geen tekenen
      van aanwezigheid van dat schadelijke organisme zijn gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 12d.1
    text: |-
      Het binnenbrengen en het vervoer in de Europese Unie van met het pepinomozïekvirus besmette zaden van tomaten is
      verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12d.2
    text: 'Zaden van tomaten mogen slechts in de Europese Unie worden binnengebracht indien zij:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12d.2.a
    text: |-
      voldoen aan de voorwaarden van punt 2 van de bijlage bij Beschikking 2004/200/EG van de Commissie van 27 februari
      2004 betreffende maatregelen om het binnenbrengen en de verspreiding in de Gemeenschap van het pepinomozaïekvirus
      te voorkomen (PbEU 2004, L 64), en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12d.2.b
    text: |-
      bij binnenkomst in de Europese Unie overeenkomstig artikel 13, eerste lid, onder i, van richtlijn 2000/29/EG zijn
      gecontroleerd op de aanwezigheid van het pepinomozïekvirus en daarvan vrij zijn bevonden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12d.3
    text: |-
      Zaden van tomaten van oorsprong uit de Europese Unie mogen alleen in de Europese Unie worden vervoerd als zij
      voldoen aan de voorwaarden van punt 2 van de bijlage bij Beschikking 2004/200/EG van de Commissie van 27 februari
      2004 betreffende maatregelen om het binnenbrengen en de verspreiding in de Gemeenschap van het pepinomozaïekvirus
      te voorkomen (PbEU 2004, L 64).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12d.4
    text: |-
      Het derde lid is niet van toepassing op vervoer van zaden die bestemd zijn voor verkoop aan eindconsumenten die
      geen professionele telers zijn, voor zover uit de verpakking van de zaden of uit andere aanduidingen duidelijk kan
      worden afgeleid dat zij voor deze verkoop aan consumenten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12d
  - number: 12e.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.a
    text: '*het schadelijke organisme:* Aromia bungii (Faldermann);'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.b
    text: |-
      *gevoelige planten:* voor opplant bestemde planten met een stam- of wortelhalsdiameter van tenminste 1 centimeter
      op het dikste punt, met uitzondering van zaden, van Prunus spp., met uitzondering van Prunus laurocerasus L.;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.c
    text: |-
      *hout:* hout, geheel of deels verkregen van de gevoelige planten, nader omschreven in artikel 1, onderdeel c, van
      uitvoeringsbesluit 2018/1503;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.d
    text: '*houten verpakkingsmateriaal:* verpakkingsmateriaal, geheel of deels verkregen van de gevoelige planten;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.e
    text: |-
      *afgebakende gebieden:* in de Europese Unie, overeenkomstig artikel 5 van uitvoeringsbesluit 2018/1503,
      vastgestelde besmette zones en bufferzones;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.1.f
    text: |-
      *uitvoeringsbesluit 2018/1503:* Uitvoeringsbesluit (EU) 2018/1503 van de Commissie van 8 oktober 2018 tot
      vaststelling van maatregelen om het binnenbrengen en de verspreiding in de Unie van Aromia bungii (Faldermann) te
      voorkomen (PbEU 2018, L 254).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.2
    text: |-
      Het binnenbrengen in de Europese Unie en de verspreiding van het schadelijke organisme binnen de Europese Unie
      is verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.3
    text: |-
      Een ieder stelt de Minister op de hoogte van de aanwezigheid of vermoedelijke aanwezigheid van het schadelijke
      organisme.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.4
    text: |-
      Gevoelige planten van oorsprong uit een afgebakend gebied mogen slechts binnen de Europese Unie worden vervoerd als
      ze voldoen aan de voorwaarden van artikel 7 van Uitvoeringsbesluit 2018/1503.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.5
    text: |-
      Hout van oorsprong uit een afgebakend gebied en hout dat zijn natuurlijke oppervlak geheel of gedeeltelijk heeft
      behouden en dat in een afgebakend gebied is binnengebracht mag slechts binnen de Europese Unie worden vervoerd als
      het voldoet aan de voorwaarden van artikel 8 van uitvoeringsbesluit 2018/1503.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.6
    text: |-
      Houten verpakkingsmateriaal van oorsprong uit een afgebakend gebied mag slechts binnen de Unie worden vervoerd als
      het voldoet aan de voorwaarden van artikel 9 van uitvoeringsbesluit 2018/1503.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.7
    text: |-
      Afval van behandeling of verwerking van hout respectievelijk houten verpakkingsmateriaal als bedoeld in artikel
      8, tweede en derde lid, respectievelijk artikel 9, tweede lid, van uitvoeringsbesluit 2018/1503 wordt zodanig
      opgeruimd dat het schadelijk organisme zich niet buiten het afgebakende gebied kan verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.8
    text: |-
      Gevoelige planten afkomstig uit derde landen waarvan bekend is dat het schadelijke organisme er voorkomt, mogen
      slechts in de Unie worden binnengebracht als zij voldoen aan de specifieke invoervoorschriften als bedoeld in
      artikel 11 van uitvoeringsbesluit 2018/1503.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12e.9
    text: |-
      Hout afkomstig uit derde landen waarvan bekend is dat het schadelijke organisme er voorkomt, mag slechts in de
      Unie worden binnengebracht als het voldoet aan de specifieke invoervoorschriften als bedoeld in artikel 12 van
      uitvoeringsbesluit 2018/1503.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12e
  - number: 12f.1
    text: |-
      Onverminderd artikel 1 wordt voor de toepassing van dit artikel verstaan onder:

              a
              het schadelijke organisme:

                Phytophthora ramorum Werres, De Cock & Man in 't Veld sp. nov.;



              b
              gevoelige planten:

                planten, met uitzondering van vruchten en zaden, van Acer macrophyllum Pursh, Acer pseudoplatanus
      L., Adiantum aleuticum (Rupr.) Paris, Adiantum jordanii C. Muell., Aesculus californica (Spach) Nutt., Aesculus
      hippocastanum L., Arbutus menziesii Pursch., Arbutus unedo L., Arctostaphylos spp. Adans, Calluna vulgaris (L.)
      Hull, Camellia spp. L., Castanea sativa Mill., Fagus sylvatica L., Frangula californica (Eschsch.) Gray, Frangula
      purshiana (DC.) Cooper, Fraxinus excelsior L., Griselinia littoralis (Raoul), Hamamelis virginiana L., Heteromeles
      arbutifolia (Lindley) M. Roemer, Kalmia latifolia L., Laurus nobilis L., Leucothoe spp. D. Don, Lithocarpus
      densiflorus (Hook. & Arn.) Rehd., Lonicera hispidula (Lindl.) Dougl. ex Torr.&Gray, Magnolia spp. L., Michelia
      doltsopa Buch.-Ham. ex DC, Nothofagus obliqua (Mirbel) Blume, Osmanthus heterophyllus (G. Don) P. S. Green,
      Parrotia persica (DC) C.A. Meyer, Photinia x fraseri Dress, Pieris spp. D. Don, Pseudotsuga menziesii (Mirbel)
      Franco, Quercus spp. L., Rhododendron spp. L., andere dan Rhododendron simsii Planch., Rosa gymnocarpa Nutt., Salix
      caprea L., Sequoia sempervirens (Lamb. ex D. Don) Endl., Syringa vulgaris L., Taxus spp. L., Trientalis latifolia
      (Hook), Umbellularia californica (Hook.& Arn.) Nutt., Vaccinium ovatum Pursh en Viburnum spp. L.;



              c
              gevoelig hout:

                hout van Acer macrophyllum Pursh, Aesculus californica (Spach) Nutt., Lithocarpus densiflorus (Hook. &
      Arn.) Rehd., Quercus spp. L. en Taxus brevifolia Nutt.;



              d
               gevoelige schors:

                aparte schors van hout van Acer macrophyllum Pursh, Aesculus californica (Spach) Nutt., Lithocarpus
      densiflorus (Hook. & Arn.) Rehd., Quercus spp. L. en Taxus brevifolia Nutt.;



              e
              beschikking nr. 2002/757/EG:

                beschikking nr. 2002/757/EG van de Commissie van de Europese Gemeenschappen van 19 september 2002
      houdende voorlopige fytosanitaire noodmaatregelen om het binnenbrengen en de verspreiding in de Gemeenschap van
      Phytophthora ramorum Werres, De Cock & Man in 't Veld sp. nov. te voorkomen (PbEG L 252/37).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.2
    text: |-
      Het binnenbrengen in de Unie en de verspreiding in de Unie van niet-Europese of Europese isolaten van het
      schadelijke organisme is verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.3
    text: |-
      Gevoelige planten en gevoelig hout worden slechts op het grondgebied van de Unie binnengebracht indien zij voldoen
      aan de punten 1a en 2 van bijlage I bij beschikking nr. 2002/757/EG, indien de in de eerste alinea van artikel
      13, eerste lid, van richtlijn 2000/29/EG bedoelde formaliteiten zijn vervuld en indien zij op basis van deze
      formaliteiten met betrekking tot de aanwezigheid van niet-Europese isolaten van het schadelijke organisme vrij van
      het schadelijke organisme worden bevonden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.4
    text: |-
      Het bepaalde in de punten 1a en 2 van bijlage I bij beschikking nr. 2002/757/EG is slechts van toepassing op, op
      of na 1 november 2002 verzonden, voor de Unie bestemde gevoelige planten en gevoelig hout van oorsprong uit de
      Verenigde Staten van Amerika.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.5
    text: |-
      De in deel A, rubriek I, punt 3, van bijlage IV bij [richtlijn nr. 2000/29/EG](32000L0029) vastgestelde maatregelen
      ten aanzien van hout van Quercus L., met inbegrip van hout dat niet zijn natuurlijke ronde oppervlakte heeft
      behouden, van oorsprong uit de Verenigde Staten van Amerika, zijn niet van toepassing op gevoelig hout van Quercus
      L. dat aan de vereisten van punt 2, onder b), van bijlage I bij beschikking nr. 2002/757/EG voldoet.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.6
    text: |-
      Gevoelige planten van oorsprong uit de Verenigde Staten van Amerika worden alleen binnen de Unie vervoerd als zij
      vergezeld gaan van een plantenpaspoort.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.7
    text: |-
      Met ingang van 1 november 2002 worden voor opplant bestemde planten van Viburnum spp., Camellia spp. en
      Rhododendron spp., andere dan Rhododendron simsii Planch, met uitzondering van zaden, van oorsprong uit derde
      landen, andere dan de Verenigde Staten van Amerika, nadat zij op het grondgebied van de Unie zijn binnengebracht,
      alleen binnen de Unie vervoerd indien zij vergezeld gaan van een plantenpaspoort.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.8
    text: |-
      Gevoelige schors van oorsprong uit de Verenigde Staten van Amerika wordt niet op het grondgebied van de Unie
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12f.9
    text: |-
      Voor opplant bestemde planten van Viburnum spp., Camellia spp. en Rhododendron spp., andere dan Rhododendron
      simsii Planch, met uitzondering van zaden, van oorsprong uit de Unie, worden niet in het verkeer gebracht, tenzij
      zij voldoen aan de voorwaarden van punt 3 van bijlage I bij beschikking nr. 2002/757/EG. De producenten van deze
      planten worden geregistreerd overeenkomstig [§ 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0005997
        paragraaf: '4'
  - number: 12f.10
    text: |-
      In afwijking van de [artikelen 12, eerste lid, onder d][ref1], en [13, eerste en tweede lid][ref2], mag gezaagd
      hout van Quercus L. dat vrij is van bast, van oorsprong uit de Verenigde Staten van Amerika, dat bij een van de GN-
      codes en omschrijvingen uit Bijlage V, deel B, onder I.6., van [Richtlijn 2000/29/EG](32000L0029) is ingedeeld,
      zonder fytosanitair certificaat Nederland worden binnengebracht, mits dergelijk hout voldoet aan de voorwaarden van
      de bijlage bij Uitvoeringsbesluit 2013/780/EU van de Commissie van 18 december 2013 houdende afwijking van artikel
      13, lid 1, ii), van [Richtlijn 2000/29/EG](32000L0029) van de Raad ten aanzien van gezaagd hout van Quercus L.,
      Platanus L. en Acer saccharum Marsh. dat vrij is van bast, van oorsprong uit de Verenigde Staten van Amerika (PbEU
      2013, L 346).


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel13
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '13'
        paragraaf: '3'
  - number: 12f.11
    text: |-
      In afwijking van het derde lid mag gezaagd hout dat vrij is van bast van Quercus spp. L. van oorsprong uit de
      Verenigde Staten van Amerika in de Unie worden binnengebracht zonder te voldoen aan punt 2 van bijlage I bij
      beschikking nr. 2002/757/EG, mits het voldoet aan de voorwaarden van bijlage II bij beschikking nr. 2002/757/EG.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12f
  - number: 12i.1
    text: |-
      Onverminderd [artikel 1][ref1] wordt onder toepassing van dit artikel verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel1
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '1'
        paragraaf: '1'
  - number: 12i.1.a
    text: 'het schadelijke organisme: Anoplophora chinensis (Forster);'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.1.b
    text: |-
      gevoelige planten: voor opplant bestemde planten met een stam- of wortelhalsdiameter van tenminste 1 centimeter
      op het dikste punt, met uitzondering van zaden, van Acer spp., Aesculus hippocastanum, Alnus spp., Betula spp.,
      Carpinus spp., Citrus spp., Cornus spp., Corylus spp., Cotoneaster spp., Crataegus spp., Fagus spp., Lagerstroemia
      spp., Malus spp., Platanus spp., Populus spp., Prunus laurocerasus, Pyrus spp., Rosa spp., Salix spp. en Ulmus
      spp.;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.1.c
    text: |-
      uitvoeringsbesluit nr. 2012/138/EU: uitvoeringsbesluit nr. 2012/138/EU van de Commissie van 1 maart 2012 tot
      vaststelling van noodmaatregelen om het binnenbrengen en de verspreiding in de Unie van Anoplophora chinensis
      (Forster) te voorkomen (PbEU 2012 L 64);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.1.d
    text: |-
      afgebakende gebieden: in de Europese Unie, overeenkomstig artikel 6 van uitvoeringsbesluit nr. 2012/138/EU,
      vastgestelde besmette zones en bufferzones.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.2
    text: |-
      Gevoelige planten afkomstig uit derde landen, met uitzondering van gevoelige planten afkomstig uit China, waarvan
      bekend is dat het schadelijke organisme er voorkomt, mogen slechts in de Gemeenschap worden binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.2.a
    text: |-
      zij voldoen aan de specifieke invoervoorschriften van bijlage I, onderdeel 1, onder A, sub 1, bij
      uitvoeringsbesluit nr. 2012/138/EU; en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.2.b
    text: |-
      zij, onverminderd [artikel 12][ref1], bij binnenkomst in de Gemeenschap overeenkomstig bijlage I, onderdeel 1,
      onder A, sub 2, bij uitvoeringsbesluit nr. 2012/138/EU worden geïnspecteerd op de aanwezigheid van het schadelijke
      organisme en geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 12i.3
    text: |-
      Voor opplant bestemde planten van Acer spp, met uitzondering van zaden daarvan, afkomstig uit China mogen tot en
      met de datum, genoemd in artikel 3, tweede lid, eerste alinea, van uitvoeringsbesluit nr. 2012/138/EU niet in de
      Gemeenschap worden binnengebracht.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.4
    text: |-
      Onverminderd het derde lid mogen gevoelige planten afkomstig uit China slechts in de Gemeenschap worden
      binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.4.a
    text: |-
      zij voldoen aan de specifieke invoervoorschriften van bijlage I, onderdeel 1, onder B, sub 1 bij uitvoeringsbesluit
      nr. 2012/138/EU,
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.4.b
    text: |-
      zij, onverminderd artikel 12, bij binnenkomst in de Gemeenschap overeenkomstig bijlage I, onderdeel 1, onder B, sub
      2 bij uitvoeringsbesluit nr. 2012/138/EU worden geïnspecteerd op de aanwezigheid van het schadelijke organisme en
      geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden, en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.4.c
    text: zij voldoen aan artikel 3, eerste lid, onderdeel c, van uitvoeringsbesluit nr. 2012/138/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.5
    text: |-
      Gevoelige planten, van oorsprong uit afgebakende gebieden, mogen alleen binnen de Europese Unie worden vervoerd
      indien zij voldoen aan de voorwaarden zoals gesteld in punt 1 van sectie 2 van bijlage I van uitvoeringsbesluit nr.
      2012/138/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.6
    text: |-
      Gevoelige planten, niet van oorsprong uit afgebakende gebieden, maar binnengebracht in een afgebakend gebied, mogen
      alleen binnen de Europese Unie worden vervoerd indien zij voldoen aan de voorwaarden zoals gesteld in punt 2 van
      sectie 2 van bijlage I van uitvoeringsbesluit nr. 2012/138/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12i.7
    text: |-
      Gevoelige planten, ingevoerd overeenkomstig het tweede lid, afkomstig uit derde landen waarvan bekend is dat het
      schadelijke organisme er voorkomt, mogen alleen binnen de Europese Unie worden vervoerd indien zij voldoen aan de
      voorwaarden van punt 3 van sectie 2 van bijlage I van uitvoeringsbesluit nr. 2012/138/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12i
  - number: 12j.1
    text: |-
      Onverminderd [artikel 1][ref1] wordt voor de toepassing van dit artikel verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel1
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '1'
        paragraaf: '1'
  - number: 12j.1.a
    text: 'het schadelijke organisme: Anoplophora glabripennis (Motschulsky);'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.1.b
    text: |-
      gevoelige planten: voor opplant bestemde planten met een stamdiameter van tenminste 1 centimeter op het
      dikste punt, met uitzondering van zaden, van Acer spp., Aesculus spp., Alnus spp., Betula spp., Carpinus spp.,
      Cercidiphyllum spp., Corylus spp., Fagus spp., Fraxinus spp., Koelreuteria spp., Platanus spp., Populus spp., Salix
      spp. Tilia spp. en Ulmus spp.;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.1.c
    text: |-
      uitvoeringsbesluit nr. 2015/893/EU: uitvoeringsbesluit nr. 2015/893/EU van de Commissie van 9 juni 2015 betreffende
      maatregelen om het binnenbrengen en de verspreiding in de Unie van Anoplophora glabripennis (Motschulsky) te
      voorkomen (PbEU 2015, L 146);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.1.d
    text: 'houten verpakkingsmateriaal: verpakkingsmateriaal, geheel of deels verkregen van de gevoelige planten;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.1.e
    text: |-
      hout: hout, geheel of deels verkregen van de gevoelige planten, dat voldoet aan artikel 1, onder b, van
      uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.2
    text: |-
      Gevoelige planten afkomstig uit derde landen waarvan bekend is dat het schadelijke organisme er voorkomt, mogen
      slechts in de Europese Unie worden binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.2.a
    text: |-
      zij voldoen aan de specifieke invoervoorschriften van bijlage II, rubriek 1, punt A, onder 1, bij
      uitvoeringsbesluit nr. 2015/893/EU, en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.2.b
    text: |-
      zij, onverminderd artikel 12, bij binnenkomst in de Europese Unie overeenkomstig bijlage II, rubriek 1, punt
      A, onder 2, bij uitvoeringsbesluit nr. 2015/893/EU worden geïnspecteerd op de aanwezigheid van het schadelijke
      organisme en geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.3
    text: |-
      Hout afkomstig uit derde landen waarvan bekend is dat het schadelijke organisme er voorkomt, mag slechts in de
      Europese Unie worden binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.3.a
    text: |-
      zij voldoet aan de specifieke invoervoorschriften van bijlage II, rubriek 1, punt B, onder 1 en 2, bij
      uitvoeringsbesluit nr. 2015/893/EU; en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.3.b
    text: |-
      zij, onverminderd artikel 12, bij binnenkomst in de Europese Unie overeenkomstig bijlage II, rubriek 1, punt
      B, onder 3, bij uitvoeringsbesluit nr. 2015/893/EU wordt geïnspecteerd op de aanwezigheid van het schadelijke
      organisme en geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.4
    text: |-
      Gevoelige planten, van oorsprong afkomstig uit een overeenkomstig artikel 7 van uitvoeringsbesluit nr. 2015/893/EU
      afgebakend gebied, mogen slechts worden vervoerd als zij voldoen aan de voorwaarden van bijlage II, rubriek 2, punt
      A, onder 1, bij uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.5
    text: |-
      Gevoelige planten die in een overeenkomstig artikel 7 van uitvoeringsbesluit nr. 2015/893/EU afgebakend gebied zijn
      binnengebracht, mogen slechts worden vervoerd als zij voldoen aan de voorwaarden van bijlage II, rubriek 2, punt A,
      onder 2, bij uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.6
    text: |-
      Gevoelige planten afkomstig uit derde landen waarvan bekend is dat het schadelijke organisme er voorkomt, mogen
      slechts binnen de Europese Unie worden vervoerd als zij voldoen aan de voorwaarden van bijlage II, rubriek 2, punt
      A, onder 3, bij uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.7
    text: |-
      Hout, van oorsprong afkomstig uit een overeenkomstig artikel 7 van uitvoeringsbesluit nr. 2015/893/EU afgebakend
      gebied, mag slechts worden vervoerd als het voldoet aan de voorwaarden van bijlage II, rubriek 2, punt B, onder 1
      tot en met 3, bij uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.8
    text: |-
      Hout dat zijn natuurlijke ronde oppervlak geheel of gedeeltelijk heeft behouden en dat in een overeenkomstig
      artikel 7 van uitvoeringsbesluit nr. 2015/893/EU afgebakend gebied is binnengebracht, mag slechts worden vervoerd
      als zij voldoet aan de voorwaarden van bijlage II, rubriek 2, punt B, onder 1 en 3, bij uitvoeringsbesluit nr.
      2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12j.9
    text: |-
      Houten verpakkingsmateriaal, van oorsprong afkomstig uit een overeenkomstig artikel 7 van uitvoeringsbesluit nr.
      2015/893/EU afgebakend gebied, mag slechts worden vervoerd als het voldoet aan de voorwaarden van bijlage II,
      rubriek 2, punt C, bij uitvoeringsbesluit nr. 2015/893/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12j
  - number: 12k.1
    text: |-
      Onverminderd [artikel 1][ref1] wordt voor de toepassing van dit artikel verstaan onder: - *schadelijk organisme:*
      Epitrix cucumeris (Harris), *Epitrix papa* sp.n., Epitrix subcrinita (Lec.) of Epitrix tuberis (Gentner);
        - *uitvoeringsbesluit 2012/270/EU:* uitvoeringsbesluit 2012/270/EU van de Commissie van 16 mei 2012 betreffende
      noodmaatregelen om het binnenbrengen en de verspreiding in de Unie van Epitrix cucumeris (Harris), Epitrix
      similaris (Gentner), Epitrix subcrinita (Lec.) en Epitrix tuberis (Gentner) te voorkomen (PbEU 2012, L132).


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel1
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '1'
        paragraaf: '1'
  - number: 12k.2
    text: Het is verboden het schadelijke organisme in te voeren en binnen Nederland te verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
  - number: 12k.3
    text: |-
      Knollen van Solanum tuberosum L. van oorsprong uit derde landen waarvan bekend is dat het schadelijke organisme er
      voorkomt, mogen slechts in de Europese Unie worden binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
  - number: 12k.3.a
    text: |-
      zij voldoen aan de specifieke invoervoorschriften van punt 1 van sectie 1 van bijlage I van uitvoeringsbesluit nr.
      2012/270/EU en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
  - number: 12k.3.b
    text: |-
      zij, onverminderd de [artikelen 12][ref1] en [12a][ref2], bij binnenkomst in de Europese Unie overeenkomstig punt 5
      van sectie 1 van bijlage I van uitvoeringsbesluit nr. 2012/270/EU zijn geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: 12a
        paragraaf: '3'
  - number: 12k.4
    text: |-
      Knollen van Solanum tuberosum L. van oorsprong uit derde landen waarvan bekend is dat het schadelijke organisme er
      voorkomt en die zijn ingevoerd overeenkomstig het derde lid, mogen alleen binnen de Europese Unie worden vervoerd
      indien zij voldoen aan de voorwaarden van punt 3 van sectie 2 van bijlage I van uitvoeringsbesluit nr. 2012/270/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
  - number: 12k.5
    text: |-
      Knollen van Solanum tuberosum L. van oorsprong uit gebieden in de Europese Unie die overeenkomstig artikel 5 van
      uitvoeringsbesluit nr. 2012/270/EU zijn afgebakend, mogen alleen binnen de Europese Unie worden vervoerd als zij
      voldoen aan de voorwaarden zoals gesteld in punt 1 van sectie 2 van bijlage I van uitvoeringsbesluit nr. 2012/270/
      EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12k
  - number: 12l.1
    text: |-
      Voor de toepassing van dit artikel verstaan onder: - *uitvoeringsbesluit nr. 2012/697/EU:* uitvoeringsbesluit
      2012/697/EU van de Commissie van 8 november 2012 wat betreft maatregelen het binnenbrengen en de verspreiding in de
      Unie van het geslacht Pomacea (Perry) te voorkomen (PbEU 2012, L 311).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
  - number: 12l.2
    text: Het is verboden het geslacht Pomacea (Perry) in te voeren en binnen Nederland te verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
  - number: 12l.3
    text: |-
      Voor opplant bestemde planten, met uitzondering van zaden, die alleen groeien in water of in grond die permanent is
      verzadigd met water, van oorsprong uit derde landen, mogen slechts in de Europese Unie worden binnengebracht als:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
  - number: 12l.3.a
    text: |-
      zij voldoen aan de invoervoorschriften van punt 1 van sectie 1 van bijlage I van uitvoeringsbesluit nr. 2012/697/
      EU en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
  - number: 12l.3.b
    text: |-
      zij, onverminderd de [artikelen 12][ref1], bij binnenkomst in de Europese Unie overeenkomstig punt 2 van sectie 1
      van bijlage I van uitvoeringsbesluit nr. 2012/697/EU zijn geïnspecteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 12l.4
    text: |-
      Voor opplant bestemde planten, met uitzondering van zaden, die alleen groeien in water of in grond die permanent
      is verzadigd met water, van oorsprong uit gebieden in de Europese Unie die overeenkomstig artikel 5 van
      uitvoeringsbesluit nr. 2012/697/EU zijn afgebakend, mogen alleen binnen de Europese Unie in het verkeer worden
      gebracht als zij voldoen aan de voorwaarden zoals gesteld in sectie 2 van bijlage I van uitvoeringsbesluit
      nr. 2012/697/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12l
  - number: 12m.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.1.a
    text: |-
      *het schadelijke organisme:* Phyllosticta citricarpa (McAlpine) Van der Aa, die in [Richtlijn 2000/29/EG]
      (32000L0029) Guignardia citricarpa Kiely wordt genoemd;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.1.b
    text: |-
      *vruchten:* vruchten van Citrus L., Fortunella Swingle, Poncirus Raf. en hybriden daarvan, met uitzondering van
      vruchten van Citrus aurantium L. en Citrus latifolia Tanaka, van oorsprong uit Brazilië, Zuid-Afrika, Uruguay en
      Argentinië;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.1.c
    text: |-
      *uitvoeringsbesluit (EU) 2016/715:* Uitvoeringsbesluit (EU) 2016/715 van de Commissie van 11 mei 2016 inzake
      maatregelen met betrekking tot bepaalde vruchten van oorsprong uit bepaalde derde landen om het binnenbrengen en
      de verspreiding in de Unie van het schadelijke organisme Phyllosticta citricarpa (McAlpine) Van der Aa te voorkomen
      (PbEU 2016, L 125).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.2
    text: |-
      Vruchten, met uitzondering van vruchten die uitsluitend bestemd zijn voor de industriële verwerking tot sap, mogen
      slechts in de Unie worden binnengebracht overeenkomstig de artikelen 5 tot en met 7 van uitvoeringsbesluit (EU)
      2016/715.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.3
    text: |-
      Vruchten, uitsluitend bestemd voor industriële verwerking tot sap, mogen in de Unie worden binnengebracht,
      vervoerd, opgeslagen en verwerkt overeenkomstig de artikelen 8 tot en met 17 van uitvoeringsbesluit (EU) 2016/715.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.4
    text: Vruchten als bedoeld in het derde lid worden binnengebracht in Rotterdam en Vlissingen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.5
    text: |-
      Een importeur stelt overeenkomstig artikel 13 van uitvoeringsbesluit (EU) 2016/715 de verantwoordelijke officiële
      instantie van de plaats van binnenkomst voldoende van te voren in kennis van zijn intentie om vruchten, bedoeld in
      het derde lid, binnen te brengen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.6
    text: |-
      Een verwerker van vruchten tot sap stelt de verantwoordelijke officiële instantie voldoende van te voren in kennis
      van het vervoer van de vruchten van de plaats van binnenkomst naar de verwerkingslocatie of opslaglocatie en van de
      opslaglocatie naar de verwerkingslocatie.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.7
    text: |-
      De minister verleent op verzoek een erkenning voor de verwerkingslocatie of opslaglocatie van vruchten, bedoeld in
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.8
    text: |-
      De afvalstoffen en bijproducten die overblijven na verwerking worden gebruikt of vernietigd overeenkomstig artikel
      15 van uitvoeringsbesluit (EU) 2016/715.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12m.9
    text: |-
      Een wijziging van uitvoeringsbesluit (EU) 2016/715 gaat voor de toepassing van deze regeling gelden met ingang van
      de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12m
  - number: 12p.1
    text: |-
      Onverminderd [artikel 12m][ref1] wordt voor de toepassing van dit artikel verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12m
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12m
        paragraaf: '3'
  - number: 12p.1.a
    text: |-
      vruchten: vruchten van *Citrus L.*, *Fortunella*Swingle, *Poncirus*Raf*., Microcitrus*Swingle*, Naringi*Adans.
      en*Swinglea*Merr., en de hybriden daarvan, van oorsprong uit derde landen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12p.1.b
    text: |-
      uitvoeringsbesluit (EU) 2017/2374: uitvoeringsbesluit (EU) 2017/2374 van de Commissie van 15 december 2017
      tot vaststelling van de omstandigheden voor het verkeer, de opslag en de verwerking van bepaalde vruchten en
      de hybriden daarvan, van oorsprong uit derde landen, om het binnenbrengen in de Unie van bepaalde schadelijke
      organismen te voorkomen (PbEU 2017, L 337).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12p.2
    text: |-
      Vruchten mogen binnen de Europese Unie worden verplaatst overeenkomstig artikel 3 van uitvoeringsbesluit (EU)
      2017/2374.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12p.3
    text: |-
      Vruchten mogen uitsluitend industrieel worden verwerkt overeenkomstig artikel 4 van uitvoeringsbesluit (EU)
      2017/2374 in een erkende verwerkingslocatie.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12p.4
    text: |-
      Vruchten die niet meteen industrieel worden verwerkt mogen uitsluitend worden opgeslagen overeenkomstig artikel 5
      van uitvoeringsbesluit (EU) 2017/2374 in een erkende opslaglocatie.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12p.5
    text: |-
      De Minister verleent op verzoek een erkenning voor de verwerkingslocatie, bedoeld in het derde lid, en voor de
      opslaglocatie, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12p
  - number: 12r.1
    text: |-
      Onverminderd [artikel 1][ref1] wordt voor de toepassing van dit artikel verstaan onder: - *schadelijk organisme:*
      elke ondersoort van Xylella fastidiosa (Wells et al.);
        - *gevoelige planten:* waardplanten en alle voor opplant bestemde planten, met uitzondering van zaden, van de in
      bijlage I van uitvoeringsbesluit nr. 2015/789/EU opgenomen geslachten of soorten;
        - *professionele marktdeelnemer:* een professionele marktdeelnemer als bedoeld in artikel 1, onderdeel d, van
      uitvoeringsbesluit nr. 2015/789/EU;
        - *uitvoeringsbesluit nr. 2015/789/EU:* uitvoeringsbesluit nr. 2015/789/EU van de Commissie van 18 mei 2015
      betreffende maatregelen om het binnenbrengen en de verspreiding in de Unie van Xylella fastidiosa (Wells et al.) te
      voorkomen (PbEG 2015, L 125);
        - *waardplanten:* alle voor opplant bestemde planten, met uitzondering van zaden, van de geslachten en soorten
      die zijn opgenomen in de databank van de Commissie van voor Xylella fastidiosa vatbare waardplanten waarvan is
      vastgesteld dat zij op het grondgebied van de Europese Unie vatbaar zijn voor het schadelijk organisme of van de
      ondersoorten waarvoor een lidstaat een afgebakend gebied heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel1
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '1'
        paragraaf: '1'
  - number: 12r.2
    text: |-
      Gevoelige planten worden slechts op het grondgebied van de Europese Unie binnengebracht indien zij voldoen aan
      artikel 16 of artikel 17 van uitvoeringsbesluit nr. 2015/789/EU en zij, onverminderd artikel 12, bij binnenkomst in
      de Europese Unie overeenkomstig artikel 18 van het uitvoeringsbesluit nr. 2015/789/EU officieel zijn gecontroleerd
      en het schadelijk organisme niet is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.3
    text: |-
      Gevoelige planten met uitzondering van planten die gedurende de gehele productiecyclus in vitro zijn geteeld en
      planten die behoren tot de in bijlage III van uitvoeringsbesluit nr. 2015/789/EU vermelde variëteiten van gevoelige
      planten, die gedurende ten minste een deel van hun leven in een afgebakend gebied als bedoeld in artikel 4 van
      uitvoeringsbesluit 2015/789/EU zijn geteeld, mogen niet worden vervoerd, tenzij wordt voldaan aan de voorwaarden
      van artikel 9 van uitvoeringsbesluit 2015/789/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.4
    text: |-
      Van de ontvangst en levering van gevoelige planten die gedurende ten minste een deel van hun leven in een
      afgebakend gebied als bedoeld in artikel 4 van uitvoeringsbesluit 2015/789/EU zijn geteeld of door een dergelijk
      gebied zijn vervoerd alsmede van de ontvangst en levering van voor opplant bestemde planten van de soorten Coffea,
      Lavandula dentata L., Nerium oleander L., Olea europaea L., Polygala myrtifolia L. en Prunus dulcis (Mill.)
      D.A. Webb die nooit in een dergelijk gebied zijn geteeld, houdt de professionele marktdeelnemer een register bij
      overeenkomstig artikel 10 van uitvoeringsbesluit 2015/789/EU. De gegevens worden tenminste drie jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.5
    text: |-
      De professionele marktdeelnemer meldt de levering en ontvangst van partijen planten als bedoeld in artikel 10,
      eerste en tweede lid, van uitvoeringsbesluit nr. 2015/789/EU onverwijld aan de Minister overeenkomstig artikel 10,
      vierde lid, van uitvoeringsbesluit nr. 2015/789/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.6
    text: |-
      Gevoelige planten afkomstig uit derde landen waarvan bekend is dat het schadelijk organisme er voorkomt, mogen
      slechts in de Europese Unie worden binnengebracht als zij, onverminderd artikel 12, overeenkomstig artikel 18 van
      uitvoeringsbesluit nr. 2015/789/EU worden geïnspecteerd op de aanwezigheid van het schadelijk organisme en geen
      tekenen van aanwezigheid van het schadelijk organisme zijn gevonden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.7
    text: |-
      Het binnenbrengen in de Europese Unie van voor opplant bestemde planten van Coffea, met uitzondering van zaden, van
      oorsprong uit Costa Rica of Honduras, is verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.8
    text: |-
      Voor opplant bestemde planten van Coffea, met uitzondering van zaden, van oorsprong uit Costa Rica of Honduras, die
      vóór de datum van inwerkingtreding van dit artikel in de Europese Unie zijn binnengebracht, mogen worden verplaatst
      nadat de Minister hiervan op de hoogte is gebracht.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.9
    text: |-
      Waardplanten die niet in een afgebakend gebied als bedoeld in artikel 4 van uitvoeringsbesluit nr. 2015/789/
      EU zijn geteeld mogen worden vervoerd, mits wordt voldaan aan de voorwaarden van artikel 9, achtste lid, van
      uitvoeringsbesluit nr. 2015/789/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.10
    text: |-
      Gevoelige planten, die gedurende de gehele productiecyclus in vitro zijn geteeld, en gedurende ten minste
      een deel van hun leven in een afgebakend gebied als bedoeld in artikel 4 van het uitvoeringsbesluit 2015/789/
      EU zijn geteeld, mogen niet worden vervoerd, tenzij wordt voldaan aan de voorwaarden van artikel 9 bis van
      uitvoeringsbesluit 2015/789/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12r.11
    text: |-
      Onverminderd het negende lid mogen prebasismoederplanten zoals gedefinieerd in artikel 1, punt 3, van
      Uitvoerings[richtlijn 2014/98](32014L0098)/EU van de Commissie en prebasismateriaal zoals gedefinieerd in artikel
      2, punt 5, van [Richtlijn 2008/90/EG](32008L0090) van de Raad van de soorten Juglans regia L., Olea europaea L.,
      Prunus amygdalus Batsch, P. amygdalus × P. persica, P. armeniaca L., P. avium (L.) L., P. cerasus L., P. domestica
      L., P. domestica × P. salicina, P. dulcis (Mill.) D.A. Webb, P. persica (L.) Batsch en P. salicina Lindley die
      buiten een afgebakend gebied als bedoeld in artikel 4 van uitvoeringsbesluit 2015/789/EU zijn geteeld en ten minste
      een deel van hun leven buiten insectenvrije faciliteiten hebben doorgebracht, slechts binnen de Europese Unie
      worden vervoerd indien zij voldoen aan artikel 9, negende lid, van uitvoeringsbesluit nr. 2015/789/EU.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12r
  - number: 12s.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.1.a
    text: '*het schadelijke organisme:* tomato brown rugose fruit virus (ToBRFV);'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.1.b
    text: '*gevoelige planten:* voor opplant bestemde planten van de soorten Solanum lycopersicum L. en Capsicum annuum;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.1.c
    text: |-
      *uitvoeringsbesluit (EU) 2019/1615:* Uitvoeringsbesluit (EU) 2019/1615 van de Commissie van 26 september 2019 tot
      vaststelling van noodmaatregelen om het binnenbrengen en de verspreiding in de Unie van het tomato brown rugose
      fruit virus (ToBRFV) te voorkomen (PbEU 2019, L 250).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.2
    text: Het is verboden het schadelijke organisme in te voeren en binnen Nederland te verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.3
    text: |-
      Gevoelige planten van oorsprong uit de Europese Unie mogen alleen binnen de Europese Unie worden vervoerd indien
      zij vergezeld gaan van een plantenpaspoort en voldoen aan de voorwaarden van artikel 5 van uitvoeringsbesluit (EU)
      2019/1615.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.4
    text: 'Gevoelige planten mogen slechts in de Europese Unie worden binnengebracht indien:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.4.a
    text: |-
      zij vergezeld gaan van een fytosanitair certificaat als bedoeld in artikel 13, eerste lid, punt ii), van [richtlijn
      2000/29/EG](32000L0029);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.4.b
    text: zij voldoen aan de voorwaarden van artikel 6 van uitvoeringsbesluit (EU) 2019/1615; en
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
  - number: 12s.4.c
    text: |-
      zij, onverminderd [artikel 12][ref1], overeenkomstig artikel 7 van uitvoeringsbesluit 2019/1615 worden
      geïnspecteerd op de aanwezigheid van het schadelijke organisme en geen tekenen van aanwezigheid van dat schadelijke
      organisme zijn gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12s
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 12t.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.1.a
    text: |-
      *uitvoeringsbesluit 2019/1614:* Uitvoeringsbesluit (EU) 2019/1614 van de Commissie van 26 september 2019 tot
      machtiging van de lidstaten om voor andere dan voor opplant bestemde aardappelen uit de regio’s Akkar en Bekaa in
      Libanon af te wijken van sommige bepalingen van [Richtlijn 2000/29/EG](32000L0029) van de Raad (PbEU 2019, L 250);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.1.b
    text: |-
      *schadelijk organisme:* *Clavibacter michiganensis* (Smith) Davis et al. ssp. *sepedonicus* (Spieckermann en
      Kotthoff) Davis et al.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2
    text: |-
      Knollen van Solanum tuberosum L., andere dan bestemd voor opplant, uit de regio’s Akkar en Bekaa in Libanon mogen
      slechts in de Europese Unie worden binnengebracht indien zij:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2.a
    text: voldoen aan de voorschriften van de bijlage bij uitvoeringsbesluit 2019/1614;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2.b
    text: |-
      voorzien zijn van een fytosanitair certificaat dat voldoet aan de eisen, genoemd in artikel 2 van
      uitvoeringsbesluit 2019/1614;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2.c
    text: worden binnengebracht in Eemshaven, Harlingen, Beverwijk, Amsterdam, Rotterdam en Vlissingen;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2.d
    text: |-
      geïnspecteerd zijn op de aanwezigheid van het schadelijke organisme overeenkomstig artikel 4 van uitvoeringsbesluit
      2019/1614 en geen tekenen van aanwezigheid van dat schadelijke organisme zijn gevonden;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.2.e
    text: voorzien zijn van een etiket dat voldoet aan de eisen, genoemd in artikel 6 van uitvoeringsbesluit 2019/1614.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.3
    text: |-
      Een importeur brengt overeenkomstig artikel 8 van uitvoeringsbesluit 2019/1614 de verantwoordelijke officiële
      instantie van de plaats van binnenkomst voldoende van te voren op de hoogte van zijn intentie om knollen van
      Solanum tuberosum L., andere dan bestemd voor opplant, uit de regio’s Akkar en Bekaa in Libanon binnen te brengen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12t.4
    text: |-
      De afvalstoffen die overblijven na het verpakken en verwerken in de Europese Unie van knollen van Solanum tuberosum
      L., andere dan bestemd voor opplant, uit de regio’s Akkar en Bekaa in Libanon worden zo verwijderd dat het
      schadelijke organisme zich niet in de Europese Unie kan vestigen of verspreiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12t
  - number: 12u.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.1.a
    text: |-
      *uitvoeringsbesluit 2019/1739:* Uitvoeringsbesluit (EU) 2019/1739 van de Commissie van 16 oktober 2019 tot
      vaststelling van noodmaatregelen om het binnenbrengen en de verspreiding in de Unie van het Rose Rosettevirus te
      voorkomen (PbEU 2019, L 265);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.1.b
    text: '*schadelijk organisme:* Rose Rosettevirus;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.1.c
    text: '*vector:* *Phyllocoptes fructiphilus*;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.1.d
    text: '*gevoelige planten:* planten, met uitzondering van zaden, van Rosa ssp. van oorsprong uit Canada, India of de VS.'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.2
    text: Het binnenbrengen en de verspreiding van het schadelijke organisme in de Europese Unie is verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.3
    text: 'Gevoelige planten mogen slechts in de Europese Unie worden binnengebracht indien:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.3.a
    text: |-
      ze vergezeld gaan van een fytosanitair certificaat dat voldoet aan artikel 5, eerste lid, van uitvoeringsbesluit
      2019/1739;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.3.b
    text: ze voldoen aan de voorwaarden van artikel 5, tweede tot en met vierde lid, van uitvoeringsbesluit 2019/1739;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12u.3.c
    text: ze zodanig zijn verwerkt, verpakt en vervoerd dat besmetting door de vector wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12u
  - number: 12v.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.1.a
    text: |-
      *uitvoeringsbesluit 2019/2032:* Uitvoeringsbesluit (EU) 2019/2032 van de Commissie van 26 november 2019 tot
      vaststelling van maatregelen om het binnenbrengen en de verspreiding in de Unie van *Fusarium circinatum* Nirenberg
      & O’Donnell (voorheen *Gibberella circinata*) te voorkomen en tot intrekking van Beschikking 2007/433/EG (PbEU
      2019, L 313);
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.1.b
    text: '*het schadelijke organisme:* *Fusarium circinatum* Nirenberg & O’Donnell 1998;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.1.c
    text: '*gevoelige planten:* planten van het geslacht *Pinus* L. en de soort *Pseudotsugamenziesii* (Mirbel) Franco;'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.1.d
    text: |-
      *houten verpakkingsmateriaal:* verpakkingsmateriaal voor hout in de vorm van pakkisten, kratten, tonnen en
      dergelijke verpakkingsmiddelen, kabelhaspels, laadborden, laadkisten en andere laadplateaus, opzetranden voor
      laadborden, stuwmateriaal (al dan niet gebruikt voor het vervoer van allerhande voorwerpen), met uitzondering van
      ruw hout met een dikte van ten hoogste 6 mm, verwerkt hout bij de productie waarvan gebruik is gemaakt van lijm,
      warmte en druk, of een combinatie daarvan, en stuwmateriaal ter ondersteuning van zendingen hout dat van hetzelfde
      type hout is gefabriceerd als dat van de zending hout, dezelfde kwaliteit heeft en aan dezelfde fytosanitaire
      voorschriften van de Europese Unie voldoet als de zending hout;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.1.e
    text: |-
      *afgebakende gebieden:* in de Europese Unie, overeenkomstig artikel 4 van uitvoeringsbesluit 2019/2032,
      vastgestelde besmette zones en bufferzones.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.2
    text: |-
      Een ieder stelt de minister op de hoogte van de aanwezigheid of vermoedelijke aanwezigheid van het schadelijke
      organisme.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.3
    text: |-
      Gevoelige planten mogen slechts binnen de Europese Unie worden vervoerd als ze voldoen aan de voorwaarden van
      artikel 6 van Uitvoeringsbesluit 2019/2032.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.4
    text: |-
      Hout van gevoelige planten, hout van coniferen (Pinales) en bast van coniferen (Pinales) van oorsprong uit een
      afgebakend gebied mag slechts binnen de Europese Unie worden vervoerd als het voldoet aan de voorwaarden van
      artikel 7 van uitvoeringsbesluit 2019/2032.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.5
    text: |-
      Hout van coniferen in de vorm van houten verpakkingsmateriaal van oorsprong uit een afgebakend gebied mag slechts
      binnen de Europese Unie worden vervoerd als het voldoet aan de voorwaarden van artikel 8 van uitvoeringsbesluit
      2019/2032.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.6
    text: |-
      Gevoelige planten van oorsprong uit niet-Europese derde landen mogen slechts in de Europese Unie worden
      binnengebracht als ze voldoen aan de specifieke invoervoorschriften als bedoeld in artikel 9 van uitvoeringsbesluit
      2019/2032.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: 12v.7
    text: |-
      Hout van gevoelige planten, hout van coniferen (Pinales) en bast van coniferen (Pinales) van oorsprong uit niet-
      Europese derde landen, mag slechts in de Europese Unie worden binnengebracht als het voldoet aan de specifieke
      invoervoorschriften als bedoeld in artikel 10 van uitvoeringsbesluit 2019/2032.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel12v
  - number: '13.1'
    text: |-
      Planten, plantaardige produkten of andere materialen, van herkomst uit een derde land en genoemd in bijlage V, deel
      B, rubriek I, bij [richtlijn 2000/29/EG](32000L0029) die tevens genoemd zijn in bijlage IV, deel A, rubriek I, bij
      [richtlijn 2000/29/EG](32000L0029) moeten bij invoer vergezeld zijn van een bij die zending behorend fytosanitair
      certificaat, afgegeven door de officiële dienst voor plantenbescherming van het land van oorsprong. Het bepaalde in
      de eerste volzin is niet van toepassing:
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: 13.1.a
    text: |-
      wat hout betreft, indien het krachtens de bijzondere eisen van bijlage IV bij [richtlijn 2000/29/EG](32000L0029)
      voldoende is dat het hout van de bast is ontdaan;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: 13.1.b
    text: |-
      in de overige gevallen, voor zover ook op andere plaatsen dan de plaatsen van oorsprong kan worden voldaan aan de
      bijzondere eisen van bijlage IV bij [richtlijn 2000/29/EG](32000L0029).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '13.2'
    text: |-
      Planten, plantaardige produkten of andere materialen, van herkomst uit een derde land en genoemd in bijlage V,
      deel B, rubriek I, bij [richtlijn 2000/29/EG](32000L0029) waarop het bepaalde in het eerste lid niet van toepassing
      is, moeten bij invoer vergezeld zijn van een bij die zending behorend fytosanitair certificaat, afgegeven door
      de officiële dienst voor plantenbescherming van het land van oorsprong danwel door de officiële dienst van de
      plantenbescherming van het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een zending als bedoeld in het eerste of tweede lid in een ander land dan het land van oorsprong naar het
      oordeel van de officiële dienst voor plantenbescherming van dat land aan een fytosanitair risico is blootgesteld
      geweest, ongeacht het feit of die zending is opgesplitst, opgeslagen of overgepakt, moet de zending bij invoer
      vergezeld zijn van een door de officiële dienst voor plantenbescherming van het land van oorsprong afgegeven
      fytosanitair certificaat of een officieel gewaarmerkte copie daarvan alsmede van een fytosanitair certificaat,
      afgegeven door de officiële dienst voor plantenbescherming van het andere land.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '13.4'
    text: |-
      Indien een zending als bedoeld in het eerste lid in een ander land dan het land van oorsprong is opgesplitst,
      opgeslagen of overgepakt en in dat land naar het oordeel van de officiële dienst voor plantenbescherming van dat
      land niet aan een fytosanitair risico is blootgesteld geweest, moet de zending bij invoer vergezeld zijn van een
      door de officiële dienst voor plantenbescherming van het land van oorsprong afgegeven fytosanitair certificaat of
      een officiële gewaarmerkte copie daarvan alsmede van een fytosanitair certificaat voor wederuitvoer afgegeven door
      de officiële dienst voor plantenbescherming van het andere land.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '13.5'
    text: |-
      Indien een zending als bedoeld in het tweede lid in een ander land dan het land van oorsprong is opgesplitst,
      opgeslagen of overgepakt en in dat land naar oordeel van de officiële dienst voor plantenbescherming van dat land
      niet aan een fytosanitair risico is blootgesteld geweest, moet de zending bij invoer vergezeld zijn van een door
      de officiële dienst voor plantenbescherming van het land van oorsprong afgegeven fytosanitair certificaat of een
      officiëel gewaarmerkte copie daarvan en van een door de officiële dienst voor plantenbescherming van het andere
      land afgegeven fytosanitair certificaat voor wederuitvoer dan wel van een fytosanitair certificaat afgegeven door
      de officiële dienst voor plantenbescherming van het andere land.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '13.6'
    text: |-
      Dit artikel is niet van toepassing indien planten, plantaardige produkten en andere materialen worden ingevoerd
      vanuit een andere Lid-Staat via een derde land, voor zover er geen gevaar bestaat voor verspreiding van schadelijke
      organismen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel13
  - number: '14.1'
    text: |-
      De invoer van schadelijke organismen genoemd in bijlage I of II bij [richtlijn 2000/29/EG](32000L0029) in
      geïsoleerde toestand is verboden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel14
  - number: '14.2'
    text: |-
      De Minister kan, op aanvraag, ontheffing verlenen van het bepaalde in het eerste lid voor proefnemingen
      wetenschappelijke doeleinden of voor selectiewerkzaamheden. Een ontheffing wordt alleen verleend indien is voldaan
      aan het bepaalde in richtlijn 2008/61/EG.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel14
  - number: '15.1'
    text: |-
      Ten behoeve van planten en plantaardige produkten, bestemd voor uitvoer, wordt een fytosanitair certificaat
      door de Minister slechts afgegeven, indien na onderzoek van de zending, alsmede aan de verpakking daarvan danwel
      geheel of gedeeltelijk aan de hand van een representatief monster en zonodig aan de gebruikte of te gebruiken
      vervoermiddelen, is gebleken dat voldaan is aan de fytosanitaire bepalingen van het land van bestemming.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel15
  - number: '15.2'
    text: |-
      Een fytosanitair certificaat voor wederuitvoer wordt door de Minister slechts afgegeven, indien na onderzoek is
      gebleken, dat voldaan is aan de fytosanitaire invoerbepalingen van het land waarvoor de zending bestemd is.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel15
  - number: '15.3'
    text: |-
      Een certificaat als bedoeld in het eerste of tweede lid wordt afgegeven onder de voorwaarde dat het vervoermiddel
      waarmee de zending wordt vervoerd slechts zendingen bevat die voldoen aan de fytosanitaire invoereisen van het land
      van bestemming als aangegeven op het afgegeven certificaat.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel15
  - number: '16.1'
    text: |-
      Een certificaat als bedoeld in [artikel 15][ref1] moet zijn gesteld in een der officiële talen van de Europese
      Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel15
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '15'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Een certificaat is niet eerder opgemaakt dan 14 dagen voor de datum waarop de betrokken planten, plantaardige
      producten of andere materialen, het derde land van afgifte hebben verlaten.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel16
  - number: '16.3'
    text: |-
      Een certificaat moet op eerste vordering bij een ambtenaar van de Nederlandse Voedsel- en Warenautoriteit,
      een beambte van een onder verantwoordelijkheid van de Nederlandse Voedsel- en Warenautoriteit functionerende
      instelling, of een ambtenaar van de Belastingdienst bevoegd inzake douane worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel16
  - number: '17.1'
    text: |-
      Een plantenpaspoort wordt slechts verstrekt ten behoeve van partijen planten, plantaardige producten of andere
      materialen, genoemd in bijlage V, deel A, bij [richtlijn nr. 2000/29/EG](32000L0029), en zaad, genoemd in bijlage
      IV bij [richtlijn nr. 2000/29/EG](32000L0029), afkomstig van een importeur die is geregistreerd in een door de
      minister bijgehouden register.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel17
  - number: '17.2'
    text: |-
      Distributeurs en verpakkers laten opslagplaatsen en verzendingscentra, waar knollen van Solanum tuberosum L.,
      andere dan pootaardappelen, afkomstig van meerdere producenten zijn opgeslagen of worden verpakt, opnemen in het
      register, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel17
  - number: '17.3'
    text: |-
      Registratie vindt plaats indien de aanvrager heeft voldaan aan de verplichtingen genoemd in artikel 2, tweede en
      derde lid, en artikel 3 van [richtlijn 92/90/EEG](31992L0090).
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel17
  - number: '18.1'
    text: |-
      Registratie, bedoeld in [artikel 17][ref1], geschiedt door toezending van een volledig en naar waarheid ingevuld
      registratieformulier aan de directeur danwel een door deze aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel17
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '17'
        paragraaf: '4'
  - number: '18.2'
    text: |-
      Een registratieformulier kan op aanvraag worden verkregen bij de directeur dan wel de door deze aangewezen
      instantie.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: '18.3'
    text: |-
      De directeur dan wel de door deze aangewezen instantie stelt de aanvrager als bedoeld in
      [artikel 17, eerste lid][ref1], in kennis van de inschrijving in het register onder vermelding van het aan de
      aanvrager toegekende individuele registratienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel17
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '17'
        paragraaf: '4'
  - number: '18.4'
    text: 'In het register wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.a
    text: het individueel registratienummer;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.b
    text: de naam en de aard van de onderneming waarop de registratie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.c
    text: het volledige adres van de geregistreerde;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.d
    text: de voorwaarden of beperkingen waaronder de inschrijving is verleend;
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.e
    text: de produkten waarop de registratie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: 18.4.f
    text: datum van eerste aanvraag.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel18
  - number: '19.1'
    text: |-
      Van iedere wijziging van de in [artikel 18, vierde lid][ref1], genoemde gegevens dient binnen vier weken nadat
      deze wijziging zich heeft voorgedaan mededeling gedaan te worden aan de door de directeur dan wel de door deze
      aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel18
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '18'
        paragraaf: '4'
  - number: '19.2'
    text: |-
      Indien blijkt dat aan de verplichtingen genoemd in [artikel 17, tweede lid][ref1], niet meer wordt voldaan kan door
      de directeur beslist worden, dat de registratie wordt doorgehaald. Doorhaling geschiedt niet dan na voorafgaande
      waarschuwing door of namens de directeur en na het verstrijken van een daarbij te stellen termijn waarbinnen aan de
      vorenbedoelde voorschriften dient te zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel17
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '17'
        paragraaf: '4'
  - number: '19.3'
    text: Het tweede lid geldt tevens indien aan het vereiste in het eerste lid van dit artikel niet wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel19
  - number: '20.1'
    text: |-
      Een aanvraag tot een onderzoek als bedoeld in de [artikelen 6][ref1] en [15][ref2] moet door de exporteur of diens
      gemachtigde ten minste 24 uur – zaterdagen, zondagen, Goede Vrijdag en algemeen erkende feestdagen niet meegerekend
      – voor het tijdstip van de voorgenomen uitvoer bij de Nederlandse Voedsel- en Warenautoriteit, of een door de
      Minister aangewezen instantie geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel15
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '15'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Het in het eerste lid bedoelde onderzoek vindt niet plaats op zaterdagen, zondagen, Goede Vrijdag en algemeen
      erkende feestdagen. Op andere dagen geschiedt het onderzoek uitsluitend tussen 8.00 en 17.00 uur. Op de plaats van
      onderzoek dient een goede verlichting aanwezig te zijn, moet de aangemelde zending goed toegankelijk zijn en dient
      de zending op een overzichtelijke wijze te worden aangeboden, zodat het onderzoek naar behoren kan plaatsvinden;
      een en ander ter beoordeling van de met het onderzoek belaste ambtenaar. Tevens dienen alle vereiste bescheiden te
      worden overgelegd en dient de gevraagde medewerking en noodzakelijke outillage te worden verleend aan de met het
      onderzoek belaste ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20
  - number: '20.3'
    text: |-
      Door de Minister kan, indien naar zijn oordeel van een bijzonder geval sprake is, onder door hem te stellen
      voorwaarden worden afgeweken van het in het eerste en tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20
  - number: 20a.1
    text: |-
      De ontvanger kan een zending op elektronische wijze aanbieden aan de Nederlandse Voedsel- en Warenautoriteit voor
      het onderzoek, bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 20a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een gemachtigde als bedoeld in
      [artikel 2:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 20a.3
    text: |-
      Het aanbieden voor onderzoek, bedoeld in het eerste en tweede lid, geschiedt via een daarvoor bestemd elektronisch
      systeem met behulp van een door de Minister beschikbaar gestelde toegang.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.4
    text: |-
      De Minister kan besluiten de verstrekte toegang te blokkeren, indien de indiener of een met hem geassocieerd
      bedrijf of organisatie in het verleden een elektronische aanbieding voor onderzoek heeft ingediend in strijd met
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.5
    text: |-
      De Minister kan een elektronische aanbieding voor onderzoek weigeren, indien dit niet overeenkomstig deze regeling
      is ingediend.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.6
    text: |-
      De Minister kan elektronisch verschafte gegevens en bescheiden weigeren voor zover de aanvaarding daarvan tot een
      onevenredige belasting voor de Minister zou leiden.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.7
    text: |-
      De Minister kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of vertrouwelijkheid
      van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.8
    text: De Minister deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.9
    text: |-
      Als tijdstip waarop een elektronisch bericht door de Nederlandse Voedsel- en Warenautoriteit elektronisch is
      ontvangen, geldt het tijdstip waarop het bericht zijn systeem voor gegevensverwerking heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
  - number: 20a.10
    text: |-
      De Minister kan besluiten de elektronische aanbieding voor onderzoek niet te behandelen, indien het
      elektronisch bericht geheel of gedeeltelijk is geweigerd op grond van het vijfde, zesde en zevende lid.
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 20b.1
    text: |-
      Indien een zending overeenkomstig [artikel 20a][ref1] aan de Nederlandse Voedsel- en Warenautoriteit voor
      onderzoek is aangeboden, stelt de Nederlandse Voedsel- en Warenautoriteit de ontvanger van de zending of
      diens gemachtigde via het systeem, bedoeld in artikel 20a, derde lid, op de hoogte van de toepassing van
      [artikel 12, elfde lid][ref2], dan wel van de onverkorte toepassing van artikel 12, eerste lid. De ontvanger van
      de zending of diens gemachtigde doet bij de elektronische aangifte ten invoer, mededeling aan de douane over de
      toepassing van artikel 12, elfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 20a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: 20b.2
    text: |-
      Indien een zending overeenkomstig [artikel 20a][ref1] aan de NVWA voor onderzoek is aangeboden en aan
      [artikel 12, twaalfde lid][ref2], toepassing is gegeven, kan het besluit bedoeld in artikel 12, tiende lid, worden
      bekendgemaakt door elektronische toezending.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 20a
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: '21.1'
    text: |-
      Een wijziging van een of meer onderdelen van de in [artikel 1][ref1] genoemde richtlijnen treedt voor de toepassing
      van de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel1
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '1'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Van de mogelijkheid om op grond van een beschikking, inhoudende een machtiging van de Raad of de Commissie van de
      Europese Gemeenschappen op grond van artikel 15, eerste lid, van [richtlijn 2000/29/EG](32000L0029), af te wijken
      van [artikel 10, eerste lid, onderdeel b][ref1], en van [artikel 12, eerste lid, onderdelen c en d][ref2], kan
      gebruik worden gemaakt, zodra de Minister dit in de Staatscourant bekend heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '12'
        paragraaf: '3'
  - number: '21.3'
    text: de Minister doet van een wijziging als bedoeld in het eerste lid mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel21
  - number: '22'
    text: De Regeling invoer, uitvoer en vervoer van planten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel22
  - number: '23.1'
    text: Deze regeling treedt in werking met ingang van 1 juni 1993.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
  - number: '23.2'
    text: |-
      De [artikelen 12h][ref1], [12n][ref2], [12o][ref3] en [12q][ref4] vervallen met ingang van 1 juli 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12h
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12n
      [ref3]: https://wetten.overheid.nl/BWBR0005997#Artikel12o
      [ref4]: https://wetten.overheid.nl/BWBR0005997#Artikel12q
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12h
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: 12n
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005997
        artikel: 12o
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005997
        artikel: 12q
        paragraaf: '3'
  - number: '23.3'
    text: |-
      [Artikel 12t][ref1] vervalt met ingang van 1 april 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12t
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12t
        paragraaf: '3'
  - number: '23.4'
    text: |-
      [Artikel 12c][ref1] vervalt met ingang van 1 juli 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12c
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12c
        paragraaf: '3'
  - number: '23.5'
    text: |-
      [Artikel 12u][ref1] vervalt met ingang van 1 augustus 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12u
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12u
        paragraaf: '3'
  - number: '23.6'
    text: |-
      Met ingang van 1 januari 2027 vervallen [artikel 12f, tiende en elfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12f
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12f
        paragraaf: '3'
  - number: '23.7'
    text: |-
      [Artikel 12g][ref1] vervalt met ingang van 1 april 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12g
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12g
        paragraaf: '3'
  - number: '23.8'
    text: |-
      De [artikelen 12m][ref1] en [12s][ref2] vervallen met ingang van 1 april 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel12m
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel12s
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: 12m
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: 12s
        paragraaf: '3'
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Regeling invoer, uitvoer en verkeer van planten.'
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel24
