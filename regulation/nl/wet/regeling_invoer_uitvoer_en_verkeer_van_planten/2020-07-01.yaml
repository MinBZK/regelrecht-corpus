preamble:
  text: |-
    Gelet op artikel 2 van de Plantenziektenwet en op artikel 14, aanhef en onderdeel d, van het Besluit bestrijding
    schadelijke organismen 1991;

    Gelet op richtlijn 77/93/EEG van de Raad van de Europese Gemeenschappen van 21 december 1976 betreffende de
    beschermende maatregelen tegen het binnenbrengen en de verspreiding in de Gemeenschap van voor planten of voor
    plantaardige produkten schadelijke organismen(PbEG 1977, L 26) en de daarop gebaseerde richtlijnen;

    Gezien de adviezen van het Landbouwschap, het Hoofdproduktschap voor Akkerbouwprodukten, het Produktschap voor
    Siergewassen en het Produktschap voor Groenten en Fruit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - [
                ](32000L0029) *:* richtlijn van de Raad van 8 mei 2000 betreffende de beschermende maatregelen tegen
      het binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige producten schadelijke
      organismen (PbEG L 169);
        - *richtlijn 92/90/EEG:* richtlijn van de Commissie van de Europese Gemeenschappen van 3 november 1992 tot
      vaststelling van de verplichtingen van producenten en importeurs van planten, plantaardige produkten of andere
      materialen, en van nadere bepalingen inzake registratie(PbEG L 344);
        - *richtlijn 92/105/EEG:* richtlijn van de Commissie van de Europese Gemeenschappen van 3 december 1992 tot
      een zekere mate van standaardisering van plantenpaspoorten voor het verkeer van bepaalde planten, plantaardige
      produkten of andere materialen in de Gemeenschap, en tot vaststelling van nadere regels voor de afgifte van deze
      paspoorten en van de voorwaarden en nadere regels voor de vervanging ervan(PbEG L 4);
        - *verordening 690/2008:* Verordening (EG) Nr. 690/2008 van de Commissie van 4 juli 2008 tot erkenning van
      beschermde gebieden in de Gemeenschap waar bijzondere plantenrisico’s bestaan (PbEU L 193);
        - *richtlijn 2008/61/EG:* Richtlijn 2008/61/EG van de Commissie van 17 juni 2008 tot vaststelling van de
      voorwaarden waaronder bepaalde in bijlagen I tot en met V bij Richtlijn 2000/29/EG van de Raad vermelde schadelijke
      organismen, planten, plantaardige producten en andere materialen voor proefnemingen of wetenschappelijke
      doeleinden en voor selectiewerkzaamheden in de Gemeenschap of in bepaalde beschermde gebieden daarvan mogen worden
      binnengebracht of naar een andere plaats overgebracht (PbEU L 158);
        - [
                  ](32004L0103) *:* [richtlijn 2004/103/EG](32004L0103) van de Commissie van 7 oktober 2004 betreffende
      de controles van de identiteit en de fytosanitaire controles van de in deel B van bijlage V bij [richtlijn nr.
      2000/29/EG](32000L0029) van de Raad van de Europese Gemeenschappen opgenomen planten, plantaardige producten en
      andere materialen die kunnen worden uitgevoerd op een andere plaats dan de plaats van binnenkomst in de Gemeenschap
      of op een dichtbijgelegen plaats en tot vaststelling van de eisen met betrekking tot deze controles (PbEU L 313);
        - *Minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *Douanewetboek van de Unie:* Verordening (EU) nr. 952/2013 van het Europees Parlement en van de Raad van
      9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);
        - *zending:* hoeveelheid goederen die vergezeld gaat van één document ten behoeve van douane- of andere
      formaliteiten, zoals een fytosanitair certificaat of een ander document of merkteken; een zending kan uit één of
      meer partijen bestaan;
        - *in het verkeer brengen:* verkopen, te koop aanbieden of afleveren, alsmede in- en uitvoeren van en naar Lid-
      Staten;
        - *vrijmaken:* op grond van douanebepalingen ter beschikking stellen van een zending aan degene die de zending bij
      de ambtenaar der invoerrechten en accijnzen heeft aangegeven;
        - *importeur:* persoon of rechtspersoon die een zending invoert of doet invoeren, doorvoer uitgezonderd, danwel
      handelingen verricht waaruit blijkt dat de ingevoerde zending voor de eerste maal wordt geaccepteerd;
        - *doorvoer:* vervoer van een zending tussen derde landen over het grondgebied van een of meer Lid-Staten;
        - *producent:* natuurlijke persoon of rechtspersoon die planten teelt, danwel plantaardige produkten vervaardigt
      met het oogmerk deze in het verkeer te brengen;
        - *handelaar:* persoon of rechtspersoon die beroepshalve een partij planten of plantaardige produkten splitst in
      meerdere partijen of partijen planten of plantaardige produkten samenvoegt, danwel op andere wijze handelingen
      verricht, waardoor het gezondheidsniveau van de planten of plantaardige produkten kan wijzigen;
        - *commercieel koper:* natuurlijk persoon of rechtspersoon die planten of plantaardige produkten verhandelt of
      levert aan de consument;
        - *beschermd gebied:* gebied in de Europese Gemeenschappen als bedoeld in artikel 2, eerste lid, onder h, van
      [richtlijn 2000/29/EG](32000L0029) en genoemd in verordening 690/2008;
        - *Lid-Staat:* tot de Europese Gemeenschappen behorende staat, waarvan uitgezonderd de Franse Overzeese
      Departementen alsmede de Canarische eilanden, Ceuta en Melilla;
        - *derde land:* niet tot de Europese Gemeenschappen behorende staat, alsmede de Franse Overzeese Departementen, de
      Canarische eilanden, Ceuta en Melilla;
        - *andere materialen:* zaken, niet zijnde planten of plantaardige produkten, die drager kunnen zijn van schadelijke
      organismen;
        - *plantenpaspoort:* label, als bedoeld in artikel 2, eerste lid, onderdeel f, van [richtlijn 2000/29/EG]
      (32000L0029);
        - *fytosanitair certificaat:* certificaat overeenkomstig het in bijlage VII A bij [richtlijn 2000/29/EG]
      (32000L0029) opgenomen model;
        - *fytosanitair certificaat voor wederuitvoer:* certificaat overeenkomstig het in bijlage VII B bij [richtlijn
      2000/29/EG](32000L0029) opgenomen model;
        - *officiële constatering of verklaring:* constatering gedaan door een vertegenwoordiger van de officiële
      dienst voor plantenbescherming of door een vertegenwoordiger van een onder verantwoordelijkheid van die dienst
      functionerende instelling;
        - *voor opplant bestemde planten:* planten die reeds zijn geplant en die bestemd zijn om geplant te blijven of
      opnieuw te worden geplant nadat zij zijn binnengebracht, of planten die nog niet zijn geplant op het ogenblik van
      binnenbrengen, maar die bestemd zijn om daarna te worden geplant;
        - *plaats van binnenkomst:* plaats waar planten, plantaardige producten of andere materialen voor het eerst in het
      douanegebied van de Gemeenschap worden binnengebracht: de luchthaven in het geval van luchtvervoer, de haven in het
      geval van zee- of binnenvaartvervoer, het station in het geval van railvervoer en in alle andere gevallen de plaats
      waar het douanekantoor is gevestigd dat verantwoordelijk is voor het gebied waar de op land gelegen buitengrens van
      de Gemeenschap is overschreden;
        - *Commissie:* Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden planten, plantaardige produkten of andere materialen in het verkeer te brengen of in te voeren uit
      derde landen, tenzij is voldaan aan het bepaalde in de [artikelen 4 tot en met 13][ref1] en [16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005997#Artikel16
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005997
        artikel: '16'
        paragraaf: '3'
  - number: '2.2'
    text: |-
      de Minister kan ontheffing verlenen van het bepaalde in het eerste lid. Aan de ontheffing kunnen voorschriften
      worden verbonden. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel2
  - number: '2.3'
    text: |-
      de Minister kan, op aanvraag, ontheffing verlenen van het bepaalde in het eerste lid ten behoeve van proefnemingen,
      wetenschappelijke doeleinden of selectiewerkzaamheden. Een ontheffing wordt alleen verleend indien is voldaan aan
      het bepaalde in richtlijn 2008/61/EG.
    url: https://wetten.overheid.nl/BWBR0005997/2020-07-01#Artikel2
  - number: 2 bis
    text: |-
      Op kleine hoeveelheden planten, plantaardige producten, voedingsmiddelen of diervoeders, voor zover verband
      houdende met planten of plantaardige producten, en andere materialen, bestemd voor gebruik door de eigenaar of
      ontvanger voor niet-industriële en niet commerciële doeleinden of voor verbruik tijdens het vervoer, zijn, mits
      er geen gevaar bestaat voor verspreiding van schadelijke organisme in de Europese Unie, niet van toepassing
      de [artikelen 4, eerste lid, onderdeel d][ref1], [4, tweede lid][ref2], [5, tweede lid, onderdeel c][ref3],
      [5, derde lid][ref4], [9][ref5], [10, eerste lid, onderdeel b][ref6], [11, eerste lid][ref7], voor zover wordt
      verwezen naar de [artikelen 5, onderdeel c][ref8], [12][ref9] en [13][ref10].


