  - number: '6'
    text: |-
      1 Indien voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een eenmalige uitkering is
      overeengekomen en daarbij is bepaald dat deze uitkering een algemeen karakter draagt, ontvangen de kamerleden een
      uitkering op gelijke voet.

      2 Indien de hoogte van de uitkering, bedoeld in het eerste lid, afhankelijk is van de hoogte van de vergoeding,
      bedoeld in [artikel 4][ref1], wordt bij de vaststelling hiervan rekening gehouden met een verhoging van de
      vergoedingen, bedoeld in de [artikelen 7, eerste lid][ref2], en [8][ref3].


