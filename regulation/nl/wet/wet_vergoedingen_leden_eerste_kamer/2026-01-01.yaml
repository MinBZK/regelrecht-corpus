        artikel: X_10
  - number: '17'
    text: |-
      1 De kamerleden ontvangen ter vergoeding van reiskosten een bedrag van € 3640 per jaar.

      2 Het in het eerste lid genoemde bedrag wordt aangepast bij ministeriële regeling overeenkomstig de wijziging
      in de vergoeding die voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het
      Ministerie van Binnenlandse Zaken en Koninkrijksrelaties voor dienstreizen in een collectieve arbeidsovereenkomst
      is overeengekomen voor het gebruik van een eigen motorvoertuig indien openbaar vervoer niet mogelijk of niet
      doelmatig is.

      3 De griffier stelt ten laste van de Eerste Kamer op aanvraag de noodzakelijke faciliteiten ten behoeve van
      vervoer en verblijf ter beschikking in verband met buitenlandse dienstreizen die een kamerlid in het kader van de
      uitoefening van het kamerlidmaatschap maakt.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel17
  - number: '18'
    text: |-
      1 De kamerleden ontvangen ter vergoeding van verblijfkosten een bedrag waarvan de hoogte afhankelijk is van de
      afstand van de woonplaats van het kamerlid of het door het kamerlid bewoonde deel van de woonplaats tot het gebouw
      van de Eerste Kamer der Staten-Generaal.

      2 Het in het eerste lid bedoelde bedrag bedraagt bij:

      0 km: € 565,01 per jaar;

      10 km: € 5.625,74 per jaar;

      75 km: € 11.253,74 per jaar;

      150 km en meer: € 18.287,61 per jaar.

      Het bedrag behorende bij de afstanden, afgerond op hele kilometers, tussen de in bovenstaand schema genoemde
      afstanden, wordt berekend naar evenredigheid met het verschil tussen de in het schema aangegeven bedragen bij de
      naasthogere en naastlagere afstand.

      3 De bedragen, genoemd in het tweede lid, worden jaarlijks bij ministeriële regeling gewijzigd overeenkomstig
      de procentuele wijziging van de voor de ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam
      zijn bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst
      overeengekomen vergoeding van verblijfkosten van dienstreizen.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel18
  - number: 18a
    text: |-
      1 De griffier kent een kamerlid dat naar het oordeel van een arts een structurele functionele
      beperking heeft, ten laste van de Eerste Kamer op aanvraag een voorziening toe als bedoeld in
      [artikel 35, tweede en derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel een financiële
      vergoeding daarvoor.

      2 Het gestelde bij of krachtens [artikel 35, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
  - number: 18b
    text: |-
      De griffier stelt ten laste van de Eerste Kamer aan een kamerlid voor de duur van diens kamerlidmaatschap
      informatie- en communicatievoorzieningen ter beschikking, daarbij inbegrepen de abonnementen, die noodzakelijk zijn
      voor de uitoefening van het kamerlidmaatschap.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel18b
  - number: 18c
    text: De voorzitter treft voor de kamerleden een voorziening voor bedrijfsgeneeskundige zorg.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel18c
  - number: '19'
    text: |-
      Ten aanzien van een kamerlid van wie de arbeidsverhouding ingevolge
      [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref1] voor de toepassing
      van die wet als dienstbetrekking wordt aangemerkt, worden als eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref2] aangewezen:

      a. de vergoeding, bedoeld in [artikel 16, eerste lid][ref3];

      b. het bedrag, bedoeld in [artikel 17, eerste lid][ref4];

      c. het bedrag, bedoeld in [artikel 18, eerste lid][ref5];

      d. de verstrekkingen, bedoeld in [artikel 18b][ref6];

      e. een voorziening of financiële tegemoetkoming als bedoeld in [artikel 18a, eerste lid][ref7].


