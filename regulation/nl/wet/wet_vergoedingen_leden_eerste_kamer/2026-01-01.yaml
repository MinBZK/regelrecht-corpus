        artikel: '4'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 Kamerleden ontvangen een bedrag van € 5.005,58 per jaar waarmee zij voorzieningen kunnen treffen ter zake van
      arbeidsongeschiktheid, ouderdom en overlijden.

      2 Het bedrag, genoemd in het eerste lid, wordt jaarlijks bij ministeriële regeling gewijzigd met
      inachtneming van de procentuele wijzigingen, bedoeld in [artikel 9][ref1], in het voorafgaande
      jaar en van wijzigingen in dat jaar van berekeningselementen van de bedragen, die op grond van
      [artikel 106, eerste lid, van de Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref2] worden
      ingehouden, ter zake van aanspraken bij arbeidsongeschiktheid, ouderdom en overlijden, op de schadeloosstelling van
      een lid van de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007402#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002691#Artikel106
