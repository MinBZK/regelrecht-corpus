  - number: '13'
    text: |-
      1 Ten behoeve van het woon-werkverkeer en dienstreizen van de voorzitter kan in plaats van de voorziening, bedoeld
      in [artikel 17, eerste lid][ref1], een dienstauto ter beschikking worden gesteld.

      2 Op een daartoe strekkend advies van de Nationaal Coördinator Terrorismebestrijding en Veiligheid kan aan
      de voorzitter in plaats van de voorziening, bedoeld in [artikel 17, eerste lid][ref2], voor de duur van het
      voorzitterschap een dienstauto met chauffeur ter beschikking worden gesteld voor zowel zakelijk als privégebruik.

      3 De prijs per kilometer van de dienstauto, bedoeld in het eerste of tweede lid, bedraagt niet meer dan € 0,82
      exclusief BTW, berekend op de grondslag van een gebruiksduur van twee jaar en 60 000 gereden kilometers per jaar.

      4 Het bedrag, genoemd in het derde lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd
      overeenkomstig de procentuele wijziging van het prijsindexcijfer jaargemiddelde operationele autolease inclusief
      brandstof, zoals door het Centraal Bureau voor de Statistiek gepubliceerd, over het tweede kalenderjaar voorafgaand
      aan genoemde datum ten opzichte van hetzelfde indexcijfer over het jaar daaraan voorafgaand.

      5 De prijs per kilometer wordt berekend aan de hand van de formule

      (((n / (l/12)) + o + f + g + h + p) / m) + i,

      waarin:

      n = (((a-c)/1,19) + (b/1,19) + c) – (d/1,19)

      afschrijving over looptijd (inclusief belasting van personenauto's en motorrijwielen en exclusief belasting over de
      toegevoegde waarde (omzetbelasting));

      o = ((d/1,19) x e) + ((n/2) x e)

      rente per jaar;

      p = ((k/1,19) x (m/100) x j)

      brandstofkosten per jaar;

      en:

      a = consumentenprijs inclusief accessoires af fabriek (inclusief belasting van personenauto's en motorrijwielen en
      belasting over de toegevoegde waarde (omzetbelasting));

      b = consumentenprijs van accessoires achteraf en/of door derden (inclusief belasting over de toegevoegde waarde
      (omzetbelasting));

      c = totale belasting van personenauto's en motorrijwielen;

      d = totale marktconforme restwaarde inclusief belasting over de toegevoegde waarde (omzetbelasting) en belasting
      van personenauto's en motorrijwielen;

      e = rentetarief in procenten;

      f = administratiekosten inclusief management fee per jaar doch exclusief belasting over de toegevoegde waarde
      (omzetbelasting) (of interne kosten ingeval niet wordt uitbesteed);

      g = houderschapsbelasting per jaar;

      h = het in het kader van het omslagstelsel door het Bureau Schade Afwikkeling vastgestelde bedrag;

      i = prijs van reparatie, onderhoud en banden exclusief belasting over de toegevoegde waarde (omzetbelasting);

      j = brandstofverbruik in liters per 100 kilometer;

      k = tarief bij brandstofsoort inclusief belasting over de toegevoegde waarde (omzetbelasting);

      l = looptijd in maanden;

      m = jaarkilometrage.

      6 De dienstauto, bedoeld in het eerste of tweede lid, wordt slechts in gebruik genomen nadat is vastgesteld dat
      aan de voorschriften van het tweede tot en met vierde lid is voldaan, tenzij afwijking van deze voorschriften
      noodzakelijk is om redenen van veiligheid of wegens een individuele werkplekanalyse, verricht of getoetst door een
      deskundige persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref3]. Artikel 14,
      tweede lid, onderdelen b en c, van de Arbeidsomstandighedenwet is in het tweede geval van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007402#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007402#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
