  - number: '15'
    text: |-
      1 In dit artikel wordt onder wet verstaan: [Algemene pensioen- en uitkeringswet politieke ambtsdragers][ref1].

      2 De wet is van overeenkomstige toepassing op de voorzitter met inachtneming van het derde tot en met het zesde
      lid.

      3 De voorzitter wordt voor de overeenkomstige toepassing van de wet gelijkgesteld met een lid van de Tweede Kamer
      der Staten-Generaal.

      4 In afwijking van het derde lid vindt verrekening van inkomsten uit of in verband met arbeid of bedrijf met de
      uitkering als afgetreden voorzitter plaats overeenkomstig [artikel 134 van de wet][ref2].

      5 In afwijking van het derde lid geldt ten aanzien van de voorzitter een deeltijdfactor als bedoeld in
      [artikel 130, derde lid, van de wet][ref3] van één tweede.

      6 Op de toelage, bedoeld in [artikel 11, eerste lid][ref4], en op de uitkering overeenkomstig de wet als afgetreden
      voorzitter worden bedragen ingehouden overeenkomstig de regelen, te stellen bij de algemene maatregel van bestuur,
      bedoeld in [artikel 160 van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002691
