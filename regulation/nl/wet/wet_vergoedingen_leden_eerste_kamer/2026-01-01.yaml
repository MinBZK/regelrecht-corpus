  - number: '16'
    text: |-
      1 De kamerleden ontvangen een vergoeding voor aan de uitoefening van het kamerlidmaatschap verbonden kosten die
      € 3.364,33 per jaar bedraagt.

      2 Het kamerlid aan wie ingevolge [artikel X 10 van de Kieswet][ref1] tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte, ontvangt een onkostenvergoeding ter hoogte van de helft van het in het eerste
      lid genoemde bedrag.

      3 Het bedrag, bedoeld in het eerste lid, wordt per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan
      de hand van de consumentenprijsindex, geldend voor de maand september van het tweede kalenderjaar voorafgaand aan
      die datum ten opzichte van hetzelfde indexcijfer geldend voor de maand september van het daaraan voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel16
