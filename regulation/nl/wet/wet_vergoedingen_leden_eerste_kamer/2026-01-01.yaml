  - number: 13a
    text: |-
      1 Indien aan de voorzitter op grond van [artikel 13, tweede lid][ref1], een dienstauto ter beschikking is gesteld,
      ontvangt hij een maandelijkse vergoeding voor de door hem verschuldigde loonbelasting over het privégebruik van de
      dienstauto. De vergoeding wordt berekend aan de hand van de formule:

      waarin:

      M = het bedrag van de vergoeding;

      CAT = de catalogusprijs van de dienstauto, met inbegrip van BTW en BPM, verminderd met het deel van de
      catalogusprijs, met inbegrip van BTW en BPM, dat toerekenbaar is aan buitengewone beveiligingsmaatregelen;

      P = het toepasselijke percentage, genoemd in [artikel 13bis, eerste lid, van de Wet op de loonbelasting 1964][ref2];

      T = het hoogste van de in de tarieftabel van [artikel 20a, eerste lid, van de Wet op de loonbelasting 1964][ref3]
      opgenomen percentages.

      2 Aangewezen als een eindheffingsbestanddeel als bedoeld in
      [artikel 31, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref4] wordt:

      a. de maandelijkse vergoeding, bedoeld in het eerste lid;

      b. het tot het belastbare loon in de zin van de [Wet op de loonbelasting 1964][ref5] van de voorzitter behorend
      voordeel ter zake van de dienstauto toerekenbaar aan buitengewone beveiligingsmaatregelen.


