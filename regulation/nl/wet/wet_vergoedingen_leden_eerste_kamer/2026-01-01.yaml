  - number: 3b
    text: |-
      De kamerleden maken hun nevenfuncties openbaar door terinzagelegging van een opgave bij de griffie van de Eerste
      Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel3b
  - number: '4'
    text: |-
      De kamerleden ontvangen een vergoeding van € 2.867,80 per maand voor de werkzaamheden die voortvloeien uit de
      vervulling van het lidmaatschap van de Eerste Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel4
  - number: '5'
    text: |-
      De kamerleden ontvangen een eindejaarsuitkering van 8,3 procent van de som van de vergoedingen, bedoeld in
