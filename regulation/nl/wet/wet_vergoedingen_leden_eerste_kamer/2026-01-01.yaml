      De wet van 25 juni 1969 tot regeling van de vergoeding van de kosten, welke uit de vervulling van het lidmaatschap
      van de Eerste Kamer der Staten-Generaal voortvloeien (*Stb.* 1969, 300) en de wet van 12 november 1975 tot nadere
      vaststelling toelage Voorzitter Eerste Kamer der Staten-Generaal (*Stb.* 1975, 657), worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel21
  - number: '22'
    text: |-
      Artikel 4*a* van de wet van 25 juni 1969 tot regeling van de vergoeding van de kosten, welke uit de vervulling
      van het lidmaatschap van de Eerste Kamer der Staten-Generaal voortvloeien, blijft van kracht ten aanzien van
      wijzigingen welke vóór de datum van inwerkingtreding van deze wet in de hoogte van de schadeloosstelling, bedoeld
      in [artikel 2 van de Wet schadeloosstelling leden Tweede Kamer][ref1], worden aangebracht.


