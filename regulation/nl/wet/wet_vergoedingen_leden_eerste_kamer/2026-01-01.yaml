preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 63 van de Grondwet, wenselijk is een
    wettelijke regeling te treffen van de vergoeding voor de werkzaamheden, van de secundaire voorzieningen en van
    de kostenvergoedingen van de leden van de Eerste Kamer der Staten-Generaal, alsmede van de toelage en de andere
    voorzieningen van de voorzitter van de Eerste Kamer der Staten-Generaal;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. kamerlid: lid van de Eerste Kamer der Staten-Generaal;

      c. voorzitter: voorzitter van de Eerste Kamer der Staten-Generaal;

      d. fractievoorzitter: kamerlid waarvan door de voorzitter is vastgesteld dat dat lid voorzitter is van een fractie,
      dan wel enig lid is van een fractie;

      e. griffier: de griffier van de Eerste Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel1
  - number: '2'
    text: Deze wet is niet van toepassing op kamerleden die het ambt van minister of staatssecretaris bekleden.
    url: https://wetten.overheid.nl/BWBR0007402/2026-01-01#Artikel2
