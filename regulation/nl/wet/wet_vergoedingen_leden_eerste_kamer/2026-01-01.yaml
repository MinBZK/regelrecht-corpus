      bedoeld in [artikel 4][ref1], en de overige ondervoorzitters ontvangen een toelage gelijk aan 1,2% van deze
      vergoeding.

      2 Voor de eerste ondervoorzitter die gedurende meer dan 60 dagen onafgebroken de functie van de voorzitter
      waarneemt, wordt de vergoeding, genoemd in [artikel 4][ref2], voor die tijd in plaats van het bedrag, genoemd in
      het eerste lid, verhoogd met 17,4% van de vergoeding, bedoeld in [artikel 4][ref3].


