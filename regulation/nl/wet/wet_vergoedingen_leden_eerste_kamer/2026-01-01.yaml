    text: |-
      1 De fractievoorzitters ontvangen voor de duur van hun voorzitterschap per jaar een toelage gelijk aan 1,2% van de
      vergoeding, bedoeld in [artikel 4][ref1], en een toelage gelijk aan 0,4% van deze vergoeding voor elk lid dat de
      fractie buiten de fractievoorzitter telt. De toelagen tezamen bedragen ten hoogste 6,4% van de vergoeding, bedoeld
      in [artikel 4][ref2].

      2 Voor de toepassing van het eerste lid stelt de voorzitter vast:

      a. het aantal leden van een fractie;

      b. de duur van het fractievoorzitterschap.


