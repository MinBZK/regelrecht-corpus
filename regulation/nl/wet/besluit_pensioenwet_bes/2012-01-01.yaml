  - number: '29'
    text: |-
      1 De beschrijving van de financiële opzet, bedoeld in[ artikel 28, onder f][ref1], bevat in ieder geval een
      beschrijving van de wijze waarop wordt voldaan aan de vereisten ten aanzien van:

      a. de technische voorzieningen en het vereist eigen vermogen, bedoeld in de [artikelen 13][ref2] en
      [13c van de wet][ref3];

      b. het premiebeleid, bedoeld in [artikel 13b van de wet][ref4];

      c. het beleggingsbeleid en het aangaan van leningen, bedoeld in de [artikelen 14][ref5] en [14a van de wet][ref6];

      d. de financiering van voorwaardelijke toeslagverlening, bedoeld in de [artikelen 7f][ref7] en
      [14b van de wet][ref8].

      2 Bij de beschrijving, bedoeld in het eerste lid, wordt rekening gehouden met de overige verplichtingen van het
      pensioenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel28
