        artikel: '4'
        paragraaf: '2'
  - number: '8'
    text: |-
      Een pensioenfonds beschikt over goede administratieve en boekhoudkundige procedures en adequate interne
      controlemechanismen, stelt beleid op ten aanzien van de beheersing van te lopen risico’s en draagt zorg voor de
      uitvoering van dat beleid.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel8
  - number: '9'
    text: |-
      Een pensioenfonds draagt zorg voor een systematische analyse van integriteitrisico’s en stelt aan de hand van deze
      analyse een integriteitbeleid vast en draagt zorg voor de uitvoering van dat beleid.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Een pensioenfonds beschikt over procedures en maatregelen met betrekking tot het tegengaan van verstrengeling
      van privé-belangen met de belangen van het pensioenfonds van personen die het beleid van het pensioenfonds
      bepalen, leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van het
      pensioenfonds en andere werknemers of andere personen die in opdracht van het pensioenfonds op structurele basis
      werkzaamheden voor het pensioenfonds verrichten.

      2 Een pensioenfonds beschikt over een gedragscode die voor bestuurders en medewerkers van het pensioenfonds
      voorschriften geeft ter voorkoming van belangenconflicten en van misbruik en oneigenlijk gebruik van de bij het
      pensioenfonds aanwezige informatie of zaken.

      3 De Bank kan regels stellen met betrekking tot de inhoud van de gedragscode, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel10
  - number: '11'
    text: |-
      Een pensioenfonds voert een beleid gericht op het duurzaam beheersen van te lopen financiële risico’s en andere dan
      financiële risico’s.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel11
  - number: '12'
    text: |-
      1 Een pensioenfonds voert ten minste eens in de drie jaar een continuïteitsanalyse uit waarbij met een
      stochastische benaderingswijze wordt bezien of het pensioenfonds aan haar verplichtingen op de lange termijn kan
      voldoen. De continuïteitsanalyse biedt tevens inzicht in de mate waarin de voorwaardelijke toeslagverlening naar
      verwachting kan worden toegekend.

      2 Indien naar de mening van de Bank sprake is van aanzienlijke wijzigingen in de huidige of verwachte financiële
      positie van het pensioenfonds, voert het pensioenfonds tussentijds een extra continuïteitsanalyse uit.

      3 De continuïteitsanalyse omvat 15 prognosejaren, gerekend vanaf de rapportagedatum. Het pensioenfonds heeft
      voorbij deze tijdhorizon van 15 prognosejaren een kwalitatief beeld van de verwachtingen, risico’s en het beleid.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de continuïteitsanalyse.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel12
  - number: '14'
    text: |-
      1 Vanaf 1 januari 2012 gaat een fonds voor de berekeningen, bedoeld in de [artikelen 5b][ref1], [13][ref2],
      [13b][ref3], [16a][ref4] en [16b van de wet][ref5] uit van:

      a. minimale verwachtingswaarden voor de groeivoeten van het loon- en prijsindexcijfer van 2%, respectievelijk 2%;

      b. een maximaal verwacht rendement op vastrentende waarden van 4,5% per jaar;

      c. een verwacht rendement op beursgenoteerde aandelen en indirect onroerend goed met een rekenkundig gemiddelde van
      maximaal 8,5% per jaar en een meetkundig gemiddelde van maximaal 7% per jaar;

      d. een verwacht rendement op overige zakelijke waarden met een rekenkundig gemiddelde van maximaal 9% per jaar en
      een meetkundig gemiddelde van maximaal 7,5% per jaar;

      e. een verwacht rendement op direct onroerend goed en grondstoffen met een rekenkundig gemiddelde van maximaal 7,5%
      per jaar en een meetkundig gemiddelde van maximaal 6% per jaar.

      2 Een pensioenfonds kan na instemming van de Bank afwijken van de minimale verwachtingswaarden, bedoeld in het
      eerste lid, onderdeel a, indien de specifieke omstandigheden van het pensioenfonds dat noodzakelijk maken.

      3 De rendementscijfers, bedoeld in het eerste lid, betreffen bruto cijfers, voor aftrek van beleggingskosten.


