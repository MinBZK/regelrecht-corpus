  - number: '17'
    text: |-
      1 Het bestuur van een pensioenfonds stelt de hoogte van de technische voorzieningen vast op basis van de contante
      waarde van de verwachte uitgaande kasstromen die voortvloeien uit de tot de datum van vaststelling opgebouwde
      pensioenverplichtingen.

      2 De contante waarde wordt vastgesteld op basis van een rekenrente van ten hoogste 4%.

      3 Een pensioenfonds stelt de omvang van de verwachte uitgaande kasstromen vast op basis van verwachte
      marktontwikkelingen en voor het pensioenfonds prudente verzekeringstechnische grondslagen waaronder begrepen de
      voorzienbare trend in overlevingskansen.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Een pensioenfonds dient ieder jaar vóór 1 juli de berekening van de technische voorzieningen per het einde van
      het voorafgaande jaar in bij de Bank.

      2 Onverminderd het eerste lid, dient een pensioenfonds desgevraagd een berekening van de technische voorzieningen
      in bij de Bank indien de Bank tekenen ontwaart van een ontwikkeling die het eigen vermogen, de liquiditeit of de
      bedrijfsvoering van het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel18
  - number: '19'
    text: |-
      De benodigde premie in verband met de pensioenverplichtingen wordt berekend overeenkomstig [artikel 17][ref1],
      waarbij rekening gehouden wordt met:

      a.

      b. de opslag die nodig is voor de bij de aangroei van de pensioenverplichtingen behorende uitvoeringskosten van het
      pensioenfonds; en

      c. de premie die actuarieel benodigd is ten behoeve van toeslagverlening indien gekozen is voor financiering op de
      wijze, bedoeld in [artikel 14b, eerste lid, onderdeel a, b of d van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel14b
