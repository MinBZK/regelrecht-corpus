  - number: '41'
    text: |-
      1 De Bank brengt jaarlijks een bedrag in rekening aan pensioenuitvoerders ter zake van kosten als bedoeld in
      artikel 24 van de wet.

      2 De op grond van het eerste lid in rekening te brengen kosten worden op basis van de begroting waarmee is
      ingestemd door Onze Minister, geraamd voor het jaar waarop het in rekening te brengen bedrag betrekking heeft.

      3 De geraamde kosten worden toegerekend aan categorieën van pensioenuitvoerders naar de mate van het beslag op de
      werkzaamheden van de Bank, bedoeld in artikel 24 van de wet.

      4 De per categorie toegerekende geraamde kosten worden verminderd of vermeerderd met het aan de desbetreffende
      categorie toe te rekenen exploitatiesaldo als bedoeld in artikel 24, tweede lid, van de wet, en verminderd met de
      aan de desbetreffende categorie toe te rekenen opbrengsten uit bestuurlijke boetes als bedoeld in artikel 24, derde
      lid, van de wet die niet reeds zijn opgenomen in het exploitatiesaldo.

      5 De in het derde lid bedoelde categorieën van pensioenuitvoerders zijn:

      a. pensioenfondsen;

      b. verzekeraars.

      6 Bij regeling van Onze Minister kunnen nadere categorieën worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel41
  - number: '42'
    text: |-
      1 Het bedrag, bedoeld in [artikel 41, eerste lid][ref1], bestaat uit per categorie vast te stellen minimumbedragen
      ter dekking van de minimale toezichtkosten per uitvoerder in de desbetreffende categorie, vermeerderd met een
      bedrag dat:

      a. wordt gebaseerd op de kosten die per categorie zijn toegerekend op de wijze, bedoeld in [artikel 41][ref2],
      onder aftrek van het totaal van de aan de desbetreffende categorie in rekening te brengen minimumbedragen, en

      b. is doorberekend naar rato van de maatstafgegevens die betrekking hebben op het voorafgaande jaar dan wel, indien
      deze gegevens niet beschikbaar zijn, het daaraan voorafgaande jaar of het lopende jaar.

      2 Bij regeling van Onze Minister kunnen op voorstel van de Bank per onderwerp van toezicht worden vastgesteld:

      a. de minimumbedragen per categorie;

      b. de maatstaven per categorie;

      c. de maximummaatstaven per categorie; en

      d. de tarieven per categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel41
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel42
    references:
