  - number: '38'
    text: |-
      1 Het boetebedrag voor overtreding van een voorschrift op grond van de [artikelen 1a][ref1], [7e][ref2],
      [16a, eerste tot en met vierde lid][ref3], [16b, eerste tot en met derde lid][ref4], [16c][ref5],
      [16f, eerste en tweede lid][ref6], [21a, eerste lid][ref7] en [26b, eerste lid, van de wet][ref8] en op grond van
      de [artikelen 26][ref9], [33][ref10] en [37][ref11] bedraagt 50.000 USD.

      2 Het boetebedrag voor overtreding van een voorschrift op grond van de
      [artikelen 5a, eerste, tweede en vijfde tot en met achtste lid][ref12], [5b][ref13], [13b][ref14], [13e][ref15],
      [14, eerste lid][ref16], [14a, eerste lid][ref17], [14b][ref18] en [16e van de wet][ref19] en op grond van de
      [artikelen 23][ref20], [24][ref21] en [25][ref22] bedraagt 25.000 USD.

      3 Voor overtreding van [artikel 21a, eerste lid, van de wet][ref23] kan per dag dat men in overtreding is een boete
      worden opgelegd van USD 1.250 met een maximum van USD 25.000.

      4 Voor overtreding van [artikel 5:20 van de Algemene wet bestuursrecht][ref24] zoals van toepassing verklaard in
      [artikel 19a van de wet][ref25] kan per dag dat men in overtreding is een boete worden opgelegd van USD 1.250 met
      een maximum van USD 25.000.


