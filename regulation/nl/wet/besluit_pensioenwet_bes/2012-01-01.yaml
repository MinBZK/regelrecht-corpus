  - number: '28'
    text: |-
      De actuariële en bedrijfstechnische nota, bedoeld in artikel 16e van de wet, bevat in ieder geval een beschrijving
      van:

      a. de hoofdlijnen van het interne beheersingssysteem, zoals voorgeschreven bij of krachtens
      [artikel 5b van de wet][ref1], en van de opzet van de administratieve organisatie en interne controle, bedoeld
      in [artikel 8][ref2];

      b. voor zover van toepassing procedures en criteria voor de aansluiting van werkgevers bij het betreffende
      pensioenfonds en voor het verkrijgen van het deelnemerschap van hun werknemers;

      c. de hoofdlijnen van de uitvoeringsovereenkomst dan wel het uitvoeringsreglement;

      d. de hoofdlijnen van de reeds verworven en nog te verwerven pensioenaanspraken en -rechten die voor de deelnemers,
      gewezen deelnemers, gepensioneerden of andere aanspraakgerechtigden voortvloeien uit het pensioenreglement;

      e. de uit het pensioenreglement en de uitvoeringsovereenkomst dan wel het uitvoeringsreglement voortvloeiende
      risico’s die in eigen beheer zijn gehouden dan wel zijn herverzekerd of overgedragen;

      f. de financiële opzet;

      g. de financiële sturingsmiddelen; en

      h. de systematiek van de vaststelling van de parameters, zoals die op grond van [artikel 16d van de wet][ref3]
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel8
