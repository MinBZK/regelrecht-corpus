        artikel: '35'
        paragraaf: '11'
  - number: '35'
    text: |-
      1 De staten, bedoeld in [artikel 16f van de wet][ref1], omvatten uitsluitend:

      a. informatie over de organisatie van het pensioenfonds;

      b. een bestuursverslag;

      c. een balans;

      d. informatie over financiële relaties en transacties van het pensioenfonds;

      e. een rekening van baten en lasten;

      f. informatie inzake de dekkingsgraad;

      g. informatie inzake het vereist eigen vermogen;

      h. actuariële staten, gewaarmerkt door een bevoegde actuaris, waaronder een actuarieel verslag voorzien van een
      verklaring van een actuaris;

      i. informatie over het deelnemersbestand;

      j. informatie inzake de uitgevoerde pensioenregeling en eventueel andere door het pensioenfonds uitgevoerde
      regelingen;

      k. premiegegevens;

      l. informatie inzake herverzekering;

      m. informatie inzake verplichtingen van het pensioenfonds voor risico van de deelnemers.

      2 Met zijn verklaring bedoeld in het eerste lid, onderdeel h, bevestigt de actuaris dat hij zich ervan heeft
      overtuigd dat voldaan is aan de [artikelen 13 tot en met 16b van de wet][ref2]. Hij is bevoegd zijn verklaring
      nader toe te lichten of op enig punt een voorbehoud te maken.

      3 De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een externe
      deskundige. Ten bewijze dat de staten door hem zijn onderzocht, waarmerkt de externe deskundige de staten.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16f
      - id: ref2
        bwb_id: BWBR0028712
        artikel: '13'
  - number: '36'
    text: |-
      De Bank stelt regels met betrekking tot de te verstrekken gegevens, bedoeld in [artikel 34][ref1]. Deze omvatten
      uitsluitend:

      a. de modellen waarin de gegevens worden verstrekt;

      b. de reikwijdte en de mate van detaillering van de te verstrekken gegevens; deze omvatten geen uitbreiding of
      nadere rubricering van de in [artikel 34][ref2] geduide gegevens;

      c. de waardering van de posten;

      d. de te hanteren valuta en rekeneenheid;

      e. de afronding;

      f. de termijn waarbinnen de gegevens worden verstrekt; deze is niet korter dan noodzakelijk voor de uitoefening van
      het toezicht op de naleving van de wet; en

      g. de frequentie waarmee de gegevens worden verstrekt; deze bedraagt minimaal één maal en maximaal vier maal per
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel34
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '34'
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0028316
        artikel: '34'
        paragraaf: '11'
  - number: '37'
    text: |-
      1 Het pensioenfonds verstrekt de gegevens, bedoeld in [artikel 34][ref1], langs elektronische weg aan de Bank.

      2 De externe deskundige zendt een schriftelijke controleverklaring aan de Bank, inhoudende dat de langs
      elektronische weg verstrekte gegevens gelijk zijn aan de gegevens waaromtrent de externe deskundige een verklaring
      omtrent de getrouwheid als bedoeld in [artikel 35, derde lid][ref2], heeft afgegeven en ten bewijze waarvan de
      staten door hem zijn gewaarmerkt.

      3 De actuaris zendt een schriftelijke controleverklaring aan de Bank, inhoudende dat de langs
      elektronische weg verstrekte gegevens gelijk zijn aan de door hem gewaarmerkte actuariële staten,
      waaronder een actuarieel verslag voorzien van een verklaring van de actuaris als bedoeld in
      [artikel 35, eerste lid, onderdeel h en tweede lid][ref3].

      4 Het bestuur van het pensioenfonds zendt een schriftelijke controleverklaring aan de Bank,
      inhoudende dat de langs elektronische weg verstrekte gegevens gelijk zijn aan de staten, bedoeld in
      [artikel 16f, tweede lid, van de wet][ref4].

      5 De Bank kan regels stellen met betrekking tot de inhoud van de schriftelijke controleverklaring, bedoeld in het
      tweede, derde en vierde lid.

      6 De Bank kan, in afwijking van het eerste lid, op verzoek besluiten dat de verstrekking niet langs elektronische
      weg behoeft te geschieden, mits de verstrekking van de gevraagde gegevens wat betreft indeling en inhoud niet
      afwijkt van hetgeen langs elektronische weg zou worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0028316#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel37
