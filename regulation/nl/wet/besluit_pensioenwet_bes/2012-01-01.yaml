  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 25 juni 2010, nr. AV/PB/2010/13055,
    gedaan mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 5a, tiende lid, 5b, tweede lid, 13, derde lid, 13b, tweede lid, 13c, tweede lid, 14, tweede
    lid, 14a, tweede lid, 16a, zesde lid, 16b, vijfde lid, 16d, eerste lid, 16e, tweede lid, 16f, derde lid, 22a,
    tweede lid, 24, vierde lid, van de Pensioenwet BES;

    De Raad van State gehoord (advies van 15 juli 2010, nr. W.12.10.0262/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 23 augustus 2010, nr. AV/
    PB/2010/16654, uitgebracht mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties,

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *uitbesteding door een pensioenuitvoerder:* het door een pensioenuitvoerder verlenen van een opdracht aan
      een derde tot het ten behoeve van die uitvoerder verrichten van werkzaamheden die deel uitmaken van: 1°. of
      voortvloeien uit het uitoefenen van het bedrijf; of 2°. de wezenlijke bedrijfsprocessen ter ondersteuning daarvan;
        - *wet:* [Pensioenwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028712
  - number: '2'
    text: |-
      Voorafgaand aan de benoeming van een persoon die het beleid van een pensioenfonds gaat bepalen of mede bepalen
      toetst de Bank de deskundigheid en betrouwbaarheid van die persoon, bedoeld in [artikel 5a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '3'
    text: |-
      1 Voor het voldoen aan de vereiste deskundigheid is er in de kring van personen die het beleid van het
      pensioenfonds bepalen of mede bepalen ten minste een zodanig niveau van kennis en ervaring aanwezig dat het
      pensioenfonds, mede gelet op [artikel 5a, tweede lid, van de wet][ref1], behoorlijk wordt bestuurd.

      2 Ten minste twee personen in de kring van personen die het beleid van het pensioenfonds bepalen of mede bepalen
      dienen meerjarige ervaring te hebben in het besturen van een organisatie.

      3 De in het eerste lid bedoelde deskundigheid heeft betrekking op:

      a. het besturen van een organisatie;

      b. relevante wet- en regelgeving;

      c. pensioenregelingen en pensioensoorten;

      d. financieel technische en actuariële aspecten, waaronder financiering, beleggingen, actuariële principes en
      herverzekering;

      e. administratieve organisatie en interne controle; en

      f. communicatie.

      4 Het pensioenfonds geeft op verzoek van de Bank aan:

      a. hoe het beleid van het pensioenfonds ter bevordering en handhaving van het vereiste deskundigheidsniveau luidt;

      b. welke personen belast zijn met welke beleidsbepalende taken;

      c. welke personen over welke deskundigheid beschikken; en

      d. hoe en binnen welke termijn bepaalde tekortkomingen in de vereiste deskundigheid opgeheven zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '4'
    text: |-
      1 De Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in [artikel 5a, vijfde lid, van de wet][ref1]
      buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de toetsing van de betrouwbaarheid en de in
      aanmerking te nemen antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '5'
    text: |-
      1 De Bank verkrijgt inzicht in de in [artikel 4][ref1] bedoelde voornemens, handelingen en antecedenten op grond
      van:

      a. de door betrokkene verstrekte ingevulde vragenlijst volgens het door de Bank vastgestelde model;

      b. de mogelijkheid om bij het Openbaar Ministerie gegevens uit de politieregisters op te vragen;

      c. gegevens en inlichtingen, verkregen van de Belastingdienst;

      d. gegevens en inlichtingen, verkregen van overheidsinstanties binnen en buiten het Koninkrijk dan wel van binnen
      of buiten het Koninkrijk gevestigde van overheidswege aangewezen instanties die belast zijn met het toezicht op
      financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;

      e. ambtsberichten van het Openbaar Ministerie;

      f. inlichtingen, verkregen van door betrokkene opgegeven referenties;

      g. gegevens uit openbare bronnen;

      h. inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 4][ref2] bedoelde persoon betrokken
      is geweest;

      i. inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of

      j. gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.

      2 Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Bank aanleiding geven tot nader
      onderzoek, kan de Bank ook inlichtingen inwinnen en gegevens opvragen bij andere personen of instanties dan genoemd
      in dat lid. De Bank stelt de betrokkene in dat geval vooraf schriftelijk in kennis van:

      a. de reden van het nadere onderzoek;

      b. de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en

      c. de aard van de nadere gegevens of inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel5
    references:
      - id: ref1
