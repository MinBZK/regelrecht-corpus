        artikel: 14a
  - number: '27'
    text: |-
      Het kortetermijnherstelplan, bedoeld in artikel 16b van de wet, bevat in ieder geval:

      a. een beschrijving van de oorzaak van het niet meer of niet zullen voldoen aan de bij of krachtens
      [artikel 13 van de wet][ref1] gestelde vereisten ten aanzien de toereikende technische voorzieningen en de dekking
      daarvan door waarden;

      b. een beschrijving van de voorziene ontwikkeling van de technische voorzieningen en de waarden;

      c. een beschrijving van de concrete maatregelen waardoor de dekking van de technische voorzieningen binnen
      maximaal drie jaren op het vereiste niveau komt, waarbij rekening wordt gehouden met de verplichtingen van het
      pensioenfonds; en

      d. uitsluitsel of is voldaan aan de criteria in [artikel 16b van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
