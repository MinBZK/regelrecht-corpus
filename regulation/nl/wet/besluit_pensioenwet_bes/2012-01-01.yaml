  - number: '24'
    text: |-
      1 De waarden worden op zodanige wijze belegd dat de veiligheid, de kwaliteit, de liquiditeit en het rendement van
      de portefeuille als geheel zijn gewaarborgd.

      2 Waarden die ter dekking van de technische voorzieningen worden aangehouden, worden belegd op een wijze die
      strookt met de aard en de duur van de verwachte toekomstige pensioenuitkeringen.

      3 De waarden worden hoofdzakelijk op gereglementeerde markten belegd. Beleggingen in niet tot de handel op een
      gereglementeerde financiële markt toegelaten waarden worden tot een prudent niveau beperkt.

      4 Beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel
      of een doeltreffend portefeuillebeheer vergemakkelijken. Het pensioenfonds vermijdt een bovenmatig risico met
      betrekking tot een en dezelfde tegenpartij en tot andere derivatenverrichtingen.

      5 De waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in
      bepaalde waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de
      portefeuille als geheel worden vermeden.

      6 Onder waardering op marktwaarde als bedoeld in artikel 14 van de wet wordt verstaan: het bedrag waarvoor een
      actief kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde partijen, die
      tot een transactie bereid en onafhankelijk van elkaar zijn.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 Leningen als bedoeld in [artikel 14a van de wet][ref1] zijn tijdelijk indien deze worden aangegaan voor een
      periode van niet langer dan een jaar.

      2 Van een liquiditeitsdoelstelling als bedoeld in [artikel 14a van de wet][ref2] is sprake als het pensioenfonds
      tijdelijk niet kan voldoen aan zijn verplichtingen of de betreffende lening wordt aangegaan ter verbetering van het
      risicoprofiel van het pensioenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel14a
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel25
