  - number: '40'
    text: |-
      1 De Bank houdt bij het vaststellen van een bestuurlijke boete voor pensioenuitvoerders rekening met schade voor
      derden.

      2 De Bank kan de op te leggen bestuurlijke boete, na inachtneming van de bepalingen, bedoeld in de
      [artikelen 38][ref1] en [39][ref2] verlagen met maximaal 75 procent.


