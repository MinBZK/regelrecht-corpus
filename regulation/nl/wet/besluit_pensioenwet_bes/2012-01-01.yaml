        bwb_id: BWBR0028316
        artikel: '7'
        paragraaf: '2'
  - number: '7'
    text: |-
      De Bank neemt bij de vaststelling, bedoeld in [artikel 4][ref1], in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de wet beoogt te beschermen; en

      c. de overige belangen van het pensioenfonds en de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel7
