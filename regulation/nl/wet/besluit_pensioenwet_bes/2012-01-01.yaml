        bwb_id: BWBR0028316
        artikel: '41'
        paragraaf: '13'
  - number: '43'
    text: |-
      1 Het bedrag, bepaald op basis van artikel 43, wordt voor een uitvoerder die niet eerder dan 1 februari van het
      lopende jaar onder een categorie valt, in rekening gebracht naar evenredigheid van het aantal maanden in het jaar
      dat de pensioenuitvoerder onder de categorie valt, waarbij een gedeelte van een maand geldt als volledige maand.

      2 Aan een pensioenuitvoerder die niet langer onder een categorie valt, wordt het bedrag terugbetaald naar
      evenredigheid van het aantal maanden van het jaar dat de pensioenuitvoerder niet langer onder de categorie valt,
      waarbij een gedeelte van een maand geldt als volledige maand.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel43
  - number: '44'
    text: |-
      1 Een pensioenuitvoerder verstrekt binnen een door de Bank te stellen redelijke termijn een opgave van de
      maatstafgegevens.

      2 Indien een pensioenuitvoerder niet binnen de in het eerste lid bedoelde termijn een opgave heeft gedaan of een
      kennelijk onjuiste of onvolledige opgave heeft gedaan, kan de Bank een schatting maken van de maatstafgegevens.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel44
  - number: '45'
    text: |-
      1 De Bank bepaalt de wijze en het tijdstip van betaling van de bedragen, bedoeld in [artikel 41][ref1].

      2 Indien als wijze van betaling automatische incasso is overeengekomen, kan de Bank bij het in rekening brengen van
      het bedrag per factuur een korting toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel41
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '41'
        paragraaf: '13'
  - number: '46'
    text: |-
      Indien een pensioenuitvoerder het vermogen heeft gekregen van een pensioenuitvoerder die in het lopende jaar of in
      het voorafgaande jaar is opgehouden onder een categorie te vallen, wordt het bedrag ter vergoeding van de kosten,
      bedoeld in [artikel 41, eerste lid][ref1], die door de Bank ten aanzien van laatstbedoelde pensioenuitvoerder zijn
      gemaakt, in rekening gebracht bij de verkrijgende pensioenuitvoerder, voor zover deze kosten niet reeds bij de
      laatstbedoelde pensioenuitvoerder in rekening zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel41
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '41'
        paragraaf: '13'
  - number: '47'
    text: |-
      Een uitvoerder besteedt niet uit:

      a. taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen
      van beleid en het afleggen van verantwoording over het gevoerde beleid;

      b. werkzaamheden waarvan uitbesteding de verantwoordelijkheid van de uitvoerder voor de organisatie en beheersing
      van bedrijfsprocessen en het toezicht daarop kan ondermijnen;

      c. indien de uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het bij of
      krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel47
  - number: '48'
    text: |-
      1 Een pensioenfonds legt de overeenkomst met de derde waaraan de werkzaamheden worden uitbesteed schriftelijk vast.

      2 In de overeenkomst wordt in ieder geval het volgende geregeld:

      a. welke werkzaamheden worden uitbesteed onder verwijzing, indien mogelijk, naar de administratieve
      organisatiebeschrijving van het pensioenfonds, alsmede de voorwaarden waaronder de uitbesteding plaatsvindt;

      b. de informatie-uitwisseling tussen het pensioenfonds en de derde;

      c. de verplichting voor de derde om informatie waar de Bank ter uitvoering van zijn wettelijke taak om vraagt
      rechtstreeks aan de Bank ter beschikking te stellen;

      d. de mogelijkheid voor het pensioenfonds om te allen tijde wijzigingen aan te brengen in de wijze waarop de
      uitvoering van de werkzaamheden door de derde geschiedt;

      e. de verplichting voor de derde om het pensioenfonds in staat te stellen blijvend te voldoen aan het bij of
      krachtens de wet bepaalde;

      f. de mogelijkheid voor de Bank om onderzoek ter plaatse te doen of te laten doen bij de derde; en

      g. de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat het pensioenfonds
      de werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere derde kan laten
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel48
  - number: '49'
    text: |-
      1 Een pensioenfonds draagt zorg voor een systematische analyse van de risico’s die samenhangen met de uitbesteding
      van werkzaamheden en legt deze vast. Het pensioenfonds maakt de analyse op het niveau van zijn eigen organisatie in
      zijn geheel en op het niveau van de onderscheiden bedrijfsonderdelen.

      2 Een pensioenfonds voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking tot
      de uitbesteding van werkzaamheden, als onderdeel van een beheerste en integere bedrijfsvoering als bedoeld in
      [artikel 5b van de wet][ref1].

      3 Een pensioenfonds beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om de uitvoering
      van de uitbestede werkzaamheden te kunnen beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel49
