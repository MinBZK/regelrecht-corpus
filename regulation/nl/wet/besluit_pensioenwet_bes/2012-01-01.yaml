        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028316
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De betrouwbaarheid van een persoon als bedoeld in [artikel 4][ref1] staat niet buiten twijfel als deze
      veroordeeld is terzake van een misdrijf, dat bij ministeriële regeling is aangewezen, tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.

      2 De Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 7][ref2], afwijken van het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel7
    url: https://wetten.overheid.nl/BWBR0028316/2012-01-01#Artikel6
