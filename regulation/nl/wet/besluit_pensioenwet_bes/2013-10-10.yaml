$id: besluit_pensioenwet_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2013-10-10'
bwb_id: BWBR0028316
url: https://wetten.overheid.nl/BWBR0028316/2013-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 25 juni 2010, nr. AV/PB/2010/13055,
    gedaan mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 5a, tiende lid, 5b, tweede lid, 13, derde lid, 13b, tweede lid, 13c, tweede lid, 14, tweede
    lid, 14a, tweede lid, 16a, zesde lid, 16b, vijfde lid, 16d, eerste lid, 16e, tweede lid, 16f, derde lid, 22a,
    tweede lid, 24, vierde lid, van de Pensioenwet BES;

    De Raad van State gehoord (advies van 15 juli 2010, nr. W.12.10.0262/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 23 augustus 2010, nr. AV/
    PB/2010/16654, uitgebracht mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties,

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *uitbesteding door een
      pensioenuitvoerder:* het door een pensioenuitvoerder verlenen van een opdracht aan een derde tot het ten behoeve
      van die uitvoerder verrichten van werkzaamheden die deel uitmaken van: 1°. of voortvloeien uit het uitoefenen van
      het bedrijf; of 2°. de wezenlijke bedrijfsprocessen ter ondersteuning daarvan;
        - *wet:* [Pensioenwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028712
  - number: '2'
    text: |-
      Voorafgaand aan de benoeming van een persoon die het beleid van een pensioenfonds gaat bepalen of mede bepalen
      toetst de Bank de deskundigheid en betrouwbaarheid van die persoon, bedoeld in [artikel 5a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '3.1'
    text: |-
      Voor het voldoen aan de vereiste deskundigheid is er in de kring van personen die het beleid van het pensioenfonds
      bepalen of mede bepalen ten minste een zodanig niveau van kennis en ervaring aanwezig dat het pensioenfonds, mede
      gelet op [artikel 5a, tweede lid, van de wet][ref1], behoorlijk wordt bestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '3.2'
    text: |-
      Ten minste twee personen in de kring van personen die het beleid van het pensioenfonds bepalen of mede bepalen
      dienen meerjarige ervaring te hebben in het besturen van een organisatie.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: '3.3'
    text: 'De in het eerste lid bedoelde deskundigheid heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.a
    text: het besturen van een organisatie;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.b
    text: relevante wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.c
    text: pensioenregelingen en pensioensoorten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.d
    text: |-
      financieel technische en actuariële aspecten, waaronder financiering, beleggingen, actuariële principes en
      herverzekering;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.e
    text: administratieve organisatie en interne controle; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.3.f
    text: communicatie.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: '3.4'
    text: 'Het pensioenfonds geeft op verzoek van de Bank aan:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.4.a
    text: hoe het beleid van het pensioenfonds ter bevordering en handhaving van het vereiste deskundigheidsniveau luidt;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.4.b
    text: welke personen belast zijn met welke beleidsbepalende taken;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.4.c
    text: welke personen over welke deskundigheid beschikken; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: 3.4.d
    text: hoe en binnen welke termijn bepaalde tekortkomingen in de vereiste deskundigheid opgeheven zullen worden.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel3
  - number: '4.1'
    text: |-
      De Bank stelt vast of de betrouwbaarheid van een persoon als bedoeld in [artikel 5a, vijfde lid, van de wet][ref1]
      buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5a
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de toetsing van de betrouwbaarheid en de in aanmerking
      te nemen antecedenten.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel4
  - number: '5.1'
    text: |-
      De Bank verkrijgt inzicht in de in [artikel 4][ref1] bedoelde voornemens, handelingen en antecedenten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '4'
        paragraaf: '2'
  - number: 5.1.a
    text: de door betrokkene verstrekte ingevulde vragenlijst volgens het door de Bank vastgestelde model;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.b
    text: de mogelijkheid om bij het Openbaar Ministerie gegevens uit de politieregisters op te vragen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.c
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.d
    text: |-
      gegevens en inlichtingen, verkregen van overheidsinstanties binnen en buiten het Koninkrijk dan wel van binnen
      of buiten het Koninkrijk gevestigde van overheidswege aangewezen instanties die belast zijn met het toezicht op
      financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.e
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.f
    text: inlichtingen, verkregen van door betrokkene opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.g
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.h
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 4][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '4'
        paragraaf: '2'
  - number: 5.1.i
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.1.j
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: '5.2'
    text: |-
      Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Bank aanleiding geven tot nader
      onderzoek, kan de Bank ook inlichtingen inwinnen en gegevens opvragen bij andere personen of instanties dan genoemd
      in dat lid. De Bank stelt de betrokkene in dat geval vooraf schriftelijk in kennis van:
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: 5.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel5
  - number: '6.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 4][ref1] staat niet buiten twijfel als deze veroordeeld
      is terzake van een misdrijf, dat bij ministeriële regeling is aangewezen, tenzij er sinds het onherroepelijk worden
      van de uitspraak acht jaren of meer zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '4'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      De Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 7][ref1], afwijken van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel7
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '7'
        paragraaf: '2'
  - number: '7'
    text: |-
      De Bank neemt bij de vaststelling, bedoeld in [artikel 4][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel4
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '4'
        paragraaf: '2'
  - number: 7.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel7
  - number: 7.b
    text: de belangen die de wet beoogt te beschermen; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel7
  - number: 7.c
    text: de overige belangen van het pensioenfonds en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel7
  - number: '8'
    text: |-
      Een pensioenfonds beschikt over goede administratieve en boekhoudkundige procedures en adequate interne
      controlemechanismen, stelt beleid op ten aanzien van de beheersing van te lopen risico’s en draagt zorg voor de
      uitvoering van dat beleid.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel8
  - number: '9'
    text: |-
      Een pensioenfonds draagt zorg voor een systematische analyse van integriteitrisico’s en stelt aan de hand van deze
      analyse een integriteitbeleid vast en draagt zorg voor de uitvoering van dat beleid.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel9
  - number: '10.1'
    text: |-
      Een pensioenfonds beschikt over procedures en maatregelen met betrekking tot het tegengaan van verstrengeling
      van privé-belangen met de belangen van het pensioenfonds van personen die het beleid van het pensioenfonds
      bepalen, leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van het
      pensioenfonds en andere werknemers of andere personen die in opdracht van het pensioenfonds op structurele basis
      werkzaamheden voor het pensioenfonds verrichten.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel10
  - number: '10.2'
    text: |-
      Een pensioenfonds beschikt over een gedragscode die voor bestuurders en medewerkers van het pensioenfonds
      voorschriften geeft ter voorkoming van belangenconflicten en van misbruik en oneigenlijk gebruik van de bij het
      pensioenfonds aanwezige informatie of zaken.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel10
  - number: '10.3'
    text: De Bank kan regels stellen met betrekking tot de inhoud van de gedragscode, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel10
  - number: '11'
    text: |-
      Een pensioenfonds voert een beleid gericht op het duurzaam beheersen van te lopen financiële risico’s en andere dan
      financiële risico’s.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel11
  - number: '12.1'
    text: |-
      Een pensioenfonds voert ten minste eens in de drie jaar een continuïteitsanalyse uit waarbij met een stochastische
      benaderingswijze wordt bezien of het pensioenfonds aan haar verplichtingen op de lange termijn kan voldoen. De
      continuïteitsanalyse biedt tevens inzicht in de mate waarin de voorwaardelijke toeslagverlening naar verwachting
      kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel12
  - number: '12.2'
    text: |-
      Indien naar de mening van de Bank sprake is van aanzienlijke wijzigingen in de huidige of verwachte financiële
      positie van het pensioenfonds, voert het pensioenfonds tussentijds een extra continuïteitsanalyse uit.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel12
  - number: '12.3'
    text: |-
      De continuïteitsanalyse omvat 15 prognosejaren, gerekend vanaf de rapportagedatum. Het pensioenfonds heeft voorbij
      deze tijdhorizon van 15 prognosejaren een kwalitatief beeld van de verwachtingen, risico’s en het beleid.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel12
  - number: '12.4'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de continuïteitsanalyse.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel12
  - number: '14.1'
    text: |-
      Vanaf 1 januari 2012 gaat een fonds voor de berekeningen, bedoeld in de [artikelen 5b][ref1], [13][ref2],
      [13b][ref3], [16a][ref4] en [16b van de wet][ref5] uit van:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel13b
      [ref4]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
      [ref5]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0028712
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0028712
        artikel: 13b
      - id: ref4
        bwb_id: BWBR0028712
        artikel: 16a
      - id: ref5
        bwb_id: BWBR0028712
        artikel: 16b
  - number: 14.1.a
    text: minimale verwachtingswaarden voor de groeivoeten van het loon- en prijsindexcijfer van 2%, respectievelijk 2%;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: 14.1.b
    text: een maximaal verwacht rendement op vastrentende waarden van 4,5% per jaar;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: 14.1.c
    text: |-
      een verwacht rendement op beursgenoteerde aandelen en indirect onroerend goed met een rekenkundig gemiddelde van
      maximaal 8,5% per jaar en een meetkundig gemiddelde van maximaal 7% per jaar;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: 14.1.d
    text: |-
      een verwacht rendement op overige zakelijke waarden met een rekenkundig gemiddelde van maximaal 9% per jaar en een
      meetkundig gemiddelde van maximaal 7,5% per jaar;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: 14.1.e
    text: |-
      een verwacht rendement op direct onroerend goed en grondstoffen met een rekenkundig gemiddelde van maximaal 7,5%
      per jaar en een meetkundig gemiddelde van maximaal 6% per jaar.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: '14.2'
    text: |-
      Een pensioenfonds kan na instemming van de Bank afwijken van de minimale verwachtingswaarden, bedoeld in het eerste
      lid, onderdeel a, indien de specifieke omstandigheden van het pensioenfonds dat noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: '14.3'
    text: De rendementscijfers, bedoeld in het eerste lid, betreffen bruto cijfers, voor aftrek van beleggingskosten.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel14
  - number: '15.1'
    text: |-
      Bij een herstelplan als bedoeld in [artikel 16a][ref1] en [16b van de wet][ref2] waarmee De Nederlandsche Bank
      heeft ingestemd, is het feit dat de uitkomst van berekeningen in het kader van dat herstelplan en het daarin
      opgenomen beleid wijzigt omdat gebruik wordt gemaakt van na de vaststelling van het herstelplan gewijzigde regels
      als bedoeld in [artikel 16d, eerste lid, van de wet][ref3], als zodanig geen aanleiding voor herziening van het
      herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel16d
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16a
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 16b
      - id: ref3
        bwb_id: BWBR0028712
        artikel: 16d
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid kan bij berekeningen ten aanzien van de consistentie, bedoeld in
      [artikel 7f, eerste lid, van de wet][ref1], het feit dat de uitkomst van berekeningen wijzigt als bedoeld in
      het eerste lid, als zodanig wel aanleiding zijn tot herziening van het in het herstelplan, bedoeld in het eerste
      lid, opgenomen beleid omtrent voorwaardelijke toeslagverlening, nadat de maximale looptijd die geldt voor het
      kortetermijnherstelplan is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel7f
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 7f
  - number: '17.1'
    text: |-
      Het bestuur van een pensioenfonds stelt de hoogte van de technische voorzieningen vast op basis van de contante
      waarde van de verwachte uitgaande kasstromen die voortvloeien uit de tot de datum van vaststelling opgebouwde
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel17
  - number: '17.2'
    text: De contante waarde wordt vastgesteld op basis van een rekenrente van ten hoogste 4%.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel17
  - number: '17.3'
    text: |-
      Een pensioenfonds stelt de omvang van de verwachte uitgaande kasstromen vast op basis van verwachte
      marktontwikkelingen en voor het pensioenfonds prudente verzekeringstechnische grondslagen waaronder begrepen de
      voorzienbare trend in overlevingskansen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel17
  - number: '18.1'
    text: |-
      Een pensioenfonds dient ieder jaar vóór 1 juli de berekening van de technische voorzieningen per het einde van het
      voorafgaande jaar in bij de Bank.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel18
  - number: '18.2'
    text: |-
      Onverminderd het eerste lid, dient een pensioenfonds desgevraagd een berekening van de technische voorzieningen
      in bij de Bank indien de Bank tekenen ontwaart van een ontwikkeling die het eigen vermogen, de liquiditeit of de
      bedrijfsvoering van het pensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel18
  - number: '19'
    text: |-
      De benodigde premie in verband met de pensioenverplichtingen wordt berekend overeenkomstig [artikel 17][ref1],
      waarbij rekening gehouden wordt met:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel17
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '17'
        paragraaf: '5'
  - number: 19.a
    text: |-
      de opslag die nodig is voor het bij de aangroei van de pensioenverplichtingen behorende vereist eigen vermogen als
      bedoeld in [artikel 13c van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
  - number: 19.b
    text: |-
      de opslag die nodig is voor de bij de aangroei van de pensioenverplichtingen behorende uitvoeringskosten van het
      pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel19
  - number: 19.c
    text: |-
      de premie die actuarieel benodigd is ten behoeve van toeslagverlening indien gekozen is voor financiering op de
      wijze, bedoeld in [artikel 14b, eerste lid, onderdeel a, b of d van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 14b
  - number: '20.1'
    text: 'Het eigen vermogen van een pensioenfonds wordt met name gevormd door de volgende vermogensbestanddelen:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: 20.1.a
    text: het gestorte aandelenkapitaal of waarborgkapitaal vermeerderd met de ledenrekeningen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: 20.1.b
    text: de reserves;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: 20.1.c
    text: het onverdeelde positieve of negatieve resultaat; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: 20.1.d
    text: de achtergestelde leningen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: '20.2'
    text: |-
      Het eigen vermogen van een pensioenfonds wordt verminderd met het bedrag van de eigen aandelen die rechtstreeks
      door het pensioenfonds worden gehouden en met het bedrag van de immateriële activa.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel20
  - number: '21.1'
    text: |-
      De ledenrekeningen, bedoeld in [artikel 20, eerste lid, onder a][ref1], worden alleen meegeteld als onderdeel van
      het eigen vermogen, wanneer de statuten bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel20
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '20'
        paragraaf: '7'
  - number: 21.1.a
    text: |-
      vanaf deze rekeningen alleen betalingen aan de leden plaatsvinden als het eigen vermogen daardoor niet negatief
      wordt, dan wel bij liquidatie van het pensioenfonds, als alle andere schulden zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel21
  - number: 21.1.b
    text: |-
      elke betaling vanaf deze ledenrekeningen voor andere doeleinden dan de individuele opzegging van het lidmaatschap
      niet eerder plaatsvindt dan nadat dertig dagen zijn verstreken na melding daarvan aan de Bank; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel21
  - number: 21.1.c
    text: de Bank kan besluiten dat een voorgenomen betaling niet mag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel21
  - number: '21.2'
    text: |-
      De statutaire bepalingen met betrekking tot de ledenrekeningen worden niet gewijzigd dan nadat daarvoor toestemming
      van de Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel21
  - number: '22.1'
    text: |-
      De achtergestelde leningen, bedoeld in [artikel 20, eerste lid, onder d][ref1], worden meegeteld tot een maximum
      van vijftig procent van het vereist eigen vermogen of van het eigen vermogen als dat lager is dan het vereist
      eigen vermogen, waarbij niet meer dan de helft van dat maximum in de vorm van achtergestelde leningen met vaste
      looptijd, mits bindende overeenkomsten gelden op grond waarvan, in geval van liquidatie van het pensioenfonds,
      de achtergestelde leningen achtergesteld worden bij de vorderingen van alle andere crediteuren en pas worden
      terugbetaald als alle andere schulden zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel20
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '20'
        paragraaf: '7'
  - number: '22.2'
    text: De achtergestelde leningen worden meegeteld voor zover bedragen zijn gestort.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '22.3'
    text: |-
      Achtergestelde leningen met een vaste looptijd worden meegeteld als de oorspronkelijke looptijd ten minste vijf
      jaar bedraagt. De hoogte tot welke de achtergestelde lening wordt meegeteld als onderdeel van het eigen vermogen
      wordt lineair verlaagd gedurende ten minste de vijf jaar die voorafgaan aan de datum van de aflossing.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '22.4'
    text: |-
      Achtergestelde leningen zonder een vaste looptijd worden meegeteld als deze worden of zullen worden afgelost met
      een opzeggingstermijn van ten minste vijf jaar of de Bank aflossing heeft toegestaan. Het verzoek om toestemming
      voor de aflossing ontvangt de Bank ten minste zes maanden voor de beoogde aflossingsdatum.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '22.5'
    text: |-
      De leningsovereenkomst bevat geen bepaling op grond waarvan de achtergestelde lening voor het einde van de
      looptijd, anders dan bij liquidatie van het pensioenfonds, wordt afgelost.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '22.6'
    text: |-
      In afwijking van het vijfde lid kan de Bank toestemming verlenen voor vervroegde terugbetaling van achtergestelde
      leningen met een vaste looptijd, wanneer het initiatief hiertoe uitgaat van het pensioenfonds en het eigen vermogen
      niet onder het vereiste niveau daalt.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '22.7'
    text: De leningsovereenkomst wordt niet gewijzigd dan nadat daarvoor toestemming van de Bank is verkregen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel22
  - number: '23.1'
    text: |-
      Voor de berekening van het vereist eigen vermogen hanteert het pensioenfonds een standaardmodel waarin door middel
      van risicofactoren voor de gehele balans van activa en passiva rekening wordt gehouden met:
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.a
    text: het renterisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.b
    text: het aandelen- en vastgoedrisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.c
    text: het valutarisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.d
    text: het grondstoffenrisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.e
    text: het kredietrisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.f
    text: het verzekeringstechnisch risico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.g
    text: het liquiditeitsrisico;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.h
    text: het concentratierisico; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.1.i
    text: het operationeel risico.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid kan een pensioenfonds, mits voorafgaande toestemming is verleend door de Bank, voor
      de berekening van het vereist eigen vermogen:
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.2.a
    text: een vereenvoudigd model hanteren, of
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: 23.2.b
    text: een intern model hanteren.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: '23.3'
    text: |-
      De Bank kan nadere regels stellen inzake de scenariomethode indien innovatieve beleggingsinstrumenten daartoe
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: '23.4'
    text: |-
      Bij ministeriële regeling kunnen regels gesteld met betrekking tot het standaardmodel en de omvang, de inhoud en
      de samenhang van de risicofactoren, bedoeld in het eerste lid, en met betrekking tot de in het tweede lid bedoelde
      situatie.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel23
  - number: '24.1'
    text: |-
      De waarden worden op zodanige wijze belegd dat de veiligheid, de kwaliteit, de liquiditeit en het rendement van de
      portefeuille als geheel zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '24.2'
    text: |-
      Waarden die ter dekking van de technische voorzieningen worden aangehouden, worden belegd op een wijze die strookt
      met de aard en de duur van de verwachte toekomstige pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '24.3'
    text: |-
      De waarden worden hoofdzakelijk op gereglementeerde markten belegd. Beleggingen in niet tot de handel op een
      gereglementeerde financiële markt toegelaten waarden worden tot een prudent niveau beperkt.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '24.4'
    text: |-
      Beleggingen in derivaten zijn toegestaan voor zover deze bijdragen aan een vermindering van het risicoprofiel
      of een doeltreffend portefeuillebeheer vergemakkelijken. Het pensioenfonds vermijdt een bovenmatig risico met
      betrekking tot een en dezelfde tegenpartij en tot andere derivatenverrichtingen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '24.5'
    text: |-
      De waarden worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in bepaalde
      waarden, of een bepaalde emittent van waarden of groep van ondernemingen en risicoaccumulatie in de portefeuille
      als geheel worden vermeden.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '24.6'
    text: |-
      Onder waardering op marktwaarde als bedoeld in artikel 14 van de wet wordt verstaan: het bedrag waarvoor een actief
      kan worden verhandeld of een passief kan worden afgewikkeld tussen terzake goed geïnformeerde partijen, die tot een
      transactie bereid en onafhankelijk van elkaar zijn.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel24
  - number: '25.1'
    text: |-
      Leningen als bedoeld in [artikel 14a van de wet][ref1] zijn tijdelijk indien deze worden aangegaan voor een periode
      van niet langer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 14a
  - number: '25.2'
    text: |-
      Van een liquiditeitsdoelstelling als bedoeld in [artikel 14a van de wet][ref1] is sprake als het pensioenfonds
      tijdelijk niet kan voldoen aan zijn verplichtingen of de betreffende lening wordt aangegaan ter verbetering van het
      risicoprofiel van het pensioenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 14a
  - number: '26.1'
    text: 'Het langetermijnherstelplan, bedoeld in artikel 16a van de wet, bevat in ieder geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
  - number: 26.1.a
    text: |-
      de oorzaak van het niet meer of niet zullen voldoen aan de bij of krachtens [artikel 13c van de wet][ref1] gestelde
      vereisten ten aanzien van het vereist eigen vermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
  - number: 26.1.b
    text: de voorziene ontwikkeling van de technische voorzieningen en de waarden;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
  - number: 26.1.c
    text: |-
      de concrete maatregelen waardoor het vereist eigen vermogen binnen maximaal vijftien jaar op het vereiste niveau
      komt, waarbij rekening wordt gehouden met de naar verwachting toe te kennen toeslagverlening en de overige
      verplichtingen van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid, onder c, bedoelde maatregelen mogen er niet toe leiden dat het risico dat niet wordt voldaan
      aan de in het eerste lid, onder a, genoemde vereisten ten aanzien van het vereist eigen vermogen, doelbewust wordt
      vergroot ten opzichte van de situatie waarin wel werd voldaan aan de in [artikel 13c van de wet][ref1] opgenomen
      vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13c
  - number: '26.3'
    text: Een herstelplan vertoont ex ante een gestaag herstel.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel26
  - number: '27'
    text: 'Het kortetermijnherstelplan, bedoeld in artikel 16b van de wet, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel27
  - number: 27.a
    text: |-
      een beschrijving van de oorzaak van het niet meer of niet zullen voldoen aan de bij of krachtens
      [artikel 13 van de wet][ref1] gestelde vereisten ten aanzien de toereikende technische voorzieningen en de dekking
      daarvan door waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '13'
  - number: 27.b
    text: een beschrijving van de voorziene ontwikkeling van de technische voorzieningen en de waarden;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel27
  - number: 27.c
    text: |-
      een beschrijving van de concrete maatregelen waardoor de dekking van de technische voorzieningen binnen
      maximaal drie jaren op het vereiste niveau komt, waarbij rekening wordt gehouden met de verplichtingen van het
      pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel27
  - number: 27.d
    text: |-
      uitsluitsel of is voldaan aan de criteria in [artikel 16b van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16b
  - number: '28'
    text: |-
      De actuariële en bedrijfstechnische nota, bedoeld in artikel 16e van de wet, bevat in ieder geval een beschrijving
      van:
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.a
    text: |-
      de hoofdlijnen van het interne beheersingssysteem, zoals voorgeschreven bij of krachtens
      [artikel 5b van de wet][ref1], en van de opzet van de administratieve organisatie en interne controle, bedoeld
      in [artikel 8][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel8
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0028316
        artikel: '8'
        paragraaf: '3'
  - number: 28.b
    text: |-
      voor zover van toepassing procedures en criteria voor de aansluiting van werkgevers bij het betreffende
      pensioenfonds en voor het verkrijgen van het deelnemerschap van hun werknemers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.c
    text: de hoofdlijnen van de uitvoeringsovereenkomst dan wel het uitvoeringsreglement;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.d
    text: |-
      de hoofdlijnen van de reeds verworven en nog te verwerven pensioenaanspraken en -rechten die voor de deelnemers,
      gewezen deelnemers, gepensioneerden of andere aanspraakgerechtigden voortvloeien uit het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.e
    text: |-
      de uit het pensioenreglement en de uitvoeringsovereenkomst dan wel het uitvoeringsreglement voortvloeiende risico’s
      die in eigen beheer zijn gehouden dan wel zijn herverzekerd of overgedragen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.f
    text: de financiële opzet;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.g
    text: de financiële sturingsmiddelen; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
  - number: 28.h
    text: |-
      de systematiek van de vaststelling van de parameters, zoals die op grond van [artikel 16d van de wet][ref1] worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16d
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16d
  - number: '29.1'
    text: |-
      De beschrijving van de financiële opzet, bedoeld in[ artikel 28, onder f][ref1], bevat in ieder geval een
      beschrijving van de wijze waarop wordt voldaan aan de vereisten ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel28
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '28'
        paragraaf: '10'
  - number: 29.1.a
    text: |-
      de technische voorzieningen en het vereist eigen vermogen, bedoeld in de [artikelen 13][ref1] en
      [13c van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel13c
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 13c
  - number: 29.1.b
    text: |-
      het premiebeleid, bedoeld in [artikel 13b van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 13b
  - number: 29.1.c
    text: |-
      het beleggingsbeleid en het aangaan van leningen, bedoeld in de [artikelen 14][ref1] en [14a van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel14a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 14a
  - number: 29.1.d
    text: |-
      de financiering van voorwaardelijke toeslagverlening, bedoeld in de [artikelen 7f][ref1] en [14b van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel7f
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel14b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 7f
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 14b
  - number: '29.2'
    text: |-
      Bij de beschrijving, bedoeld in het eerste lid, wordt rekening gehouden met de overige verplichtingen van het
      pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel29
  - number: '30'
    text: |-
      De beschrijving van de financiële sturingsmiddelen, bedoeld in [artikel 28, onder g][ref1], bevat in ieder geval
      een beschrijving van de inzetbaarheid van de sturingsmogelijkheden van het pensioenfonds ten aanzien van het
      premiebeleid, het beleggingsbeleid en het beleid met betrekking tot de aanpassingen van de aanspraken en inzake
      voorwaardelijke toeslagverlening. Daarbij wordt aangegeven welke effecten met de genoemde sturingsmiddelen worden
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel28
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '28'
        paragraaf: '10'
  - number: '31'
    text: |-
      De beschrijving van het beleggingsbeleid, bedoeld in [artikel 29, onder c][ref1], bevat in ieder geval een
      beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel29
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '29'
        paragraaf: '10'
  - number: 31.a
    text: |-
      het strategisch beleggingsbeleid, waarin opgenomen een beschrijving van de beleggingsdoelstelling, de samenstelling
      van de beoogde beleggingsportefeuille alsmede de mate waarin van de beoogde beleggingsportefeuille mag worden
      afgeweken;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel31
  - number: 31.b
    text: de opzet van de uitvoering van de vermogensbeheeractiviteiten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel31
  - number: 31.c
    text: de wijze van risicometing en -beheersing, met name van marktrisico’s en kredietrisico’s; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel31
  - number: 31.d
    text: de opzet van de resultaatsevaluatie met betrekking tot de onderwerpen genoemd onder a, b en c.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel31
  - number: '32'
    text: |-
      Voor zover risico’s zijn overgedragen of herverzekerd kunnen de beschrijvingen, bedoeld in de [artikelen 30][ref1]
      en [31][ref2], beperkt blijven tot een verwijzing naar hetgeen in de ten behoeve van de overdracht of
      herverzekering afgesloten overeenkomsten is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel31
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '30'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0028316
        artikel: '31'
        paragraaf: '10'
  - number: '33'
    text: |-
      De beschrijvingen die de actuariële en bedrijfstechnische nota bevat op grond van de
      [artikelen 27 tot en met 31][ref1] zijn zodanig dat de Bank op basis van die beschrijvingen tot
      een oordeel kan komen over de wijze waarop voldaan wordt aan de [artikelen 5b][ref2], [7e][ref3],
      [13 tot en met 14b van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0028712#Artikel7e
      [ref4]: https://wetten.overheid.nl/BWBR0028712#Artikel13
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '27'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0028712
        artikel: 5b
      - id: ref3
        bwb_id: BWBR0028712
        artikel: 7e
      - id: ref4
        bwb_id: BWBR0028712
        artikel: '13'
  - number: '34.1'
    text: |-
      De door een pensioenfonds op grond van [artikel 16f van de wet][ref1] te verstrekken gegevens hebben uitsluitend
      betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16f
  - number: 34.1.a
    text: 'het pensioenfonds en zijn organisatie met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.1°
    text: het aantal medewerkers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.2°
    text: uitbesteding;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.3°
    text: de medebeleidsbepalers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.4°
    text: deskundigheidsbevordering van het bestuur;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.5°
    text: |-
      de persoongegevens van de actuaris bedoeld in [artikel 35, tweede lid][ref1], de externe deskundige, bedoeld in
      artikel 35, derde lid, en de adviserende actuaris;


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel35
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '35'
        paragraaf: '11'
  - number: 34.1.a.6°
    text: de verklaring van een externe deskundige; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.a.7°
    text: het interne toezicht.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c
    text: |-
      de balans, bestaande uit een enkelvoudige balans en, indien van toepassing, een geconsolideerde balans, een
      toelichting op de balans alsmede:
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c.1°
    text: |-
      een specificatie van de activa met betrekking tot immateriële activa, onroerende zaken, niet geconsolideerde en
      geconsolideerde deelnemingen, indien van toepassing, herverzekeringsdeel technische voorzieningen, overige activa
      en beleggingen voor risico deelnemers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c.2°
    text: |-
      een specificatie van de passiva met betrekking tot gespecificeerde reserves, het aandeel van derden in geval van
      een geconsolideerde balans, andere voorzieningen en overige verplichtingen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c.3°
    text: informatie over ontvangen en gestelde zekerheden en garanties;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c.4°
    text: informatie over grote posten binnen de beleggingen; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.c.5°
    text: |-
      specificatie van de beleggingen met betrekking tot de valuta, de risicoklassen, derivatenposities,
      beleggingsrendementen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.d
    text: 'de financiële relaties en transacties van het pensioenfonds met:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.d.1°
    text: bijdragende ondernemingen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.d.2°
    text: ondernemingen uit dezelfde groep als de bijdragende onderneming;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.d.3°
    text: |-
      personen die een relatie hebben of hebben gehad met het pensioenfonds wanneer sprake is van een bijzondere lening;
      en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.d.4°
    text: anderen dan de onder 1° en 2° genoemden inzake achtergestelde leningen aan het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.e
    text: een rekening van baten en lasten met specificatie van de posten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.f
    text: de dekkingsgraad;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.g
    text: 'toetsing van het eigen vermogen:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.g.1°
    text: aanwezig eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.g.2°
    text: de dekkingspositie;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.g.3°
    text: bij gebruik van het standaard model; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.g.4°
    text: bij gebruik van een intern model;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h
    text: 'actuariële staten:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h.1°
    text: technische voorzieningen voor risico pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h.2°
    text: premiespecificatie garantiecontract;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h.3°
    text: indexatiegegevens;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h.4°
    text: actuarieel verslag; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.h.5°
    text: een analyse van het saldo van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.i
    text: 'het deelnemersbestand inzake:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.i.1°
    text: de leeftijdsopbouw en de technische voorzieningen; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.i.2°
    text: de geografische spreiding van deelnemers en premies;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.j
    text: 'de door het pensioenfonds uitgevoerde pensioenregeling met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.j.1°
    text: de kenmerken van de pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.j.2°
    text: het aantal deelnemers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.k
    text: premiegegevens over het nieuwe jaar, tenzij sprake is van een gesloten pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.l
    text: 'herverzekering, met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.l.1°
    text: garantiecontracten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.l.2°
    text: risicoherverzekering; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.l.3°
    text: kapitaalcontracten.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.m
    text: verplichtingen van het pensioenfonds voor risico van de deelnemers;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.n
    text: uitvoering van een VUT-regeling;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.o
    text: toepassing van een herstelplan, met betrekking tot de situatie per 31 december van het verslagjaar;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.1.p
    text: |-
      een besluit tot wijziging van een pensioenregeling in de verslagperiode met betrekking tot de kenmerken van de
      pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: '34.2'
    text: 'Het pensioenfonds verstrekt in geval van wijzigingen tevens informatie over:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.2.a
    text: de door het pensioenfonds uitgevoerde pensioenregeling of pensioenregelingen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.2.b
    text: de gevolgen van deze wijziging voor de toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: 34.2.c
    text: de kenmerken van de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel34
  - number: '35.1'
    text: |-
      De staten, bedoeld in [artikel 16f van de wet][ref1], omvatten uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16f
  - number: 35.1.a
    text: informatie over de organisatie van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.c
    text: een balans;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.d
    text: informatie over financiële relaties en transacties van het pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.e
    text: een rekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.f
    text: informatie inzake de dekkingsgraad;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.g
    text: informatie inzake het vereist eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.h
    text: |-
      actuariële staten, gewaarmerkt door een bevoegde actuaris, waaronder een actuarieel verslag voorzien van een
      verklaring van een actuaris;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.i
    text: informatie over het deelnemersbestand;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.j
    text: |-
      informatie inzake de uitgevoerde pensioenregeling en eventueel andere door het pensioenfonds uitgevoerde
      regelingen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.k
    text: premiegegevens;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.l
    text: informatie inzake herverzekering;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: 35.1.m
    text: informatie inzake verplichtingen van het pensioenfonds voor risico van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: '35.2'
    text: |-
      Met zijn verklaring bedoeld in het eerste lid, onderdeel h, bevestigt de actuaris dat hij zich ervan heeft
      overtuigd dat voldaan is aan de [artikelen 13 tot en met 16b van de wet][ref1]. Hij is bevoegd zijn verklaring
      nader toe te lichten of op enig punt een voorbehoud te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel13
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: '13'
  - number: '35.3'
    text: |-
      De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een externe deskundige.
      Ten bewijze dat de staten door hem zijn onderzocht, waarmerkt de externe deskundige de staten.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel35
  - number: '36'
    text: |-
      De Bank stelt regels met betrekking tot de te verstrekken gegevens, bedoeld in [artikel 34][ref1]. Deze omvatten
      uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel34
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '34'
        paragraaf: '11'
  - number: 36.a
    text: de modellen waarin de gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: 36.b
    text: |-
      de reikwijdte en de mate van detaillering van de te verstrekken gegevens; deze omvatten geen uitbreiding of nadere
      rubricering van de in [artikel 34][ref1] geduide gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel34
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '34'
        paragraaf: '11'
  - number: 36.c
    text: de waardering van de posten;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: 36.d
    text: de te hanteren valuta en rekeneenheid;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: 36.e
    text: de afronding;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: 36.f
    text: |-
      de termijn waarbinnen de gegevens worden verstrekt; deze is niet korter dan noodzakelijk voor de uitoefening van
      het toezicht op de naleving van de wet; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: 36.g
    text: de frequentie waarmee de gegevens worden verstrekt; deze bedraagt minimaal één maal en maximaal vier maal per jaar.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel36
  - number: '37.1'
    text: |-
      Het pensioenfonds verstrekt de gegevens, bedoeld in [artikel 34][ref1], langs elektronische weg aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel34
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '34'
        paragraaf: '11'
  - number: '37.2'
    text: |-
      De externe deskundige zendt een schriftelijke controleverklaring aan de Bank, inhoudende dat de langs elektronische
      weg verstrekte gegevens gelijk zijn aan de gegevens waaromtrent de externe deskundige een verklaring omtrent de
      getrouwheid als bedoeld in [artikel 35, derde lid][ref1], heeft afgegeven en ten bewijze waarvan de staten door hem
      zijn gewaarmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel35
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '35'
        paragraaf: '11'
  - number: '37.3'
    text: |-
      De actuaris zendt een schriftelijke controleverklaring aan de Bank, inhoudende dat de langs
      elektronische weg verstrekte gegevens gelijk zijn aan de door hem gewaarmerkte actuariële staten,
      waaronder een actuarieel verslag voorzien van een verklaring van de actuaris als bedoeld in
      [artikel 35, eerste lid, onderdeel h en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel35
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '35'
        paragraaf: '11'
  - number: '37.4'
    text: |-
      Het bestuur van het pensioenfonds zendt een schriftelijke controleverklaring aan de Bank,
      inhoudende dat de langs elektronische weg verstrekte gegevens gelijk zijn aan de staten, bedoeld in
      [artikel 16f, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel16f
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 16f
  - number: '37.5'
    text: |-
      De Bank kan regels stellen met betrekking tot de inhoud van de schriftelijke controleverklaring, bedoeld in het
      tweede, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
  - number: '37.6'
    text: |-
      De Bank kan, in afwijking van het eerste lid, op verzoek besluiten dat de verstrekking niet langs elektronische weg
      behoeft te geschieden, mits de verstrekking van de gevraagde gegevens wat betreft indeling en inhoud niet afwijkt
      van hetgeen langs elektronische weg zou worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel37
  - number: '38.1'
    text: |-
      Het boetebedrag voor overtreding van een voorschrift op grond van de [artikelen 1a][ref1], [7e][ref2],
      [16a, eerste tot en met vierde lid][ref3], [16b, eerste tot en met derde lid][ref4], [16c][ref5],
      [16f, eerste en tweede lid][ref6], [21a, eerste lid][ref7] en [26b, eerste lid, van de wet][ref8] en op grond van
      de [artikelen 26][ref9], [33][ref10] en [37][ref11] bedraagt 50.000 USD.


