        artikel: 19a
  - number: '39.1'
    text: De Bank houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de overtreder.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel39
  - number: '39.2'
    text: De Bank kan op basis van het eerste lid de op te leggen bestuurlijke boete verlagen met maximaal 100 procent.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel39
  - number: '40.1'
    text: |-
      De Bank houdt bij het vaststellen van een bestuurlijke boete voor pensioenuitvoerders rekening met schade voor
      derden.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel40
  - number: '40.2'
    text: |-
      De Bank kan de op te leggen bestuurlijke boete, na inachtneming van de bepalingen, bedoeld in de
      [artikelen 38][ref1] en [39][ref2] verlagen met maximaal 75 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0028316#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028316#Artikel39
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028316
        artikel: '38'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0028316
        artikel: '39'
        paragraaf: '12'
  - number: '47'
    text: 'Een uitvoerder besteedt niet uit:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel47
  - number: 47.a
    text: |-
      taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van
      beleid en het afleggen van verantwoording over het gevoerde beleid;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel47
  - number: 47.b
    text: |-
      werkzaamheden waarvan uitbesteding de verantwoordelijkheid van de uitvoerder voor de organisatie en beheersing van
      bedrijfsprocessen en het toezicht daarop kan ondermijnen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel47
  - number: 47.c
    text: |-
      indien de uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het bij of
      krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel47
  - number: '48.1'
    text: Een pensioenfonds legt de overeenkomst met de derde waaraan de werkzaamheden worden uitbesteed schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: '48.2'
    text: 'In de overeenkomst wordt in ieder geval het volgende geregeld:'
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.a
    text: |-
      welke werkzaamheden worden uitbesteed onder verwijzing, indien mogelijk, naar de administratieve
      organisatiebeschrijving van het pensioenfonds, alsmede de voorwaarden waaronder de uitbesteding plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.b
    text: de informatie-uitwisseling tussen het pensioenfonds en de derde;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.c
    text: |-
      de verplichting voor de derde om informatie waar de Bank ter uitvoering van zijn wettelijke taak om vraagt
      rechtstreeks aan de Bank ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.d
    text: |-
      de mogelijkheid voor het pensioenfonds om te allen tijde wijzigingen aan te brengen in de wijze waarop de
      uitvoering van de werkzaamheden door de derde geschiedt;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.e
    text: |-
      de verplichting voor de derde om het pensioenfonds in staat te stellen blijvend te voldoen aan het bij of krachtens
      de wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.f
    text: de mogelijkheid voor de Bank om onderzoek ter plaatse te doen of te laten doen bij de derde; en
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: 48.2.g
    text: |-
      de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat het pensioenfonds
      de werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere derde kan laten
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel48
  - number: '49.1'
    text: |-
      Een pensioenfonds draagt zorg voor een systematische analyse van de risico’s die samenhangen met de uitbesteding
      van werkzaamheden en legt deze vast. Het pensioenfonds maakt de analyse op het niveau van zijn eigen organisatie in
      zijn geheel en op het niveau van de onderscheiden bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel49
  - number: '49.2'
    text: |-
      Een pensioenfonds voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking tot de
      uitbesteding van werkzaamheden, als onderdeel van een beheerste en integere bedrijfsvoering als bedoeld in
      [artikel 5b van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel5b
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 5b
  - number: '49.3'
    text: |-
      Een pensioenfonds beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om de uitvoering
      van de uitbestede werkzaamheden te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel49
