  - number: '38.3'
    text: |-
      Voor overtreding van [artikel 21a, eerste lid, van de wet][ref1] kan per dag dat men in overtreding is een boete
      worden opgelegd van USD 1.250 met een maximum van USD 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0028712#Artikel21a
    url: https://wetten.overheid.nl/BWBR0028316/2013-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028712
        artikel: 21a
  - number: '38.4'
    text: |-
      Voor overtreding van [artikel 5:20 van de Algemene wet bestuursrecht][ref1] zoals van toepassing verklaard in
      [artikel 19a van de wet][ref2] kan per dag dat men in overtreding is een boete worden opgelegd van USD 1.250 met
      een maximum van USD 25.000.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028712#Artikel19a
