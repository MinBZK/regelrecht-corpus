$id: wet_algemene_bepalingen
regulatory_layer: WET
publication_date: '2011-06-08'
valid_from: '2012-01-01'
bwb_id: BWBR0001833
url: https://wetten.overheid.nl/BWBR0001833/2012-01-01
preamble:
  text: >-
    Wij WILLEM, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg, enz.,
    enz., enz.


    Allen den genen, die deze zullen zien of hooren lezen, salut! doen te weten:


    Alzoo Wij hebben in overweging genomen, dat de algemeene bepalingen, vervat bij de wet van den 14den Juni 1822
    (staatsblad n°. 10), niet bij uitsluiting toepasselijk zijn op het burgerlijk wetboek;


    Dat daarenboven art. 1 over eene stoffe handelt, welke hare plaats zal behooren te vinden in eene afzonderlijke
    wet;


    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal,


    Hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan te bepalen hetgeen volgt:
  url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#ArtikelAanhef
articles:
  - number: '4'
    text: De wet verbindt alleen voor het toekomende en heeft geene terugwerkende kracht.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel4
  - number: '5'
    text: Eene wet kan alleen door eene latere wet, voor het geheel of gedeeltelijk, hare kracht verliezen.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel5
  - number: '8'
    text: >-
      De strafwetten en de verordeningen van policie, zijn verbindende voor allen die zich op het grondgebied van het
      Koningrijk bevinden.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel8
  - number: '9'
    text: >-
      Het burgerlijk regt van het Koningrijk is hetzelfde voor vreemdelingen als voor de Nederlanders, zoo lange de wet
      niet bepaaldelijk het tegendeel vaststelt.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel9
  - number: '11'
    text: >-
      De regter moet volgens de wet regt spreken: hij mag in geen geval de innerlijke waarde of billijkheid der wet
      beoordeelen.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel11
  - number: '12'
    text: >-
      Geen regter mag bij wege van algemeene verordening, dispositie of reglement, uitspraak doen in zaken welke aan
      zijne beslissing onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel12
  - number: '13'
    text: >-
      De regter die weigert regt te spreken, onder voorwendsel van het stilzwijgen, de duisterheid of de onvolledigheid
      der wet, kan uit hoofde van *regtsweigering* vervolgd worden.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel13
  - number: 13a
    text: >-
      De regtsmagt van den regter en de uitvoerbaarheid van regterlijke vonnissen en van authentieke akten worden beperkt
      door de uitzonderingen in het volkenregt erkend.
    url: https://wetten.overheid.nl/BWBR0001833/2012-01-01#Artikel13a
