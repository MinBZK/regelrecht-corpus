        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '28.1'
    text: |-
      Een beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt, nadat zij bekend is
      gemaakt, ter inzage gelegd bij de raad van bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel28
  - number: '28.2'
    text: Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel28
  - number: '30'
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel30
  - number: '31.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 10 tot en met 17][ref1] zijn belast
      de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '31.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel31
  - number: '32'
    text: |-
      Van elk krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzocht energiegerelateerde product,
      wordt aan de belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee de
      verkoopwaarde daarvan ten gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat, in geval aan [artikel 13, derde lid][ref1],
      toepassing is gegeven of in andere bij dat besluit aangewezen categorieën van gevallen de krachtens
      [artikel 31, eerste lid][ref2], aangewezen ambtenaren volgens bij of krachtens dat besluit gestelde regels aan de
      hand van een onderzoek van een deel, dat als steekproef is genomen uit een bij dat besluit omschreven groep van
      energiegerelateerde producten, kunnen vaststellen of die groep voldoet aan de bij dat besluit aangewezen eisen of
      voorschriften, gesteld krachtens de [artikelen 10][ref3] en [13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '31'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '33.2'
    text: 'Tot de regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: 33.2.a
    text: |-
      de mededeling of de openbaarmaking van de uitslag van een onderzoek, dat met toepassing van het krachtens het
      eerste lid bepaalde is verricht;
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: 33.2.b
    text: |-
      het verbod voor degene onder wie alle tot de steekproef behorende energiegerelateerde producten zijn aangetroffen,
      om, nadat de steekproef is genomen, energiegerelateerde producten, behorende tot de krachtens het eerste lid
      omschreven groep, waartoe de steekproef behoort, af te leveren, zolang hem een mededeling als bedoeld in onderdeel
      a niet is gedaan.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: '33.3'
    text: |-
      Indien met toepassing van het krachtens het eerste lid bepaalde wordt vastgesteld dat een groep niet aan de bij
      dat besluit aangewezen eisen of voorschriften, bedoeld in het eerste lid, voldoet, kan bij algemene maatregel van
      bestuur worden bepaald dat:
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: 33.3.a
    text: volgens bij dat besluit gestelde regels aan een betrokkene de gelegenheid wordt geboden om tegenbewijs te leveren;
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: 33.3.b
    text: |-
      de desbetreffende groep of een deel daarvan niet mag worden afgeleverd alvorens ten aanzien daarvan de maatregelen
      zijn genomen, die bij of krachtens dat besluit zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel33
  - number: 33.3.c
    text: |-
      in de bij het besluit aangewezen gevallen er geen sprake is van een strafbaar feit wegens overtreding van het
