  - number: '19.3'
    text: Van een besluit als bedoeld in het tweede wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel19
  - number: '21.1'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan een last onder dwangsom opleggen terzake van overtreding
      van het bij of krachtens de [artikelen 2][ref1], [4][ref2], [5][ref3], [6][ref4], [7, derde lid][ref5], en
      9 bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0029672#Artikel7
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0029672
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0029672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '21.2'
    text: |-
      Indien de raad van bestuur van de mededingingsautoriteit vaststelt dat een overtreding als bedoeld in het eerste
      lid is begaan, doet hij daarvan een rapport opmaken.
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      [Afdeling 5.4.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4.2
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.4.2
  - number: '22'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan in geval van overtreding van het bij of krachtens
      de [artikelen 2][ref1], [4][ref2], [5][ref3], [6][ref4], [7, derde lid][ref5], en 9 bepaalde of van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref6], de overtreder per overtreding een bestuurlijke
      boete opleggen van ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0029672#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0029672/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
