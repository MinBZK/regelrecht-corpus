        paragraaf: '6'
  - number: '19.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 2][ref1], [4][ref2],
      [5][ref3], [6][ref4], [7, derde lid][ref5], en 9 zijn belast de bij besluit van de raad van bestuur van de
      mededingingsautoriteit aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel5
