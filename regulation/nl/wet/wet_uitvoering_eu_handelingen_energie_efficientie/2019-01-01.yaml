      belast de bij besluit van Onze Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 In afwijking van het tweede lid kan bij algemene maatregel van bestuur het toezicht op de naleving van het
      bepaalde bij of krachtens [artikel 10][ref2] worden opgedragen aan de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref3].


