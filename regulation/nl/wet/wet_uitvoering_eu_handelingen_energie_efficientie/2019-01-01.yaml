        artikel: '1'
  - number: '6'
    text: |-
      1 De [artikelen 2, eerste, tweede en zesde lid][ref1], [4 tot en met 5][ref2] zijn van overeenkomstige toepassing
      ten aanzien van elektriciteit, gas en warmte, met dien verstande dat voor dit artikel en de daarop berustende
      bepalingen wordt verstaan onder:

      a. *beheerder van een elektriciteitsnet:* de netbeheerder, bedoeld in
      [artikel 1, onderdeel k, van de Elektriciteitswet 1998][ref3];

      b. *beheerder van een gasnet:* de netbeheerder, bedoeld in [artikel 1, onderdeel e, van de Gaswet][ref4];

      c. *eindafnemer van elektriciteit:* een afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref5];

      d. *eindafnemer van gas:* een afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 43, eerste lid, van de Gaswet][ref6];

      e. *eindafnemer van warmte:* een persoon die warmte afneemt van een warmtenet en een aansluiting heeft die groter
      is dan 100 kW.

      2 [Artikel 2, zevende tot en met tiende lid][ref7], zijn van overeenkomstige toepassing ten aanzien van warmte,
      voor zover die aan een aansluiting wordt geleverd die groter is dan 100 kW, met dien verstande dat in artikel 2,
      zevende lid, in plaats van leveringspunt, warmtewisselaar wordt gelezen.


