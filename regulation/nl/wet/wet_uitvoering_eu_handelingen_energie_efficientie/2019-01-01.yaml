    text: |-
      1 De Autoriteit Consument en Markt kan in geval van overtreding van het bij of krachtens de [artikelen 2][ref1],
      [4][ref2], [5][ref3], [6][ref4] en [7, derde lid][ref5], bepaalde, de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 1% van de omzet van de overtreder.

      2 De bestuurlijke boete die ingevolge het eerste lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref6], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


