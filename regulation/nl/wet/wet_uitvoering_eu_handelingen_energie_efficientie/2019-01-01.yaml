  - number: '16'
    text: |-
      1 Bij algemene maatregel van bestuur kan aan Onze Minister de bevoegdheid worden verleend om vrijstelling en, op
      aanvraag, ontheffing te verlenen van dit hoofdstuk en de daarop berustende bepalingen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels over de vrijstelling en ontheffing worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de aanvraag,
      bedoeld in het eerste lid.

      4 Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend.

      5 Aan een ontheffing als bedoeld in het eerste lid kan voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel16
  - number: '17'
    text: |-
      1 Bij algemene maatregel van bestuur kan een bedrag worden vastgesteld, dat ter zake van een verzoek, gedaan op
      grond van op dit hoofdstuk berustende bepalingen, door de verzoeker dient te worden betaald.

      2 Bij een maatregel als bedoeld in het eerste lid wordt aangewezen degene, aan wie het bedrag, bedoeld in het
      eerste lid, dient te worden voldaan.

      3 Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen regels worden gesteld omtrent het tijdstip en
      de wijze van de betaling van het bedrag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel17
  - number: 17a
    text: |-
      Voor zover energiegerelateerde producten bij of krachtens [titel 9.4 van de Wet milieubeheer][ref1] voorschriften
      zijn vastgesteld, die op dezelfde onderwerpen betrekking hebben als waarvoor bij of krachtens dit hoofdstuk
      voorschriften zijn vastgesteld, blijven laatstgenoemde voorschriften buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel17a
    references:
