      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '33'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat, in geval aan [artikel 13, derde lid][ref1],
      toepassing is gegeven of in andere bij dat besluit aangewezen categorieën van gevallen de krachtens
      [artikel 31, eerste lid][ref2], aangewezen ambtenaren volgens bij of krachtens dat besluit gestelde regels aan de
      hand van een onderzoek van een deel, dat als steekproef is genomen uit een bij dat besluit omschreven groep van
      energiegerelateerde producten, kunnen vaststellen of die groep voldoet aan de bij dat besluit aangewezen eisen of
      voorschriften, gesteld krachtens de [artikelen 10][ref3] en [13][ref4].

      2 Tot de regels, bedoeld in het eerste lid, kunnen betrekking hebben op:

      a. de mededeling of de openbaarmaking van de uitslag van een onderzoek, dat met toepassing van het krachtens het
      eerste lid bepaalde is verricht;

      b. het verbod voor degene onder wie alle tot de steekproef behorende energiegerelateerde producten zijn
      aangetroffen, om, nadat de steekproef is genomen, energiegerelateerde producten, behorende tot de krachtens het
      eerste lid omschreven groep, waartoe de steekproef behoort, af te leveren, zolang hem een mededeling als bedoeld in
      onderdeel a niet is gedaan.

      3 Indien met toepassing van het krachtens het eerste lid bepaalde wordt vastgesteld dat een groep niet aan de bij
      dat besluit aangewezen eisen of voorschriften, bedoeld in het eerste lid, voldoet, kan bij algemene maatregel van
      bestuur worden bepaald dat:

      a. volgens bij dat besluit gestelde regels aan een betrokkene de gelegenheid wordt geboden om tegenbewijs te
      leveren;

      b. de desbetreffende groep of een deel daarvan niet mag worden afgeleverd alvorens ten aanzien daarvan de
      maatregelen zijn genomen, die bij of krachtens dat besluit zijn voorgeschreven;

      c. in de bij het besluit aangewezen gevallen er geen sprake is van een strafbaar feit wegens overtreding van het
      krachtens de [artikelen 10][ref5] en [13][ref6] bepaalde;

      d. de desbetreffende groep niet in de handel mag worden gebracht, uit de handel wordt genomen, of niet in gebruik
      genomen mag worden.


