  - number: '12'
    text: |-
      1 Indien met betrekking tot het type, waartoe een energiegerelateerd product behoort, goedkeuring is voorgeschreven
      en verkregen, is de vervaardiger of de importeur van de betrokken energiegerelateerde producten gehouden een
      ingevolge [artikel 11, eerste lid][ref1], aangewezen instelling in de gelegenheid te stellen te controleren of
      energiegerelateerde producten overeenkomstig het goedgekeurde type zijn of worden vervaardigd.

      2 Indien met betrekking tot enige categorie van energiegerelateerde producten goedkeuring van het type is
      voorgeschreven, kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld omtrent:

      a. de wijze waarop de controle, bedoeld in het eerste lid, wordt uitgeoefend;

      b. de normen volgens welke de controle plaatsvindt;

      c. de vergoeding van de voor de controle gemaakte kosten van de ingevolge artikel 11, eerste lid, aangewezen
      instelling.

      3 De ingevolge [artikel 11, eerste lid][ref2], aangewezen instelling wijst de personen aan, die met de controle
      zullen zijn belast.

      4 De vervaardiger of de importeur van de energiegerelateerde producten is gehouden aan de ingevolge het derde lid
      aangewezen personen, indien deze zich behoorlijk als zodanig hebben bekendgemaakt, alle medewerking te verlenen en
      alle inlichtingen met betrekking tot die energiegerelateerde producten te verstrekken, die zij redelijkerwijs bij
      de vervulling van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel11
