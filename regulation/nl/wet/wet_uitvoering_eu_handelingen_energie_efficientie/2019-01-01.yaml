  - number: '40'
    text: |-
      Na de inwerkingtreding van deze wet berust:

      a. het [Besluit energie-efficiëntienormen koel- en vriesapparatuur][ref1] op de [artikelen 10][ref2], [13][ref3]
      en [18][ref4] van deze wet;

      b. het [Besluit energierendementseisen voorschakelapparaten voor fluorescentielampen][ref5] op de
      [artikelen 10][ref6], [13][ref7] en [18][ref8] van deze wet;

      c. het [Besluit Energy Star-etiketteringsprogramma][ref9] op de [artikelen 13][ref10] en [18][ref11] van deze wet;

      d. het [Besluit etikettering energiegebruik personenauto’s][ref12] op [artikel 13][ref13] van deze wet;

      e. het [Besluit gastoestellen][ref14] op de [artikelen 10][ref15], [11][ref16], [12][ref17], [13][ref18],
      [14][ref19], [15][ref20] en [18][ref21] van deze wet;

      f. het [Besluit rendementseisen cv-ketels][ref22] op de [artikelen 10][ref23], [13][ref24] en [18][ref25] van deze
      wet;

      g. het [Kaderbesluit etikettering energiegebruik huishoudelijke apparatuur][ref26] op de [artikelen 13][ref27] en
      [18][ref28] van deze wet.


