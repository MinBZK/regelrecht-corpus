  - number: '13'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van een doelmatig gebruik van energie,
      regels worden gesteld ten aanzien van:

      a. gegevens en aanwijzingen met betrekking tot het energieverbruik van energiegerelateerde producten;

      b. gegevens over andere eigenschappen van energiegerelateerde producten die samenhangen met de gegevens, bedoeld in
      onderdeel a;

      c. bepaalde identificatiegegevens van energiegerelateerde producten.

      2 Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende:

      a. de verplichting om met betrekking tot energiegerelateerde producten, behorende tot een bij of krachtens het
      besluit aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid beschikbaar te hebben of te
      verstrekken, die voldoen aan bij of krachtens het besluit gestelde eisen;

      b. het verbod om met betrekking tot energiegerelateerde producten, behorende tot een bij of krachtens het
      besluit aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid beschikbaar te hebben of te
      verstrekken, indien die gegevens of aanwijzingen niet voldoen aan bij of krachtens het besluit gestelde eisen;

      c. de verplichting om in de gevallen, bedoeld in de onderdelen a of b, gegevens of aanwijzingen als bedoeld in het
      eerste lid, beschikbaar te hebben of te verstrekken op een bij of krachtens het besluit aangegeven wijze;

      d. de verplichting aan de hand van bij of krachtens het besluit gestelde regels onderzoek te verrichten ter
      vaststelling of ter toetsing van gegevens als bedoeld in het eerste lid omtrent energiegerelateerde producten,
      behorende tot een bij of krachtens het besluit aangewezen categorie;

      e. de verplichting op een bij of krachtens het besluit aangegeven wijze een administratie te voeren van het
      onderzoek, bedoeld in onderdeel d, en van de daarbij verkregen resultaten, alsmede de verplichting om de
      bescheiden, behorende tot die administratie, gedurende een bepaalde termijn te bewaren;

      f. het verbod in de onderdelen a of b bedoelde gevallen gegevens als bedoeld in het eerste lid beschikbaar te
      hebben of te verstrekken, welke niet overeenstemmen met de resultaten van een onderzoek als bedoeld in onderdeel
      d dan wel niet overeenstemmen met de resultaten van een keuring, verricht aan de hand van de bij of krachtens het
      besluit daartoe vastgestelde voorschriften;

      g. de verplichting om in de bij of krachtens het besluit aangegeven gevallen op een bij of krachtens het besluit
      aangegeven wijze het bij of krachtens het besluit aangegeven kenmerk te vermelden of gegevens te verstrekken
      ter identificatie van de partij of serie, waartoe energiegerelateerde producten behoren, of van het type van
      energiegerelateerde producten, dan wel de bij of krachtens het besluit aangewezen gegevens ter identificatie van de
      vervaardiger, de importeur of een ander van wie de energiegerelateerde producten afkomstig zijn.

      3 De eisen, bedoeld in het tweede lid, onderdelen a of b, kunnen worden gesteld met betrekking tot een bij of
      krachtens het besluit aangegeven groep van energiegerelateerde producten. Daarbij kunnen regels worden gesteld
      volgens welke bij een onderzoek als bedoeld in het tweede lid, onderdeel d, aan de hand van onderzoek met
      betrekking tot een uit die groep genomen steekproef kan worden getoetst of aan de eisen is voldaan.

      4 Met betrekking tot keuringen als bedoeld in het tweede lid, onderdeel f, is [artikel 12][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel12
