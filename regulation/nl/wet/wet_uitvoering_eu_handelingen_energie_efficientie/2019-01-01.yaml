  - number: '32'
    text: |-
      Van elk krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzocht energiegerelateerde product,
      wordt aan de belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee de
      verkoopwaarde daarvan ten gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel32
