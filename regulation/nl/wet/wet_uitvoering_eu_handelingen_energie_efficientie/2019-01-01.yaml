  - number: '10'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van het doelmatig gebruik van energie,
      regels worden gesteld met betrekking tot energiegerelateerde producten.

      2 Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende een verbod categorieën van
      energiegerelateerde producten in of uit te voeren, ten verkoop voorhanden te hebben, ten verkoop aan te bieden, ten
      toon te stellen, te verkopen, te verhuren, af te leveren of te installeren, dan wel te gebruiken:

      a. indien het energiegerelateerde product niet voldoet aan de bij of krachtens het besluit gestelde eisen;

      b. indien het energiegerelateerde product dan wel het type, waartoe het energiegerelateerde product behoort, niet
      bij een keuring is goedgekeurd.

      3 Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende het verbod categorieën van
      energiegerelateerde producten te installeren of te gebruiken op een bepaalde plaats of wijze of onder bepaalde
      omstandigheden.

      4 De regels, bedoeld in het eerste lid, zijn niet van toepassing op het gebruik van energiegerelateerde producten
      in woningen of op erven in de sfeer van de particuliere huishouding of een daarmee bij algemene maatregel van
      bestuur gelijk te stellen huishouding.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel10
  - number: '11'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 10, tweede lid, onderdeel b][ref1], wijst Onze Minister een of meer
      instellingen aan, die de in die bepaling bedoelde keuringen verrichten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van een keuring als bedoeld in
      [artikel 10, tweede lid, onderdeel b][ref2], regels worden gesteld omtrent:

      a. de aanvraag;

      b. de wijze waarop de keuring plaatsheeft;

      c. de voorwaarden waaronder een goedkeuring kan worden verkregen;

      d. de termijn, voor welke een goedkeuring van kracht is.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. het gebruik van aanduidingen inzake de goedkeuring;

      b. de gevallen waarin een goedkeuring kan worden geschorst of ingetrokken;

      c. de wijze waarop een goedkeuring kan worden geschorst of ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel10
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel11
