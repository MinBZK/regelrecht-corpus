  - number: '7'
    text: |-
      1 In het kader van het beleid op het gebied van energiebesparing verzamelt, analyseert en bewerkt Onze Minister
      inlichtingen en gegevens met betrekking tot:

      a. energieverbruik;

      b. maatregelen ter verbetering van de energie-efficiëntie;

      c. overige maatregelen ter verbetering van energiebesparing.

      2 Onze Minister gebruikt gegevens of inlichtingen, welke hij heeft verkregen in verband met enige werkzaamheid ten
      behoeve van de uitvoering van de taak, bedoeld in het eerste lid, uitsluitend voor de uitvoering van die taak.

      3 Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld omtrent:

      a. degenen van wie Onze Minister kan verlangen dat zij hem gegevens en inlichtingen verstrekken;

      b. de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt;

      c. de termijn waarbinnen de gegevens en inlichtingen aan Onze Minister worden verstrekt;

      d. de wijze waarop de gegevens en inlichtingen aan Onze Minister worden verstrekt;

      e. de vorm waarin de gegevens en inlichtingen aan Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister kan een ander opdragen werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 7, eerste lid][ref1]. In dat geval zijn artikel 7, tweede en derde lid, van overeenkomstige toepassing.

      2 Indien de taak, bedoeld in [artikel 7, eerste lid][ref2], aan een ander is opgedragen en deze bij de uitvoering
      van deze taak de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs
      moet vermoeden, is hij verplicht tot geheimhouding van de gegevens, behoudens voor zover enig wettelijk voorschrift
      hem tot mededeling verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel7
