preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in het belang van energiebesparing, regels te
    stellen ter uitvoering van richtlijn 2006/32/EG van het Europees Parlement en de Raad van de Europese Unie van
    5 april 2006 (PbEG L 114) betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende
    intrekking van richtlijn 93/76/EEG van de Raad en deze regels samen te voegen met de Wet energiebesparing
    toestellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;

      b. *energie:* alle vormen van energieproducten, brandstoffen, warmte, hernieuwbare energie, elektriciteit of elke
      andere vorm van energie;

      c. *koudenet:* geheel van tot elkaar behorende, met elkaar verbonden leidingen, bijbehorende installaties en
      overige hulpmiddelen dienstbaar aan het transport van koude, behoudens voor zover deze leidingen, installaties
      en hulpmiddelen zijn gelegen in een gebouw of werk van een verbruiker of van een beheerder van een koudenet en
      strekken tot toe- of afvoer van koude ten behoeve van dat gebouw of werk;

      d. *warmte:* warm water bestemd voor ruimteverwarming en warm tapwater bestemd voor huishoudelijke doeleinden;

      e. *koude:* koud water bestemd voor ruimtekoeling;

      f. *eindafnemer:* een natuurlijke persoon of rechtspersoon die energie koopt voor eigen eindgebruik;

      g. *energiegerelateerd product:* een in de Europese Unie in de handel gebrachte of in gebruik genomen zaak die
      tijdens het gebruik een effect heeft op het energieverbruik, met inbegrip van onderdelen die bedoeld zijn om in
      onder deze wet vallende energiegerelateerde producten te worden ingebouwd en die ten behoeve van eindgebruikers
      in de handel worden gebracht of in gebruik worden genomen als losse onderdelen waarvan de milieuprestaties
      onafhankelijk kunnen worden beoordeeld;

      h. *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '2'
    text: |-
      1 Een beheerder van een koudenet heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn aan
      eindafnemers een individuele meetinrichting ter beschikking wordt gesteld die het actuele energieverbruik van koude
      kan weergeven en die informatie kan geven over de tijd waarin sprake was van daadwerkelijk verbruik, wanneer:

      a. een eindafnemer hierom vraagt, tenzij het ter beschikking stellen technisch onmogelijk is of financieel niet
      redelijk is;

      b. een bestaande meter wordt vervangen, tenzij het ter beschikking stellen technisch onmogelijk is of niet
      kostenefficiënt is in verhouding tot de geraamde potentiële besparingen op lange termijn;

      c. een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;

      d. een gebouw ingrijpend wordt gerenoveerd.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de eisen waaraan een meetinrichting als bedoeld in het eerste lid ten minste voldoet;

      b. de tarieven voor de koop of het gebruik van een meetinrichting als bedoeld in het eerste lid.

      3 Een beheerder van een koudenet voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling
      van klachten van eindafnemers over de betrouwbaarheid van de meetinrichting.

      4 Indien een meetrichting die op afstand uitleesbaar is door een beheerder van een koudenet aan een eindafnemer ter
      beschikking wordt gesteld, kan die eindafnemer deze meter weigeren. In dat geval wordt door een beheerder van een
      koudenet een niet op afstand uitleesbare meter ter beschikking gesteld.

      5 Een beheerder van een koudenet leest meetgegevens van een eindafnemer, die beschikt over een meetinrichting die
      op afstand uitleesbaar is, niet op afstand uit indien de eindafnemer hierom verzoekt.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de eisen waaraan een
      meetinrichting ten minste voldoet, waarbij ten aanzien van meetinrichtingen die op afstand uitleesbaar zijn in
      ieder geval regels worden gesteld ten aanzien van de beveiliging van meetgegevens.

      7 Een beheerder van een koudenet installeert een meter bij het leveringspunt.

      8 Waar dat technisch haalbaar of kostenefficiënt is installeert een beheerder van een koudenet tevens een
      individuele meter om het koudeverbruik te meten in iedere eenheid in een appartementengebouw of iedere eenheid in
      een multifunctioneel gebouw die koude ontvangt uit een koudenet.

      9 Als de installatie van een individuele meter niet technisch haalbaar of niet kostenefficiënt is, installeert een
      beheerder van een koudenet waar dat kostenefficiënt is individuele kostenverdelers.

      10 Als de installatie van individuele kostenverdelers niet technisch haalbaar of niet kostenefficiënt is, hanteert
      een beheerder van een koudenet een andere kostenefficiënte methode voor de meting van het koudeverbruik.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel2
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de inrichting van een energiekostenraming, een verbruiks- en indicatief kostenoverzicht en een factuur inzake
      het verbruik van koude,

      b. de frequentie van een verbruiks- en indicatief kostenoverzicht inzake het verbruik van koude,

      c. het verstrekken van gegevens over het verbruik van koude,

      d. degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken,

      e. het op verzoek van een afnemer toesturen van facturen, factureringsinformatie en energiekostenramingen,
      eventueel langs elektronische weg,

      f. de kosten van toegang tot meetgegevens en van facturatie en

      g. degenen die om de informatie, bedoeld in onderdeel e, kunnen verzoeken,

      welke regels kunnen verschillen per categorie van ontvangers van de informatie, bedoeld in de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel4
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de informatie die netbeheerders,
      leveranciers van of handelaren in energie met uitzondering van elektriciteit en gas als bedoeld in
      [artikel 1, onderdeel b, van de Gaswet][ref1], verstrekken in of bij contracten, facturen of ontvangstbewijzen over
      energie, welke regels per energiesoort en per categorie eindafnemers kunnen verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0029672/2019-01-01#Artikel5
    references:
