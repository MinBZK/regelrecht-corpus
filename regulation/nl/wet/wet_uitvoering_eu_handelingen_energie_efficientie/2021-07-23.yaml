$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_uitvoering_eu_handelingen_energie_efficientie
regulatory_layer: WET
publication_date: '2026-01-22'
valid_from: '2021-07-23'
bwb_id: BWBR0029672
url: https://wetten.overheid.nl/BWBR0029672/2021-07-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in het belang van energiebesparing, regels te
    stellen ter uitvoering van richtlijn 2006/32/EG van het Europees Parlement en de Raad van de Europese Unie van
    5 april 2006 (PbEG L 114) betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende
    intrekking van richtlijn 93/76/EEG van de Raad en deze regels samen te voegen met de Wet energiebesparing
    toestellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Economische Zaken en Klimaat;'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.b
    text: |-
      *energie:* alle vormen van energieproducten, brandstoffen, warmte, hernieuwbare energie, elektriciteit of elke
      andere vorm van energie;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.c
    text: |-
      *koudenet:* geheel van tot elkaar behorende, met elkaar verbonden leidingen, bijbehorende installaties en
      overige hulpmiddelen dienstbaar aan het transport van koude, behoudens voor zover deze leidingen, installaties
      en hulpmiddelen zijn gelegen in een gebouw of werk van een verbruiker of van een beheerder van een koudenet en
      strekken tot toe- of afvoer van koude ten behoeve van dat gebouw of werk;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.d
    text: |-
      *warmte:* thermische energie die ten behoeve van ruimteverwarming of verwarming van tapwater wordt geleverd door
      middel van transport van water;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.e
    text: '*koude:* koud water bestemd voor ruimtekoeling;'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.f
    text: '*eindafnemer:* een natuurlijke persoon of rechtspersoon die energie koopt voor eigen eindgebruik;'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.g
    text: |-
      *energiegerelateerd product:* energiegerelateerd product als bedoeld in artikel 2, onder 1, van Verordening (EU)
      2017/1369;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.h
    text: |-
      *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: 1.i
    text: |-
      *Verordening (EU) 2017/1369:* Verordening (EU) 2017/1369 van het Europees Parlement en de Raad van 4 juli 2017 tot
      vaststelling van een kader voor energie-etikettering en tot intrekking van [Richtlijn 2010/30](32010L0030) (PbEU
      2017, L 189);
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.i
    text: '*energie-audit:* energie-audit als bedoeld in artikel 2 van [richtlijn 2012/27](32012L0027)/EU;'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.j
    text: |-
      *grote onderneming:* onderneming die geen micro, kleine of middelgrote onderneming is als bedoeld in artikel 2 van
      [richtlijn 2012/27](32012L0027)/EU;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: 1.k
    text: |-
      *richtlijn 2012/27/EU:* [richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober
      2012 betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30]
      (32010L0030)/EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PbEU
      2012, L 315).
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel1
  - number: '2.1'
    text: |-
      Een beheerder van een koudenet heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn aan een
      eindafnemer een individuele meetinrichting ter beschikking wordt gesteld die het actuele energieverbruik van koude
      kan weergeven.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: 2.2.a
    text: de eisen waaraan een meetinrichting als bedoeld in het eerste lid ten minste voldoet;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: 2.2.b
    text: de tarieven voor de koop of het gebruik van een meetinrichting als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.3'
    text: |-
      Een beheerder van een koudenet voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling
      van klachten van eindafnemers over de betrouwbaarheid van de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.4'
    text: Indien een meetinrichting wordt geïnstalleerd, is deze op afstand uitleesbaar.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.5'
    text: |-
      Een beheerder van een koudenet leest meetgegevens van een eindafnemer, die beschikt over een meetinrichting die op
      afstand uitleesbaar is, niet op afstand uit indien de eindafnemer hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een op afstand
      uitleesbare meetinrichting ten minste voldoet, waarbij in ieder geval regels worden gesteld ten aanzien van de
      beveiliging van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.7'
    text: Een beheerder van een koudenet installeert een meter bij het leveringspunt.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.8'
    text: |-
      Waar dat technisch haalbaar en kostenefficiënt is installeert een beheerder van een koudenet tevens een individuele
      meter om het koudeverbruik te meten in iedere eenheid in een appartementengebouw of iedere eenheid in een
      multifunctioneel gebouw die koude ontvangt uit een koudenet.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.9'
    text: |-
      De installatie van een individuele meter om het koudeverbruik te meten als bedoeld in het achtste lid is in elk
      geval technisch haalbaar en kostenefficiënt indien:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: 2.9.a
    text: een bestaande meter wordt vervangen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: 2.9.b
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: 2.9.c
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '2.10'
    text: |-
      In een appartementengebouw of in een multifunctioneel gebouw baseert de beheerder van een koudenet de aan de
      verbruiker in rekening te brengen kosten op het verbruik in zijn eenheid en indien van toepassing de kosten voor
      verbruik van gemeenschappelijke ruimten.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel2
  - number: '4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.a
    text: |-
      de inrichting van een energiekostenraming, een verbruiks- en indicatief kostenoverzicht en een factuur inzake het
      verbruik van koude,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.b
    text: de frequentie van een verbruiks- en indicatief kostenoverzicht inzake het verbruik van koude,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.c
    text: het verstrekken van gegevens over het verbruik van koude,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.d
    text: degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.e
    text: |-
      het op verzoek van een afnemer toesturen van facturen, factureringsinformatie en energiekostenramingen, eventueel
      langs elektronische weg,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.f
    text: de kosten van toegang tot meetgegevens en van facturatie en
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: 4.g
    text: degenen die om de informatie, bedoeld in onderdeel e, kunnen verzoeken,
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel4
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de informatie die netbeheerders,
      leveranciers van of handelaren in energie met uitzondering van elektriciteit en gas als bedoeld in
      [artikel 1, onderdeel b, van de Gaswet][ref1], verstrekken in of bij contracten, facturen of ontvangstbewijzen over
      energie, welke regels per energiesoort en per categorie eindafnemers kunnen verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: '6.1'
    text: |-
      De [artikelen 2, tweede en zesde lid][ref1], [4 tot en met 5][ref2] zijn van overeenkomstige toepassing ten aanzien
      van elektriciteit en gas, met dien verstande dat voor dit artikel en de daarop berustende bepalingen wordt verstaan
      onder:


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 6.1.a
    text: |-
      *beheerder van een elektriciteitsnet:* de netbeheerder, bedoeld in
      [artikel 1, onderdeel k, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 6.1.b
    text: |-
      *beheerder van een gasnet:* de netbeheerder, bedoeld in [artikel 1, onderdeel e, van de Gaswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 6.1.c
    text: |-
      *eindafnemer van elektriciteit:* een afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 6.1.d
    text: |-
      *eindafnemer van gas:* een afnemer, niet zijnde een afnemer als bedoeld in
      [artikel 43, eerste lid, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
  - number: '6.2'
    text: |-
      Een beheerder van een elektriciteitsnet en een beheerder van een gasnet hebben tot taak er zorg voor te dragen
      dat binnen een redelijke termijn aan een eindafnemer van elektriciteit en een eindafnemer van gas een individuele
      meetinrichting ter beschikking wordt gesteld die het actuele energieverbruik kan weergeven en die informatie kan
      weergeven over de tijd waarin sprake was van daadwerkelijk verbruik, wanneer:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
  - number: 6.2.a
    text: |-
      een eindafnemer hierom vraagt, tenzij het ter beschikking stellen technisch onmogelijk is of financieel niet
      redelijk is;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
  - number: 6.2.b
    text: |-
      een bestaande meter wordt vervangen, tenzij het ter beschikking stellen technisch onmogelijk is of niet
      kostenefficiënt is in verhouding tot de geraamde potentiële besparingen op lange termijn;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
  - number: 6.2.c
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
  - number: 6.2.d
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6
  - number: 6a.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.1.a
    text: |-
      *eindafnemer van warmte:* een eindafnemer, niet zijnde een verbruiker als bedoeld in artikel 1, eerste lid, van
      de Warmtewet;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.1.b
    text: |-
      *leverancier van warmte:* een leverancier als bedoeld in [artikel 1, eerste lid, van de Warmtewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel1
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '1'
  - number: 6a.2
    text: |-
      Een leverancier van warmte heeft tot taak er zorg voor te dragen dat binnen een redelijke termijn aan een
      eindafnemer een individuele meetinrichting ter beschikking wordt gesteld die het actuele energieverbruik van warmte
      kan weergeven.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.3.a
    text: de eisen waaraan een meetinrichting als bedoeld in het eerste lid ten minste voldoet;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.3.b
    text: de tarieven voor de koop of het gebruik van een meetinrichting als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.4
    text: Indien een meetinrichting wordt geïnstalleerd, is deze op afstand uitleesbaar.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een op afstand
      uitleesbare meetinrichting ten minste voldoet, waarbij in ieder geval regels worden gesteld ten aanzien van de
      beveiliging van meetgegevens.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.6
    text: Een leverancier van warmte installeert een meter bij de afleverset voor warmte.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.7
    text: |-
      Waar dat technisch haalbaar en kostenefficiënt is installeert een leverancier van warmte tevens een individuele
      meter om het warmteverbruik te meten in iedere eenheid in een appartementengebouw of iedere eenheid in een
      multifunctioneel gebouw die warmte ontvangt uit een warmtenet.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.8
    text: |-
      Als de installatie van een individuele meter niet technisch haalbaar of niet kostenefficiënt is, installeert een
      leverancier van warmte waar dat kostenefficiënt is individuele kostenverdelers.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.9
    text: |-
      Als de installatie van individuele kostenverdelers niet kostenefficiënt is, hanteert een leverancier van warmte een
      andere kostenefficiënte methode voor de meting van het warmteverbruik.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.10
    text: |-
      De installatie van een individuele meter om het warmteverbruik te meten als bedoeld in het zevende tot en met
      negende lid is in elk geval technisch haalbaar en kostenefficiënt indien:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.10.a
    text: een bestaande meter wordt vervangen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.10.b
    text: een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.10.c
    text: een gebouw ingrijpend wordt gerenoveerd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.11
    text: |-
      In een appartementengebouw of in een multifunctioneel gebouw baseert de leverancier van warmte de aan de verbruiker
      in rekening te brengen kosten op het verbruik in zijn eenheid en indien van toepassing worden de kosten voor
      verbruik van gemeenschappelijke ruimten verdeeld.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
  - number: 6a.12
    text: |-
      [Artikelen 4][ref1] en [5][ref2] zijn van overeenkomstige toepassing op eindafnemers als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel5
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '7.1'
    text: |-
      In het kader van het beleid op het gebied van energiebesparing verzamelt, analyseert en bewerkt Onze Minister
      inlichtingen en gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.1.a
    text: energieverbruik;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.1.b
    text: maatregelen ter verbetering van de energie-efficiëntie;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.1.c
    text: overige maatregelen ter verbetering van energiebesparing.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister gebruikt gegevens of inlichtingen, welke hij heeft verkregen in verband met enige werkzaamheid ten
      behoeve van de uitvoering van de taak, bedoeld in het eerste lid, uitsluitend voor de uitvoering van die taak.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: '7.3'
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.3.a
    text: degenen van wie Onze Minister kan verlangen dat zij hem gegevens en inlichtingen verstrekken;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.3.b
    text: de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.3.c
    text: de termijn waarbinnen de gegevens en inlichtingen aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.3.d
    text: de wijze waarop de gegevens en inlichtingen aan Onze Minister worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: 7.3.e
    text: de vorm waarin de gegevens en inlichtingen aan Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan een ander opdragen werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 7, eerste lid][ref1]. In dat geval zijn artikel 7, tweede en derde lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel7
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '8.2'
    text: |-
      Indien de taak, bedoeld in [artikel 7, eerste lid][ref1], aan een ander is opgedragen en deze bij de uitvoering van
      deze taak de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet
      vermoeden, is hij verplicht tot geheimhouding van de gegevens, behoudens voor zover enig wettelijk voorschrift hem
      tot mededeling verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel7
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van het doelmatig gebruik van energie, regels
      worden gesteld met betrekking tot energiegerelateerde producten.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: '10.2'
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende een verbod categorieën van
      energiegerelateerde producten in of uit te voeren, ten verkoop voorhanden te hebben, ten verkoop aan te bieden, ten
      toon te stellen, te verkopen, te verhuren, af te leveren of te installeren, dan wel te gebruiken:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: 10.2.a
    text: indien het energiegerelateerde product niet voldoet aan de bij of krachtens het besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: 10.2.b
    text: |-
      indien het energiegerelateerde product dan wel het type, waartoe het energiegerelateerde product behoort, niet bij
      een keuring is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: '10.3'
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende het verbod categorieën van
      energiegerelateerde producten te installeren of te gebruiken op een bepaalde plaats of wijze of onder bepaalde
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: '10.4'
    text: |-
      De regels, bedoeld in het eerste lid, zijn niet van toepassing op het gebruik van energiegerelateerde producten in
      woningen of op erven in de sfeer van de particuliere huishouding of een daarmee bij algemene maatregel van bestuur
      gelijk te stellen huishouding.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel10
  - number: '11.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 10, tweede lid, onderdeel b][ref1], wijst Onze Minister een of meer
      instellingen aan, die de in die bepaling bedoelde keuringen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van een keuring als bedoeld in
      [artikel 10, tweede lid, onderdeel b][ref1], regels worden gesteld omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 11.2.a
    text: de aanvraag;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.2.b
    text: de wijze waarop de keuring plaatsheeft;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.2.c
    text: de voorwaarden waaronder een goedkeuring kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.2.d
    text: de termijn, voor welke een goedkeuring van kracht is.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: '11.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.3.a
    text: het gebruik van aanduidingen inzake de goedkeuring;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.3.b
    text: de gevallen waarin een goedkeuring kan worden geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: 11.3.c
    text: de wijze waarop een goedkeuring kan worden geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel11
  - number: '12.1'
    text: |-
      Indien met betrekking tot het type, waartoe een energiegerelateerd product behoort, goedkeuring is voorgeschreven
      en verkregen, is de vervaardiger of de importeur van de betrokken energiegerelateerde producten gehouden een
      ingevolge [artikel 11, eerste lid][ref1], aangewezen instelling in de gelegenheid te stellen te controleren of
      energiegerelateerde producten overeenkomstig het goedgekeurde type zijn of worden vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel11
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Indien met betrekking tot enige categorie van energiegerelateerde producten goedkeuring van het type is
      voorgeschreven, kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
  - number: 12.2.a
    text: de wijze waarop de controle, bedoeld in het eerste lid, wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
  - number: 12.2.b
    text: de normen volgens welke de controle plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
  - number: 12.2.c
    text: |-
      de vergoeding van de voor de controle gemaakte kosten van de ingevolge artikel 11, eerste lid, aangewezen
      instelling.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
  - number: '12.3'
    text: |-
      De ingevolge [artikel 11, eerste lid][ref1], aangewezen instelling wijst de personen aan, die met de controle
      zullen zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel11
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.4'
    text: |-
      De vervaardiger of de importeur van de energiegerelateerde producten is gehouden aan de ingevolge het derde lid
      aangewezen personen, indien deze zich behoorlijk als zodanig hebben bekendgemaakt, alle medewerking te verlenen en
      alle inlichtingen met betrekking tot die energiegerelateerde producten te verstrekken, die zij redelijkerwijs bij
      de vervulling van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel12
  - number: '13.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van een doelmatig gebruik van energie, regels
      worden gesteld ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.1.a
    text: gegevens en aanwijzingen met betrekking tot het energieverbruik van energiegerelateerde producten;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.1.b
    text: |-
      gegevens over andere eigenschappen van energiegerelateerde producten die samenhangen met de gegevens, bedoeld in
      onderdeel a;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.1.c
    text: bepaalde identificatiegegevens van energiegerelateerde producten.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: '13.2'
    text: 'Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.a
    text: |-
      de verplichting om met betrekking tot energiegerelateerde producten, behorende tot een bij of krachtens het
      besluit aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid beschikbaar te hebben of te
      verstrekken, die voldoen aan bij of krachtens het besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.b
    text: |-
      het verbod om met betrekking tot energiegerelateerde producten, behorende tot een bij of krachtens het besluit
      aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid beschikbaar te hebben of te
      verstrekken, indien die gegevens of aanwijzingen niet voldoen aan bij of krachtens het besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.c
    text: |-
      de verplichting om in de gevallen, bedoeld in de onderdelen a of b, gegevens of aanwijzingen als bedoeld in het
      eerste lid, beschikbaar te hebben of te verstrekken op een bij of krachtens het besluit aangegeven wijze;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.d
    text: |-
      de verplichting aan de hand van bij of krachtens het besluit gestelde regels onderzoek te verrichten ter
      vaststelling of ter toetsing van gegevens als bedoeld in het eerste lid omtrent energiegerelateerde producten,
      behorende tot een bij of krachtens het besluit aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.e
    text: |-
      de verplichting op een bij of krachtens het besluit aangegeven wijze een administratie te voeren van het onderzoek,
      bedoeld in onderdeel d, en van de daarbij verkregen resultaten, alsmede de verplichting om de bescheiden, behorende
      tot die administratie, gedurende een bepaalde termijn te bewaren;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.f
    text: |-
      het verbod in de onderdelen a of b bedoelde gevallen gegevens als bedoeld in het eerste lid beschikbaar te hebben
      of te verstrekken, welke niet overeenstemmen met de resultaten van een onderzoek als bedoeld in onderdeel d dan
      wel niet overeenstemmen met de resultaten van een keuring, verricht aan de hand van de bij of krachtens het besluit
      daartoe vastgestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: 13.2.g
    text: |-
      de verplichting om in de bij of krachtens het besluit aangegeven gevallen op een bij of krachtens het besluit
      aangegeven wijze het bij of krachtens het besluit aangegeven kenmerk te vermelden of gegevens te verstrekken
      ter identificatie van de partij of serie, waartoe energiegerelateerde producten behoren, of van het type van
      energiegerelateerde producten, dan wel de bij of krachtens het besluit aangewezen gegevens ter identificatie van de
      vervaardiger, de importeur of een ander van wie de energiegerelateerde producten afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: '13.3'
    text: |-
      De eisen, bedoeld in het tweede lid, onderdelen a of b, kunnen worden gesteld met betrekking tot een bij of
      krachtens het besluit aangegeven groep van energiegerelateerde producten. Daarbij kunnen regels worden gesteld
      volgens welke bij een onderzoek als bedoeld in het tweede lid, onderdeel d, aan de hand van onderzoek met
      betrekking tot een uit die groep genomen steekproef kan worden getoetst of aan de eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
  - number: '13.4'
    text: |-
      Met betrekking tot keuringen als bedoeld in het tweede lid, onderdeel f, is [artikel 12][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel12
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      De regels, bedoeld in de [artikelen 10, eerste lid][ref1], en [13, eerste lid][ref2], zijn niet van toepassing op
      energiegerelateerde producten in woningen of op erven in de sfeer van de particuliere huishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de gelijkstelling met een
      huishouding als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel14
  - number: '15'
    text: |-
      Indien regels als bedoeld in de [artikelen 10][ref1] en [13][ref2] worden gesteld, wordt daarbij tevens een termijn
      bepaald, waarna die regels van toepassing zijn ten aanzien van energiegerelateerde producten, die bij het in
      werking treden van de regels reeds vervaardigd en in Nederland aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      Bij algemene maatregel van bestuur kan aan Onze Minister de bevoegdheid worden verleend om vrijstelling en, op
      aanvraag, ontheffing te verlenen van dit hoofdstuk en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel16
  - number: '16.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels over de vrijstelling en ontheffing worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de aanvraag,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel16
  - number: '16.4'
    text: Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel16
  - number: '16.5'
    text: Aan een ontheffing als bedoeld in het eerste lid kan voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel16
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur kan een bedrag worden vastgesteld, dat ter zake van een verzoek, gedaan op grond
      van op dit hoofdstuk berustende bepalingen, door de verzoeker dient te worden betaald.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel17
  - number: '17.2'
    text: |-
      Bij een maatregel als bedoeld in het eerste lid wordt aangewezen degene, aan wie het bedrag, bedoeld in het eerste
      lid, dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel17
  - number: '17.3'
    text: |-
      Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen regels worden gesteld omtrent het tijdstip en
      de wijze van de betaling van het bedrag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel17
  - number: 17a
    text: |-
      Voor zover energiegerelateerde producten bij of krachtens [titel 9.4 van de Wet milieubeheer][ref1] voorschriften
      zijn vastgesteld, die op dezelfde onderwerpen betrekking hebben als waarvoor bij of krachtens dit hoofdstuk
      voorschriften zijn vastgesteld, blijven laatstgenoemde voorschriften buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '18.1'
    text: |-
      Grote ondernemingen ondergaan tenminste eens per vier jaar een energie-audit en sturen daarvan een verslag aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: '18.2'
    text: |-
      In afwijking van het eerste lid, stuurt een onderneming, uiterlijk op 31 december 2020 het verslag van een energie-
      audit aan Onze Minister indien de onderneming niet voor 31 december 2016 het verslag van een energie-audit aan het
      bevoegd gezag heeft toegestuurd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: '18.3'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: 18.3.a
    text: de wijze waarop de energie-audit wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: 18.3.b
    text: eisen aan het verslag van de energie-audit;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: 18.3.c
    text: de wijze waarop het verslag van de energie-audit aan Onze Minister wordt verstuurd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: '18.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van energie-
      of milieubeheersystemen of keurmerken waarmee invulling kan worden gegeven aan de auditverplichting.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: '18.5'
    text: |-
      Onze Minister stelt de verslagen van de energie-audits die voldoen aan de eisen, gesteld krachtens het derde lid,
      ter beschikking aan bij algemene maatregel van bestuur aangewezen bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18
  - number: 18a.1
    text: |-
      Voor het verslag van een energie-audit dat is toegestuurd aan het bevoegd gezag, als bedoeld in
      [artikel 1 van de Wet algemene bepalingen omgevingsrecht][ref1], gelden de eisen zoals deze golden op het moment
      van toesturen van het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 18a.2
    text: |-
      Een verslag van een energie-audit dat voor 1 juli 2019 is toegestuurd aan het bevoegd gezag, als bedoeld in
      [artikel 1 van de Wet algemene bepalingen omgevingsrecht][ref1], wordt geacht tevens te zijn toegestuurd aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: '19'
    text: |-
