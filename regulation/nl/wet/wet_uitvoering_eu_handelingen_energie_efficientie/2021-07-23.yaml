  - number: '21'
    text: |-
      De Autoriteit Consument en Markt kan een last onder dwangsom opleggen terzake van overtreding van het bij of
      krachtens de [artikelen 2][ref1], [4][ref2], [5][ref3], [6][ref4], [6a][ref5] en [7, derde lid][ref6], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel5
