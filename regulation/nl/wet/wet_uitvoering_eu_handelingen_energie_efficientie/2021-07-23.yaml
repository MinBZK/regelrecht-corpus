  - number: '22.1'
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bij of krachtens de [artikelen 2][ref1],
      [4][ref2], [5][ref3], [6][ref4], [6a][ref5] en [7, derde lid][ref6], bepaalde, de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 1% van de omzet van de overtreder.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0029672#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0029672#Artikel7
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel22
    references:
      - id: ref1
