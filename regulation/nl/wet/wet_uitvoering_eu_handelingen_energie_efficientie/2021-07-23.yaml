        bwb_id: BWBR0029672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '22.2'
    text: |-
      De bestuurlijke boete die ingevolge het eerste lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '23.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 18][ref1], is belast Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel18
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '18'
        hoofdstuk: 2a
  - number: '23.2'
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter zake van een overtreding van het bij of krachtens
      [artikel 18][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel18
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '18'
        hoofdstuk: 2a
  - number: '31.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 10 tot en met 17][ref1] zijn belast
      de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '31.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel31
  - number: '31.3'
    text: |-
      In afwijking van het tweede lid kan bij algemene maatregel van bestuur het toezicht op de naleving van het
      bepaalde bij of krachtens [artikel 10][ref1] worden opgedragen aan de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '32'
    text: |-
      Van elk krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzocht energiegerelateerde product,
      wordt aan de belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee de
      verkoopwaarde daarvan ten gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat, in geval aan [artikel 13, derde lid][ref1],
      toepassing is gegeven of in andere bij dat besluit aangewezen categorieën van gevallen de krachtens
      [artikel 31, eerste lid][ref2], aangewezen ambtenaren volgens bij of krachtens dat besluit gestelde regels aan de
      hand van een onderzoek van een deel, dat als steekproef is genomen uit een bij dat besluit omschreven groep van
      energiegerelateerde producten, kunnen vaststellen of die groep voldoet aan de bij dat besluit aangewezen eisen of
      voorschriften, gesteld krachtens de [artikelen 10][ref3] en [13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '31'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '33.2'
    text: 'Tot de regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33.2.a
    text: |-
      de mededeling of de openbaarmaking van de uitslag van een onderzoek, dat met toepassing van het krachtens het
      eerste lid bepaalde is verricht;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33.2.b
    text: |-
      het verbod voor degene onder wie alle tot de steekproef behorende energiegerelateerde producten zijn aangetroffen,
      om, nadat de steekproef is genomen, energiegerelateerde producten, behorende tot de krachtens het eerste lid
      omschreven groep, waartoe de steekproef behoort, af te leveren, zolang hem een mededeling als bedoeld in onderdeel
      a niet is gedaan.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: '33.3'
    text: |-
      Indien met toepassing van het krachtens het eerste lid bepaalde wordt vastgesteld dat een groep niet aan de bij
      dat besluit aangewezen eisen of voorschriften, bedoeld in het eerste lid, voldoet, kan bij algemene maatregel van
      bestuur worden bepaald dat:
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33.3.a
    text: volgens bij dat besluit gestelde regels aan een betrokkene de gelegenheid wordt geboden om tegenbewijs te leveren;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33.3.b
    text: |-
      de desbetreffende groep of een deel daarvan niet mag worden afgeleverd alvorens ten aanzien daarvan de maatregelen
      zijn genomen, die bij of krachtens dat besluit zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33.3.c
    text: |-
      in de bij het besluit aangewezen gevallen er geen sprake is van een strafbaar feit wegens overtreding van het
      krachtens de [artikelen 10][ref1] en [13][ref2] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 33.3.d
    text: |-
      de desbetreffende groep niet in de handel mag worden gebracht, uit de handel wordt genomen, of niet in gebruik
      genomen mag worden.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33
  - number: 33a
    text: |-
      Tenzij bij wettelijk voorschrift anders is bepaald is Onze Minister bevoegd de besluiten te nemen waartoe een
      voorschrift van Verordening (EU) 2017/1369 een markttoezichtautoriteit opdracht geeft of de keuze laat.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33a
  - number: 33b
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van productspecifieke gedelegeerde
      handelingen, vastgesteld op grond van artikel 16 van Verordening (EU) 2017/1369.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33b
  - number: 33c
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van het bepaalde
      bij of krachtens de [artikelen 10, eerste tot en met derde lid][ref1], [11, tweede en derde lid][ref2],
      [12, eerste, tweede en vierde lid][ref3] , [13][ref4], [16, eerste, tweede, vierde en vijfde lid][ref5], en
      [33, tweede en derde lid][ref6], van deze wet alsmede de artikelen 3, eerste tot en met vijfde lid, 4, eerste,
      tweede, vierde en zesde lid, 5, eerste tot en met derde lid, 6, onderdelen a tot en met e, 9, tweede lid, en 11,
      dertiende lid, van Verordening (EU) 2017/1369.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0029672#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0029672#Artikel33
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0029672
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0029672
        artikel: '33'
        hoofdstuk: '4'
  - number: 33d.1
    text: |-
      Onze Minister is bevoegd een overtreder van het bepaalde bij of krachtens de
      [artikelen 10, eerste tot en met derde lid][ref1], [13][ref2] en [33, tweede en derde lid][ref3], van deze wet
      alsmede de artikelen 3, eerste tot en met vijfde lid, 4, eerste, tweede, vierde en zesde lid, 5, eerste lid, 6,
      onderdelen a, c tot en met e, artikel 9, eerste lid, laatste volzin, en vierde lid, en 11, dertiende lid, van
      Verordening (EU) 2017/1369 een bestuurlijke boete op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel33
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '33'
        hoofdstuk: '4'
  - number: 33d.2
    text: |-
      Bij algemene maatregel van bestuur wordt de hoogte van de bestuurlijke boete bepaald op de wijze als voorzien
      in het derde lid, met dien verstande dat de wegens een afzonderlijke overtreding te betalen geldsom ten hoogste
      het bedrag van de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1],
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 33d.3
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt voor elke daarin omschreven overtreding het
      bedrag van de daarvoor op te leggen boete bepaald waarbij afhankelijk van de aard van de overtreding en de gevolgen
      voor de eindgebruiker en de markt, wordt onderscheiden in een lage en een hoge categorie te betalen bestuurlijke
      boete. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de
      boetehoogte wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33d
  - number: 33d.4
    text: |-
      De overtreding hoeft niet aan de officier van justitie te worden voorgelegd, indien het bedrag van de daarvoor
      overeenkomstig de algemene maatregel van bestuur, bedoeld in het tweede lid, op te leggen boete is bepaald in de
      lage categorie te betalen bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33d
  - number: 33e.1
    text: |-
      Ter uitvoering van artikel 8, vijfde lid, van Verordening (EU) 2017/1369 kunnen bij ministeriële regeling de
      bedragen ter vergoeding van de kosten worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33e
  - number: 33e.2
    text: |-
      Bij de in het eerste lid bedoelde regeling wordt de hoogte van de door te berekenen kosten vastgesteld op basis van
      de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel33e
  - number: 34a
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel34a
  - number: 39a
    text: |-
      Op een bij koninklijk besluit te bepalen tijdstip komen [artikelen 2, vierde lid][ref1], en [6a, vierde lid][ref2],
      te luiden: Meetinrichtingen zijn op afstand uitleesbaar, tenzij dit niet kostenefficiënt is.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: 6a
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '40'
    text: 'Na de inwerkingtreding van deze wet berust:'
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel40
  - number: 40.a
    text: |-
      het [Besluit energie-efficiëntienormen koel- en vriesapparatuur][ref1] op de [artikelen 10][ref2], [13][ref3] en
      [18][ref4] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0008756
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0029672#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0029672#Artikel18
    url: https://wetten.overheid.nl/BWBR0029672/2021-07-23#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008756
      - id: ref2
        bwb_id: BWBR0029672
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029672
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0029672
        artikel: '18'
        hoofdstuk: 2a
