preamble:
  text: |-
    Gelet op artikel 53 van het Organisatie-, mandaat- en volmachtbesluit SZW 2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015030/2004-11-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De algemeen directeur van Senter is verantwoordelijk voor de uitvoering van de SZW-Subsidieregeling preventie van
      arbeidsuitval 2003 en het behandelen van bezwaar- en beroepszaken die voortvloeien uit deze subsidieregeling.
    url: https://wetten.overheid.nl/BWBR0015030/2004-11-23#Artikel1
  - number: '2'
    text: |-
      De algemeen directeur van Senter is bevoegd om namens de Minister van Sociale Zaken en Werkgelegenheid besluiten
      te nemen en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke rechtshandeling zijn, voor
      zover zij verband houden met de taken en verantwoordelijkheden, bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015030#Artikel1
    url: https://wetten.overheid.nl/BWBR0015030/2004-11-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015030
        artikel: '1'
  - number: '3'
    text: |-
      1 De algemeen directeur van Senter kan zijn vertegenwoordigingsbevoegdheden in een door hem te bepalen omvang
      doorverlenen aan rechtstreeks onder hem ressorterende functionarissen.

      2 De (door)verlening van (onder-) mandaat en machtiging kan uitsluitend bij een schriftelijk besluit geschieden.
    url: https://wetten.overheid.nl/BWBR0015030/2004-11-23#Artikel3
  - number: '4'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 19 maart 2003.

      2 Deze regeling wordt aangehaald als:
      [Mandaatbesluit ter uitvoering van de SZW-Subsidieregeling preventie van arbeidsuitval 2003 door Senter][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015030
    url: https://wetten.overheid.nl/BWBR0015030/2004-11-23#Artikel4
    references:
