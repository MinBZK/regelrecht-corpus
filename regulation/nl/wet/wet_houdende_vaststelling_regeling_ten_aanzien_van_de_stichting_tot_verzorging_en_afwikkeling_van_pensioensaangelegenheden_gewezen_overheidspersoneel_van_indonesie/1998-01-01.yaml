$id: wet_houdende_vaststelling_regeling_ten_aanzien_van_de_stichting_tot_verzorging_en_afwikkeling_van_pensioensaangelegenheden_gewezen_overheidspersoneel_van_indonesie
regulatory_layer: WET
publication_date: '1997-11-18'
valid_from: '1998-01-01'
bwb_id: BWBR0002180
url: https://wetten.overheid.nl/BWBR0002180/1998-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 9 van het Besluit MC II/C II/26 van de Tweede
    Ministersconferentie, nodig is een regeling te treffen, als bedoeld in artikel 89a van de Comptabiliteitswet (Stb.
    1927, No. 259), zoals deze wet sindsdien is gewijzigd, ten aanzien van de "Stichting tot verzorging en afwikkeling
    van pensioensaangelegenheden betreffende gewezen overheidspersoneel van Indonesië en hun nagelaten betrekkingen";

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De overeenkomst, waarvan de inhoud overeenstemt met de in afdruk bij deze wet gevoegde tekst, voor en namens het
      Rijk gesloten door Onze Ministers voor Uniezaken en Overzeese Rijksdelen, van Financiën en van Binnenlandse Zaken
      met de Raad van Beheer der "Stichting tot verzorging en afwikkeling van pensioensaangelegenheden betreffende
      gewezen overheidspersoneel van Indonesië en hun nagelaten betrekkingen", wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onze Ministers van Binnenlandse Zaken en van Financiën worden gemachtigd met de Stichting overeenkomsten tot
      uitvoering van de in het eerste lid bedoelde overeenkomst, alsmede tot wijziging daarvan, aan te gaan.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel1
  - number: '1.3'
    text: |-
      Ministers, Hoofden van Departementen van Algemeen Bestuur, kunnen in samenwerking met Onze in het vorige lid
      genoemde Ministers overeenkomsten met de Stichting aangaan.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel1
  - number: '1.4'
    text: |-
      Door de zorg van Onze Minister van Binnenlandse Zaken zullen wijzigingen in de statuten van de Stichting zomede
      nieuwe overeenkomsten en wijzigingen in overeenkomsten onverwijld ter kennis worden gebracht van de Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel1
  - number: '2.1'
    text: |-
      Over het tijdvak 1 December 1950 tot en met 31 December 1951 en jaarlijks over de jaren 1952 tot en met 1955 wordt,
      behoudens instemming van de desbetreffende posten van de Rijksbegroting, ten laste van het Rijk aan de Stichting
      uitgekeerd het bedrag, waarmede over het betrokken tijdvak de lasten van de Stichting de baten overschrijden, voor
      zover mogelijk verminderd met een bedrag van f 1.6 millioen 's jaars.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel2
  - number: '2.2'
    text: |-
      Te rekenen van 1956 af wordt jaarlijks ten laste van het Rijk aan de Stichting subsidie verleend tot het bedrag,
      waarmede over het betrokken dienstjaar de lasten van de Stichting de baten overschrijden, voor zover dit bedrag de
      som van de aflossingen en uitlotingen van het belegd vermogen in dat jaar overtreft.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel2
  - number: '2.3'
    text: |-
      De uitgaven voortvloeiende uit het bepaalde in het eerste en het tweede lid, komen tot en met die over het jaar
      1952 ten laste van Hoofdstuk XIII B en vervolgens ten laste van Hoofdstuk V der Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel2
  - number: '3.1'
    text: |-
      De Raad van Beheer der Stichting dient jaarlijks uiterlijk op 1 November bij Onze in [artikel 1, tweede lid][ref1],
      genoemde Ministers een ontwerp-begroting van baten en lasten voor het daarop volgende jaar in en een ontwerp-
      begroting van te verrichten bij- en afboekingen op de kapitaalrekeningen der Stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002180#Artikel1
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002180
        artikel: '1'
  - number: '3.2'
    text: |-
      Na instemming door Onze in het eerste lid bedoelde Ministers, welke instemming met wijziging gepaard kan gaan en
      uiterlijk op 31 December van het jaar van indiening wordt verleend, stelt de Raad van Beheer de begrotingen vast.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel3
  - number: '3.3'
    text: |-
      Afschrift van de vastgestelde begrotingen zendt de Raad van Beheer toe aan de Staten-Generaal, aan Onze in het
      eerste lid bedoelde Ministers.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het jaarverslag, de balans, de rekening van baten en lasten en de kapitaalrekening, worden na vaststelling door de
      Raad van Beheer aan Onze in [artikel 1, tweede lid][ref1], genoemde Ministers ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002180#Artikel1
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002180
        artikel: '1'
  - number: '4.2'
    text: |-
      Aan de door Onze in het eerste lid bedoelde Ministers aan te wijzen ambtenaren zal, telkens wanneer zulks wordt
      verlangd, inzage in de boekhouding der Stichting en in de daaraan ten grondslag liggende bescheiden worden gegeven,
      zullen alle voor de contrôle nodige inlichtingen desgevraagd worden verstrekt en zal gelegenheid worden gegeven
      voor het opnemen van kasgelden en andere vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel4
  - number: '5'
    text: |-
      Terzake van de overdracht door Indonesië aan Nederland van de bij het besluit MC II/C II/26 van de Tweede
      Conferentie van Ministers van de Nederlands-Indonesische Unie bedoelde vermogens, alsmede terzake van de overdracht
      door Nederland aan de Stichting van kapitalen en gelden zijn generlei rechten of belastingen verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel5
  - number: '6'
    text: |-
      Handelingen vóór de inwerkingtreding van deze wet verricht worden goedgekeurd voor zover zij in overeenstemming
      zijn met het bepaalde in deze wet en de daarbij gevoegde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel6
  - number: '7'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de uitgifte van het *Staatsblad* waarin zij is geplaatst en
      werkt terug tot 1 December 1950.
    url: https://wetten.overheid.nl/BWBR0002180/1998-01-01#Artikel7
