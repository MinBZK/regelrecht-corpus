---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_superheffing_1993
regulatory_layer: WET
publication_date: '2004-03-26'
valid_from: '2002-03-31'
bwb_id: BWBR0005933
url: https://wetten.overheid.nl/BWBR0005933/2002-03-31
preamble:
  text: |-
    Gelet op Verordening (EEG) nr. 3950/92 van de Raad tot instelling van een extra heffing in de sector melk
    en zuivelprodukten (PbEG L 405) en op Verordening (EEG) nr. 536/93 van de Commissie tot vaststelling van de
    uitvoeringsbepalingen voor de extra heffing in de sector melk en zuivelprodukten (PbEG L 57);

    Gelet op de artikelen 13, 19, 23, 27, en 28 van de Landbouwwet;

    Gezien het advies van het Produktschap voor Zuivel en het Landbouwschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel1
  - number: 1.1.a
    text: |-
      In deze regeling wordt verstaan onder: melk, andere zuivelproducten, producent, bedrijf, koper, bedrijf dat
      melk of andere zuivelproducten bewerkt of verwerkt, levering, rechtstreeks aan de consument verkochte melk of
      melkequivalent, op de markt gebrachte hoeveelheden melk of melkequivalent, hetgeen daaromtrent in artikel 9
      van [Verordening (EEG) nr. 3950/92](31992R3950), respectievelijk in artikel 2, eerste, tweede en derde lid van
      [Verordening (EG) nr. 1392/2001](32001R1392) is bepaald;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel1
  - number: '1.2'
    text: |-
      Het bepaalde bij of krachtens deze regeling geldt onverminderd de Overdrachtsbeschikking bevoegdheden
      [Landbouwwet][ref1] 1966, Algemeen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002252
  - number: '2.1'
    text: |-
      De koper is ter zake van de hoeveelheid melk, of het equivalent daarvan, welke hem wordt geleverd en die zijn
      heffingvrije hoeveelheid overschrijdt, een heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel2
  - number: '2.2'
    text: |-
      Het bedrag van de heffing wordt met inachtneming van de EG-verordeningen vastgesteld. De hoeveelheid geleverde
      melk, of het equivalent daarvan, wordt bepaald met inachtneming van het bepaalde in de EG-verordeningen. In geval
      van levering van geheel of gedeeltelijk afgeroomde melk wordt met inachtneming van artikel 2, tweede lid van
      [Verordening (EG) nr. 1392/2001](32001R1392) de melk voor de berekening van de grondslag van de heffing als volle
      melk aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel2
  - number: '3.1'
    text: |-
      De producent is ter zake van een levering aan een koper van een hoeveelheid melk, of een equivalent daarvan, die
      zijn referentiehoeveelheid voor fabrieksleveranties overschrijdt, een heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel3
  - number: '3.2'
    text: |-
      Het bepaalde in [artikel 2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel2
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      De producent is ter zake van rechtstreekse verkoop voor consumptie van een hoeveelheid melk, of het equivalent
      daarvan, die zijn referentiehoeveelheid voor rechtstreekse verkoop overschrijdt, een heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel4
  - number: '4.2'
    text: |-
      Het bepaalde in [artikel 2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel2
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '2'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Indien de koper een heffing is verschuldigd, berekent deze de heffing overeenkomstig de EG-verordeningen
      door aan de producenten wier aan de koper afgeleverde hoeveelheid melk, of het equivalent daarvan, hoger
      is dan de overeenkomstig [artikel 6, eerste en tweede lid][ref1], ten name van deze koper geregistreerde
      referentiehoeveelheid. De koper houdt het verschuldigde bedrag in op de prijs van de melk die hij verschuldigd is
      aan de producent, die de uiteindelijke schuldenaar van de heffing is, of int het verschuldigde op andere passende
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel6
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '6'
        paragraaf: '3'
  - number: '5.2'
    text: |-
      Deze doorberekening vindt plaats nadat de koper de ongebruikte referentiehoeveelheden overeenkomstig de EG-
      verordeningen heeft herverdeeld over de in het eerste lid bedoelde producenten in evenredigheid met hun
      referentiehoeveelheden.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel5
  - number: '5.3'
    text: |-
      Wanneer gedurende een heffingsperiode blijkt dat een producent zijn aan de koper toebedeelde referentiehoeveelheid
      heeft overschreden, kan deze koper ter hoogte van de overschrijding een voorschot op de verschuldigde heffing
      innen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel5
  - number: '5.4'
    text: |-
      Het in het derde lid bedoelde voorschot op de inning kan worden verrekend met de door de koper aan de producent
      verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel5
  - number: '5.5'
    text: |-
      Na afloop van de heffingsperiode wordt het aldus betaalde voorschot op de inning verrekend met de ingevolge het
      eerste lid door de producent definitief verschuldigde heffing.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel5
  - number: '6.1'
    text: |-
      De heffingvrije hoeveelheid van de koper is gelijk aan het totaal van de referentiehoeveelheden of gedeelten
      daarvan, welke ten name van de koper bij het productschap is geregistreerd in de vorige heffingsperiode, in
      voorkomend geval gewijzigd overeenkomstig het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel6
  - number: '6.2'
    text: |-
      De heffingvrije hoeveelheid van de koper wordt met inachtneming van de EG-verordeningen en het bepaalde in het
      derde lid gewijzigd, indien de producent te zamen met de betrokken kopers opgave doet aan het productschap van de
      toedeling van zijn referentiehoeveelheid aan een andere koper.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel6
  - number: '6.3'
    text: |-
      De in het tweede lid bedoelde opgave wordt gedaan vóór een door het productschap vast te stellen datum volgens
      daartoe door het productschap te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel6
  - number: '7.1'
    text: |-
      Onverminderd het bepaalde in [paragraaf 7][ref1] vervalt de aanspraak op de referentiehoeveelheid, die
      ter beschikking staat van de producent welke gedurende een periode van twaalf maanden geen melk of andere
      zuivelproducten in de handel heeft gebracht, direct na ommekomst van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005933
        paragraaf: '7'
  - number: '7.2'
    text: |-
      De ingevolge het eerste lid vervallen referentiehoeveelheid wordt op verzoek van de betrokken producent door
      het productschap opnieuw toegewezen, indien hij de productie van melk of andere zuivelproducten op zijn bedrijf
      hervat binnen een termijn van negen maanden na de datum waarop de aanspraak op de referentiehoeveelheid is komen
      te vervallen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel7
  - number: '7.3'
    text: |-
      Het verzoek wordt binnen de in het tweede lid genoemde termijn ingediend bij het productschap volgens de daartoe
      door het productschap te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel7
  - number: '7.4'
    text: De toekenning geschiedt uiterlijk op de eerste april volgend op de datum, van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel7
  - number: '8.1'
    text: |-
      De referentiehoeveelheid wordt op deugdelijk gemotiveerd verzoek van de producent verhoogd of vastgesteld door
      het productschap om rekening te houden met veranderingen die van invloed zijn op zijn leveringen en/of zijn
      rechtstreekse verkoop. De verhoging of vaststelling van een referentiehoeveelheid is slechts mogelijk als de andere
      referentiehoeveelheid van de producent met dezelfde hoeveelheid wordt verlaagd dan wel wordt opgeheven. Zodanig
      verzoek dient te worden ingediend bij het productschap, vóór een door het productschap vast te stellen datum,
      volgens daartoe door het productschap te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel8
  - number: '8.2'
    text: |-
      De referentiehoeveelheid die ingevolge het in het eerste lid bedoelde verzoek is uitgewisseld naar een
      andere referentiehoeveelheid, kan in de heffingsperiode waarin deze uitwisseling heeft plaatsgevonden niet
      worden overgedragen overeenkomstig het bepaalde in [paragraaf 6][ref1] en niet tijdelijk worden overgedragen
      overeenkomstig het bepaalde in [paragraaf 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Paragraaf6
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005933
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        paragraaf: '7'
  - number: '8.3'
    text: |-
      De referentiehoeveelheid waarvan de overdracht overeenkomstig het bepaalde in [paragraaf 6][ref1] of
      [paragraaf 7][ref2] is geregistreerd, kan in de betreffende heffingsperiode niet worden uitgewisseld ingevolge het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Paragraaf6
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005933
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        paragraaf: '7'
  - number: '9'
    text: |-
      De vaststelling van het representatieve vetgehalte vindt plaats overeenkomstig het bepaalde in de artikelen 3 en 4
      van [Verordening (EG) nr. 1392/2001](32001R1392). Het productschap is belast met de uitvoering hiervan.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel9
  - number: '10'
    text: |-
      Het is een koper verboden melk of het equivalent daarvan afkomstig van een producent geleverd te krijgen als hij
      niet door het productschap erkend is als koper.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel10
  - number: '11.1'
    text: 'Het productschap erkent iedere koper die handelt op Nederlands grondgebied indien deze:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: 11.1.a)
    text: |-
      aantoont ingeschreven te zijn in het handelsregister als bedoeld in
      [artikel 2 van de Handelsregisterwet 1996][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: 11.1.b)
    text: |-
      beschikt over een vestiging op Nederlands grondgebied waar de in [artikel 31, eerste lid][ref1], bedoelde
      administratie kan worden ingezien door de ambtenaren van de Algemene Inspectiedienst of functionarissen van het
      productschap;


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel31
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '31'
        paragraaf: '9'
  - number: 11.1.c)
    text: |-
      zich ertoe verbindt de in [artikel 31, eerste lid][ref1], bedoelde administratie bij te houden;


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel31
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '31'
        paragraaf: '9'
  - number: 11.1.d)
    text: |-
      zich ertoe verbindt de in [artikel 27, tweede lid][ref1], bedoelde aangifte bij het productschap in te dienen;


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel27
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '27'
        paragraaf: '8'
  - number: 11.1.e)
    text: |-
      zich ertoe verbindt toegang te verlenen aan de ambtenaren van de Algemene Inspectiedienst of functionarissen van
      het productschap tot zijn administratie ten behoeve van de controle daarvan;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: 11.1.f)
    text: |-
      zich ertoe verbindt het vervoer van melk door middel van daartoe gebruikelijke transportmiddelen te laten
      verrichten, die de mogelijkheid bieden om de getransporteerde melkhoeveelheid alsmede het vetgehalte daarvan vast
      te stellen;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: '11.2'
    text: |-
      Het productschap kan nadere voorwaarden verbinden aan de erkenning waaronder het laten stellen van een waarborg ter
      verzekering van de te betalen heffing.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: '11.3'
    text: |-
      Indien een verzoek tot erkenning als koper wordt ingediend na een door het productschap vast te stellen datum, kan
      erkenning eerst plaatsvinden met ingang van de volgende heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: '11.4'
    text: |-
      Behoudens in de in artikel 13, vierde lid, van [Verordening (EG) nr. 1392/2001](32001R1392) bedoelde gevallen,
      trekt het productschap de erkenning van de koper in, indien de koper geen handelaar meer is en zijn administratie
      niet langer in Nederland kan worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: '11.5'
    text: |-
      Behoudens in de in artikel 13, vierde lid, van [Verordening (EG) nr. 1392/2001](32001R1392) bedoelde gevallen trekt
      het productschap de erkenning van de koper in of legt een boete op, indien de koper een onjuiste afrekening of
      aangifte heeft ingediend, indien hij de verbintenis om de productboekhouding, de registers en de overige in artikel
      14, tweede lid, van [Verordening (EG) nr. 1392/2001](32001R1392) bedoelde documenten voortdurend bij te werken niet
      is nagekomen, of bij herhaling een andere communautaire of nationale verplichting niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel11
  - number: '12'
    text: |-
      Het is de producent verboden feitelijk melk van zijn bedrijf te leveren anders dan op eigen naam, behoudens
      ontheffing verleend door het productschap.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel12
  - number: '13'
    text: |-
      Het is de producent verboden om voor zover hij melk of het equivalent daarvan niet rechtstreeks aan de consument
      levert, te leveren aan een niet door het productschap erkende koper.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel13
  - number: '14'
    text: |-
      De in [artikel 6, eerste en tweede lid][ref1], bedoelde registratie van referentiehoeveelheden ten name van een
      koper kunnen slechts geschieden ten name van erkende kopers.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel6
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '6'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      Een referentiehoeveelheid kan worden overgedragen in samenhang met de overdracht van voor de melkproductie
      gebruikte grond, niet zijnde een geheel bedrijf, als overeengekomen door betrokken partijen met inachtneming van de
      hierna volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
  - number: '15.2'
    text: De over te dragen referentiehoeveelheid mag niet meer bedragen dan 20.000 kg per hectare grond.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
  - number: '15.3'
    text: |-
      De over te dragen referentiehoeveelheid omvat minimaal 20 000 kg. Dit minimum behoeft niet in acht te worden
      genomen indien de totale referentiehoeveelheid van de vervreemder minder dan 20 000 kg bedraagt en deze hoeveelheid
      in zijn geheel wordt overgedragen. Voorts behoeft dit minimum niet in acht te worden genomen bij het eindigen,
      beëindigen en ontbinden van een pachtovereenkomst, die is goedgekeurd door de grondkamer vóór 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
  - number: '15.4'
    text: |-
      De ingevolge het eerste lid met een referentiehoeveelheid over te dragen grond dient gedurende een periode van
      één jaar voorafgaande aan de overdracht daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik
      te zijn geweest. Voorts dient de met een referentiehoeveelheid over te dragen grond gedurende een periode van
      één jaar na de overdracht daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik te blijven. In
      geval van beëindiging van een pachtovereenkomst als bedoeld in [artikel 23, tweede lid, onder a, c en d][ref1],
      dient de terug over te dragen grond gedurende een periode van één jaar voorafgaande aan de beëindiging van een
      pachtovereenkomst daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel23
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '23'
        paragraaf: '6'
  - number: '15.5'
    text: |-
      Voor degene die ingevolge het bepaalde in [paragraaf 7][ref1] de gehele aan zijn bedrijf gerelateerde
      referentiehoeveelheid tijdelijk heeft overgedragen en om die reden niet aan het gestelde in de eerste en laatste
      volzin van het vierde lid, kan voldoen, geldt dat de ingevolge het eerste lid over te dragen grond gedurende één
      jaar voorafgaand aan de tijdelijke overdracht van de gehele aan het bedrijf gerelateerde referentiehoeveelheid,
      daadwerkelijk voor de melkproductie op zijn bedrijf in gebruik moet zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005933
        paragraaf: '7'
  - number: '15.6'
    text: |-
      Het productschap kan ingeval van overdracht krachtens erfrecht of huwelijksvermogensrecht ontheffing verlenen van
      het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel15
  - number: '16.1'
    text: |-
      De op een bedrijf beschikbare referentiehoeveelheid gaat bij gelegenheid van de overdracht van het gehele bedrijf
      in zijn geheel over, met inachtneming van de hierna volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel16
  - number: '16.2'
    text: |-
      Een overdracht van een referentiehoeveelheid vindt plaats tot ten hoogste 20.000 kg per hectare overgedragen grond,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel16
  - number: 16.2.a
    text: |-
      het gehele bedrijf wordt verworven door degene die een echtgenoot, kind, afstammeling in de tweede graad,
      echtgenoot van een kind, echtgenoot van een kleinkind, of een pleegkind is van de vervreemder;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel16
  - number: 16.2.b
    text: |-
      het gehele bedrijf wordt verworven door een ander dan genoemd in onderdeel a, als ten genoegen van het productschap
      is aangetoond dat het bedrijf in de twee jaren voorafgaande aan de overdracht niet substantieel is verkleind,
      althans voor zover het de melkveehouderij betreft en als het bedrijf beoordeeld naar de feitelijke bedrijfsvoering
      als een zelfstandige eenheid ongewijzigd wordt voortgezet. Ter zake van de toepassing van dit onderdeel kunnen
      nadere regelen worden gesteld door het productschap.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel16
  - number: '16.3'
    text: Onder pleegkind wordt verstaan degene die duurzaam als een eigen kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel16
  - number: '17.1'
    text: |-
      Indien naar het oordeel van het productschap een overdracht van grond dan wel het aangaan of beëindigen van een
      pachtovereenkomst kennelijk uitsluitend tot doel heeft gehad het maximum gesteld in [artikel 15, tweede lid][ref1],
      te ontgaan, kan het productschap binnen een tijdvak van 3 jaar na overdracht van de referentiehoeveelheid,
      besluiten dat een aanspraak op deze hoeveelheid ter zake van die overdracht geheel of gedeeltelijk niet meer wordt
      erkend, te rekenen vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12 maanden
      terugwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
  - number: '17.2'
    text: 'Indien een aanspraak ingevolge het eerste lid geheel of gedeeltelijk niet meer wordt erkend:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
  - number: 17.2.a
    text: |-
      kan erkenning van de aanspraak op de referentiehoeveelheid bij de vervreemder plaatsvinden indien de verkrijger en
      de vervreemder overeenkomen dat de overdracht van de referentiehoeveelheid ongedaan wordt gemaakt met ingang van
      de datum waarop partijen van deze overeenkomst op een daartoe voorgeschreven formulier bij het productschap hebben
      kennisgegeven;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
  - number: 17.2.b
    text: |-
      kan erkenning van de aanspraak op de referentiehoeveelheid bij de verkrijger plaatsvinden, indien alsnog
      daadwerkelijk voor de melkproductie gebruikte grond aan hem wordt overgedragen overeenkomstig het bepaalde
      in [artikel 15][ref1] met ingang van de datum waarop de betrokken registratie overeenkomstig de procedure van
      [artikel 18][ref2] heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel18
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '18'
        paragraaf: '6'
  - number: '17.3'
    text: |-
      De erkenning als bedoeld in het tweede lid wordt gerelateerd aan de nog niet verstreken periode van de betrokken
      heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
  - number: '17.4'
    text: |-
      De verkrijger kan op diens verzoek voor het niet erkende deel van de referentiehoeveelheid aanspraak maken op een
      vergoeding van € 0,29 per kilogram referentiehoeveelheid. Voor zover deze vergoeding toegekend wordt, is het in
      het tweede lid bepaalde niet van toepassing. Een in de eerste volzin bedoeld verzoek wordt bij het productschap
      ingediend. De minister beslist op het verzoek.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
  - number: '17.5'
    text: |-
      Indien bij toepassing van [artikel 16, tweede lid, onderdeel b][ref1], naar het oordeel van het productschap in
      het tijdvak van drie jaren volgend op de overdracht van de referentiehoeveelheid, het bedrijf niet of niet meer
      als een zelfstandige eenheid ongewijzigd wordt voortgezet, kan het productschap besluiten dat een aanspraak op deze
      hoeveelheid, die het maximum van 20.000 kg per overgedragen hectare te boven gaat, geheel of gedeeltelijk niet meer
      wordt erkend, te rekenen vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12
      maanden terugwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel16
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '16'
        paragraaf: '6'
  - number: '18.1'
    text: |-
      Degenen die een referentiehoeveelheid op basis van [artikel 15][ref1], dan wel op basis van
      [artikel 16, eerste lid][ref2], hebben verworven respectievelijk overgedragen, geven daarvan binnen een termijn van
      zes weken gezamenlijk kennis aan het productschap op een daartoe door het productschap voorgeschreven formulier,
      volgens daartoe door het productschap gestelde voorschriften. Bij dit formulier worden de door het productschap
      voorgeschreven documenten met betrekking tot de overdracht van de referentiehoeveelheid en de bijbehorende grond
      gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel16
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '16'
        paragraaf: '6'
  - number: '18.2'
    text: Er kan eerst een aanspraak op een referentiehoeveelheid worden gemaakt vanaf de registratie door het productschap.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
  - number: '18.3'
    text: |-
      Indien de overdracht bedoeld in het eerste lid in het tijdvak van een door het productschap te bepalen datum tot
      en met het einde van de heffingsperiode bij het productschap wordt aangemeld of niet binnen de in het eerste lid
      bedoelde termijn wordt aangemeld, wordt de aanspraak op de referentiehoeveelheid eerst erkend met ingang van de
      volgende heffingsperiode. Deze bepaling vindt geen toepassing indien [artikel 17, tweede lid, onderdeel b][ref1],
      toepassing vindt. Indien zodanige aanmelding plaatsvindt in enige heffingsperiode vóór de door het productschap
      bepaalde datum kan het productschap de overgang van de referentiehoeveelheid voor het geheel of een gedeelte
      daarvan registreren met ingang van enig moment in de lopende heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel17
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '17'
        paragraaf: '6'
  - number: '18.4'
    text: |-
      Onverminderd het bepaalde in [artikel 16, tweede lid, onder a en b][ref1], wordt, indien het productschap de
      overdracht van een referentiehoeveelheid ter registratie krijgt aangeboden waarbij meer dan 20.000 kg per hectare
      wordt overgedragen, ten name van de verwerver de overdracht geregistreerd van 20.000 kg per hectare overgedragen
      grond. Voor de niet ten name van de verwerver geregistreerde hoeveelheid wordt een vergoeding toegekend
      overeenkomstig de bepalingen van de daarvoor geldende regeling van de Stichting Ontwikkelings- en Saneringsfonds
      voor de Landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel16
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '16'
        paragraaf: '6'
  - number: '18.5'
    text: |-
      De vergoeding, bedoeld in het vierde lid wordt toegekend aan de vervreemder van de grond, tenzij de betrokken
      partijen anders overeenkomen. In geval van ontbinding, eindigen dan wel beëindiging van een pachtovereenkomst wordt
      de vergoeding toegekend aan de verpachter en pachter gezamenlijk ieder voor de helft, tenzij de betrokken partijen
      anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
  - number: '18.6'
    text: |-
      Indien in een heffingsperiode de tijdelijke overdracht van een referentiehoeveelheid overeenkomstig het bepaalde
      in [paragraaf 7][ref1] door het productschap wordt geregistreerd en nadien in dezelfde periode ten aanzien van de
      betrokken hoeveelheid een kennisgeving bedoeld in de eerste volzin van het eerste lid bij het productschap wordt
      aangemeld, wordt de aanspraak op de betrokken hoeveelheid eerst erkend met ingang van de volgende heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005933
        paragraaf: '7'
  - number: '19.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 15][ref1] en [16][ref2] gaat door overdracht van een bedrijf of
      grond krachtens erfrecht dan wel huwelijksvermogensrecht een referentiehoeveelheid op de rechthebbende over, met
      inachtneming van de hierna volgende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel16
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '16'
        paragraaf: '6'
  - number: '19.2'
    text: |-
      Het productschap wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie een bedrijf toekomt de
      registratie van de betrokken referentiehoeveelheid.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel19
  - number: '19.3'
    text: |-
      Het productschap wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie gronden toekomen die ten
      tijde van de overdracht deel uitmaakten van een bedrijf waaraan een referentiehoeveelheid was gerelateerd, de
      registratie van de betrokken hoeveelheid als overeengekomen door de rechthebbenden, op basis van de voor de
      melkproductie gebruikte oppervlakte.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel19
  - number: '19.4'
    text: |-
      Het productschap kan op verzoek de voorgaande leden overeenkomstig toepassen indien sprake is van een andere
      wijze van overdracht onder algemene titel dan is aangegeven in het eerste lid, danwel indien sprake is van een
      overdracht onder bijzondere titel, anders dan in [artikel 15, eerste lid][ref1], danwel indien sprake is van in-de-
      plaatsstelling of medepacht als bedoeld in de [artikelen 49][ref2], [49a][ref3] of [54 van de Pachtwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel49a
      [ref4]: https://wetten.overheid.nl/BWBR0002269#Artikel54
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002269
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0002269
        artikel: 49a
      - id: ref4
        bwb_id: BWBR0002269
        artikel: '54'
  - number: '19.5'
    text: |-
      Een verzoek wordt gedaan door kennisgeving door de betrokken rechthebbende of de gezamenlijke rechthebbenden aan
      het productschap. [Artikel 18, eerste, tweede en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel18
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '18'
        paragraaf: '6'
  - number: '20.1'
    text: |-
      Een aanspraak op een referentiehoeveelheid wordt niet erkend indien deze in samenhang met de overdracht van grond,
      niet zijnde een geheel bedrijf, of een geheel bedrijf wordt verworven door een ander publiekrechtelijk lichaam dan
      het bureau beheer landbouwgronden, of door een particuliere natuurbeschermingsorganisatie, tenzij het productschap
      anders beslist voor een daarbij vastgestelde hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel20
  - number: '20.2'
    text: |-
      In geval van verwerving door een ander publiekrechtelijk lichaam dan het bureau beheer landbouwgronden van grond,
      niet zijnde een geheel bedrijf, of een geheel bedrijf, wordt een aanspraak op een referentiehoeveelheid erkend
      indien zeker is gesteld dat de overgedragen grond of het overgedragen bedrijf voor landbouwkundige doeleinden in
      gebruik blijft en indien de grond of het bedrijf samen met de referentiehoeveelheid door het publiekrechtelijke
      lichaam binnen een termijn van 6 maanden na de overdracht wordt overgedragen aan één of meer producenten.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel20
  - number: '22.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 15][ref1] en [16][ref2] kan ingeval van verplaatsing van een geheel
      bedrijf, de op het oude bedrijf beschikbare referentiehoeveelheid worden meegenomen naar het nieuwe bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel16
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '16'
        paragraaf: '6'
  - number: '22.2'
    text: |-
      Het ingevolge het eerste lid te verplaatsen bedrijf dient gedurende een periode van één jaar voorafgaand aan
      de verplaatsing daadwerkelijk in gebruik te zijn geweest voor de melkproductie. Voorts dient het nieuwe bedrijf
      gedurende een periode van één jaar na de verplaatsing daadwerkelijk voor de melkproductie in gebruik te blijven.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel22
  - number: '22.3'
    text: |-
      [Artikel 18, eerste, tweede en derde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel18
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '18'
        paragraaf: '6'
  - number: '23.1'
    text: 'Onder overdracht wordt in deze paragraaf verstaan:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.1.a
    text: overdracht in eigendom onder bijzondere titel;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.1.b
    text: |-
      een door de grondkamer goedgekeurde pachtovereenkomst als bedoeld in [artikel 1 van de Pachtwet][ref1] betreffende
      los land hetwelk groter is dan één hectare of een hoeve geldend voor de duur van meer dan één jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel1
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '1'
  - number: 23.1.c
    text: |-
      een schriftelijke pachtovereenkomst als bedoeld in [artikel 1 van de Pachtwet][ref1] betreffende los land hetwelk
      niet groter is dan één hectare, geldend voor de duur van meer dan één jaar;.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel1
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '1'
  - number: 23.1.d
    text: |-
      een door de grondkamer geregistreerde pachtovereenkomst als bedoeld in
      [artikel 70f, tweede lid, van de Pachtwet][ref1], geldend voor de duur van meer dan één jaar doch voor ten hoogste
      twee jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel70f
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: 70f
  - number: 23.1.e
    text: overdracht ingevolge vestiging, overdracht of tenietgaan van het recht van erfpacht of het recht van vruchtgebruik.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: '23.2'
    text: |-
      Aan het hieronder bepaalde is het zelfde gevolg verbonden als aan de pachtovereenkomst als bedoeld in het eerste
      lid, de onderdelen b, c en d;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.2.a
    text: een door de grondkamer goedgekeurde beëindigingsovereenkomst van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.2.b
    text: |-
      een schriftelijke beëindigingsovereenkomst van een pachtovereenkomst als bedoeld in het eerste lid, onderdelen c
      en d;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.2.c
    text: |-
      het eindigen van een pachtovereenkomst als bedoeld in het eerste lid onderdelen c en d, alsmede van een door
      de Grondkamers goedgekeurde pachtovereenkomst als bedoeld in [artikel 12, derde lid, van de Pachtwet][ref1],
      geldend voor de duur van meer dan één jaar, zonder dat een verzoek als bedoeld in
      [artikel 37, eerste lid, van de Pachtwet][ref2] is ingediend, of van een pachtovereenkomst als bedoeld in
      [artikel 70f, vijfde lid, van de Pachtwet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002269#Artikel70f
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002269
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002269
        artikel: 70f
  - number: 23.2.d
    text: een door de rechter uitgesproken ontbinding van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.2.e
    text: een afwijzing door de rechter van een verzoek tot verlenging van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.2.f
    text: |-
      het eindigen van een pachtovereenkomst als gevolg van een kennisgeving als bedoeld
      in [artikel 36, tweede lid, van de Pachtwet][ref1], waarna niet overeenkomstig
      [artikel 36, derde lid, van de Pachtwet][ref2] om verlenging is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002269#Artikel36
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002269
        artikel: '36'
  - number: '23.3'
    text: 'Voor het tijdstip van overdracht van de referentiehoeveelheid is bepalend:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.3.a
    text: |-
      de inschrijving van de desbetreffende akte in de in artikel 89 van boek 3 van het Burgerlijk Wetboek bedoelde
      openbare registers met dien verstande dat in het geval van het tenietgaan van het recht van erfpacht of van het
      recht van vruchtgebruik het tijdstip van het tenietgaan in aanmerking wordt genomen;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: 23.3.b
    text: |-
      de ingangsdatum van de pachtovereenkomst dan wel de datum waarop de betrokken partijen de pachtovereenkomst
      schriftelijk zijn aangegaan, voor zover deze na de ingangsdatum ligt.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel23
  - number: '24'
    text: |-
      Een producent kan het gedeelte van een referentiehoeveelheid dat door hem niet zal worden gebruikt, overeenkomstig
      de EG-verordeningen en met inachtneming van de hierna volgende artikelen van deze paragraaf voor de duur van een
      heffingsperiode tijdelijk overdragen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel24
  - number: '25.1'
    text: 'Aan de tijdelijke overdracht van een referentiehoeveelheid zijn de volgende voorwaarden verbonden:'
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: 25.1.a
    text: |-
      een tijdelijke overdracht van een referentiehoeveelheid dient minimaal een hoeveelheid van 10.000 kg te betreffen.
      Dit minimum behoeft niet in acht te worden genomen indien de totale referentiehoeveelheid van de vervreemder minder
      dan 10 000 kg bedraagt en deze hoeveelheid in zijn geheel tijdelijk wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: 25.1.b
    text: per bedrijf kan door tijdelijke overdracht maximaal 75 000 kg referentiehoeveelheid worden verkregen;
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: 25.1.c
    text: |-
      een tijdelijke overdracht kan slechts plaatsvinden indien een vervreemder voordien in de betrokken heffingsperiode
      geen referentiehoeveelheden tijdelijk heeft verkregen en een verkrijger voordien in de betrokken heffingsperiode
      geen referentiehoeveelheden tijdelijk heeft vervreemd.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: 25.1.d
    text: |-
      producenten die een verzoek, als bedoeld in [artikel 8, eerste lid][ref1], hebben ingediend, kunnen de
      referentiehoeveelheden waarop dit verzoek betrekking heeft in de betrokken heffingsperiode niet tijdelijk
      overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel8
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '8'
        paragraaf: '3'
  - number: '25.2'
    text: |-
      Een melding van een tijdelijke overdracht dient per heffingsperiode vóór een door het productschap vast te stellen
      datum bij het productschap te worden ingediend, volgens daartoe door het productschap te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: '25.3'
    text: Er kan eerst een aanspraak op een referentiehoeveelheid worden gemaakt vanaf de registratie door het productschap.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel25
  - number: '26.1'
    text: |-
      Het productschap is belast met de vaststelling, de oplegging en de inningen van de heffingen, bedoeld in de
      [artikelen 2][ref1], [3][ref2], en [4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005933#Artikel4
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005933
        artikel: '4'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Het productschap stelt met inachtneming van het bepaalde in artikel 2, derde lid van [Verordening (EG) nr.
      1392/2001](32001R1392) de equivalenties vast voor alle andere zuivelproducten dan room en boter.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel26
  - number: '27.1'
    text: |-
      Aan het eind van de heffingsperiode stelt de koper een afrekening op voor de producent conform het bepaalde in
      artikel 5, eerste lid, van [Verordening (EG) nr. 1392/2001](32001R1392).
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
  - number: '27.2'
    text: |-
      De koper deelt jaarlijks voor 15 mei, overeenkomstig het bepaalde in artikel 5, tweede lid, van [Verordening
      (EG) nr. 1392/2001](32001R1392) en overeenkomstig de door het productschap daartoe gestelde regelen, aan het
      productschap het overzicht mede, waarin zijn opgenomen alle in voornoemd [artikel 5, tweede lid][ref1], bedoelde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel5
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '5'
        paragraaf: '2'
  - number: '27.3'
    text: |-
      De in het tweede lid bedoelde aangifte van de koper dient vergezeld te gaan van een verklaring van een register-
      accountant, zoals bedoeld in artikel 55 juncto [artikel 58 van de Wet op de Registeraccountants][ref1],
      of een accountants-administratieconsulent, zoals bedoeld in [artikel 7][ref2] juncto
      [artikel 10 van de Wet op de Accountantsadministratieconsulenten][ref3], omtrent de juistheid van de in de aangifte
      vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel10
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '10'
  - number: '27.4'
    text: |-
      Indien de in het tweede lid bedoelde aangifte niet tijdig wordt gedaan, legt het productschap de in artikel 5,
      derde en vierde lid, van [Verordening (EG) nr. 1392/2001](32001R1392) bedoelde sanctie op aan de koper.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
  - number: '27.5'
    text: |-
      Het productschap stelt de koper in kennis van het bedrag van de heffing die deze verschuldigd is, zulks na al
      dan niet, volgens het besluit van het productschap, de ongebruikte referentiehoeveelheden geheel of gedeeltelijk
      opnieuw te hebben toegewezen aan de kopers met het oog op omslag over de betrokken producenten.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
  - number: '27.6'
    text: |-
      De koper betaalt de verschuldigde heffing aan het productschap vóór 1 september. Bij overschrijding van deze
      termijn is de koper vanaf overschrijding tot het moment van voldoening van de schuld rente als bedoeld in artikel
      8, tweede lid, van [Verordening (EG) nr. 1392/2001](32001R1392) verschuldigd zonder dat ingebrekestelling of
      rechterlijke tussenkomst is vereist.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel27
  - number: '28.1'
    text: |-
      In afwijking van het bepaalde in [artikel 5, eerste lid][ref1], vindt over de in onderdeel a bedoelde hoeveelheden
      geen doorberekening plaats, indien het productschap op verzoek van de producent of producenten daarvoor toestemming
      heeft gegeven. Zodanige toestemming kan slechts worden gegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel5
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '5'
        paragraaf: '2'
  - number: 28.1.a
    text: |-
      op een bedrijf meer dan één referentiehoeveelheid is geregistreerd en de melk, of het equivalent daarvan, door de
      betrokkenen gezamenlijk aan een koper wordt geleverd tot ten hoogste deze referentiehoeveelheden en
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: 28.1.b
    text: |-
      de productie en de levering van melk, of het equivalent daarvan, plaatsvindt op één te onderscheiden zelfstandige
      bedrijfseenheid en
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: 28.1.c
    text: |-
      de melk, of het equivalent daarvan, rechtstreeks wordt geleverd vanuit één op deze bedrijfseenheid geplaatst gebouw
      of complex van gebouwen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: '28.2'
    text: |-
      Het in het eerste lid bedoelde verzoek dient te worden ingediend bij het productschap op een daartoe door het
      productschap voorgeschreven formulier. Indien dit verzoek in het tijdvak van door het productschap vast te stellen
      datum tot en met het einde van de heffingsperiode bij het productschap wordt ingediend, kan de toestemming eerst
      met ingang van de volgende heffingsperiode worden verleend. Het productschap beslist op dit verzoek. Aan de door
      het productschap verleende toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: '28.3'
    text: |-
      De toestemming vervalt zodra niet meer wordt voldaan aan een of meer voorwaarden voor de verlening van de
      toestemming.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: '28.4'
    text: |-
      Indien partijen zelf de regeling wensen te beëindigen vervalt de toestemming met ingang van een volgende
      heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: '28.5'
    text: |-
      De producent of producenten aan wie de in het eerste lid bedoelde toestemming is verleend, dient of dienen, zodra
      niet meer wordt voldaan aan de voorwaarden voor de verlening van de toestemming, of indien zij zelf de regeling
      wensen te beëindigen, hiervan het productschap onverwijld in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel28
  - number: '29.1'
    text: |-
      De in [artikel 4][ref1] bedoelde producent doet conform het bepaalde in artikel 6, eerste lid, van [Verordening
      (EG) nr. 1392/2001](32001R1392) en conform de door het productschap daartoe gestelde regelen, aangifte bij het
      productschap van de hoeveelheid melk of andere melkproducten die hij in de vorige heffingsperiode rechtstreeks aan
      de consument, groot- of detailhandel of aan affineurs heeft geleverd, gespecificeerd per product.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel4
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '4'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Indien de producent de in het eerste lid bedoelde aangifte niet voor 15 mei heeft gedaan of een onjuiste aangifte
      heeft ingediend, legt het productschap de in artikel 6, derde lid, van [Verordening (EG) nr. 1392/2001](32001R1392)
      bedoelde sanctie op aan de producent, behoudens in de in artikel 6, vijfde lid, van [Verordening (EG) Nr.
      1392/2001](32001R1392) bedoelde gevallen.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
  - number: '29.4'
    text: |-
      Het productschap stelt de producent in kennis van het bedrag van de heffing die deze verschuldigd is, na al dan
      niet, volgens het besluit van het productschap, de ongebruikte referentiehoeveelheden geheel of gedeeltelijk
      opnieuw te hebben toegewezen aan de betrokken producenten.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
  - number: '29.5'
    text: |-
      De producent betaalt de verschuldigde heffing aan het productschap vóór 1 september. Bij overschrijding van deze
      termijn is de producent vanaf overschrijding tot het moment van voldoening van de schuld rente als bedoeld in
      artikel 8, tweede lid, van [Verordening (EG) nr. 1392/2001](32001R1392) verschuldigd zonder dat ingebrekestelling
      of rechterlijke tussenkomst is vereist.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
  - number: '29.6'
    text: |-
      De in het vijfde lid bedoelde rente is eveneens vanaf het in dat lid bedoelde tijdstip verschuldigd zonder dat
      ingebrekestelling of rechterlijke tussenkomst is vereist indien de producent niet of niet volledig heeft voldaan
      aan de ingevolge het eerste lid op hem rustende verplichting en het productschap de in het vierde lid bedoelde
      kennisgeving eerst op of na 1 september heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
  - number: '29.7'
    text: |-
      De producent die over een referentiehoeveelheid voor rechtstreekse verkoop beschikt, is verplicht, indien hij in de
      betrokken heffingsperiode geen melk heeft geleverd, daarvan tijdig aangifte te doen bij het productschap.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel29
  - number: '30'
    text: |-
      Voor de vaststelling en oplegging van de heffingen, bedoeld in de [artikelen 2][ref1], [3][ref2], en [4][ref3]
      wordt geen rekening gehouden met rechtshandelingen waarvan op grond van de omstandigheden dat zij geen wezenlijke
      verandering van feitelijke verhoudingen hebben ten doel gehad, of op grond van andere bepaalde feiten en
      omstandigheden moet worden aangenomen, dat zij achterwege zouden zijn gebleven indien daarmede niet de vaststelling
      of oplegging voor het vervolg geheel of ten dele zou worden onmogelijk gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005933#Artikel4
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005933
        artikel: '4'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      De koper dan wel de producent, die ingevolge de [artikelen 2][ref1], [3][ref2] of [4][ref3] een heffing
      verschuldigd is of kan worden, is verplicht overeenkomstig het bepaalde in de artikelen 13, tweede lid, en 14 van
      [Verordening (EG) nr. 1392/2001](32001R1392) en conform de door het productschap gestelde regelen een administratie
      te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005933#Artikel4
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005933
        artikel: '4'
        paragraaf: '2'
  - number: '31.2'
    text: |-
      Het productschap kan ambtshalve de afgeleverde hoeveelheid vaststellen, indien de verplichtingen uit het eerste
      lid, dan wel uit [artikel 27, tweede lid][ref1], of [artikel 29, eerste lid][ref2], niet of, naar het oordeel van
      het productschap, onvoldoende worden nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005933#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005933#Artikel29
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005933
        artikel: '27'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0005933
        artikel: '29'
        paragraaf: '8'
  - number: '32.1'
    text: |-
      Een ieder die anders dan als koper bedrijfsmatig melk en/of andere zuivelproducten geleverd krijgt, dient in zijn
      administratie te verantwoorden van wie hij welke hoeveelheden geleverd krijgt.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel32
  - number: '32.2'
    text: |-
      Degene die niet conform het eerste lid, de oorsprong van de geleverde melk en/of andere zuivelproducten kan
      aantonen, wordt een heffing opgelegd ter hoogte van het percentage genoemd in artikel 1 van [Verordening (EEG) nr.
      3950/92](31992R3950).
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel32
  - number: '33.1'
    text: |-
      Degene die melk of het equivalent daarvan bedrijfsmatig vervoert, dient tijdens dit vervoer te beschikken over de
      door het productschap voorgeschreven documenten.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel33
  - number: '33.2'
    text: |-
      Het is verboden om melk, of het equivalent daarvan, te vervoeren indien niet op eerste vordering van de ambtenaar
      van de Algemene Inspectiedienst alle inlichtingen worden verstrekt die deze in verband met de uitvoering van zijn
      taak behoeft.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel33
  - number: '33.3'
    text: |-
      Indien de vervoerder van melk of het equivalent daarvan niet voldoet aan het bepaalde in het eerste en tweede lid,
      wordt hij beschouwd als koper.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel33
  - number: '34'
    text: |-
      Het productschap regelt overigens, met inachtneming van de EG-verordeningen en, zo nodig, de aanwijzingen van de
      minister, al hetgeen voor een goede uitvoering van deze regeling is vereist.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel34
  - number: '37.1'
    text: |-
      De Beschikking superheffing 1988 geldt voor de periode tot en met 31 maart 1993 en blijft van kracht voor zover en
      tot zolang nodig is voor de goede uitvoering van het daarin bepaalde.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel37
  - number: '37.2'
    text: Artikel 24 van de Beschikking superheffing 1988 blijft tot een nader te bepalen tijdstip van kracht.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel37
  - number: '37.3'
    text: |-
      De Beschikking van de Minister van Landbouw, Natuurbeheer en Visserij van 27 juni 1990 nr. J.907307, houdende een
      uitvoeringsregeling op basis van artikel 25, tweede lid, van de Beschikking superheffing 1988 (Stcrt. 127) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel37
  - number: '38'
    text: Deze regeling treedt in werking met ingang van 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel38
  - number: '39'
    text: |-
      Deze regeling wordt aangehaald als de ‘[Regeling superheffing 1993][ref1]’. Deze regeling zal met de toelichting in
      de Staatscourant worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005933
    url: https://wetten.overheid.nl/BWBR0005933/2002-03-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005933
