preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Autoriteit Consument en Markt te belasten
    met het toezicht op de naleving en de handhaving van Verordening (EU) 2019/1150 van het Europees Parlement
    en de Raad van 20 juni 2019 ter bevordering van billijkheid en transparantie voor zakelijke gebruikers van
    onlinetussenhandelsdiensten (PbEU 2019, L 186);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bedrijfswebsitegebruiker:* bedrijfswebsitegebruiker als bedoeld in artikel 2, onderdeel 7, van [verordening
      2019/1150](33050R2019);
        - *bindende gedragslijn:* een zelfstandige last die niet wegens een overtreding wordt opgelegd;
        - *consument:* consument als bedoeld in artikel 2, onderdeel 4, van [verordening 2019/1150](33050R2019);
        - *onlinetussenhandelsdienst:* onlinetussenhandelsdienst als bedoeld in artikel 2, onderdeel 2, van [verordening
      2019/1150](33050R2019);
        - *onlinezoekmachine:* onlinezoekmachine als bedoeld in artikel 2, onderdeel 5, van [verordening 2019/1150]
      (33050R2019);
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *verordening 2019/1150:* [Verordening (EU) 2019/1150](32019R1150) van het Europees Parlement en de
      Raad van 20 juni 2019 ter bevordering van billijkheid en transparantie voor zakelijke gebruikers van
      onlinetussenhandelsdiensten (PbEU 2019, L 186);
        - *zakelijke gebruiker:* zakelijke gebruiker als bedoeld in artikel 2, onderdeel 1, van [verordening 2019/1150]
      (33050R2019).


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '2'
    text: |-
      Deze wet is van toepassing op onlinetussenhandelsdiensten en onlinezoekmachines, voor zover die worden verstrekt of
      worden aangeboden aan zakelijke gebruikers of bedrijfswebsitegebruikers als bedoeld in artikel 1, tweede lid, van
      [verordening 2019/1150](33050R2019) die:

      a. zijn gevestigd in Nederland, en

      b. via die onlinetussenhandelsdiensten of onlinezoekmachines goederen en diensten aanbieden aan consumenten in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#Artikel2
  - number: '3'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van de artikelen 3, eerste, tweede
      en vijfde lid, 4, 5, eerste, tweede, derde, vierde en vijfde lid, 6, 7, 8, 9, eerste en tweede lid, 10, eerste
      lid, 11, eerste, tweede, derde en vierde lid, en 12, eerste, tweede, derde, vierde en zesde lid, van [verordening
      2019/1150](33050R2019).
    url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#Artikel3
  - number: '4'
    text: |-
      De Autoriteit Consument en Markt kan een bindende gedragslijn tot naleving van een bepaling als bedoeld in
      [artikel 3][ref1] opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0050295#Artikel3
    url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0050295
        artikel: '3'
  - number: '5'
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat een overtreding van een bepaling als bedoeld in
      [artikel 3][ref1] heeft plaatsgevonden, die daadwerkelijke of mogelijke schade toebrengt of kan toebrengen aan de
      collectieve belangen van zakelijke gebruikers of bedrijfswebsitegebruikers, kan zij de overtreder opleggen:

      a. een last onder dwangsom;

      b. een bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0050295#Artikel3
    url: https://wetten.overheid.nl/BWBR0050295/2024-11-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050295
        artikel: '3'
  - number: '6'
    text: |-
      1 De bestuurlijke boete, bedoeld in [artikel 5, onderdeel b][ref1], bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2],
      of, indien dat meer is, 10% van de omzet van de overtreder, onderscheidenlijk, indien de overtreding door een
      ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen die van de vereniging deel
      uitmaken, in het boekjaar voorafgaande aan de beschikking waarin de bestuurlijke boete wordt opgelegd.

      2 De bestuurlijke boete die ingevolge het eerste lid ten hoogste kan worden opgelegd, kan worden verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref3], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0050295#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel548
