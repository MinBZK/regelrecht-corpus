  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 7.2.4, tweede lid en lid 3a, van de Wet educatie en beroepsonderwijs en artikel 2.2.3, vierde lid,
    van het Uitvoeringsbesluit WEB;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 1.b
    text: |-
      *competenties:* in het kader van het herontwerp van de kwalificatiestructuur mbo opgestelde eindtermen, die
      verwijzen naar onderliggende vaardigheden, kennis, en houdingsaspecten en expliciet zijn gerelateerd aan de
      toepassing in de praktijk;
    url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#Artikel1
  - number: 1.c
    text: '*kwalificatiedossier:* een document waarin een of meer kwalificaties zijn beschreven;'
    url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#Artikel1
  - number: 1.d
    text: |-
      *eindtermen:* eindtermen bedoeld in [artikel 7.1.3 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027759/2010-06-18#Artikel1
    references:
