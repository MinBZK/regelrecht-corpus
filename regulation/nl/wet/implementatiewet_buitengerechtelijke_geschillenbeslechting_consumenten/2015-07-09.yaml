        paragraaf: '1'
  - number: '1.2'
    text: |-
      Een ondernemer is gevestigd: - waar zijn bedrijf is gevestigd, indien de ondernemer een natuurlijke persoon is;
        - waar de statutaire zetel of het hoofdbestuur is of het bedrijf wordt uitgeoefend, met inbegrip van een filiaal,
      agentschap of enige andere vestiging, indien de ondernemer een vennootschap of andere rechtspersoon of een
      vereniging van natuurlijke of rechtspersonen is.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel1
  - number: '1.3'
    text: |-
      Een instantie tot buitengerechtelijke geschillenbeslechting is gevestigd: - indien de werking ervan wordt
      verzekerd door een natuurlijke persoon, op de plaats waar de instantie de activiteiten tot buitengerechtelijke
      geschillenbeslechting verricht;
        - indien de werking ervan wordt verzekerd door een rechtspersoon of vereniging van natuurlijke of rechtspersonen,
      op de plaats waar die rechtspersoon of vereniging van natuurlijke of rechtspersonen de activiteiten tot
      buitengerechtelijke geschillenbeslechting verricht of zijn statutaire zetel heeft;
        - indien de werking ervan wordt verzekerd door een overheidsinstantie of ander publiekrechtelijk lichaam, op de
      plaats waar de zetel is van die overheidsinstantie of dat publiekrechtelijk lichaam.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op procedures tot buitengerechtelijke beslechting van binnenlandse en
      grensoverschrijdende geschillen die voortvloeien uit een koopovereenkomst of een overeenkomst tot het verrichten
      van diensten tussen een in Nederland gevestigde ondernemer en een in de Europese Unie woonachtige consument, door
      tussenkomst van een instantie tot buitengerechtelijke geschillenbeslechting die een oplossing voorstelt of oplegt,
      of die de partijen bijeenbrengt teneinde een minnelijke schikking te vergemakkelijken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: '2.2'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.a
    text: |-
      procedures voor geschillenbeslechtingsinstanties waarbij de met de geschillenbeslechting belaste natuurlijke
      personen uitsluitend in dienst zijn van of uitsluitend een vergoeding ontvangen van de individuele ondernemer;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.b
    text: |-
      procedures inzake systemen voor de afhandeling van consumentenklachten waarvan de werking door de ondernemer wordt
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.c
    text: niet-economische diensten van algemeen belang;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.d
    text: geschillen tussen ondernemers;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.e
    text: rechtstreekse onderhandelingen tussen de consument en de ondernemer;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.f
    text: |-
      pogingen van een rechter om een schikking te beproeven in het kader van een gerechtelijke procedure met betrekking
      tot dat geschil;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.g
    text: door een ondernemer tegen een consument ingeleide procedures;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: 2.2.h
    text: |-
      gezondheidsdiensten die door gezondheidswerkers aan patiënten worden verstrekt om de gezondheidstoestand van die
      patiënten te beoordelen, te behouden of te herstellen, waaronder begrepen het voorschrijven en het verstrekken van
      geneesmiddelen en medische hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel2
  - number: '3.1'
    text: |-
      Geschillen als bedoeld in [artikel 2 lid 1][ref1] kunnen worden voorgelegd aan een instantie tot
      buitengerechtelijke geschillenbeslechting. Is voor een geschil geen specifieke instantie aanwezig, dan kan het
      geschil worden voorgelegd aan een daartoe specifiek door de Stichting Geschillencommissies voor Consumentenzaken
      ingestelde geschillencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel2
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      Een instantie tot buitengerechtelijke geschillenbeslechting kan in haar procesreglement bepalen een geschil niet te
      behandelen op één of meer van de volgende gronden:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.a
    text: |-
      de consument heeft niet geprobeerd contact op te nemen met de betrokken ondernemer om zijn klacht te bespreken en
      te trachten het probleem in eerste instantie rechtstreeks met de ondernemer op te lossen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.b
    text: het geschil is van gering belang of vexatoir;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.c
    text: |-
      het geschil is reeds eerder door een andere instantie tot buitengerechtelijke geschillenbeslechting of door een
      rechter in behandeling genomen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.d
    text: de waarde van de vordering valt onder of boven een vooraf vaststaand drempelbedrag;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.e
    text: |-
      de consument heeft zijn klacht niet binnen een vooraf vaststaande termijn aan de instantie tot buitengerechtelijke
      geschillenbeslechting voorgelegd; deze termijn wordt niet bepaald op minder dan een jaar vanaf de datum waarop de
      consument een klacht bij de ondernemer indiende;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: 3.2.f
    text: |-
      de behandeling van een dergelijk geschil zou de effectieve werking van de instantie tot buitengerechtelijke
      geschillenbeslechting anderszins ernstig in het gedrang brengen.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: '3.3'
    text: |-
      Indien een instantie tot buitengerechtelijke geschillenbeslechting, overeenkomstig haar procesreglement, een
      geschil dat aan haar is voorgelegd niet in behandeling kan nemen, verstrekt deze instantie binnen drie weken na
      ontvangst van het volledige klachtdossier aan beide partijen een gemotiveerde toelichting van de redenen om het
      geschil niet in behandeling te nemen.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: '3.4'
    text: |-
      Procedurevoorschriften als bedoeld in lid 2 mogen de toegang van consumenten tot procedures tot buitengerechtelijke
      geschillenbeslechting niet aanzienlijk belemmeren.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel3
  - number: '4'
    text: 'De instantie tot buitengerechtelijke geschillenbeslechting:'
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: 4.a
    text: |-
      onderhoudt een geactualiseerde website die de partijen gemakkelijk toegang biedt tot informatie betreffende de
      procedure tot buitengerechtelijke geschillenbeslechting en consumenten in staat stelt om elektronisch een klacht in
      te dienen en de nodige bewijsstukken te verzenden;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: 4.b
    text: verstrekt de partijen op hun verzoek de in onderdeel a bedoelde informatie op een duurzame gegevensdrager;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: 4.c
    text: stelt de consument zo nodig in staat een klacht anders dan elektronisch in te dienen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: 4.d
    text: |-
      biedt de mogelijkheid tot uitwisseling van informatie tussen de partijen langs elektronische weg of, indien van
      toepassing, per post;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: 4.e
    text: |-
      neemt zowel binnenlandse als grensoverschrijdende geschillen in behandeling, met inbegrip van geschillen die vallen
      onder Verordening (EU) nr. 524/ 2013.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel4
  - number: '5.1'
    text: |-
      De noodzakelijke deskundigheid, onafhankelijkheid en onpartijdigheid van de met de buitengerechtelijke
      geschillenbeslechting belaste natuurlijke personen wordt gewaarborgd door de instantie tot buitengerechtelijke
      geschillenbeslechting, die ervoor zorg draagt dat die personen:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.1.a
    text: |-
      over de noodzakelijke kennis en vaardigheden beschikken op het gebied van buitengerechtelijke of gerechtelijke
      beslechting van consumentengeschillen, alsmede over een algemeen begrip van het recht;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.1.b
    text: |-
      worden aangewezen voor een ambtstermijn die voldoende lang is om de onafhankelijkheid van hun optreden te
      verzekeren en dat zij niet zonder geldige reden van hun taken kunnen worden ontheven;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.1.c
    text: niet gehouden zijn instructies van een van beide partijen of hun vertegenwoordigers aan te nemen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.1.d
    text: een vergoeding ontvangen die niet met de uitkomst van de procedure verband houdt;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.1.e
    text: |-
      de instantie tot buitengerechtelijke geschillenbeslechting onverwijld in kennis stellen van alle omstandigheden
      die van invloed kunnen zijn, of kunnen worden gezien als zijnde van invloed, op hun onafhankelijkheid en
      onpartijdigheid of aanleiding kunnen geven tot een belangenconflict met een van de partijen bij het geschil dat
      hun ter beslechting wordt voorgelegd. De verplichting tot openbaarmaking blijft gedurende de gehele procedure tot
      buitengerechtelijke geschillenbeslechting bestaan.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd [artikel 8 lid 2, onderdeel a][ref1], beschikken instanties tot buitengerechtelijke
      geschillenbeslechting ingeval sprake is van de in lid 1, onderdeel e, bedoelde omstandigheden over procedures die
      waarborgen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel8
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '8'
        hoofdstuk: '2'
  - number: 5.2.a
    text: |-
      de betrokken natuurlijke persoon wordt vervangen door een andere natuurlijke persoon die met het voeren van de
      procedure tot buitengerechtelijke geschillenbeslechting wordt belast; of als dat niet mogelijk is,
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.2.b
    text: |-
      de betrokken natuurlijke persoon ervan afziet de procedure tot buitengerechtelijke geschillenbeslechting te voeren
      en dat, indien mogelijk, de instantie tot buitengerechtelijke geschillenbeslechting de partijen voorstelt het
      geschil voor te leggen aan een andere instantie tot buitengerechtelijke geschillenbeslechting die bevoegd is om het
      geschil te behandelen; of als dat niet mogelijk is,
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: 5.2.c
    text: |-
      de omstandigheden ter kennis van de partijen worden gebracht en de betrokken natuurlijke persoon alleen toestemming
      heeft om de procedure tot buitengerechtelijke geschillenbeslechting voort te zetten indien de partijen, na in
      kennis te zijn gesteld van de omstandigheden en van hun recht bezwaar te maken, geen bezwaar hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: '5.3'
    text: |-
      Lid 1, onderdeel e, en lid 2, onderdeel a, zijn niet van toepassing op de instantie tot buitengerechtelijke
      geschillenbeslechting die uit één natuurlijke persoon bestaat.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: '5.4'
    text: |-
      De met de buitengerechtelijke geschillenbeslechting belaste natuurlijke personen die uitsluitend in dienst zijn van
      of uitsluitend een vergoeding ontvangen van een beroeps- of bedrijfsorganisatie waarvan de ondernemer betrokken in
      het geschil lid is, voldoen aan de vereisten van leden 1 en 5, en beschikken over een afzonderlijk, specifiek en
      voor de vervulling van hun taken toereikend budget. Dit lid is niet van toepassing indien de betrokken natuurlijke
      personen deel uitmaken van een collegiaal orgaan waarin een gelijk aantal vertegenwoordigers zitting heeft van de
      beroeps- of bedrijfsorganisatie waarbij zij in dienst zijn of waarvan zij een vergoeding ontvangen, enerzijds, en
      van consumentenorganisaties, anderzijds.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: '5.5'
    text: |-
      Instanties tot buitengerechtelijke geschillenbeslechting waar de met de geschillenbeslechting belaste
      natuurlijke personen deel uitmaken van een collegiaal orgaan, voorzien erin dat in dit orgaan een gelijk aantal
      vertegenwoordigers van consumentenbelangen en vertegenwoordigers van ondernemersbelangen zitting heeft.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
  - number: '5.6'
    text: |-
      Onze Minister die het aangaat houdt toezicht op eventuele opleidingsprogramma’s van de instanties tot
      buitengerechtelijke geschillenbeslechting ten behoeve van de met de buitengerechtelijke geschillenbeslechting
      belaste natuurlijke personen op basis van de informatie verstrekt op grond van [artikel 18, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel18
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      De instanties tot buitengerechtelijke geschillenbeslechting maken op hun website, op een duurzame gegevensdrager
      indien daarom wordt verzocht, en op elke andere wijze die zij geschikt, duidelijk en gemakkelijk te begrijpen
      achten, de volgende informatie voor het publiek toegankelijk:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.a
    text: hun contactgegevens, waaronder postadres en e-mailadres;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.b
    text: |-
      het feit dat instanties zijn opgenomen in de lijst volgens [artikel 19 lid 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel19
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '19'
        hoofdstuk: '5'
  - number: 6.1.c
    text: |-
      welke natuurlijke personen belast zijn met de geschillenbeslechting, hoe deze worden aangewezen en wat de duur van
      hun ambtstermijn is;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.d
    text: |-
      of zij, voor zover van toepassing, zijn aangesloten bij netwerken van instanties tot buitengerechtelijke
      geschillenbeslechting ter vergemakkelijking van de grensoverschrijdende geschillenbeslechting;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.e
    text: voor de behandeling van welke soorten geschillen zij bevoegd zijn, inclusief elke toepasselijke drempel;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.f
    text: |-
      welke procedurevoorschriften op de beslechting van een geschil van toepassing zijn en op welke gronden de instantie
      tot buitengerechtelijke geschillenbeslechting mag weigeren een gegeven geschil te behandelen overeenkomstig
      [artikel 3 lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel3
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.1.g
    text: |-
      in welke taal of talen klachten bij de instantie tot buitengerechtelijke geschillenbeslechting kunnen worden
      ingediend en in welke talen de procedure wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.h
    text: op welke soorten voorschriften de instantie zich bij de geschillenbeslechting kan baseren;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.i
    text: |-
      welke stappen de partijen eventueel vooraf moeten zetten voordat een procedure tot buitengerechtelijke
      geschillenbeslechting kan worden ingeleid, met inbegrip van een poging door de consument om met de ondernemer
      rechtstreeks tot een schikking van de zaak te komen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.j
    text: of de partijen zich uit de procedure kunnen terugtrekken;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.k
    text: |-
      welke kosten in voorkomend geval voor rekening van partijen komen, met inbegrip van de regels inzake de verwijzing
      in de kosten aan het einde van de procedure;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.l
    text: hoe lang de procedure gemiddeld duurt;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.m
    text: |-
      welke rechtsgevolgen de uitkomst van de procedure heeft, met inbegrip van de sancties op het niet-naleven in het
      geval van een beslissing met bindende werking voor de partijen, voor zover van toepassing;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.1.n
    text: in hoeverre, voor zover ter zake doend, de beslissing in een procedure ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: '6.2'
    text: |-
      Instanties tot buitengerechtelijke geschillenbeslechting maken op hun website, op een duurzame gegevensdrager
      indien daarom wordt verzocht, en op elke andere wijze die zij geschikt achten, jaarlijkse activiteitenverslagen
      voor het publiek toegankelijk. Deze verslagen bevatten de volgende informatie met betrekking tot zowel binnenlandse
      als grensoverschrijdende geschillen:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.a
    text: het aantal voorgelegde geschillen en de soorten klachten waarop zij betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.b
    text: |-
      eventuele systematische of aanzienlijke, veelvuldig voorkomende problemen die leiden tot geschillen tussen
      consumenten en ondernemers;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.c
    text: |-
      het percentage geschillen dat de instantie heeft geweigerd te behandelen en het procentuele aandeel van de soorten
      gronden voor weigering, bedoeld in [artikel 3 lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel3
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.d
    text: het procentuele aandeel van de procedures die zijn stopgezet en, voor zover bekend, de redenen van stopzetting;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.e
    text: de gemiddelde tijd die de beslechting van geschillen in beslag heeft genomen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.f
    text: voor zover bekend, het percentage van de gevallen waarin de uitkomsten van de procedures zijn nageleefd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: 6.2.g
    text: |-
      of er, voor zover van toepassing, sprake was van samenwerking binnen netwerken van instanties tot
      buitengerechtelijke geschillenbeslechting ter vergemakkelijking van de beslechting van grensoverschrijdende
      geschillen.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel6
  - number: '7'
    text: |-
      De instantie tot buitengerechtelijke geschillenbeslechting draagt er in haar procesreglement zorg voor dat de
      procedures tot buitengerechtelijke geschillenbeslechting doeltreffend zijn en voldoen aan de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: 7.a
    text: |-
      de procedure is zowel elektronisch als niet elektronisch beschikbaar en gemakkelijk toegankelijk voor beide
      partijen, ongeacht de plaats waar de partijen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: 7.b
    text: |-
      de partijen hebben toegang tot de procedure zonder verplicht te zijn van een advocaat of een juridisch adviseur
      gebruik te maken, maar de procedure ontneemt de partijen niet het recht om in enig stadium van de procedure
      onafhankelijk advies in te winnen of zich door een derde te laten vertegenwoordigen of te laten bijstaan;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: 7.c
    text: de procedure is voor consumenten kosteloos of tegen een geringe vergoeding beschikbaar;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: 7.d
    text: |-
      de instantie die een klacht heeft ontvangen, brengt de partijen bij het geschil op de hoogte zodra zij alle
      documenten met de relevante informatie over de klacht heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: 7.e
    text: |-
      de uitkomst van de procedure wordt beschikbaar gesteld binnen een termijn van 90 kalenderdagen vanaf de datum
      waarop de instantie tot buitengerechtelijke geschillenbeslechting het volledige dossier van de klacht heeft
      ontvangen. In het geval van zeer complexe geschillen kan de met de klacht belaste instantie de termijn van 90
      kalenderdagen verlengen. De partijen worden van elke verlenging van die termijn op de hoogte gesteld, alsmede van
      de tijd die nodig wordt geacht om het geschil te kunnen beëindigen.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel7
  - number: '8.1'
    text: |-
      De instantie tot buitengerechtelijke geschillenbeslechting draagt er in haar procesreglement zorg voor dat in
      procedures tot buitengerechtelijke geschillenbeslechting:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.1.a
    text: |-
      de partijen de mogelijkheid hebben om, binnen een redelijke termijn, hun standpunt kenbaar te maken, in kennis
      worden gesteld van alle argumenten, bewijsstukken, documenten en feiten die door de andere partij naar voren worden
      gebracht, alsmede van eventuele door deskundigen afgelegde verklaringen en ingenomen standpunten, en om daarop
      te reageren;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.1.b
    text: |-
      de partijen ervan in kennis worden gesteld dat zij niet verplicht zijn gebruik te maken van een advocaat of
      juridisch adviseur maar dat zij in elk stadium van de procedure onafhankelijk advies kunnen inwinnen of zich door
      een derde kunnen laten vertegenwoordigen of laten bijstaan;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.1.c
    text: |-
      de partijen schriftelijk of op een duurzame gegevensdrager van de uitkomst van de procedure in kennis worden
      gesteld, alsmede van de redenen waarop de uitkomst is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: '8.2'
    text: |-
      De instantie tot buitengerechtelijke geschillenbeslechting draagt er in haar procesreglement zorg voor dat in
      procedures die zijn gericht op beslechting van het geschil door het voorstellen van een oplossing:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.a
    text: |-
      partijen, voor de aanvang van de procedure in kennis worden gesteld van hun recht zich in elk stadium uit de
      procedure terug te trekken, indien zij ontevreden zijn over de wijze waarop de procedure verloopt of wordt gevoerd.
      Indien de ondernemer verplicht is deel te nemen aan procedures tot buitengerechtelijke geschillenbeslechting, geldt
      dit alleen voor de consument;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.b
    text: |-
      partijen, voordat zij met de voorgestelde oplossing instemmen of er gevolg aan geven, worden geïnformeerd over het
      feit dat:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.b.i
    text: zij de keuze hebben om al dan niet met de voorgestelde oplossing in te stemmen of er gevolg aan te geven;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.b.ii
    text: de deelname aan de procedure de mogelijkheid om zich tot de rechter te wenden onverlet laat;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.b.iii
    text: |-
      de voorgestelde oplossing kan verschillen van een door een rechter aan de hand van wettelijke regels bepaalde
      uitkomst;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.c
    text: |-
      partijen, voordat zij met een voorgestelde oplossing instemmen of er gevolg aan geven, worden geïnformeerd over de
      rechtsgevolgen hiervan;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: 8.2.d
    text: |-
      partijen, voordat zij met een voorgestelde oplossing of minnelijke schikking instemmen, voldoende tijd krijgen om
      over het voorstel na te denken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel8
  - number: '9.1'
    text: |-
      Een vóór het ontstaan van het geschil gesloten overeenkomst tussen een consument en een ondernemer om geschillen
      voor te leggen aan een instantie tot buitengerechtelijke geschillenbeslechting kan niet aan de consument worden
      tegengeworpen, indien die overeenkomst tot gevolg heeft dat de consument het recht wordt ontnomen zich voor de
      beslechting van het geschil tot de rechter te wenden. Van dit lid kan niet ten nadele van de consument worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel9
  - number: '9.2'
    text: |-
      Een beslissing, gegeven in een procedure tot buitengerechtelijke geschillenbeslechting, kan alleen bindend zijn
      voor partijen als partijen vooraf zijn geïnformeerd over het bindende karakter van de beslissing en zij daarmee
      uitdrukkelijk hebben ingestemd.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel9
  - number: '10.1'
    text: |-
      In procedures tot buitengerechtelijke geschillenbeslechting die erop gericht zijn het geschil te beslechten
      door aan de consument een oplossing op te leggen, mag de oplossing er niet toe leiden dat voor de consument de
      bescherming weg valt van:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel10
  - number: 10.1.a
    text: |-
      de bepalingen waarvan bij overeenkomst niet kan worden afgeweken op grond van het Nederlandse recht, indien de
      consument en de ondernemer hun gewone verblijfplaats respectievelijk plaats van vestiging in Nederland hebben;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel10
  - number: 10.1.b
    text: |-
      de bepalingen waarvan bij overeenkomst niet kan worden afgeweken op grond van het recht van de lidstaat waar de
      consument zijn gewone verblijfplaats heeft, indien het op de koopovereenkomst of overeenkomst tot het verrichten
      van diensten toepasselijke recht wordt bepaald overeenkomstig artikel 6 leden 1 en 2 van Verordening (EG) nr.
      593/2008;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel10
  - number: 10.1.c
    text: |-
      de dwingende bepalingen van het recht van de lidstaat waar de consument zijn gewone verblijfplaats heeft, indien
      het op de koopovereenkomst of overeenkomst tot het verrichten van diensten toepasselijke recht wordt bepaald
      overeenkomstig artikel 5 leden 1 tot en met 3 van het Verdrag van Rome van 19 juni 1980 inzake het recht dat van
      toepassing is op verbintenissen uit overeenkomst.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel10
  - number: '10.2'
    text: |-
      Op procedures tot buitengerechtelijke geschilbeslechting die beslecht worden door een vaststelling als bedoeld in
      [artikel 7: 900 van het Burgerlijk Wetboek][ref1] is [artikel 7: 902 van het Burgerlijk Wetboek][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel900
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel902
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '900'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '902'
  - number: '11.1'
    text: |-
      De verjaring van een rechtsvordering wordt gestuit door de aanvang van een procedure tot buitengerechtelijke
      geschillenbeslechting waarvan de uitkomst niet bindend is.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel11
  - number: '11.2'
    text: |-
      Door stuiting van de verjaring van een rechtsvordering als bedoeld in lid 1 begint een nieuwe verjaringstermijn te
      lopen met de aanvang van de dag volgend op de dag dat de procedure tot buitengerechtelijke geschillenbeslechting is
      geëindigd doordat een van de partijen of de instantie tot buitengerechtelijke geschillenbeslechting aan de andere
      partij schriftelijk heeft meegedeeld dat de procedure tot buitengerechtelijke geschillenbeslechting is geëindigd
      of doordat in de procedure tot buitengerechtelijke geschillenbeslechting gedurende een periode van zes maanden door
      geen van de partijen enige handeling is verricht. De nieuwe verjaringstermijn is gelijk aan de oorspronkelijke,
      doch niet langer dan drie jaar. Niettemin treedt de verjaring in geen geval op een eerder tijdstip in dan dat
      waarop ook de oorspronkelijke termijn zonder stuiting zou zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel11
  - number: '12.1'
    text: |-
      Een in Nederland gevestigde ondernemer informeert de consument over de instantie tot buitengerechtelijke
      geschillenbeslechting waaronder hij valt, indien hij zich ertoe verbindt of verplicht is gebruik te maken van deze
      instantie. De informatie omvat het website-adres van de betrokken instantie.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel12
  - number: '12.2'
    text: |-
      De in lid 1 bedoelde informatie is op duidelijke, begrijpelijke en eenvoudige wijze toegankelijk op de website van
      de ondernemer, voor zover hij over een website beschikt, en, in voorkomend geval, in de algemene voorwaarden van
      tussen de ondernemer en een consument gesloten koopovereenkomst of overeenkomst tot het verrichten van diensten.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel12
  - number: '12.3'
    text: |-
      Wanneer het niet mogelijk is gebleken een geschil tussen een consument en een in Nederland gevestigde ondernemer
      naar aanleiding van een rechtstreeks door de consument bij de ondernemer ingediende klacht te beslechten, verstrekt
      de ondernemer de in lid 1 bedoelde informatie aan de consument en vermeldt hij daarbij of hij voor het beslechten
      van het geschil gebruik zal maken van de relevante instantie tot buitengerechtelijke geschillenbeslechting. Deze
      informatie wordt op papier of op een andere duurzame drager verstrekt.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel12
  - number: '13'
    text: |-
      Het Europees Consumenten Centrum staat consumenten bij om in geschillen die voortvloeien uit grensoverschrijdende
      koopovereenkomsten of overeenkomsten tot het verrichten van diensten toegang te verkrijgen tot instanties tot
      buitengerechtelijke geschillenbeslechting die in een andere lidstaat bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel13
  - number: '14.1'
    text: |-
      De instanties tot buitengerechtelijke geschillenbeslechting en het Europees Consumenten Centrum maken de in
      artikel 20 lid 4 van de [Richtlijn 2013/11](32013L0011) EU bedoelde lijst van instanties tot buitengerechtelijke
      geschillenbeslechting voor het publiek toegankelijk. Dit geschiedt door middel van een link op hun website naar de
      website van de Europese Commissie, en voor zover mogelijk, op een duurzame gegevensdrager in hun ruimten.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister die het aangaat bevordert dat betrokken consumenten- en bedrijfsorganisaties de lijst, genoemd in lid
      1, eveneens voor het publiek toegankelijk maken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister die het aangaat bevordert de samenwerking tussen de instanties tot buitengerechtelijke
      geschillenbeslechting en de nationale instanties belast met de handhaving van rechtshandelingen van de Unie inzake
      consumentenbescherming.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel15
  - number: '15.2'
    text: |-
      De samenwerking, genoemd in lid 1, omvat in het bijzonder de uitwisseling van gegevens over praktijken in
      specifieke bedrijfssectoren waarover er herhaaldelijk klachten van consumenten zijn binnengekomen. Zij omvat
      tevens de terbeschikkingstelling door die nationale instanties aan de instanties tot buitengerechtelijke
      geschillenbeslechting van technische evaluaties en informatie, wanneer die voor de afhandeling van individuele
      geschillen noodzakelijk zijn en zij reeds beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel15
  - number: '15.3'
    text: |-
      Dit artikel doet geen afbreuk aan bepalingen betreffende het beroeps- en bedrijfsgeheim die van toepassing
      zijn op nationale instanties welke belast zijn met de handhaving van de rechtshandelingen van de Unie inzake
      consumentenbescherming. Voor de instanties tot buitengerechtelijke geschillenbeslechting gelden de voorschriften
      inzake het beroepsgeheim of een gelijkwaardige geheimhoudingsplicht zoals die gelden op grond van het nationale
      recht.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister die het aangaat kan een instantie aanwijzen als instantie tot buitengerechtelijke
      geschillenbeslechting als bedoeld in deze wet of een aanwijzing intrekken. Van een besluit tot aanwijzing of
      intrekking van een aanwijzing wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister die het aangaat is Onze Minister van Veiligheid en Justitie, indien de verplichtingen uit dit
      hoofdstuk betrekking hebben op de Stichting Geschillencommissies Consumentenzaken.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel16
  - number: '16.3'
    text: |-
      Onze Minister die het aangaat doet van een aanwijzing of van een intrekking van een aanwijzing als bedoeld in lid 1
      onverwijld mededeling aan Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister van Veiligheid en Justitie stelt de Europese Commissie in kennis van de aanwijzing van een instantie
      tot buitengerechtelijke geschillenbeslechting en van de intrekking van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel16
  - number: '17.1'
    text: |-
      Instanties die voor aanwijzing als instantie tot buitengerechtelijke geschillenbeslechting in aanmerking wensen te
      komen, doen hiertoe een aanvraag bij Onze Minister die het aangaat, onder verstrekking van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.a
    text: hun naam, contactgegevens en internetadres;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.b
    text: |-
      informatie over hun structuur en financiering, met inbegrip van informatie over de natuurlijke personen die zijn
      belast met de buitengerechtelijke geschillenbeslechting, over hun vergoeding, over hun ambtstermijn en over hun
      werkgever;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.c
    text: hun procedurevoorschriften;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.d
    text: de verschuldigde vergoedingen, indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.e
    text: de gemiddelde duur van de procedures tot buitengerechtelijke geschillenbeslechting;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.f
    text: de taal of talen waarin klachten kunnen worden ingediend en de procedure kan worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.g
    text: een verklaring betreffende de soorten geschillen waarvoor de procedure geldt;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: 17.1.h
    text: |-
      de gronden waarop de instantie tot buitengerechtelijke geschillenbeslechting mag weigeren een gegeven geschil in
      behandeling te nemen overeenkomstig [artikel 3 lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel3
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '3'
        hoofdstuk: '2'
  - number: 17.1.i
    text: |-
      een met redenen omklede verklaring of de instantie kan worden gekwalificeerd als een instantie tot
      buitengerechtelijke geschillenbeslechting in de zin van deze wet en of zij voldoet aan de in [hoofdstuk 2][ref1]
      gestelde kwaliteitseisen;


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0036550
        hoofdstuk: '2'
  - number: 17.1.j
    text: |-
      indien van toepassing, documenten op grond waarvan Onze Minister die het aangaat kan beoordelen of de instantie
      voldoet aan andere vereisten, die op grond van andere nationale regelgeving op haar van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister die het aangaat beoordeelt op basis van de in lid 1 verstrekte informatie of een instantie in
      aanmerking komt voor een aanwijzing als bedoeld in [artikel 16 lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel16
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Indien de informatie, genoemd in lid 1, onderdeel a tot en met h, wijzigingen ondergaat, delen de instanties tot
      buitengerechtelijke geschillenbeslechting deze wijzigingen onverwijld mee aan Onze Minister die het aangaat. Onze
      Minister die het aangaat deelt deze wijzigingen mee aan Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: '17.4'
    text: |-
      Indien een instantie tot buitengerechtelijke geschillenbeslechting niet langer voldoet aan de eisen op grond
      van [hoofdstuk 2][ref1] of [artikel 17 lid 1, onderdeel j][ref2], verzoekt Onze Minister die het aangaat deze
      instantie gemotiveerd en schriftelijk om binnen een termijn van drie maanden alsnog aan deze eisen te voldoen.
      Indien de instantie na drie maanden in gebreke blijft, trekt Onze Minister die het aangaat de aanwijzing geheel of
      gedeeltelijk in.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0036550#Artikel17
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0036550
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036550
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '17.5'
    text: |-
      Indien een instantie tot buitengerechtelijke geschillenbeslechting niet langer voldoet aan de eisen op grond
      van artikel 9 lid 7 en artikel 10 van Verordening (EU) nr. 524/2013, verzoekt Onze Minister die het aangaat deze
      instantie gemotiveerd en schriftelijk om binnen een termijn van drie maanden alsnog aan deze eisen te voldoen.
      Indien de instantie na drie maanden in gebreke blijft, trekt Onze Minister die het aangaat de aanwijzing geheel of
      gedeeltelijk in.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel17
  - number: '18'
    text: |-
      Instanties tot buitengerechtelijke geschillenbeslechting verstrekken aan Onze Minister die het aangaat ten minste
      iedere twee jaar de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.a
    text: het aantal voorgelegde geschillen en het soort klachten waarop zij betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.b
    text: het procentuele aandeel procedures die zonder uitkomst zijn stopgezet;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.c
    text: de gemiddelde tijd die nodig was voor de beslechting van de voorgelegde geschillen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.d
    text: voor zover bekend, het percentage gevallen waarin de uitkomsten van de procedures zijn nageleefd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.e
    text: |-
      eventuele systematische of aanzienlijke, veelvoorkomende problemen die leiden tot geschillen tussen consumenten
      en ondernemers;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.f
    text: |-
      in voorkomend geval, een beoordeling van de doeltreffendheid van hun samenwerking binnen netwerken van instanties
      tot buitengerechtelijke geschillenbeslechting ter vergemakkelijking van de beslechting van grensoverschrijdende
      geschillen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: 18.g
    text: |-
      in voorkomend geval, de opleiding die overeenkomstig [artikel 5 lid 6][ref1] aan met de geschillenbeslechting
      belaste natuurlijke personen wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel5
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '5'
        hoofdstuk: '2'
  - number: 18.h
    text: |-
      een evaluatie van de doeltreffendheid van de door de instantie aangeboden procedure en van de mogelijke manieren om
      de prestaties daarvan te verbeteren.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister van Veiligheid en Justitie stelt een lijst op van de op grond van [artikel 16 lid 1][ref1] aangewezen
      instanties tot buitengerechtelijke geschillenbeslechting. Deze lijst bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel16
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 19.1.a
    text: de naam, contactgegevens en internetadressen van de betreffende instanties;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.b
    text: de verschuldigde vergoedingen, indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.c
    text: de taal of talen waarin klachten kunnen worden ingediend en de procedure kan worden gevoerd;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.d
    text: de soorten geschillen waarvoor de procedure geldt;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.e
    text: de door elke instantie bestreken sectoren en soorten geschillen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.f
    text: |-
      indien van toepassing, de noodzaak dat partijen of hun vertegenwoordigers fysiek aanwezig zijn, met inbegrip van
      een verklaring van de instantie tot buitengerechtelijke geschillenbeslechting over het feit of de procedure een
      mondelinge of schriftelijke procedure is of kan zijn;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.g
    text: de al dan niet bindende aard van de uitkomst van de procedure; en
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
  - number: 19.1.h
    text: |-
      de gronden waarop de instantie mag weigeren een gegeven geschil in behandeling te nemen overeenkomstig
      [artikel 3 lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel3
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '3'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Onze Minister van Veiligheid en Justitie deelt de in lid 1 genoemde lijst, alsmede wijzigingen hiervan op grond van
      [artikel 17 lid 3][ref1] mee aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel17
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Onze Minister van Veiligheid en Justitie, maakt de lijst, genoemd in artikel 20 lid 4 van de [Richtlijn 2013/11]
      (32013L0011)/EU op zijn website voor het publiek beschikbaar door middel van een link naar de website van de
      Europese Commissie. Daarnaast maakt Onze Minister die het aangaat deze lijst op een duurzame gegevensdrager voor
      het publiek beschikbaar.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister die het aangaat, maakt op uiterlijk 9 juli 2018 en vervolgens om de vier jaar een verslag over de
      ontwikkeling en het functioneren van de instanties tot buitengerechtelijke geschillenbeslechting en stuurt dit
      aan Onze Minister van Veiligheid en Justitie. Onze Minister van Veiligheid en Justitie maakt dit verslag bekend en
      geleidt het door aan de Europese Commissie. In het verslag worden met name:
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel20
  - number: 20.2.a
    text: de beste praktijken van de betreffende instanties aangegeven;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel20
  - number: 20.2.b
    text: |-
      in voorkomend geval en onderbouwd met statistische gegevens, de tekortkomingen aangeduid die een belemmering vormen
      voor het functioneren van de instanties, voor zowel binnenlandse als grensoverschrijdende geschillen;
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel20
  - number: 20.2.c
    text: |-
      in voorkomend geval, aanbevelingen gedaan voor het verbeteren van het doeltreffende en doelmatige functioneren van
      de instanties.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel20
  - number: '23'
    text: |-
      [Hoofdstuk 2][ref1] van deze wet is van toepassing op procedures tot buitengerechtelijke geschillenbeslechting
      die bij een instantie tot buitengerechtelijke geschillenbeslechting aanhangig zijn geworden op of na de datum van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036550
        hoofdstuk: '2'
  - number: '24'
    text: |-
      Deze wet treedt in werking op 9 juli 2015. Wordt het Staatsblad waarin deze wet wordt geplaatst later uitgegeven
      dan 8 juli 2015, dan treedt zij in werking op de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Implementatiewet buitengerechtelijke geschillenbeslechting consumenten.'
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel25
