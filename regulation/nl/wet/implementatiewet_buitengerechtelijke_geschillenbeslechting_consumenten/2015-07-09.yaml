preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is te voorzien in wettelijke regels om uitvoering
    te geven aan Richtlijn 2013/11/EU van het Europees parlement en de Raad van 21 mei 2013 betreffende alternatieve
    beslechting van consumentengeschillen en tot wijziging van Verordening (EG) nr. 2006/2004 en Richtlijn 2009/22/
    EG (PbEU 2013, L165) alsmede aan Verordening (EU) Nr. 524/2013 van het Europees parlement en de Raad van 21 mei
    2013 betreffende onlinebeslechting van consumentengeschillen en tot wijziging van Verordening (EG) nr. 2006/2004 en
    Richtlijn 2009/22/EG (PbEU 2013, L165);

    Zo is het, dat Wij, de Afdeling Advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: - *consument:* iedere natuurlijke persoon die handelt voor doeleinden die buiten
      zijn handels-, bedrijfs-, ambachts- of beroepsactiviteit vallen;
        - *ondernemer:* iedere natuurlijke of rechtspersoon die handelt in het kader van zijn handels-, bedrijfs-,
      ambachts- of beroepsactiviteit, al dan niet mede via een andere persoon die namens hem of voor zijn rekening
      optreedt;
        - *koopovereenkomst:* de overeenkomst, bedoeld in [artikel 1 van Boek 7 Burgerlijk Wetboek][ref1], die wordt
      gesloten tussen een consument en een ondernemer, met inbegrip van elke overeenkomst die zowel goederen als diensten
      betreft;
        - *overeenkomst tot het verrichten van diensten:* iedere andere overeenkomst dan een koopovereenkomst, waarbij
      de ondernemer zich jegens de consument verbindt een dienst te verrichten en de consument zich verbindt de prijs
      daarvan te betalen;
        - *binnenlands geschil:* een geschil dat voortvloeit uit een koopovereenkomst of een overeenkomst tot het
      verrichten van diensten, wanneer de consument, op het tijdstip waarop de overeenkomst is gesloten, woonachtig is in
      dezelfde lidstaat als die waar de ondernemer is gevestigd;
        - *grensoverschrijdend geschil:* een geschil dat voortvloeit uit een koopovereenkomst of een overeenkomst tot het
      verrichten van diensten, wanneer de consument, op het tijdstip waarop de overeenkomst is gesloten, woonachtig is in
      een andere lidstaat dan die waar de ondernemer is gevestigd;
        - *procedure tot buitengerechtelijke geschillenbeslechting:* een procedure als bedoeld in [artikel 2][ref2] die
      voldoet aan de vereisten van deze wet en door een instantie tot buitengerechtelijke geschillenbeslechting in de zin
      van deze wet wordt uitgevoerd;
        - *instantie tot buitengerechtelijke geschillenbeslechting:* een in Nederland gevestigde instantie, ongeacht de
      benaming, die op duurzame basis is opgericht en de beslechting van een geschil door middel van een procedure tot
      buitengerechtelijke geschillenbeslechting aanbiedt en die is aangewezen op grond van [artikel 16 lid 1][ref3];
        - *Onze Minister die het aangaat:* Onze Minister op wiens beleidsterrein het onderwerp van geschil ligt.
        - *duurzame gegevensdrager:* ieder hulpmiddel dat de consument of de ondernemer in staat stelt om persoonlijk aan
      hem gerichte informatie op te slaan op een wijze die deze informatie toegankelijk maakt voor toekomstig gebruik
      gedurende een periode die is aangepast aan het doel waarvoor de informatie is bestemd, en die een ongewijzigde
      weergave van de opgeslagen informatie mogelijk maakt;
        - *Richtlijn 2013/11/ EU:* [richtlijn 2013/11](32013L0011)/EU van het Europees parlement en de Raad van 21 mei 2013
      betreffende alternatieve geschillenbeslechting van consumentengeschillen en tot wijziging van [Verordening (EG) nr.
      2006/2004](32004R2006) en [Richtlijn nr. 2009/22/EG](32009L0022) (PbEU 2013, L165);
        - *Verordening (EU) nr. 524/2013:* verordening (EU) nr. 524/ 2013 van het Europees parlement en de Raad van 21 mei
      2013 betreffende onlinebeslechting van consumentengeschillen en tot wijziging van [Verordening (EG) nr. 2006/2004]
      (32004R2006) en [Richtlijn 2009/22/EG](32009L0022) (PbEU 2013, L165).


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036550#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0036550#Artikel16
    url: https://wetten.overheid.nl/BWBR0036550/2015-07-09#Artikel1
    references:
