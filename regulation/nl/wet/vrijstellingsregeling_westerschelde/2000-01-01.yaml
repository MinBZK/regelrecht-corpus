$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vrijstellingsregeling_westerschelde
regulatory_layer: WET
publication_date: '2006-12-19'
valid_from: '2000-01-01'
bwb_id: BWBR0007183
url: https://wetten.overheid.nl/BWBR0007183/2000-01-01
preamble:
  text: |-
    Gelet op artikel 3, eerste lid, onder a, en artikel 6d van het Reglement zee- en kustvisserij 1977;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *motorvermogen:*


              vermogen als bedoeld in artikel 5 van [verordening (EEG) nr. 2930/86](31986R2930) van de Raad van de
      Europese Gemeenschappen van 22 september 1986 houdende definities van de kenmerken van vissersvaartuigen (PbEG
      L 274);





              *riviervisserij:*


              visserij die op de Westerschelde ten oosten van de lijn van de lichtopstand de Nolle nabij Vlissingen naar
      de lichtopstand Nieuwe Sluis in Zeeuws Vlaanderen wordt uitgeoefend;





              *vaartuig:*


              vaartuig met een lengte over alles van minder dan 20 meter en met een motorvermogen van ten hoogste 221 kW
      waarmee uitsluitend de riviervisserij wordt uitgeoefend;





              *ondernemer:*


              degene te wiens naam het vaartuig in de Officiële lijst der Belgische Vissersvaartuigen, bedoeld in het
      ministeriële besluit van 21 februari 1934, is geregistreerd;





              *functionaris:*


              functionaris als bedoeld in artikel 1 van de Regeling stelselmatige controle bij aanlanding 1988.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel1
  - number: '2.1'
    text: |-
      Van [artikel 6c, eerste lid, van het Reglement zee- en kustvisserij 1977][ref1] wordt aan ondernemers vrijstelling
      verleend voor het uitoefenen van de riviervisserij met de boomkor met vaartuigen, alsmede voor het aan boord van
      zodanige vaartuigen aanwezig hebben van een boomkor.


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel6c
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003144
        artikel: 6c
  - number: '2.2'
    text: 'De in het eerste lid bedoelde vrijstelling wordt slechts verleend voor vaartuigen:'
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel2
  - number: 2.2.a
    text: |-
      met ten hoogste twee boomkorren waarvan de individuele lengte niet meer bedraagt dan 4.5 meter, gemeten tussen
      de uiteinden van de constructie, zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden
      uitgeschoven of verlengd en
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel2
  - number: 2.2.b
    text: |-
      waarvan de ondernemer beschikt over een akte van consent afgegeven door het Waterschoutsambt te Antwerpen voor
      de visserij op de Westerschelde als bedoeld in het Reglement van 20 mei 1843 ter uitvoering van artikel 9 van het
      Verdrag van 19 april 1839 betreffende de uitoefening van het recht der visscherij en van den vischhandel.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van onderdeel a van het tweede lid wordt voor de gerichte riviervisserij op garnalen de vrijstelling,
      bedoeld in het eerste lid, verleend voor vaartuigen met ten hoogste twee boomkorren waarvan de individuele lengte
      niet meer bedraagt dan 12 meter, gemeten tussen de uiteinden van de constructie, zonder dat er voorzieningen zijn
      getroffen waardoor de boomkor kan worden uitgeschoven of verlengd.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel2
  - number: '3.1'
    text: |-
      Aan de in [artikel 2][ref1] bedoelde vrijstelling worden de volgende voorschriften verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0007183#Artikel2
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007183
        artikel: '2'
  - number: 3.1.a
    text: |-
      [Verordening (EG) nr. 850/98](31998R0850) van de Raad van de Europese Unie van 30 maart 1998 voor de instandhouding
      van visbestanden via technische maatregelen voor de bescherming van jonge exemplaren van mariene organismen (PbEG
      L125) wordt met uitzondering van artikel 29 bij de uitoefening van de visserij in acht genomen;
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
  - number: 3.1.b
    text: |-
      aanlandingen in Nederlandse havens vinden slechts overeenkomstig de Regeling stelselmatige controle bij aanlanding
      1988 plaats;
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
  - number: 3.1.c
    text: |-
      bij aanlanding in een Nederlandse haven is de ondernemer verplicht onverwijld maar uiterlijk binnen een half uur na
      aanlanding per vissoort opgave van de vangsthoeveelheden te doen.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
  - number: '3.2'
    text: |-
      De opgave, bedoeld in onderdeel c van het eerste lid, vindt plaats door middel van het indienen van het logboek-,
      tevens vangstopgaveformulier, bedoeld in bijlage I van [verordening (EEG) nr. 2807/83](31983R2807) van de Commissie
      van de Europese Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van
      gegevens over de visvangst van de Lid-Staten (PbEG L 276), waarop per vissoort de vangsthoeveelheden in het
      gedeelte van het formulier dat betrekking heeft op de aangifte van aanvoer, zijn ingevuld.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het indienen van het logboek-, tevens vangstopgaveformulier vindt plaats door overhandiging aan een functionaris
      of aan een ambtenaar van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij of
      deponering van het formulier in een opgavebus als bedoeld in de Beschikking plaatsing opgavebussen.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel3
  - number: '4'
    text: |-
      Vaartuigen ten aanzien waarvan vrijstelling is verleend, worden vermeld op een als bijlage bij deze regeling
      opgenomen lijst die op voordracht van het Bestuur van de Maritieme Zaken en van de Scheepvaart van het Ministerie
      van Verkeer en Infrastructuur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst. Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel5
  - number: '6'
    text: 'Deze regeling kan worden aangehaald als: Vrijstellingsregeling Westerschelde.'
    url: https://wetten.overheid.nl/BWBR0007183/2000-01-01#Artikel6
