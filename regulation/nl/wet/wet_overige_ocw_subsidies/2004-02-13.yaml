---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_overige_ocw_subsidies
regulatory_layer: WET
publication_date: '2018-11-22'
valid_from: '2004-02-13'
bwb_id: BWBR0009458
url: https://wetten.overheid.nl/BWBR0009458/2004-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het noodzakelijk maakt een wettelijk kader te scheppen voor de verstrekking van subsidies op de beleidsterreinen
    van Onze Minister van Onderwijs, Cultuur en Wetenschappen, voorzover een dergelijk kader ontbreekt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap,'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel1
  - number: 1.b
    text: 'projectsubsidie: subsidie die anders dan per boekjaar wordt verstrekt.'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel1
  - number: '2.1'
    text: 'Onze Minister kan subsidie verstrekken voor activiteiten die passen in het regeringsbeleid inzake:'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel2
  - number: 2.1.a
    text: het onderwijs,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel2
  - number: 2.1.b
    text: het onderzoek,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel2
  - number: 2.1.c
    text: de cultuur.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel2
  - number: '2.2'
    text: |-
      Bij de subsidieverstrekking aan onderwijsinstellingen wordt geen onderscheid gemaakt tussen openbaar en bijzonder
      onderwijs en wordt voorzien in een behandeling van die instellingen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel2
  - number: '3.1'
    text: |-
      Deze wet is niet van toepassing op subsidie die Onze Minister verstrekt krachtens een andere wet, behoudens
      de tweede volzin en het tweede lid. De [artikelen 4 tot en met 19][ref1] zijn van toepassing op subsidie
      die Onze Minister verstrekt krachtens de [artikelen 70 van de Wet op het primair onderwijs][ref2],
      [71 van de Wet op de expertisecentra][ref3], [46, vierde lid][ref4], [47, vierde lid][ref5], en
      [75d van de Wet op het voortgezet onderwijs][ref6] en [2.7 van de Wet educatie en beroepsonderwijs][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel75d
      [ref7]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '70'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '71'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '46'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '47'
      - id: ref6
        bwb_id: BWBR0002399
        artikel: 75d
      - id: ref7
        bwb_id: BWBR0007625
        artikel: '2'
  - number: '3.2'
    text: |-
      Onze Minister kan in afwijking van een andere wet als bedoeld in het eerste lid, in dringende gevallen subsidie
      op grond van deze wet verstrekken ten behoeve van extra activiteiten van bepaalde omvang en duur of extra
      voorzieningen, een en ander gericht op een specifieke bestemming der middelen. Verstrekking van subsidie
      als bedoeld in de eerste volzin, vindt slechts plaats indien die subsidie incidenteel van aard is of de
      subsidieverstrekking vooruitloopt op de totstandkoming van wetgeving terzake. Deze subsidieverstrekking geschiedt
      dan:
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
  - number: 3.2.a
    text: op grond van een algemene maatregel van bestuur of een ministeriële regeling,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
  - number: 3.2.b
    text: voor ten hoogste vier jaren, en
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
  - number: 3.2.c
    text: |-
      voorzover het betreft onderwijsinstellingen zonder onderscheid tussen openbaar en bijzonder onderwijs en met
      behandeling van die instellingen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
  - number: '3.3'
    text: |-
      De in het tweede lid bedoelde algemene maatregel van bestuur of ministeriële regeling wordt aan de beide kamers
      der Staten-Generaal overgelegd. De algemene maatregel van bestuur of ministeriële regeling treedt niet in werking
      dan nadat vier weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens een der kamers
      de wens wordt te kennen gegeven dat het in die algemene maatregel van bestuur of ministeriële regeling geregelde
      onderwerp bij wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
  - number: '3.4'
    text: |-
      In geval van subsidieverstrekking als bedoeld in het tweede lid is [artikel 4, derde lid, onder c][ref1], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling, tenzij het een subsidie betreft:
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.1.a
    text: |-
      als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.1.b
    text: waarvan de voorgenomen verstrekking tevoren is meegedeeld aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: '4.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen de activiteiten waarvoor
      subsidie kan worden verstrekt, nader worden bepaald, alsmede de criteria voor die verstrekking worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: '4.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur of bij ministeriële regeling kunnen voorts regels worden gesteld
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.a
    text: de aanvraag van een subsidie en de besluitvorming daarover,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.c
    text: delegatie van de bevoegdheid besluiten te nemen met betrekking tot de subsidie,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.d
    text: de voorwaarden waaronder de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.e
    text: de verplichtingen van de subsidieontvanger,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.f
    text: de vaststelling van de subsidie,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.g
    text: intrekking en wijziging van de subsidieverlening of subsidievaststelling,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.h
    text: de betaling van de subsidie en het verlenen van voorschotten,
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.i
    text: |-
      het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in artikel 4:24 van de
      Algemene wet bestuursrecht, of
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: 4.3.j
    text: andere criteria voor de verstrekking van subsidie.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: '4.4'
    text: |-
      Indien subsidie wordt verleend op grond van het eerste lid, onder a of b, kan Onze Minister bij de
      subsidieverlening een termijn vaststellen waarbinnen op de aanvraag tot vaststelling van de subsidie wordt beslist.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan een subsidieplafond vaststellen voor de verschillende activiteiten waarvoor op grond van deze wet
      subsidie kan worden verstrekt. Hij bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel5
  - number: '6'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7'
    text: Onze Minister kan voorschotten op een subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel7
  - number: '8'
    text: |-
      Indien Onze Minister subsidie verstrekt voor activiteiten die mede door andere bestuursorganen worden
      gesubsidieerd, kan Onze Minister afwijken van de bij of krachtens deze wet aan de subsidie te verbinden
      verplichtingen, voorzover
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel8
  - number: 8.a
    text: |-
      dit wenselijk is met het oog op een goede afstemming met de door die andere bestuursorganen opgelegde of op te
      leggen verplichtingen, en
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel8
  - number: 8.b
    text: |-
      daardoor het belang met het oog waarop die verplichtingen zouden moeten worden opgelegd, niet onevenredig wordt
      geschaad.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel8
  - number: '9.1'
    text: |-
      Een aanvraag kan worden afgewezen en een beschikking tot subsidieverstrekking op grond van deze wet kan worden
      ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd zou zijn respectievelijk in strijd is met
      ingevolge een verdrag voor de staat geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel9
  - number: '9.2'
    text: |-
      Bij de intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel9
  - number: '9.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel9
  - number: '9.4'
    text: |-
      [Artikel 4:50, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.5'
    text: |-
      De [artikelen 4:49, derde lid][ref1], en [4:57 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op
      de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.1'
    text: |-
      Onze Minister kan voor door hem verstrekte subsidies bij besluit een of meer toezichthouders aanwijzen, die zijn
      belast met het toezicht op de naleving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel10
  - number: '10.2'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel10
  - number: '10.3'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '11.1'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing op de door Onze Minister per boekjaar
      verstrekte subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '11.2'
    text: |-
      Indien de aard van de subsidie of de hoogte van het bedrag van de subsidie daartoe aanleiding geeft, kan van
      het eerste lid vrijstelling of ontheffing worden verleend. Vrijstelling wordt verleend bij of krachtens algemene
      maatregel van bestuur of bij ministeriële regeling. Ontheffing wordt verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel11
  - number: '11.3'
    text: Onze Minister kan het boekjaar gelijk stellen aan een andere periode van een jaar dan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel11
  - number: '12'
    text: |-
      Bij subsidies voor langer dan een boekjaar vormt de ontvanger een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1]. Bij de subsidieverlening kan de omvang van de
      egalisatiereserve in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.1'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt de accountant
      tevens de naleving van de aan de subsidie verbonden verplichtingen, overeenkomstig een door Onze Minister vast te
      stellen aanwijzing over de reikwijdte en de intensiteit van de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.2'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      accountantsdienst in te stellen onderzoeken naar de door de accountant verrichte werkzaamheden. De daaraan
      verbonden kosten worden geacht te zijn begrepen in de subsidie.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel13
  - number: '14.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], legt Onze Minister
      een door hem te bepalen vergoedingsplicht op.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '14.2'
    text: |-
      Bij de vaststelling van de hoogte van de vergoeding worden activa gewaardeerd op hun actuele waarde. De
      waardebepaling van een onroerende zaak geschiedt door drie deskundigen. Onze Minister onderscheidenlijk de
      subsidieontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel14
  - number: '14.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de activiteiten van de subsidieontvanger door een derde worden
      voortgezet en de activa en passiva met toestemming van Onze Minister tegen boekwaarde aan die derde worden
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel14
  - number: '16.1'
    text: 'De aanvraag omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel16
  - number: 16.1.a
    text: een omschrijving van de activiteiten en de daarmee beoogde doelstellingen, en
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel16
  - number: 16.1.b
    text: een overzicht van de aan de activiteiten verbonden begrote inkomsten en uitgaven van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel16
  - number: '16.2'
    text: |-
      Voorzover de aanvrager van een projectsubsidie voor dezelfde begrote uitgaven tevens subsidie heeft aangevraagd bij
      een of meer andere bestuursorganen, organen van internationale organisaties, natuurlijke of rechtspersonen dan wel
      van derden, doet hij daarvan mededeling in de aanvraag, onder vermelding van de stand van zaken met betrekking tot
      de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel16
  - number: '17.1'
    text: |-
      De subsidieontvanger voert een zodanig ingerichte administratie, dat daaruit te allen tijde de voor de vaststelling
      van de subsidie van belang zijnde rechten en verplichtingen alsmede de betalingen en ontvangsten kunnen worden
      nagegaan.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel17
  - number: '17.2'
    text: De administratie en de daartoe behorende bescheiden worden gedurende zeven jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel17
  - number: '18'
    text: |-
      De aanvraag omvat in elk geval een activiteitenverslag als bedoeld in
      [artikel 4:80 van de Algemene wet bestuursrecht][ref1] en een financiële verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '19.1'
    text: De financiële verantwoording sluit aan op de begroting waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel19
  - number: '19.2'
    text: Verschillen tussen begroting en realisatie worden toegelicht, tenzij deze van geringe betekenis zijn.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel19
  - number: '21'
    text: |-
      Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verleend of
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel21
  - number: '22'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Wet overige OCenW-subsidies.'
    url: https://wetten.overheid.nl/BWBR0009458/2004-02-13#Artikel23
