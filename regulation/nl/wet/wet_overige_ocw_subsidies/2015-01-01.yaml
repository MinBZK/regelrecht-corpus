  - number: 19a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in
      [artikel 1 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], heeft
      tot taak te bevorderen dat belemmeringen worden weggenomen die de ingezetene, bedoeld in
      [artikel 1:2 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], vanwege ziekte of gebrek
      ondervindt bij het volgen van onderwijs, indien het een persoon betreft die:

      a. jonger is dan 17 jaar;

      b. studerende is als bedoeld in [artikel 1:4 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];

      c. jonger is dan 30 jaar en uitsluitend vanwege zijn ziekte of gebrek niet kan worden aangemerkt als studerende
      bedoeld in [artikel 1:4 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van degene, bedoeld in het eerste lid,
      toekennen:

      a. voorzieningen die hem in staat stellen onderwijs te volgen, en

      b. vervoersvoorzieningen die de leefomstandigheden van hem verbeteren en die samenhangen met de voorzieningen,
      bedoeld in onderdeel a.

      3 De [artikelen 3:18][ref5], [3:33][ref6], [3:56][ref7], [3:57][ref8], [3:58][ref9], [3:62][ref10] en
      [3:74 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref11] zijn van overeenkomstige toepassing op
      voorzieningen bedoeld in het tweede lid.

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan geen tegemoetkoming in de kosten van kinderopvang toekennen.

      5 Beschikkingen op grond van
      [artikel 2.17 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref12] worden na de
      inwerkingtreding van deze wet aangemerkt als beschikkingen op grond van deze wet.

      6 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot dit artikel nadere regels worden
      gesteld.


