preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het noodzakelijk maakt een wettelijk kader te scheppen voor de verstrekking van subsidies op de beleidsterreinen
    van Onze Minister van Onderwijs, Cultuur en Wetenschappen, voorzover een dergelijk kader ontbreekt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder Onze Minister verstaan: Onze Minister van Onderwijs,
      Cultuur en Wetenschap of Onze Minister die belast is met de zorg voor een of meer onderdelen van het beleid,
      genoemd in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel2
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '2'
        paragraaf: '1'
  - number: '2'
    text: |-
      1 Onze Minister kan subsidie verstrekken voor activiteiten die passen in het beleid inzake:

      a. het onderwijs,

      b. het onderzoek,

      c. de cultuur,

      d. de emancipatie.

      2 Bij de subsidieverstrekking aan onderwijsinstellingen wordt geen onderscheid gemaakt tussen openbaar en bijzonder
      onderwijs en wordt voorzien in een behandeling van die instellingen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister verstrekt geen subsidie op grond van deze wet, indien Onze Minister op grond van een andere
      wettelijke bepaling subsidie kan verstrekken.

      2 In afwijking van het eerste lid kan Onze Minister op grond van deze wet subsidie verstrekken, indien:

      a. die andere wettelijke bepaling dat uitdrukkelijk bepaalt,

      b. de subsidie incidenteel van aard is, of

      c. de subsidie vooruitloopt op wijziging van die andere wettelijke bepaling.

      3 Onze Minister verstrekt subsidie als bedoeld in het tweede lid, onderdelen b en c, slechts:

      a. in dringende gevallen,

      b. op grond van een algemene maatregel van bestuur of een ministeriële regeling, en

      c. voor ten hoogste vier jaren.

      4 De voordracht van een algemene maatregel van bestuur of de vaststelling van een ministeriële regeling krachtens
      het derde lid wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overlegd.
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling, tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1], of

      b. waarvan de voorgenomen verstrekking tevoren is meegedeeld aan de beide kamers der Staten-Generaal.

      2 Bij of krachtens de algemene maatregel van bestuur of bij ministeriële regeling kunnen voorts regels worden
      gesteld met betrekking tot:

      a. de aanvraag van een subsidie en de besluitvorming daarover,

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald,

      c. de activiteiten waarvoor subsidie wordt verstrekt,

      d. de voorwaarden waaronder de subsidie wordt verleend,

      e. de verplichtingen van de subsidieontvanger,

      f. de vaststelling van de subsidie,

      g. intrekking en wijziging van de subsidieverlening of subsidievaststelling,

      h. de betaling van de subsidie en het verlenen van voorschotten,

      i. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref2], of

      j. andere criteria voor de verstrekking van subsidie.

      3 Indien subsidie wordt verleend op grond van het eerste lid, onder a of b, kan Onze Minister bij de
      subsidieverlening een termijn vaststellen waarbinnen op de aanvraag tot vaststelling van de subsidie wordt beslist.

      4 Onze Minister kan het verstrekken van subsidie bij of krachtens deze wet delegeren aan een zelfstandig
      bestuursorgaan als bedoeld in [artikel 1, onderdeel a, van de Kaderwet zelfstandige bestuursorganen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel423
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel424
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel1
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel4
