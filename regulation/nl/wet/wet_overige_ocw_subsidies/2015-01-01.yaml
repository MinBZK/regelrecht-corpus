  - number: '10'
    text: |-
      1 Onze Minister kan bij besluit personen aanwijzen die belast worden met het toezicht op de naleving van het
      bepaalde bij of krachtens deze wet.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De toezichthouder beschikt niet over de bevoegdheden, bedoeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
