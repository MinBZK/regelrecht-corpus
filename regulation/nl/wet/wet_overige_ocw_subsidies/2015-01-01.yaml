  - number: '5'
    text: |-
      Onze Minister kan een subsidieplafond vaststellen voor de verschillende activiteiten waarvoor op grond van deze wet
      subsidie kan worden verstrekt. Hij bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel5
  - number: '9'
    text: |-
      1 Een aanvraag kan worden afgewezen en een beschikking tot subsidieverstrekking op grond van deze wet kan worden
      ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd is met ingevolge een verdrag voor de staat
      geldende verplichtingen.

      2 Bij de vaststelling, intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde
      subsidiebedragen een rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.

      4 [Artikel 4:50, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.

      5 De [artikelen 4:49, derde lid][ref2], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref3] zijn niet
      van toepassing op de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0009458/2015-01-01#Artikel9
