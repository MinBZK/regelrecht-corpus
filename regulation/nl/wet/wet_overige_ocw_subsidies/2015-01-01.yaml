    text: |-
      1 Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verleend of
      vastgesteld.

      2 De persoon of het orgaan waaraan de bevoegdheid op grond van [artikel 4, derde lid, onder c][ref1], zoals dat
      luidde voor inwerkingtreding van deze wet, is gedelegeerd om besluiten omtrent subsidie te nemen, blijft die
      bevoegdheid houden.


