        artikel: '27'
  - number: '6'
    text: |-
      1 Een garantie van oorsprong heeft betrekking op een hoeveelheid HR-WKK-elektriciteit die een meervoud is van
      1 MWh.

      2 De boeking van garanties van oorsprong overeenkomstig [artikel 77cb, derde lid, van de wet][ref1] kan slechts
      betrekking hebben op de HR-WKK-elektriciteit die is opgewekt vanaf de eerste dag van de kalendermaand waarin de
      producent het verzoek, bedoeld in [artikel 3, eerste lid][ref2], heeft gedaan.

      3 Garanties van oorsprong worden overeenkomstig [artikel 77cb, derde lid, van de wet][ref3] slechts geboekt indien
      de netbeheerder heeft vastgesteld dat wordt voldaan aan de in [artikel 3, derde lid][ref4], vermelde voorwaarden en
      voor zover is voldaan aan [artikel 4, derde lid][ref5], en [artikel 5, zevende lid][ref6].

      4 De garantiebeheerinstantie brengt de kosten van het beheer van de rekening voor het boeken van garanties van
      oorsprong in rekening bij degene ten behoeve van wie de garanties van oorsprong worden geboekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
