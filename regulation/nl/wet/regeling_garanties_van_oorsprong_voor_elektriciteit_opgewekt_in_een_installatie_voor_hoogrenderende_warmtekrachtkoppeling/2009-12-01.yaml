      - id: ref3
        bwb_id: BWBR0022539
  - number: '5'
    text: |-
      1 De netbeheerder of het gecertificeerde meetbedrijf meet op verzoek van de producent bij een HR-WKK-installatie
      met een aansluitwaarde die groter is dan 3 × 80 A, maandelijks de hoeveelheid in de afgelopen maand op een net
      ingevoede HR-WKK-elektriciteit door het iedere kalendermaand bepalen van de meterstand.

      2 De netbeheerder of het gecertificeerde meetbedrijf meet op verzoek van de producent bij een HR-WKK-installatie
      met een aansluitwaarde die gelijk is aan of kleiner is dan 3 × 80 A, jaarlijks de hoeveelheid in het afgelopen jaar
      op een net ingevoede HR-WKK-elektriciteit door het jaarlijks bepalen van de meterstand.

      3 In de in het tweede lid bedoelde situatie verdeelt de netbeheerder de meetgegevens in gelijke delen over de
      twaalf voorafgaande kalendermaanden, tenzij de producent aantoont dat deze meetgegevens op een andere wijze over de
      twaalf voorafgaande kalendermaanden verdeeld moeten worden.

      4 De producent van HR-WKK-elektriciteit stelt de netbeheerder dan wel het gecertificeerde meetbedrijf in staat de
      meting te verrichten.

      5 Indien de HR-WKK-installatie van de producent voor de opwekking van HR-WKK-elektriciteit gebruik maakt van
      elektriciteit die is afgenomen van een net, brengt de netbeheerder dan wel het gecertificeerde meetbedrijf voor
      de bepaling van de hoeveelheid HR-WKK-elektriciteit die op een net is ingevoed, de hoeveelheid elektriciteit
      die daarvoor is afgenomen van een net in mindering op de hoeveelheid HR-WKK-elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref1] meet.

      6 Indien zich achter de aansluiting van de producent verscheidene eenheden bevinden, wordt de hoeveelheid HR-
      WKK-elektriciteit die door een of meer van de HR-WKK-eenheden op het net wordt ingevoed, bepaald door op de
      HR-WKK-elektriciteit die elk van deze eenheden heeft opgewekt de elektriciteit die wordt verbruikt achter de
      aansluiting in mindering te brengen naar rato van het aandeel van de HR-WKK-eenheid in de totale feitelijke
      elektriciteitopwekking door alle eenheden achter de aansluiting.

      7 De netbeheerder meldt, onder vermelding van de unieke 18-cijferige code van de aansluiting, aan de
      garantiebeheerinstantie de hoeveelheid HR-WKK-elektriciteit die de producent op het net heeft ingevoed.

      8 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref2], iets anders bepalen, brengt de netbeheerder
      of het gecertificeerde meetbedrijf de kosten van het meten van de hoeveelheid HR-WKK-elektriciteit, in rekening bij
      de producent.

      9 Indien zich een omstandigheid voordoet die van belang is voor de bepaling hoeveel HR-WKK-elektriciteit is
      opgewekt en op een net is ingevoed, meldt de producent die omstandigheid en het tijdstip waarop deze zich voordeed
      binnen twee weken aan de netbeheerder of aan het gecertificeerde meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
