  - number: '7'
    text: |-
      De garantiebeheerinstantie bepaalt de hoeveelheid HR-WKK-elektriciteit die de producent op een net heeft ingevoed
      en de besparing op primaire energie met toepassing van

      a. bijlagen 2 en 3 van de richtlijn;

      b. de door de Commissie van de Europese Gemeenschappen in haar beschikking van 21 december 2006 (PbEU 2007, L 32)
      vastgestelde rendementsreferentiewaarden;

      c. de beschikking van de Commissie van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor
      de tenuitvoerlegging en toepassing van bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad
      (PbEU L 338).
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel7
  - number: '8'
    text: |-
      Op de garantie van oorsprong wordt vermeld:

      a. de calorische onderwaarde van de brandstofbron waaruit de elektriciteit is geproduceerd;

      b. de toepassing van de warmte die samen met de elektriciteit is gegenereerd;

      c. de datum en plaats van de productie;

      d. de hoeveelheid HR-WKK-elektriciteit waarvoor de garantie geldt;

      e. de besparing op primaire energie.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: '9'
    text: |-
      1 Een garantie van oorsprong verliest haar geldigheid één jaar na de datum van boeking op grond van
      [artikel 77cb, derde lid, van de wet][ref1].

      2 De garantiebeheerinstantie boekt een garantie van oorsprong die haar geldigheid heeft verloren, af van de
      rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
