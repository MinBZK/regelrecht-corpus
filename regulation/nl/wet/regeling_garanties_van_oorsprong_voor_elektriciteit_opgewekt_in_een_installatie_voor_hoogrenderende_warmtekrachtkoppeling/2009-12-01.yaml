preamble:
  text: |-
    Gelet op artikel 5 van de richtlijn 2004/8/EG van het Europees Parlement en de Raad van de Europese Unie van
    11 februari 2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar nuttige warmte binnen
    de interne energiemarkt en tot wijziging van Richtlijn 92/42/EEG (PbEU L 52) en de artikelen 31, negende lid, 77cb,
    derde lid, en 77ce van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: de [Elektriciteitswet 1998][ref1];

      b. richtlijn: de [richtlijn 2004/8/EG](32004L0008) van het Europees Parlement en de Raad van de Europese Unie van
      11 februari 2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar nuttige warmte binnen
      de interne energiemarkt en tot wijziging van [Richtlijn 92/42/EEG](31992L0042) (PbEU L 52);

      c. hoogrenderende warmtekrachtkoppeling: de warmtekrachtkoppeling die voldoet aan bijlage 3 bij de richtlijn;

      d. HR-WKK-elektriciteit: de elektriciteit die wordt opgewekt door middel van hoogrenderende warmtekrachtkoppeling;

      e. HR-WKK-eenheid: een onderdeel binnen een productie-installatie dat zelfstandig gecombineerd warmte
      en elektriciteit of mechanische energie opwekt op een zodanige wijze dat sprake is van hoogrenderende
      warmtekrachtkoppeling en waarvoor op grond van de meetvoorwaarden, opgenomen in de bij deze regeling behorende
      [bijlage 1][ref2], een systeemgrens is bepaald;

      f. HR-WKK-installatie: een productie-installatie bestemd voor het opwekken van elektriciteit, bestaande uit ten
      minste één HR-WKK-eenheid;

      g. systeemgrens van de HR-WKK-installatie: een fictieve, gesloten omhulling van de HR-WKK-eenheden die deel
      uitmaken van de HR-WKK-installatie, welke omhulling voldoet aan hetgeen in de bijlage bij de beschikking van
      de Commissie van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de tenuitvoerlegging en
      toepassing van bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad (PbEU L 338) is bepaald ten
      aanzien van systeemgrenzen;

      h. garantie van oorsprong: een garantie van oorsprong als bedoeld in
      [artikel 1, onderdeel ac, van de Elektriciteitswet 1998][ref3];

      i. gecertificeerd meetbedrijf: een meetbedrijf, niet zijnde een netbeheerder, dat op grond van de voorwaarden,
      bedoeld in [artikel 31, eerste lid, onderdeel b, van de wet][ref4], is toegelaten tot het verrichten van de in die
      voorwaarden neergelegde werkzaamheden en dat de hoeveelheid HR-WKK-elektriciteit meet die afkomstig is van een HR-
      WKK-installatie;

      j. meetprotocol: het document waarin beschreven zijn de bemetering van een HR-WKK-installatie, de wijze van meten
      en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden brandstof die de installatie
      verbruikt en de hoeveelheden elektriciteit, warmte en, voor zover van toepassing, mechanische energie, die de
      installatie opwekt;

      k. meetrapport: het rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0022539
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel31
