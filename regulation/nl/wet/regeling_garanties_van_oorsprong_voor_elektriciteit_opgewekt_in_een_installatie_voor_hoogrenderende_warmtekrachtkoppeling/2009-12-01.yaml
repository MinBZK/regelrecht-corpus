  - number: '2'
    text: |-
      1 Voor het verkrijgen van garanties van oorsprong draagt de producent van HR-WKK-elektriciteit die een HR-WKK-
      installatie in stand houdt er zorg voor dat ten aanzien van deze installatie een meetprotocol opgesteld wordt, dat
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1].

      2 De producent laat het meetprotocol voor de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 3, eerste lid][ref2], indient, goedkeuren door een gecertificeerd meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0022539
      [ref2]: https://wetten.overheid.nl/BWBR0022539#Artikel3
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022539
      - id: ref2
        bwb_id: BWBR0022539
        artikel: '3'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Indien een in Nederland gevestigde producent van HR-WKK-elektriciteit de netbeheerder verzoekt om de
      vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h, van de wet][ref1], te verrichten, gebruikt hij
      hiervoor het formulier dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref2].

      2 Naar aanleiding van het verzoek stelt de netbeheerder vast of de installatie een HR-WKK-installatie is en, indien
      dit het geval is, welke eenheden binnen de installatie een HR-WKK-eenheid zijn, of de meetinrichting geschikt is om
      de hoeveelheid op een net ingevoede HR-WKK-elektriciteit te meten en of een goedgekeurd meetprotocol aanwezig is.

      3 De netbeheerder doet de vaststelling door een administratief onderzoek in te stellen naar de installatie en
      de aansluiting daarvan op het net. De netbeheerder kan ten behoeve van de vaststelling in aanvulling op het
      administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens de installatie van de
      producent onderzoeken. De producent stelt de netbeheerder in staat het onderzoek te verrichten.

      4 De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld
      in het eerste lid, mee aan de producent en aan de netbeheerder van het landelijk hoogspanningsnet.

      5 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref3], iets anders bepalen, brengt de netbeheerder
      de kosten van de vaststelling in rekening bij de producent.

      6 Indien de producent een aanpassing aan zijn HR-WKK-installatie doorvoert die een wijziging van een van de
      gegevens, vermeld in het vaststellingsverzoek, ten gevolge heeft, is een eerder verrichte vaststelling niet langer
      geldig.

      7 De producent bericht de netbeheerder vooraf over zijn voornemen een aanpassing als bedoeld in het zesde lid door
      te voeren en hij dient voor het verkrijgen van garanties van oorsprong een nieuw verzoek tot vaststelling in. Het
      eerste tot en met het zesde lid zijn in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022539
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel27
