  - number: '4'
    text: |-
      1 Voor het verkrijgen van garanties van oorsprong draagt de producent van HR-WKK-elektriciteit die een HR-
      WKK-installatie in stand houdt er zorg voor dat de hoeveelheden brandstof die zijn installatie verbruikt en de
      hoeveelheden elektriciteit, warmte en, voor zover van toepassing, mechanische energie, die zijn installatie opwekt,
      gemeten worden volgens het meetprotocol.

      2 De producent draagt er zorg voor dat per maand onder toepassing van het meetprotocol een meetrapport wordt
      opgesteld, dat:

      a. voldoet aan de voorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1];

      b. de wijze van totstandkoming van de meetgegevens beschrijft, en

      c. geverifieerd wordt door een gecertificeerd meetbedrijf.

      3 De producent overlegt het meetrapport uiterlijk twee maanden na afloop van het kwartaal waarvan de kalendermaand
      waarop het meetrapport betrekking heeft deel uitmaakt, aan de garantiebeheerinstantie.

      4 Indien de producent de garantiebeheerinstantie hierover tevoren heeft geïnformeerd, kan de producent volstaan
      met het jaarlijks overleggen van de meetrapporten, uiterlijk twee maanden na afloop van het jaar waarop de
      meetrapporten betrekking hebben.

      5 Indien de producent op grond van de [Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref2]
      maandelijks een meetrapport aan de netbeheerder van het landelijk hoogspanningsnet overlegt, kan hij voor de
      opstelling van het in het tweede lid bedoelde meetrapport volstaan met een aanvulling op het eerstbedoelde rapport
      overeenkomstig de voorwaarden die daartoe zijn opgenomen in [bijlage 1][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022539
      [ref2]: https://wetten.overheid.nl/BWBR0015182
      [ref3]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
    references:
