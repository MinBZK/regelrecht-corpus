---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_garanties_van_oorsprong_voor_elektriciteit_opgewekt_in_een_installatie_voor_hoogrenderende_warmtekrachtkoppeling
regulatory_layer: WET
publication_date: '2014-12-19'
valid_from: '2009-12-01'
bwb_id: BWBR0022539
url: https://wetten.overheid.nl/BWBR0022539/2009-12-01
preamble:
  text: |-
    Gelet op artikel 5 van de richtlijn 2004/8/EG van het Europees Parlement en de Raad van de Europese Unie van
    11 februari 2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar nuttige warmte binnen
    de interne energiemarkt en tot wijziging van Richtlijn 92/42/EEG (PbEU L 52) en de artikelen 31, negende lid, 77cb,
    derde lid, en 77ce van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 1.b
    text: |-
      richtlijn: de [richtlijn 2004/8/EG](32004L0008) van het Europees Parlement en de Raad van de Europese Unie van
      11 februari 2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar nuttige warmte binnen
      de interne energiemarkt en tot wijziging van [Richtlijn 92/42/EEG](31992L0042) (PbEU L 52);
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.c
    text: 'hoogrenderende warmtekrachtkoppeling: de warmtekrachtkoppeling die voldoet aan bijlage 3 bij de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.d
    text: 'HR-WKK-elektriciteit: de elektriciteit die wordt opgewekt door middel van hoogrenderende warmtekrachtkoppeling;'
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.e
    text: |-
      HR-WKK-eenheid: een onderdeel binnen een productie-installatie dat zelfstandig gecombineerd warmte en elektriciteit
      of mechanische energie opwekt op een zodanige wijze dat sprake is van hoogrenderende warmtekrachtkoppeling en
      waarvoor op grond van de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1], een
      systeemgrens is bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022539
  - number: 1.f
    text: |-
      HR-WKK-installatie: een productie-installatie bestemd voor het opwekken van elektriciteit, bestaande uit ten minste
      één HR-WKK-eenheid;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.g
    text: |-
      systeemgrens van de HR-WKK-installatie: een fictieve, gesloten omhulling van de HR-WKK-eenheden die deel uitmaken
      van de HR-WKK-installatie, welke omhulling voldoet aan hetgeen in de bijlage bij de beschikking van de Commissie
      van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de tenuitvoerlegging en toepassing van
      bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad (PbEU L 338) is bepaald ten aanzien van
      systeemgrenzen;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.h
    text: |-
      garantie van oorsprong: een garantie van oorsprong als bedoeld in
      [artikel 1, onderdeel ac, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 1.i
    text: |-
      gecertificeerd meetbedrijf: een meetbedrijf, niet zijnde een netbeheerder, dat op grond van de voorwaarden,
      bedoeld in [artikel 31, eerste lid, onderdeel b, van de wet][ref1], is toegelaten tot het verrichten van de in die
      voorwaarden neergelegde werkzaamheden en dat de hoeveelheid HR-WKK-elektriciteit meet die afkomstig is van een HR-
      WKK-installatie;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: 1.j
    text: |-
      meetprotocol: het document waarin beschreven zijn de bemetering van een HR-WKK-installatie, de wijze van meten en
      de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden brandstof die de installatie
      verbruikt en de hoeveelheden elektriciteit, warmte en, voor zover van toepassing, mechanische energie, die de
      installatie opwekt;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: 1.k
    text: 'meetrapport: het rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat.'
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel1
  - number: '2.1'
    text: |-
      Voor het verkrijgen van garanties van oorsprong draagt de producent van HR-WKK-elektriciteit die een HR-WKK-
      installatie in stand houdt er zorg voor dat ten aanzien van deze installatie een meetprotocol opgesteld wordt, dat
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022539
  - number: '2.2'
    text: |-
      De producent laat het meetprotocol voor de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 3, eerste lid][ref1], indient, goedkeuren door een gecertificeerd meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0022539#Artikel3
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022539
        artikel: '3'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      Indien een in Nederland gevestigde producent van HR-WKK-elektriciteit de netbeheerder verzoekt om de vaststelling,
      bedoeld in [artikel 16, eerste lid, onderdeel h, van de wet][ref1], te verrichten, gebruikt hij hiervoor het
      formulier dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0022539
  - number: '3.2'
    text: |-
      Naar aanleiding van het verzoek stelt de netbeheerder vast of de installatie een HR-WKK-installatie is en, indien
      dit het geval is, welke eenheden binnen de installatie een HR-WKK-eenheid zijn, of de meetinrichting geschikt is om
      de hoeveelheid op een net ingevoede HR-WKK-elektriciteit te meten en of een goedgekeurd meetprotocol aanwezig is.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
  - number: '3.3'
    text: |-
      De netbeheerder doet de vaststelling door een administratief onderzoek in te stellen naar de installatie en
      de aansluiting daarvan op het net. De netbeheerder kan ten behoeve van de vaststelling in aanvulling op het
      administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens de installatie van de
      producent onderzoeken. De producent stelt de netbeheerder in staat het onderzoek te verrichten.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
  - number: '3.4'
    text: |-
      De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld in
      het eerste lid, mee aan de producent en aan de netbeheerder van het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
  - number: '3.5'
    text: |-
      Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref1], iets anders bepalen, brengt de netbeheerder
      de kosten van de vaststelling in rekening bij de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
  - number: '3.6'
    text: |-
      Indien de producent een aanpassing aan zijn HR-WKK-installatie doorvoert die een wijziging van een van de gegevens,
      vermeld in het vaststellingsverzoek, ten gevolge heeft, is een eerder verrichte vaststelling niet langer geldig.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
  - number: '3.7'
    text: |-
      De producent bericht de netbeheerder vooraf over zijn voornemen een aanpassing als bedoeld in het zesde lid door
      te voeren en hij dient voor het verkrijgen van garanties van oorsprong een nieuw verzoek tot vaststelling in. Het
      eerste tot en met het zesde lid zijn in dat geval van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel3
  - number: '4.1'
    text: |-
      Voor het verkrijgen van garanties van oorsprong draagt de producent van HR-WKK-elektriciteit die een HR-WKK-
      installatie in stand houdt er zorg voor dat de hoeveelheden brandstof die zijn installatie verbruikt en de
      hoeveelheden elektriciteit, warmte en, voor zover van toepassing, mechanische energie, die zijn installatie opwekt,
      gemeten worden volgens het meetprotocol.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: '4.2'
    text: |-
      De producent draagt er zorg voor dat per maand onder toepassing van het meetprotocol een meetrapport wordt
      opgesteld, dat:
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: 4.2.a
    text: |-
      voldoet aan de voorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022539
  - number: 4.2.b
    text: de wijze van totstandkoming van de meetgegevens beschrijft, en
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: 4.2.c
    text: geverifieerd wordt door een gecertificeerd meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: '4.3'
    text: |-
      De producent overlegt het meetrapport uiterlijk twee maanden na afloop van het kwartaal waarvan de kalendermaand
      waarop het meetrapport betrekking heeft deel uitmaakt, aan de garantiebeheerinstantie.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de producent de garantiebeheerinstantie hierover tevoren heeft geïnformeerd, kan de producent volstaan
      met het jaarlijks overleggen van de meetrapporten, uiterlijk twee maanden na afloop van het jaar waarop de
      meetrapporten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
  - number: '4.5'
    text: |-
      Indien de producent op grond van de [Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref1]
      maandelijks een meetrapport aan de netbeheerder van het landelijk hoogspanningsnet overlegt, kan hij voor de
      opstelling van het in het tweede lid bedoelde meetrapport volstaan met een aanvulling op het eerstbedoelde rapport
      overeenkomstig de voorwaarden die daartoe zijn opgenomen in [bijlage 1][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015182
      [ref2]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015182
      - id: ref2
        bwb_id: BWBR0022539
  - number: '5.1'
    text: |-
      De netbeheerder of het gecertificeerde meetbedrijf meet op verzoek van de producent bij een HR-WKK-installatie
      met een aansluitwaarde die groter is dan 3 × 80 A, maandelijks de hoeveelheid in de afgelopen maand op een net
      ingevoede HR-WKK-elektriciteit door het iedere kalendermaand bepalen van de meterstand.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.2'
    text: |-
      De netbeheerder of het gecertificeerde meetbedrijf meet op verzoek van de producent bij een HR-WKK-installatie met
      een aansluitwaarde die gelijk is aan of kleiner is dan 3 × 80 A, jaarlijks de hoeveelheid in het afgelopen jaar op
      een net ingevoede HR-WKK-elektriciteit door het jaarlijks bepalen van de meterstand.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.3'
    text: |-
      In de in het tweede lid bedoelde situatie verdeelt de netbeheerder de meetgegevens in gelijke delen over de twaalf
      voorafgaande kalendermaanden, tenzij de producent aantoont dat deze meetgegevens op een andere wijze over de twaalf
      voorafgaande kalendermaanden verdeeld moeten worden.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.4'
    text: |-
      De producent van HR-WKK-elektriciteit stelt de netbeheerder dan wel het gecertificeerde meetbedrijf in staat de
      meting te verrichten.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de HR-WKK-installatie van de producent voor de opwekking van HR-WKK-elektriciteit gebruik maakt van
      elektriciteit die is afgenomen van een net, brengt de netbeheerder dan wel het gecertificeerde meetbedrijf voor
      de bepaling van de hoeveelheid HR-WKK-elektriciteit die op een net is ingevoed, de hoeveelheid elektriciteit
      die daarvoor is afgenomen van een net in mindering op de hoeveelheid HR-WKK-elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref1] meet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: '5.6'
    text: |-
      Indien zich achter de aansluiting van de producent verscheidene eenheden bevinden, wordt de hoeveelheid HR-
      WKK-elektriciteit die door een of meer van de HR-WKK-eenheden op het net wordt ingevoed, bepaald door op de
      HR-WKK-elektriciteit die elk van deze eenheden heeft opgewekt de elektriciteit die wordt verbruikt achter de
      aansluiting in mindering te brengen naar rato van het aandeel van de HR-WKK-eenheid in de totale feitelijke
      elektriciteitopwekking door alle eenheden achter de aansluiting.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.7'
    text: |-
      De netbeheerder meldt, onder vermelding van de unieke 18-cijferige code van de aansluiting, aan de
      garantiebeheerinstantie de hoeveelheid HR-WKK-elektriciteit die de producent op het net heeft ingevoed.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '5.8'
    text: |-
      Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref1], iets anders bepalen, brengt de netbeheerder
      of het gecertificeerde meetbedrijf de kosten van het meten van de hoeveelheid HR-WKK-elektriciteit, in rekening bij
      de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
  - number: '5.9'
    text: |-
      Indien zich een omstandigheid voordoet die van belang is voor de bepaling hoeveel HR-WKK-elektriciteit is opgewekt
      en op een net is ingevoed, meldt de producent die omstandigheid en het tijdstip waarop deze zich voordeed binnen
      twee weken aan de netbeheerder of aan het gecertificeerde meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel5
  - number: '6.1'
    text: Een garantie van oorsprong heeft betrekking op een hoeveelheid HR-WKK-elektriciteit die een meervoud is van 1 MWh.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel6
  - number: '6.2'
    text: |-
      De boeking van garanties van oorsprong overeenkomstig [artikel 77cb, derde lid, van de wet][ref1] kan slechts
      betrekking hebben op de HR-WKK-elektriciteit die is opgewekt vanaf de eerste dag van de kalendermaand waarin de
      producent het verzoek, bedoeld in [artikel 3, eerste lid][ref2], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
      [ref2]: https://wetten.overheid.nl/BWBR0022539#Artikel3
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77cb
      - id: ref2
        bwb_id: BWBR0022539
        artikel: '3'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Garanties van oorsprong worden overeenkomstig [artikel 77cb, derde lid, van de wet][ref1] slechts geboekt indien
      de netbeheerder heeft vastgesteld dat wordt voldaan aan de in [artikel 3, derde lid][ref2], vermelde voorwaarden en
      voor zover is voldaan aan [artikel 4, derde lid][ref3], en [artikel 5, zevende lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
      [ref2]: https://wetten.overheid.nl/BWBR0022539#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022539#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0022539#Artikel5
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77cb
      - id: ref2
        bwb_id: BWBR0022539
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022539
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022539
        artikel: '5'
        paragraaf: '2'
  - number: '6.4'
    text: |-
      De garantiebeheerinstantie brengt de kosten van het beheer van de rekening voor het boeken van garanties van
      oorsprong in rekening bij degene ten behoeve van wie de garanties van oorsprong worden geboekt.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel6
  - number: '7'
    text: |-
      De garantiebeheerinstantie bepaalt de hoeveelheid HR-WKK-elektriciteit die de producent op een net heeft ingevoed
      en de besparing op primaire energie met toepassing van
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel7
  - number: 7.a
    text: bijlagen 2 en 3 van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel7
  - number: 7.b
    text: |-
      de door de Commissie van de Europese Gemeenschappen in haar beschikking van 21 december 2006 (PbEU 2007, L 32)
      vastgestelde rendementsreferentiewaarden;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel7
  - number: 7.c
    text: |-
      de beschikking van de Commissie van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de
      tenuitvoerlegging en toepassing van bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad
      (PbEU L 338).
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel7
  - number: '8'
    text: 'Op de garantie van oorsprong wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: 8.a
    text: de calorische onderwaarde van de brandstofbron waaruit de elektriciteit is geproduceerd;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: 8.b
    text: de toepassing van de warmte die samen met de elektriciteit is gegenereerd;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: 8.c
    text: de datum en plaats van de productie;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: 8.d
    text: de hoeveelheid HR-WKK-elektriciteit waarvoor de garantie geldt;
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: 8.e
    text: de besparing op primaire energie.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel8
  - number: '9.1'
    text: |-
      Een garantie van oorsprong verliest haar geldigheid één jaar na de datum van boeking op grond van
      [artikel 77cb, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 77cb
  - number: '9.2'
    text: De garantiebeheerinstantie boekt een garantie van oorsprong die haar geldigheid heeft verloren, af van de rekening.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking op het tijdstip dat de wijziging van de Elektriciteitswet 1998 ter implementatie
      van de richtlijn warmtekrachtkoppeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling wordt aangehaald als: Regeling garanties van oorsprong voor elektriciteit opgewekt in een installatie
      voor hoogrenderende warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0022539/2009-12-01#Artikel11
