$id: intrekkingswet_bb
regulatory_layer: WET
publication_date: '1995-05-30'
valid_from: '1996-01-01'
bwb_id: BWBR0003986
url: https://wetten.overheid.nl/BWBR0003986/1996-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de organisatie bescherming bevolking op te heffen en
    met het oog daarop de Wet bescherming bevolking (Stb. 1952, 404) en enige andere wetten of onderdelen daarvan in te
    trekken alsmede enige daarmee verband houdende voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.b
    text: |-
      liquidatie: het geheel van publiekrechtelijke en privaatrechtelijke rechtshandelingen en overige handelingen, dat
      is gericht op de opheffing van de organisatie bescherming bevolking en op de vereffening van het vermogen van die
      organisatie, daaronder begrepen de vaststelling van de voorlopige liquidatierekening en de vereffening van het
      liquidatiesaldo;
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.c
    text: 'kringraad: de kringraad, bedoeld in [artikel 14, tweede lid, onder ](onbekend) (*Stb.* 1952, 404);'
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.d
    text: |-
      bevoegd gezag van de noodwacht: het gezag van de gemeentelijke, kring-, provinciale en rijksnoodwacht
      (burgemeester, respectievelijk kringraad, Commissaris van de Koningin, Minister van Binnenlandse Zaken);
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.e
    text: |-
      noodwachter: degene, die is benoemd dan wel in dienst genomen op grond van artikel 9 van de Wet op de noodwachten
      (*Stb.* 1971, 61);
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: 1.f
    text: |-
      onroerende zaken: de grond, alsmede de gebouwen en werken die duurzaam met de grond zijn verenigd, in eigendom van
      de kringen bescherming bevolking, de commandoposten daaronder niet begrepen.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel1
  - number: '2.1'
    text: 'De navolgende wetten of onderdelen daarvan worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel2
  - number: 2.1.a
    text: |-
      de [Wet bescherming bevolking][ref1] (*Stb.* 1952, 404) behoudens de [artikelen 4, tweede lid][ref2], [7][ref3]
      en [29][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002096
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003986#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003986#Artikel29
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002096
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003986
        artikel: '7'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003986
        artikel: '29'
        hoofdstuk: V
  - number: 2.1.b
    text: de Wet bijdragen bescherming bevolking en verplaatsing bevolking 1961 (*Stb.* 1964, 121);
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel2
  - number: 2.1.c
    text: |-
      Titel I, IV, V, alsmede de artikelen 7*a*, 8, 8*a*, 10, 21, 23, 169 en 171*a* van de Wet op de noodwachten (*Stb.*
      1971, 61).
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeenschappelijke regelingen, bedoeld in [artikel 14 van de Wet bescherming bevolking](onbekend), vervallen van
      rechtswege met ingang van de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel3
  - number: '3.2'
    text: |-
      De kringen, ingesteld bij de gemeenschappelijke regelingen, bedoeld in het eerste lid, zijn van rechtswege
      ontbonden met ingang van de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel3
  - number: '3.3'
    text: |-
      De kringen blijven na hun ontbinding voortbestaan voor zover en voor zolang zulks voor de liquidatie noodzakelijk
      is, doch uiterlijk tot zes maanden na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel3
  - number: '4.1'
    text: De kringraad is uiterlijk tot zes maanden na de datum van inwerkingtreding van deze wet belast met de liquidatie.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel4
  - number: '4.2'
    text: |-
      De kringraad stelt daartoe binnen een maand na de datum van inwerkingtreding van deze wet een overzicht op van de
      wijze, waarop de liquidatie zal worden uitgevoerd. Het overzicht wordt aan gedeputeerde staten en aan Onze Minister
      ter kennisneming toegezonden.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het bestuur van de gemeente waar de kring zijn zetel heeft, is met de voortzetting van de liquidatie belast, indien
      na het verstrijken van de termijn, bedoeld in [artikel 4, eerste lid][ref1], de liquidatie niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '5.2'
    text: |-
      Na het verstrijken van de termijn, bedoeld in [artikel 4, eerste lid][ref1], vervallen de vermogensbestanddelen van
      de kring van rechtswege aan het bestuur van de gemeente, bedoeld in het eerste lid. Tevens gaan op dat moment de
      rechten en verplichtingen van de kring over op het bestuur van deze gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '6.1'
    text: |-
      In een gemeente die niet behoort tot een op grond van de [Wet bescherming bevolking][ref1] gevormde kring, is het
      bestuur van de gemeente belast met de liquidatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002096
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002096
  - number: '6.2'
    text: |-
      [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '7'
    text: |-
      De liquidatierekening wordt binnen een maand na de datum, waarop het geheel van rechtshandelingen en
      overige handelingen, dat is gericht op de opheffing van de organisatie bescherming bevolking, is voltooid,
      voorlopig vastgesteld en wordt door de kringraad onderscheidenlijk het bestuur van de gemeente, bedoeld in
      [artikel 5, eerste lid][ref1], onderscheidenlijk [artikel 6, eerste lid][ref2], ter definitieve vaststelling aan
      gedeputeerde staten en ter kennisneming aan Onze Minister gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel6
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '6'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      Gedeputeerde staten bepalen welk deel van het in de liquidatierekening vastgestelde liquidatiesaldo
      ten gunste of ten laste van het rijk komt en welk deel ten gunste of ten laste van de deelnemers van de
      gemeenschappelijke regeling, dan wel in de gevallen dat een gemeente niet behoort tot een op grond van de
      [Wet bescherming bevolking][ref1] gevormde kring, ten gunste of ten laste van die gemeente komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002096
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002096
  - number: '8.2'
    text: |-
      De verdeling, bedoeld in het eerste lid, geschiedt naar evenredigheid van de bijdragen, die op grond van artikel 3
      van de Wet bijdragen bescherming bevolking en verplaatsing bevolking 1961 uit 's Rijks kas beschikbaar zijn gesteld
      aan de kring, onderscheidenlijk de gemeente en van de bijdragen, die vanaf de datum van inwerkingtreding van die
      wet door de deelnemers van de gemeenschappelijke regeling onderscheidenlijk de gemeente terzake van de bescherming
      van de bevolking beschikbaar zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel8
  - number: '9.1'
    text: |-
      In geval van een positief liquidatiesaldo is de kringraad, onderscheidenlijk het bestuur van de gemeente, bedoeld
      in [artikel 5, eerste lid][ref1], belast met de uitvoering van het besluit, bedoeld in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel8
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '8'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      In geval van een negatief liquidatiesaldo doen gedeputeerde staten mededeling aan Onze Minister en aan de in de
      kring deelnemende gemeenten, welk bedrag aan de kringraad, onderscheidenlijk aan het bestuur van de gemeente,
      bedoeld in [artikel 5, eerste lid][ref1], dient te worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel5
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '5'
        hoofdstuk: III
  - number: '9.3'
    text: |-
      Het deel van het liquidatiesaldo dat ten gunste of ten laste van de in de kring deelnemende gemeenten komt, wordt
      over deze gemeenten verdeeld naar rato van het aantal inwoners daarvan op 1 januari van het jaar voorafgaand aan
      het jaar, waarin deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel9
  - number: '10.1'
    text: |-
      In een gemeente als bedoeld in [artikel 6, eerste lid][ref1], is in geval van een positief liquidatiesaldo het
      bestuur van de gemeente belast met de uitvoering van het besluit, bedoeld in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel8
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '8'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      In geval van een negatief liquidatiesaldo doen gedeputeerde staten mededeling aan Onze Minister, welk bedrag aan
      het bestuur van de gemeente, bedoeld in [artikel 6, eerste lid][ref1], dient te worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel6
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '6'
        hoofdstuk: III
  - number: '11.1'
    text: |-
      Onze Minister onderzoekt tot een jaar na de datum van inwerkingtreding van deze wet op welke wijze de noodwachters
      bij voorrang in aanmerking kunnen worden gebracht voor herplaatsing bij een regionale brandweer of bij een ander
      daarvoor in aanmerking komend publiekrechtelijk of privaatrechtelijk lichaam.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de noodwachters die op de datum van inwerkingtreding van
      deze wet 55 jaar of ouder zijn en binnen een maand na de datum van inwerkingtreding van deze wet aan het bevoegd
      gezag te kennen hebben gegeven, dat zij niet in aanmerking wensen te komen voor herplaatsing.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel11
  - number: '12.1'
    text: |-
      Aan de noodwachter, die binnen of uiterlijk na het verstrijken van de termijn, bedoeld in
      [artikel 4, eerste lid][ref1], kan worden herplaatst, wordt op zijn verzoek door het bevoegd gezag eervol ontslag
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Aan de noodwachters, bedoeld in [artikel 11, tweede lid][ref1], wordt door het bevoegd gezag eervol ontslag
      verleend met ingang van de dag, waarop de termijn, bedoeld in [artikel 4, eerste lid][ref2], is verstreken, of
      zoveel eerder als de liquidatie is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Indien in de gevallen, bedoeld in het eerste en het tweede lid, inachtneming van de opzegtermijn, genoemd
      in artikel 92, tweede lid, van het Ambtenarenreglement noodwachters (*Stb.* 1955, 327) en in artikel 75,
      tweede en derde lid, van het Arbeidsovereenkomstenbesluit noodwachters (*Stb.* 1955, 328), er toe zou
      leiden dat het ontslag pas kan worden verleend met ingang van een dag, die ligt na de termijn, bedoeld in
      [artikel 4, eerste lid, van deze wet][ref1] wordt die opzegtermijn zodanig beperkt, dat het ontslag wordt verleend
      met ingang van de dag waarop de termijn, bedoeld in [artikel 4, eerste lid, van deze wet][ref2] is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '13.1'
    text: |-
      Ten opzichte van de noodwachter, aan wie na het verstrijken van de termijn, bedoeld in
      [artikel 4, eerste lid][ref1], geen ontslag is verleend op grond van [artikel 12, eerste of tweede lid][ref2],
      treedt Onze Minister gedurende de zes daaropvolgende maanden op als bevoegd gezag als bedoeld in artikel 1, eerste
      lid, van het Ambtenarenreglement noodwachters en in artikel 1, onderdeel *b*, van het Arbeidsovereenkomstenbesluit
      noodwachters.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel12
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien de liquidatie is voltooid voordat de termijn, bedoeld in [artikel 4, eerste lid][ref1], is verstreken,
      treedt Onze Minister ten opzichte van de noodwachter die op het moment waarop de liquidatie is voltooid niet
      is ontslagen op grond van [artikel 12, eerste of tweede lid][ref2], tot het tijdstip gelegen twaalf maanden na
      de datum van inwerkingtreding van deze wet op als bevoegd gezag als bedoeld in artikel 1, eerste lid, van het
      Ambtenarenreglement noodwachters en in artikel 1, onderdeel *b*, van het Arbeidsovereenkomstenbesluit noodwachters.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel12
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Aan de noodwachter, die tijdens de periode dat Onze Minister voor hem optreedt als bevoegd gezag, bedoeld in
      [artikel 13, eerste en tweede lid][ref1], kan worden herplaatst, wordt op zijn verzoek door Onze Minister eervol
      ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel13
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Indien in het geval, bedoeld in het eerste lid, inachtneming van de opzegtermijn, bedoeld in
      [artikel 12, derde lid][ref1], er toe zou leiden dat het ontslag pas kan worden verleend met ingang van een dag,
      die ligt na een jaar na de datum van inwerkingtreding van deze wet, wordt die opzegtermijn zodanig beperkt, dat
      het ontslag wordt verleend met ingang van de dag waarop een jaar na de datum van inwerkingtreding van deze wet
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel12
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Aan de noodwachter wordt door Onze Minister een jaar na de datum van inwerkingtreding van deze wet eervol ontslag
      verleend, indien het onderzoek, bedoeld in [artikel 11, eerste lid][ref1], niet heeft geleid tot het in aanmerking
      brengen van de noodwachter voor een in verband met zijn persoonlijkheid en omstandigheden passende functie. Artikel
      95 van het Ambtenarenreglement noodwachters is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel11
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Ontslag als bedoeld in het eerste lid, wordt eveneens verleend aan de noodwachter die weigert een hem aangeboden
      functie als bedoeld in het eerste lid, te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel15
  - number: '16.1'
    text: |-
      De noodwachter in vaste of tijdelijke dienst, mits dit laatste dienstverband tenminste vijf jaren heeft geduurd
      en de aanstelling niet is geschied in een betrekking van kennelijk tijdelijke aard, die is of wordt ontslagen
      op grond van het bepaalde in [artikel 12, eerste en tweede lid][ref1], [artikel 14, eerste lid][ref2], en
      [artikel 15, eerste lid][ref3], heeft recht op wachtgeld volgens de regelen, vastgesteld bij algemene maatregel van
      bestuur van 23 november 1972, *Stb.* 671, onverminderd het bepaalde in artikel 4 van die algemene maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003986#Artikel15
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003986
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '16.2'
    text: |-
      De noodwachter in tijdelijke dienst wiens dienstverband minder dan vijf jaren heeft geduurd dan wel van kennelijk
      tijdelijke aard was, alsmede de noodwachter in dienst op arbeidsovereenkomst naar burgerlijk recht, die is of wordt
      ontslagen op grond van het bepaalde in [artikel 12, eerste en tweede lid][ref1], [artikel 14, eerste lid][ref2], en
      [artikel 15, eerste lid][ref3], onderscheidenlijk wiens dienstverband dientengevolge wordt beëindigd, heeft recht
      op uitkering volgens de regelen, vastgesteld bij algemene maatregel van bestuur van 23 november 1972, *Stb.* 672,
      onverminderd het bepaalde in de artikelen 2 en 6 van die algemene maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003986#Artikel15
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003986
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '16.3'
    text: |-
      Het wachtgeld en de uitkering, die op grond van het bepaalde in het eerste en tweede lid door Onze Minister worden
      toegekend, komen ten laste van hoofdstuk VII van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel16
  - number: '17.1'
    text: |-
      De uitvoering van een beschikking, waarbij door het bevoegd gezag krachtens artikel 102 of artikel 102*a* van het
      Ambtenarenreglement noodwachters onderscheidenlijk artikel 80 van het Arbeidsovereenkomstenbesluit noodwachters
      wachtgeld op de voet van het [Rijkswachtgeldbesluit 1959][ref1] (*Stb.* 1979, 621) onderscheidenlijk uitkering op
      de voet van de [Uitkeringsregeling 1966][ref2] (*Stb.* 1979, 622) is toegekend, geschiedt na het verstrijken van
      de termijn, bedoeld in [artikel 4, eerste lid][ref3], of zoveel eerder als de liquidatie is voltooid, door Onze
      Minister ten laste van hoofdstuk VII van de rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
      [ref3]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
      - id: ref3
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '17.2'
    text: |-
      De toepassing van het [Rijkswachtgeldbesluit 1959][ref1] en van de [Uitkeringsregeling 1966][ref2] met betrekking
      tot beschikkingen, bedoeld in het eerste lid, geschiedt door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '18'
    text: |-
      Indien een noodwachter, die op grond van het bepaalde in deze wet is ontslagen, uit hoofde van ziekte aanspraak
      heeft of krijgt op doorbetaling van zijn laatstgenoten bezoldiging, komt deze bezoldiging ten laste van hoofdstuk
      VII van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel18
  - number: '19.1'
    text: |-
      Met betrekking tot de noodwachter, die deelnemer is in een "Instituut Ziektekostenvoorziening Ambtenaren" dan
      wel aan de "Interprovinciale Ziektekostenregeling" en die op grond van het bepaalde in [artikel 16][ref1] recht
      heeft op een wachtgeld onderscheidenlijk een uitkering, wordt het aandeel van de kring, gemeente of provincie
      in de bijdrage, die aan het instituut dan wel de regeling is verschuldigd, ten laste van hoofdstuk VII van de
      rijksbegroting gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel16
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '19.2'
    text: |-
      Het bepaalde in het eerste lid is eveneens van toepassing op de deelnemer in een "Instituut Ziektekostenvoorziening
      Ambtenaren" dan wel aan de "Interprovinciale Ziektekostenregeling" die noodwachter is geweest en die als zodanig
      voor inwerkingtreding van deze wet met recht op een wachtgeld of een uitkering is ontslagen, dan wel is ontslagen
      wegens het bereiken van de pensioengerechtigde leeftijd, een en ander voor zover het werkgeversaandeel voor de
      datum van inwerkingtreding van deze wet niet door hemzelf behoefde te worden betaald.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel19
  - number: '19.3'
    text: |-
      Ten aanzien van de noodwachter, die geen deelnemer is in een "Instituut Ziektekostenvoorziening Ambtenaren", maar
      voor wie de gemeente dan wel de kring een afzonderlijke ziektekostenvoorziening heeft getroffen, is het bepaalde in
      het eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel19
  - number: '20'
    text: |-
      De hoedanigheid, bedoeld in artikel 7, onder *b*, *c*, *d*, *f* en *g* van de Wet op de noodwachten, vervalt van
      rechtswege met ingang van de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel20
  - number: '21.1'
    text: De uitvoering van de artikelen 15 en 22 van de Wet op de noodwachten geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel21
  - number: '21.2'
    text: |-
      De kosten verbonden aan de uitvoering van de artikelen, bedoeld in het eerste lid, komen ten laste van hoofdstuk
      VII van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel21
  - number: '22.1'
    text: |-
      De kringraad stelt het bestuur van de regionale brandweer in de gelegenheid de goederen in eigendom van de kring,
      de onroerende zaken daaronder begrepen, te kopen.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel22
  - number: '22.2'
    text: |-
      Binnen een maand na de datum van inwerkingtreding van deze wet verstrekt de kringraad hiertoe een schriftelijke
      opgave van de goederen aan het bestuur van de regionale brandweer.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel22
  - number: '23.1'
    text: |-
      Binnen een maand na ontvangst van de in [artikel 22, tweede lid][ref1], bedoelde opgave besluit het bestuur van
      de regionale brandweer of de regionale brandweer de daarin vermelde goederen geheel of gedeeltelijk wenst te kopen
      tegen een nader overeen te komen prijs en doet het van dit besluit mededeling aan de kringraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel22
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '23.2'
    text: |-
      De termijn, bedoeld in het eerste lid, kan met een maand door de kringraad worden verlengd. De regionale brandweer
      wordt geacht van de koop af te zien, indien de mededeling niet tijdig wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel23
  - number: '23.3'
    text: |-
      Ten aanzien van die goederen die de regionale brandweer wenst te kopen, treden het bestuur van de regionale
      brandweer en de kringraad zo spoedig mogelijk in onderhandeling over de koop.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel23
  - number: '24.1'
    text: |-
      Binnen een maand na dagtekening van de mededeling, bedoeld in [artikel 23, eerste lid][ref1], besluiten het bestuur
      van de regionale brandweer en de kringraad over de koop onderscheidenlijk de verkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel23
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '24.2'
    text: |-
      De besluiten tot koop onderscheidenlijk verkoop van onroerende zaken behoeven de goedkeuring van gedeputeerde
      staten dan wel in geval de regionale brandweer of de kring in verschillende provincies is gelegen, goedkeuring bij
      koninklijk besluit, gedeputeerde staten gehoord.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel24
  - number: '24.3'
    text: |-
      De [artikelen 155, tweede lid][ref1], [263][ref2], [264][ref3], [266][ref4], [272, tweede lid][ref5],
      [280, tweede lid][ref6], en [281 van de Gemeentewet][ref7] (*Stb.* 1992, 96) zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel263
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel264
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel266
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel272
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel280
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel281
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '155'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '263'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '264'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '266'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '272'
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '280'
      - id: ref7
        bwb_id: BWBR0005416
        artikel: '281'
  - number: '25.1'
    text: |-
      De commandoposten, in eigendom van de kringen dan wel de gemeenten, worden binnen zes maanden na de datum van
      inwerkingtreding van deze wet door het Rijk tegen boekwaarde in eigendom overgenomen.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel25
  - number: '25.2'
    text: |-
      Binnen een maand na de datum van inwerkingtreding van deze wet verstrekt de kringraad een opgave van de boekwaarde
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel25
  - number: '26'
    text: |-
      Onze Minister vergoedt volgens door hem te stellen regels de kosten, die voor de provincies, de kringen, de
      gemeenten, die niet behoren tot een op grond van de [Wet bescherming bevolking][ref1] gevormde kring en de
      gemeenten, die op grond van [artikel 5, eerste lid][ref2], zijn belast met de voortzetting van de liquidatie,
      voortvloeien uit het bepaalde in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002096
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel5
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002096
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '5'
        hoofdstuk: III
  - number: '27'
    text: Onze Minister kan nadere regels stellen over de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel27
  - number: '28'
    text: |-
      Het Ambtenarenreglement noodwachters alsmede het Arbeidsovereenkomstenbesluit noodwachters worden bij koninklijk
      besluit op een in dat besluit te bepalen tijdstip ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel28
  - number: '29'
    text: |-
      Het Besluit Bedrijfszelfbescherming (*Stb.* 1958, 147), het [Besluit bescherming waterleidingbedrijven][ref1]
      (*Stb.* 1963, 361), alsmede het Besluit bescherming gas- en electriciteitsbedrijven (*Stb.* 1957, 580) blijven van
      kracht totdat zij worden vervangen of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004603
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004603
  - number: '30.1'
    text: |-
      Rechtsgedingen die betrekking hebben op de rechtspositie van de noodwachter worden na het verstrijken van de
      termijn, bedoeld in [artikel 4,eerste lid][ref1], of zoveel eerder als de liquidatie is voltooid, voortgezet door
      of tegen onderscheidenlijk gevoerd door of tegen Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003986#Artikel4
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003986
        artikel: '4'
        hoofdstuk: III
  - number: '30.2'
    text: |-
      De overige rechtsgedingen, waarbij een kring betrokken is, worden met ingang van de datum waarop de liquidatie
      is voltooid doch uiterlijk zes maanden na de datum van inwerkingtreding van deze wet voortgezet door of tegen de
      gemeente, waar de kring zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel30
  - number: '30.3'
    text: |-
      Ten aanzien van de rechtsgedingen, bedoeld in het eerste en tweede lid, is het bepaalde in de
      [artikelen 254 tot en met 262 van het Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel254
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '254'
  - number: '31'
    text: |-
      De archiefbescheiden van de kring worden overgebracht naar de archiefbewaarplaats van de gemeente waar de kring
      zijn zetel heeft, met inachtneming van de bepalingen van de [Archiefwet 1995][ref1] (*Stb.* 276).


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '32'
    text: |-
      Geschillen omtrent de toepassing van deze wet worden bij koninklijk besluit beslist, voor zover zij niet behoren
      tot die, vermeld in [artikel 112, eerste lid, van de Grondwet][ref1] of tot die, waarvan de beslissing op grond
      van [artikel 112, tweede lid, van de Grondwet][ref2] is opgedragen hetzij aan de rechterlijke macht, hetzij aan
      gerechten die niet tot de rechterlijke macht behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '112'
  - number: '33'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel33
  - number: '34'
    text: Deze wet kan worden aangehaald als Intrekkingswet BB.
    url: https://wetten.overheid.nl/BWBR0003986/1996-01-01#Artikel34
