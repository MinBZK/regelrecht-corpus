preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de taken van de in de Visserijwet 1963 bedoelde Organisatie ter
    verbetering van de binnenvisserij kunnen worden uitgeoefend door private organisaties, dat in verband daarmee de
    wettelijke basis van deze organisatie kan vervallen alsmede het in de Visserijwet 1963 vastgelegde systeem van de
    sportvisakte, en dat het tevens wenselijk is enkele andere wijzigingen in de Visserijwet 1963 door te voeren, onder
    meer op het punt van de versterking van de bestuursrechtelijke handhaving:

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De personen die op het tijdstip van inwerkingtreding van [artikel I, onderdeel I][ref1], van deze wet krachtens
      een arbeidsovereenkomst naar burgerlijk recht behoren tot het personeel van de Organisatie ter verbetering van
      de binnenvisserij als bedoeld in [artikel 38 van de Visserijwet 1963][ref2], van wie naam en functie zijn vermeld
      op een door het bestuur van de organisatie vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege
      ontslagen en aangesteld in dienst van de door Onze Minister aan te wijzen rechtspersoon met een rechtspositie die
      in totaliteit ten minste gelijkwaardig is aan die welke voor elk van hen gold bij de Organisatie ter verbetering
      van de binnenvisserij.


      [ref1]: https://wetten.overheid.nl/BWBR0020263#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel38
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0020263
        artikel: I
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '38'
  - number: III.1
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen die aan de
      Organisatie ter verbetering van de binnenvisserij als bedoeld in [artikel 38 van de Visserijwet 1963][ref1] worden
      toegerekend, worden toebedeeld aan de door Onze Minister aan te wijzen rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel38
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '38'
  - number: III.2
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op de door Onze Minister aan te wijzen rechtspersoon tegen een door Onze Minister in
      overeenstemming met Onze Minister van Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIII
  - number: III.3
    text: |-
      Terzake van de verkrijging van de vermogensbestanddelen van de Organisatie ter verbetering van de binnenvisserij,
      bedoeld in het eerste lid, blijft heffing van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIII
  - number: IV.1
    text: |-
      De archiefbescheiden betreffende aangelegenheden welke op het moment van inwerkingtreding van deze wet nog niet
      zijn afgedaan, worden tijdelijk ter beschikking gesteld aan de door Onze Minister aan te wijzen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: IV.2
    text: |-
      De archiefbescheiden betreffende zaken welke op het moment van inwerkingtreding van deze wet reeds zijn afgedaan
      kunnen, voor zover zij niet zijn overgebracht naar een rijksarchiefbewaarplaats, tijdelijk ter beschikking worden
      gesteld aan de in het eerste lid bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: IV.3
    text: |-
      De zorg voor de archiefbescheiden van de Organisatie voor de Verbetering van de Binnenvisserij gaat op het moment
      van inwerkingtreding van deze wet over naar Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: IV.4
    text: |-
      Onze Minister stelt vast voor welk tijdvak de in het eerste en tweede lid bedoelde archiefbescheiden aan de
      rechtspersoon ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: IV.5
    text: |-
      De rechtspersoon rapporteert jaarlijks aan Onze Minister over het beheer van de ter beschikking gestelde
      archiefbescheiden. Het in de [artikelen 25a][ref1] en [25b van de Archiefwet 1995][ref2] bedoelde toezicht op het
      beheer blijft op de krachtens het eerste en tweede lid ter beschikking gestelde archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel25b
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0007376
        artikel: 25b
  - number: IV.6
    text: |-
      Onze Minister is te allen tijde bevoegd inzage te nemen van de terbeschikkinggestelde archiefbescheiden dan wel
      daarvan of daaruit reproducties, afschriften of uittreksels te vorderen.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: IV.7
    text: |-
      De overbrenging van de in de in het eerste en tweede lid bedoelde archiefbescheiden naar een
      rijksarchiefbewaarplaats geschiedt door Onze Minister met inachtneming van de [artikelen 12][ref1] en
      [13 van de Archiefwet 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
  - number: IV.8
    text: |-
      De kosten van het beheer van de krachtens het eerste en tweede lid ter beschikking gestelde archiefbescheiden komen
      ten laste van de in deze leden bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelIV
  - number: V
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij de Organisatie ter verbetering van de binnenvisserij
      als bedoeld in [artikel 38 van de Visserijwet 1963][ref1], is betrokken, treedt met ingang van de datum van
      inwerkingtreding van deze wet Onze Minister in de plaats van de Organisatie ter verbetering van de binnenvisserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel38
    url: https://wetten.overheid.nl/BWBR0020263/2007-01-01#ArtikelV
