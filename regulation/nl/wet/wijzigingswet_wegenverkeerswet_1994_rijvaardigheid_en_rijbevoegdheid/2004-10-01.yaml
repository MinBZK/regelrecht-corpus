preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de voorschriften inzake rijbewijzen nader af te stemmen
    op richtlijn 91/439/EEG van de Raad van de Europese Gemeenschappen van 29 juli 1991 betreffende het rijbewijs
    (PbEG L 237), de voorschriften op het terrein van de rijvaardigheid en rijbevoegdheid aan te passen aan recente
    ontwikkelingen in de praktijk, alsmede een aantal technische onvolkomenheden in de Wegenverkeerswet 1994 weg te
    nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Artikel 110, eerste lid, van de Wegenverkeerswet 1994, zoals dat artikel luidde vóór het tijdstip van
      inwerkingtreding van [artikel I, onderdeel S][ref1], van deze wet, blijft van kracht ten aanzien van bestuurders
      van motorrijtuigen, al dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen,
      de bestuurder daaronder niet begrepen, die op dat tijdstip de leeftijd van achttien doch nog niet die van
      eenentwintig jaren hebben bereikt, voor zover


      [ref1]: https://wetten.overheid.nl/BWBR0013617#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0013617
        artikel: I
  - number: IV.a
    text: aan hen reeds vóór dat tijdstip een rijbewijs voor het besturen van de betrokken motorrijtuigen is afgegeven;
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelIV
  - number: IV.b
    text: |-
      zij blijkens een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid en geschiktheid tot het
      besturen van de betrokken motorrijtuigen, waarvoor de aanvraag vóór dat tijdstip is ingediend, beschikken over
      de voor het besturen van de betrokken motorrijtuigen vereiste rijvaardigheid en geschiktheid en aan hen na dat
      tijdstip een rijbewijs voor het besturen van de betrokken motorrijtuigen is afgegeven.
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelIV
  - number: V
    text: |-
      Artikel 110b, eerste lid, onderdeel b, zoals dat artikel luidde vóór het tijdstip van inwerkingtreding van
      [artikel I, onderdeel T][ref1], van deze wet, blijft van kracht ten aanzien van bestuurders van motorrijtuigen, al
      dan niet met aanhangwagen, die zijn ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder
      niet begrepen, die op dat tijdstip de leeftijd van achttien doch nog niet die van eenentwintig jaren hebben
      bereikt, voor zover de aanvraag voor het door of vanwege de overheid ingestelde onderzoek naar de rijvaardigheid en
      geschiktheid tot het besturen van de betrokken motorrijtuigen vóór dat tijdstip is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013617#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0013617
        artikel: I
  - number: VI
    text: |-
      Artikel 111, eerste lid, aanhef en onderdeel a, zoals dat artikel luidde vóór het tijdstip van inwerkingtreding van
      [artikel I, onderdeel U][ref1], van deze wet, blijft van kracht ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013617#ArtikelI
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0013617
        artikel: I
  - number: VI.a
    text: |-
      vóór dat tijdstip ingediende aanvragen van rijbewijzen voor het besturen van motorrijtuigen, al dan niet met
      aanhangwagen, ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen, die op
      dat tijdstip nog niet tot afgifte van een rijbewijs hebben geleid;
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelVI
  - number: VI.b
    text: |-
      na dat tijdstip ingediende aanvragen van rijbewijzen voor het besturen van motorrijtuigen, al dan niet met
      aanhangwagen, ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen,
      ingediend door een aanvrager die op dat tijdstip de leeftijd van achttien doch nog niet die van eenentwintig
      jaren heeft bereikt en die blijkens een door of vanwege de overheid ingesteld onderzoek naar de rijvaardigheid en
      geschiktheid tot het besturen van de betrokken motorrijtuigen, waarvoor de aanvraag vóór dat tijdstip is ingediend,
      beschikt over de voor het besturen van de betrokken motorrijtuigen vereiste rijvaardigheid en geschiktheid.
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelVI
  - number: VII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013617/2004-10-01#ArtikelVII
