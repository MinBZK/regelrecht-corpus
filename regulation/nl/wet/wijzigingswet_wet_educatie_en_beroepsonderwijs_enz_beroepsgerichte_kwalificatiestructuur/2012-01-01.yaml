  - number: Va
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt in overeenstemming met Onze Minister van Economische
      Zaken, Landbouw en Innovatie, binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0030698/2012-01-01#ArtikelVa
  - number: VI
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2012 en is voor het eerst van toepassing op beroepsopleidingen
      in het studiejaar 2012–2013. Indien deze wet na 31 december 2011 in het Staatsblad wordt geplaatst, treedt zij
      in werking met ingang van 1 augustus volgend op de datum waarop zij in het Staatsblad wordt geplaatst of, indien
      dat eerder is, 1 januari volgend op de datum waarop zij in het Staatsblad wordt geplaatst en is voor het eerst
      van toepassing op beroepsopleidingen in het studiejaar volgend op de datum waarop zij in het Staatsblad wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0030698/2012-01-01#ArtikelVI
