preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is in de Wet verontreiniging oppervlaktewateren enkele
    voorzieningen te treffen inzake zuivering van stedelijk afvalwater in verband met de waterkwaliteitszorg door
    waterschappen, alsmede inzake de aanwijzing van de waterschapsbesturen als het ingevolge die wet voor de betrokken
    oppervlaktewateren tot vergunningverlening bevoegd gezag;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013385/2002-07-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Een vergunning, als bedoeld in [artikel 1, eerste en derde lid , van de Wet verontreiniging oppervlaktewateren][ref1],
      welke vóór de inwerkingtreding van deze wet is verleend door gedeputeerde staten, dan wel door het bestuur van een
      gemeente of van enig ander openbaar lichaam waaraan met toepassing van [artikel 6 van die wet][ref2] de bevoegdheid
      tot vergunningverlening is toegekend, wordt beschouwd als te zijn verleend door het bestuur van het bevoegde
      waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel6
