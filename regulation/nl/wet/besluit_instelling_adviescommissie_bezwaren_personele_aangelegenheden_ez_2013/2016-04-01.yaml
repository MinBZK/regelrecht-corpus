preamble:
  text: >-
    Gelet op artikel 7:13 van de Algemene wet bestuursrecht en artikel 2 van de Wet vergoedingen adviescolleges en
    commissies;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *de minister:* de Minister van Economische Zaken;

      b. *het ministerie:* het Ministerie van Economische Zaken;

      c. *de medewerker:* het personeelslid en gewezen personeelslid van het ministerie, aangesteld krachtens het
      [Algemeen Rijksambtenarenreglement][ref1];

      d. *de bezwaarde:* de medewerker die een bezwaarschrift heeft ingediend;

      e. *de commissie:* de Adviescommissie bezwaren personele aangelegenheden EZ.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '2'
    text: >-
      1 Er is een Adviescommissie bezwaren personele aangelegenheden EZ.


      2 De commissie heeft tot taak de minister te adviseren over de te nemen besluiten op haar door de minister
      voorgelegde bezwaren van medewerkers tegen beslissingen die jegens hen als zodanig zijn genomen door, namens of op
      voordracht van de minister, waarbij hun rechtspositioneel belang rechtstreeks is betrokken.


      3 Het tweede lid is niet van toepassing als ingevolge enig wettelijk voorschrift een andere commissie over het
      betrokken bezwaar adviseert.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel2
  - number: '3'
    text: >-
      1 De commissie bestaat uit ten minste vijf door de minister benoemde leden.


      2 Leden van de commissie zijn:


      a. een door de minister aangewezen voorzitter, niet werkzaam onder de verantwoordelijkheid van de minister;


      b. ten minste twee door de minister aangewezen medewerkers;


      c. ten minste twee door de minister aangewezen leden op voordracht van het Departementaal Georganiseerd Overleg.


      3 De commissie wordt bijgestaan door een secretaris, niet zijnde lid van de commissie, die een medewerker is van
      het Expertisecentrum Organisatie en Personeel van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      4 Voor ieder lid van de commissie kan de minister ten minste één plaatsvervanger benoemen. Het bepaalde in het
      tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel3
  - number: '4'
    text: >-
      1 De leden van de commissie worden benoemd en ontslagen door de minister.


      2 De leden van de commissie worden benoemd voor een termijn van ten hoogste vier jaar.


      3 De leden van de commissie kunnen worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel4
  - number: '5'
    text: >-
      1 De voorzitter en de plaatsvervangend voorzitter van de commissie ontvangen een vergoeding van € 333,11 per
      vergadering.


      2 De leden en de plaatsvervangend leden van de commissie, met uitzondering van de door de minister als lid
      aangewezen medewerkers, ontvangen een vergoeding van € 256,24 per vergadering.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel5
  - number: '6'
    text: |-
      1 Per bezwaarbehandeling bestaat de commissie uit een voorzitter, een lid als bedoeld in
      [artikel 3, tweede lid, onder b][ref1], en een lid als bedoeld in artikel 3, tweede lid, onder c.

      2 In gevallen, waarin het niet mogelijk blijkt een commissie samen te stellen overeenkomstig het eerste lid,
      bepaalt de voorzitter de samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0033502#Artikel3
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033502
        artikel: '3'
        paragraaf: '2'
  - number: '7'
    text: >-
      1 De leden van de commissie verschonen zich van de behandeling van zaken waarbij zij in enig opzicht betrokken
      zijn geweest.


      2 De leden van de commissie kunnen worden gewraakt om aan de behandeling van in het eerste lid bedoelde zaken deel
      te nemen.


      3 De leden van de commissie, met uitzondering van de gewraakte leden, beslissen of de wraking wordt toegestaan. Bij
      staken van stemmen is de wraking toegestaan.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel7
  - number: '8'
    text: >-
      1 Iedere medewerker is verplicht alle inlichtingen naar waarheid en zonder voorbehoud te verstrekken die de
      commissie nodig acht voor het uitbrengen van een advies.


      2 De commissie kan daarvoor in aanmerking komende derden oproepen voor het verkrijgen van inlichtingen die zij
      behoeft, mits over daarmee gemoeide kosten vooraf overeenstemming bestaat met de minister.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel8
  - number: '9'
    text: >-
      1 De commissie kan zich door deskundigen van advies en verslag laten dienen.


      2 De commissie kan overlegging vorderen van ter zake dienende bescheiden.


      3 De commissie is bevoegd een onderzoek ter plaatse in te stellen of te doen instellen.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel9
  - number: '10'
    text: >-
      1 De bij de behandeling van een zaak betrokken leden van de commissie stellen het advies van de commissie vast bij
      meerderheid van stemmen. Geen van de betrokken leden onthoudt zich van stemming.


      2 De secretaris bereidt het schriftelijk advies van de commissie voor.


      3 De bij de behandeling van een zaak fungerend voorzitter en fungerende secretaris van de commissie ondertekenen
      het advies.


      4 De secretaris zendt het advies en het verslag van de hoorzitting aan de minister.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel10
  - number: '11'
    text: >-
      Het is de leden en de secretaris van de commissie en hun plaatsvervangers verboden:


      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      gevorderd wordt;


      b. de gevoelens te openbaren, die tijdens de beraadslaging over het bezwaar zijn geuit;


      c. over een aan hen voorgelegde zaak of over een zaak die, naar zij weten of kunnen vermoeden, aan hen zal worden
      voorgelegd zich uit te laten in enig onderhoud of gesprek met:


      1°. de bezwaarde, zijn raadsman of gemachtigde;


      2°. degene die het betrokken besluit heeft genomen of de door deze aangewezen vertegenwoordiger;


      d. enige schriftelijke informatie in ontvangst te nemen van de in onderdeel c bedoelde personen of dezen in
      de gelegenheid te stellen anderszins hierover mededelingen aan hen te doen, met uitzondering van informatie of
      mededelingen aan de secretaris in het kader van de normale secretariaatswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel11
  - number: '12'
    text: |-
      De bezwaren die voor de inwerkingtreding van dit besluit zijn voorgelegd aan
      de Adviescommissie bezwaren personele aangelegenheden EL&I, ingesteld bij
      [Besluit Instelling Adviescommissie bezwaren personele aangelegenheden EL&I 2012][ref1], en waarover nog geen
      advies over de te nemen beslissing op bezwaar is uitgebracht, worden geacht aan de in [artikel 2][ref2] van dit
      besluit bedoelde commissie te zijn voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031461
      [ref2]: https://wetten.overheid.nl/BWBR0033502#Artikel2
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel12
