  - number: '13'
    text: >-
      De benoeming van de op het tijdstip van inwerkingtreding van dit besluit zittende leden en plaatsvervangende leden
      van de Adviescommissie bezwaren personele aangelegenheden EL&I 2012 blijft, behoudens tussentijds ontslag, van
      kracht tot 1 april 2016.
    url: https://wetten.overheid.nl/BWBR0033502/2016-04-01#Artikel13
