  - number: '5'
    text: |-
      1 Subsidie voor de aanleg van de COVID-19 crisisvoorraad geneesmiddelen, bedoeld in
      [artikel 3, eerste lid, onder c][ref1], wordt uitsluitend verstrekt indien:

      a. de instelling voor het indienen van de aanvraag door het LCG is geadviseerd over de inhoud en omvang van de
      COVID-19 crisisvoorraad geneesmiddelen; en

      b. de inkoop volgens de daarvoor vastgestelde procesmatige en inhoudelijke kaders van het LCG geschiedt,
      overeenkomstig [bijlage II][ref2].

      2 Subsidie voor bouwkundige aanpassingen als bedoeld in [artikel 3, eerste lid, onder a][ref3], wordt uitsluitend
      verstrekt indien:

      a. de aanpassingen plaatsvinden binnen de bestaande bouwkundige grenzen van de instelling; en

      b. het comité bouwkundige aanpassingen positief advies uitbrengt in het geval de aanvraag hoger is dan het
      totaal van € 75.000 per IC-bed in opschalingsfase 1 en 2 en hoger is dan het totaal van € 25.000 per IC-bed in
      opschalingsfase 3.

      3 Subsidie voor opleidingsactiviteiten als bedoeld in [artikel 3][ref4], wordt uitsluitend verstrekt indien voor
      diezelfde kosten niet reeds op grond van de [Subsidieregeling kwaliteitsimpuls ziekenhuiszorg 2020 –2022][ref5],
      SectorPlanPlus of de Beleidsregel Beschikbaarheidbijdrage (medische) vervolgopleidingen 2020 subsidie is
      aangevraagd en verstrekt.

      4 Subsidie voor opschalingsfase 1+ als bedoeld in [artikel 3, tweede lid][ref6], wordt uitsluitend verstrekt
      indien:

      a. de instelling tijdig bezwaar heeft gemaakt tegen de verleningsbeschikking op basis van de Subsidieregeling
      opschaling curatieve zorg COVID-19;

      b. de instelling heeft aangetoond dat het aantal IC-bedden in de uitgangssituatie overeenkomstig het
      opschalingsplan niet correct is;

      c. binnen de betreffende ROAZ, als gevolg van de gecorrigeerde uitgangssituatie, sprake is van een bovengemiddelde
      opschaling van IC-bedden in opschalingsfase 1; en

      d. de voor de instelling juiste uitgangssituatie is opgenomen in een addendum bij het opschalingsplan.

      5 Subsidie voor opschalingsfase 2 wordt uitsluitend verstrekt indien de instelling het aantal op te schalen koude
      IC-bedden overeenkomstig [bijlage I][ref7] en bijbehorende klinische bedden fysiek aanwezig heeft en voor deze
      bedden personeel beschikbaar heeft.

      6 Subsidie voor opschalingsfase 3 wordt uitsluitend verstrekt indien de instelling het aantal op te schalen koude
      IC-bedden overeenkomstig [bijlage I][ref8] en bijbehorende klinische bedden binnen 48 uur beschikbaar kan maken
      voor patiëntenzorg.


