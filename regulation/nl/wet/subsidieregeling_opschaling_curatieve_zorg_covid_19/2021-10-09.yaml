        artikel: '7'
  - number: '11'
    text: |-
      1 De instelling is verplicht:

      a. het aantal IC-bedden beschikbaar te hebben dat overeenkomstig [bijlage I][ref1] voor die instelling is
      vastgesteld;

      b. zich in te spannen om de zorg aan niet-COVID-19 patiënten in opschalingsfase 2 en opschalingsfase 3 maximaal op
      peil te houden;

      c. een contactpersoon aan te wijzen binnen de instelling die mandaat heeft om in overleg te treden met de minister,
      zorgverzekeraars en het ROAZ;

      d. dagelijks informatie aan het LCPS of de ROAZ aan te leveren over het aantal reguliere patiënten en COVID-19
      patiënten dat is opgenomen in de instelling;

      e. zich in te spannen om eventuele herverdeling van het aantal op te schalen IC-bedden binnen de ROAZ-regio tot
      stand te brengen; en

      f. een administratie te voeren die zodanig is ingericht dat daarin te allen tijde de voor de vaststelling van de
      subsidie van belang zijnde gegevens kunnen worden nagegaan.

      2 De instelling die subsidie ontvangt voor de aanleg van de COVID-19 crisisvoorraad geneesmiddelen is verplicht:

      a. medewerking te verlenen aan alle monitoringsverzoeken van het LCG;

      b. onmiddellijk gevolg te geven aan verzoeken van het LCG om een gedeelte van de COVID-19 crisisvoorraad
      geneesmiddelen over te dragen aan een andere instelling; en

      c. zich in te spannen om de COVID-19 crisisvoorraad geneesmiddelen gedurende de subsidieperiode continu op peil te
      houden, overeenkomstig de afspraken met het LCG.

      3 De instelling die subsidie ontvangt doet inhoudelijk verslag van de voortgang van de gesubsidieerde activiteiten,
      bedoeld in [artikel 3][ref2]. Het besluit tot verlening van de subsidie vermeldt op welke tijdstippen verslag wordt
      gedaan en waaruit het verslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0044273
      [ref2]: https://wetten.overheid.nl/BWBR0044273#Artikel3
