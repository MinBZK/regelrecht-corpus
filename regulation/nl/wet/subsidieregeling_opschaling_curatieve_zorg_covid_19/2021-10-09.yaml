articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *bouwkundige aanpassingen:* het plaatsen, aanbrengen of veranderen van een bouwwerk, ten behoeve van
      opschalingsfase 1, opschalingsfase 2 of opschalingsfase 3 waarbij geen wijzigingen aan het fysieke bouwvolume, aan
      zijgevels, achtergevels en daken worden toegepast;
        - *bouwwerk:* elke constructie van enige omvang van hout, steen, metaal of ander materiaal, die op de plaats van
      bestemming hetzij direct, hetzij indirect steun vindt in de grond, bedoeld om ter plaatste te functioneren;
        - *bovengemiddelde opschaling:* opschaling van reguliere IC-bedden door instellingen binnen de ROAZ-regio die,
      als gevolg van de gecorrigeerde uitgangssituatie, ten opzichte van andere ROAZ-regio’s meer reguliere IC-bedden
      opschalen dan de gemiddelde 10%;
        - *comité bouwkundige aanpassingen:* extern comité van onafhankelijke deskundigen dat de minister adviseert over de
      noodzakelijkheid van bouwkundige aanpassingen, waarvan de werkwijze is opgenomen in [bijlage III][ref2];
        - *COVID-19 crisisvoorraad geneesmiddelen:* voorraad van geneesmiddelen per ziekenhuis die het LCG als noodzakelijk
      beschouwt bij de behandeling van COVID-19 patiënten;
        - *COVID-19 patiënt:* een persoon bij wie de infectieziekte SARS-CoV-2 is vastgesteld of een persoon bij wie de
      verdenking bestaat van een besmetting met de infectieziekte SARS-CoV-2;
        - *gecorrigeerde uitgangssituatie:* aantal pre-corona reguliere IC-bedden, met en zonder beademingsapparatuur, per
      instelling als opgenomen in [bijlage I][ref3];
        - *gerealiseerd flexibel IC-bed:* IC-bed geschikt voor IC-zorg en aanwezig in de instelling, inclusief
      beschikbaarheid van bijbehorende voorzieningen om IC-zorg te kunnen verlenen en een plan waar dit bed geplaatst kan
      worden bij een piekbelasting;
        - *gerealiseerd vast IC-bed:* IC-bed dat fysiek aanwezig is in de instelling, inclusief bijbehorende voorzieningen
      en 5 fte personeel, dat direct voor zorg inzetbaar is;
        - *IC:* Intensive Care;
        - *IC-bed:* een bed met bijbehorende voorzieningen en personeel op een intensieve zorgafdeling van een instelling,
      zijnde een: 1° regulier IC-bed in opschalingsfase 1; 2° regulier IC-bed in opschalingsfase 1+; 3° vast IC-bed in
      opschalingsfase 2; of 4° flexibel IC-bed in opschalingsfase 3;
        - *instelling:* een in [bijlage I][ref4] opgenomen zorginstelling;
        - *klinisch bed:* een bed met bijbehorende voorzieningen en personeel op een klinische afdeling van een instelling,
      zijnde een 1° vast klinisch bed in opschalingsfase 2; of 2° flexibel klinisch bed in opschalingsfase 3;
        - *koud bed:* een beschikbaar IC-bed of klinisch bed dat wordt vrijgehouden voor een COVID-19 patiënt;
        - *LCG:* Landelijk Coördinatiecentrum Geneesmiddelen;
        - *LCPS:* Landelijk Coördinatiecentrum Patiënten Spreiding;
        - *LNAZ:* Landelijk Netwerk Acute Zorg;
        - *materiële kosten:* kosten voor materiaal behorende bij een IC-bed of een klinisch bed, waaronder kosten voor
      bloed, kunst- en hulpmiddelen, implantaten en geneesmiddelen, niet zijnde geneesmiddelen die behoren tot de COVID-
      19 crisisvoorraad geneesmiddelen;
        - *medische inventaris:* patiëntgericht meubilair en patiëntgerichte apparatuur;
        - *minister:* Minister voor Medische Zorg;
        - *opleidingsactiviteiten:* activiteiten ten behoeve van opleiden, leren en ontwikkelen die noodzakelijk zijn voor
      het realiseren van opschalingsfase 1, opschalingsfase 2 en opschalingsfase 3;
        - *opschalingsfase 1:* de opschaling van reguliere IC-bedden ten behoeve van zowel non-COVID-19 patiënten als
      COVID-19 patiënten, waarmee het totaal aantal IC-bedden, tezamen met de opschaling van IC-bedden in opschalingsfase
      1+, in Nederland op 1.150 komt;
        - *opschalingsfase 1+:* de bovengemiddelde opschaling van reguliere IC-bedden ten behoeve van zowel non-COVID-19
      patiënten als COVID-19 patiënten, waarmee het totaal aantal IC-bedden, tezamen met de opschaling van IC-bedden in
      opschalingsfase 1, in Nederland op 1.150 komt;
        - *opschalingsfase 2:* de opschaling met 200 vaste koude IC-bedden en 400 vaste klinische bedden ten behoeve van
      uitsluitend COVID-19-patiënten, waarmee het totaal aantal IC-bedden in Nederland op 1.350 komt;
        - *opschalingsfase 3:* de opschaling met 350 flexibele koude IC-bedden en 700 flexibele klinische bedden ten
      behoeve van uitsluitend COVID-19 patiënten, waarmee het totaal aantal IC-bedden in Nederland op 1.700 komt;
        - *opschalingsplan:* het Opschalingsplan COVID-19 van het LNAZ van 30 juni 2020;
        - *ROAZ:* Regionaal Overleg Acute Zorgketen;
        - *warm bed:* een IC-bed of klinisch bed dat wordt bezet door een patiënt.


