  - number: '8'
    text: |-
      1 Voor de aanvraag tot verlening van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      2 De aanvraag wordt ingediend in de periode van 2 november 2020 tot en met 13 november 2020. Aanvragen die na die
      datum worden ontvangen, worden afgewezen.

      3 De aanvraag gaat vergezeld van:

      a. inzake bouwkundige aanpassingen:

      1° een plan voor de totale bouwkundige aanpassingen, indien de aanvraag voor opschalingsfase 1 en 2 minder dan
      € 75.000 per IC-bed bedraagt en voor opschalingsfase 3 minder dan € 25.000 per IC-bed, of

      2° een plan voor de totale bouwkundige aanpassingen en de bijbehorende offertes, indien de aanvraag voor
      opschalingsfase 1 en 2 meer dan € 75.000 per IC-bed bedraagt en voor opschalingsfase 3 meer dan € 25.000 per IC-
      bed;

      b. een lijst van de medische inventaris;

      c. een overzicht van het aan te leggen volume van de COVID-19 crisisvoorraad geneesmiddelen en de bijbehorende
      kosten op geaggregeerd niveau;

      d. een advies van het LCG ten aanzien van het volume van de COVID-19 crisisvoorraad geneesmiddelen; en

      e. een opschalingsvoorstel, inclusief onderbouwing op welke wijze de Raad van Bestuur van de instelling zo
      doelmatig mogelijk vorm geeft aan opschalingsfase 2 en opschalingsfase 3.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel8
  - number: '9'
    text: |-
      1 Indien in een aanvraag de begrote kosten voor bouwkundige aanpassingen meer dan € 75.000 per IC-bed in
      opschalingsfase 1 en opschalingsfase 2 of meer dan € 25.000 per IC-bed in opschalingsfase 3 bedragen, wordt de
      aanvraag ter advies voorgelegd aan het comité bouwkundige aanpassingen.

      2 Indien de bij de aanvraag verstrekte gegevens of bescheiden onvoldoende zijn voor de beoordeling stelt het comité
      bouwkundige aanpassingen de instelling in de gelegenheid de aanvraag binnen twee weken aan te vullen.

      3 Het comité bouwkundige aanpassingen kan volstaan met een beperkt onderzoek indien het comité van oordeel is dat:

      a. de aanvraag kennelijk niet voldoet aan de bij deze regeling gestelde eisen;

      b. de aanvraag nagenoeg geheel overeenkomt met andere aanvragen waarover het comité bouwkundige aanpassingen reeds
      advies heeft uitgebracht;

      c. de bouwkundige aanpassingen naar verwachting niet of niet geheel zullen plaatsvinden;

      d. de aanvrager onjuiste of onvolledige gegevens heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel9
  - number: '10'
    text: |-
      1 De minister besluit binnen 22 weken na ontvangst van de aanvraag tot subsidieverlening.

      2 De minister vermeldt in het besluit tot verlening van de subsidie:

      a. voor welke periode subsidie wordt verleend;

      b. de bouwkundige aanpassingen, het aantal IC-bedden, klinische bedden, de medische inventaris en de inhoud en
      omvang van de COVID-19 crisisvoorraad geneesmiddelen waarvoor de subsidie wordt verleend;

      c. het advies van het comité bouwkundige aanpassingen voor bouwkundige aanpassingen boven het maximumbedrag per IC-
      bed, bedoeld in [artikel 7, eerste lid, onder a en onder b][ref1];

      d. de hoogte van het subsidiebedrag;

      e. de wijze waarop tussentijds inhoudelijk verslag wordt gedaan; en

      f. de wijze waarop de verleende subsidie wordt verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0044273#Artikel7
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel10
