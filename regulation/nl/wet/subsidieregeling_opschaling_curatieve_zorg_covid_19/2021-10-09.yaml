  - number: '13'
    text: |-
      1 De minister verleent bij het besluit tot verlening van de subsidie voor activiteiten als bedoeld in
      [artikel 3, eerste lid, onder a tot en met c][ref1], een voorschot van 100% dat in een keer wordt betaald.

      2 Bij het besluit tot verlening van de subsidie voor opleidingsactiviteiten in opschalingsfase 1 als bedoeld in
      [artikel 3, eerste lid, onder d][ref2], verleent en betaalt de minister de volgende voorschotten:

      a. in 2020: € 30.000 per IC-bed;

      b. in 2021: € 60.000 per IC-bed; en

      c. in 2022: € 30.000 per IC-bed.

      3 Bij het besluit tot verlening van de subsidie voor opschalingsfase 1+, bedoeld in [artikel 3, tweede lid][ref3],
      verleent en betaalt de minister de volgende voorschotten:

      a. in 2021: € 398.608 per IC-bed; en

      b. in 2022: € 235.738 per IC-bed.

      4 Bij het besluit tot verlening van de subsidie voor opschalingsfase 2, bedoeld in
      [artikel 3, eerste lid, onder e][ref4], verleent en betaalt de minister de volgende voorschotten:

      a. in 2020: € 164.765 per IC-bed;

      b. in 2021: € 599.059 per IC-bed; en

      c. in 2022: € 569.059 per IC-bed.

      5 Bij het besluit tot verlening van de subsidie voor opschalingsfase 3, bedoeld in
      [artikel 3, eerste lid, onder f][ref5], verleent en betaalt de minister de volgende voorschotten:

      a. in 2021: € 127.001 per IC-bed; en

      b. in 2022: € 97.001 per IC-bed.


