  - number: '6'
    text: |-
      Niet-subsidiabele kosten zijn:

      a. de zorgkosten voor de behandeling van COVID-19-patiënten en niet-COVID-19 patiënten;

      b. bestuurs- en secretariaatskosten en andere materiële kosten;

      c. de kosten voor aanschaf en onderhoud van beademingsapparatuur en patiëntmonitorsystemen, bijbehorende
      accessoires en disposables;

      d. de kosten voor persoonlijke beschermingsmiddelen;

      e. kosten voor vervoer van COVID-19 patiënten en voor de coördinatie van COVID-19 patiëntenstromen; en

      f. personeelskosten in opschalingsfase 2 en opschalingsfase 3 die reeds uit andere bronnen gefinancierd worden.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel6
  - number: '7'
    text: |-
      1 Het bedrag van de subsidieverlening voor een instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5, eerste tot en met derde, vijfde en zesde lid][ref1], bestaat uit de som van:

      a. de eenmalige kosten ten behoeve van bouwkundige aanpassingen in opschalingsfase 1 en opschalingsfase 2 vanaf
      1 juli 2020 tot 1 oktober 2021;

      b. de eenmalige kosten ten behoeve van bouwkundige aanpassingen in opschalingsfase 3 vanaf 1 juli 2020 tot
      1 oktober 2021;

      c. de eenmalige kosten ten behoeve van de medische inventaris in opschalingsfase 1 en opschalingsfase 2 van 1 juli
      2020 tot 1 oktober 2021, tot een maximum van € 60.000 per IC-bed in die fases, overeenkomstig [bijlage I][ref2];

      d. de eenmalige kosten ten behoeve van de medische inventaris in opschalingsfase 3 van 1 juli 2020 tot 1 oktober
      2021, tot een maximum van € 30.000 per IC-bed in die fase, overeenkomstig [bijlage I][ref3];

      e. de eenmalige kosten ten behoeve de COVID-19 crisisvoorraad geneesmiddelen 29 juli 2021, bestaande uit de som
      van:

      1° de inkoopprijs van de geneesmiddelen, zijnde geregistreerde producten en eigen bereidingen;

      2° 10% van de inkoopprijs, bedoeld onder 1°, voor de opslag- en beheerkosten; en

      3° 50% van de apotheekinkoopprijs van uitgestelde eigen bereidingen;

      f. een vergoeding per IC-bed voor opleidingsactiviteiten in opschalingsfase 1 van € 120.000 vanaf 1 juli 2020 tot
      en met 31 december 2022, tot het maximum aantal opgenomen IC-bedden per instelling in die fase, overeenkomstig
      [bijlage I][ref4];

      g. een vergoeding van € 1.332.883 per koud IC-bed in opschalingsfase 2, die loopt vanaf 1 oktober 2020 tot en
      met 31 december 2022, tot het maximum aantal opgenomen IC-bedden per instelling in die fase, overeenkomstig
      [bijlage I][ref5]; en

      h. een vergoeding van € 224.002 per koud IC-bed in opschalingsfase 3, die loopt vanaf 1 januari 2021 tot en
      met 31 december 2022, tot het maximum aantal opgenomen IC-bedden per instelling in die fase, overeenkomstig
      [bijlage I][ref6].

      2 Het bedrag van de subsidieverlening kan worden verhoogd voor elke dag dat een koud IC-bed gedurende
      opschalingsfase 3 wijzigt in een warm IC-bed. Het bedrag van de verhoging bestaat uit een bedrag van € 882 per warm
      IC-bed per dag, tot ten hoogste het in [bijlage I][ref7] bepaalde aantal IC-bedden in opschalingsfase 3, voor de
      periode van 1 januari 2021 tot en met 31 december 2022.

      3 Het bedrag van de subsidieverlening voor een instelling die voldoet aan de voorwaarden, bedoeld in artikel 5,
      vierde lid, bestaat uit de som van:

      a. de eenmalige kosten ten behoeve van de medische inventaris in opschalingsfase 1+ vanaf 1 juli 2020 tot 1 oktober
      2021, tot een maximum van € 60.000 per IC-bed in die fase, overeenkomstig [bijlage I][ref8];

      b. een vergoeding per IC-bed voor opleidingsactiviteiten in opschalingsfase 1+ van € 120.000 vanaf 1 juli 2020
      tot en met 30 juni 2022, tot het maximum aantal opgenomen IC-bedden per instelling in die fase, overeenkomstig
      [bijlage I][ref9]; en

      c. een vergoeding van € 514.346 per koud IC-bed in opschalingsfase 1+, die loopt van 1 juli 2020 tot en
      met 31 december 2022, tot het maximum aantal opgenomen IC-bedden per instelling in die fase, overeenkomstig
      [bijlage I][ref10].


