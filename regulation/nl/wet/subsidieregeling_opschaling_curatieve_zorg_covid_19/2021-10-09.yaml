  - number: '14'
    text: |-
      1 Voor de aanvraag tot vaststelling van de subsidie wordt een door de minister vastgesteld formulier gebruikt.

      2 De aanvraag tot vaststelling van de subsidie wordt ingediend voor 1 juni 2023.

      3 De aanvraag tot vaststelling van de subsidie gaat vergezeld van:

      a. een financieel verslag, waarbij inzicht wordt gegeven in de werkelijk gemaakte kosten van de activiteiten
      inhoudende:

      1° de bouwkundige aanpassingen;

      2° de medische inventaris; en

      3° de opbouw van de COVID-19 crisisvoorraad geneesmiddelen;

      b. een activiteitenverslag, waarin de subsidieontvanger inzicht geeft in:

      1° het aantal gerealiseerde vaste IC-bedden op 1 januari 2021 en 1 januari 2022, het aantal gerealiseerde flexibele
      bedden en het aantal warme IC-bedden in opschalingsfase 3;

      2° de manier waarop invulling is gegeven aan de realisatie van de klinische bedden behorende bij een IC-bed;

      3° de manier waarop aan de voorwaarden en verplichtingen van deze regeling is voldaan;

      4° de gegeven en gevolgde opleidingen;

      5° het aantal opgeleide personen per opleiding per opschalingsfase; en

      6° de manier waarop invulling is gegeven aan de beschikbaarheid van personeel.

      4 Het financieel verslag gaat vergezeld van een controleverklaring opgesteld door een accountant overeenkomstig een
      door de minister vastgesteld model met inachtneming van een door de minister vastgesteld accountantsprotocol.

      5 Ten aanzien van de activiteit, bedoeld in het derde lid, onder b, sub 1°, wordt verantwoording afgelegd door het
      overleggen van een assurancerapport van een accountant, opgesteld overeenkomstig een door de minister vastgesteld
      model met inachtneming van een door de minister vastgesteld accountantsprotocol.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel14
  - number: '15'
    text: |-
      1 Indien de activiteiten, bedoeld in [artikel 3, eerste lid, onder a tot en met c][ref1], en artikel 3, tweede
      lid, onder a, geheel zijn verricht en volledig is voldaan aan de verplichtingen die verbonden zijn aan de verleende
      subsidie, wordt de subsidie vastgesteld op het bedrag dat bestaat uit de gerealiseerde kosten, tot ten hoogste het
      in de verleningsbeschikking genoemde bedrag.

      2 De subsidie voor de activiteiten, bedoeld in [artikel 3, eerste lid, onder d tot en met g][ref2], en artikel 3,
      tweede lid, onder b en c, wordt vastgesteld op een bedrag per gerealiseerd vast IC-bed en gerealiseerd flexibel IC-
      bed, waarbij tevens rekening wordt gehouden met de dagvergoeding, bedoeld in [artikel 7, tweede lid][ref3], voor
      een warm IC-bed en waarvan de hoogte door de minister bij de verlening is genoemd.

      3 De subsidie voor de activiteiten, bedoeld in [artikel 3, eerste lid, onder d tot en met f][ref4], en artikel 3,
      tweede lid, onder b en c, wordt vastgesteld tot ten hoogste het in de verleningsbeschikking genoemde bedrag.

      4 De minister kan de subsidie, bedoeld in het tweede lid, lager vaststellen indien de instelling op 1 januari 2021
      en op 1 januari 2022, in vergelijking met peildatum 1 januari 2020, minder dan 5 fte personeel per gerealiseerd
      vast IC-bed beschikbaar heeft. In dat geval wordt de subsidie per niet-gerealiseerde fte verminderd met een bedrag
      van € 89.242 per IC-bed per jaar.

      5 De minister besluit binnen 22 weken op een aanvraag tot vaststelling.


