  - number: '2'
    text: |-
      Op deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '3'
    text: |-
      1 De minister kan aan een instelling op aanvraag een subsidie verstrekken voor:

      a. bouwkundige aanpassingen ten behoeve van opschalingsfase 1 tot en met opschalingsfase 3;

      b. medische inventaris ten behoeve van opschalingsfase 1 tot en met opschalingsfase 3;

      c. de aanleg van de COVID-19 crisisvoorraad geneesmiddelen ten behoeve van opschalingsfase 2 en opschalingsfase 3;

      d. opleidingsactiviteiten ten behoeve van opschalingsfase 1;

      e. activiteiten in de vorm van de uitbreiding en het beschikbaar houden van koude IC-bedden en klinische bedden ten
      behoeve van opschalingsfase 2;

      f. activiteiten in de vorm van de uitbreiding en het beschikbaar houden van koude IC-bedden en klinische bedden ten
      behoeve van opschalingsfase 3; en

      g. activiteiten ten behoeve van een warm bed in opschalingsfase 3.

      2 De minister kan aan een instelling ten behoeve van opschalingsfase 1+ ambtshalve een subsidie verstrekken voor:

      a. medische inventaris ten behoeve van opschalingsfase 1+;

      b. opleidingsactiviteiten ten behoeve van opschalingsfase 1+; en

      c. activiteiten in de vorm van de uitbreiding en het beschikbaar houden van koude IC-bedden en klinische bedden ten
      behoeve van opschalingsfase 1+.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel3
  - number: '4'
    text: |-
      1 De minister beziet gedurende de subsidieperiode hoe de uitbraak van COVID-19 zich ontwikkelt en in hoeverre het
      uitvoeren van de diverse activiteiten, bedoeld in [artikel 3][ref1], noodzakelijk blijft om die uitbraak onder
      controle te krijgen en te houden.

      2 Indien gedurende de subsidieperiode op basis van advies van het Outbreak Management Team blijkt dat de
      uitbraak van COVID-19 zich zodanig ontwikkelt dat de activiteiten waarvoor subsidie is verleend, bedoeld in
      [artikel 3, eerste lid, onder e en f][ref2], niet meer geheel noodzakelijk zijn, treedt de minister daarover
      onverwijld in overleg met de instellingen die subsidie ontvangen.

      3 Indien de omstandigheid, bedoeld in het tweede lid, zich voordoet, kan de minister de subsidieverlening ten
      nadele van de subsidie-ontvangende instelling wijzigen of de subsidie lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0044273#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044273#Artikel3
