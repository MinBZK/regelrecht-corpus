  - number: '12'
    text: |-
      1 De instelling die subsidie ontvangt meldt onverwijld schriftelijk aan de minister indien:

      a. aannemelijk is geworden dat de activiteiten waarvoor de subsidie is verstrekt niet, niet tijdig of niet geheel
      zullen worden verricht,

      b. aannemelijk is geworden dat niet, niet tijdig of niet geheel aan de subsidieverplichtingen zal worden voldaan,
      of

      c. zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.

      2 In aanvulling op het eerste lid, meldt de instelling die subsidie ontvangt onverwijld schriftelijk aan de
      minister indien sprake is van een voornemen tot herverdeling van het aantal op te schalen IC-bedden en klinische
      bedden waarmee het ROAZ heeft ingestemd, in afwijking van [bijlage I][ref1]. De minister beslist binnen 6 weken op
      de melding.

      3 In aanvulling op het eerste lid, maakt de instelling die subsidie ontvangt halfjaarlijks schriftelijk melding
      aan de minister van het aantal dagen dat koude IC-bedden in opschalingsfase 3 overeenkomstig [bijlage I][ref2] zijn
      gewijzigd in warme bedden.

      4 De melding wordt voorzien van een toelichting. Bij de melding worden de relevante stukken overgelegd.

      5 Indien een melding als bedoeld in [artikel 12, eerste tot en met derde lid][ref3], daartoe aanleiding geeft, kan
      de minister besluiten de subsidieverlening te herzien, in afwijking van [bijlage I][ref4], en de bevoorschotting
      te herzien.


