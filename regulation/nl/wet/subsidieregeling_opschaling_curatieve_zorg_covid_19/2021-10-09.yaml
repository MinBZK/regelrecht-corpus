  - number: '16'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor zover
      toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel16
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst. De regeling vervalt met ingang van 31 december 2022.
    url: https://wetten.overheid.nl/BWBR0044273/2021-10-09#Artikel17
