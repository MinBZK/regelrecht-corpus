$id: wet_opneming_buitenlandse_kinderen_ter_adoptie
regulatory_layer: WET
publication_date: '2013-02-28'
valid_from: '2012-01-01'
bwb_id: BWBR0004447
url: https://wetten.overheid.nl/BWBR0004447/2012-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de voorwaarden waaraan moet zijn voldaan bij de
    opneming in Nederland van een buitenlands pleegkind met het oog op adoptie in de wet neer te leggen en tevens bij
    de wet te bepalen dat bemiddelende werkzaamheden inzake een zodanige opneming slechts kunnen worden verricht door
    organisaties aan welke daartoe een vergunning is verleend en op de bij of krachtens de wet bepaalde wijze, zulks
    ter bevordering van een verantwoorde gang van zaken rond de opneming in Nederland van buitenlandse pleegkinderen
    met het oog op adoptie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: *Onze Minister:* Onze Minister van Justitie;
      *buitenlands kind:* een buiten Nederland geboren, de Nederlandse nationaliteit niet bezittende minderjarige in
      de zin van de Nederlandse wet, die in Nederland met het oog op adoptie in een ander gezin dan het ouderlijke
      wordt of zal worden verzorgd en opgevoed in zodanige omstandigheden dat de verzorgers in feite de plaats van
      de ouders innemen; *aspirant-adoptiefouders:* echtgenoten of een persoon die een buitenlands kind met het
      oog op adoptie wensen op te nemen of hebben opgenomen; *adoptiefouders:* echtgenoten of een persoon die een
      buitenlands kind hebben geadopteerd; *beginseltoestemming:* de schriftelijke mededeling van Onze Minister
      omschreven in [artikel 2][ref1]; *vergunninghouder:* de rechtspersoon die houder is van een vergunning als
      bedoeld in de[ artikelen 15][ref2] en [16][ref3]. *bemiddeling:* elke activiteit van een vergunninghouder gericht
      op totstandkoming van, of ondersteuning bij, de plaatsing van een buitenlands kind met het oog op adoptie bij
      aspirant-adoptiefouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel16
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '15'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: '16'
        hoofdstuk: '5'
  - number: '2'
    text: |-
      De opneming in Nederland van een buitenlands kind met het oog op adoptie is uitsluitend toegestaan, indien van
      Onze Minister een voorafgaande schriftelijke mededeling is verkregen, dat deze in beginsel voor zodanige opneming
      toestemming verleent.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel2
  - number: '3.1'
    text: |-
      De beginseltoestemming geldt voor een periode van vier jaren en kan telkens voor een periode van vier jaren worden
      verlengd. De periode waarvoor zij wordt verleend of verlengd, overschrijdt evenwel niet het tijdstip waarop een van
      de aspirant-adoptiefouders de leeftijd van zesenveertig jaren zal hebben bereikt, tenzij bijzondere omstandigheden
      daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een beginseltoestemming betreft de opneming van een buitenlands kind of in het geval van broers en zussen, dan
      wel van kinderen die op andere wijze zodanig aan elkaar gehecht zijn dat zij bezwaarlijk van elkaar gescheiden
      kunnen worden, van twee buitenlandse kinderen tegelijk. Onze Minister kan in verband met bijzondere omstandigheden
      toestemming verlenen tot opneming van meer kinderen tegelijk.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Een verzoek tot verlening van een beginseltoestemming of tot verlenging van de geldigheidsduur ervan wordt slechts
      in behandeling genomen, indien:
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.a
    text: |-
      het verzoek door de aspirant-adoptiefouders is ingediend. Is de aspirant-adoptiefouder die het verzoek alleen
      indient, gehuwd of heeft deze een geregistreerde partner of andere levensgezel, dan kan het verzoek slechts met
      instemming van diens echtgenoot, geregistreerde partner of levensgezel worden ingediend;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.b
    text: |-
      het verzoek, indien het strekt tot verlenging van de geldigheidsduur van een beginseltoestemming, ten minste twaalf
      weken voor het verstrijken van de geldigheidsduur van de bestaande beginseltoestemming is ingediend;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.c
    text: 'de aspirant-adoptiefouders daarbij hebben overgelegd:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.c.1°
    text: de door Onze Minister vastgestelde gegevens die noodzakelijk zijn voor de beoordeling van het verzoek;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.c.2°
    text: |-
      de verklaring dat zij bereid zijn het buitenlandse kind de gangbare preventieve en curatieve behandelingen te doen
      ondergaan die van levensbelang zijn voor het kind;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.d
    text: |-
      de aspirant-adoptiefouders, ingeval in hun gezin reeds één of meer eigen kinderen of met het oog op adoptie
      opgenomen kinderen verblijven, deze kinderen gedurende ten minste een jaar hebben verzorgd en opgevoed;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
  - number: 4.e
    text: |-
      de aspirant-adoptiefouders vóór de aanvang van het ingevolge [artikel 5, eerste lid][ref1], in te stellen
      onderzoek het bij algemene maatregel van bestuur vastgestelde bedrag ter bestrijding van de kosten van de in
      [artikel 5, derde lid][ref2], bedoelde voorlichting hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel5
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '5'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Onze Minister beslist op het verzoek tot verlening van een beginseltoestemming of tot verlenging van de
      geldigheidsduur ervan eerst nadat de raad voor de kinderbescherming een onderzoek heeft ingesteld naar de
      geschiktheid van de aspirant-adoptiefouders voor de verzorging en opvoeding van een buitenlands kind of, indien de
      aspirant-adoptiefouders hierom hebben verzocht, van twee buitenlandse kinderen tegelijk.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ter voorbereiding van het in het eerste lid bedoelde onderzoek ontvangen de aspirant-adoptiefouders, indien het
      de opneming van een eerste buitenlands kind betreft, algemene voorlichting omtrent de opneming en de adoptie van
      buitenlandse kinderen, welke voorlichting onder toezicht van Onze Minister zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de organisatie, de inhoud en
      de bekostiging van de aan de aspirant-adoptiefouders te verstrekken algemene voorlichting.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het rapport van het onderzoek wordt met de aspirant-adoptiefouders besproken voordat het door de raad voor de
      kinderbescherming wordt uitgebracht. De raad voor de kinderbescherming verschaft de aspirant-adoptiefouders inzage
      in het uit te brengen rapport. In de gevallen waarin een beginseltoestemming wordt verleend of de geldigheidsduur
      ervan wordt verlengd, wordt het oorspronkelijke exemplaar van het rapport na daartoe strekkend schriftelijk verzoek
      van de aspirant-adoptiefouders uitsluitend verstrekt aan de vergunninghouder wiens bemiddeling door de aspirant-
      adoptiefouders is ingeroepen. In geval van afwijzing van een verzoek tot verlening van een beginseltoestemming of
      tot verlenging van de geldigheidsduur ervan wordt aan de aspirant-adoptiefouders op hun schriftelijk verzoek een
      afschrift van het rapport verstrekt.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.5'
    text: 'Onze Minister beslist afwijzend op een verzoek tot verlening van een beginseltoestemming:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: 5.5.a
    text: indien hij een aspirant-adoptiefouder niet geschikt acht voor de verzorging en opvoeding van een buitenlands kind;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: 5.5.b
    text: |-
      indien een der aspirant-adoptiefouders op het tijdstip van de indiening van het verzoek de leeftijd van
      tweeënveertig jaren heeft bereikt, tenzij bijzondere omstandigheden inwilliging van het verzoek naar zijn oordeel
      wenselijk maken.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.6'
    text: |-
      Onze Minister beslist afwijzend op een verzoek tot verlening of verlenging van de geldigheidsduur van een
      beginseltoestemming indien te verwachten is dat op het tijdstip waarop een buitenlands kind zou kunnen worden
      opgenomen, het verschil in leeftijd tussen een der aspirant-adoptiefouders en het buitenlandse kind meer dan
      veertig jaren bedraagt, tenzij bijzondere omstandigheden inwilliging van het verzoek naar zijn oordeel wenselijk
      maken.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.7'
    text: |-
      Onze Minister kan met het oog op het vereiste dat het leeftijdsverschil tussen aspirant-adoptiefouders en
      buitenlands kind de veertig jaren niet te boven gaat, een voorwaarde stellen met betrekking tot de leeftijd van het
      buitenlandse kind.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '5.8'
    text: |-
      De afwijzing van een verzoek tot verlening van een beginseltoestemming of tot verlenging van de geldigheidsduur
      ervan wordt met redenen omkleed schriftelijk ter kennis gebracht van de aspirant-adoptiefouders.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien blijkt dat aspirant-adoptiefouders aan wie een beginseltoestemming is verleend, niet langer geschikt
      zijn voor de verzorging en opvoeding van een buitenlands kind, besluit Onze Minister tot intrekking van de
      beginseltoestemming.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een besluit tot intrekking van een beginseltoestemming wordt eerst genomen nadat de raad voor de kinderbescherming
      opnieuw een onderzoek heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Ten behoeve van de beslissing op bezwaar tegen een besluit, inhoudende de afwijzing van een verzoek
      tot verlening van een beginseltoestemming of tot verlenging van de geldigheidsduur ervan alsmede de
      intrekking van een beginseltoestemming wint Onze Minister, onder overlegging van de op de zaak betrekking
      hebbende bescheiden, schriftelijk advies in van de Raad voor strafrechtstoepassing en jeugdbescherming.
      [Artikel 7:13, tweede tot en met zevende lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '7.2'
    text: |-
      Door de Raad opgeroepen getuigen en deskundigen ontvangen desverkiezend een vergoeding uit de
      openbare kas, door de voorzitter van de Raad te begroten overeenkomstig het bij of krachtens de
      [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '7.3'
    text: 'Het eerste en het tweede lid zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7
  - number: 7.3.a
    text: |-
      indien bezwaar wordt gemaakt tegen een besluit tot afwijzing van het verzoek tot verlening van een
      beginseltoestemming op grond van [artikel 5, vijfde lid, onderdeel b][ref1], en de aspirant-adoptiefouders zich bij
      het bezwaar niet op bijzondere omstandigheden hebben beroepen;


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel5
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.3.b
    text: |-
      indien bezwaar wordt gemaakt tegen een besluit tot verlenging van de geldigheidsduur van de beginseltoestemming
      voor een duur korter dan vier jaren en [artikel 3, eerste lid, tweede volzin][ref1], van toepassing is, en de
      aspirant-adoptiefouders zich bij het bezwaar niet op bijzondere omstandigheden hebben beroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel3
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '3'
        hoofdstuk: '2'
  - number: 7a.1
    text: |-
      Indien de aspirant-adoptiefouders gebruik wensen te maken van activiteiten van autoriteiten, instellingen of
      personen in het buitenland, doen zij hiervan onder overlegging van alle voor deze procedure relevante bescheiden
      opgave aan de vergunninghouder aan wie het rapport is verstrekt. De vergunninghouder onderzoekt deze autoriteiten,
      instellingen of personen op zuiverheid en zorgvuldigheid van handelen.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7a
  - number: 7a.2
    text: |-
      Naar aanleiding van het in het eerste lid bedoelde onderzoek brengt de vergunninghouder schriftelijk, met redenen
      omkleed, advies uit aan Onze Minister. Van de toezending van het advies doet hij schriftelijk mededeling aan de
      aspirant-adoptiefouders.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Na ontvangst van het advies besluit Onze Minister of de doorzending van het rapport en de bemiddeling zullen
      plaatsvinden. Aan dat besluit kan hij voorwaarden verbinden. De doorzending en de bemiddeling zullen niet
      plaatsvinden indien aannemelijk is dat de aspirant-adoptiefouders bij de opneming van een buitenlands kind niet
      zullen handelen in overeenstemming met het bepaalde in [artikel 8, onder d en e][ref1], of door hun handelen schade
      zullen toebrengen aan de door de vergunninghouder opgebouwde relaties met instellingen, autoriteiten of personen
      in het buitenland, dan wel indien er gegronde redenen zijn om te twijfelen aan de zuiverheid en de zorgvuldigheid
      van hun handelen. Tot die redenen behoort in ieder geval de omstandigheid dat aan de bemiddeling voor aspirant-
      adoptiefouders onevenredig hoge kosten zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel8
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '8'
        hoofdstuk: '3'
  - number: 7a.4
    text: |-
      Indien het in het tweede lid bedoelde advies niet aan Onze Minister is toegezonden binnen acht weken nadat opgave
      is gedaan van de in het buitenland gelegde contacten, kunnen aspirant-adoptiefouders zich tot Onze Minister wenden
      met het verzoek over de doorzending te beslissen. Het besluit omtrent de doorzending wordt binnen acht weken na de
      ontvangst van dat verzoek genomen.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7a
  - number: 7a.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de maatstaven die bij het in het
      eerste lid bedoelde onderzoek dienen te worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel7a
  - number: '8'
    text: |-
      Onverminderd het bepaalde bij en krachtens de [Vreemdelingenwet 2000][ref1], dient bij de binnenkomst in Nederland
      van een buitenlands kind met het oog op adoptie aan de volgende voorwaarden te worden voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 8.a
    text: |-
      het buitenlandse kind mag op het tijdstip van binnenkomst in Nederland de leeftijd van zes jaren niet bereikt
      hebben, behoudens de bevoegdheid van Onze Minister om in bijzondere gevallen, op schriftelijk verzoek van de
      aspirant-adoptiefouders, een afwijking van deze leeftijdsgrens toe te staan;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
  - number: 8.b
    text: |-
      door de aspirant-adoptiefouders dient een medische verklaring met betrekking tot het buitenlandse kind te worden
      overgelegd;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
  - number: 8.c
    text: |-
      door de aspirant-adoptiefouders dient te worden aangegeven, op welke wijze bij de opneming van het buitenlands kind
      is gebruik gemaakt van de bemiddeling van een vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
  - number: 8.d
    text: |-
      door de aspirant-adoptiefouders dient op bevredigende wijze door middel van bescheiden te worden aangetoond dat de
      afstand door de ouder of de ouders van het buitenlandse kind naar behoren is geregeld;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
  - number: 8.e
    text: |-
      door de aspirant-adoptiefouders dient op bevredigende wijze door middel van bescheiden te worden aangetoond dat de
      autoriteiten in het land van herkomst instemmen met de opneming, door hen, van het buitenlandse kind.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel8
  - number: '9.1'
    text: |-
      De aspirant-adoptiefouders dan wel de adoptiefouders zijn vanaf het tijdstip van het vertrek van het buitenlandse
      kind naar Nederland verplicht te voorzien in de kosten van verzorging en opvoeding van dat kind als ware het hun
      eigen kind. De kosten van terugkeer naar het land van herkomst komen eveneens te hunnen laste.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9
  - number: '9.2'
    text: |-
      De in het eerste lid omschreven verplichtingen rusten eveneens op degene die in strijd met [artikel 2][ref1] heeft
      gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      De bepalingen van [titel 17 van boek 1 van het Burgerlijk Wetboek][ref1] zijn zoveel mogelijk van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 9a.1
    text: |-
      Onze Minister verleent adoptiefouders op hun verzoek een tegemoetkoming in de kosten die zij gemaakt hebben in
      verband met de interlandelijke adoptie van een kind indien:
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9a
  - number: 9a.1.a
    text: het verzoek is ingediend binnen drie jaren nadat het kind door de adoptiefouders is geadopteerd;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9a
  - number: 9a.1.b
    text: |-
      het kind de Nederlandse nationaliteit heeft verkregen of, indien geen van de adoptiefouders de Nederlandse
      nationaliteit heeft, het kind de nationaliteit van ten minste één van de adoptiefouders heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9a
  - number: 9a.1.c
    text: de adoptie in overeenstemming met deze wet is afgerond.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9a
  - number: 9a.2
    text: Bij ministeriële regeling worden regels gesteld omtrent de aanvraag van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9a
  - number: 9b.1
    text: |-
      De hoogte van de tegemoetkoming in de kosten van interlandelijke adoptie als bedoeld in [artikel 9a][ref1] bedraagt
      € 3 700.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel9a
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: 9a
        hoofdstuk: 3a
  - number: 9b.2
    text: |-
      Bij ministeriële regeling wordt het bedrag, genoemd in het eerste lid, jaarlijks met ingang van 1 januari opnieuw
      vastgesteld aan de hand van de consumentenprijsindex.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9b
  - number: 9c
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op kinderen die tussen 1 januari 2009 en 1 januari 2013 zijn
      geadopteerd.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel9c
  - number: '10.1'
    text: |-
      Indien is gehandeld in strijd met [artikel 2][ref1] kan de kinderrechter een stichting als bedoeld in
      [artikel 1, onder f, van de Wet op de jeugdzorg][ref2] belasten met de voorlopige voogdij over de minderjarige,
      tenzij dit niet verenigbaar is met het belang van de minderjarige. In geval van voorlopige voogdij wendt de raad
      voor de kinderbescherming zich binnen zes weken tot de rechter ten einde een voorziening in het gezag over de
      minderjarige te verkrijgen. [Artikel 241, vierde, vijfde en zesde lid][ref3] alsmede [artikel 306][ref4] zijn van
      overeenkomstige toepassing. [Artikel 813, tweede lid van het Wetboek van Burgerlijke Rechtsvordering][ref5] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel306
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel813
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '241'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '306'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '813'
  - number: '10.2'
    text: |-
      De voorlopige voogdij eindigt, behoudens eerdere intrekking, op het tijdstip waarop hetzij de voogdij over de
      minderjarige, dan wel diens verblijf bij aspirant-adoptiefouders aan wie een beginseltoestemming is verleend, een
      aanvang neemt, hetzij de minderjarige in het land van herkomst wordt teruggeplaatst.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel10
  - number: '10.3'
    text: |-
      De kosten die de stichting ten behoeve van de minderjarige moet maken, komen ten laste van degene
      die de minderjarige in strijd met [artikel 2][ref1] heeft opgenomen. De [artikelen 69][ref2] en
      [71 tot en met 76 van de Wet op de jeugdzorg][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel71
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '71'
  - number: '11'
    text: |-
      Wanneer het buitenlandse kind, na opneming door aspirant-adoptiefouders in een periode waarin zij hun gewone
      verblijfplaats in het buitenland hadden, te zamen met de aspirant-adoptiefouders in Nederland is binnengekomen,
      wordt ambtshalve het onderzoek bedoeld in [artikel 5, eerste lid][ref1], ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel5
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '5'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Op grond van het in [artikel 11][ref1] bedoelde onderzoek beslist Onze Minister of hij de aspirant-adoptiefouders
      geschikt acht voor de verzorging en opvoeding van het buitenlandse kind.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel11
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '11'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      Indien Onze Minister de aspirant-adoptiefouders niet geschikt acht voor de verzorging en opvoeding van het
      buitenlandse kind, doet hij van zijn beslissing tevens mededeling aan de officier van justitie. Artikel 10 is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel12
  - number: '13'
    text: |-
      In geval van bezwaar bij Onze Minister tegen het in [artikel 12][ref1] bedoelde besluit is [artikel 7][ref2] van
      overeenkomstige toepassing. Een zodanig bezwaar schorst niet een maatregel die met overeenkomstige toepasing van
      [artikel 10][ref3] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel10
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '12'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: '10'
  - number: '14.1'
    text: |-
      De bepalingen van deze wet blijven buiten toepassing indien het buitenlandse kind, na opneming door aspirant-
      adoptiefouders in een periode waarin zij hun gewone verblijfplaats in het buitenland hebben, door hen gedurende
      ten minste een jaar aldaar is verzorgd en opgevoed en de verzorging en opvoeding van dat kind na binnenkomst in
      Nederland door hen zal worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel14
  - number: '14.2'
    text: |-
      De bepalingen van deze wet blijven eveneens buiten toepassing indien de adoptie, in een periode waarin de aspirant-
      adoptiefouders hun gewone verblijfplaats in het buitenland hadden, is tot stand gekomen in overeenstemming met het
      op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de bescherming van kinderen en de samenwerking
      op het gebied van de interlandelijke adoptie (Trb. 1993, 197), welke overeenstemming blijkt uit een schriftelijke
      verklaring van de bevoegde autoriteit van de staat waar de adoptie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel14
  - number: '15'
    text: |-
      Het is verboden zonder vergunning van Onze Minister te bemiddelen inzake de opneming van een buitenlands kind met
      het oog op adoptie.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel15
  - number: '16.1'
    text: |-
      De vergunning wordt door Onze Minister op verzoek verleend aan een rechtspersoon met volledige rechtsbevoegdheid
      wiens zetel zich in Nederland bevindt en die voldoet aan het bij en krachtens de volgende leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.2'
    text: |-
      De aanvrager dient krachtens zijn doelstellingen te bemiddelen inzake de opneming hier te lande van buitenlandse
      kinderen, in de gevallen dat deze opneming in het belang van de betrokken kinderen kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.3'
    text: De werkzaamheden van de aanvrager mogen niet zijn gericht op het maken van winst.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.4'
    text: |-
      Het bestuur van de aanvrager moet uit ten minste drie leden bestaan en zodanig zijn samengesteld dat de behartiging
      van de belangen van de buitenlandse kinderen en de aspirant-adoptiefouders is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.5'
    text: |-
      De aanvrager moet zodanig zijn toegerust dat een zorgvuldige en doeltreffende uitvoering van zijn werkzaamheden
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.6'
    text: |-
      De aanvrager moet bereid zijn tot samenwerking met andere vergunninghouders, in het bijzonder op het terrein van de
      algemene voorlichting van de aspirant-adoptiefouders.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: '16.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld inzake de eisen bedoeld in het vierde, vijfde en
      zesde lid. Daarin worden in ieder geval regels gesteld betreffende de verzameling van gegevens over het kind voor
      zijn komst naar Nederland.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16
  - number: 16a
    text: |-
      Een vergunning wordt verleend voor een geldigheidsduur van drie jaren. Op verzoek van de vergunninghouder kan
      Onze Minister de geldigheidsduur van de vergunning verlengen voor een periode van telkens vijf jaren. Een aanvraag
      tot verlenging van de geldigheidsduur van de vergunning wordt uiterlijk twaalf weken voor het verstrijken van de
      geldigheidsduur van de bestaande vergunning ingediend.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel16a
  - number: '17'
    text: |-
      Onze Minister beslist afwijzend op een verzoek tot verlening van een vergunning of tot verlenging van de
      geldigheidsduur ervan indien hetzij gegronde vrees bestaat dat de aanvrager het bij of krachtens deze wet
      bepaalde niet zal naleven, hetzij de aanvrager naar verwachting te weinig toekomstmogelijkheden met betrekking tot
      bemiddeling inzake de opneming van buitenlandse kinderen heeft.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17
  - number: 17a.1
    text: 'De volgende werkzaamheden maken deel uit van de taak van de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.a
    text: |-
      hij onderhoudt ten behoeve van de aspirant-adoptiefouders contacten met de Nederlandse en de buitenlandse
      autoriteiten, instellingen en personen die bij de opneming van het buitenlandse kind betrokken zijn. Hij zendt hun
      de noodzakelijke gegevens toe omtrent de aspirant-adoptiefouders en omtrent de kinderen waarvoor zij de zorg op
      zich zouden kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.b
    text: |-
      hij doet zo nodig onderzoek verrichten door en vraagt advies aan deskundige personen of instellingen in Nederland
      of in de staat van herkomst van het buitenlandse kind;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.c
    text: |-
      hij assisteert de aspirant-adoptiefouders bij de in het buitenland in verband met de opneming van het buitenlandse
      kind te volgen procedures en bij de verkrijging van de voor toelating van dat kind in Nederland noodzakelijke
      bescheiden;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.d
    text: |-
      hij ziet erop toe dat tussen de aspirant-adoptiefouders en de ouders van het kind of een andere persoon aan wie de
      zorg voor het kind is toevertrouwd geen contact wordt gelegd totdat vaststaat:
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.d.1°
    text: dat het kind voor adoptie in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.d.2°
    text: |-
      dat de autoriteiten van de staat van herkomst instemmen met de opneming van het kind door de aspirant-
      adoptiefouders, en
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.d.3°
    text: dat de vereiste toestemmingen van personen en instellingen in de staat van herkomst zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.e
    text: hij belast zich met het aanvragen van de machtiging tot voorlopig verblijf voor het buitenlandse kind;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.f
    text: |-
      hij assisteert de aspirant-adoptiefouders bij het regelen van de overkomst van het buitenlandse kind naar Nederland
      en ziet erop toe dat deze overbrenging in alle veiligheid en onder passende omstandigheden geschiedt, zo mogelijk
      in gezelschap van de aspirant-adoptiefouders;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.1.g
    text: |-
      hij geeft de aspirant-adoptiefouders dan wel de adoptiefouders begeleiding nadat het buitenlandse kind is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17a.2
    text: |-
      Het eerste lid, onderdeel d, geldt niet indien de adoptie plaatsvindt binnen eenzelfde familie of indien aan de
      door de bevoegde autoriteit van de staat van herkomst ten aanzien van dat contact gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17a
  - number: 17b.1
    text: |-
      De vergunninghouder vergaart zoveel mogelijk gegevens met betrekking tot de afkomst en de achtergrond van het
      buitenlandse kind in de staat van herkomst.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17b
  - number: 17b.2
    text: |-
      De vergunninghouder houdt een dossier bij van elke door hem verleende bemiddeling. Het dossier bevat afschriften
      van alle correspondentie die met betrekking tot de opneming van het buitenlandse kind is gevoerd alsmede kopieën
      van de bescheiden die bij de binnenkomst van het kind in Nederland zijn getoond. Voorts bevat het alle in het
      eerste lid bedoelde gegevens. Het dossier wordt gedurende ten minste dertig jaren na de binnenkomst van het
      buitenlandse kind in Nederland bewaard.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17b
  - number: 17b.3
    text: |-
      Indien de adoptieprocedure geen voortgang vindt, zendt de vergunninghouder de originelen van de door hem ontvangen
      bescheiden betreffende het buitenlandse kind terug aan de autoriteiten die deze hebben verzonden.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17b
  - number: 17c.1
    text: |-
      Indien de staat van herkomst partij is bij het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de
      internationale samenwerking en de bescherming van kinderen op het gebied van de interlandelijke adoptie (Trb. 1993,
      197), dan wel indien de regelgeving van de staat van herkomst zulks vereist, houdt de vergunninghouder de bevoegde
      autoriteiten van de staat van herkomst op de hoogte van de adoptieprocedure en de maatregelen die worden genomen om
      deze af te wikkelen alsmede van het verloop van de aan de adoptie voorafgaande verzorgingsperiode.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17c
  - number: 17c.2
    text: |-
      Voorts geeft de vergunninghouder, na de aspirant-adoptiefouders, de adoptiefouders of de wettelijke
      vertegenwoordiger van het kind daaromtrent te hebben geïnformeerd, gevolg aan met redenen omklede verzoeken van de
      autoriteiten van de staat van herkomst om informatie over de situatie met betrekking tot de adoptie.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17c
  - number: 17d.1
    text: |-
      De vergunninghouder verstrekt aan het buitenlandse kind alsmede aan de aspirant-adoptiefouders, de adoptiefouders
      dan wel de wettelijke vertegenwoordiger desgevraagd zo spoedig mogelijk inzage in en afschrift van de bescheiden
      die hij met betrekking tot de adoptie onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17d
  - number: 17d.2
    text: 'De inzage in of het afschrift van de bescheiden wordt aan het buitenlandse kind geweigerd indien het:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17d
  - number: 17d.2.a
    text: jonger dan twaalf jaar is, of
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17d
  - number: 17d.2.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen terzake.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17d
  - number: 17d.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, worden desgevraagd aan de aspirant-adoptiefouders, de adoptiefouders of
      de wettelijke vertegenwoordiger inlichtingen, dan wel inzage in of afschrift van de bescheiden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17d
  - number: 17e.1
    text: |-
      Onverminderd de overige bepalingen van deze wet, verstrekt de vergunninghouder aan anderen dan het buitenlandse
      kind of de aspirant-adoptiefouders, de adoptiefouders dan wel de wettelijke vertegenwoordiger geen inlichtingen
      over de adoptie dan wel inzage in of afschrift van de bescheiden dan met toestemming van het buitenlandse kind,
      indien het de leeftijd van zestien jaren heeft bereikt. Heeft het buitenlandse kind de leeftijd van zestien jaren
      nog niet bereikt of heeft het deze leeftijd bereikt, doch kan het niet in staat worden geacht tot een redelijke
      waardering van zijn belangen ter zake, dan is voor de hier bedoelde verstrekking de toestemming van de aspirant-
      adoptiefouders, de adoptiefouders of de wettelijke vertegenwoordiger vereist.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17e
  - number: 17e.2
    text: |-
      Onder anderen dan het buitenlandse kind en de aspirant-adoptiefouders, de adoptiefouders dan wel de wettelijke
      vertegenwoordiger zijn niet begrepen instanties die bij de adoptie betrokken zijn en degenen die betrokken zijn bij
      de uitvoering of de voorbereiding van een maatregel van kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17e
  - number: 17f.1
    text: |-
      Inlichtingen over, inzage in of afschrift van bescheiden kan worden geweigerd indien de persoonlijke levenssfeer
      van een ander dan het buitenlandse kind daardoor zou worden geschaad.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17f
  - number: 17f.2
    text: |-
      Van het rapport, bedoeld in [artikel 5, vierde lid][ref1], wordt geen afschrift verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel5
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '5'
        hoofdstuk: '2'
  - number: 17f.3
    text: Voor de verstrekking van een afschrift kan de kostprijs daarvan in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17f
  - number: 17g
    text: |-
      In het geval, bedoeld in [artikel 7a][ref1], blijft [artikel 17a][ref2] buiten toepassing, behoudens het
      eerste lid onder e. Voorts blijven in dat geval buiten toepassing de[ artikelen 17b, eerste lid][ref3], en
      [artikel 17e][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel17b
      [ref4]: https://wetten.overheid.nl/BWBR0004447#Artikel17e
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: 7a
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: 17a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: 17b
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0004447
        artikel: 17e
        hoofdstuk: '5'
  - number: '18.1'
    text: 'Onze Minister trekt een vergunning in:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
  - number: 18.1.a
    text: |-
      indien de gegevens die met het oog op de verkrijging van de vergunning zijn verstrekt, zodanig onjuist of
      onvolledig blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling daarvan de
      juiste of volledige gegevens bekend zouden zijn geweest;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
  - number: 18.1.b
    text: |-
      indien niet langer wordt voldaan aan een der eisen gesteld bij of krachtens [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel16
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '16'
        hoofdstuk: '5'
  - number: '18.2'
    text: 'Onze Minister kan een vergunning intrekken:'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
  - number: 18.2.a
    text: |-
      indien de vergunninghouder het bepaalde bij of krachtens de[ artikelen 20 tot en met 23][ref1], dan wel het
      bepaalde bij de[ artikelen 8][ref2] of [32][ref3] niet heeft nageleefd;


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel32
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: '32'
        hoofdstuk: '7'
  - number: 18.2.b
    text: |-
      indien de vergunninghouder gedurende ten minste twee jaren geen bemiddeling inzake de opneming van een buitenlands
      kind heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel18
  - number: '19'
    text: |-
      Indien [artikel 18][ref1] wordt toegepast, beslist Onze Minister desgewenst door welke vergunninghouder of
      vergunninghouders de werkzaamheden van de rechtspersoon wiens vergunning is ingetrokken, voortgezet en zo nodig
      beëindigd zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel18
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '18'
        hoofdstuk: '5'
  - number: '20.1'
    text: |-
      De vergunninghouder bemiddelt inzake de opneming van een buitenlands kind uitsluitend ten behoeve van de aspirant-
      adoptiefouders die beschikken over een geldige beginseltoestemming overeenkomstig het in die beginseltoestemming
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel20
  - number: '20.2'
    text: De vergunninghouder bemiddelt niet inzake de opneming van een buitenlands kind buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel20
  - number: '20.3'
    text: |-
      De vergunninghouder betaalt geen onevenredig hoge vergoedingen voor in verband met zijn bemiddeling verrichte
      diensten.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel20
  - number: '20.4'
    text: |-
      De vergunninghouder knoopt geen betrekkingen aan met instellingen of organisaties in het buitenland die reeds met
      andere vergunninghouders betrekkingen onderhouden met het oog op bemiddeling inzake de opneming van buitenlandse
      kinderen met het oog op adoptie.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel20
  - number: '20.5'
    text: |-
      Onze Minister stelt regels met betrekking tot de gegevens die door de vergunninghouder in verband met het toezicht
      op de naleving van het bepaalde in het derde en vierde lid van dit artikel moeten worden verstrekt betreffende zijn
      betrekkingen met instanties in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel20
  - number: '21.1'
    text: |-
      De vergunninghouder schrijft uitsluitend aspirant-adoptiefouders in die beschikken over een beginseltoestemming,
      tenzij dezelfde vergunninghouder reeds eerder heeft bemiddeld voor de aspirant-adoptiefouders.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '21.2'
    text: |-
      De vergunninghouder schrijft geen aspirant-adoptiefouders in die reeds bij een andere vergunninghouder zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '21.3'
    text: |-
      De vergunninghouder houdt bij zijn bemiddeling zo veel mogelijk de volgorde aan waarin de bij hem ingeschreven
      aspirant-adoptiefouders een verzoek tot verlening van een beginseltoestemming hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '21.4'
    text: |-
      De vergunninghouder draagt de gegevens van de bij hem ingeschreven aspirant-adoptiefouders die zich bij een andere
      vergunninghouder willen laten inschrijven, over aan die andere vergunninghouder onder gelijktijdige uitschrijving
      van die aspirant-adoptiefouders.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '21.5'
    text: |-
      De vergunninghouder verstrekt de gegevens van de bij hem ingeschreven aspirant-adoptiefouders slechts aan
      autoriteiten of instellingen in het buitenland voor zover de noodzaak daartoe uit zijn werkzaamheden met het oog op
      zijn bemiddeling inzake de opneming van een buitenlands kind voortvloeit.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '21.6'
    text: |-
      De vergunninghouder stelt Onze Minister in kennis van elke opneming van een buitenlands kind door aspirant-
      adoptiefouders dan wel de adoptiefouders die ten tijde van de opneming bij hem waren ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel21
  - number: '22'
    text: |-
      Ingeval aspirant-adoptiefouders hun inschrijving bij een vergunninghouder beëindigen en zich bij een andere
      vergunninghouder laten inschrijven, geeft deze laatste hiervan kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel22
  - number: '23.1'
    text: |-
      De vergunninghouder voert een deugdelijke administratie en houdt van zijn vermogenstoestand en van alles wat zijn
      werkzaamheden betreft een zodanige boekhouding bij, dat daaruit te allen tijde zijn rechten en verplichtingen
      kunnen worden gekend.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel23
  - number: '23.2'
    text: |-
      De vergunninghouder doet jaarlijks verslag van zijn werkzaamheden zowel in als buiten Nederland aan Onze Minister
      en zendt hem tevens binnen zes maanden na afloop van het boekjaar zijn balans en staat van baten en lasten met
      toelichting zoals deze na vaststelling van het bedrag der inkomsten en uitgaven en, indien vereist, goedkeuring
      luiden.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel23
  - number: '23.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen eisen worden gesteld waaraan de stukken welke ingevolge het tweede lid
      aan Onze Minister moeten worden toegezonden, moeten voldoen; tevens kunnen daarbij regelen worden gesteld ten
      aanzien van de overdracht van de administratie van de vergunninghouder na intrekking van diens vergunning dan wel
      beëindiging van diens werkzaamheden op andere wijze.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel23
  - number: '24.1'
    text: |-
      Onze Minister wijst ambtenaren aan die tot taak hebben het beheer van een centrale lijst van aspirant-
      adoptiefouders die over een geldige beginseltoestemming beschikken.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel24
  - number: '24.2'
    text: De centrale lijst van aspirant-adoptiefouders kan te allen tijde door belanghebbenden worden ingezien.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel24
  - number: 24a.1
    text: |-
      Er is een klachtencommissie voor klachten over gedragingen van vergunninghouders. Bij algemene maatregel
      van bestuur worden nadere regels gegeven over benoeming, samenstelling en bevoegdheden alsmede over de
      klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel24a
  - number: 24a.2
    text: |-
      Het ontwerp van de in het eerste lid genoemde maatregel wordt aan de beide kamers der Staten-Generaal overgelegd.
      Binnen een termijn van vier weken na de overlegging kan door of namens een der kamers of door ten minste een vijfde
      van het grondwettelijk aantal leden van een der kamers de wens te kennen worden gegeven dat het onderwerp van de
      algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel24a
  - number: '25.1'
    text: |-
      Met het toezicht op de naleving door de vergunninghouders van de voor hen geldende voorschriften, gesteld bij
      of krachtens de [artikelen 16][ref1] en [20 tot en met 23][ref2], zijn belast de door de Inspectie jeugdzorg
      aangewezen personen. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel20
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '16'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '20'
        hoofdstuk: '5'
  - number: '25.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij de [artikelen 2][ref1] en [8][ref2], zijn belast:


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel8
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '8'
        hoofdstuk: '3'
  - number: 25.2.1°
    text: de directeur van de raad voor de kinderbescherming alsmede de door hem aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel25
  - number: 25.2.2°
    text: de ambtenaren belast met het toezicht op vreemdelingen en de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel25
  - number: '26'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden genoemd in de [artikelen 5:15][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '27.1'
    text: |-
      Hij die uit winstbejag handelt in strijd met [artikel 15][ref1] of [artikel 20, eerste lid][ref2], wordt gestraft
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel20
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '15'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '20'
        hoofdstuk: '5'
  - number: '27.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel27
  - number: '28.1'
    text: |-
      Hij die handelt in strijd met [artikel 2][ref1], [artikel 8][ref2], [artikel 15][ref3] of [artikel 20][ref4], wordt
      gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0004447#Artikel20
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: '15'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0004447
        artikel: '20'
        hoofdstuk: '5'
  - number: '28.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel28
  - number: '33.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel33
  - number: '33.2'
    text: |-
      Deze wet is niet van toepassing op verzoeken tot verlening van een beginseltoestemming welke voorafgaande aan de
      dag van haar inwerkingtreding zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel33
  - number: '33.3'
    text: |-
      Voor verenigingen en stichtingen die gedurende tenminste drie jaren onmiddellijk voorafgaande aan de
      inwerkingtreding van deze wet bemiddeling hebben verleend bij de opneming in Nederland van buitenlandse
      pleegkinderen geldt het bepaalde in [artikel 15][ref1] niet gedurende een maand na de inwerkingtreding van deze
      wet, en, indien zij binnen die maand een vergunning tot bemiddeling hebben aangevraagd, evenmin zolang op die
      aanvrage niet onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel15
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '15'
        hoofdstuk: '5'
  - number: '34'
    text: 'Deze wet wordt aangehaald als: Wet opneming buitenlandse kinderen ter adoptie.'
    url: https://wetten.overheid.nl/BWBR0004447/2012-01-01#Artikel34
