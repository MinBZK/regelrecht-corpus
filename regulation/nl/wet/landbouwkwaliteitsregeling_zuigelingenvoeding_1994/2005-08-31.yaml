---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwkwaliteitsregeling_zuigelingenvoeding_1994
regulatory_layer: WET
publication_date: '2007-09-28'
valid_from: '2005-08-31'
bwb_id: BWBR0006750
url: https://wetten.overheid.nl/BWBR0006750/2005-08-31
preamble:
  text: |-
    handelend mede namens de Minister van Welzijn, Volksgezondheid en Cultuur en de Minister van Economische Zaken;

    Gelet op de artikelen 15, vierde lid, van de Landbouwkwaliteitswet, alsmede de artikelen 6, 11 en 15 van het
    Landbouwkwaliteitsbesluit zuigelingenvoeding;

    Gezien het advies van: - het Produktschap voor Zuivel d.d. 8 april 1994, - het Centraal Orgaan voor
    Kwaliteitsaangelegenheden in de Zuivel (COKZ) d.d. 8 april 1994, - de Nederlandse Zuivelorganisatie (NZO) d.d. 5
    april 1994, - de Vereniging van Nederlandse Fabrikanten van Kinder- en Dieetvoedingsmiddelen d.d. 5 april 1994, -
    de Werkgroep Medische Ontwikkelings Samenwerking (WEMOS) d.d. 31 maart 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder:


              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;




              *besluit:*


              [Landbouwkwaliteitsbesluit zuigelingenvoeding][ref1];




              *Codex Alimentarius volledige zuigelingenvoeding:*


              Codex Alimentarius Standaard voor volledige zuigelingenvoeding (CODEX STAN 72–1981);




              *Codex Alimentarius opvolgzuigelingenvoeding:*


              Codex Alimentarius Standaard voor opvolgzuigelingenvoeding (CODEX STAN 156–1987);




              *COKZ:*


              de Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;




              *bestuur:*


              centraal bestuur van het COKZ.


      [ref1]: https://wetten.overheid.nl/BWBR0003732
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003732
  - number: '2'
    text: 'Vormen van behandeling als bedoeld in artikel 1, derde lid, van het besluit zijn:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel2
  - number: 2.a
    text: het verpakken van zuigelingenvoeding;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel2
  - number: 2.b
    text: het mengen van zuigelingenvoeding.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel2
  - number: '3.1'
    text: |-
      Bedrijfsruimten, waarin grondstoffen voor de bereiding van zuigelingenvoeding worden ontvangen, in voorraad
      gehouden, bewerkt of verwerkt, alsmede bedrijfsruimten, in gebruik voor opslag, bewerking en verpakking van
      zuigelingenvoeding, voldoen voor wat betreft de inrichting en het gebruik, met inbegrip van het gebruik van
      machines, werktuigen en gereedschappen, aan het bepaalde bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel3
  - number: 3.1.a
    text: |-
      het [Warenwetbesluit Bereiding en Behandeling van levensmiddelen][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005758
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005758
  - number: 3.1.b
    text: |-
      het terzake van toepassing zijnde in: - het [Landbouwkwaliteitsbesluit rauwe melk en zuivelbereiding][ref1],
        - de Zuivelverordening 1993, Inrichtingseisen Zuivelbereiding van het Produktschap voor Zuivel en
        - de [Warenwetregeling Bereiding van melk en zuivel](onbekend) voorzover de zuigelingenvoeding een produkt is
      als bedoeld in [richtlijn nr. 92/46/EEG](31992L0046) van de Raad van de Europese Gemeenschappen van 16 juni
      1992 tot vaststelling van gezondheidsvoorschriften voor de produktie en het in de handel brengen van rauwe melk,
      warmtebehandelde melk en produkten op basis van melk (PbEG L 268).


      [ref1]: https://wetten.overheid.nl/BWBR0006414
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006414
  - number: '3.2'
    text: |-
      Het is verboden in bedrijfsruimten, waarin zuigelingenvoeding wordt bereid, grondstoffen, hulpstoffen of
      toevoegingen welke niet worden gebezigd of bestemd zijn om te worden gebezigd voor of bij de bereiding van
      zuigelingenvoeding te ontvangen of voorhanden te hebben, indien de aanwezigheid daarvan in de bedrijfsruimte naar
      het oordeel van het COKZ niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel3
  - number: '3.3'
    text: |-
      Het is verboden in bedrijfsruimten, in gebruik voor opslag van zuigelingenvoeding, voorwerpen, stoffen en produkten
      op zodanige wijze te ontvangen of voorhanden te hebben, dat deze de hoedanigheid van zuigelingenvoeding in
      ongunstige zin beïnvloeden of kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel3
  - number: '4.1'
    text: |-
      Voor de bereiding van zuigelingenvoeding worden slechts grondstoffen van plantaardige of dierlijke oorsprong
      gebezigd, welke daartoe naar aard en samenstelling deugdelijk en geschikt van toestand zijn en, voorzover het
      grondstoffen van melk of produkten op basis van melk betreft, voldoen aan het bepaalde bij of krachtens het
      [Landbouwkwaliteitsbesluit rauwe melk en zuivelbereiding][ref1] en de [Warenwetregeling Bereiding van melk en
      zuivel](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0006414
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006414
  - number: '4.2'
    text: |-
      Voor de bereiding van zuigelingenvoeding wordt slechts water gebezigd, dat voldoet aan de bij of krachtens het
      [Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005758
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005758
  - number: '5.1'
    text: |-
      De in [artikel 4, eerste lid][ref1], bedoelde grondstoffen zijn op de verpakking voorzien van aanduidingen:


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel4
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '4'
        paragraaf: '3'
  - number: 5.1.a
    text: inzake samenstelling, aard en gebruiksdoel en
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel5
  - number: 5.1.b
    text: inzake herkomst, zulks ten genoegen van het COKZ.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde aanduidingen zijn duidelijk leesbaar, als zodanig herkenbaar en onuitwisbaar op de
      buitenzijde van de verpakking aangebracht.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel5
  - number: '5.3'
    text: |-
      Ingeval de grondstoffen niet zijn verpakt, dienen samenstelling, aard, gebruiksdoel en herkomst ten genoegen van
      het COKZ te kunnen worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel5
  - number: '6'
    text: |-
      Grondstoffen welke bij de bereiding van zuigelingenvoeding worden gebezigd of bestemd zijn om te worden gebezigd,
      voldoen aan de navolgende eisen:
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.a
    text: |-
      andere hulpstoffen en toevoegingen zijn niet aanwezig dan die, welke voor de desbetreffende zuigelingenvoeding
      uitdrukkelijk zijn toegestaan, tenzij deze hulpstoffen en toevoegingen zijn toegelaten en in de zuigelingenvoeding
      of tijdens de bereiding daarvan geen functie meer vervullen;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.b
    text: |-
      vreemde bestanddelen, antibiotica daaronder begrepen, vuil en andere verontreinigingen zijn niet aanwezig, met
      dien verstande dat: - de gehaltes aan werkzame stoffen van bestrijdingsmiddelen als bedoeld in de Beschikking
      Residuen van Bestrijdingsmiddelen niet hoger mogen zijn dan die, welke in genoemde regeling voor de desbetreffende
      grondstoffen als hoogst toelaatbare hoeveelheid zijn vastgesteld;
        - bij de bepaling van antibiotica geen grotere groeiremming wordt aangetoond dan overeenkomt met: 1º 0,010
      internationale eenheden penicilline per ml in door een melkveehouder aan een zuivelfabriek te leveren melk; 2º
      0,003 internationale eenheden penicilline per ml in andere dan de onder 1° genoemde melk; 3º 0,003 internationale
      eenheden penicilline per ml berekend op melkbasis, in uit melk bereide produkten;
        - met betrekking tot het gehalte aan aflatoxine M1 is voldaan aan het bepaalde in de Warenwetregeling Bereiding en
      behandeling van levensmiddelen;
        - met betrekking tot het gehalte aan polychloorbifenylen (PCB's) is voldaan aan het bepaalde in de Warenwetregeling
      Bereiding en behandeling van levensmiddelen.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.c
    text: micro-organismen zijn niet zodanig naar soort en aantal aanwezig, dat schade aan de gezondheid kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.d
    text: |-
      het gehalte aan nitriet, berekend als nitriet-ion (NO-), in wei en weipoeder en uit wei bereide produkten, is
      niet hoger dan 1 mg per kg berekend op de droge stof, met dien verstande, dat uit wei bereide produkten met een
      asgehalte van minder dan 4%, het gehalte aan nitriet, berekend als nitriet-ion (NO-) lager dan (E/13) × 0,5 mg per
      kg droge stof is, waarbij E staat voor het eiwitgehalte van het betrokken weiprodukt berekend op de droge stof,
      en met dien verstande dat voor produkten met een lager eiwitgehalte dan 13% een maximum gehalte van 0,5 mg per kg
      droge stof geldt.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.e
    text: |-
      de zuurtegraad is niet hoger dan: - 17,5° N, zulks uitsluitend voor al of niet gedeeltelijk afgeroomde melk en voor
      room, in geval van room berekend op de vetvrije waar;
        - 18,5 mmol natriumhydroxide per 100 gram vetvrije droge stof, zulks uitsluitend voor geheel of gedeeltelijk
      gedehydrateerde melk;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: 6.f
    text: |-
      een hoger gehalte aan lactaten dan 100 mg per 100 g vetvrije droge stof, zulks uitsluitend voor room, al of niet
      geheel of gedeeltelijk afgeroomde melk en geheel of gedeeltelijk gedehydrateerde vormen daarvan.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel6
  - number: '7.1'
    text: 'Volledige zuigelingenvoeding wordt uitsluitend vervaardigd uit:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
  - number: 7.1.a
    text: |-
      de in de [bijlage I][ref1] omschreven eiwitbronnen;


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: 7.1.b
    text: |-
      in voorkomend geval andere voedingsmiddelenbestanddelen waarvan op grond van algemeen aanvaarde wetenschappelijke
      gegevens is aangetoond dat zij geschikt zijn als specifieke voeding voor zuigelingen vanaf de geboorte;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
  - number: 7.1.c
    text: |-
      voedingsstoffen als bedoeld in [bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '7.2'
    text: 'Opvolgzuigelingenvoeding wordt uitsluitend vervaardigd uit:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
  - number: 7.2.a
    text: |-
      de in [bijlage II][ref1] omschreven eiwitbronnen;


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: 7.2.b
    text: |-
      in voorkomend geval andere voedingsmiddelenbestanddelen, waarvan op grond van algemeen aanvaarde wetenschappelijke
      gegevens is aangetoond dat zij geschikt zijn als specifieke voeding voor zuigelingen die ouder zijn dan vier
      maanden;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
  - number: 7.2.c
    text: |-
      voedingsstoffen als bedoeld in [bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '7.3'
    text: |-
      In zuigelingenvoeding zijn slechts hulpstoffen en toevoegingen aanwezig overeenkomstig het bepaalde in de
      Warenwetregeling Gebruik van additieven met uitzondering van kleurstoffen, zoetstoffen en meelverbeteraars in
      levensmiddelen.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel7
  - number: '8.1'
    text: |-
      Volledige zuigelingenvoeding voldoet aan de in [bijlage I][ref1] gespecificeerde criteria ten aanzien van de
      samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '8.2'
    text: |-
      Opvolgzuigelingenvoeding voldoet aan de in [bijlage II][ref1] gespecificeerde criteria ten aanzien van de
      samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '8.3'
    text: Zuigelingenvoeding is onmiddellijk of eventueel na toevoeging van water gebruiksklaar.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 7, eerste en derde lid][ref1], en [8, eerste en derde lid][ref2],
      behoeft volledige zuigelingenvoeding niet aan het bepaalde in deze artikelen te voldoen, voorzover het voldoet aan
      de desbetreffende eisen in de Codex Alimentarius volledige zuigelingenvoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel8
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '8'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      In afwijking van het bepaalde in de [artikelen 7, tweede lid en derde lid][ref1], en
      [8, tweede en derde lid][ref2], behoeft opvolgzuigelingenvoeding niet aan het bepaalde in deze artikelen te
      voldoen, voorzover het voldoet aan de desbetreffende eisen in de Codex Alimentarius opvolgzuigelingenvoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel8
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '8'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 7][ref1], [8][ref2] en [9][ref3] voldoet zuigelingenvoeding aan de
      navolgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel9
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '9'
        paragraaf: '3'
  - number: 10.1.a
    text: |-
      vreemde bestanddelen, antibiotica daaronder begrepen, vuil, alsmede andere verontreinigingen zijn afwezig, met dien
      verstande dat: - de gehaltes aan werkzame stoffen van bestrijdingsmiddelen als bedoeld in de Beschikking Residuen
      voor Bestrijdingsmiddelen niet hoger is dan die welke in genoemde regeling als hoogst toelaatbare hoeveelheid zijn
      vastgesteld;
        - bij de bepaling van antibiotica geen grotere groeiremming wordt aangetoond dan overeenkomt met 0,003
      internationale eenheden penicilline per ml gebruiksklare voeding;
        - het gehalte aan aflatoxine M1 niet hoger is dan 0,05 μg per kg, berekend op basis van melk;
        - met betrekking tot het gehalte aan polychloorbifenylen (PCB's) wordt voldaan aan de Warenwetregeling Normen
      PCB's;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.1.b
    text: het gehalte aan nitraat, berekend als nitraat-ion (NO-), is niet hoger dan 50 mg per kg droge stof.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: '10.2'
    text: 'Zuigelingenvoeding in poedervorm voldoet aan de navolgende eisen:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.a
    text: |-
      het aantal aeroob kweekbare micro-organismen (kiemgetal), met uitzondering van de melkzuurbacteriën in
      microbiologische verzuurde produkten, bedraagt niet meer dan 10.000 per g;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.b
    text: Enterobacteriaceae en Staphylococcus aureus zijn in 1 g niet aantoonbaar;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.c
    text: Salmonellae is in 50 g niet aantoonbaar;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.d
    text: het aantal sporen van Bacillus cereus bedraagt niet meer dan 100 per g;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.e
    text: het aantal kweekbare gisten en schimmels bedraagt niet meer dan 100 per g;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.2.f
    text: fosfatase-activiteit is niet aantoonbaar.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: '10.3'
    text: 'Vloeibare zuigelingenvoeding is:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.3.a
    text: |-
      gesteriliseerd en voldoet aan de navolgende eisen: - het heeft een kiemdodende warmtebehandeling of een andere
      behandeling met een gelijke kiemdodende werking ondergaan;
        - het is ter plaatse van de bereiding verpakt in een luchtdicht gesloten verpakking;
        - na vijf dagen bewaren bij 30+1°C in de oorspronkelijke verpakking is geen bederf waar te nemen;
        - na de hiervoor bedoelde bewaring bedraagt het aantal aeroob kweekbare micro-organismen niet meer dan 100 per
      ml; of
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: 10.3.b
    text: |-
      ultra hoog verhit en voldoet aan de navolgende eisen: - het heeft voor het verpakken een stromende
      warmtebehandeling ondergaan;
        - het is ter plaatse van de bereiding aseptisch verpakt in een met een deugdelijke afsluiting gesloten verpakking,
      welke niet geopend kan worden dan door verbreking van de afsluiting.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel10
  - number: '11.1'
    text: |-
      Zuigelingenvoeding wordt zodanig verpakt en in zodanig materiaal, dat de kwaliteit van het verpakte produkt,
      de wijze van vervoer, de bestemming en de wijze van gebruik in aanmerking genomen, niet in ongunstige zin wordt
      beïnvloed.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel11
  - number: '11.2'
    text: |-
      Het verpakkingsmateriaal voor zuigelingenvoeding dient te voldoen aan het bepaalde bij of krachtens het
      Warenwetbesluit verpakkingen en gebruiksartikelen en aan [verordening (EG) nr. 1935/2004](32004R1935) van het
      Europees Parlement en de Raad van de Europese Unie van 27 oktober 2004 inzake materialen en voorwerpen bestemd om
      met levensmiddelen in contact te komen (PbEU L 338).
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel11
  - number: '12.1'
    text: |-
      De in een verpakkingseenheid aanwezige hoeveelheid zuigelingenvoeding is niet lager dan de op de
      verpakking vermelde hoeveelheid, tenzij het eenheden betreft met een op de verpakking vermelde
      hoeveelheid van ten hoogste 10 kg of 10 1, welke zijn voorzien van het EEG-teken, als bedoeld in het
      [Hoeveelheidsaanduidingenbesluit (Warenwet)][ref1], in welk geval dient te zijn voldaan aan het bepaalde in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003310
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003310
  - number: '12.2'
    text: |-
      Het EEG-teken, zoals gedefinieerd in
      [artikel 1, eerste lid, van het Hoeveelheidsaanduidingenbesluit (Warenwet)][ref1], in samenhang met een
      aanduiding van de hoeveelheid verpakte zuigelingenvoeding wordt uitsluitend gebezigd voor een serievoorverpakking,
      waarvan dat produkt deel uitmaakt, indien terzake is voldaan aan de voor het bezigen daarvan in het
      [Hoeveelheidsaanduidingenbesluit (Warenwet)][ref2] omschreven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003310#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003310
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003310
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003310
  - number: '12.3'
    text: |-
      Het [Hoeveelheidsaanduidingenbesluit (Warenwet)][ref1] is van overeenkomtige toepassing, zulks met dien verstande
      dat in afwijking van het in genoemd besluit bepaalde wordt verstaan onder:

              a
              keuringsambtenaren:

                de personen welke door het COKZ zijn belast met het toezicht op het bij of
      krachtens het besluit bepaalde danwel de keuringsambtenaren, zoals gedefinieerd in
      [artikel 1, eerste lid, van het Hoeveelheidsaanduidingenbesluit (Warenwet)][ref2];



              b
              het hoofd van de bevoegde dienst:

                de directeur dan wel het hoofd van de bevoegde dienst, zoals gedefinieerd in
      [artikel 1, eerste lid, van het Hoeveelheidsaanduidingenbesluit (Warenwet)][ref3];



              c
              erkenning dan wel voorlopige erkenning:

                vergunning danwel voorlopige vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003310
      [ref2]: https://wetten.overheid.nl/BWBR0003310#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003310#Artikel1
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003310
      - id: ref2
        bwb_id: BWBR0003310
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003310
        artikel: '1'
  - number: '12.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid mag het EEG-teken worden vervangen door een door het COKZ aan de
      producent of verpakker toegekend controleteken.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel12
  - number: '13'
    text: |-
      Geen ander produkt dan volledige zuigelingenvoeding mag worden voorgesteld als geschikt om gedurende de eerste vier
      tot zes levensmaanden volledig aan de voedingsbehoeften van normale gezonde zuigelingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel13
  - number: '14.1'
    text: |-
      Volledige zuigelingenvoeding voldoet aan het bepaalde in het [Warenwetbesluit Etikettering van levensmiddelen][ref1]
      en wordt voorts van de volgende aanduidingen voorzien:


      [ref1]: https://wetten.overheid.nl/BWBR0005310
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005310
  - number: 14.1.a
    text: |-
      een aanduiding dat het produkt specifiek geschikt is om te worden gebruikt als voeding voor zuigelingen vanaf de
      geboorte, wanneer zij geen borstvoeding krijgen;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: 14.1.b
    text: |-
      voorzover het produkt geen toegevoegd ijzer bevat: een aanduiding dat aan de totale ijzerbehoefte van zuigelingen
      die ouder zijn dan vier maanden, slechts kan worden voldaan door daartoe ook nog andere bronnen te gebruiken;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: 14.1.c
    text: 'voorafgegaan door het woord ‘belangrijk’ of een woord van gelijke strekking:'
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: 14.1.c.1º
    text: een verklaring dat borstvoeding de voorkeur heeft;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: 14.1.c.2º
    text: |-
      een aanbeveling dat het produkt alleen dient te worden gebruikt op advies van onafhankelijke deskundigen op het
      gebied van geneeskunde, voeding of farmaceutische wetenschap of van personen die beroepsmatig verantwoordelijk zijn
      voor de zorg voor moeder en kind.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: '14.2'
    text: |-
      Bij de etikettering van volledige zuigelingenvoeding worden geen afbeeldingen van zuigelingen, noch andere
      afbeeldingen of teksten gebezigd, waardoor het gebruik van het produkt zou kunnen worden geïdealiseerd. Het
      mag echter wel grafische afbeeldingen bevatten om het produkt gemakkelijk identificeerbaar te maken en om de
      bereidingswijze te illustreren.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
  - number: '14.3'
    text: |-
      Bij volledige zuigelingenvoeding worden slechts in de in [bijlage IV][ref1] bedoelde gevallen en in overeenstemming
      met de daarin vastgestelde voorwaarden aanduidingen op de verpakking vermeld inzake de speciale samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '15'
    text: |-
      Opvolgzuigelingenvoeding voldoet aan het bepaalde in het [Warenwetbesluit Etikettering van levensmiddelen][ref1] en
      wordt voorts van de volgende aanduidingen voorzien:


      [ref1]: https://wetten.overheid.nl/BWBR0005310
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005310
  - number: 15.a
    text: |-
      een aanduiding dat het produkt alleen geschikt is om voor specifieke doeleinden te worden gebruikt als voeding voor
      zuigelingen die ouder zijn dan vier maanden;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel15
  - number: 15.b
    text: een aanduiding dat het produkt slechts een onderdeel van een gevarieerde voeding mag zijn;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel15
  - number: 15.c
    text: |-
      een aanduiding dat het produkt niet geschikt is als vervanging van moedermelk gedurende de eerste vier
      levensmaanden.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] en de [artikelen 14][ref2] en [15][ref3]
      worden bij 7zuigelingenvoeding aanduidingen gebezigd, aangevende:


      [ref1]: https://wetten.overheid.nl/BWBR0005310
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel15
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005310
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '14'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '15'
        paragraaf: '5'
  - number: 16.1.a
    text: de beschikbare energie-waarde, uitgedrukt in kJ en kcal, per 100 ml gebruiksklaar produkt;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: 16.1.b
    text: het gehalte aan eiwitten, vetten en koolhydraten, uitgedrukt in een getal, per 100 ml gebruiksklaar produkt;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: 16.1.c
    text: |-
      de gemiddelde hoeveelheid van elk mineraal en elke vitamine dat in respectievelijk bijlage I en bijlage II is
      vermeld, per 100 ml gebruiksklaar produkt;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: 16.1.d
    text: |-
      indien van toepassing het gehalte aan choline, inositol, carnitine en taurine, uitgedrukt in een getal, per 100 ml
      gebruiksklaar produkt;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: 16.1.e
    text: |-
      een gebruiksaanwijzing voor de juiste bereiding van het produkt en een waarschuwing dat aan onjuiste bereiding
      risico's voor de gezondheid zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: '16.2'
    text: |-
      Bij zuigelingenvoeding kan een aanduiding worden gebezigd, aangevende de gemiddelde hoeveelheid van de in bijlage
      III genoemde voedingsstoffen, wanneer deze vermelding wordt bestreken door het bepaalde in het eerste lid,
      onderdeel c en d, uitgedrukt in een getal, per 100 ml gebruiksklaar product.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: '16.3'
    text: |-
      Bij opvolgzuigelingenvoeding kan naast de in een getal uitgedrukte informatie, een aanduiding worden gebezigd,
      aangevende informatie over de in bijlage VIII opgenomen vitamines en mineralen, uitgedrukt als een percentage van
      de daarin vermelde referentiewaarden, per 100 ml gebruiksklaar product, mits de hoeveelheden minimaal gelijk zijn
      aan 15% van de referentiewaarden.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: '16.4'
    text: |-
      De produkten worden in een geschikte taal geëtiketteerd, en wel zodanig dat enig risico dat er verwarring ontstaat
      tussen volledige en opvolgzuigelingenvoeding wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel16
  - number: '17'
    text: |-
      De gebezigde aanduidingen op zuigelingenvoeding zijn zodanig dat de nodige voorlichting wordt geven omtrent het
      juiste gebruik van de produkten en vrouwen er niet van worden weerhouden borstvoeding te geven, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel17
  - number: 17.a
    text: termen als ‘gehumaniseerd’ en ‘gematerniseerd’ niet gebezigd worden;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel17
  - number: 17.b
    text: |-
      de term ‘aangepast’ slechts wordt gebezigd met inachtneming van [artikel 14, derde lid][ref1], en van
      [bijlage IV][ref2].1.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006750
  - number: '18'
    text: |-
      De in de in [artikelen 14][ref1], [15][ref2], [16][ref3], en [17][ref4] vermelde voorschriften, verboden en
      beperkingen zijn eveneens van toepassing op de aanbiedingsvorm van de betrokken produkten, en met name op de vorm,
      het uiterlijk of de verpakking ervan en op de gebruikte verpakkingsmaterialen.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006750#Artikel17
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '15'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '16'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0006750
        artikel: '17'
        paragraaf: '5'
  - number: '19'
    text: |-
      Zuigelingenvoeding, welke zodanig is samengesteld of bereid, dat zij mede geschikt is voor zuigelingen wier
      assimilatieproces of stofwisseling is verstoord, mag worden voorzien van aanduidingen waaruit het bijzondere
      karakter van de zuigelingenvoeding blijkt. Met betrekking tot deze aanduiding moet worden voldaan aan het bepaalde
      in het Warenwetbesluit Produkten voor bijzondere voeding, behoudens de verplichting tot het bezigen van de
      Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel19
  - number: '20.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 14][ref1], [15][ref2], [16][ref3], en [17][ref4] zijn
      verzendverpakkingen van in Nederland verpakte zuigelingenvoeding voorzien van aanduidingen aangevende:


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006750#Artikel17
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '15'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '16'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0006750
        artikel: '17'
        paragraaf: '5'
  - number: 20.1.a
    text: het aantal in de verzendverpakkingen aanwezige eenheden en de hoeveelheid per eenheid;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: 20.1.b
    text: de naam en plaats van vestiging van de verpakker of een door het COKZ aan hem toegekend herkenningsmerk;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: 20.1.c
    text: de op de in de verzendverpakking aanwezige eenheden aangebrachte datum van minimale houdbaarheid;
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: 20.1.d
    text: de produktiepartijcode, tenzij de datum van minimale houdbaar- heid als zodanig kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: '20.2'
    text: De in het eerste lid bedoelde verpakkingen mogen zijn voorzien van onderstaand figuur in contrasterende kleuren.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: '20.3'
    text: |-
      De in het eerste en tweede lid, bedoelde aanduidingen zijn duidelijk leesbaar, onuitwisbaar en als zodanig
      herkenbaar aangebracht op een der zijkanten van de verzendverpakking. Andere aanduidingen dan bedoeld in het eerste
      en tweede lid zijn op de desbetreffende zijde afwezig met uitzondering van verschepingsmerken en andere coderingen,
      welke in beperkte mate aanwezig mogen zijn, een en ander ter beoordeling van het COKZ.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel20
  - number: '21.1'
    text: |-
      De Minister kan ontheffing verlenen van het bepaalde in de [artikelen 7][ref1], [8][ref2] en [9][ref3], zulks
      uitsluitend voorzover in het land van bestemming ter zake andere regels zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel9
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '9'
        paragraaf: '3'
  - number: '21.2'
    text: |-
      Het bestuur kan ontheffing verlenen van het bepaalde in de [artikelen 14][ref1], [15][ref2],
      [16, eerste lid][ref3], en [17][ref4], zulks uitsluitend voorzover in het land van bestemming ter zake andere
      regels zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006750#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006750#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006750#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006750#Artikel17
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006750
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006750
        artikel: '15'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006750
        artikel: '16'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0006750
        artikel: '17'
        paragraaf: '5'
  - number: '22'
    text: |-
      Voor de vaststelling of zuigelingenvoeding aan het bij het besluit of bij deze regeling bepaalde voldoet,
      wordt gebruik gemaakt van de in [bijlage IX][ref1] opgenomen methoden van monsterneming en onderzoek, dan wel,
      indien in voorkomend geval geen methoden zijn opgenomen, van de voor dit doel door de directeur van het Rijks
      Kwaliteitsinstituut voor land- en tuinbouwprodukten goedgekeurde methoden.


      [ref1]: https://wetten.overheid.nl/BWBR0006750
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006750
  - number: '23'
    text: De Landbouwkwaliteitsregeling zuigelingenvoeding wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel23
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop het Besluit houdende wijziging van het
      [Landbouwkwaliteitsbesluit zuigelingenvoeding][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003732
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003732
  - number: '25'
    text: |-
      Deze regeling wordt aangehaald als: Landbouwkwaliteitsregeling zuigelingenvoeding 1994. Deze regeling zal met de
      toelichting en de bijlagen in de Staatscourant worden geplaatst met uitzondering van bijlage IX, die ter inzage
      wordt gelegd in de bibliotheek van het ministerie van Landbouw te 's-Gravenhage, Natuurbeheer en Visserij. Van deze
      terinzagelegging zal mededeling worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006750/2005-08-31#Artikel25
