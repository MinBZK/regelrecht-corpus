  - number: V
    text: |-
      1 In de [artikelen VI tot en met VId][ref1] wordt onder overeenkomst verstaan een overeenkomst van huur en verhuur
      of een soortgelijke overeenkomst met betrekking tot een net waarbij partij is een naar buitenlands recht opgerichte
      entiteit, of diens rechtsopvolger, en die is gesloten voor 14 juli 2004. Onder rechtsopvolger als bedoeld in de
      vorige volzin wordt niet begrepen een vennootschap of rechtspersoon naar Nederlands recht die bij het aangaan van
      de overeenkomst partij was, of een groepsmaatschappij van deze rechtspersoon of vennootschap.

      2 In de [artikelen VI tot en met VId][ref2] wordt onder economische eigendom van een net mede verstaan een
      recht van gebruik van het net op grond van een overeenkomst als bedoeld in het eerste lid en onder degene die de
      economische eigendom verkrijgt wordt mede verstaan degene die op grond van een overeenkomst als bedoeld in het
      eerste lid het recht verkrijgt of dient te verkrijgen om het net in bezit te nemen of te gebruiken.

      3 In de [artikelen VI tot en met VId][ref3] wordt onder net verstaan een net als bedoeld in de
      [Elektriciteitswet 1998][ref4] of een gastransportnet als bedoeld in de [Gaswet][ref5].

      4 In de [artikelen VIb][ref6] en [VIc][ref7] wordt onder Onze Minister verstaan Onze Minister van Economische
      Zaken.


