    text: |-
      Waar in de [artikelen V tot en met VII][ref1] wordt verwezen naar artikelen van de [Elektriciteitswet 1998][ref2]
      of de [Gaswet][ref3], wordt verwezen naar deze artikelen zoals deze luidden onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van de [Energiewet][ref4].


