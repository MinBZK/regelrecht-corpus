  - number: Xa
    text: |-
      Bij de vaststelling van de tarieven, bedoeld in
      [artikel 41c, eerste lid, van de Elektriciteitswet 1998][ref1] voor het jaar 2008 wordt de formule,
      vervat in [artikel 41b, eerste lid, onderdeel d, van de Elektriciteitswet 1998][ref2], toegepast
      met een zodanige correctie voor de gevolgen van de wijziging in het beheer van de netten met een
      spanningsniveau van 110 kV of 150 kV door de in [artikel I, onderdeel A][ref3], voorgestelde wijziging van
      [artikel 10, eerste lid, van de Elektriciteitswet 1998][ref4], dat deze wijziging geen gevolgen heeft voor de
      betrokken netbeheerders anders dan voortvloeit uit de wijziging van het beheer.


