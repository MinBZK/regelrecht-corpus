  - number: VIb
    text: |-
      Indien uit een overeenkomst met betrekking tot een net of een ander bedrijfsmiddel voortvloeit dat met ingang
      van een datum, gelegen na het tijdstip van inwerkingtreding van [artikel I, onderdeel B][ref1], een netbeheerder
      behoort tot een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] waartoe ook een
      rechtspersoon of vennootschap behoort die in Nederland elektriciteit produceert, is het in dat artikel voorgestelde
      [artikel 10b, eerste lid, van de Elektriciteitswet 1998][ref3] niet van toepassing gedurende dertien weken na die
      datum. Deze termijn kan door Onze Minister bij beschikking of ministeriële regeling worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0020608#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel10b
