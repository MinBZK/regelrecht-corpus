preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een onafhankelijke positie van netbeheerders ten
    aanzien van productie-, handels- en leveringsbedrijven van elektriciteit en gas te bevorderen en ook overigens
    nadere eisen te stellen aan de taken van netbeheerders en aan de uitvoering daarvan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020608/2026-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 De rechtspersoon die de vennootschap heeft aangewezen die op het tijdstip van inwerkingtreding van de in
      [artikel I, onderdeel A][ref1], voorgestelde wijziging van [artikel 10 van de Elektriciteitswet 1998][ref2] de
      netbeheerder van het landelijk hoogspanningsnet is, draagt ervoor zorg dat op het tijdstip van inwerkingtreding van
      de hiervoor bedoelde wijziging de aanwijzing van de netbeheerder van het landelijk hoogspanningsnet mede betrekking
      heeft op de netten met een spanningsniveau van 110 kV en van 150 kV.

      2 De in het eerste lid bedoelde wijziging van de aanwijzing als beheerder van het landelijk hoogspanningsnet behoeft
      de instemming van Onze Minister. [Artikel 12, eerste lid, eerste volzin, van de Elektriciteitswet 1998][ref3] is
      van toepassing.

      3 Onze Minister onthoudt zijn instemming of kan voorschriften verbinden aan de instemming, indien niet is voldaan
      aan [artikel 16 van de Elektriciteitswet 1998][ref4].


