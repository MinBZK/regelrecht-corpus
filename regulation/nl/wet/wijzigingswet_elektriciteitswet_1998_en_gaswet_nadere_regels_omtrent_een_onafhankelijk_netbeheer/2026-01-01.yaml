  - number: IXb
    text: |-
      1 Het bestuur van de rechtspersoon, die alleen of samen met een andere groepsmaatschappij, aan het hoofd staat
      van een groep waartoe een netbeheerder als bedoeld in [artikel VIII, eerste of derde lid][ref1] behoort, stelt
      binnen een jaar na het tijdstip van inwerkingtreding van het in [artikel I, onderdeel B][ref2], voorgestelde
      [artikel 10b van de Elektriciteitswet 1998][ref3] of het in [artikel II, onderdeel B][ref4], voorgestelde
      [artikel 2c van de Gaswet][ref5], een splitsingsplan op.

      2 Het splitsingsplan beschrijft:

      a. welke vermogensbestanddelen na de splitsing zullen berusten bij de onderscheiden rechtspersonen;

      b. de wijze waarop netbeheerders in staat worden gesteld de naleving van de [artikelen 10a][ref6] en
      [16Aa van de Elektriciteitswet 1998][ref7] en [3b][ref8] en [7a van de Gaswet][ref9] te verzekeren;

      c. op welke wijze [artikel IXa, eerste, tweede en derde lid][ref10], wordt nageleefd.

      3 Het plan wordt, tezamen met een verklaring van een onafhankelijke deskundige omtrent de resultaten van zijn
      onderzoek naar de wijze waarop aan het tweede lid is voldaan en omtrent de juistheid van de in dat plan opgenomen
      cijfers, ter inzage gegeven aan de Autoriteit Consument en Markt.

      4 De Autoriteit Consument en Markt zendt het plan en de in het derde lid bedoelde verklaring, vergezeld van haar
      oordeel omtrent de wijze waarop is voldaan aan het tweede lid, binnen zes weken na ontvangst aan Onze Minister van
      Economische Zaken. De Autoriteit Consument en Markt kan deze termijn eenmaal met vier weken verlengen. Een van de
      genoemde termijnen kan door de Autoriteit Consument en Markt eenmaal met ten hoogste vier weken worden verlengd
      met ingang van de dag waarop de Autoriteit Consument en Markt nadere gegevens vraagt aan bij het plan betrokken
      rechtspersonen en vennootschappen.

      5 Onze Minister van Economische Zaken kan naar aanleiding van het splitsingsplan binnen zes weken na ontvangst
      ervan aanwijzingen geven die het bestuur, bedoeld in het eerste lid, in acht dient te nemen, zonodig in afwijking
      van het splitsingplan.

      6 Het bestuur draagt zorg voor de uitvoering van de splitsing overeenkomstig het splitsingsplan, zo nodig met
      inachtneming van een aanwijzing als bedoeld in het vijfde lid.

      7 Het bestuur kan het splitsingsplan wijzigen. Op een wijziging is het tweede tot en met zesde lid van
      overeenkomstige toepassing.

      8 Onze Minister van Economische Zaken stelt regels omtrent de inrichting van een splitsingsplan en de categorieën
      van gegevens die daarin moeten worden opgenomen.

      9 Een krachtens het achtste lid vast te stellen ministeriële regeling treedt niet eerder in werking dan vier weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      10 Het in het eerste lid bedoelde bestuur dan wel het bestuur van een andere, in het splitsingsplan aangewezen
      rechtspersoon, legt binnen zes maanden na afloop van de in [artikel VIII, eerste en derde lid][ref11],
      genoemde termijn van twee jaar en zes maanden aan de Autoriteit Consument en Markt een verklaring over van een
      onafhankelijke deskundige omtrent de uitvoering van het splitsingsplan overeenkomstig de inhoud daarvan.


