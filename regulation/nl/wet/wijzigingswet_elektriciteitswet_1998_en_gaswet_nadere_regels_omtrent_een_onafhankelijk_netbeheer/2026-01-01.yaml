  - number: VIc
    text: |-
      1 Voor zover dat, en op een wijze die, in overeenstemming is met de rechten van derden die voortvloeien uit een
      overeenkomst, zijn de [artikelen 85 van de Gaswet][ref1] en [93 van de Elektriciteitswet 1998][ref2] van toepassing
      op de overgang van de economische eigendom van een net als bedoeld in de [artikelen VI, tweede lid][ref3], en
      [VIa, tweede lid][ref4], op de verschaffing van de economische eigendom aan de netbeheerder bij een aanwijzing
      als bedoeld in artikel VI, derde lid, of in artikel VIa, derde lid, of aan een derde, dan wel op de overdracht
      van de aandelen in een aldus aangewezen netbeheerder en op de overgang van de eigendom van een net ingevolge een
      overeenkomst.

      2 In het geval van een verschaffing van de economische eigendom als bedoeld in het eerste lid of een
      aanwijzing als bedoeld in [artikel VI, derde lid][ref5], of [artikel VIa, derde lid][ref6], wordt een redelijke
      termijn als bedoeld in [artikel 14, eerste lid, van de Elektriciteitswet 1998][ref7] onderscheidenlijk
      [artikel 6, eerste lid, van de Gaswet][ref8] geacht in acht te zijn genomen.

      3 Indien een vennootschap of rechtspersoon op grond van een overeenkomst het recht heeft om de economische eigendom
      van het betreffende net te verkrijgen tegen een vaste prijs, wordt een voorgenomen besluit omtrent de uitoefening
      van de bevoegdheid tot verkrijging tijdig voor de uitvoering daarvan ter kennis gebracht aan Onze Minister.


