    text: |-
      1 Netbeheerders die voor het tijdstip van inwerkingtreding van het in [artikel I, onderdeel B][ref1],
      voorgestelde [artikel 10b, eerste lid, van de Elektriciteitswet 1998][ref2] op grond van
      [artikel 10, derde lid, van de Elektriciteitswet 1998][ref3] zijn aangewezen en met wier
      aanwijzing instemming als bedoeld in [artikel 12, tweede lid][ref4], is verleend, voldoen
      binnen twee jaar en zes maanden na dat tijdstip aan [artikel 10b, eerste lid][ref5], aan
      __REF005___________________________________________________________________________________________________________
      ______________.

      2 De netbeheerder die voor het tijdstip van inwerkingtreding van het in [artikel I, onderdeel B][ref7],
      voorgestelde [artikel 10b, eerste lid, van de Elektriciteitswet 1998][ref8] op grond van
      [artikel 10, tweede lid, van de Elektriciteitswet 1998][ref9] is aangewezen en met wiens aanwijzing instemming
      als bedoeld in [artikel 12, tweede lid][ref10], is verleend, voldoet binnen twee jaar en zes maanden na dat
      tijdstip aan [artikel 10b, eerste lid][ref11], indien [artikel 11a, vijfde lid][ref12], van toepassing is aan
      [artikel 11a, zesde lid van de Elektriciteitswet 1998][ref13].

      3 Netbeheerders die voor het tijdstip van inwerkingtreding van het in [artikel II, onderdeel B][ref14], voorgestelde
      [artikel 2c, eerste lid, van de Gaswet][ref15] op grond van artikel [2, eerste lid, van de Gaswet][ref16]
      zijn aangewezen en met wier aanwijzing instemming als bedoeld in [artikel 4, tweede lid][ref17], is
      verleend, voldoen binnen twee jaar en zes maanden na dat tijdstip aan [artikel 2c, eerste lid][ref18], indien
      [artikel 3, derde lid][ref19], van toepassing is aan [artikel 3, vierde lid, van de Gaswet][ref20].

      4 De netbeheerder die voor het tijdstip van inwerkingtreding van het in [artikel II, onderdeel B][ref21],
      voorgestelde [artikel 2c, eerste lid, van de Gaswet][ref22] op grond van
      [artikel 2, tweede lid, van de Gaswet][ref23] is aangewezen en met wiens aanwijzing instemming als bedoeld
      in [artikel 4, tweede lid][ref24], is verleend, voldoet binnen twee jaar en zes maanden na dat tijdstip
      aan [artikel 2c, eerste lid][ref25], indien [artikel 3a, tweede lid][ref26], van toepassing is aan
      [artikel 3a, derde lid, van de Gaswet][ref27].


