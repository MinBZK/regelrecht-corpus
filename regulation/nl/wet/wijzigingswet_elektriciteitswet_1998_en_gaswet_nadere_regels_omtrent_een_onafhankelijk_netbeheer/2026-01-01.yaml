  - number: VII
    text: |-
      1 Indien met het oog op de naleving van het in [artikel I, onderdeel B][ref1], voorgestelde
      [artikel 10b van de Elektriciteitswet 1998][ref2] onderscheidenlijk het in [artikel II, onderdeel B][ref3],
      voorgestelde [artikel 2c van de Gaswet][ref4] de inrichting van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref5], waartoe een rechtspersoon behoort die beschikt over de
      economische eigendom van een net met een spanningsniveau van 110 kV of van 150kV, wordt gewijzigd, wordt bij die
      wijziging er zorg voor gedragen dat de netbeheerder of een rechtspersoon die deel uitmaakt van de groep waartoe de
      netbeheerder behoort, zal beschikken over de economische eigendom van het hiervoor bedoelde net.

      2 Aan het eerste lid is voldaan indien een netbeheerder of een rechtspersoon of vennootschap die deel uitmaakt
      van een groep waartoe ook een netbeheerder behoort over de economische eigendom van het net beschikt behoudens de
      rechten van derden die voortvloeien uit een overeenkomst als bedoeld in [artikel V, eerste lid][ref6].

      3 Ingeval van overtreding van het eerste lid kan de Autoriteit Consument en Markt de overtreder een last onder
      dwangsom opleggen.


