  - number: XI
    text: |-
      1 Indien met het oog op de naleving van [artikel 10a][ref1] of [artikel 10b van de Elektriciteitswet 1998][ref2]
      of [artikel 2c][ref3] of [artikel 3b van de Gaswet][ref4] door een belastingplichtige voor de
      vennootschapsbelasting activa of passiva worden overgedragen, wordt voor de bepaling van de winst, bedoeld in
      [hoofdstuk II van de Wet op de vennootschapsbelasting 1969][ref5], van de overdrager en van de verkrijger, de
      overdracht geacht plaats te vinden tegen de fiscale boekwaarde van die activa of passiva op het direct aan de
      overdracht voorafgaande tijdstip. De eerste volzin is slechts van toepassing indien de verkrijger van de activa of
      passiva een lichaam is waarvan de aandeelhouders, deelnemers of leden direct of indirect uitsluitend of nagenoeg
      uitsluitend dezelfde zijn als de directe of indirecte aandeelhouders, deelnemers of leden van de overdrager.

      2 Indien een overdracht als bedoeld in het eerste lid plaatsvindt tegen de fiscale boekwaarde, wordt de verkrijger
      van die activa of passiva met betrekking tot die activa of passiva voor het bepalen van de winst, bedoeld in
      [hoofdstuk II van de Wet op de vennootschapsbelasting1969][ref6], geacht in de plaats te zijn getreden van degene
      die de activa of passiva heeft overgedragen.

      3 Indien met het oog op de naleving van [artikel 10b van de Elektriciteitswet 1998][ref7]
      of [artikel 2c van de Gaswet][ref8] een fiscale eenheid als bedoeld in
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref9] eindigt, vindt
      [artikel 15ai van de Wet op de vennootschapsbelasting 1969][ref10] geen toepassing, ingeval de beëindiging
      plaatsvindt door een overdracht van aandelen aan een lichaam waarvan de aandeelhouders direct of indirect
      uitsluitend of nagenoeg uitsluitend dezelfde zijn als de directe of indirecte aandeelhouders van de fiscale eenheid
      die wordt beëindigd.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing indien activa of passiva worden overgedragen met
      het oog op de naleving van [artikel IX, tweede lid][ref11], van deze wet, mits de overgedragen activa of passiva
      gaan behoren tot het vermogen van een in Nederland gedreven onderneming of tot het vermogen van een in Nederland
      gedreven gedeelte van een onderneming.

      5 Het derde lid is van overeenkomstige toepassing indien een fiscale eenheid eindigt met het oog op de naleving van
      [artikel IX, tweede lid][ref12], van deze wet.


