  - number: VI
    text: |-
      1 Een netbeheerder voldoet aan [artikel 10a van de Elektriciteitswet 1998][ref1] onderscheidenlijk
      [artikel 3b van de Gaswet][ref2], indien hij of een vennootschap waarin hij alle aandelen houdt, over de
      economische eigendom van het net beschikt, behoudens de rechten van derden die voortvloeien uit of verband houden
      met een overeenkomst met betrekking tot dat net.

      2 Indien uit een overeenkomst voortvloeit dat een ander dan de aangewezen netbeheerder van het net
      waarop die overeenkomst betrekking heeft de economische eigendom van dat net verkrijgt, zijn de
      [artikelen 10a van de Elektriciteitwet 1998][ref3] onderscheidenlijk [3b van de Gaswet][ref4] niet van toepassing
      gedurende dertien weken na het tijdstip van die verkrijging.

      3 Indien het tweede lid toepassing vindt, kan degene die de economische eigendom verkrijgt binnen de in
      dat lid genoemde termijn van dertien weken een nieuwe netbeheerder aanwijzen, met inachtneming van alle
      daarvoor bij of krachtens de [Elektriciteitswet 1998][ref5] onderscheidenlijk de [Gaswet][ref6] gestelde
      regels, waaronder de verplichting om de economische eigendom te verschaffen aan de netbeheerder. Evenwel
      zijn op deze aanwijzing de [artikelen 10, vierde lid, van de Elektriciteitswet 1998][ref7] onderscheidenlijk
      [2, derde lid, van de Gaswet][ref8] niet van toepassing.

      4 Indien het derde lid toepassing vindt, heeft degene die de economische eigendom verschaft aan de netbeheerder
      recht op een tegenprestatie die de marktwaarde van de verschafte rechten op het net vertegenwoordigt.


