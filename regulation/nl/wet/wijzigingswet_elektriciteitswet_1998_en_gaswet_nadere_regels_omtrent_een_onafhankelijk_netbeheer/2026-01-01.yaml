  - number: VIa
    text: |-
      1 Het beheer van een net met een spanningsniveau van 110 kV of van 150 kV door de netbeheerder van het
      landelijk hoogspanningsnet ingevolge de in [artikel I, onderdeel A][ref1], voorgestelde wijziging van
      [artikel 10, eerste lid, van de Elektriciteitswet 1998][ref2], geschiedt voor zover dat en op een wijze die in
      overeenstemming is met de rechten van derden die voortvloeien uit een overeenkomst met betrekking tot dat net.

      2 Indien uit een overeenkomst voortvloeit dat met ingang van een datum gelegen na het tijdstip van inwerkingtreding
      van [artikel I, onderdeel A][ref3], een ander de economische eigendom van een net met een spanningsniveau van
      110 kV of van 150 kV verkrijgt dan degene die voor dat tijdstip over de economische eigendom beschikte, wijst
      degene die de economische eigendom verkrijgt binnen dertien weken na die verkrijging voor het beheer van het
      desbetreffende deel van het net een naamloze of besloten vennootschap als netbeheerder aan met inachtneming van
      alle daarvoor bij of krachtens de [Elektriciteitswet 1998][ref4] vastgestelde regels.

      3 In een geval als bedoeld in het tweede lid kan een andere vennootschap worden aangewezen dan de
      netbeheerder van het landelijk hoogspanningsnet. Tenzij zulks afbreuk zou doen aan de rechten van de in
      [artikel V, eerste lid][ref5], bedoelde partij bij de overeenkomst, zal worden aangewezen een vennootschap waarvan
      de aandelen van die vennootschap direct of indirect worden gehouden door dan wel waarover de zeggenschap berust
      bij de netbeheerder van het landelijk hoogspanningsnet. Een aanwijzing als bedoeld in dit lid geschiedt voor een
      termijn die eindigt op het tijdstip waarop de aanwijzing van de netbeheerder van het landelijk hoogspanningsnet
      eindigt. Zolang nadien nog een overeenkomst van kracht is, geschiedt een nieuwe aanwijzing overeenkomstig dit
      artikel.

      4 Voor zover ingevolge de toepassing van het tweede of derde lid de netbeheerder van het landelijk hoogspanningsnet
      of een vennootschap waarin deze de aandelen direct of indirect houdt of waarover deze de zeggenschap heeft, wordt
      aangewezen als netbeheerder, is de netbeheerder van het landelijk hoogspanningsnet verplicht eraan mee te werken
      dat de ander bij wie de economische eigendom van een net alsdan berust, een verworven economisch belang in de
      desbetreffende netten kan behouden.

      5 Ingeval van overtreding van het vierde lid kan de Autoriteit Consument en Markt de overtreder een last onder
      dwangsom opleggen.

      6 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder de
      netbeheerder van het landelijk hoogspanningsnet in staat wordt gesteld zorg te dragen voor het beheer van netten
      met een spanningsniveau van 110 kV of van 150 kV. Daarbij kunnen taken en bevoegdheden worden opgedragen aan de
      Autoriteit Consument en Markt.


