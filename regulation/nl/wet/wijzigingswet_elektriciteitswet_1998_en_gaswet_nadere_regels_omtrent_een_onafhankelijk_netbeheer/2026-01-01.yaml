  - number: XII
    text: |-
      1 Van overdrachtsbelasting is vrijgesteld de verkrijging die plaatsvindt met het oog op naleving van
      [artikel 10b, eerste lid, van de Elektriciteitswet 1998][ref1] en [artikel 2c, eerste lid, van de Gaswet][ref2].
      De vorige volzin is alleen van toepassing indien de verkrijging plaatsvindt binnen de termijn, genoemd in
      [artikel VIII][ref3], en alleen voor zover er geen wijziging optreedt in de uiteindelijke eigendomsverhoudingen in
      de onroerende zaken.

      2 Indien onroerende zaken die deel uitmaken van een verkrijging als bedoeld in het eerste lid,
      in de voorafgaande periode van drie jaren door de vervreemder zijn verkregen met een vrijstelling
      van overdrachtsbelasting wegens fusie, splitsing of interne reorganisatie als bedoeld in
      [artikel 15, eerste lid, onderdeel h, van de Wet op belastingen van rechtsverkeer][ref4], komen de bij de
      laatstgenoemde vrijstelling gestelde voorwaarden waarbij een termijn van drie jaren is gesteld te vervallen.

      3 [Artikel 3 van het Uitvoeringsbesluit belastingen van rechtsverkeer][ref5] is bij een verkrijging als bedoeld in
      het eerste lid van overeenkomstige toepassing.

      4 Het eerste lid is van overeenkomstige toepassing indien een verkrijging plaatsvindt met het oog op de naleving
      van [artikel IX, tweede lid][ref6], van deze wet, mits de verkrijging plaatsvindt binnen de in dat artikellid
      genoemde termijn.


