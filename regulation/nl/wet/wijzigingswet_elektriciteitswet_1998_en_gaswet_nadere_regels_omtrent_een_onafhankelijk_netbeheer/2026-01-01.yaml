  - number: IXc
    text: |-
      1 De Autoriteit Consument en Markt kan, indien zij het vermoeden heeft dat
      [artikel IXa, eerste of tweede lid][ref1], niet wordt nageleefd, aan de desbetreffende producenten, handelaren of
      leveranciers vragen om overlegging van een verklaring van een onafhankelijke deskundige omtrent de wijze waarop de
      in die leden bedoelde kosten zijn verwerkt.

      2 Over de eerstvolgende vijf kalenderjaren na de inwerkingtreding van de [artikelen IXa][ref2] en [IXb][ref3]
      verstrekt de netbeheerder bij de overzichten die hij op grond van [artikel 19b van de Elektriciteitswet 1998][ref4]
      of [artikel 35b van de Gaswet][ref5] moet verstrekken, tevens een overzicht van de wijze waarop hij de
      [artikelen IXa, eerste en tweede lid][ref6], heeft nageleefd, vergezeld van een verklaring van een onafhankelijke
      deskundige daaromtrent.

      3 De [artikelen 78 van de Elektriciteitswet 1998][ref7], [1h van de Gaswet][ref8] en
      [6b van de Instellingswet Autoriteit Consument en Markt][ref9] zijn van toepassing bij de uitvoering van de
      [artikelen IXA][ref10] en [IXB][ref11].

      4 Ingeval van overtreding van [artikel IXa, eerste of tweede lid][ref12], kan de Autoriteit Consument en Markt
      de overtreder:

      a. een bestuurlijke boete opleggen van ten hoogste 10% van de omzet van de overtreder;

      b. een last onder dwangsom opleggen.

      5 Ingeval van overtreding van het bepaalde bij of krachtens [artikel IXb][ref13], of het eerste of tweede lid van
      dit artikel, kan de Autoriteit Consument en Markt de overtreder:

      a. een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 1% van de omzet van de
      overtreder;

      b. een last onder dwangsom opleggen.


