  - number: VId
    text: |-
      1 Netbeheerders of maatschappijen die daarmee in een groep verbonden zijn of waren kunnen garanties, contragaranties
      of andere zekerheden verstrekken in verband met een overeenkomst die betrekking heeft op een net of op een ander
      bedrijfsmiddel, mits dat bedrijfsmiddel voor 14 juli 2004 werd aangewend in het bedrijf van een groepsmaatschappij
      van die netbeheerder. Dit wordt niet belet door het bepaalde in de [artikelen 17, tweede en derde lid][ref1],
      [17a, tweede lid][ref2], en [18, eerste en tweede lid, van de Elektriciteitswet 1998][ref3]
      onderscheidenlijk de [artikelen 10b, tweede en derde lid][ref4], [10c, tweede lid][ref5], en
      [10d, eerste en tweede lid, van de Gaswet][ref6].

      2 Indien uit een overeenkomst voortvloeit dat met ingang van een datum, gelegen na het tijdstip van
      inwerkingtreding van [artikel I, onderdeel B][ref7], dan wel [artikel II, onderdeel B][ref8], een
      netbeheerder behoort tot een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref9]
      waartoe ook een rechtspersoon of vennootschap behoort die handelingen of activiteiten verricht die
      niet op enigerlei wijze betrekking hebben op of verband houden met infrastructurele voorzieningen
      of aanverwante activiteiten, is het in [artikel I, onderdeel I, derde lid][ref10], voorgestelde
      [artikel 17, derde lid, onder a, van de Elektriciteitswet 1998][ref11], onderscheidenlijk het onder
      [artikel II, onderdeel I, derde lid][ref12] voorgestelde [artikel 10b, derde lid, onder a, van de Gaswet][ref13],
      niet van toepassing.


