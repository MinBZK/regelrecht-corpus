---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_wet_pilot_loondispensatie
regulatory_layer: WET
publication_date: '2010-06-08'
valid_from: '2012-01-01'
bwb_id: BWBR0027707
url: https://wetten.overheid.nl/BWBR0027707/2012-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om een pilot mogelijk te maken met het oog op het
    onderzoeken van de mogelijkheid om met behulp van het instrument loondispensatie de participatie te bevorderen van
    personen met een arbeidsbeperking, die daardoor niet in staat zijn het wettelijk minimumloon te verdienen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.a
    text: |-
      *arbeidsbeperking:* het vanwege structurele lichamelijke, verstandelijke, psychische of psychosociale beperkingen
      niet in staat zijn tot het verdienen van het wettelijk minimumloon, doch wel tot tenminste 20% daarvan;
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.b
    text: '*college:* het college van burgemeester en wethouders van een aan de pilot deelnemende gemeente;'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.c
    text: |-
      *kring:* inwoners van een aan de pilot deelnemende gemeente, die ten minste 23 jaar oud zijn en algemene bijstand
      ontvangen op grond van de [Wet werk en bijstand][ref1] of een uitkering op grond van een bij algemene maatregel van
      bestuur aangewezen socialezekerheidswet;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 1.d
    text: '*dienstbetrekking:* een privaatrechtelijke of publiekrechtelijke dienstbetrekking;'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.e
    text: |-
      *doelgroep:* personen uit de kring, die blijkens een indicatiebeschikking of herindicatiebeschikking behoren tot de
      doelgroep van de [Wet sociale werkvoorziening][ref1] en die niet werkzaam zijn in een dienstbetrekking als bedoeld
      in de [artikelen 2][ref2] en [7 van die wet][ref3], alsmede personen uit de kring van wie met toepassing van
      [artikel 4, eerste lid][ref4], is vastgesteld dat zij een arbeidsbeperking hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0027707#Artikel4
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0027707
        artikel: '4'
  - number: 1.f
    text: |-
      *loonwaarde:* door het college vastgesteld percentage van het rechtens geldende loon voor de door een persoon met
      een arbeidsbeperking verrichte arbeid in een functie naar evenredigheid van de arbeidsprestatie in die functie van
      een gemiddelde werknemer met een soortgelijke opleiding en ervaring, die geen arbeidsbeperking heeft;
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.g
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
  - number: 1.h
    text: |-
      *werknemer:* persoon uit de doelgroep, die een dienstbetrekking is aangegaan onder toepassing van
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '2'
    text: |-
      In de periode vanaf de inwerkingtreding van deze wet tot de datum waarop deze vervalt, vindt, met het oog op het
      nemen van een gefundeerde beslissing over het al dan niet landelijk invoeren van het instrument loondispensatie
      voor mensen met een arbeidsbeperking, een pilot plaats waarmee wordt beoogd inzicht te verkrijgen in de mate waarin
      de inzet van het instrument, bedoeld in [artikel 7, eerste lid][ref1], en de wijze waarop dit instrument wordt
      ingezet in combinatie met een aanvulling op de inkomsten uit arbeid in dienstbetrekking de arbeidsinschakeling
      van personen uit de doelgroep in een dienstbetrekking verhoogt, alsmede in daarmee samenhangende vraagstukken en
      eventuele onvoorziene neveneffecten.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '3'
    text: Onze Minister kan op hun verzoek gemeenten aanwijzen, die deelnemen aan de pilot.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het college kan met het oog op de toepassing van deze wet inwoners, die behoren tot de kring en die
      niet blijkens een indicatiebeschikking of herindicatiebeschikking behoren tot de doelgroep van de
      [Wet sociale werkvoorziening][ref1], verplichten mee te werken aan een onderzoek naar het al dan niet bestaan van
      een arbeidsbeperking.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: '4.2'
    text: |-
      Indien op grond van het eerste lid wordt vastgesteld dat de inwoner een arbeidsbeperking heeft, heeft het college
      een inspanningsverplichting om met behulp van de toepassing van de instrumenten, die hem ter beschikking staan,
      ervoor zorg te dragen dat aan die inwoner een dienstbetrekking wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 9, vijfde lid, van de Wet werk en bijstand][ref1] en overeenkomstige bepalingen uit een bij algemene
      maatregel van bestuur aangewezen wet als bedoeld in [artikel 1, onderdeel c][ref2], zijn niet van toepassing op
      personen uit de doelgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel1
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '1'
  - number: '6'
    text: |-
      Het college kan zijn inwoner, die behoort tot de doelgroep, gedurende maximaal drie maanden bij een werkgever
      onbeloonde werkzaamheden laten verrichten met het oog op een reële vaststelling van de arbeidsprestatie, indien de
      werkgever voor wie de werkzaamheden worden verricht een aansprakelijkheids- en ongevallenverzekering ten behoeve
      van die inwoner heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een werkgever voornemens is een dienstbetrekking aan te gaan met een persoon uit de doelgroep teneinde
      werkzaamheden in een bepaalde functie te verrichten en door het college van de gemeente waarvan die persoon
      inwoner is, is vastgesteld dat de arbeidsprestatie van die persoon in die functie ten gevolge van zijn
      arbeidsbeperking minder zal zijn dan de arbeidsprestatie, die een geldelijke beloning van het voor hem geldende
      wettelijk minimumloon rechtvaardigt, vermindert dat college de hoogte van de aanspraak van die persoon op een
      geldelijke beloning voor de verrichte arbeid tot de loonwaarde, in afwijking van hetgeen bij en krachtens de
      [Wet minimumloon en minimumvakantiebijslag][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '7.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
  - number: 7.2.a
    text: |-
      de arbeid wordt verricht in een dienstbetrekking als bedoeld in de [artikelen 2][ref1] en
      [7 van de Wet sociale werkvoorziening][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
  - number: 7.2.b
    text: met betrekking tot de dienstbetrekking een proeftijd geldt.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het college, bedoeld in het eerste lid, stelt na aanvang van de dienstbetrekking telkens binnen een bij of
      krachtens algemene maatregel van bestuur te bepalen periode vast of nog sprake is van een arbeidsprestatie als
      bedoeld in het eerste lid alsmede wat de loonwaarde is.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
  - number: '7.4'
    text: |-
      Vanaf het moment dat de op grond van het eerste of derde lid vastgestelde loonwaarde van een persoon meer
      bedraagt dan het wettelijk minimumloon, dan wel minder bedraagt dan 20% van het wettelijk minimumloon, zijn de
      [artikelen 4, tweede lid][ref1], en [6][ref2] alsmede het eerste tot en met derde lid niet langer op hem van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel6
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '6'
  - number: '7.5'
    text: |-
      De verlaging van de loonwaarde, die voortvloeit uit een door de werkgever ingesteld bezwaar of beroep, vindt niet
      eerder plaats dan de dag volgend op die waarop tegen de beslissing op bezwaar geen rechtsmiddelen meer openstaan
      of de uitspraak in kracht van gewijsde is gegaan. De eerste zin is van overeenkomstige toepassing in geval van
      intrekking van het bezwaar of beroep omdat het college geheel of gedeeltelijk is tegemoet gekomen aan het bezwaar
      of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
  - number: '7.6'
    text: |-
      Het college vergoedt aan de werkgever het verschil tussen de loonkosten, die hij als gevolg van de toepassing van
      het vijfde lid heeft gehad en de loonkosten, die hij zou hebben gehad als de verlaging van de loonwaarde plaats zou
      hebben gevonden met ingang van de eerste dag waarop de vernietigde of ingetrokken beschikking ziet.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel7
  - number: '8.1'
    text: |-
      Zolang de hoogte van de aanspraak op een geldelijke beloning voor de verrichte arbeid onder toepassing van
      [artikel 7 eerste lid][ref1] is verminderd, verstrekt het college aan de werknemer een aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de berekening van de
      hoogte van de aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel8
  - number: '8.3'
    text: |-
      Voor de toepassing van andere wetten en de daarop berustende bepalingen, wordt een aanvullende uitkering op grond
      van deze wet aangemerkt als een uitkering op grond van de [Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '9.1'
    text: |-
      Het college verstrekt de persoon, die onder toepassing van [artikel 6][ref1] onbeloonde werkzaamheden verricht
      of gaat verrichten respectievelijk onder toepassing van [artikel 7, eerste of derde lid][ref2], arbeid in een
      dienstbetrekking verricht of gaat verrichten, de voorzieningen, die noodzakelijk zijn voor het verrichten van die
      arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '9.2'
    text: |-
      Op de persoon, bedoeld in het eerste lid, is [artikel 35 van de Wet werk en inkomen naar arbeidsvermogen][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '9.3'
    text: |-
      Op de werkgever van de persoon, bedoeld in het eerste lid, is
      [artikel 36 van de Wet werk en inkomen naar arbeidsvermogen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel36
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '36'
  - number: '10.1'
    text: |-
      In afwijking van [artikel 12, vierde lid, onderdeel a, van de Wet sociale werkvoorziening][ref1] behoudt een
      persoon, die onder toepassing van [artikel 7, eerste lid][ref2], arbeid in een dienstbetrekking aanvaardt, zijn
      indicatiebeschikking of herindicatiebeschikking in de zin van [die wet][ref3] gedurende de periode dat de hoogte
      van de aanspraak op een geldelijke beloning voor de verrichte arbeid naar evenredigheid is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008903
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0008903
  - number: '10.2'
    text: |-
      Indien een dienstbetrekking is aangegaan onder toepassing van [artikel 7, eerste lid][ref1], en de werknemer
      met inachtneming van [artikel 12 van de Wet sociale werkvoorziening][ref2] en de daarop berustende bepalingen
      recht heeft op aanbieding van een dienstbetrekking als bedoeld in [artikel 2, eerste lid, van die wet][ref3]
      spant het college zich in om de bestaande dienstbetrekking om te zetten in een dienstbetrekking als bedoeld
      in [artikel 7 van de Wet sociale werkvoorziening][ref4]. Indien het college daar niet in slaagt, biedt het de
      werknemer een dienstbetrekking aan als bedoeld in artikel 2, eerste lid, van de Wet sociale werkvoorziening.
      Indien de werknemer dat aanbod niet aanvaardt, vervalt, in afwijking van het eerste lid, de indicatiebeschikking
      of herindicatiebeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0008903
        artikel: '7'
  - number: '11.1'
    text: Onze Minister verstrekt aan het college een tegemoetkoming in de kosten ter uitvoering van de pilot.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien de deelname van een gemeente aan de pilot eindigt voor 31 december 2012 dan wel indien op grond van
      [artikel 12, eerste lid][ref1], de pilot eerder eindigt dan die datum, kan Onze Minister de tegemoetkoming, bedoeld
      in het eerste lid, lager vaststellen en hetgeen onverschuldigd is betaald terugvorderen of verrekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel12
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '12'
  - number: '12.1'
    text: |-
      Indien de tussentijdse resultaten of de uitwerking in de praktijk daartoe redelijkerwijs aanleiding geeft, kan Onze
      Minister besluiten de pilot te beëindigen voor 31 december 2012.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel12
  - number: '12.2'
    text: |-
      In geval van voortijdige beëindiging van de pilot op grond van het eerste lid blijven de
      [artikelen 7 tot en met 11][ref1] en [14][ref2] en de daarop berustende bepalingen van toepassing tot en
      met 31 december 2012 met betrekking tot degenen, die voor de datum van beëindiging onder toepassing van
      [artikel 7, eerste lid][ref3], een dienstbetrekking zijn aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '12.3'
    text: |-
      Indien de deelname van een gemeente eindigt voor de datum waarop deze wet vervalt, blijven de
      [artikelen 7 tot en met 11][ref1] en [14][ref2] en de daarop berustende bepalingen van toepassing tot de datum
      waarop deze wet vervalt met betrekking tot degenen uit de doelgroep van de desbetreffende gemeente, die voor de
      datum van beëindiging onder toepassing van [artikel 7, eerste lid][ref3], een dienstbetrekking zijn aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0027707
        artikel: '7'
  - number: '13.1'
    text: |-
      Onze Minister zendt uiterlijk 31 oktober 2012 aan de Staten-Generaal een verslag over het inzicht dat de toepassing
      van deze wet heeft verschaft in:
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel13
  - number: 13.1.a
    text: |-
      de mate waarin de inzet van het instrument, bedoeld in [artikel 7, eerste lid][ref1], en de wijze waarop dit
      instrument wordt ingezet in combinatie met een aanvulling op de inkomsten uit arbeid in dienstbetrekking de
      arbeidsinschakeling van personen uit de doelgroep in een dienstbetrekking verhoogt;


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel7
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '7'
  - number: 13.1.b
    text: de overige met onderdeel a samenhangende vraagstukken die zijn onderzocht; en
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel13
  - number: 13.1.c
    text: eventuele onvoorziene neveneffecten.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de pilot onder toepassing van [artikel 12, eerste lid][ref1], eerder wordt beëindigd dan 31 augustus 2012,
      zendt Onze Minister, in afwijking van het eerste lid, uiterlijk twee maanden na de beëindiging van de pilot het
      verslag, bedoeld in het eerste lid, aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel12
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0027707
        artikel: '12'
  - number: '14.1'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel14
  - number: '14.2'
    text: |-
      De regels, bedoeld in het eerste lid, betreffen in ieder geval regels met betrekking tot de toepassing van de
      bevoegdheid, bedoeld in [artikel 3][ref1], het onderzoek, bedoeld in [artikel 4, eerste lid][ref2], de vaststelling
      van de loonwaarde, bedoeld in de [artikelen 6][ref3] en [7][ref4], en de berekening van de tegemoetkoming, bedoeld
      in [artikel 11, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0027707#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0027707#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0027707#Artikel11
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel14
    references:
