  - number: '15'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet pilot loondispensatie.'
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel15
  - number: '16.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vervalt met ingang van 1 januari
      2013.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien voor 1 januari 2013 een voorstel van wet is ingediend bij de Staten-Generaal om de pilot om te zetten in een
      structurele wettelijke regeling vervalt, in afwijking van het eerste lid, deze wet met ingang van de datum waarop
      dat voorstel van wet, nadat het tot wet is verheven, in werking treedt.
    url: https://wetten.overheid.nl/BWBR0027707/2012-01-01#Artikel16
