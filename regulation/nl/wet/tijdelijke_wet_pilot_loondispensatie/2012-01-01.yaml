        artikel: '3'
      - id: ref2
        bwb_id: BWBR0027707
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0027707
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0027707
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0027707
        artikel: '11'
  - number: '14.3'
    text: |-
      Een voordracht voor een op grond van het eerste lid, [artikel 1, onderdeel c][ref1], [artikel 7, derde lid][ref2],
      of [artikel 8, tweede lid][ref3], vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan na
      vier weken nadat het ontwerp daarvan aan beide kamers van de Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0027707#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027707#Artikel7
