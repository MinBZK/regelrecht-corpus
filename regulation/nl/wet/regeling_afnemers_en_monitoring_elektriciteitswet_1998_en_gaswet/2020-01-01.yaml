      de inlichtingen, bedoeld in [artikel 56, eerste of tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel56
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '56'
  - number: 12.1.h
    text: |-
      de rapportages, bedoeld in [artikel 83, van die wet][ref1], alsmede van


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel83
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '83'
  - number: 12.1.i
    text: |-
      de ingediende winningsplannen, bedoeld in [artikel 34, eerste lid, van de Mijnbouwwet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
  - number: 12.1.j
    text: |-
      de gegevens, bedoeld in [artikel 113, eerste lid, onderdelen e en f, van het Mijnbouwbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel113
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '113'
  - number: '12.2'
    text: |-
      De Autoriteit Consument en Markt zendt Onze Minister zo spoedig mogelijk na ontvangst de documenten en
      registraties, bedoeld in het eerste lid, onderdelen a en b, toe.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
  - number: '12.3'
    text: |-
      De netbeheerders zenden Onze Minister jaarlijks voor 1 mei van elk kalenderjaar het meest actuele overzicht van de
      registraties, bedoeld in het eerste lid, onderdeel c, toe.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel12
  - number: '13.1'
    text: 'Een leverancier draagt er zorg voor dat overeenkomstig:'
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel13
  - number: 13.1.a
    text: |-
      [artikel 95k, eerste lid, onderdeel a van de Elektriciteitswet 1998][ref1] op of bij de rekening een etiket wordt
      geplaatst of gevoegd en in het promotiemateriaal wordt opgenomen, respectievelijk,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
  - number: 13.1.b
    text: |-
      [artikel 95k, eerste lid, onderdeel b van de Elektriciteitswet 1998][ref1], op of bij de rekening een etiket wordt
      geplaatst of gevoegd, dat de totale hoeveelheid van de door hem in het voorafgaande kalenderjaar, respectievelijk
      in de periode waarop de rekening betrekking heeft, aan eindafnemers geleverde elektriciteit vermeldt, uitgedrukt in
      het aantal kilowatturen, uitgesplitst naar energiebronnen en onder vermelding van het procentuele aandeel van elke
      energiebron in zijn totale brandstofmix, met inachtneming van de bij deze regeling behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
  - number: '13.2'
    text: |-
      Indien een energiebron, genoemd in het etiket, bedoeld in het eerste lid, geen deel uitmaakt van de totale
      brandstofmix van de leverancier, wordt het procentuele aandeel van de desbetreffende bron op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      Op het etiket, bedoeld in het eerste lid, worden de milieugevolgen, in termen van uitstoot van koolstofdioxide
      en van radioactief afval, vermeld, als gevolg van elektriciteitsproductie met verschillende energiebronnen,
      veroorzaakt door de totale brandstofmix die de leverancier in het voorafgaande jaar heeft gebruikt, met
      uitzondering van ‘onbekend’. De informatie, bedoeld in de vorige volzin, kan worden verstrekt door middel van
      verwijzingen op het etiket naar beschikbare referentiebronnen waar voor een ieder toegankelijke informatie
      beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel13
  - number: '14'
    text: |-
      Een producent onderscheidenlijk een handelaar meldt overeenkomstig
      [artikel 95k, tweede lid, van de Elektriciteitswet 1998][ref1] een leverancier voor wie hij in het voorafgaande
      kalenderjaar elektriciteit heeft geproduceerd onderscheidenlijk aan wie hij in dat jaar elektriciteit heeft
      verhandeld, de totale hoeveelheid van de door hem in dat kalenderjaar geproduceerde of verhandelde elektriciteit,
      uitgedrukt in het aantal kilowatturen, uitgesplitst naar energiebronnen en onder vermelding van het procentuele
      aandeel van elke energiebron in zijn totale brandstofmix, rekening houdend met de bij deze regeling behorende
      bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
  - number: '15.1'
    text: De leverancier is verantwoordelijk voor de juistheid en volledigheid van het etiket.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      De leverancier overlegt uiterlijk vier maanden na 1 januari van elk kalenderjaar aan de Autoriteit Consument en
      Markt:
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel15
  - number: 15.2.a
    text: |-
      het etiket dat hij in dat kalenderjaar op of bij de rekening heeft geplaatst of gevoegd en op het promotiemateriaal
      heeft vermeld;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel15
  - number: 15.2.b
    text: |-
      een overzicht van de totale hoeveelheid in het voorafgaande kalenderjaar aan eindafnemers geleverde elektriciteit,
      onderverdeeld naar energiebronnen en het procentuele aandeel van elke energiebron in de totale brandstofmix,
      overeenkomstig de bijlage behorende bij deze regeling;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel15
  - number: 15.2.c
    text: |-
      een overzicht van de hoeveelheid elektriciteit ten behoeve van de levering aan eindafnemers waarvoor garanties van
      oorsprong of certificaten van oorsprong zijn afgeboekt, onderverdeeld naar energiebronnen, overeenkomstig de bij
      deze regeling behorende bijlage en het land van herkomst van die elektriciteit.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel15
  - number: '16'
    text: |-
      Een producent overlegt uiterlijk twee maanden na 1 januari van elk kalenderjaar aan de Autoriteit Consument en
      Markt een overzicht van de totale hoeveelheid elektriciteit die hij op het net heeft ingevoed, onderverdeeld naar
      energiebronnen en het procentuele aandeel van elke energiebron in de totale brandstofmix, rekening houdend met de
      bijlage behorende bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel16
  - number: '17'
    text: |-
      De beheerder van het landelijke hoogspanningsnet overlegt uiterlijk drie maanden na 1 januari van elk kalenderjaar
      aan de Autoriteit Consument en Markt:
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel17
  - number: 17.a
    text: |-
      de hoeveelheid elektriciteit die in het voorafgaande kalenderjaar vanuit Nederland is uitgevoerd en de hoeveelheid
      elektriciteit die in Nederland is ingevoerd;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel17
  - number: 17.b
    text: |-
      het totale aantal garanties van oorsprong en certificaten van oorsprong, onderverdeeld naar opwekkingsbron, die in
      het voorafgaande kalenderjaar is afgeboekt.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Op een leveringsovereenkomst of een transportovereenkomst die is gesloten voor het tijdstip van inwerkingtreding
      van deze regeling en die niet overeenstemt met de eisen die in deze regeling aan een leveringsovereenkomst of een
      transportovereenkomst worden gesteld, blijft het recht van toepassing, zoals dat voor dat tijdstip gold.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      De leverancier of netbeheerder stelt kleinverbruikers met wie hij een overeenkomst als bedoeld in het eerste
      lid heeft gesloten, binnen zes maanden na inwerkingtreding van deze regeling in de gelegenheid deze overeenkomst
      om te zetten in een overeenkomst die in overeenstemming is met de eisen die in deze regeling aan een dergelijke
      overeenkomst worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel18
  - number: '19'
    text: |-
      In afwijking van [artikel 9, eerste lid][ref1], bedraagt de termijn voor de netbeheerder voor het uitvoeren van een
      wisseling dan wel het doen van een kennisgeving dat de wisseling niet zal worden uitgevoerd tot 1 januari 2005 ten
      hoogste tien werkdagen, gerekend vanaf de dag waarop hij het verzoek tot de wisseling ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel9
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '9'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Indien de leverancier [artikel 95k, eerste lid, onderdeel a van de Elektriciteitswet 1998][ref1] toepast, plaatst
      of voegt hij voor het eerst een etiket op of bij de rekening en neem hij voor het eerst een etiket op in het
      promotiemateriaal in het eerste kalenderjaar dat volgt op het kalenderjaar waarin deze regeling in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
  - number: '20.2'
    text: |-
      Indien de leverancier [artikel 95k, eerste lid, onderdeel b van de Elektriciteitswet 1998][ref1] toepast,
      plaatst of voegt hij voor het eerst een etiket op of bij de rekening in het eerste kalenderjaar dat volgt op het
      kalenderjaar waarin deze regeling in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95k
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95k
  - number: '21'
    text: Deze regeling treedt in werking op de tweede dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel21
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Regeling afnemers en monitoring Elektriciteitswet 1998 en Gaswet.'
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel22
