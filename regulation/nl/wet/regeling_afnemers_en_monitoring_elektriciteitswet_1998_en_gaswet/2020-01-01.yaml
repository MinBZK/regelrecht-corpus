  - number: '11.2'
    text: |-
      De Autoriteit Consument en Markt zendt Onze Minister zo spoedig mogelijk na ontvangst de documenten en rapportages
      als bedoeld in het eerste lid, onderdelen b en c, toe.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel11
  - number: '12.1'
    text: |-
      Ter uitvoering van de taak, bedoeld in [artikel 52a van de Gaswet][ref1], maakt Onze Minister in ieder geval
