preamble:
  text: |-
    Gelet op de richtlijn van 26 juni 2003, nr. 2003/54/EG, betreffende gemeenschappelijke regels voor de interne markt
    voor elektriciteit en houdende intrekking van richtlijn 96/92/EG (PbEG L 176), en de richtlijn van 26 juni 2003
    nr. 2003/55/EG, betreffende gemeenschappelijke regels voor de interne markt voor aardgas en houdende intrekking van
    richtlijn 98/30/EG, alsmede op de artikelen 4a, 24a, 31b, 95k en 95m, van de Elektriciteitswet 1998 en de artikelen
    17a, 52a en 52b, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
  - number: 1.a
    text: |-
      kleinverbruiker: een afnemer als bedoeld in [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 43, eerste lid, van de Gaswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '43'
  - number: 1.b
    text: |-
      leveringsovereenkomst: een overeenkomst tussen een leverancier en een afnemer tot levering van elektriciteit of
      gas;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
  - number: 1.c
    text: |-
      transportovereenkomst: een overeenkomst tussen een netbeheerder en een afnemer tot transport van elektriciteit
      of gas;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
  - number: 1.d
    text: |-
      elektriciteitsrichtlijn: de richtlijn, bedoeld in
      [artikel 1, eerste lid, onderdeel m, van de Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 1.e
    text: |-
      gasrichtlijn: de richtlijn, bedoeld in [artikel 1, eerste lid, onderdeel q, van de Gaswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 1.f
    text: 'EAN-code: Uniek identificatienummer conform de Europese Artikel Nummering betreffende de aansluiting;'
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
  - number: 1.g
    text: |-
      wisseling: een op verzoek van een afnemer door de netbeheerder uitgevoerde wijziging van de leverancier van
      elektriciteit of gas van die afnemer, met uitzondering van een wijziging van de tenaamstelling van de aansluiting;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
  - number: 1.h
    text: |-
      etiket: de weergave van de opwekkingsgegevens, bedoeld in
      [artikel 95j, onderdeel a, van de Elektriciteitswet 1998][ref1] op of bij de rekening aan de eindafnemer en op aan
      de eindafnemer geadresseerd promotiemateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95j
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95j
  - number: '2'
    text: |-
      Een leveringsovereenkomst met een kleinverbruiker wordt op schrift gesteld en bevat in ieder geval de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.a
    text: de personalia en het adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.b
    text: |-
      een omschrijving van de te leveren goederen en diensten en de overeengekomen kwaliteitsniveaus daarvan, met
      inbegrip van de goederen en diensten die niet rechtstreeks in verband staan met de levering van elektriciteit of
      gas;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.c
    text: |-
      de wijze waarop informatie kan worden verkregen over de geldende tarieven voor de levering van elektriciteit of gas
      en over de kosten van goederen en diensten die niet rechtstreeks in verband staan met de levering van elektriciteit
      of gas;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.d
    text: |-
      de looptijd van de overeenkomst, de voorwaarden voor verlenging en beëindiging van de overeenkomst, en of het
      toegestaan is de overeenkomst kosteloos op te zeggen;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.e
    text: |-
      een omschrijving van de toepasselijke vergoedingen en terugbetalingsregelingen als de geleverde goederen
      en diensten niet aan de overeengekomen kwaliteitsniveaus voldoen met inbegrip van onnauwkeurige en te late
      facturering;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2.f
    text: |-
      de wijze waarop geschillenprocedures als bedoeld in [artikel 6][ref1] aanhangig kunnen worden gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel6
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '6'
        paragraaf: '2'
  - number: 2.g
    text: informatie over consumentenrechten, met inbegrip van informatie over klachtenbehandeling.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2
  - number: 2a
    text: |-
      Informatie bedoeld in [artikel 2, onderdeel g][ref1], wordt duidelijk meegedeeld door middel van de facturen of via
      de website van de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel2
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      Een transportovereenkomst met een kleinverbruiker wordt op schrift gesteld en bevat in ieder geval de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.a
    text: de personalia en het adres van de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.b
    text: |-
      een omschrijving van de te leveren goederen en diensten en de overeengekomen kwaliteitsniveaus daarvan en, indien
      van toepassing, de tijd die nodig is voor de realisatie van een aansluiting;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.c
    text: |-
      de wijze waarop informatie kan worden verkregen over de geldende tarieven voor het transport van elektriciteit
      of gas;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.d
    text: |-
      de looptijd van de overeenkomst, het recht tot opzegging van de overeenkomst en de voorwaarden voor verlenging of
      beëindiging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.e
    text: |-
      een omschrijving van de toepasselijke vergoedingen en terugbetalingsregelingen als de geleverde goederen en
      diensten niet aan de overeengekomen kwaliteitsniveaus voldoen;
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
  - number: 3.f
    text: |-
      de wijze waarop geschillenprocedures als bedoeld in [artikel 6][ref1] aanhangig kunnen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel6
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '6'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Leveranciers stellen kleinverbruikers rechtstreeks in kennis van elke stijging van de
      tarieven voor de levering van elektriciteit of gas en wijzen hun daarbij op het bepaalde in
      [artikel 95m, tiende lid, van de Elektriciteitswet 1998][ref1] of [artikel 52b, tiende lid, van de Gaswet][ref2].
      De kennisgeving wordt gedaan binnen een redelijke termijn na de invoering van de tariefstijging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel52b
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95m
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 52b
  - number: '4.2'
    text: |-
      Leveranciers stellen kleinverbruikers op toereikende wijze in kennis van elk voornemen de aan de
      overeenkomst verbonden voorwaarden voor de levering van elektriciteit of gas te wijzigen, en wijzen
      hun daarbij op het bepaalde in [artikel 95m, tiende lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 52b, tiende lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95m
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel52b
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95m
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 52b
  - number: '4.3'
    text: |-
      Netbeheerders stellen kleinverbruikers op toereikende wijze in kennis van elke stijging van de tarieven en van
      elk voornemen tot wijziging van de aan de transportovereenkomst verbonden voorwaarden voor het transport van
      elektriciteit of gas.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Netbeheerders stellen leveranciers van kleinverbruikers rechtstreeks in kennis van elke wijziging van de tarieven
      voor het transport van elektriciteit of gas en van elk voornemen tot wijziging van de aan de transportovereenkomst
      verbonden voorwaarden voor het transport van elektriciteit of gas.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel4
  - number: '5.1'
    text: Leveranciers en netbeheerders bieden kleinverbruikers een ruime keuze uit betalingswijzen.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een verschil in tarieven en voorwaarden tussen de betalingswijzen, bedoeld in het eerste lid, houdt verband met het
      verschil in kosten die die betalingswijzen voor de leverancier of de netbeheerder met zich brengen.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel5
  - number: '6'
    text: |-
      In een transportovereenkomst of een leveringsovereenkomst met een kleinverbruiker wordt in ieder geval bepaald
      dat, onverminderd de bevoegdheid van de burgerlijke rechter, kleinverbruikers geschillen, die voortvloeien uit de
      desbetreffende overeenkomst kunnen voorleggen aan een onafhankelijke geschillencommissie. De geschillenprocedure
      dient snel, transparant, eenvoudig en goedkoop te zijn. Met toepassing van deze procedure moeten geschillen
      naar maatstaven van redelijkheid en billijkheid worden beslecht, zo nodig door middel van een systeem van
      terugbetaling of vergoedingen. Rekening wordt gehouden met Aanbeveling nr. 98/257/EG, van de Europese Commissie
      van 30 maart 1998, betreffende de principes die van toepassing zijn op de organen die verantwoordelijk zijn voor de
      buitengerechtelijke beslechting van consumentengeschillen (PbEG L 115).
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Leveranciers onderscheidenlijk netbeheerders stellen kleinverbruikers bij het sluiten van een leveringsovereenkomst
      onderscheidenlijk een transportovereenkomst in kennis van hun aanspraak op universele dienstverlening als
      omschreven in artikel 3, derde lid, van de elektriciteitsrichtlijn, naar de tekst zoals deze bij die richtlijn
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Leveranciers onderscheidenlijk netbeheerders die gas leveren onderscheidenlijk transporteren, stellen
      kleinverbruikers die een aansluiting op een gastransportnet hebben bij het sluiten van een leveringsovereenkomst
      onderscheidenlijk een transportovereenkomst in kennis van het bepaalde in [artikel 44][ref1] onderscheidenlijk de
      [artikelen 80][ref2] en [81 tot en met 81d, van de Gaswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel81
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '81'
  - number: '8'
    text: |-
      Een afnemer die wil wisselen, dient daartoe, door tussenkomst van de leverancier die hem vanaf de dag van de
      wisseling elektriciteit of gas zal gaan leveren, een verzoek in bij de netbeheerder. Hij stelt daarbij alle
      gegevens ter beschikking waarover hij de beschikking heeft of redelijkerwijs kan verkrijgen en die de netbeheerder
      nodig heeft om de wisseling uit te voeren. Deze gegevens omvatten in ieder geval:
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel8
  - number: 8.a
    text: de EAN-code,
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel8
  - number: 8.b
    text: de overeengekomen datum van de wisseling.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      De netbeheerder voert de wisseling binnen 5 werkdagen uit indien de overeengekomen datum van de wisseling, bedoeld
      in [artikel 8, onderdeel b][ref1], daartoe noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel8
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '8'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Als de wisseling niet wordt uitgevoerd dan stelt de netbeheerder de leverancier, bedoeld in [artikel 8][ref1],
      en, al dan niet door tussenkomst van genoemde leverancier, de afnemer daarvan in kennis, binnen vijf werkdagen,
      gerekend vanaf de datum waarop de netbeheerder het verzoek te wisselen heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel8
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '8'
        paragraaf: '3'
  - number: '9.3'
    text: |-
      Een kennisgeving, als bedoeld in het tweede lid, vermeldt de redenen waarom de wisseling niet wordt uitgevoerd.
      Een reden om de wisseling niet uit te voeren, is in ieder geval dat de afnemer de in [artikel 8][ref1] genoemde
      gegevens niet, niet volledig of niet tijdig heeft overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel8
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '8'
        paragraaf: '3'
  - number: '10'
    text: Kleinverbruikers worden geen kosten in rekening gebracht voor een wisseling.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel10
  - number: 10a
    text: |-
      Een afnemer die van leverancier wisselt ontvangt de eindafrekening binnen zes weken nadat de oorspronkelijke
      leverancier door de netbeheerder van deze wisseling op de hoogste is gesteld.
    url: https://wetten.overheid.nl/BWBR0016979/2020-01-01#Artikel10a
  - number: '11.1'
    text: |-
      Ter uitvoering van de taak, bedoeld in [artikel 4a van de Elektriciteitswet 1998][ref1], maakt Onze Minister in
      ieder geval gebruik van de inlichtingen en gegevens in:


