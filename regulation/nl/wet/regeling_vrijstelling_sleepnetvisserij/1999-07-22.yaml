        artikel: '7'
  - number: '3'
    text: |-
      Aan de in [artikel 2][ref1] bedoelde vrijstellingen worden de volgende voorschriften verbonden:

      a. vissoorten als genoemd in de bijlagen 2, 3 en 4 bij de Regeling vangstbeperking met uitzondering van schar en
      bot, gevangen in de bij die vissoorten genoemde wateren, dienen onmiddellijk na het ophalen ervan in hetzelfde
      water te worden teruggezet;

      b. indien de visserij op garnalen wordt uitgeoefend, dient de vangst direct na aan boord te zijn gehaald, te worden
      gesorteerd met behulp van een handzeef;

      c. het is verplicht een handzeef aan boord te hebben van het vaartuig waarmee de garnalenvisserij wordt
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0009012#Artikel2
    url: https://wetten.overheid.nl/BWBR0009012/1999-07-22#Artikel3
