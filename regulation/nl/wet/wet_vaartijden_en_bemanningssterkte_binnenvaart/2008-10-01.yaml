  - number: '2'
    text: Het bij of krachtens deze wet bepaalde is van toepassing op schepen op binnenwateren.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel2
  - number: '4'
    text: |-
      Deze wet is niet van toepassing met betrekking tot:

      a. vlotten;

      b. schepen, bestemd tot het redden van drenkelingen;

      c. schepen van de krijgsmacht;

      d. schepen, bestemd of gebezigd voor het bedrijfsmatig vervoer van goederen, met een laadvermogen van minder dan
      15 ton;

      e. schepen, niet bestemd of gebezigd voor het bedrijfsmatig vervoer van goederen, met een waterverplaatsing van
      minder dan 15 m3, niet zijnde veren en niet zijnde schepen, bestemd of gebezigd voor het bedrijfsmatig vervoer van
      meer dan 12 personen, buiten de bemanning;

      f. schepen, bestemd of gebezigd voor het bedrijfsmatig vervoer van 12 of minder personen, buiten de bemanning, niet
      zijnde veren;

      g. schepen, waarmede uitsluitend niet-beroepsmatig wordt gevaren;

      h. zeevissersschepen;

      i. zeeschepen, niet zijnde havensleepboten,

      1°. die gebruik dienen te maken van de diensten van een loods en zich bevinden op de scheepvaartwegen, bedoeld
      in de [artikelen 10, eerste lid][ref1], en [11, van de Scheepvaartverkeerswet][ref2], op de Westerschelde, haar
      mondingen of op het Kanaal van Gent naar Terneuzen, met uitzondering van zeeschepen die zich bevinden op de
      scheepvaartweg van Rotterdam tot aan Gorinchem;

      2°. die van de loodsplicht zijn vrijgesteld op grond van
      [artikel 10, tweede lid, van de Scheepvaartverkeerswet][ref3] of artikel 9, tweede lid van het Scheldereglement, of
      waarvoor ontheffing is verleend op grond van [artikel 10, derde lid, van die wet][ref4], of artikel 9, vierde lid,
      van dat reglement en zich bevinden op de scheepvaartwegen, bedoeld onder 1°;

      3°. die zich bevinden in de haven van Scheveningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel10
