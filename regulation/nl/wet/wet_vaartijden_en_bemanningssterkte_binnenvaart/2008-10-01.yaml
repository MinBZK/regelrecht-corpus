        bwb_id: BWBR0006029
        artikel: '5'
  - number: '7'
    text: |-
      1 Onze Minister kan ontheffing verlenen van het krachtens [artikel 5, eerste lid][ref1], bepaalde.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      3 [Artikel 6, derde en vierde lid][ref2], zijn van overeenkomstige toepassing. Een ontheffing kan voorts worden
      ingetrokken indien een of meer van de daaraan verbonden voorschriften niet wordt of worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel6
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel7
