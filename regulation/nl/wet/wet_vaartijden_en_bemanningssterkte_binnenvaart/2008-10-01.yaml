preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het belang van de arbeidsbescherming en van de veiligheid van de
    vaart, gewenst is, wettelijke regelen vast te stellen inzake de rusttijden van bemanningsleden, de samenstelling
    van de bemanning en de vaartijden van schepen op binnenwateren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Ministers: Onze Minister van Verkeer en Waterstaat;

      b. bemanningslid: een ieder, die zich als schipper, stuurman, machinist, volmatroos, matroos-motordrijver, matroos,
      of lichtmatroos aan boord van een schip bevindt;

      c. werkgever:

      1°. degene jegens wie de gezagvoerend schipper krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling
      gehouden is tot het verrichten van arbeid, behalve indien die gezagvoerend schipper aan een derde ter beschikking
      wordt gesteld voor het verrichten van arbeid, welke die derde gewoonlijk doet verrichten;

      2°. degene aan wie de gezagvoerend schipper ter beschikking is gesteld voor het verrichten van arbeid, bedoeld
      onder 1°;

      3°. degene die zonder werkgever in de zin van 1° of 2° te zijn, de gezagvoerend schipper onder zijn gezag arbeid
      doet verrichten;

      d. binnenwateren: de wateren die in Nederland zijn gelegen binnen een langs de Nederlandse kust gaande, bij
      algemene maatregel van bestuur aangewezen lijn;

      e. schip: een binnenschip of een ander vaartuig dat de onder *d* bedoelde wateren bevaart, alsmede een drijvend
      werktuig;

      f. zeeschip: een schip dat voor de vaart op zee is toegelaten en daartoe over de geldige certificaten beschikt;

      g. drijvend werktuig: een drijvend bouwsel met mechanische installaties, dat is bestemd om op de onder *d* bedoelde
      wateren te worden gebruikt, zoals een baggermolen, een elevator, een bok of een kraan, met uitzondering van
      baggerwerkzaamheden als bedoeld in het [Arbeidstijdenbesluit][ref1].

      h. Herziene Rijnvaartakte: de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte, met Bijlagen
      en slotprotocol, (*Trb.* 1955, 161), zoals deze sedertdien is gewijzigd;

      i. havensleepboot: vaartuig met eigen mechanische aandrijving dat voor het slepen, het duwen of het assisteren van
      zeeschepen is gebouwd of uitgerust;

      j. verwerken van persoonsgegevens, onderscheidenlijk verantwoordelijke: hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel1
