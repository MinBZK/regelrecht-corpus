  - number: '17'
    text: |-
      1 Handelen of nalaten in strijd met een verplichting voortvloeiend uit [artikel 16][ref1] wordt gestraft met een
      geldboete van de tweede categorie.

      2 De feiten, strafbaar gesteld in het eerste lid, zijn overtredingen.


