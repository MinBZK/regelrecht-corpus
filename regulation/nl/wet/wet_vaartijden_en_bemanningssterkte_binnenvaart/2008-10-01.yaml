        bwb_id: BWBR0006029
        artikel: '6'
  - number: '8'
    text: |-
      Tegen een eis als bedoeld in [artikel 5, eerste lid, onderdeel d][ref1], kan een belanghebbende administratief
      beroep instellen bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel5
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '5'
  - number: '9'
    text: |-
      Onze Minister stelt de vergoeding vast die verschuldigd is voor de kosten van de stukken, bij of krachtens deze wet
      opgemaakt alsmede de vergoeding, verschuldigd voor de kosten van de behandeling van een ontheffingsaanvraag.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister pleegt overleg over de hoofdlijnen van het beleid inzake de onderwerpen de uitvoering van deze wet
      betreffende met de naar zijn oordeel representatieve organisaties van ondernemers en werknemers in de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel10
  - number: '11'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet en de Herziene Rijnvaartakte bepaalde zijn
      belast de bij besluit van Onze Minister aangewezen onder hem ressorterende ambtenaren.

      2 Indien andere dan de in het eerste lid bedoelde ambtenaren worden aangewezen, die ressorteren onder een andere
      minister, wordt het besluit tot aanwijzing van die ambtenaren genomen door Onze Minister, in overeenstemming met
      die andere minister.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel11
  - number: '16'
    text: |-
      1 De gezagvoerend schipper en diens werkgever zijn verplicht tot naleving van de krachtens
      [artikel 5, eerste lid, onderdelen a tot en met d][ref1], gestelde regels en onderdeel e,
      gestelde eisen alsmede van de tot de gezagvoerend schipper en diens werkgever gerichte, krachtens
      [artikel 5, eerste lid, onderdeel f][ref2], gestelde regels en de krachtens de [artikelen 6, tweede lid][ref3], en
      [7, tweede lid][ref4], aan een vrijstelling onderscheidenlijk ontheffing verbonden voorschriften.

      2 Een bemanningslid is verplicht tot naleving van de tot hem gerichte krachtens
      [artikel 5, eerste lid, onderdelen a en f][ref5], gestelde regels en de tot hem gerichte krachtens de
      [artikelen 6, tweede lid][ref6], en [7, tweede lid][ref7], aan een vrijstelling onderscheidenlijk ontheffing
      verbonden voorschriften.


