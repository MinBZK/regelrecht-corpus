  - number: '18'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet en de bij de Herziene Rijnvaartakte strafbaar gestelde
      feiten zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1], belast de in [artikel 11][ref2]
      bedoelde ambtenaren, voor zover zij in door Onze Minister aangewezen gevallen, in overeenstemming met Onze Minister
      van Justitie, zijn aangewezen. Met de opsporing van de bij de Herziene Rijnvaartakte strafbaar gestelde feiten
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref3], voorts belast de ambtenaren van de
      rijksbelastingdienst, bevoegd inzake douane. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref4] en [184 van het Wetboek van Strafrecht][ref5], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


