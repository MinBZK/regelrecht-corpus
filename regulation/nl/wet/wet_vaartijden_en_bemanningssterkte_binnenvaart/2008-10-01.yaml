  - number: '5'
    text: |-
      1 In het belang van de arbeidsbescherming en de veiligheid van de vaart kunnen bij of krachtens algemene maatregel
      van bestuur regels worden gesteld inzake:

      a. de toestand waarin bemanningsleden geen arbeid mogen verrichten;

      b. de naleving van de rusttijden van bemanningsleden.

      c. de vaartijden van schepen;

      d. de samenstelling van de minimumbemanning op de onderscheiden scheepstypen en bij de onderscheiden
      exploitatiewijzen, alsmede de aan bemanningsleden te stellen eisen;

      e. de bevoegdheid van ambtenaren tot het stellen van eisen met betrekking tot het bepaalde in onderdeel *c*;

      f. verplichtingen omtrent het registreren of doen registreren van gegevens ten behoeve van het toezicht dan wel de
      douanecontrole op de naleving van krachtens deze wet gegeven voorschriften.

      2 De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid, wordt niet gedaan dan nadat
      de beide kamers der Staten-Generaal hiervan kennis hebben genomen.

      3 Ter uitvoering van bij of krachtens de maatregel, bedoeld in het eerste lid, gestelde regels worden
      persoonsgegevens betreffende de gezondheid verwerkt. De verwerking van deze gegevens vindt plaats teneinde te
      kunnen beoordelen of een bemanningslid voldoet of niet meer voldoet aan de bij of krachtens de maatregel gestelde
      vereisten betreffende de lichamelijke geschiktheid. Onze Minister is verantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel5
  - number: 5a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter uitvoering van de Herziene Rijnvaartakte regels gesteld
      betreffende:

      a. de vaartijden en bemanningssterkte en de hiermee verband houdende eisen voor schepen en voor uitrustingsstukken
      van schepen die de Rijn in Nederland, met inbegrip van de Waal en de Lek, bevaren;

      b. de afgifte van de met de in onderdeel a bedoelde regels samenhangende documenten;

      c. de procedure van typegoedkeuring van uitrustingsstukken van schepen die de in onderdeel a genoemde
      scheepvaartwegen bevaren;

      d. de instellingen en bedrijven en de erkenning daarvan, die de installatie of reparatie verrichten van
      uitrustingsstukken van schepen die de in onderdeel a genoemde scheepvaartwegen bevaren;

      e. de instellingen en de autoriteiten in Nederland die belast zijn met de uitvoering van deze regels.
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel5a
  - number: '6'
    text: |-
      1 Onze Minister kan ten aanzien van bepaalde groepen van bemanningsleden dan wel van bepaalde categorieën schepen,
      vrijstelling verlenen van het krachtens [artikel 5, eerste lid][ref1], bepaalde.

      2 Een vrijstelling kan onder beperkingen worden verleend. Aan een vrijstelling kunnen voorschriften worden
      verbonden. Een vrijstelling wordt in de *Staatscourant* bekend gemaakt.

      3 Een vrijstelling kan worden ingetrokken wanneer:

      a. een of meer der redenen waarom zij is verleend is of zijn vervallen en

      b. zich na de verlening zodanige feiten of omstandigheden voordoen dat, indien deze ten tijde van de verlening
      bekend waren geweest, de vrijstelling niet of niet in die vorm zou zijn verleend.

      4 De in het eerste lid bedoelde bevoegdheid geldt niet met betrekking tot schepen en de zich aan boord daarvan
      bevindende bemanningsleden waarop de bij of krachtens de Herziene Rijnvaartakte gegeven regelen van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel5
    url: https://wetten.overheid.nl/BWBR0006029/2008-10-01#Artikel6
    references:
