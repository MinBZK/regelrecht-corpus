        bwb_id: BWBR0041355
        artikel: '14'
        paragraaf: '3'
  - number: '15.3'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 14, onderdeel b][ref1], binnen 3 jaar na
      de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel14
