      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 12, eerste lid][ref1], binnen 4 jaar na de
      datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel12
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel13
