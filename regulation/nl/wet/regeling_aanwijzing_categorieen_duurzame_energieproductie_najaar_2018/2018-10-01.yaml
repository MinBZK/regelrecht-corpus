articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *algemene uitvoeringsregeling:*
      [Algemene uitvoeringsregeling stimulering duurzame energieproductie][ref1];
        - *allesvergisting:* biologische afbraakreacties van biomassa als bedoeld in de NTA 8003: 2008, met uitzondering
      van de nummers 410, 420, 500, 550 tot en met 559, waarvan de biogasopbrengst van de ingaande stroom ten minste 25
      Nm3 aardgasequivalent per ton bedraagt;
        - *beschermingszone:* beschermingszone als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref2];
        - *besluit:* [Besluit stimulering duurzame energieproductie][ref3];
        - *biosyngas;* mengsel van gassen dat is geproduceerd door vergassing van biomassa en dat geen nadere bewerking tot
      methaan heeft ondergaan;
        - *doublet:* combinatie van twee naast elkaar liggende diepboringen die ten minste bestaat uit één productieput en
      één injectieput;
        - *hernieuwbaar gas hub:* verzameling van productie-installaties voor de productie van hernieuwbaar gas waarvoor
      voor de invoeding van het hernieuwbaar gas op een gasnet gezamenlijk een of meerdere aansluitingen worden gebruikt,
      waarmee gezamenlijk hernieuwbare warmte wordt geproduceerd die nuttig wordt gebruikt of waarmee gezamenlijk
      hernieuwbare elektriciteit wordt geproduceerd die op een elektriciteitsnet of installatie, met uitzondering van de
      productie-installatie, wordt ingevoed;
        - *ketel:* installatie waarin brandstof wordt verstookt waarbij de verbrandingswarmte met behulp van een
      warmtewisselaar wordt overgedragen aan een vloeistof;
        - *Minister:* Minister van Economische Zaken en Klimaat;
        - *netto P50-waarde vollasturen:* aantal vollasturen waarbij de verwachte jaarlijkse energieproductie voor een
      gegeven combinatie van locatie en productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie dient te zijn bepaald met een waarschijnlijkheid van 50%;
        - *nominaal elektrisch rendement:* quotiënt van het nominaal elektrisch vermogen en: a. de som van het nominaal
      elektrisch vermogen en nominaal warmtevermogen in het geval van gecombineerde opwekking met behulp van een
      verbrandingsmotor, en b. het nominaal warmtevermogen van de ketel in het geval van gecombineerde opwekking met
      behulp van een stoomturbine of een organische rankinecyclus;
        - *nominaal vermogen:* maximale vermogen van de productie-installatie dat onder nominale condities benut kan
      worden voor de productie van hernieuwbare elektriciteit of hernieuwbare warmte of hernieuwbaar gas en wat door de
      leverancier gegarandeerd wordt bij continu gebruik. In het geval van geothermische productie-installaties dient het
      nominaal vermogen te zijn bepaald met een waarschijnlijkheid van ten minste 50%;
        - *NTA 8003:* 2008: Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;
        - *hernieuwbare warmte:* nuttig aangewende warmte als bedoeld in
      __REF003___________________________________________________________________________________________________________
      ___________;
        - *richtlijn hernieuwbare energie:* [richtlijn nr. 2009/28/EG](32009L0028) van het Europees Parlement en de Raad
      van 23 april 2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van [Richtlijn 2001/77/EG](32001L0077) en [Richtlijn 2003/30/EG](32003L0030) (PbEU 2009, L 140);
        - *thermische conversie van vaste of vloeibare biomassa:* omzetting van vaste of vloeibare biomassa door middel
      van: a. verbranding; b. een andere thermische behandeling dan bedoeld onder a ingeval de producten daarvan
      vervolgens worden verbrand; of c. de verbranding van producten die voortkomen uit thermische behandeling;
        - *valhoogte:* verschil in waterpeil voor en achter de productie-installatie voor de productie van hernieuwbare
      elektriciteit door middel van waterkracht waarbij het nominaal vermogen wordt benut;
        - *vergistingen co-vergisting van dierlijke mest:* biologische afbraakreacties van in hoofdzaak vaste
      en vloeibare uitwerpselen van dieren, al dan niet aangevuld met een of meer producten genoemd in de
      [Uitvoeringsregeling Meststoffenwet][ref5], waarbij het restant na vergisting als meststof mag worden verhandeld;
        - *vergisting van uitsluitend dierlijke mest:* biologische afbraakreacties van vaste en vloeibare uitwerpselen
      van dieren;
        - *waterstaatswerk:* waterstaatswerk als bedoeld in appendix b bij
      [bijlage I van de Regeling veiligheid primaire waterkeringen 2017][ref6].


