  - number: '16'
    text: 'De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel16
  - number: 16.a
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting,
      waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel16
  - number: 16.b
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en co-
      vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel16
  - number: 16.c
    text: |-
      een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd door middel van vergisting van uitsluitend
      dierlijke mest, met een vermogen kleiner dan of gelijk aan 400 kW, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel16
  - number: '17.1'
    text: |-
      Subsidie als bedoeld in [artikel 16][ref1] wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel16
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '16'
        paragraaf: '3'
  - number: '17.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 16][ref1], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel16
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel17
