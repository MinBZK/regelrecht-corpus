    text: |-
      Productie-installaties als bedoeld in [artikel 14][ref1], worden aangewezen als productie-installaties als bedoeld
      in [artikel 15, derde, vierde en zesde lid, van het besluit][ref2] met dien verstande dat het verschil in kWh dat
      bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde lid, van
      het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking
      komt en dat bij de benutting van de opgetelde kWh, bedoeld in artikel 15, vierde lid van het besluit, geldt dat de
      productie wordt verdeeld in een deel netlevering en een deel niet-netlevering op basis van de verhouding tussen de
      geproduceerde energie die aan het net geleverd is en de energie die niet aan het net geleverd is in het voorgaande
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel15
