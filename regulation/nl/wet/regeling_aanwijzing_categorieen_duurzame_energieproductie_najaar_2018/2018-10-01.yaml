        artikel: '12'
        paragraaf: '3'
  - number: '14'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht uitsluitend door middel
      van fotovoltaïsche zonnepanelen, die is aangesloten op een elektriciteitsnet via een aansluiting met een totale
      maximale doorlaatwaarde van meer dan 3*80 A:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel14
  - number: 14.a
    text: met een totaal nominaal vermogen groter dan of gelijk aan 15 kWp en kleiner dan 1 MWp; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel14
  - number: 14.b
    text: met een totaal nominaal vermogen groter dan of gelijk aan 1 MWp.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel14
  - number: '15.1'
    text: |-
      Subsidie als bedoeld in [artikel 14][ref1] wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel14
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel15
