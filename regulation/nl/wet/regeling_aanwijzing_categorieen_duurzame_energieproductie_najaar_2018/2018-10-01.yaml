        paragraaf: '3'
  - number: '26'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte, hernieuwbare elektriciteit of
      hernieuwbare elektriciteit en hernieuwbare warmte geproduceerd door:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.a
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.b
    text: |-
      een productie-installatie waarmee hernieuwbare warmte wordt geproduceerd uitsluitend door middel van vergisting en
      co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.c
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van allesvergisting, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch
      rendement ten minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.d
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van vergisting en co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is en waarbij
      het nominaal elektrisch rendement ten minste 20% bedraagt;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.e
    text: |-
      een productie-installatie met een vermogen kleiner dan of gelijk aan 400 kW voor elektrisch en thermisch vermogen
      samen waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd door middel van vergisting van
      uitsluitend dierlijke mest, waarbij ten minste de vergister nieuw is en waarbij het nominaal elektrisch rendement
      ten minste 20% bedraagt; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: 26.f
    text: |-
      een productie-installatie met een vermogen kleiner dan of gelijk aan 400 kW waarmee hernieuwbare warmte wordt
      geproduceerd door middel van vergisting van uitsluitend dierlijke mest, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel26
  - number: '27.1'
    text: |-
      Subsidie als bedoeld in [artikel 26][ref1] wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel26
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '26'
        paragraaf: '3'
  - number: '27.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 26][ref1], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel26
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '26'
        paragraaf: '3'
  - number: '28.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte
      of hernieuwbare elektriciteit en hernieuwbare warmte uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel28
  - number: 28.1.a
    text: |-
      waarmee hernieuwbare warmte wordt geproduceerd, waarbij ten minste de installatie-onderdelen die verantwoordelijk
      zijn voor de meerproductie nieuw zijn; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel28
  - number: 28.1.b
    text: |-
      waarmee hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd, waarbij ten minste de installatie-
      onderdelen die verantwoordelijk zijn voor de meerproductie nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel28
  - number: '28.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de meerproductie, bedoeld in het eerste lid, worden niet in
      gebruik genomen voor de subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel28
  - number: '28.3'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel28
  - number: '29.1'
    text: |-
      Subsidie als bedoeld in [artikel 28, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel28
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel29
