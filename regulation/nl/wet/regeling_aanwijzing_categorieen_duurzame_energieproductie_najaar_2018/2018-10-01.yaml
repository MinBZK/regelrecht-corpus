  - number: '30.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare elektriciteit
      en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare warmte of
      hernieuwbare elektriciteit en hernieuwbare warmte met een nominaal thermisch vermogen groter dan of gelijk aan 0,5
      MW en een nominaal elektrisch vermogen kleiner dan of gelijk aan 100 MW voor de productie van warmte door middel
      van verbranding van vloeibare biomassa als bedoeld in de nummers 500, 550 tot en met 573, 587, 592, 594, 596 en 802
      van de NTA 8003: 2008 in een ketel.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel30
  - number: '30.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat wordt aangetoond
      dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel30
  - number: '31.1'
    text: |-
      Subsidie als bedoeld in [artikel 30, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


