        paragraaf: '3'
  - number: '25.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 24][ref1], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


