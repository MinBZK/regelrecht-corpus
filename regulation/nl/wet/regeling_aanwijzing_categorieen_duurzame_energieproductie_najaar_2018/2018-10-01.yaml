  - number: '8.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie, niet zijnde een
      productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie als bedoeld in de
      [artikelen 10][ref1] of [12][ref2], die wordt gerealiseerd op een locatie die overeenkomstig de lijst van gemeenten
      volgens de gemeentelijke indeling op 31 december 2017, bedoeld in [bijlage 2][ref3], een windsnelheid heeft van:


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041355#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0041355
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0041355
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0041355
  - number: 8.1.a
    text: ≥ 8,0 m/s;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: 8.1.b
    text: ≥ 7,5 en < 8,0 m/s;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: 8.1.c
    text: ≥ 7,0 en < 7,5 m/s; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: 8.1.d
    text: '< 7,0 m/s.'
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: '8.2'
    text: |-
      De productie-installatie voor de productie van hernieuwbare elektriciteit, bedoeld in het eerste lid, is niet
      opgericht in de territoriale zee of in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de productie-installatie voor de productie van hernieuwbare elektriciteit, bedoeld in het eerste lid,
      wordt opgericht op een locatie waar op het moment van aanvragen één of meer windturbines staan of hebben gestaan,
      verstrekt de Minister de subsidie, bedoeld in het eerste lid, uitsluitend indien:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: 8.3.a
    text: |-
      het nominaal en te realiseren vermogen per windturbine ten opzichte van de te vervangen windturbine ten minste 1 MW
      toeneemt; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: 8.3.b
    text: |-
      de te vervangen windturbine op het moment van vervanging 15 jaar op de desbetreffende locatie in gebruik is geweest
      en op het moment van aanvragen ten minste 13 jaar voordien in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel8
  - number: '9.1'
    text: |-
      Subsidie als bedoeld in [artikel 8, eerste lid][ref1], wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel8
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '8'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 8, eerste lid][ref1], binnen 4 jaar na de
      datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel8
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel9
