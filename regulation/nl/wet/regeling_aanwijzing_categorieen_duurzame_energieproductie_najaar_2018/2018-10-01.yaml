    text: |-
      Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas en hernieuwbare warmte op grond van de [artikelen 4][ref1], [6][ref2], [8, eerste lid][ref3],
      [10, eerste lid][ref4], [12, eerste lid][ref5], [14][ref6], [16][ref7], [18, eerste lid][ref8],
