        bwb_id: BWBR0041355
        artikel: '14'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 14, onderdeel a][ref1], binnen 18 maanden
      na de datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel14
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel15
    references:
