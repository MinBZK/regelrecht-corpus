  - number: '4'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie waarmee door middel van hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van
      de elektriciteitsproductie omhoog is gepompt:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel4
  - number: 4.a
    text: in installaties met een valhoogte kleiner dan 50 centimeter;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel4
  - number: 4.b
    text: in installaties met een valhoogte gelijk aan of groter dan 50 centimeter; of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel4
  - number: 4.c
    text: |-
      in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, die ingrijpend zijn gerenoveerd en
      waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel4
  - number: '5.1'
    text: |-
      Subsidie als bedoeld in [artikel 4][ref1] wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel4
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '4'
        paragraaf: '3'
  - number: '5.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 4][ref1], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel4
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '4'
        paragraaf: '3'
