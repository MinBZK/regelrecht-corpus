  - number: '2.2'
    text: De Minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel2
  - number: '2.3'
    text: |-
      Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een productie-
      installatie wordt geplaatst maximaal één aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel2
  - number: '2.4'
    text: |-
      De Minister beslist afwijzend op een aanvraag als bedoeld in het eerste lid, indien de toestemming van de
      eigenaar van de beoogde locatie, noch een gedoogplichtbeschikking op grond van [artikel 2, vijfde lid][ref1], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] ten aanzien van de beoogde locatie voor het
      plaatsen van de productie-installatie kan worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: '2.5'
    text: |-
      Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,– wordt verleend onder de opschortende
      voorwaarde dat binnen twee weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig
      de overeenkomst opgenomen in [bijlage 1][ref1] tot stand is gekomen tussen de Staat en de subsidieontvanger en
      onder de opschortende voorwaarde dat de subsidieontvanger binnen vier weken na afgifte van de beschikking heeft
      aangetoond dat een bankgarantie als bedoeld in artikel 2, eerste lid, van de uitvoeringsovereenkomst is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0041355
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0041355
  - number: '2.6'
    text: |-
      Het vijfde lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel9b
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 9b
  - number: '2.7'
    text: |-
      Indien voor dezelfde periode, of gedeeltelijk voor dezelfde periode, meer beschikkingen zijn afgegeven voor
      dezelfde productie-installatie en dezelfde soort hernieuwbare energie, worden voor de toepassing van het vijfde lid
      de subsidies die de subsidieontvanger ontvangt, bedoeld in [artikel 48 van het besluit][ref1], van de beschikkingen
      waarvan de periode waarover subsidie wordt verstrekt nog niet zijn aangevangen bij elkaar opgeteld.


