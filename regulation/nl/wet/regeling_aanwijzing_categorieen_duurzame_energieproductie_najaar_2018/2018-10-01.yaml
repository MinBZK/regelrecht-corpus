        artikel: '20'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie voor de productie van hernieuwbare warmte uit zonne-energie, waarbij uitsluitend gebruik
      wordt gemaakt van afgedekte collectoren waarbij de transparante isolerende laag, niet zijnde beglazing van kassen,
      een geïntegreerd geheel vormt met de collector, met een totaal thermisch vermogen:
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel22
  - number: 22.1.a
    text: groter dan of gelijk aan 140 kW en kleiner dan 1 MW, of
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel22
  - number: 22.1.b
    text: groter dan of gelijk aan 1 MW.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel22
  - number: '22.2'
    text: |-
      Het vermogen in kW van de productie-installatie, bedoeld in het eerste lid, wordt berekend door de
      apertuuroppervlakte in vierkante meter te vermenigvuldigen met een factor 0,7.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel22
  - number: '22.3'
    text: |-
      Subsidie als bedoeld in het eerste lid wordt niet verstrekt indien reeds op basis van
      [artikel 4.5.2. van de Regeling nationale EZ-subsidies][ref1] subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel4
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: '4'
  - number: '23.1'
    text: |-
      Subsidie als bedoeld in [artikel 22, eerste lid][ref1], wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel22
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '22'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 22, eerste lid][ref1], binnen 3 jaar na de
      datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel22
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '22'
        paragraaf: '3'
  - number: '24'
    text: 'De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:'
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel24
  - number: 24.a
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 500 meter;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel24
  - number: 24.b
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd,
      gebruikmakend van ten minste één olie- of gasput met een diepte van ten minste 500 meter;
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel24
  - number: 24.c
    text: |-
      een productie-installatie als bedoeld in de onderdelen a, of b, waarvoor op het moment van aanvragen reeds een
      subsidie is verleend op grond van het [besluit][ref1] die wordt uitgebreid met ten minste één aanvullende put met
      een diepte van ten minste 500 meter; of


      [ref1]: https://wetten.overheid.nl/BWBR0022735
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022735
  - number: 24.d
    text: |-
      een productie-installatie, bestaande uit één of meer doubletten, waarmee hernieuwbare warmte wordt geproduceerd
      uitsluitend door middel van één of meer geothermische bronnen met een diepte van ten minste 3.500 meter.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel24
  - number: '25.1'
    text: |-
      Subsidie als bedoeld in [artikel 24][ref1] wordt voor een periode van 15 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel24
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel25
    references:
