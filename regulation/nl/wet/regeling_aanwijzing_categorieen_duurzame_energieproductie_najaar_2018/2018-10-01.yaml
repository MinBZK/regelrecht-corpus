        artikel: '16'
        paragraaf: '3'
  - number: '18.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie voor de productie van hernieuwbaar gas uit biogas dat vrijkomt ten gevolge van een biologische
      afbraakreactie van gisting van zuiveringsslib waarbij er verbeteringen zijn uitgevoerd in het productieproces
      waarna er per ton slib sprake is van ten minste 25% meer biogasproductie ten opzichte van voor de verbetering en
      waarbij ten minste de installatiedelen die verantwoordelijk zijn voor de meerproductie van biogas nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel18
  - number: '18.2'
    text: |-
      De installatiedelen die verantwoordelijk zijn voor de meerproductie, bedoeld in het eerste lid, worden niet in
      gebruik genomen voor de subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel18
  - number: '18.3'
    text: |-
      De subsidieaanvrager maakt aannemelijk dat de voorgestelde aanpassingen een verbetering van 25% inhouden ten
      opzichte van de gemiddelde productie van het jaar voorafgaande aan de aanvraag, of, wanneer de producent minder dan
      een jaar produceert, ten opzichte van de totale gemiddelde productie tot het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel18
  - number: '19.1'
    text: |-
      Subsidie als bedoeld in [artikel 18, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel18
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '18'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 18, eerste lid][ref1], binnen 4 jaar na de
      datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel18
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '18'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      De Minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas, niet zijnde biosyngas,
      geproduceerd door een productie-installatie voor de productie van hernieuwbaar gas uit biomassa als bedoeld in de
      NTA 8003: 2008, door middel van vergassing.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel20
  - number: '20.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat ten minste 95% van
      de energetische waarde van de jaarlijks in de productie-installatie gebruikte brandstof biogeen is.
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel20
  - number: '21.1'
    text: |-
      Subsidie als bedoeld in [artikel 20, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel20
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0041355
        artikel: '20'
        paragraaf: '3'
  - number: '21.2'
    text: |-
      De subsidieontvanger neemt de productie-installatie, bedoeld in [artikel 20, eerste lid][ref1], binnen 4 jaar na de
      datum van inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0041355#Artikel20
    url: https://wetten.overheid.nl/BWBR0041355/2018-10-01#Artikel21
    references:
      - id: ref1
