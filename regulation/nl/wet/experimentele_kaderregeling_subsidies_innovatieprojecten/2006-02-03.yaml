preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken;

      b. innovatieproject: een samenhangend geheel van activiteiten, dat is gericht op innovatie voor Nederland en een
      bijdrage kan leveren aan duurzame economische groei in Nederland;

      c. ondernemer: natuurlijk persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;

      d. MKB-ondernemer: een ondernemer die een onderneming in stand houdt in de zin van [verordening (EG) nr. 364/2004]
      (32004R0364) van de Commissie van 25 februari 2004 (PbEG L 63) tot wijziging van [verordening (EG) nr. 70/2001]
      (32001R0070) van de Commissie betreffende de toepassing van de artikelen 87 en 88 van het EG-verdrag op staatssteun
      voor kleine en middelgrote ondernemingen;

      e. kennisinstelling:

      1°. een instelling voor hoger onderwijs genoemd onder [a of b van de bijlage van de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek](onbekend) en een academisch ziekenhuis genoemd onder [i van die bijlage](onbekend);

      2°. een andere dan onder 1° bedoelde onderzoeksinstelling zonder winstoogmerk die activiteiten verricht met als
      doel de algemene wetenschappelijke en technische kennis uit te breiden;

      f. groep: een economische eenheid, waarin organisatorisch zijn verbonden:

      1°. een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect:

        - meer dan de helft van het geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van of
        - overwegende zeggenschap heeft over

      een of meer rechtspersonen of vennootschappen, en

      2°. laatstbedoelde rechtspersonen of vennootschappen;

      g. innovatie-samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee
      niet in een groep verbonden partijen, dat is opgericht ten behoeve van de uitvoering van een innovatieproject;

      h. fundamenteel onderzoek: de uitbreiding van de algemene wetenschappelijke en technische kennis, zonder
      industriële of commerciële doelstellingen;

      i. industrieel onderzoek: onderzoek dat is gericht op het opdoen van nieuwe kennis met het doel deze te gebruiken
      bij de ontwikkeling van nieuwe producten, processen of diensten of om bestaande producten, processen of diensten
      aanmerkelijk te verbeteren;

      j. preconcurrentiële ontwikkeling: het omzetten van de resultaten van industrieel onderzoek in plannen, schema’s of
      ontwerpen voor nieuwe, gewijzigde of verbeterde producten, processen of diensten.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel1
  - number: '2'
    text: |-
      Bepalingen uit deze regeling kunnen van toepassing worden verklaard op subsidies die de minister verstrekt voor de
      uitvoering van een innovatieproject.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel2
  - number: '3'
    text: |-
      1 De subsidie bedraagt:

      a. 75 procent van de subsidiabele kosten, voor zover deze betrekking hebben op fundamenteel onderzoek;

      b. 50 procent van de subsidiabele kosten, voor zover deze betrekking hebben op industrieel onderzoek;

      c. 25 procent van de subsidiabele kosten, voor zover deze betrekking hebben op preconcurrentiële ontwikkeling.

      2 Indien de kosten betrekking hebben op een combinatie van de kosten, bedoeld in het eerste lid, dan bedraagt de
      subsidie het gewogen gemiddelde van deze percentages.

      3 De percentages, genoemd in het eerste lid, onder b en c, worden verhoogd met

      10 procentpunten, indien subsidie wordt verstrekt aan een MKB-ondernemer.

      4 Bij ministeriële regeling wordt een maximaal subsidiebedrag per innovatieproject bepaald.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel3
  - number: '4'
    text: |-
      1 Indien voor de subsidiabele kosten of een deel daarvan reeds door een bestuursorgaan subsidie is verstrekt, wordt
      slechts een zodanig bedrag aan subsidie verstrekt, dat het totale bedrag aan subsidie niet meer bedraagt dan de in
      [artikel 3, eerste tot en met derde lid][ref1], genoemde percentages van de subsidiabele kosten.

      2 Indien voor de subsidiabele kosten of een deel daarvan reeds door de Commissie van de Europese Gemeenschappen
      subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie vertrekt, dat het totale bedrag aan subsidie
      niet meer bedraagt dan de in [artikel 3, eerste lid][ref2], genoemde percentages van de subsidiabele kosten, met
      dien verstande dat de in [artikel 3, eerste lid][ref3], genoemde percentages worden verhoogd met 25 procentpunten.

      3 Indien voor de subsidiabele kosten of een deel daarvan reeds door een bestuursorgaan of door de Commissie van
      de Europese Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het
      totale bedrag aan subsidies niet meer bedraagt dan het bedrag, bedoeld in [artikel 3, vierde lid][ref4].

      4 Het eerste en het derde lid zijn niet van toepassing voor zover de in die leden bedoelde verstrekte subsidie
      geldmiddelen betreffen die een minister onder door hem gestelde voorschriften ter beschikking stelt als bijdrage in
      de exploitatie- en investeringskosten die een kennisinstelling maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019494#Artikel3
