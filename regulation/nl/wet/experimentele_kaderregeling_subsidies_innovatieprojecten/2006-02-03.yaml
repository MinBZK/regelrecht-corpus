  - number: '5'
    text: |-
      1 Als subsidiabele kosten van een innovatieproject worden uitsluitend in aanmerking genomen:

      a. het aantal na de indiening van de aanvraag door direct bij het innovatieproject betrokken personeel gemaakte
      uren, vermenigvuldigd met het in het tweede lid bedoelde integrale uurtarief dat de subsidie-ontvanger hanteert
      voor dat personeel, dan wel met het in het derde lid bedoelde tarief;

      b. de specifiek ten behoeve van het project gemaakte kosten voor zover deze niet zijn opgenomen in het integrale
      uurtarief.

      2 De subsidie-ontvanger berekent het integrale uurtarief op basis van een binnen zijn organisatie gebruikelijke en
      controleerbare methodiek, die is gebaseerd op bedrijfseconomisch en maatschappelijk aanvaardbare grondslagen. Het
      integrale uurtarief is samengesteld uit de directe personeelskosten en de indirecte kosten. Het integrale uurtarief
      betreft uitsluitend de kosten uit de gewone bedrijfsuitoefening en bevat geen winstopslag.

      3 Indien de subsidie-ontvanger geen integraal uurtarief hanteert, dan wordt op diens verzoek dit tarief vervangen
      door een vast uurtarief van € 35.

      4 De in het eerste lid, onder b, bedoelde kosten worden slechts in aanmerking genomen voor zover ze na de indiening
      van de aanvraag zijn gemaakt. Eventuele restwaarde van speciaal voor het project aangeschafte apparatuur wordt in
      mindering gebracht op de subsidiabele kosten.

      5 Winstopslagen bij transacties binnen een groep worden alleen in aanmerking genomen voor zover het gebruikelijk is
      die winstopslagen ook bij soortgelijke transacties buiten de groep in rekening te brengen.

      6 De kosten als bedoeld in het eerste lid, onder b, die vergoed kunnen worden op grond van dit artikel worden in
      aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de kosten heeft gemaakt de
      omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel5
  - number: '6'
    text: |-
      1 Ten behoeve van de beoordeling van aanvragen om subsidie voor innovatieprojecten kan een tijdelijke
      adviescommissie worden ingesteld.

      2 De commissie bestaat uit een voorzitter en ten minste vier andere leden. De leden zijn deskundig op het terrein
      waarop de commissie een taak heeft en zijn geen ambtenaren werkzaam bij het Ministerie van Economische Zaken.

      3 De voorzitter en de leden worden door de minister voor een termijn van ten hoogste vier jaar benoemd. Ze zijn te
      allen tijde opnieuw benoembaar.

      4 De commissie stelt haar werkwijze schriftelijk vast.

      5 Een lid van de commissie en een door de commissie ingeschakelde deskundige nemen niet deel aan de voorbereiding
      en vaststelling van een advies, indien zij een persoonlijk belang hebben bij de beschikking op de aanvraag.

      6 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      7 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.

      8 In het secretariaat van de commissie wordt door de minister voorzien.

      9 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      bewaard in het archief van dat ministerie.

      10 De commissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      11 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van de minister, maar ten minste elk vierde jaar, stelt de commissie tevens een evaluatieverslag op,
      waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en
      het evaluatieverslag worden aan de minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel6
  - number: '7'
    text: |-
      1 De aanvraag om subsidie wordt ingediend met gebruikmaking van het daartoe bij ministeriële regeling vastgestelde
      formulier.

      2 De aanvraag gaat vergezeld van een projectplan met vermelding van de belangrijke stappen, tussenresultaten en
      eindresultaten in het innovatieproject en een begroting van de kosten.

      3 Indien een aanvraag wordt ingediend door ondernemers die deel uitmaken van een maatschap, vennootschap onder
      firma of commanditaire vennootschap, wordt de aanvraag op naam van die onderneming ingediend en afgehandeld.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel7
  - number: '8'
    text: |-
      Ieder begrotingsjaar wordt bij ministeriële regeling een subsidieplafond vastgesteld voor het in dat jaar
      verlenen van subsidies. Daarbij kunnen afzonderlijke subsidieplafonds worden vastgesteld voor bepaalde categorieën
      aanvragers en voor bepaalde categorieën innovatieprojecten.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel8
  - number: '9'
    text: |-
      1 De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen. Indien een aanvrager
      niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing
      van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, dan
      geldt de dag waarop de aanvraag voldoet aan de wettelijke voorschriften als datum van ontvangst.

      2 Ingeval de minister op de dag dat het subsidieplafond wordt bereikt aanvragen gelijktijdig ontvangt, stelt hij de
      onderlinge rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '10'
    text: |-
      1 De minister stelt een beleidsregel vast voor de verdeling van de vouchers.

      2 Degenen die een voucher ontvangen, kunnen deze inleveren bij een derde.

      3 Indien deze derde aan de bij ministeriële regeling vastgestelde voorwaarden voldoet, geeft de voucher aan deze
      derde aanspraak op een subsidie.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel10
  - number: '11'
    text: De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel11
  - number: '12'
    text: |-
      Bij ministeriële regeling wordt een subsidieplafond vastgesteld voor het verlenen van subsidies op de in een
      vastgestelde periode ontvangen aanvragen. Daarbij kunnen afzonderlijke subsidieplafonds worden vastgesteld voor
      bepaalde categorieën aanvragers en voor bepaalde categorieën innovatieprojecten.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel12
  - number: '13'
    text: |-
      1 De minister rangschikt de aanvragen zodanig, dat een innovatieproject hoger gerangschikt wordt naar mate het meer
      voldoet aan de criteria op basis waarvan de onderlinge rangschikking wordt bepaald.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van de rangschikking.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel13
  - number: '14'
    text: |-
      De minister geeft een beschikking binnen dertien weken na de laatste dag van de voor de tender vastgestelde periode
      om aanvragen in te dienen.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel14
  - number: '15'
    text: |-
      De minister beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan de hiervoor geldende regelgeving;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen het innovatieproject kunnen financieren;

      c. het onaannemelijk wordt geacht, dat het innovatieproject binnen de bij ministeriële regeling vastgestelde
      termijn kan worden voltooid;

      d. aannemelijk is, dat het innovatieproject ook zonder de subsidie zonder belangrijke vertraging zou worden
      uitgevoerd;

      e. onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van het innovatieproject;

      f. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het innovatieproject naar behoren
      uit te voeren;

      g. van het innovatieproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn;
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel15
  - number: '16'
    text: |-
      1 Op een subsidie waarvoor een beschikking tot subsidieverlening geldt, kunnen op aanvraag van de subsidie-
      ontvanger door de minister voorschotten worden verstrekt.

      2 Een voorschot wordt berekend naar rato van de gemaakte en betaalde subsidiabele kosten, voor zover deze nog niet
      eerder bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal is het bedrag aan voorschotten
      niet groter dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.

      3 In afwijking van het eerste en tweede lid wordt het eerste voorschot ambtshalve

      verstrekt bij de subsidieverlening aan een MKB-ondernemer, met dien verstande dat dit voorschot 25 procent bedraagt
      van het bij de subsidieverlening voor de betreffende MKB-ondernemer vermelde maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel16
  - number: '17'
    text: |-
      1 Een verzoek om een voorschot wordt ingediend met gebruikmaking van het daartoe bij ministeriële regeling
      vastgestelde formulier en gaat vergezeld van de in dat formulier genoemde stukken.

      2 Bij het verzoek om voorschot wordt een overzicht gevoegd van de in de betreffende periode gemaakte en betaalde
      subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel17
  - number: '18'
    text: |-
      De minister beschikt afwijzend op een aanvraag om een voorschot, indien de subsidie-ontvanger niet heeft voldaan
      aan ingevolge de subsidieverlening voor hem geldende verplichtingen, indien hij failliet is verklaard of aan hem
      surséance van betaling is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel18
  - number: '19'
    text: |-
      1 De aanvraag om subsidievaststelling wordt ingediend binnen dertien weken na het tijdstip waarop het
      innovatieproject overeenkomstig de beschikking tot subsidieverlening, dan wel overeenkomstig de ontheffing van het
      voltooien op het bij subsidieverlening bepaalde tijdstip, moet zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van het daartoe bij ministeriële regeling vastgestelde formulier en
      gaat vergezeld van de in dat formulier genoemde stukken.

      3 Bij de aanvraag wordt een eindverslag omtrent de uitvoering en de resultaten van het innovatieproject gevoegd en
      een financiële verantwoording.

      4 Indien het bedrag waarop de subsidie ten hoogste kan worden vastgesteld € 50.000 of meer bedraagt, wordt bij
      de aanvraag om subsidievaststelling een accountantsverklaring gevoegd die is opgesteld op de in het formulier
      aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel19
  - number: '20'
    text: |-
      De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel20
  - number: '21'
    text: |-
      Indien sprake is van een innovatie-samenwerkingsverband, wijst dit samenwerkingsverband één deelnemer aan als
      penvoerder.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel21
  - number: '22'
    text: |-
      Indien subsidie wordt verstrekt voor een innovatieproject dat wordt uitgevoerd door een innovatie-
      samenwerkingsverband, vermeldt de beschikking tot subsidieverlening een raming van de subsidiabele kosten per
      deelnemer in het innovatie-samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel22
  - number: '23'
    text: |-
      Indien de subsidie-ontvangers in een innovatie-samenwerkingsverband verplicht zijn tot terugbetaling van de
      subsidie, is elke deelnemer in het innovatie-samenwerkingsverband tot ten hoogste het naar rato van de voor hem
      geraamde subsidiabele kosten aansprakelijk voor terugbetaling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel23
  - number: '24'
    text: |-
      1 Indien ontheffing is verleend op basis van [artikel 28, derde lid][ref1], kan de minister op aanvraag van de
      subsidie-ontvanger het bedrag van een eerder voor een innovatieproject verleende subsidie verhogen tot maximaal het
      bedrag dat voor dat innovatieproject kan worden verkregen.

      2 De aanvraag, bedoeld in het eerste lid, wordt volgens eenzelfde procedure en volgens dezelfde criteria behandeld
      als een eerste aanvraag om subsidie voor een innovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0019494#Artikel28
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019494
        artikel: '28'
        hoofdstuk: '5'
  - number: '25'
    text: |-
      1 Op een subsidie in de vorm van een krediet waarvoor een beschikking tot subsidieverlening geldt, kunnen op
      aanvraag van de subsidie-ontvanger door de minister voorschotten worden verstrekt.

      2 Het eerste voorschot wordt ambtshalve verstrekt bij de beschikking tot subsidieverlening. Dit voorschot wordt
      verstrekt naar rato van de begrote subsidiabele kosten tot de eerste tussenrapportage, maar bedraagt ten hoogste 50
      procent van het bij de subsidieverlening vermelde subsidiebedrag.

      3 De volgende voorschotten worden verstrekt naar rato van de begrote subsidiabele kosten voor de periode tot de
      volgende rapportage, waarbij rekening wordt gehouden met eerdere voorschotten en eerdere gemaakte en betaalde
      subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel25
  - number: '26'
    text: |-
      1 Een aanvraag om volgende voorschotten wordt ingediend gelijktijdig met het uitbrengen van een tussenrapportage.

      2 De aanvraag wordt ingediend met gebruikmaking van het daartoe bij ministeriële regeling vastgestelde formulier en
      gaat vergezeld van de in het formulier genoemde stukken.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel26
  - number: '27'
    text: |-
      1 De minister verbindt aan de subsidie in de vorm van garantie de opschortende voorwaarde dat een bij ministeriële
      regeling bepaalde gebeurtenis zich voordoet.

      2 Indien de subsidie-ontvanger niet binnen een bij ministeriële regeling bepaalde termijn aantoont dat aan de
      voorwaarde is voldaan, is sprake van een afwijzingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel27
  - number: '28'
    text: |-
      1 De subsidie-ontvanger voert het innovatieproject uit overeenkomstig het projectplan waarop de beschikking tot
      subsidieverlening betrekking heeft en voltooit het uiterlijk op het bij de subsidieverlening bepaalde tijdstip.

      2 De verplichting, bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      3 De minister kan voor het vertragen, het essentieel wijzigen of het stopzetten van het innovatieproject op
      voorafgaand verzoek van de subsidie-ontvanger schriftelijk ontheffing verlenen van de verplichting, bedoeld in het
      eerste lid. Aan die ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel28
  - number: '29'
    text: |-
      1 De subsidie-ontvanger voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze is af te leiden:

      a. de aard, inhoud en voortgang van de verrichte werkzaamheden;

      b. het aantal uren dat per werknemer is besteed aan het innovatieproject;

      c. de berekening en samenstelling van het integrale uurtarief en de specifiek ten behoeve van het project gemaakte
      en betaalde kosten voor zover deze niet zijn opgenomen in het integrale uurtarief.

      2 De verplichting, bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      3 De administratie wordt tot 5 jaar na vaststelling van de subsidie bewaard.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel29
  - number: '30'
    text: |-
      1 Indien de periode van uitvoering van een innovatieproject blijkens het projectplan meer dan 18 maanden in beslag
      neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van één of meer
      tussenrapportages. Deze verplichting geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      2 Op grond van een tussenrapportage kan de minister besluiten de beschikking tot subsidieverlening ten nadele van
      de subsidie-ontvanger te wijzigen en vervolgens de subsidie ambtshalve vast te stellen indien:

      a. het innovatieproject niet, of met aanzienlijke vertraging, zal worden voltooid, of

      b. het resultaat van het innovatieproject naar verwachting niet, of in hoge mate niet meer zal voldoen aan hetgeen
      met het innovatieproject werd beoogd op het moment van de subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel30
  - number: '31'
    text: |-
      1 De subsidie-ontvanger doet onverwijld mededeling aan de minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.

      2 De verplichting, bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel31
  - number: '32'
    text: |-
      1 De subsidie-ontvanger verleent medewerking aan een evaluatie van de effecten van het door hem uitgevoerde
      innovatieproject, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.

      2 De verplichting, bedoeld in het eerste lid, geldt gedurende 5 jaren na de dag waarop subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel32
  - number: '33'
    text: |-
      1 De subsidie-ontvanger draagt zorg voor een verantwoord gebruik van de uit het innovatieproject voortvloeiende
      resultaten, waaronder mede begrepen intellectueel eigendom, die zijn opgedaan uit hoofde van het innovatieproject.

      2 De subsidie-ontvanger draagt zorg voor de exploitatie van resultaten overeenkomstig de subsidieaanvraag.

      3 De subsidie-ontvanger draagt zorg voor de bescherming van octrooieerbare kennis.

      4 Indien kennis en andere resultaten aan derden worden overgedragen, dan vindt dit plaats op basis van
      marktconforme voorwaarden.

      5 De verplichtingen, bedoeld in het eerste lid tot en met het vierde lid, gelden gedurende 5 jaren na de dag waarop
      subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel33
  - number: '34'
    text: De minister kan bij de subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel34
  - number: '35'
    text: |-
      1 De subsidie-ontvanger betaalt de verstrekte subsidie terug aan de minister.

      2 Bij de beschikking tot subsidieverlening bepaalt de minister wanneer uiterlijk welk deel van de verstrekte
      subsidie wordt terugbetaald.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel35
  - number: '36'
    text: |-
      1 De subsidie-ontvanger kan de minister totdat een aanvraag tot subsidievaststelling is ingediend, verzoeken om
      ontheffing te verlenen van de verplichting de verstrekte subsidie terug te betalen.

      2 De ontheffing, bedoeld in het eerste lid, kan worden verleend indien een ontheffing is verleend voor het
      vertragen, essentieel wijzigen of stopzetten van het innovatieproject in verband met onoverkomelijke problemen of
      het verloren gaan van het marktperspectief.

      3 De subsidie-ontvanger kan de minister nadat een aanvraag tot subsidievaststelling is ingediend verzoeken om
      ontheffing te verlenen van de verplichting de verstrekte subsidie terug te betalen of terug te betalen volgens het
      bij de beschikking tot subsidieverlening vastgelegde schema.

      4 De ontheffing, bedoeld in het derde lid, kan worden verleend indien de verplichting tot terugbetaling leidt tot
      zodanige financiële problemen voor de subsidie-ontvanger dat het voortbestaan van zijn onderneming in gevaar komt.

      5 Aan de ontheffingen, bedoeld in het eerste en derde lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel36
  - number: '37'
    text: |-
      Bij de subsidieverlening wordt de verplichting opgelegd tot indiening van één of meer tussenrapportages over
      de uitvoering van het project, met inbegrip van een vergelijking van die uitvoering met het projectplan en de
      gerealiseerde kosten ten opzichte van de bij de subsidieverlening vermelde begroting.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel37
  - number: '38'
    text: |-
      1 De minister kan bij de subsidieverlening nadere verplichtingen opleggen.

      2 De verplichtingen, bedoeld in het eerste lid, kunnen in ieder geval betrekking hebben op de zekerheidsstelling
      voor de terugbetaling van de verstrekte subsidie.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel38
  - number: '39'
    text: Deze regeling treedt in werking op de tweede dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel39
  - number: '40'
    text: 'Deze regeling wordt aangehaald als: Experimentele kaderregeling subsidies innovatieprojecten.'
    url: https://wetten.overheid.nl/BWBR0019494/2006-02-03#Artikel40
