  - number: '3'
    text: |-
      De vakbekwaamheidseisen, bedoeld in [artikel 2, tweede lid][ref1], van het besluit omvatten ten aanzien van
      taxateurs van andere onroerende zaken dan woningen kennis en vaardigheden op de in de onderdelen a, b en c
      omschreven terreinen.

      a. Algemene taxatietechnische kennis:

        - grondige kennis van de rechten die op een onroerende zaak kunnen rusten;
        - grondige kennis van de kadastrale registratie van onroerende zaken en de wijze waarop de kadastrale
      identificaties worden toegekend door het Kadaster;
        - grondige kennis van de omstandigheden die van belang zijn bij de totstandkoming van een transactie en de
      transactieprijs;
        - grondige kennis van de markt voor commercieel gebruikte onroerende zaken, zoals winkels, kantoren en
      bedrijfsruimten;
        - grondige kennis van de beschikbare methoden voor de waardebepaling van niet-woningen, met name
      de kapitalisatiemethode, vergelijkingsmethode, discounted-cash-flow-berekening en de gecorrigeerde-
      vervangingswaardeberekening;
        - grondige kennis van de noodzakelijke inhoud van een taxatieverslag voor een niet-woning;
        - kennis van de economische factoren die van belang zijn voor de waarde van niet-woningen;
        - kennis van de kenmerken die de bouwkundige kwaliteit van een niet-woning beïnvloeden en van de instrumenten om
      deze kenmerken te beoordelen;
        - grondige kennis van de invloed van de bouwkundige kwaliteit op de waarde van een niet-woning.

      b. Praktijkvaardigheden taxeren onroerende zaken:

        - het kunnen bepalen van de waarde in het economische verkeer van een niet-woning;
        - het kunnen beoordelen of de prijs bedongen bij een verkooptransactie of een verhuurtransactie een redelijke
      indicatie geeft van de marktwaarde van de niet-woning;
        - het kunnen beoordelen welke objectgegevens relevant zijn voor de bepaling en de onderbouwing van de waarde van de
      niet-woning;
        - het aan de hand van marktgegevens met betrekking tot verkoop-, verhuur- en investeringsbeslissingen kunnen
      bepalen van een verschil in marktwaarde tussen twee vergelijkbare objecten;
        - het kunnen opstellen van een volledige onderbouwing van een taxatie van een niet-woning;
        - het kunnen beoordelen van de bouwkundige kwaliteit van een object en het kunnen aangeven welke invloed dit heeft
      op de waarde.

      c. Specifieke kennis en vaardigheden [Wet waardering onroerende zaken][ref2]:

        - grondige kennis van de regels van de wet en de daarop berustende regelingen met betrekking tot de afbakening van
      een onroerende zaak alsmede van de jurisprudentie ter zake;
        - grondige kennis van de regels van de wet en de daarop berustende regelingen met betrekking tot de waardebepaling
      en de onderbouwing van de waarde alsmede van de jurisprudentie ter zake;
        - kennis van de procedures voor de behandeling van bezwaarschriften en beroepschriften in het kader van de wet;
        - het kunnen interpreteren van jurisprudentie en het kunnen vertalen van deze jurisprudentie naar de waardebepaling
      van niet-woningen in concrete situaties;
        - het volgens de regels van de wet en de daarop berustende regelingen kunnen afbakenen van een onroerende zaak in
      het kader van de wet;
        - het kunnen toepassen van de jurisprudentie met betrekking tot het afbakenen van een onroerende zaak in het kader
      van de wet;
        - het kunnen identificeren van een onroerende zaak in het kader van de wet aan de hand van de kadastrale aanduiding
      en de kadastrale oppervlakten;
        - het kunnen bepalen van de vier elementen van een gecorrigeerde-vervangingswaardeberekening overeenkomstig de
      regelingen op basis van de wet;
        - het kunnen vergelijken van de gecorrigeerde vervangingswaarde met marktgegevens en het kunnen beoordelen welk
      waarderingsvoorschrift bepalend is voor de vast te stellen waarde in het kader van de wet;
        - het kunnen toepassen van bijzondere waarderingsvoorschriften;
        - het kunnen toepassen van een marktgegevens;
        - het kunnen beschrijven van de kwaliteit van de verrichte werkzaamheden en het hierover kunnen rapporteren aan het
      college van burgemeester en wethouders en aan de Waarderingskamer;
        - het ervoor kunnen zorgdragen dat alle elementen van het taxatieproces en alle categorieën niet-woningen op enige
      wijze onderworpen zijn aan een kwaliteitscontrole;
        - het mede op basis van marktgegevens kunnen onderbouwen van de waardebepaling ten behoeve van een belanghebbende
      en eventueel ten behoeve van de rechter in belastingzaken.


