  - number: '2'
    text: |-
      De vakbekwaamheidseisen, bedoeld in [artikel 2, tweede lid][ref1], van het besluit omvatten ten aanzien van
      taxateurs van woningen kennis en vaardigheden op de in de onderdelen a, b en c omschreven terreinen.

      a. Algemene taxatietechnische kennis:

        - grondige kennis van de rechten die op een woning kunnen rusten;
        - grondige kennis van de kadastrale registratie van onroerende zaken en de wijze waarop de kadastrale
      identificaties worden toegekend door het Kadaster;
        - grondige kennis van de omstandigheden die van belang zijn bij de totstandkoming van een transactie en de
      transactieprijs;
        - grondige kennis van de methode voor de waardebepaling van woningen;
        - grondige kennis van de noodzakelijke inhoud van een taxatieverslag voor een woning;
        - kennis van de economische factoren die van belang zijn voor de woningmarkt;
        - kennis van de kenmerken die van belang zijn voor de beoordeling van de verschillen tussen twee woningen die
      mogelijk leiden tot een verschil in marktwaarde;
        - kennis van de kenmerken die de bouwkundige kwaliteit van een woning beïnvloeden en van de instrumenten om deze
      kenmerken te beoordelen;
        - grondige kennis van de invloed van de bouwkundige kwaliteit op de waarde van een woning.

      b. Praktijkvaardigheden taxeren onroerende zaken:

        - het kunnen bepalen van de waarde van een woning;
        - het kunnen beoordelen of de prijs bedongen bij een transactie een redelijke indicatie geeft van de marktwaarde
      van een woning;
        - het kunnen beoordelen welke objectgegevens relevant zijn voor de bepaling en de onderbouwing van de waarde van
      een woning;
        - het kunnen bepalen van een verschil in marktwaarde tussen twee woningen;
        - het kunnen opstellen van een volledige onderbouwing van een taxatie van een woning;
        - het kunnen beoordelen van de bouwkundige kwaliteit van een woning en het kunnen aangeven welke invloed die heeft
      op de waarde.

      c. Specifieke kennis en vaardigheden [Wet waardering onroerende zaken][ref2]:

        - grondige kennis van de regels van de wet en de daarop berustende regelingen met betrekking tot de afbakening van
      een onroerende zaak alsmede van de jurisprudentie ter zake;
        - grondige kennis van de regels van de wet en de daarop berustende regelingen met betrekking tot de waardebepaling
      en de onderbouwing van de waarde alsmede van de jurisprudentie ter zake;
        - kennis van de procedures voor de behandeling van bezwaarschriften en beroepschriften in het kader van de wet;
        - het kunnen interpreteren van jurisprudentie en het kunnen toepassen van deze jurisprudentie bij de waardebepaling
      van woningen in concrete situaties;
        - het volgens de regels van de wet en de daarop berustende regelingen kunnen afbakenen van een onroerende zaak in
      het kader van de wet;
        - het kunnen toepassen van de jurisprudentie met betrekking tot het afbakenen van een onroerende zaak in het kader
      van de wet;
        - het kunnen identificeren van een onroerende zaak in het kader van de wet aan de hand van de kadastrale aanduiding
      en de kadastrale oppervlakten;
        - het kunnen toepassen van marktgegevens;
        - het kunnen organiseren van de eigen taxaties in een massaal waarderingsproces;
        - het kunnen beoordelen welke objectgegevens gebruikt moeten worden bij de bepaling en de onderbouwing van de
      vastgestelde waarde bij de uitvoering van een massaal waarderingsproces, waarbij mogelijk gebruik gemaakt wordt van
      geautomatiseerde taxatie-ondersteuning;
        - het kunnen beschrijven van de kwaliteit van de verrichte werkzaamheden en het hierover kunnen rapporteren aan het
      college van burgemeester en wethouders en aan de Waarderingskamer;
        - het ervoor kunnen zorgdragen dat alle elementen van het taxatieproces en alle categorieën woningen op enige wijze
      onderworpen zijn aan een kwaliteitscontrole;
        - het mede op basis van marktgegevens kunnen onderbouwen van de waardebepaling ten behoeve van een belanghebbende
      en eventueel ten behoeve van de rechter in belastingzaken.


