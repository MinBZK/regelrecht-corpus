      - id: ref3
        bwb_id: BWBR0005416
        artikel: '185'
        hoofdstuk: XIa
  - number: 81oa.3
    text: |-
      Op personen die de rekenkamerfunctie uitoefenen, is [artikel 81f, behoudens het eerste lid, onder k en q][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81f
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81oa
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81f
        hoofdstuk: IVa
        paragraaf: '1'
  - number: 81p.1
    text: |-
      Met inachtneming van het bepaalde in dit hoofdstuk kan de raad de behandeling van verzoekschriften als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1], opdragen aan een gemeentelijke ombudsman of
      ombudscommissie, dan wel een gezamenlijke ombudsman of ombudscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81p
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 81p.2
    text: |-
      Een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien de raad hiertoe besluit, zendt hij het besluit tot instelling aan de Nationale ombudsman voor 1
      juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81p
  - number: 81p.3
    text: |-
      De instelling van een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig
      jaar worden beëindigd. Indien de raad hiertoe besluit, zendt hij het besluit tot beëindiging van de instelling aan
      de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling eindigt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81p
  - number: 81q.1
    text: |-
      Indien de raad de behandeling van verzoekschriften opdraagt aan een gemeentelijke ombudsman, benoemt hij deze voor
      de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.2
    text: |-
      De raad benoemt een plaatsvervangend ombudsman. Deze paragraaf is op de plaatsvervangend ombudsman van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3
    text: 'De ombudsman wordt door de raad ontslagen:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3.b
    text: wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 81r, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81r
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81r
        hoofdstuk: IVc
        paragraaf: '2'
  - number: 81q.3.d
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3.e
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.3.f
    text: indien hij naar het oordeel van de raad ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.4
    text: 'De raad stelt de ombudsman op non-activiteit indien hij:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.4.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.4.b
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81q.4.c
    text: |-
      onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft verkregen of wegens schulden is
      gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81q
  - number: 81r.1
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81r
  - number: 81r.2
    text: |-
      [Artikel 12][ref1] is van overeenkomstige toepassing op de ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel12
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81r
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '12'
        hoofdstuk: II
  - number: 81s.1
    text: |-
      Alvorens zijn functie te kunnen uitoefenen, legt de ombudsman in de vergadering van de raad, in handen van de
      voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot ombudsman benoemd te
      worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven
      of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch
      middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (verklaar en beloof) dat ik
      getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als ombudsman naar
      eer en geweten zal vervullen. Zo waarlijk helpe mij God almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81s
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 81s.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta ombudsman beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten
      haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik
      hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan
      'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as ombudsman yn alle oprjochtens ferfolje
      sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81s
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 81t.1
    text: |-
      Op voordracht van de ombudsman benoemt het college het personeel van de ombudsman dat nodig is voor een goede
      uitoefening van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81t
  - number: 81t.2
    text: |-
      De ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het algemeen,
      noch voor een enkel geval.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81t
  - number: 81t.3
    text: |-
      Het personeel van de ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens gedraging de
      ombudsman een onderzoek kan instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81t
  - number: 81t.4
    text: |-
      Het personeel van de ombudsman is ter zake van de werkzaamheden die het voor de ombudsman verricht, uitsluitend aan
      hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81t
  - number: 81u
    text: De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81u
  - number: 81v
    text: |-
      De ombudsman ontvangt een bij verordening van de raad vastgestelde vergoeding voor zijn werkzaamheden en een
      tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81v
  - number: 81w.1
    text: |-
      Indien de raad de behandeling van verzoekschriften opdraagt aan een gemeentelijke ombudscommissie, stelt de raad
      het aantal leden van de ombudscommissie vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81w
  - number: 81w.2
    text: De raad benoemt de leden van de ombudscommissie voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81w
  - number: 81w.3
    text: De raad benoemt uit de leden de voorzitter en de plaatsvervangend voorzitter van de ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81w
  - number: 81x.1
    text: De ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81x
  - number: 81x.2
    text: |-
      Op de ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 81q, derde en vierde lid][ref1], [81r][ref2],
      [81s][ref3], [81t][ref4] en [81v][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81q
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81r
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel81s
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel81t
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel81v
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81x
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81q
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81r
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 81s
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 81t
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: 81v
        hoofdstuk: IVc
        paragraaf: '2'
  - number: 81y.1
    text: |-
      De raad kan voor de behandeling van verzoekschriften een gezamenlijke ombudsman of een gezamenlijke ombudscommissie
      instellen met de raad of raden van een of meer andere gemeenten, dan wel met provinciale staten van een of meer
      provincies, dan wel met het algemeen bestuur van een of meer waterschappen, dan wel met het algemeen bestuur van
      een of meer openbare lichamen of gemeenschappelijke organen ingesteld bij gemeenschappelijke regeling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81y
  - number: 81y.2
    text: |-
      De ombudsman of de ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de vertegenwoordigende
      organen van de deelnemende rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81y
  - number: 81y.3
    text: |-
      Op de ombudsman en op ieder afzonderlijk lid van de ombudscommissie zijn de [artikelen 81q tot en met 81t][ref1],
      [81v][ref2] en [81w][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81q
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81v
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel81w
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81y
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81q
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81v
        hoofdstuk: IVc
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 81w
        hoofdstuk: IVc
        paragraaf: '3'
  - number: 81z
    text: |-
      Indien de raad een ombudsman of een ombudscommissie instelt met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], zijn de in die wet ten aanzien van gemeenschappelijke organen opgenomen
      bepalingen slechts van toepassing voor zover de aard van de aan de ombudsman of de ombudscommissie opgedragen taken
      zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81z
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '82.1'
    text: |-
      De raad kan raadscommissies instellen die besluitvorming van de raad kunnen voorbereiden en met het college
      of de burgemeester kunnen overleggen. Hij regelt daarbij de taken, de bevoegdheden, de samenstelling en de
      werkwijze, daaronder begrepen de wijze waarop de leden van de raad inzage hebben in stukken waaromtrent door een
      raadscommissie geheimhouding is opgelegd. Deze inzage kan slechts worden geweigerd voor zover zij in strijd is met
      het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel82
  - number: '82.2'
    text: De burgemeester en de wethouders zijn geen lid van een raadscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel82
  - number: '82.3'
    text: |-
      Bij de samenstelling van een raadscommissie zorgt de raad, voor zover het de benoeming betreft van leden van de
      raad, voor een evenwichtige vertegenwoordiging van de in de raad vertegenwoordigde groeperingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel82
  - number: '82.4'
    text: Een lid van de raad is voorzitter van een raadscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel82
  - number: '82.5'
    text: |-
      De [artikelen 19][ref1] en [21 tot en met 23][ref2] zijn van overeenkomstige toepassing op een vergadering van
      een raadscommissie, met dien verstande dat in artikel 19 voor «burgemeester» wordt gelezen «voorzitter van de
      raadscommissie» en in [artikel 23, vijfde lid][ref3], voor «[artikel 25][ref4]» wordt gelezen «[artikel 86][ref5]».


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '21'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '23'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '25'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: '83.1'
    text: |-
      De raad, het college of de burgemeester kan bestuurscommissies instellen die bevoegdheden uitoefenen die hun
      door de raad, het college, onderscheidenlijk de burgemeester zijn overgedragen. Hij regelt daarbij de taken, de
      bevoegdheden, de samenstelling en de werkwijze, daaronder begrepen de wijze waarop hij inzage heeft in de stukken
      waaromtrent door een bestuurscommissie geheimhouding is opgelegd. Deze inzage kan slechts worden geweigerd voor
      zover zij in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel83
  - number: '83.2'
    text: |-
      De burgemeester en de wethouders zijn geen lid van een door de raad ingestelde bestuurscommissie. Leden van de raad
      zijn geen lid van een door het college of de burgemeester ingestelde bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel83
  - number: '83.3'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      tot instelling van een bestuurscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '83.4'
    text: |-
      De [artikelen 19, tweede lid][ref1], [22][ref2] en [23, eerste tot en met vierde lid][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de vergadering van een door de raad ingestelde bestuurscommissie, met
      dien verstande dat in [artikel 19, tweede lid][ref4], voor «de burgemeester» wordt gelezen: de voorzitter van een
      bestuurscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '22'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '23'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
  - number: '83.5'
    text: |-
      Voor zover zulks in verband met de aard en omvang van de overgedragen bevoegdheden nodig is, regelt het college of
      de burgemeester de openbaarheid van vergaderingen van een door hem ingestelde bestuurscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel83
  - number: '84.1'
    text: |-
      De raad, het college of de burgemeester kan andere commissies dan bedoeld in de [artikelen 82, eerste lid][ref1],
      en [83, eerste lid][ref2], instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel83
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '83'
        hoofdstuk: V
        paragraaf: '1'
  - number: '84.2'
    text: |-
      [Artikel 83, tweede lid][ref1], is van overeenkomstige toepassing op een andere commissie, met uitzondering van
      een commissie die is ingesteld om te adviseren over de beslissing op ingediende bezwaarschriften en een commissie
      belast met de behandeling van en de advisering over klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel83
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '83'
        hoofdstuk: V
        paragraaf: '1'
  - number: '84.3'
    text: |-
      De raad, het college onderscheidenlijk de burgemeester regelt ten aanzien van een door hem ingestelde andere
      commissie de openbaarheid van de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel84
  - number: '84.4'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      tot instelling van een andere commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '85.1'
    text: |-
      De raad, het college of de burgemeester regelt ten aanzien van een door hem ingestelde bestuurscommissie de
      verantwoording aan de raad, het college, onderscheidenlijk de burgemeester.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel85
  - number: '85.2'
    text: |-
      De raad, het college of de burgemeester kan besluiten en andere, niet-schriftelijke beslissingen gericht op enig
      rechtsgevolg van een door hem ingestelde bestuurscommissie vernietigen. De raad kan zijn bevoegdheid tot schorsing
      overdragen aan het college. Ten aanzien van de vernietiging van niet-schriftelijke beslissingen gericht op enig
      rechtsgevolg zijn de [afdelingen 10.2.2.](onbekend) en [10.2.3. van de Algemene wet bestuursrecht](onbekend) van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel85
  - number: '85.3'
    text: |-
      Voor zover zulks in verband met de aard en de omvang van de overgedragen bevoegdheden nodig is, regelt
      de raad, het college of de burgemeester het overige toezicht op de uitoefening van de bevoegdheden door
      een door hem ingestelde bestuurscommissie. Dit overige toezicht kan mede de goedkeuring omvatten van de
      beslissingen van een bestuurscommissie. De goedkeuring kan slechts worden onthouden wegens strijd met
      het recht of het algemeen belang. Ten aanzien van de goedkeuring van andere beslissingen dan besluiten is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '86.1'
    text: |-
      Een commissie kan in een besloten vergadering, op grond van een belang, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], omtrent het in die vergadering met gesloten deuren
      behandelde en omtrent de inhoud van de stukken die aan de commissie worden overgelegd, geheimhouding opleggen.
      Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De
      geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van het behandelde of de stukken
      kennis dragen, in acht genomen totdat de commissie haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '86.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door de voorzitter van een commissie, het college en de burgemeester, ieder ten aanzien
      van stukken die hij aan een commissie overlegt. Daarvan wordt op de stukken melding gemaakt. De geheimhouding wordt
      in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel de raad haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '86.3'
    text: |-
      Indien een commissie zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot de raad
      heeft gericht, wordt de geheimhouding in acht genomen totdat de raad haar opheft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel86
  - number: '87.1'
    text: De raad, het college en de burgemeester kunnen gezamenlijk één of meer deelgemeenten instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
  - number: '87.2'
    text: |-
      De raad, het college en de burgemeester kunnen gezamenlijk bij verordening voor een deelgemeente een
      deelgemeentebestuur instellen, bestaande uit een deelraad en een dagelijks bestuur, waaraan de behartiging van
      een aanzienlijk deel van de belangen van deze deelgemeente wordt opgedragen, en waarbij de raad aan de deelraad de
      bevoegdheid tot het vaststellen van algemeen verbindende voorschriften ten aanzien van die deelgemeente geheel of
      gedeeltelijk overdraagt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
  - number: '87.3'
    text: |-
      In de verordening worden bevoegdheden van de raad ten aanzien van de deelgemeente uitsluitend overgedragen aan
      de deelraad en worden bevoegdheden van het college ten aanzien van de deelgemeente uitsluitend overgedragen aan
      het dagelijks bestuur. Bevoegdheden van de burgemeester ten aanzien van een deelgemeente kunnen in de verordening
      uitsluitend worden overgedragen aan de voorzitter van het dagelijks bestuur. In de verordening kan worden bepaald
      dat de deelraad aan hem toegekende bevoegdheden kan overdragen aan het dagelijks bestuur van de deelgemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
  - number: '87.4'
    text: |-
      In de verordening kan worden bepaald dat het dagelijks bestuur van een deelgemeente bevoegd is de uitoefening van
      een of meer aan hem overgedragen bevoegdheden uit naam en onder verantwoordelijkheid van dit bestuur op te dragen
      aan een of meer leden van dit bestuur, tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
  - number: '87.5'
    text: |-
      De leden van de deelraad worden rechtstreeks gekozen door de ingezetenen van de betrokken deelgemeente die
      kiesgerechtigd zijn voor de verkiezing van de leden van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
  - number: '87.6'
    text: |-
      In de verordening wordt de verkiezing van de leden van de deelraad zoveel mogelijk geregeld overeenkomstig
      de bepalingen van de [Kieswet][ref1] voor de verkiezing van de leden van de gemeenteraad. De
      [artikelen Z 1 tot en met Z 11 van de Kieswet][ref2] zijn op de verkiezing van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
  - number: '87.7'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op de
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87
    references:
      - id: ref1
