  - number: '236.2'
    text: |-
      Op een bezwaarschrift dat niet is ingediend in de laatste zes weken van een kalenderjaar, doet
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2], uitspraak in het kalenderjaar waarin het
      bezwaarschrift is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '237.1'
    text: |-
      Het uitnodigen tot het doen van aangifte, bedoeld in [artikel 6 van de Algemene wet][ref1], geschiedt door het
      uitreiken van een aangiftebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '6'
  - number: '237.2'
    text: |-
      Het doen van aangifte, bedoeld in [artikel 8 van de Algemene wet][ref1], geschiedt door het inleveren of toezenden
      van het uitgereikte aangiftebiljet met de daarbij gevraagde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '8'
  - number: '237.3'
    text: |-
      In afwijking in zoverre van de vorige leden kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een verzoek om
      uitreiking van een aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 237.3.a
    text: |-
      worden de door de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar gevraagde bescheiden
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 237.3.b
    text: |-
      kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar vorderen dat een van de
      mondelinge aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte geacht
      wordt niet te zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '237.4'
    text: |-
      Indien het derde lid toepassing vindt, kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar voor de termijnen, genoemd in [artikel 9, eerste lid en derde lid, eerste volzin][ref2],
      [artikel 10, tweede lid][ref3], en [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref4] of voor de
      kortere termijn, bedoeld in [artikel 238, eerste of tweede lid][ref5], kortere termijnen in de plaats stellen en is
      [artikel 12 van de Algemene wet][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel238
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel12
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '238'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '12'
  - number: '237.5'
    text: Bij de belastingverordening kan van het eerste en tweede lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel237
  - number: '238.1'
    text: |-
      Met betrekking tot de bij wege van aanslag geheven gemeentelijke belastingen kan in de belastingverordening voor
      de in [artikel 9, eerste en derde lid, van de Algemene wet][ref1] genoemde termijn van ten minste een maand een
      kortere termijn in de plaats worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: '238.2'
    text: |-
      Met betrekking tot de bij wege van voldoening op aangifte geheven gemeentelijke belastingen kan in
      de belastingverordening voor de termijn van een maand, genoemd in [artikel 10, tweede lid][ref1], en
      [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref2], een kortere termijn in de plaats worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '239.1'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar is bevoegd voor eenzelfde
      belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op verschillende
      belastingen, op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '239.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel239
  - number: '242.1'
    text: |-
      Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf, kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven en
      op dat tijdstip nog geen aanslagbiljet is uitgereikt of is toegezonden, binnen zes weken na de dagtekening van het
      aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen bij
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '242.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel242
  - number: '242.3'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar beslist op de aanvraag bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '243'
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Minister en Onze Minister van Financiën,
      het internationale gebruik daartoe noodzaakt, wordt vrijstelling van gemeentelijke belastingen verleend. Onze
      genoemde Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel243
  - number: '244'
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf kan de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar ook een in de belastingverordening
      voorziene vrijstelling ambtshalve verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 246a.1
    text: 'Met betrekking tot gemeentelijke belastingen kunnen bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel246a
  - number: 246a.1.a
    text: |-
      regels worden gesteld waarbij de [artikelen 48][ref1], [52][ref2], [53, eerste en vierde lid][ref3],
      [54][ref4] of [55 van de Algemene wet inzake rijksbelastingen][ref5], alsmede de [artikelen 59][ref6] of
      [62 van de Invorderingswet 1990][ref7] geheel of gedeeltelijk van toepassing worden verklaard, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel62
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel246a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '54'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '62'
  - number: 246a.1.b
    text: regels worden gesteld die overeenkomen met die in de in onderdeel *a* genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel246a
  - number: 246a.2
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede van de belasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel246a
  - number: '249'
    text: |-
      Bij de invordering van gemeentelijke belastingen blijven van de [Invorderingswet 1990][ref1] buiten
      toepassing de [artikelen 5][ref2], [20][ref3], [21][ref4][59][ref5], [62][ref6] en [69][ref7]. Bij
      de invordering van gemeentelijke belastingen die op andere wijze worden geheven, blijft bovendien
      [artikel 8, eerste lid, van die wet][ref8] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel69
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '62'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '69'
      - id: ref8
        bwb_id: BWBR0004770
        artikel: '8'
  - number: '250.1'
    text: |-
      De belastingverordening kan van [artikel 9 van de Invorderingswet 1990][ref1] afwijkende voorschriften inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: '250.2'
    text: |-
      De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel250
  - number: '251'
    text: |-
      Met betrekking tot het doen van een vordering als bedoeld in
      [artikel 19, vierde lid, van de Invorderingswet 1990][ref1] zijn de krachtens het tiende lid van dat artikel door
      Onze minister van Financiën gestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '252'
    text: |-
      De verrekening van aan de belastingschuldige uit te betalen en van hem te innen bedragen ter zake van
      gemeentelijke belastingen op de voet van [artikel 24 van de Invorderingswet 1990][ref1] is ook mogelijk
      ingeval de in [artikel 9 van de Invorderingswet 1990][ref2] gestelde termijn, dan wel de krachtens
      [artikel 250, eerste lid][ref3], gestelde termijn nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel250
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '250'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '253.1'
    text: |-
      Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel253
  - number: '253.2'
    text: |-
      Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de met
      de invordering van gemeentelijke belastingen belaste gemeenteambtenaar de belastingaanslag op de gehele onroerende
      zaak verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de rechten van
      de overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel253
  - number: '253.3'
    text: |-
      De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt met
      zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel253
  - number: '253.4'
    text: |-
      Tegen een met toepassing van het eerste lid vastgestelde belastingaanslag kan mede beroep bij de
      rechtbank worden ingesteld door de belastingplichtige wiens naam niet op het aanslagbiljet staat vermeld.
      [Artikel 26a, derde lid, van de Algemene wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 26a
  - number: '253.5'
    text: Van het derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel253
  - number: '254'
    text: |-
      Voor de toepassing van [artikel 66 van de Invorderingswet 1990][ref1] met betrekking tot gemeentelijke belastingen
      blijven de [artikelen 76][ref2], [80, tweede, derde en vierde lid][ref3], [82][ref4], [84][ref5], [86][ref6] en
      [87 van de Algemene wet][ref7] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '87'
  - number: '255.1'
    text: |-
      De in [artikel 26 van de Invorderingswet 1990][ref1] bedoelde kwijtschelding wordt met betrekking tot gemeentelijke
      belastingen verleend door de in [artikel 231, tweede lid, onderdeel c][ref2], bedoelde gemeenteambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '255.2'
    text: |-
      Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens
      [artikel 26 van de Invorderingswet 1990][ref1] door Onze Minister van Financiën bij ministeriële regeling gestelde
      regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: '255.3'
    text: |-
      De raad kan bepalen dat, in afwijking van de in het tweede lid bedoelde regels, in het geheel geen dan wel
      gedeeltelijk kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel255
  - number: '255.4'
    text: |-
      Met inachtneming van door Onze Minister, in overeenstemming met Onze Minister van Financiën, te stellen regels
      kan de raad met betrekking tot de wijze waarop de kosten van bestaan en de wijze waarop het vermogen in aanmerking
      worden genomen afwijkende regels stellen die er toe leiden dat in ruimere mate kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel255
  - number: '255.5'
    text: |-
      Het college kan de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit ontheft de
      gemeenteambtenaar belast met de invordering van gemeentelijke belastingen van de verplichting verdere pogingen tot
      invordering te doen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel255
  - number: '256'
    text: |-
      Indien ter zake van een gemeentelijke belasting exploot moet worden gedaan, een akte van vervolging betekend
      of een dwangbevel ten uitvoer gelegd in een van de openbare lichamen Bonaire, Sint Eustatius en Saba, dan wel
      in een andere gemeente dan die waaraan belasting verschuldigd is, is daartoe naast de belastingdeurwaarder
      van laatstbedoelde gemeente mede de belastingdeurwaarder van eerstbedoelde gemeente respectievelijk van het
      desbetreffende openbaar lichaam bevoegd en desgevraagd verplicht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel256
  - number: '257'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in [artikel 220][ref1],
      nadere regels worden gegeven inzake de heffing en de invordering, alsmede inzake alle gemeentelijke belastingen
      andere in het kader van deze paragraaf passende nadere regels ter aanvulling van de in deze paragraaf geregelde
      onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: '259.1'
    text: |-
      Beslissingen van gemeentebesturen kunnen slechts aan goedkeuring worden onderworpen in bij de wet of krachtens de
      wet bij provinciale verordening bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel259
  - number: '259.2'
    text: |-
      Ten aanzien van de goedkeuring van andere beslissingen dan besluiten zijn [artikel 266][ref1] alsmede
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '266'
        hoofdstuk: XVI
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '266.1'
    text: |-
      Een beslissing die aan goedkeuring bij koninklijk besluit is onderworpen, wordt toegezonden aan Onze Minister wie
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel266
  - number: '266.2'
    text: Een voordracht tot onthouding van goedkeuring wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel266
  - number: '266.3'
    text: |-
      Onthouding van goedkeuring geschiedt niet, dan nadat de Raad van State is gehoord. De toepassing van
      [artikel 10:30, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt in dat geval plaats voordat het ontwerp-
      besluit bij de Raad van State ter overweging wordt gebracht. [Artikel 27d van de Wet op de Raad van State][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 27d
  - number: '268.1'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het gemeentebestuur kan bij
      koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel268
  - number: '268.2'
    text: |-
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing gericht op enig
      rechtsgevolg zijn de [artikelen 273 tot en met 281a][ref1] alsmede de [afdelingen 10.2.2][ref2] en
      [10.2.3 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel273
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '273'
        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '273.1'
    text: |-
      Indien een besluit naar het oordeel van de burgemeester voor vernietiging in aanmerking komt, doet hij daarvan
      binnen twee dagen nadat het te zijner kennis is gekomen, door tussenkomst van gedeputeerde staten, mededeling aan
      Onze Minister wie het aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo
      nodig aan het orgaan dat met de uitvoering van het besluit is belast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273
  - number: '273.2'
    text: |-
      Gedeputeerde staten zenden de stukken, vergezeld van hun advies, binnen een week na de dagtekening van de
      mededeling van de burgemeester toe aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273
  - number: '273.3'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging geen
      redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de burgemeester
      is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273
  - number: 273a.1
    text: |-
      Indien een besluit van de raad of het college naar het oordeel van gedeputeerde staten of indien een besluit van
      de burgemeester naar het oordeel van de commissaris van de Koning voor vernietiging in aanmerking komt, doen zij
      daarvan binnen tien dagen nadat het te hunner kennis is gekomen, mededeling aan Onze Minister wie het aangaat.
      Zij geven hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat met de
      uitvoering van het besluit is belast en aan de geadresseerde van het besluit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273a
  - number: 273a.2
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging geen
      redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van gedeputeerde
      staten of de commissaris van de Koning is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273a
  - number: 273a.3
    text: |-
      In geval de bevoegdheid tot het nemen van een besluit aan de raad, het college of de burgemeester is verleend
      bij andere wet dan deze en het besluit in aanmerking komt voor vernietiging wegens strijd met het recht, kunnen
      gedeputeerde staten onderscheidenlijk de commissaris van de Koning mededeling doen dat zij overwegen toepassing
      te geven aan het eerste lid. De mededeling wordt gedaan aan het orgaan dat het besluit heeft genomen, het orgaan
      dat met de uitvoering van het besluit is belast en de geadresseerde van het besluit. Nadat gedeputeerde staten
      onderscheidenlijk de commissaris van de Koning, mededeling hebben gedaan, wordt het besluit niet of niet verder
      uitgevoerd. Indien niet binnen tien dagen toepassing is gegeven aan het eerste lid, dan wel indien gedeputeerde
      staten onderscheidenlijk de commissaris van de Koning mededelen dat geen toepassing wordt gegeven aan het eerste
      lid, wordt het besluit uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel273a
  - number: '274.1'
    text: Een voordracht tot schorsing wordt gedaan door Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel274
  - number: '274.2'
    text: |-
      Over de voordracht pleegt Onze Minister wie het aangaat overleg met Onze Minister, tenzij schorsing onverwijld
      plaats dient te vinden. In de voordracht wordt het achterwege blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel274
  - number: '275'
    text: In het koninklijk besluit kan voor de duur van de schorsing een voorziening worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel275
  - number: '277'
    text: |-
      Indien een bekend gemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het gemeentebestuur openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel277
  - number: '278.1'
    text: De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278
  - number: '278.2'
    text: |-
      [Artikel 17, derde lid, van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel17
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '17'
  - number: 278a.1
    text: |-
      In het koninklijk besluit kan een voorziening worden getroffen voor de periode tussen de inwerkingtreding en het
      tijdstip dat het op grond van [artikel 281][ref1] genomen besluit in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel281
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '281'
        hoofdstuk: XVII
  - number: 278a.2
    text: |-
      Indien, gelet op het koninklijk besluit, het gemeentebestuur bij de toepassing van artikel 281 niet over
      beleidsvrijheid beschikt, kan het koninklijk besluit bepalen dat het in de plaats treedt van het vernietigde
      besluit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278a
  - number: 278a.3
    text: |-
      In het koninklijk besluit kan worden bepaald dat ter zake van het vernietigde besluit geen nieuw besluit wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278a
  - number: 278a.4
    text: |-
      In het koninklijk besluit kan het gemeentebestuur een aanwijzing worden gegeven over de uitvoering van het
      koninklijk besluit. De [artikelen 124 tot en met 124h][ref1] zijn van overeenkomstige toepassing ingeval de
      aanwijzing niet wordt opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 278a.5
    text: |-
      Indien het koninklijk besluit betrekking heeft op de vernietiging van een algemeen verbindend voorschrift of een
      ander besluit van algemene strekking, kan worden bepaald dat de vernietiging tevens betrekking heeft op besluiten
      die zijn genomen op grond van of ter uitvoering van het algemeen verbindend voorschrift of het andere besluit van
      algemene strekking.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel278a
  - number: '279'
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel279
  - number: '281.1'
    text: |-
      Het gemeentebestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met
      het koninklijk besluit wordt rekening gehouden, tenzij in het koninklijk besluit toepassing is gegeven aan
      [artikel 278a, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel278a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 278a
        hoofdstuk: XVII
  - number: '281.2'
    text: |-
      In het koninklijk besluit kan een termijn worden gesteld waarbinnen toepassing wordt gegeven aan het eerste lid. De
      [artikelen 124 tot en met 124h][ref1] zijn van overeenkomstige toepassing ingeval niet binnen de termijn toepassing
      is gegeven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 281a
    text: |-
      In afwijking van [artikel 8:4, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1] kan een
      belanghebbende tegen een koninklijk besluit als bedoeld in [artikel 268, eerste lid][ref2], dan wel tegen een
      vernietigingsbesluit als bedoeld in de [artikelen 85, tweede lid][ref3], en [87a, eerste lid][ref4], beroep
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel87a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel281a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '268'
        hoofdstuk: XVII
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '85'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 87a
        hoofdstuk: V
        paragraaf: '2'
  - number: '290.1'
    text: |-
      De intrekking van de gemeentewet heeft geen gevolgen voor de geldigheid van de op de dag voor de inwerkingtreding
      van deze wet geldende besluiten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel290
  - number: '290.2'
    text: |-
      Besluiten als bedoeld in het eerste lid die algemeen verbindende voorschriften bevatten waarvan de inhoud in strijd
      is met deze wet, worden binnen twee jaar na de datum van inwerkingtreding van deze wet daarmee in overeenstemming
      gebracht of ingetrokken. De besluiten, of onderdelen daarvan, die bij het verstrijken van de in de vorige volzin
      genoemde termijn niet met deze wet in overeenstemming zijn gebracht of zijn ingetrokken, zijn van rechtswege
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel290
  - number: '290.3'
    text: |-
      Besluiten van gedeputeerde staten, bedoeld in [artikel 100, eerste lid van de gemeentewet][ref1] vervallen van
      rechtswege op de dag waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '290.4'
    text: |-
      Niettemin blijven gedeputeerde staten na de inwerkingtreding van deze wet bevoegd de jaarwedde van
      wethouders over de periode voorafgaand aan de inwerkingtreding van deze wet vast te stellen overeenkomstig
      [artikel 100, eerste lid, van de gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '290.5'
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing op jaarwedden van gemeentesecretarissen, bedoeld in
      [artikel 111, eerste lid, van de gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel111
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '111'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '291'
    text: |-
      [Artikel 44, vijfde tot en met achtste lid][ref1], onderscheidenlijk
      [artikel 66, vijfde tot en met zevende lid][ref2], is niet van toepassing op de bij inwerkingtreding van die
      bepalingen zittende wethouder onderscheidenlijk burgemeester, zolang deze zonder onderbreking zijn ambt vervult in
      dezelfde gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel66
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '44'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '66'
        hoofdstuk: IV
  - number: '310'
    text: 'Deze wet kan worden aangehaald als: Gemeentewet.'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel310
