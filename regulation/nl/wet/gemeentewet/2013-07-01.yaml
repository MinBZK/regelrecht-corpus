  - number: 81m.1
    text: |-
      De [artikelen 81b tot en met 81f][ref1], [81h][ref2], [81i][ref3] en [81j, eerste, derde en vierde lid][ref4],
      zijn van overeenkomstige toepassing op de gemeenschappelijke rekenkamer, met dien verstande dat in de
      [artikelen 81b tot en met 81d][ref5], [81i, tweede lid][ref6], en [81j, eerste lid][ref7], voor «de raad» telkens
      wordt gelezen «de raden van de deelnemende gemeenten gezamenlijk» of, indien de rekenkamer mede is ingesteld door
      provincies, «provinciale staten en de raden van de deelnemende provincies en gemeenten gezamenlijk».


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81b
