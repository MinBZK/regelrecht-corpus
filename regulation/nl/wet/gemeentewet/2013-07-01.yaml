  - number: 81m.2
    text: |-
      [Artikel 81g][ref1] is op de gemeenschappelijke rekenkamer van toepassing, met dien verstande dat voor «de raad»
      wordt gelezen «de raad van de gemeente die daartoe in de regeling waarbij de gemeenschappelijke rekenkamer is
      ingesteld, is aangewezen» of, indien de rekenkamer mede is ingesteld door provincies, «provinciale staten van de
      provincie of de raad van de gemeente die daartoe in de regeling waarbij de gemeenschappelijke regeling is ingesteld
      zijn of is aangewezen».


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81g
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81m
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81g
        hoofdstuk: IVa
        paragraaf: '1'
  - number: 81n
    text: |-
      Indien de raad of de raden van een of meer gemeenten met provinciale staten van een of meer provincies een
      gemeenschappelijke rekenkamer instellen, is, onverminderd [artikel 81m, eerste lid, juncto artikel 81f][ref1], een
      lid van de rekenkamer niet tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81m
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81n
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81m
        hoofdstuk: IVa
        paragraaf: '2'
  - number: 81n.a
    text: lid van provinciale staten van een deelnemende provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81n
  - number: 81n.b
    text: ambtenaar, door of vanwege het provinciebestuur van een deelnemende provincie aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81n
  - number: 81n.c
    text: |-
      ambtenaar, door of vanwege het Rijk aangesteld, tot wiens taak het behoort het verrichten van werkzaamheden in het
      kader van het toezicht op de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81n
  - number: 81n.d
    text: |-
      functionaris, krachtens de wet of algemene maatregel van bestuur geroepen om het provinciebestuur van advies te
      dienen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81n
  - number: 81o
    text: 'In de regeling waarbij de gemeenschappelijke rekenkamer wordt ingesteld, worden ten minste regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81o
  - number: 81o.a
    text: |-
      de benoeming, op voordracht van de voorzitter of het enige lid van de rekenkamer, van de ambtenaren die nodig zijn
      voor een goede uitoefening van de werkzaamheden van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81o
  - number: 81o.b
    text: de vergoeding die de leden van de rekenkamer voor hun werkzaamheden ontvangen en de tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81o
  - number: 81oa.1
    text: |-
      Als geen rekenkamer is ingesteld als bedoeld in [hoofdstuk IVa][ref1], stelt de raad bij verordening regels vast
      voor de uitoefening van de rekenkamerfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukIVa
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81oa
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: IVa
  - number: 81oa.2
    text: |-
      De [artikelen 182][ref1], [184a][ref2] en [185][ref3] zijn voor de uitoefening van de rekenkamerfunctie van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel182
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel184a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel185
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81oa
