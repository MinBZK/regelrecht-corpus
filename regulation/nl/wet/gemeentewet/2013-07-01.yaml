    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81f
  - number: 81f.2
    text: 'In afwijking van het eerste lid, aanhef en onder r, kan een lid van de rekenkamer tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81f
  - number: 81f.2.a
