preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen met betrekking tot de
    inrichting van gemeenten, alsmede de samenstelling en bevoegdheid van hun besturen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder het aantal inwoners van een gemeente: het aantal inwoners volgens de door het
      Centraal Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per 1 januari.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de vaststelling van het inwonertal, bedoeld in [artikel 8][ref1], geldt als peildatum 1 januari van het jaar
      voorafgaand aan het jaar van de verkiezing van de raad. Het Centraal Bureau voor de Statistiek kan op schriftelijk
      verzoek van de raad het inwonertal per de eerste dag van de vierde maand voorafgaande aan de maand van de
      kandidaatstelling vaststellen, indien aannemelijk is dat een in dat artikel genoemd inwonertal op genoemde datum is
      overschreden. In dat geval geldt dit tijdstip als peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '8'
        hoofdstuk: II
  - number: '2'
    text: 'In deze wet wordt verstaan onder ingezetenen: zij die hun werkelijke woonplaats in de gemeente hebben.'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel2
  - number: '3'
    text: |-
      Zij die als ingezetene met een adres zijn ingeschreven in de gemeentelijke basisadministratie persoonsgegevens
      van een gemeente, worden voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke
      woonplaats te hebben in die gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel3
  - number: '4'
    text: |-
      In deze wet wordt onder ambtenaar mede verstaan: degene die op arbeidsovereenkomst naar burgerlijk recht werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel4
  - number: '5'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel5
  - number: 5.a
    text: 'gemeentebestuur: ieder bevoegd orgaan van de gemeente;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel5
  - number: 5.b
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel5
  - number: 5.c
    text: 'college: college van burgemeester en wethouders.'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel5
  - number: '6'
    text: In elke gemeente is een raad, een college en een burgemeester.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel6
  - number: '7'
    text: De raad vertegenwoordigt de gehele bevolking van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel7
  - number: '8.1'
    text: |-
      De raad bestaat uit: 9 leden in een gemeente beneden de 3 001 inwoners; 11 leden in een gemeente van 3 001- 6
      000 inwoners; 13 leden in een gemeente van 6 001- 10 000 inwoners; 15 leden in een gemeente van 10 001- 15 000
      inwoners; 17 leden in een gemeente van 15 001- 20 000 inwoners; 19 leden in een gemeente van 20 001- 25 000
      inwoners; 21 leden in een gemeente van 25 001- 30 000 inwoners; 23 leden in een gemeente van 30 001- 35 000
      inwoners; 25 leden in een gemeente van 35 001- 40 000 inwoners; 27 leden in een gemeente van 40 001- 45 000
      inwoners; 29 leden in een gemeente van 45 001- 50 000 inwoners; 31 leden in een gemeente van 50 001- 60 000
      inwoners; 33 leden in een gemeente van 60 001- 70 000 inwoners; 35 leden in een gemeente van 70 001- 80 000
      inwoners; 37 leden in een gemeente van 80 001-100 000 inwoners; 39 leden in een gemeente van 100 001-200 000
      inwoners; 45 leden in een gemeente boven de 200 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel8
  - number: '8.2'
    text: |-
      Vermeerdering of vermindering van het aantal leden van de raad, voortvloeiende uit wijziging van het aantal
      inwoners van de gemeente, treedt eerst in bij de eerstvolgende periodieke verkiezing van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel8
  - number: '9'
    text: De burgemeester is voorzitter van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel9
  - number: '10.1'
    text: |-
      Voor het lidmaatschap van de raad is vereist dat men ingezetene van de gemeente is, de leeftijd van achttien jaar
      heeft bereikt en niet is uitgesloten van het kiesrecht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel10
  - number: '10.2'
    text: 'Zij die geen onderdaan van een lidstaat van de Europese Unie zijn, dienen tevens te voldoen aan de vereisten dat:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel10
  - number: 10.2.a
    text: |-
      zij rechtmatig in Nederland verblijven op grond van
      [artikel 8, onder a, b, d, e of l, van de Vreemdelingenwet 2000][ref1] of op grond van een overeenkomst tussen een
      internationale organisatie en de Staat der Nederlanden inzake de zetel van deze organisatie in Nederland, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 10.2.b
    text: |-
      zij onmiddellijk voorafgaand aan de dag waarop de gemeenteraad beslist over de toelating als lid tot de
      gemeenteraad gedurende een onafgebroken periode van ten minste vijf jaren ingezetene van Nederland waren en
      beschikten over een verblijfsrecht als bedoeld onder a, dan wel rechtmatig in Nederland verbleven op grond van
      [artikel 8, onder c, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '10.3'
    text: |-
      Geen lid van de raad kunnen zijn zij die geen Nederlander zijn, en als door andere staten uitgezonden leden
      van diplomatieke of consulaire vertegenwoordigingen, in Nederland werkzaam zijn, alsmede hun niet-Nederlandse
      echtgenoten, geregistreerde partners of levensgezellen en kinderen, voor zover dezen met hen een gemeenschappelijke
      huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel10
  - number: '11'
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van de raad hij die na de
      laatstgehouden periodieke verkiezing van de leden van de raad wegens handelen in strijd met [artikel 15][ref1] van
      het lidmaatschap van de raad is vervallen verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: '12.1'
    text: De leden van de raad maken openbaar welke andere functies dan het lidmaatschap van de raad zij vervullen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel12
  - number: '12.2'
    text: |-
      Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op het
      gemeentehuis.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel12
  - number: '13.1'
    text: 'Een lid van de raad is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 13.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.h
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.i
    text: secretaris van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.j
    text: griffier van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.k
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.l
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.m
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.n
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 81p, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81p
        hoofdstuk: IVc
        paragraaf: '1'
  - number: 13.1.o
    text: lid van een deelraad;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.p
    text: lid van het dagelijks bestuur van een deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.1.q
    text: ambtenaar, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onder l, kan een lid van de raad tevens wethouder zijn van de gemeente
      waar hij lid van de raad is gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.2.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van de raad en eindigt op het tijdstip waarop de
      wethouders ingevolge [artikel 42, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel42
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '42'
        hoofdstuk: III
  - number: 13.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot wethouder en eindigt op het tijdstip waarop de goedkeuring van de
      geloofsbrief van zijn opvolger als lid van de raad onherroepelijk is geworden of waarop het centraal stembureau
      heeft beslist dat geen opvolger kan worden benoemd. Hij wordt geacht ontslag te nemen als lid van de raad met
      ingang van het tijdstip waarop hij zijn benoeming tot wethouder aanvaardt. [Artikel X 6 van de Kieswet][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: '13.3'
    text: 'In afwijking van het eerste lid, aanhef en onder q, kan een lid van de raad tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.3.a
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.3.b
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: 13.3.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel13
  - number: '14.1'
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van de raad in de vergadering, in handen van de
      voorzitter, de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot lid van de raad benoemd
      te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven
      of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch
      middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal
      zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als lid van de raad naar eer en
      geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!" (Dat verklaar en beloof ik!")


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '14.2'
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta lid fan 'e rie beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten
      haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik
      hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan
      'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as lid fan 'e rie yn alle oprjochtens
      ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '15.1'
    text: 'Een lid van de raad mag niet:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.a
    text: |-
      als advocaat of adviseur in geschillen werkzaam zijn ten behoeve van de gemeente of het gemeentebestuur dan wel ten
      behoeve van de wederpartij van de gemeente of het gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.b
    text: als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van de gemeente of het gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.c
    text: 'als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met de gemeente aangaan van:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.c.1e
    text: overeenkomsten als bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.c.2e
    text: overeenkomsten tot het leveren van onroerende zaken aan de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d
    text: 'rechtstreeks of middellijk een overeenkomst aangaan betreffende:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.1e
    text: het aannemen van werk ten behoeve van de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.2e
    text: het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.3e
    text: het leveren van roerende zaken anders dan om niet aan de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.4e
    text: het verhuren van roerende zaken aan de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.5e
    text: het verwerven van betwiste vorderingen ten laste van de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.6e
    text: het van de gemeente onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: 15.1.d.7e
    text: het onderhands huren of pachten van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: '15.2'
    text: Van het eerste lid, aanhef en onder *d*, kunnen gedeputeerde staten ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: '15.3'
    text: De raad stelt voor zijn leden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel15
  - number: '16'
    text: De raad stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel16
  - number: '17.1'
    text: De raad vergadert zo vaak als hij daartoe heeft besloten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel17
  - number: '17.2'
    text: |-
      Voorts vergadert de raad indien de burgemeester het nodig oordeelt of indien ten minste een vijfde van het aantal
      leden waaruit de raad bestaat schriftelijk, met opgave van redenen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel17
  - number: '18'
    text: |-
      De raad vergadert na de periodieke verkiezing van zijn leden voor de eerste maal in nieuwe samenstelling op de dag
      met ingang waarvan de leden van de raad in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel18
  - number: '19.1'
    text: De burgemeester roept de leden schriftelijk tot de vergadering op.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel19
  - number: '19.2'
    text: |-
      Tegelijkertijd met de oproeping brengt de burgemeester dag, tijdstip en plaats van de vergadering ter openbare
      kennis. De agenda en de daarbij behorende voorstellen met uitzondering van de in [artikel 25, tweede lid][ref1],
      bedoelde stukken worden tegelijkertijd met de oproeping en op een bij de openbare kennisgeving aan te geven wijze
      ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '25'
        hoofdstuk: II
  - number: '20.1'
    text: |-
      De vergadering van de raad wordt niet geopend voordat blijkens de presentielijst meer dan de helft van het aantal
      zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel20
  - number: '20.2'
    text: |-
      Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de burgemeester, onder verwijzing
      naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het bezorgen van
      de oproeping is gelegen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel20
  - number: '20.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. De raad kan echter over
      andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was belegd alleen
      beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting hebbende
      leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel20
  - number: '21.1'
    text: De burgemeester heeft het recht in de vergadering aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel21
  - number: '21.2'
    text: Een wethouder heeft toegang tot de vergaderingen en kan aan de beraadslaging deelnemen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel21
  - number: '21.3'
    text: Een wethouder kan door de raad worden uitgenodigd om ter vergadering aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel21
  - number: '22'
    text: |-
      De leden van het gemeentebestuur en andere personen die deelnemen aan de beraadslaging kunnen niet in
      rechte worden vervolgd of aangesproken voor dan wel worden verplicht getuigenis af te leggen als bedoeld in
      [artikel 165, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] over hetgeen zij in de vergadering
      van de raad hebben gezegd of aan de raad schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '23.1'
    text: De vergadering van de raad wordt in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel23
  - number: '23.2'
    text: |-
      De deuren worden gesloten, wanneer ten minste een vijfde van het aantal leden dat de presentielijst heeft getekend
      daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel23
  - number: '23.3'
    text: De raad beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel23
  - number: '23.4'
    text: |-
      Van een vergadering met gesloten deuren wordt een afzonderlijk verslag opgemaakt, dat niet openbaar wordt gemaakt
      tenzij de raad anders beslist.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel23
  - number: '23.5'
    text: |-
      De raad maakt de besluitenlijst van zijn vergaderingen op de in de gemeente gebruikelijke wijze openbaar. De
      raad laat de openbaarmaking achterwege voor zover het aangelegenheden betreft ten aanzien waarvan op grond van
      [artikel 25][ref1] geheimhouding is opgelegd of ten aanzien waarvan openbaarmaking in strijd is met het openbaar
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel25
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '25'
        hoofdstuk: II
  - number: '24'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel24
  - number: 24.a
    text: de toelating van nieuw benoemde leden;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel24
  - number: 24.b
    text: de vaststelling en wijziging van de begroting en de vaststelling van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel24
  - number: 24.c
    text: de invoering, wijziging en afschaffing van gemeentelijke belastingen, en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel24
  - number: 24.d
    text: de benoeming en het ontslag van wethouders.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel24
  - number: '25.1'
    text: |-
      De raad kan op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1] (*Stb.*
      1991, 703), omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan de raad
      worden overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt
      tijdens die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen
      die van het behandelde of de stukken kennis dragen, in acht genomen totdat de raad haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '25.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door het college, de burgemeester en een commissie, ieder ten aanzien van de stukken die
      zij aan de raad of aan leden van de raad overleggen. Daarvan wordt op de stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '25.3'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan de raad overgelegde
      stukken vervalt, indien de oplegging niet door de raad in zijn eerstvolgende vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, wordt bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel25
  - number: '25.4'
    text: |-
      De krachtens het tweede lid opgelegde verplichting tot geheimhouding met betrekking tot aan leden van de raad
      overgelegde stukken wordt in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel, indien het
      stuk waaromtrent geheimhouding is opgelegd aan de raad is voorgelegd, totdat de raad haar opheft. De raad kan deze
      beslissing alleen nemen in een vergadering die blijkens de presentielijst door meer dan de helft van het aantal
      zitting hebbende leden is bezocht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel25
  - number: '26.1'
    text: |-
      De voorzitter zorgt voor de handhaving van de orde in de vergadering en is bevoegd, wanneer die orde op enigerlei
      wijze door toehoorders wordt verstoord, deze en zo nodig andere toehoorders te doen vertrekken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel26
  - number: '26.2'
    text: |-
      Hij is bevoegd toehoorders die bij herhaling de orde in de vergadering verstoren voor ten hoogste drie maanden de
      toegang tot de vergadering te ontzeggen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel26
  - number: '26.3'
    text: |-
      Hij kan de raad voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert, het
      verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming daarvan
      verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van zijn
      gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel26
  - number: '27'
    text: De leden van de raad stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel27
  - number: '28.1'
    text: 'Een lid van de raad neemt niet deel aan de stemming over:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: 28.1.a
    text: |-
      een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: 28.1.b
    text: |-
      de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur hij
      behoort.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: '28.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: '28.3'
    text: |-
      Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een voordracht
      of bij een herstemming is beperkt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: '28.4'
    text: |-
      Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      benoemde leden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel28
  - number: '29.1'
    text: |-
      Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel29
  - number: '29.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel29
  - number: 29.2.a
    text: |-
      ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel29
  - number: 29.2.b
    text: |-
      in een vergadering als bedoeld in [artikel 20, tweede lid][ref1], voor zover het betreft onderwerpen die in
      de daaraan voorafgaande, ingevolge [artikel 20, eerste lid][ref2], niet geopende vergadering aan de orde waren
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel20
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '20'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '20'
        hoofdstuk: II
  - number: '30.1'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel30
  - number: '30.2'
    text: |-
      Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel30
  - number: '31.1'
    text: De stemming over personen voor het doen van benoemingen, voordrachten of aanbevelingen is geheim.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel31
  - number: '31.2'
    text: |-
      Indien de stemmen staken over personen tot wie de keuze door een voordracht of bij een herstemming is beperkt,
      wordt in dezelfde vergadering een herstemming gehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel31
  - number: '31.3'
    text: Staken bij deze stemming de stemmen opnieuw, dan beslist terstond het lot.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel31
  - number: '32.1'
    text: |-
      De overige stemmingen geschieden bij hoofdelijke oproeping, indien de voorzitter of een van de leden dat verlangt.
      In dat geval geschieden zij mondeling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: '32.2'
    text: |-
      Bij hoofdelijke oproeping is ieder ter vergadering aanwezig lid dat zich niet van deelneming aan de stemming moet
      onthouden verplicht zijn stem voor of tegen uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: '32.3'
    text: Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: '32.4'
    text: |-
      Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslagingen kunnen worden heropend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: '32.5'
    text: |-
      Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: '32.6'
    text: |-
      Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit de raad bestaat, voor
      zover zij zich niet van deelneming aan de stemming moesten onthouden, een stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32
  - number: 32a
    text: |-
      De stukken die van de raad uitgaan, worden door de burgemeester ondertekend en door de griffier medeondertekend.
      Bij verhindering of ontstentenis van de burgemeester worden de stukken die van de raad uitgaan ondertekend door
      degene die krachtens [artikel 77][ref1] de burgemeester als voorzitter van de raad vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel77
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '77'
        hoofdstuk: IV
  - number: '33.1'
    text: De raad en elk van zijn leden hebben recht op ambtelijke bijstand.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel33
  - number: '33.2'
    text: De in de raad vertegenwoordigde groeperingen hebben recht op ondersteuning.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel33
  - number: '33.3'
    text: |-
      De raad stelt met betrekking tot de ambtelijke bijstand en de ondersteuning van de in de raad vertegenwoordigde
      groeperingen een verordening vast. De verordening bevat ten aanzien van de ondersteuning regels over de besteding
      en de verantwoording.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel33
  - number: '34.1'
    text: De burgemeester en de wethouders vormen te zamen het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel34
  - number: '34.2'
    text: De burgemeester is voorzitter van het college.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel34
  - number: '35.1'
    text: De raad benoemt de wethouders.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel35
  - number: '35.2'
    text: |-
      De burgemeester wordt geïnformeerd over de uitkomsten van de college-onderhandelingen. Hij wordt alsdan in de
      gelegenheid gesteld zijn opvattingen over voorstellen ten behoeve van het collegeprogramma kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel35
  - number: '36.1'
    text: |-
      Het aantal wethouders bedraagt ten hoogste twintig procent van het aantal raadsleden, met dien verstande dat er
      niet minder dan twee wethouders zullen zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36
  - number: '36.2'
    text: De raad kan besluiten dat het wethouderschap in deeltijd wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36
  - number: '36.3'
    text: |-
      Indien het tweede lid toepassing vindt bedraagt, in afwijking van het eerste lid, het aantal wethouders ten hoogste
      vijfentwintig procent van het aantal raadsleden, met dien verstande dat de tijdsbestedingsnorm van de wethouders
      gezamenlijk ten hoogste tien procent meer bedraagt dan de tijdsbestedingsnorm van de wethouders gezamenlijk zou
      hebben bedragen indien het tweede lid geen toepassing had gevonden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36
  - number: '36.4'
    text: De raad stelt bij de benoeming van de wethouders de tijdsbestedingsnorm van elke wethouder vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36
  - number: '36.5'
    text: |-
      Bij de berekening van het maximale aantal wethouders, bedoeld in het eerste en het derde lid, wordt afgerond tot
      het dichtstbijgelegen gehele getal.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36
  - number: 36a.1
    text: |-
      Voor het wethouderschap gelden de vereisten voor het lidmaatschap van de raad, bedoeld in [artikel 10][ref1], met
      dien verstande dat in [artikel 10, tweede lid, onder b][ref2], voor «de dag waarop de gemeenteraad beslist over de
      toelating als lid tot de gemeenteraad» gelezen wordt: de dag waarop zij tot wethouder worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '10'
        hoofdstuk: II
  - number: 36a.2
    text: |-
      De raad kan voor de duur van een jaar ontheffing verlenen van het vereiste van ingezetenschap. De ontheffing kan in
      bijzondere gevallen, telkens met een periode van maximaal een jaar, worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36a
  - number: 36a.3
    text: Dezelfde persoon kan niet in meer dan één gemeente wethouder zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36a
  - number: 36b.1
    text: 'Een wethouder is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 36b.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.h
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.i
    text: secretaris van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.j
    text: griffier van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.k
    text: lid van de rekenkamer van de provincie waarin de gemeente waar hij wethouder is, is gelegen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.l
    text: lid van de raad van een gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.m
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.n
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.o
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 81p, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81p
        hoofdstuk: IVc
        paragraaf: '1'
  - number: 36b.1.p
    text: lid van een deelraad;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.q
    text: lid van het dagelijks bestuur van een deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.r
    text: ambtenaar, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.s
    text: |-
      ambtenaar, door of vanwege het Rijk of de provincie aangesteld, tot wiens taak behoort het verrichten van
      werkzaamheden in het kader van het toezicht op de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.1.t
    text: functionaris die krachtens de wet of een algemene maatregel van bestuur het gemeentebestuur van advies dient.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.2
    text: |-
      In afwijking van het eerste lid, aanhef en onder l, kan een wethouder tevens lid zijn van de raad van de gemeente
      waar hij wethouder is gedurende het tijdvak dat:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.2.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van de raad en eindigt op het tijdstip waarop de
      wethouders ingevolge [artikel 42, eerste lid][ref1], aftreden, of


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel42
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '42'
        hoofdstuk: III
  - number: 36b.2.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot wethouder en eindigt op het tijdstip waarop de goedkeuring van de
      geloofsbrief van zijn opvolger als lid van de raad onherroepelijk is geworden of waarop het centraal stembureau
      heeft beslist dat geen opvolger kan worden benoemd. Hij wordt geacht ontslag te nemen als lid van de raad met
      ingang van het tijdstip waarop hij zijn benoeming tot wethouder aanvaardt. [Artikel X 6 van de Kieswet][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: 36b.3
    text: 'In afwijking van het eerste lid, aanhef en onder r, kan een wethouder tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.3.a
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.3.b
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: 36b.3.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel36b
  - number: '37'
    text: |-
      De benoeming van wethouders na de verkiezing van de leden van de raad vindt plaats in een vergadering van de raad
      in nieuwe samenstelling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel37
  - number: '38'
    text: |-
      In het geval van [artikel 37][ref1] gaat de benoeming van degene die zijn benoeming tot wethouder heeft aangenomen,
      in op het tijdstip waarop ten minste de helft van het met inachtneming van [artikel 36][ref2] bepaalde aantal
      wethouders zijn benoeming heeft aangenomen of, indien de aanneming van de benoeming op een later tijdstip
      plaatsvindt, op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '36'
        hoofdstuk: III
  - number: '39'
    text: |-
      De benoeming ter vervulling van een plaats die tussentijds openvalt, geschiedt zo spoedig mogelijk, tenzij de raad
      besluit het aantal wethouders te verminderen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel39
  - number: '40'
    text: |-
      De benoemde wethouder deelt de raad uiterlijk op de tiende dag na de kennisgeving van zijn benoeming mee of hij
      de benoeming aanneemt. Indien deze termijn verstrijkt zonder mededeling, wordt de benoemde wethouder geacht de
      benoeming niet aan te nemen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel40
  - number: '41'
    text: Wanneer de benoeming niet is aangenomen, geschiedt zo spoedig mogelijk een nieuwe benoeming.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41
  - number: 41a.1
    text: |-
      Alvorens hun functie te kunnen uitoefenen leggen de wethouders, in de vergadering van de raad, in handen van de
      voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot wethouder benoemd te
      worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven
      of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch
      middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn
      aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als wethouder naar eer en geweten zal
      vervullen. Zo waarlijk helpe mij God Almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 41a.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta wethâlder beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten
      haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik
      hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan
      'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as wethâlder yn alle oprjochtens ferfolje
      sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 41b.1
    text: |-
      Een wethouder vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op een goede vervulling
      van zijn wethouderschap.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41b
  - number: 41b.2
    text: Een wethouder meldt zijn voornemen tot aanvaarding van een nevenfunctie aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41b
  - number: 41b.3
    text: |-
      Een wethouder maakt zijn nevenfuncties openbaar. Openbaarmaking geschiedt door terinzagelegging op het
      gemeentehuis.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41b
  - number: 41b.4
    text: |-
      Een wethouder die zijn ambt niet in deeltijd vervult, maakt tevens de inkomsten uit nevenfuncties openbaar.
      Openbaarmaking geschiedt door terinzagelegging op het gemeentehuis uiterlijk op 1 april na het kalenderjaar waarin
      de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41b
  - number: 41b.5
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 41c.1
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: 41c.2
    text: De raad stelt voor de wethouders een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel41c
  - number: '42.1'
    text: |-
      Na de verkiezing van de leden van de raad treden de wethouders af op het moment dat de raad ten minste de helft
      van het met inachtneming van [artikel 36][ref1] bepaalde aantal wethouders heeft benoemd en deze benoemingen zijn
      aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '36'
        hoofdstuk: III
  - number: '42.2'
    text: |-
      Indien zoveel wethouders hun ontslag indienen of worden ontslagen dat niet ten minste de helft van het met
      inachtneming van [artikel 36][ref1] bepaalde aantal wethouders in functie is, treedt de burgemeester in de plaats
      van het college totdat dit wel het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '36'
        hoofdstuk: III
  - number: '43.1'
    text: Een wethouder kan te allen tijde ontslag nemen. Hij doet daarvan schriftelijk mededeling aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel43
  - number: '43.2'
    text: |-
      Het ontslag gaat in met ingang van de dag, gelegen een maand na de dag waarop hij zijn ontslag heeft genomen of
      zoveel eerder als zijn opvolger de benoeming heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel43
  - number: '44.1'
    text: |-
      De wethouders genieten ten laste van de gemeente een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere financiële voorzieningen die verband houden met de vervulling van het wethoudersambt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.3'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend genieten de wethouders als zodanig geen inkomsten, in welke
      vorm ook, ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.4'
    text: |-
      De wethouders genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties die zij
      vervullen uit hoofde van het wethoudersambt ongeacht of die vergoedingen ten laste van de gemeente komen of niet.
      Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de gemeentekas.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.5'
    text: |-
      Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de wethouder neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '44.7'
    text: |-
      Ten aanzien van de wethouders die hun ambt in deeltijd vervullen, vindt onverminderd het vierde lid geen
      verrekening plaats van de inkomsten, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '44.8'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de wethouder gegevens over de
      inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel44
  - number: '45.1'
    text: |-
      Het college verleent aan een wethouder op diens verzoek verlof wegens zwangerschap en bevalling. Het verlof gaat
      in op de in het verzoek vermelde dag die ligt tussen ten hoogste zes en ten minste vier weken voor de vermoedelijke
      datum van de bevalling die blijkt uit een bij het verzoek gevoegde verklaring van een arts of verloskundige.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45
  - number: '45.2'
    text: |-
      Het college verleent aan een wethouder op diens verzoek verlof wegens ziekte, indien uit een bij het verzoek
      gevoegde verklaring van een arts blijkt dat niet aannemelijk is dat hij de uitoefening van zijn functie binnen acht
      weken zal kunnen hervatten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45
  - number: '45.3'
    text: |-
      In het geval een wethouder vanwege zijn ziekte niet in staat is zelf het verzoek te doen, kan de burgemeester
      namens hem het verzoek doen indien de continuïteit van het gemeentelijk bestuur dringend vereist dat in vervanging
      van de wethouder wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45
  - number: '45.4'
    text: Het verlof eindigt op de dag waarop zestien weken zijn verstreken sinds de dag waarop het verlof is ingegaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45
  - number: '45.5'
    text: Aan een wethouder wordt gedurende de zittingsperiode van de raad ten hoogste drie maal verlof verleend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45
  - number: 45a.1
    text: |-
      Het college beslist zo spoedig mogelijk op een verzoek tot verlof, doch uiterlijk op de veertiende dag na indiening
      van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45a
  - number: 45a.2
    text: |-
      De beslissing geschiedt in overeenstemming met de verklaring van de arts of verloskundige en bevat de dag waarop
      het verlof ingaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45a
  - number: 45b.1
    text: |-
      De raad kan een vervanger benoemen voor de wethouder die met verlof is gegaan.
      [Artikel 36, eerste en derde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '36'
        hoofdstuk: III
  - number: 45b.2
    text: |-
      De vervanger is van rechtswege ontslagen met ingang van de dag waarop zestien weken zijn verstreken sinds de dag
      waarop het verlof is ingegaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45b
  - number: 45b.3
    text: |-
      Indien de vervanger voor het einde van het verlof ontslag neemt of door de raad wordt ontslagen, kan de raad voor
      de resterende duur van het verlof een vervanger benoemen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel45b
  - number: '46.1'
    text: |-
      Indien degene wiens benoeming tot wethouder is ingegaan, een functie bekleedt als bedoeld in
      [artikel 36b, eerste lid, en het tweede of derde lid][ref1] van dat artikel niet van toepassing zijn, draagt hij er
      onverwijld zorg voor dat hij uit die functie wordt ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 36b
        hoofdstuk: III
  - number: '46.2'
    text: De raad verleent hem ontslag indien hij dit nalaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel46
  - number: '46.3'
    text: Het ontslag gaat in terstond na de bekendmaking van het ontslagbesluit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel46
  - number: '46.4'
    text: |-
      In het geval, bedoeld in het tweede lid, is [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '47.1'
    text: |-
      Indien een wethouder niet langer voldoet aan de vereisten voor het wethouderschap, bedoeld
      in [artikel 36a][ref1], eerste en tweede lid, of een functie gaat bekleden als bedoeld in
      [artikel 36b, eerste lid, en het tweede of derde lid][ref2] van dat artikel niet van toepassing zijn, neemt hij
      onmiddellijk ontslag. Hij doet hiervan schriftelijk mededeling aan de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel36b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 36a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 36b
        hoofdstuk: III
  - number: '47.2'
    text: |-
      [Artikel 46, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel46
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '46'
        hoofdstuk: III
  - number: '49'
    text: |-
      Indien een uitspraak van de raad inhoudende de opzegging van zijn vertrouwen in een wethouder er niet toe leidt
      dat de betrokken wethouder onmiddellijk ontslag neemt, kan de raad besluiten tot ontslag. Op het ontslagbesluit is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '50'
    text: |-
      De rechter treedt niet in de beoordeling van de gronden waarop de raad tot ontslag van een wethouder heeft
      besloten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel50
  - number: '52'
    text: |-
      Het college stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast, dat aan de raad
      wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel52
  - number: '53.1'
    text: |-
      De burgemeester stelt, met inachtneming van hetgeen het college heeft bepaald, dag en plaats van de vergadering van
      het college en het tijdstip van de opening vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel53
  - number: '53.2'
    text: De burgemeester maakt dag en plaats van te houden openbare vergaderingen en het tijdstip van de opening bekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel53
  - number: 53a.1
    text: De burgemeester bevordert de eenheid van het collegebeleid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel53a
  - number: 53a.2
    text: De burgemeester kan onderwerpen aan de agenda voor een vergadering van het college toevoegen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel53a
  - number: 53a.3
    text: De burgemeester kan ten aanzien van geagendeerde onderwerpen een eigen voorstel aan het college voorleggen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel53a
  - number: '54.1'
    text: |-
      De vergaderingen van het college worden met gesloten deuren gehouden, voor zover het college niet anders heeft
      bepaald.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel54
  - number: '54.2'
    text: |-
      Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      het college.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel54
  - number: '55.1'
    text: |-
      Het college kan op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1],
      omtrent het in een besloten vergadering behandelde en omtrent de inhoud van de stukken die aan het college worden
      overgelegd, geheimhouding opleggen. Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens
      die vergadering opgelegd. De geheimhouding wordt door hen die bij de behandeling aanwezig waren en allen die van
      het behandelde of de stukken kennis dragen, in acht genomen totdat het college haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '55.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door de burgemeester of een commissie, ten aanzien van de stukken die zij aan het college
      overleggen. Daarvan wordt op de stukken melding gemaakt. De geheimhouding wordt in acht genomen totdat het orgaan
      dat de verplichting heeft opgelegd, dan wel de raad haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '55.3'
    text: |-
      Indien het college zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot de raad
      heeft gericht, wordt de geheimhouding in acht genomen totdat de raad haar opheft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel55
  - number: '56.1'
    text: |-
      In de vergadering van het college kan slechts worden beraadslaagd of besloten, indien ten minste de helft van het
      aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel56
  - number: '56.2'
    text: |-
      Indien het vereiste aantal leden niet tegenwoordig is, belegt de burgemeester, onder verwijzing naar dit artikel,
      opnieuw een vergadering.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel56
  - number: '56.3'
    text: |-
      Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Het college kan echter over
      andere aangelegenheden dan die waarvoor de eerdere vergadering was belegd alleen beraadslagen of besluiten, indien
      ten minste de helft van het aantal zitting hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel56
  - number: '57'
    text: |-
      De leden van het college en andere personen die deelnemen aan de beraadslaging kunnen niet in rechte worden
      vervolgd of aangesproken voor hetgeen zij in de vergadering van het college hebben gezegd of aan het college
      schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel57
  - number: '58'
    text: |-
      De [artikelen 28, eerste tot en met derde lid][ref1], [29][ref2] en [30][ref3] zijn ten aanzien van de
      vergaderingen van het college van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel30
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '28'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '29'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '30'
        hoofdstuk: II
  - number: '59.1'
    text: |-
      Indien bij een stemming, anders dan over personen voor het doen van benoemingen, voordrachten of aanbevelingen, de
      stemmen staken, wordt opnieuw gestemd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel59
  - number: '59.2'
    text: Staken de stemmen andermaal over hetzelfde voorstel, dan beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel59
  - number: 59a.1
    text: |-
      De stukken die van het college uitgaan, worden door de burgemeester ondertekend en door de secretaris
      medeondertekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel59a
  - number: 59a.2
    text: |-
      Het college van burgemeester en wethouders kan hem toestaan de ondertekening op te dragen aan een ander lid van het
      college, aan de secretaris of aan een of meer andere gemeenteambtenaren.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel59a
  - number: 59a.3
    text: |-
      De medeondertekening door de secretaris is niet van toepassing indien de ondertekening van stukken die van het
      college uitgaan ingevolge het tweede lid is opgedragen aan de secretaris of een of meer andere gemeenteambtenaren.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel59a
  - number: '60.1'
    text: |-
      De raad kan regelen van welke beslissingen van het college aan de leden van de raad kennisgeving wordt gedaan.
      Daarbij kan de raad de gevallen bepalen waarin met terinzagelegging kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel60
  - number: '60.2'
    text: |-
      Het college laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel60
  - number: '60.3'
    text: |-
      Het college maakt de besluitenlijst van zijn vergaderingen op de in de gemeente gebruikelijke wijze openbaar. Het
      college laat de openbaarmaking achterwege voor zover het aangelegenheden betreft ten aanzien waarvan op grond van
      [artikel 55][ref1] geheimhouding is opgelegd of ten aanzien waarvan openbaarmaking in strijd is met het openbaar
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel55
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '55'
        hoofdstuk: III
  - number: '61.1'
    text: De burgemeester wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor de tijd van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.2'
    text: |-
      De commissaris van de Koning overlegt met de raad over de eisen die aan de te benoemen burgemeester worden gesteld
      met betrekking tot de vervulling van het ambt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.3'
    text: |-
      Na het overleg met de commissaris stelt de raad uit zijn midden een vertrouwenscommissie in, belast met
      de beoordeling van de kandidaten. De raad kan bepalen dat één of meer wethouders als adviseur aan de
      vertrouwenscommissie worden toegevoegd. De commissaris verschaft de vertrouwenscommissie een opgave van degenen
      die naar het ambt van burgemeester hebben gesolliciteerd, vergezeld van zijn oordeel over kandidaten die hij
      in beginsel geschikt acht voor benoeming. Als de vertrouwenscommissie besluit naast deze kandidaten ook andere
      kandidaten die gesolliciteerd hebben, bij haar beoordeling te betrekken, doet zij daarvan onverwijld mededeling aan
      de commissaris. Deze brengt zijn oordeel over laatstgenoemde kandidaten ter kennis van de vertrouwenscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.4'
    text: |-
      De vertrouwenscommissie verschaft zich door tussenkomst van de commissaris de door haar nodig geachte informatie
      over de kandidaten. Bestuursorganen zijn verplicht de gevraagde informatie te verstrekken. De vertrouwenscommissie
      brengt verslag uit van haar bevindingen aan de raad en aan de commissaris.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.5'
    text: |-
      De raad zendt Onze Minister binnen vier maanden nadat de gelegenheid tot sollicitatie voor de functie is gegeven
      een aanbeveling inzake de benoeming. Deze aanbeveling omvat twee personen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.6'
    text: |-
      In een bijzonder, door de raad te motiveren geval, kan worden volstaan met een aanbeveling waarop één persoon
      vermeld staat. Onze Minister slaat geen acht op een enkelvoudige aanbeveling, indien naar zijn oordeel geen sprake
      is van een bijzonder geval.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: '61.7'
    text: |-
      Onze Minister volgt in zijn voordracht in beginsel de aanbeveling, met inbegrip van de daarop gehanteerde volgorde,
      tenzij zwaarwegende gronden aanleiding tot afwijking geven. Een afwijking wordt gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61
  - number: 61a.1
    text: |-
      De burgemeester kan bij koninklijk besluit op voordracht van Onze Minister worden herbenoemd voor de tijd van zes
      jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61a
  - number: 61a.2
    text: |-
      De raad zendt een aanbeveling inzake de herbenoeming van de burgemeester tenminste vier maanden voor de eerste dag
      van de maand waarin de herbenoeming dient in te gaan, aan Onze Minister door tussenkomst van de commissaris van
      de Koning.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61a
  - number: 61a.3
    text: Voordat de raad een aanbeveling opstelt, overlegt hij met de commissaris over het functioneren van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61a
  - number: 61a.4
    text: De commissaris brengt advies uit aan Onze Minister over de aanbeveling van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61a
  - number: 61a.5
    text: |-
      Onze Minister wijkt in zijn voordracht slechts af van de aanbeveling op gronden ontleend aan het advies van de
      commissaris dan wel op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61a
  - number: 61b.1
    text: De burgemeester kan te allen tijde bij koninklijk besluit op voordracht van Onze Minister worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.2
    text: |-
      Indien sprake is van een verstoorde verhouding tussen de burgemeester en de raad, kan de raad, door tussenkomst van
      de commissaris van de Koning, een aanbeveling tot ontslag zenden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.3
    text: |-
      Voordat de raad verklaart dat van een verstoorde verhouding tussen de burgemeester en de raad sprake is, overlegt
      hij met de commissaris over de aanleiding tot die verklaring.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.4
    text: |-
      Een aanbeveling vormt geen onderwerp van beraadslagingen en wordt niet vastgesteld dan nadat de raad tenminste twee
      weken en ten hoogste drie maanden tevoren heeft verklaard, dat tussen de burgemeester en de raad sprake is van een
      verstoorde verhouding.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.5
    text: |-
      De oproeping tot de vergadering waarin over de aanbeveling wordt beraadslaagd of besloten, wordt tenminste
      achtenveertig uur voor de aanvang of zoveel eerder als de raad heeft bepaald, bij de leden van de raad bezorgd. Zij
      vermeldt het voorstel tot de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.6
    text: De commissaris brengt advies uit aan Onze Minister over de aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61b.7
    text: |-
      Onze Minister wijkt in zijn voordracht slechts af van de aanbeveling op gronden ontleend aan het advies van de
      commissaris dan wel op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61b
  - number: 61c.1
    text: |-
      De beraadslagingen, bedoeld in de [artikelen 61, derde en vierde lid][ref1], [61a, derde lid][ref2], en
      [61b, derde lid][ref3], vinden plaats met gesloten deuren. Van deze beraadslagingen wordt een afzonderlijk verslag
      opgemaakt dat niet openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel61b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 61a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 61b
        hoofdstuk: IV
  - number: 61c.2
    text: |-
      Ten aanzien van de beraadslagingen en de stukken die aan de raad worden gezonden dan wel die door de raad aan Onze
      Minister worden gezonden geldt een geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61c
  - number: 61c.3
    text: |-
      De aanbevelingen van de raad, bedoeld in [artikel 61, vijfde en zesde lid][ref1], [61a, tweede lid][ref2], en
      [ 61b, tweede lid][ref3], zijn openbaar met dien verstande dat ten aanzien van de aanbeveling inzake de benoeming,
      bedoeld in [artikel 61, vijfde lid][ref4], de openbaarheid uitsluitend de als eerste aanbevolen persoon geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel61b
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel61
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 61a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 61b
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '61'
        hoofdstuk: IV
  - number: 61d.1
    text: |-
      De commissaris verricht de werkzaamheden, genoemd in de [artikelen 61][ref1], [61a][ref2] en [61b][ref3], volgens
      een door de regering gegeven ambtsinstructie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel61a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel61b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 61a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 61b
        hoofdstuk: IV
  - number: 61d.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de bij benoeming, herbenoeming en
      ontslag van de burgemeester te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel61d
  - number: '62.1'
    text: De burgemeester kan bij koninklijk besluit worden geschorst.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel62
  - number: '62.2'
    text: |-
      Onze Minister kan, in afwachting van een besluit omtrent schorsing, bepalen dat de burgemeester zijn functie niet
      uitoefent.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel62
  - number: '62.3'
    text: |-
      Een besluit als bedoeld in het tweede lid vervalt, indien niet binnen een maand een besluit omtrent de schorsing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel62
  - number: '63'
    text: Voor de benoembaarheid tot burgemeester is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel63
  - number: '64'
    text: |-
      Dezelfde persoon kan in meer dan een gemeente tot burgemeester worden benoemd, mits op het tijdstip van benoeming
      het gezamenlijk aantal inwoners het getal van 10 000 niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel64
  - number: '65.1'
    text: |-
      Alvorens zijn ambt te aanvaarden, legt de burgemeester in handen van de commissaris van de Koning de volgende
      eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot burgemeester benoemd te worden, rechtstreeks
      noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd. Ik zweer
      (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig geschenk
      of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1],
      dat ik de wetten zal nakomen en dat ik mijn plichten als burgemeester naar eer en geweten zal vervullen. Zo
      waarlijk helpe mij God Almachtig!" (Dat verklaar en beloof ik!")


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '65.2'
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta boargemaster beneamd te wurden,
      streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.
      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze sil oan 'e
      [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as boargemaster yn alle oprjochtens ferfolje
      sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '66.1'
    text: |-
      De burgemeester geniet ten laste van de gemeente een bezoldiging, die bij of krachtens algemene maatregel van
      bestuur wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '66.2'
    text: |-
      Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van bijzondere kosten en
      betreffende andere financiële voorzieningen die verband houden met de vervulling van het burgemeestersambt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '66.3'
    text: |-
      Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de burgemeester als zodanig geen inkomsten, in
      welke vorm ook, ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '66.4'
    text: |-
      De burgemeester geniet geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht in nevenfuncties welke
      hij vervult uit hoofde van het burgemeestersambt, ongeacht of die vergoedingen ten laste van de gemeente komen of
      niet. Indien deze vergoedingen worden uitgekeerd, worden zij gestort in de gemeentekas.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '66.5'
    text: |-
      Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      de burgemeester neerlegt bij beëindiging van het ambt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '66.6'
    text: |-
      Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004939
        artikel: '3'
  - number: '66.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop de burgemeester gegevens over de
      inkomsten, bedoeld in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel66
  - number: '67.1'
    text: |-
      De burgemeester vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van zijn burgemeestersambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel67
  - number: '67.2'
    text: |-
      De burgemeester meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van zijn
      burgemeestersambt, aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel67
  - number: '67.3'
    text: |-
      De burgemeester maakt nevenfuncties, anders dan uit hoofde van zijn burgemeestersambt, en de inkomsten uit die
      functies openbaar. Openbaarmaking geschiedt door terinzagelegging op het gemeentehuis uiterlijk op 1 april na het
      kalenderjaar waarin de inkomsten zijn genoten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel67
  - number: '67.4'
    text: |-
      Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '68.1'
    text: 'De burgemeester is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 68.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.h
    text: gedeputeerde;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.i
    text: secretaris van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.j
    text: griffier van de provincie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.k
    text: lid van de rekenkamer van de provincie waarin de gemeente waar hij burgemeester is, is gelegen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.l
    text: lid van een raad;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.m
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.n
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.o
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 81p, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81p
        hoofdstuk: IVc
        paragraaf: '1'
  - number: 68.1.p
    text: lid van een deelraad;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.q
    text: lid van het dagelijks bestuur van een deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.r
    text: ambtenaar, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.s
    text: |-
      ambtenaar, door of vanwege het Rijk of de provincie aangesteld, tot wiens taak behoort het verrichten van
      werkzaamheden in het kader van het toezicht op de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: 68.1.t
    text: functionaris die krachtens de wet of een algemene maatregel van bestuur het gemeentebestuur van advies dient.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: '68.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onder r, kan een burgemeester tevens ambtenaar van de burgerlijke stand
      zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel68
  - number: '69.1'
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de burgemeester met dien verstande
      dat de ontheffing, bedoeld in het tweede lid van dat artikel, wordt verleend door de commissaris van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: '69.2'
    text: De raad stelt voor de burgemeester een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel69
  - number: '70'
    text: |-
      Het ambt van burgemeester ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel70
  - number: '71.1'
    text: |-
      De burgemeester heeft zijn werkelijke woonplaats in de gemeente of, indien hij burgemeester is van meer dan een
      gemeente, in een van die gemeenten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel71
  - number: '71.2'
    text: |-
      De raad kan voor ten hoogste een jaar ontheffing verlenen van de verplichting om de werkelijke woonplaats in de
      gemeente te hebben.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel71
  - number: '72.1'
    text: |-
      Indien de burgemeester langer dan zes weken buiten de gemeente wenst te verblijven, behoeft hij daartoe de
      toestemming van de commissaris. De toestemming mag alleen worden verleend, indien het belang van de gemeente zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel72
  - number: '72.2'
    text: |-
      De [Algemene Termijnenwet][ref1] (*Stb.* 1964, 314) is niet van toepassing op de termijn genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '73.1'
    text: |-
      Voor zover dit niet bij de wet is geschied, worden bij of krachtens algemene maatregel van bestuur ten aanzien van
      de burgemeester regels vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.a
    text: benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.b
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.c
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.d
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.e
    text: georganiseerd overleg over aangelegenheden zijn rechtspositie betreffende;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: 73.1.f
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: '73.2'
    text: |-
      Bij de regels betreffende de in het eerste lid bedoelde aangelegenheden kunnen financiële voorzieningen worden
      getroffen die ten laste van de gemeente komen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel73
  - number: '74.1'
    text: Alle aan de raad of aan het college gerichte stukken worden door of namens de burgemeester geopend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel74
  - number: '74.2'
    text: |-
      Van de ontvangst van aan de raad gerichte stukken die niet terstond in de vergadering van de raad aan de orde
      worden gesteld, doet hij in de eerstvolgende vergadering van de raad mededeling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel74
  - number: '76'
    text: |-
      Bij koninklijk besluit wordt bepaald, welke de onderscheidingstekenen van de burgemeester zijn en bij welke
      gelegenheden hij deze zal dragen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel76
  - number: '77.1'
    text: |-
      Bij verhindering of ontstentenis van de burgemeester wordt zijn ambt waargenomen door een door het college aan te
      wijzen wethouder. Het voorzitterschap van de raad wordt in dat geval waargenomen door het langstzittende lid van
      de raad. Indien meer leden van de raad even lang zitting hebben, vindt de waarneming plaats door het oudste lid in
      jaren van hen. De raad kan een ander lid van de raad met de waarneming belasten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel77
  - number: '77.2'
    text: |-
      Bij verhindering of ontstentenis van alle wethouders wordt het ambt waargenomen door het langstzittende lid van
      de raad. Indien meer leden van de raad even lang zitting hebben, vindt de waarneming plaats door het oudste lid in
      jaren van hen. De raad kan een ander lid van de raad met de waarneming belasten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel77
  - number: '78.1'
    text: |-
      Indien de commissaris van de Koning het in het belang van de gemeente nodig oordeelt, voorziet hij in afwijking
      van [artikel 77][ref1] in de waarneming. Alvorens daartoe over te gaan hoort hij de raad, tenzij gewichtige redenen
      zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel77
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '77'
        hoofdstuk: IV
  - number: '78.2'
    text: |-
      Hij die door de commissaris met de waarneming van het ambt van burgemeester is belast, legt in handen van de
      commissaris een overeenkomstig [artikel 65][ref1] luidende eed (verklaring en belofte) af.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel65
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '65'
        hoofdstuk: IV
  - number: '79'
    text: |-
      De toekenning van een vergoeding ten laste van de gemeente aan degene die met de waarneming van het ambt van
      burgemeester is belast, wordt geregeld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel79
  - number: '80'
    text: |-
      Ten aanzien van degene die met de waarneming van het ambt van burgemeester is belast, zijn de [artikelen 68][ref1]
      en [69][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel69
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '68'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '69'
        hoofdstuk: IV
  - number: '81.1'
    text: |-
      De raad kan regelen van welke beslissingen van de burgemeester aan de leden van de raad kennisgeving wordt gedaan.
      Daarbij kan de raad de gevallen bepalen waarin met terinzagelegging kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81
  - number: '81.2'
    text: |-
      De burgemeester laat de kennisgeving of terinzagelegging achterwege voor zover deze in strijd is met het openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81
  - number: 81a.1
    text: De raad kan een rekenkamer instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81a
  - number: 81a.2
    text: |-
      Indien de raad een rekenkamer instelt, zijn de navolgende artikelen van dit hoofdstuk alsmede [hoofdstuk XIa][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXIa
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XIa
  - number: 81a.3
    text: |-
      Indien de raad geen rekenkamer instelt, is [hoofdstuk IVb][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukIVb
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: IVb
  - number: 81b
    text: De raad stelt het aantal leden van de rekenkamer vast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81b
  - number: 81c.1
    text: De raad benoemt de leden van de rekenkamer voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.2
    text: Indien de rekenkamer uit twee of meer leden bestaat, benoemt de raad uit de leden de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.3
    text: |-
      De raad kan plaatsvervangende leden benoemen. Indien de rekenkamer uit één lid bestaat, benoemt de raad in ieder
      geval een plaatsvervangend lid. Deze paragraaf is op plaatsvervangende leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.4
    text: De raad kan een lid herbenoemen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.5
    text: |-
      Voorafgaand aan de benoemingen, bedoeld in het eerste tot en met het vierde lid, pleegt de raad overleg met de
      rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6
    text: 'Een lid van de rekenkamer wordt door de raad ontslagen:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6.b
    text: bij de aanvaarding van een functie die onverenigbaar is met het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6.c
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6.d
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.6.e
    text: indien hij naar het oordeel van de raad ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.7
    text: 'Een lid van de rekenkamer kan door de raad worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.7.a
    text: indien hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
  - number: 81c.7.b
    text: |-
      indien hij handelt in strijd met [artikel 81h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81h
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81h
        hoofdstuk: IVa
        paragraaf: '1'
  - number: 81d.1
    text: 'De raad stelt een lid van de rekenkamer op non-activiteit indien:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
  - number: 81d.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
  - number: 81d.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
  - number: 81d.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, surséance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
  - number: 81d.2
    text: |-
      De raad kan een lid van de rekenkamer op non-activiteit stellen, indien tegen hem een gerechtelijk
      onderzoek ter zake van een misdrijf wordt ingesteld of indien er een ander ernstig vermoeden is
      van het bestaan van feiten en omstandigheden die tot ontslag, anders dan op gronden vermeld in
      [artikel 81c, zesde lid, onder a, en zevende lid, onder a][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81c
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81c
        hoofdstuk: IVa
        paragraaf: '1'
  - number: 81d.3
    text: |-
      De raad beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen, met dien verstande dat in een
      geval als bedoeld in het tweede lid de non-activiteit in ieder geval eindigt na zes maanden. In dat geval kan de
      raad de maatregel telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81d
  - number: 81e
    text: |-
      [Artikel 12][ref1] is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel12
