    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: 90.2.a
    text: ambtenaar, aangesteld of ondergeschikt aan een deelgemeentebestuur van een andere deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: 90.2.b
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: 90.2.c
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: 90.2.d
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: '90.3'
    text: |-
      In de in [artikel 87, tweede lid][ref1], bedoelde verordening kan worden bepaald dat in afwijking van het eerste
      lid, aanhef en onder q, een lid van het dagelijks bestuur van een deelgemeente tevens lid van een deelraad van de
      betrokken deelgemeente kan zijn gedurende het tijdvak dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel87
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: 90.3.a
    text: |-
      aanvangt op de dag van de stemming voor de verkiezing van de leden van de deelraad en eindigt op het tijdstip
      waarop de leden van het dagelijks bestuur van een deelgemeente aftreden, of
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
  - number: 90.3.b
    text: |-
      aanvangt op het tijdstip van zijn benoeming tot lid van het dagelijks bestuur van een deelgemeente en eindigt op
      het tijdstip waarop zijn opvolger als lid van de deelraad de eed of de verklaring en belofte heeft afgelegd of
      waarop vaststaat dat geen opvolger kan worden benoemd. In dat geval bepaalt de verordening tevens dat hij geacht
      wordt ontslag te nemen als lid van de deelraad met ingang van het tijdstip waarop hij zijn benoeming tot lid van
      het dagelijks bestuur aanvaardt en dat [artikel X 6 van de Kieswet][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_6
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_6
  - number: '90.4'
    text: |-
      [Artikel 36a][ref1] is van overeenkomstige toepassing op de leden van het dagelijks bestuur van een deelgemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 36a
        hoofdstuk: III
  - number: '91'
    text: |-
      De [artikelen 12][ref1], [14][ref2], [15][ref3], [41a tot en met 52][ref4] en [53a tot en met 60][ref5] zijn van
      overeenkomstige toepassing op het deelgemeentebestuur, met dien verstande dat in [artikel 15, eerste lid][ref6],
      voor «gemeente» zowel de gemeente als de deelgemeente wordt gelezen en voor «gemeentebestuur» zowel het
      gemeentebestuur als het deelgemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '14'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '42'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '54'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: '92.1'
    text: |-
      Een deelraad brengt dag, tijdstip en plaats van zijn vergadering ter openbare kennis. De agenda en de daarbij
      horende voorstellen, met uitzondering van de in [artikel 86, tweede lid][ref1], bedoelde stukken, worden
      gelijktijdig met de oproeping voor de vergadering en op een bij de openbare kennisgeving aan te geven wijze ter
      inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: '92.2'
    text: |-
      De [artikelen 22][ref1], [ 23][ref2], [24][ref3] en [86][ref4] zijn van overeenkomstige toepassing op een deelraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '23'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '24'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: '95.1'
    text: |-
      De leden van de raad en de deelraad en de leden van de raad en de deelraad aan wie ingevolge
      [artikel X 10 van de Kieswet][ref1] ontslag is verleend wegens zwangerschap en bevalling of ziekte ontvangen een
      bij verordening van de raad vast te stellen vergoeding voor hun werkzaamheden en een tegemoetkoming in de kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_10
  - number: '95.2'
    text: |-
      De raad kan bij verordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere kosten en
      over andere financiële voorzieningen die verband houden met de vervulling van het lidmaatschap van de raad of de
      deelraad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel95
  - number: '95.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een lid van de raad of de deelraad dat met inachtneming van
      [artikel 13, tweede lid][ref1], onderscheidenlijk [artikel 89, derde lid][ref2], tevens wethouder onderscheidenlijk
      lid van het dagelijks bestuur van een deelgemeente is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel89
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
  - number: '95.4'
    text: |-
      De verordeningen, bedoeld in het eerste en tweede lid, worden vastgesteld overeenkomstig bij of krachtens algemene
      maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel95
  - number: '96.1'
    text: |-
      De leden van een door de raad, het college of de burgemeester ingestelde commissie ontvangen, voor zover zij geen
      lid zijn van de raad of het college, een bij verordening van de raad vastgestelde vergoeding:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel96
  - number: 96.1.a
    text: voor het bijwonen van vergaderingen van een commissie en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel96
  - number: 96.1.b
    text: van reis- en verblijfkosten in verband met reizen binnen de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel96
  - number: '96.2'
    text: |-
      In bijzondere gevallen kan de raad bij verordening bepalen dat de leden van het dagelijks bestuur van een
      bestuurscommissie of een andere commissie als bedoeld in [artikel 84][ref1] een vaste vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de kosten ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel84
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '84'
        hoofdstuk: V
        paragraaf: '1'
  - number: '96.3'
    text: |-
      Ten aanzien van de vergoeding, bedoeld in het eerste lid, onderdeel a, wordt bij of krachtens algemene maatregel
      van bestuur nadere regels gesteld. Ten aanzien van de overige vergoedingen bedoeld in dit artikel kunnen bij of
      krachtens algemene maatregel van bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel96
  - number: '97'
    text: |-
      Aan de leden van de raad en de personen genoemd in [artikel 96, eerste lid][ref1], vindt vergoeding van reis-
      en verblijfkosten, gemaakt in verband met reizen buiten het grondgebied van de gemeente ter uitvoering van een
      beslissing van het gemeentebestuur, slechts plaats overeenkomstig door de raad bij verordening vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel96
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '96'
        hoofdstuk: VI
  - number: '98'
    text: |-
      De verordeningen bedoeld in de [artikelen 95 tot en met 97][ref1] worden aan gedeputeerde staten gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel95
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '95'
        hoofdstuk: VI
  - number: '99.1'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van de raad, van een door de raad, het
      college of de burgemeester ingestelde commissie, van een deelraad en van het dagelijks bestuur van een deelgemeente
      als zodanig geen andere vergoedingen en tegemoetkomingen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel99
  - number: '99.2'
    text: |-
      Voordelen ten laste van de gemeente, anders dan in de vorm van vergoedingen en tegemoetkoming, genieten zij slechts
      voor zover de raad dit bij verordening bepaalt. De verordening behoeft de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel99
  - number: '100.1'
    text: In iedere gemeente is een secretaris en een griffier.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel100
  - number: '100.2'
    text: Een secretaris is niet tevens griffier.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel100
  - number: '101'
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de secretaris en de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: '102'
    text: Het college benoemt de secretaris. Hij is tevens bevoegd de secretaris te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel102
  - number: '103.1'
    text: |-
      De secretaris staat het college, de burgemeester en de door hen ingestelde commissies bij de uitoefening van hun
      taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel103
  - number: '103.2'
    text: Het college stelt in een instructie nadere regels over de taak en de bevoegdheden van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel103
  - number: '104'
    text: De secretaris is in de vergadering van het college aanwezig.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel104
  - number: '106.1'
    text: Het college regelt de vervanging van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel106
  - number: '106.2'
    text: |-
      De [artikelen 100, tweede lid, tot en met 105][ref1] zijn van overeenkomstige toepassing op degene die de
      secretaris vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '107'
    text: De raad benoemt de griffier. Hij is tevens bevoegd de griffier te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107
  - number: 107a.1
    text: De griffier staat de raad en de door de raad ingestelde commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107a
  - number: 107a.2
    text: De raad stelt in een instructie nadere regels over de taak en de bevoegdheden van de griffier.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107a
  - number: 107b
    text: De griffier is in de vergadering van de raad aanwezig.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107b
  - number: 107d.1
    text: De raad regelt de vervanging van de griffier.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107d
  - number: 107d.2
    text: |-
      De [artikelen 100, tweede lid][ref1], [101][ref2] en [107 tot en met 107c][ref3] zijn van overeenkomstige
      toepassing op degene die de griffier vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel107
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '101'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '107'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 107e.1
    text: De raad kan regels stellen over de organisatie van de griffie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107e
  - number: 107e.2
    text: De raad is bevoegd de op de griffie werkzame ambtenaren te benoemen, te schorsen en te ontslaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel107e
  - number: '108.1'
    text: |-
      De bevoegdheid tot regeling en bestuur inzake de huishouding van de gemeente wordt aan het gemeentebestuur
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel108
  - number: '108.2'
    text: |-
      Regeling en bestuur kunnen van het gemeentebestuur worden gevorderd bij of krachtens een andere dan deze wet ter
      verzekering van de uitvoering daarvan, met dien verstande dat het geven van aanwijzingen aan het gemeentebestuur en
      het aan het gemeentebestuur opleggen of in zijn plaats vaststellen van beslissingen, slechts kan geschieden indien
      de bevoegdheid daartoe bij de wet of krachtens de wet bij provinciale verordening is toegekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel108
  - number: '108.3'
    text: |-
      Onverminderd het bepaalde in de [artikelen 110, vijfde lid][ref1], [119, vierde lid][ref2] en
      [120, tweede lid][ref3], worden de kosten, verbonden aan de uitvoering van het tweede lid, voor zover zij ten laste
      van de betrokken gemeenten blijven, door het Rijk aan hen vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel120
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '119'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '120'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '109'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen gemeenten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel109
  - number: '110.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: 110.1.a
    text: |-
      plan: een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het
      gemeentebestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: 110.1.b
    text: |-
      beleidsverslag: een schriftelijke rapportage betreffende het door het gemeentebestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: '110.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het gemeentebestuur slechts worden gevorderd in bij de wet te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: '110.3'
    text: Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: '110.4'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier
      jaar van het gemeentebestuur worden gevraagd als onderdeel van de regeling van een tijdelijke specifieke uitkering
      als bedoeld in [artikel 17 van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '17'
  - number: '110.5'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van de voorgeschreven
      procedure wordt van een gemeentebestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor de gemeente worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
  - number: '110.6'
    text: |-
      Dit artikel is niet van toepassing op de begroting, bedoeld in [artikel 190][ref1], en op de jaarrekening en het
      jaarverslag, bedoeld in [artikel 197][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '111.1'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 111.1.a
    text: |-
      dit noodzakelijk is uit een oogpunt van afstemming tussen gemeentelijk beleid en het beleid van de betrokken
      provincie of het Rijk, of
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: 111.1.b
    text: de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: '111.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt niet gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 111.2.a
    text: het gemeentebestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: 111.2.b
    text: |-
      de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen op
      de voor het betrokken beleidsterrein beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: 111.2.c
    text: |-
      integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting, bedoeld in
      [artikel 190][ref1], of de jaarrekening en het jaarverslag, bedoeld in [artikel 197][ref2], mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 111.2.d
    text: |-
      het bevorderen van de samenhang in het gemeentelijk beleid door onderlinge afstemming van onderdelen daarvan
      onmogelijk wordt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: 111.2.e
    text: het uitsluitend dient tot het verkrijgen van informatie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
  - number: '111.3'
    text: |-
      Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een
      plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding daarvan volgen van een
      voorgeschreven procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens [artikel 110][ref2] en
      dit artikel, wordt die afwijking gemotiveerd in de bij het voorstel behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '112'
    text: |-
      Onze Minister wie het aangaat en het provinciebestuur doen het college desgevraagd mededeling van hun standpunten
      en voornemens met betrekking tot aangelegenheden die voor de gemeente van belang zijn, tenzij het openbaar belang
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel112
  - number: '113'
    text: |-
      Onze Minister wie het aangaat en het provinciebestuur bieden het college desgevraagd de gelegenheid tot het plegen
      van overleg met betrekking tot aangelegenheden die voor de gemeente van belang zijn, tenzij het openbaar belang
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel113
  - number: '114.1'
    text: |-
      Onze Minister wie het aangaat, onderscheidenlijk het provinciebestuur, stelt de betrokken colleges of een
      instantie die voor deze representatief kan worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid
      hun oordeel te geven omtrent voorstellen van wet, ontwerpen van algemene maatregel van bestuur, ontwerpen van
      ministeriële regeling, of ontwerpen van provinciale verordening waarbij:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel114
  - number: 114.1.a
    text: van de gemeentebesturen regeling of bestuur wordt gevorderd, of
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel114
  - number: 114.1.b
    text: in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van de gemeentebesturen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel114
  - number: '114.2'
    text: |-
      Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen
      voor de inrichting en werking van de gemeenten en een weergave van het in het eerste lid bedoelde oordeel van de
      betrokken colleges of representatieve instantie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister wie het aangaat, onderscheidenlijk het provinciebestuur, is niet verplicht vooraf het in het eerste
      lid bedoelde oordeel in te winnen indien zulks ten gevolge van dringende omstandigheden niet mogelijk is. In dat
      geval wordt het oordeel zo spoedig mogelijk ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel114
  - number: '115.1'
    text: |-
      Een wet waarbij van gemeentebesturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate wijziging
      wordt gebracht in taken en bevoegdheden van gemeentebesturen, wijkt van het bepaalde in deze wet niet af dan
      wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel115
  - number: '115.2'
    text: |-
      Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel115
  - number: '116.1'
    text: |-
      Onze Minister is belast met de coördinatie van het rijksbeleid dat de gemeenten raakt. Hij bevordert voorts de
      beleidsvrijheid van het gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel116
  - number: '116.2'
    text: |-
      Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de gemeenten treden Onze
      Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig stadium
      in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel116
  - number: '116.3'
    text: |-
      Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel116
  - number: '117.1'
    text: Onze Minister bevordert de decentralisatie ten behoeve van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel117
  - number: '117.2'
    text: |-
      Voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijks- of provinciaal beleid worden gerekend,
      worden slechts gedaan indien het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de
      gemeentebesturen kan worden behartigd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel117
  - number: '118'
    text: |-
      Over al hetgeen de gemeente betreft dient het college Onze Ministers en het provinciebestuur desgevraagd van
      bericht en raad, tenzij dit uitdrukkelijk van de burgemeester wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel118
  - number: '119.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin het college
      verplicht is tot het verstrekken van systematische informatie aan Onze Ministers wie het aangaat. Daarbij kan
      worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve van de toepassing van
      de wet of de algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel119
  - number: '119.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel119
  - number: '119.3'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel119
  - number: '119.4'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel119
  - number: '119.5'
    text: |-
      De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel119
  - number: '120.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur of bij provinciale verordening worden de gevallen
      geregeld waarin het college verplicht is tot het verstrekken van systematische informatie aan het provinciaal
      bestuur. Daarbij kan worden bepaald dat bij ministeriële regeling of bij besluit van gedeputeerde staten nadere
      voorschriften worden gegeven ten behoeve van de toepassing van de wet, de algemene maatregel van bestuur of de
      provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel120
  - number: '120.2'
    text: |-
      In de regelingen, bedoeld in de eerste volzin van het eerste lid, wordt tevens aangegeven hoe de financiële
      gevolgen van de informatieverstrekking voor de gemeente worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel120
  - number: '120.3'
    text: |-
      Het provinciebestuur doet mededeling aan Onze Minister van de inwinning van systematische informatie ingevolge een
      provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel120
  - number: '121'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp waarin door
      wetten, algemene maatregelen van bestuur of provinciale verordeningen is voorzien, gehandhaafd, voor zover de
      verordeningen met die wetten, algemene maatregelen van bestuur en provinciale verordeningen niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel121
  - number: '122'
    text: |-
      De bepalingen van gemeentelijke verordeningen in wier onderwerp door een wet, een algemene maatregel van bestuur of
      een provinciale verordening wordt voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel122
  - number: '123.1'
    text: |-
      Wanneer aan een bestuurscommissie of een deelraad bevoegdheden van de raad zijn overgedragen en deze commissie of
      die deelraad een bij of krachtens een andere dan deze wet gevorderde beslissing niet of niet naar behoren neemt,
      voorziet de raad daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel123
  - number: '123.2'
    text: |-
      Wanneer aan een bestuurscommissie of het dagelijks bestuur van een deelgemeente bevoegdheden van het college zijn
      overgedragen en deze commissie of dat dagelijks bestuur een bij of krachtens een andere dan deze wet gevorderde
      beslissing niet of niet naar behoren neemt, voorziet het college daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel123
  - number: '123.3'
    text: |-
      Wanneer aan een bestuurscommissie of de voorzitter van het dagelijks bestuur van een deelgemeente bevoegdheden
      van de burgemeester zijn overgedragen en die commissie of die voorzitter bij of krachtens een andere dan deze wet
      gevorderde beslissingen niet of niet naar behoren neemt, voorziet de burgemeester daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel123
  - number: '124.1'
    text: |-
      Wanneer de raad, het college of de burgemeester een bij of krachtens een andere dan deze wet gevorderde beslissing
      niet of niet naar behoren neemt dan wel bij of krachtens een andere dan deze wet gevorderde handeling niet of niet
      naar behoren verricht, of anderszins een bij of krachtens een andere dan deze wet gevorderd resultaat niet, niet
      tijdig of niet naar behoren tot stand brengt, besluiten gedeputeerde staten onderscheidenlijk de commissaris van de
      Koning als het de burgemeester betreft daarin namens de raad, het college of de burgemeester te voorzien ten laste
      van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124
  - number: '124.2'
    text: |-
      Spoedeisende gevallen uitgezonderd, voeren gedeputeerde staten of de commissaris van de Koning het besluit tot
      indeplaatsstelling niet uit dan nadat een in het besluit genoemde termijn is verstreken, waarbinnen de raad,
      het college of de burgemeester de gelegenheid heeft alsnog te voorzien in hetgeen het besluit vordert. Indien de
      situatie dermate spoedeisend is dat gedeputeerde staten of de commissaris van de Koning de beslissing om over te
      gaan tot indeplaatsstelling niet tevoren op schrift kan stellen, zorgen zij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124
  - number: '124.3'
    text: |-
      Indien het besluit tot indeplaatsstelling een bij of krachtens een andere dan deze wet gevorderd resultaat betreft
      dat niet tijdig tot stand zal worden gebracht, geven gedeputeerde staten of de commissaris van de Koning in het
      besluit tot indeplaatsstelling aan welke beslissingen, handelingen of resultaten moeten zijn uitgevoerd binnen de
      in het tweede lid bedoelde termijn. Gedeputeerde staten of de commissaris van de Koning kunnen voor verschillende
      beslissingen, handelingen of resultaten een verschillende termijn stellen. Indien de raad, het college
      onderscheidenlijk de burgemeester niet binnen die termijn heeft voorzien in hetgeen het besluit van hem vordert,
      voorzien gedeputeerde staten of de commissaris van de Koning verder in het tot stand brengen van het gevorderde
      resultaat.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124
  - number: '124.4'
    text: |-
      Van een besluit tot indeplaatsstelling, alsmede van het voornemen tot het nemen van een dergelijk besluit, wordt
      mededeling gedaan in een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze. Een afschrift
      van het besluit en van het voornemen wordt gezonden aan de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124
  - number: 124a.1
    text: |-
      In overeenstemming met Onze Minister, kan Onze Minister wie het aangaat, indien hij van oordeel is dat toepassing
      van [artikel 124, eerste lid][ref1], uit oogpunt van een zwaarwegend algemeen belang gewenst is, gedeputeerde
      staten onderscheidenlijk de commissaris van de Koning verzoeken toepassing te geven aan artikel 124, eerste
      lid. Een afschrift van het verzoek wordt gezonden aan de raad en provinciale staten. Indien gedeputeerde staten
      onderscheidenlijk de commissaris van de Koning niet binnen een door Onze Minister wie het aangaat gestelde termijn
      toepassing hebben gegeven aan artikel 124, eerste lid, gaat de bevoegdheid van artikel 124, eerste lid, over op
      Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 124a.2
    text: |-
      De [artikelen 124, tweede tot en met vierde lid][ref1],[124c][ref2], [124d][ref3], en [124f][ref4] zijn van
      overeenkomstige toepassing bij toepassing van artikel 124, eerste lid, door Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel124c
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel124d
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel124f
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 124c
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 124d
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 124f
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 124b.1
    text: |-
      Ter zake van de in de bijlage bij deze wet opgenomen wetten worden de bevoegdheden die in de [artikelen 124][ref1],
      [124c][ref2], [124d][ref3] en [artikel 124f][ref4] aan gedeputeerde staten onderscheidenlijk de commissaris van de
      Koning zijn toegekend, in zoverre in afwijking van die artikelen uitgeoefend door Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel124c
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel124d
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel124f
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 124c
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 124d
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 124f
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 124b.2
    text: |-
      Voorafgaand aan het nemen van een besluit tot indeplaatsstelling, informeert Onze Minister wie het aangaat
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124b
  - number: 124c.1
    text: |-
      Bij de uitvoering van het besluit tot indeplaatsstelling beschikken gedeputeerde staten onderscheidenlijk
      de commissaris van de Koning over de bevoegdheden waarover de raad, het college of de burgemeester bij of
      krachtens deze wet of de andere wet, bedoeld in [artikel 124, eerste lid][ref1], beschikt. In afwijking van
      [artikel 171, eerste lid][ref2], vertegenwoordigt de commissaris van de Koning de gemeente zonodig in en buiten
      rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel171
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '171'
        hoofdstuk: XI
  - number: 124c.2
    text: |-
      Voor zover het gemeentebestuur, had hij de bevoegdheden, bedoeld in het eerste lid, zelf uitgeoefend, de kosten van
      de uitvoering in rekening kan brengen bij derden, heeft hij bij die derden verhaal voor de door gedeputeerde staten
      onderscheidenlijk de commissaris van de Koning ten laste van de gemeente gebrachte kosten. Het gemeentebestuur kan
      het bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124c
  - number: 124d
    text: |-
      Gedeputeerde staten onderscheidenlijk de commissaris van de Koning, kunnen een besluit tot indeplaatsstelling
      intrekken, indien de raad, het college of de burgemeester voldoende aannemelijk maakt dat hij zonder voorbehoud zal
      voorzien in hetgeen het besluit van hem vordert.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124d
  - number: 124e
    text: |-
      Gedeputeerde staten, de commissaris van de Koning onderscheidenlijk Onze Minister wie het aangaat, bedoeld in
      [artikel 124b, eerste lid][ref1], kunnen ambtenaren aanwijzen ten behoeve van het toezicht op de uitvoering van
      de aan het gemeentebestuur bij of krachtens andere wet dan deze opgedragen taken. Deze ambtenaren beschikken
      over de bevoegdheden van de [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref2]. De
      [artikelen 5:12][ref3], [5:13][ref4] en [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124e
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 124b
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 124f.1
    text: |-
      Indien gedeputeerde staten onderscheidenlijk de commissaris van de Koning bij de uitvoering van het besluit
      tot indeplaatsstelling namens de raad, het college of de burgemeester een besluit nemen, kan voor de toepassing
      van [artikel 7:1 van de Algemene wet bestuursrecht][ref1] bezwaar worden gemaakt bij gedeputeerde staten
      onderscheidenlijk de commissaris van de Koning. Gedeputeerde staten beslissen onderscheidenlijk de commissaris van
      de Koning beslist op het bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 124f.2
    text: |-
      Gedeputeerde staten zijn onderscheidenlijk de commissaris van de Koning is de verwerende partij inzake een beroep
      tegen een namens de raad, het college of de burgemeester genomen besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124f
  - number: 124f.3
    text: Het gemeentebestuur kan geen beroep instellen tegen een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124f
  - number: 124g.1
    text: |-
      Het gemeentebestuur werkt mee met de uitvoering van een besluit tot indeplaatsstelling. Gedeputeerde staten, de
      commissaris van de Koning onderscheidenlijk Onze Minister wie het aangaat kunnen ter zake van de uitvoering van het
      besluit aanwijzingen geven. Het gemeentebestuur stelt op eerste vordering van gedeputeerde staten onderscheidenlijk
      de commissaris van de Koning, de voor de uitvoering van het besluit benodigde gemeenteambtenaren ter beschikking
      en verschaft op eerste vordering van gedeputeerde staten onderscheidenlijk de commissaris van de Koning, alle
      informatie die nodig is voor de uitvoering van het besluit tot indeplaatsstelling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124g
  - number: 124g.2
    text: |-
      Gedeputeerde staten, de commissaris van de Koning onderscheidenlijk Onze Minister wie het aangaat kunnen ambtenaren
      aanwijzen die ten behoeve van de uitvoering van een besluit tot indeplaatsstelling beschikken over de bevoegdheden
      van de [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1]. De [artikelen 5:12][ref2],
      [5:13][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing. Het
      gemeentebestuur verschaft de aangewezen ambtenaren desgevraagd de faciliteiten die zij nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 124h
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister, kunnen regels worden gesteld
      over de verstrekking van systematische informatie aan het provinciebestuur of, in het geval
      [artikel 124b, eerste lid][ref1], van toepassing is, Onze Minister wie het aangaat, betreffende de uitvoering door
      het gemeentebestuur van de andere wet, bedoeld in [artikel 124, eerste lid][ref2]. Bij ministeriële regeling of bij
      provinciale verordening kunnen nadere regels worden gesteld omtrent de toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel124h
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 124b
        hoofdstuk: VIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '125.1'
    text: Het gemeentebestuur is bevoegd tot oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel125
  - number: '125.2'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door het college, indien de last
      dient tot handhaving van regels welke het gemeentebestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel125
  - number: '125.3'
    text: |-
      De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door de burgemeester, indien de
      last dient tot handhaving van regels welke hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel125
  - number: '125.4'
    text: |-
      Een bestuurscommissie, een deelraad, het dagelijks bestuur van een deelgemeente of de voorzitter van het dagelijks
      bestuur van een deelgemeente waaraan bevoegdheden van de raad, het college of de burgemeester zijn overgedragen,
      bezit de bevoegdheid tot oplegging van een last onder bestuursdwang en de bevoegdheid tot het geven van een
      machtiging tot binnentreden van een woning slechts indien ook die bevoegdheid uitdrukkelijk is overgedragen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel125
  - number: '139.1'
    text: |-
      Besluiten van het gemeentebestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer zij
      zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: '139.2'
    text: 'De bekendmaking geschiedt:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: 139.2.a
    text: door plaatsing in het op een algemeen toegankelijke wijze uit te geven gemeenteblad;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: 139.2.b
    text: |-
      bij gebreke van een gemeenteblad, door terinzagelegging voor de tijd van twaalf weken op het gemeentehuis of op een
      andere door het college te bepalen plaats en door het doen van mededeling daarvan in een plaatselijk verschijnend
      dag-, nieuws- of huis-aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: '139.3'
    text: |-
      Het gemeenteblad kan elektronisch worden uitgegeven. Na de uitgifte blijft het gemeenteblad elektronisch op een
      algemeen toegankelijke wijze beschikbaar. Indien elektronische uitgifte geheel of gedeeltelijk onmogelijk is,
      voorziet het gemeentebestuur in een vervangende uitgave. Bij of krachtens algemene maatregel van bestuur worden
      omtrent het bepaalde in de eerste en tweede volzin nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: '139.4'
    text: |-
      Voor het inzien van een overeenkomstig het tweede lid bekendgemaakt besluit worden geen kosten in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
  - number: '139.5'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt de dagtekening vermeld van het
      besluit waarbij die goedkeuring is verleend of wordt de mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '140.1'
    text: |-
      De teksten van besluiten van het gemeentebestuur die algemeen verbindende voorschriften inhouden, zijn in
      geconsolideerde vorm voor een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen
      algemeen toegankelijk elektronisch medium.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel140
  - number: '140.2'
    text: |-
      Een geconsolideerde tekst van een besluit die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien het besluit na de beschikbaarstelling is gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel140
  - number: '140.3'
    text: |-
      Onze Minister kan regels stellen over de wijze waarop de in het eerste lid bedoelde teksten beschikbaar worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel140
  - number: '140.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën van besluiten worden aangewezen, waarop het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel140
  - number: '141'
    text: |-
      Een ieder kan op verzoek een papieren afschrift verkrijgen van de besluiten van het gemeentebestuur die algemeen
      verbindende voorschriften inhouden. Het afschrift wordt verstrekt tegen ten hoogste de kosten van het maken van
      het afschrift.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel141
  - number: '142'
    text: |-
      De bekendgemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel142
  - number: '143'
    text: |-
      Een besluit als bedoeld in [artikel 139][ref1] op overtreding waarvan straf is gesteld, wordt na de bekendmaking
      medegedeeld aan het parket van het arrondissement waarin de gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '144'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, is het bepaalde
      in de [artikelen 139][ref1], [142][ref2] en [143][ref3] van overeenkomstige toepassing, met dien verstande dat de
      mededeling aan het arrondissementsparket geschiedt binnen een week.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel143
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '142'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '143'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '145'
    text: |-
      Op termijnen gesteld in een gemeentelijke verordening zijn de
      [artikelen 1 tot en met 4 van de Algemene Termijnenwet][ref1] van overeenkomstige toepassing, tenzij in de
      verordening anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '147.1'
    text: |-
      Gemeentelijke verordeningen worden door de raad vastgesteld voor zover de bevoegdheid daartoe niet bij de wet of
      door de raad krachtens de wet aan het college of de burgemeester is toegekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147
  - number: '147.2'
    text: De overige bevoegdheden, bedoeld in artikel 108, eerste lid, berusten bij de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147
  - number: '147.3'
    text: |-
      De overige bevoegdheden, bedoeld in artikel 108, tweede lid, berusten bij het college, voor zover deze niet bij of
      krachtens de wet aan de raad of de burgemeester zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147
  - number: 147a.1
    text: |-
      Een lid van de raad kan een voorstel voor een verordening of een ander voorstel ter behandeling in de raad
      indienen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147a
  - number: 147a.2
    text: De raad regelt op welke wijze een voorstel voor een verordening wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147a
  - number: 147a.3
    text: De raad regelt op welke wijze en onder welke voorwaarden een ander voorstel wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147a
  - number: 147b.1
    text: |-
      Een lid van de raad kan een voorstel tot wijziging van een voor de vergadering van de raad geagendeerde ontwerp-
      verordening of ontwerp-beslissing indienen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147b
  - number: 147b.2
    text: |-
      Het [tweede lid van artikel 147a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel147a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel147b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 147a
        hoofdstuk: IX
  - number: '149'
    text: De raad maakt de verordeningen die hij in het belang van de gemeente nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel149
  - number: 149a
    text: |-
      Indien het toezicht op de naleving of de opsporing van een overtreding van een voorschrift van een verordening,
      dat strekt tot handhaving van de openbare orde of veiligheid of tot bescherming van het leven of de gezondheid van
      personen vereist dat de met het toezicht op de naleving of de opsporing belaste personen bevoegd zijn binnen te
      treden in een woning zonder toestemming van de bewoner, kan de raad deze bevoegdheid bij verordening verlenen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel149a
  - number: '150.1'
    text: |-
      De raad stelt een verordening vast waarin regels worden gesteld met betrekking tot de wijze waarop ingezetenen en
      belanghebbenden bij de voorbereiding van gemeentelijk beleid worden betrokken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel150
  - number: '150.2'
    text: |-
      De in het eerste lid bedoelde inspraak wordt verleend door toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], voorzover in de verordening niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 151a.1
    text: |-
      De raad kan een verordening vaststellen waarin voorschriften worden gesteld met betrekking tot het bedrijfsmatig
      geven van gelegenheid tot het verrichten van seksuele handelingen met of voor een derde tegen betaling.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151a
  - number: 151a.2
    text: |-
      Bij de uitoefening van het toezicht op de naleving van de in het eerste lid bedoelde voorschriften geldt de
      in [artikel 2 van de Wet op de identificatieplicht][ref1] bedoelde verplichting ook voor een persoon die de
      leeftijd van veertien jaar nog niet heeft bereikt. Deze toonplicht betreft een identiteitsbewijs als bedoeld in
      [artikel 1, onderdelen 1° tot en met 3°, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 151a.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de uitoefening van het toezicht op de naleving van
      gemeentelijke voorschriften met betrekking tot het, door handelingen, houding, woord, gebaar of op andere wijze,
      passanten tot prostitutie bewegen, uitnodigen dan wel aanlokken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151a
  - number: 151b.1
    text: |-
      De raad kan bij verordening de burgemeester de bevoegdheid verlenen om bij verstoring van de openbare orde
      door de aanwezigheid van wapens, dan wel bij ernstige vrees voor het ontstaan daarvan, een gebied, met inbegrip
      van de daarin gelegen voor het publiek openstaande gebouwen en daarbij behorende erven, aan te wijzen als
      veiligheidsrisicogebied. In een veiligheidsrisicogebied kan de officier van justitie de bevoegdheden, bedoeld in
      de [artikelen 50, derde lid][ref1], [51, derde lid][ref2], en [52, derde lid, van de Wet wapens en munitie][ref3]
      toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel52
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '52'
  - number: 151b.2
    text: |-
      De burgemeester gaat niet over tot aanwijzing als veiligheidsrisicogebied dan na overleg met de officier van
      justitie in het overleg, bedoeld in [artikel 13, eerste lid, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
  - number: 151b.3
    text: |-
      De aanwijzing als veiligheidsrisicogebied wordt gegeven voor een bepaalde duur die niet langer is en voor een
      gebied dat niet groter is dan strikt noodzakelijk voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
  - number: 151b.4
    text: |-
      De beslissing tot gebiedsaanwijzing wordt op schrift gesteld en bevat een omschrijving van het gebied waarop deze
      van toepassing is alsmede de geldigheidsduur. Indien de situatie dermate spoedeisend is dat de burgemeester de
      beslissing tot gebiedsaanwijzing niet tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
  - number: 151b.5
    text: |-
      De burgemeester brengt de gebiedsaanwijzing zo spoedig mogelijk ter kennis van de raad en van de officier van
      justitie, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
  - number: 151b.6
    text: |-
      Zodra de verstoring van de openbare orde door de aanwezigheid van wapens, dan wel de ernstige vrees voor het
      ontstaan daarvan, bedoeld in het eerste lid, is geweken, trekt de burgemeester de gebiedsaanwijzing in. Het vijfde
      lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151b
  - number: 151c.1
    text: |-
      De raad kan bij verordening de burgemeester de bevoegdheid verlenen om, indien dat in het belang van de handhaving
      van de openbare orde noodzakelijk is, te besluiten tot plaatsing van vaste camera’s voor een bepaalde duur ten
      behoeve van het toezicht op een openbare plaats als bedoeld in [artikel 1 van de Wet openbare manifestaties][ref1]
      en andere bij verordening aan te wijzen plaatsen die voor een ieder toegankelijk zijn. De burgemeester bepaalt de
      duur van de plaatsing en wijst de openbare plaats of plaatsen aan, met inachtneming van hetgeen daaromtrent in de
      verordening is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: 151c.2
    text: |-
      De burgemeester stelt, na overleg met de officier van justitie in het overleg, bedoeld in
      [artikel 13, eerste lid, van de Politiewet 2012][ref1], de periode vast waarin in het belang van de handhaving van
      de openbare orde daadwerkelijk gebruik van de camera’s plaatsvindt en de met de camera’s gemaakte beelden in elk
      geval rechtstreeks worden bekeken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
  - number: 151c.3
    text: |-
      De burgemeester bedient zich bij de uitvoering van het in het eerste lid bedoelde besluit van de onder zijn gezag
      staande politie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.4
    text: |-
      De aanwezigheid van camera’s als bedoeld in het eerste lid is op duidelijke wijze kenbaar voor een ieder die de
      desbetreffende openbare plaats betreedt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.5
    text: |-
      Met de camera’s worden uitsluitend beelden gemaakt van een openbare plaats als bedoeld in
      [artikel 1 van de Wet openbare manifestaties][ref1] en andere bij verordening aan te wijzen plaatsen die voor een
      ieder toegankelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
  - number: 151c.6
    text: De met de camera’s gemaakte beelden mogen in het belang van de handhaving van de openbare orde worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.7
    text: |-
      De verwerking van de gegevens, bedoeld in het zesde lid, is een verwerking als bedoeld in
      de [Wet politiegegevens][ref1], met dien verstande dat, in afwijking van het bepaalde in
      [artikel 8 van die wet][ref2], de vastgelegde beelden na ten hoogste vier weken worden vernietigd en de gegevens,
      bedoeld in het zesde lid, indien er concrete aanleiding bestaat te vermoeden dat die gegevens noodzakelijk zijn
      voor de opsporing van een strafbaar feit, ten behoeve van de opsporing van dat strafbare feit kunnen worden
      verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0022463
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '8'
  - number: 151c.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de goede uitvoering van het toezicht, bedoeld
      in het eerste lid, regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.8.a
    text: |-
      de vaste camera’s en andere technische hulpmiddelen benodigd voor het toezicht, bedoeld in het eerste lid, en de
      wijze waarop deze hulpmiddelen worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.8.b
    text: de personen belast met of anderszins direct betrokken bij de uitvoering van het toezicht; en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: 151c.8.c
    text: de ruimten waarin de waarneming of verwerking van door het toezicht vastgelegde beelden plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel151c
  - number: '154.1'
    text: |-
      De raad kan op overtreding van zijn verordeningen en van die van organen waaraan ingevolge [artikel 156][ref1]
      verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan hechtenis van ten hoogste
      drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel156
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '156'
        hoofdstuk: IX
  - number: '154.2'
    text: |-
      Op de krachtens het eerste lid strafbaar gestelde overtreding van voorschriften met betrekking tot het plaatsen
      of laten staan van motorrijtuigen op parkeerterreinen of weggedeelten bedoeld in [artikel 225][ref1] zijn de
      [artikelen 181][ref2] en [182 van de Wegenverkeerswet 1994][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel182
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '181'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '182'
  - number: '154.3'
    text: De in het eerste lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154
  - number: 154a.1
    text: |-
      De raad kan bij verordening de burgemeester de bevoegdheid verlenen om door de burgemeester aangewezen groepen van
      personen, op een door de burgemeester aangegeven plaats tijdelijk te doen ophouden. De ophouding kan mede omvatten,
      indien nodig, het overbrengen naar die plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.2
    text: 'De burgemeester oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.2.a
    text: |-
      jegens personen die een door de raad bij verordening vastgesteld en daartoe aangewezen specifiek voorschrift
      dat strekt tot handhaving van de openbare orde of beperking van gevaar in omstandigheden als bedoeld in
      [artikel 175][ref1], groepsgewijs niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
  - number: 154a.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.3
    text: |-
      De beslissing tot ophouding wordt op schrift gesteld. De schriftelijke beslissing is een beschikking. Indien
      de situatie dermate spoedeisend is dat de burgemeester de beslissing tot ophouding niet tevoren op schrift kan
      stellen, zorgt hij alsnog zo spoedig mogelijk voor de opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.4
    text: De beschikking vermeldt welk voorschrift niet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.5
    text: |-
      De burgemeester laat tot ophouding als bedoeld in het eerste lid niet overgaan dan nadat de personen uit de in het
      eerste lid bedoelde groep in de gelegenheid zijn gesteld de tenuitvoerlegging van de beschikking tot ophouding te
      voorkomen, door alsnog het voorschrift, bedoeld in het vierde lid, na te leven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.6
    text: |-
      De burgemeester draagt er zorg voor dat zo spoedig mogelijk een verslag van de bevindingen inzake de
      tenuitvoerlegging van de ophouding wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.7
    text: |-
      De ophouding mag niet langer duren dan de tijd die nodig is ter voorkoming van voortzetting of herhaling van de
      niet-naleving, met een maximum van twaalf uren.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.8
    text: |-
      De plaats van ophouding dient geschikt te zijn voor de opvang van de op te houden personen. Bij algemene maatregel
      van bestuur kunnen nadere regels hieromtrent worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.9
    text: |-
      De burgemeester draagt er voor zover mogelijk zorg voor dat de opgehouden personen in de gelegenheid worden
      gesteld door een daartoe door hem aangewezen ambtenaar hun gegevens te laten vastleggen ten bewijze dat zij zijn
      opgehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.10
    text: |-
      Indien tegen de beschikking tot ophouding een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] wordt gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.10.a
    text: |-
      wordt, in afwijking van [artikel 8:83, eerste lid, van de Algemene wet bestuursrecht][ref1], de verzoeker die is
      opgehouden zo mogelijk nog tijdens zijn ophouding door de voorzieningenrechter gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.10.b
    text: |-
      doet de voorzieningenrechter in afwijking van [artikel 8:84, eerste lid, van de Algemene wet bestuursrecht][ref1]
      onmiddellijk na het horen van partijen uitspraak, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.10.c
    text: |-
      wordt, in afwijking van [artikel 8:82, eerste lid, van de Algemene wet bestuursrecht][ref1], geen griffierecht
      geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.11
    text: |-
      Bij de beoordeling van het verzoek betrekt de voorzieningenrechter tevens de rechtmatigheid van de
      tenuitvoerlegging van de beschikking tot ophouding jegens verzoeker.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.12
    text: |-
      Indien de voorzieningenrechter een of meer verzoeken toewijst op de grond dat de beschikking tot ophouding naar
      zijn voorlopig oordeel onrechtmatig is, kan hij bepalen dat alle personen die op basis van de betrokken beschikking
      zijn opgehouden, onverwijld in vrijheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
  - number: 154a.13
    text: |-
      Het elfde lid is van overeenkomstige toepassing op de beoordeling van een beroep tegen de beschikking tot ophouding
      als bedoeld in [artikel 8:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154b.1
    text: 'De raad kan bij verordening bepalen dat een bestuurlijke boete kan worden opgelegd voor overtreding van:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154b.1.a
    text: |-
      voorschriften uit zijn verordeningen betreffende gedragingen die kunnen leiden tot overlast in de openbare ruimte
      en die tevens krachtens [artikel 154][ref1] strafbaar zijn gesteld, met uitzondering van de bij algemene maatregel
      van bestuur bepaalde voorschriften, en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '154'
        hoofdstuk: IX
  - number: 154b.1.b
    text: |-
      de bij algemene maatregel van bestuur bepaalde voorschriften die op grond van
      [artikel 10.23 van de Wet milieubeheer][ref1] zijn vastgesteld in een verordening en die strafbaar zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 154b.2
    text: De verordening, bedoeld in het eerste lid, is van toepassing op alle overtredingen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154b.3
    text: |-
      Een besluit van de raad tot intrekking van de verordening, bedoeld in het eerste lid, treedt niet eerder in werking
      dan na twaalf maanden na de bekendmaking van het besluit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154b.4
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete wordt uitgeoefend door het college. Deze bevoegdheid
      wordt uitgeoefend door de burgemeester, indien de toepassing van dit middel dient tot handhaving van regels welke
      hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154b.5
    text: |-
      In het overleg, bedoeld in [artikel 13, eerste lid, van de Politiewet 2012][ref1], vindt afstemming plaats over
      de inzet en werkwijze met betrekking tot de aanpak van overlast in de openbare ruimte door de politie en de
      ondergeschikten, bedoeld in [artikel 154c, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154c
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 154c
        hoofdstuk: IX
  - number: 154b.6
    text: |-
      Bij algemene maatregel van bestuur worden de verschillende boetecategorieën en de hoogte van de bestuurlijke boete
      bepaald. Voor zover voor een voorschrift de boetecategorie en de hoogte van de boete niet bij algemene maatregel
      van bestuur zijn bepaald, stelt de raad deze vast in de verordening, bedoeld in het eerste lid. De bestuurlijke
      boete kan voor natuurlijke personen per gedraging niet hoger zijn dan het bedrag van de geldboete van de eerste
      categorie en voor rechtspersonen per gedraging niet hoger zijn dan € 2250.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154b.7
    text: |-
      Een bestuurlijke boete kan slechts worden opgelegd aan personen die ten tijde van de overtreding 12 jaar of ouder
      waren. De bestuurlijke boete wordt voor personen die ten tijde van de overtreding nog geen zestien jaar oud waren,
      gehalveerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154b
  - number: 154c.1
    text: |-
      Zo mogelijk maakt het bestuursorgaan of de ondergeschikte, bedoeld in het tweede lid, terstond na constatering van
      de overtreding daarvan een rapport op en reikt een afschrift van dat rapport uit aan de overtreder.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154c
  - number: 154c.2
    text: |-
      Tot het opmaken van een rapport kan slechts worden gemachtigd een ondergeschikte van het bestuursorgaan, die tevens
      buitengewoon opsporingsambtenaar is. Bij of krachtens algemene maatregel van bestuur kunnen nadere eisen gesteld
      worden aan de ondergeschikte.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154c
  - number: 154c.3
    text: |-
      Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1], vermeldt het rapport het
      bestuursorgaan dat de bestuurlijke boete zal opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 154d
    text: |-
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op een bestuurlijke boete als bedoeld
      in [artikel 154b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 154b
        hoofdstuk: IX
  - number: 154e
    text: |-
      De beschikking tot oplegging van de bestuurlijke boete wordt gezonden naar het adres dat de overtreder heeft
      opgegeven. Indien de beschikking onbestelbaar blijkt te zijn, wordt deze gezonden naar het in de basisregistratie
      laatst vermelde adres, tenzij dit hetzelfde is als het opgegeven adres. Indien de beschikking op het in de
      basisadministratie persoonsgegevens vermelde adres onbestelbaar blijkt te zijn, wordt de beschikking geacht aan de
      overtreder bekend te zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154e
  - number: 154k.1
    text: |-
      Tegen een beschikking tot oplegging van een bestuurlijke boete als bedoeld in [artikel 154b, eerste lid][ref1], kan
      een belanghebbende beroep instellen bij de rechtbank. Het beroep wordt behandeld en beslist door de kantonrechter.
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154k
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 154b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: 154k.2
    text: |-
      De [artikelen 6, tweede lid][ref1], [10][ref2] en
      [12 tot en met 20d van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] zijn van
      overeenkomstige toepassing, met dien verstande dat telkens voor «officier van justitie» wordt gelezen: de
      burgemeester of het college.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004581#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel12
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154k
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004581
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '12'
  - number: 154l
    text: De bestuurlijke boete wordt betaald aan het bestuursorgaan binnen zes weken nadat deze onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154l
  - number: 154m.1
    text: |-
      De invordering vindt plaats met overeenkomstige toepassing van de wettelijke bepalingen inzake invordering van
      gemeentelijke belastingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154m
  - number: 154m.2
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154m
  - number: 154m.2.a
    text: vindt kwijtschelding wegens onvermogen tot betalen niet plaats; en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154m
  - number: 154m.2.b
    text: |-
      verjaart de bevoegdheid tot invordering van de geldsom twee jaren nadat de bestuurlijke boete onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154m
  - number: 154n.1
    text: |-
      De behandeling van het beroep vindt plaats binnen zes weken nadat de indiener zekerheid heeft gesteld voor de
      betaling van de sanctie, ter hoogte van het bedrag van de opgelegde bestuurlijke boete, dan wel nadat de termijn
      daarvoor is verstreken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154n
  - number: 154n.2
    text: |-
      Indien het bestuursorgaan geheel of gedeeltelijk aan de indiener van het beroepschrift is tegemoet gekomen, kan de
      in het eerste lid bedoelde termijn zonodig met vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154n
  - number: 154n.3
    text: |-
      De zekerheid wordt door de indiener gesteld bij het bestuursorgaan dat de bestuurlijke boete heeft opgelegd, hetzij
      door middel van een aan betrokkene toegezonden acceptgiro, hetzij anderszins door storting op de rekening van de
      het bestuursorgaan. De griffie van de rechtbank wijst de indiener van het beroepschrift na de ontvangst ervan op
      de verplichting tot zekerheidsstelling en deelt hem mee dat de zekerheidsstelling dient te geschieden binnen twee
      weken na de dag van zijn mededeling. Indien de zekerheidsstelling niet binnen deze termijn is geschied, wordt het
      beroep door de kantonrechter niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat de
      indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154n
  - number: 154n.4
    text: |-
      De verplichting tot zekerheidsstelling vervalt nadat ten aanzien van de opgelegde bestuurlijke boete een
      onherroepelijke beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154n
  - number: 154n.5
    text: |-
      Indien de in het vierde lid bedoelde beslissing inhoudt dat de opgelegde bestuurlijke boete geheel of gedeeltelijk
      blijft gehandhaafd, wordt de verschuldigde bestuurlijke boete op de zekerheidsstelling verhaald.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel154n
  - number: '155.1'
    text: Een lid van de raad kan het college of de burgemeester mondeling of schriftelijk vragen stellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155
  - number: '155.2'
    text: |-
      Een lid van de raad kan de raad verlof vragen tot het houden van een interpellatie over een onderwerp dat niet
      staat vermeld op de agenda, bedoeld in [artikel 19, tweede lid][ref1], om het college of de burgemeester hierover
      inlichtingen te vragen. De raad stelt hierover nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
  - number: 155a.1
    text: |-
      De raad kan op voorstel van een of meer van zijn leden een onderzoek naar het door het college of de burgemeester
      gevoerde bestuur instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155a.2
    text: |-
      Het besluit tot het instellen van een onderzoek omvat een omschrijving van het onderwerp van onderzoek alsmede een
      toelichting. Deze omschrijving kan hangende het onderzoek door de raad worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155a.3
    text: |-
      Het onderzoek wordt uitgevoerd door een door de raad in te stellen onderzoekscommissie. De commissie heeft ten
      minste drie leden en bestaat uitsluitend uit leden van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155a.4
    text: |-
      De [artikelen 22][ref1], [82, derde lid][ref2], en [86, eerste lid][ref3], zijn van overeenkomstige toepassing op
      de onderzoekscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: 155a.5
    text: |-
      De onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien ten minste drie
      van haar leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155a.6
    text: De bevoegdheden en werkzaamheden van een onderzoekscommissie worden niet geschorst door het aftreden van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155a.7
    text: |-
      Op het besluit tot instelling van een onderzoek en tot instelling van een onderzoekscommissie, alsmede het besluit
      tot wijziging van de omschrijving van het onderwerp van een onderzoek zijn de [artikelen 139, tweede lid][ref1],
      [140][ref2] en [141][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 155a.8
    text: |-
      Alvorens de raad besluit tot een onderzoek, stelt hij bij verordening nadere regels met betrekking tot deze
      onderzoeken. In elk geval worden daarin regels opgenomen over de wijze waarop ambtelijke bijstand wordt verleend
      aan de commissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155a
  - number: 155b.1
    text: |-
      Leden en gewezen leden van de raad, de burgemeester en gewezen burgemeesters, wethouders en gewezen wethouders,
      leden en gewezen leden van de door de raad of de deelraad ingestelde rekenkamer, personen die de rekenkamerfunctie
      uitoefenen, leden en gewezen leden van de deelraad, leden en gewezen leden van het dagelijks bestuur van een
      deelgemeente, leden en gewezen leden van een door de raad, het college of de burgemeester ingestelde commissie,
      ambtenaren en gewezen ambtenaren, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt, zijn
      verplicht te voldoen aan een vordering van de onderzoekscommissie tot het verschaffen van inzage in, het nemen
      van afschrift van of het anderszins laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar
      het redelijk oordeel van de onderzoekscommissie inzage, afschrift of kennisneming anderszins voor het doen van een
      onderzoek als bedoeld in [artikel 155a][ref1] nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 155b.2
    text: |-
      Indien een vordering als bedoeld in het eerste lid betrekking heeft op bescheiden die afkomstig zijn van een
      instelling van de Europese Unie of van het Rijk en kennisneming van die bescheiden door de onderzoekscommissie
      het belang van de Europese Unie of de Staat kan schaden, wordt niet dan met toestemming van Onze Minister aan de
      vordering voldaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155b
  - number: 155b.3
    text: |-
      Ambtenaren, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt, zijn gehouden om aan een
      onderzoek als bedoeld in [artikel 155a][ref1] alle door de onderzoekscommissie gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 155c.1
    text: |-
      Personen als bedoeld in [artikel 155b, eerste lid][ref1], zijn verplicht te voldoen aan een oproep van de
      onderzoekscommissie om als getuige of deskundige te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155b
        hoofdstuk: IX
  - number: 155c.2
    text: |-
      Een getuige of deskundige die door de onderzoekscommissie wordt gehoord, is niet tevens lid van de
      onderzoekscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.3
    text: De getuigen zijn verplicht getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.4
    text: De deskundigen zijn verplicht hun diensten onpartijdig en naar beste weten als zodanig te verlenen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.5
    text: |-
      De onderzoekscommissie kan besluiten dat getuigen uitsluitend worden verhoord na het afleggen van een eed of
      belofte. Zij leggen dan in de vergadering van de onderzoekscommissie, in handen van de voorzitter, de eed of
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.6
    text: |-
      De getuigen en deskundigen worden in een openbare zitting van de onderzoekscommissie gehoord. Plaats en tijd van de
      openbare zitting worden door de voorzitter tijdig ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.7
    text: |-
      De onderzoekscommissie kan om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het openbaar
      af te nemen. De leden en plaatsvervangende leden van de commissie bewaren geheimhouding over hetgeen hun tijdens
      een besloten zitting ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.8
    text: |-
      Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan. Om gewichtige redenen kan de commissie
      besluiten, dat een getuige zonder bijstand wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
  - number: 155c.9
    text: |-
      Verklaringen die zijn afgelegd voor de onderzoekscommissie kunnen, behalve in het geval van
      [artikel 207, eerste lid, van het Wetboek van Strafrecht][ref1], niet als bewijs in rechte gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 155d.1
    text: |-
      Getuigen en deskundigen worden schriftelijk opgeroepen. De brief, houdende de oproep, wordt aangetekend verzonden
      of tegen gedagtekend ontvangstbewijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155d
  - number: 155d.2
    text: |-
      De onderzoekscommissie kan bevelen dat getuigen en deskundigen die, hoewel opgeroepen in overeenstemming met
      het eerste lid, niet zijn verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichting te
      voldoen. De onderzoekscommissie stelt de getuige of deskundige hiervan schriftelijk in kennis op de wijze, bedoeld
      in het eerste lid. In de beschikking wordt een termijn gesteld waarbinnen de belanghebbende de tenuitvoerlegging
      kan voorkomen door alsnog aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155d
  - number: 155e.1
    text: |-
      Niemand kan genoodzaakt worden aan de onderzoekscommissie geheimen te openbaren, voor zover daardoor onevenredige
      schade zou worden toegebracht aan het belang van de uitoefening van zijn beroep, dan wel aan het belang van zijn
      onderneming of de onderneming waarbij hij werkzaam is of is geweest.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155e
  - number: 155e.2
    text: |-
      Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch uitsluitend met betrekking tot hetgeen waarvan de wetenschap aan hen als zodanig is
      toevertrouwd. Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan
      tot welke hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155e
  - number: 155e.3
    text: |-
      De burgemeester en gewezen burgemeesters, wethouders en gewezen wethouders, leden en gewezen leden
      van het dagelijks bestuur van een deelgemeente, leden en gewezen leden van een door het college of
      de burgemeester ingestelde commissie, ambtenaren en gewezen ambtenaren, door of vanwege het college
      aangesteld of daaraan ondergeschikt, zijn niet verplicht aan [artikel 155b, eerste en derde lid][ref1], en
      [artikel 155c, derde lid][ref2], te voldoen, indien het verstrekken van de inlichtingen in strijd is met het
      openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel155c
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155e
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 155c
        hoofdstuk: IX
  - number: 155e.4
    text: |-
      De onderzoekscommissie kan verlangen dat een beroep als bedoeld in het derde lid op strijd met het openbaar belang
      wordt bevestigd door het college, of, voor zover de inlichtingen betrekking hebben op het door de burgemeester
      gevoerde bestuur, door de burgemeester.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155e
  - number: 155f
    text: |-
      Het college neemt de door de raad geraamde kosten voor een onderzoek in een bepaald jaar op in de ontwerp-
      begroting.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel155f
  - number: '156.1'
    text: |-
      De raad kan aan het college, een door hem ingestelde bestuurscommissie en een deelraad bevoegdheden overdragen,
      tenzij de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
  - number: '156.2'
    text: 'De raad kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
  - number: 156.2.a
    text: |-
      de instelling van een rekenkamer, bedoeld in [artikel 81a][ref1], of het bij verordening stellen van regels voor de
      uitoefening van de rekenkamerfunctie, bedoeld in [artikel 81oa][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel81oa
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81a
        hoofdstuk: IVa
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 81oa
        hoofdstuk: IVb
  - number: 156.2.b
    text: |-
      de instelling van een onderzoek, bedoeld in [artikel 155a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 156.2.c
    text: |-
      de vaststelling of wijziging van de begroting, bedoeld in [artikel 189][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 156.2.d
    text: |-
      de vaststelling van de jaarrekening, bedoeld in [artikel 198][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel198
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '198'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 156.2.e
    text: het stellen van straf op overtreding van de gemeentelijke verordeningen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
  - number: 156.2.f
    text: |-
      de vaststelling van de verordeningen, bedoeld in de [artikelen 212, eerste lid][ref1], [213, eerste lid][ref2],
      en [213a, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 213a
        hoofdstuk: XIV
  - number: 156.2.g
    text: |-
      de aanwijzing van een of meer accountants, bedoeld in [artikel 213, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
  - number: 156.2.h
    text: |-
      de heffing van andere belastingen dan de belastingen, genoemd in [artikel 225][ref1], de precariobelasting,
      de rioolheffing, bedoeld in [artikel 228a][ref2], de rechten, genoemd in [artikel 229][ref3], de
      rechten waarvan de heffing geschiedt krachtens andere wetten dan deze wet en de heffing, bedoeld in
      [artikel 15.33 van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 228a
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '15'
  - number: '156.3'
    text: |-
      De bevoegdheid tot het vaststellen van verordeningen, door strafbepaling of bestuursdwang te handhaven, kan de raad
      slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot bepaalde door hem in
      zijn verordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
  - number: '156.4'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '156.5'
    text: |-
      Het tweede lid, aanhef en onder a, e en f, en het derde lid zijn niet van toepassing op de overdracht van
      bevoegdheden aan een deelraad.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel156
  - number: '157.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van de raad, de uitoefening daarvan en het toezicht daarop zijn
      ten aanzien van de ingevolge [artikel 156][ref1] overgedragen bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel156
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '156'
        hoofdstuk: IX
  - number: '157.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel157
  - number: '158.1'
    text: De raad kan de naam van de gemeente wijzigen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel158
  - number: '158.2'
    text: Het besluit van de raad wordt ter kennis gebracht van Onze Minister en het provinciebestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel158
  - number: '158.3'
    text: Het besluit vermeldt de datum van ingang, die is gelegen ten minste een jaar na de datum van het besluit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel158
  - number: '160.1'
    text: 'Het college is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.a
    text: |-
      het dagelijks bestuur van de gemeente te voeren, voor zover niet bij of krachtens de wet de raad of de burgemeester
      hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.b
    text: |-
      beslissingen van de raad voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de burgemeester hiermee
      is belast;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.c
    text: |-
      regels vast te stellen over de ambtelijke organisatie van de gemeente, met uitzondering van de organisatie van
      de griffie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.d
    text: |-
      ambtenaren, niet zijnde de griffier en de op de griffie werkzame ambtenaren, te benoemen, te schorsen en te
      ontslaan;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.e
    text: tot privaatrechtelijke rechtshandelingen van de gemeente te besluiten;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.f
    text: |-
      te besluiten namens de gemeente, het college of de raad rechtsgedingen, bezwaarprocedures of administratief
      beroepsprocedures te voeren of handelingen ter voorbereiding daarop te verrichten, tenzij de raad, voor zover het
      de raad aangaat, in voorkomende gevallen anders beslist;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.g
    text: ten aanzien van de voorbereiding van de civiele verdediging;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: 160.1.h
    text: jaarmarkten of gewone marktdagen in te stellen, af te schaffen of te veranderen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: '160.2'
    text: |-
      Het college besluit slechts tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen,
      verenigingen, coöperaties en onderlinge waarborgmaatschappijen, indien dat in het bijzonder aangewezen moet worden
      geacht voor de behartiging van het daarmee te dienen openbaar belang. Het besluit wordt niet genomen dan nadat de
      raad een ontwerp-besluit is toegezonden en in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van
      het college te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: '160.3'
    text: |-
      Een besluit als bedoeld in het tweede lid behoeft de goedkeuring van gedeputeerde staten. De goedkeuring kan
      slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: '160.4'
    text: |-
      Het college neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire maatregelen en
      doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel160
  - number: '165.1'
    text: |-
      Het college kan aan een door hem ingestelde bestuurscommissie en aan het dagelijks bestuur van een deelgemeente
      bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel165
  - number: '165.2'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '165.3'
    text: |-
      Het college neemt geen besluit op grond van het eerste lid dan nadat de raad een ontwerp-besluit is toegezonden en
      in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van het college te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel165
  - number: '166'
    text: |-
      Het college kan een in de gemeente dienstdoende ambtenaar van politie machtigen in zijn naam besluiten te nemen of
      andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel166
  - number: '167.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van het college, de uitoefening daarvan en het toezicht daarop,
      zijn ten aanzien van de ingevolge [artikel 165][ref1] overgedragen bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel165
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '165'
        hoofdstuk: X
  - number: '167.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel167
  - number: '168.1'
    text: |-
      Het college kan een of meer leden van het college machtigen tot uitoefening van een of meer van zijn bevoegdheden,
      tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel168
  - number: '168.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van het college
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel168
  - number: '168.3'
    text: Het college kan te dien aanzien alle aanwijzingen geven die het nodig acht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel168
  - number: '169.1'
    text: |-
      Het college en elk van zijn leden afzonderlijk zijn aan de raad verantwoording schuldig over het door het college
      gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel169
  - number: '169.2'
    text: Zij geven de raad alle inlichtingen die de raad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel169
  - number: '169.3'
    text: |-
      Zij geven de raad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel169
  - number: '169.4'
    text: |-
      Zij geven de raad vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 160, eerste lid, onder e, f, g en h][ref1], indien de raad daarom verzoekt of indien de uitoefening
      ingrijpende gevolgen kan hebben voor de gemeente. In het laatste geval neemt het college geen besluit dan nadat de
      raad in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van het college te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel160
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '160'
        hoofdstuk: X
  - number: '169.5'
    text: |-
      Indien de uitoefening van de bevoegdheid, bedoeld in [artikel 160, eerste lid, onder f][ref1], geen uitstel kan
      lijden, geven zij in afwijking van het vierde lid de raad zo spoedig mogelijk inlichtingen over de uitoefening van
      deze bevoegdheid en het terzake genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel160
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '160'
        hoofdstuk: X
  - number: '170.1'
    text: 'De burgemeester ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.1.a
    text: |-
      een tijdige voorbereiding, vaststelling en uitvoering van het gemeentelijk beleid en van de daaruit voortvloeiende
      besluiten, alsmede op een goede afstemming tussen degenen die bij die voorbereiding, vaststelling en uitvoering
      zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.1.b
    text: een goede samenwerking van de gemeente met andere gemeenten en andere overheden;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.1.c
    text: de kwaliteit van procedures op het vlak van burgerparticipatie;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.1.d
    text: een zorgvuldige behandeling van bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.1.e
    text: een zorgvuldige behandeling van klachten door het gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: '170.2'
    text: |-
      De burgemeester brengt tegelijk met de in [artikel 197][ref1] bedoelde stukken een burgerjaarverslag uit, waarin
      hij in ieder geval rapporteert over:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 170.2.a
    text: de kwaliteit van de gemeentelijke dienstverlening;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: 170.2.b
    text: zijn bevindingen over het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: '170.3'
    text: De burgemeester bevordert overigens een goede behartiging van de gemeentelijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel170
  - number: '171.1'
    text: De burgemeester vertegenwoordigt de gemeente in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel171
  - number: '171.2'
    text: |-
      De burgemeester kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel171
  - number: '172.1'
    text: De burgemeester is belast met de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172
  - number: '172.2'
    text: |-
      De burgemeester is bevoegd overtredingen van wettelijke voorschriften die betrekking hebben op de openbare orde, te
      beletten of te beëindigen. Hij bedient zich daarbij van de onder zijn gezag staande politie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172
  - number: '172.3'
    text: |-
      De burgemeester is bevoegd bij verstoring van de openbare orde of bij ernstige vrees voor het ontstaan daarvan, de
      bevelen te geven die noodzakelijk te achten zijn voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172
  - number: '172.4'
    text: |-
      De commissaris van de Koning geeft, indien een ordeverstoring van meer dan plaatselijke betekenis dan wel ernstige
      vrees voor het ontstaan van zodanige ordeverstoring zulks noodzakelijk maakt, de burgemeesters in de provincie
      zoveel mogelijk na overleg met hen, de nodige aanwijzingen met betrekking tot het door hen ter handhaving van de
      openbare orde te voeren beleid. De aanwijzingen worden zo enigszins mogelijk schriftelijk gegeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172
  - number: 172a.1
    text: |-
      Onverminderd [artikel 172, derde lid][ref1], en hetgeen bij gemeentelijke verordening is bepaald omtrent de
      bevoegdheid van de burgemeester om bevelen te geven ter handhaving van de openbare orde, kan de burgemeester aan
      een persoon die herhaaldelijk individueel of groepsgewijs de openbare orde heeft verstoord of bij groepsgewijze
      verstoring van de openbare orde een leidende rol heeft gehad, bij ernstige vrees voor verdere verstoring van de
      openbare orde een bevel geven:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel172
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '172'
        hoofdstuk: XI
  - number: 172a.1.a
    text: |-
      zich niet te bevinden in of in de omgeving van een of meer bepaalde objecten binnen de gemeente, dan wel in een of
      meer bepaalde delen van de gemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.1.b
    text: |-
      zich niet in een of meer bepaalde delen van de gemeente op een voor het publiek toegankelijke plaats zonder
      redelijk doel met meer dan drie andere personen in groepsverband op te houden; of
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.1.c
    text: zich op bepaalde tijdstippen te melden op bepaalde plaatsen, al dan niet in een andere gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.2
    text: |-
      Een bevel zich te melden in een andere gemeente, wordt slechts gegeven in overeenstemming met de burgemeester van
      die gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.3
    text: |-
      Indien de officier van justitie een persoon als bedoeld in het eerste lid een gedragsaanwijzing heeft gegeven
      als bedoeld in [artikel 509hh, tweede lid, onderdeel a, van het Wetboek van Strafvordering][ref1], geeft de
      burgemeester aan deze persoon niet een bevel als bedoeld in het eerste lid, onder a of b, voor hetzelfde gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509hh
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509hh
  - number: 172a.4
    text: |-
      Het bevel geldt voor een door de burgemeester vast te stellen periode van ten hoogste drie maanden. Het bevel kan
      ten hoogste driemaal worden verlengd met een door de burgemeester vast te stellen periode van telkens ten hoogste
      drie maanden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.5
    text: Op grond van nieuwe feiten of omstandigheden kan de burgemeester het bevel wijzigen ten nadele van betrokkene.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.6
    text: |-
      De burgemeester kan op aanvraag tijdelijk ontheffing verlenen van de verboden of geboden die voortvloeien uit het
      bevel, dan wel van een of meer onderdelen daarvan. Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172a.7
    text: |-
      Indien nieuwe feiten of omstandigheden daartoe aanleiding geven, wijzigt de burgemeester het bevel ten gunste van
      betrokkene. Het bevel wordt ingetrokken zodra het niet langer nodig is ter voorkoming van verdere verstoringen van
      de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172a
  - number: 172b.1
    text: |-
      De burgemeester kan aan een persoon die het gezag uitoefent over een minderjarige die herhaaldelijk groepsgewijs
      de openbare orde heeft verstoord en de leeftijd van twaalf jaren nog niet heeft bereikt, bij ernstige vrees voor
      verdere verstoring van de openbare orde een bevel geven zorg te dragen:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
  - number: 172b.1.a
    text: |-
      dat de minderjarige zich niet bevindt in of in de omgeving van een of meer bepaalde objecten binnen de gemeente,
      dan wel in een of meer bepaalde delen van de gemeente, tenzij de minderjarige wordt begeleid door een persoon die
      het gezag over hem uitoefent of door een andere meerderjarige als bedoeld in het derde lid; of
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
  - number: 172b.1.b
    text: |-
      dat de minderjarige zich op bepaalde dagen gedurende een aangegeven tijdvak tussen 8 uur ’s avonds en 6 uur
      ’s ochtends niet bevindt op voor het publiek toegankelijke plaatsen, tenzij de minderjarige wordt begeleid door een
      persoon die het gezag over hem uitoefent of door een andere meerderjarige als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
  - number: 172b.2
    text: Het bevel geldt voor een door de burgemeester vast te stellen periode van ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
  - number: 172b.3
    text: |-
      De burgemeester kan voor de toepassing van het eerste lid ten hoogste twee andere meerderjarigen naast de persoon
      of personen die het gezag uitoefenen over een minderjarige aanwijzen ter begeleiding van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
  - number: 172b.4
    text: |-
      [Artikel 172a, vijfde, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel172a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel172b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 172a
        hoofdstuk: XI
  - number: '174.1'
    text: |-
      De burgemeester is belast met het toezicht op de openbare samenkomsten en vermakelijkheden alsmede op de voor het
      publiek openstaande gebouwen en daarbij behorende erven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174
  - number: '174.2'
    text: |-
      De burgemeester is bevoegd bij de uitoefening van het toezicht, bedoeld in het eerste lid, de bevelen te geven die
      met het oog op de bescherming van veiligheid en gezondheid nodig zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174
  - number: '174.3'
    text: |-
      De burgemeester is belast met de uitvoering van verordeningen voor zover deze betrekking hebben op het in het
      eerste lid bedoelde toezicht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174
  - number: 174a.1
    text: |-
      De burgemeester kan besluiten een woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of
      dat lokaal behorend erf te sluiten, indien door gedragingen in de woning of het lokaal of op het erf de openbare
      orde rond de woning, het lokaal of het erf wordt verstoord.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174a
  - number: 174a.2
    text: |-
      De in het eerste lid genoemde bevoegdheid komt de burgemeester eveneens toe in geval van ernstige vrees voor
      verstoring van de openbare orde op de grond dat de rechthebbende op de woning, het lokaal of het erf eerder een
      woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of dat lokaal behorend erf op een
      zodanige wijze heeft gebruikt of doen gebruiken dat die woning, dat lokaal of dat erf op grond van het eerste
      lid is gesloten, en er aanwijzingen zijn dat betrokkene de woning, het lokaal of het erf ten aanzien waarvan hij
      rechthebbende is eveneens op een zodanige wijze zal gebruiken of doen gebruiken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174a
  - number: 174a.3
    text: |-
      De burgemeester bepaalt in het besluit de duur van de sluiting. In geval van ernstige vrees voor herhaling van
      de verstoring van de openbare orde kan hij besluiten de duur van de sluiting tot een door hem te bepalen tijdstip
      te verlengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174a
  - number: 174a.4
    text: |-
      Bij de bekendmaking van het besluit worden belanghebbenden in de gelegenheid gesteld binnen een te stellen termijn
      maatregelen te treffen waardoor de verstoring van de openbare orde wordt beëindigd. De eerste volzin is niet van
      toepassing, indien voorafgaande bekendmaking in spoedeisende gevallen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174a
  - number: 174a.5
    text: |-
      De [artikelen 5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.
      De burgemeester kan van de overtreder de ingevolge [artikel 5:25 van de Algemene wet bestuursrecht][ref2]
      verschuldigde kosten invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel174a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '175.1'
    text: |-
      In geval van oproerige beweging, van andere ernstige wanordelijkheden of van rampen, dan wel van ernstige
      vrees voor het ontstaan daarvan, is de burgemeester bevoegd alle bevelen te geven die hij ter handhaving van de
      openbare orde of ter beperking van gevaar nodig acht. Daarbij kan van andere dan bij de [Grondwet][ref1] gestelde
      voorschriften worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '175.2'
    text: De burgemeester laat tot maatregelen van geweld niet overgaan dan na het doen van de nodige waarschuwing.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel175
  - number: '176.1'
    text: |-
      Wanneer een omstandigheid als bedoeld in [artikel 175, eerste lid][ref1], zich voordoet, kan de burgemeester
      algemeen verbindende voorschriften geven die ter handhaving van de openbare orde of ter beperking van gevaar nodig
      zijn. Daarbij kan van andere dan bij de [Grondwet][ref2] gestelde voorschriften worden afgeweken. Hij maakt deze
      voorschriften bekend op een door hem te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0001840
  - number: '176.2'
    text: |-
      De burgemeester brengt de voorschriften zo spoedig mogelijk ter kennis van de raad, van de commissaris van de
      Koning en van het hoofd van het arrondissementsparket.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
  - number: '176.3'
    text: |-
      De voorschriften vervallen, indien zij niet door de raad in zijn eerstvolgende vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, worden bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
  - number: '176.4'
    text: |-
      Indien de raad de voorschriften niet bekrachtigt, kan de burgemeester binnen vierentwintig uren administratief
      beroep instellen bij de commissaris van de Koning. Deze beslist binnen twee dagen. Gedurende de beroepstermijn en
      de behandeling van het administratief beroep blijven de voorschriften van kracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
  - number: '176.5'
    text: |-
      [Hoofdstuk 6][ref1] en [afdeling 7.3 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op het
      administratief beroep, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '7.3'
  - number: '176.6'
    text: |-
      De commissaris kan de werking van de voorschriften opschorten zolang zij niet bekrachtigd zijn. Het opschorten
      stuit onmiddellijk de werking van de voorschriften.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
  - number: '176.7'
    text: |-
      Zodra een omstandigheid als bedoeld in [artikel 175, eerste lid][ref1], zich niet langer voordoet, trekt de
      burgemeester de voorschriften in. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
  - number: 176a.1
    text: |-
      De burgemeester is bevoegd door hem aangewezen groepen van personen op een door hem aangegeven plaats tijdelijk te
      doen ophouden. De ophouding kan mede omvatten, indien nodig, het overbrengen naar die plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176a
  - number: 176a.2
    text: 'De burgemeester oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176a
  - number: 176a.2.a
    text: |-
      jegens personen die door hem daartoe aangewezen specifieke onderdelen van een bevel als bedoeld in
      [artikel 175][ref1] of van een algemeen verbindend voorschrift als bedoeld in [artikel 176][ref2], groepsgewijs
      niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '176'
        hoofdstuk: XI
  - number: 176a.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176a
  - number: 176a.3
    text: |-
      [Artikel 154a, derde tot en met veertiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel176a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
  - number: '177.1'
    text: |-
      De burgemeester kan een in de gemeente dienstdoende ambtenaar van politie machtigen in zijn naam besluiten te nemen
      of andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel177
  - number: '177.2'
    text: |-
      Geen machtiging wordt verleend tot het nemen van besluiten ingevolge de [artikelen 151b][ref1], [154a][ref2],
      [172][ref3], [172a][ref4], [172b][ref5], [174, tweede lid][ref6], [174a][ref7], [175][ref8], [176][ref9] en
      [176a][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel172a
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel172b
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref8]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref9]: https://wetten.overheid.nl/BWBR0005416#Artikel176
      [ref10]: https://wetten.overheid.nl/BWBR0005416#Artikel176a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 151b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '172'
        hoofdstuk: XI
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 172a
        hoofdstuk: XI
      - id: ref5
        bwb_id: BWBR0005416
        artikel: 172b
        hoofdstuk: XI
      - id: ref6
        bwb_id: BWBR0005416
        artikel: '174'
        hoofdstuk: XI
      - id: ref7
        bwb_id: BWBR0005416
        artikel: 174a
        hoofdstuk: XI
      - id: ref8
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref9
        bwb_id: BWBR0005416
        artikel: '176'
        hoofdstuk: XI
      - id: ref10
        bwb_id: BWBR0005416
        artikel: 176a
        hoofdstuk: XI
  - number: '178.1'
    text: |-
      De burgemeester kan aan een door hem ingestelde bestuurscommissie en aan de voorzitter van het dagelijks bestuur
      van een deelgemeente bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel178
  - number: '178.2'
    text: |-
      De bevoegdheden, bedoeld in de [artikelen 151b][ref1], [154a][ref2] en [172 tot en met 176a][ref3], kunnen in ieder
      geval niet worden overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel172
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 151b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '172'
        hoofdstuk: XI
  - number: '178.3'
    text: |-
      Ten aanzien van een besluit dat wordt genomen op grond van het eerste lid zijn de
      [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '178.4'
    text: |-
      De burgemeester neemt geen besluit op grond van het eerste lid dan nadat de raad een ontwerp-besluit is toegezonden
      en in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van de burgemeester te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel178
  - number: '179'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van de burgemeester, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge [artikel 178][ref1] overgedragen bevoegdheden van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel178
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '178'
        hoofdstuk: XI
  - number: '180.1'
    text: De burgemeester is aan de raad verantwoording schuldig over het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel180
  - number: '180.2'
    text: Hij geeft de raad alle inlichtingen die de raad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel180
  - number: '180.3'
    text: |-
      Hij geeft de raad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel180
  - number: '182.1'
    text: |-
      De rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door het
      gemeentebestuur gevoerde bestuur. Een door de rekenkamer ingesteld onderzoek naar de rechtmatigheid van
      het door het gemeentebestuur gevoerde bestuur bevat geen controle van de jaarrekening als bedoeld in
      [artikel 213, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
  - number: '182.2'
    text: Op verzoek van de raad kan de rekenkamer een onderzoek instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel182
  - number: '183.1'
    text: |-
      De rekenkamer is bevoegd alle documenten die berusten bij het gemeentebestuur te onderzoeken voor zover zij dat ter
      vervulling van haar taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel183
  - number: '183.2'
    text: |-
      Het gemeentebestuur verstrekt desgevraagd alle inlichtingen die de rekenkamer ter vervulling van haar taak nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel183
  - number: '183.3'
    text: |-
      Indien de zorg voor een administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige toepassing
      op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van die derde voert.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel183
  - number: '184.1'
    text: |-
      De rekenkamer heeft de in de volgende leden vermelde bevoegdheden ten aanzien van de volgende instellingen en over
      de volgende periode:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: 184.1.a
    text: |-
      openbare lichamen en gemeenschappelijke organen ingesteld krachtens de Wet gemeenschappelijke regelingen, waaraan
      de gemeente deelneemt, over de jaren dat de gemeente deelneemt in de regeling;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: 184.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan de gemeente meer dan
      vijftig procent van het geplaatste aandelenkapitaal houdt, over de jaren dat de gemeente meer dan vijftig procent
      van het geplaatste aandelenkapitaal houdt;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: 184.1.c
    text: |-
      andere privaatrechtelijke rechtspersonen waaraan de gemeente of een derde voor rekening en risico van de gemeente
      rechtstreeks of middellijk een subsidie, lening of garantie heeft verstrekt ten bedrage van ten minste vijftig
      procent van de baten van deze instelling, over de jaren waarop deze subsidie, lening of garantie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: '184.2'
    text: |-
      De rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de jaarrekeningen,
      daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en overige documenten met
      betrekking tot die instelling die bij het gemeentebestuur berusten. Indien een of meer documenten ontbreken, kan de
      rekenkamer van de betrokken instelling de overlegging daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: '184.3'
    text: |-
      De rekenkamer kan, indien de documenten, bedoeld in het tweede lid, daartoe aanleiding geven, bij de betrokken
      instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een onderzoek instellen.
      De rekenkamer stelt de raad en het college van haar voornemen een dergelijk onderzoek in te stellen in kennis.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184
  - number: 184a
    text: |-
      De rekenkamer is belast met het toezicht op de naleving van [artikel 213, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
  - number: '185.1'
    text: |-
      De rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin niet worden
      opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel185
  - number: '185.2'
    text: |-
      De rekenkamer deelt aan de raad, het college en, indien van toepassing, aan de betrokken instelling, de opmerkingen
      en bedenkingen mee die zij naar aanleiding van haar bevindingen van belang acht. Aan de raad of het college kan zij
      ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel185
  - number: '185.3'
    text: De rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel185
  - number: '185.4'
    text: |-
      De rekenkamer zendt een afschrift van haar rapporten en haar verslag aan de raad en het college. Indien zij met
      toepassing van [artikel 184][ref1] een onderzoek heeft ingesteld, zendt de rekenkamer tevens een afschrift van het
      rapport aan de betrokken instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel184
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '184'
        hoofdstuk: XIa
  - number: '185.5'
    text: De rapporten en de verslagen van de rekenkamer zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel185
  - number: '186.1'
    text: |-
      De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels gesteld worden
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: 186.2.a
    text: door het college vast te stellen documenten ten behoeve van de uitvoering van de begroting en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: 186.2.b
    text: |-
      door het college aan derden te verstrekken informatie op basis van de begroting en de jaarrekening en de controle
      van deze informatie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen nadere regels worden gesteld
      ten aanzien van het periodiek verstrekken van informatie voor derden. In overeenstemming met Onze Minister van
      Economische Zaken kan worden bepaald dat de informatie voor derden wordt gezonden aan het Centraal Bureau voor
      de Statistiek.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.4'
    text: |-
      De informatie voor derden, bedoeld in het tweede lid, onderdeel b, wordt gezonden aan Onze
      Minister binnen de termijnen, bedoeld in de [artikelen 191, tweede lid][ref1], en [200][ref2].
      [Artikel 17a, vierde lid, van de Financiële-verhoudingswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel191
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel200
      [ref3]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '200'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '186.5'
    text: |-
      Indien Onze Minister vaststelt dat de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in
      het derde lid, voor zover die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel
      de kwaliteit van die informatie tekort schiet, doet hij daarvan mededeling aan het betrokken college.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.6'
    text: |-
      Het college kan tot twee weken voor het verstrijken van de termijnen, bedoeld in het vierde lid, schriftelijk en
      met redenen omkleed, aan Onze Minister verzoeken om uitstel voor de toezending van de informatie. Onze Minister
      beslist binnen twee weken op dat verzoek.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.7'
    text: |-
      Indien de informatie, bedoeld in het tweede lid, onder b, of de informatie, bedoeld in het derde lid, voor zover
      die verstrekt moet worden aan Onze Minister, niet of niet tijdig wordt verstrekt, dan wel de kwaliteit van die
      informatie tekort schiet, geeft Onze Minister een aanwijzing aan het college om binnen een maand alsnog informatie
      van voldoende kwaliteit te leveren.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
  - number: '186.8'
    text: |-
      Indien het college nalaat de aanwijzing, bedoeld in het zevende lid, op te volgen, kunnen Onze
      Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën besluiten de betalingen
      op grond van [artikel 15, eerste lid, van de Financiële-verhoudingswet][ref1] aan de betreffende
      gemeente geheel of gedeeltelijk op te schorten gedurende ten hoogste zesentwintig weken.
      [Artikel 17b, vierde, vijfde en zesde lid, van de Financiële-verhoudingswet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17b
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17b
  - number: '187'
    text: Aan de gemeenten kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel187
  - number: '189.1'
    text: |-
      Voor alle taken en activiteiten brengt de raad jaarlijks op de begroting de bedragen die hij daarvoor beschikbaar
      stelt, alsmede de financiële middelen die hij naar verwachting kan aanwenden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel189
  - number: '189.2'
    text: |-
      De raad ziet erop toe dat de begroting structureel en reëel in evenwicht is. Hiervan kan hij afwijken indien
      aannemelijk is dat het structureel en reëel evenwicht in de begroting in de eerstvolgende jaren tot stand zal
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel189
  - number: '189.3'
    text: |-
      Behoudens het bepaalde in de [artikelen 208][ref1] en [209][ref2] kunnen ten laste van de gemeente slechts lasten
      en daarmee overeenstemmende balansmutaties worden genomen tot de bedragen die hiervoor op de begroting zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel209
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '208'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '189.4'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel189
  - number: '190.1'
    text: |-
      Het college biedt jaarlijks, tijdig voor de in [artikel 191, eerste lid][ref1], bedoelde vaststelling, de raad
      een ontwerp aan voor de begroting met toelichting van de gemeente en een meerjarenraming met toelichting voor ten
      minste drie op het begrotingsjaar volgende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel191
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '190.2'
    text: |-
      De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan de raad
      zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel190
  - number: '190.3'
    text: De raad beraadslaagt over de ontwerp-begroting niet eerder dan twee weken na de openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel190
  - number: '191.1'
    text: De raad stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel191
  - number: '191.2'
    text: |-
      Het college zendt de door de raad vastgestelde begroting vergezeld van de in [artikel 190, eerste lid][ref1],
      bedoelde stukken, binnen twee weken na de vaststelling, doch in ieder geval vóór 15 november van het jaar
      voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '192.1'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel192
  - number: '192.2'
    text: |-
      De [artikelen 190, tweede lid][ref1], en [191, tweede lid][ref2], alsmede, behoudens in gevallen van dringende
      spoed, het bepaalde in [artikel 190, derde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel191
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '193'
    text: 'Verplichte uitgaven van de gemeente zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel193
  - number: 193.a
    text: de renten en aflossingen van de door de gemeente aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel193
  - number: 193.b
    text: de uitgaven die bij of krachtens de wet aan de gemeente zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel193
  - number: 193.c
    text: |-
      de uitgaven die voortvloeien uit de van het gemeentebestuur gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel193
  - number: '194.1'
    text: Indien de raad weigert verplichte uitgaven op de begroting te brengen, doen gedeputeerde staten dit.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel194
  - number: '194.2'
    text: |-
      Indien de raad bovendien weigert in voldoende dekking van in het eerste lid bedoelde uitgaven te voorzien,
      verminderen gedeputeerde staten daartoe hetzij het bedrag voor onvoorziene uitgaven, hetzij indien dit bedrag niet
      toereikend is, overige niet-verplichte uitgaven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel194
  - number: '195'
    text: |-
      Gedeputeerde staten dragen zo nodig aan de bevoegde gemeenteambtenaar de betaling op ten laste van de gemeente van
      hetgeen als verplichte uitgaaf op de begroting is gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel195
  - number: '197.1'
    text: |-
      Het college legt aan de raad over elk begrotingsjaar verantwoording af over het door hem gevoerde bestuur, onder
      overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel197
  - number: '197.2'
    text: |-
      Het college voegt daarbij de verslagen, bedoeld in [artikel 213a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 213a
        hoofdstuk: XIV
  - number: '197.3'
    text: |-
      De raad legt de in het eerste en tweede lid, alsmede de in [artikel 213, derde en vierde lid][ref1], bedoelde
      stukken, wanneer de bespreking daarvan geagendeerd is op de in [artikel 19, tweede lid][ref2], bedoelde wijze, voor
      een ieder ter inzage en stelt ze algemeen verkrijgbaar. Van de terinzagelegging en de verkrijgbaarstelling wordt
      openbaar kennis gegeven. De raad beraadslaagt over de jaarrekening en het jaarverslag niet eerder dan twee weken na
      de openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
  - number: '198.1'
    text: |-
      De raad stelt de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De jaarrekening
      betreft alle baten en lasten van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel198
  - number: '198.2'
    text: |-
      Indien de raad tot het standpunt komt dat in de jaarrekening opgenomen baten, lasten of balansmutaties, die niet
      rechtmatig tot stand zijn gekomen, aan de vaststelling van de jaarrekening in de weg staan, brengt hij dit terstond
      ter kennis van het college met vermelding van de gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel198
  - number: '198.3'
    text: |-
      Het college zendt de raad binnen twee maanden na ontvangst van het standpunt, bedoeld in het tweede lid, een
      voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij de raad gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel198
  - number: '198.4'
    text: |-
      Indien het college een voorstel voor een indemniteitsbesluit heeft gedaan, stelt de raad de jaarrekening niet vast
      dan nadat hij heeft besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel198
  - number: '199'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van het
      college ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel199
  - number: '200'
    text: |-
      Het college zendt de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in [artikel 197][ref1]
      bedoelde stukken binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het jaar, volgend op het
      begrotingsjaar, aan gedeputeerde staten. Het college voegt daarbij, indien van toepassing, het besluit van de raad
      over een voorstel voor een indemniteitsbesluit met de reactie, bedoeld in [artikel 198, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel198
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '198'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '201'
    text: |-
      Indien de raad de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststelt, zendt het
      college de jaarrekening, vergezeld van de overige in [artikel 197][ref1] bedoelde stukken, respectievelijk het
      indemniteitsbesluit ter vaststelling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '203.1'
    text: |-
      De begroting, bedoeld in [artikel 189][ref1], van het eerstvolgende begrotingsjaar alsmede de daarop betrekking
      hebbende begrotingswijzigingen behoeven de goedkeuring van gedeputeerde staten, indien naar hun oordeel
      de begroting, bedoeld in [artikel 189][ref2], niet structureel en reëel in evenwicht is en blijkens de
      meerjarenraming, bedoeld in [artikel 190][ref3], niet aannemelijk is dat in de eerstvolgende jaren een structureel
      en reëel evenwicht tot stand zal worden gebracht. Gedeputeerde staten doen hiervan vóór de aanvang van het
      begrotingsjaar mededeling aan het gemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '203.2'
    text: |-
      Gedeputeerde staten kunnen bepalen dat de begroting, bedoeld in [artikel 189][ref1], van het eerstvolgende
      begrotingsjaar alsmede de daarop betrekking hebbende begrotingswijzigingen hun goedkeuring behoeven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 203.2.a
    text: |-
      de begroting, bedoeld in [artikel 189][ref1], niet tijdig is ingezonden aan gedeputeerde staten overeenkomstig het
      bepaalde in [artikel 191][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel191
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 203.2.b
    text: |-
      de jaarrekening, bedoeld in [artikel 197, eerste lid][ref1], van het tweede aan het begrotingsjaar
      voorafgaande jaar niet tijdig is ingezonden aan gedeputeerde staten overeenkomstig het bepaalde in
      [artikel 200, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel200
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '200'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '203.3'
    text: |-
      Gedeputeerde staten maken een besluit als bedoeld in het tweede lid vóór de aanvang van het begrotingsjaar aan het
      gemeentebestuur bekend.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
  - number: '203.4'
    text: |-
      De begroting behoeft geen goedkeuring indien gedeputeerde staten geen mededeling doen als bedoeld in het eerste
      lid of geen besluit bekend maken als bedoeld in het tweede lid binnen de in het eerste respectievelijk derde lid
      genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
  - number: '203.5'
    text: Gedeputeerde staten kunnen het besluit, bedoeld in het eerste lid, gedurende het lopende begrotingsjaar intrekken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel203
  - number: '205.1'
    text: |-
      Gedeputeerde staten stellen Onze Minister uiterlijk een maand na de aanvang van het begrotingsjaar schriftelijk en
      gemotiveerd in kennis van de mededelingen en besluiten, bedoeld in [artikel 203, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '205.2'
    text: |-
      Gedeputeerde staten maken bij de aanvang van het desbetreffende begrotingsjaar door publicatie in de
      *Staatscourant* bekend van welke gemeenten de begrotingen en begrotingswijzigingen hun goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel205
  - number: '206'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel206
  - number: '207.1'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting aan gedeputeerde staten wordt aangeboden, de
      begroting nog niet is goedgekeurd, vangt de in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref1]
      bedoelde termijn aan op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '207.2'
    text: |-
      Gedeputeerde staten kunnen bij hun besluit omtrent goedkeuring van de begroting ten aanzien van door hen aan te
      geven soorten van wijzigingen daarvan bepalen dat die hun goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel207
  - number: '208.1'
    text: |-
      Indien de begroting of een besluit tot wijziging daarvan niet is goedgekeurd, behoeft het gemeentebestuur tot het
      aangaan van verplichtingen de toestemming van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel208
  - number: '208.2'
    text: |-
      Een aanvraag van het gemeentebestuur om toepassing van het eerste lid kan door gedeputeerde staten slechts worden
      afgewezen wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel208
  - number: '208.3'
    text: |-
      Gedeputeerde staten beslissen op de aanvraag binnen twee maanden na de verzending van de aanvraag, bedoeld in
      het tweede lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het
      gemeentebestuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel208
  - number: '208.4'
    text: Gedeputeerde staten kunnen aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel208
  - number: '208.5'
    text: |-
      Gedeputeerde staten kunnen bepalen voor welke posten en tot welk bedrag het gemeentebestuur de toestemming, bedoeld
      in het eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel208
  - number: '209.1'
    text: |-
      In gevallen van dringende spoed kan, indien de raad daartoe besluit, verplichting worden aangegaan voordat de
      desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt gedeputeerde staten terstond
      toegezonden. Is de aangegane verplichting geraamd bij een begrotingswijziging welke nog niet ter goedkeuring is
      ingezonden, dan wordt deze begrotingswijziging te zamen met het besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel209
  - number: '209.2'
    text: Over het in het eerste lid bedoelde besluit stemt de raad bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel209
  - number: '210.1'
    text: |-
      Indien de raad [artikel 209][ref1] heeft toegepast en gedeputeerde staten hun goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthouden, kunnen zij binnen een maand nadat hun besluit onherroepelijk is
      geworden, de leden van de raad die hun stem vóór het in [artikel 209][ref2] bedoelde besluit hebben uitgebracht,
      ieder voor een gelijk deel, persoonlijk voor deze verplichting aansprakelijk stellen tegenover de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel209
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel209
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '210.2'
    text: |-
      De werking van het besluit tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel210
  - number: '210.3'
    text: |-
      De commissaris van de Koning stelt zo nodig namens en ten laste van de gemeente een rechtsvordering in tot betaling
      van de krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel210
  - number: '211'
    text: |-
      Indien de begroting van een gemeente ingevolge [artikel 203, eerste of tweede lid][ref1], is onderworpen aan
      goedkeuring, kunnen gedeputeerde staten bepalen dat door hen aan te wijzen beslissingen van het gemeentebestuur die
      financiële gevolgen voor de gemeente hebben of kunnen hebben, door het college binnen twee weken aan gedeputeerde
      staten worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '212.1'
    text: |-
      De raad stelt bij verordening de uitgangspunten voor het financiële beleid, alsmede voor het financiële beheer
      en voor de inrichting van de financiële organisatie vast. Deze verordening waarborgt dat aan de eisen van
      rechtmatigheid, verantwoording en controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel212
  - number: '212.2'
    text: 'De verordening bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel212
  - number: 212.2.a
    text: regels voor waardering en afschrijving van activa;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel212
  - number: 212.2.b
    text: |-
      grondslagen voor de berekening van de door het gemeentebestuur in rekening te brengen prijzen en van tarieven voor
      rechten als bedoeld in [artikel 229b][ref1], alsmede, voor zover deze wordt geheven, voor de heffing bedoeld in
      [artikel 15.33 van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 229b
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 212.2.c
    text: regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel212
  - number: '213.1'
    text: |-
      De raad stelt bij verordening regels vast voor de controle op het financiële beheer en op de inrichting van de
      financiële organisatie. Deze verordening waarborgt dat de rechtmatigheid van het financiële beheer en van de
      inrichting van de financiële organisatie wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.2'
    text: |-
      De raad wijst een of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 197][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '213.3'
    text: 'De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.3.a
    text: |-
      de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en samenstelling van het
      vermogen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.3.b
    text: de baten en lasten, alsmede de balansmutaties rechtmatig tot stand zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.3.c
    text: |-
      de jaarrekening is opgesteld in overeenstemming met de bij of krachtens algemene maatregel van bestuur te stellen
      regels, bedoeld in [artikel 186][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
        hoofdstuk: XII
  - number: 213.3.d
    text: het jaarverslag met de jaarrekening verenigbaar is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.4'
    text: 'Het verslag van bevindingen bevat in ieder geval bevindingen over:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.4.a
    text: |-
      de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.4.b
    text: onrechtmatigheden in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.5'
    text: |-
      De accountant zendt de accountantsverklaring en het verslag van bevindingen aan de raad en een afschrift daarvan
      aan het college.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.7'
    text: |-
      Accountants als bedoeld in het tweede lid kunnen in gemeentelijke dienst worden aangesteld en worden in dat geval
      door de raad benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: '213.8'
    text: |-
      Indien de raad op grond van het tweede lid accountants heeft aangewezen die in gemeentelijke dienst zijn
      aangesteld, is:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
  - number: 213.8.a
    text: |-
      het bepaalde bij en krachtens de [artikelen 25][ref1], [25a][ref2] en
      [27 van de Wet toezicht accountantsorganisaties][ref3] van overeenkomstige toepassing op deze accountants;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '27'
  - number: 213.8.b
    text: |-
      het bepaalde bij en krachtens de [artikelen 14][ref1], [18][ref2], [19][ref3], [20][ref4] en
      [21 van de Wet toezicht accountantsorganisaties][ref5] van overeenkomstige toepassing op de gemeente; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel21
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0019468
        artikel: '21'
  - number: 213.8.c
    text: |-
      het bepaalde bij en krachtens de [artikelen 15][ref1] en [16 van de Wet toezicht accountantsorganisaties][ref2]
      van overeenkomstige toepassing op de personen die de dagelijkse leiding hebben over het onderdeel van de gemeente
      waarbij de in de aanhef bedoelde accountants werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
  - number: '213.9'
    text: |-
      Indien een gemeente wordt aangewezen als organisatie van openbaar belang als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Wet toezicht accountantsorganisaties][ref1], zijn de
      [artikelen 22 tot en met 24 van die wet][ref2] van overeenkomstige toepassing op deze gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '22'
  - number: 213a.1
    text: |-
      Het college verricht periodiek onderzoek naar de doelmatigheid en de doeltreffendheid van het door hem gevoerde
      bestuur. De raad stelt bij verordening regels hierover.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213a
  - number: 213a.2
    text: Het college brengt schriftelijk verslag uit aan de raad van de resultaten van de onderzoeken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213a
  - number: 213a.3
    text: |-
      Het college stelt de rekenkamer of, indien geen rekenkamer is ingesteld, personen die de rekenkamerfunctie
      uitoefenen, tijdig op de hoogte van de onderzoeken die hij doet instellen en zendt haar, onderscheidenlijk hen, een
      afschrift van een verslag als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel213a
  - number: '214'
    text: |-
      Het college zendt de verordeningen, bedoeld in de [artikelen 212][ref1], [213][ref2] en [213a][ref3], binnen twee
      weken na vaststelling door de raad aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213a
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 213a
        hoofdstuk: XIV
  - number: '215'
    text: |-
      Gedeputeerde staten kunnen te allen tijde een onderzoek instellen naar het beheer en de inrichting van de
      financiële organisatie, bedoeld in [artikel 212, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
  - number: '216'
    text: |-
      De raad besluit tot het invoeren, wijzigen of afschaffen van een gemeentelijke belasting door het vaststellen van
      een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel216
  - number: '217'
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel217
  - number: '219.1'
    text: |-
      Behalve de gemeentelijke belastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen
      andere belastingen geheven dan die bedoeld in de [tweede][ref1] en [derde paragraaf van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: '219.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de [tweede][ref1] en
      [derde paragraaf van dit hoofdstuk][ref2] kunnen de gemeentelijke belastingen worden geheven naar in de
      belastingverordening te bepalen heffingsmaatstaven, met dien verstande dat het bedrag van een gemeentelijke
      belasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: '220'
    text: |-
      Ter zake van binnen de gemeente gelegen onroerende zaken kunnen onder de naam onroerende-zaakbelastingen worden
      geheven:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220
  - number: 220.a
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar onroerende zaken die niet in hoofdzaak tot woning
      dienen, al dan niet krachtens eigendom, bezit, beperkt recht of persoonlijk recht, gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220
  - number: 220.b
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar van onroerende zaken het genot hebben krachtens
      eigendom, bezit of beperkt recht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220
  - number: 220a.1
    text: |-
      Met betrekking tot de onroerende-zaakbelastingen wordt als onroerende zaak aangemerkt de onroerende zaak, bedoeld
      in [hoofdstuk III van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
  - number: 220a.2
    text: |-
      Een onroerende zaak dient in hoofdzaak tot woning indien de waarde die op grond van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] is vastgesteld voor die onroerende zaak in hoofdzaak
      kan worden toegerekend aan delen van de onroerende zaak die dienen tot woning dan wel volledig dienstbaar zijn
      aan woondoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 220b.1
    text: |-
      Voor de toepassing van [artikel 220, onderdeel a][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220b.1.a
    text: |-
      gebruik door degene aan wie een deel van een onroerende zaak in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de belasting
      als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220b
  - number: 220b.1.b
    text: |-
      het ter beschikking stellen van een onroerende zaak voor volgtijdig gebruik aangemerkt als gebruik door degene die
      die onroerende zaak ter beschikking heeft gesteld; degene die de onroerende zaak ter beschikking heeft gesteld is
      bevoegd de belasting als zodanig te verhalen op degene aan wie die zaak ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220b
  - number: 220b.2
    text: |-
      Voor de toepassing van [artikel 220, onderdeel b][ref1], wordt als genothebbende krachtens eigendom, bezit of
      beperkt recht aangemerkt degene die bij het begin van het kalenderjaar als zodanig in de basisregistratie kadaster
      is vermeld, tenzij blijkt dat hij op dat tijdstip geen genothebbende krachtens eigendom, bezit of beperkt recht is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220c
    text: |-
      De heffingsmaatstaf voor de onroerende-zaakbelastingen is de op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] voor de onroerende zaak vastgestelde waarde voor het
      kalenderjaar, bedoeld in [artikel 220][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220c
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220d.1
    text: |-
      In afwijking in zoverre van [artikel 220c][ref1] wordt bij de bepaling van de heffingsmaatstaf voor de onroerende-
      zaakbelastingen buiten aanmerking gelaten, voor zover dit niet reeds is geschied bij de bepaling van de in dat
      artikel bedoelde waarde, de waarde van:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220c
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220c
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220d.1.a
    text: |-
      ten behoeve van de land- of bosbouw bedrijfsmatig geëxploiteerde cultuurgrond, daaronder mede begrepen de open
      grond, alsmede de ondergrond van glasopstanden, die bedrijfsmatig aangewend wordt voor de kweek of teelt van
      gewassen, zonder daarbij de ondergrond als voedingsbodem te gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.b
    text: |-
      glasopstanden, die bedrijfsmatig worden aangewend voor de kweek of teelt van gewassen, voor zover de ondergrond
      daarvan bestaat uit de in onderdeel a bedoelde grond;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.c
    text: |-
      onroerende zaken die in hoofdzaak zijn bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningssamenkomsten van levensbeschouwelijke aard, een en ander met uitzondering van delen van zodanige
      onroerende zaken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.d
    text: |-
      één of meer onroerende zaken die deel uitmaken van een op de voet van de [Natuurschoonwet 1928][ref1] aangewezen
      landgoed dat voldoet aan bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, met uitzondering
      van de daarop voorkomende gebouwde eigendommen;


      [ref1]: https://wetten.overheid.nl/BWBR0001939
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0001939
  - number: 220d.1.e
    text: |-
      natuurterreinen, waaronder mede worden verstaan duinen, heidevelden, zandverstuivingen, moerassen en plassen, die
      door rechtspersonen met volledige rechtsbevoegdheid welke zich uitsluitend of nagenoeg uitsluitend het behoud van
      natuurschoon ten doel stellen, beheerd worden;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.f
    text: openbare land- en waterwegen en banen voor openbaar vervoer per rail, een en ander met inbegrip van kunstwerken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.g
    text: |-
      waterverdedigings- en waterbeheersingswerken die worden beheerd door organen, instellingen of diensten van
      publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.h
    text: |-
      werken die zijn bestemd voor de zuivering van riool- en ander afvalwater en die worden beheerd door organen,
      instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken
      die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.i
    text: |-
      een onroerende zaak of een deel daarvan waarvan de waarde ingevolge de gemeentelijke belastingverordening bij de
      bepaling van de heffingsmaatstaf buiten aanmerking blijft;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.1.j
    text: |-
      werktuigen die van een onroerende zaak kunnen worden afgescheiden zonder dat beschadiging van betekenis aan die
      werktuigen wordt toegebracht en die niet op zichzelf als gebouwde eigendommen zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
  - number: 220d.2
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a en b, wordt het begrip landbouw opgevat als in
      [artikel 312 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel312
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '312'
  - number: 220d.3
    text: |-
      Bij de toepassing van het eerste lid is het bepaalde bij of krachtens de [artikelen 17][ref1], [18][ref2] en
      [20, tweede lid, van de Wet waardering onroerende zaken][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
  - number: 220d.4
    text: |-
      Indien met betrekking tot een onroerende zaak geen waarde is vastgesteld op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] wordt de heffingsmaatstaf van die onroerende zaak
      bepaald met toepassing van het eerste en het tweede lid, alsmede met overeenkomstige toepassing van het bepaalde bij
      of krachtens de [artikelen 17][ref2], [18][ref3] en [20, tweede lid, van de Wet waardering onroerende zaken][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '20'
  - number: 220e
    text: |-
      In afwijking van [artikel 220c][ref1] wordt bij de bepaling van de heffingsmaatstaf voor de onroerendezaakbelasting
      bedoeld in [artikel 220, onderdeel a][ref2], buiten aanmerking gelaten de waarde van gedeelten van de onroerende
      zaak die in hoofdzaak tot woning dienen dan wel in hoofdzaak dienstbaar zijn aan woondoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220c
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220e
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220c
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f
    text: |-
      De belasting bedraagt een percentage van de heffingsmaatstaf. Het percentage wordt gelijkelijk vastgesteld voor
      onderscheidenlijk:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220f
  - number: 220f.a
    text: |-
      de belasting, bedoeld in [artikel 220, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f.b
    text: |-
      de belasting, bedoeld in [artikel 220, onderdeel b][ref1], voor zover het onroerende zaken betreft die in hoofdzaak
      tot woning dienen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f.c
    text: |-
      de belasting, bedoeld in [artikel 220, onderdeel b][ref1], voor zover het onroerende zaken betreft die niet in
      hoofdzaak tot woning dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220h.1
    text: |-
      In de belastingverordening kan worden bepaald dat geen belasting wordt geheven indien de heffingsmaatstaf blijft
      beneden € 12 000 dan wel een in de belastingverordening te bepalen lager bedrag.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220h
  - number: 220h.2
    text: |-
      In de belastingverordening kunnen belastingbedragen tot maximaal € 10 worden opgenomen waarvoor geen invordering
      zal plaatsvinden. Voor de toepassing van de vorige volzin kan in de belastingverordening worden bepaald dat
      het totaal van op één aanslagbiljet of kennisgeving verenigde verschuldigde bedragen wordt aangemerkt als één
      belastingbedrag.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel220h
  - number: '221.1'
    text: |-
      Ter zake van binnen de gemeente gelegen woon- en bedrijfsruimten, welke duurzaam aan een plaats gebonden zijn
      en dienen tot permanente bewoning of permanent gebruik, doch niet onroerend zijn, kunnen de volgende belastingen
      worden geheven, te weten:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel221
  - number: 221.1.a
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar de ruimten die niet in hoofdzaak tot woning
      dienen, al dan niet krachtens eigendom, bezit, beperkt recht of persoonlijk recht, gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel221
  - number: 221.1.b
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar van de ruimten het genot hebben krachtens
      eigendom, bezit of beperkt recht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel221
  - number: '221.2'
    text: |-
      Bij de toepassing van het eerste lid zijn de [artikelen 220a, tweede lid][ref1], [220b][ref2],
      [220d tot en met 220f][ref3] en [220h][ref4] alsmede het bepaalde bij of krachtens de [artikelen 17][ref5] en
      [18 van de Wet waardering onroerende zaken][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220b
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel220h
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0007119#Artikel18
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220a
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220b
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 220d
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 220h
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref6
        bwb_id: BWBR0007119
        artikel: '18'
  - number: '221.3'
    text: |-
      Het tarief van de in het eerste lid bedoelde belastingen is gelijk aan het binnen de gemeente geldende tarief voor
      de onroerendezaakbelastingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel221
  - number: '222.1'
    text: |-
      Ter zake van de in een bepaald gedeelte van de gemeente gelegen onroerende zaak die gebaat is door voorzieningen
      die tot stand worden of zijn gebracht door of met medewerking van het gemeentebestuur, kan van degenen die van
      die onroerende zaak het genot hebben krachtens eigendom, bezit of beperkt recht, een baatbelasting worden geheven,
      waarbij de aan de voorzieningen verbonden lasten geheel of gedeeltelijk worden omgeslagen. Indien de aan de
      voorzieningen verbonden lasten ter zake van een onroerende zaak krachtens overeenkomst zijn of worden voldaan,
      of met toepassing van [artikel 6.17, eerste lid, van de Wet ruimtelijke ordening][ref1] zijn of behoren te worden
      voldaan, wordt de baatbelasting ter zake van die onroerende zaak niet geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6'
  - number: '222.2'
    text: |-
      Voordat met het treffen van voorzieningen wordt aangevangen, wordt door de raad besloten in welke mate de aan die
      voorzieningen verbonden lasten door middel van een baatbelasting zullen worden verhaald. Een besluit als bedoeld in
      de eerste volzin bevat een aanduiding van het gebied waarbinnen de gebate onroerende zaak is gelegen. Het besluit
      wordt bekend gemaakt overeenkomstig [artikel 139][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '222.3'
    text: |-
      Of een onroerende zaak is gebaat wordt beoordeeld naar de toestand op een in de belastingverordening te bepalen
      tijdstip, dat is gelegen uiterlijk een jaar nadat de voorzieningen geheel zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel222
  - number: '222.4'
    text: Tot invoering van de belasting wordt besloten uiterlijk twee jaren nadat de voorzieningen geheel zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel222
  - number: '222.5'
    text: |-
      De belasting wordt ineens geheven, met dien verstande dat de belasting op verzoek van de belastingplichtige in
      de vorm van een jaarlijkse belasting wordt geheven gedurende ten hoogste dertig jaren, een en ander volgens in de
      verordening vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel222
  - number: '223.1'
    text: |-
      Er kan een forensenbelasting worden geheven van de natuurlijke personen, die, zonder in de gemeente hoofdverblijf
      te hebben, er gedurende het belastingjaar meer dan negentig malen nachtverblijf houden, anders dan als verpleegde
      of verzorgde in een inrichting tot verpleging of verzorging van zieken, van gebrekkigen, van hulpbehoevenden
      of bejaarden, of er op meer dan negentig dagen van dat jaar voor zich of hun gezin een gemeubileerde woning
      beschikbaar houden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel223
  - number: '223.2'
    text: |-
      Degene die ter tijdelijke waarneming van een openbare betrekking of ter bijwoning van de vergaderingen van een
      algemeen vertegenwoordigend orgaan, waarvan hij het lidmaatschap bekleedt, dan wel ingevolge last of bevel van de
      overheid, buiten de gemeente van zijn hoofdverblijf vertoeft, is op die grond niet belastingplichtig.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel223
  - number: '223.3'
    text: Of iemand in de gemeente hoofdverblijf heeft, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel223
  - number: '224.1'
    text: |-
      Ter zake van het houden van verblijf binnen de gemeente door personen die niet als ingezetene in de gemeentelijke
      basisadministratie persoonsgegevens zijn ingeschreven, kan een toeristenbelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel224
  - number: '224.2'
    text: |-
      Voor zover de belasting wordt geheven van degene die gelegenheid tot verblijf biedt, is deze bevoegd de belasting
      als zodanig te verhalen op degene ter zake van wiens verblijf de belasting verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel224
  - number: '225.1'
    text: 'In het kader van de parkeerregulering kunnen de volgende belastingen worden geheven:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: 225.1.a
    text: |-
      een belasting ter zake van het parkeren van een voertuig op een bij de belastingverordening dan wel krachtens de
      belastingverordening in de daarin aangewezen gevallen door het college te bepalen plaats, tijdstip en wijze;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: 225.1.b
    text: |-
      een belasting ter zake van een van gemeentewege verleende vergunning voor het parkeren van een voertuig op de in
      die vergunning aangegeven plaats en wijze.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder parkeren verstaan het gedurende een aaneengesloten periode
      doen of laten staan van een voertuig, anders dan gedurende de tijd die nodig is voor en gebruikt wordt tot het
      onmiddellijk in- en uitstappen van personen dan wel het onmiddellijk laden of lossen van zaken, op de binnen de
      gemeente gelegen voor het openbaar verkeer openstaande terreinen of weggedeelten, waarop dit doen of laten staan
      niet ingevolge een wettelijk voorschrift is verboden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.3'
    text: De belasting, bedoeld in het eerste lid, onderdeel *a*, wordt geheven van degene die het voertuig heeft geparkeerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.4'
    text: |-
      Als degene die het voertuig heeft geparkeerd wordt mede aangemerkt degene die de belasting voldoet dan wel te
      kennen geeft of heeft gegeven de belasting te willen voldoen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.5'
    text: |-
      Zolang geen voldoening van de in het eerste lid, onderdeel *a*, bedoelde belasting heeft plaatsgevonden wordt
      de houder van het voertuig aangemerkt als degene die het voertuig heeft geparkeerd. Met betrekking tot een
      motorrijtuig dat is ingeschreven in het kentekenregister, bedoeld in de [Wegenverkeerswet 1994][ref1], wordt als
      houder aangemerkt degene op wiens naam het voor het motorrijtuig opgegeven kenteken ten tijde van het parkeren in
      het register was ingeschreven. De tweede volzin vindt geen toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 225.5.a
    text: |-
      blijkt dat ten tijde van het parkeren een ander in het kentekenregister had moeten staan ingeschreven, in welk
      geval die ander wordt aangemerkt als degene die het voertuig heeft geparkeerd;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: 225.5.b
    text: |-
      een voor ten hoogste drie maanden aangegane huurovereenkomst wordt overgelegd waaruit blijkt wie ten tijde van het
      parkeren ingevolge deze overeenkomst de huurder van het voertuig was, in welk geval de huurder wordt aangemerkt als
      degene die het voertuig heeft geparkeerd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.6'
    text: |-
      De belasting wordt niet geheven van degene die ingevolge het vijfde lid is aangemerkt als degene die het voertuig
      heeft geparkeerd, indien deze aannemelijk maakt dat ten tijde van het parkeren een ander tegen zijn wil van het
      voertuig gebruik heeft gemaakt en dat hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.7'
    text: |-
      De belasting, bedoeld in het eerste lid, onderdeel *b*, wordt geheven van degene die de vergunning heeft
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '225.8'
    text: |-
      Het tarief van de in het eerste lid bedoelde belastingen kan afhankelijk worden gesteld van de parkeerduur, van de
      parkeertijd, van de ingenomen oppervlakte en van de ligging van de terreinen of weggedeelten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel225
  - number: '226.1'
    text: Ter zake van het houden van een hond kan van de houder een hondenbelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel226
  - number: '226.2'
    text: De belasting wordt geheven naar het aantal honden dat wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel226
  - number: '226.3'
    text: |-
      Voor de toepassing van het eerste lid wordt het houden van een hond door een lid van een huishouden aangemerkt
      als het houden van een hond door een door de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar aan te wijzen lid van dat huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '227'
    text: Ter zake van openbare aankondigingen zichtbaar vanaf de openbare weg kan een reclamebelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel227
  - number: '228'
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde gemeentegrond, kan een
      precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228
  - number: 228a.1
    text: |-
      Onder de naam rioolheffing kan een belasting worden geheven ter bestrijding van de kosten die voor de gemeente
      verbonden zijn aan:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228a
  - number: 228a.1.a
    text: |-
      de inzameling en het transport van huishoudelijk afvalwater en bedrijfsafvalwater, alsmede de zuivering van
      huishoudelijk afvalwater en
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228a
  - number: 228a.1.b
    text: |-
      de inzameling van afvloeiend hemelwater en de verwerking van het ingezamelde hemelwater, alsmede het treffen van
      maatregelen teneinde structureel nadelige gevolgen van de grondwaterstand voor de aan de grond gegeven bestemming
      zoveel mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228a
  - number: 228a.2
    text: |-
      Ter zake van de kosten, bedoeld in het eerste lid, onderdelen a en b, kunnen twee afzonderlijke belastingen worden
      geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228a
  - number: 228a.3
    text: |-
      Onder de kosten, bedoeld in het eerste lid, wordt mede verstaan de omzetbelasting die als gevolg van de
      [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit dat fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel228a
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '229.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
  - number: 229.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde gemeentebezittingen of van voor de
      openbare dienst bestemde werken of inrichtingen die bij de gemeente in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
  - number: 229.1.b
    text: het genot van door of vanwege het gemeentebestuur verstrekte diensten;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
  - number: 229.1.c
    text: |-
      het geven van vermakelijkheden waarbij gebruik wordt gemaakt van door of met medewerking van het gemeentebestuur
      tot stand gebrachte of in stand gehouden voorzieningen of waarbij een bijzondere voorziening in de vorm van
      toezicht of anderszins van de zijde van het gemeentebestuur getroffen wordt.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
  - number: '229.2'
    text: |-
      Geen rechten kunnen worden geheven ter zake van het gebruik van voorzieningen en het genot van diensten waarvan
      de kosten kunnen worden bestreden door het heffen van een belasting als bedoeld in [artikel 228a][ref1], zulks
      met uitzondering van het aanbrengen van een aansluiting op een voorziening voor de inzameling en het transport
      van afvalwater als bedoeld in [artikel 10.31 van de Wet milieubeheer][ref2] of op een systeem als bedoeld in
      [artikel 10.33, tweede lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel228a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 228a
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '229.3'
    text: |-
      Voor de toepassing van deze paragraaf en de eerste en vierde paragraaf van dit hoofdstuk worden de in het eerste
      lid bedoelde rechten aangemerkt als gemeentelijke belastingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229
  - number: 229a
    text: |-
      De rechten, bedoeld in [artikel 229, eerste lid, onder a en b][ref1], kunnen worden geheven door de gemeente die
      het gebruik van de bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare
      feit zich binnen of buiten het grondgebied van de gemeente voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229b.1
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in [artikel 229, eerste lid, onder a en b][ref1], worden
      geheven, worden de tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde
      lasten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229b.2
    text: 'Onder de in het eerste lid bedoelde lasten worden mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229b
  - number: 229b.2.a
    text: bijdragen aan bestemmingsreserves en voorzieningen voor noodzakelijke vervanging van de betrokken activa;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229b
  - number: 229b.2.b
    text: |-
      de omzetbelasting die ingevolge de [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het
      fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229b
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: 229c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in de [tweede][ref1] en
      [derde paragraaf van dit hoofdstuk][ref2], nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel229c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: '230'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel230
  - number: 230.a
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 230.b
    text: 'heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel230
  - number: '231.1'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van
      gemeentelijke belastingen met toepassing van de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] als waren die belastingen rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '231.2'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, met betrekking tot de gemeentelijke
      belastingen voor de daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: 231.2.a
    text: 'Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het college;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: 231.2.b
    text: 'de inspecteur: de gemeenteambtenaar, belast met de heffing van gemeentelijke belastingen;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: 231.2.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de gemeenteambtenaar belast met de invordering van
      gemeentelijke belastingen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: 231.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de gemeenteambtenaren belast met de heffing of de invordering van
      gemeentelijke belastingen;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: 231.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen gemeenteambtenaar;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: 231.2.f
    text: 'de Tweede Kamer der Staten-Generaal of de Tweede Kamer: de raad.'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
  - number: '231.3'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot gemeentelijke belastingen in
      de [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor «algemene maatregel van bestuur» en voor
      «ministeriële regeling» gelezen: besluit van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '231.4'
    text: |-
      Met betrekking tot gemeentelijke belastingen wordt in [artikel 24 van de Invorderingswet 1990][ref1] voor «de
      Staat» gelezen: de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '232.1'
    text: |-
      Het college kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] voor de in [artikel 231, tweede lid, onderdeel c][ref2],
      bedoelde ambtenaar een andere gemeenteambtenaar in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.2'
    text: |-
      De colleges van twee of meer gemeenten kunnen met betrekking tot een of meer gemeentelijke belastingen bepalen dat
      ambtenaren van een van die gemeenten worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
  - number: 232.2.a
    text: |-
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.b
    text: |-
      de in [artikel 231, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.c
    text: |-
      de in [artikel 231, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.d
    text: |-
      de in [artikel 231, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van die gemeenten, voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van gemeentelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het college van de gemeente waarvan de ambtenaar,
      belast met de invordering van gemeentelijke belastingen op grond van het tweede lid, onderdeel *b*, wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
  - number: '232.4'
    text: |-
      Indien voor de heffing of de invordering van gemeentelijke belastingen een gemeenschappelijke regeling is getroffen
      en bij die regeling een openbaar lichaam is ingesteld, kan bij of krachtens die regeling worden bepaald dat een
      daartoe aangewezen ambtenaar van dat openbare lichaam wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
  - number: 232.4.a
    text: |-
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.b
    text: |-
      de in [artikel 231, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.c
    text: |-
      de in [artikel 231, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van de gemeente voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.d
    text: |-
      de in [artikel 231, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van gemeentelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      waarvan een ambtenaar op grond van het vierde lid, onderdeel b, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel232
  - number: '233'
    text: |-
      Gemeentelijke belastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op
      andere wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233
  - number: 233a.1
    text: |-
      Indien de gemeentelijke belastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke
      wijze deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het college omtrent de uitvoering van een en ander nadere regels
      geeft.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233a
  - number: 233a.2
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1] en de
      [Invorderingswet 1990][ref2] aangemerkt als bij wege van aanslag geheven belastingen, met dien verstande dat wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 233a.2.a
    text: |-
      de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233a
  - number: 233a.2.b
    text: 'het aanslagbiljet: de kennisgeving van het in onderdeel *a* bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233a
  - number: 233a.2.c
    text: |-
      de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel233a
  - number: '234.1'
    text: |-
      De belasting, bedoeld in [artikel 225, eerste lid, onder a][ref1], wordt geheven bij wege van voldoening op
      aangifte dan wel op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
  - number: '234.2'
    text: 'Als voldoening op aangifte wordt uitsluitend aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: 234.2.a
    text: |-
      het bij de aanvang van het parkeren in werking stellen van een parkeermeter of een parkeerautomaat op de daartoe
      bestemde wijze en met inachtneming van de door het college gestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: 234.2.b
    text: |-
      indien ingevolge [artikel 235, eerste lid][ref1], een wielklem is aangebracht, de voldoening op aangifte op de door
      het college bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '235'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '234.3'
    text: |-
      Ingeval een naheffingsaanslag wordt opgelegd, wordt deze berekend over een parkeerduur van een uur, tenzij
      aannemelijk is dat het voertuig langer dan een uur zonder betaling geparkeerd heeft gestaan.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: '234.4'
    text: |-
      De [artikelen 67b][ref1], [67c][ref2] en [67f van de Algemene wet][ref3] blijven buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '234.5'
    text: |-
      Ter zake van het opleggen van een naheffingsaanslag worden kosten in rekening gebracht. Deze kosten maken onderdeel
      uit van de naheffingsaanslag en worden afzonderlijk op het aanslagbiljet vermeld. Ten aanzien van hetzelfde
      voertuig worden per aaneengesloten periode de kosten niet vaker dan eenmaal per kalenderdag in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: '234.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van berekening en de maximale
      hoogte van de in het vijfde lid bedoelde kosten. In de belastingverordening wordt het bedrag van de in rekening te
      brengen kosten bepaald.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: '234.7'
    text: |-
      In afwijking van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] kan, indien het niet mogelijk is
      het aanslagbiljet terstond aan de belastingschuldige uit te reiken, worden volstaan met het aanbrengen van het
      aanslagbiljet op of aan het voertuig. Alsdan vermeldt het aanslagbiljet niet de naam van de belastingschuldige maar
      het kenteken van het voertuig. Bij gebreke van een kenteken vermeldt het aanslagbiljet een of meer gegevens die
      kenmerkend zijn voor het geparkeerde voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
  - number: '234.8'
    text: De naheffingsaanslag is dadelijk en ineens invorderbaar.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel234
  - number: '235.1'
    text: |-
      Bij de belastingverordening, bedoeld in [artikel 225, eerste lid, onder a][ref1], kan worden bepaald
      dat terstond nadat het aanslagbiljet aan de belastingschuldige is uitgereikt dan wel terstond nadat het
      aanslagbiljet, overeenkomstig [artikel 234, zevende lid][ref2], aan het voertuig is aangebracht, de in
      [artikel 231, tweede lid, onderdeel b][ref3], bedoelde gemeenteambtenaar bevoegd is tot zekerheid van de betaling
      van de naheffingsaanslag, bedoeld in artikel 234, derde lid, aan het voertuig een mechanisch hulpmiddel, hierna te
      noemen: wielklem, te doen aanbrengen, waardoor wordt verhinderd dat het voertuig wordt weggereden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '234'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.2'
    text: |-
      Bij de belastingverordening dan wel krachtens de belastingverordening in de daarin aangewezen gevallen door het
      college worden de terreinen of weggedeelten aangewezen waar de wielklem wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.3'
    text: Ter zake van het aanbrengen alsmede van het verwijderen van de wielklem worden kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.4'
    text: |-
      De wielklem wordt niet verwijderd dan nadat de naheffingsaanslag alsmede de kosten van het aanbrengen en van het
      verwijderen van de wielklem zijn voldaan. Na deze voldoening vindt de verwijdering van de wielklem zo spoedig
      mogelijk plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.5'
    text: |-
      Na afloop van een in de belastingverordening te bepalen termijn, die ten minste 24 uren bedraagt na aanbrenging
      van de wielklem, is de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar bevoegd het
      voertuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen. Ter zake van de
      in de eerste volzin bedoelde overbrenging en bewaring wordt procesverbaal opgemaakt en worden kosten in rekening
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.6'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar draagt er zorg voor dat in
      een daartoe aangelegd register aantekening wordt gemaakt van de gevallen waarin de in het vijfde lid bedoelde
      bevoegdheid wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.7'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar draagt zorg voor de bewaring van de
      ingevolge het vijfde lid in bewaring gestelde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.8'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar geeft het voertuig terug aan de
      rechthebbende, nadat de naheffingsaanslag, de kosten van het aanbrengen en verwijderen van de wielklem en de kosten
      van overbrenging en bewaring zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.9'
    text: |-
      Wanneer het voertuig binnen 48 uren na het in bewaring stellen niet is afgehaald, geeft de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar zo mogelijk binnen zeven dagen van de
      overbrenging en bewaring kennis:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 235.9.a
    text: |-
      indien het voertuig een motorrijtuig is, dat een kenteken voert als bedoeld in
      [artikel 36, eerste lid, van de Wegenverkeerswet 1994][ref1], aan degene aan wie dat kenteken is opgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: 235.9.b
    text: |-
      indien blijkt dat ter zake van het voertuig aangifte van vermissing is gedaan, aan degene die aangifte heeft
      gedaan;
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: 235.9.c
    text: in nader door Onze Minister te bepalen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.10'
    text: |-
      De kosten van opsporing van degene aan wie de kennisgeving wordt gezonden en die van het doen van de kennisgeving
      worden voor de toepassing van dit artikel gerekend tot de kosten van overbrenging en bewaring.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.11'
    text: |-
      Wanneer het voertuig binnen drie maanden na het in bewaring stellen niet is afgehaald, is de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar bevoegd het te verkopen of, indien
      verkoop naar hun oordeel niet mogelijk is, het voertuig om niet aan een derde in eigendom over te dragen of
      te laten vernietigen. Gelijke bevoegdheid heeft de in [artikel 231, tweede lid, onderdeel b][ref2], bedoelde
      gemeenteambtenaar ook binnen die termijn, zodra het gezamenlijke bedrag van de naheffingsaanslag, de kosten van
      het aanbrengen en verwijderen van de wielklem en de kosten van overbrenging en bewaring, vermeerderd met de voor
      de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde kosten, in verhouding tot de waarde van het
      voertuig naar zijn mening onevenredig hoog zou worden. Verkoop, eigendomsoverdracht om niet of vernietiging vindt
      niet plaats binnen twee weken nadat de kennisgeving als bedoeld in het negende lid is uitgegaan. Voor de toepassing
      van de volgende leden worden de kosten van verkoop, eigendomsoverdracht om niet of vernietiging gerekend tot de
      kosten van overbrenging en bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.12'
    text: |-
      Gedurende drie jaren na het tijdstip van de verkoop heeft degene, die op dat tijdstip eigenaar was, recht op
      de opbrengst van het voertuig, met dien verstande dat eerst de kosten van het aanbrengen en verwijderen van de
      wielklem en van het overbrengen en bewaren van het voertuig en vervolgens de naheffingsaanslag met die opbrengst
      worden verrekend. Na het verstrijken van die termijn vervalt het eventueel batige saldo aan de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.13'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van berekening van de kosten
      van het aanbrengen en verwijderen van de wielklem en van het overbrengen en bewaren van het voertuig. In de
      belastingverordening wordt bepaald tot welke bedragen de kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.14'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar stelt het bedrag van de in rekening
      te brengen kosten vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.15'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de overbrenging, bewaring, verkoop,
      eigendomsoverdracht om niet en vernietiging, het inrichten en aanhouden van het in het zesde lid bedoelde register,
      alsmede omtrent hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '235.16'
    text: |-
      Indien aantoonbaar is dat door het aanbrengen of het verwijderen van de wielklem dan wel tijdens de overbrenging en
      bewaring schade aan het voertuig is toegebracht, is de gemeente gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel235
  - number: '236.1'
    text: |-
      Bij de heffing van gemeentelijke belastingen blijven de [artikelen 2, vierde lid][ref1], [3][ref2],
      [37 tot en met 39][ref3], [47a][ref4], [48][ref5], [52][ref6], [53][ref7], [54][ref8], [55][ref9], [62][ref10],
      [71][ref11], [76][ref12], [80, tweede, derde en vierde lid][ref13], [82][ref14], [84][ref15], [86][ref16],
      [87][ref17] en [90 tot en met 95 van de Algemene wet][ref18] buiten toepassing. Bij de heffing van gemeentelijke
      belastingen die op andere wijze worden geheven, blijven bovendien de [artikelen 5][ref19], [6 tot en met 9][ref20],
      [11, tweede lid][ref21], en [12 van die wet][ref22] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel3
