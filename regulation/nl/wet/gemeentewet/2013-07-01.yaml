        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 87a.1
    text: |-
      De raad, het college of de burgemeester kan besluiten en andere, niet-schriftelijke, beslissingen gericht op enig
      rechtsgevolg van een deelraad, een dagelijks bestuur van een deelgemeente, onderscheidenlijk een voorzitter van
      het dagelijks bestuur, vernietigen. De raad kan zijn bevoegdheid tot schorsing overdragen aan het college. Ten
      aanzien van de vernietiging van niet-schriftelijke beslissingen van een deelraad of een dagelijks bestuur gericht
      op enig rechtsgevolg zijn de [afdelingen 10.2.2.][ref1] en [10.2.3. van de Algemene wet bestuursrecht][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: 87a.2
    text: |-
      De in [artikel 87, tweede lid][ref1], bedoelde verordening bevat een regeling over het overig toezicht op
      de uitoefening van de bevoegdheden door een deelraad of het dagelijks bestuur van een deelgemeente. Dit
      overig toezicht kan de goedkeuring van de raad of het college bevatten van beslissingen van een deelraad,
      onderscheidenlijk dagelijks bestuur. De goedkeuring kan slechts worden onthouden wegens strijd met het
      recht of het algemeen belang. Ten aanzien van de goedkeuring van andere beslissingen dan besluiten is
      [afdeling 10.2.1. van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel87a
    references:
