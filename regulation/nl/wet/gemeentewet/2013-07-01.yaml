    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81f
  - number: 81f.2.c
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81f
  - number: 81g.1
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van de rekenkamer in de vergadering van de raad, in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot lid van
      de rekenkamer benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift
      of gunst heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten,
      rechtstreeks noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat
      ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als lid van de
      rekenkamer naar eer en geweten zal vervullen. Zo waarlijk helpe mij God Almachtig!» («Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 81g.2
    text: |-
      Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de tekst
      van de eed (verklaring en belofte) als volgt: «Ik swar (ferklearje) dat ik, om ta lid fan 'e rekkenkeamer beneamd
      te wurden, streekrjocht noch midlik, ûnder wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of
      ûnthjitten haw. Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch
      midlik hokker geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil. Ik swar (ûnthjit) dat ik trou wêze
      sil oan 'e [Grûnwet][ref1], dat ik de wetten neikomme sil en dat ik myn plichten as lid fan 'e rekkenkeamer yn
      alle oprjochtens ferfolje sil. Sa wier helpe my God Almachtich!» («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81g
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 81h
    text: |-
      [Artikel 15, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81h
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: 81i.1
    text: |-
      De rekenkamer stelt een reglement van orde voor haar werkzaamheden vast en, indien zij uit twee of meer personen
      bestaat, tevens voor haar vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81i
  - number: 81i.2
    text: |-
      De rekenkamer zendt het reglement ter kennisneming aan de raad en maakt het bekend op de in
      [artikel 139, tweede lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81i
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 81j.1
    text: |-
      De raad stelt, na overleg met de rekenkamer, de rekenkamer de nodige middelen ter beschikking voor een goede
      uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81j
  - number: 81j.2
    text: |-
      Op voordracht van de voorzitter of het enige lid van de rekenkamer benoemt het college zoveel ambtenaren van de
      rekenkamer als nodig zijn voor een goede uitoefening van haar werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81j
  - number: 81j.3
    text: |-
      De ambtenaren die werkzaamheden verrichten voor de rekenkamer, verrichten niet tevens werkzaamheden voor een ander
      orgaan van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81j
  - number: 81j.4
    text: |-
      De ambtenaren die werkzaamheden verrichten voor de rekenkamer, zijn ter zake van die werkzaamheden uitsluitend
      verantwoording schuldig aan de rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81j
  - number: 81k
    text: |-
      De leden van de rekenkamer ontvangen een bij verordening van de raad vastgestelde vergoeding voor hun werkzaamheden
      en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005416/2013-07-01#Artikel81k
  - number: 81l
    text: |-
      In afwijking van [artikel 81a][ref1] kan de raad met de raad of de raden van een of meer andere gemeenten
      met toepassing van de [artikelen 1][ref2], en [8, tweede lid, van de Wet gemeenschappelijke regelingen][ref3]
      of met provinciale staten van één of meer provincies, al dan niet met de raad of de raden van een of
      meer andere gemeenten tezamen, met toepassing van [artikel 51][ref4] en [52, eerste lid][ref5], juncto
      [artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen][ref6], een gemeenschappelijke rekenkamer
      instellen. De [artikelen 10, tweede en derde lid][ref7], [10a][ref8], [11][ref9], [15][ref10], [16][ref11],
      [17][ref12], [20, derde lid][ref13], [21][ref14], [22][ref15], [23][ref16], [30][ref17] en [54 van die wet][ref18]
      zijn niet van toepassing.


