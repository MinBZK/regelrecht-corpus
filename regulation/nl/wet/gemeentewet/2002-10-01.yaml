  - number: '237.1'
    text: |-
      Het uitnodigen tot het doen van aangifte, bedoeld in [artikel 6 van de Algemene wet][ref1], geschiedt door het
      uitreiken van een aangiftebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '6'
  - number: '237.2'
    text: |-
      Het doen van aangifte, bedoeld in [artikel 8 van de Algemene wet][ref1], geschiedt door het inleveren of toezenden
      van het uitgereikte aangiftebiljet met de daarbij gevraagde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '8'
  - number: '237.3'
    text: |-
      In afwijking in zoverre van de vorige leden kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een verzoek om
      uitreiking van een aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 237.3.a
    text: |-
      worden de door de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar gevraagde bescheiden
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 237.3.b
    text: |-
      kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar vorderen dat een van de
      mondelinge aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte geacht
      wordt niet te zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '237.4'
    text: |-
      Indien het derde lid toepassing vindt, kan de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar voor de termijnen, genoemd in [artikel 9, eerste lid en derde lid, eerste volzin][ref2],
      [artikel 10, tweede lid][ref3], en [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref4] of voor de
      kortere termijn, bedoeld in [artikel 238, eerste of tweede lid][ref5], kortere termijnen in de plaats stellen en is
      [artikel 12 van de Algemene wet][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel238
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel12
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
