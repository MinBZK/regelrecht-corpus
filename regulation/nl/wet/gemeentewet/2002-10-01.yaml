    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.1.n
    text: lid van het dagelijks bestuur van een deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.1.o
    text: ambtenaar, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: '89.2'
    text: 'In afwijking van het eerste lid, aanhef en onder o, kan een lid van een deelraad tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.2.a
    text: ambtenaar, aangesteld of ondergeschikt aan het deelgemeentebestuur van een andere deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.2.b
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.2.c
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: 89.2.d
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
  - number: '89.3'
    text: |-
      In de in [artikel 87, tweede lid][ref1], bedoelde verordening kan worden bepaald dat in afwijking van het eerste
      lid, aanhef en onder n, een lid van een deelraad tevens lid van het dagelijks bestuur van de betrokken deelgemeente
      kan zijn vanaf de dag van de stemming voor de verkiezing van de leden van de deelraad tot uiterlijk zes weken na de
      eerste vergadering van de deelraad in nieuwe samenstelling na de periodieke verkiezing van zijn leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel87
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '90.1'
    text: 'Een lid van het dagelijks bestuur van een deelgemeente is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.a
    text: minister;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.b
    text: staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.c
    text: lid van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.d
    text: lid van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.e
    text: Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.f
    text: |-
      substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: 90.1.g
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.h
    text: lid van gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.i
    text: griffier der staten;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.j
    text: lid van de raad;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.k
    text: burgemeester;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.l
    text: wethouder;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.m
    text: lid van de rekenkamer;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.n
    text: lid van een deelraad;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.1.o
    text: ambtenaar, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: '90.2'
    text: 'In afwijking van het eerste lid, aanhef en onder o, kan een lid van het dagelijks bestuur tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.2.a
    text: ambtenaar, aangesteld of ondergeschikt aan een deelgemeentebestuur van een andere deelgemeente;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.2.b
    text: ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.2.c
    text: |-
      vrijwilliger of ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten
      verricht;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: 90.2.d
    text: ambtenaar werkzaam voor een school voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
  - number: '90.3'
    text: |-
      In de in [artikel 87, tweede lid][ref1], bedoelde verordening kan worden bepaald dat in afwijking van het eerste
      lid, aanhef en onder n, een lid van het dagelijks bestuur van een deelgemeente tevens lid van de deelraad van de
      betrokken deelgemeente kan zijn vanaf de dag van de stemming voor de verkiezing van de leden van de deelraad tot
      uiterlijk zes weken na de eerste vergadering van de deelraad in nieuwe samenstelling na de periodieke verkiezing
      van zijn leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel87
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '90.4'
    text: |-
      [Artikel 36a][ref1] is van overeenkomstige toepassing op de leden van het dagelijks bestuur van een deelgemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel36a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 36a
        hoofdstuk: III
  - number: '91'
    text: |-
      De [artikelen 14][ref1], [15][ref2], [22][ref3] en [49][ref4] zijn van overeenkomstige toepassing op de leden van
      het deelgemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel49
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '22'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '49'
        hoofdstuk: III
  - number: '92.1'
    text: |-
      Een deelraad brengt dag, tijdstip en plaats van zijn vergadering ter openbare kennis. De agenda en de daarbij
      horende voorstellen, met uitzondering van de in [artikel 86, tweede lid][ref1], bedoelde stukken, worden
      gelijktijdig met de oproeping voor de vergadering en op een bij de openbare kennisgeving aan te geven wijze ter
      inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: '92.2'
    text: |-
      De [artikelen 23][ref1], [24][ref2] en [86][ref3] zijn van overeenkomstige toepassing op een vergadering van een
      deelraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '23'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '24'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: '95.1'
    text: |-
      De leden van de raad ontvangen een bij verordening van de raad vast te stellen vergoeding voor hun werkzaamheden en
      een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel95
  - number: '95.2'
    text: |-
      De raad kan bij verordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere kosten en over
      andere financiële voorzieningen die verband houden met de vervulling van het lidmaatschap van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel95
  - number: '95.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op een lid van de raad dat met inachtneming van
      [artikel 13, tweede lid][ref1], tevens wethouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel13
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '13'
        hoofdstuk: II
  - number: '95.4'
    text: |-
      De verordeningen, bedoeld in het eerste en tweede lid, worden vastgesteld overeenkomstig bij of krachtens algemene
      maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel95
  - number: '96.1'
    text: |-
      De leden van een door de raad, het college of de burgemeester ingestelde commissie, van een deelraad en van het
      dagelijks bestuur van een deelgemeente ontvangen, voor zover zij geen lid zijn van de raad of het college, een bij
      verordening van de raad vastgestelde vergoeding:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: 96.1.a
    text: voor het bijwonen van vergaderingen van een commissie, deelraad of dagelijks bestuur en
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: 96.1.b
    text: van reis- en verblijfskosten in verband met reizen binnen de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: '96.2'
    text: |-
      In bijzondere gevallen kan de raad bij verordening bepalen dat de leden van het dagelijks bestuur van een
      bestuurscommissie of een andere commissie als bedoeld in [artikel 84][ref1] een vaste vergoeding voor hun
      werkzaamheden ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel84
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '84'
        hoofdstuk: V
        paragraaf: '1'
  - number: '96.3'
    text: |-
      De raad kan bij verordening bepalen dat de leden van een deelraad een vaste vergoeding voor hun werkzaamheden en
      een tegemoetkoming in de kosten ontvangen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: '96.4'
    text: |-
      De raad kan bij verordening bepalen dat de leden van het dagelijks bestuur van een deelgemeente een bezoldiging
      genieten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: '96.5'
    text: |-
      Ten aanzien van de vergoeding, bedoeld in het eerste lid, onder a, en de bezoldiging, bedoeld in het vierde
      lid, worden bij of krachtens algemene maatregel van bestuur nadere regels gesteld. Ten aanzien van de overige
      vergoedingen bedoeld in dit artikel kunnen bij of krachtens algemene maatregel van bestuur nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel96
  - number: '97'
    text: |-
      Aan de leden van de raad en de personen genoemd in [artikel 96, eerste lid][ref1], vindt vergoeding van reis-
      en verblijfkosten, gemaakt in verband met reizen buiten het grondgebied van de gemeente ter uitvoering van een
      beslissing van het gemeentebestuur, slechts plaats overeenkomstig door de raad bij verordening vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel96
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '96'
        hoofdstuk: VI
  - number: '98'
    text: |-
      De verordeningen bedoeld in de [artikelen 95 tot en met 97][ref1] worden aan gedeputeerde staten gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel95
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '95'
        hoofdstuk: VI
  - number: '99.1'
    text: |-
      Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van de raad, van een door de raad, het
      college of de burgemeester ingestelde commissie, van een deelraad en van het dagelijks bestuur van een deelgemeente
      als zodanig geen andere vergoedingen en tegemoetkomingen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel99
  - number: '99.2'
    text: |-
      Voordelen ten laste van de gemeente, anders dan in de vorm van vergoedingen en tegemoetkoming, genieten zij slechts
      voor zover de raad dit bij verordening bepaalt. De verordening behoeft de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel99
  - number: '100'
    text: In iedere gemeente is een secretaris.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel100
  - number: '101.1'
    text: |-
      De secretaris wordt door de raad benoemd. Voorafgaand aan de benoeming maakt het college van burgemeester en
      wethouders een aanbeveling van twee personen op. De raad kan de secretaris schorsen en ontslaan.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel101
  - number: '101.2'
    text: |-
      Het college van burgemeester en wethouders kan in spoedeisende gevallen tot schorsing overgaan. Het college doet
      daarvan terstond mededeling aan de raad. De schorsing vervalt, wanneer de raad haar niet in zijn eerstvolgende
      vergadering bekrachtigt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel101
  - number: '102'
    text: |-
      De secretaris mag geen handelingen verrichten als bedoeld in [artikel 15, eerste lid][ref1], Het
      [tweede lid van artikel 15][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
  - number: '103.1'
    text: |-
      De secretaris staat de raad, het college van burgemeester en wethouders en de burgemeester alsmede de door hen
      ingestelde commissies bij de uitoefening van hun taak terzijde.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel103
  - number: '103.2'
    text: De raad stelt in een instructie nadere regels vast betreffende de taak en de bevoegdheid van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel103
  - number: '104'
    text: De secretaris is in de vergadering van de raad en van het college van burgemeester en wethouders aanwezig.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel104
  - number: '105.1'
    text: |-
      De stukken die van de raad en van het college van burgemeester en wethouders uitgaan, worden door de secretaris
      medeondertekend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel105
  - number: '105.2'
    text: |-
      Het eerste lid is niet van toepassing indien de ondertekening van stukken die van het college van burgemeester
      en wethouders uitgaan ingevolge [artikel 75, tweede lid][ref1], aan de secretaris of een andere gemeenteambtenaar
      is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel75
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '75'
        hoofdstuk: IV
  - number: '106'
    text: De raad regelt de vervanging van de secretaris.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel106
  - number: '107'
    text: |-
      Ten aanzien van degene die de secretaris vervangt is [artikel 102][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel102
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '102'
        hoofdstuk: VII
  - number: '108.1'
    text: |-
      De bevoegdheid tot regeling en bestuur inzake de huishouding van de gemeente wordt aan het gemeentebestuur
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel108
  - number: '108.2'
    text: |-
      Regeling en bestuur kunnen van het gemeentebestuur worden gevorderd bij of krachtens een andere dan deze wet ter
      verzekering van de uitvoering daarvan, met dien verstande dat het geven van aanwijzingen aan het gemeentebestuur en
      het aan het gemeentebestuur opleggen of in zijn plaats vaststellen van beslissingen, slechts kan geschieden indien
      de bevoegdheid daartoe bij de wet of krachtens de wet bij provinciale verordening is toegekend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel108
  - number: '108.3'
    text: |-
      Onverminderd het bepaalde in de [artikelen 110, vijfde lid][ref1], [119, vierde lid][ref2] en
      [120, tweede lid][ref3], worden de kosten, verbonden aan de uitvoering van het tweede lid, voor zover zij ten laste
      van de betrokken gemeenten blijven, door het Rijk aan hen vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel120
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '119'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '120'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '109'
    text: Bij of krachtens de wet kan zo nodig onderscheid worden gemaakt tussen gemeenten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel109
  - number: '110.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: 110.1.a
    text: |-
      plan: een beslissing die een samenhangend geheel van op elkaar afgestemde keuzes bevat omtrent door het
      gemeentebestuur te nemen besluiten of te verrichten andere handelingen, ten einde een of meer doelstellingen te
      bereiken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: 110.1.b
    text: |-
      beleidsverslag: een schriftelijke rapportage betreffende het door het gemeentebestuur gevoerde beleid op een of
      meer beleidsterreinen dan wel op onderdelen daarvan en de samenhang daarbinnen of daartussen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: '110.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk van het gemeentebestuur slechts worden gevorderd in bij de wet te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: '110.3'
    text: Een verplichting als bedoeld in het tweede lid geldt voor ten hoogste vier jaren, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: '110.4'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van een voorgeschreven
      procedure kan vanwege het Rijk in andere dan bij de wet bepaalde gevallen voor een termijn van ten hoogste vier
      jaar van het gemeentebestuur worden gevraagd als onderdeel van de regeling van een tijdelijke specifieke uitkering
      als bedoeld in [artikel 17 van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '17'
  - number: '110.5'
    text: |-
      Het vaststellen van een plan of een beleidsverslag en het ter voorbereiding daarvan volgen van de voorgeschreven
      procedure wordt van een gemeentebestuur niet gevorderd of gevraagd, dan nadat is aangegeven hoe de financiële
      gevolgen ervan voor de gemeente worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
  - number: '110.6'
    text: |-
      Dit artikel is niet van toepassing op de begroting, bedoeld in [artikel 190][ref1], en op de jaarrekening en het
      jaarverslag, bedoeld in [artikel 197][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '111.1'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt alleen gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 111.1.a
    text: |-
      dit noodzakelijk is uit een oogpunt van afstemming tussen gemeentelijk beleid en het beleid van de betrokken
      provincie of het Rijk, of
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: 111.1.b
    text: de ontwikkeling van beleid op een nieuw beleidsterrein dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: '111.2'
    text: |-
      Het vaststellen van een plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding
      daarvan volgen van een voorgeschreven procedure wordt niet gevorderd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 111.2.a
    text: het gemeentebestuur daardoor ontoelaatbaar beperkt wordt in zijn inhoudelijke of financiële beleidsruimte;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: 111.2.b
    text: |-
      de bestuurslasten niet in redelijke verhouding staan tot de te verwachten baten of een aanzienlijk beslag leggen op
      de voor het betrokken beleidsterrein beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: 111.2.c
    text: |-
      integratie met een bestaand plan of een bestaand beleidsverslag dan wel met de begroting, bedoeld in
      [artikel 190][ref1], of de jaarrekening en het jaarverslag, bedoeld in [artikel 197][ref2], mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 111.2.d
    text: |-
      het bevorderen van de samenhang in het gemeentelijk beleid door onderlinge afstemming van onderdelen daarvan
      onmogelijk wordt;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: 111.2.e
    text: het uitsluitend dient tot het verkrijgen van informatie.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
  - number: '111.3'
    text: |-
      Indien in een voorstel van wet tot invoering of wijziging van bepalingen waarbij het vaststellen van een
      plan of een beleidsverslag als bedoeld in [artikel 110][ref1] en het ter voorbereiding daarvan volgen van een
      voorgeschreven procedure wordt gevorderd, wordt afgeweken van het bepaalde bij of krachtens [artikel 110][ref2] en
      dit artikel, wordt die afwijking gemotiveerd in de bij het voorstel behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '112'
    text: |-
      Onze Minister wie het aangaat en het provinciaal bestuur doen het college desgevraagd mededeling van hun
      standpunten en voornemens met betrekking tot aangelegenheden die voor de gemeente van belang zijn, tenzij het
      openbaar belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel112
  - number: '113'
    text: |-
      Onze Minister wie het aangaat en het provinciaal bestuur bieden het college desgevraagd de gelegenheid tot het
      plegen van overleg met betrekking tot aangelegenheden die voor de gemeente van belang zijn, tenzij het openbaar
      belang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel113
  - number: '114.1'
    text: |-
      Onze Minister wie het aangaat, onderscheidenlijk het provinciaal bestuur, stelt de betrokken colleges of een
      instantie die voor deze representatief kan worden geacht, zo nodig binnen een te stellen termijn, in de gelegenheid
      hun oordeel te geven omtrent voorstellen van wet, ontwerpen van algemene maatregel van bestuur, ontwerpen van
      ministeriële regeling, of ontwerpen van provinciale verordening waarbij:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel114
  - number: 114.1.a
    text: van de gemeentebesturen regeling of bestuur wordt gevorderd, of
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel114
  - number: 114.1.b
    text: in betekenende mate wijziging wordt gebracht in de taken en bevoegdheden van de gemeentebesturen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel114
  - number: '114.2'
    text: |-
      Voorstellen als bedoeld in het eerste lid bevatten in de bijbehorende toelichting een weergave van de gevolgen
      voor de inrichting en werking van de gemeenten en een weergave van het in het eerste lid bedoelde oordeel van de
      betrokken colleges of representatieve instantie.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel114
  - number: '114.3'
    text: |-
      Onze Minister wie het aangaat, onderscheidenlijk het provinciaal bestuur, is niet verplicht vooraf het in het
      eerste lid bedoelde oordeel in te winnen indien zulks ten gevolge van dringende omstandigheden niet mogelijk is. In
      dat geval wordt het oordeel zo spoedig mogelijk ingewonnen en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel114
  - number: '115.1'
    text: |-
      Een wet waarbij van gemeentebesturen regeling of bestuur wordt gevorderd of waarbij in betekenende mate wijziging
      wordt gebracht in taken en bevoegdheden van gemeentebesturen, wijkt van het bepaalde in deze wet niet af dan
      wanneer dat bijzonder aangewezen moet worden geacht voor de behartiging van het daarmee te dienen openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel115
  - number: '115.2'
    text: |-
      Het voorstel voor een wet als bedoeld in het eerste lid bevat in de bijbehorende toelichting de gronden voor de
      voorgestelde afwijking.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel115
  - number: '116.1'
    text: |-
      Onze Minister is belast met de coördinatie van het rijksbeleid dat de gemeenten raakt. Hij bevordert voorts de
      beleidsvrijheid van het gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel116
  - number: '116.2'
    text: |-
      Over maatregelen en voornemens die van betekenis zijn voor het rijksbeleid inzake de gemeenten treden Onze
      Ministers onder wier verantwoordelijkheid die maatregelen en voornemens tot stand komen in een vroegtijdig stadium
      in overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel116
  - number: '116.3'
    text: |-
      Onze Minister maakt bedenkingen kenbaar tegen een maatregel of een voornemen voor zover hem die maatregel of dat
      voornemen met het oog op het door de regering gevoerde decentralisatiebeleid niet toelaatbaar voorkomt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel116
  - number: '117.1'
    text: Onze Minister bevordert de decentralisatie ten behoeve van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel117
  - number: '117.2'
    text: |-
      Voorstellen van maatregelen waarbij bepaalde aangelegenheden tot rijks- of provinciaal beleid worden gerekend,
      worden slechts gedaan indien het onderwerp van zorg niet op doelmatige en doeltreffende wijze door de
      gemeentebesturen kan worden behartigd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel117
  - number: '118'
    text: |-
      Over al hetgeen de gemeente betreft dient het college Onze Ministers en het provinciaal bestuur desgevraagd van
      bericht en raad, tenzij dit uitdrukkelijk van de burgemeester wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel118
  - number: '119.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur worden de gevallen geregeld waarin het college
      verplicht is tot het verstrekken van systematische informatie aan Onze Ministers wie het aangaat. Daarbij kan
      worden bepaald dat bij ministeriële regeling nadere voorschriften worden gegeven ten behoeve van de toepassing van
      de wet of de algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel119
  - number: '119.2'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Economische Zaken, na overleg met Onze
      Minister, kan worden bepaald dat in die maatregel te omschrijven gegevens ten behoeve van statistische doeleinden
      aan het Centraal Bureau voor de Statistiek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel119
  - number: '119.3'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan worden bij
      algemene maatregel van bestuur nadere algemene regels gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel119
  - number: '119.4'
    text: |-
      Omtrent de in het eerste en tweede lid bedoelde verstrekking van informatie en de inwinning daarvan, alsmede
      omtrent de verstrekking en inwinning van incidentele informatie, wordt, voorzover dat niet bij wet geschiedt, bij
      algemene maatregel van bestuur aangegeven hoe de financiële gevolgen van de verplichting tot informatieverstrekking
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel119
  - number: '119.5'
    text: |-
      De voordrachten voor de algemene maatregelen van bestuur, bedoeld in het derde en het vierde lid, worden gedaan
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel119
  - number: '120.1'
    text: |-
      Bij de wet of krachtens de wet bij algemene maatregel van bestuur of bij provinciale verordening worden de gevallen
      geregeld waarin het college verplicht is tot het verstrekken van systematische informatie aan het provinciaal
      bestuur. Daarbij kan worden bepaald dat bij ministeriële regeling of bij besluit van gedeputeerde staten nadere
      voorschriften worden gegeven ten behoeve van de toepassing van de wet, de algemene maatregel van bestuur of de
      provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel120
  - number: '120.2'
    text: |-
      In de regelingen, bedoeld in de eerste volzin van het eerste lid, wordt tevens aangegeven hoe de financiële
      gevolgen van de informatieverstrekking voor de gemeente worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel120
  - number: '120.3'
    text: |-
      Het provinciaal bestuur doet mededeling aan Onze Minister van de inwinning van systematische informatie ingevolge
      een provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel120
  - number: '121'
    text: |-
      De bevoegdheid tot het maken van gemeentelijke verordeningen blijft ten aanzien van het onderwerp waarin door
      wetten, algemene maatregelen van bestuur of provinciale verordeningen is voorzien, gehandhaafd, voor zover de
      verordeningen met die wetten, algemene maatregelen van bestuur en provinciale verordeningen niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel121
  - number: '122'
    text: |-
      De bepalingen van gemeentelijke verordeningen in wier onderwerp door een wet, een algemene maatregel van bestuur of
      een provinciale verordening wordt voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel122
  - number: '123.1'
    text: |-
      Wanneer de raad of, indien aan een bestuurscommissie, een deelraad of het dagelijks bestuur van een deelgemeente
      bevoegdheden van de raad of van het college zijn overgedragen, deze commissie, die deelraad of dat dagelijks
      bestuur bij of krachtens een andere dan deze wet gevorderde beslissingen niet of niet naar behoren neemt, voorziet
      het college daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel123
  - number: '123.2'
    text: |-
      Wanneer aan een bestuurscommissie of de voorzitter van het dagelijks bestuur van een deelgemeente bevoegdheden
      van de burgemeester zijn overgedragen en die commissie of die voorzitter bij of krachtens een andere dan deze wet
      gevorderde besluiten niet of niet naar behoren neemt, voorziet de burgemeester daarin.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel123
  - number: '124.1'
    text: |-
      Wanneer het college of de burgemeester bij of krachtens een andere dan deze wet gevorderde beslissingen niet of
      niet naar behoren neemt, voorzien gedeputeerde staten, onderscheidenlijk de commissaris van de Koning daarin namens
      het college of de burgemeester en ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel124
  - number: '124.2'
    text: |-
      Spoedeisende gevallen uitgezonderd, vindt het eerste lid geen toepassing dan nadat het college, onderscheidenlijk
      de burgemeester in de gelegenheid is gesteld binnen een door gedeputeerde staten, onderscheidenlijk de commissaris
      gestelde termijn alsnog de bij of krachtens een andere dan deze wet gevorderde beslissingen te nemen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel124
  - number: '125.1'
    text: Het gemeentebestuur is bevoegd tot toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel125
  - number: '125.2'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt uitgeoefend door het college, indien de toepassing van
      bestuursdwang dient tot handhaving van regels welke het gemeentebestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel125
  - number: '125.3'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt evenwel uitgeoefend door de burgemeester, indien de
      toepassing van bestuursdwang dient tot handhaving van regels welke hij uitvoert.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel125
  - number: '125.4'
    text: |-
      Een bestuurscommissie, een deelraad, het dagelijks bestuur van een deelgemeente of de voorzitter van het dagelijks
      bestuur van een deelgemeente waaraan bevoegdheden van de raad, het college of de burgemeester zijn overgedragen,
      bezit de bevoegdheid tot toepassing van bestuursdwang en de bevoegdheid tot het geven van een machtiging tot
      binnentreden van een woning slechts indien ook die bevoegdheid uitdrukkelijk is overgedragen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel125
  - number: '135.1'
    text: |-
      In geval van toepassing van [artikel 124][ref1] kunnen gedeputeerde staten, onderscheidenlijk de commissaris van de
      Koning bestuursdwang toepassen namens het gemeentebestuur en ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '135.2'
    text: De gemeente heeft in dat geval voor het bedrag van de te haren laste gebrachte kosten verhaal op de overtreder.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel135
  - number: '135.3'
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is alsdan van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '139.1'
    text: |-
      Besluiten van het gemeentebestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer zij
      zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel139
  - number: '139.2'
    text: |-
      De bekendmaking geschiedt door plaatsing in het gemeenteblad, dan wel, bij gebreke daarvan, door opneming in een
      andere door de gemeente algemeen verkrijgbaar gestelde uitgave.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel139
  - number: '139.3'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt de dagtekening vermeld van het
      besluit waarbij die goedkeuring is verleend of wordt de mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '140'
    text: |-
      Besluiten van het gemeentebestuur die algemeen verbindende voorschriften inhouden, liggen voor een ieder kosteloos
      ter inzage op de gemeentesecretarie of op een andere door de raad te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel140
  - number: '141'
    text: |-
      Een ieder kan op zijn verzoek een afschrift verkrijgen van de besluiten van het gemeentebestuur die ingevolge
      [artikel 140][ref1] ter inzage liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel140
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '142'
    text: |-
      De bekendgemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel142
  - number: '143'
    text: |-
      Een besluit als bedoeld in [artikel 139][ref1] op overtreding waarvan straf is gesteld, wordt na de bekendmaking
      medegedeeld aan het parket van het arrondissement waarin de gemeente is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '144'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, is het bepaalde
      in de [artikelen 139][ref1], [142][ref2] en [143][ref3] van overeenkomstige toepassing, met dien verstande dat de
      mededeling aan het arrondissementsparket geschiedt binnen een week.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel143
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '142'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '143'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '145'
    text: |-
      Op termijnen gesteld in een gemeentelijke verordening zijn de
      [artikelen 1 tot en met 4 van de Algemene Termijnenwet][ref1] van overeenkomstige toepassing, tenzij in de
      verordening anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '147.1'
    text: |-
      Gemeentelijke verordeningen worden door de raad vastgesteld voor zover de bevoegdheid daartoe niet bij de wet of
      door de raad krachtens de wet aan het college van burgemeester en wethouders of de burgemeester is toegekend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147
  - number: '147.2'
    text: |-
      De overige bevoegdheden, bedoeld in [artikel 108][ref1], berusten bij de raad voorzover deze niet bij of krachtens
      de wet aan het college van burgemeester en wethouders of de burgemeester zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 147a.1
    text: |-
      Een lid van de raad kan een voorstel voor een verordening of een ander voorstel ter behandeling in de raad
      indienen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147a
  - number: 147a.2
    text: De raad regelt op welke wijze een voorstel voor een verordening wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147a
  - number: 147a.3
    text: De raad regelt op welke wijze en onder welke voorwaarden een ander voorstel wordt ingediend en behandeld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147a
  - number: 147b.1
    text: |-
      Een lid van de raad kan een voorstel tot wijziging van een voor de vergadering van de raad geagendeerde ontwerp-
      verordening of ontwerp-beslissing indienen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147b
  - number: 147b.2
    text: |-
      Het [tweede lid van artikel 147a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel147a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel147b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 147a
        hoofdstuk: IX
  - number: '149'
    text: De raad maakt de verordeningen die hij in het belang van de gemeente nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel149
  - number: 149a
    text: |-
      Indien het toezicht op de naleving of de opsporing van een overtreding van een voorschrift van een verordening,
      dat strekt tot handhaving van de openbare orde of veiligheid of tot bescherming van het leven of de gezondheid van
      personen vereist dat de met het toezicht op de naleving of de opsporing belaste personen bevoegd zijn binnen te
      treden in een woning zonder toestemming van de bewoner, kan de raad deze bevoegdheid bij verordening verlenen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel149a
  - number: '150.1'
    text: |-
      De raad stelt een verordening vast, waarin regels worden gesteld met betrekking tot de wijze waarop ingezetenen
      en in de gemeente een belang hebbende natuurlijke en rechtspersonen bij de voorbereiding van gemeentelijk beleid
      worden betrokken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: '150.2'
    text: 'In deze verordening worden ten minste geregeld:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: 150.2.a
    text: de wijze waarop van de beleidsvoornemens waarop inspraak zal worden verleend, openbaar wordt kennis gegeven;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: 150.2.b
    text: |-
      de wijze waarop ingezetenen en in de gemeente een belang hebbende natuurlijke en rechtspersonen in staat worden
      gesteld hun mening omtrent de onder *a.* bedoelde beleidsvoornemens kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: 150.2.c
    text: de rapportering over de onder *b.* bedoelde inspraak en over de uitkomsten daarvan;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: 150.2.d
    text: |-
      de wijze waarop ingezetenen en in de gemeente een belang hebbende natuurlijke en rechtspersonen in de gelegenheid
      worden gesteld hun beklag te doen over de uitvoering van de verordening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel150
  - number: 151a.1
    text: |-
      De raad kan een verordening vaststellen waarin voorschriften worden gesteld met betrekking tot het bedrijfsmatig
      geven van gelegenheid tot het verrichten van seksuele handelingen met of voor een derde tegen betaling.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151a
  - number: 151a.2
    text: |-
      De ambtenaren die zijn aangewezen om toezicht uit te oefenen op de naleving van de in het eerste lid
      bedoelde voorschriften, zijn bevoegd van degene die zich beschikbaar stelt tot het verrichten van seksuele
      handelingen met of voor een derde tegen betaling, inzage te vorderen van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 151a.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op ambtenaren die zijn aangewezen om toezicht uit te oefenen op
      de naleving van gemeentelijke voorschriften met betrekking tot het, door handelingen, houding, woord, gebaar of op
      andere wijze, passanten tot prostitutie bewegen, uitnodigen dan wel aanlokken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151a
  - number: 151b.1
    text: |-
      De raad kan bij verordening de burgemeester de bevoegdheid verlenen om bij verstoring van de openbare orde
      door de aanwezigheid van wapens, dan wel bij ernstige vrees voor het ontstaan daarvan, een gebied, met inbegrip
      van de daarin gelegen voor het publiek openstaande gebouwen en daarbij behorende erven, aan te wijzen als
      veiligheidsrisicogebied. In een veiligheidsrisicogebied kan de officier van justitie de bevoegdheden, bedoeld in
      de [artikelen 50, derde lid][ref1], [51, derde lid][ref2], en [52, derde lid, van de Wet wapens en munitie][ref3]
      toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel52
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '52'
  - number: 151b.2
    text: |-
      De burgemeester gaat niet over tot aanwijzing als veiligheidsrisicogebied dan na overleg met de officier van
      justitie in het overleg, bedoeld in [artikel 14 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel14
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '14'
  - number: 151b.3
    text: |-
      De aanwijzing als veiligheidsrisicogebied wordt gegeven voor een bepaalde duur die niet langer is en voor een
      gebied dat niet groter is dan strikt noodzakelijk voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
  - number: 151b.4
    text: |-
      De beslissing tot gebiedsaanwijzing wordt op schrift gesteld en bevat een omschrijving van het gebied waarop deze
      van toepassing is alsmede de geldigheidsduur. Indien de situatie dermate spoedeisend is dat de burgemeester de
      beslissing tot gebiedsaanwijzing niet tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de
      opschriftstelling en voor de bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
  - number: 151b.5
    text: |-
      De burgemeester brengt de gebiedsaanwijzing zo spoedig mogelijk ter kennis van de raad en van de officier van
      justitie, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
  - number: 151b.6
    text: |-
      Zodra de verstoring van de openbare orde door de aanwezigheid van wapens, dan wel de ernstige vrees voor het
      ontstaan daarvan, bedoeld in het eerste lid, is geweken, trekt de burgemeester de gebiedsaanwijzing in. Het vijfde
      lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel151b
  - number: '154.1'
    text: |-
      De raad kan op overtreding van zijn verordeningen en van die van organen waaraan ingevolge [artikel 156][ref1]
      verordenende bevoegdheid is gedelegeerd, straf stellen maar geen andere of zwaardere dan hechtenis van ten hoogste
      drie maanden of geldboete van de tweede categorie, al dan niet met openbaarmaking van de rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel156
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '156'
        hoofdstuk: IX
  - number: '154.2'
    text: |-
      Op de krachtens het eerste lid strafbaar gestelde overtreding van voorschriften met betrekking tot het plaatsen
      of laten staan van motorrijtuigen op parkeerterreinen of weggedeelten bedoeld in [artikel 225][ref1] is de
      [artikelen 181][ref2] en [182 van de Wegenverkeerswet 1994][ref3] (Stb. 1935, 554) van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel182
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '181'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '182'
  - number: '154.3'
    text: |-
      De gedragingen die zijn omschreven in de bijlage, bedoeld in
      [artikel 2 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] (*Stb.* 1989, 300), zijn
      niet strafbaar, tenzij daarbij letsel aan personen is ontstaan of schade aan zaken is toegebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004581#Artikel2
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0004581
        artikel: '2'
  - number: '154.4'
    text: De in het eerste lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154
  - number: 154a.1
    text: |-
      De raad kan bij verordening de burgemeester de bevoegdheid verlenen om door de burgemeester aangewezen groepen van
      personen, op een door de burgemeester aangegeven plaats tijdelijk te doen ophouden. De ophouding kan mede omvatten,
      indien nodig, het overbrengen naar die plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.2
    text: 'De burgemeester oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.2.a
    text: |-
      jegens personen die een door de raad bij verordening vastgesteld en daartoe aangewezen specifiek voorschrift
      dat strekt tot handhaving van de openbare orde of beperking van gevaar in omstandigheden als bedoeld in
      [artikel 175][ref1], groepsgewijs niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
  - number: 154a.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.3
    text: |-
      De beslissing tot ophouding wordt op schrift gesteld. De schriftelijke beslissing is een beschikking. Indien
      de situatie dermate spoedeisend is dat de burgemeester de beslissing tot ophouding niet tevoren op schrift kan
      stellen, zorgt hij alsnog zo spoedig mogelijk voor de opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.4
    text: De beschikking vermeldt welk voorschrift niet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.5
    text: |-
      De burgemeester laat tot ophouding als bedoeld in het eerste lid niet overgaan dan nadat de personen uit de in het
      eerste lid bedoelde groep in de gelegenheid zijn gesteld de tenuitvoerlegging van de beschikking tot ophouding te
      voorkomen, door alsnog het voorschrift, bedoeld in het vierde lid, na te leven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.6
    text: |-
      De burgemeester draagt er zorg voor dat zo spoedig mogelijk een verslag van de bevindingen inzake de
      tenuitvoerlegging van de ophouding wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.7
    text: |-
      De ophouding mag niet langer duren dan de tijd die nodig is ter voorkoming van voortzetting of herhaling van de
      niet-naleving, met een maximum van twaalf uren.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.8
    text: |-
      De plaats van ophouding dient geschikt te zijn voor de opvang van de op te houden personen. Bij algemene maatregel
      van bestuur kunnen nadere regels hieromtrent worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.9
    text: |-
      De burgemeester draagt er voor zover mogelijk zorg voor dat de opgehouden personen in de gelegenheid worden
      gesteld door een daartoe door hem aangewezen ambtenaar hun gegevens te laten vastleggen ten bewijze dat zij zijn
      opgehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.10
    text: |-
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de beschikking tot ophouding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 154a.11
    text: |-
      Indien tegen de beschikking tot ophouding een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] wordt gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.11.a
    text: |-
      wordt, in afwijking van [artikel 8:83, eerste lid, van de Algemene wet bestuursrecht][ref1], de verzoeker die is
      opgehouden zo mogelijk nog tijdens zijn ophouding door de president gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.11.b
    text: |-
      doet de president in afwijking van [artikel 8:84, eerste lid, van de Algemene wet bestuursrecht][ref1] onmiddellijk
      na het horen van partijen uitspraak, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.11.c
    text: |-
      wordt, in afwijking van [artikel 8:82, eerste lid, van de Algemene wet bestuursrecht][ref1], geen griffierecht
      geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 154a.12
    text: |-
      Bij de beoordeling van het verzoek betrekt de president tevens de rechtmatigheid van de tenuitvoerlegging van de
      beschikking tot ophouding jegens verzoeker.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.13
    text: |-
      Indien de president een of meer verzoeken toewijst op de grond dat de beschikking tot ophouding naar zijn
      voorlopig oordeel onrechtmatig is, kan hij bepalen dat alle personen die op basis van de betrokken beschikking zijn
      opgehouden, onverwijld in vrijheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
  - number: 154a.14
    text: |-
      Het twaalfde lid is van overeenkomstige toepassing op de beoordeling van een beroep tegen de beschikking tot
      ophouding als bedoeld in [artikel 8:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '155.1'
    text: Een lid van de raad kan het college of de burgemeester mondeling of schriftelijk vragen stellen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155
  - number: '155.2'
    text: |-
      Een lid van de raad kan de raad verlof vragen tot het houden van een interpellatie over een onderwerp dat niet
      staat vermeld op de agenda, bedoeld in [artikel 19, tweede lid][ref1], om het college of de burgemeester hierover
      inlichtingen te vragen. De raad stelt hierover nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '19'
        hoofdstuk: II
  - number: 155a.1
    text: |-
      De raad kan op voorstel van een of meer van zijn leden een onderzoek naar het door het college of de burgemeester
      gevoerde bestuur instellen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155a.2
    text: |-
      Het besluit tot het instellen van een onderzoek omvat een omschrijving van het onderwerp van onderzoek alsmede een
      toelichting. Deze omschrijving kan hangende het onderzoek door de raad worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155a.3
    text: |-
      Het onderzoek wordt uitgevoerd door een door de raad in te stellen onderzoekscommissie. De commissie heeft ten
      minste drie leden en bestaat uitsluitend uit leden van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155a.4
    text: |-
      De [artikelen 22][ref1], [82, derde lid][ref2], en [86, eerste lid][ref3], zijn van overeenkomstige toepassing op
      de onderzoekscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel86
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '86'
        hoofdstuk: V
        paragraaf: '1'
  - number: 155a.5
    text: |-
      De onderzoekscommissie kan de bij deze wet verleende bevoegdheden uitsluitend uitoefenen, indien ten minste drie
      van haar leden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155a.6
    text: De bevoegdheden en werkzaamheden van een onderzoekscommissie worden niet geschorst door het aftreden van de raad.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155a.7
    text: |-
      Op het besluit tot instelling van een onderzoek en tot instelling van een onderzoekscommissie, alsmede het besluit
      tot wijziging van de omschrijving van het onderwerp van een onderzoek zijn de [artikelen 139, tweede lid][ref1],
      [140][ref2] en [141][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: 155a.8
    text: |-
      Alvorens de raad besluit tot een onderzoek, stelt hij bij verordening nadere regels met betrekking tot deze
      onderzoeken. In elk geval worden daarin regels opgenomen over de wijze waarop ambtelijke bijstand wordt verleend
      aan de commissie.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155a
  - number: 155b.1
    text: |-
      Leden en gewezen leden van de raad, de burgemeester en gewezen burgemeesters, wethouders en gewezen wethouders,
      leden en gewezen leden van de deelraad, leden en gewezen leden van het dagelijks bestuur van een deelgemeente,
      leden en gewezen leden van een door de raad, het college of de burgemeester ingestelde commissie, ambtenaren en
      gewezen ambtenaren, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt, zijn verplicht te
      voldoen aan een vordering van de onderzoekscommissie tot het verschaffen van inzage in, het nemen van afschrift
      van of het anderszins laten kennisnemen van alle bescheiden waarover zij beschikken en waarvan naar het redelijk
      oordeel van de onderzoekscommissie inzage, afschrift of kennisneming anderszins voor het doen van een onderzoek als
      bedoeld in [artikel 155a][ref1] nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 155b.2
    text: |-
      Indien een vordering als bedoeld in het eerste lid betrekking heeft op bescheiden die afkomstig zijn van een
      instelling van de Europese Unie of van het Rijk en kennisneming van die bescheiden door de onderzoekscommissie
      het belang van de Europese Unie of de Staat kan schaden, wordt niet dan met toestemming van Onze Minister aan de
      vordering voldaan.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155b
  - number: 155b.3
    text: |-
      Ambtenaren, door of vanwege het gemeentebestuur aangesteld of daaraan ondergeschikt, zijn gehouden om aan een
      onderzoek als bedoeld in [artikel 155a][ref1] alle door de onderzoekscommissie gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 155c.1
    text: |-
      Personen als bedoeld in [artikel 155b, eerste lid][ref1], zijn verplicht te voldoen aan een oproep van de
      onderzoekscommissie om als getuige of deskundige te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155b
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155b
        hoofdstuk: IX
  - number: 155c.2
    text: |-
      Een getuige of deskundige die door de onderzoekscommissie wordt gehoord, kan niet tevens lid zijn van de
      onderzoekscommissie.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.3
    text: |-
      De getuigen zijn verplicht getuigenis af te leggen, de deskundigen zijn verplicht hun diensten onpartijdig en naar
      beste weten als zodanig te verlenen, een en ander behoudens verschoning wegens ambts- of beroepsgeheim.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.4
    text: |-
      De onderzoekscommissie kan besluiten dat getuigen uitsluitend worden verhoord na het afleggen van een eed of
      belofte. Zij leggen dan in de vergadering van de onderzoekscommissie, in handen van de voorzitter, de eed of
      belofte af dat zij de gehele waarheid en niets dan de waarheid zullen zeggen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.5
    text: |-
      De getuigen en deskundigen worden in een openbare zitting van de onderzoekscommissie gehoord. Plaats en tijd van de
      openbare zitting worden door de voorzitter tijdig ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.6
    text: |-
      De onderzoekscommissie kan om gewichtige redenen besluiten een verhoor of een gedeelte daarvan niet in het openbaar
      af te nemen. De leden en plaatsvervangende leden van de commissie bewaren geheimhouding over hetgeen hun tijdens
      een besloten zitting ter kennis komt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.7
    text: |-
      Een getuige is gerechtigd zich tijdens het verhoor te laten bijstaan. Om gewichtige redenen kan de commissie
      besluiten, dat een getuige zonder bijstand wordt gehoord.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
  - number: 155c.8
    text: |-
      Verklaringen die zijn afgelegd voor de onderzoekscommissie, of op haar vordering afgelegd, kunnen, behalve in het
      geval van [artikel 207, eerste lid, van het Wetboek van Strafrecht][ref1], niet als bewijs in rechte gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 155d.1
    text: |-
      Getuigen en deskundigen worden schriftelijk opgeroepen. De brief, houdende de oproep, wordt aangetekend verzonden
      of tegen gedagtekend ontvangstbewijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155d
  - number: 155d.2
    text: |-
      De onderzoekscommissie kan bevelen dat getuigen en deskundigen die, hoewel opgeroepen in overeenstemming met
      het eerste lid, niet zijn verschenen, door de openbare macht voor hen worden gebracht om aan hun verplichting te
      voldoen. De onderzoekscommissie stelt de getuige of deskundige hiervan schriftelijk in kennis op de wijze, bedoeld
      in het eerste lid. In de beschikking wordt een termijn gesteld waarbinnen de belanghebbende de tenuitvoerlegging
      kan voorkomen door alsnog aan zijn verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155d
  - number: 155d.3
    text: |-
      Op een beschikking als bedoeld in het eerste en het tweede lid is
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 155e.1
    text: |-
      Niemand kan genoodzaakt worden aan de onderzoekscommissie geheimen te openbaren, voor zover daardoor onevenredige
      schade zou worden toegebracht aan het belang van de uitoefening van zijn beroep, dan wel aan het belang van zijn
      onderneming of de onderneming waarbij hij werkzaam is of is geweest.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155e
  - number: 155e.2
    text: |-
      Zij die uit hoofde van hun ambt, beroep of betrekking tot geheimhouding verplicht zijn, kunnen zich verschonen
      getuigenis af te leggen, doch uitsluitend met betrekking tot hetgeen waarvan de wetenschap aan hen als zodanig is
      toevertrouwd. Zij kunnen inzage, afschrift of kennisneming anderszins weigeren van bescheiden of gedeelten daarvan
      tot welke hun plicht tot geheimhouding zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155e
  - number: 155f
    text: |-
      Het college neemt de door de raad geraamde kosten voor een onderzoek in een bepaald jaar op in de ontwerp-
      begroting.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel155f
  - number: '156.1'
    text: |-
      De raad kan aan het college, een door hem ingestelde bestuurscommissie en een deelraad bevoegdheden overdragen,
      tenzij de aard van de bevoegdheid zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
  - number: '156.2'
    text: 'De raad kan in ieder geval niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
  - number: 156.2.a
    text: |-
      de instelling van een onderzoek, bedoeld in [artikel 155a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 155a
        hoofdstuk: IX
  - number: 156.2.b
    text: |-
      de vaststelling of wijziging van de begroting, bedoeld in [artikel 189][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 156.2.c
    text: |-
      de vaststelling van de jaarrekening, bedoeld in [artikel 198][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel198
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '198'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 156.2.d
    text: het stellen van straf op overtreding van de gemeentelijke verordeningen;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
  - number: 156.2.e
    text: |-
      de vaststelling van de verordening, bedoeld in [artikel 212, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
  - number: 156.2.f
    text: |-
      de vaststelling van de verordening, bedoeld in [artikel 213, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
  - number: 156.2.g
    text: |-
      de aanwijzing van een of meer accountants, bedoeld in [artikel 213, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
  - number: 156.2.h
    text: |-
      de heffing van andere belastingen dan de belastingen, genoemd in [artikel 225][ref1], de precariobelasting, de
      rechten, genoemd in [artikel 229][ref2], de rechten waarvan de heffing geschiedt krachtens andere wetten dan deze
      wet en de heffing, bedoeld in [artikel 15.33 van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '15'
  - number: '156.3'
    text: |-
      De bevoegdheid tot het vaststellen van verordeningen, door strafbepaling of bestuursdwang te handhaven, kan de raad
      slechts overdragen voor zover het betreft de vaststelling van nadere regels met betrekking tot bepaalde door hem in
      zijn verordeningen aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
  - number: '156.4'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '156.5'
    text: Het tweede lid, aanhef en onder d, en het derde lid zijn niet van toepassing op een deelraad.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel156
  - number: '157.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van de raad, de uitoefening daarvan en het toezicht daarop zijn
      ten aanzien van de ingevolge [artikel 156][ref1] overgedragen bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel156
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '156'
        hoofdstuk: IX
  - number: '157.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel157
  - number: '158.1'
    text: De raad kan de naam van de gemeente wijzigen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel158
  - number: '158.2'
    text: Het besluit van de raad wordt ter kennis gebracht van Onze Minister en het provinciaal bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel158
  - number: '158.3'
    text: Het besluit vermeldt de datum van ingang, die is gelegen ten minste een jaar na de datum van het besluit.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel158
  - number: '160.1'
    text: 'Het college is in ieder geval bevoegd:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.a
    text: |-
      het dagelijks bestuur van de gemeente te voeren, voor zover niet bij of krachtens de wet de raad of de burgemeester
      hiermee is belast;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.b
    text: |-
      beslissingen van de raad voor te bereiden en uit te voeren, tenzij bij of krachtens de wet de burgemeester hiermee
      is belast;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.c
    text: |-
      regels vast te stellen over de ambtelijke organisatie van de gemeente, met uitzondering van de organisatie van
      de griffie;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.d
    text: |-
      ambtenaren, niet zijnde de griffier en de op de griffie werkzame ambtenaren, te benoemen, te schorsen en te
      ontslaan;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.e
    text: tot privaatrechtelijke rechtshandelingen van de gemeente te besluiten en deze te verrichten;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.f
    text: |-
      rechtsgedingen namens de gemeente of het gemeentebestuur te voeren, handelingen ter voorbereiding daarop te
      verrichten, alsmede namens de gemeente of het gemeentebestuur bezwaar te maken, tenzij de raad, voor zover het de
      raad aangaat, in voorkomende gevallen anders beslist;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.g
    text: ten aanzien van de voorbereiding van de civiele verdediging;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: 160.1.h
    text: jaarmarkten of gewone marktdagen in te stellen, af te schaffen of te veranderen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: '160.2'
    text: |-
      Het college besluit slechts tot de oprichting van en de deelneming in stichtingen, maatschappen, vennootschappen,
      verenigingen, coöperaties en onderlinge waarborgmaatschappijen, indien dat in het bijzonder aangewezen moet worden
      geacht voor de behartiging van het daarmee te dienen openbaar belang. Het besluit wordt niet genomen dan nadat de
      raad een ontwerp-besluit is toegezonden en hij zijn wensen en bedenkingen ter kennis van het college heeft kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: '160.3'
    text: |-
      Een besluit als bedoeld in het tweede lid behoeft de goedkeuring van gedeputeerde staten. De goedkeuring kan
      slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: '160.4'
    text: |-
      Het college neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire maatregelen en
      doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel160
  - number: '165.1'
    text: |-
      Het college kan aan een door hem ingestelde bestuurscommissie en aan het dagelijks bestuur van een deelgemeente
      bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel165
  - number: '165.2'
    text: |-
      De [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] zijn van overeenkomstige toepassing op een besluit
      dat wordt genomen op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '165.3'
    text: |-
      Het college neemt geen besluit op grond van het eerste lid dan nadat de raad een ontwerp-besluit is toegezonden en
      in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van het college te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel165
  - number: '166'
    text: |-
      Het college kan een in de gemeente dienstdoende ambtenaar van politie machtigen in zijn naam besluiten te nemen of
      andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel166
  - number: '167.1'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van het college, de uitoefening daarvan en het toezicht daarop,
      zijn ten aanzien van de ingevolge [artikel 165][ref1] overgedragen bevoegdheden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel165
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '165'
        hoofdstuk: X
  - number: '167.2'
    text: Onder de in het eerste lid bedoelde voorschriften zijn niet begrepen die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel167
  - number: '168.1'
    text: |-
      Het college kan een of meer leden van het college machtigen tot uitoefening van een of meer van zijn bevoegdheden,
      tenzij de regeling waarop de bevoegdheid steunt zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel168
  - number: '168.2'
    text: |-
      Een krachtens machtiging uitgeoefende bevoegdheid wordt uit naam en onder verantwoordelijkheid van het college
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel168
  - number: '168.3'
    text: Het college kan te dien aanzien alle aanwijzingen geven die het nodig acht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel168
  - number: '169.1'
    text: |-
      Het college en elk van zijn leden afzonderlijk zijn aan de raad verantwoording schuldig over het door het college
      gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel169
  - number: '169.2'
    text: Zij geven de raad alle inlichtingen die de raad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel169
  - number: '169.3'
    text: |-
      Zij geven de raad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel169
  - number: '169.4'
    text: |-
      Zij geven de raad vooraf inlichtingen over de uitoefening van de bevoegdheden, bedoeld in
      [artikel 160, eerste lid, onder e, f, g en h][ref1], indien de raad daarom verzoekt of indien de uitoefening
      ingrijpende gevolgen kan hebben voor de gemeente. In het laatste geval neemt het college geen besluit dan nadat de
      raad zijn wensen en bedenkingen terzake ter kennis van het college heeft kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel160
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '160'
        hoofdstuk: X
  - number: '170.1'
    text: 'De burgemeester ziet toe op:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.1.a
    text: |-
      een tijdige voorbereiding, vaststelling en uitvoering van het gemeentelijk beleid en van de daaruit voortvloeiende
      besluiten, alsmede op een goede afstemming tussen degenen die bij die voorbereiding, vaststelling en uitvoering
      zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.1.b
    text: een goede samenwerking van de gemeente met andere gemeenten en andere overheden;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.1.c
    text: de kwaliteit van procedures op het vlak van burgerparticipatie;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.1.d
    text: een zorgvuldige behandeling van bezwaarschriften;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.1.e
    text: een zorgvuldige behandeling van klachten door het gemeentebestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: '170.2'
    text: |-
      De burgemeester brengt tegelijk met de in [artikel 197][ref1] bedoelde stukken een burgerjaarverslag uit, waarin
      hij in ieder geval rapporteert over:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: 170.2.a
    text: de kwaliteit van de gemeentelijke dienstverlening;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: 170.2.b
    text: zijn bevindingen over het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: '170.3'
    text: De burgemeester bevordert overigens een goede behartiging van de gemeentelijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel170
  - number: '171.1'
    text: De burgemeester vertegenwoordigt de gemeente in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel171
  - number: '171.2'
    text: |-
      De burgemeester kan de in het eerste lid bedoelde vertegenwoordiging opdragen aan een door hem aan te wijzen
      persoon.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel171
  - number: '172.1'
    text: De burgemeester is belast met de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel172
  - number: '172.2'
    text: |-
      De burgemeester is bevoegd overtredingen van wettelijke voorschriften die betrekking hebben op de openbare orde, te
      beletten of te beëindigen. Hij bedient zich daarbij van de onder zijn gezag staande politie.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel172
  - number: '172.3'
    text: |-
      De burgemeester is bevoegd bij verstoring van de openbare orde of bij ernstige vrees voor het ontstaan daarvan, de
      bevelen te geven die noodzakelijk te achten zijn voor de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel172
  - number: '173.1'
    text: |-
      De burgemeester heeft het opperbevel bij brand alsmede bij ongevallen anders dan bij brand voor zover de brandweer
      daarbij een taak heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel173
  - number: '173.2'
    text: |-
      De burgemeester is bevoegd bij brand en ongevallen bedoeld in het eerste lid, de bevelen te geven die met het oog
      op het voorkomen, beperken en bestrijden van gevaar nodig zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel173
  - number: '174.1'
    text: |-
      De burgemeester is belast met het toezicht op de openbare samenkomsten en vermakelijkheden alsmede op de voor het
      publiek openstaande gebouwen en daarbij behorende erven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174
  - number: '174.2'
    text: |-
      De burgemeester is bevoegd bij de uitoefening van het toezicht, bedoeld in het eerste lid, de bevelen te geven die
      met het oog op de bescherming van veiligheid en gezondheid nodig zijn.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174
  - number: '174.3'
    text: |-
      De burgemeester is belast met de uitvoering van verordeningen voor zover deze betrekking hebben op het in het
      eerste lid bedoelde toezicht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174
  - number: 174a.1
    text: |-
      De burgemeester kan besluiten een woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of
      dat lokaal behorend erf te sluiten, indien door gedragingen in de woning of het lokaal of op het erf de openbare
      orde rond de woning, het lokaal of het erf wordt verstoord.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
  - number: 174a.2
    text: |-
      De in het eerste lid genoemde bevoegdheid komt de burgemeester eveneens toe in geval van ernstige vrees voor
      verstoring van de openbare orde op de grond dat de rechthebbende op de woning, het lokaal of het erf eerder een
      woning, een niet voor het publiek toegankelijk lokaal of een bij die woning of dat lokaal behorend erf op een
      zodanige wijze heeft gebruikt of doen gebruiken dat die woning, dat lokaal of dat erf op grond van het eerste
      lid is gesloten, en er aanwijzingen zijn dat betrokkene de woning, het lokaal of het erf ten aanzien waarvan hij
      rechthebbende is eveneens op een zodanige wijze zal gebruiken of doen gebruiken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
  - number: 174a.3
    text: |-
      De burgemeester bepaalt in het besluit de duur van de sluiting. In geval van ernstige vrees voor herhaling van
      de verstoring van de openbare orde kan hij besluiten de duur van de sluiting tot een door hem te bepalen tijdstip
      te verlengen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
  - number: 174a.4
    text: |-
      Bij de bekendmaking van het besluit worden belanghebbenden in de gelegenheid gesteld binnen een te stellen termijn
      maatregelen te treffen waardoor de verstoring van de openbare orde wordt beëindigd. De eerste volzin is niet van
      toepassing, indien voorafgaande bekendmaking in spoedeisende gevallen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
  - number: 174a.5
    text: |-
      De burgemeester doet zo spoedig mogelijk een besluit als bedoeld in het eerste lid inschrijven in de openbare
      registers, bedoeld in [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24][ref2] van dat boek is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: 174a.6
    text: |-
      De [artikelen 5:25 tot en met 5:28 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel174a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '175.1'
    text: |-
      In geval van oproerige beweging, van andere ernstige wanordelijkheden of van rampen of zware ongevallen, dan
      wel van ernstige vrees voor het ontstaan daarvan, is de burgemeester bevoegd alle bevelen te geven die hij
      ter handhaving van de openbare orde of ter beperking van gevaar nodig acht. Daarbij kan van andere dan bij de
      [Grondwet][ref1] gestelde voorschriften worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '175.2'
    text: De burgemeester laat tot maatregelen van geweld niet overgaan dan na het doen van de nodige waarschuwing.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel175
  - number: '176.1'
    text: |-
      Wanneer een omstandigheid als bedoeld in [artikel 175, eerste lid][ref1], zich voordoet, kan de burgemeester
      algemeen verbindende voorschriften geven die ter handhaving van de openbare orde of ter beperking van gevaar nodig
      zijn. Daarbij kan van andere dan bij de [Grondwet][ref2] gestelde voorschriften worden afgeweken. Hij maakt deze
      voorschriften bekend op een door hem te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0001840
  - number: '176.2'
    text: |-
      De burgemeester brengt de voorschriften zo spoedig mogelijk ter kennis van de raad, van de commissaris van de
      Koning en van de officier van justitie, hoofd van het arrondissementsparket.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
  - number: '176.3'
    text: |-
      De voorschriften vervallen, indien zij niet door de raad in zijn eerstvolgende vergadering die blijkens de
      presentielijst door meer dan de helft van het aantal zitting hebbende leden is bezocht, worden bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
  - number: '176.4'
    text: |-
      Indien de raad de voorschriften niet bekrachtigt, kan de burgemeester binnen vierentwintig uren administratief
      beroep instellen bij de commissaris van de Koning. Deze beslist binnen twee dagen. Gedurende de beroepstermijn en
      de behandeling van het administratief beroep blijven de voorschriften van kracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
  - number: '176.5'
    text: |-
      [Hoofdstuk 6][ref1] en [afdeling 7.3 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op het
      administratief beroep, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.3
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '7.3'
  - number: '176.6'
    text: |-
      De commissaris kan de werking van de voorschriften opschorten zolang zij niet bekrachtigd zijn. Het opschorten
      stuit onmiddellijk de werking van de voorschriften.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
  - number: '176.7'
    text: |-
      Zodra een omstandigheid als bedoeld in [artikel 175, eerste lid][ref1], zich niet langer voordoet, trekt de
      burgemeester de voorschriften in. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
  - number: 176a.1
    text: |-
      De burgemeester is bevoegd door hem aangewezen groepen van personen op een door hem aangegeven plaats tijdelijk te
      doen ophouden. De ophouding kan mede omvatten, indien nodig, het overbrengen naar die plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176a
  - number: 176a.2
    text: 'De burgemeester oefent de bevoegdheid, bedoeld in het eerste lid, slechts uit:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176a
  - number: 176a.2.a
    text: |-
      jegens personen die door hem daartoe aangewezen specifieke onderdelen van een bevel als bedoeld in
      [artikel 175][ref1] of van een algemeen verbindend voorschrift als bedoeld in [artikel 176][ref2], groepsgewijs
      niet naleven, en


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '176'
        hoofdstuk: XI
  - number: 176a.2.b
    text: |-
      indien het ophouden noodzakelijk is ter voorkoming van voortzetting of herhaling van de niet-naleving en de
      naleving redelijkerwijs niet op andere geschikte wijze kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176a
  - number: 176a.3
    text: |-
      [Artikel 154a, derde tot en met veertiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel176a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
  - number: '177.1'
    text: |-
      De burgemeester kan een in de gemeente dienstdoende ambtenaar van politie machtigen in zijn naam besluiten te nemen
      of andere handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel177
  - number: '177.2'
    text: |-
      Geen machtiging wordt verleend tot het nemen van besluiten ingevolge de [artikelen 151b][ref1], [154a][ref2],
      [172][ref3], [173][ref4], [174, tweede lid][ref5], [174a][ref6], [175][ref7], [176][ref8] en [176a][ref9] en tot
      uitvoering van beslissingen van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel172
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel173
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref6]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref7]: https://wetten.overheid.nl/BWBR0005416#Artikel175
      [ref8]: https://wetten.overheid.nl/BWBR0005416#Artikel176
      [ref9]: https://wetten.overheid.nl/BWBR0005416#Artikel176a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 151b
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '172'
        hoofdstuk: XI
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '173'
        hoofdstuk: XI
      - id: ref5
        bwb_id: BWBR0005416
        artikel: '174'
        hoofdstuk: XI
      - id: ref6
        bwb_id: BWBR0005416
        artikel: 174a
        hoofdstuk: XI
      - id: ref7
        bwb_id: BWBR0005416
        artikel: '175'
        hoofdstuk: XI
      - id: ref8
        bwb_id: BWBR0005416
        artikel: '176'
        hoofdstuk: XI
      - id: ref9
        bwb_id: BWBR0005416
        artikel: 176a
        hoofdstuk: XI
  - number: '178.1'
    text: |-
      De burgemeester kan aan een door hem ingestelde bestuurscommissie en aan de voorzitter van het dagelijks bestuur
      van een deelgemeente bevoegdheden overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel178
  - number: '178.2'
    text: |-
      De bevoegdheden, bedoeld in de [artikelen 154a][ref1] en [172 tot en met 176a][ref2], kunnen in ieder geval niet
      worden overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154a
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel172
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 154a
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '172'
        hoofdstuk: XI
  - number: '178.3'
    text: |-
      Ten aanzien van een besluit dat wordt genomen op grond van het eerste lid zijn de
      [artikelen 139, tweede lid][ref1], [140][ref2] en [141][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel141
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '140'
        hoofdstuk: VIII
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '141'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '178.4'
    text: |-
      De burgemeester neemt geen besluit op grond van het eerste lid dan nadat de raad een ontwerp-besluit is toegezonden
      en in de gelegenheid is gesteld zijn wensen en bedenkingen ter kennis van de burgemeester te brengen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel178
  - number: '179'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van de burgemeester, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de ingevolge [artikel 178][ref1] overgedragen bevoegdheden van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel178
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '178'
        hoofdstuk: XI
  - number: '180.1'
    text: De burgemeester is aan de raad verantwoording schuldig over het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel180
  - number: '180.2'
    text: Hij geeft de raad alle inlichtingen die de raad voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel180
  - number: '180.3'
    text: |-
      Hij geeft de raad mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen, tenzij het
      verstrekken ervan in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel180
  - number: '186'
    text: |-
      De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel186
  - number: '187'
    text: Aan de gemeenten kunnen slechts bij of krachtens de wet uitgaven worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel187
  - number: '189.1'
    text: |-
      Voor alle taken en activiteiten brengt de raad jaarlijks op de begroting de bedragen die hij daarvoor beschikbaar
      stelt, alsmede de financiële middelen die hij naar verwachting kan aanwenden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel189
  - number: '189.2'
    text: De begroting bevat mede een bedrag voor onvoorziene uitgaven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel189
  - number: '189.3'
    text: |-
      De raad ziet erop toe dat de begroting in evenwicht is. Hiervan kan hij afwijken indien aannemelijk is dat het
      evenwicht in de begroting in de eerstvolgende jaren tot stand zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel189
  - number: '189.4'
    text: |-
      Behoudens het bepaalde in de [artikelen 208][ref1] en [209][ref2] kunnen ten laste van de gemeente slechts uitgaven
      worden gedaan tot de bedragen die hiervoor op de begroting zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel209
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '208'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '189.5'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel189
  - number: '190.1'
    text: |-
      Het college biedt jaarlijks, tijdig voor de in [artikel 191, eerste lid][ref1], bedoelde vaststelling, de raad
      een ontwerp aan voor de begroting met toelichting van de gemeente en een meerjarenraming met toelichting voor ten
      minste drie op het begrotingsjaar volgende jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel191
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '190.2'
    text: |-
      De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan de raad
      zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel190
  - number: '190.3'
    text: De raad beraadslaagt over de ontwerp-begroting niet eerder dan twee weken na de openbare kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel190
  - number: '191.1'
    text: De raad stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel191
  - number: '191.2'
    text: |-
      Het college zendt de door de raad vastgestelde begroting vergezeld van de in [artikel 190, eerste lid][ref1],
      bedoelde stukken, binnen twee weken na de vaststelling, doch in ieder geval vóór 15 november van het jaar
      voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '192.1'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel192
  - number: '192.2'
    text: |-
      De [artikelen 190, tweede lid][ref1], en [191, tweede lid][ref2], alsmede, behoudens in gevallen van dringende
      spoed, het bepaalde in [artikel 190, derde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel191
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '193'
    text: 'Verplichte uitgaven van de gemeente zijn:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel193
  - number: 193.a
    text: de renten en aflossingen van de door de gemeente aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel193
  - number: 193.b
    text: de uitgaven die bij of krachtens de wet aan de gemeente zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel193
  - number: 193.c
    text: |-
      de uitgaven die voortvloeien uit de van het gemeentebestuur gevorderde medewerking tot uitvoering van wetten en
      algemene maatregelen van bestuur, voor zover die uitgaven niet ten laste van anderen zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel193
  - number: '194.1'
    text: |-
      Indien de raad weigert verplichte uitgaven of een bedrag voor onvoorziene uitgaven op de begroting te brengen, doen
      gedeputeerde staten dit.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel194
  - number: '194.2'
    text: |-
      Indien de raad bovendien weigert in voldoende dekking van in het eerste lid bedoelde uitgaven te voorzien,
      verminderen gedeputeerde staten daartoe hetzij het bedrag voor onvoorziene uitgaven, hetzij indien dit bedrag niet
      toereikend is, overige niet-verplichte uitgaven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel194
  - number: '195'
    text: |-
      Gedeputeerde staten dragen zo nodig aan de bevoegde gemeenteambtenaar de betaling op ten laste van de gemeente van
      hetgeen als verplichte uitgaaf op de begroting is gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel195
  - number: '197.1'
    text: |-
      Het college legt aan de raad over elk begrotingsjaar verantwoording af over het door hem gevoerde bestuur, onder
      overlegging van de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel197
  - number: '197.2'
    text: |-
      Het college voegt daarbij de accountantsverklaring, bedoeld in [artikel 213, derde lid][ref1], het
      verslag van bevindingen, bedoeld in [artikel 213, vierde lid][ref2], en de verslagen, bedoeld in
      [artikel 213a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 213a
        hoofdstuk: XIV
  - number: '197.3'
    text: |-
      De in het eerste en tweede lid bedoelde stukken liggen, zodra zij aan de raad zijn overgelegd, voor een ieder
      ter inzage en zijn algemeenverkrijgbaar. Van de terinzagelegging en de verkrijgbaarstelling wordt openbaar kennis
      gegeven. De raad beraadslaagt over de jaarrekening en het jaarverslag niet eerder dan twee weken na de openbare
      kennisgeving.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel197
  - number: '198.1'
    text: De raad stelt de jaarrekening vast in het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel198
  - number: '198.2'
    text: |-
      Indien de raad tot het oordeel komt dat uitgaven die in de jaarrekening zijn opgenomen niet rechtmatig zijn gedaan,
      wordt dit standpunt terstond ter kennis gebracht van het college met vermelding van de gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel198
  - number: '198.3'
    text: |-
      Het college zendt de raad binnen twee maanden na ontvangst van het standpunt, bedoeld in het tweede lid, een
      voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij de raad gerezen bedenkingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel198
  - number: '198.4'
    text: |-
      Indien het college een voorstel voor een indemniteitsbesluit heeft gedaan, stelt de raad de jaarrekening niet vast
      dan nadat hij heeft besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel198
  - number: '199'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van het
      college ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel199
  - number: '200'
    text: |-
      Het college zendt de vastgestelde jaarrekening, vergezeld van de overige in [artikel 197][ref1] bedoelde stukken
      binnen twee weken na vaststelling, maar in ieder geval voor 15 juli van het jaar, volgend op het begrotingsjaar,
      aan gedeputeerde staten. Het college voegt daarbij, indien van toepassing, het besluit van de raad over een
      voorstel voor een indemniteitsbesluit met de reactie, bedoeld in [artikel 198, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel198
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '198'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '201'
    text: |-
      Indien de raad de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststelt, zendt het
      college de jaarrekening, vergezeld van de overige in [artikel 197][ref1] bedoelde stukken, respectievelijk het
      indemniteitsbesluit ter vaststelling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '203.1'
    text: |-
      De begroting, bedoeld in [artikel 189][ref1], van het eerstvolgende begrotingsjaar alsmede de daarop betrekking
      hebbende begrotingswijzigingen behoeven de goedkeuring van gedeputeerde staten, indien naar hun oordeel de
      begroting, bedoeld in [artikel 189][ref2], niet in evenwicht is en blijkens de meerjarenraming, bedoeld in
      [artikel 190][ref3], niet aannemelijk is dat in de eerstvolgende jaren een evenwicht tot stand zal worden gebracht.
      Gedeputeerde staten doen hiervan vóór de aanvang van het begrotingsjaar mededeling aan het gemeentebestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel190
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '190'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: '203.2'
    text: |-
      Gedeputeerde staten kunnen bepalen dat de begroting, bedoeld in [artikel 189][ref1], van het eerstvolgende
      begrotingsjaar alsmede de daarop betrekking hebbende begrotingswijzigingen hun goedkeuring behoeven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 203.2.a
    text: de jaarrekening van het tweede aan het begrotingsjaar voorafgaande jaar niet in evenwicht is, of
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
  - number: 203.2.b
    text: |-
      de begroting, bedoeld in [artikel 189][ref1], niet tijdig is ingezonden aan gedeputeerde staten overeenkomstig het
      bepaalde in [artikel 191][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel191
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '189'
        hoofdstuk: XIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '191'
        hoofdstuk: XIII
        paragraaf: '1'
  - number: 203.2.c
    text: |-
      de jaarrekening, bedoeld in [artikel 197, eerste lid][ref1], van het tweede aan het begrotingsjaar
      voorafgaande jaar niet tijdig is ingezonden aan gedeputeerde staten overeenkomstig het bepaalde in
      [artikel 200, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel200
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '200'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '203.3'
    text: |-
      Gedeputeerde staten maken een besluit als bedoeld in het tweede lid vóór de aanvang van het begrotingsjaar aan het
      gemeentebestuur bekend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
  - number: '203.4'
    text: |-
      De begroting behoeft geen goedkeuring indien gedeputeerde staten geen mededeling doen als bedoeld in het eerste
      lid of geen besluit bekend maken als bedoeld in het tweede lid binnen de in het eerste respectievelijk derde lid
      genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel203
  - number: '205.1'
    text: |-
      Gedeputeerde staten stellen Onze Minister uiterlijk een maand na de aanvang van het begrotingsjaar schriftelijk en
      gemotiveerd in kennis van de mededelingen en besluiten, bedoeld in [artikel 203, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '205.2'
    text: |-
      Gedeputeerde staten maken bij de aanvang van het desbetreffende begrotingsjaar door publicatie in de
      *Staatscourant* bekend van welke gemeenten de begrotingen en begrotingswijzigingen hun goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel205
  - number: '206'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel206
  - number: '207.1'
    text: |-
      Indien op de dag waarop een besluit tot wijziging van de begroting aan gedeputeerde staten wordt aangeboden, de
      begroting nog niet is goedgekeurd, vangt de in [artikel 10:31, eerste lid, van de Algemene wet bestuursrecht][ref1]
      bedoelde termijn aan op de dag van de goedkeuring van de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '207.2'
    text: |-
      Gedeputeerde staten kunnen bij hun besluit omtrent goedkeuring van de begroting ten aanzien van door hen aan te
      geven soorten van wijzigingen daarvan bepalen dat die hun goedkeuring niet behoeven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel207
  - number: '208.1'
    text: |-
      Indien de begroting of een besluit tot wijziging daarvan niet is goedgekeurd, behoeft het gemeentebestuur tot het
      doen van uitgaven de toestemming van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel208
  - number: '208.2'
    text: |-
      Een aanvraag van het gemeentebestuur om toepassing van het eerste lid kan door gedeputeerde staten slechts worden
      afgewezen wegens strijd met het recht of met het algemene financiële belang.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel208
  - number: '208.3'
    text: |-
      Gedeputeerde staten beslissen op de aanvraag binnen twee maanden na de verzending van de aanvraag, bedoeld in
      het tweede lid. De toestemming wordt geacht te zijn verleend indien binnen deze termijn geen besluit aan het
      gemeentebestuur is verzonden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel208
  - number: '208.4'
    text: Gedeputeerde staten kunnen aan de toestemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel208
  - number: '208.5'
    text: |-
      Gedeputeerde staten kunnen bepalen voor welke posten en tot welk bedrag het gemeentebestuur de toestemming, bedoeld
      in het eerste lid, niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel208
  - number: '209.1'
    text: |-
      In gevallen van dringende spoed kan, indien de raad daartoe besluit, een uitgaaf worden gedaan voordat de
      desbetreffende begroting of begrotingswijziging is goedgekeurd. Het besluit wordt gedeputeerde staten terstond
      toegezonden. Is de uitgaaf geraamd bij een begrotingswijziging welke nog niet ter goedkeuring is ingezonden, dan
      wordt deze begrotingswijziging te zamen met het besluit toegezonden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel209
  - number: '209.2'
    text: Over het in het eerste lid bedoelde besluit stemt de raad bij hoofdelijke oproeping.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel209
  - number: '210.1'
    text: |-
      Indien de raad [artikel 209][ref1] heeft toegepast en gedeputeerde staten hun goedkeuring aan de desbetreffende
      begroting of begrotingswijziging onthouden, kunnen zij binnen een maand nadat hun besluit onherroepelijk is
      geworden, de leden van de raad die hun stem vóór het in [artikel 209][ref2] bedoelde besluit hebben uitgebracht,
      ieder voor een gelijk deel, persoonlijk voor deze uitgaaf aansprakelijk stellen tegenover de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel209
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel209
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '209'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '210.2'
    text: |-
      De werking van het besluit tot aansprakelijkstelling wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel210
  - number: '210.3'
    text: |-
      De commissaris van de Koning stelt zo nodig namens en ten laste van de gemeente een rechtsvordering in tot betaling
      van de krachtens het besluit tot aansprakelijkstelling verschuldigde gelden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel210
  - number: '211'
    text: |-
      Indien de begroting van een gemeente ingevolge [artikel 203, eerste of tweede lid][ref1], is onderworpen aan
      goedkeuring, kunnen gedeputeerde staten bepalen dat door hen aan te wijzen beslissingen van het gemeentebestuur die
      financiële gevolgen voor de gemeente hebben of kunnen hebben, door het college binnen twee weken aan gedeputeerde
      staten worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '212.1'
    text: |-
      De raad stelt bij verordening de uitgangspunten voor het financiële beleid, alsmede de regels voor het financiële
      beheer en voor de inrichting van de financiële organisatie vast. Deze verordening dient te waarborgen dat aan de
      eisen van rechtmatigheid, verantwoording en controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel212
  - number: '212.2'
    text: 'De verordening bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel212
  - number: 212.2.a
    text: regels voor waardering en afschrijving van activa;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel212
  - number: 212.2.b
    text: |-
      grondslagen voor de berekening van de door het gemeentebestuur in rekening te brengen prijzen en van tarieven voor
      rechten als bedoeld in [artikel 229b][ref1], alsmede, voor zover deze wordt geheven, voor de heffing bedoeld in
      [artikel 15.33 van de Wet milieubeheer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 229b
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 212.2.c
    text: |-
      regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie,
      alsmede inzake de administratieve organisatie van de financieringsfunctie, daaronder begrepen taken en
      bevoegdheden, de verantwoordingsrelaties en de bijbehorende informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel212
  - number: '213.1'
    text: |-
      De raad stelt bij verordening regels vast voor de controle op het financiële beheer en op de inrichting van de
      financiële organisatie. Deze verordening dient te waarborgen dat de rechtmatigheid van het financiële beheer en van
      de inrichting van de financiële organisatie wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: '213.2'
    text: |-
      De raad wijst een of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 197][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van de bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
        hoofdstuk: XIII
        paragraaf: '2'
  - number: '213.3'
    text: 'De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213.3.a
    text: |-
      de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en samenstelling van het
      vermogen;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213.3.b
    text: de baten en lasten, alsmede de balansmutaties rechtmatig tot stand zijn gekomen en
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213.3.c
    text: |-
      de jaarrekening is opgesteld in overeenstemming met de bij of krachtens algemene maatregel van bestuur te stellen
      regels, bedoeld in [artikel 186][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel186
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '186'
        hoofdstuk: XII
  - number: '213.4'
    text: 'Het verslag van de bevindingen bevat in ieder geval bevindingen over:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213.4.a
    text: |-
      de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken en
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213.4.b
    text: onrechtmatigheden in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: '213.5'
    text: |-
      De accountant zendt de accountantsverklaring en het verslag van bevindingen aan de raad en een afschrift daarvan
      aan het college.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: '213.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: '213.7'
    text: |-
      Accountants als bedoeld in het tweede lid kunnen in gemeentelijke dienst worden aangesteld en worden in dat geval
      door de raad benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213
  - number: 213a.1
    text: |-
      Het college verricht periodiek onderzoek naar de doelmatigheid en de doeltreffendheid van het door hem gevoerde
      bestuur. De raad stelt bij verordening regels hierover.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213a
  - number: 213a.2
    text: Het college brengt schriftelijk verslag uit aan de raad van de resultaten van de onderzoeken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213a
  - number: 213a.3
    text: |-
      Het college stelt de rekenkamer tijdig op de hoogte van de onderzoeken die hij doet instellen en zendt hem een
      afschrift van een verslag als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel213a
  - number: '214'
    text: |-
      Het college zendt de verordeningen, bedoeld in de [artikelen 212][ref1], [213][ref2] en [213a][ref3], binnen twee
      weken na vaststelling door de raad aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
        hoofdstuk: XIV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 213a
        hoofdstuk: XIV
  - number: '215'
    text: |-
      Gedeputeerde staten kunnen te allen tijde een onderzoek instellen naar het beheer en de inrichting van de
      financiële organisatie, bedoeld in [artikel 212, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel212
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '212'
        hoofdstuk: XIV
  - number: '216'
    text: |-
      De raad besluit tot het invoeren, wijzigen of afschaffen van een gemeentelijke belasting door het vaststellen van
      een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel216
  - number: '217'
    text: |-
      Een belastingverordening vermeldt, in de daartoe leidende gevallen, de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, het
      tijdstip van beëindiging van de heffing en hetgeen overigens voor de heffing en de invordering van belang is.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel217
  - number: '219.1'
    text: |-
      Behalve de gemeentelijke belastingen waarvan de heffing krachtens andere wetten dan deze geschiedt, worden geen
      andere belastingen geheven dan die bedoeld in de [tweede][ref1] en [derde paragraaf van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: '219.2'
    text: |-
      Behoudens het bepaalde in andere wetten dan deze en in de [tweede][ref1] en
      [derde paragraaf van dit hoofdstuk][ref2] kunnen de gemeentelijke belastingen worden geheven naar in de
      belastingverordening te bepalen heffingsmaatstaven, met dien verstande dat het bedrag van een gemeentelijke
      belasting niet afhankelijk mag worden gesteld van het inkomen, de winst of het vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: '220'
    text: |-
      Ter zake van binnen de gemeente gelegen onroerende zaken kunnen onder de naam onroerende-zaakbelastingen worden
      geheven:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220
  - number: 220.a
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar onroerende zaken, al dan niet krachtens eigendom,
      bezit, beperkt recht of persoonlijk recht, gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220
  - number: 220.b
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar van onroerende zaken het genot hebben krachtens
      eigendom, bezit of beperkt recht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220
  - number: 220a
    text: |-
      Met betrekking tot de onroerende-zaakbelastingen wordt als onroerende zaak aangemerkt de onroerende zaak, bedoeld
      in [hoofdstuk III van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
  - number: 220b.1
    text: |-
      Voor de toepassing van [artikel 220, onderdeel a][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220b.1.a
    text: |-
      gebruik door de leden van een huishouden aangemerkt als gebruik door een door de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar aan te wijzen lid van dat huishouden;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 220b.1.b
    text: |-
      gebruik door degene aan wie een deel van een onroerende zaak in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de belasting
      als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220b
  - number: 220b.1.c
    text: |-
      het ter beschikking stellen van een onroerende zaak voor volgtijdig gebruik aangemerkt als gebruik door degene die
      die onroerende zaak ter beschikking heeft gesteld; degene die de onroerende zaak ter beschikking heeft gesteld is
      bevoegd de belasting als zodanig te verhalen op degene aan wie die zaak ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220b
  - number: 220b.2
    text: |-
      Voor de toepassing van [artikel 220, onderdeel b][ref1], wordt als genothebbende krachtens eigendom, bezit of
      beperkt recht aangemerkt degene die bij het begin van het kalenderjaar als zodanig in de kadastrale registratie is
      vermeld, tenzij blijkt dat hij op dat tijdstip geen genothebbende krachtens eigendom, bezit of beperkt recht is.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220c
    text: |-
      De heffingsmaatstaf voor de onroerende-zaakbelastingen is de op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] voor de onroerende zaak vastgestelde waarde voor het
      tijdvak waarbinnen het in [artikel 220][ref2] bedoelde kalenderjaar valt.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220c
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220d.1
    text: |-
      In afwijking in zoverre van [artikel 220][ref1] wordt bij de bepaling van de heffingsmaatstaf voor de onroerende-
      zaakbelastingen buiten aanmerking gelaten, voor zover dit niet reeds is geschied bij de bepaling van de in dat
      artikel bedoelde waarde, de waarde van:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220c
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220c
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220d.1.a
    text: |-
      ten behoeve van de land- of bosbouw bedrijfsmatig geëxploiteerde cultuurgrond, daaronder mede begrepen de open
      grond, alsmede de ondergrond van glasopstanden, die bedrijfsmatig aangewend wordt voor de kweek of teelt van
      gewassen, zonder daarbij de ondergrond als voedingsbodem te gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.b
    text: |-
      glasopstanden, die bedrijfsmatig worden aangewend voor de kweek of teelt van gewassen, voor zover de ondergrond
      daarvan bestaat uit de in onderdeel a bedoelde grond;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.c
    text: |-
      onroerende zaken die in hoofdzaak zijn bestemd voor de openbare eredienst of voor het houden van openbare
      bezinningssamenkomsten van levensbeschouwelijke aard, een en ander met uitzondering van delen van zodanige
      onroerende zaken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.d
    text: |-
      één of meer onroerende zaken die deel uitmaken van een op de voet van de [Natuurschoonwet 1928][ref1] aangewezen
      landgoed dat voldoet aan de in [artikel 1, derde lid, onderdeel ][ref2]bedoelde voorwaarden met uitzondering van de
      daarop voorkomende gebouwde eigendommen;


      [ref1]: https://wetten.overheid.nl/BWBR0001939
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0001939
      - id: ref2
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 220d.1.e
    text: |-
      natuurterreinen, waaronder mede worden verstaan duinen, heidevelden, zandverstuivingen, moerassen en plassen, die
      door rechtspersonen met volledige rechtsbevoegdheid welke zich uitsluitend of nagenoeg uitsluitend het behoud van
      natuurschoon ten doel stellen, beheerd worden;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.f
    text: openbare land- en waterwegen en banen voor openbaar vervoer per rail, een en ander met inbegrip van kunstwerken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.g
    text: |-
      waterverdedigings- en waterbeheersingswerken die worden beheerd door organen, instellingen of diensten van
      publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.h
    text: |-
      werken die zijn bestemd voor de zuivering van riool- en ander afvalwater en die worden beheerd door organen,
      instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken
      die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.i
    text: |-
      een onroerende zaak of een deel daarvan waarvan de waarde ingevolge de gemeentelijke belastingverordening bij de
      bepaling van de heffingsmaatstaf buiten aanmerking blijft;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.1.j
    text: |-
      werktuigen die van een onroerende zaak kunnen worden afgescheiden zonder dat beschadiging van betekenis aan die
      werktuigen wordt toegebracht en die niet op zichzelf als gebouwde eigendommen zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
  - number: 220d.2
    text: |-
      Voor de toepassing van het eerste lid, onderdelen *a* en *b*, wordt het begrip landbouw opgevat als in
      [artikel 1, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel1
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '1'
  - number: 220d.3
    text: |-
      Bij de toepassing van het eerste lid is het bepaalde bij of krachtens de [artikelen 17][ref1],
      [18][ref2], [19, eerste lid, onderdelen ][ref3], [20, tweede lid][ref4], en
      [22, derde lid, van de Wet waardering onroerende zaken][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 220d.4
    text: |-
      Indien met betrekking tot een onroerende zaak geen waarde is vastgesteld op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] wordt de heffingsmaatstaf van die onroerende zaak
      bepaald met toepassing van het eerste en het tweede lid, alsmede met overeenkomstige toepassing van het bepaalde
      bij of krachtens de [artikelen 17][ref2], [18][ref3], [19, eerste lid, onderdelen ][ref4], [20, tweede lid][ref5],
      en [22, derde lid, van de Wet waardering onroerende zaken][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220d
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 220f.1
    text: Het tarief van de belasting is voor elke volle € 2 268 van de heffingsmaatstaf gelijk.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.2
    text: |-
      Voor de toepassing van deze paragraaf dient een onroerende zaak in hoofdzaak tot woning indien de waarde die op
      grond van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] is vastgesteld voor die onroerende zaak in
      hoofdzaak kan worden toegerekend aan delen van de onroerende zaak die dienen tot woning dan wel volledig dienstbaar
      zijn aan woondoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 220f.3
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.3.a
    text: 'woningen: onroerende zaken die in hoofdzaak tot woning dienen;'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.3.b
    text: 'niet-woningen: onroerende zaken die niet in hoofdzaak tot woning dienen;'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.3.c
    text: |-
      tijdvak: een tijdvak als bedoeld in [artikel 22, tweede lid, van de Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 220f.3.d
    text: |-
      vastgestelde waarde: de heffingsmaatstaf, bedoeld in [de artikelen 220c][ref1] en
      [220d, eerste tot en met derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220c
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220c
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220d
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f.3.e
    text: |-
      waarde: de heffingsmaatstaf, bedoeld in [artikel 220d, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220d
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f.3.f
    text: |-
      percentage terzake van het kalenderjaar 2000: het percentage berekend volgens de formule:






                        100 x


                        A




                        B




               waarbij A voorstelt: de som van de tarieven ter zake van de onroerende-zaakbelastingen, ingevolge
      [artikel 220, onderdelen a en b][ref1], zoals vastgesteld ter zake van het kalenderjaar 2000 voor niet-
      woningen; B voorstelt: de som van de tarieven ter zake van de onroerende-zaakbelastingen, ingevolge
      [artikel 220, onderdelen a en b][ref2], zoals vastgesteld ter zake van het kalenderjaar 2000 voor woningen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220f.3.g
    text: |-
      tijdvakpercentage: 'het percentage berekend volgens de formule:'






                        percentage terzake van het kalenderjaar 2000 x


                        C




                        D




               waarbij C voorstelt: de waarde-index woningen, zijnde de verhouding tussen de totale waarde van woningen
      ter zake van het kalenderjaar 2001, zoals geraamd ten tijde van het vaststellen van de belastingverordening ter
      zake van het kalenderjaar 2001, en de totale vastgestelde waarde van woningen ter zake van het kalenderjaar 2000,
      zoals die bekend is ten tijde van het vaststellen van de belastingverordening ter zake van het kalenderjaar 2001;
      D voorstelt: de waarde-index niet-woningen, zijnde de verhouding tussen de totale waarde van niet-woningen ter zake
      van het kalenderjaar 2001, zoals geraamd ten tijde van het vaststellen van de belastingverordening ter zake van het
      kalenderjaar 2001, en de totale vastgestelde waarde van niet-woningen ter zake van het kalenderjaar 2000, zoals die
      bekend is ten tijde van het vaststellen van de belastingverordening ter zake van het kalenderjaar 2001.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.4
    text: |-
      Het tarief van de belasting voor niet-woningen kan binnen een bepaalde marge op een ander bedrag worden vastgesteld
      dan het tarief voor woningen. De marge waarbinnen het tarief voor niet-woningen mag afwijken van dat voor woningen
      wordt voor het tijdvak dat aanvangt op 1 januari 2001, begrensd door enerzijds het percentage ter zake van het
      kalenderjaar 2000 en anderzijds het tijdvakpercentage verhoogd met tien procentpunten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220f.5
    text: |-
      Indien als gevolg van een latere wijziging van de gemeentelijke indeling in het kalenderjaar 2000 op het
      grondgebied van een gemeente in verschillende gebieden verschillende belastingverordeningen golden, wordt bij
      de berekening van de onderdelen A en B van de formule, bedoeld in het derde lid onder f, het gewogen gemiddelde
      genomen van de tarieven voor woningen respectievelijk niet-woningen, waarbij de wegingsfactor voor elk van beide
      onderdelen wordt gevormd door het aandeel dat de totale waarde van woningen respectievelijk niet-woningen van een
      gebied heeft in de totale waarden van deze beide categorieën van de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220f
  - number: 220g
    text: |-
      Het tarief van de in [artikel 220, onderdeel ][ref1], bedoelde belasting voor onroerende zaken die in hoofdzaak tot
      woning dienen, gaat niet uit boven 125 percent van het tarief van de in [artikel 220, onderdeel ][ref2], bedoelde
      belasting voor die onroerende zaken. Het tarief van de in [artikel 220, onderdeel ][ref3], bedoelde belasting voor
      onroerende zaken die niet in hoofdzaak tot woning dienen, gaat niet uit boven 125 percent van het tarief van de in
      [artikel 220, onderdeel ][ref4], bedoelde belasting voor die onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220g
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: 220h.1
    text: |-
      In de belastingverordening kan worden bepaald dat geen belasting wordt geheven indien de heffingsmaatstaf blijft
      beneden € 11 344,51 dan wel een in de belastingverordening te bepalen lager bedrag.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220h
  - number: 220h.2
    text: |-
      In de belastingverordening kunnen belastingbedragen tot maximaal € 9,08 worden opgenomen waarvoor geen invordering
      zal plaatsvinden. Voor de toepassing van de vorige volzin kan in de belastingverordening worden bepaald dat
      het totaal van op één aanslagbiljet of kennisgeving verenigde verschuldigde bedragen wordt aangemerkt als één
      belastingbedrag.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220h
  - number: 220i.1
    text: |-
      In de belastingverordening kan worden bepaald dat gedurende maximaal drie jaren na het begin van een tijdvak als
      bedoeld in [artikel 22, tweede lid, van de Wet waardering onroerende zaken][ref1] een vermindering wordt verleend
      op de belastingaanslagen terzake van een onroerende zaak. Het bedrag van de vermindering wordt afzonderlijk vermeld
      op het aanslagbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
  - number: 220i.2
    text: |-
      De vermindering kan voor onroerende zaken die in hoofdzaak tot woning dienen anders worden vastgesteld dan voor
      onroerende zaken die niet in hoofdzaak tot woning dienen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
  - number: 220i.3
    text: |-
      De vermindering wordt zodanig berekend dat het na vermindering te betalen belastingbedrag telkenjare niet meer
      bedraagt dan een in de belastingverordening te bepalen percentage van het belastingbedrag dat terzake van die
      onroerende zaak met betrekking tot het daaraan voorafgaande kalenderjaar na vermindering is verschuldigd, doch met
      een minimumpercentage van 115 percent.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
  - number: 220i.4
    text: |-
      In de belastingverordening kan worden bepaald dat de vermindering niet wordt toegepast indien het bedrag van de
      vermindering lager is dan een in de belastingverordening vermeld drempelbedrag.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
  - number: 220i.5
    text: |-
      In de belastingverordening kan worden bepaald dat bij de berekening van het bedrag van de vermindering buiten
      beschouwing gelaten wordt de wijziging van het belastingbedrag ten opzichte van het daaraan voorafgaande
      kalenderjaar die het gevolg is van toepassing van [artikel 19 van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '19'
  - number: 220i.6
    text: |-
      In afwijking in zoverre van de vorige leden kan in de belastingverordening worden bepaald dat de vermindering
      zodanig wordt berekend dat het na vermindering te betalen bedrag ter zake van de kalenderjaren in een tijdvak
      als bedoeld in [artikel 22, tweede lid, van de Wet waardering onroerende zaken][ref1], niet meer bedraagt dan 130
      percent of een bij de belastingverordening te bepalen hoger percentage van het belastingbedrag dat is verschuldigd
      ter zake van het laatste kalenderjaar van het voorafgaande tijdvak. Indien ter zake van het laatste kalenderjaar
      van het voorafgaande tijdvak een vermindering als bedoeld in dit artikel is verleend, wordt voor de toepassing
      van de vorige volzin het belastingbedrag genomen dat verschuldigd zou zijn geweest indien de vermindering niet
      was toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel220i
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
  - number: '221.1'
    text: |-
      Ter zake van binnen de gemeente gelegen woon- en bedrijfsruimten, welke duurzaam aan een plaats gebonden en dienen
      tot permanente bewoning of permanent gebruik, doch niet onroerend zijn, kunnen twee belastingen worden geheven,
      te weten:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel221
  - number: 221.1.a
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar de ruimten, al dan niet krachtens eigendom, bezit,
      beperkt recht of persoonlijk recht, gebruiken;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel221
  - number: 221.1.b
    text: |-
      een belasting van degenen die bij het begin van het kalenderjaar van de ruimten het genot hebben krachtens
      eigendom, bezit of beperkt recht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel221
  - number: '221.2'
    text: |-
      Bij de toepassing van het eerste lid zijn de [artikelen 220b ][ref1],
      [220d tot en met 220i ][ref2]alsmede het bepaalde bij of krachtens de [artikelen 17][ref3],
      [18][ref4], [19, eerste lid, onderdelen b en c, tweede lid, onderdelen b en c][ref5], en
      [22, derde lid, van de Wet waardering onroerende zaken][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220b
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel221
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220b
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 220d
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0007119
        artikel: '22'
  - number: '221.3'
    text: |-
      Het tarief van de in het eerste lid genoemde belastingen is gelijk aan het binnen de gemeente geldende tarief voor
      de onroerende-zaakbelastingen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel221
  - number: '222.1'
    text: |-
      Ter zake van de in een bepaald gedeelte van de gemeente gelegen onroerende zaak die gebaat is door voorzieningen
      die tot stand worden of zijn gebracht door of met medewerking van het gemeentebestuur, kan van degenen die van
      die onroerende zaak het genot hebben krachtens eigendom, bezit of beperkt recht, een baatbelasting worden geheven,
      waarbij de aan de voorzieningen verbonden lasten geheel of gedeeltelijk worden omgeslagen. Indien de aan de
      voorzieningen verbonden lasten ter zake van een onroerende zaak krachtens overeenkomst zijn of worden voldaan,
      wordt de baatbelasting ter zake van die onroerende zaak niet geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel222
  - number: '222.2'
    text: |-
      Voordat met het treffen van voorzieningen wordt aangevangen, wordt door de raad besloten in welke mate de aan die
      voorzieningen verbonden lasten door middel van een baatbelasting zullen worden verhaald. Een besluit als bedoeld in
      de eerste volzin bevat een aanduiding van het gebied waarbinnen de gebate onroerende zaak is gelegen. Het besluit
      wordt bekend gemaakt overeenkomstig [artikel 139][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel139
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '139'
        hoofdstuk: VIII
        paragraaf: '5'
  - number: '222.3'
    text: |-
      Of een onroerende zaak is gebaat wordt beoordeeld naar de toestand op een in de belastingverordening te bepalen
      tijdstip, dat is gelegen uiterlijk een jaar nadat de voorzieningen geheel zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel222
  - number: '222.4'
    text: Tot invoering van de belasting wordt besloten uiterlijk twee jaren nadat de voorzieningen geheel zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel222
  - number: '222.5'
    text: |-
      De belasting wordt ineens geheven, met dien verstande dat de belasting op verzoek van de belastingplichtige in
      de vorm van een jaarlijkse belasting wordt geheven gedurende ten hoogste dertig jaren, een en ander volgens in de
      verordening vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel222
  - number: '223.1'
    text: |-
      Er kan een forensenbelasting worden geheven van de natuurlijke personen, die, zonder in de gemeente hoofdverblijf
      te hebben, er gedurende het belastingjaar meer dan negentig malen nachtverblijf houden, anders dan als verpleegde
      of verzorgde in een inrichting tot verpleging of verzorging van zieken, van gebrekkigen, van hulpbehoevenden
      of bejaarden, of er op meer dan negentig dagen van dat jaar voor zich of hun gezin een gemeubileerde woning
      beschikbaar houden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel223
  - number: '223.2'
    text: |-
      Degene die ter tijdelijke waarneming van een openbare betrekking of ter bijwoning van de vergaderingen van een
      algemeen vertegenwoordigend orgaan, waarvan hij het lidmaatschap bekleedt, dan wel ingevolge last of bevel van de
      overheid, buiten de gemeente van zijn hoofdverblijf vertoeft, is op die grond niet belastingplichtig.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel223
  - number: '223.3'
    text: Of iemand in de gemeente hoofdverblijf heeft, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel223
  - number: '224.1'
    text: |-
      Ter zake van het houden van verblijf binnen de gemeente door personen die niet als ingezetene in de gemeentelijke
      basisadministratie persoonsgegevens zijn ingeschreven, kan een toeristenbelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel224
  - number: '224.2'
    text: |-
      Voor zover de belasting wordt geheven van degene die gelegenheid tot verblijf biedt, is deze bevoegd de belasting
      als zodanig te verhalen op degene ter zake van wiens verblijf de belasting verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel224
  - number: '225.1'
    text: 'In het kader van de parkeerregulering kunnen de volgende belastingen worden geheven:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: 225.1.a
    text: |-
      een belasting ter zake van het parkeren van een voertuig op een bij de belastingverordening dan wel krachtens de
      belastingverordening in de daarin aangewezen gevallen door het college te bepalen plaats, tijdstip en wijze;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: 225.1.b
    text: |-
      een belasting ter zake van een van gemeentewege verleende vergunning voor het parkeren van een voertuig op de in
      die vergunning aangegeven plaats en wijze.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder parkeren verstaan het gedurende een aaneengesloten periode
      doen of laten staan van een voertuig, anders dan gedurende de tijd die nodig is voor en gebruikt wordt tot het
      onmiddellijk in- en uitstappen van personen dan wel het onmiddellijk laden of lossen van zaken, op de binnen de
      gemeente gelegen voor het openbaar verkeer openstaande terreinen of weggedeelten, waarop dit doen of laten staan
      niet ingevolge een wettelijk voorschrift is verboden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.3'
    text: De belasting, bedoeld in het eerste lid, onderdeel *a*, wordt geheven van degene die het voertuig heeft geparkeerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.4'
    text: |-
      Als degene die het voertuig heeft geparkeerd wordt mede aangemerkt degene die de belasting voldoet dan wel te
      kennen geeft of heeft gegeven de belasting te willen voldoen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.5'
    text: |-
      Zolang geen voldoening van de in het eerste lid, onderdeel *a*, bedoelde belasting heeft plaatsgevonden wordt
      de houder van het voertuig aangemerkt als degene die het voertuig heeft geparkeerd. Met betrekking tot een
      motorrijtuig dat is ingeschreven in het kentekenregister, bedoeld in de [Wegenverkeerswet 1994][ref1], wordt als
      houder aangemerkt degene op wiens naam het voor het motorrijtuig opgegeven kenteken ten tijde van het parkeren in
      het register was ingeschreven. De tweede volzin vindt geen toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 225.5.a
    text: |-
      blijkt dat ten tijde van het parkeren een ander in het kentekenregister had moeten staan ingeschreven, in welk
      geval die ander wordt aangemerkt als degene die het voertuig heeft geparkeerd;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: 225.5.b
    text: |-
      een voor ten hoogste drie maanden aangegane huurovereenkomst wordt overgelegd waaruit blijkt wie ten tijde van het
      parkeren ingevolge deze overeenkomst de huurder van het voertuig was, in welk geval de huurder wordt aangemerkt als
      degene die het voertuig heeft geparkeerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.6'
    text: |-
      De belasting wordt niet geheven van degene die ingevolge het vijfde lid is aangemerkt als degene die het voertuig
      heeft geparkeerd, indien deze aannemelijk maakt dat ten tijde van het parkeren een ander tegen zijn wil van het
      voertuig gebruik heeft gemaakt en dat hij dit gebruik redelijkerwijs niet heeft kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.7'
    text: |-
      De belasting, bedoeld in het eerste lid, onderdeel *b*, wordt geheven van degene die de vergunning heeft
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '225.8'
    text: |-
      Het tarief van de in het eerste lid bedoelde belastingen kan afhankelijk worden gesteld van de parkeerduur, van de
      parkeertijd, van de ingenomen oppervlakte en van de ligging van de terreinen of weggedeelten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel225
  - number: '226.1'
    text: Ter zake van het houden van een hond kan van de houder een hondenbelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel226
  - number: '226.2'
    text: De belasting wordt geheven naar het aantal honden dat wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel226
  - number: '226.3'
    text: |-
      Voor de toepassing van het eerste lid wordt het houden van een hond door een lid van een huishouden aangemerkt
      als het houden van een hond door een door de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde
      gemeenteambtenaar aan te wijzen lid van dat huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '227'
    text: Ter zake van openbare aankondigingen zichtbaar vanaf de openbare weg kan een reclamebelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel227
  - number: '228'
    text: |-
      Ter zake van het hebben van voorwerpen onder, op of boven voor de openbare dienst bestemde gemeentegrond, kan een
      precariobelasting worden geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel228
  - number: '229.1'
    text: 'Rechten kunnen worden geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229
  - number: 229.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde gemeentebezittingen of van voor de
      openbare dienst bestemde werken of inrichtingen die bij de gemeente in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229
  - number: 229.1.b
    text: het genot van door of vanwege het gemeentebestuur verstrekte diensten;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229
  - number: 229.1.c
    text: |-
      het geven van vermakelijkheden waarbij gebruik wordt gemaakt van door of met medewerking van het gemeentebestuur
      tot stand gebrachte of in stand gehouden voorzieningen of waarbij een bijzondere voorziening in de vorm van
      toezicht of anderszins van de zijde van het gemeentebestuur getroffen wordt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229
  - number: '229.2'
    text: |-
      Voor de toepassing van deze paragraaf en de [eerste][ref1] en [vierde paragraaf van dit hoofdstuk][ref2] worden de
      in het eerste lid bedoelde rechten aangemerkt als gemeentelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '4'
  - number: 229a
    text: |-
      De rechten, bedoeld in [artikel 229, eerste lid, onder a en b][ref1], kunnen worden geheven door de gemeente die
      het gebruik van de bezittingen, werken of inrichtingen toestaat of de diensten verleent, ongeacht of het belastbare
      feit zich binnen of buiten het grondgebied van de gemeente voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229b.1
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in [artikel 229, eerste lid, onder a en b][ref1], worden
      geheven, worden de tarieven zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde
      lasten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229b.2
    text: |-
      Onder de in het eerste lid bedoelde lasten worden mede verstaan bijdragen aan bestemmingsreserves en voorzieningen
      voor noodzakelijke vervanging van de betrokken activa.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229b
  - number: 229c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in de [tweede][ref1] en
      [derde paragraaf van dit hoofdstuk][ref2], nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229d.1
    text: 'De raad kan bepalen dat voor diegenen die bij het begin van het kalenderjaar belastingplichtig zijn voor:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229d
  - number: 229d.1.a
    text: |-
      de belasting, bedoeld in [artikel 220, onderdeel a][ref1], of [artikel 221, eerste lid, onderdeel a][ref2], steeds
      voorzover het betreft zaken die geheel of gedeeltelijk tot woning dienen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel221
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '221'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229d.1.b
    text: |-
      een recht op grond van [artikel 229, eerste lid][ref1], ter zake van het gebruik van de riolering voor de afvoer
      van huishoudelijk afvalwater;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: 229d.1.c
    text: |-
      een recht op grond van [artikel 229, eerste lid][ref1], dan wel een heffing als bedoeld in
      [artikel 15.33 van de Wet milieubeheer][ref2] ter zake van het periodiek inzamelen van huishoudelijke afvalstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: 229d.2
    text: |-
      Indien het bedrag na een vermindering als bedoeld in het eerste lid negatief is, wordt een aanslag tot dit
      negatieve bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel229d
  - number: '230'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel230
  - number: 230.a
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 230.b
    text: 'heffing op andere wijze: heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel230
  - number: '231.1'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde geschieden de heffing en de invordering van
      gemeentelijke belastingen met toepassing van de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] als waren die belastingen rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '231.2'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde gelden de bevoegdheden en de verplichtingen van de hierna
      vermelde, in de Algemene wet, de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2]
      genoemde functionarissen, met betrekking tot de gemeentelijke belastingen voor de daarachter genoemde colleges
      of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
  - number: 231.2.a
    text: 'Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het college;'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
  - number: 231.2.b
    text: 'de inspecteur: de gemeenteambtenaar, belast met de heffing van gemeentelijke belastingen;'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
  - number: 231.2.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de gemeenteambtenaar belast met de invordering van
      gemeentelijke belastingen;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
  - number: 231.2.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de gemeenteambtenaren belast met de heffing of de invordering van
      gemeentelijke belastingen;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
  - number: 231.2.e
    text: 'de belastingdeurwaarder: de daartoe aangewezen gemeenteambtenaar.'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
  - number: '231.3'
    text: |-
      Onverminderd het overigens in deze paragraaf bepaalde wordt met betrekking tot gemeentelijke belastingen in
      de [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor «algemene maatregel van bestuur» en voor
      «ministeriële regeling» gelezen: besluit van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '232.1'
    text: |-
      Het college kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] voor de in [artikel 231, tweede lid, onderdeel c][ref2],
      bedoelde ambtenaar een andere gemeenteambtenaar in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.2'
    text: |-
      De colleges van twee of meer gemeenten kunnen met betrekking tot een of meer gemeentelijke belastingen bepalen dat
      ambtenaren van een van die gemeenten worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
  - number: 232.2.a
    text: |-
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.b
    text: |-
      de in [artikel 231, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.c
    text: |-
      de in [artikel 231, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van die gemeenten voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.2.d
    text: |-
      de in [artikel 231, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van die gemeenten, voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van gemeentelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het college van de gemeente waarvan de ambtenaar,
      belast met de invordering van gemeentelijke belastingen op grond van het tweede lid, onderdeel *b*, wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
  - number: '232.4'
    text: |-
      Indien voor de heffing of de invordering van gemeentelijke belastingen een gemeenschappelijke regeling is getroffen
      en bij die regeling een openbaar lichaam is ingesteld, kan bij of krachtens die regeling worden bepaald dat een
      daartoe aangewezen ambtenaar van dat openbare lichaam wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
  - number: 232.4.a
    text: |-
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.b
    text: |-
      de in [artikel 231, tweede lid, onderdeel c][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.c
    text: |-
      de in [artikel 231, tweede lid, onderdeel d][ref1], bedoelde ambtenaren van de gemeente voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 232.4.d
    text: |-
      de in [artikel 231, tweede lid, onderdeel e][ref1], bedoelde ambtenaar van de gemeente voor de uitvoering van enige
      wettelijke bepaling betreffende de invordering van gemeentelijke belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '232.5'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      waarvan een ambtenaar op grond van het vierde lid, onderdeel b, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel232
  - number: '233'
    text: |-
      Gemeentelijke belastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op
      andere wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233
  - number: 233a.1
    text: |-
      Indien de gemeentelijke belastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke
      wijze deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het college omtrent de uitvoering van een en ander nadere regels
      geeft.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233a
  - number: 233a.2
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1], de
      [Invorderingswet 1990][ref2] en [artikel 229d][ref3] aangemerkt als bij wege van aanslag geheven belastingen, met
      dien verstande dat wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229d
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 229d
        hoofdstuk: XV
        paragraaf: '3'
  - number: 233a.2.a
    text: |-
      de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233a
  - number: 233a.2.b
    text: 'het aanslagbiljet: de kennisgeving van het in onderdeel *a* bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233a
  - number: 233a.2.c
    text: |-
      de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel233a
  - number: '234.1'
    text: |-
      De belasting, bedoeld in [artikel 225, eerste lid, onder a][ref1], wordt geheven bij wege van voldoening op
      aangifte dan wel op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
  - number: '234.2'
    text: 'Als voldoening op aangifte wordt uitsluitend aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: 234.2.a
    text: |-
      het bij de aanvang van het parkeren in werking stellen van een parkeermeter of een parkeerautomaat op de daartoe
      bestemde wijze en met inachtneming van de door het college gestelde voorschriften;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: 234.2.b
    text: |-
      indien ingevolge [artikel 235, eerste lid][ref1], een wielklem is aangebracht, de voldoening op aangifte op de door
      het college bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel235
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '235'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '234.3'
    text: |-
      Ten aanzien van de in het tweede lid, onder *a*, bedoelde voldoening op aangifte is bezwaar op grond van
      [artikel 24 van de Algemene wet][ref1] niet mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '24'
  - number: '234.4'
    text: |-
      Ingeval een naheffingsaanslag wordt opgelegd, wordt deze berekend over een parkeerduur van een uur, tenzij
      aannemelijk is dat het voertuig langer dan een uur zonder betaling geparkeerd heeft gestaan.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: '234.5'
    text: |-
      De [artikelen 67b][ref1], [67c][ref2] en [67f van de Algemene wet][ref3] blijven buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '234.6'
    text: |-
      Ter zake van het opleggen van een naheffingsaanslag worden kosten in rekening gebracht. Deze kosten maken onderdeel
      uit van de naheffingsaanslag en worden afzonderlijk op het aanslagbiljet vermeld. Ten aanzien van hetzelfde
      voertuig worden per aaneengesloten periode de kosten niet vaker dan eenmaal per kalenderdag in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: '234.7'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van berekening en de maximale
      hoogte van de in het zesde lid bedoelde kosten. In de belastingverordening wordt het bedrag van de in rekening te
      brengen kosten bepaald.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: '234.8'
    text: |-
      In afwijking van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] kan, indien het niet mogelijk is
      het aanslagbiljet terstond aan de belastingschuldige uit te reiken, worden volstaan met het aanbrengen van het
      aanslagbiljet op of aan het voertuig. Alsdan vermeldt het aanslagbiljet niet de naam van de belastingschuldige maar
      het kenteken van het voertuig. Bij gebreke van een kenteken vermeldt het aanslagbiljet een of meer gegevens die
      kenmerkend zijn voor het geparkeerde voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
  - number: '234.9'
    text: De naheffingsaanslag is dadelijk en ineens invorderbaar.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel234
  - number: '235.1'
    text: |-
      Bij de belastingverordening, bedoeld in [artikel 225, eerste lid, onder a][ref1], kan worden bepaald
      dat terstond nadat het aanslagbiljet aan de belastingschuldige is uitgereikt dan wel terstond nadat het
      aanslagbiljet, overeenkomstig [artikel 234, achtste lid][ref2], aan het voertuig is aangebracht, de in
      [artikel 231, tweede lid, onderdeel b][ref3], bedoelde gemeenteambtenaar bevoegd is tot zekerheid van de betaling
      van de naheffingsaanslag, bedoeld in [artikel 234, vierde lid][ref4], aan het voertuig een mechanisch hulpmiddel,
      hierna te noemen: wielklem, te doen aanbrengen, waardoor wordt verhinderd dat het voertuig wordt weggereden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel234
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel234
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '225'
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '234'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '234'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.2'
    text: |-
      Bij de belastingverordening dan wel krachtens de belastingverordening in de daarin aangewezen gevallen door het
      college worden de terreinen of weggedeelten aangewezen waar de wielklem wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.3'
    text: Ter zake van het aanbrengen alsmede van het verwijderen van de wielklem worden kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.4'
    text: |-
      De wielklem wordt niet verwijderd dan nadat de naheffingsaanslag alsmede de kosten van het aanbrengen en van het
      verwijderen van de wielklem zijn voldaan. Na deze voldoening vindt de verwijdering van de wielklem zo spoedig
      mogelijk plaats.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.5'
    text: |-
      Na afloop van een in de belastingverordening te bepalen termijn, die ten minste 24 uren bedraagt na aanbrenging
      van de wielklem, is de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar bevoegd het
      voertuig naar een door hem aangewezen plaats te doen overbrengen en in bewaring te doen stellen. Ter zake van de
      in de eerste volzin bedoelde overbrenging en bewaring wordt procesverbaal opgemaakt en worden kosten in rekening
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.6'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar draagt er zorg voor dat in
      een daartoe aangelegd register aantekening wordt gemaakt van de gevallen waarin de in het vijfde lid bedoelde
      bevoegdheid wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.7'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar draagt zorg voor de bewaring van de
      ingevolge het vijfde lid in bewaring gestelde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.8'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar geeft het voertuig terug aan de
      rechthebbende, nadat de naheffingsaanslag, de kosten van het aanbrengen en verwijderen van de wielklem en de kosten
      van overbrenging en bewaring zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.9'
    text: |-
      Wanneer het voertuig binnen 48 uren na het in bewaring stellen niet is afgehaald, geeft de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar zo mogelijk binnen zeven dagen van de
      overbrenging en bewaring kennis:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 235.9.a
    text: |-
      indien het voertuig een motorrijtuig is, dat een kenteken voert als bedoeld in
      [artikel 36, eerste lid, van de Wegenverkeerswet 1994][ref1], aan degene aan wie dat kenteken is opgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: 235.9.b
    text: |-
      indien blijkt dat ter zake van het voertuig aangifte van vermissing is gedaan, aan degene die aangifte heeft
      gedaan;
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: 235.9.c
    text: in nader door Onze Minister te bepalen gevallen op de daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.10'
    text: |-
      De kosten van opsporing van degene aan wie de kennisgeving wordt gezonden en die van het doen van de kennisgeving
      worden voor de toepassing van dit artikel gerekend tot de kosten van overbrenging en bewaring.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.11'
    text: |-
      Wanneer het voertuig binnen drie maanden na het in bewaring stellen niet is afgehaald, is de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar bevoegd het te verkopen of, indien
      verkoop naar hun oordeel niet mogelijk is, het voertuig om niet aan een derde in eigendom over te dragen of
      te laten vernietigen. Gelijke bevoegdheid heeft de in [artikel 231, tweede lid, onderdeel b][ref2], bedoelde
      gemeenteambtenaar ook binnen die termijn, zodra het gezamenlijke bedrag van de naheffingsaanslag, de kosten van
      het aanbrengen en verwijderen van de wielklem en de kosten van overbrenging en bewaring, vermeerderd met de voor
      de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde kosten, in verhouding tot de waarde van het
      voertuig naar zijn mening onevenredig hoog zou worden. Verkoop, eigendomsoverdracht om niet of vernietiging vindt
      niet plaats binnen twee weken nadat de kennisgeving als bedoeld in het negende lid is uitgegaan. Voor de toepassing
      van de volgende leden worden de kosten van verkoop, eigendomsoverdracht om niet of vernietiging gerekend tot de
      kosten van overbrenging en bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.12'
    text: |-
      Gedurende drie jaren na het tijdstip van de verkoop heeft degene, die op dat tijdstip eigenaar was, recht op
      de opbrengst van het voertuig, met dien verstande dat eerst de kosten van het aanbrengen en verwijderen van de
      wielklem en van het overbrengen en bewaren van het voertuig en vervolgens de naheffingsaanslag met die opbrengst
      worden verrekend. Na het verstrijken van die termijn vervalt het eventueel batige saldo aan de gemeente.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.13'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze van berekening van de kosten
      van het aanbrengen en verwijderen van de wielklem en van het overbrengen en bewaren van het voertuig. In de
      belastingverordening wordt bepaald tot welke bedragen de kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.14'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar stelt het bedrag van de in rekening
      te brengen kosten vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '235.15'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de overbrenging, bewaring, verkoop,
      eigendomsoverdracht om niet en vernietiging, het inrichten en aanhouden van het in het zesde lid bedoelde register,
      alsmede omtrent hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '235.16'
    text: |-
      Indien aantoonbaar is dat door het aanbrengen of het verwijderen van de wielklem dan wel tijdens de overbrenging en
      bewaring schade aan het voertuig is toegebracht, is de gemeente gehouden deze schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel235
  - number: '236'
    text: |-
      Bij de heffing van gemeentelijke belastingen blijven de [artikelen 2, vierde lid][ref1], [3][ref2],
      [26, derde lid][ref3], [37 tot en met 39][ref4], [47a][ref5], [48][ref6], [52][ref7], [53][ref8], [54][ref9],
      [55][ref10], [62][ref11], [71][ref12], [76][ref13], [80, tweede, derde en vierde lid][ref14], [82][ref15],
      [84][ref16], [86][ref17], [87][ref18] en [90 tot en met 95 van de Algemene wet][ref19] buiten toepassing.
      Bij de heffing van gemeentelijke belastingen die op andere wijze worden geheven, blijven bovendien de
      [artikelen 5][ref20], [6 tot en met 9][ref21], [11, tweede lid][ref22], en [12 van die wet][ref23] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel55
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel62
      [ref12]: https://wetten.overheid.nl/BWBR0002320#Artikel71
      [ref13]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref14]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref15]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref16]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref17]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref18]: https://wetten.overheid.nl/BWBR0002320#Artikel87
      [ref19]: https://wetten.overheid.nl/BWBR0002320#Artikel90
      [ref20]: https://wetten.overheid.nl/BWBR0002320#Artikel5
      [ref21]: https://wetten.overheid.nl/BWBR0002320#Artikel6
      [ref22]: https://wetten.overheid.nl/BWBR0002320#Artikel11
