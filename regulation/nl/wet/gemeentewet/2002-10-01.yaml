        hoofdstuk: XV
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '12'
  - number: '237.5'
    text: Bij de belastingverordening kan van het eerste en tweede lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel237
  - number: '238.1'
    text: |-
      Met betrekking tot de bij wege van aanslag geheven gemeentelijke belastingen kan in de belastingverordening voor
      de in [artikel 9, eerste en derde lid, van de Algemene wet][ref1] genoemde termijn van ten minste een maand een
      kortere termijn in de plaats worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: '238.2'
    text: |-
      Met betrekking tot de bij wege van voldoening op aangifte geheven gemeentelijke belastingen kan in
      de belastingverordening voor de termijn van een maand, genoemd in [artikel 10, tweede lid][ref1], en
      [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref2], een kortere termijn in de plaats worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '239.1'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar is bevoegd voor eenzelfde
      belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op verschillende
      belastingen, op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '239.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel239
  - number: '241'
    text: |-
      Indien bezwaar wordt gemaakt zowel tegen een belastingaanslag in de onroerende-zaakbelastingen als tegen een op
      de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] gegeven beschikking welke ten grondslag
      heeft gelegen aan die belastingaanslag, vangt, ingeval feiten en omstandigheden in het geding zijn die van belang
      zijn zowel voor de heffing van de onroerende-zaakbelastingen als voor de vaststelling van de waarde op de voet
      van genoemd [hoofdstuk IV][ref2], de termijn waarbinnen de in [artikel 231, tweede lid, onderdeel b][ref3],
      bedoelde gemeenteambtenaar uitspraak doet op het eerstbedoelde bezwaar aan, in afwijking in zoverre van
      [artikel 25, eerste lid, van de Algemene wet][ref4], op het tijdstip waarop de op de voet van genoemd
      [hoofdstuk IV][ref5] gegeven beschikking onherroepelijk is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel231
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0005416#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005416
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref5
        bwb_id: BWBR0005416
        hoofdstuk: IV
  - number: '242.1'
    text: |-
      Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf, kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven en
      op dat tijdstip nog geen aanslagbiljet is uitgereikt of is toegezonden, binnen zes weken na de dagtekening van het
      aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen bij
      de in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '242.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel242
  - number: '242.3'
    text: |-
      De in [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar beslist op de aanvraag bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '243'
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Minister en Onze Minister van Financiën,
      het internationale gebruik daartoe noodzaakt, wordt vrijstelling van gemeentelijke belastingen verleend. Onze
      genoemde Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel243
  - number: '244'
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf kan de in
      [artikel 231, tweede lid, onderdeel b][ref1], bedoelde gemeenteambtenaar ook een in de belastingverordening
      voorziene vrijstelling ambtshalve verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: 246a.1
    text: 'Met betrekking tot gemeentelijke belastingen kunnen bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel246a
  - number: 246a.1.a
    text: |-
      regels worden gesteld waarbij de [artikelen 48][ref1], [52][ref2], [53, eerste en vierde lid][ref3],
      [54][ref4] of [55 van de Algemene wet inzake rijksbelastingen][ref5], alsmede de [artikelen 59][ref6] of
      [62 van de Invorderingswet 1990][ref7] geheel of gedeeltelijk van toepassing worden verklaard, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel62
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel246a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '54'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '62'
  - number: 246a.1.b
    text: regels worden gesteld die overeenkomen met die in de in onderdeel *a* genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel246a
  - number: 246a.2
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede van de belasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel246a
  - number: '249'
    text: |-
      Bij de invordering van gemeentelijke belastingen blijven van de [Invorderingswet 1990][ref1] buiten toepassing
      de [artikelen 5][ref2],, [20][ref3][21][ref4][59][ref5], [62][ref6] en [69][ref7]. Bij de invordering van
      gemeentelijke belastingen die op andere wijze worden geheven, blijven bovendien de [artikelen 7, derde lid][ref8],
      en [8, eerste lid, van die wet][ref9] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel69
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '20'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '62'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '69'
      - id: ref8
        bwb_id: BWBR0004770
        artikel: '7'
      - id: ref9
        bwb_id: BWBR0004770
        artikel: '8'
  - number: '250.1'
    text: |-
      De belastingverordening kan van [artikel 9 van de Invorderingswet 1990][ref1] afwijkende voorschriften inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: '250.2'
    text: |-
      De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel250
  - number: '252'
    text: |-
      De verrekening van aan de belastingschuldige uit te betalen en van hem te innen bedragen ter zake van
      gemeentelijke belastingen op de voet van [artikel 24 van de Invorderingswet 1990][ref1] is ook mogelijk
      ingeval de in [artikel 9 van de Invorderingswet 1990][ref2] gestelde termijn, dan wel de krachtens
      [artikel 250, eerste lid][ref3], gestelde termijn nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel250
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '250'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '253.1'
    text: |-
      Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel253
  - number: '253.2'
    text: |-
      Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de met
      de invordering van gemeentelijke belastingen belaste gemeenteambtenaar de belastingaanslag op de gehele onroerende
      zaak verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de rechten van
      de overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel253
  - number: '253.3'
    text: |-
      De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt met
      zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel253
  - number: '253.4'
    text: |-
      Een bezwaarschrift als bedoeld in [artikel 23, eerste lid, van de Algemene wet ][ref1]kan mede worden ingediend
      door een belastingplichtige als bedoeld in het eerste lid wiens naam niet op het aanslagbiljet staat vermeld.
      [Artikel 23, tweede lid, van de Algemene wet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel23
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '23'
  - number: '253.5'
    text: Van het derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel253
  - number: '254'
    text: |-
      Voor de toepassing van [artikel 66 van de Invorderingswet 1990][ref1] met betrekking tot gemeentelijke belastingen
      blijven de [artikelen 76][ref2], [80, tweede, derde en vierde lid][ref3], [82][ref4], [84][ref5], [86][ref6] en
      [87 van de Algemene wet][ref7] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '87'
  - number: '255.1'
    text: |-
      De in [artikel 26 van de Invorderingswet 1990][ref1] bedoelde kwijtschelding wordt met betrekking tot gemeentelijke
      belastingen verleend door de in [artikel 231, tweede lid, onderdeel c][ref2], bedoelde gemeenteambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '231'
        hoofdstuk: XV
        paragraaf: '4'
  - number: '255.2'
    text: |-
      Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens
      [artikel 26 van de Invorderingswet 1990][ref1] door Onze Minister van Financiën bij ministeriële regeling gestelde
      regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: '255.3'
    text: |-
      De raad kan bepalen dat, in afwijking van de in het tweede lid bedoelde regels, in het geheel geen dan wel
      gedeeltelijk kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255
  - number: '255.4'
    text: |-
      Met inachtneming van door Onze Minister, in overeenstemming met Onze Minister van Financiën, te stellen regels kan
      de raad met betrekking tot de wijze waarop de kosten van bestaan in aanmerking worden genomen afwijkende regels
      stellen die er toe leiden dat in ruimere mate kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255
  - number: '255.5'
    text: |-
      Het college kan de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit ontheft de
      gemeenteambtenaar belast met de invordering van gemeentelijke belastingen van de verplichting verdere pogingen tot
      invordering te doen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255
  - number: 255a.1
    text: |-
      De raad kan bepalen dat indien ter zake van de in [artikel 229d, eerste lid][ref1], bedoelde belastingen, het op de
      voet van [artikel 255][ref2] kwijt te schelden bedrag lager is dan het bedrag dat zou zijn kwijtgescholden indien
      de vermindering, bedoeld in [artikel 229d, eerste lid][ref3], niet was toegepast, het verschil tussen die bedragen
      door de gemeenteambtenaar belast met de invordering van gemeentelijke belastingen bij een voor administratief
      beroep bij het college vatbare beschikking wordt vastgesteld en aan degene die om kwijtschelding verzoekt wordt
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229d
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel255
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel229d
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 229d
        hoofdstuk: XV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '255'
        hoofdstuk: XV
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: 229d
        hoofdstuk: XV
        paragraaf: '3'
  - number: 255a.2
    text: |-
      De raad kan het eerste lid ook van toepassing verklaren als het bedrag van de vermindering, bedoeld in
      [artikel 229d, eerste lid][ref1], is verdisconteerd in de tarieven van de in dat artikellid, onderdelen b en c,
      bedoelde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229d
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel255a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 229d
        hoofdstuk: XV
        paragraaf: '3'
  - number: '256'
    text: |-
      Indien ter zake van een gemeentelijke belasting exploot moet worden gedaan, een akte van vervolging betekend of
      een dwangbevel ten uitvoer gelegd in een andere gemeente dan die aan welke de belasting is verschuldigd, is daartoe
      naast de belastingdeurwaarder van laatstbedoelde gemeente mede de belastingdeurwaarder van eerstbedoelde gemeente
      bevoegd en desgevraagd verplicht.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel256
  - number: '257'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen inzake de belastingen, bedoeld in [artikel 220][ref1],
      nadere, zo nodig afwijkende, regels worden gegeven inzake de heffing en de invordering, alsmede inzake alle
      gemeentelijke belastingen andere in het kader van deze paragraaf passende nadere regels ter aanvulling van de in
      deze paragraaf geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: '259.1'
    text: |-
      Beslissingen van gemeentebesturen kunnen slechts aan goedkeuring worden onderworpen in bij de wet of krachtens de
      wet bij provinciale verordening bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel259
  - number: '259.2'
    text: |-
      Ten aanzien van de goedkeuring van andere beslissingen dan besluiten is
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.1
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.1
  - number: '266.1'
    text: |-
      Een beslissing die aan goedkeuring bij koninklijk besluit is onderworpen, wordt toegezonden aan Onze Minister wie
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel266
  - number: '266.2'
    text: Een voordracht tot onthouding van goedkeuring wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel266
  - number: '266.3'
    text: |-
      Onthouding van goedkeuring geschiedt niet, dan nadat de Raad van State is gehoord. De toepassing van
      [artikel 10:30, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt in dat geval plaats voordat het ontwerp-
      besluit bij de Raad van State ter overweging wordt gebracht. [Artikel 18][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '268.1'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het gemeentebestuur kan bij
      koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel268
  - number: '268.2'
    text: |-
      Ten aanzien van de vernietiging van een niet-schriftelijke beslissing zijn de [afdelingen 10.2.2][ref1] en
      [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '273.1'
    text: |-
      Indien een besluit naar het oordeel van de burgemeester voor vernietiging in aanmerking komt, doet hij daarvan
      binnen twee dagen nadat het te zijner kennis is gekomen, door tussenkomst van gedeputeerde staten, mededeling aan
      Onze Minister wie het aangaat. Hij geeft hiervan tegelijkertijd kennis aan het orgaan dat het besluit nam, en zo
      nodig aan het orgaan dat met de uitvoering van het besluit is belast.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel273
  - number: '273.2'
    text: |-
      Gedeputeerde staten zenden de stukken, vergezeld van hun advies, binnen een week na de dagtekening van de
      mededeling van de burgemeester toe aan Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel273
  - number: '273.3'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van Onze Minister wie het aangaat de mededeling is ontvangen, dat voor schorsing of vernietiging geen
      redenen bestaan. Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de burgemeester
      is geschorst of vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel273
  - number: '274.1'
    text: Een voordracht tot schorsing wordt gedaan door Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel274
  - number: '274.2'
    text: |-
      Over de voordracht pleegt Onze Minister wie het aangaat overleg met Onze Minister, tenzij schorsing onverwijld
      plaats dient te vinden. In de voordracht wordt het achterwege blijven van overleg gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel274
  - number: '277'
    text: |-
      Indien een bekend gemaakt besluit niet is vernietigd binnen de tijd waarvoor het is geschorst, wordt hiervan door
      het gemeentebestuur openbaar kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel277
  - number: '278.1'
    text: De voordracht tot vernietiging wordt gedaan door of mede door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel278
  - number: '278.2'
    text: |-
      [Artikel 15, derde lid, van de Wet op de Raad van State][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '15'
  - number: '279'
    text: |-
      Het koninklijk besluit tot schorsing, opheffing of verlenging van de schorsing of tot vernietiging wordt in het
      *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel279
  - number: '281'
    text: |-
      Het gemeentebestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het
      koninklijk besluit wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel281
  - number: 281a.1
    text: |-
      In afwijking van [artikel 8:4, onderdeel ][ref1] kan een belanghebbende tegen een koninklijk besluit
      als bedoeld in [artikel 268, eerste lid][ref2], dan wel tegen een vernietigingsbesluit als bedoeld in de
      [artikelen 83, tweede lid][ref3], en [84, tweede lid][ref4], beroep instellen bij de Afdeling bestuursrechtspraak
      van de Raad van State;[artikel 7:1 van de Algemene wet bestuursrecht][ref5] is niet van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel84
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel281a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '268'
        hoofdstuk: XVII
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '83'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '84'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 281a.2
    text: |-
      In afwijking van [artikel 6:2 van de Algemene wet bestuursrecht][ref1] kan geen beroep worden ingesteld tegen de
      weigering om de vernietiging te bevorderen en tegen het niet tijdig nemen van een besluit tot vernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel281a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '289'
    text: De gemeentewet (*Stb.* 1931, 89) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel289
  - number: '290.1'
    text: |-
      De intrekking van de gemeentewet heeft geen gevolgen voor de geldigheid van de op de dag voor de inwerkingtreding
      van deze wet geldende besluiten.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel290
  - number: '290.2'
    text: |-
      Besluiten als bedoeld in het eerste lid die algemeen verbindende voorschriften bevatten waarvan de inhoud in strijd
      is met deze wet, worden binnen twee jaar na de datum van inwerkingtreding van deze wet daarmee in overeenstemming
      gebracht of ingetrokken. De besluiten, of onderdelen daarvan, die bij het verstrijken van de in de vorige volzin
      genoemde termijn niet met deze wet in overeenstemming zijn gebracht of zijn ingetrokken, zijn van rechtswege
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel290
  - number: '290.3'
    text: |-
      Besluiten van gedeputeerde staten, bedoeld in [artikel 100, eerste lid van de gemeentewet][ref1] vervallen van
      rechtswege op de dag waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
  - number: '290.4'
    text: |-
      Niettemin blijven gedeputeerde staten na de inwerkingtreding van deze wet bevoegd de jaarwedde van
      wethouders over de periode voorafgaand aan de inwerkingtreding van deze wet vast te stellen overeenkomstig
      [artikel 100, eerste lid, van de gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
        hoofdstuk: VII
  - number: '290.5'
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing op jaarwedden van gemeentesecretarissen, bedoeld in
      [artikel 111, eerste lid, van de gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel111
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '111'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '291'
    text: |-
      Ten aanzien van de bij de inwerkingtreding van deze wet zitting hebbende leden van de raad en wethouders zijn tot
      hun aftreden de [artikelen, 15, eerste lid][ref1], en [45][ref2] slechts van toepassing voor zover de gemeentewet
      ter zake eveneens een verbod inhield.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel45
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '15'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '45'
        hoofdstuk: III
  - number: '292'
    text: |-
      In afwijking van [artikel 89, tweede lid][ref1], is [artikel 13, eerste lid, onderdeel h][ref2], met betrekking
      tot bij de inwerkingtreding van deze wet bestaande commissies eerst van overeenkomstige toepassing ten aanzien van
      leden die zijn benoemd verklaard na de tweede verkiezing van de commissie die na de inwerkingtreding van deze wet
      wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel13
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel292
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '13'
        hoofdstuk: II
  - number: '293'
    text: |-
      In gemeenten die afdelingen of dorpen met een afzonderlijk vermogen en afzonderlijke inkomsten en lasten hebben,
      gaan dit vermogen en deze inkomsten en lasten op in de algemene huishouding van de gemeente, indien niet door het
      gemeentebestuur binnen drie jaar na de dag van inwerkingtreding van deze wet een andere voorziening is getroffen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel293
  - number: '294'
    text: |-
      Ten aanzien van het aantal wethouders blijft tot het eerste periodieke aftreden van de wethouders na de
      inwerkingtreding van deze wet artikel 86 van de gemeentewet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel294
  - number: '295'
    text: |-
      Aanwijzingen als bedoeld in artikel 2, tweede lid, van de gemeentewet, blijven van kracht totdat zij bij koninklijk
      besluit worden ingetrokken. Tot dat tijdstip blijft artikel 2, derde lid, van de gemeentewet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel295
  - number: '296'
    text: |-
      De [artikelen 44, vierde lid][ref1], en [66, vierde lid][ref2], treden in werking op de dag van het eerste
      periodieke aftreden van de wethouders na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel66
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '44'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '66'
        hoofdstuk: IV
  - number: '297'
    text: |-
      Verzoeken tot ontheffing en om toestemming als bedoeld in de artikelen 81 en 82 van de gemeentewet die bij de
      Kroon onderscheidenlijk Onze Minister zijn ingediend voor de inwerkingtreding van deze wet en waarop door de Kroon
      onderscheidenlijk Onze Minister voor de dag van de inwerkingtreding nog niet is beschikt, worden overgedragen aan
      de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel297
  - number: '298'
    text: |-
      Ten aanzien van degenen die op de dag van inwerkingtreding van deze wet het ambt van burgemeester vervullen is tot
      het eerste periodieke aftreden van de wethouders na de inwerkingtreding van deze wet [artikel 68][ref1] slechts van
      toepassing voor zover de gemeentewet ter zake een verbod inhield.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel68
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '68'
        hoofdstuk: IV
  - number: '299.1'
    text: |-
      Ten aanzien van verplichtingen als bedoeld in [artikel 110, tweede lid][ref1], die gelden op de dag voor die van
      de inwerkingtreding van deze wet, vangt de termijn, bedoeld in [artikel 110, derde lid][ref2], aan op de dag na die
      van de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '299.2'
    text: |-
      [Artikel 110, derde en vijfde lid][ref1], is niet van toepassing op verplichtingen als bedoeld in
      [artikel 110, tweede lid][ref2], die zijn genoemd in de bijlage, behorende bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '299.3'
    text: |-
      Ten aanzien van voorschriften als bedoeld in [artikel 110, vierde lid][ref1], die gelden op de dag voor die van de
      inwerkingtreding van deze wet, vangt de termijn genoemd in dat lid, aan op de dag na die van de inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel110
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '110'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '300'
    text: |-
      [Artikel 153][ref1] is niet van toepassing op beroepschriften die zijn ingediend voor de inwerkingtreding van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel153
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '153'
        hoofdstuk: IX
  - number: '301'
    text: |-
      De in [artikel 150][ref1] bedoelde verordening wordt vastgesteld binnen een jaar na de dag van inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
        hoofdstuk: IX
  - number: '302'
    text: |-
      Artikel 151 van de gemeentewet blijft van kracht ten aanzien van wetten die tot stand zijn gekomen voor de dag van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel302
  - number: '303'
    text: |-
      Voor bij koninklijk besluit aan te wijzen begrotingsjaren blijven de artikelen 242 tot en met 244, 245a, 245aa,
      247, 249 en 250 van de gemeentewet van toepassing. In het koninklijk besluit kunnen regels worden gesteld omtrent
      de toepassing van de in de eerste volzin genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel303
  - number: '304.1'
    text: |-
      Onverminderd het bepaalde in [artikel 290, tweede lid][ref1], blijven besluiten inzake gemeentelijke
      belastingverordeningen als bedoeld in [artikel 216 van deze wet][ref2], van toepassing met betrekking tot de
      heffing over voordien aangevangen belastingjaren of zich voordien voorgedaan hebbende belastbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel216
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '216'
        hoofdstuk: XV
        paragraaf: '1'
  - number: '304.2'
    text: |-
      In afwijking van het bepaalde in [290, tweede lid][ref1], vervallen de besluiten inzake gemeentelijke
      belastingverordeningen, bedoeld in de artikelen 273a en 274 van de gemeentewet, bij het verstrijken van de termijn
      die daarvoor in de desbetreffende belastingverordening is gesteld. Het eerste lid is hierbij van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel290
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '290'
  - number: '304.3'
    text: |-
      In afwijking van het bepaalde in [290, tweede lid][ref1], vervallen besluiten inzake gemeentelijke
      belastingverordeningen als bedoeld in artikel 280 van de gemeentewet, zoals deze luidde voor de inwerkingtreding
      van de Wet van 24 december 1970 tot wijziging van de bepalingen inzake gemeentelijke en provinciale belastingen
      (Stb. 608), waarvan de heffing tot een bepaalde termijn is beperkt en waarvoor de mogelijkheid tot afkoop is
      gegeven, bij het verstrijken van de termijn die daarvoor in de desbetreffende belastingverordening is gesteld. Het
      eerste lid is hierbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel290
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '290'
  - number: '304.4'
    text: |-
      Gemeentelijke verordeningen betreffende onroerende-zaakbelastingen, bedoeld in artikel 273, eerste lid,
      onder a en b, van de gemeentewet, moeten uiterlijk met ingang van 1 januari 1994 zijn aangepast aan
      [artikel 220, achtste lid, van deze wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
        hoofdstuk: XV
        paragraaf: '2'
  - number: '304.5'
    text: |-
      Gemeentelijke verordeningen betreffende leges of rechten, bedoeld in artikel 277, eerste lid, onder a, b
      1e, b 2e of b 4e, van de gemeentewet, moeten uiterlijk met ingang van 1 januari 1994 zijn aangepast aan
      [artikel 229 van deze wet][ref1]. Voor zover de in de vorige volzin bedoelde verordeningen voor 1 januari 1994 nog
      niet zijn aangepast aan deze wet, blijft tot dat tijdstip artikel 279 van de gemeentewet van toepassing, zoals dit
      luidde voor de wijziging van de gemeentewet bij de Wet van 3 juli 1989 (*Stb.* 302).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
        hoofdstuk: XV
        paragraaf: '3'
  - number: '305.1'
    text: |-
      Met betrekking tot besluiten als bedoeld in [artikel 290, tweede lid][ref1], en [artikel 304][ref2], blijven titel
      VI van de tweede afdeling, eerste en tweede hoofdstuk van de gemeentewet, alsmede de op die hoofdstukken berustende
      uitvoeringsvoorschriften van kracht gedurende de in die artikelen bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel304
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '304'
  - number: '305.2'
    text: |-
      Met betrekking tot besluiten als bedoeld in [artikel 304, derde lid][ref1], blijven de bepalingen uit de
      gemeentewet zoals deze luidde voor de inwerkingtreding van de Wet van 24 december 1970 (*Stb.* 608) van kracht
      gedurende de in dat artikel bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel304
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '304'
  - number: '306'
    text: |-
      De [artikelen 262 tot en met 266][ref1] zijn niet van toepassing op aan voorafgaand toezicht onderworpen besluiten
      die zijn genomen voor de inwerkingtreding van deze wet. Ten aanzien van die besluiten blijven de op de dag voor de
      inwerkingtreding van deze wet geldende wettelijke bepalingen van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel262
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel306
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '262'
        hoofdstuk: XVI
  - number: '307.1'
    text: |-
      Indien het bij koninklijke boodschap van 12 oktober 1990 ingediende voorstel van wet houdende herziening van
      [titel 4 van Boek 1 van het Burgerlijk Wetboek][ref1] en wijziging van enige andere bepalingen van dat wetboek,
      het [Wetboek van Burgerlijke Rechtsvordering][ref2] en het [Wetboek van Strafvordering][ref3] (kamerstukken 21 847)
      niet in werking is getreden op het moment dat deze wet in werking treedt, blijft artikel 183 van de gemeentewet van
      kracht totdat dat voorstel van wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel307
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0001827
      - id: ref3
        bwb_id: BWBR0001903
  - number: '307.2'
    text: |-
      Indien het in het eerste lid bedoelde voorstel van wet op een eerder tijdstip in werking treedt dan deze wet,
      vervalt artikel 183 van de gemeentewet op dat eerdere tijdstip.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel307
  - number: '308'
    text: |-
      Indien het bij koninklijke boodschap van 10 maart 1990 ingediende voorstel van wet tot wijziging van de
      binnentredingsbepalingen (kamerstukken 22 539) niet in werking is getreden op het moment dat deze wet in werking
      treedt, blijven de artikelen 153 en 154 van de gemeentewet van kracht totdat dat voorstel in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel308
  - number: '309.1'
    text: Deze wet treedt in werking op een bij of krachtens de wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel309
  - number: '309.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister de nummering van de artikelen, paragrafen, hoofdstukken en
      titels van deze wet opnieuw vast, en brengt de in deze wet voorkomende aanhalingen van de artikelen, paragrafen,
      hoofdstukken en titels met de nieuwe nummering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel309
  - number: '310'
    text: 'Deze wet kan worden aangehaald als: Gemeentewet.'
    url: https://wetten.overheid.nl/BWBR0005416/2002-10-01#Artikel310
