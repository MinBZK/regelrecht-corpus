preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen tot toekenning van een vergoeding
    aan die gepensioneerden krachtens de Wet buitengewoon pensioen 1940-1945 (Stb: 1947, H 313), die terzake van het
    genot van dat pensioen premie verschuldigd zijn ingevolge de Algemene Ouderdomswet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002255/1957-12-09#ArtikelAanhef
articles:
  - number: Enig
    text: |-
      Voorzover van een gepensioneerde krachtens de [Wet buitengewoon pensioen 1940-1945][ref1] (*Stb.* 1947,
      H 313) terzake van het genot van dat pensioen premie ingevolge de [Algemene Ouderdomswet][ref2] wordt
      geheven, wordt hem, ten laste van het Rijk, overeenkomstig de verhouding, waarin de premie, bedoeld in
      [artikel 23 van de Algemene Ouderdomswet][ref3], voor ambtenaren, in dienst van het Rijk, door weddeverhoging wordt
      gecompenseerd, een vergoeding daarvoor verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel23
