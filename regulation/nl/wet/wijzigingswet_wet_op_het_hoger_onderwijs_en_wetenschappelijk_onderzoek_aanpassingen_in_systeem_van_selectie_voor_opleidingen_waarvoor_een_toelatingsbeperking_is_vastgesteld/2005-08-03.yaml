preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de selectie voor opleidingen waarvoor
    toelatingsbeperkingen van kracht zijn, zodanig te wijzigen dat gegadigden voor deze opleidingen meer dan voorheen
    in staat zullen zijn zelf hun kans op toelating te vergroten, en dat het wenselijk is het aantal malen dat
    gegadigden aan de selectieprocedure kunnen deelnemen, te beperken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010384/2005-08-03#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, met uitzondering van [artikel II][ref1], dat in werking treedt met ingang van 1 januari 2000, met dien
      verstande dat de bepalingen van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] zoals die door
      dat artikel worden gewijzigd voor de eerste maal worden toegepast met betrekking tot het studiejaar 2000–2001.


