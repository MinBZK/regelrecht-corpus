        hoofdstuk: '1'
  - number: 3.5.3.b
    text: |-
      behoeven, voor zover het pedaalkrachtmeters betreft in gebruik genomen vóór 1 januari 1995, niet te voldoen aan
      [artikel 3.5.1, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.3
    references:
