  - number: 3.5.1.1
    text: |-
      Onder pedaalkrachtmeter wordt verstaan: meetmiddel voor het bepalen van de kracht waarmee het rempedaal van een
      voertuig wordt bediend.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.1
  - number: 3.5.1.2
    text: De pedaalkrachtmeter moet zijn voorzien van een Nederlandstalige handleiding.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.1
  - number: 3.5.2
    text: 'De pedaalkrachtmeter moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.a
    text: de aanwijzing van de pedaalkracht dient te geschieden in Newton (N);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.b
    text: de meter moet een bereik hebben van 0 N tot ten minste 700 N (70 kgf);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.c
    text: |-
      de eisen, gesteld onder d en e, hebben betrekking op het meetgebied van 100 N tot ten hoogste 800 N (10 kgf tot ten
      hoogste 80 kgf);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.d
    text: 'de maximale fout, in plus en in min, van de aangegeven pedaalkracht moet:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.d.1
    text: 'bij een centrisch uitgeoefende pedaalkracht die niet groter is dan 500 N: 50 N,'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.d.2
    text: 'bij een centrisch uitgeoefende pedaalkracht die groter is dan 500 N: 10% van de uitgeoefende pedaalkracht, en'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.d.3
    text: 'bij een excentrisch uitgeoefende pedaalkracht van 200 N: 80 N bedragen;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.2.e
    text: |-
      het verschil tussen de resultaten van verscheidene metingen van dezelfde pedaalkracht, verricht onder dezelfde
      omstandigheden en met dezelfde meter, mag niet groter zijn dan 30 N.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.2
  - number: 3.5.3
    text: 'Pedaalkrachtmeters in gebruik genomen vóór 1 juli 1998:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.3
  - number: 3.5.3.a
    text: |-
      behoeven niet te voldoen aan het bepaalde in [paragraaf 2.3][ref1] en [3][ref2] van [hoofdstuk 1][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
