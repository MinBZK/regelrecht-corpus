  - number: 3.5.3.d
    text: |-
      behoeven, voor zover het pedaalkrachtmeters betreft in gebruik genomen vóór 1 januari 1982, niet te voldoen aan het
      bepaalde in [artikel 1.2, eerste lid][ref1] en [artikel 3.5.2, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.3
