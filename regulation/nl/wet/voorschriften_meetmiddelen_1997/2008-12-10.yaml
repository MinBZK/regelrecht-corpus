        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '1'
  - number: 3.4.4.b
    text: |-
      behoeven, voor zover het manometers betreft in gebruik genomen vóór 1 januari 1984, niet te voldoen aan
      [artikel 1.2, eerste lid][ref1] en [artikel 3.4.3, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.4
