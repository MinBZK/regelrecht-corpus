  - number: 3.6.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.a
    text: |-
      gemiddelde waarde: het rekenkundig gemiddelde van, op vaste tijdsafstanden, bepaalde momentele waarden, in aantal
      voldoende voor de bepaling van het werkelijke gemiddelde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.b
    text: |-
      resulterende meetwaarde: de gemiddelde waarde van de remvertraging resulterend uit een remtest, berekend uit het
      verloop van de remvertraging als functie van de tijd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.c
    text: 'standaanwijsinrichting: aanwijzing of signalering voor de juiste stand van de remvertragingsmeter;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.d
    text: |-
      grenswaarde van de standaanwijsinrichting: de door een standaanwijsinrichting aangegeven grenswaarde voor een
      correcte stand van de remvertragingsmeter. Indien de standaanwijsinrichting bestaat uit een waterpas, is de
      grenswaarde van de scheefstelling gelijk aan 2 mm verplaatsing van de dampbel uit de middenpositie;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.e
    text: 'justeerinrichting: inrichting voor het instellen van de juiste gevoeligheid van de remvertragingsmeter;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.1.f
    text: |-
      standcorrectie-inrichting: inrichting waarmee de verkregen meetwaarden worden gecorrigeerd voor de stand waarin de
      remvertragingsmeter in het voertuig wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.1
  - number: 3.6.2
    text: |-
      In de handleiding behorende bij de remvertragingsmeter moet naast de informatie genoemd in [artikel 1.15][ref1] de
      wijze van opstelling van de remvertragingsmeter worden opgenomen waarbij het volgende nader moet worden belicht:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.6.2.a
    text: de plaatsing in het voertuig;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.2
  - number: 3.6.2.b
    text: de werkwijze voor het horizontaal plaatsen van de remvertragingsmeter;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.2
  - number: 3.6.2.c
    text: de betekenis en beperkingen in het gebruik van de resulterende meetwaarde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.2
  - number: 3.6.2.d
    text: de juiste werkwijze bij het gebruik van een justeerinrichting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.2
  - number: 3.6.3.1
    text: |-
      De remvertragingsmeter moet zodanig zijn ingericht dat een controle van de juiste aanwijzing bij het nulpunt en bij
      de lokale waarde van de zwaartekrachtversnelling op een eenvoudige wijze mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.3
  - number: 3.6.3.2
    text: |-
      De remvertragingsmeter moet zijn voorzien van een standaanwijsinrichting tenzij een automatische inrichting een
      juiste meting zonder een dergelijke inrichting mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.3
  - number: 3.6.4
    text: 'De remvertragingsmeter mag zijn voorzien van een justeerinrichting indien voldaan wordt aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.4
  - number: 3.6.4.a
    text: |-
      de remvertragingsmeter moet zijn voorzien van een standaanwijsinrichting voor elke stand waarin de
      remvertragingsmeter bij de justering moet worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.4
  - number: 3.6.4.b
    text: |-
      de remvertragingsmeter moet zijn voorzien van een automatische beveiliging tegen onjuiste justeringen. Aan deze
      eis wordt voldaan indien gebruik van de remvertragingsmeter alleen mogelijk is indien binnen een vastgelegd
      tijdsinterval voorafgaand aan het gebruik ten minste twee overeenkomstige justeringen achtereenvolgend zijn
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.4
  - number: 3.6.5
    text: |-
      De remvertragingsmeter mag zijn voorzien van een standcorrectie-inrichting indien voldaan wordt aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.5
  - number: 3.6.5.a
    text: de standcorrectie-inrichting moet handmatig in werking worden gesteld;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.5
  - number: 3.6.5.b
    text: een remvertragingsmeter met een standcorrectie-inrichting mag niet zijn voorzien van een justeerinrichting;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.5
  - number: 3.6.5.c
    text: |-
      een remvertragingsmeter mag alleen dan van een standcorrectie-inrichting zijn voorzien, indien een automatische
      inrichting verhindert dat een meting wordt verricht indien geen standcorrectie heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.5
  - number: 3.6.5.d
    text: |-
      een standcorrectie mag alleen kunnen plaatsvinden indien de remvertragingsmeter een stabiele meetwaarde vaststelt,
      die niet meer bedraagt dan plus of minus 2 m/s⁲.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.5
  - number: 3.6.6.1
    text: 'De maximale fout zowel voor toenemende als voor afnemende remvertraging bedraagt: 0,1 m/s⁲.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
  - number: 3.6.6.2
    text: De maximale fout in de registratie van de meettijd bedraagt 2% van de werkelijke meettijd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
  - number: 3.6.6.3
    text: |-
      De maximale fout in de meettijd voor de aanwijzing van een verandering van de remvertraging ter grootte van het
      gehele aanwijsbereik bedraagt 0,1 seconde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
  - number: 3.6.6.4
    text: |-
      De maximale fout veroorzaakt door de standcorrectie-inrichting of door instelling op de grenswaarde van de
      standaanwijzing bij gebruik of justering bedraagt 0,02 m/s2.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
  - number: 3.6.6.5
    text: De maximale fout in de berekening van de resulterende meetwaarde bedraagt 0,02 m/s2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
  - number: 3.6.6.6
    text: |-
      De maximale fout veroorzaakt door een beperkte afleesnauwkeurigheid van de analoge registratie zoals bedoeld in
      [artikel 3.6.11, derde lid][ref1], bedraagt 0,02 m/s2.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.6
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.6.7
    text: De remvertragingsmeter mag zijn voorzien van een geïntegreerde pedaalkrachtmeter of manometer.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.7
  - number: 3.6.8
    text: |-
      De remvertragingsmeter mag zijn voorzien van meerdere aanwijsbereiken. Zij moeten in elk geval één aanwijsbereik
      hebben dat tenminste het gebied van 0 tot 9,81 m/s2 omvat.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.8
  - number: 3.6.9
    text: De remvertragingsmeter moet een ononderbroken meetduur hebben van ten minste 5 seconden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.9
  - number: 3.6.10
    text: |-
      De remvertragingsmeter moet zijn voorzien van een registratie-inrichting, waarmee het verloop van de remvertraging
      als functie van de tijd wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.10
  - number: 3.6.11.1
    text: |-
      De remvertragingsmeter moet zijn voorzien van een analoge registratie waarmee het verloop van de remvertraging over
      tenminste 5 seconden zichtbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.11
  - number: 3.6.11.2
    text: |-
      Een analoge registratie moet plaatsvinden op voor het doel geschikt materiaal met voldoende bestendigheid tegen
      vocht, vuil en temperatuurinvloeden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.11
  - number: 3.6.11.3
    text: |-
      Indien de analoge registratie van de remvertraging de aanwijzing van de remvertragingsmeter vormt, dan wel bedoeld
      is om gebruikt te worden voor de vaststelling van de gemeten waarde, moet zowel een verandering van 1 m/s⁲ als een
      tijdsverloop van 1 seconde overeenkomen met een verandering in registratiepositie van ten minste 5 mm.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.11
  - number: 3.6.11.4
    text: |-
      Voor remvertragingsmeters waarbij de analoge registratie slechts bedoeld is om te worden benut voor een globale
      informatie over het verloop van de remvertraging moet de verandering in de registratiepositie zoals bedoeld in het
      derde lid, ten minste 2,5 mm zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.11
  - number: 3.6.12.1
    text: |-
      Indien de analoge presentatie niet voldoet aan de eis genoemd in [artikel 3.6.11, derde lid][ref1], of de eis
      genoemd in [artikel 3.6.6, zesde lid][ref2], moet de remvertragingsmeter na elke meting een meetwaardetabel leveren
      waarin het verloop van de remvertraging als functie van de tijd en waar mogelijk de resulterende meetwaarde wordt
      weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.6.12.2
    text: |-
      De registratie van de remvertraging moet plaatsvinden met een interval tussen de verschillende meetwaarden van ten
      hoogste 0,1 seconde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.12
  - number: 3.6.13
    text: 'Een resulterende meetwaarde is representatief voor de gemeten remvertraging, indien:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.a
    text: in de meetperiode zich uitsluitend meetwaarden bevinden die verkregen zijn terwijl het voertuig in beweging is;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.b
    text: |-
      de maximale waarde van de remvertraging van een bewegend voertuig binnen de meetperiode valt; onder deze maximale
      waarde wordt niet verstaan een piekwaarde die aan het begin of aan het einde van de remproef zou kunnen optreden,
      en,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c
    text: 'de resulterende meetwaarde wordt berekend door middeling van zes achtereen verkregen meetwaarden:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.A
    text: bepaal de maximale meetwaarde van de remvertraging gedurende de meetperiode (te noemen a);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.B
    text: |-
      bepaal met een interval van 0,1 seconde de 5 gemeten waarden direct vóór de maximale meetwaarde (te noemen a, a, a,
      a en a) en de 5 gemeten waarden direct na de maximale meetwaarde (te noemen a, a, a, a en a);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C
    text: 'voer de volgende 6 berekeningen uit:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.i
    text: (a+a+a+a+a+am)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.ii
    text: (a+a+a+a+am+a)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.iii
    text: (a+a+a+a+a+a)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.iv
    text: (a+a+a+a+a+a)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.v
    text: (a+a+a+a+a+a)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.C.vi
    text: (a+a+a+a+a+a)/6;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.c.D
    text: |-
      de hoogste van de onder C berekende waarden geldt als de resulterende meetwaarde waarbij uitsluitend de berekende
      waarden in beschouwing worden genomen die opgebouwd zijn uit meetwaarden die tenminste gelijk zijn aan 75% van de
      maximale meetwaarde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.13.d
    text: |-
      het grootste verschil tussen de meetwaarden verkregen vanaf 0,5 seconde voor de meetperiode tot 0,5 seconde na de
      meetperiode bedraagt 1 m/s2.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.13
  - number: 3.6.14.1
    text: |-
      Het bepaalde in [artikel 1.2, eerste lid][ref1], geldt niet voor remvertragingsmeters, die in gebruik zijn genomen
      vóór 1 januari 1982.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.6.14.2
    text: 'Remvertragingsmeters die in gebruik genomen zijn voor de datum van inwerkingtreding van deze regeling:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
  - number: 3.6.14.2.a
    text: |-
      hoeven niet te voldoen aan het bepaalde in de [artikelen 1.19, onderdelen c en e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.6.14.2.b
    text: |-
      geldt in afwijking van hetgeen bepaald is in [artikel 1.13, vierde lid][ref1], de eis dat de maximale
      fout geldt voor een temperatuurgebied van -10 °C tot 40 °C. Een temperatuurgebied van 0 °C tot 40 °C is
      voor deze remvertragingsmeters toegestaan indien dit door middel van een beperkend opschrift bedoeld in
      [artikel 1.14, eerste lid, onder h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.6.14.3
    text: |-
      Voor mechanische remvertragingsmeters waarvoor een typekeurings-certificaat is afgegeven en die in gebruik zijn
      genomen voor de datum van inwerkingtreding van deze regeling geldt dat de maximale fouten de vijfvoudige waarde
      van de maximale fouten genoemd in [artikel 3.6.6][ref1] bedragen. Deze remvertragingsmeters mogen slechts tot 31
      december 1999 worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.6.14.4
    text: |-
      Hulpinrichtingen die in gebruik zijn genomen vóór de datum van inwerkingtreding van deze regeling hoeven niet te
      voldoen aan het bepaalde in [artikel 1.20][ref1] met uitzondering van de eis dat deze hulpinrichtingen de goede
      werking van het meetmiddel niet mogen verstoren en voorts geen aanleiding tot misleiding of misvatting mogen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.6.15
    text: |-
      Remvertragingsmeters waarvoor in het jaar voorafgaand aan 1 mei 2003 een certificaat van eerste of herkeuring
      is afgegeven op basis van de eisen die op het moment van eerste keuring van kracht waren, mogen bij een algemene
      periodieke keuring gebruikt worden tot de dag waarop het certificaat zijn geldigheid verliest.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.6.15
  - number: 3.7.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.a
    text: |-
      rollenremtestbank: meetmiddel waarmee de remwerking van een voertuig kan worden onderzocht door het meten van de
      remkracht terwijl de wielen van een voertuigas worden aangedreven door middel van rollen die de betreffende as
      dragen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.b
    text: |-
      gemiddelde waarde: rekenkundig gemiddelde van op vaste tijdsafstanden bepaalde momentele waarden, in aantal
      voldoende voor de bepaling van het werkelijke gemiddelde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.c
    text: |-
      remkracht: tangentieel aan de omtrek van de rollen van de rollenremtestbank werkende kracht, overgedragen aan een
      daarop rollend wiel als gevolg van het in werking zijn van de reminrichting;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.d
    text: 'ingestuurde druk: druk ingestuurd op de drukluchtremcilinders van het voertuig;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.e
    text: |-
      resulterende meetwaarde: de door de rollenremtestbank aangewezen of afgedrukte waarde die als uiteindelijk
      resultaat van de remtest wordt gepresenteerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.f
    text: |-
      extrapolatie-inrichting: inrichting waarmee een remkracht gemeten bij een bepaalde waarde van de ingestuurde druk
      kan worden omgerekend in de remkracht zoals deze zou optreden bij een hogere waarde van de ingestuurde druk;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.g
    text: |-
      extrapolatiedruk (P): waarde van de ingestuurde druk waarbij de remkracht zou optreden zoals deze door de
      extrapolatie-inrichting is berekend;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.h
    text: |-
      extrapolatiewaarde: met behulp van een extrapolatie-inrichting bepaalde resulterende meetwaarde voor de remkracht
      zoals deze wordt geacht op te treden bij de extrapolatiedruk;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.i
    text: |-
      extrapolatiedruk (P): gegarandeerde druk in de remcilinder van iedere as waarbij de as maximaal is beladen en met
      het voertuig een volle beremming wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.j
    text: |-
      rotatieperiode: tijdsperiode overeenkomend met een omwenteling van een voertuigwiel met een voor de betreffende
      rollenremtestbank relevante afmeting;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.k
    text: |-
      remkrachthelling: verhouding tussen een partiële toename van de remkracht en de bijbehorende partiële toename van
      de ingestuurde druk;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.l
    text: |-
      berekende remvertraging: door de rollenremtestbank weergegeven waarde van de remvertraging zoals deze wordt
      berekend gebruikmakend van de verkregen waarden voor de remkrachten en de massa van het voertuig;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.m
    text: 'rolweerstand: kracht ter aandrijving van de ongeremde wielen;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.n
    text: |-
      klasse I rollenremtestbank: rollenremtestbank die geschikt is voor de keuring van voertuigen met een maximum
      toegestane massa van niet meer dan 3500 kg en die kan worden gebruikt bij de keuring van voertuigen met een maximum
      toegestane massa van meer dan 3500 kg mits de asdruk van deze voertuigen niet groter is dan de maximale toelaatbare
      asdruk zoals aangegeven op de rollenremtestbank;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.o
    text: |-
      klasse II rollenremtestbank: rollenremtestbank die uitsluitend mag worden toegepast bij de keuring van voertuigen
      waarvan de maximum toegestane massa meer bedraagt dan 3500 kg;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.1.p
    text: |-
      klasse I/II rollenremtestbank: rollenremtestbank voorzien van twee aanwijsbereiken, waarbij het eerste aan
      de definitie geldend voor een klasse I rollenremtestbank en het tweede aan de definitie voor een klasse II
      rollenremtestbank voldoet.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.1
  - number: 3.7.2
    text: 'In de handleiding behorende bij de rollenremtestbank is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.2
  - number: 3.7.2.a
    text: de informatie genoemd in artikel 1.15;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.2
  - number: 3.7.2.b
    text: de betekenis en beperkingen in het gebruik van de berekende remvertraging.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.2
  - number: 3.7.3
    text: |-
      In aanvulling op artikel 1.9, tweede lid, onder a, wordt een verzegeling eveneens aangebracht tussen de
      rollenremtestbank en zijn fundering.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.3
  - number: 3.7.4
    text: |-
      De rollenremtestbank moet een voorziening hebben waarmee op een betrouwbare en veilige wijze door het aanbrengen
      van een kracht inwerkend op de krachtopnemers een statische remkracht kan worden gesimuleerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.4
  - number: 3.7.5.1
    text: 'Een rollenremtestbank moet zijn voorzien van de volgende controle-inrichtingen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.5
  - number: 3.7.5.1.a
    text: een testaansluiting;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.5
  - number: 3.7.5.1.b
    text: |-
      een inrichting waarmee automatisch voorafgaande aan een meting dan wel handmatig door de gebruiker een remkracht
      wordt gesimuleerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.5
  - number: 3.7.5.2
    text: |-
      Met de in het eerste lid, onderdeel b, bedoelde inrichting wordt de juiste werking van de rollenremtestbank
      gecontroleerd. Tijdens deze controle moeten alle circuits worden gecontroleerd, die invloed kunnen hebben op de
      nauwkeurigheid van de aanwijzing. De omzetting van remkracht inclusief de circuits die het primaire meetsignaal
      genereren mogen hiervan zijn uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.5
  - number: 3.7.6
    text: |-
      Een geïntegreerde manometer of pedaalkrachtmeter moet voldoen aan de eisen gesteld in [paragraaf 4][ref1]
      respectievelijk [5 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.6
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 3.7.7.1
    text: |-
      Voor een klasse I rollenremtestbank, dan wel voor het eerste aanwijsbereik van een klasse I/II rollenremtestbank,
      bedraagt de maximale fout bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.7.1.a
    text: 'die niet groter is dan 2500 N: 100 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.7.1.b
    text: 'die groter is dan 2500 N: 4% van de gesimuleerde werkelijke remkracht.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.7.2
    text: |-
      Voor een klasse II rollenremtestbank, dan wel voor het tweede deelaanwijsbereik van een klasse I/II
      rollenremtestbank, bedraagt de maximale fout bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.7.2.a
    text: 'die niet groter is dan 10.000 N: 400 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.7.2.b
    text: 'die groter is dan 10.000 N: 4% van de gesimuleerde werkelijke remkracht.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.7
  - number: 3.7.8
    text: |-
      Bij meting van de remkracht van de wielen van een as mag, bij gelijke remkracht, het verschil in aanwijzing voor
      beide wielen niet groter zijn dan de helft van de maximale fouten bedoeld in artikel 3.7.7.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.8
  - number: 3.7.9
    text: |-
      Bij een rollenremtestbank voorzien van een extrapolatie-inrichting, is het maximale verschil tussen de
      gepresenteerde extrapolatiewaarde en de waarde berekend door middel van lineaire extrapolatie van de werkelijke
      waarden van de remkracht bij een ingestuurde druk van 1 bar en bij een ingestuurde druk 0,2 bar beneden de hoogste
      waarde, gebruikt bij de remtest van een voertuig, gelijk aan 2,5 maal de waarde genoemd in artikel 3.7.7, tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.9
  - number: 3.7.10
    text: |-
      De maximale fout in de resulterende meetwaarde bedraagt 2,5% van de aangewezen waarde indien deze uitsluitend
      veroorzaakt wordt door dynamische effecten in de meetsignalen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.10
  - number: 3.7.11
    text: |-
      Indien een rollenremtestbank voorzien is van een geïntegreerde pedaalkrachtmeter of manometer voor de ingestuurde
      druk, zijn de gestelde eisen aan remkracht bedoeld in de [paragrafen 7.2.4 tot en met 7.2.6][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.11
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.7.12.1
    text: |-
      Klasse I rollenremtestbanken moeten voorzien zijn van een analoge aanwijzing eventueel in combinatie met een
      digitale aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.12
  - number: 3.7.12.2
    text: 'Klasse II en klasse I/II rollenremtestbanken moeten voorzien zijn van:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.12
  - number: 3.7.12.2.a
    text: een analoge aanwijzing in combinatie met een digitale aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.12
  - number: 3.7.12.2.b
    text: een extrapolatie-inrichting; en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.12
  - number: 3.7.12.2.c
    text: een afdrukinrichting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.12
  - number: 3.7.13
    text: |-
      Rollenremtestbanken voorzien van een extrapolatie-inrichting, moeten zijn voorzien van een geïntegreerde manometer
      voor de ingestuurde druk.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.13
  - number: 3.7.14.1
    text: |-
      De rollenremtestbank moet van een zodanige constructie zijn, dat op een veilige manier metingen kunnen worden
      verricht aan voertuigen waarvoor de rollenremtestbank op grond van het aanwijsbereik bestemd is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.14
  - number: 3.7.14.2
    text: |-
      De rollenremtestbank moet zijn voorzien van een beveiliging tegen overbelasting die niet in werking mag treden voor
      remkrachten binnen het aanwijsbereik.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.14
  - number: 3.7.15.1
    text: |-
      Het maximale draagvermogen van de rollen zoals vermeld op de rollenremtestbank mag per wiel en in kilogram
      uitgedrukt niet kleiner zijn dan 1/6 maal de maximale waarde van het aanwijsbereik zoals uitgedrukt in Newton.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.15
  - number: 3.7.15.2
    text: 'De diameter van de rollen mag niet kleiner zijn dan:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.15
  - number: 3.7.15.2.a
    text: 0,15 m voor klasse I rollenremtestbanken;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.15
  - number: 3.7.15.2.b
    text: 0,25 m voor klasse II en klasse I/II rollenremtestbanken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.15
  - number: 3.7.15.3
    text: Tijdens de remtest is de omtreksnelheid van de rollen niet lager dan 2 km/h.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.15
  - number: 3.7.16.1.a
    text: |-
      De rollenremtestbank moet zijn voorzien van een inrichting waarmee overmatige slijtage van de banden wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.16
  - number: 3.7.16.1.b
    text: Indien deze inrichting instelbaar is, kan instelling niet plaatsvinden zonder verbreking van een verzegeling.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.16
  - number: 3.7.16.2
    text: |-
      Het oppervlak van de rollen en de instelling van de inrichting, genoemd in het eerste lid, moeten zodanig zijn dat
      in droge toestand de aan het wiel overgedragen remkracht ten minste 0,6 maal de waarde van de kracht kan bereiken
      die een wiel op zijn ondersteuning uitoefent.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.16
  - number: 3.7.16.3
    text: |-
      Ten behoeve van de vaststelling dat de rollenremtestbank aan de eis, genoemd in het tweede lid, voldoet, dient de
      fabrikant van de rollenremtestbank bij de aanbieding voor een typekeuring door middel van beproevingsresultaten aan
      te tonen dat aan de betreffende eis wordt voldaan over het gehele aanwijsbereik van de rollenremtestbank.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.16
  - number: 3.7.16.4
    text: |-
      Indien de inrichting, genoemd in het eerste lid, instelbaar is, moet het mogelijk zijn de instelling van de
      desbetreffende inrichting bij een keuring vast te stellen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.16
  - number: 3.7.17
    text: De rolweerstand moet altijd als remkracht worden gepresenteerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.17
  - number: 3.7.18
    text: |-
      Op de rollenremtestbank kunnen gelijktijdig voor het linker- en rechterwiel van een gemeten as ten minste de
      volgende waarden worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.a
    text: 'voorafgaand aan de remtest: de rolweerstand;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.b
    text: 'tijdens de remtest:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.b.1°
    text: de momentele waarde van de remkracht, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.b.2°
    text: de fluctuaties in de momentele waarde van de remkracht, relevant voor de beoordeling van het geteste remsysteem;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.c
    text: 'na correcte uitvoering van de remtest moeten de volgende waarden worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.c.1°
    text: de resulterende meetwaarde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.c.2°
    text: |-
      de waarde van het verschil in remkracht inclusief de rolweerstand aan het linker- en rechterwiel uitgedrukt in een
      percentage van de hoogste remkracht. Dit verschil moet worden bepaald uit:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.c.2°.A
    text: de resulterende meetwaarde voor klasse I rollenremtestbanken, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.18.c.2°.B
    text: |-
      de niet-geëxtrapoleerde resulterende meetwaarde bij druk P voor klasse II rollenremtestbanken en voor het tweede
      aanwijsbereik van klasse I/II rollenremtestbanken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.18
  - number: 3.7.19.1
    text: |-
      Indien een rollenremtestbank voorzien is van een presentatie van een berekende maximale remvertraging, moet
      de berekening van deze waarde gemaakt worden overeenkomstig de formule a = F/M; hierbij is F de berekende
      extrapolatiewaarde zoals bedoeld in artikel 3.7.30, en M is de maximale massa per as van het voertuig zoals
      vermeld op het kentekenbewijs, of bij opleggers het maximale gewicht van de assen tezamen zoals vermeld op het
      kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.19
  - number: 3.7.19.2
    text: De in het eerste lid bedoelde waarde moet zijn voorzien van het bijschrift `Berekende statische remvertraging'.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.19
  - number: 3.7.20.1
    text: Dynamische effecten moeten op een juiste wijze in de resulterende meetwaarde zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.20.2
    text: |-
      Een resulterende meetwaarde mag niet worden gepresenteerd indien de verkregen meetwaarden zo instabiel zijn dat
      niet kan worden voldaan aan de eis gesteld in artikel 3.7.10.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.20.3
    text: 'Een resulterende meetwaarde mag niet eerder worden aangewezen dan na beëindiging van de remtest door:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.20.3.a
    text: het in werking treden van de inrichting genoemd in artikel 3.7.16, eerste lid; of
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.20.3.b
    text: een daling van de remkracht tot een waarde beneden 25% van de hoogste gemeten remkracht.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.20.4
    text: |-
      De rollenremtestbank moet zijn voorzien van een signalering, die tijdens de remtest aangeeft dat de verkregen
      meetwaarden voldoende stabiel zijn om na beëindiging van de remtest een resulterende meetwaarde te presenteren.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.20
  - number: 3.7.21
    text: |-
      De analoge aanwijzing moet zodanig van opbouw zijn dat de momentele waarde van een fluctuerende remkracht kan
      worden geschat en de voor de beoordeling van het onderzochte remsysteem relevante fluctuaties alsmede het verschil
      in remkracht aan het linker- en rechtwiel in de momentele waarde zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.21
  - number: 3.7.22
    text: 'Indien de rollenremtestbank van een analoge aanwijzing en een digitale aanwijzing is voorzien:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.22
  - number: 3.7.22.a
    text: |-
      moeten de resulterende meetwaarde en het verschil in remkracht aan het linker- en rechterwiel digitaal worden
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.22
  - number: 3.7.22.b
    text: |-
      moet uitsluitend de momentele remkracht met de daarin optredende fluctuaties analoog worden aangewezen en moet de
      analoge aanwijzing voorzien zijn van het opschrift `Globale Aanwijzing'.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.22
  - number: 3.7.23
    text: |-
      Indien de rollenremtestbank van een analoge aanwijzing is voorzien moet de onnauwkeurigheid in de resulterende
      meetwaarde en in het verschil in remkracht aan het linker- en rechterwiel, uitsluitend als gevolg van de beperkte
      afleesnauwkeurigheid niet meer bedragen dan 1/5 van de maximale fout voor statische metingen, geldend voor het
      betreffende meetresultaat.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.23
  - number: 3.7.24
    text: 'Een digitale aanwijzing moet zodanig zijn dat:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.24
  - number: 3.7.24.a
    text: |-
      de onnauwkeurigheid in de resulterende meetwaarde en in het verschil in remkracht tussen het linker- en rechterwiel
      uitsluitend als gevolg van de beperkte afleesnauwkeurigheid niet meer bedraagt dan 1/5 van de maximale fout voor
      statische metingen geldend voor het betreffende meetresultaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.24
  - number: 3.7.24.b
    text: |-
      de afmetingen van de cijfers alsmede de helderheid en het contrast van de weergave moeten zodanig zijn, dat ook
      onder minder gunstige omstandigheden de aflezing op gemakkelijke wijze mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.24
  - number: 3.7.25.1
    text: |-
      Een gepresenteerde niet-geëxtrapoleerde resulterende meetwaarde moet betrekking hebben op de hoogste waarde van de
      gemiddelde remkracht over één rotatieperiode, zoals deze tijdens de remtest optreedt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.25
  - number: 3.7.25.2
    text: |-
      Indien bij rollenremtestbanken die voorzien zijn van een registratie-inrichting de meting wordt beëindigd voordat
      de inrichting genoemd in artikel 3.7.16, eerste lid, in werking is getreden, wordt deze waarde aangegeven op
      de registratie met voor luchtdrukgestuurde remsystemen daarbij de vermelding van de gemiddelde waarde van de
      ingestuurde druk bepaald over de rotatieperiode als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.25
  - number: 3.7.26
    text: 'Een niet-geëxtrapoleerde resulterende meetwaarde reageert als volgt op testsignalen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.26
  - number: 3.7.26.a
    text: |-
      op de testaansluiting wordt een simulatiesignaal aangeboden met een constante gemiddelde waarde, echter periodiek
      variërend met een laagste frequentie overeenkomend met één rotatieperiode. De gepresenteerde resulterende
      meetwaarde moet na deze test gelijk zijn aan de aanwijzing verkregen na een constant simulatiesignaal met dezelfde
      gemiddelde waarde, met een tolerantie van 2,5%;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.26
  - number: 3.7.26.b
    text: |-
      op de testaansluiting wordt een simulatiesignaal aangeboden met een veranderende gemiddelde en periodiek variërende
      waarde met een laagste frequentie overeenkomend met één rotatieperiode. De resulterende meetwaarde:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.26
  - number: 3.7.26.b.1°
    text: |-
      mag slechts mag worden gepresenteerd indien de hoogste gemiddelde waarde van het simulatiesignaal over
      een rotatieperiode binnen 5% overeenkomt met de gemiddelde waarde over de voorafgaande of daarop volgende
      rotatieperiode, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.26
  - number: 3.7.26.b.2°
    text: |-
      komt overeen met de aanwijzing verkregen met een constant simulatiesignaal met een gemiddelde gelijk aan de onder 1
      genoemde hoogste gemiddelde waarde, met een tolerantie van 2,5%.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.26
  - number: 3.7.27
    text: 'Een rolleremtestbank voorzien van een extrapolatie-inrichting moet:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.27
  - number: 3.7.27.a
    text: de momentele meetwaarde van de remkracht en de momentele waarde van de ingestuurde druk aanwijzen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.27
  - number: 3.7.27.b
    text: |-
      remkrachtwaarden, verkregen met een hogere ingestuurde druk dan de maximum extrapolatiedruk, niet meerekenen in
      de extrapolatiewaarde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.27
  - number: 3.7.28.1
    text: |-
      De verhouding van het druktraject waarover meting en extrapolatie plaatsvindt, ten opzichte van het druktraject
      waarover de meting plaatsvindt, dient te voldoen aan de volgende voorwaarde:





                    P - P




                    -------------- ≤ 3




                    P - P




           waarbij geldt: P ≤ P Hierin is: - P de maximum extrapolatiedruk;
        - P de extrapolatiedruk;
        - P de laagste druk van het meettraject dat de basis vormt voor de extrapolatie;
        - P de hoogste druk van het meettraject dat de basis vormt voor de extrapolatie.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.28
  - number: 3.7.28.2
    text: |-
      Een gepresenteerde extrapolatiewaarde die op grond van de voorwaarde, genoemd in het eerste lid, betrekking heeft
      op een ingestuurde druk, lager dan de maximum extrapolatiedruk, moet duidelijk worden geïdentificeerd door een
      aangewezen en een afgedrukte waarschuwing dat de gesimuleerde of de werkelijke asbelasting nog kan worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.28
  - number: 3.7.29
    text: |-
      Onregelmatigheden in de remkrachthelling voor waarden van de ingestuurde druk kleiner dan 1 bar mogen niet leiden
      tot verschillende extrapolatiewaarden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.29
  - number: 3.7.30.1
    text: 'Een berekende extrapolatiewaarde reageert als volgt op testsignalen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.30
  - number: 3.7.30.1.a
    text: |-
      op de testaansluiting wordt door gelijktijdige aanbieding van een simulatiesignaal voor de ingestuurde druk
      en een simulatiesignaal voor de remkracht een meetcyclus nagebootst. Beide simulatiesignalen nemen hierbij in
      afhankelijkheid van elkaar volgens een constante waarde van de remkrachthelling toe, tot een eindwaarde van
      de ingestuurde druk zoals deze ook in de praktijk bij het bepalen van de remkracht van voertuigen zou kunnen
      optreden. Het simulatiesignaal voor de remkracht varieert hierbij met een laagste frequentie overeenkomend met een
      rotatieperiode. Een gepresenteerde extrapolatiewaarde moet binnen 2% gelijk zijn aan de referentiewaarde. De hier
      bedoelde referentiewaarde is de waarde van de remkracht bij de van toepassing zijnde maximale ingestuurde druk,
      zoals deze door lineaire extrapolatie kan worden berekend uit de gesimuleerde signalen voor de ingestuurde druk en
      de remkracht;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.30
  - number: 3.7.30.1.b
    text: |-
      op de testaansluiting wordt een meetcyclus gesimuleerd zoals beschreven onder a, doch met simulatie van een
      remkrachthelling waarvan de waarde verandert met de waarde van de remkracht. Een gepresenteerde extrapolatiewaarde
      moet binnen 5% overeenkomen met de referentiewaarde. De hier bedoelde referentiewaarde is de waarde van de
      remkracht bij de van toepassing zijnde maximale ingestuurde druk, zoals deze door lineaire extrapolatie kan worden
      berekend uit de volgende twee punten van de gesimuleerde kracht/druk-karakteristiek: F is de gesimuleerde remkracht
      bij een gesimuleerde ingestuurde druk van 1 bar, en F is de gesimuleerde remkracht bij een gesimuleerde ingestuurde
      druk 0,2 bar onder de hoogste gesimuleerde ingestuurde druk. De waarde van de gesimuleerde remkracht is gebaseerd
      op de gemiddelde waarde van de remkrachthelling over een gebied van 0,5 bar aansluitend boven de drukwaarde
      behorende bij F en over een gebied van 0,5 bar aansluitend onder de drukwaarde behorende bij F.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.30
  - number: 3.7.30.2
    text: |-
      Voor de berekening van de referentiewaarden genoemd in het eerste lid, onder a en b, wordt rekening gehouden met
      de werkelijke relatie tussen een statisch simulatiesignaal en de daaraan gerelateerde aangewezen waarde, waarbij de
      fluctuaties gesuperponeerd op het simulatiesignaal zijn geëlimineerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.30
  - number: 3.7.31
    text: |-
      Na beëindiging van de remtest mag naast de berekende extrapolatiewaarde tevens een gemeten waarde voor de
      remkracht en de bijbehorende ingestuurde druk worden gepresenteerd. Deze gemeten waarden moeten overeenkomen met
      de voor het extrapolatieproces gebruikte hoogste waarden voor de gemiddelde remkracht per rotatieperiode en de
      bijbehorende ingestuurde druk, gemiddeld over dezelfde periode. Deze waarde moet voldoen aan de eisen gesteld in
      [paragraaf 7.2.6][ref1]. met uitzondering van [artikel 3.7.26, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.31
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.7.32.1
    text: |-
      Een klasse II en klasse I/II rollenremtestbank moeten zijn voorzien van een interne of externe afdrukinrichting
      waarmee tenminste de volgende gegevens worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.a
    text: de informatie zoals vermeld in artikel 1.14, onder 3;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.b
    text: de datum en het tijdstip van de metingen aan het betreffende voertuig;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.c
    text: 'de ingevoerde informatie van het betreffende voertuig:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.c.1°
    text: identificatie bestaande uit het kenteken of de meldcode;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.c.2°
    text: maximum massa c.q. de maximum af te remmen massa;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.c.3°
    text: de maximum extrapolatiedruk P per as;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.c.4°
    text: de wettelijk vereiste remvertraging;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.d
    text: 'een getalsmatige of grafische weergave van de relatie tussen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.d.1°
    text: |-
      de pedaalkracht en de daarbij behorende remkracht per wiel en per as en het verschil in remkracht tussen het
      linker- en rechterwiel in het geval van een remproef voor hydraulische remsystemen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.d.2°
    text: |-
      de ingestuurde druk en de daarbij behorende remkracht per wiel en per as en het verschil in remkracht tussen het
      linker- en rechterwiel in het geval van een remproef voor pneumatische remsystemen; de relatie wordt minstens
      weergegeven door de waarden van de druk P en P, zoals bedoeld in artikel 3.7.28, gebruikt bij de remtest van het
      voertuig;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.e
    text: 'de berekende waarden:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.e.1°
    text: de resulterende meetwaarde gesommeerd per as;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.e.2°
    text: de berekende statische remvertraging;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.f
    text: de vermelding, bedoeld in artikel 3.7.25, tweede lid;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.1.g
    text: de waarschuwing genoemd in artikel 3.7.28, tweede lid.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.32.2
    text: |-
      Andere informatie dan bedoeld in het eerste lid mag worden geregistreerd voorzover deze niet leidt tot misleiding
      of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.32
  - number: 3.7.33
    text: |-
      Klasse II rollenremtestbanken en klasse I/II rollenremtestbanken, voor wat betreft het klasse II-bereik, voorzien
      van hydraulische of pneumatische krachtopnemers, waarvoor in de 12 maanden voorafgaande aan 1 februari 2004 een
      certificaat van eerste of herkeuring is afgegeven op basis van de eisen die op het moment van de eerste keuring van
      kracht waren, mogen tot uiterlijk drie jaar na de datum van afgifte, zoals deze staat vermeld op het certificaat,
      worden gebruikt bij een algemene periodieke keuring.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.33
  - number: 3.7.34.1
    text: |-
      Klasse I rollenremtestbanken en klasse I/II rollenremtestbanken, voor wat betreft het klasse I-bereik waarvoor in
      de 12 maanden voorafgaande aan 1 februari 2004 een certificaat van eerste of herkeuring is afgegeven op basis van
      de eisen die op het moment van de eerste keuring van kracht waren, moeten blijven voldoen aan die eisen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.34
  - number: 3.7.34.2
    text: |-
      Rollenremtestbanken, bedoeld in het eerste lid, moeten in afwijking van de eisen gesteld aan meetnauwkeurigheid,
      voldoen aan de volgende eisen: de maximale fout in plus en min bedraagt bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.34
  - number: 3.7.34.2.1°
    text: 'die niet groter is dan 1800 N: 180 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.34
  - number: 3.7.34.2.2°
    text: 'die groter is dan 1800 N: 10% van de werkelijke remkracht.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.34
  - number: 3.7.35.1
    text: |-
      Klasse II rollenremtestbanken en klasse I/IIrollenremtestbanken die niet voorzien zijn van hydraulische of
      pneumatische krachtopnemers waarvoor in de 12 maanden voorafgaande aan 1 februari 2004 een certificaat van eerste
      of herkeuring is afgegeven op basis van de voorschriften die op het moment van de eerste keuring van kracht waren,
      mogen tot uiterlijk drie jaar na de datum van afgifte van het certificaat zoals daarop vermeld, worden gebruikt bij
      een algemene periodieke keuring.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.35
  - number: 3.7.35.2
    text: |-
      Rollenremtestbanken, bedoeld in het eerste lid, moeten na 3 jaar na de in het eerste lid, genoemde datum, voldoen
      aan de eisen genoemd in deze regeling met uitzondering van de artikelen 1.13.5, 1.14.1 onder b en g, 1.14.2,
      1.14.3, [1.20][ref1], [3.7.15, tweede lid][ref2], [3.7.16, derde lid][ref3], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.35
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.7.35.2.a
    text: |-
      in afwijking van [artikel 3.7.16, tweede lid][ref1], de aan het wiel overgedragen remkracht tenminste 0,5 maal de
      waarde van de kracht kan bereiken die een wiel op zijn ondersteuning uitoefent, waarbij het oppervlak van de rollen
      droog is;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.35
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.7.35.2.b
    text: |-
      in afwijking van [artikel 3.7.23][ref1] het aanwijsbereik onderverdeeld moet zijn in tenminste 25 schaaldelen van
      gelijke waarde, waarbij de totale lengte van de schaalverdeling tenminste 0,15 m moet bedragen. Voor cirkelvormige
      schaalverdelingen gelden deze waarden voor de lengte van de cirkelboog die het midden van de deelstrepen verbindt.
      Aflezing van een waarde van 2% van het aanwijsbereik moet eenvoudig zijn. De schaalverdeling moet ten minste op
      onderlinge gelijke afstanden die niet groter zijn dan 20% van het aanwijsbereik, van cijfers zijn voorzien; en,


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.35
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.7.35.2.c
    text: |-
      in afwijking van [artikel 3.7.24][ref1], het aanwijsbereik onderverdeeld moet zijn in ten minste 100 schaaldelen
      van gelijke waarde waarbij de afmetingen van de cijfers alsmede de helderheid en het contrast van de weergave
      zodanig is, dat aflezing eenvoudig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.7.35
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.8.1.1
    text: |-
      In deze paragraaf wordt verstaan onder platenremtestbank een meetmiddel waarbij de wielen van een voertuig
      kunnen steunen op vlakke, horizontale platen, waarmee de remkracht wordt bepaald uit de reactiekracht die wordt
      uitgeoefend door een afremmend voertuig dat op de platen tot stilstand wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.1
  - number: 3.8.1.2
    text: |-
      Platenremtestbanken behoeven niet te voldoen aan het bepaalde in paragraaf [2.3 ][ref1]en [3][ref2] van
      [hoofdstuk 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.1
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '1'
  - number: 3.8.2
    text: 'De platenremtestbank moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.a
    text: |-
      de platenremtestbank moet per as voor elk afzonderlijk wiel de gemeten waarden aangeven. Zij moet op gemakkelijke
      wijze te bedienen zijn en op veilige wijze werken;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.b
    text: |-
      de wrijvingscoëfficiënt tussen de wielen van een op de platenremtestbank geplaatst voertuig en de platenremtestbank
      moet in droge toestand ten minste 0,5 bedragen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.c
    text: de gemeten remkracht moet worden weergegeven in Newton (N);
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.d
    text: |-
      de gemeten waarden moeten door analoge of digitale aanwijs- of registratie-inrichtingen gemakkelijk en duidelijk
      worden aangegeven;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.e
    text: 'de aanwijs- of registratie-inrichtingen moeten:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.e.1
    text: zijn voorzien van een nulstelinrichting, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.e.2
    text: |-
      zodanig zijn uitgevoerd dat per as de bijbehorende paren meetgegevens gelijktijdig voor aflezing of verdere
      verwerking beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.f
    text: |-
      het meetbereik van een platenremtestbank met digitale weergave van de gemeten waarde moet ten minste 100
      schaaldelen van gelijke waarde omvatten waarbij de afmetingen van de cijfers alsmede de helderheid en het contrast
      van de weergave zodanig moeten zijn, dat ook onder minder gunstige omstandigheden de aflezing op gemakkelijke wijze
      mogelijk is;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.g
    text: |-
      het meetbereik van een analoog aanwijzende of analoog registrerende platenremtestbank moet ten minste 25
      schaaldelen van gelijke waarden omvatten, waarbij de schaalverdeling ten minste op onderling gelijke afstanden,
      die niet groter zijn dan 20% van het meetbereik, van cijfers moet zijn voorzien. De totale lengte van de
      schaalverdeling, gemeten langs de cirkel die het midden van de deelstrepen verbindt, moet bij een aanwijzende
      inrichting ten minste 0,15 m en bij een registrerende inrichting ten minste 0,07 m bedragen. Een waarde ter grootte
      van 2% van het meetbereik van de inrichting moet nog gemakkelijk zijn af te lezen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.h
    text: |-
      demping en eigen frequentie van de platenremtestbank moeten zodanig zijn, dat de maximale fouten, bedoeld onder m,
      niet worden overschreden zolang de toename per tijdseenheid van de gemeten waarde niet de door de fabrikant van de
      platenremtestbank opgegeven grenswaarde te boven gaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.i
    text: |-
      de platenremtestbank en een daaraan gekoppelde inrichting voor de verwerking van meetgegevens moeten beveiligd
      zijn tegen of voldoende ongevoelig zijn voor de onder normale omstandigheden voorkomende thermische, atmosferische,
      elektrische, magnetische en elektromagnetische invloeden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.j
    text: |-
      een analoog registrerende platenremtestbank moet zodanig zijn uitgevoerd dat afwijkingen als gevolg van mogelijke
      positieverandering van het registratieblad ten hoogste 1% van het meetbereik van de platenremtestbank bedragen.
      Indien de gemeten waarde wordt geregistreerd in afhankelijkheid van de tijd moet de transportsnelheid van het blad
      ten minste 0,005 m/s bedragen en mag de transportsnelheid niet meer dan 5% afwijken van de nominale waarde daarvan.
      Bij cirkelvormige bladen wordt als transportsnelheid aangemerkt de omtreksnelheid, gemeten aan de binnencirkel van
      het registratieveld;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.k
    text: |-
      de weergave van de gemeten waarde die uiterlijk 0,5 seconde nadat de meting is begonnen, wordt verkregen, wordt als
      maatgevend beschouwd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l
    text: 'de maximale fout in plus en in min, van de aangewezen remkracht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.1
    text: |-
      indien de aanwijs- of registratie-inrichting bestemd is voor de keuring van voertuigen waarvan de toegestane
      maximum massa niet meer bedraagt dan 3500 kg, bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.1.I
    text: 'die niet groter is dan 1800 N: 180 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.1.II
    text: 'die groter is dan 1800 N: 10% van de werkelijke remkracht;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.2
    text: |-
      indien de aanwijs- of registratie-inrichting bestemd is voor de keuring van voertuigen waarvan de toegestane
      maximum massa meer bedraagt dan 3500 kg, bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.2.I
    text: 'die niet groter is dan 9000 N: 900 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.2.II
    text: 'die groter is dan 9000 N: 10% van de werkelijke remkracht;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.3
    text: |-
      indien de aanwijs- of registratie-inrichting bestemd is voor de keuring van beide hiervoor bedoelde groepen
      voertuigen, voor het gedeelte van het meetbereik dat bestemd is voor de keuring van voertuigen waarvan de
      toegestane maximum massa niet meer bedraagt dan 3500 kg, bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.3.I
    text: 'die niet groter is dan 1800 N: 180 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.3.II
    text: |-
      die groter is dan 1800 N: 10% van de werkelijke remkracht; en voor het gedeelte van het meetbereik dat is bestemd
      voor de keuring van andere voertuigen, bij een kracht:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.3.III
    text: 'die niet groter is dan 9000 N: 900 N;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.l.3.IV
    text: 'die groter is dan 9000 N: 10% van de werkelijke remkracht;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.2.m
    text: |-
      bij meting van de remkracht van de wielen van een as mag, bij gelijke remkracht, het verschil in aanwijzing voor de
      beide wielen niet groter zijn dan de helft van de maximale fout, bedoeld onder 1.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.2
  - number: 3.8.3
    text: 'Platenremtestbanken in gebruik genomen vóór 1 juli 1984:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.3
  - number: 3.8.3.a
    text: |-
      behoeven niet te voldoen aan [artikel 3.8.2, onderdeel m][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.8.3.b
    text: |-
      behoeven, voor zover het platenremtestbanken betreft in gebruik genomen vóór 1 januari 1984, niet te voldoen aan
      [artikel 1.2, eerste lid][ref1], alsmede [artikel 3.8.2, onderdelen c, f, g, i en j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.8.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.9.1.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.a
    text: |-
      koolmonoxidemeter: een meetmiddel dat bestemd is voor het meten van het koolmonoxidegehalte van uitlaatgassen,
      afkomstig van met stationair toerental draaiende motoren met elektrische ontsteking van in gebruik zijnde
      motorrijtuigen, welk meetmiddel het meetresultaat direct in volumeprocenten aangeeft, al dan niet tezamen met het
      volumegehalte van andere, in de uitlaatgassen voorkomende bestanddelen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.b
    text: |-
      monsternamesysteem: het monsternamesysteem omvat alle onderdelen die worden gebruikt om de motoruitlaatgassen op te
      vangen en naar de koolmonoxidemeter over te brengen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.c
    text: |-
      condensaatafscheider: de condensaatafscheider omvat alle onderdelen die worden gebruikt om gecondenseerde waterdamp
      uit de uitlaatgassen af te scheiden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.d
    text: |-
      filtersysteem: het filtersysteem omvat alle onderdelen die worden gebruikt om die deeltjes uit het uitlaatgas te
      verwijderen die de juiste werking van de meetcel kunnen verstoren;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.e
    text: |-
      nulstelinrichting: de inrichting waarmee de aanwijzing van de koolmonoxidemeter, bij doorvoering van een gas dat
      geen koolmonoxyde bevat, op nul kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.f
    text: |-
      justeerinrichting: de inrichting waarmee de justering van de koolmonoxidemeter bij een vaste waarde, referentiepunt
      genoemd, kan worden verricht;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.g
    text: |-
      kalibratie-inrichting: de inrichting waarmee de aanwijzing van de koolmonoxidemeter, bij doorvoering van een
      kalibratiegas, in overeenstemming met de waarde van de te meten grootheid kan worden gebracht;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.h
    text: |-
      opwarmtijd: de door de fabrikant van de koolmonoxidemeter gegeven tijd gedurende welke de koolmonoxidemeter,
      alvorens te mogen worden afgesteld of gebruikt, onder elektrische spanning moet staan;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.i
    text: |-
      responsietijd: de tijd die verloopt na een plotselinge wijziging van de te meten grootheid bij de inlaat van
      het monsternamesysteem tot de koolmonoxidemeter een aanwijzing geeft waarvan het verschil ten opzichte van de
      definitieve aanwijzing van de nieuwe waarde van de grootheid niet meer bedraagt dan een gegeven waarde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.j
    text: |-
      minimale debiet: het debiet beneden hetwelk de aanwijzing van de koolmonoxidemeter een fout kan vertonen die groter
      is dan de maximale fout;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.k
    text: |-
      minimale meettijd: de tijd die ten minste verloopt tussen het moment van inbrengen van het monsternamesysteem in de
      uitlaat en het moment waarop de definitieve aanwijzing van de te meten grootheid is bereikt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.l
    text: |-
      meetbereik: het gebied van de waarden van de te meten grootheid waarbij de aanwijzingen van de koolmonoxidemeter
      die onder normale omstandigheden in één enkele meting zijn verkregen, geen grotere fout mogen vertonen dan de
      maximale fout;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.m
    text: |-
      kalibratiegas: een gasmengsel waarvan de samenstelling in de concentratie van elke component met een voldoende
      nauwkeurigheid bekend zijn om te worden gebruikt bij de kalibratie en justering van een koolmonoxidemeter;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.n
    text: |-
      drift: de variatie van de metrologische eigenschappen van koolmonoxidemeters onder normale gebruiksomstandigheden
      gedurende redelijk lange tijd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.o
    text: |-
      elektronische inrichting: een deel of het geheel van een koolmonoxidemeter of van een hulpinrichting daarvan,
      waarin gebruik wordt gemaakt van elektronische componenten en dat een specifieke functie vervult en onafhankelijk
      kan worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.p
    text: |-
      elektronische inrichting met volledige controle: een elektronische inrichting is voorzien van een volledige
      controle, indien storingen van de essentiële functies van de elektronische inrichting worden gedetecteerd en
      gesignaleerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.q
    text: |-
      elektronische inrichting zonder controle of met gedeeltelijke controle: een inrichting die niet volledig wordt
      gecontroleerd als omschreven in onderdeel p;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.r
    text: |-
      automatische en permanente controle (P): een controle die het mogelijk maakt zonder menselijke tussenkomst de
      juiste werking van elektronische inrichtingen tijdens een meting, hetzij continu, hetzij discontinu te controleren,
      opdat ook in het laatstgenoemde geval elke storing wordt gedetecteerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.s
    text: |-
      automatische en tussentijdse controle (I): een controle die het mogelijk maakt zonder menselijke tussenkomst op
      cyclische wijze de juiste werking van elektronische inrichtingen te controleren;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.1.t
    text: |-
      niet-automatische controle (N): een controle die het mogelijk maakt via menselijke tussenkomst de juiste werking
      van elektronische inrichtingen te controleren.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.2
    text: |-
      De in deze paragraaf gestelde eisen zijn slechts van toepassing op koolmonoxidemeters die vóór 1 januari 1998 in
      gebruik zijn genomen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
  - number: 3.9.1.3
    text: |-
      Koolmonoxidemeters behoeven niet te voldoen aan het bepaalde in [paragraaf 2.3 ][ref1]en [3][ref2] van
      [hoofdstuk 1][ref3], met uitzondering van [artikel 1.14][ref4] en [1.15][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.1
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.9.2
    text: |-
      In de handleiding behorende bij de koolmonoxidemeter moet naast de informatie genoemd in [artikel 1.15][ref1] het
      volgende zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.9.2.a
    text: de wijze waarop de sonde in de uitlaat van het voertuig moet worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.2.b
    text: eventuele aanwijzingen met betrekking tot een te gebruiken sonde voor bepaalde voertuigtypen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.2.c
    text: minimale meettijd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.2.d
    text: het type elektrische voeding;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.2.e
    text: de opwarmtijd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.2.f
    text: de kalibratieprocedure.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.2
  - number: 3.9.3
    text: |-
      De koolmonoxidemeter moet voldoen aan de technische en metrologische eisen opgenomen in respectievelijk
      [paragraaf 9.2.1][ref1] en [9.2.4][ref2] onder de in [paragraaf 9.2.2][ref3] en [9.2.3 ][ref4]genoemde
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '9'
      - id: ref4
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.4
    text: 'De koolmonoxidemeter moet:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.4
  - number: 3.9.4.a
    text: van deugdelijke constructie zijn,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.4
  - number: 3.9.4.b
    text: gemakkelijk zijn te hanteren, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.4
  - number: 3.9.4.c
    text: bestand zijn tegen mechanische invloeden waaraan hij onder normale gebruiksomstandigheden blootgesteld kan zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.4
  - number: 3.9.5
    text: |-
      De koolmonoxidemeter moet in uitgeschakelde toestand kunnen worden vervoerd, en zowel in uit- als in ingeschakelde
      toestand kunnen worden verplaatst.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.5
  - number: 3.9.6
    text: |-
      De delen van de koolmonoxidemeter die met de uitlaatgassen in aanraking komen moeten zijn vervaardigd uit
      materialen die de nauwkeurigheid van de meting niet kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.6
  - number: 3.9.7.1
    text: |-
      De sonde waarmee een monster van de uitlaatgassen kan worden genomen, moet lang genoeg zijn om een insteekdiepte
      van ten minste 30 cm mogelijk te maken, en moet zijn voorzien van een inrichting om de positie van de sonde ten
      opzichte van de uitlaat te fixeren. De sonde bestaat uit een over een voldoende lengte flexibele pijp met een
      uitwendige diameter van ten hoogste 10 mm. De leidingen moeten zijn vervaardigd uit een materiaal dat insnoeringen
      onmogelijk maakt en een lengte hebben van ten minste 3 m (de sonde niet inbegrepen).
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.7
  - number: 3.9.7.2
    text: Het gehele monsternamesysteem moet lekdicht zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.7
  - number: 3.9.8
    text: |-
      De koolmonoxidemeter moet zijn voorzien van een filtersysteem en een condensaatafscheider, die doeltreffend en
      gemakkelijk bereikbaar zijn. De onderdelen van deze inrichtingen moeten een goede werking van de koolmonoxidemeter
      mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.8
  - number: 3.9.9
    text: |-
      De inrichtingen voor nulstelling en justering dienen goed bereikbaar te zijn, maar doelmatig beschermd tegen
      ongewilde ontregeling. De toegang tot de overige instelinrichtingen moet kunnen worden verhinderd. Daartoe moeten
      mogelijkheden tot verzegeling aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.9
  - number: 3.9.10.1
    text: |-
      De koolmonoxidemeter moet zijn voorzien van een inrichting waarmede kan worden gecontroleerd of het
      monstergasdebiet groter is dan het minimale debiet.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.10
  - number: 3.9.10.2
    text: |-
      Indien de koolmonoxidemeter van een aansluiting voor accuvoeding is voorzien, moet een duidelijk waarneembare
      signalering worden gegeven indien de voedingsspanning buiten de in [artikel 3.9.20][ref1] genoemde grenzen komt.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.10
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.11.1
    text: |-
      De afleesinrichting voor koolmonoxyde omvat één of twee schalen met deelstrepen of een numerieke schaal. Bij
      afleesinrichtingen met twee schalen moet iedere schaal bij nul beginnen wanneer de meter twee meetcellen omvat.
      Indien echter de koolmonoxidemeter slechts één meetcel omvat, moet ten minste één van beide schalen bij nul
      beginnen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.11
  - number: 3.9.11.2
    text: 'Op de afleesinrichting moet het volumegehalte aan koolmonoxyde op de volgende wijze zijn vermeld: % vol CO.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.11
  - number: 3.9.11.3
    text: Het meetbereik van het instrument moet zich ten minste van 0 tot 7% vol CO uitstrekken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.11
  - number: 3.9.12.1
    text: |-
      De waarde van de afleeseenheid bedraagt bij inrichtingen met digitale aanwijzing 0,1% vol CO en bij inrichtingen
      met analoge aanwijzing 0,1% vol CO of 0,2% vol CO.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.12
  - number: 3.9.12.2
    text: |-
      Bij inrichtingen met analoge aanwijzing moet de lengte van het kleinste schaaldeel ten minste 1,25 mm bedragen.
      Het gedeelte van de wijzer dat de deelstrepen overlapt, moet duidelijk zichtbaar zijn en een dikte hebben die niet
      meer bedraagt dan een vierde van de lengte van het kleinste schaaldeel. De wijzer moet ten minste één derde van de
      kortste streep bedekken. Op de schaalverdeling moet bovendien elke gehele waarde met een cijfer zijn aangegeven,
      waarbij de hoogte van deze cijfers ten minste 5 mm moet bedragen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.12
  - number: 3.9.12.3
    text: Bij inrichtingen met digitale aanwijzing moeten de cijfers een hoogte van ten minste 10 mm hebben.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.12
  - number: 3.9.13
    text: De koolmonoxidemeter moet zijn voorzien van een doelmatige nulstelinrichting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.13
  - number: 3.9.14.1
    text: |-
      De koolmonoxidemeter moet zijn voorzien van een justeerinrichting waarmee de meter binnen de grenzen van de
      maximale fouten kan worden gejusteerd ten opzichte van een op de koolmonoxidemeter aangegeven referentiepunt, dat
      ligt bij een waarde die overeenkomt met ten minste 60% van het maximale meetvermogen. Het voor het referentiepunt
      gegenereerde, intern signaal moet met behulp van een kalibratiegas op de juiste waarde gebracht kunnen worden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.14
  - number: 3.9.14.2
    text: |-
      In afwijking van het eerste lid mag de koolmonoxidemeter zijn voorzien van een zodanige andere voorziening, dat de
      meter, hetzij door menselijke tussenkomst, hetzij automatisch, wordt gejusteerd binnen de grenzen van de maximale
      fout.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.14
  - number: 3.9.15
    text: 'De koolmonoxidemeter moet zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.15
  - number: 3.9.15.a
    text: een doelmatige kalibratie-inrichting;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.15
  - number: 3.9.15.b
    text: |-
      een inrichting die het mogelijk maakt een kalibratiegas aan de meter toe te voeren zonder gebruik te maken van
      het monsternamesyteem
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.15
  - number: 3.9.16.1
    text: |-
      Een elektronische inrichting die deel uitmaakt van of gekoppeld is aan een koolmonoxidemeter moet duurzaam
      overeenkomstig haar gebruiksdoel functioneren en mag geen significante fouten in de meetresultaten veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.16
  - number: 3.9.16.2
    text: 'De metrologische betrouwbaarheid wordt bereikt:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.16
  - number: 3.9.16.2.a
    text: |-
      hetzij met behulp van een adequaat ontwerp en een adequate constructie vervaardigen van elektronische inrichtingen
      die voldoen aan een vereist kwaliteitsniveau dat op grond van proeven aanwezig mag worden verondersteld
      (elektronische inrichting zonder controle),
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.16
  - number: 3.9.16.2.b
    text: |-
      hetzij door gebruikmaking van elektronische inrichtingen met controles waardoor significante storingen kunnen
      worden gedetecteerd en gesignaleerd (elektronische inrichting met volledige controle),
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.16
  - number: 3.9.16.2.c
    text: hetzij door combinatie van bovenvermelde methoden (elektronische inrichting met gedeeltelijke controle).
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.16
  - number: 3.9.17.1
    text: |-
      Op de koolmonoxidemeter moet een opschriftenplaat zijn aangebracht waarop naast de in [artikel 1.14][ref1] genoemde
      gegevens tevens de volgende gegevens duidelijk leesbaar en onuitwisbaar zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.9.17.1.a
    text: de eventuele handelsbenaming;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.1.b
    text: 'de nominale spanning van de elektrische voeding in de vorm: … V;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.1.c
    text: 'eventueel de nominale frequentie van de elektrische voeding in de vorm: … Hz;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.1.d
    text: het minimale debiet van het monstergas in de vorm Qmin … l/h.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.2
    text: |-
      Op de voorzijde van de koolmonoxidemeter of op de in het eerste lid bedoelde opschriftenplaat, indien deze zich op
      de voorzijde van de koolmonoxidemeter bevindt, moet duidelijk leesbaar en onuitwisbaar worden vermeld:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.2.a
    text: 'de opwarmtijd in de vorm: opwarmtijd … min;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.2.b
    text: 'de minimale meettijd in de vorm: minimale meettijd. … s.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.3
    text: |-
      Op de afleesinrichting of in de onmiddellijke nabijheid daarvan moet duidelijk leesbaar en onuitwisbaar het
      eventuele referentiepunt worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.17.4
    text: |-
      Andere vermeldingen dan genoemd in de voorgaande leden mogen worden aangebracht mits deze geen aanleiding kunnen
      geven tot misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.17
  - number: 3.9.18
    text: |-
      De omgevingstemperatuur mag variëren tussen 0°C en +40°C; de instelwaarde van de nominale temperatuur ligt tussen
      +17°C en +23°C; de werkelijke waarde mag niet meer dan 2°C in plus en min van de ingestelde nominale waarde
      afwijken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.18
  - number: 3.9.19
    text: |-
      De relatieve vochtigheid van de omgevingslucht mag variëren tussen 10% en 90%. De instelwaarde van de nominale
      relatieve vochtigheid ligt tussen 50% en 60%; de werkelijke waarde mag niet meer dan 10% van de ingestelde waarde
      afwijken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.19
  - number: 3.9.20
    text: De spanning van de elektrische voeding mag variëren van –15% tot +10% ten opzichte van de nominale spanning.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.20
  - number: 3.9.21
    text: |-
      De concentraties van kooldioxyde CO2, waterdamp H2O, waterstof H2 en koolwaterstoffen CH in de uitlaatgassen mogen
      variëren tussen:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.21
  - number: 3.9.21.a
    text: 0% vol en 15% vol voor CO₂;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.21
  - number: 3.9.21.b
    text: 0% vol en 3% vol voor H₂O;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.21
  - number: 3.9.21.c
    text: 0% vol en 2% vol voor H₂;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.21
  - number: 3.9.21.d
    text: 0% vol en 1,2% vol voor CH (CH gemeten als equivalent methaan).
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.21
  - number: 3.9.22
    text: |-
      De druk van de uitlaatgassen in de meetcel mag ten opzichte van de nominale druk variëren tussen 800 mbar en 1100
      mbar; de nominale druk is gelijk aan de heersende atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.22
  - number: 3.9.23.1
    text: Vermindering van de voedingsspanning met 100% van de nominale waarde gedurende ca. 10 ms.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.23
  - number: 3.9.23.2
    text: Vermindering van de voedingsspanning met 50% van de nominale waarde gedurende ca. 20 ms.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.23
  - number: 3.9.23.3
    text: Vermindering van de voedingsspanning met 20% van de nominale waarde gedurende ca. 50 ms.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.23
  - number: 3.9.23.4
    text: Het tijdsverschil tussen twee opeenvolgende proeven moet ten minste 10 seconden bedragen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.23
  - number: 3.9.24
    text: |-
      Op het net worden tijdelijke overspanningen van beide polariteiten aangelegd in willekeurig verschoven fasen.
      Deze overgangen worden zowel in fasen als in serie opgewekt uitgaande van een impedantie van 50 ohm. Amplitude,
      stijgtijd, duur en herhalingsfrequentie zijn in tabel 1 nader aangegeven. Tabel 1




                  Amplitude


                  Stijgtijd


                  Afvaltijd tot halve amplitude


                  Herhalingsfrequentie






                  500 V


                  5 ns


                  100 ns


                  12 Hz




                  1500 V


                  35 ns


                  3 μs


                  ≤ 12 Hz
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.24
  - number: 3.9.25.1
    text: |-
      Magnetisch veld van 60 A/m en 50 Hz, dat bijvoorbeeld wordt geproduceerd door een kabel waar een stroom van 10 A
      doorheen loopt, op een afstand van ongeveer 2,5 cm.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.25
  - number: 3.9.25.2
    text: |-
      Veldsterkte van 10 V/m bij frequenties van 100 kHz – 500 MHz. Veldsterkte van 1 V/m bij frequenties van 500 MHz –
      1000 MHz.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.25
  - number: 3.9.25.3
    text: |-
      Elektrostatische ontlading van 6 kV met een energie van 2 mJ aan het geaarde chassis en met een minimale duur van
      10 seconden tussen opeenvolgende ontlading. De ontlading wordt teweeggebracht op de delen van de koolmonoxidemeter,
      die bij normale gebruiksomstandigheden in aanraking kunnen komen met de gebruiker of diens kleding.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.25
  - number: 3.9.26
    text: |-
      Tenzij anders vermeld, gelden de metrologische voorschriften in de [artikelen 3.9.27 tot en met 3.9.31][ref1] bij
      nominale omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.26
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.27
    text: |-
      De responsietijd bij de typekeuring voor een aanwijzing die ten hoogste 10% verschilt van de definitieve aanwijzing
      van de gemeten grootheid mag niet meer dan 20 seconden bedragen; bij het bepalen van de responsietijd wordt gebruik
      gemaakt van een gas, waarvan het koolmonoxidegehalte gedurende de meettijd niet meer dan 2% varieert.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.27
  - number: 3.9.28
    text: |-
      Bij nominale temperatuur mag bij de typekeuring het resultaat van een meting die wordt verricht met een gas waarvan
      het koolmonoxidegehalte gedurende de meettijd niet meer dan 2% varieert, in een periode van 4 uur na de opwarming
      van het toestel niet meer dan 0,2% vol CO bedragen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.28
  - number: 3.9.29
    text: |-
      De maximale afwijking bij de typekeuring tussen 5 onmiddellijk op elkaar volgende metingen van het
      koolmonoxidegehalte van een gas waarvan het koolmonoxidegehalte gedurende de meettijd niet meer dan 2% varieert mag
      niet meer dan 0,2% vol CO bedragen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.29
  - number: 3.9.30.1
    text: |-
      Indien de koolmonoxidemeter bij de typekeuring door één van de in paragraaf 9.2.2 vermelde factoren wordt
      beïnvloed, mag de aanwijzing van het koolmonoxidegehalte niet meer dan 0,8 maal de in [artikel 3.9.31][ref1]
      vermelde waarden variëren.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.30
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.30.2
    text: |-
      In geen elk geval mag bij de typekeuring de algebraïsche som van de variaties die aan het gelijktijdig optreden
      van verschillende beïnvloedingsfactoren te wijten zijn, een waarde overschrijden die gelijk is aan de in
      [artikel 3.9.31][ref1] vermelde maximale fout.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.30
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.30.3
    text: |-
      Indien de koolmonoxidemeter bij de eerste keuring wordt beïnvloed door variatie in de samenstelling van de gassen,
      mag de aanwijzing van het koolmonoxidegehalte niet meer dan de in [artikel 3.9.31, tweede lid][ref1], vermelde
      waarde variëren.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.30
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.31.1
    text: De maximale fout bij de typekeuring bedraagt 0,25% vol CO in plus en min.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.31
  - number: 3.9.31.2
    text: Bij de eerste keuring van koolmonoxidemeters bedraagt de maximale fout 0,3% vol CO in plus en min.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.31
  - number: 3.9.31.3
    text: Bij de herkeuring van koolmonoxidemeters bedraagt de maximale fout 0,4% vol CO in plus en min.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.31
  - number: 3.9.32
    text: 'Gecertificeerd kalibratiegas moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.32
  - number: 3.9.32.a
    text: 'het gasmengsel moet bestaan uit de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.32
  - number: 3.9.32.a.1
    text: koolmonoxyde met een gehalte tussen 4% vol CO en 5% vol CO met een relatieve onzekerheid van ten hoogste 2%, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.32
  - number: 3.9.32.a.2
    text: No;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.32
  - number: 3.9.32.b
    text: |-
      het gasmengsel moet verpakt zijn in een door de dienst voor het Stoomwezen goedgekeurde aluminium fles en in die
      verpakking gecertificeerd zijn op de wijze aangegeven in [artikel 3.9.33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.32
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.9.33
    text: 'De certificatie geschiedt:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
  - number: 3.9.33.a
    text: |-
      door middel van een genummerd certificaat overeenkomstig het model in [bijlage A][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
    references:
      - id: ref1
        bwb_id: BWBR0009237
  - number: 3.9.33.b
    text: |-
      door middel van een etiket of een soortgelijke, op duurzame wijze aangebrachte voorziening op de fles waarin het
      gas zich bevindt, duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar, vermeldende:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
  - number: 3.9.33.b.1
    text: '“gehalte: % vol C”, met het werkelijk gehalte ingevuld;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
  - number: 3.9.33.b.2
    text: het nummer van het bijbehorende certificaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
  - number: 3.9.33.b.3
    text: |-
      de naam van de ingevolge [artikel 2.11][ref1] erkende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.9.33.c
    text: |-
      in geval het gas zich bevindt in flessen die bestemd zijn voor eenmalig gebruik, kan, in afwijking van het
      bepaalde in de onderdelen a en b, certificatie ook geschieden door het onverbrekelijk op de fles aanbrengen
      van een certificaat, bestaande uit een etiket of een soortgelijke, op duurzame wijze aangebrachte voorziening,
      waarop duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar is vermeld: a. de naam van de ingevolge
      [artikel 2.11][ref1] erkende inrichting; b. het certificatienummer; c. “Samenstelling CO: % vol”, met het werkelijk
      gehalte ingevuld en “N₂ : rest”; d. de datum van certificering; e. de handtekening van een tot tekening bevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.33
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.9.34.1
    text: |-
      Het bepaalde in [artikel 1.2, eerste lid][ref1], geldt niet voor koolmonoxidemeters die in gebruik zijn genomen
      vóór 1 januari 1984.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.34
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.9.34.2
    text: |-
      Hulpinrichtingen die in gebruik zijn genomen vóór de datum van inwerkingtreding van deze regeling hoeven niet te
      voldoen aan het bepaalde in [artikel 1.20][ref1] met uitzondering van de eis dat deze hulpinrichtingen de goede
      werking van het meetmiddel niet mogen verstoren en voorts geen aanleiding tot misleiding of misvatting mogen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.34
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.9.35
    text: |-
      Kalibratiegas gecertificeerd vóór inwerkingtreding van deze regeling mag, in afwijking van het bepaalde in
      [artikel 3.9.33][ref1], zijn voorzien van het certificaat als bedoeld in Bijlage VII bij het Meetbesluit CO/roet
      motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.9.35
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 3.10.1
    text: 'Het koplamptestapparaat moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.10.1.a
    text: |-
      indien de stralenbundel van een koplamp met ingeschakeld dimlicht op de lens van het apparaat wordt geprojecteerd,
      moet de lens een beeld weergeven dat in verhouding nauwkeurig overeenkomt met het beeld dat door de stralenbundel
      wordt gevormd op een verticale wand die zich op 10 m van de koplamp bevindt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.10.1.b
    text: |-
      het projectievlak van het apparaat dient zodanig te zijn uitgevoerd of te kunnen worden versteld, dat hierop direct
      de minimale en maximale hoogte-afstelling van de koplampen voor iedere beladingstoestand van alle voertuigen kan
      worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.10.1.c
    text: |-
      de verstelbaarheid van het apparaat in verticale richting moet zodanig zijn dat koplampen waarvan de onderzijde
      zich ten minste 0,35 m en de bovenzijde ten hoogste 1,20 m boven het wegdek bevindt, met het apparaat kunnen worden
      gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.10.1.d
    text: |-
      het apparaat moet zijn voorzien van een inrichting waarmee het met een nauwkeurigheid van 5 graden in plus en in
      min ten opzichte van de lengtehartlijn van het voertuig kan worden gericht. Indien het apparaat is gemonteerd op
      rails, moet het ten opzichte van de rails ten minste 5 graden naar links en naar rechts kunnen zwenken;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.10.1.e
    text: de afstelling van het apparaat moet op eenvoudige wijze kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.10.1
  - number: 3.11.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.a
    text: 'automatische controle-inrichting: een controle-inrichting die functioneert zonder tussenkomst van de gebruiker;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.b
    text: |-
      automatische justeerinrichting: voorziening die de justering van het instrument volgens het programma uitvoert,
      zonder dat de gebruiker invloed heeft op het starten van deze justering of de grootte ervan;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.c
    text: 'CO: koolmonoxide;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.d
    text: 'CO₂: kooldioxide;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.e
    text: |-
      controle-inrichting: een voorziening, ingebouwd in een instrument, die het mogelijk maakt om significante fouten
      vast te stellen en daarop te reageren. Onder “reageren op” wordt hier elke duidelijke reactie van het instrument
      (zoals bv. een waarschuwingslamp, geluidssignaal, het afbreken van de meting) verstaan;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.f
    text: 'filter: voorziening die bepaalde bestanddelen uit het uitlaatgasmonster verwijdert;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.g
    text: |-
      gasbehandelingssysteem: alle delen van het instrument, van de sonde tot de afvoer van de gasmonsters, waardoor het
      monster van het uitlaatgas wordt gepompt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.h
    text: 'HC: n-hexaan: koolwaterstoffen;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.i
    text: |-
      interne justeerinrichting: voorziening om het instrument af te regelen op een vastgestelde waarde zonder gebruik te
      maken van een kalibratie-gas;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.j
    text: |-
      justeerinrichting met kalibratie-gas: voorziening om het instrument af te regelen op de waarde van een kalibratie-
      gas;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.k
    text: |-
      kalibratie-gas: een stabiel gasmengsel met bekende samenstelling, gebruikt voor de periodieke controle en diverse
      keuringen van het instrument;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.l
    text: |-
      lambda: dimensieloos getal dat een maat is voor de volledigheid van de verbranding in een motor, uitgedrukt als de
      verhouding van lucht en brandstof in de uitlaatgassen. De waarde wordt vastgesteld met een vastgestelde formule;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.m
    text: 'nulstelinrichting: voorziening om de aanwijzing van het instrument op nul in te stellen;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.n
    text: |-
      opwarmtijd: de tijd die verstrijkt tussen het moment dat het instrument onder spanning wordt gebracht en het moment
      waarop het instrument kan voldoen aan de metrologische eisen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.o
    text: O₂ zuurstof;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.p
    text: |-
      referentie-omstandigheden: gebruiksomstandigheden, voorgeschreven voor het onderzoek naar de prestaties van een
      instrument, of voor de vergelijking van meetresultaten;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.q
    text: |-
      responsietijd: het tijdsinterval tussen het moment waarop het instrument wordt onderworpen aan een voorgeschreven
      plotselinge verandering in de samenstelling van een gasmengsel en het moment dat de aanwijzing binnen
      voorgeschreven grenzen overeenkomt met de uiteindelijke stabiele waarde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.r
    text: |-
      semi-automatische justeerinrichting: voorziening die de gebruiker in staat stelt een justering van het instrument
      te starten zonder daarbij de mogelijkheid te hebben de grootte van de justering te beïnvloeden, ongeacht of de
      justering automatisch wordt vereist. Bij die instrumenten waarbij de waarden van de volume-bestanddelen van het
      standaard gasmengsel met de hand in het instrument moeten worden ingevoerd, wordt deze voorziening geacht semi-
      automatisch te zijn;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.s
    text: |-
      sonde: het deel van het gasbehandelingssysteem, dat in de uitlaat van een voertuig wordt geschoven voor het nemen
      van gasmonsters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.t
    text: |-
      uitlaatgastester: meetmiddel, bestemd voor het meten van het gehalte CO en van lambda van de uitlaatgassen,
      afkomstig van draaiende motoren met elektrische ontsteking van in gebruik zijnde motorrijtuigen, en dat het
      meetresultaat van CO direct in volumeprocenten aangeeft, al dan niet tezamen met het volumegehalte van andere, in
      de uitlaatgassen voorkomende bestanddelen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.1.u
    text: |-
      waterafscheider: inrichting die zoveel water verwijdert dat in het gasbehandelingssysteem daarachter condensatie
      wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.1
  - number: 3.11.2
    text: |-
      Uitlaatgastesters uitsluitend ingericht voor het meten van koolmonoxide die in gebruik zijn genomen na 31 december
      1997 moeten voldoen aan de in deze paragraaf gestelde eisen met uitzondering van de eisen ten aanzien van de meting
      van CO2, HC, O2 en lambda.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.2
  - number: 3.11.3
    text: |-
      In de handleiding behorende bij de uitlaatgastester moet naast de informatie genoemd in [artikel 1.15][ref1], het
      volgende zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.11.3.a
    text: |-
      de tijdsintervallen en procedures voor de justering en het onderhoud die moeten worden gevolgd opdat voortdurend
      wordt voldaan aan de eisen met betrekking tot de maximale fouten;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.b
    text: de tijdsintervallen tussen de automatische controles op gaskalibratie en lek;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.c
    text: |-
      een beschrijving van de procedure voor de lektest (deze lektest moet voldoende nauwkeurig zijn om het in
      [artikel 3.11.9, achtste lid][ref1], gespecificeerde lek te detecteren);


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '11'
  - number: 3.11.3.d
    text: |-
      een instructie aan de gebruiker dat voorafgaande aan elke HC meting een controle op het HC-residu moet
      plaatsvinden, inclusief een beschrijving van de procedure voor de controle op het HC-residu;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.e
    text: de maximale en minimale opslagtemperatuur;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.f
    text: een opgave van de gebruiksomstandigheden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.g
    text: in het geval dat een lambda waarde wordt berekend, een beschrijving van de toegepaste berekening, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.3.h
    text: een instructie voor de vervanging van de zuurstofbrandstofcel.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.3
  - number: 3.11.4.1
    text: |-
      De uitlaatgastester moet, naast de in [artikel 1.14, eerste lid][ref1], genoemde opschriften, zijn voorzien van een
      opschrift dat het minimale en het nominale debiet aangeeft alsmede het merk en type van de zuurstofbrandstofcel.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.4
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.11.4.2
    text: |-
      Bij elke uitlaatgastester moet de waarde van de propaan-equivalentiefactor (PEF) zijn aangebracht op de voorzijde
      van het instrument of zichtbaar gemaakt kunnen worden op de aanwijsinrichting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.4
  - number: 3.11.5.1
    text: |-
      Het aandeel van de gasvormige componenten moet worden aangewezen in volume % voor CO, CO2 en O2, en in volume-
      ppm (delen per miljoen) voor HC. De aanduidingen van deze eenheden moeten ondubbelzinnig zijn verbonden met de
      aangewezen waarde, bijvoorbeeld: % vol CO, % vol CO₂, % vol O₂ en ppm vol HC.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.5
  - number: 3.11.5.2
    text: 'De afleeseenheid mag niet meer bedragen dan de volgende waarden:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.5
  - number: 3.11.6
    text: |-
      De meetbereiken voor elk der componenten moeten ten minste de volgende waarden hebben:




                  CO


                  CO-2


                  O-2


                  HC






                  (0 - 5)% vol


                  (0 - 16)% vol


                  (0 - 21)% vol


                  (0 - 2000) ppm vol
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.6
  - number: 3.11.7
    text: |-
      De maximale fout in de aanwijzing van de uitlaatgastester bij typekeuring, onder referentie-omstandigheden, en bij
      eerste keuring en herkeuring, onder gebruiksomstandigheden, bedraagt:





                  Grootste waarde van:


                  CO


                  CO-2


                  O-2


                  HC






                  onder referentie-omstandigheden


                  absolute afwijking (volume)


                  0,06%


                  0,4%


                  0,1%


                  12 ppm







                  relatieve afwijking


                  3%


                  4%


                  3%


                  5%




                  onder gebruiksomstandigheden


                  absolute afwijking (volume)


                  0,06%


                  0,5%


                  0,1%


                  12 ppm





                  relatieve afwijking


                  5%


                  5%


                  5%


                  5%
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.7
  - number: 3.11.8.1
    text: |-
      De in [artikel 3.11.7][ref1], genoemde maximale fouten onder gebruiksomstandigheden, mogen onder de volgende
      condities niet worden overschreden:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '11'
  - number: 3.11.8.1.a
    text: |-
      de in [artikel 1.13, derde lid][ref1], genoemde gebruiksomstandigheden;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.11.8.1.b
    text: 'relatieve luchtvochtigheid: tot 90% R.V.;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.1.c
    text: 'atmosferische druk: (860 – 1060) hPa.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2
    text: |-
      De keuringen, met uitzondering van onderzoek naar de invloed van temperatuur, luchtvochtigheid, luchtdruk
      en voedingsspanning en – frequentie, in het kader van typekeuringen, worden uitgevoerd onder de volgende
      omstandigheden:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2.a
    text: temperatuur (20 ± 2) °C;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2.b
    text: 'relatieve luchtvochtigheid: (55 ± 5)% R.V.;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2.c
    text: 'atmosferische druk: stabiele omgevingsdruk;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2.d
    text: nominale voedingsspanning ± 2%;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.2.e
    text: nominale frequentie van de voedingsspanning ± 1%.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.3
    text: |-
      De invloed van andere gascomponenten dan het te meten gas mag niet groter zijn dan de helft van de maximale fout
      onder gebruiksomstandigheden, indien deze andere gassen ten hoogste in de volgende volume-delen voorkomen: 16% vol
      CO₂, 6% vol CO, 10% vol O₂, 5% vol H₂, 0,3% vol NO, 2000 ppm vol HC (als n-hexaan) en waterdamp tot verzadiging.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.4
    text: |-
      De volgende verstoringen mogen geen invloed hebben die groter is dan de maximale fout bij eerste keuring onder
      gebruiksomstandigheden of moeten automatisch door het instrument worden gedetecteerd en aangegeven:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.4.a
    text: |-
      de in [artikel 1.18][ref1] genoemde invloeden;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.11.8.4.b
    text: mechanische schokken, veroorzaakt door een vrije val over 25 mm door een der hoekpunten op een vast oppervlak.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.5
    text: 'Bij de meting van:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.5.a
    text: |-
      CO, CO2 en HC moet een instrument, met inbegrip van het bijbehorende systeem voor gasbehandeling, bij onderzoek met
      standaard gasmengsels binnen 15 seconde 95% van de uiteindelijke waarde aanwijzen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.5.b
    text: |-
      O2 moet een instrument, na overschakeling van lucht op een zuurstof-vrij standaard gasmengsel, binnen 60 seconde
      een waarde aanwijzen die een afwijking heeft van minder dan 0,1% vol ten opzichte van de uiteindelijke waarde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.6
    text: |-
      Na afloop van de opwarmtijd moet het instrument voldoen aan de metrologische eisen volgens dit voorschrift. De
      instrumenten moeten zijn voorzien van een voorziening waardoor wordt voorkomen dat er een aanwijzing van gemeten
      gascomponenten plaatsvindt gedurende de opwarmtijd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.7
    text: |-
      Het bestanddeel hydrocarbonaten moet worden uitgedrukt in ppm vol n-hexaan (C₆H₁₄) equivalent. De justering mag
      worden uitgevoerd met behulp van propaan (C2H2). Daartoe moet een conversie-factor, die wordt aangeduid als ‘C₃/C₆-
      factor’ of ‘PEF’ (Propaan-equivalentiefactor), permanent en duidelijk zichtbaar op het instrument zijn aangebracht,
      dan wel eenvoudig zijn op te roepen op de aanwijzing. De waarde van deze conversiefactor moet door de fabrikant
      voor elk instrument worden opgegeven in drie significante cijfers. Als de gassensor wordt vervangen of gerepareerd,
      moet een nieuwe conversiefactor op het instrument worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.8
    text: |-
      Instrumenten die zijn uitgevoerd met een aanwijzing van de lambda-waarde, moeten de betreffende berekening
      uitvoeren met behulp van de volgende formule: Hierin geldt:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.9
    text: |-
      Bij normaal gebruik van het instrument mogen de meetresultaten, na justering met een kalibratie-gas of de
      interne justeerinrichting, de maximale fouten die gelden onder gebruiksomstandigheden gedurende ten minste 4 uur
      niet overschrijden, zonder dat gedurende deze periode gebruik wordt gemaakt van een kalibratie-gas of interne
      justering door de gebruiker. Indien het instrument is uitgerust met een methode voor drift-compensatie, zoals een
      automatische nulstelling of een automatische interne justering, mag de werking van deze justeringen geen aanwijzing
      veroorzaken die kan leiden tot verwarring met een meting van een extern gas.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.8.10
    text: |-
      Indien door dezelfde persoon met hetzelfde instrument binnen relatief korte tijd 20 opeenvolgende metingen aan
      hetzelfde standaard gasmengsel worden uitgevoerd, mag de standaarddeviatie van deze 20 resultaten niet groter zijn
      dan een derde van de absolute waarde van de maximaal toelaatbare fout onder gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.8
  - number: 3.11.9.1
    text: |-
      Alle onderdelen van het gasbehandelingssysteem moeten zijn vervaardigd van materialen die bestand zijn tegen
      corrosie; in het bijzonder moet het materiaal van de sonde bestand zijn tegen de temperatuur van uitlaatgassen. De
      gebruikte materialen mogen de samenstelling van het gasmonster niet beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.2
    text: |-
      De sonde moet zodanig zijn ontworpen dat deze ten minste 30 cm in de uitlaatpijp van het voertuig kan worden
      gebracht en dat deze, ongeacht de insteekdiepte, door een bevestiging op zijn plaats wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.3
    text: |-
      Het gasbehandelingssysteem moet zijn voorzien van een filter, met regenereerbare of verwisselbare elementen,
      dat bestanddelen met een diameter groter dan 5 μm verwijdert. Het instrument moet gedurende ten minste ½ uur
      kunnen worden gebruikt met uitlaatgas van een automotor dat een HC bestanddeel van ca. 800 ppm vol bevat. Het
      moet mogelijk zijn de mate van vervuiling van het filter vast te stellen zonder dat dit verwijderd moet worden.
      Filterelementen moeten, indien nodig, eenvoudig en zonder gebruik van speciaal gereedschap kunnen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.4
    text: 'Het gasbehandelingssysteem moet een waterafscheider bevatten, die:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.4.a
    text: voorkomt dat water voorbij deze waterafscheider op oppervlakken in het instrument condenseert;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.4.b
    text: automatisch wordt geleegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.5
    text: |-
      Het gasbehandelingssysteem moet, behalve van een aansluiting voor de sonde, zijn voorzien van afzonderlijke
      aansluitingen voor:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.5.a
    text: de toevoer van omgevingslucht als referentie voor de nulstelling van het instrument;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.5.b
    text: de toevoer van het kalibratie-gas.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.6
    text: 'De pomp waarmee het gas wordt aangezogen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.6.a
    text: moet zodanig zijn gemonteerd dat zijn trillingen de metingen niet beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.6.b
    text: |-
      moet onafhankelijk van de overige delen van het instrument in- en uitgeschakeld kunnen worden, waarbij het echter
      niet mogelijk mag zijn een meting te doen bij uitgeschakelde pomp.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.7
    text: |-
      Het instrument moet een inrichting bevatten, waarmee wordt aangegeven wanneer de gasstroom daalt tot een niveau dat
      zou veroorzaken dat:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.7.a
    text: de responsietijd wordt overschreden, of
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.7.b
    text: |-
      de invloed op de aanwijzing groter is dan de helft van de absolute waarde van de maximale fout onder
      gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.8
    text: |-
      Het gasbehandelingssysteem moet zodanig luchtdicht zijn dat de invloed op het meetresultaat door verdunning met
      omgevingslucht niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.8.a
    text: 'voor CO, CO₂ en HC: de helft van de absolute waarde van de maximale fout onder gebruiksomstandigheden;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.9.8.b
    text: 'voor O₂: 0,1% vol.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.9
  - number: 3.11.10
    text: |-
      Uitlaatgastesters mogen zijn voorzien van een geïntegreerde toerenteller mits deze voldoet aan de eisen gesteld in
      paragraaf 2 van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.10
  - number: 3.11.11.1
    text: |-
      Indien het instrument is uitgevoerd met één of meer automatische controle-inrichting (en), moet het mogelijk zijn
      het juiste functioneren hiervan te controleren.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.11
  - number: 3.11.11.2
    text: |-
      Bij een uitlaatgastester moet, door middel van een controle-inrichting voor het vaststellen van restanten HC-gas,
      zijn gewaarborgd dat, voordat een meting kan plaatsvinden, de aangewezen waarde voor een monster omgevingslucht
      door de sonde minder is dan 20 ppm vol hexaan.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.11
  - number: 3.11.11.3
    text: |-
      Een instrument met een O₂-kanaal moet zijn uitgevoerd met een voorziening die verouderen van de sensor automatisch
      detecteert.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.11
  - number: 3.11.12.1
    text: |-
      Voor zover het instrument is voorzien van een voor de gebruiker toegankelijke justering moet deze justering
      plaatsvinden door middel van een semi-automatische justeerinrichting waarmee uitsluitend een nulstelling kan
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.12.2
    text: |-
      Indien bij een instrument, uitgevoerd met een automatische of semi-automatische justeerinrichting, justering
      noodzakelijk is, mag geen meting mogelijk zijn alvorens de juiste justeringen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.12.3
    text: |-
      Zowel bij een automatische als semi-automatische justeerinrichting is een signalering toegestaan voor een noodzaak
      tot justering.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.12.4
    text: |-
      Als tijdelijke voorwaarde als bedoeld in [artikel 1.6, vierde lid][ref1], geldt dat een instrument moet worden
      gejusteerd met een gecertificeerd kalibratiegas met een interval gelijk aan de helft van de periode die op
      grond van [artikel 1.13, vijfde lid][ref2], door de aanbieder bij het typeonderzoek wordt opgegeven als beoogd
      justeerinterval. Deze tijdelijke voorwaarde wordt omgezet in een definitieve voorwaarde op basis van een onderzoek
      zoals bedoeld in [artikel 1.6, vierde lid][ref3] verricht aan vijf verzegelde instrumenten geplaatst in een
      representatieve gebruikssituatie. Het onderzoek vindt plaats door middel van een aantal op vaste tijdsafstanden
      uitgevoerde controles gedurende een periode waarin alle in het onderzoek betrokken instrumenten aan de eisen
      voor de maximale fout onder bedrijfsomstandigheden voldoen, doch ten hoogste gedurende een periode gelijk aan het
      beoogde justeerinterval. Het aantal controles is gelijk aan het aantal maanden van het beoogde justeerinterval met
      een minimum van drie controles.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.11.12.5
    text: 'Indien bij dit onderzoek gedurende het beoogde justeerinterval blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.12.5.a
    text: |-
      alle in het onderzoek betrokken instrumenten aan de eisen voor de maximale fout onder bedrijfsomstandigheden
      voldoen wordt het definitieve justeerinterval vastgesteld op het beoogde justeerinterval;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.12.5.b
    text: |-
      één of meer instrumenten niet voldoen aan de eisen voor de maximale fout onder gebruiksomstandigheden blijft
      het tijdelijk vastgestelde justeerinterval zoals bedoeld in lid 4 van kracht tenzij één of meer instrumenten
      reeds binnen de periode van dit tijdelijk vastgestelde justeerinterval niet aan deze eisen voldoen. In dit
      geval wordt een nieuw tijdelijk vastgesteld justeerinterval van kracht gelijk aan de helft van de periode waarin
      alle instrumenten aan deze eisen bleken te voldoen. In elk geval wordt hierna een nieuw onderzoek uitgevoerd
      overeenkomstig het vierde lid echter voor een beoogd justeerinterval gelijk aan het gehele aantal maanden waarvoor
      alle instrumenten in het voorgaande onderzoek aan de eisen voor de maximale fout onder bedrijfsomstandigheden
      bleken te voldoen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.12
  - number: 3.11.13.1
    text: |-
      Gecertificeerd kalibratiegas moet voldoen aan de volgende eisen: Het gasmengsel moet bestaan uit de volgende
      componenten in draaggas N₂:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.13
  - number: 3.11.13.2
    text: |-
      Een gecertificeerd kalibratiegas moet zijn vervaardigd door een ingevolge [artikel 2.11][ref1] erkende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.11.13.3
    text: |-
      Een fles met gecertificeerd kalibratiegas moet zijn voorzien van een certificaat waarop tenminste de samenstelling,
      de datum van vervaardiging en de naam van de ingevolge [artikel 2.11][ref1] erkende inrichting is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.11.14
    text: 'Uitlaatgastesters in gebruik genomen vóór 1 januari 1998:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.11.14
  - number: 3.11.14.a
    text: |-
