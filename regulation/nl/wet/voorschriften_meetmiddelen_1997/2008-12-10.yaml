---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: voorschriften_meetmiddelen_1997
regulatory_layer: WET
publication_date: '2009-04-29'
valid_from: '2008-12-10'
bwb_id: BWBR0009237
url: https://wetten.overheid.nl/BWBR0009237/2008-12-10
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke ordening en Milieubeheer;

    Gelet op de artikelen 84 en 101 van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.a
    text: |-
      aanwijsbereik: het bereik begrensd door de laagste en hoogste waarde waarvoor het instrument een meetwaarde
      presenteert of registreert;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.b
    text: |-
      afleeseenheid: de waarde, uitgedrukt in de eenheid van de gemeten grootheid, van het verschil tussen de
      aanwijzingen bij naast elkaar liggende schaaldeelstrepen voor analoog aanwijzende instrumenten of van het kleinste
      verschil tussen de aanwijzingen bij digitaal aanwijzende meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.c
    text: |-
      certificaat van eerste keuring: het certificaat afgegeven naar aanleiding van de eerste keuring van een bepaald
      meetmiddel, waarin de overeenstemming van de individuele eigenschappen van het meetmiddel met het ingevolge deze
      regeling goedgekeurde type wordt bevestigd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.d
    text: |-
      certificaat van herkeuring: het certificaat afgegeven naar aanleiding van de herkeuring van een in gebruikzijnd
      meetmiddel, waarin de overeenstemming van de individuele eigenschappen van het meetmiddel met de eisen van deze
      regeling worden herbevestigd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.e
    text: |-
      keuringsinstelling: de ingevolge [artikel 84, eerste lid][ref1], en [artikel 101, eerste lid, van de wet][ref2]
      door de Minister aangewezen instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
  - number: 1.1.f
    text: |-
      datum ingebruikname: datum waarop het meetmiddel aantoonbaar in gebruik is genomen ten behoeve van de controle van
      de in [hoofdstuk 5 van het Voertuigreglement][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
  - number: 1.1.g
    text: |-
      eerste keuring: de keuring die voor de eerste maal wordt verricht aan een bepaald meetmiddel. Bij de eerste keuring
      wordt de overeenstemming met het goedgekeurde type onderzocht alsook de exemplaargebonden eigenschappen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.h
    text: |-
      fout: de afwijking in positieve of in negatieve zin van een aangewezen of geregistreerde waarde van de werkelijke
      waarde. De fout kan zijn weergegeven als een vaste waarde uitgedrukt in de meetgrootheid, dan wel zijn weergegeven
      als een relatieve fout, uitgedrukt in procenten van de werkelijke waarde van de gemeten grootheid;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.i
    text: |-
      herkeuring: de keuring die na een vastgestelde periode, dan wel als gevolg van een reparatie of justering moet
      worden uitgevoerd. Bij deze keuring worden vooral de eigenschappen onderzocht die door gebruik en tijd kunnen
      wijzigen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.j
    text: |-
      hulpinrichting: inrichting die in combinatie met het meetmiddel kan worden gebruikt, doch die voor de primaire
      meetfunctie van het meetmiddel niet nodig of voorgeschreven is;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.k
    text: 'invloedsfactor: een invloedsgrootheid met een waarde liggend binnen de vastgelegde gebruiksomstandigheden;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.l
    text: |-
      invloedsgrootheid: een grootheid die geen onderwerp van de meting is, maar die de waarde van de te meten grootheid
      of de aanwijzing van het instrument beïnvloedt, zoals de omgevingstemperatuur;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.m
    text: 'keuring: de aanduiding voor de typekeuring, de eerste keuring en de herkeuring;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.n
    text: 'keuringscertificaat: een certificaat van eerste keuring dan wel van herkeuring;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.o
    text: 'maximale fout: de maximaal toelaatbare waarde van de fout geldend voor een bepaald soort meetmiddel;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.p
    text: 'Minister: de Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.q
    text: |-
      onderzoeksgerechtigde: een onderneming of instelling die op grond van hoofdstuk 2, paragraaf 2, van deze regeling
      door een keuringsinstelling is erkend tot het mogen afgeven van certificaten van herkeuring ten aanzien van nader
      bepaalde categorieën in gebruik zijnde meetmiddelen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.r
    text: |-
      primair meetsignaal: het in apparatuur met elektronische signaalverwerking aanwezige analoge of digitale
      meetsignaal dat een getrouwe, niet beïnvloedde weergave is van de gemeten grootheid. In dit meetsignaal zijn alle
      relevante dynamische verschijnselen van de gemeten grootheid proportioneel aanwezig;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.s
    text: 'registratie: vastlegging van een meetresultaat hetzij getalsmatig of analoog;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.t
    text: 'registratie-inrichting: inrichting voor het vastleggen van meetresultaten, zoals een afdrukinrichting;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.u
    text: |-
      testaansluiting: voorziening in het meetmiddel, waardoor het mogelijk is bij de keuring zowel het primaire
      meetsignaal van praktijkmetingen te bemonsteren alsook gesimuleerde primaire meetsignalen aan te bieden aan
      het signaalverwerkende gedeelte van het instrument. Met eventueel noodzakelijke buffering is de testaansluiting
      opgenomen als een schakel in het normale signaalpad;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.v
    text: |-
      typekeuring: de keuring van een meetmiddel, waarbij de type-gebonden eigenschappen worden onderzocht. Een
      typekeuring vindt eenmaal plaats voor een bepaald type meetmiddel;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.w
    text: |-
      typekeuringscertificaat: het certificaat afgegeven naar aanleiding van een typekeuring van een bepaald
      meetmiddel-type, waarin de karakteristieke eigenschappen van het desbetreffende meetmiddel zijn vastgelegd en de
      overeenstemming van die eigenschappen met de eisen van deze regeling wordt bevestigd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.x
    text: |-
      vastgelegde gebruiksomstandigheden: gebruiksomstandigheden, beschreven door vastgelegde maximale waarden van
      invloedsgrootheden, waaronder het meetinstrument aan de maximaal fout moet voldoen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.y
    text: |-
      verstoring: een invloedsgrootheid met een waarde buiten de vastgelegde gebruiksomstandigheden, dan wel een
      invloedsgrootheid waarvoor de gebruiksomstandigheden niet zijn vastgelegd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.z
    text: |-
      wet: [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.1.aa
    text: |-
      justering: de handeling die is bedoeld om een instrument in een zodanige toestand te brengen dat het geschikt is
      voor zijn gebruik;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.ab
    text: |-
      analoge aanwijzing: aanwijzing die de gemeten waarde weergeeft als een continue of nagenoeg continue functie door
      middel van een index langs een schaalverdeling;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.ac
    text: 'digitale aanwijzing: aanwijzing die de gemeten waarde uitsluitend getalsmatig weergeeft;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.ad
    text: |-
      testcertificaat: het certificaat afgegeven naar aanleiding van een typekeuring van een bepaalde hulpinrichting of
      onderdeel van een meetmiddel, waarin de karakteristieke eigenschappen van die hulpinrichting of dat onderdeel zijn
      vastgelegd en de overeenstemming van die eigenschappen met de eisen van deze regeling wordt bevestigd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1.ae
    text: |-
      controlecertificaat: het certificaat afgegeven naar aanleiding van een eerste en periodieke controle van een in
      gebruik zijnde hulpinrichting, waarin de overeenstemming van de individuele eigenschappen van de hulpinrichting met
      de eigenschappen van deze regeling worden herbevestigd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1
  - number: 1.1a
    text: |-
      Onder de vermelding in deze regeling van een EG-richtlijn wordt verstaan hetgeen daaronder
      wordt begrepen in [artikel 1.1a van het Voertuigreglement][ref1], met inbegrip van de ingevolge
      [artikel 1.7, eerste lid, van het Voertuigreglement][ref2] bekendgemaakte wijzigingen.
      [Artikel 1.7, tweede lid, van het Voertuigreglement][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006746
        artikel: '1'
  - number: 1.2.1
    text: |-
      De volgende meetmiddelen moeten zijn typegoedgekeurd aan de hand van de in [hoofdstuk 1][ref1] en [3][ref2]
      opgenomen algemene respectievelijk specifieke eisen, ten bewijze waarvan een typekeuringscertificaat wordt
      afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.2.1.a
    text: roetmeters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.b
    text: toerentellers;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.c
    text: olietemperatuurmeters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.d
    text: manometers;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.e
    text: pedaalkrachtmeters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.f
    text: remvertragingsmeters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.g
    text: rollenremtestbanken;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.h
    text: platenremtestbanken;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.i
    text: koolmonoxidemeters;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.1.j
    text: uitlaatgastesters met lambdabepaling.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
  - number: 1.2.2
    text: |-
      De in het eerste lid bedoelde meetmiddelen moeten tevens een eerste keuring en na verloop van de in
      [artikel 1.8][ref1] genoemde termijn een herkeuring ondergaan, ten bewijze waarvan een certificaat van eerste
      keuring respectievelijk van herkeuring wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.3.1
    text: |-
      Kalibratiegas ten behoeve van koolmonoxidemeters moet gecertificeerd zijn op grond van de in
      [hoofdstuk 3, paragraaf 9.3][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '9'
  - number: 1.3.2
    text: |-
      Koplamptestapparaten moeten voldoen aan het bepaalde in [hoofdstuk 3, paragraaf 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
        paragraaf: '10'
  - number: 1.4.1
    text: |-
      Met de in deze regeling opgenomen technische eisen worden gelijkgesteld de technische eisen die in een andere
      lidstaat van de Europese Unie dan wel een staat die partij is bij de overeenkomst inzake de Europese Economische
      Ruimte zijn vastgesteld en die als gelijkwaardig kunnen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.4
  - number: 1.4.2
    text: |-
      Met de in deze regeling bedoelde certificaten van goedkeuring worden gelijkgesteld certificaten van goedkeuring
      afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van de Europese Unie dan wel in een
      staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte, welke verklaring is afgegeven op
      basis van onderzoekingen die aan ten minste gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.4
  - number: 1.5.1
    text: |-
      Indien bij de in [artikel 1.2][ref1], bedoelde keuringen bijzondere hulpmiddelen of informatie benodigd zijn, kan
      degene die het meetmiddel ter keuring aanbiedt verzocht worden deze ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.5.2
    text: |-
      Het niet beschikbaar stellen van noodzakelijke hulpmiddelen of informatie kan leiden tot het niet goedkeuren van
      het meetmiddel.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.5
  - number: 1.6.1
    text: Het typekeuringscertificaat en het certificaat van eerste keuring worden afgegeven door een keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.6
  - number: 1.6.2
    text: Het certificaat van herkeuring wordt afgegeven door een keuringsinstelling dan wel een onderzoeksgerechtigde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.6
  - number: 1.6.3
    text: |-
      Het certificeren van kalibratiegas ten behoeve van koolmonoxidemeters geschiedt door een keuringsinstelling
      ingevolge [artikel 2.11][ref1] erkende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1.6.4
    text: |-
      Voorzover dit in de specifieke eisen van [hoofdstuk 3][ref1] is bepaald wordt in het typekeuringscertificaat
      een tijdelijke voorwaarde opgenomen met betrekking tot daar genoemde aspecten. Deze tijdelijke voorwaarde moet
      binnen de termijn genoemd in het typegoedkeuringscertificaat zijn komen te vervallen dan wel zijn omgezet in een
      definitieve voorwaarde op grond van een in [hoofdstuk 3][ref2] vereist onderzoek naar de gedragingen in de praktijk
      van een representatief aantal meetmiddelen uitgevoerd door de keuringsinstelling op kosten van de aanvrager van
      de typekeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: '1.7'
    text: 'Een typekeuringscertificaat is niet langer geldig indien:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.7
  - number: 1.7.a
    text: |-
      een wijziging in het meetmiddel wordt aangebracht, waardoor de meetwaarden zoals deze in de praktijk kunnen worden
      verkregen niet meer voldoen aan de maximale fout,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.7
  - number: 1.7.b
    text: |-
      een wijziging in het meetmiddel wordt aangebracht die in strijd is met het typekeuringscertificaat of de
      bijbehorende beschrijving, of
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.7
  - number: 1.7.c
    text: de voorschriften worden gewijzigd en het meetmiddel niet meer voldoet aan de gewijzigde voorschriften;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.7
  - number: 1.7.d
    text: |-
      de in [artikel 1.6, vierde lid][ref1], genoemde termijn is verstreken, waarbinnen de daar bedoelde tijdelijke
      voorwaarde moet zijn vervallen dan wel moet zijn omgezet in een definitieve voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.8.1
    text: De geldigheidsduur van een keuringscertificaat bedraagt 12 maanden.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.2
    text: De geldigheidsduur van een keuringscertificaat vangt aan met ingang van de datum van afgifte daarvan.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.3
    text: |-
      Indien een keuringscertificaat wordt afgegeven binnen twee maanden vóór het tijdstip waarop de in het eerste lid
      genoemde termijn verstrijkt, vangt de geldigheidsduur van het keuringscertificaat aan met ingang van dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.4
    text: 'Een keuringscertificaat verliest zijn geldigheid indien:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.4.a
    text: een wijziging of herstel van het meetmiddel heeft plaatsgevonden, waardoor de juistheid kan zijn veranderd,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.4.b
    text: de verzegeling is verbroken,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.4.c
    text: |-
      een zodanige mechanische of elektrische overbelasting is ontstaan, dat een juist functioneren niet meer gewaarborgd
      kan worden, of
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.4.d
    text: de geldigheidsduur verstreken is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.8.5
    text: |-
      Specifieke gebruiksomstandigheden, van belang bij de keuring en het gebruik van het meetmiddel, moeten worden
      vermeld in het keuringscertificaat.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.8
  - number: 1.9.1
    text: |-
      Een meetmiddel wordt bij de eerste keuring en bij de herkeuring voorzien van de verzegelingen die in het
      typekeuringscertificaat zijn beschreven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.9
  - number: 1.9.2
    text: 'Onder verzegeling wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.9
  - number: 1.9.2.a
    text: |-
      het aanbrengen van een beveiliging waardoor het verschaffen van toegang tot onderdelen of instellingen van een
      meetmiddel door een onbevoegde niet kan plaatsvinden zonder dat dit feit achteraf zichtbaar is door beschadiging
      van een aangebracht beveiligingsmiddel, zoals een loodzegel of een sticker;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.9
  - number: 1.9.2.b
    text: |-
      een elektronische verzegeling die kan bestaan uit een in de programmatuur opgenomen niet-terugstelbare teller,
      waarvan de inhoud automatisch wordt verhoogd indien toegang wordt verschaft tot een routine waarin beveiligde
      parameters kunnen worden aangepast. De inhoud van deze teller moet eenvoudig kunnen worden uitgelezen en moet
      overeenkomen met de waarde die in het laatste keuringscertificaat is vermeld, zolang de verzegeling niet verbroken
      is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.9
  - number: 1.9.3
    text: |-
      Na de eerste keuring en na de herkeuring wordt op het meetmiddel een goedkeuringsmerk aangebracht door de
      keuringsinstelling of, in geval van herkeuring, door een onderzoeksgerechtigde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.9
  - number: '1.10'
    text: |-
      De in [artikel 1.2][ref1] genoemde meetmiddelen moeten, tenzij anders bepaald in [hoofdstuk 3][ref2], voldoen aan
      de in deze paragraaf gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.11.1
    text: |-
      Het meetmiddel moet van een zodanige opbouw en werking zijn, dat de toetsing aan de in deze regeling gestelde eisen
      redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.11
  - number: 1.11.2
    text: |-
      Het meetmiddel moet zodanig zijn ingericht, dat er geen misverstanden kunnen ontstaan met betrekking tot de
      aangewezen of geregistreerde meetwaarde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.11
  - number: 1.11.3
    text: |-
      Het meetmiddel mag niet zijn voorzien van een voor de gebruiker toegankelijke justeerinrichting of andere
      instelinrichting die de meetnauwkeurigheid kan beïnvloeden, tenzij het gebruik van deze inrichtingen in de
      specifieke eisen is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.11
  - number: 1.11.4
    text: |-
      Het meetmiddel moet zodanige eigenschappen hebben, dat geen onredelijke eisen gesteld worden aan de vaardigheid en
      inspanning van de gebruiker.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.11
  - number: 1.12.1
    text: |-
      Bij het onderzoek naar de gevoeligheid voor invloedsfactoren wordt niet meer dan één onafhankelijke invloedsfactor
      gelijktijdig in beschouwing genomen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.12
  - number: 1.12.2
    text: |-
      In afwijking van het eerste lid geldt voor elektronische meetmiddelen die niet door het lichtnet worden gevoed dat
      gelijktijdig aan de eisen genoemd in [artikel 1.13, vierde lid][ref1] en [1.17][ref2] moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.13.1
    text: |-
      Indien in de specifieke eisen van [hoofdstuk 3][ref1] een controle-inrichting is voorgeschreven, moet de werking
      en het resultaat van deze inrichting overeenstemmen met de door de fabrikant vastgelegde specificaties. Een
      onderbouwing van de waarde van het controleresultaat gerelateerd aan de maximale fout van het meetmiddel, moet bij
      de aanbieding voor de typekeuring door de aanbieder worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.13.2
    text: |-
      De maximale fouten, genoemd in [hoofdstuk 3][ref1] gelden onder de vastgelegde gebruiksomstandigheden en bij
      gebruik van de meetmiddelen overeenkomstig de handleiding behorende bij het meetmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.13.3
    text: |-
      Indien het meetmiddel wordt blootgesteld aan een verstoring, mag een daarvan het gevolg zijnde verandering
      van de fout in de aanwijzing of registratie niet meer bedragen dan de waarde van de maximale fout, genoemd in
      [hoofdstuk 3][ref1]. Aan deze eis behoeft niet te worden voldaan indien de verstoring tot gevolg heeft dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.13.3.a
    text: het meetresultaat niet kan worden vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
  - number: 1.13.3.b
    text: |-
      het meetresultaat een zodanige fout vertoont dat de gebruiker onontkoombaar de ongeldigheid van de meting zal
      opmerken.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
  - number: 1.13.4
    text: |-
      De vastgelegde gebruiksomstandigheden voor de omgevingstemperatuur omvatten het temperatuurgebied van –10 °C tot 40
      °C. Het genoemde temperatuurgebied mag beperkt zijn tot het gebied van ten minste 5 °C tot 40 °C.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
  - number: 1.13.5
    text: |-
      Bij het onderzoek voor de typekeuring moet de aanbieder een schriftelijke verklaring overleggen waarin wordt
      bevestigd dat het meetmiddel voldoet aan de gestelde eisen. Tevens moet hij daarbij een opgave doen van de
      periode waarover het meetmiddel, bij normaal gebruik en bij correcte uitvoering van eventuele door de gebruiker te
      verrichten justeringen, wordt verwacht te voldoen aan de eisen met betrekking tot de maximale fout.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.13
  - number: 1.14.1
    text: 'Elk meetmiddel moet zijn voorzien van de volgende duidelijk leesbare en onuitwisbare opschriften:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.a
    text: het fabrikaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.b
    text: het bouwjaar;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.c
    text: de type-aanduiding;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.d
    text: het typegoedkeuringsnummer;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.e
    text: het serienummer;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.f
    text: de eenheid waarin de gemeten grootheid wordt uitgedrukt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.g
    text: het aanwijsbereik;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.h
    text: eventuele gebruiksbeperkende omstandigheden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.1.i
    text: |-
      het temperatuurgebied waarbinnen aan de eisen van het meetmiddel wordt voldaan, tenzij anders is aangegeven in
      [hoofdstuk III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.14.2
    text: |-
      Voor zover de meetmiddelen zijn voorzien van een registratie-inrichting moeten op elke registratie ten minste de
      aanduidingen genoemd in het eerste lid, onder e en f, worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.3
    text: |-
      Aanwijzingen en registraties bedoeld voor de gebruiker van het meetmiddel moeten in de Nederlandse taal zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.14.4
    text: |-
      Andere vermeldingen dan genoemd in de voorgaande leden mogen worden aangebracht mits deze geen aanleiding kunnen
      geven tot misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.14
  - number: 1.15.1
    text: |-
      Meetmiddelen zijn voorzien van een handleiding in de Nederlandse taal, tenzij anders is bepaald in
      [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: 1.15.2
    text: 'Ter beoordeling van de meetresultaten bevat de in het eerste lid bedoelde handleiding tenminste:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.a
    text: |-
      een korte en overzichtelijke procedure voor het gebruik van het meetmiddel bij de uitvoering van de algemene
      periodieke keuring van een voertuig, waaronder in elk geval wordt verstaan een stroomschema;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.b
    text: de uit te voeren controles voorafgaande aan of tijdens de metingen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.c
    text: de betekenis van een controleresultaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.d
    text: een beschrijving van eventueel door het instrument gegeven meldingen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.e
    text: de informatie benodigd voor een juiste interpretatie van het meetresultaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
  - number: 1.15.2.f
    text: |-
      de in [hoofdstuk III ][ref1]genoemde nadere informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: '1.16'
    text: |-
      Elektronische meetmiddelen genoemd in [artikel 1.2][ref1] moeten, tenzij anders bepaald in [hoofdstuk 3][ref2],
      voldoen aan de in deze paragraaf gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: '1.17'
    text: |-
      De eisen met betrekking tot de maximale fout hebben betrekking op het gehele gebied van praktisch voorkomende
      voedingspanningen. Aan de eis met betrekking tot de maximale fout wordt voldaan indien het instrument voldoet aan
      [artikel 1.18, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '1.18'
    text: |-
      Het meetmiddel moet voor wat betreft storingsgevoeligheid voldoen aan de volgende eisen: a. het meetmiddel moet
      voldoende ongevoelig zijn voor elektro-magnetische invloeden. Aan deze eis wordt voldaan, indien de apparatuur de
      testen van International Document n° 11 General Requirements for Electronic Measuring Instruments (1994) doorstaat.
      De volgende testen met het aangegeven stoorniveau (Zwaarte) zijn van toepassing:




                  Omschrijving


                  Geldende eis


                  Artikel


                  Zwaarte






                  spanningsvariatie


                  1.13, lid 2


                  B.6


                  1




                  spanningsonderbreking


                  1.13, lid 3


                  B.7


                  2a en 2b




                  bursts (transienten)


                  1.13, lid 3


                  B.8


                  2




                  elektrostatische ontlading


                  1.13, lid 3


                  B.9


                  1




                  elektromagnetische instraling


                  1.13, lid 3


                  B.10


                  2




         a. indien het meetmiddel is uitgerust om te kunnen worden gevoed door het boordnet van voertuigen, moet dit
      voldoen aan de eisen gesteld in ISO 7637; b. indien het meetmiddel is opgebouwd uit afzonderlijke onderdelen,
      waarbij tussen de afzonderlijke onderdelen signaaloverdracht plaatsvindt, moet het meetmiddel zodanig zijn
      ingericht dat een juiste signaaloverdracht gewaarborgd is. Indien verstoringen van een andere aard dan genoemd
      onder a en b, zoals mechanische beschadigingen van de verbindingskabels, niet kunnen worden uitgesloten, moet
      verzekerd zijn dat bij het optreden van deze verstoringen voldaan wordt aan [artikel 1.13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '1.19'
    text: 'De metrologisch relevante programmatuur van het meetmiddel moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.19.a
    text: |-
      bij de typekeuring moet de te gebruiken programmatuur redelijkerwijs kunnen worden onderzocht. De aanbieder moet
      daartoe de middelen ter beschikking stellen zoals de benodigde documentatie waarin de werking van de programmatuur
      in voldoende detail wordt weergegeven;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.19.b
    text: |-
      de programmatuur moet in een zodanige vorm in het meetmiddel aanwezig zijn, dat wijziging van de programmatuur,
      leidend tot een besturingscode die niet in de typekeuring is onderzocht niet mogelijk is zonder verbreking van
      een verzegeling;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.19.c
    text: wijzigingen in de programmatuur worden door middel van een eenvoudige en zichtbare identificatiecode gesignaleerd;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.19.d
    text: |-
      door de fabrikant moet aan elke programmatuurversie een vast versie-nummer worden toegekend, dat tezamen met de
      door de programmatuur zelf gegenereerde identificatie-code als bedoeld onder c de volledige identificatie van de
      programmatuur vormt. Dit versie-nummer moet bij elke programmatuurwijziging die invloed kan hebben op de functies
      en de juistheid van het meetmiddel, door de fabrikant worden aangepast;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.19.e
    text: |-
      indien de frequentie van een interne frequentiebron van invloed is op het meetresultaat, mag de frequentie geen
      grotere afwijking hebben van zijn nominale waarde dan overeenkomend met één tiende van de maximale fout.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.19
  - number: 1.20.1
    text: 'Een hulpinrichting is zodanig opgebouwd dat zij:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.1.a
    text: de eigenschappen van het meetmiddel niet nadelig kan beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.1.b
    text: onder gebruiksomstandigheden zoals deze voor het meetmiddel gelden, juist blijft functioneren;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.1.c
    text: geen aanleiding kan vormen tot misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.2
    text: |-
      Een testcertificaat, bedoeld in het eerste lid, moet zijn afgegeven door een keuringsinstelling op grond van een
      door die instelling uitgevoerd onderzoek. De hulpinrichting moet zodanig zijn opgebouwd, dat zij:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.2.a
    text: de eigenschappen van het meetmiddel niet nadelig kan beinvloeden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.2.b
    text: onder gebruiksomstandigheden zoals deze voor het meetmiddel gelden juist blijft functioneren;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.20.2.c
    text: geen aanleiding kan vormen tot misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.20
  - number: 1.21.1
    text: |-
      Hulpinrichtingen mogen worden aangesloten op de in deze regeling genoemde meetmiddelen indien de desbetreffende
      combinatie voor gebruik is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.21
  - number: 1.21.2
    text: |-
      Indien de in het eerste lid bedoelde combinatie niet voor gebruik is goedgekeurd, mag een hulpinrichting worden
      aangesloten op een in deze regeling genoemd meetmiddel indien wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.21
  - number: 1.21.2.a
    text: |-
      de hulpinrichting voldoet aan de voorwaarden gesteld in het typegoedkeuringscertificaat van het meetmiddel, waarin
      in elk geval de aansluiting van de desbetreffende hulpinrichting op het meetmiddel wordt toegestaan, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.21
  - number: 1.21.2.b
    text: |-
      de hulpinrichting is voorzien van een CE-markering als bedoeld in artikel 1, onderdeel a, van het Besluit
      elektromagnetische comptabiliteit;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.21
  - number: 1.21.2.c
    text: voor de hulpinrichting is een testcertificaat afgegeven tenzij anders vermeld in het typekeuringscertificaat.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.21
  - number: 1.22.1
    text: |-
      Een hulpinrichting, bestaande uit een voorziening als bedoeld in [artikel 3, derde lid, onderdeel b][ref1],
      en [artikel 12, vierde lid, onderdeel b, van de Erkenningsregeling APK][ref2], is voorzien van een geldig
      testcertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel12
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011158
        artikel: '12'
  - number: 1.22.2
    text: Het testcertificaat wordt afgegeven door een keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.22
  - number: 1.22.3
    text: |-
      [Artikel 1.7][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.23.1
    text: |-
      Een hulpinrichting, bestaande uit een voorziening als bedoeld in [artikel 3, derde lid, onderdeel b][ref1], en
      [artikel 12, vierde lid, onderdeel b, van de Erkenningsregeling APK][ref2], is tevens voorzien van een geldig
      controlecertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011158#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011158#Artikel12
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0011158
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011158
        artikel: '12'
  - number: 1.23.2
    text: Het controlecertificaat wordt afgegeven door een keuringsinstelling of een onderzoeksgerechtigde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.23
  - number: 1.23.3
    text: |-
      De [artikelen 1.8][ref1], en [2.1 tot en met 2.10][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.1
    text: |-
      De Minister wijst keuringsinstellingen aan die bevoegd zijn tot het verlenen van typekeuringscertificaten alsmede
      keuringscertificaten, tot het erkennen van onderzoeksgerechtigden en het erkennen van instellingen tot het
      certificeren van kalibratiegas. De aanwijzing behoeft niet al deze bevoegdheden te betreffen. Zij kan ook beperkt
      worden tot bepaalde meetmiddelen. Van deze aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.2
    text: 'De keuringsinstelling moet beschikken over een kwaliteitssysteem waarin de procedures zijn vastgelegd voor:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.2.a
    text: het verstrekken van typekeuringscertificaten en certificaten van eerste keuring;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.2.b
    text: het erkennen van onderzoeksgerechtigden en het door deze verstrekken van certificaten van herkeuring;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.2.c
    text: het erkennen van instellingen tot het certificeren van kalibratiegas.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.3
    text: |-
      De aanwijzing kan door de Minister worden ingetrokken indien de betrokken keuringsinstelling daarom verzoekt,
      indien de keuringsinstelling niet meer beschikt over het in het tweede lid vereiste kwaliteitssysteem of indien de
      keuringsinstelling de in deze regeling opgenomen bepalingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: 2.1.4
    text: |-
      Met het toezicht op de naleving van de verplichtingen voortvloeiende uit de erkenning als onderzoeksgerechtigde dan
      wel uit de erkenning voor het certificeren van kalibratiegas zijn belast de werknemers van de keuringsinstelling
      die daartoe door de keuringsinstelling zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.1
  - number: '2.2'
    text: |-
      Een onderneming of instelling kan door een keuringsinstelling als onderzoeksgerechtigde worden erkend ten aanzien
      van een bepaalde categorie in gebruik zijnde meetmiddelen als genoemd in [artikel 1.2][ref1], indien wordt voldaan
      aan de in [artikel 2.3 tot en met 2.5][ref2] gestelde eisen, hetgeen na een onderzoek van de onderneming of
      instelling door de keuringsinstelling is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.3'
    text: |-
      De onderneming of instelling moet voor wat betreft organisatie, personeel en materieel zodanig zijn ingericht,
      en moet beschikken over zodanige documentatie, dat zij in staat is met een voldoende mate van zekerheid vast te
      stellen dat voldaan wordt aan de in [paragraaf 3][ref1] van [hoofdstuk 1][ref2] en de in [hoofdstuk 3][ref3] ten
      aanzien van het desbetreffende meetmiddel gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '3'
  - number: '2.4'
    text: |-
      De standaarden die de onderneming of instelling bij het onderzoek zal gebruiken dienen afgeleid te zijn van
      nationale standaarden van meeteenheden of van standaarden van meeteenheden die worden beheerd of verwezenlijkt
      met inachtneming van hetgeen ter zake door de bevoegde organen op grond van het op 20 mei 1875 te Parijs gesloten
      Verdrag ter verzekering van de internationale eenheid en volmaking van het metriek stelsel is bepaald dan wel in
      overeenstemming te zijn met door de Raad of Commissie van de Europese Gemeenschappen ingevolge het op 25 maart 1957
      te Rome gesloten Verdrag tot oprichting van de Europese Economische Gemeenschap genomen bindende besluiten.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.4
  - number: 2.5.1
    text: |-
      De aanvrager van een erkenning als onderzoeksgerechtigde met betrekking tot koolmonoxidemeters moet beschikken
      over een relevant kwaliteitssysteem dat zodanig is opgezet dat wordt voldaan aan de kwaliteitsnorm NEN-ISO 9003
      in de meest recente versie. Hieraan wordt in ieder geval voldaan indien de aanvrager het desbetreffende NEN-ISO
      certificaat kan overleggen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.5
  - number: 2.5.2
    text: |-
      Het eerste lid geldt met ingang van 1 januari 1998 tevens voor de aanvrager van een erkenning als
      onderzoeksgerechtigde voor één of meer meetmiddelen, als bedoeld in [artikel 1.2][ref1], niet zijnde de
      koolmonoxidemeter.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.6.1
    text: De erkenning wordt verleend op aanvraag en tegen betaling van het door de keuringsinstelling vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.6
  - number: 2.6.2
    text: |-
      De aanvraag moet gegevens bevatten met betrekking tot de organisatie van de onderneming of instelling, haar
      personele bezetting en de ten behoeve van het onderzoek te gebruiken standaarden en andere materiële middelen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.6
  - number: 2.6.3
    text: |-
      In de beschikking van de keuringsinstelling houdende erkenning als onderzoeksgerechtigde worden de in verband met
      die erkenning van belang zijnde gegevens met betrekking tot de organisatorische, personele en materiële inrichting
      van de onderneming of instelling vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.6
  - number: 2.6.4
    text: Van de beschikking houdende erkenning als onderzoeksgerechtigde wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.6
  - number: '2.7'
    text: 'Op een onderneming of instelling die als onderzoeksgerechtigde is erkend rusten de volgende verplichtingen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
  - number: 2.7.a
    text: |-
      steeds moet worden voldaan aan de in [artikel 2.3. tot en met 2.5][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.7.b
    text: |-
      de standaarden en andere hulpmiddelen benodigd voor de herkeuring moeten zich steeds in goede staat van onderhoud
      bevinden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
  - number: 2.7.c
    text: |-
      elke herkeuring wordt op een dusdanige wijze verricht dat met voldoende mate van zekerheid wordt vastgesteld of het
      betrokken meetmiddel voldoet aan de daaraan gestelde eisen. De procedure voor het uitvoeren van een herkeuring moet
      zijn vastgelegd in het in [artikel 2.5][ref1] bedoelde kwaliteitssysteem van de onderzoeksgerechtigde;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.7.d
    text: |-
      van elke herkeuring met een positief resultaat wordt aan de eigenaar of houder van het betrokken meetmiddel een
      certificaat van herkeuring verstrekt van een door de keuringsinstelling vastgesteld model;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
  - number: 2.7.e
    text: |-
      gedurende ten minste twee jaar wordt een afschrift bewaard van elk overeenkomstig onderdeel d afgegeven
      certificaat;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
  - number: 2.7.f
    text: |-
      er worden geen certificaten afgegeven voor meetmiddelen ten aanzien waarvan de erkenning niet geldt, voor
      meetmiddelen die niet aan de eisen voldoen en voor meetmiddelen waarvoor een certificaat niet vereist wordt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7
  - number: 2.7a
    text: |-
      Een onderneming of instelling die als onderzoeksgerechtigde is erkend, is verplicht voorafgaand aan de herkeuring
      van een niet-mechanisch meetmiddel aan de hand van de documentatie, behorende bij de voor dat meetmiddel geldende
      typegoedkeuring, vast te stellen dat het betrokken meetmiddel niet op zodanige wijze is aangepast dat niet meer
      verondersteld mag worden dat het meetmiddel overeenstemt met het goedgekeurde type.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.7a
  - number: 2.8.1
    text: |-
      De erkenning wordt door de keuringsinstelling bij beschikking ingetrokken indien niet langer wordt voldaan aan
      de eisen bedoeld in [artikel 2.3 tot en met 2.5][ref1] of indien aan één of meer van de in [artikel 2.7][ref2]
      genoemde verplichtingen of de financiële verplichting zoals bedoeld in [artikel 2.9][ref3] niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.8.2
    text: |-
      Van de beschikking houdende intrekking van de erkenning als onderzoeksgerechtigde wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.8
  - number: '2.9'
    text: |-
      Ter bestrijding van de kosten, verbonden aan het toezicht op de naleving door de keuringsinstelling is
      de onderzoeksgerechtigde aan de keuringsinstelling een bedrag verschuldigd, berekend volgens de door de
      keuringsinstelling vastgestelde tarieven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.9
  - number: '2.10'
    text: |-
      De in [artikel 2.6, eerste lid][ref1] en [artikel 2.9][ref2] bedoelde tarieven behoeven goedkeuring van de Minister
      van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.11'
    text: |-
      Een onderneming of instelling kan door een keuringsinstelling als inrichting voor het certificeren van
      kalibratiegas worden erkend indien wordt voldaan aan de in [artikel 2.12][ref1] gestelde eisen, hetgeen na een
      onderzoek van de onderneming of instelling door de keuringsinstelling is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.12'
    text: 'De onderneming of instelling moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.12
  - number: 2.12.a
    text: |-
      organisatie, personeel en materieel moeten zodanig zijn dat met voldoende zekerheid kan worden vastgesteld dat het
      te certificeren kalibratiegas de vereiste kwaliteit heeft;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.12
  - number: 2.12.b
    text: |-
      de standaarden die bij het certificeren worden gebruikt, dienen afgeleid te zijn van standaarden van de
      instelling, bedoeld in [artikel 2, tweede lid, van de IJkwet][ref1] dan wel van andere, door de Minister aangewezen
      standaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '2'
  - number: 2.13.1
    text: |-
      Ter verkrijging van een erkenning als bedoeld in [artikel 2.11][ref1] wordt een aanvraag ingediend bij de
      keuringsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.13.2
    text: |-
      De aanvraag moet gegevens bevatten met betrekking tot de organisatie van de onderneming of instelling, haar
      personele bezetting en de ten behoeve van het onderzoek te gebruiken standaarden en andere materiële middelen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.13
  - number: 2.13.3
    text: |-
      In de beschikking van de keuringsinstelling houdende erkenning als erkende instelling of onderneming worden de in
      verband met die erkenning van belang zijnde gegevens met betrekking tot de organisatorische personele en materiële
      inrichting van de onderneming of instelling vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.13
  - number: 2.13.4
    text: Van de beschikking houdende erkenning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.13
  - number: '2.14'
    text: 'Op de tot het certificeren van kalibratiegas erkende inrichting rusten de volgende verplichtingen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
  - number: 2.14.a
    text: |-
      steeds moet worden voldaan aan de in [artikel 2.12][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.b
    text: |-
      de standaarden en hulpmiddelen, benodigd voor het certificeren, moeten zich steeds in een goede staat van onderhoud
      bevinden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
  - number: 2.14.c
    text: |-
      een certificaat mag slechts worden afgegeven voor gas dat is samengesteld, verpakt en gecertificeerd overeenkomstig
      het gestelde in de [artikelen 3.9.32][ref1], [3.9.33][ref2] en [3.11.13][ref3] en dat als gecertificeerd
      kalibratiegas in de handel wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '11'
  - number: 2.14.d
    text: |-
      de gegevens betreffende de uitvoering van het gestelde in [artikel 2.12][ref1], voorzover van belang met betrekking
      tot het certificeren, moeten worden vastgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.14.e
    text: de gegevens bedoeld onder d moeten gedurende ten minste vijf jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.14
  - number: 2.15.1
    text: |-
      De erkenning tot het certificeren van kalibratiegas wordt ingetrokken indien niet langer wordt voldaan aan de eisen
      bedoeld in [artikel 2.12][ref1], of indien één of meer van de in [artikel 2.14][ref2] genoemde verplichtingen niet
      worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009237
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.15.2
    text: Van de beschikking tot intrekking van de erkenning wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.15
  - number: '2.16'
    text: |-
      De onderneming of instelling die voor de datum van inwerkingtreding van deze regeling op grond van paragraaf 4 van
      de Regeling Meetmiddelen Voertuigreglement is toegelaten als onderzoeksgerechtigde voor bepaalde in gebruikzijnde
      meetmiddelen wordt aangemerkt als te zijn erkend als onderzoeksgerechtigde terzake van deze meetmiddelen op grond
      van [hoofdstuk 2, paragraaf 2][ref1], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.17'
    text: |-
      De onderneming of instelling die voor de datum van inwerkingtreding van deze regeling op grond van artikel 4
      van het Meetbesluit CO/roet motorrijtuigen is erkend tot het afgeven van verklaringen voor in gebruik zijnde
      koolmonoxidemeters, wordt aangemerkt als te zijn erkend als onderzoeksgerechtigde voor koolmonoxidemeters op grond
      van [hoofdstuk 2, paragraaf 2][ref1], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.18'
    text: |-
      De onderneming of instelling die voor de datum van inwerkingtreding van deze regeling is erkend voor het
      certificeren van kalibratiegas op grond van bijlage V van het Meetbesluit CO/roet motorrijtuigen, wordt aangemerkt
      als te zijn erkend op grond van hoofdstuk 2, paragraaf 3, van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel2.18
  - number: 3.1.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.a
    text: |-
      opaciteit: de mate waarin lichtabsorptie plaatsvindt in het uitlaatgas dat door een roetmeter wordt geleid.
      Deze mate van lichtabsorptie is afhankelijk van de weglengte waarover de lichtabsorptie plaatsvindt en wordt
      aangeduid door de grootheid *N* die de afname van de lichtflux over de weglengte in het uitlaatgas, uitdrukt
      in een percentage van de onverzwakte lichtflux. In formule: Hierin is: *N* de opaciteit (uitgedrukt in %); Φ de
      onverzwakte lichtflux; Φ de lichtflux resterend na de lichtweg *L*;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.b
    text: |-
      absorptiecoëfficiënt: een maat voor de lichtabsorptie van het uitlaatgas, die karakteristiek is voor de opaciteit
      van het uitlaatgas en in getalwaarde onafhankelijk is van de weglengte waarover de opaciteit wordt gemeten. De
      absorptiecoëfficiënt wordt aangeduid door grootheid *k*, die de negatieve waarde van natuurlijke logaritme van de
      transmissie per meter lichtweg door het uitlaatgas voorstelt. In formule: Hierin is: *K* de absorptiecoëfficiënt
      (uitgedrukt in m–1); *L* de weglengte die het licht in het uitlaatgas aflegt in meter;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.c
    text: |-
      fysische responsie: het specifieke dynamische gedrag van dat deel van de roetmeter dat de waarde van de
      absorptiecoëfficiënt van het gas in de uitlaat omzet in de opaciteitswaarde die het primaire meetsignaal vormt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.d
    text: |-
      normlengte: de gestandaardiseerde lengte voor de meetkamer gebruikt voor de berekening van de genormeerde opaciteit
      te weten 430 mm;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.e
    text: |-
      ongecorrigeerde opaciteit: het meetsignaal evenredig met de momentele waarde van de opaciteit, niet gecorrigeerd
      voor druk, temperatuur of verschil tussen de werkelijke-en de normlengte van de meetkamer;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.f
    text: |-
      genormeerde opaciteit: de berekende waarde van de opaciteit zoals deze zou worden gemeten in een meetkamerlengte
      gelijk aan de normlengte;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.g
    text: |-
      correctie-filter: een elektrisch filter opgenomen in het signaalpad met een karakteristiek aangepast aan de
      fysische responsie;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.h
    text: |-
      hoofdfilter: het elektrisch filter met een vaste karakteristiek, dat is opgenomen in het signaalpad en dat als
      ingangssignaal de genormeerde opaciteit heeft;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.i
    text: |-
      piekwaarde detectie-inrichting: de inrichting die de maximale waarde bepaalt van een roetuitstoot, uitgaande van
      het, gedurende de vrije acceleratie van de voertuigmotor, gemeten verloop van deze roetuitstoot;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.1.j
    text: |-
      meetresultaat: de waarde van de absorptiecoëfficiënt van het uitlaatgas zoals deze, beïnvloedt door de fysische en
      elektrische responsie van de roetmeter, is gemeten op het moment bepaald door de piekwaarde detectie inrichting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.1
  - number: 3.1.2
    text: |-
      In de handleiding behorende bij de roetmeter moet naast de informatie genoemd in [artikel 1.15][ref1] het volgende
      zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.1.2.a
    text: de wijze waarop een sonde in de uitlaat van het voertuig moet worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.2
  - number: 3.1.2.b
    text: eventuele aanwijzingen met betrekking tot een te gebruiken sonde voor bepaalde voertuigtypen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.2
  - number: 3.1.3
    text: 'De roetmeter moet zijn voorzien van:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
  - number: 3.1.3.a
    text: een analoge of digitale aanwijzing van de ongecorrigeerde opaciteit;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
  - number: 3.1.3.b
    text: |-
      een automatisch werkende instelling voor 0% en 100% ongecorrigeerde opaciteit. De betreffende justeerinrichting
      moet door de gebruiker in werking kunnen worden gesteld in de functiestand CONTROLE (of een gelijksoortige
      benaming), doch de werking mag niet door de gebruiker kunnen worden beïnvloed. De justeerinrichting moet zodanig
      functioneren, dat bij de justering op 0% gewaarborgd is dat geen onjuiste instelling kan plaatsvinden als gevolg
      van in de meetkamer binnentredende uitlaatgassen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
  - number: 3.1.3.c
    text: |-
      een inrichting waarmee de lineariteit van de aanwijzing van de ongecorrigeerde opaciteit kan worden gecontroleerd.
      Deze inrichting moet ten minste gelijkwaardig zijn aan die waarbij de roetmeter voorzien is van een geschikt
      optisch filter, dat een zwarting heeft overeenkomend met een aanwijzing die ligt tussen 15% en 60% ongecorrigeerde
      opaciteit en waarbij de juiste waarde van het filter, uitgedrukt in ongecorrigeerde opaciteit, op het filter is
      vermeld;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
  - number: 3.1.3.d
    text: |-
      een software-routine waarmee een afdruk kan worden gemaakt van de metrologisch belangrijke parameters, die
      instelbaar zijn teneinde aan verschillende nationale voorschriften te kunnen voldoen. Deze voorziening is niet
      vereist indien door middel van software-identificatie zoals bedoeld in [artikel 1.19, onderdeel c][ref1], op een
      eenvoudige manier is vast te stellen dat de correcte parameters zijn ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.1.3.e
    text: |-
      een beveiliging die het gebruik in de functiestand PIEKMETING (of een gelijksoortige benaming) verhindert indien
      direct voorafgaand aan de meting, de olietemperatuur van de in het onderzoek betrokken motor lager is dan 60 °C.
      Het is toelaatbaar om de mogelijkheid in te bouwen handmatig een lagere temperatuur in te voeren; in dat geval moet
      deze lagere waarde vastgelegd worden en op de afdruk van de keuringsresultaten herkenbaar zijn aan het toegevoegde
      teken “#”. De bedoelde beveiliging mag buiten werking worden gesteld, doch in dat geval moet op de registratie van
      de meetresultaten het teken “#” zijn weergegeven zonder een temperatuurwaarde;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
  - number: 3.1.3.f
    text: |-
      een testaansluiting die, in afwijking van het bepaalde in [artikel 1.1, onderdeel u][ref1], de mogelijkheid
      biedt om direct, dan wel door berekening, gedurende tenminste 20 seconden de momentele waarde te volgen van de
      absorptiecoëfficiënt, niet beïnvloed door de werking van het hoofdfilter, inclusief normaal toegepaste correcties.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.4.1
    text: |-
      De in de volgende leden opgenomen eisen worden getoetst ten opzichte van het verloop van de roetuitstoot als
      functie van de tijd, zoals dit verloop bij de maximale gasstroomsnelheid optreedt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.4
  - number: 3.1.4.2
    text: |-
      De maximale fout van de roetmeter wordt gecontroleerd door vergelijking met een standaard roetmeter voor
      roetuitstoot door een representatief aantal personenauto's en bedrijfsauto's. De fout in de waarde gepresenteerd
      door of berekend uit het signaal van de testconnector mag niet meer bedragen dan 0,3 m-1 + 5%. Deze maximale fout
      geldt voor een roetpiek met een breedte van ten minste 0,25 seconde en een vlakheid binnen 20% van de gemiddelde
      waarde binnen deze 0,25 seconde.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.4
  - number: 3.1.4.3
    text: |-
      De specifieke fysische responsie van de roetmeter moet zodanig zijn aangevuld met een elektrisch correctiefilter,
      dat de piekwaarde zoals deze kan worden bepaald uit het op de testaansluiting gepresenteerde meetsignaal, niet meer
      dan 5% afwijkt van de waarde die zou worden verkregen indien de fysische responsie een verwaarloosbare invloed zou
      hebben en de werkelijke waarde van de roetpiek uitsluitend zou worden gereduceerd door een eerste orde elektrisch
      filter dat in 0,4 seconde 90% van een stapvormige verandering aanwijst. Deze eis geldt voor een willekeurige vorm
      van de roetpiek zoals deze onder praktische omstandigheden kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.4
  - number: 3.1.4.4
    text: |-
      De roetmeter moet zijn voorzien van een elektrisch filter dat volgens een vaste karakteristiek het meetsignaal
      beïnvloedt. Dit filter moet zijn opgenomen in het meetsignaal dat de waarde van de genormeerde opaciteit weergeeft.
      Dit hoofdfilter moet beantwoorden aan de volgende karakteristiek: Hierin is: *N*  het ingangssignaal van het
      filter; *N*  het uitgangssignaal van het filter; *t* de tijd in seconden; τ de filterconstante in seconden; De
      nominale waarde voor τ is hierin:








                    τ =



                    1






                    Ln(10)




           De tolerantie van de karakteristiek van het hoofdfilter wordt begrensd door de karakteristieken gevonden voor
      τ = 0,44 s en τ = 0,43 s. De overeenkomstige karakteristiek in numerieke vorm wordt weergegeven door: *Y*  = (1 –
      δ) * *X* + δ * *Y* Hierin geldt voor δ de volgende waarde: δ = 10 In het bovenstaande is *t* de bemonsteringstijd
      in seconden van de ingangsgrootheid *X* en de waarde *Y* is de uitgangsgrootheid van het filter. De index *n* stelt
      het volgnummer van de bemonstering voor.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.4
  - number: 3.1.4.5
    text: |-
      De maximale verschuiving van de aanwijzing zonder doorvoer van uitlaatgas bij de aanwijzing 0% en 100%
      opaciteit mag niet meer bedragen dan 1% ongecorrigeerde opaciteit per uur of, indien justering als bedoeld in
      [artikel 3.1.3, onderdeel b][ref1], na een bepaald tijdsinterval plaatsvindt, niet meer dan 0,5% ongecorrigeerde
      opaciteit over dit tijdsinterval.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.5
    text: 'Het optisch systeem moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.5.a
    text: |-
      de toegepaste lichtbron moet hetzij een gloeilamp zijn, waarvan de kleurtemperatuur een waarde moet hebben die
      tussen 2800 K en 3250 K ligt, hetzij een diode die licht emitteert met een golflengte- piekwaarde tussen de 550 nm
      en 570 nm;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.5.b
    text: |-
      indien als lichtbron een gloeilamp wordt gebruikt, moet de spectrale gevoeligheidskarakteristiek van de foto-
      elektrische cel overeenkomen met de genormeerde spectrale gevoeligheidskromme van het menselijk oog;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.5.c
    text: |-
      de opbouw van het optisch systeem moet zodanig zijn dat uitwendige lichtbronnen en interne reflecties geen storende
      invloed hebben op de juiste werking van de roetmeter;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.5.d
    text: |-
      de opbouw van het optisch systeem moet zodanig zijn dat herhaalde reflectie tussen het optisch filter en andere
      reflecterende oppervlakken een verwaarloosbare invloed heeft op de effectieve waarde van het optisch filter tenzij
      deze reflecties een bekende en stabiele bijdrage hebben in deze effectieve waarde van het filter en geen storende
      invloed hebben op de controle van de lineariteit;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.5.e
    text: |-
      de opbouw van het optisch systeem dient zodanig te zijn dat regelmatige reiniging, indien noodzakelijk, door de
      gebruiker op een eenvoudige wijze kan worden uitgevoerd, zonder risico dat de juiste werking van de roetmeter
      hierdoor nadelig wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.5
  - number: 3.1.6.1
    text: |-
      Een meetcuvet moet op een temperatuur worden gehouden die ligt tussen de waarden 80 °C en 110 °C, tenzij door de
      aanbieder bij de typekeuring onomstotelijk wordt aangetoond dat een lagere temperatuur dan wel het achterwege laten
      van een verwarming van dat cuvet een verwaarloosbare invloed heeft.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.6
  - number: 3.1.6.2
    text: |-
      De temperatuur van het uitlaatgas moet worden bepaald met een temperatuuropnemer waarvan de positie en de
      responsie-snelheid zodanig zijn dat voldaan wordt aan hetgeen gesteld is in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.6
  - number: 3.1.6.3
    text: |-
      De opwarmtijd van de roetmeter mag niet meer bedragen dan 15 minuten bij omgevingstemperaturen boven 10 °C en
      niet meer dan 20 minuten voor omgevingstemperaturen boven – 10 °C. Tijdens deze opwarmtijd moeten metingen met de
      roetmeter niet mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.6
  - number: 3.1.6.4
    text: |-
      Het meetresultaat moet zijn gecorrigeerd voor de feitelijke temperatuur van het uitlaatgas ter plaatse waar de
      lichtabsorptie wordt gemeten. De correctie moet zodanig nauwkeurig worden berekend, dat de absorptiecoëfficiënt
      wordt weergegeven voor een uitlaatgastemperatuur van 100 ± 5 °C.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.6
  - number: 3.1.7.1
    text: Een in de uitlaat van het motorrijtuig gebrachte sonde mag geen merkbare invloed hebben op de motorwerking.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.7
  - number: 3.1.7.2
    text: |-
      Een in de uitlaat geplaatste sonde moet zodanig zijn gepositioneerd, dat effecten van de wand van het
      uitlaatsysteem verwaarloosbaar zijn. Hieraan wordt voldaan indien de opening van de sonde zich op een afstand van
      tenminste 5 mm van de wand van de uitlaat bevindt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.7
  - number: 3.1.7.3
    text: |-
      Een monsternameslang moet van een zodanige opbouw zijn dat effecten veroorzaakt door condensatie worden
      geëlimineerd. Aan deze eis wordt voldaan als een ingangstemperatuur van 150 °C niet tot een lagere
      uitgangstemperatuur leidt dan 50 °C bij een gasstroomsnelheid in de uitlaat van niet meer dan 50 m/s en een
      omgevingstemperatuur van –10°C dan wel 5°C als een beperkende gebruiksomstandigheid voor het temperatuurgebied als
      bedoeld in [artikel 1.13, vierde lid][ref1], geldt. De monsternameslang moet zijn voorzien van een identificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.7
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.1.8.1
    text: 'De roetmeter moet ten minste in de twee volgende functiestanden kunnen worden ingesteld:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.8
  - number: 3.1.8.1.a
    text: |-
      de functiestand CONTROLE (of een gelijksoortige benaming): in deze functiestand moet de waarde van de
      ongecorrigeerde opaciteit worden aangegeven. In deze functiestand moet de justeerinrichting kunnen worden bediend
      en de controle plaats kunnen vinden bedoeld in [artikel 3.1.3, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.8
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.8.1.b
    text: |-
      de functiestand PIEKMETING (of een gelijksoortige benaming): in deze functiestand moet de gecorrigeerde waarde voor
      absorptiecoëfficiënt van de roetpiek zoals deze zich in de acceleratiefase voordoet worden weergegeven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.8
  - number: 3.1.8.2
    text: |-
      De roetmeter mag zijn voorzien van een functiestand “ONGEFILTERDE PIEKWAARDE”, waarin de piekwaarde van de
      absorptiecoëfficiënt wordt aangewezen, niet beïnvloed door de werking van het hoofdfilter. In dat geval moet op de
      registratie het gebruik van deze functiestand zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.8
  - number: 3.1.8.3
    text: |-
      Andere functiestanden en aanwijzingen zijn toegestaan, mits deze geen aanleiding tot misleiding of misvatting
      geven.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.8
  - number: 3.1.9
    text: |-
      De roetmeter moet zijn voorzien van een analoge of digitale aanwijsinrichting die ten minste de volgende
      aanwijzingen presenteert:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.9
  - number: 3.1.9.a
    text: |-
      in de functiestand “CONTROLE” (of een gelijksoortige benaming) de ongecorrigeerde waarde van de opaciteit over het
      bereik van 0% tot 100%. De kleinste stap in de aangewezen waarde moet 0,1% bedragen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.9
  - number: 3.1.9.b
    text: |-
      de piekwaarde van de gecorrigeerde absorptiecoefficiënt over het bereik van ten minste 0 m-1 tot 5,5 m-1. De
      kleinste stap in de aangewezen waarde mag niet meer dan 0,02 m-1 bedragen.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.9
  - number: 3.1.10.1
    text: |-
      De roetmeter moet zijn voorzien van een interne of externe afdruk-inrichting waarmee ten minste de volgende
      gegevens worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.a
    text: |-
      de datum en het tijdstip waarop de metingen worden uitgevoerd en, indien de justering niet automatisch vóór elke
      meetcyclus plaatsvindt, de datum en het tijdstip waarop de laatste justering heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.b
    text: 'de informatie van het desbetreffende voertuig:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.b.1º
    text: de minimale en maximale waarde van het stationair toerental;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.b.2º
    text: de minimale en maximale waarde van het afregeltoerental;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.b.3º
    text: de maximale waarde van de absorptiecoëfficiënt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.b.4º
    text: de minimale waarde van de motorolietemperatuur;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.c
    text: 'de uitgangspunten:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.c.1º
    text: 'soort meetsonde: opgave volgens handleiding roetmeter;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.c.2º
    text: |-
      de aanduiding van de functiestand, indien dit niet de functiestand CONTROLE of PIEKMETING (of een gelijksoortige
      benaming) is;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.d
    text: 'de meetresultaten van de geldige meetcycli:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.d.1º
    text: de gemiddelde waarde van het stationaire toerental, gedurende de laatste vijf seconden voor het gasgeven;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.d.2º
    text: de gemiddelde waarde van het afregeltoerental;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.d.3º
    text: de piekwaarde van de absorptiecoëfficiënt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.1.d.4º
    text: |-
      de voor de aanvang van de cyclus gemeten motorolietemperatuur dan wel het teken als bedoeld in
      [artikel 3.1.3, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.10.2
    text: |-
      Indien de meting, ongeacht de reden, vroegtijdig wordt beëindigd, moeten de tot dan gemeten gegevens met de
      afdrukinrichting kunnen worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.10.3
    text: |-
      Andere informatie, dan bedoeld in het eerste of tweede lid, mag worden geregistreerd voorzover deze niet leidt tot
      misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.10
  - number: 3.1.11.1
    text: |-
      De roetmeter mag zijn voorzien van een geïntegreerde toerenteller en olietemperatuurmeter overeenkomstig het
      bepaalde in de [paragrafen 2][ref1] en [3 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.11
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.1.11.2
    text: |-
      Indien de roetmeter niet is voorzien van een geïntegreerde toerenteller en olietemperatuurmeter, moet de roetmeter
      zijn voorzien van een signaalingang waarmee het meetsignaal van een separate toerenteller en olietemperatuurmeter
      kan worden overgedragen naar de roetmeter.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.11
  - number: 3.1.12.1
    text: |-
      Alvorens tot de meting wordt overgegaan, moeten de gegevens, zoals bedoeld in
      [artikel 3.1.10, eerste lid, onderdeel b][ref1], in de roetmeter kunnen worden ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.12.2
    text: |-
      De programmatuur van de roetmeter moet zodanig zijn dat degene die het apparaat bedient automatisch door de in het
      derde lid bedoelde meetprocedure wordt geleid.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3
    text: 'De meetprocedure moet achtereenvolgens ten minste de volgende stappen doorlopen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.a
    text: |-
      invoeren van de gegevens als bedoeld in [artikel 3.1.10, eerste lid, onderdeel b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.12.3.b
    text: 'automatische controle of:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.b.1º
    text: alle onder punt a bedoelde gegevens zijn ingevoerd,
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.b.2º
    text: |-
      de minimum motorolietemperatuur, zoals bedoeld in [artikel 3.1.3, onderdeel e][ref1], is bereikt, tenzij deze
      controle is uitgeschakeld,


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.1.12.3.b.3º
    text: het stationair toerental gedurende 5 seconden binnen de ingevoerde waarden ligt, en
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.b.4º
    text: het afregeltoerental gedurende 2 seconden binnen de ingevoerde waarden ligt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.c
    text: |-
      indien de resultaten van de onder punt b uitgevoerde controle juist zijn, mag de roetmeter de testprocedure
      vrijgeven;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.d
    text: |-
      nadat het stationair toerental na een periode van tenminste 10 seconden gedurende 5 seconden binnen de ingevoerde
      waarden ligt, wordt aangeven dat het gaspedaal moet worden ingedrukt;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.e
    text: nadat het afregeltoerental 2 seconden is gehandhaafd, wordt aangegeven dat het gaspedaal moet worden losgelaten;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.f
    text: |-
      de roetmeter geeft aan dat de meetprocedure wordt beëindigd indien de absorptiecoëfficiënt van de eerste of de
      tweede test kleiner is dan of gelijk is aan de maximale absorptiecoëfficiënt minus 0,5 m–1. In dit geval is de
      absorptiecoëfficiënt van de eerste of de tweede test de berekende absorptiecoëfficiënt, bedoeld in onderdeel g.
      Indien de absorptiecoëfficiënt van de eerste test of van zowel de eerste, als de tweede test niet kleiner is dan of
      gelijk is aan de maximale absorptiecoëfficiënt minus 0,5 m–1, worden de punten d en e automatisch eenmaal herhaald;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.1.12.3.g
    text: |-
      automatisch wordt, indien van toepassing, het rekenkundig gemiddelde van de absorptiecoëfficiënten van drie
      achtereenvolgende testen berekend. Als de berekende absorptiecoëfficiënt kleiner of gelijk is aan 2,5 m, dan mogen
      de meetwaarden van deze drie testen onderling niet meer afwijken dan 0,5 m Als de berekende absorptiecoëfficiënt
      groter is dan 2,5 m, dan mogen de meetwaarden van deze drie testen onderling niet meer afwijken dan 0,7 m Indien
      blijkt dat de afwijking groter is dan 0,5 m–1 respectievelijk 0,7 m–1 moet de test een of meerdere keren worden
      herhaald, waarbij de berekening telkens opnieuw wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.1.12
  - number: 3.2.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.1
  - number: 3.2.1.a
    text: 'toerenteller: meetinstrument voor het bepalen van het toerental van de krukas van een voertuigmotor;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.1
  - number: 3.2.1.b
    text: 'geïntegreerde toerenteller: toerenteller deel uitmakend van en ingebouwd in een ander meetmiddel;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.1
  - number: 3.2.1.c
    text: |-
      toerenopnemer: onderdeel van de toerenteller dat signalen afgegeven door de voertuigmotor omzet in een elektrisch
      signaal en overdraagt aan het verwerkingsgedeelte van de toerenteller.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.1
  - number: 3.2.2
    text: |-
      In de handleiding behorende bij de toerenteller moet naast de informatie genoemd in [artikel 1.15][ref1] het
      volgende zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.2.2.a
    text: |-
      indien de toerenteller voorzien is van meerdere toerenopnemers, de criteria die van belang zijn voor de keuze van
      een geschikte toerenopnemer;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.2
  - number: 3.2.2.b
    text: de wijze waarop de toerenopnemer op of bij de voertuigmotor moet worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.2
  - number: 3.2.3
    text: |-
      De maximale fout voor toerentellers bedraagt 10 min-1 voor toerentallen kleiner dan 1000 min-1 en 1% voor
      toerentallen gelijk aan of groter dan 1000 min-1.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.3
  - number: 3.2.4.1
    text: |-
      De toerenteller moet zijn voorzien van een aanwijsinrichting, die digitaal of analoog het gemeten toerental
      aangeeft.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.4
  - number: 3.2.4.2
    text: De aanwijzing van het toerental moet plaats vinden in omwentelingen per minuut (min¯ⁱ).
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.4
  - number: 3.2.4.3
    text: De kleinste afleeseenheid mag ten hoogste een waarde hebben van 10 min¯ⁱ.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.4
  - number: 3.2.4.4
    text: Het meetbereik van een toerenteller moet tenminste het gebied van 500 min¯ⁱ tot 6000 min¯ⁱ omvatten.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.4
  - number: 3.2.5
    text: |-
      Niet-geïntegreerde toerentellers die worden gebruikt in combinatie met een ander meetmiddel, moeten zijn
      voorzien van een signaaluitgang door middel waarvan het gemeten toerental kan worden overgedragen naar dat andere
      meetmiddel, voor zover koppeling verplicht is volgens de voorgeschreven meetmethode.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.5
  - number: 3.2.6
    text: |-
      Toerentellers in gebruik genomen vóór inwerkingtreding van deze regeling, welke niet worden gebruikt voor de
      roetmeting of de uitlaatgasmeting met lambda-bepaling, als bedoeld in [artikel 5.2.11, negende en elfde lid][ref1]
      dan wel [artikel 5.3.11, achtste en tiende lid van het Voertuigreglement][ref2] moeten in afwijking van het
      bepaalde in [hoofdstuk 1][ref3] voldoen aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009237
        hoofdstuk: '1'
  - number: 3.2.6.a
    text: het toerental moet worden weergegeven in omwentelingen per minuut.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.6
  - number: 3.2.6.b
    text: het meetbereik moet ten minste 500 tot 2500 omwentelingen per minuut bedragen;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.6
  - number: 3.2.6.c
    text: het toerental moet op analoge of digitale wijze duidelijk aangegeven worden en gemakkelijk afleesbaar zijn;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.6
  - number: 3.2.6.d
    text: |-
      de schaalverdeling van de toerenteller moet zodanig zijn dat op 10 omwentelingen per minuut nauwkeurig kan worden
      afgelezen in het meetbereik tot 1200 omwentelingen per minuut, en dat op 50 omwentelingen per minuut nauwkeurig kan
      worden afgelezen in het meetbereik boven 1200 omwentelingen per minuut.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.2.6
  - number: 3.3.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.1
  - number: 3.3.1.a
    text: 'olietemperatuurmeter: meetinstrument voor het bepalen van de temperatuur van de olie van een voertuigmotor;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.1
  - number: 3.3.1.b
    text: 'geïntegreerde olietemperatuurmeter: olietemperatuurmeter deel uitmakend van en ingebouwd in een ander meetmiddel;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.1
  - number: 3.3.1.c
    text: |-
      temperatuuropnemer: onderdeel van de olietemperatuurmeter dat de temperatuur van de motorolie opneemt en omzet in
      een elektrisch signaal en overdraagt aan het verwerkingsgedeelte van de olietemperatuurmeter.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.1
  - number: 3.3.2
    text: |-
      In de handleiding behorende bij de olietemperatuurmeter moet naast de informatie genoemd in [artikel 1.15][ref1]
      het volgende zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.3.2.a
    text: |-
      indien de olietemperatuurmeter voorzien is van meerdere opnemers, de criteria die van belang zijn voor de keuze van
      een geschikte opnemer;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.2
  - number: 3.3.2.b
    text: de wijze waarop de opnemer in de voertuigmotor moet worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.2
  - number: 3.3.3
    text: |-
      De maximale fout voor olietemperatuurmeters bedraagt 5 °C voor het temperatuurgebied van 60 °C tot 90 °C. Voor het
      aanwijsbereik buiten het meettraject van 60 °C tot 90 °C is de maximale fout van de olietemperatuurmeter 8 °C
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.3
  - number: 3.3.4.1
    text: De aanwijzing van de olietemperatuur moet plaats vinden in graden Celsius (°C).
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.4
  - number: 3.3.4.2
    text: De kleinste afleeseenheid mag ten hoogste een waarde hebben van 2 °C.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.4
  - number: 3.3.4.3
    text: Het meetbereik van een olietemperatuurmeter moet tenminste het gebied van 50 °C tot 100 °C omvatten.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.4
  - number: 3.3.5
    text: |-
      De opnemer moet een zodanige lengte hebben en zodanig flexibel zijn dat het temperatuurgevoelige deel op
      een eenvoudige en bedrijfszekere wijze in de olie kan worden ondergedompeld die zich in het carter van de te
      onderzoeken voertuigmotor bevindt.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.5
  - number: 3.3.6
    text: |-
      Niet-geïntegreerde olietemperatuurmeters die worden gebruikt in combinatie met een ander meetmiddel, moeten zijn
      voorzien van een signaaluitgang door middel waarvan het gemeten olietemperatuur kan worden overgedragen naar dat
      andere meetmiddel, voor zover koppeling verplicht is volgens de voorgeschreven meetmethode.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.3.6
  - number: 3.4.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.1
  - number: 3.4.1.a
    text: 'manometer: meetinstrument voor het bepalen van de pneumatische druk in voertuigsystemen;'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.1
  - number: 3.4.1.b
    text: 'geïntegreerde manometer: manometer deeluitmakend van en ingebouwd in een ander meetmiddel.'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.1
  - number: 3.4.2
    text: |-
      In afwijking van het bepaalde in [artikel 1.15][ref1] is een handleiding voor de manometer niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0009237
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 3.4.3
    text: 'De manometer moet voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.a
    text: de gemeten druk moet worden weergegeven in Pascal (Pa) of in bar;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.b
    text: |-
      de gemeten waarde moet door analoge of digitale aanwijs- of registratie-inrichtingen gemakkelijk afleesbaar en
      duidelijk worden aangegeven;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.c
    text: 'de maximale fout, in plus en in min, van de aangewezen druk bedraagt:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.c.1º
    text: |-
      in geval van een aanwijsinrichting: voor nieuwe manometers: I. bij een druk van ten hoogste 500 kPa (5 bar): 10
      kPa (0,1 bar), en II. bij een druk die groter is dan 500 kPa (5 bar): 2%; voor manometers die in gebruik zijn: I.
      bij een druk van ten hoogste 500 kPa (5 bar): 12,5 kPa (0,125 bar); II. bij een druk die groter is dan 500 kPa (5
      bar): 2,5%;
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.c.2º
    text: |-
      in geval van een registratie-inrichting: voor nieuwe manometers: I. bij een druk van ten hoogste 500 kPa (5 bar):
      20 kPa (0,2 bar), en II. bij een druk die groter is dan 500 kPa (5 bar): 4%; voor manometers die in gebruik zijn:
      I. bij een druk van ten hoogste 500 kPa (5 bar): 25 kPa (0,25 bar); II. bij een druk die groter is dan 500 kPa (5
      bar): 5%.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.3.d
    text: |-
      indien gelijktijdig met de registratie van de druk door middel van dezelfde registratie-inrichting een registratie
      van de remvertraging of remkracht plaatsvindt, mag in de registratie van gelijktijdige veranderingen in de
      betrokken meetsignalen, geen tijdverschil optreden waardoor een goede beoordeling van het remsysteem van het
      voertuig wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.3
  - number: 3.4.4
    text: 'Manometers in gebruik genomen vóór 1 juli 1998:'
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.4
  - number: 3.4.4.a
    text: |-
      behoeven niet te voldoen aan het bepaalde in [paragraaf 2.3][ref1] en [3][ref2] van [hoofdstuk 1][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
