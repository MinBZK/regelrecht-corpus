  - number: 3.5.3.c
    text: |-
      behoeven, voor zover het pedaalkrachtmeters betreft in gebruik genomen vóór 1 januari 1984, niet te voldoen aan
      [artikel 3.5.2, onderdeel b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel3
    url: https://wetten.overheid.nl/BWBR0009237/2008-12-10#Artikel3.5.3
    references:
      - id: ref1
