articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: Archief: Het geheel (een verzameling) van archiefbescheiden, ontvangen
      of opgemaakt door een instelling, persoon of groep personen en naar hun aard bestemd daar onder te berusten.
      Archiefbeheer: De feitelijke of uitvoerende werkzaamheden om archiefbescheiden in goede, geordende en
      toegankelijke staat te brengen en te bewaren, als ook om archiefbescheiden die daarvoor in aanmerking komen
      te vernietigen. Archiefbeheerder: Degene die namens de Secretaris-generaal verantwoordelijk is voor het laten
      uitvoeren van een effectief en efficiënt archiefbeheer voor de onder hen vallende archiefvormende onderdelen.
      Archiefbeherende onderdelen: Binnen het Ministerie van Financiën worden de onderdelen die tot taak hebben de
      feitelijke of uitvoerende werkzaamheden met betrekking tot het archiefbeheer uit te voeren als archiefbeherend
      onderdeel aangemerkt. Archiefbescheiden: Bescheiden conform [artikel 2 van de Archiefwet][ref1], ongeacht hun
      vorm, door de overheidsorganen ontvangen of opgemaakt en naar hun aard bestemd daaronder te berusten. Dit houdt
      in dat deze bescheiden de neerslag zijn van of gebruikt zijn bij activiteiten of handelingen op een bepaald
      beleidsterrein en/of beleidsprocessen. Archiefvormende onderdelen: Binnen het Ministerie van Financiën worden
      de daaronder vallende organisatieonderdelen, buitendiensten, raden, commissies en projectorganisaties als
      archiefvormende onderdelen aangemerkt. Archiefwettelijke zorg: De algemene bestuurlijke verantwoordelijkheid voor
      de uitvoering van de [Archiefwet][ref2]. Hieronder is ook begrepen de verantwoordelijkheid voor een efficiënt en
      effectief archiefbeheer, geschikte huisvesting, deskundig personeel, het vaststellen van beheersvoorschriften en
      voldoende financiële middelen. Afdoening: Het bijhouden en bewaken van de (tijdige) afhandeling van documenten.
      Beheersregels: 'Regels voor het archiefbeheer om te kunnen voldoen aan de wettelijke bepalingen. Beleidsterrein:'
      Geheel van relaties tussen archiefvormende organen die handelingen of activiteiten verrichten in het kader van
      een bepaald overheidsbeleid, dat voortvloeit uit een overheidstaak. Bijzondere informatie: Staatsgeheimen en
      overige niet-staatsgeheime informatie waarvan kennisname door niet gerechtigden nadelige tot zeer ernstige gevolgen
      kan hebben voor de belangen van de Staat, van zijn bondgenoten of van één of meer Ministeries. Document: Object
      of een voorwerp dat gegevens draagt met het doel deze gegevens eraan te ontlenen en te gebruiken. Documentair
      structuurplan: Systematische identificatie en ordening van bedrijfsprocessen of handelingen en/of archiefbescheiden
      in categorieën overeenkomstig logisch gestructureerde conventies, methoden en procedureregels. Documentaire
      informatievoorziening: Het voorzien in informatie door middel van het creëren, identificeren, verzamelen,
      verwerken, vastleggen en het ontsluiten van documenten en ter beschikking stellen. Dossier: Het geheel van
      archiefbescheiden ontvangen of opgemaakt door een archiefvormend orgaan bij het verrichten van handelingen ten
      aanzien van of een zaak, of een object of een subject. Duurzame staat: Een zodanige staat van de informatiedrager
      en de daarop vastgelegde informatie, als ook een zodanige materiële verzorging, dat raadpleging nu en in de
      toekomst mogelijk blijft. Indexering: Proces van het vaststellen van zoekkenmerken om het terugzoeken van
      archiefbescheiden en/of informatie te vergemakkelijken. Metagegevens (metadata): Gegevens die context, inhoud en
      structuur van archiefbescheiden en hun beheer door de tijd heen beschrijven. Minister: De Minister van Financiën.
      Is de zorgdrager voor het Ministerie van Financiën, zoals bedoeld in [artikel 1 van de Archiefwet][ref3].
      Ministerie: 'Het Ministerie van Financiën. Overbrenging: Het blijvend voor bewaring overdragen van de zorg en het'
      beheer van daarvoor in aanmerking komende archiefbescheiden aan een archiefbewaarplaats (het Nationaal Archief).
      (Rapport) institutioneel onderzoek: Een contextbeschrijving van de beleidsterreinen van een overheidsorgaan,
      waarop dit orgaan handelend optreedt. Registratie: Handelingen die nodig zijn om documenten zodanig vast te
      leggen, dat deze documenten kunnen worden geïdentificeerd, toegankelijk kunnen worden gemaakt en ter beschikking
      kunnen worden gesteld. Reproductie: Elke gelijkluidende weergave van een origineel in een andere gedaante of op
      een andere drager. Rubriceren: Het vaststellen dat een gegeven een staatsgeheim of departementaal vertrouwelijk
      is en volgens de Rubriceringslijst Ministerie van Financiën 2007 bepalen van de mate van beveiligingsgradatie die
      hieraan dient te worden gegeven. Selectielijst: Een vorm van een wettelijk voorgeschreven selectie-instrument voor
      de selectie van overheidsarchieven in te bewaren en te vernietigen archiefbescheiden, inclusief de selectietermijn.
      Substitutie: 'Zie vervanging. Toezicht: Het houden van toezicht op de ambtelijke verantwoordelijkheid voor (de'
      kwaliteit) van het archiefbeheer. Vervanging: Vervangen van archiefbescheiden door reproducties. Vernietiging:
      Het zodanig materieel bewerken van de informatiedrager (o.a. papier, geluidsband, film, diskette, CD-rom) dat
      de daarop vastgelegde informatie niet meer te reconstrueren is. Vervreemding: Het in eigendom overdragen van
      archiefbescheiden aan een ander overheidsorgaan. Voortgang: Het bijhouden en bewaken van de (tijdige) behandeling
      van een document door de organisatie heen (op basis van de verblijfplaatsen of de routing van een document).
      Zorgdrager: De Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007376
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007376
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '2.1'
    text: |-
      De beheersregels zijn van toepassing op het beheer van alle archiefbescheiden, ongeacht hun vorm, van het
      kerndepartement en de dienst Domeinen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel2
  - number: '2.2'
    text: De beheersregels zijn niet van toepassing op het beheer van archiefbescheiden van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel2
  - number: '3'
    text: |-
      De Minister van Financiën is de zorgdrager, zoals bedoeld in [artikel 1 van de Archiefwet][ref1], voor de
      archiefbescheiden van het Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '4.1'
    text: |-
      De Secretaris-generaal is namens de Minister verantwoordelijk voor de zorg voor het beheer van de archiefbescheiden
      van het Ministerie en voor de voorwaarden om een goed archiefbeheer mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel4
  - number: '4.2'
    text: |-
      De Secretaris-generaal stelt hiervoor beheersregels vast en draagt zorg voor publicatie hiervan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel4
  - number: '4.3'
    text: De Secretaris-generaal is verantwoordelijk voor de kwaliteit van het archiefbeheer bij het Ministerie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel4
  - number: '4.4'
    text: De Secretaris-generaal mandateert deze verantwoordelijkheid aan de afzonderlijke Archiefbeheerders.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel4
  - number: '5.1'
    text: |-
      De plaatsvervangend Secretaris-generaal heeft als Archiefbeheerder een coördinerende en informerende taak met
      betrekking tot de uitvoering van het toezicht op de kwaliteit van het archiefbeheer bij het kerndepartement.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel5
  - number: '5.2'
    text: |-
      De plaatsvervangend Secretaris-generaal rapporteert, zo dit nodig wordt geacht, hierover aan de Erfgoedinspectie
      van het Ministerie van OCenW.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel5
  - number: '6'
    text: |-
      De Auditdienst Financiën (ADF) is namens de Secretaris-generaal, belast met het toezicht op het archiefbeheer bij
      het Ministerie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel6
  - number: '7.1'
    text: |-
      Voor het Ministerie worden hierin onderscheiden: de plaatsvervangend Secretaris-generaal voor het kerndepartement
      en de directeur-generaal voor de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
  - number: '7.2'
    text: |-
      Gelet op [artikel 4][ref1] en [5 van het organisatie- en mandaatbesluit Ministerie van Financiën][ref2] kunnen
      de Archiefbeheerders hun verantwoordelijkheid voor het archiefbeheer ondermandateren aan de onder hem / haar
      ressorterende directeuren [zie [bijlage 1][ref3]].


      [ref1]: https://wetten.overheid.nl/BWBR0018723#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018723#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024157
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018723
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018723
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024157
  - number: '7.3'
    text: |-
      De Archiefbeheerders zijn namens de Secretaris-generaal verantwoordelijk voor het laten uitvoeren van een effectief
      en efficiënt archiefbeheer voor de onder hen vallende archiefvormende onderdelen in overeenstemming met het
      bepaalde in deze beheersregels en andere van toepassing zijnde regelgeving.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
  - number: '7.4'
    text: |-
      De plaatsvervangend Secretaris-generaal, respectievelijk de directeur-generaal voor de Belastingdienst, stellen
      conform [artikel 14 Archiefbesluit 1995][ref1] beheersregels vast omtrent het archiefbeheer van de onder hen
      ressorterende archiefvormende onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel14
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '14'
  - number: '7.5'
    text: |-
      Nadere beleidsregels, richtlijnen en procedures voor de uitvoering van het archiefbeheer worden door de
      archiefbeheerders vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
  - number: '7.6'
    text: |-
      Het feitelijke archiefbeheer laten de Archiefbeheerders uitvoeren door de onder hun verantwoordelijkheid vallende
      archiefbeherende onderdelen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
  - number: '7.7'
    text: De Archiefbeheerders leggen verantwoording af aan de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel7
  - number: '8.1'
    text: |-
      De archiefbeherende onderdelen zorgen voor voldoende en geschikte archiefruimte, voor voldoende en deskundig
      personeel en voor voldoende financiële middelen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.2'
    text: |-
      De archiefbeherende onderdelen hebben tot taak de archiefbescheiden in goede, geordende en toegankelijke staat
      te brengen en te bewaren, als ook zorg te dragen voor de vernietiging van de daarvoor in aanmerking komende
      archiefbescheiden in overeenstemming met het bepaalde in deze beheersregels en andere van toepassing zijnde
      regelgeving.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.3'
    text: |-
      Het archiefbeherende onderdeel van het kerndepartement stelt beheersregels op, onderhoudt deze en zorgt voor de
      interne verspreiding en voorlichting.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.4'
    text: |-
      De archiefbeherende onderdelen stellen voor de uitvoering van hun taken zo nodig nadere beleidsregels, richtlijnen
      en procedures op.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.5'
    text: |-
      De archiefbeherende onderdelen maken waar nodig afspraken met het management van de archiefvormende onderdelen over
      de uitvoering van het archiefbeheer.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.6'
    text: |-
      De archiefbeherende onderdelen geven periodiek aan welke activiteiten en middelen nodig zijn voor het uitvoeren van
      het archiefbeheer en rapporteren hierover jaarlijks aan hun Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '8.7'
    text: |-
      De archiefbeherende onderdelen leggen over de uitvoering van hun archiefbeheer verantwoording af aan hun
      Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel8
  - number: '9.1'
    text: De archiefvormende onderdelen zijn de binnen het Ministerie te onderscheiden dienstonderdelen (directies).
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
  - number: '9.2'
    text: |-
      Onder de archiefvormende onderdelen worden eveneens begrepen de tijdelijke raden, formeel ingestelde commissies en
      projectorganisaties die onder de archiefwettelijke zorg van de Minister vallen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
  - number: '9.3'
    text: |-
      Onder de archiefvormende onderdelen worden tevens begrepen de zelfstandige bestuursorganen en geprivatiseerde
      onderdelen waarvan de archieven vóór de verzelfstandiging dan wel privatisering onder de archiefwettelijke zorg van
      de Minister vallen, dan wel publiekrechtelijke zelfstandige bestuursorganen zonder rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
  - number: '9.4'
    text: |-
      De archiefvormende onderdelen verzamelen, ontvangen en/of produceren en bewaren gegevens nodig voor hun
      activiteiten en handelingen op hun beleidsterrein. Dit zijn archiefbescheiden in de zin van de [Archiefwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '9.5'
    text: De archiefvormende onderdelen zijn in deze hoedanigheid als gegevenseigenaar aan te merken.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
  - number: '9.6'
    text: |-
      De archiefvormende onderdelen zijn ervoor verantwoordelijk hun archiefbescheiden in beheer over te dragen aan hun
      archiefbeherend onderdeel in overeenstemming met het bepaalde in deze beheersregels en de hierover onderling nader
      gemaakte beheersafspraken.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel9
  - number: '10.1'
    text: |-
      De secretarissen van raden, formeel ingestelde commissies en projectorganisaties beheren hun archief in overleg met
      het archiefbeherende onderdeel. Zij brengen het archiefbeherende onderdeel op de hoogte van de instelling van de
      raad, commissie of projectorganisatie, bij voorkeur door middel van een kopie van de instellingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel10
  - number: '10.2'
    text: |-
      De secretarissen zorgen ervoor dat, zodra dit mogelijk is, afgesloten archiefbestanddelen worden overgedragen aan
      het betrokken archiefbeherende onderdeel. Bij opheffing wordt het archief direct overgedragen aan het betrokken
      archiefbeherende onderdeel.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel10
  - number: '10.3'
    text: |-
      De projectsecretaris draagt zorg voor een goed archiefbeheer van het projectarchief, d.w.z. de vergaderstukken en
      overige projectdocumenten
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel10
  - number: '11.1'
    text: |-
      De archiefvormende onderdelen zorgen ervoor dat de door hen ontvangen, opgemaakte en verzonden documenten, die
      daarvoor in aanmerking komen, worden geregistreerd in het document management systeem.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel11
  - number: '11.2'
    text: De archiefbeherende onderdelen hebben hierin een faciliterende rol.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel11
  - number: '11.3'
    text: |-
      Bij de documentregistratie wordt rekening gehouden met de in [artikel 13][ref1] gestelde ‘regels voor de
      informatieontsluiting’.


      [ref1]: https://wetten.overheid.nl/BWBR0024157#Artikel13
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024157
        artikel: '13'
        hoofdstuk: '5'
  - number: '11.4'
    text: |-
      Ontvangen en verzonden papieren documenten worden gescand, digitaal opgeslagen en gekoppeld aan de
      registratiegegevens in het document management systeem.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel11
  - number: '12.1'
    text: Van de geregistreerde documenten worden de voortgang en afdoening vastgelegd in het document management systeem.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.2'
    text: |-
      Bij registratie van het document worden minimaal de volgende gegevens vastgelegd en bijgehouden: - de NAW-gegevens;
        - een verkorte inhoud;
        - (wettelijke) afdoeningstermijn van het document;
        - behandelend archiefvormend onderdeel, respectievelijk behandelend medewerker.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.3'
    text: |-
      Na registratie van het ingekomen document wordt door het behandelend archiefvormend onderdeel aan de afzender een
      ontvangstbevestiging verzonden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.4'
    text: |-
      De behandelende archiefvormende onderdelen zijn verantwoordelijk voor het tijdig afdoen van de documenten. Indien
      afdoeningstermijnen niet wettelijk zijn voorgeschreven bepalen de behandelende archiefvormende onderdelen zelf de
      afdoeningstermijn voor die documenten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.5'
    text: |-
      Indien ingekomen documenten niet binnen de gestelde afdoeningstermijn kunnen worden afgedaan wordt door het
      archiefvormend onderdeel aan de afzender een tussenbericht verzonden, met vermelding van de reden waarom het
      verzoek nog niet is afgedaan en binnen welke termijn afdoening is te verwachten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.6'
    text: |-
      Direct na afhandeling van de documenten wordt door het archiefvormend onderdeel de laatste verblijfplaats
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '12.7'
    text: |-
      De papieren documenten worden door de behandelende archiefvormende onderdelen ter archivering aangeboden aan het
      archiefbeherend onderdeel.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel12
  - number: '13.1'
    text: |-
      De archiefbeherende onderdelen stemmen de informatieontsluiting van archiefbescheiden c.q. archiefbestanden af op
      de beleidsterreinen en werkprocessen van de organisatieonderdelen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel13
  - number: '13.2'
    text: |-
      De archiefbeherende onderdelen ontwikkelen en onderhouden in overleg met de organisatieonderdelen, instrumenten
      voor de informatieontsluiting van de archiefbescheiden en de daarin aanwezige gegevens.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel13
  - number: '13.3'
    text: |-
      Het ontsluiten van de archiefbescheiden wordt zodanig verricht dat het gebruik van de hierin aanwezige gegevens in
      combinatie met andere informatiebronnen of gegevensverzamelingen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel13
  - number: '14.1'
    text: |-
      Alle archiefbescheiden worden gerangschikt en geplaatst in dossiers zoals vastgelegd is in het documentaire
      structuurplan door: - de archiefbescheiden die bij de bedrijfsactiviteiten als verplicht aangemerkt worden, in
      voorkomende gevallen te plaatsen in het desbetreffende dossier;
        - de regels voor indexering en titelbeschrijving toe te passen bij het aanleggen van een dossier;
        - de regels voor het toekennen van metadata aan dossiers toe te passen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel14
  - number: '15.1'
    text: |-
      Verzoeken van derden om archiefbescheiden te mogen raadplegen worden behandeld overeenkomstig de van toepassing
      zijnde artikelen uit de [wet Openbaarheid van bestuur][ref1] (WOB) en de door de Secretaris-generaal vastgestelde
      richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '15.2'
    text: |-
      Verzoeken van derden om archiefbescheiden te mogen raadplegen moeten ter goedkeuring worden voorgelegd aan het
      betrokken archiefvormend onderdeel en aan de WOB-functionaris.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel15
  - number: '15.3'
    text: |-
      Voor onderzoeksdoeleinden dient de onderzoeker vooraf een verklaring te ondertekenen waarin bepaalde voorwaarden
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel15
  - number: '15.4'
    text: |-
      Verzoeken om informatie uit archiefbescheiden door medewerkers van het kernMinisterie die betrekking op actuele
      archiefbescheiden, worden behandeld conform de uitlening van een dossier (zie [artikel 16][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0024157#Artikel16
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024157
        artikel: '16'
        hoofdstuk: '6'
  - number: '16'
    text: |-
      Het archiefbeherend onderdeel zorgt voor het uitlenen van fysieke dossiers uit de onder haar ressorterende
      archieven en houdt hiervan een uitleenadministratie bij.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel16
  - number: '17'
    text: |-
      Het verwijderen uit dan wel toevoegen van archiefbescheiden aan een afgesloten dossier is voorbehouden aan het
      archiefbeherende onderdeel.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel17
  - number: '18.1'
    text: |-
      De archiefbeherende onderdelen stellen in overleg met de archiefvormende onderdelen documentaire structuurplannen
      op volgens het door de archiefbeheerder vastgestelde model. De bedrijfsprocessen van de archiefvormende onderdelen
      vormen het uitgangspunt bij het opstellen van documentaire structuurplannen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.2'
    text: |-
      Een documentair structuurplan is een instrument om archiefbescheiden, ongeacht de vorm, in geordende
      en toegankelijke staat te beheren met inachtneming van wettelijke kaders en eisen op het gebied van de
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.3'
    text: 'De volgende afspraken kunnen in een documentair structuurplan worden vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.a
    text: De archiefbescheiden die behoren te worden ontvangen en/ of gemaakt in ter uitvoering van een bedrijfsproces.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.b
    text: De relatie met de richtlijn documentregistratie voor deze archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.c
    text: De ordening van deze archiefbescheiden zodat deze het betreffende bedrijfsproces weerspiegelt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.d
    text: De bewaartermijn van de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.e
    text: De indexering en de titelbeschrijving van de dossiers die betrekking hebben op het betreffende bedrijfsproces.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: 18.3.f
    text: De systemen die gebruikt worden om de archiefbescheiden het betreffende werkproces te beheren.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.4'
    text: |-
      De archiefbeherende onderdelen stellen een documentair structuurplan vast waarin inzicht wordt verkregen in
      tenminste: '- de relaties tussen de taken en/of producten die de archiefvormende onderdelen uitvoeren of leveren;'
        - de wijze waarop de administratieve organisatie daartoe is ingericht;
        - de neerslag in de vorm van gegevensverzamelingen die hier het resultaat van is (zowel fysieke als digitale
      dossiers);
        - een classificatie voor de blijvend te bewaren documenten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.5'
    text: |-
      Met het documentaire structuurplan wordt de toegankelijke staat van documenten, aan de hand van de
      contextinformatie, gewaarborgd zodanig dat: - elk document binnen een redelijke termijn kan worden gevonden, hetzij
      aan de hand van het werkproces uit hoofde waarvan het document is ontvangen of opgemaakt, hetzij aan de hand van de
      afzender of geadresseerde, dan wel de datum en/of het kenmerk dat aan een document is gegeven;
        - elk document binnen een redelijke termijn leesbaar of traceerbaar te maken is;
        - documenten die niet of slechts beperkt openbaar zijn tegen raadpleging door onbevoegden beschermd wordt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.6'
    text: |-
      De archiefbeherende onderdelen stellen een set van metadata vast voor de ordening en toegankelijkheid van
      documenten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '18.7'
    text: De set van metadata vormt de basis voor een record management applicatie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel18
  - number: '19.1'
    text: |-
      De Archiefbeheerders zorgen ervoor dat op basis van de beleidsterreinen van het Ministerie rapporten Institutioneel
      Onderzoek (RIO) worden opgesteld en onderhouden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel19
  - number: '19.2'
    text: |-
      De Archiefbeheerders zorgen ervoor dat op basis van de rapporten Institutioneel Onderzoek (RIO) selectielijsten
      worden opgesteld en onderhouden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel19
  - number: '19.3'
    text: De archiefbeherende onderdelen zijn belast met de coördinatie van het goedkeuringstraject van de selectielijsten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel19
  - number: '19.4'
    text: |-
      De archiefvormende onderdelen zijn verantwoordelijk voor de interne vaststelling van de selectielijsten op hun
      beleidsterrein.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel19
  - number: '19.5'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat de vastgestelde selectielijsten bij het archiefbeheer worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel19
  - number: '20.1'
    text: |-
      De archiefbeheerders dragen zorg dat bij vervanging (substitutie) van archiefbescheiden wordt
      voldaan aan [artikel 7][ref1] en [9 van de Archiefwet 1995][ref2] en [artikel 2][ref3], [6][ref4] en
      [8 van het Archiefbesluit 1995][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007748#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007748#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0007748#Artikel8
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007748
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007748
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0007748
        artikel: '8'
  - number: '20.2'
    text: |-
      Een verzoek om formele toestemming voor vervanging van archiefbescheiden aan de minster van Onderwijs, Cultuur en
      Wetenschappen wordt door de Archiefbeheerders ingediend.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel20
  - number: '20.3'
    text: |-
      De archiefbeherende onderdelen dragen zorg voor de uitvoering van de procedure ‘vervanging vanaf verzoek tot
      feitelijke vervanging en vernietiging’.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel20
  - number: '20.4'
    text: |-
      Van de vervangen archiefbescheiden wordt door de archiefbeherende onderdelen een verklaring van vervanging
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel20
  - number: '20.5'
    text: De verklaring van vervanging wordt ter ondertekening aangeboden aan de verantwoordelijke Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel20
  - number: '21.1'
    text: |-
      De Archiefbeheerders dragen zorg dat bij de voorbereiding tot vervreemding van archiefbescheiden wordt voldaan aan
      [artikel 8 van de Archiefwet 1995][ref1] en [artikel 7 van het Archiefbesluit 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel7
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007748
        artikel: '7'
  - number: '21.2'
    text: |-
      Het voornemen tot vervreemding van archiefbescheiden dient ter beslissing te worden voorgelegd aan het betrokken
      archiefvormend onderdeel.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel21
  - number: '21.3'
    text: |-
      De archiefbeherende onderdelen dragen zorg voor de uitvoering van de procedure ‘vervreemding vanaf verzoek tot
      feitelijke vervreemding’.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel21
  - number: '21.4'
    text: |-
      Van de vervreemding van archiefbescheiden wordt door de archiefbeherende onderdelen een verklaring van vervreemding
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel21
  - number: '21.5'
    text: De verklaring van vervreemding wordt ter ondertekening aangeboden aan de verantwoordelijke Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel21
  - number: '22.1'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat de archiefbescheiden, die daarvoor op grond van een selectielijst
      in aanmerking komen, in goede, geordende en toegankelijke staat worden overgebracht naar het Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.2'
    text: |-
      De overbrenging vindt plaats in perioden, maar niet later dan 10 jaar nadat die archiefbescheiden de leeftijd van
      20 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.3'
    text: |-
      De over te brengen archiefbescheiden zijn voorzien van een toegang die aan de eisen voldoet genoemd in
      [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024157#Artikel18
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024157
        artikel: '18'
        hoofdstuk: '6'
  - number: '22.4'
    text: |-
      Bij de over te brengen archiefbescheiden wordt de benodigde toepassingsprogrammatuur en de documentatie, nodig om
      deze programmatuur te beheren, meegeleverd indien dit onmisbaar is voor de raadpleging van de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.5'
    text: |-
      Van de over te brengen archiefbescheiden wordt door het archiefbeherend onderdeel een verklaring van overbrenging
      opgemaakt. In de verklaring is aangegeven welke archiefbescheiden worden overgebracht, op welke grondslag
      overbrenging plaatsvindt en op welke wijze de duurzaamheid, de ordening en toegankelijkheid zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.6'
    text: |-
      De verklaring van overbrenging wordt door het archiefbeherend onderdeel ter medeondertekening aangeboden aan de
      betrokken archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.7'
    text: |-
      Een exemplaar van de verklaring van overbrenging wordt bewaard door het archiefbeherend onderdeel waaronder de
      archiefbescheiden in beheer zouden zijn indien zij niet overgebracht waren.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.8'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat de afgesloten archiefbescheiden, die door de organisatie niet
      meer regelmatig worden geraadpleegd, zodra dit mogelijk is, vervroegd worden overgebracht. Dit in overleg met het
      Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.9'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat de overbrenging van afgesloten archiefbescheiden, die door de
      organisatie nog regelmatig worden geraadpleegd, wordt opgeschort. Dit alleen indien hiertoe een machtiging is
      verkregen van de Minister van OCenW en in overleg met het Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.10'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat bij de overbrenging van afgesloten archiefbescheiden, waaraan
      beperkingen aan de openbaarheid zijn gesteld, bepalingen ter zake worden opgenomen in de verklaring van
      overbrenging. Dit in overleg met het Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
  - number: '22.11'
    text: |-
      Bij opschorting van overbrenging zijn de openbaarheidregels van de [Archiefwet][ref1] op de niet overgebrachte
      archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '23.1'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat vernietiging van de archiefbescheiden, die daarvoor op grond van
      een selectielijst in aanmerking komen, worden vernietigd nadat de daarvoor in de selectielijst vastgestelde termijn
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.2'
    text: |-
      De archiefbeherende onderdelen stellen de archiefvormende onderdelen op de hoogte van het voornemen tot
      vernietiging.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.3'
    text: |-
      Van de te vernietigen archiefbescheiden wordt door het archiefbeherend onderdeel een verklaring van vernietiging
      opgesteld. In de verklaring is aangegeven welke archiefbescheiden zijn vernietigd, op welke grondslag vernietiging
      heeft plaatsgevonden en op welke wijze de archiefbescheiden zijn vernietigd.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.4'
    text: |-
      De verklaring van vernietiging wordt door het archiefbeherend onderdeel ter medeondertekening aangeboden aan de
      betrokken Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.5'
    text: |-
      Een exemplaar van de verklaring van vernietiging wordt bewaard door het archiefbeherend onderdeel waaronder de
      archiefbescheiden in beheer zouden zijn, indien zij niet vernietigd waren.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.6'
    text: |-
      Vernietiging van de archiefbescheiden vindt plaats door een gespecialiseerd vernietigingsbedrijf onder toezicht van
      het archiefbeherende onderdeel.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
  - number: '23.7'
    text: |-
      Indien op grond van [artikel 9 lid 2 van de Archiefwet][ref1] in bijzondere omstandigheden moet worden afgeweken
      van de voorgeschreven vernietigingsprocedures dragen de archiefbeherende onderdelen zorg voor de uitvoering van de
      dan geldende regels voor noodvernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel9
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '9'
  - number: '24.1'
    text: |-
      De daartoe namens de Secretaris-generaal aangewezen functionaris die de inhoud van een gerubriceerd document
      vaststelt is verantwoordelijk voor de graad van de rubricering. Hij of zij is tevens bevoegd de rubricering te
      herzien of te beëindigen (derubriceren).
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.2'
    text: |-
      Gerubriceerde bijzondere informatie van de categorie staatsgeheim wordt geopend, geregistreerd, behandeld,
      verzonden en gearchiveerd door de daartoe bevoegde medewerkers volgens de regels gesteld in de richtlijnen
      documentregistratie. Alleen functionarissen die een positief veiligheidsonderzoek van de AIVD hebben doorstaan zijn
      bevoegd kennis te nemen van bijzondere informatie van de categorie staatsgeheim.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.3'
    text: |-
      Bijzondere informatie van de categorie departementaal vertrouwelijk wordt geopend, geregistreerd, behandeld,
      verzonden en gearchiveerd conform de richtlijnen voor documentregistratie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.4'
    text: |-
      Kennisname van departementaal vertrouwelijke informatie is voorbehouden aan functionarissen die uit hoofde van hun
      functie door het betrokken archiefvormend onderdeel hiertoe zijn geautoriseerd.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.5'
    text: |-
      Het kopiëren of andere vormen van reproduceren van bijzondere informatie geschiedt conform de regels gesteld in het
      VIR-BI.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.6'
    text: |-
      Bijzondere informatie die volgens een vastgestelde selectielijst niet voor vernietiging in aanmerking komt en ouder
      is dan 20 jaar, wordt nadat deze is gederubriceerd naar het Nationaal Archief overgebracht.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.7'
    text: |-
      Indien bijzondere informatie volgens een vastgestelde selectielijst voor vernietiging in aanmerking komt, dan wordt
      deze na het verstrijken van de vernietigingstermijn vernietigd.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.8'
    text: |-
      Informatiesystemen waar gegevens met bijzondere informatie worden vastgelegd worden op een hoger niveau beveiligd
      dan de Baseline Informatiebeveiliging Financiën (2007) biedt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '24.9'
    text: |-
      De archiefvormende onderdelen zijn verantwoordelijk voor het treffen van beveiligingsmaatregelen voor hun
      bijzondere informatie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel24
  - number: '25.1'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat (afgesloten) archiefbestanddelen worden bewaard in speciaal
      daarvoor bestemde archiefruimten.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel25
  - number: '25.2'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat in geval van calamiteit zodanige maatregelen zijn en worden
      getroffen dat de archiefbescheiden die zich in de archiefruimten bevinden, zo min mogelijk gevaar lopen. Hiertoe
      stellen de archiefbeherende onderdelen een calamiteitenplan op.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel25
  - number: '25.3'
    text: |-
      De archiefbeherende onderdelen zorgen ervoor dat archiefruimten waarin te bewaren
      archiefbescheiden worden bewaard voldoen aan de normen die zijn opgenomen in
      [artikel 2 tot en met 6 van de Regeling bouw en inrichting archiefruimten en archiefbewaarplaatsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel2
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '2'
  - number: '25.4'
    text: |-
      Van de in archiefruimten opgeslagen bestanden wordt door de archiefbeherende onderdelen een bestandsadministratie
      bijgehouden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel25
  - number: '25.5'
    text: |-
      Archiefruimten dienen ten minste een keer per jaar worden gecontroleerd op de normen die zijn opgenomen in
      [artikel 2 tot en met 6 van de Regeling bouw en inrichting archiefruimten en archiefbewaarplaatsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012803#Artikel2
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012803
        artikel: '2'
  - number: '26.1'
    text: |-
      De Archiefbeheerders dragen zorg dat bij een verandering in de organisatie van het Ministerie,
      door opheffing, samenvoeging, splitsing of door overdracht van taken, een voorziening wordt
      getroffen betreffende de bestemming en het beheer van de archiefbescheiden met inachtneming van het
      [Besluit Archiefoverdrachten Rijksadministratie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004427
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004427
  - number: '26.2'
    text: |-
      Indien deze voorziening bestaat uit het ter beschikking stellen van archiefbescheiden dan wordt door het betrokken
      archiefbeherend onderdeel een verklaring van terbeschikkingstelling opgemaakt.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel26
  - number: '26.3'
    text: |-
      De verklaring van terbeschikkingstelling wordt door het archiefbeherend onderdeel ter ondertekening aangeboden aan
      de verantwoordelijke Archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel26
  - number: '27'
    text: |-
      De in dit Statuut opgenomen beheersregels zijn van toepassing op alle archiefbescheiden, ongeacht hun vorm en
      informatiedrager. Dat wil zeggen dat deze ook van toepassing zijn op het beheer van digitale archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel27
  - number: '28.1'
    text: |-
      De Secretaris-generaal is verantwoordelijk voor de kwaliteit van het archiefbeheer bij het Ministerie van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel28
  - number: '28.2'
    text: |-
      De Archiefbeheerders zorgen ervoor dat de kwaliteit van het archiefbeheer bij hun eigen dienstonderdelen voldoet
      aan de hiervoor geldende regels.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel28
  - number: '28.3'
    text: |-
      De Auditdienst Financiën (ADF) voert in opdracht van de Secretaris-generaal een kwaliteitstoets uit ten aanzien van
      het archiefbeheer bij de dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel28
  - number: '28.4'
    text: De uitkomsten van de kwaliteitstoets worden aan de Secretaris-generaal gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel28
  - number: '28.5'
    text: |-
      Waar dit nodig wordt geacht meldt de Secretaris-generaal de onder [artikel 4][ref1] bedoelde rapportage aan de
      Erfgoedinspectie van het Ministerie van OCenW.


      [ref1]: https://wetten.overheid.nl/BWBR0024157#Artikel4
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024157
        artikel: '4'
        hoofdstuk: '3'
  - number: '29.1'
    text: |-
      Het Statuut Documentaire Informatievoorziening Financiën, vastgesteld op 10 februari 2000 (nr. IAZ 2000/222 M) komt
      hiermee te vervallen.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel29
  - number: '29.2'
    text: Deze regeling wordt gepubliceerd in de Staatscourant en treedt in werking met ingang van de dag van publicatie.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel29
  - number: '29.3'
    text: Deze regeling wordt toegezonden aan de betrokken Archiefbeheerders en alle hoofden van dienst (directeuren).
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel29
  - number: '29.4'
    text: Deze regeling wordt aangehaald als ‘Statuut documentaire informatievoorziening Financiën, 2008’.
    url: https://wetten.overheid.nl/BWBR0024157/2008-07-11#Artikel29
