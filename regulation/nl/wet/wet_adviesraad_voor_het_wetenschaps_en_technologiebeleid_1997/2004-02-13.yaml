preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is een vast college van advies voor de regering en de
    Staten-Generaal in te stellen op het terrein van het wetenschaps- en het technologiebeleid en dat het in verband
    met artikel 79 van de Grondwet noodzakelijk is daartoe wettelijke bepalingen vast te stellen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008525/2004-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 Er is een Adviesraad voor het wetenschaps- en technologiebeleid, hierna te noemen de raad.


      2 De raad bestaat uit ten minste negen en ten hoogste twaalf leden.
    url: https://wetten.overheid.nl/BWBR0008525/2004-02-13#Artikel1
  - number: '2'
    text: >-
      1 De raad heeft tot taak de regering en de Staten-Generaal te adviseren over het te voeren wetenschaps- en
      technologiebeleid in nationaal en internationaal verband, daaronder begrepen de wetenschappelijke en technologische
      informatieverzorging.


      2 De raad heeft tevens tot taak op het verzoek van de Minister van Onderwijs, Cultuur en Wetenschap verkenningen op
      het gebied van wetenschap en technologie uit te voeren, dan wel deze te doen uitvoeren. De raad stelt de resultaten
      van deze verkenningen in de vorm van rapporten algemeen verkrijgbaar en brengt deze ter kennis van de daarvoor in
      aanmerking komende instellingen op het gebied van wetenschap en technologie.
    url: https://wetten.overheid.nl/BWBR0008525/2004-02-13#Artikel2
  - number: '3'
    text: >-
      Deze wet treedt in werking met ingang van 1 januari 1997. Indien het Staatsblad waarin deze wet wordt geplaatst,
      wordt uitgegeven na 1 januari 1997, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst, en werkt terug tot en met 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008525/2004-02-13#Artikel3
  - number: '4'
    text: 'Deze wet wordt aangehaald als: Wet Adviesraad voor het wetenschaps- en technologiebeleid 1997.'
    url: https://wetten.overheid.nl/BWBR0008525/2004-02-13#Artikel4
