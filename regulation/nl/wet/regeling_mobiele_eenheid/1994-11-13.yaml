preamble:
  text: |-
    Gelet op de artikelen 6, 12, en 17, derde lid, van het Besluit Beheer Regionale Politiekorpsen en artikel 48,
    eerste lid van de Politiewet 1993;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#ArtikelAanhef
articles:
  - number: '1'
    text: De mobiele eenheid bestaat uit basiseenheden, aanhoudingseenheden, eenheden te water en teams van een waterwerper.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel1
  - number: '2'
    text: Een basiseenheid kan bestaan uit één of meer groepen, secties, pelotons en compagnies.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel2
  - number: '3'
    text: |-
      1 Een groep van een basiseenheid bestaat uit:

      a. een groepscommandant,

      b. een chauffeur, die tevens het Eerste Hulp materiaal beheert,

      c. negen leden, waaronder een plaatsvervangend groepscommandant.

      2 Een groep heeft de beschikking over een groepsvoertuig.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel3
  - number: '4'
    text: |-
      1 Een sectie van een basiseenheid bestaat uit:

      a. een sectiecommandant, en

      b. twee groepen, waaronder een plaatsvervangend sectiecommandant.

      2 Een sectie heeft bij zelfstandig optreden de beschikking over een commandovoertuig met een chauffeur en een
      verbindingsspecialist.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel4
  - number: '5'
    text: |-
      1 Een peloton van een basiseenheid bestaat uit:

      a. een pelotonscommandant, en

      b. twee secties, waaronder een plaatsvervangend pelotonscommandant.

      2 Een peloton heeft de beschikking over een commandovoertuig met een chauffeur en een verbindingsspecialist.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel5
  - number: '6'
    text: |-
      1 Een compagnie van een basiseenheid bestaat uit:

      a. een compagniescommandant en een plaatsvervangend compagniescommandant,

      b. twee of meer pelotons.

      3 Een compagnie heeft de beschikking over een commandovoertuig met een chauffeur en twee verbindingsspecialisten.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel6
  - number: '7'
    text: |-
      1 De korpsbeheerder draagt er zorg voor dat uit een peloton een groep als bedoeld in [artikel 2][ref1], kan worden
      samengesteld die geoefend is in het gebruik van CS-traangas.

      2 De korpsbeheerder draagt er zorg voor dat uit een peloton een groep kan worden samengesteld die geoefend is in
      het gebruik van een semi-automatisch vuurwapen, merk Heckler en Koch, type MP5A2, kaliber 9 millimeter maal 19
      millimeter.


      [ref1]: https://wetten.overheid.nl/BWBR0006554#Artikel2
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006554
        artikel: '2'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 De korpsbeheerder draagt er zorg voor dat de leden die ingezet kunnen worden met het in
      [artikel 7, tweede lid][ref1], genoemde semi-automatisch vuurwapen zijn uitgerust met een kogelwerend vest en een
      kogelwerende helm.

      2 De korpsbeheerder draagt er zorg voor dat de leden van de mobiele eenheid van de regio zijn uitgerust met
      beschermende kleding, overeenkomstig [bijlage 1 van de Kledingregeling voor de politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006554#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006553
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006554
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006553
  - number: '9'
    text: |-
      1 De korpsbeheerder draagt zorg voor een voorziening van basiseenheden die op de behoefte in de regio is
      toegesneden.

      2 Het regionaal politiekorps moet ten minste het in [bijlage 1][ref1] bij deze regeling bepaalde aantal pelotons of
      secties voor bijstand beschikbaar hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006554
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006554
  - number: '10'
    text: |-
      De aanvraag van de korpsbeheerder voor bijstand van de mobiele eenheid wordt slechts ingewilligd indien hij de
      mobiele eenheid van zijn regio volledig heeft ingezet.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel10
  - number: '11'
    text: |-
      De korpsbeheerder draagt er zorg voor dat de binnen zijn regio aanwezige eenheden die op basis van
      [bijlage 1][ref1] voor de bijstand beschikbaar moeten zijn, binnen anderhalf uur inzetbaar zijn voor vertrek.
      Indien meer dan één peloton op basis van [bijlage 1][ref2] voor de bijstand beschikbaar moet zijn, dan moet in
      ieder geval het eerste peloton binnen anderhalf uur inzetbaar zijn voor vertrek. De overige pelotons of secties
      moeten binnen vier uur inzetbaar zijn voor vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0006554
      [ref2]: https://wetten.overheid.nl/BWBR0006554
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006554
      - id: ref2
        bwb_id: BWBR0006554
  - number: '12'
    text: Een aanhoudingseenheid kan bestaan uit één of meer groepen of secties of één peloton.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel12
  - number: '13'
    text: |-
      1 Een groep van een aanhoudingseenheid bestaat uit:

      a. een groepscommandant, en

      b. zes leden, waaronder een plaatsvervangend groepscommandant.

      2 Een groep van een aanhoudingseenheid heeft de beschikking over een aanhoudingsvoertuig met een chauffeur.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel13
  - number: '14'
    text: |-
      1 Een sectie van een aanhoudingseenheid bestaat uit:

      a. een sectiecommandant, en

      b. twee groepen, waaronder een plaatsvervangend sectiecommandant.

      2 Een sectie van een aanhoudingseenheid heeft bij zelfstandig optreden de beschikking over een commandovoertuig met
      een chauffeur en een verbindingsspecialist.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel14
  - number: '15'
    text: |-
      1 Een peloton van een aanhoudingseenheid bestaat uit:

      a. een pelotonscommandant,

      b. twee secties, waaronder een plaatsvervangend pelotonscommandant

      2 Een peloton heeft de beschikking over een commandovoertuig met een chauffeur en een verbindingsspecialist.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel15
  - number: '16'
    text: |-
      De korpsbeheerder draagt al dan niet tezamen met een of meer korpsbeheerders van andere regionale politiekorpsen
      zorg voor een voorziening van aanhoudingseenheden.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel16
  - number: '17'
    text: |-
      1 De regionale politiekorpsen, bedoeld in [bijlage 2][ref1] bij deze regeling, houden een peloton voor bijstand
      beschikbaar dat tevens geschikt en in staat is aan boord van of rond een vaartuig op te treden.

      2 De korpsbeheerder draagt er zorg voor dat een peloton als bedoeld in het eerste lid geoefend is om rond of aan
      boord van een vaartuig op te treden.

      3 De korpsbeheerder draagt er zorg voor dat de leden van een peloton als bedoeld in het eerste lid zijn uitgerust
      met zwemvesten.

      4 De korpsbeheerder van de regio Rotterdam-Rijnmond draagt er zorg voor dat ten behoeve van de eenheid, bedoeld in
      het eerste lid, kan worden beschikt over:

      a. twee vaartuigen;

      b. een commando-vaartuig;

      c. een reddingsvaartuig.

      5 De korpsbeheerder van de regio Rotterdam-Rijnmond draagt er zorg voor dat de vaartuigen als bedoeld in het vierde
      lid zijn voorzien van een geoefende bemanning.

      6 De korpsbeheerder van de regio Rotterdam-Rijnmond draagt er zorg voor dat de commandant van een vaartuig, bedoeld
      in het vierde lid, in staat is om samen te werken met een commandant van een basiseenheid en met een commandant van
      een vaartuig van het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0006554
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006554
  - number: '18'
    text: |-
      1 De regio's Amsterdam-Amstelland, Rotterdam-Rijnmond en Haaglanden hebben de beschikking over een of meer
      waterwerpers en een bijbehorend team.

      2 Een team van een waterwerper bestaat uit:

      a. een commandant,

      b. een chauffeur, en

      c. twee kanonniers, waarvan er één plaatsvervangend chauffeur is.

      3 De korpsbeheerder van een regio, genoemd in het eerste lid, stelt de waterwerper met een team ter beschikking van
      een andere korpsbeheerder indien deze daarom verzoekt.

      4 De korpsbeheerder draagt er zorg voor dat per waterwerper ten minste twee teams voor inzet beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel18
  - number: '19'
    text: |-
      De korpsbeheerder maakt op basis van de organisatiestructuur van de mobiele eenheid voor het grootschalig optreden
      een verbindingsschema voor het gebruik van de verbindingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel19
  - number: '20'
    text: |-
      Onze Minister van Binnenlandse Zaken, in overeenstemming met de Minister van Justitie voor zover het de
      aanhoudingseenheden betreft, kan nadere regels geven voor:

      a. de uitrusting van de mobiele eenheid,

      b. de voertuigen en de vaartuigen die door de mobiele eenheid worden gebruikt,

      c. de frequenties en aantallen van de verbindingsmiddelen van de mobiele eenheid naar eenheid, voertuig en
      vaartuig.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel20
  - number: '21'
    text: |-
      1 Een ambtenaar van politie kan lid worden van de mobiele eenheid indien hij:

      a. drie jaar werkzaam is in de basispolitiezorg,

      b. voldoet aan de door de Minister van Binnenlandse Zaken, in overeenstemming met de Minister van Justitie voor
      zover het de aanhoudingseenheden betreft, gestelde geschiktheidseisen, en

      c. de basisopleiding mobiele eenheden heeft afgerond.

      2 Voor de volgende functies binnen de mobiele eenheid gelden aanvullende eisen:

      a. een groepscommandant en een commandant als bedoeld in [artikel 17][ref1], heeft ten minste schaal 8;

      b. een sectiecommandant heeft ten minste schaal 9;

      c. een pelotonscommandant heeft ten minste schaal 10;

      d. een compagniescommandant heeft ten minste schaal 12.

      3 De ambtenaar van politie die deel uitmaakt van de mobiele eenheid, heeft voldaan aan de eindtermen van de door de
      Minister van Binnenlandse Zaken aan te wijzen vervolgopleiding. Het aanwijzen geschiedt in overeenstemming met de
      Minister van Justitie voor zover het de vervolgopleiding voor de aanhoudingseenheid betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006554#Artikel17
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006554
        artikel: '17'
        paragraaf: '5'
  - number: '22'
    text: |-
      1 Een lid van de mobiele eenheid volgt jaarlijks tweemaal een door de korpsbeheerder verzorgde voortgezette
      opleiding mobiele eenheid.

      2 De korpsbeheerder draagt er zorg voor dat de voortgezette opleiding mobiele eenheid ten minste 40 oefenuren per
      jaar inhoudt.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel22
  - number: '23'
    text: |-
      De korpsbeheerder wijst een ambtenaar aan die wordt belast met de coördinatie van de mobiele eenheid in het
      regionaal politiekorps.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel23
  - number: '24'
    text: |-
      1 De korpsbeheerder stelt jaarlijks een beleidsplan voor de mobiele eenheid op waarin wordt aangegeven op welke
      wijze aan de eisen, bedoeld in deze regeling uitvoering is gegeven.

      2 De korpsbeheerder zendt het beleidsplan, bedoeld in het eerste lid, aan de commissaris van de Koning in de
      provincie en de procureur-generaal bij het gerechtshof binnen welks rechtsgebied de regio is gelegen.

      3 De korpsbeheerder zendt het beleidsplan vóór 1 september ter goedkeuring aan de Minister van Binnenlandse
      Zaken. Voor zover het de aanhoudingseenheden betreft wordt het beleidsplan tevens door de Minister van Justitie
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel24
  - number: '25'
    text: |-
      De korpsbeheerder draagt er zorg voor dat binnen het regionaal politiekorps voldoende opvang wordt gegeven aan de
      ingezette leden na een optreden van de mobiele eenheid.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel25
  - number: '26'
    text: |-
      De burgemeester maakt, in overeenstemming met de officier van justitie, van elk grootschalig optreden door de
      mobiele eenheid waarbij ernstige verstoring van de openbare orde is ontstaan, een evaluatierapport op, dat door
      tussenkomst van de korpsbeheerder aan de ministers wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel26
  - number: '27'
    text: Deze regeling treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel27
  - number: '28'
    text: 'Deze regeling wordt aangehaald als: Regeling mobiele eenheid.'
    url: https://wetten.overheid.nl/BWBR0006554/1994-11-13#Artikel28
