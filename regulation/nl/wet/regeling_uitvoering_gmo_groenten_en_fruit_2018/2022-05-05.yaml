  - number: '171'
    text: |-
      1 Een voorafgaande melding, bedoeld in artikel 44, eerste lid, van [verordening 2017/891](32791R2017), wordt
      elektronisch ingediend bij de minister.

      2 Een melding betreft een massa van ten hoogste 30.000 kilogram.

      3 Ten behoeve van de melding maakt de producentenorganisatie of unie van producentenorganisaties gebruik van een
      door de minister beschikbaar gesteld middel.

      4 Indien de melding plaats vindt voor 0:00 uur, vindt de controle, bedoeld in artikel 29, eerste lid, van
      [verordening 2017/892](32792R2017), uiterlijk de derde werkdag plaats.

      5 De uit de markt genomen producten worden bij controle in dusdanige verpakking aangeboden dat controle mogelijk
      is en in elk geval niet in een verpakking met een omvang groter dan 1 kubieke meter en een gewicht van meer dan
      300 kg.

      6 In afwijking van het vijfde lid worden de producten, bedoeld in
      [artikel 170, tweede lid, onderdelen a en g][ref1], in elk geval niet aangeboden in verpakkingen van meer dan 25
      kg.

      7 Een producentenorganisatie toont aan dat bij het indienen van een melding van het uit de markt nemen
      ten behoeve van gratis verstrekking als bedoeld in [artikel 170, derde lid, onderdeel c][ref2], de afname
      door de liefdadigheidsinstelling of -organisatie verzekerd is. Op verzoek van de minister overlegt de
      producentenorganisatie hiertoe schriftelijke bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel170
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel170
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel171
