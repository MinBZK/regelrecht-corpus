preamble:
  text: |-
    Gelet op de artikelen 32 tot en met 34, 36, 152 tot en met 156, 159, 160, 164 en 165 van Verordening (EU) nr.
    1308/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling van een gemeenschappelijke
    ordening van de markten voor landbouwproducten en tot intrekking van de Verordeningen (EEG) nr. 922/72, (EEG) nr.
    234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU 2013 L 347);

    Gelet op gedelegeerde verordening (EU) 2017/891 van de Commissie van 13 maart 2017 tot aanvulling van Verordening
    (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de sectoren groenten en fruit en verwerkte
    groenten en fruit en tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat
    betreft de in deze sectoren toe te passen sancties en tot wijziging van Uitvoeringsverordening (EU) nr. 543/2011
    van de Commissie;

    Gelet op uitvoeringsverordening (EU) 2017/892 van de Commissie van 13 maart 2017 tot vaststelling van voorschriften
    voor de toepassing van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad, wat betreft de
    sectoren groenten en fruit en verwerkte groenten en fruit;

    Gelet op de artikelen 15 en 19, eerste lid, van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *aanvoerprognose:* opgave door een lid van een producentenorganisatie van de hoeveelheid en aard van de producten
      die het lid in een door de producentenorganisatie te bepalen tijdvak bij de producentenorganisatie verwacht aan
      te voeren;
        - *accountant:* accountant die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36, eerste lid, van de Wet op het Accountantsberoep][ref1];
        - *actiefonds:* actiefonds als bedoeld in artikel 32 van [verordening 1308/2013](32013R1308);
        - *activiteit:* actie als bedoeld in artikel 2, onderdeel g, van [verordening 2017/891](32791R2017) ter uitvoering
      van een project;
        - *areaalenquête:* inventarisatie van een door een lid van de producentenorganisatie beteeld areaal en de door dit
      lid geteelde producten;
        - *biologische productie:* biologische productie als bedoeld in [verordening 2018/848](32748R2018);
        - *denatureren:* ongeschikt maken voor menselijke consumptie;
        - *dochteronderneming:* dochteronderneming als bedoeld in artikel 22, achtste lid, aanhef en onderdeel a, van
      [verordening 2017/891](32791R2017);
        - *duurzaam productiemiddel:* tastbaar activum als bedoeld in artikel 2, onderdeel h, van [verordening 2017/891]
      (32791R2017);
        - *erkenningsaanvraag:* een verzoek om erkenning als bedoeld in artikel 154, eerste lid, van [verordening
      1308/2013](32013R1308);
        - *erkenningsbesluit:* besluit van de minister inzake de erkenning van een producentenorganisatie als bedoeld in
      artikel 154, vierde lid, van [verordening 1308/2013](32013R1308);
        - *forfaitair standaardtarief:* vast of maximaal bedrag per eenheid, al dan niet uitgedrukt als percentage, dat
      wordt gebruikt om de te declareren bedragen vast te stellen en vooraf is vastgesteld op grond van artikel 31,
      tweede lid van [verordening 2017/891](32791R2017);
        - *gedeeltelijke betaling:* gedeeltelijke betaling als bedoeld in artikel 12 van [verordening 2017/892]
      (32792R2017);
        - *gekwantificeerd streefcijfer:* gekwantificeerd streefcijfer als bedoeld in artikel 27, derde lid, van
      [verordening 2017/891](32791R2017);
        - *goederenlogistiek:* het verzamelen, ophalen, sorteren, opslaan, verpakken, transporteren en distribueren van
      het product;
        - *kostenbegroting:* recente offerte voor de concreet geplande aanschaf of dienst, dan wel een taxatierapport op
      basis van vervangingswaarde, dan wel een officiële actuele prijslijst van leveranciers, dan wel een factuur uit een
      voorgaande periode voor eenzelfde soort geplande uitgavenpost, dan wel een vergelijkbaar document;
        - *lid:* aangesloten producent als bedoeld in artikel 2, onderdeel b van [verordening 2017/891](32791R2017);
        - *meetbaar streefdoel:* meetbaar streefdoel als bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening
      2017/892](32792R2017);
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *nationaal kader:* nationaal kader als bedoeld in artikel 36, eerste lid, van [verordening 1308/2013]
      (32013R1308);
        - *nationale strategie:* nationale strategie als bedoeld in artikel 36, tweede lid, van [verordening 1308/2013]
      (32013R1308);
        - *niet-producerend lid:* lid van de producentenorganisatie dat meer dan één teeltseizoen geen producten teelt
      waarvoor de producentenorganisatie is erkend;
        - *operationeel programma:* operationeel programma, als bedoeld in artikel 33 van [verordening 1308/2013]
      (32013R1308);
        - *producentenorganisatie:* door de minister erkende producentenorganisatie als bedoeld in artikel 152 van
      [verordening 1308/2013](32013R1308);
        - *productie voor eigen rekening en risico:* degene voor wiens rekening en risico wordt geteeld draagt de risico’s
      die samenhangen met de teelt en de opbrengst en is daarmee de eigenaar van het product ongeacht of hier een
      verkooptransactie aan vooraf is gegaan. In beginsel is dit de producent voor wiens rekening tevens de winsten en
      eventuele verliezen komen;
        - *project:* samenhangend geheel van activiteiten die subsidiabel zijn gesteld in deze regeling ter uitvoering van
      een strategisch doel dat door een producentenorganisatie wordt nagestreefd met haar operationeel programma;
        - *richtlijn 2000/29:* [Richtlijn 2000/29/EG](32000L0029) van de Raad van 8 mei 2000 betreffende de beschermende
      maatregelen tegen het binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige
      producten schadelijke organismen (PBEU 2000, L 169);
        - *subsidieaanvraag:* aanvraag voor steun als bedoeld in artikel 9, eerste lid, van [verordening 2017/892]
      (32792R2017);
        - *subsidie:* financiële steun van de Unie als bedoeld in artikel 34 van [verordening 1308/2013](32013R1308);
        - *strategisch doel:* doelstelling als bedoeld in artikel 36, tweede lid, onderdeel c, van [verordening 1308/2013]
      (32013R1308) of een doel als bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening 2017/892](32792R2017),
      dat een producentenorganisatie nastreeft met haar operationeel programma;
        - *SWOT analyse:* bedrijfskundig model dat intern de sterktes en zwaktes en in de omgeving de kansen en
      bedreigingen analyseert;
        - *tussentijdse wijziging:* een wijziging van het operationeel programma in de loop van het jaar als bedoeld in
      artikel 34, tweede lid, van [verordening 2017/891](32791R2017);
        - *uitgavenpost:* samenstel van uitgaven die gezamenlijk aan dezelfde criteria voldoen om binnen een activiteit bij
      te dragen aan het concrete meetbare streefdoel van een project.
        - *uitvoeringsjaar:* jaar van uitvoering van een operationeel programma;
        - *unie van producentenorganisaties:* unie van erkende producentenorganisaties als bedoeld in artikel 156 van
      [verordening 1308/2013](32013R1308);
        - *verkoper:* natuurlijke of rechtspersoon die door een producentenorganisatie is belast met de verkoop van
      producten van de leden van de producentenorganisatie waarvoor de producentenorganisatie is erkend;
        - *verordening 2017/891:* gedelegeerde verordening (EU) 2017/891 van de Commissie van 13 maart 2017 tot aanvulling
      van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de sectoren groenten en fruit
      en verwerkte groenten en fruit en tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement en
      de Raad wat betreft de in deze sectoren toe te passen sancties en tot wijziging van Uitvoeringsverordening (EU) nr.
      543/2011 van de Commissie (PBEU 2017, L 138);
        - *verordening 2017/892:* uitvoeringsverordening (EU) 2017/892 van de Commissie van 13 maart 2017 tot vaststelling
      van voorschriften voor de toepassing van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad, wat
      betreft de sectoren groenten en fruit en verwerkte groenten en fruit (PBEU 2017, L 138);
        - *verordening 1308/2013:* Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december
      2013 tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking
      van de [Verordeningen (EEG) nr. 922/72](31972R0922), [(EEG) nr. 234/79](31979R0234), [(EG) nr. 1037/2001]
      (32001R1037)en [(EG) nr. 1234/2007](32007R1234)van de Raad (PBEU 2013, L 347);
        - *verordening 2018/848:* [verordening (EU) 2018/848](32748R2018) van het Europees Parlement en de Raad van 30 mei
      2018 inzake de biologische productie en de etikettering van biologische producten en tot intrekking van Verordening
      (EG) nr. 834/2007 van de Raad (PbEU 2018, L 150);
        - *verordening 2020/600:* uitvoeringsverordening (EU) 2020/600 van de Commissie van 30 april 2020 tot afwijking
      van de Uitvoeringsverordeningen (EU) 2017/892, (EU) 2016/1150, (EU) 615/2014, (EU) 2015/1368 en (EU) 2017/39
      wat betreft bepaalde maatregelen voor de aanpak van de door de Covid-19-pandemie veroorzaakte crisis (PbEU 2020,
      L 140);
        - *verordening 2020/884:* gedelegeerde verordening (EU) 2020/884 van de Commissie van 4 mei 2020 tot afwijking, wat
      het jaar 2020 betreft, van Gedelegeerde verordening (EU) 2017/891 van de Commissie wat de sector groenten en fruit
      betreft, en van Gedelegeerde Verordening (EU) 2016/449 van de Commissie wat de wijnsector betreft, in verband met
      de COVID-19-pandemie (PbEU 2020, L 205);
        - *voorschotaanvraag:* aanvraag als bedoeld in artikel 35, eerste lid, van [verordening 2017/891](32791R2017);
        - *waarde afgezette productie:* de waarde van de afgezette productie van een producentenorganisatie als bedoeld in
      artikel 22 van [verordening 2017/891](32791R2017).

      2 In de [artikelen 19 tot en met 21][ref2], [46][ref3], [53][ref4], [72][ref5], [73, eerste lid][ref6], [75][ref7],
      [76][ref8], [77][ref9], [100][ref10], [101][ref11], [139][ref12] en [185a][ref13] van de regeling wordt onder
      ‘dochteronderneming’ mede verstaan een entiteit binnen een keten van dochterondernemingen waarvan ten minste 90%
      van de aandelen of het kapitaal van de entiteit in handen is van één of meer producentenorganisaties of unies van
      producentenorganisaties.


