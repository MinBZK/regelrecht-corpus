        artikel: '1'
  - number: '112'
    text: Biologische certificeringsystemen, zoals Skal, en lidmaatschapskosten van Skal zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel112
  - number: '113'
    text: |-
      1 Uitgaven voor de meerkosten van aankoop van mest en compost afkomstig van door Skalgecertificeerde biologische
      landbouwbedrijven zijn subsidiabel.

      2 De producentenorganisatie toont de biologische oorsprong van mest en compost bij de indiening van de
      subsidieaanvraag aan door middel van:

      a. een factuur en een afleverbon met vermelding van Skalnummer van het betrokken landbouwbedrijf en ‘eko’ of ‘bio’;

      b. het Skal certificaat van het betrokken landbouwbedrijf of een lijst van Skal-gecertificeerde landbouwbedrijven
      en Skal-nummers; en

      c. een opgave per deelnemende producent van:

      1°. het areaal gewassen waarvoor de producentenorganisatie is erkend;

      2°. de hoeveelheid en het type mest of compost; en

      3°. de opgevoerde kosten.

      3 De uitgaven van de producentenorganisatie, bedoeld in het eerste lid, voor geconcentreerde handelsmeststoffen
      zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel113
  - number: '114'
    text: |-
      1 De aankoop van investeringen voor lage emissie apparatuur voor precisiebemesting is subsidiabel indien de
      technische specificatie van de investering een vermindering van het gebruik van chemische middelen van minimaal
      15 procent geeft zoals vooraf aangetoond in overeenstemming met artikel 3, vierde lid van [verordening 2017/892]
      (32792R2017).

      2 In afwijking van het eerste lid is de eis dat de betrokken investering een vermindering van het gebruik van
      chemische middelen van minimaal 15 procent geeft niet van toepassing indien de investering wordt ingezet in het
      kader van de biologische productie van groenten en fruit.

      3 Subsidiabel zijn:

      a. de kosten van activiteiten in verband met de investeringen voor gerichte bemesting, zoals:

      i. GPS;

      ii. Near Infrared Spectography sensor;

      iii. rij bemesting;

      iv. druppel systeem bemesting;

      v. GPS mestsystemen voor vloeibare meststoffen; en

      vi aanvullende controlesystemen zoals management systeem Meteo en grondwaterbemesting; en

      b. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017).

      4 Precisiebemestingstechnieken zijn alleen subsidiabel indien:

      a. het een waterafgiftesysteem op het land, inclusief een waterpomp, spuitstukken en druppelsystemen die niet
      uitsluitend worden gebruikt voor water, een controle unit, vochtmeetapparatuur, apparatuur voor het bepalen van
      mineraalgehalte en pH, of voorzieningen voor het doseren en mengen van meststoffen betreft;

      b. de investering niet leidt tot een toename van het waterverbruik; en

      c. druppelsystemen komen alleen in aanmerking voor subsidie met initiële investeringen.

      5 In het geval van mechanische precisiebemesting als onderdeel van zelfrijdende landbouwmachines is alleen het
      bemestingssysteem subsidiabel.

      6 Kosten voor GPS om verschillende vormen van land, bodem analyses en bemestingsplannen in kaart te brengen zijn
      subsidiabel.

      7 Niet subsidiabel zijn:

      a. investeringen in bodemloze waterafgiftesystemen;

      b. de aanleg van een waterbron;

      c. leidingen naar te bemesten percelen; en

      d. standaard agrarische apparatuur en onderdelen, zoals een tractor, gereedschapsdrager, motor en cabine.

      8 In afwijking van [artikel 98, derde lid, aanhef en onderdeel b][ref1], onderbouwt de producentenorganisatie de
      emissiebeperking door bij de indiening van de subsidieaanvraag een jaarlijkse opgave van het totale gebruik aan
      werkzame stof in kilogram per hectare, uitgesplitst naar gewas(groep), te overleggen waarbij de nulsituatie wordt
      weergegeven, aan de hand van registraties van de teeltbedrijven.

      9 De nulsituatie is het gemiddelde gebruik aan werkzame stof in kilogram per hectare van het betrokken teeltbedrijf
      over drie voorgaande jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel98
