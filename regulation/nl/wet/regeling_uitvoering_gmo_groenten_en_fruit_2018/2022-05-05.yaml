    text: |-
      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor markt en afzet zijn subsidiabel
      indien het systeem tot doel heeft:

      a. kwaliteitsverbetering van het proces;

      b. koppeling van vraag aan aanbod; of

      c. efficiencyverbetering.

      2 Uitgaven voor identieke investeringen zijn uitsluitend subsidiabel in geval van uitgaven gedaan binnen vier jaar
      na de factuurdatum van de laatste factuur voor de eerste investering.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
      overzicht van het aantal systemen, en het aantal aansluitingen van haar klanten op deze systemen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel148
  - number: '149'
    text: |-
      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor customer relationship management
      zijn subsidiabel.

      2 Uitgaven voor identieke investeringen zijn uitsluitend subsidiabel in geval van uitgaven gedaan binnen vier jaar
      na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Onder de uitgaven vallen kosten voor de interface van de ICT systemen voor customer relationship management,
      inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      4 Uitgaven op locatie van de leden van de producentenorganisatie zijn slechts subsidiabel indien de
      producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het ICT systeem voor customer
      relationship management van de producentenorganisatie.

      5 Uitgaven voor het verder uitrollen van ICT systemen voor customer relationship management zijn niet subsidiabel.

      6 Bij de uitgaven wordt door de producentenorganisatie aan de minister bij de indiening van het operationeel
      programma een onderbouwd plan overlegd met daarin:

      a. een gedetailleerde beschrijving van het project;

      b. een begroting van de investeringskosten;

      c. een definiëring van de onderdelen van de investeringskosten;

      d. een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen; en

      e. een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel149
  - number: '150'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de bundeling van productstromen zijn subsidiabel, indien
      het gaat om investeringen in:

      a. sorteer- en verpakcentra;

      b. distributiecentra;

      c. verwerkingscentra;

      d. fustopslag;

      e. dockboards; of

      f. sorteer- en verpakkingslijnen.

      2 Niet subsidiabel zijn uitgaven voor:

      a. investeringen ter vervanging van oude centra als bedoeld in het eerste lid;

      b. vervanging van standaard sorteer- en verpakkingslijnen; en

      c. met de sorteerlijn geïntegreerde aanvoerprognosesystemen.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
      overzicht van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel150
  - number: '151'
    text: |-
      1 Uitgaven van de producentenorganisatie in vollegrondsteelt zijn subsidiabel indien:

      a. het gaat om investeringen in gecombineerde oogst-, sorteer- en verpakkingssystemen, waaronder apparatuur,
      bestemd voor het reinigen, sorteren, wegen of verpakken van de in de grond geteelde gewassen; en

      b. de investeringen gebruikt worden in het veld direct na de oogstfase.

      2 In geval van een geïntegreerd systeem met een oogstmachine zijn de meerkosten van de toegevoegde functies ten
      opzichte van een vergelijkbare oogstmachine zonder extra functies subsidiabel.

      3 Indien de uitgaven een mobiel pakstation betreffen, zijn maximaal twee in het pakstation geïntegreerde wagens
      subsidiabel.

      4 Investeringen in aparte oogstsystemen en tractoren zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel151
  - number: '152'
    text: |-
      Uitgaven van producentenorganisaties voor ICT systemen voor markt en afzet, bedoeld in
      [artikel 148, eerste lid][ref1], inclusief personeelskosten, zijn subsidiabel indien het gaat om de kosten van
      de benodigde aanpassingen van het systeem en de interface, inclusief de benodigde aanpassingen ten behoeve van de
      werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. een verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesyteem.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel148
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '148'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '153'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van het ontwerpen, bouwen en implementeren van ICT systemen
      voor customer relationship management systemen als bedoeld in [artikel 149, eerste lid][ref1], inclusief
      personeelskosten, zijn subsidiabel.

      2 Bij de indiening van het operationeel programma overlegt de producentenorganisatie aan de minister:

      a. een begroting van het aantal uren per taak of functie; en

      b. een omschrijving van de taken en functies.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel149
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel153
