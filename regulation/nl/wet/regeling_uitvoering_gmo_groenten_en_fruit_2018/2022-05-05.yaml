    text: |-
      1 Uitgaven voor diensten voor detectie en diagnosesystemen, inclusief personeelskosten, ten behoeve van
      precisietoediening zijn subsidiabel.

      2 Uitgaven zoals bedoeld in het eerste lid zijn onder meer:

      a. monitorings en waarschuwingssystemen;

      b. gewas-, water- en bodemanalyses; en

      c. beslissingsondersteuningssystemen.

      3 In afwijking van het eerste lid zijn gewas-, water en bodemanalyses om de hoeveelheid nutriënten te bepalen niet
      subsidiabel.

      4 De producentenorganisatie onderbouwt het effect van diensten voor detectie en diagnose systemen op het
      terugdringen van het gebruik van werkzame stof uit chemische gewasbeschermingsmiddelen, met gebruikmaking van
      een door de minister beschikbaar gesteld middel, aan de hand van een jaarlijkse opgave van het totale gebruik
      aan werkzame stof in kilogram per hectare, uitgesplitst naar gewas(groep) aan de hand van registraties van de
      teeltbedrijven.

      5 Het vierde lid is niet van toepassing op uitgaven die worden gedaan in het kader van de biologische productie van
      groenten en fruit.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel109
  - number: '110'
    text: |-
      1 Uitgaven voor deelname aan certificeringssystemen zijn subsidiabel indien:

      a. het certificeringssysteem bindende voorwaarden omvat met betrekking tot productiemethoden;

      b. de naleving van de voorwaarden, bedoeld in onderdeel a, het onderwerp zijn van een onafhankelijke controle door
      gekwalificeerde personen of organen; en

      c. het gaat om de volgende uitgaven voor:

      1°. advies, audits, certificering en lidmaatschapkosten;

      2°. personeelskosten in verband met de certificeringssystemen;

      3°. het ontwikkelen van materialen voor certificeringssystemen; en

      4°. het initiële kosten van ontwikkeling en verbeteren van ICT-systemen en registratiemodules met betrekking tot
      certificeringssystemen.

      2 Subsidiabel zijn:

      a. certificeringssystemen, zoals On the way to PlanetProof, ISO 14001 Milieu, MPS Fruit & Groenten, Duurzame
      Glastuinbouw Producten, CO-voetafdruk; en

      b. certificeringssystemen van retailers, zoals Albert Heijn-protocol, Field to Fork, LEAF en Sedex.

      3 Niet subsidiabel zijn:

      a. uitgaven voor certificering van groenlabelkassen; en

      b. de aanschaf van materialen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel110
  - number: '111'
    text: |-
      1 Uitgaven voor biologische vermeerdering en opkweek van uitgangsmateriaal en de niet-chemische
      behandeling bij zaden van gangbare oorsprong zijn subsidiabel indien zij door de Stichting Skal, bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1], of een andere erkende instantie overeenkomstig Hoofdstuk
      V van [verordening 2018/848](32748R2018) dan wel een op grond van artikel 46 van [verordening 2018/848](32748R2018)
      erkende instantie, gecertificeerd zijn.

      2 Voor de uitgaven, bedoeld in het eerste lid, geldt een forfaitair tarief van 25 procent.

      3 De producentenorganisatie toont de biologische oorsprong van uitgangsmateriaal bij de indiening van de
      subsidieaanvraag aan door middel van:

      a. een factuur en een afleverbon of een plantenpaspoort met vermelding van Skalnummer en ‘eko’ of ‘bio’;

      b. het Skal certificaat van de leverancier of een lijst van Skal-gecertificeerde leveranciers en Skal-nummers; of

      c. het certificaat van de leverancier afgegeven door een andere dan Skal erkende instantie zoals bedoeld in het
      eerste lid.

      4 Niet subsidiabel is niet-biologisch teeltmateriaal, met uitzondering van alle vrijstellingen die Skal heeft
      verstrekt en goedgekeurd voor algemeen teeltmateriaal in de nationale bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
