  - number: '91'
    text: |-
      Voor het voldoen aan de eisen in artikel 33, vijfde lid, van [verordening 1308/2013](32013R1308) moeten de
      activiteiten die zijn opgenomen in [titel 2][ref1] deel uitmaken van een project in het kader van het strategisch
      doel verduurzaming.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk4
