  - number: '92'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van een strategisch doel, bedoeld in
      [artikel 47, eerste en tweede lid][ref1], en ter uitvoering van een maatregel, bedoeld in artikel 2, onderdeel f,
      van [verordening 2017/891](32791R2017), zijn subsidiabel, indien wordt voldaan aan [deel 4, hoofdstukken 3][ref2]
      en [4][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk4
