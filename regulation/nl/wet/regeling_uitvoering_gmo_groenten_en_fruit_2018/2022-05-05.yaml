  - number: '66'
    text: |-
      1 Onder vakbekwaam personeel als bedoeld in punt twee, onderdeel b, van bijlage III van [verordening 2017/891]
      (32791R2017), wordt verstaan personeel met een werk- en denkniveau met minimaal het opleidingsniveau van het
      middelbaar beroepsonderwijs, dat is verkregen door:

      a. een afgeronde opleiding; of

      b. ervaring en specifieke vakkennis.

      2 De eisen omtrent vakbekwaamheid worden door de producentenorganisatie opgenomen in door de directie of
      het bestuur geaccordeerde functieprofielen, welke worden opgenomen in de administratieve organisatie van de
      producentenorganisatie.

      3 De producentenorganisatie overlegt bij de indiening van het operationeel programma of een verzoek tot wijziging
      van een operationeel programma aan de minister, ter onderbouwing van de vakbekwaamheid van het personeel:

      a. de door de directie of het bestuur van de producentenorganisatie geaccordeerde functieprofielen; en

      b. een volledige taakomschrijving per subsidiabele uitgavenpost van het voor die uitgavenpost ingezette personeel.

      4 De verplichting opgenomen in het derde lid is slechts van toepassing op een verzoek tot wijziging van een
      operationeel programma voor zover hiermee functies worden opgevoerd die niet eerder in het operationeel programma
      waren opgenomen.

      5 De minister kan, ter onderbouwing van de vakbekwaamheid, schriftelijke bewijsstukken opvragen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel66
  - number: '67'
    text: |-
      1 De producentenorganisatie houdt ter onderbouwing van de gewerkte uren, bedoeld in punt twee, onderdeel b, van
      bijlage III van [verordening 2017/891](32791R2017), een volledige urenadministratie bij die minimaal één keer per
      maand geparafeerd en gedateerd wordt door:

      a. de betreffende medewerker; en

      b. de projectleider of leidinggevende.

      2 Op verzoek van de minister overlegt de producentenorganisatie de urenadministratie, bedoeld in het eerste lid.

      3 De medewerker, bedoeld in het eerste lid, onderdeel a, mag niet dezelfde persoon zijn als de projectleider of
      leidinggevende, bedoeld in het eerste lid, onderdeel b.

      4 De urenadministratie, bedoeld in het eerste lid:

      a. wordt bijgehouden gedurende het hele kalenderjaar of voor de duur van de arbeidsovereenkomst van de medewerker
      wiens inzet wordt toegerekend aan een subsidiabele activiteit;

      b. omvat alle uren waarvoor de betreffende medewerker een arbeidscontract heeft, waaronder de uren die niet worden
      toegerekend aan subsidiabele activiteiten;

      c. bevat een korte en duidelijke omschrijving van ter uitvoering van de subsidiabele activiteit verrichte
      werkzaamheden; en

      d. wordt uitgesplitst naar:

      1. het aantal uren besteed per afzonderlijke subsidiabele activiteit;

      2. het totale aantal uren besteed aan niet subsidiabele activiteiten; en

      3. afwezigheidsuren zoals ziekte en verlof.

      5 De minister kan, in afwijking van het vierde lid, onderdeel d, op verzoek van een producentenorganisatie
      schriftelijk toestemming verlenen om de onderverdeling te maken aan de hand van een andere deugdelijke
      onderbouwing.

      6 Indien managers of leidinggevenden uren maken ter uitvoering van een activiteit blijkt uit de urenadministratie,
      bedoeld in het eerste lid, dat managementactiviteiten en beheersmatige activiteiten niet zijn toegerekend aan
      subsidiabele activiteiten.

      7 Het aantal uren waarvoor in de subsidieaanvraag per activiteit subsidie wordt aangevraagd overschrijdt niet het
      aantal uren dat ingevolge de goedkeuring van het operationeel programma of het verzoek tot wijziging daarvan voor
      deze activiteit is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel67
  - number: '68'
    text: |-
      1 De producentenorganisatie onderbouwt de loonkosten, bedoeld in [artikel 63, onderdeel a][ref1], van de
      subsidiabele activiteiten aan de hand van uurtarieven op basis van het jaarsalaris van de desbetreffende
      medewerkers.

      2 In het uurtarief, bedoeld in het eerste lid, kan worden opgenomen:

      a. het contractueel of bij CAO overeengekomen brutoloon;

      b. een bij contract of CAO overeengekomen niet winstafhankelijke dertiende maand;

      c. een onregelmatigheidstoeslag;

      d. een ploegentoeslag;

      e. het werkgeversdeel sociale verzekeringswetten;

      f. de voor rekening van de werkgever komende kosten voor de ziektekostenverzekering;

      g. het werkgeversdeel pensioen en vervroegde uittreding; of

      h. dotaties aan pensioenvoorzieningen voor zover onderbouwd kan worden dat hier rechtens afdwingbare verplichtingen
      tegenover staan.

      3 Ten behoeve van de berekening van het uurtarief wordt het jaarsalaris gedeeld door:

      a. het aantal uur dat de overeengekomen werkweek bedraagt vermenigvuldigd met 43 werkweken; of

      b. in geval van een niet volledig gewerkt jaar, het aantal uur dat de overeengekomen werkweek bedraagt
      vermenigvuldigd met het aantal werkweken in het desbetreffende jaar vermenigvuldigd met 0,827.

      4 Overwerktoeslagen worden niet het in het uurtarief opgenomen.

      5 De producentenorganisatie overlegt bij de indiening van het operationeel programma van één personeelslid een
      voorbeeld van de berekening aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel63
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '63'
        hoofdstuk: '3'
  - number: '69'
    text: |-
      1 De producentenorganisatie neemt duurzame productiemiddelen binnen twaalf maanden na de factuurdatum van de
      laatste factuur in gebruik.

      2 De producentenorganisatie toont de aanschaf van de duurzame productiemiddelen aan de hand van facturen of
      afleverbonnen aan en verstrekt deze onverwijld aan de minister, indien de minister daar om verzoekt.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel69
  - number: '70'
    text: |-
      1 Duurzame productiemiddelen zijn subsidiabel indien alle leden van de producentenorganisatie er gebruik van kunnen
      maken.

      2 Duurzame productiemiddelen geplaatst op het bedrijf van een lid van een producentenorganisatie zijn subsidiabel
      indien de producentenorganisatie schriftelijk met het lid overeenkomt dat het productiemiddel toegankelijk is voor
      de producentenorganisatie en al haar leden.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel70
  - number: '71'
    text: |-
      1 Ter uitvoering van artikel 31, vierde lid, van [verordening 2017/891](32791R2017) toont de producentenorganisatie
      het gebruik van duurzame productiemiddelen aan met behulp van een gebruiksadministratie per productiemiddel,
      tenzij de producentenorganisatie het gebruik van het productiemiddel op andere wijze aantoont ten genoegen van
      de minister.

      2 De producentenorganisatie geeft bij de indiening van het operationeel programma aan op welke wijze de
      gebruiksadministratie gevoerd gaat worden.

      3 De gebruiksadministratie registreert minimaal de volgende elementen:

      a. het jaar;

      b. het project;

      c. de locatie;

      d. het soort productiemiddel;

      e. de aanschafdatum;

      f. de leverancier, het merk, het type, het serienummer of registratienummer;

      g. de hoeveelheid bewerkt of voorbereid product per dag waarvoor de producentenorganisatie is erkend;

      h. de hoeveelheid bewerkt of voorbereid product per dag waarvoor de producentenorganisatie niet is erkend; en

      i. de totale hoeveelheid bewerkt of voorbereid product per dag.

      4 De hoeveelheden bewerkt of voorbereid product, bedoeld in het derde lid, onderdelen g tot en met i, worden
      geregistreerd op:

      a. productstromen op locatieniveau in geval van distributiecentra en gebouwen;

      b. palletregistraties in geval van koelcellen; of

      c. stuks, collie of kilogramregistraties, in geval van sorteerlijnen en verpakkingsmachines.

      5 De gebruiksadministratie wordt bij de indiening van de subsidieaanvraag, geaggregeerd per maand aan de minister
      overgelegd.

      6 In geval er geen subsidieaanvraag wordt ingediend, kan de minister de gebruiksadministratie opvragen gedurende de
      instandhoudingstermijn bedoeld in [artikel 76][ref1].

      7 De minister kan, op eigen initiatief of op verzoek van een producentenorganisatie besluiten, in afwijking van het
      tweede, derde en vierde lid, andere voorschriften te stellen aan de gebruiksadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel76
