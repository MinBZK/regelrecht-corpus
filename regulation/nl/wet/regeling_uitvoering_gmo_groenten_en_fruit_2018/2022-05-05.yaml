      1 Uitgaven van de producentenorganisatie voor de aanschaf van systemen voor aanvoerprognoses en areaalenquêtes
      zijn subsidiabel indien het gaat om systemen bij de producentenorganisatie en haar leden die met elkaar kunnen
      communiceren.

      2 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
      overzicht van het aantal systemenen het aantal aansluitingen van haar leden op deze systemen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel140
  - number: '141'
    text: |-
      1 Uitgaven van producentenorganisaties ten behoeve van voorraadbeheer en distributie zijn subsidiabel indien het
      gaat om het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning en voor zover zij tot
      doel hebben:

      a. kwaliteitsverbetering van het proces;

      b. tracking and tracing van producten;

      c. koppeling van vraag aan aanbod; of

      d. efficiencyverbetering.

      2 Uitgaven voor identieke investeringen zijn uitsluitend subsidiabel in geval van uitgaven gedaan binnen vier jaar
      na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Onder de uitgaven vallen kosten voor de interface van ICT systemen voor logistieke planning, inclusief de
      benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem; of

      e. een facturatiesysteem.

      4 Uitgaven op locatie van de leden van de producentenorganisatie zijn slechts subsidiabel indien de
      producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het systeem voor logistieke planning
      van de producentenorganisatie.

      5 Uitgaven zijn subsidiabel indien de producentenorganisatie aan de minister op basis van een offerte kan aantonen
      dat het ICT systeem uitsluitend bestemd is voor de functionaliteiten, genoemd in het eerste lid.

      6 Uitgaven voor het verder uitrollen van ICT systemen voor logistieke planning zijn niet subsidiabel.

      7 Bij de indiening van het operationeel programma wordt een onderbouwd plan overlegd met daarin:

      a. een gedetailleerde beschrijving van het project;

      b. een begroting van de investeringskosten;

      c. een definiëring van de onderdelen van de investeringskosten;

      d. een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen; en

      e. een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel141
  - number: '142'
    text: |-
      Uitgaven van de producentenorganisatie voor koeling van producten ten behoeve van lange bewaring zijn subsidiabel,
      indien het gaat om:

      a. koelhuizen;

      b. koelcellen;

      c. koelinstallaties; of

      d. vriescellen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel142
