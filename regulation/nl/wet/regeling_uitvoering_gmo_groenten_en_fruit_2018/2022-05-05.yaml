  - number: '56'
    text: |-
      1 Een wijziging van een operationeel programma gedurende het jaar, als bedoeld in artikel 34, tweede lid, van
      [verordening 2017/891](32791R2017), betreft de toekomst en kan betrekking hebben op:

      a. het toevoegen van nieuwe uitgavenposten aan bestaande activiteiten of van nieuwe activiteiten aan bestaande
      projecten opgenomen in een goedgekeurd operationeel programma, indien deze toevoeging voorafgaand aan het
      uitvoeringsjaar niet voorzienbaar was;

      b. een wijziging van de begroting voor een uitgavenpost voor een activiteit opgenomen in een goedgekeurd
      operationeel programma met meer dan 20 procent;

      c. het verhogen van het jaarbedrag van het actiefonds met maximaal 25 procent;

      d. het verlagen van het jaarbedrag van het actiefonds met maximaal 80 procent; of

      e. het toevoegen van andere soorten financiële bijdragen aan het actiefonds dan oorspronkelijk goedgekeurd.

      2 De producentenorganisatie geeft ten aanzien van wijzigingen als bedoeld in het eerste lid gemotiveerd aan:

      a. hoe het begrote bedrag tot stand gekomen is;

      b. waarom het noodzakelijk is dat deze wijziging gedurende het jaar gedaan wordt; en

      c. wat de gevolgen van deze wijziging zijn voor de uitvoering en de begroting van het operationeel programma.

      3 In aanvulling op het tweede lid geeft de producenteorganisatie ten aanzien van wijzigingen als bedoeld in het
      eerste lid, onderdeel a, gemotiveerd aan:

      a. waarom deze wijziging niet voorzienbaar was; en

      b. indien het een nieuwe activiteit betreft, hoe deze activiteit bijdraagt aan het project.

      4 Op een wijziging als bedoeld in het eerste lid, onderdeel a, is
      [artikel 51, eerste lid, onderdeel e, onder 4°][ref1], alsmede [artikel 51b, tweede tot en met zesde lid][ref2],
      van overeenkomstige toepassing.

      5 Ten aanzien van de wijzigingen, bedoeld in het eerste lid, onderdelen c en d, wordt door de
      producentenorganisatie aangetoond dat de wijziging geen afbreuk doet aan de strategische doelen en de meetbare
      streefdoelen van het operationele programma.

      6 De producentenorganisatie kan een verzoek tot wijziging als bedoeld in artikel 34, tweede lid, van [verordening
      2017/891](32791R2017) indienen op een van de volgende momenten:

      a. 5 januari van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;

      b. 1 mei van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;

      c. 1 augustus van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;

      d. 1 november van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft; of

      e. 1 december van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft, mits het een wijziging
      van het actiefonds betreft zoals bedoeld in artikel 34, eerste lid, onderdeel c, van [verordening 2017/891]
      (32791R2017).

      7 In afwijking van het zesde lid kan een producentenorganisatie op elk moment een verzoek tot wijziging indienen
      met betrekking tot:

      a. maatregelen als bedoeld in artikel 2, onderdeel f, onder vi, van [verordening 2017/891](32791R2017);

      b. uitgaven als bedoeld in [artikel 185a][ref3].

      8 Een producentenorganisatie kan onmiddellijk na het indienen van een verzoek tot wijziging, onder de voorwaarde,
      bedoeld in artikel 34, tweede lid, derde alinea, van [verordening 2017/891](32791R2017), dat dit voor eigen
      rekening en risico gebeurt, aanvangen met het doorvoeren van de wijziging.

      9 Het toevoegen van uitgavenposten of activiteiten, als bedoeld in het eerste lid, onderdeel a, is slechts mogelijk
      indien de uitgavenpost of activiteit subsidiabel is op grond van [deel 4, hoofdstuk 3][ref4] en [4][ref5].

      10 De verzoeken tot wijziging als bedoeld in het zesde lid, onderdelen b tot en met e, worden ingediend met
      gebruikmaking van een door de minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
