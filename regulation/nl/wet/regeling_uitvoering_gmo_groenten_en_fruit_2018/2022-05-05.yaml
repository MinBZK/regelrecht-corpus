  - number: '53'
    text: |-
      1 Ter uitvoering van artikel 25, tweede lid, van [verordening 2017/891](32791R2017) wordt een operationeel
      programma of een verzoek tot wijziging van een operationeel programma als bedoeld in artikel 34, eerste lid van
      [verordening 2017/891](32791R2017) door de algemene vergadering van de producentenorganisatie goedgekeurd.

      2 In aanvulling op artikel 5 van [verordening 2017/892](32792R2017) overlegt een producentenorganisatie voor
      8 december van het jaar waarin een operationeel programma of een wijziging daarvan voor goedkeuring is voorgelegd
      aan de minister bewijstukken waarmee wordt aangetoond dat de goedkeuring van het operationeel programma of van
      de wijziging van een operationeel programma door de algemene vergadering van de producentenorganisatie heeft
      plaatsgevonden.

      3 Het operationeel programma of een wijziging daarvan dat aan de algemene ledenvergadering ter goedkeuring is
      voorgelegd zoals bedoeld in het tweede lid bevat informatie over:

      a. de inhoud van de projecten door middel van een samenvatting’;

      b. de bedragen per project;

      c. welke investeringen van € 100.000 en hoger op locatie van de producentenorganisatie of unie van
      producentenorganisaties of een dochteronderneming zijn voorgenomen; en

      d. welke investeringen van € 50.000 en hoger op andere locaties zijn voorgenomen, onder vermelding van het adres
      van de locaties.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel53
  - number: '54'
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties dient het operationele programma als bedoeld
      in artikel 6, eerste lid, van [verordening 2017/892](32792R2017) in met gebruikmaking van een door de minister
      beschikbaar gesteld middel.

      2 De producentenorganisatie of unie van producentenorganisaties dient het operationeel programma in uiterlijk om
      12:00 uur op de datum als bedoeld in artikel 6, eerste lid, van [verordening 2017/892](32792R2017).

      3 In afwijking van de in artikel 6, eerste lid, van [verordening 2017/892](32792R2017) genoemde uiterste
      indieningsdatum van 15 september dient de producentenorganisatie of unie van producentenorganisaties een
      operationeel programma dat aanvangt in 2022, uiterlijk op 1 oktober 2021 om 12:00 uur in.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel54
  - number: '55'
    text: |-
      1 Een wijziging van een operationeel programma als bedoeld in artikel 34, eerste lid, van [verordening 2017/891]
      (32791R2017) kan betrekking hebben op:

      a. een wijziging in de meerjarenbegroting voor de volgende uitvoeringsjaren van het operationeel programma;

      b. het toevoegen of laten vervallen van uitgavenposten voor activiteiten opgenomen in een goedgekeurd operationeel
      programma;

      c. het toevoegen van streefdoelen, projecten of activiteiten aan het operationele programma voor de volgende jaren;

      d. het laten vervallen van projecten of activiteiten in het operationele programma voor de volgende jaren,

      e. een wijziging van de verdeling van de tranches waarin investeringen via het actiefonds worden gefinancierd;

      f. het jaarbedrag van het actiefonds;

      g. het toevoegen van andere soorten financiële bijdragen aan het actiefonds dan oorspronkelijk goedgekeurd; of

      h. de looptijd van het operationele programma.

      2 Een verzoek tot wijziging als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) wordt
      uiterlijk op 15 september om 12:00 uur, met gebruikmaking van een door de minister beschikbaar gesteld middel,
      ingediend.

      3 Het toevoegen van uitgavenposten of activiteiten is slechts mogelijk indien de activiteit subsidiabel is op grond
      van [deel 4, hoofdstuk 3][ref1] en [4][ref2].

      4 Op een wijziging als bedoeld in het eerste lid, onderdelen b en c, zijn de [artikelen 51][ref3], [51a][ref4] en
      [51b][ref5] van overeenkomstige toepassing.

      5 In afwijking van het tweede lid dient de producentenorganisatie of unie van producentenorganisaties een verzoek
      tot wijziging als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) in het jaar 2021
      uiterlijk op 1 oktober 2021 om 12:00 uur in.


