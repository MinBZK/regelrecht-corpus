  - number: '115'
    text: |-
      1 Uitgaven voor investeringen in teelttechnieken waar geen contact wordt gemaakt tussen het water en nutriënten en
      de bodem zijn subsidiabel indien de technische specificatie van de investering een vermindering van het gebruik van
      chemische middelen van minimaal 15 procent geeft zoals vooraf aangetoond in overeenstemming met artikel 3, vierde
      lid van [verordening 2017/892](32792R2017).

      2 Subsidiabel zijn:

      a. uitgaven voor activiteiten in verband met teelt uit de grond zoals:

      1°. lekvrije bodemplaten en opslagsystemen;

      2°. waterzuivering en zuurstofverhoging, met uitzondering van filters benodigd voor de lozing van afvalwater; en

      3°. recycling van nutriënten; en

      b. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017).

      3 Een investering, zoals bedoeld in het eerste lid, kan niet leiden tot een stijging van het waterverbruik.

      4 De volgende investeringen zijn niet subsidiabel:

      a. investeringen in bodemloze water systemen;

      b. de bouw van een waterborn; en

      c. pijpleiding naar een te bemesten perceel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel115
  - number: '116'
    text: |-
      1 Uitgaven voor investeringen in innovatieve installaties ten behoeve van waterbesparing zijn subsidiabel indien:

      a. de technische specificatie van de investering een reductie van het waterverbruik van minimaal 15 procent geeft
      zoals vooraf aangetoond in overeenstemming met artikel 3, vierde lid, van [verordening 2017/892](32792R2017);

      b. de investeringen gericht zijn op de vervanging of de modernisering van bestaande systemen met het doel het
      waterverbruik te verminderen; en

      c. het gaat om:

      1°. bodemvochtsensoren in de vollegrondsteelt; of

      2°. installaties gericht op het hergebruik van spoelwater bij het afleveringsklaar maken van geoogst product.

      2 In afwijking van het eerste lid, onderdeel a, kan de minister in uitzonderlijke gevallen een reductie van het
      waterverbruik van minimaal 7 procent toestaan, indien de activiteit andere milieuvoordelen waarborgt.

      3 Het vaststellen van waterbesparing, gemeten in m³, als gevolg van een investering als bedoeld in het eerste lid
      vindt plaats op basis van een vergelijking tussen het watergebruik:

      a. gedurende de 12 maanden voorafgaand aan ingebruikname van de investering; en

      b. gedurende de 12 maanden na ingebruikname van de investering.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel116
  - number: 116a
    text: |-
      Uitgaven voor investeringen in duurzame productiemiddelen die benodigd zijn voor de toepassing van
      [artikel 117a][ref1] zijn subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel117a
