  - number: '120'
    text: |-
      1 Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van het optimaliseren van de
      productkwaliteit in de keten zijn subsidiabel indien het gaat om investeringen ten behoeve van:

      a. het verhogen van de houdbaarheid van de producten;

      b. voedselveiligheid;

      c. kwaliteitszorgsystemen;

      d. het verhogen van de fysieke productkwaliteit; of

      e. lange bewaring in koelhuizen, koelcellen, koelinstallaties, vriescellen.

      2 Uitgaven van de producentenorganisatie voor de aanschaf van plastic pallets ten behoeve van het tegengaan van de
      verspreiding van organismen die plantenziekten kunnen veroorzaken zijn subsidiabel.

      3 Uitgaven zijn niet subsidiabel indien het gaat om investeringen:

      a. in reinigingsinstallaties;

      b. in fustwasinstallaties;

      c. in installaties en apparatuur voor conditionering van champignon- en witloftrekcellen;

      d. in voorzieningen voor gekoeld of geconditioneerd transport op het teeltbedrijf;

      e. in droogsystemen voor aanzuiging van buitenlucht voor knoflook;

      f. in vogel- en wildafweer; of

      g. die de producentenorganisatie doet om te voldoen aan de voorwaarden van kwaliteitskeurmerken.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel120
  - number: '121'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de borging van een nieuw product of concept in de keten
      zijn subsidiabel, indien het gaat om:

      a. investeringen ten behoeve van het voor de eerste keer laten certificeren van keurmerken voor nieuwe producten of
      nieuwe concepten; of

      b. investeringen ten behoeve van het voor de eerste keer laten certificeren van keurmerken op het gebied van
      duurzaamheid (MVO), kwaliteit en voedselveiligheid in de keten.

      2 Uitgaven voor investeringen in ICT voorzieningen voor tracking en tracing systemen zijn niet subsidiabel indien
      het gaat om ICT voorzieningen ten behoeve van:

      a. de registraties van productherkomst, ziekten, plagen, middelen of meststoffen; of

      b. het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel121
  - number: '122'
    text: |-
      1 Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van het optimaliseren van de
      productkwaliteit in de keten zijn subsidiabel, inclusief personeelskosten, indien het gaat om uitgaven voor:

      a. het verhogen van de houdbaarheid van de producten;

      b. voedselveiligheid, met name residumonitoring, inclusief bladmonsters in het kader van keurmerken zoals
      bedoeld in [artikel 110, tweede lid][ref1] en productmonsters, watermonsters voor microbiologisch onderzoek en
      fytosanitaire controles;

      c. kwaliteitszorgsystemen, indien het gaat om:

      1°. uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor begeleiding en audits van
      kwaliteitszorgsystemen;

      2°. uitgaven voor de inhuur van gekwalificeerde externe diensten bestemd voor productcontroles;

      3°. uitgaven voor certificering; of

      4°. lidmaatschapskosten;

      d. het verhogen van de fysieke productkwaliteit;

      e. het vergroten van de duurzaamheid van het product en van het productieproces;

      f. keurmerken of modules van keurmerken voor maatschappelijk verantwoord ondernemen;

      g. het ontwikkelen en verbeteren van ICT en registratiemodules; of

      h. software van conditioneringssystemen ten behoeve van lange bewaring van producten waarbij productieplanning het
      doel is.

      2 Niet subsidiabel zijn uitgaven voor:

      a. certificering van meet- en weegapparatuur

      b. aanschaf van bedrijfskleding;

      c. materialen voor certificeringssystemen;

      d. het schoonmaken van bedrijfsruimten; en

      e. aanschaf van Global Location Number (GLN) codes in het kader van GlobalGAP.

      3 Bij de indiening van een subsidieaanvraag die betrekking heeft op uitgaven als bedoeld in het eerste lid overlegt
      de producentenorganisatie met gebruikmaking van een door de minister beschikbaar gesteld middel informatie over
      kwaliteitszorgsystemen en residumonitoring aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel110
