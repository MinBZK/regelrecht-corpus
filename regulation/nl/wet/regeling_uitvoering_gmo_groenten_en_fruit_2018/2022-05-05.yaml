  - number: '189'
    text: |-
      1 Producentenorganisaties laten een extern accountant de juistheid van de bewijsstukken, bedoeld in artikel
      9, tweede lid, onderdelen a, c, d, f, en i, van [verordening 2017/892](32792R2017), controleren en laten de
      bewijsstukken door de accountant waarmerken.

      2 Producentenorganisaties laten een extern accountant een controle uitvoeren op de naleving van de punten, bedoeld
      in artikel 9, tweede lid, onderdelen e, g en h, van [verordening 2017/892](32792R2017).

      3 De accountant stelt op basis van de door hem uitgevoerde controle een controleverklaring op met gebruikmaking van
      een door de minister beschikbaar gesteld model, alsmede een verslag van de verrichte werkzaamheden.

      4 De controleverklaring geldt met het bijbehorende verslag als bewijsstuk als bedoeld in artikel 9, tweede lid,
      onderdelen a en c tot en met i van [verordening 2017/892](32792R2017).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel189
  - number: '190'
    text: |-
      1 Uitgaven als bedoeld in artikel 9, derde lid, van [verordening 2017/892](32792R2017), kunnen in de
      subsidieaanvraag worden opgenomen, indien de producentenorganisatie, in een bijlage bij de subsidieaanvraag,
      gemotiveerd aangeeft dat deze uitgaven:

      a. voldoen aan de voorwaarden uit artikel 9, derde lid, van [verordening 2017/892](32792R2017); en

      b. niet het gevolg zijn van een risicovolle planning door de producentenorganisatie.

      2 Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring afleggen,
      met gebruikmaking van een door de minister beschikbaar gesteld model, over de naleving van de in het eerste lid
      bedoelde voorwaarden.

      3 Producentenorganisaties overleggen de controleverklaring, alsmede een verslag van de verrichte werkzaamheden,
      uiterlijk op 15 mei van het jaar na het jaar waarvoor de subsidie wordt aangevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel190
  - number: '191'
    text: |-
      Producentenorganisaties overleggen ter uitvoering van artikel 27 van [verordening 2017/892](32792R2017) jaarlijks
      tegelijk met de indiening van de subsidieaanvraag:

      a. een digitale ledenlijst per 1 januari van het jaar volgend op het jaar waarop de subsidieaanvraag betrekking
      heeft met gebruikmaking van een door de minister beschikbaar gesteld middel;

      b. een overzicht van de leden die gedurende het jaar waarop de subsidieaanvraag betrekking heeft zijn uitgetreden,
      onder vermelding van de datum van uittreding, alsook van de leden, bedoeld in [artikel 7, vijfde lid][ref1], met
      gebruikmaking van een door de minister beschikbaar gesteld middel; en

      c. een parafenlijst van tekeningbevoegde personen binnen de producentenorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel7
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '7'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '192'
    text: |-
      1 Een producentenorganisatie die in enig jaar een goedgekeurd operationeel programma uitvoert kan de minister
      uiterlijk op de volgende data om betaling van een voorschot als bedoeld in artikel 35, eerste lid, van [verordening
      2017/891](32791R2017) verzoeken:

      a. eerste voorschot: 31 januari;

      b. tweede voorschot: 31 mei; en

      c. derde voorschot: 30 september.

      2 In een verzoek om een voorschot wordt:

      a. het bedrag van het verzochte voorschot genoemd; en

      b. een onderbouwing opgenomen aan de hand van een reële raming van de verwachte uitgaven.

      3 Een producentenorganisatie die om een voorschot verzoekt, is ook verplicht om voor de tweede en derde termijn van
      het betreffende jaar een voorschot te verzoeken.

      4 Ten behoeve van ieder volgend voorschot toont de producentenorganisatie aan dat de eerdere voorschotten en de
      overeenkomstige bijdrage van de producentenorganisatie daadwerkelijk zijn besteed door de volgende bewijsstukken
      betreffende het kwartaal voorafgaand aan het kwartaal waarvoor het voorschot wordt gevraagd te overleggen aan de
      minister:

      a. de kwartaalrapportage; en

      b. de detailstaat declaratie.

      5 De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken.

      6 De accountant stelt op basis van de door hem uitgevoerde controle, met gebruikmaking van een door de minister
      beschikbaar gesteld model, een controleverklaring op en waarmerkt de bewijsstukken.

      7 De bewijsstukken worden gelijktijdig met het verzoek, bedoeld in het eerste lid, onderdelen b en c, aan de
      minister overgelegd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel192
  - number: '193'
    text: |-
      Bij een verzoek om vrijgave van de zekerheid, bedoeld in artikel 35, tweede lid, van [verordening 2017/891]
      (32791R2017), worden, voor het kwartaal waarop de gestelde zekerheid betrekking heeft, de bewijsstukken, bedoeld in
      [artikel 192, vierde tot en met zesde lid][ref1], ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel192
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '192'
  - number: '194'
    text: |-
      1 Een producentenorganisatie kan de minister uiterlijk op 1 mei, 1 augustus of 1 november van enig jaar verzoeken
      om een betaling van het gedeelte van de subsidie dat overeenkomt met de reeds in het kader van het operationele
      programma bestede en nog niet aan de producentenorganisatie betaalde bedragen, bedoeld in artikel 12 van
      [verordening 2017/892](32792R2017).

      2 Ter onderbouwing van het verzoek om gedeeltelijke betaling overlegt de producentenorganisatie de volgende
      bewijsstukken aan de minister:

      a. een rapportage, met gebruikmaking van een door de minister beschikbaar gesteld middel, over de bij het verzoek
      betrokken periode; en

      b. een detailstaat declaratie.

      3 De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken.

      4 De accountant stelt op basis van de door hem uitgevoerde controle een controleverklaring op, met gebruikmaking
      van een door de minister beschikbaar gesteld model, alsmede een verslag van de verrichte werkzaamheden en waarmerkt
      de bewijsstukken.

      5 De bewijsstukken worden uiterlijk op de volgende data aan de minister overlegd:

      a. eerste rapportage: 15 mei van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft;

      b. tweede rapportage: 15 augustus van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft; en

      c. derde rapportage: 15 november van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft.

      6 Indien een uitgave afwijkt van de in het operationele programma opgenomen begroting voor een uitgavenpost voor
      een activiteit, wordt deze afwijking bij het verzoek om gedeeltelijke betaling voldoende gemotiveerd.

      7 Een verzoek om gedeeltelijke betaling wordt ten aanzien van overheadkosten als bedoeld in bijlage III, onderdeel
      2, sub a, van [verordening 2017/891](32791R2017), slechts gedaan voor het gedeelte van het forfait naar rato van de
      gerealiseerde uitgaven over de betrokken periode.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel194
  - number: '195'
    text: |-
      Indien een producentenorganisatie werkt met een administratie van dertien perioden wordt, voor de toepassing van de
      [artikelen 192][ref1], [193][ref2] en [194][ref3], onder kwartaal verstaan één keer een tijdvak van vier perioden
      en drie keer een tijdvak van drie perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel192
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel193
      [ref3]: https://wetten.overheid.nl/BWBR0041140#Artikel194
