      [30][ref10] van overeenkomstige toepassing zijn op unies van producentenorganisaties.

      2 Alle artikelen uit [deel 1][ref11] en [deel 3 tot en met 8][ref12] zijn van overeenkomstige toepassing, tenzij
      voor de unie van producentenorganisaties een afwijkende regeling is opgenomen.


