      2 De minister is bevoegd de besluiten te nemen en de handelingen te verrichten waartoe [verordening 1308/2013]
      (32013R1308), [verordening 2017/891](32791R2017) en [verordening 2017/892](32792R2017) de lidstaat de opdracht
