  - number: '117'
    text: |-
      Subsidiabel zijn uitgaven voor:

      a. meerkosten voor de aankoop van biologisch afbreekbare verpakkingen;

      b. voor de ontwikkeling van nieuwe biologisch afbreekbare verpakkingen, inclusief personeelskosten; en

      c. meerkosten voor de aankoop van biologisch afbreekbare bevestigingsmaterialen, zoals biologisch afbreekbare clips
      en biologisch afbreekbaar touw.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel117
  - number: 117a
    text: |-
      Uitgaven voor de verwerking van restproducten van groenten en fruit door de producentenorganisatie zijn
      subsidiabel, inclusief personeelskosten, indien het gaat om uitgaven voor verwerking tot:

      a. materialen voor de teelt van groenten en fruit;

      b. verpakkingen voor producten bestemd voor menselijke of dierlijke voedselconsumptie; en

      c. andere toepassingen ten behoeve van menselijke of dierlijke voedselconsumptie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel117a
  - number: '118'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen in de aanschaf van belichtingsinstallaties ten behoeve
      van het jaarrond produceren worden gesubsidieerd indien de energie die gedurende de instandhoudingstermijn, bedoeld
      in [artikel 76, eerste lid][ref1], wordt gebruikt voor de belichtingsinstallatie een duurzaam karakter heeft of
      wordt opgewekt met behulp van een warmtekrachtkoppelinginstallatie.

      2 De producentenorganisatie toont bij de indiening van het operationeel programma aan dat:

      a. de belichtingsinstallatie waarvoor subsidie wordt aangevraagd benodigd is om de verkoop van het betreffende
      product jaarrond plaats te laten vinden danwel de betreffende nieuwe afzetkanalen of markten jaarrond te kunnen
      bedienen; en

      b. de energie die voor de belichtingsinstallatie wordt gebruikt een duurzaam

      karakter heeft of wordt opgewekt met behulp van een warmtekrachtkoppelinginstallatie.

      3 Voor uitgavenposten die in het operationeel programma zijn opgenomen voor de jaren na het eerste jaar wordt de
      onder het tweede lid gevraagde informatie bij het wijzigingsverzoek zoals bedoeld in artikel 34, eerste lid, van
      [verordening 2017/891](32791R2017), opgeleverd.

      4 De producentenorganisatie toont bij indiening van de subsidieaanvraag voor het laatste uitvoeringsjaar van het
      operationeel programma aan dat de productie van het betreffende product jaarrond wordt verkocht en indien van
      toepassing, de betreffende nieuwe afzetkanalen of markten jaarrond worden beleverd.

      5 Uitgaven voor schermen ten behoeve van lichtafscherming en verwijderingsbijdragen zijn niet subsidiabel.

      6 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
      overzicht van de hoeveelheden product, met uitsplitsing naar gewas en type klant, die zijn geproduceerd met behulp
      van de belichtingsinstallatie.

      7 Uitgaven voor identieke investeringen voor hetzelfde product, afzetkanaal of dezelfde markt zijn uitsluitend
      subsidiabel in geval van uitgaven gedaan binnen vier jaar na de factuurdatum van de laatste factuur voor de eerste
      investering.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel76
