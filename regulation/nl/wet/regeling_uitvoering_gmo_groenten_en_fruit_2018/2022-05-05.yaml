  - number: '28'
    text: |-
      Indien de minister op grond van [artikel 27, vierde lid][ref1], aanvullende bewijsstukken opvraagt wordt de in
      artikel 154, vierde lid, van [verordening 1308/2013](32013R1308) bedoelde termijn opgeschort tot de verzochte
      aanvullende bewijsstukken door de producentenorganisatie aan de minister zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel27
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel28
