  - number: '93'
    text: |-
      1 De producentenorganisatie voert activiteiten, zoals bedoeld in [afdelingen 3][ref1] tot en met [5][ref2] voor
      het duurzaam gebruik van pesticiden, de biologische productie en om de bodem te beschermen respectievelijk uit
      gedurende de gehele looptijd van het operationele programma.

      2 Indien dit noodzakelijk is om te voldoen aan de looptijd die van toepassing is voor de biologische productie,
      zoals bedoeld in het plattelandsontwikkelingsprogramma, wordt de termijn uit het eerste lid verlengd tot zes jaar.
      De producentenorganisatie neemt deze activiteit dan op in het volgende operationeel programma.

      3 In afdoende gemotiveerde gevallen, en vooral indien dit volgt uit de evaluatie bedoeld in artikel 57 van
      [verordening 2017/891](32791R2017), zijn het eerste en tweede lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk4
