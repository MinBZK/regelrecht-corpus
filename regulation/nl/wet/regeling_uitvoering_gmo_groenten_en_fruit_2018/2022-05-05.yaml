  - number: '177'
    text: |-
      De minister stelt de voor groen oogsten en niet oogsten te betalen vergoedingen vast overeenkomstig artikel 49,
      onderdeel a, van [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel177
  - number: '178'
    text: |-
      1 Een voorafgaande melding als bedoeld in artikel 48, vijfde lid, van [verordening 2017/891](32791R2017), wordt
      elektronisch ingediend bij de minister.

      2 In de melding wordt het door de minister toegekende registratienummer van het toepasselijke perceel
      of de registratienummers van de toepasselijke percelen, zoals vermeld op het formulier, bedoeld in de
      [Regeling landbouwtelling en gecombineerde opgave][ref1] zoals die geldt op het moment waarop de melding wordt
      gedaan, opgegeven.

      3 Ten behoeve van de melding maakt de producentenorganisatie of unie van producentenorganisaties gebruik van een
      door de minister beschikbaar gesteld middel.

      4 Indien de melding plaatsvindt voor 0:00 uur, vindt de controle, bedoeld in artikel 31, eerste en tweede lid, van
      [verordening 2017/892](32792R2017) uiterlijk de derde werkdag plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0040671
