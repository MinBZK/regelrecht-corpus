  - number: '94'
    text: |-
      Investeringen in duurzame productiemiddelen die op grond van deze afdeling subsidiabel zijn kunnen gedurende de
      bedrijfseconomische levensduur vervangen worden, indien er significante milieuvoordelen zijn.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel94
  - number: '95'
    text: |-
      1 Een producentenorganisatie die uitgaven voor investeringen in installaties voor energiebesparende projecten
      opneemt in haar operationeel programma voegt aan de informatie, bedoeld in [artikel 51][ref1], een energiebalans
      toe, waarin wordt vermeld wat de prognose is van de verwachte verbetering of besparing per installatie, aan de hand
      van een technische specificatie van de leverancier of deskundige conform artikel 3, vierde lid, van [verordening
      2017/892](32792R2017).

      2 Voor uitgavenposten die in het operationeel programma zijn opgenomen voor de jaren na het eerste jaar worden de
      documenten bedoeld in het eerste lid jaarlijks bij het wijzigingsverzoek zoals bedoeld in artikel 34, eerste lid,
      van [verordening 2017/891](32791R2017), opgeleverd.

      3 Ter verantwoording van de gerealiseerde energiebesparing overlegt de producentenorganisatie bij de
      subsidieaanvraag die wordt ingediend nadat de installaties één jaar in bedrijf zijn gesteld, het volgende:

      a. het declaratieformulier energiebesparende investeringen, met gebruikmaking van een door de minister beschikbaar
      gesteld middel;

      b. een overzicht van de bereikte energiebesparing volgens de geactualiseerde energiebalans, met gebruikmaking van
      een door de minister beschikbaar gesteld middel; en

      c. de meest recente jaarafrekening van de energieleverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '51'
        hoofdstuk: '1'
  - number: '96'
    text: |-
      1 Indien de totale hoeveelheid energie die wordt opgewekt met een energiebesparende installatie incidenteel
      groter is dan de totale hoeveelheid energie die op de locatie waar de investering is geplaatst op jaarbasis
      is afgenomen, wordt de opbrengst van de netto energielevering aan derden in mindering gebracht op de subsidie
      voor de desbetreffende investering. Indien de subsidie reeds is vastgesteld wordt de subsidie ten nadele van de
      producentenorganisatie gewijzigd.

      2 De producentenorganisatie overlegt jaarlijks aan de minister bij het indienen van de subsidieaanvraag, vanaf het
      jaar na de factuurdatum van de laatste factuur voor de installatie, de energiebalans. De eerste periode waarover de
      energiebalans moet worden overgelegd gaat in op het moment van factuurdatum van de laatste factuur en loopt tot en
      met 31 december van dat betreffende jaar, daarna wordt de energiebalans per kalenderjaar opgemaakt.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel96
  - number: '97'
    text: |-
      1 Uitgaven voor investeringen in een energiebesparende installatie uitgevoerd door middel van een participatie in
      een samenwerkingsverband van agrarische bedrijven met energieclustering zijn subsidiabel.

      2 Een agrarisch samenwerkingsverband omvat ook een leveringsovereenkomst tussen agrarische bedrijven.

      3 Door mee te doen in het samenwerkingsverband moet er vooraf aantoonbaar minstens 15 procent reductie in
      het energieverbuik op de betrokken locatie op kunnen treden. Het aandeel in de totale capaciteit van het
      samenwerkingsverband mag niet hoger zijn dan de capaciteit die nodig is op de betrokken locatie. De kosten voor dat
      aandeel zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel97
  - number: '98'
    text: |-
      1 Een producentenorganisatie die uitgaven voor investeringen in installaties voor verbeterde waterkwaliteit,
      waterbesparing, besparing op het mineralenverbruik of emmissiebeperking opneemt in haar operationeel programma
      voegt aan de informatie, bedoeld in [artikel 51][ref1], een prognose toe van de verwachte verbetering of besparing
      per installatie, aan de hand van een technische specificatie van de leverancier of deskundige conform artikel 3,
      vierde lid, van [verordening 2017/892](32792R2017).

      2 Voor uitgavenposten die in het operationeel programma zijn opgenomen voor de jaren na het eerste jaar worden de
      documenten bedoeld in het eerste lid jaarlijks bij het wijzigingsverzoek zoals bedoeld in artikel 34, eerste lid,
      van [verordening 2017/891](32791R2017), opgeleverd.

      3 Ter verantwoording van de gerealiseerde verbetering van de waterkwaliteit, waterbesparing, besparing op het het
      mineralenverbruik of emissiebeperking overlegt de producentenorganisatie jaarlijks bij de subsidieaanvraag, vanaf
      het jaar na de factuurdatum van de laatste factuur voor de installatie, het volgende:

      a. het declaratieformulier installaties waterkwaliteit, waterbesparing, waterzuivering en fertigatie in de
      fruitteelt, met gebruikmaking van een door de minister beschikbaar gesteld middel; en

      b. een overzicht van de bereikte verbetering of besparing per installatie, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, aan de hand van een vergelijking van:

      1°. een meting van de situatie voor de ingebruikname van de installatie; en

      2°. een meting van de gerealiseerde situatie na de ingebruikname van de installatie.

      4 In geval van leidingwater wordt de bereikte waterbesparing onderbouwd aan de hand van de jaarafrekening van het
      waterleidingbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '51'
        hoofdstuk: '1'
  - number: '99'
    text: |-
      1 Uitgaven voor innovatieve investeringen die niet in deze titel zijn opgenomen komen voor subsidie in aanmerking
      indien aan de voorwaarden uit het tweede lid wordt voldaan, mits die innovatieve investeringen:

      a. kunnen resulteren in 15 procent vermindering van het huidige verbruik van productiemiddelen, de uitstoot van
      verontreinigende stoffen of afval in het productieproces; of

      b. voldoen aan de voorwaarden van artikel 3, zesde lid, van [verordening 2017/892](32792R2017).

      2 Uitgaven voor innovatieve investeringen uit het eerste lid komen voor subsidie in aanmerking indien aan de
      volgende voorwaarde wordt voldaan:

      a. in het geval dat de innovatieve investering nog niet eerder in een operationeel programma is opgenomen wordt de
      verwachte vermindering onderbouwd aan de hand van een onderzoek of evaluatie door een onafhankelijke organisatie
      of deskundige;

      b. in overige gevallen wordt de verwachte vermindering aangetoond aan de hand van de technische specificatie van
      de leverancier.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel99
  - number: '100'
    text: |-
      1 Uitgaven voor investeringen in duurzame energie zijn subsidiabel indien:

      a. de technische specificatie van de investering een reductie van minimaal 15 procent van het energieverbruik uit
      fossiele brandstoffen of energie ingekocht op het net geeft zoals vooraf aangetoond in overeenstemming met artikel
      3, vierde lid van [verordening 2017/892](32792R2017); en

      b. het gaat om onder meer:

      1°. zonnepanelen;

      2°. zonnecollectoren;

      3°. windmolens;

      4°. aardwarmte.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van minimaal 7 procent
      van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net toestaan, indien de activiteit
      andere milieuvoordelen waarborgt.

      3 Subsidiabel zijn:

      a. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017);

      b. de kosten verbonden aan het aansluiten van het lid, de producentenorganisatie of de dochteronderneming op een
      geothermische bron;

      c. in het geval van zonnepanelen en zonnecollectoren de kosten in verband met de aanpassing van het gebouw van de
      producentenorganisatie, een lid of een dochteronderneming, en het ondersteuningsmateriaal; en

      d. de kosten verbonden aan het transformatorstation van het lid, de producentenorganisatie of dochteronderneming
      met aansluiting op een extern transformatorstation van de energieleveranciers en met het versterken van de
      verbinding voor hernieuwbare energie.

      4 Niet subsidiabel zijn uitgaven voor:

      a. warmte-krachtkoppeling installaties; en

      b. biobrandstofbranders op locatie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel100
  - number: '101'
    text: |-
      1 Uitgaven voor investeringen voor de aanschaf van apparatuur voor de aansluiting op netwerken van
      restafvalstromen, zoals COaardwarmte en restwarmtenetwerken en biogas, zijn subsidiabel indien de specificatie van
      de investering een reductie van minimaal 15 procent van het energieverbruik uit fossiele brandstoffen of energie
      ingekocht op het net geeft zoals vooraf aangetoond in overeenstemming met artikel 3, vierde lid van [verordening
      2017/892](32792R2017).

      2 Subsidiabel zijn:

      a. installaties, waaronder interconnectoren en transportpijplijnen, benodigd voor het gebruik van energie en CO uit
      restafvalstromen van derden;

      b. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017);

      c. kosten die verband houden met het aansluiten van het lid, de producentenorganisatie of dochteronderneming op de
      bron van de leverancier; en

      d. in het geval van een CO-netwerk, ook de kosten in verband met voorzieningen voor de opslag van CO.

      3 Niet subsidiabel zijn de uitgaven:

      a. voor voorzieningen voor de distributie en regulering van warmte en CO in de kas; en

      b. die verband houden met een vergistingsinstallatie op het bedrijf en biobranders voor de productie van restwarmte
      en biobrandstoffen.

      4 De producentenorganisatie overlegt bij de indiening van de subsidieaanvraag aan de minister voor de uitgaven,
      bedoeld in het eerste lid, het leveringscontract tussen de producentenorganisatie, haar dochteronderneming of het
      lid en de leverancier.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel101
  - number: '102'
    text: |-
      1 Uitgaven voor investeringen in het kader van verbetering van energie-efficientie door toepassing van
      energiebesparende technieken zijn subsidiabel indien de specificatie van de investering een reductie van minimaal
      15 procent van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net geeft zoals vooraf
      aangetoond in overeenstemming met artikel 3, vierde lid van [verordening 2017/892](32792R2017).

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van minimaal 7 procent
      van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net toestaan, indien de activiteit
      andere milieuvoordelen waarborgt.

      3 Subsidiabel zijn:

      a. apparatuur voor energieopslag en -uitwisselingssystemen, zoals energiebesparende warmtepompen, warmtewisselaars
      en waterhoudende grondlagen voor warmte- en koudebuffering;

      b. apparatuur voor gesloten en semi-gesloten kassystemen, zoals energiebesparende ventilatie-, luchtbehandeling- en
      hogedrukvernevelingssystemen, energiebesparende tweede schermen en innovatieve energiebesparende en isolerende dak-
      en gevelsystemen;

      c. apparatuur voor het energiezuinig drogen en opslaan van producten zoals CO-propaankoeling;

      d. andere energie-efficiënte apparatuur, zoals energiebesparende motoren; en

      e. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017).

      4 In het geval van gesloten en semi-gesloten kassystemen zijn de volgende combinaties in het kader van een
      totaalconcept subsidiabel:

      1°. buitenluchtaanzuiging in combinatie met een tweede beweegbaar energiescherm;

      2°. energiebesparend ventilatiesysteem met warmteterugwinning of voorverwarming;

      3°. luchtbehandelingsystemen ter ontvochtiging van lucht;

      4°. hogedrukvernevelingsysteem met een adiabatische koeling waarbij de druppelgrootte 5 tot maximaal 15 micron
      bedraagt;

      5°. gevelschermen die een energiebesparing realiseren van ten minste 40 procent wanneer het scherm gesloten is;

      6°. warmte-uitwisselingsysteem;

      7°. warmtepomp;

      8°. waterhoudende lagen voor warmte- en koudebuffering; en

      9°. tweede energiescherm, dat een energiebesparing van ten minste 45 procent oplevert wanneer het scherm gesloten
      is.

      5 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor nieuwe kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal is van dubbelglas en licht doorlatend (diffuus gecoat); of

      b. het materiaal is dubbel gelaagd met een combinatie van glas en hoge kwaliteits film en doorschijnend (diffuus
      gecoat); en

      c. in afwijking van artikel 3, zevende lid, onder c, van [verordening 2017/892](32792R2017) zijn in het geval van
      dubbele beglazing, alleen de aanvullende uitgaven die verband houden met dubbele beglazing ten opzichte van enkele
      beglazing subsidiabel.

      6 In het geval van energiebesparende en isolerende dak- en gevelsystemen voor bestaande kassen zijn de volgende
      voorwaarden van toepassing:

      a. het materiaal heeft betere doorschijnende eigenschappen dan enkele beglazing en is doorschijnend;

      b. het systeem bestaat uit plastic panelen, dubbelglas panelen of dubbel fluoroplymeer (EFTE) film met een
      optionele overdrukventilatie ventilator om folies van elkaar te scheiden en de isolatie te verbeteren;

      c. het systeem bestaat uit isolatiemateriaal waarbij de som van de warmteweerstand van de lagen (R=∑(Rm)=∑d/λ)
      toeneemt met ten minste 1,50 m2K/W in vergelijking met de oude situatie; en

      d. in afwijking van artikel 3, zevende lid, onder c, van [verordening 2017/892](32792R2017) zijn alleen de
      aanvullende uitgaven voor de geïsoleerde oppervlakte subsidiabel.

      7 In het geval van energie efficiënte droog- en opslagmethoden, zijn de volgende voorwaarden van toepassing:

      a. de apparatuur is bedoeld voor de korte en lange termijn bewaring van producten; en

      b. de uitgaven voor de initiële verkrijging van meet- en controleapparatuur zijn subsidiabel.

      8 De volgende investeringen zijn niet subsidiabel:

      a. warmte buffer boiler tank (WOK);

      b. warmte buffer tank;

      c. eerste energieschermen;

      d. verduisteringsschermen;

      e. zonwerende materialen;

      f. rookgas afvoer en bijbehorende meetapparatuur; en

      g. de vervanging van een tweede scherm.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel102
  - number: '103'
    text: |-
      1 Uitgaven voor investeringen in innovatieve gewasbeschermingsapparatuur op basis van niet-chemische methoden zijn
      subsidiabel indien de technische specificatie van de investering een vermindering van het gebruik van chemische
      gewasbeschermingsmiddelen van minimaal 15 procent geeft zoals vooraf aangetoond in overeenstemming met artikel 3,
      vierde lid van [verordening 2017/892](32792R2017).

      2 In afwijking van het eerste lid is de eis dat de betrokken investering een vermindering van het gebruik van
      chemische gewasbeschermingsmiddelen van minimaal 15 procent geeft niet van toepassing indien de investering wordt
      ingezet in het kader van de biologische productie van groenten en fruit.

      3 Als innovatieve gewasbeschermingsapparatuur op basis van niet-chemische methoden zijn subsidiabel:

      a. apparatuur en bijbehorende regelsystemen voor UV-licht ter bestrijding van schimmelziekten;

      b. precisie mechanische onkruidbestrijdingsapparatuur en bijbehorende besturingssystemen voor toepassing van niet-
      chemische methoden;

      c. elektrochemische waterdesinfectie tegen micro-organismen; en

      d. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017).

      4 In het geval van precisie mechanische onkruidbestrijding als onderdeel van een zelfrijdend landbouwvoertuig komt
      alleen het onkruidbestrijdingssysteem in aanmerking voor ondersteuning.

      5 In het geval van elektrochemische waterbescherming komt de bijbehorende spuit ook in aanmerking voor
      ondersteuning.

      6 Niet subsidiabel zijn:

      a. spuitleidingen;

      b. transportsystemen voor het verplaatsen van UV belichtingswagens naar de volgende rij of afdeling;

      c. standaard agrarische apparatuur en onderdelen, zoals een tractor, gereedschapsdrager, motor en cabine;

      d. thermische apparatuur;

      e. kokend watertechnieken;

      f. standaard afvoerwaterzuivering voor het recirculeren van water in de pro-oogstfase; en

      g. hygiënesluizen en hygiënestations, evenals automatische zeep en desinfectie-eenheden met geïntegreerd
      tourniquet.

      7 In afwijking van [artikel 98, derde lid, onderdeel b][ref1], onderbouwt de producentenorganisatie de
      emissiebeperking door bij de indiening van de subsidieaanvraag een jaarlijkse opgave van het totale gebruik aan
      werkzame stof in kilogram per hectare, uitgesplitst naar gewas(groep), te overleggen waarbij de nulsituatie wordt
      weergegeven, aan de hand van registraties van de teeltbedrijven.

      8 De nulsituatie is het gemiddelde gebruik aan werkzame stof in kilogram per hectare van het betrokken teeltbedrijf
      over drie voorgaande jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel98
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel103
    references:
