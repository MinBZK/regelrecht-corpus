  - number: '38'
    text: |-
      De waarde van de afgezette productie van leden die zijn toegetreden tot de producentenorganisatie gedurende de
      referentieperiode, bedoeld in [artikel 36][ref1], wordt in aanmerking genomen voor de bepaling van de waarde
      afgezette productie van de producentenorganisatie vanaf de datum die door het bestuur van de producentenorganisatie
      in haar schriftelijke bevestiging als bedoeld in [artikel 7, vierde lid][ref2], is aangewezen als de datum waarop
      het lidmaatschap in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel7
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '36'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0041140
        artikel: '7'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '39'
    text: |-
      1 De producentenorganisatie kan bij de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie de waarde van de afgezette productie van leden in aanmerking nemen die:

      a. gedurende de referentieperiode voor de producten waarvoor de producentenorganisatie is erkend waren aangesloten
      bij een andere in Nederland erkende producentenorganisatie; en

      b. na de referentieperiode voor de producten waarvoor de producentenorganisatie is erkend tot de
      producentenorganisatie zijn toegetreden, voor zover deze leden voldoen aan het vereiste van artikel 23, tweede lid,
      van [verordening 2017/891](32791R2017).

      2 De waarde van de afgezette productie van de leden, wordt slechts door de nieuwe producentenorganisatie
      in aanmerking genomen indien de producentenorganisatie waar de producent was aangesloten gedurende de
      referentieperiode de nieuwe producentenorganisatie uiterlijk op 15 november van het jaar waarvoor de waarde van de
      afgezette productie bepaald wordt een overzicht verstrekt van de waarden van de voor het individuele lid afgezette
      producten waarvoor het lid bij de nieuwe producentenorganisatie is aangesloten.

      3 Indien de waarde van de afgezette productie van een lid niet in aanmerking is genomen bij de bepaling van de
      waarde van de afgezette productie van de producentenorganisatie waar de producent was aangesloten gedurende de
      referentieperiode is [artikel 40, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel40
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '40'
        hoofdstuk: '1'
  - number: '40'
    text: |-
      1 De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie in aanmerking nemen de
      waarde van de afgezette productie van leden die:

      a. na de referentieperiode tot de producentenorganisatie zijn toegetreden, voor zover deze leden voldoen aan het
      vereiste van artikel 23, tweede lid, van [verordening 2017/891](32791R2017); en

      b. gedurende de referentieperiode,

      1°. niet waren aangesloten bij een erkende producentenorganisatie; of

      2°. waren aangesloten bij een producentenorganisatie waarvan de erkenning nadien is ingetrokken.

      2 De waarde van de afgezette productie van de leden, bedoeld in het eerste lid, wordt in aanmerking genomen bij de
      bepaling van de waarde afgezette productie van de producentenorganisatie indien het lid de producentenorganisatie:

      a. een overzicht verstrekt van de waarden van de afgezette productie van de producten waarvoor de producent bij de
      producentenorganisatie is aangesloten;

      b. een controleverklaring of rapportage naar aanleiding van een COS 4400 onderzoek van een extern accountant
      overlegt waarin wordt bevestigd dat de waarden die zijn opgegeven in het overzicht, bedoeld in onderdeel a:

      1°. juist zijn;

      2°. gerealiseerd zijn door de verkoop van producten waarvoor de producentenorganisatie is erkend;

      3°. producten betreffen die voor eigen rekening en risico door de betreffende producent binnen het grondgebied van
      de Europese Unie zijn geproduceerd; en

      4°. geen BTW en transportkosten bevatten; en

      c. opgave doet van eerdere lidmaatschappen van producentenorganisaties in de afgelopen vijf jaar.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel40
  - number: '41'
    text: |-
      1 De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie in aanmerking nemen de waarde afgezette productie van leden die:

      a. gedurende de referentieperiode waren aangesloten bij een in een andere lidstaat erkende producentenorganisatie,
      en

      b. na de referentieperiode tot de producentenorganisatie zijn toegetreden, voor zover deze leden voldoen aan het
      vereiste van artikel 23, tweede lid, van [verordening 2017/891](32791R2017).

      2 De waarde afgezette productie van de leden wordt in aanmerking genomen bij het bepalen van de waarde afgezette
      productie van de producentenorganisatie indien de producentenorganisatie waar de producent eerder was aangesloten
      een schriftelijke verklaring verstrekt dat de waarde niet eerder aan een subsidieaanvraag ten grondslag heeft
      gelegen; en:

      a. de producentenorganisatie waar de producent was aangesloten gedurende de referentieperiode de nieuwe
      producentenorganisatie een schriftelijke verklaring verstrekt over de waarden van de voor het individuele lid
      afgezette producten waarvoor het lid bij de nieuwe producentenorganisatie is aangesloten; of

      b. het lid aan de producentenorganisatie een overzicht en controleverklaring of rapportage als bedoeld in
      [artikel 40, tweede lid, onderdeel b][ref1], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel40
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '40'
        hoofdstuk: '1'
  - number: '42'
    text: |-
      De waarde van de afgezette productie die is gerealiseerd door verkoop van producten van leden die op 1 januari
      van het uitvoeringsjaar waarvoor de waarde van de afgezette productie wordt berekend niet meer bij de
      producentenorganisatie zijn aangesloten, wordt aantoonbaar uit de waarde van de afgezette productie van de
      producentenorganisatie verwijderd voor het betreffende jaar.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel42
  - number: '43'
    text: |-
      1 Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring over
      de juistheid van de opgave van de waarde van de afgezette productie van de producentenorganisatie opstellen,
      met gebruikmaking van een door de minister beschikbaar gesteld model, alsmede een verslag over de verrichte
      werkzaamheden.

      2 Producentenorganisaties overleggen jaarlijks uiterlijk op 1 december aan de minister:

      a. de definitieve opgave van de waarde van de afgezette productie, met gebruikmaking van een door de minister
      beschikbaar gesteld middel; en

      b. de in het eerste lid bedoelde controleverklaring met het bijbehorende verslag.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel43
  - number: '44'
    text: |-
      1 De systematiek van berekening van de financiële bijdragen aan het actiefonds, bedoeld in artikel 32, eerste
      lid, onderdeel a, van [verordening 1308/2013](32013R1308), wordt door de producentenorganisatie of unie van
      producentenorganisaties vastgelegd in haar statuten.

      2 In het geval de financiële bijdragen van de leden, bedoeld in artikel 32, eerste lid, onderdeel a, onderdeel i
      of ii, van [verordening 1308/2013](32013R1308) gedifferentieerd zijn, worden deze op basis van objectieve criteria
      onderscheiden.

      3 Ter uitvoering van artikel 25, tweede lid, van [verordening 2017/891](32791R2017) wordt het besluit van de
      producentenorganisatie of unie van producentenorganisaties tot vaststelling van de financiële bijdragen aan het
      actiefonds, bedoeld in artikel 32, eerste lid, onderdeel a, van [verordening 1308/2013](32013R1308) goedgekeurd
      door de algemene vergadering van de producentenorganisatie of unie van producentenorganisaties’.

      4 In aanvulling op artikel 5 van [verordening 2017/892](32792R2017) overlegt een producentenorganisatie of unie van
      producentenorganisaties voor 8 december van het jaar waarin een operationeel programma, of een wijziging daarvan
      als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017), voor goedkeuring aan de minister
      is voorgelegd, bewijstukken waarmee wordt aangetoond dat de goedkeuring van het besluit tot vaststelling van de
      bijdragen aan het actiefonds door de algemene vergadering heeft plaatsgevonden.

      5 Indien in een jaar sprake is van een tekort van het actiefonds, kunnen tot en met 14 februari van het volgende
      jaar financiële bijdragen als bedoeld in artikel 32, eerste lid, onderdeel a, van [verordening 1308/2013]
      (32013R1308) in het actiefonds worden gestort.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel44
  - number: '45'
    text: |-
      1 Door de producentenorganisatie of unie van producentenorganisaties wordt voor het actiefonds:

      a. een aparte bankrekening geopend;

      b. een aparte grootboekrekening gereserveerd; of

      c. een aparte kostenplaats aangemaakt.

      2 De afsluiting van het rapportagekwartaal of het rapportagejaar in de administratie van de kostenplaats,
      grootboekrekening of bankrekening van het actiefonds van de producentenorganisatie of unie van
      producentenorganisaties sluit direct aan op de kwartaalrapportage of de jaarrapportage.

      3 Het saldo van de eigen bijdragen van leden aan het actiefonds van de producentenorganisatie of unie van
      producentenorganisaties is op 14 februari van enig jaar groter dan of gelijk aan nul.

      4 De producentenorganisatie of unie van producentenorganisaties laat een extern accountant een controle uitvoeren
      en, met gebruikmaking van een door de minister beschikbaar gesteld model, een controleverklaring afleggen over:

      a. de juistheid van de in het tweede lid bedoelde afsluiting; en

      b. de naleving van de voorschriften inzake het beheer van het actiefonds, bedoeld in artikel 24 van [verordening
      2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel45
  - number: '46'
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties informeert jaarlijks na afloop van het
      uitvoeringsjaar haar leden in een algemene vergadering over de realisatie van het operationeel programma gedurende
      het voorgaande uitvoeringsjaar, in het bijzonder voor wat betreft:

      a. de bedragen die per project over het uitvoeringsjaar zijn gerealiseerd;

      b. welke investeringen van € 100.000 en hoger gedurende het uitvoeringsjaar op locatie van de
      producentenorganisatie of de unie van producentenorganisaties of een dochteronderneming zijn gerealiseerd; en

      c. welke investeringen van € 50.000 en hoger gedurende het uitvoeringsjaar op andere locaties zijn gerealiseerd,
      onder vermelding van het adres van de locaties.

      2 De producentenorganisatie of unie van producentenorganisaties overlegt aan de minister jaarlijks voor 1 juli na
      enig uitvoeringsjaar bewijsstukken waaruit blijkt dat het voldaan heeft aan haar informatieverplichting.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel46
  - number: '47'
    text: |-
      1 Producentenorganisaties streven met hun operationeel programma minimaal elk van de volgende strategische doelen
      na:

      a. verduurzaming; en

      b. marktgericht produceren.

      2 Producentenorganisaties kunnen met hun operationeel programma tevens het strategisch doel versterking
      afzetstructuur nastreven.

      3 De algemene nationale streefdoelen en nationaal gekwantificeerde streefcijfers zijn voor Nederland:

      a. voor het strategisch doel verduurzaming voor de periode van 1 januari 2019 tot en met 31 december 2023:

      1°. ten aanzien van energie, een vermindering van de uitstoot van broeikasgassen, meer in het bijzonder een CO
      reductie van 15 procent ten opzichte van 2014 door middel van:

      i. een toename van het gebruik van duurzame energie in kassen tot 7 procent; en

      ii. een totale reductie in het verbruik van fossiele energie in kassen met 15 procent ten opzichte van 2011.

      2°. ten aanzien van een duurzaam gebruik van pesticiden, een verdergaande vermindering van de emissie van
      gewasbeschermingsmiddelen naar lucht, water en bodem, meer in het bijzonder:

      i. een volledige dekking van de groenten en fruit productie door private certificatiesystemen in 2023; en

      ii. een afname in 2023 van de emissie van gewasbeschermingsmiddelen naar het grond- en oppervlaktewater van 95
      procent ten opzichte van 2013.

      3°. ten aanzien van de biologische productie een jaarlijkse omzetgroei van 5 procent van biologisch gecertificeerde
      productie in groente en fruit; en

      4°. ten aanzien van nutriënten en afval een verdergaande afname van de emissie van nutriënten naar lucht, water en
      bodem en verdergaande vermindering van afval.

      b. voor het strategische doel marktgericht produceren voor de periode van 1 januari 2017 tot en met 31 december
      2023:

      1°. van de totale omzet van Nederlandse producentenorganisaties is op 31 december 2023 15 procent afkomstig uit
      de afzet van nieuwe producten of nieuwe concepten op bestaande markten of het aanboren van nieuwe afzetkanalen
      en markten;

      2°. een jaarlijkse toename van 2,5 procent van de omzet per areaal;

      3°. een toename van het aantal producten dat wordt afgezet in een hogere kwaliteitsklasse of met een onderscheidend
      kwaliteitslabel; en

      4°. een jaarlijkse groei van 5 procent van de omzet van biologisch gecertificeerde productie in groente en fruit.

      c. voor het strategisch doel versterking afzetstructuur voor de periode van 1 januari 2017 tot en met 31 december
      2023:

      1°. verdergaande samenwerking tussen producentenorganisaties;

      2°. een toename van de organisatiegraad per subsector met 15 procent van het aangesloten areaal op 31 december 2023
      ten opzichte van 1 januari 2014; en

      3°. van de totale omzet, in waarde of volume, van Nederlandse producentenorganisaties is op 31 december 2023
      15 procent afkomstig uit het ontsluiten van een nieuwe markt, logistieke innovatie of een nieuwe manier van
      klantbelevering.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel47
  - number: '48'
    text: |-
      1 In aanvulling op de gegevens, bedoeld in artikel 4 van [verordening 2017/892](32792R2017), bevat een operationeel
      programma de visie van de producentenorganisatie voor de toekomst van de producentenorganisatie.

      2 In de visie van de producentenorganisatie is ten minste een beschrijving opgenomen van het toekomstbeeld dat
      de producentenorganisatie nastreeft en aan het einde van de looptijd van het operationeel programma wil hebben
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel48
  - number: '49'
    text: |-
      De beschrijving van de uitgangssituatie, bedoeld in artikel 4, eerste lid, onderdeel a, van [verordening 2017/892]
      (32792R2017) bevat een SWOT analyse waarin tenminste:

      a. een beschrijving en een verifieerbare onderbouwing is opgenomen van de sterke en zwakke punten van de
      producentenorganisatie; en

      b. een beschrijving en een verifieerbare onderbouwing is opgenomen van de kansen en bedreigingen voor de
      producentenorganisatie bij het realiseren van de visie, bedoeld in [artikel 48][ref1], en de strategische doelen,
      bedoeld in [artikel 47][ref2], van de producentenorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel47
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel49
