  - number: '16'
    text: |-
      Producentenorganisaties beschikken op grond van artikel 7, onderdeel a, van [verordening 2017/891](32791R2017)
      tenminste over een deugdelijk en accuraat systeem van areaalenquêtes en aanvoerprognoses.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel16
  - number: '17'
    text: |-
      Producentenorganisaties, en voor zover van toepassing unies van producentenorganisaties, beschikken op grond
      van artikel 154, eerste lid, onderdeel c, van [verordening 1308/2013](32013R1308) tenminste over een volledige
      beschrijving van de interne organisatie en van de administratieve en interne beheersing van:

      a. de verkoop en prijsbepaling;

      b. de goederenlogistiek;

      c. de financiële administratie;

      d. de beoordeling van investeringen en uitgaven waarvoor subsidie wordt aangevraagd;

      e. het aannemen van nieuwe leden en het beëindigen van het lidmaatschap;

      f. het vergaren van informatie van de leden en de verwerking van mutaties daarin, waaronder de controle op de
      juistheid van de ledenlijst;

      g. de beoordeling van areaalenquêtes en aanvoerprognoses, waaronder de vergelijking met realisaties;

      h. de controle op naleving van artikel 160 van [verordening 1308/2013](32013R1308) door de leden waaronder het
      verlenen van toestemming als bedoeld in artikel 12 van [verordening 2017/891](32791R2017);

      i. het opleggen van sancties; en

      j. het uitbesteden van activiteiten als bedoeld in artikel 155 van [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel17
  - number: '18'
    text: |-
      1 De producentenorganisatie beschikt op grond van artikel 154, eerste lid, onderdeel c, van [verordening 1308/2013]
      (32013R1308) over een redelijk niveau van vermogen en liquiditeit.

      2 Een negatief vermogen wordt door de producentenorganisatie binnen één kalenderjaar aangevuld.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel18
  - number: '19'
    text: |-
      1 De producentenorganisatie beschikt ten behoeve van het commercieel en budgettair beheer van haar activiteiten,
      bedoeld in artikel 153, tweede lid, onderdeel f, van [verordening 1308/2013](32013R1308), op grond van artikel 7
      van [verordening 2017/891](32791R2017) over een eigen, als zodanig herkenbare, kantoorruimte die beschikt over een
      eigen opgang, welke niet door ruimtes van een afnemer of een lid van de producentenorganisatie leidt.

      2 De kantoorruimte is eigendom van of wordt gehuurd door de producentenorganisatie of een dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel19
  - number: '20'
    text: |-
      1 Producentenorganisaties en hun dochterondernemingen maken voor hun financieel administratieve werkzaamheden,
      waaronder het factureren naar afnemers en leden en het opstellen van budgetten, gebruik van eigen personeel.

      2 De in het eerste lid bedoelde verplichting geldt niet voor het opstellen van jaarrekeningen en fiscale zaken.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel20
  - number: '21'
    text: |-
      1 Producentenorganisaties, dan wel dochterondernemingen of unies van producentenorganisaties indien de afzet
      door hen wordt verricht, tonen op grond van artikel 11 van [verordening 2017/891](32791R2017) aan de hand van
      schriftelijke bewijsstukken aan dat zij de verkoopvoorwaarden, en meer in het bijzonder de verkoopprijzen, voor
      de producten van de leden van de producentenorganisatie waarvoor de producentenorganisatie is erkend daadwerkelijk
      bepalen.

      2 De in het eerste lid bedoelde schriftelijke bewijsstukken tonen aan:

      a. welke verkoper er binnen de producentenorganisatie, dochteronderneming of unie van producentenorganisaties
      belast is met de verkoop van de producten van de leden waarvoor de producentenorganisatie is erkend;

      b. wat de taak of opdracht van de verkoper is;

      c. op welke wijze de verkoper door de producentenorganisatie, dochteronderneming of unie van
      producentenorganisaties wordt aangestuurd;

      d. welke aanwijzingen de verkoper van de producentenorganisatie, dochteronderneming of unie van
      producentenorganisaties gekregen heeft voor het voeren van onderhandelingen over de verkoopvoorwaarden;

      e. op welke wijze de verkoper achteraf verantwoording aflegt aan de producentenorganisatie, dochteronderneming of
      unie van producentenorganisaties over de gerealiseerde verkoopvoorwaarden; en

      f. dat de in onderdeel e bedoelde verantwoording daadwerkelijk wordt afgelegd.

      3 De producentenorganisatie legt haar afzetbeleid vast in een besluit van het bestuur dat door de algemene
      vergadering wordt goedgekeurd.

      4 De producentenorganisatie, dochteronderneming of unie van producentenorganisaties bepaalt op welke locatie of
      welke locaties het aanbod van de producten van haar leden fysiek geconcentreerd wordt.

      5 Het afzetbeleid van de producentenorganisatie wordt jaarlijks voor 1 juni door haar bestuur geëvalueerd en een
      verslag van deze evaluatie wordt jaarlijks voor 1 juni door de algemene vergadering van de producentenorganisatie
      besproken en geaccordeerd. De onderliggende stukken worden door de producentenorganisatie gearchiveerd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel21
  - number: '22'
    text: |-
      1 Artikel 155 van [verordening 1308/2013](32013R1308) is van toepassing op de activiteiten van de
      producentenorganisatie die bijdragen aan het realiseren van de doelstellingen van de producentenorganisatie,
      bedoeld in de artikelen 152 en 154 van [verordening 1308/2013](32013R1308).

      2 Wanneer een producentenorganisatie de in het eerste lid bedoelde activiteiten heeft uitbesteed toont de
      producentenorganisatie op grond van artikel 155 van [verordening 1308/2013](32013R1308) door middel van door het
      bestuur en de algemene vergadering geaccordeerde schriftelijke bewijsstukken aan:

      a. welke activiteiten worden uitbesteed;

      b. waarom deze activiteiten niet door de producentenorganisatie zelf worden uitgevoerd;

      c. aan wie deze activiteiten worden uitbesteed;

      d. waarom tot de keuze voor uitbesteding aan de in onderdeel c bedoelde entiteit is gekomen; en

      e. welke afspraken er met de in onderdeel c bedoelde entiteit zijn gemaakt.

      3 De producentenorganisatie toont op grond van artikel 13, tweede lid, van [verordening 2017/891](32791R2017) aan
      de hand van schriftelijke bewijsstukken aan op welke wijze de in het tweede lid, onderdeel c, bedoelde entiteit:

      a. door de producentenorganisatie wordt aangestuurd bij de uitvoering van de aan haar uitbestede activiteiten; en

      b. verantwoording aflegt aan de producentenorganisatie over de uitvoering van de aan haar uitbestede activiteiten.

      4 Wanneer een producentenorganisatie verkoopactiviteiten uitbesteedt, toont zij aan de hand van schriftelijke
      bewijsstukken aan dat zij gedurende de verkoopperiode minimaal één maal per week met de in het tweede lid,
      onderdeel c, bedoelde entiteit overlegt over de te hanteren verkoopvoorwaarden, waaronder de verkoopprijs.

      5 De keuze voor uitbesteding wordt jaarlijks voor 1 juni per geval door het bestuur van de producentenorganisatie
      geëvalueerd en een verslag van deze evaluatie wordt jaarlijks voor 1 juni door de algemene vergadering besproken en
      geaccordeerd. De onderliggende stukken worden door de producentenorganisatie gearchiveerd.

      6 Activiteiten van de producentenorganisatie die niet worden uitbesteed aan haar leden zijn:

      a. verkoop van de producten van haar leden waarvoor de producentenorganisatie is erkend; en

      b. commercieel en budgettair beheer.

      7 Activiteiten van de producentenorganisatie die niet worden uitbesteed zijn:

      a. controle op de naleving van de statuten, met uitzondering van accountantsonderzoek;

      b. boekhouding, facturering en uitbetaling aan de leden; en

      c. kennis van productie van de leden.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel22
  - number: '23'
    text: |-
      Producentenorganisaties nemen in hun statuten op dat zij alle in artikel 152, eerste lid, onderdeel c, onder i, ii
      en iii, van [verordening 1308/2013](32013R1308) genoemde doelstellingen nastreven en tonen aan dat zij uitvoering
      geven aan deze doelstellingen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel23
  - number: '24'
    text: |-
      1 Ongeacht de rechtsvorm van een producentenorganisatie bepalen de statuten van een producentenorganisatie op grond
      van artikel 153, tweede lid, onderdeel c, van [verordening 1308/2013](32013R1308) dat een lid maximaal 20 procent
      van de stemmen van een voltallige algemene vergadering van de producentenorganisatie heeft.

      2 De percentages omvatten tevens volmachten.

      3 Indien een natuurlijk persoon, afgezien van volmachten, bevoegd is om te stemmen voor meerdere leden, geldt het
      maximum percentage van de stemmen voor deze rechtspersonen gezamenlijk.

      4 In het geval van een rechtsvorm met aandeelhouders of in het geval leden aanspraak kunnen maken op delen van het
      kapitaal, bepalen de statuten van een producentenorganisatie dat een natuurlijk persoon of rechtspersoon maximaal
      20 procent van de aandelen van de producentenorganisatie heeft of dat deze gerechtigd is tot maximaal 20% van het
      kapitaal.

      5 De statuten van een unie van producentenorganisaties bepalen:

      a. ongeacht de rechtsvorm van de unie van de producentenorganisatie, dat een lid maximaal 50 procent van de stemmen
      van een voltallige algemene vergadering van de unie van producentenorganisaties heeft;

      b. in geval van een rechtsvorm met aandeelhouders, dat een producentenorganisatie maximaal 50 procent van de
      aandelen van de unie van producentenorganisaties heeft.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel24
  - number: '25'
    text: |-
      1 Een producentenorganisatie kan haar leden slechts toestemming als bedoeld in artikel 12 van [verordening
      2017/891](32791R2017) verlenen indien deze mogelijkheid in haar statuten is opgenomen.

      2 Indien een producentenorganisatie haar leden toestaat gebruik te maken van de uitzondering, bedoeld in artikel 12
      van [verordening 2017/891](32791R2017), stelt de producentenorganisatie voorschriften vast inzake:

      a. de procedure voor verlening van de toestemming;

      b. de algemene voorwaarden voor verlening van de toestemming; en

      c. de rapportageverplichtingen bij het gebruik van de toestemming.

      3 Een producentenorganisatie verleent de toestemming jaarlijks schriftelijk en per individueel geval voordat
      gebruik wordt gemaakt van de uitzondering, bedoeld in artikel 12 van [verordening 2017/891](32791R2017).

      4 Bij de verlening van toestemming maakt een producentenorganisatie een keuze om deze toestemming in volume of
      waarde te verlenen. Deze keuze verplicht het lid om zijn verkopen in dezelfde eenheid te administreren en te
      rapporteren.

      5 Indien een producentenorganisatie aan de toestemming specifieke voorwaarden verbindt, worden deze voorwaarden in
      de toestemming vermeld.

      6 Een producentenorganisatie kan in een situatie, bedoeld in artikel 12, eerste lid, onderdeel c, van [verordening
      2017/891](32791R2017), een lid toestaan om maximaal 40 procent, qua volume of qua waarde, van de productie buiten
      de producentenorganisatie om af te zetten, zoals bedoeld in artikel 12, tweede lid, van [verordening 2017/891]
      (32791R2017), indien:

      a. dat lid producten teelt onder licentie van een andere producentenorganisatie;

      b. de verkooprechten met betrekking tot die producten exclusief bij die andere producentenorganisatie liggen; en

      c. de producten waarop de toestemming betrekking heeft uitsluitend via die andere producentenorganisatie worden
      afgezet.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel25
  - number: '26'
    text: |-
      Een erkenning als bedoeld in artikel 154, eerste lid, van [verordening 1308/2013](32013R1308) wordt verleend
      indien de aanvrager kan aantonen dat hij voldoet aan de op grond van de artikelen 152, 153, 154, 155 en 160 van
      [verordening 1308/2013](32013R1308) en [titel 1][ref1] van deze afdeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0041140
        hoofdstuk: '1'
  - number: '27'
    text: |-
      1 Een verzoek om erkenning omvat ter uitvoering van artikel 154, vierde lid, van [verordening 1308/2013]
      (32013R1308) de volgende stukken:

      a. de oprichtingsakte en statuten;

      b. het huishoudelijk reglement;

      c. een uittreksel uit het handelsregister van de Kamer van Koophandel;

      d. notulen van de oprichtingsvergadering;

      e. het meerjarenplan;

      f. de bestuursnotitie omtrent de afzet en aanbodbundeling;

      g. de bestuursnotitie omtrent de uitbesteding van activiteiten;

      h. de ledenlijst;

      i. indien aanwezig de jaarrekeningen van de producentenorganisatie over de afgelopen drie boekjaren;

      j. de beschrijving van de administratieve organisatie en interne beheersing, bedoeld in [artikel 17][ref1];

      k. de beschrijving van de samenstelling van het bestuur;

      l. de procuratieregeling;

      m. het autorisatieschema;

      n. een organogram;

      o. de bevoegdhedenmatrix en parafenlijst;

      p. een beschrijving van de ondernemingsstructuur en ondernemingen waarin één of meer producentenorganisaties
      of unies van producentenorganisaties aandelen of maatschappelijk kapitaal bezitten en die bijdraagt tot de
      verwezenlijking van de doelstellingen van die organisaties of unies;

      q. een beschrijving van de goederenlogistiek; en

      r. een opgave van de waarde van de afzetbare productie.

      2 Op de onder sub r bedoelde opgave zijn de [artikelen 37 tot en met 43][ref2] van overeenkomstige toepassing.

      3 De referentieperiode voor het bepalen van de waarde van de afzetbare productie is het kalenderjaar twee jaar vóór
      het jaar van de erkenningsaanvraag.

      4 Indien dit nodig is voor de beoordeling van het verzoek om erkenning, bedoeld in artikel 154, vierde lid,
      van [verordening 1308/2013](32013R1308) kan de minister de producentenorganisatie verzoeken om aanvullende
      schriftelijke bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel37
