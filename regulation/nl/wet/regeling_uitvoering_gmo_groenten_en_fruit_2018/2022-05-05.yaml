  - number: '7'
    text: |-
      1 Het lidmaatschap van een producentenorganisatie duurt minimaal één jaar en treedt in werking op een door het
      bestuur van de producentenorganisatie te bepalen tijdstip.

      2 Aspirantleden verzoeken de producentenorganisatie schriftelijk om lidmaatschap en verklaren in dit verzoek:

      a. de statuten van de producentenorganisatie na te leven;

      b. niet bij een andere erkende producentenorganisatie lid te zijn voor de producten waarvoor de
      producentenorganisatie is erkend; en

      c. geen product waarvoor de producentenorganisatie is erkend buiten de producentenorganisatie om te zullen
      afzetten, behoudens met toestemming van de producentenorganisatie als bedoeld in artikel 12 van [verordening
      2017/891](32791R2017).

      3 Een producentenorganisatie bepaalt in haar statuten dat het lidmaatschap kan worden opgezegd met ingang van
      1 januari. De door de producentenorganisatie vast te stellen uiterste opzegdatum ligt tussen 30 juni en 2 oktober
      van het voorafgaande jaar.

      4 De bevestiging van lidmaatschap en opzegging van lidmaatschap, alsmede de datum waarop het lidmaatschap en de
      opzegging in werking treedt, wordt door de producentenorganisatie schriftelijk aan het lid meegedeeld.

      5 Bepalingen omtrent de minimumduur, opzeggingsdata en inwerkingtreding van opzegging van het lidmaatschap zijn
      niet van toepassing in geval van:

      a. overlijden van het lid;

      b. faillissement van het lid;

      c. toepassing van het sanctiereglement van de producentenorganisatie inzake royement; of

      d. indien dit redelijkerwijs niet van het lid of coöperatie gevergd kan worden.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel7
  - number: '8'
    text: |-
      Een producentenorganisatie kan niet-producerende leden hebben, indien in de statuten van de producentenorganisatie
      wordt bepaald dat deze leden:

      a. reeds aangesloten waren bij de producentenorganisatie vóór zij gedurende meer dan één productieseizoen geen
      producten meer teelden waarvoor de producentenorganisatie is erkend;

      b. opgenomen worden in een afzonderlijke ledenadministratie; en

      c. niet mogen deelnemen aan de stemming van de algemene vergadering over besluiten inzake het actiefonds of het
      operationeel programma van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel8
  - number: '9'
    text: |-
      1 Producentenorganisaties tonen aan dat zij voldoen aan artikel 152, eerste lid, onderdeel b, van [verordening
      1308/2013](32013R1308) aan de hand van:

      a. de oprichtingsakte van de producentenorganisatie; en

      b. de notulen van de eerste vergadering of oprichtingsvergadering van de producentenorganisatie.

      2 Op producentenorganisaties die zijn erkend voor 1 januari 2008 is het eerste lid niet van toepassing. Deze
      producentenorganisaties worden geacht te voldoen aan het vereiste van artikel 152, eerste lid, onderdeel b, van
      [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel9
  - number: '10'
    text: |-
      Een lid van het bestuur of de Raad van Commissarissen van een producentenorganisatie of een functionaris van een
      producentenorganisatie die betrokken is bij het verkoopbeleid, is geen afnemer of functionaris van een afnemer
      van producten waarvoor de producentenorganisatie is erkend ingevolge artikel 152, eerste lid, van [verordening
      1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel10
  - number: '11'
    text: |-
      1 Producentenorganisaties verbieden hun leden in hun statuten op grond van artikel 160 van [verordening 1308/2013]
      (32013R1308) om activiteiten te ontplooien die het vermoeden doen ontstaan dat de verkoop van het product waarvoor
      zij bij de producentenorganisatie zijn aangesloten niet uitsluitend via de producentenorganisatie verloopt.

      2 Producentenorganisaties nemen het in het eerste lid bedoelde verbod uiterlijk op 1 januari 2019 op in hun
      statuten.

      3 Het eerste lid is niet van toepassing op activiteiten met betrekking tot de verkoop op grond van artikel 12 van
      [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel11
  - number: '12'
    text: |-
      Producentenorganisaties bepalen op grond van artikel 152, eerste lid, onderdeel c, onder ii, van [verordening
      1308/2013](32013R1308) op welk moment leden hun product aan de producentenorganisatie ter verkoop aanbieden.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel12
  - number: '13'
    text: |-
      Producentenorganisaties verplichten in hun statuten hun leden op grond van artikel 152, eerste lid, onderdeel c,
      onder ii, van [verordening 1308/2013](32013R1308) om aan de producentenorganisatie:

      a. melding te doen van eigendomsbelangen in ondernemingen die van de producentenorganisatie door het lid
      geproduceerde producten kopen, indien de producentenorganisatie voor deze producten is erkend; en

      b. aan de hand van schriftelijke bewijsstukken aan te tonen dat binnen de in onderdeel a bedoelde ondernemingen is
      verzekerd dat het lid:

      1°. geen invloed kan uitoefenen op het vaststellen van de verkoopvoorwaarden door de ondernemingen van de producten
      waarvoor het lid bij de producentenorganisatie is aangesloten; en

      2°. geen invloed kan uitoefenen op besluiten aangaande commerciële relaties en het prijsbeleid van de
      ondernemingen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel13
  - number: '14'
    text: |-
      1 Producentenorganisaties stellen in hun statuten voorschriften vast voor de controle op de naleving van hun
      statuten door hun leden.

      2 De in het eerste lid bedoelde voorschriften bevatten ten aanzien van de controle op de naleving door hun leden
      van artikel 160 van [verordening 1308/2013](32013R1308) voor de door de producentenorganisatie gedurende het jaar
      uit te voeren controles tenminste:

      a. een systematische vergelijking per producent van areaalenquêtes en aanvoerprognoses met de daadwerkelijk aan de
      producentenorganisatie geleverde hoeveelheden gedurende het kalenderjaar;

      b. een verificatie van de door de leden verstrekte areaalenquêtes en aanvoerprognoses door middel van bezoek door
      de producentenorganisatie aan een derde van het ledenbestand gedurende het jaar waarbij ieder lid ten minste elke
      drie jaar wordt bezocht;

      c. een periodieke vergelijking van de aanvoerprognoses en de daadwerkelijke aanvoer met een door de
      producentenorganisatie, op basis van statistische normen of ervaringscijfers, vast te stellen normstelling per
      areaal;

      d. een registratie van de op basis van de onderdelen a tot en met c aangetroffen verschillen en de daarvoor door
      het lid gegeven verklaring; en

      e. een registratie van de door de producentenorganisatie getroffen acties naar aanleiding van op grond van
      onderdeel d onverklaarde verschillen.

      3 De in het eerste lid bedoelde voorschriften bevatten voor de door de producentenorganisatie na afloop van het
      kalenderjaar uit te voeren controles minimaal:

      a. een verplichting voor ieder lid om uiterlijk voor 1 mei na afloop van het kalenderjaar schriftelijk aan de
      producentenorganisatie te verklaren:

      1°. de hoeveelheid of waarde van het product die hij dat jaar geproduceerd heeft;

      2°. de hoeveelheid of waarde van het product die hij dat jaar bij derden heeft ingekocht;

      3°. de hoeveelheid of waarde van het product die hij dat jaar via de producentenorganisatie afgezet heeft;

      4°. de hoeveelheid of waarde van het product die hij dat jaar op grond van artikel 12 van [verordening 2017/891]
      (32791R2017) buiten de producentenorganisatie om verkocht heeft, uitgesplitst per categorie zoals genoemd in
      artikel 12 van [verordening 2017/891](32791R2017);

      5°. dat hij, uitgezonderd de verkoop op grond van artikel 12 van [verordening 2017/891](32791R2017), geen door
      hem geteelde producten waarvoor hij bij de producentenorganisatie is aangesloten buiten de producentenorganisatie
      verkocht heeft; en

      6°. dat hij bij verkoop op grond van artikel 12 van [verordening 2017/891](32791R2017) de daaraan door de
      producentenorganisatie gestelde voorwaarden heeft nageleefd;

      b. een vergelijking van informatie uit de in onderdeel a bedoelde verklaringen met de omzetgegevens van het lid;

      c. een onderzoek door de producentenorganisatie naar de, op basis van de op grond van onderdeel b uitvoerde
      vergelijking, geconstateerde verschillen tussen de eigen verklaringen en de omzetgegevens van het lid;

      d. een verplichting tot het instellen van een accountantsonderzoek naar op grond van onderdeel c onvoldoende
      verklaarde verschillen;

      e. een registratie van de uitkomsten van het in onderdeel d bedoelde accountantsonderzoek; en

      f. een registratie van de opvolging van de uitkomsten van het in onderdeel e bedoelde accountantsonderzoek door de
      producentenorganisatie, waaronder sanctionering van de betreffende leden.

      4 De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om de
      juistheid van in het derde lid, onderdeel a, bedoelde verklaring te laten onderzoeken door een accountant door
      middel van een COS 4400 onderzoek.

      5 Het in het vierde lid bedoelde onderzoek betreft:

      a. de leden die verzuimd hebben voor 1 mei na afloop van het kalenderjaar de in het derde lid, onderdeel a,
      bedoelde eigen verklaring te verstrekken;

      b. de leden waarbij door de producentenorganisatie of door controle-instanties in het jaar voorafgaand aan het
      controlejaar is vastgesteld dat zij artikel 160 van [verordening 1308/2013](32013R1308) niet hebben nageleefd;

      c. de leden waarbij door de producentenorganisatie in het voorafgaande kalenderjaar is vastgesteld dat verschillen
      tussen areaalgegevens en omzetgegevens onvoldoende konden worden verklaard; en

      d. minimaal 2 procent van de leden van de producentenorganisatie, met een minimum van één lid, die niet reeds op
      grond van onderdelen a tot en met c deel uit maken van het onderzoek.

      6 Indien de accountant bij meerdere leden in deze deelwaarneming afwijkende bevindingen constateert treft de
      producentenorganisatie afhankelijk van de aard van de afwijkingen passende maatregelen.

      7 De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om jaarlijks
      voor 1 juni de betrouwbaarheid van het geheel aan maatregelen dat de producentenorganisatie neemt voor controle op
      de naleving door hun leden te evalueren. Een verslag van de evaluatie wordt door de algemene vergadering besproken
      en geaccordeerd. De onderliggende stukken worden door de producentenorganisatie gearchiveerd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel14
  - number: '15'
    text: |-
      1 Producentenorganisaties stellen in hun statuten voorschriften vast voor sanctionering van niet naleving van hun
      statuten door hun leden die, behoudens gevallen van overmacht, tenminste bepalen dat:

      a. bij een eerste overtreding van de statutaire verplichtingen ter uitvoering van artikel 160 van [verordening
      1308/2013](32013R1308), artikel 12 van [verordening 2017/891](32791R2017) en de [artikelen 11][ref1], [12][ref2],
      [13][ref3], en [14][ref4] van deze regeling het lid minimaal een schriftelijke waarschuwing krijgt;

      b. bij een tweede soortgelijke overtreding begaan binnen vijf jaar na het begaan van de eerste overtreding bedoeld
      in onderdeel a, minimaal een boete aan het lid wordt opgelegd en deze boete daadwerkelijk wordt geïncasseerd; en

      c. leden bij alle soortgelijke vervolgovertredingen begaan binnen vijf jaar na het begaan van de eerste overtreding
      bedoeld in onderdeel a, worden geroyeerd.

      2 Producentenorganisaties administreren alle geconstateerde overtredingen van hun statutaire verplichtingen en aan
      hun leden opgelegde sancties.


