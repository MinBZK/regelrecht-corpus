  - number: 213a
    text: |-
      1 Ter uitvoering van artikel 1, eerste lid, van [verordening 2020/884](32784R2020) mogen in afwijking van
      [artikel 24][ref1] om redenen die verband houden met de COVID-19-pandemie de leden in 2020, onder voorwaarde dat
      zij geen machtsmisbruik plegen, beschikken over:

      a. meer dan 50 procent van de stemmen van een voltallige algemene vergadering; of

      b. meer dan 50 procent van de aandelen of het kapitaal.

      2 Ter uitvoering van artikel 1, tweede lid, van [verordening 2020/884](32784R2020) mag een producentenorganisatie
      in afwijking van [artikel 36][ref2], indien sprake is van meer dan 35% daling van de waarde van de afgezette
      productie in 2020 als gevolg van de COVID-19 pandemie, voor het uitvoeringsjaar 2022 het jaar 2019 als
      referentieperiode hanteren.

      3 Ter uitvoering van artikel 1, vijfde lid, van [verordening 2020/884](32784R2020) is in afwijking van
      [artikel 56, eerste lid, onderdeel d][ref3], in 2020 een verzoek tot wijziging tot het verlagen van het jaarbedrag
      van het actiefonds met meer dan 80 procent toegestaan.

      4 Ter uitvoering van artikel 1 van [verordening 2020/600](32500R2020) overlegt de producentenorganisatie in
      afwijking van [artikel 190, derde lid][ref4], de controleverklaring, alsmede een verslag van de verrichte
      werkzaamheden, uiterlijk op 31 augustus 2020 voor de subsidieaanvraag voor 2019 en op 31 augustus 2021 voor de
      subsidieaanvraag voor 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0041140#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0041140#Artikel190
