  - number: '129'
    text: |-
      1 De producentenorganisatie overlegt aan de minister, met gebruikmaking van een door de minister beschikbaar
      gesteld middel, voor de investeringen, bedoeld in [artikel 128][ref1], uiterlijk bij de indiening van de
      subsidieaanvraag per investering:

      a. een opgave van de verbetering van de waterkwaliteit; of

      b. de gerealiseerde waterbesparing.

      2 De opgave, bedoeld in het eerste lid, onderdeel a, vindt plaats aan de hand van berekeningen en metingen op
      basis van een vergelijking tussen het moment voor de ingebruikname van de investering en het moment één jaar na
      ingebruikname van de investering.

      3 In geval van omgekeerde osmose overlegt de producentenorganisatie aan de minister bij de indiening van de
      subsidieaanvraag een opgave van de reductie van natrium en chloor in mmol/l of mg/l, op basis van een vergelijking
      tussen metingen uitgevoerd voor ingebruikname van de investering en één jaar na ingebruikname van de investering.

      4 Het vaststellen van veranderingen in het waterverbruik, gemeten in m³, als gevolg van een investering als bedoeld
      in [artikel 128, eerste lid][ref2], vindt plaats op basis van een vergelijking tussen:

      a. het waterverbruik van het jaar voorafgaand aan het jaar van inbedrijfstelling van de investering; en

      b. het waterverbruik gedurende het jaar:

      1°. van ingebruikname van de investering; of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel128
