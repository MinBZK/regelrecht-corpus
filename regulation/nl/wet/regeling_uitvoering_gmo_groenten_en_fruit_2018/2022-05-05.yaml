        bwb_id: BWBR0041140
        artikel: '194'
  - number: '196'
    text: |-
      1 Indien een producentenorganisatie in enig jaar gebruik maakt van voorschotten, kan deze producentenorganisatie
      voor het betreffende jaar geen gebruik maken van gedeeltelijke betalingen.

      2 Indien een producentenorganisatie in enig jaar gebruik maakt van gedeeltelijke betalingen, kan deze
      producentenorganisatie voor het betreffende jaar geen gebruik maken van voorschotten.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel196
  - number: '197'
    text: |-
      Ter uitvoering van artikel 54, onderdeel b, van [verordening 2017/891](32791R2017) overleggen
      producentenorganisaties en unies van producentenorganisaties jaarlijks, uiterlijk op 1 september, aan de minister
      de informatie, bedoeld in bijlage V van [verordening 2017/891](32791R2017), met gebruikmaking van een door de
      minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel197
  - number: '198'
    text: |-
      Het jaarverslag over de uitvoering van operationele programma’s dat samen met de subsidieaanvraag wordt ingediend
      ingevolge artikel 21, tweede lid, van [verordening 2017/892](32792R2017), bevat ten aanzien van de tijdens het
      vorig jaar uitgevoerde operationele programma:

      a. een beschrijving van de geplande en daadwerkelijke uitgevoerde werkzaamheden voor het betreffende jaar per
      activiteit;

      b. een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde werkzaamheden;

      c. een beschrijving per activiteit van de geplande en daadwerkelijk bereikte realisatie voor het betreffende
      jaar van de in het goedgekeurde operationele programma vastgestelde meetbare streefdoelen als bedoeld in
      [artikel 51, eerste lid, onderdeel c][ref1];

      d. een motivering van afwijkingen tussen geplande en de daadwerkelijk bereikte realisatie;

      e. een beschrijving van de bijdrage die de uitvoering van het operationeel programma in het betreffende jaar
      geleverd heeft aan de realisatie van het operationeel programma, met name de strategische doelen, bedoeld in
      [artikel 47, eerste en tweede lid][ref2];

      f. een beschrijving van de, als gevolg van de afwijkingen noodzakelijke aanpassingen van de meetbare streefdoelen,
      bedoeld in [artikel 51, eerste lid, onderdeel c][ref3];

      g. een beschrijving en onderbouwing van de geplande en daadwerkelijke bijdrage die de gerealiseerde werkzaamheden
      in het betreffende jaar per project hebben geleverd aan de realisatie van de gekwantificeerde streefcijfers,
      bedoeld in [artikel 47, derde lid][ref4]; en

      h. een motivering van afwijkingen tussen de geplande en daadwerkelijk gerealiseerde bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0041140#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0041140#Artikel47
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel198
