    text: |-
      1 De beschrijving van de doelen, bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening 2017/892]
      (32792R2017), omvat de keuze voor de strategische doelen, bedoeld in [artikel 47][ref1], die met het operationeel
      programma worden nagestreefd en aan de hand van de SWOT analyse, bedoeld in [artikel 49][ref2], worden onderbouwd.

      2 In deze beschrijving wordt eveneens opgenomen hoe deze strategische doelen passen binnen de in [artikel 48][ref3]
      bedoelde visie.


