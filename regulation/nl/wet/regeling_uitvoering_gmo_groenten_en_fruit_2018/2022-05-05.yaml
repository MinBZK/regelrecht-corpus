  - number: '172'
    text: |-
      De minister stelt de door de lidstaten vast te stellen maximale subsidiebedragen, bedoeld in artikel 45, eerste
      lid, tweede alinea, van [verordening 2017/891](32791R2017) vast.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel172
  - number: '173'
    text: |-
      1 Als erkende liefdadigheidsinstellingen of -organisaties als bedoeld in artikel 34, vierde lid,
      onderdeel a, van [verordening 1308/2013](32013R1308) worden aangewezen voedselbanken die op grond van
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] zijn aangemerkt als algemeen nut
      beogende instelling.

      2 Als personen die op grond van de nationale wetgeving recht hebben op overheidsbijstand, met name omdat zij over
      onvoldoende middelen beschikken om in hun onderhoud te voorzien als bedoeld in artikel 34, vierde lid, onderdeel a,
      van [verordening 1308/2013](32013R1308) worden aangemerkt:

      a. personen die op grond van [artikel 11, eerste lid, van de Wet werk en bijstand][ref2] recht hebben op een
      overheidsuitkering; en

      b. andere personen die ten genoegen van de voedselbanken kunnen aantonen niet over voldoende middelen te beschikken
      om in hun onderhoud te voorzien.

      3 Het overnamecertificaat, bedoeld in artikel 47, eerste lid, onderdeel d, van [verordening 2017/891](32791R2017)
      wordt getekend door:

      a. het regionale distributiecentrum, in het geval de uit de markt genomen producten geleverd worden aan een
      regionale distributiecentrum voor voedselbanken; en

      b. de voedselbank, in het geval de uit de markt genomen producten geleverd worden aan de voedselbank die de uit de
      markt genomen producten daadwerkelijk uitreikt aan de eindontvangers.

      4 Indien een voedselbank van haar aanvragers een symbolische bijdrage vraagt voor de voedselpakketten vraagt de
      voedselbank hiervoor vooraf toestemming aan onze minister en houdt zij hiervoor een financiële boekhouding bij.

      5 Indien een voedselbank de op grond van deze regeling ontvangen producten verwerkt of laat verwerken toont de
      voedselbank aan dat de verwerkte producten volledig ten goede komen aan de personen bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '11'
  - number: '174'
    text: |-
      1 Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers als bedoeld in
      [artikel 170, derde lid][ref1], en transporteurs van uit de markt genomen producten met gebruikmaking van een door
      de minister beschikbaar gesteld model, waarin de afnemers en transporteurs worden verplicht:

      a. tot naleving van de voorwaarden uit artikel 47 van [verordening 2017/891](32791R2017), inclusief het voeren van
      een aparte voorraadboekhouding voor de betrokken concrete acties;

      b. bij ontvangst van de uit de markt genomen producten de daarbij behorende door de minister ter beschikking
      gestelde vrachtbrief te ondertekenen;

      c. de vrachtbrief en de overeenkomst met de producentenorganisatie gedurende tenminste 7 kalenderjaren, volgend op
      het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren; en

      d. tot vervoer van de uit de markt genomen producten voor bestemmingen als bedoeld in
      [artikel 170, derde lid, onderdelen a en b][ref2], zonder dat verlies uit het vervoermiddel van producten of delen
      ervan plaatsvindt.

      2 In aanvulling op het eerste lid worden ontvangers van uit de markt genomen producten als bedoeld in
      [artikel 170, derde lid, onderdelen a en b][ref3], verplicht om de uit de markt genomen producten:

      a. een niet voor menselijke consumptie geschikte bestemming te geven die:

      1°. de normale afzet van de betrokken productie niet in de weg staat; en

      2°. geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 46, eerste lid,
      van [verordening 2017/891](32791R2017); en

      b. bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.

      3 Indien voor gratis verstrekking, als bedoeld in [artikel 170, derde lid, onderdeel c][ref4], bestemd product door
      de verwerkende industrie wordt verwerkt toont de afnemer ten genoegen van de minister aan de hand van bewijsstukken
      aan dat het product niet opnieuw in het commerciële handelscircuit terecht komt.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel170
