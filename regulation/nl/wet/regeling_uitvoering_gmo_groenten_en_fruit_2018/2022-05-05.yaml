  - number: '57'
    text: |-
      Wijzigingen van de begroting voor uitgavenposten voor activiteiten opgenomen in een goedgekeurd operationeel
      programma met minder dan 20 procent en het vervallen van uitgavenposten of activiteiten opgenomen in een
      goedgekeurd operationeel programma worden door de producentenorganisatie gemotiveerd gemeld gelijktijdig met de
      aanvragen zoals bedoeld in [artikel 192][ref1] of [194][ref2] of bij de steunaanvraag, bedoeld in artikel 9, eerste
      lid, van [verordening 2017/892](32792R2017), voor het betreffende uitvoeringsjaar met gebruikmaking van een door de
      minister beschikbaar gesteld model.


