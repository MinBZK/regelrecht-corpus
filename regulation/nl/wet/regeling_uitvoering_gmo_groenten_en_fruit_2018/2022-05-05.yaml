      producentenorganisatie en haar leden, inclusief personeelskosten, die noodzakelijk zijn voor de aanschaf van
      systemen voor aanvoerprognose en areaalenquêtes zijn subsidiabel indien de systemen voor aanvoerprognose en
      areaalenquêtes van de producentenorganisatie en haar leden met elkaar kunnen communiceren.

      2 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
