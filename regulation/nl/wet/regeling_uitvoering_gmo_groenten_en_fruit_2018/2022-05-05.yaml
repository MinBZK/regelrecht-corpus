    text: |-
      De activiteiten die zijn opgenomen in [titel 2][ref1] tot en met [4][ref2] kunnen worden ingezet
      in het kader van projecten ter realisatie van een ieder van de strategische doelen bedoeld in
      [artikel 47, eerste en tweede lid][ref3].


