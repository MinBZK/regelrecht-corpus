  - number: '51'
    text: |-
      1 De informatie over de voorgestelde maatregelen, bedoeld in artikel 4, eerste lid, onderdeel c, van [verordening
      2017/892](32792R2017), bevat per strategisch doel de volgende onderdelen:

      a. de meetbare streefdoelen die de producentenorganisatie op basis van de algemene streefdoelen en gekwantificeerde
      streefcijfers uit [artikel 47, derde lid][ref1], heeft bepaald en die de producentenorganisatie in het kader van
      het strategisch doel beoogt te realiseren;

      b. een onderbouwing van de gekozen meetbare streefdoelen van de producentenorganisatie aan de hand van de SWOT
      analyse, bedoeld in [artikel 49][ref2];

      c. per meetbaar streefdoel van de producentenorganisatie:

      1°. een meetbare en controleerbare nulsituatie;

      2°. de percentages of cijfers, voor zover mogelijk uitgedrukt in dezelfde eenheid als de gekwantificeerde
      streefcijfers, die de producentenorganisatie aan het eind van de looptijd van het operationele programma nastreeft;
      en

      3°. alle projecten waarmee de realisatie van het streefdoel van de producentenorganisatie wordt nagestreefd;

      d. per project:

      1°. een omschrijving van het project;

      2°. een omschrijving en onderbouwing van de verwachte bijdrage, absoluut of relatief, van het project aan de
      realisatie van de meetbare streefdoelen van de producentenorganisatie,

      3°. een onderbouwing van het vernieuwende karakter van het project;

      4°. de subsidiabele activiteiten die in het kader van het project worden ingezet om de meetbare streefdoelen van de
      producentenorganisatie te realiseren; en

      5°. de looptijd;

      e. per subsidiabele activiteit:

      1°. een omschrijving van de activiteit;

      2°. een onderbouwing van de subsidiariteit van de activiteit en de bijbehorende uitgavenposten;

      3°. per uitvoeringsjaar van het operationeel programma een planning van werkzaamheden voor de activiteit; en

      4°. per uitvoeringsjaar van het operationeel programma een begroting voor de activiteit onderbouwd aan de hand van:

      i. minimaal drie onderling vergelijkbare kostenbegrotingen per uitgavenpost voor uitgavenposten die betrekking
      hebben op het eerste jaar van het operationeel programma; en

      ii. minimaal één kostenbegroting per uitgavenpost voor uitgavenposten die betrekking hebben op de volgende jaren
      van het operationeel programma.

      2 De meetbare streefdoelen dragen bij aan de algemene nationale streefdoelen en, indien van toepassing, sluiten
      geheel of gedeeltelijk aan bij de nationaal gekwantificeerde streefcijfers.

      3 Indien de meetbare streefdoelen, bedoeld in het eerste lid, moeten worden aangepast dient de
      producentenorganisatie of unie van producentenorganisaties voor het volgende jaar een verzoek tot wijziging van het
      operationeel programma als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) in.

      4 In afwijking van het eerste lid, onderdeel c, onder 3°, worden uitgaven voor:

      a. standaard activiteiten in het kader van kwaliteitskeuring van producten van leden en begeleiding en audits van
      kwaliteitscontrolesystemen als bedoeld in [artikel 122a][ref3]; en

      b. standaard activiteiten voor teeltbegeleiding als bedoeld in [artikel 163a][ref4];

      niet ingediend in het kader van een project. De totale gezamenlijke uitgaven bedragen maximaal 10% van het
      operationele programma per jaar.

      5 In afwijking van het eerste lid, onderdeel d, onder 3°, hoeven niet te worden ingediend in het kader van een
      project:

      a. maatregelen als bedoeld in artikel 2, onderdeel f, onder vi, van [verordening 2017/891](32791R2017);

      b. uitgaven als bedoeld in [artikel 185a][ref5].

      6 De looptijd van een project als bedoeld in het eerste lid, onderdeel d, onder 5°, is ten hoogste vijf jaar.
      Indien de looptijd van het project aan het einde van het operationeel programma nog niet is afgelopen kan het
      project in een volgend operationeel programma worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel47
