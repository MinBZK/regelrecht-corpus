  - number: '72'
    text: |-
      1 Investeringen in elementaire voorzieningen als afwateringssystemen, riolering, aansluiting op waterleiding en
      aansluiting op systemen voor datacommunicatie, die worden gezien als onmisbare elementen op het bedrijf van een
      lid, producentenorganisatie of een dochteronderneming zijn subsidiabel.

      2 Uitgaven voor het installeren en monteren van duurzame productiemiddelen en de bijkomende kosten van installatie
      en montage, waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden geactiveerd, zijn als
      onderdeel van het duurzame productiemiddel subsidiabel.

      3 In afwijking van het tweede lid zijn uitgaven voor het installeren en monteren van duurzame productiemiddelen
      niet subsidiabel voor zover het gaat om uitgaven voor:

      a. service en onderhoud van duurzame productiemiddelen; of

      b. construction all risk verzekeringen.

      4 Uitgaven voor het demonteren van duurzame productiemiddelen zijn subsidiabel wanneer dit tot doel heeft het
      productiemiddel te verhuizen, reviseren, transporteren en opnieuw monteren.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel72
  - number: '73'
    text: |-
      1 De producentenorganisatie neemt in de subsidieaanvraag alleen uitgaven op voor:

      a. nieuwbouw of verbouw van gebouwen die eigendom zijn van de producentenorganisatie of een dochteronderneming;

      b. ruimtes die zijn aangemerkt als subsidiabel in [bijlage II][ref1]; en

      c. elementen die zijn aangemerkt als subsidiabel in [bijlage III][ref2].

      2 Uitgaven als bedoeld in deel 2 van [bijlage II][ref3] en kolom 2 van [bijlage III][ref4] zijn niet subsidiabel.

      3 De producentenorganisatie onderbouwt bij de indiening van het operationeel programma de subsidiabele uitgaven,
      bedoeld in het eerste lid, aan de hand van:

      a. bouwtekeningen, die aangegeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreft;

      b. offertes van de aanneem- of bouwsom; en

      c. een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en
      niet subsidiabele oppervlakten en elementen en bijbehorende uitgaven.

      4 De producentenorganisatie onderbouwt bij de indiening van de subsidieaanvraag de subsidiabele uitgaven aan de
      hand van:

      a. bouwtekeningen die aangeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreffen;

      b. facturen op naam van de producentenorganisatie of dochteronderneming met vermelding van de aanneem- of bouwsom;
      en

      c. een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en
      niet subsidiabele oppervlakten en elementen en bijbehorende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0041140
      [ref2]: https://wetten.overheid.nl/BWBR0041140
