      1 Uitgaven van de producentenorganisatie voor het groen oogsten en niet oogsten van producten als bedoeld in
      artikel 33, derde lid, onderdeel g, van [verordening 1308/2013](32013R1308) zijn subsidiabel.

      2 Als producten bedoeld in artikel 33, derde lid, onderdeel g, van [verordening 1308/2013](32013R1308) worden
      aangewezen:

      a. tomaten met GN code 0702 00 00;

      b. niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;

      c. bloemkool en broccoli met GN code 0704 10 00;

      d. komkommers met GN code 0707 00 05;

      e. appelen met GN code 0808 10;

      f. peren met GN code 0808 30; en

      g. aardbeien met GN code 0810 10.

      3 Uitgaven voor het groen oogsten en niet oogsten van percelen beplant met appelbomen of perenbomen jonger dan twee
      jaar, zijn niet subsidiabel.
