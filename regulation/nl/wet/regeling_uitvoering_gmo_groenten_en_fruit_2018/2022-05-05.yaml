  - number: '200'
    text: |-
      [Paragraaf 5 van de Regeling producenten- en brancheorganisaties][ref1] is van overeenkomstige toepassing op
      producentenorganisaties en unies van producentenorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0035634#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0035634
        paragraaf: '5'
  - number: '201'
    text: |-
      1 Een producentenorganisatie of unie van producentenorganisaties leeft de voorschriften, bedoeld in de artikelen
      148, eerste, derde en vierde lid, en 165 van [verordening 1308/2013](32013R1308), na.

      2 In geval van niet-naleving van een voorschrift kan de minister:

      a. de op grond van artikel 164, eerste lid, van [verordening 1308/2013](32013R1308) vastgestelde
      verbindendverklaring van een voorschrift intrekken;

      b. de op grond van artikel 165 van [verordening 1308/2013](32013R1308), vastgestelde verplichting tot het afdragen
      van een financiële bijdrage intrekken.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel201
  - number: '202'
    text: |-
      Een verzoek als bedoeld in de artikelen 164, eerste lid of 165 van [verordening 1308/2013](32013R1308), of een
      zienswijze als bedoeld in artikel 165, van [verordening 1308/2013](32013R1308), wordt ingediend met gebruikmaking
      van een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel202
  - number: '204'
    text: Dit deel strekt ter uitvoering van artikel 76 van [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel204
  - number: '205'
    text: |-
      1 Wanneer een onjuiste opgave leidt tot een hogere subsidie wordt de subsidie, behoudens overmacht of kennelijke
      vergissing, lager vastgesteld tot het bedrag waarvoor de producentenorganisatie bij een juiste opgave in
      aanmerking zou zijn gekomen, onder extra aftrek van 20 procent van het verschil tussen het opgegeven bedrag en het
      vastgestelde bedrag, indien blijkt dat:

      a. de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de waarde van de afgezette
      productie; of

      b. de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de bijdragen aan het actiefonds.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel205
  - number: '206'
    text: |-
      1 Indien blijkt dat het operationeel programma of enig onderdeel daarvan, in strijd met de voorwaarden waaronder
      het is goedgekeurd of in strijd met de op grond van [verordening 1308/2013](32013R1308) gestelde voorschriften is
      uitgevoerd, wordt, behoudens overmacht, de subsidie verlaagd met een percentage van 20 procent, berekend over:

      a. de totale waarde van de onjuist uitgevoerde onderdelen van het operationeel programma; of

      b. de begrote waarde van de niet uitgevoerde onderdelen van het operationeel programma.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel206
  - number: '207'
    text: |-
      1 Indien blijkt dat de producentenorganisatie of één of meer van haar leden voor een uit het actiefonds
      gefinancierde actie overlappende nationale of communautaire financiering heeft ontvangen, wordt de aan de
      betreffende actie gerelateerde subsidie lager vastgesteld door:

      a. ontneming van het gehele voordeel als gevolg van de overlappende financiering; en

      b. een extra verlaging van 50 procent op het bedrag dat volgt uit de toepassing van onderdeel a.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel207
  - number: '208'
    text: |-
      1 Indien aan de administratie van de producentenorganisatie, haar leden of van ondernemingen aan wie de
      producentenorganisatie activiteiten heeft uitbesteed op grond van [verordening 1308/2013](32013R1308) eisen zijn
      gesteld en blijkt dat aan deze eisen niet is voldaan, wordt de aan de desbetreffende actie gerelateerde subsidie,
      behoudens overmacht, verlaagd met 20 procent.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel208
  - number: '209'
    text: |-
      1 Indien informatie niet aan de minister wordt verstrekt overeenkomstig op grond van [verordening 1308/2013]
      (32013R1308) of deze regeling gestelde eisen en dit niet binnen een door de minister gestelde redelijke termijn
      wordt hersteld, wordt de subsidie voor elke niet-naleving 2 procent lager vastgesteld.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel209
  - number: '210'
    text: |-
      1 De minister kan besluiten tot het geven van een schriftelijke aanwijzing aan een producentenorganisatie. De
      schriftelijke aanwijzing heeft betrekking op de uitvoering van deze regeling.

      2 De subsidie wordt tot en met 20 procent lager vastgesteld indien blijkt dat de producentenorganisatie binnen een
      redelijke termijn met betrekking tot de uitvoering van deze regeling:

      a. schriftelijke aanwijzingen van de minister niet binnen een redelijke termijn opvolgt; of

      b. aan verzoeken van de minister herhaaldelijk geen gevolg heeft gegeven.

      3 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het tweede lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel210
  - number: '211'
    text: |-
      Indien uit een onderzoek als bedoeld in artikel 60, eerste lid, van [verordening 2017/891](32791R2017) blijkt dat
      sprake is van fraude, worden de kosten van dit onderzoek ten laste van de producentenorganisaties gebracht.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel211
  - number: '212'
    text: |-
      Bij samenloop van diverse subsidieverlagende factoren als bedoeld in de [artikelen 205 tot en met 209][ref1]
      bedraagt de totale subsidieverlaging, indien er geen sprake is van opzet of grove nalatigheid, niet meer dan 50
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel205
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '205'
  - number: '213'
    text: |-
      1 Duurzame productiemiddelen die zijn aangeschaft in een operationeel programma dat is uitgevoerd voor 1 januari
      2019 en waarvan de instandhoudingstermijn nog niet is beëindigd, worden beheerst door de bepalingen van
      [deel 4][ref1] en [artikel 312a van de Regeling uitvoering GMO groenten en fruit][ref2] zoals die golden op 14 juli
      2017.

      2 Op milieuacties die zijn gedaan in het kader van een programma dat is goedgekeurd voor
      1 januari 2017 en die nog niet zijn beëindigd, blijven de bepalingen van [Deel 4][ref3] en
      [artikel 312a van de Regeling uitvoering GMO groenten en fruit][ref4] zoals die golden op 14 juli 2017 van
      toepassing.

      3 Uitgaven voor investeringen in duurzame productiemiddelen die in het operationeel programma direct voorafgaande
      aan een operationeel programma dat aanvangt op 1 januari 2019 zijn opgenomen en in gelijke tranches ten laste van
      het actiefonds werden gebracht, kunnen worden opgenomen in het programma dat aanvangt op 1 januari 2019 indien de
      eerste tranche van deze uitgaven in de subsidieaanvraag wordt opgenomen.

      4 De tranches, bedoeld in het derde lid, hoeven niet te worden ingediend in het kader van een project.


      [ref1]: https://wetten.overheid.nl/BWBR0034320
