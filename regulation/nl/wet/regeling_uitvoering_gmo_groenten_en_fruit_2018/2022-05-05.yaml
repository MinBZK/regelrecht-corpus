        afdeling: '4'
  - number: '160'
    text: |-
      Bij de indiening van de subsidieaanvraag verstrekt de producentenorganisatie in geval van uitgaven voor advies en
      begeleiding ten behoeve van de teelttechniek, bedoeld in [artikel 158, onderdeel e][ref1], en ten behoeve van de
      teelt, bedoeld in de [artikelen 161 tot en met 163a][ref2] informatie daarover aan de minister per lid per gewas,
      met gebruikmaking van een door de minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel161
