  - number: '29'
    text: |-
      1 Een erkenning kan op verzoek van de producentenorganisatie worden gewijzigd of beëindigd met ingang van
      1 januari.

      2 De producentenorganisatie dient een verzoek tot wijziging van de erkenning in uiterlijk op 1 september
      voorafgaand aan het jaar met ingang waarvan wijziging van de erkenning wordt gevraagd.

      3 De producentenorganisatie dient een verzoek tot beëindiging van de erkenning in uiterlijk op 1 december
      voorafgaand aan het jaar met ingang waarvan beëindiging van de erkenning wordt gevraagd.

      4 Een lijst met de namen en contactgegevens van alle in Nederland erkende producentenorganisaties wordt
      gepubliceerd op de website van de Rijksdienst voor Ondernemend Nederland. Deze lijst wordt jaarlijks
      geactualiseerd.

      5 In afwijking van het eerste lid kan een erkenning op verzoek van de producentenorganisatie die geen operationeel
      programma uitvoert, op ieder moment worden beëindigd. Het verzoek tot beëindiging van de erkenning kan op ieder
      moment worden ingediend.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel29
  - number: '30'
    text: |-
      1 De producentenorganisatie informeert de minister onverwijld over:

      a. wijzigingen in de statuten en het huishoudelijk reglement;

      b. wijzigingen in de organisatiestructuur; en

      c. voornemens tot fusie of samenwerking.

      2 Bij de melding van de wijzigingen, bedoeld in het eerste lid, onderdeel a, overlegt de producentenorganisatie in
      ieder geval de gewijzigde statuten of het gewijzigde huishoudelijk reglement.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel30
  - number: '31'
    text: |-
      1 De producentenorganisatie overlegt jaarlijks voor 1 maart de volgende stukken aan de minister:

      a. een uittreksel uit het handelsregister van de Kamer van Koophandel; en

      b. de verslagen van de in het afgelopen boekjaar gehouden algemene vergaderingen.

      2 Een producentenorganisatie die geen subsidieaanvraag indient bij de minister, overlegt ter uitvoering van artikel
      21, eerste lid, van [verordening 2017/892](32792R2017) jaarlijks voor 15 februari aan de minister:

      a. een digitale ledenlijst per 1 januari van het lopende jaar, met gebruikmaking van een door de minister
      beschikbaar gesteld middel;

      b. een overzicht van de leden die gedurende het vorige jaar zijn uitgetreden, onder vermelding van de datum van
      uittreding, alsook van de leden waarop [artikel 7, vijfde lid][ref1], van toepassing is met gebruikmaking van een
      door de minister beschikbaar gesteld middel; en

      c. een parafenlijst van tekenbevoegde personen binnen de producentenorganisatie.

      3 De producentenorganisatie overlegt jaarlijks uiterlijk op 1 juni, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de minister een samenvattend overzicht van:

      a. de door de leden op grond van [artikel 14, derde lid, onderdeel a, onder 1° tot en met 4°][ref2], aan de
      producentenorganisatie verstrekte informatie;

      b. het areaal van de leden van de producentenorganisatie;

      c. de door de leden van de producentenorganisatie geteelde gewassen;

      d. de hoeveelheden product waarvoor aan de leden een toestemming op grond van artikel 12 van [verordening 2017/891]
      (32791R2017) is verleend; en

      e. de omzet van de producentenorganisatie.

      4 De producentenorganisatie overlegt jaarlijks uiterlijk op 1 juni de jaarrekening over het afgelopen boekjaar,
      voorzien van een controleverklaring van een extern accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel14
