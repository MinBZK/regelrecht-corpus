  - number: '3'
    text: |-
      Deze regeling is van toepassing op de producten van de sector groenten en fruit, bedoeld in artikel 1, tweede lid,
      onderdeel i, van [verordening 1308/2013](32013R1308) en op dergelijke producten die uitsluitend zijn bestemd om te
      worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel3
  - number: '4'
    text: |-
      De rechtspersoonlijkheid van een producentenorganisatie als bedoeld in artikel 154, eerste lid, van [verordening
      1308/2013](32013R1308) blijkt uit:

      a. een in het handelsregister neergelegd authentiek afschrift van de oprichtingsakte van de producentenorganisatie;
      of

      b. een in het handelsregister van de Kamer van Koophandel neergelegd authentiek afschrift van de statuten van de
      producentenorganisatie; en

      c. een inschrijving bij het Handelsregister van de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel4
  - number: '5'
    text: |-
      Van een producentenorganisatie kunnen lid zijn:

      a. een natuurlijk persoon;

      b. een rechtspersoon als bedoeld in de [artikelen 1 tot en met 3 van Boek 2 van het Burgerlijk Wetboek][ref1] of
      een rechtspersoon naar buitenlands recht; of

      c. een in het Handelsregister van de Kamer van Koophandel ingeschreven maatschap, vennootschap onder firma of
      commanditaire vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: '6'
    text: |-
      1 Het minimumaantal leden en de minimale waarde van de afzetbare productie, bedoeld in artikel 154, eerste
      lid, onderdeel b, van [verordening 1308/2013](32013R1308) bedraagt ongeacht of de producentenorganisatie een
      operationeel programma heeft:

      a. voor producentenorganisaties die zijn erkend voor 1 januari 2008 tenminste vijf leden, met een gezamenlijke
      waarde van de afzetbare productie van € 100.000;

      b. voor producentenorganisaties die zijn erkend na 1 januari 2008 tenminste tien leden, met een gezamenlijke waarde
      van de afzetbare productie van € 25.000.000.

      2 Rechtspersonen die eigendom zijn van één natuurlijke persoon of rechtspersoon worden bij de beoordeling van de
      erkenningsaanvraag door de minister gezamenlijk aangemerkt als één lid. Indien de minister in redelijkheid vermoedt
      dat een oneigenlijk aantal entiteiten, als bedoeld in [artikel 5][ref1], wordt gecreëerd met het oog op het eerste
      lid of [artikel 24][ref2], kan de minister deze entiteiten gezamenlijk aanmerken als één lid.

      3 Indien een lid van een producentenorganisatie een rechtspersoon is waarbij meerdere producenten zijn aangesloten,
      kan de minister besluiten deze producenten bij de beoordeling van de erkenningsaanvraag mee te tellen bij de
      bepaling van het aantal leden, bedoeld in het eerste lid.

      4 Producentenorganisaties houden een ledenlijst bij met gebruikmaking van een door de minister beschikbaar gesteld
      model.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel24
