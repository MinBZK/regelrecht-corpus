  - number: '184'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur van
      de producentenorganisatie door fusies en overnames zijn subsidiabel, indien het gaat om:

      a. de juridische kosten en administratiekosten; en

      b. de kosten van haalbaarheidsstudies.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel184
  - number: '185'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de versterking van de verticale samenwerking in de keten
      door beleggingen in aandelen zijn subsidiabel indien het gaat om uitgaven voor de waarde van de materiële vaste
      activa.

      2 De producentenorganisatie toont de belegging bij de indiening van de subsidieaanvraag aan door middel van
      bankstukken.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel185
  - number: 185a
    text: |-
      1 Uitgaven van de producentenorganisatie voor duurzame productiemiddelen en overige kosten ten behoeve van
      bescherming van de gezondheid van medewerkers op de locatie van de producentenorganisatie, een dochteronderneming
      of een lid in geval van een uitbraak van besmettelijke humane ziekten zijn subsidiabel.

      2 Uitgaven zoals bedoeld in het eerste lid zijn onder meer:

      a. speciale voorzieningen zoals schermen of technische aanpassingen;

      b. inhuur van hygiënediensten.

      3 Niet subsidiabel zijn onder meer uitgaven voor:

      a. persoonlijke hygiëne zoals mondkapjes, handschoenen, zeep, beschermende kleding;

      b. bloed- of speekseltesten;

      c. hygiënemaatregelen in ruimten die niet gerelateerd zijn aan de teelt, bewerking of verkoop van producten.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel185a
  - number: '186'
    text: |-
      Indien een uitgave afwijkt van de in het operationele programma opgenomen begroting voor een uitgavenpost, wordt
      deze afwijking in de subsidieaanvraag voldoende gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel186
  - number: '187'
    text: |-
      1 Als bewijsstuk als bedoeld in artikel 9, tweede lid, onderdelen a en d, van [verordening 2017/892](32792R2017),
      gelden:

      a. een overzicht van de per project en activiteit aangevraagde subsidie; en

      b. de detailstaat declaratie.

      2 Als bewijsstuk als bedoeld in artikel 9, tweede lid, onderdeel i, van [verordening 2017/892](32792R2017), geldt
      de detailstaat declaratie van de producentenorganisatie waarin de declaratiegegevens voor de betreffende acties
      zijn opgenomen.

      3 Ter uitvoering van artikel 9, tweede lid, onderdeel c, van [verordening 2017/892](32792R2017), stelt de
      producentenorganisatie, met gebruikmaking van een door de minister vastgesteld model, een overzicht op van de
      financiële bijdragen aan het actiefonds van de leden en de producentenorganisatie zelf.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel187
  - number: '188'
    text: |-
      1 Uitgaven als bedoeld in [deel 4, hoofdstuk 3][ref1] en [4][ref2], worden opgenomen in de subsidieaanvraag
      voor het uitvoeringsjaar waarin de activiteit wordt uitgevoerd en de uitgaven worden dat jaar betaald, tenzij in
      hoofdstuk 3 of 4 van deel 4 anders wordt bepaald.

      2 In afwijking van het eerste lid kunnen uitgaven als bedoeld in [hoofdstuk 3][ref3] en [4 van deel 4][ref4] worden
      betaald in de periode van 1 januari tot en met 14 februari van het jaar volgend op het uitvoeringsjaar waarin de
      activiteit wordt uitgevoerd, indien de uitgaven in die periode in het actiefonds worden verwerkt.


