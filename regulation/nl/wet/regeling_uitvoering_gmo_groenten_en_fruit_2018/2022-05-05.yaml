  - number: '161'
    text: |-
      Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in geval van biologische
      productie, inclusief personeelskosten, zijn subsidiabel indien:

      a. het gaat om:

      1°. biologische teelt;

      2°. bodemvruchtbaarheid;

      3°. biologische bemesting;

      4°. compostering;

      5°. vruchtwisseling;

      6°. rassenkeuze;

      7°. biologische bestrijding en biologisch evenwicht; of

      8°. biologische teelttechniek;

      b. voldaan is aan de bij of krachtens [verordening 2018/848](32748R2018) gestelde voorschriften; en

      c. deelnemende leden van de producentenorganisatie beschikken over een geldig Skal certificaat of een bevestiging
      van Stichting Skal dat het bedrijf van het lid in omschakeling is naar biologische productie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel161
  - number: '162'
    text: |-
      1 Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in het geval van
      geïntegreerde plaagbestrijding, inclusief personeelskosten, zijn subsidiabel als het gaat om:

      a. biologische of geïntegreerde bestrijding;

      b. geleide bestrijding; of

      c. het voorkomen van ziekten en plagen met inbegrip van gewas-, water- of bodemanalyses gericht op het vaststellen
      van ziekten en plagen.

      2 Bij de indiening van de subsidieaanvraag verstrekt de producentenorganisatie in geval van uitgaven voor een
      analyse per soort analyse, met gebruikmaking van een door de minister beschikbaar gesteld middel, aan de minister
      informatie over de analyse.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel162
  - number: '163'
    text: |-
      1 Uitgaven van de producentenorganisatie voor algemeen advies en begeleiding ten behoeve van de teelt in het
      geval van geïntegreerde productie die mede de kwaliteit en het milieu betreffen, inclusief personeelskosten, zijn
      subsidiabel indien het onder meer gaat om:

      a. gewasbeoordeling;

      b. gewasbescherming;

      c. watermanagement;

      d. bemesting en reduceren mineralengebruik;

      e. klimaataansturing; of

      f. energiereductie.

      2 Uitgaven die betrekking hebben op de begeleiding voor de teelt van witlofpennen zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel163
  - number: 163a
    text: |-
      1 Uitgaven van producentenorganisaties voor standaard advisering en begeleiding ten behoeve van de teelt die mede
      kwaliteit en milieu betreffen, inclusief personeelskosten, zijn subsidiabel indien het onder meer gaat om:

      a. aansturing van de voorlichters door gekwalificeerde medewerkers van de producentenorganisatie, of

      b. opstellen van bedrijfsvergelijkingen door de producentenorganisatie met betrekking tot het verbruik en reductie
      van mineralen, gewasbeschermingsmiddelen en energie.

      2 Bij de indiening van de subsidieaanvraag verstrekt de producentenorganisatie in geval van uitgaven voor advies
      en begeleiding, bedoeld in het eerste lid, informatie daarover aan de minister per lid per gewas, met gebruikmaking
      van een door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel163a
  - number: '164'
    text: |-
      Bij de indiening van het operationeel programma legt de producentenorganisatie een plan inhoudende de concrete
      invulling van de acties op het gebied van crisispreventie en risicobeheer en een begroting daarvan voor aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel164
  - number: '165'
    text: |-
      Ter uitvoering van artikel 37 van [verordening 2017/891](32791R2017) zijn de maatregelen van artikel 33, derde lid,
      onderdelen a, b, en e van [verordening 1308/2013](32013R1308) niet opengesteld.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel165
  - number: '166'
    text: |-
      Uitgaven van de producentenorganisatie voor onderzoek in het kader van crisispreventie of crisisbeheer kunnen voor
      subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel166
  - number: '167'
    text: |-
      1 De uitgaven, inclusief personeelskosten, voor crisispreventie- en beheer voor de specifieke doelstellingen,
      bedoeld in artikel 14, eerste lid, van [verordening 2017/892](32792R2017) zijn subsidiabel.

      2 De producentenorganisatie geeft gemotiveerd aan hoe deze activiteit bijdraagt aan de consolidatie of
      diversificatie van de markten voor groenten en fruit en hoe deze een aanvulling vormt op reeds lopende
      afzetbevorderings- en communicatieacties op andere gebieden dan crisispreventie en -beheer die door de
      producentenorganisatie in haar operationeel programma worden toegepast.

      3 In geval de activiteit buiten de Unie wordt uitgevoerd verstrekt de producentenorganisatie bewijsstukken waaruit
      blijkt dat de betreffende activiteit daadwerkelijk is uitgevoerd.

      4 Indien dit nodig is voor de beoordeling van de in dit artikel bedoelde uitgaven kan de minister de
      producentenorganisatie verzoeken om aanvullende schriftelijke bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel167
  - number: '168'
    text: |-
      Uitgaven van de producentenorganisatie, inclusief personeelskosten, voor collectieve generieke promotie-uitingen op
      het gebied van crisis zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel168
  - number: '169'
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelkosten, die gerelateerd zijn aan de onderhandeling
      en de implementatie en het beheer van de fytosanitaire protocollen, bedoeld in punt 13 van bijlage III van
      [verordening 2017/891](32791R2017), zijn subsidiabel.

      2 Indien de producentenorganisatie in het kader van fytosanitaire protocollen met derde landen uitgaven moet doen
      als bedoeld in [artikel 107, tweede en derde lid][ref1], geldt in afwijking van [artikel 108, eerste lid][ref2],
      dat de (meer)kosten volledig subsidiabel zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel108
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel169
