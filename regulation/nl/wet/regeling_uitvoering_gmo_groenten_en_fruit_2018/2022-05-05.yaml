        artikel: '149'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '154'
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeel en externe diensten voor nieuwbouw van sorteercentra
      en verpakcentra, distributiecentra, verwerkingscentra, fustopslag, dockboards en sorteer- en verpakkingslijnen,
      bedoeld in [artikel 150, eerste lid][ref1], zijn subsidiabel indien het gaat om:

      a. de kosten van bouwkundig advies;

      b. de kosten van bouwbegeleiding;

      c. de kosten van projectmanagement;

      d. de kosten van onafhankelijk toezicht op uitvoering van een project;

      e. de kosten van haalbaarheidsstudies;

      f. juridische en administratiekosten; of

      g. reis- en verblijfkosten.

      2 Uitgaven waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden geactiveerd in het
      investeringsbedrag zijn niet subsidiabel.

      3 Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel150
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0041140
        artikel: '150'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '155'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur
      van de producentenorganisatie door professionalisering van de producentenorganisatie richting de markt, inclusief
      personeelskosten, zijn subsidiabel, indien het gaat om de kosten voor:

      a. onderzoek naar activiteiten van de producentenorganisatie op het gebied van:

      1°. afzet;

      2°. logistiek;

      3°. kwaliteit;

      4°. milieubescherming; of

      5°. teelttechnisch onderzoek; of

      b. experimentele productie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel155
  - number: '156'
    text: |-
      1 In het kader van uitgaven voor educatieve bijeenkomsten zijn uitsluitend de door de organisatie van de educatieve
      bijeenkomst in rekening gebrachte kosten voor deelname van leden, medewerkers van leden en medewerkers van de
      producentenorganisatieof dochterondernemingen subsidiabel.

      2 Bij de indiening van het operationeel programma verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten als bedoeld in deze afdeling aan de minister een beschrijving van:

      a. onderwerp(en) en leerdoel(en) van de bijeenkomst;

      b. het programma met een specificatie van de onderdelen en gehanteerde werkvormen;

      c. aantal bijeenkomsten met vermelding van de data en de duur per bijeenkomst; en

      d. de kosten van de bijeenkomst.

      3 Bij de indiening van de subsidieaanvraag verstrekt de producentenorganisatie in geval van educatieve
      bijeenkomsten als bedoeld in deze afdeling aan de minister:

      a. een deelnemerslijst; en

      b. een aanwezigheidsregistratie per bijeenkomst per deelnemer voorzien van een handtekening van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel156
  - number: '157'
    text: |-
      1 Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur
      van de producentenorganisatie door professionalisering van de producentenorganisatie richting de markt, inclusief
      personeelskosten, zijn subsidiabel, indien het gaat om de kosten van opleidingen voor personeel voor activiteiten
      van de producentenorganisatie op het gebied van:

      a. afzet;

      b. logistiek;

      c. kwaliteit;

      d. milieubescherming; of

      e. teelttechniek.

      2 Uitgaven voor opleiding en advies ten behoeve van het verwerven van algemene kennis en vaardigheden zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel157
  - number: '158'
    text: |-
      Uitgaven voor activiteiten ten behoeve van versterking van de interne structuur van de producentenorganisatie
      door professionalisering richting de markt zijn subsidiabel, indien het gaat om de kosten van inhuur van externe
      deskundigen voor activiteiten van de producentenorganisatie op het gebied van:

      a. afzet;

      b. logistiek;

      c. kwaliteit;

      d. milieubescherming; of

      e. teelttechniek.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel158
  - number: '159'
    text: |-
      1 Bij de uitgaven voor advies en begeleiding ten behoeve van de teelttechniek, bedoeld in
      [artikel 158, onderdeel e][ref1], en ten behoeve van de teelt, bedoeld in de [artikelen 161 tot en met 163a][ref2]
      stellen voorlichters jaarlijks per deelnemend lid van de producentenorganisatie, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, evaluatierapporten op.

      2 De evaluatierapporten bevatten:

      a. een samenvatting van de concreet gegeven adviezen;

      b. de beoogde effecten; en

      c. de resultaten met betrekking tot de onderdelen kwaliteitsverbetering en milieureducties op het gebied van
      gewasbeschermingsmiddelen, mineralen en energie.

      3 Bij de indiening van de subsidieaanvraag zendt de producentenorganisatie op verzoek van de minister een selectie
      van de evaluatierapporten.

      4 De evaluatierapporten van elk deelnemend lid zijn opgenomen in de administratie van de producentenorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel161
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel159
