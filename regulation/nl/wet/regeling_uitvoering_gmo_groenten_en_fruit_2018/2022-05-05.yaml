  - number: 51b
    text: |-
      1 De uitgavenposten als bedoeld in [artikel 51, eerste lid, onderdeel e, onder 4°][ref1], die in het operationeel
      programma zijn opgenomen voor de jaren na het eerste jaar van het operationeel programma worden voor de
      desbetreffende jaren jaarlijks door middel van een verzoek tot wijziging van het operationeel programma, als
      bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017), onderbouwd door middel van minimaal drie
      onderling vergelijkbare kostenbegrotingen per uitgavenpost.

      2 In afwijking van [artikel 51, eerste lid, onderdeel e, onder 4°][ref2], en het eerste lid, kan een begroting
      voor een uitgavenpost voor een activiteit waarvan de uitgaven in een uitvoeringsjaar worden geraamd op minder dan
      € 25.000 worden onderbouwd aan de hand van een enkele kostenbegroting.

      3 Indien een uitgavenpost voor een activiteit aantoonbaar door slechts een enkele of ten
      hoogste twee partijen kan worden uitgevoerd of begroot, wordt een begroting, in afwijking van
      [artikel 51, eerste lid, onderdeel e, onder 4°][ref3], en het eerste lid, onderbouwd met de beschikbare
      kostenbegroting(en).

      4 Indien een begroting voor een uitgavenpost wordt onderbouwd aan de hand van meerdere kostenbegrotingen wordt de
      keuze voor de in de begroting opgenomen kostenbegroting voldoende gemotiveerd.

      5 De verplichting tot het overleggen van kostenbegrotingen en de daaruit voortvloeiende eis om de keuze voor een
      bepaalde kostenbegroting te motiveren is niet van toepassing op:

      a. personeelskosten, zoals bedoeld onder [deel 4, hoofdstuk 3, titel 2][ref4]; en

      b. de uitgaven als bedoeld in [deel 4, hoofdstuk 4, titel 4, afdeling 5, paragraaf 3 tot en met 7][ref5].

      6 De minister kan besluiten dat de verplichting tot het overleggen van kostenbegrotingen en de daaruit
      voortvloeiende eis om de keuze voor een bepaalde kostenbegroting te motiveren, wordt verlegd naar een entiteit die
      op grond van een uitbestedingsovereenkomst namens een of meer producentenorganisaties zelfstandig een activiteit of
      uitgavenpost onder hun beheer uitvoert of laat uitvoeren.


