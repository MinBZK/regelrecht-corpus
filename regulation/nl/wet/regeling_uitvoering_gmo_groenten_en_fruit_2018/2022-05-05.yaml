  - number: '215'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en is van toepassing op operationele programma’s die aanvangen op of na 1 januari 2019.

      2 Deze regeling is niet van toepassing op lopende programma’s, met dien verstande dat het toevoegen van een
      activiteit of uitgavenpost aan een operationeel programma dat is goedgekeurd voor de inwerkingtreding van deze
      regeling door middel van een wijzigingsverzoek op grond van artikel 34 van [verordening 2017/891](32791R2017) is
      toegestaan:

      a. indien de activiteit of uitgavenpost subsidiabel is op grond van deze regeling; en

      b. onder de voorwaarden van deze regeling.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel215
