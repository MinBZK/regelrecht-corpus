  - number: '35'
    text: |-
      De erkenning van een producentenorganisatie wordt met ingang van het tijdstip van verstrijken van de termijn zoals
      vastgelegd in het aanmaningsbesluit bedoeld in artikel 59, eerste lid, van [verordening 2017/891](32791R2017)
      van rechtswege opgeschort, tenzij de minister voor het verstrijken van deze termijn schriftelijk aan de
      producentenorganisatie heeft medegedeeld dat de niet-naleving van de erkenningscriteria tijdig is gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel35
  - number: '36'
    text: |-
      De referentieperiode voor het bepalen van de waarde van de afgezette productie, bedoeld in artikel 23, eerste lid,
      van [verordening 2017/891](32791R2017), is het kalenderjaar twee jaar voorafgaande aan het uitvoeringsjaar waarvoor
      de waarde afgezette productie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel36
  - number: '37'
    text: |-
      1 Producten zijn geproduceerd door een producentenorganisatie of een lid van de producentenorganisatie als bedoeld
      in artikel 22, eerste lid, eerste alinea, van [verordening 2017/891](32791R2017), wanneer de productie voor
      eigen rekening en risico van de producentenorganisatie of haar lid op het grondgebied van de Europese Unie heeft
      plaatsgevonden.

      2 Producten zijn geproduceerd door een unie van producentenorganisaties of een aangesloten producentenorganisatie
      als bedoeld in artikel 22, eerste lid, tweede alinea, van [verordening 2017/891](32791R2017), wanneer de
      productie voor eigen rekening en risico van de unie van producentenorganisaties of de daarbij aangesloten
      producentenorganisatie heeft plaatsgevonden.

      3 Verkoop van nog niet geoogste producten valt onder productie van leden van de producentenorganisatie en wordt in
      de waarde van de afgezette productie opgenomen, mits de verkoop via de producentenorganisatie is gelopen en het de
      eerste verkoop betreft waarbij het product van eigenaar verandert.

      4 Verkoop van door leden aangekochte producten valt niet onder de productie van leden van de
      producentenorganisatie, ook niet als deze producten door het lid als halfgewas zijn aangekocht. In uitzonderlijke
      gevallen kan de minister besluiten om de aangekochte producten onder de productie van de leden van de
      producentenorganisatie te laten vallen indien deze productie voor eigen rekening en risico van het betreffende lid
      heeft plaatsgevonden.

      5 De producentenorganisatie of unie van producentenorganisaties controleert de naleving van het eerste
      onderscheidenlijk tweede lid.

      6 Ter uitvoering van artikel 22, zesde lid, van [verordening 2017/891](32791R2017) omvat de waarde van de
      afgezette productie in het stadium ‘af producentenorganisatie’ de aan de afnemer gefactureerde kosten van
      verpakkingsmateriaal, eenmalig fust, huur van meermalig fust en de verpakking waarin of pallet waarop het product
      ter verkoop wordt aangeboden.

      7 In de waarde van de afgezette productie worden geen transportkosten naar de afnemer opgenomen, ongeacht of deze
      op de verkoopfactuur zijn vermeld.

      8 Ter uitvoering van artikel 22, tiende lid, van [verordening 2017/891](32791R2017) mogen vergoedingen worden
      meegeteld die in het kader van oogstverzekeringsacties of door de producentenorganisatie beheerde acties, zoals
      bedoeld in [artikel 182][ref1],zijn uitgekeerd aan de producentenorganisatie of haar leden.

      9 In de waarde van de afgezette productie worden geen debiteuren opgenomen die op het tijdstip van definitieve
      opgave van de waarde van de afgezette productie als bedoeld in [artikel 43][ref2] nog openstaan.

      10 Terugbetalingen aan afnemers worden uit de waarde van de afgezette productie gehaald op het moment dat
      creditering in de boekhouding van de producentenorganisatie gebruikelijk is.

      11 In de waarde van de afgezette productie wordt niet de waarde opgenomen van verkopen die hebben plaatsgevonden
      aan een lid of aan het lid gelieerde entiteiten, indien het betreffende lid deze producten zelf heeft geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel182
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel43
