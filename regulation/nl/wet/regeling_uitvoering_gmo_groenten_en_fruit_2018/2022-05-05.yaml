        bwb_id: BWBR0040671
  - number: '179'
    text: |-
      1 Voor de toepassing van artikel 48, derde lid, van [verordening 2017/891](32791R2017) wordt de vergoeding voor
      producten waarvoor de normale oogst reeds begonnen is, maar die een langere oogstperiode hebben dan een maand,
      beperkt tot de resterende oogstcapaciteit indien de resterende oogstperiode minder bedraagt dan zes weken.

      2 De resterende oogstcapaciteit wordt door de producentenorganisatie ten genoegen van de minister bepaald aan de
      hand van:

      a. afleverbonnen van de planten;

      b. de normale productiecyclus van een gewas; en

      c. de oorspronkelijk geplande ruimdatum.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel179
  - number: '180'
    text: |-
      1 De producentenorganisatie voert het vernietigde gewas, indien van toepassing, of het groen geoogste product af.

      2 Als toegestane bestemmingen voor afvoer worden aangewezen:

      a. afvalverwerkers; en

      b. veehouders ten behoeve van vervoedering.

      3 Afvalverwerkers beschikken over een geldige milieuvergunning.

      4 Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers en transporteurs van de in het eerste
      lid bedoelde gewassen en producten met gebruikmaking van een door de minister beschikbaar gesteld model, waarin de
      afnemers en transporteurs worden verplicht:

      a. tot naleving van de voorwaarden uit artikel 47, tweede lid, van [verordening 2017/891](32791R2017), inclusief
      het voeren van een aparte voorraadboekhouding voor de betrokken concrete acties;

      b. bij ontvangst van de gewassen en producten de daarbij behorende door de minister ter beschikking gestelde
      vrachtbrief te ondertekenen; en

      c. de vrachtbrief en de overeenkomst met de producentenorganisatie gedurende tenminste 7 kalenderjaren, volgend op
      het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.

      5 In aanvulling op het vierde lid worden ontvangers van de gewassen en producten verplicht om deze gewassen en
      producten:

      a. een niet voor menselijke consumptie geschikte bestemming te geven die:

      1°. de normale afzet van de betrokken productie niet in de weg staat; en

      2°. geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 46, eerste lid,
      van [verordening 2017/891](32791R2017); en

      b. bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel180
  - number: '181'
    text: |-
      1 Uitgaven voor premies ten behoeve van een oogstverzekering als bedoeld in artikel 33, derde lid, onderdeel
      h, van [verordening 1308/2013](32013R1308) en de artikelen 50 en 51 van [verordening 2017/891](32791R2017) zijn
      subsidiabel voor zover de producentenorganisatie deze actie heeft opengesteld aan al haar leden.

      2 Uitgaven zijn slechts subsidiabel indien zij betrekking hebben op het deel van de polis dat betrekking heeft op
      gewasschade als gevolg van weersomstandigheden, klimatologische omstandigheden, ziekten of plagen.

      3 Assurantiebelasting en polis- of andere soortgelijke kosten zijn niet subsidiabel.

      4 Bij de indiening van de subsidieaanvraag wordt door de producentenorganisatie aan de minister, met gebruikmaking
      van een door de minister beschikbaar gesteld middel, in geval van de uitgaven informatie overlegd over de
      verzekering en de daaraan deelnemende leden.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel181
  - number: '182'
    text: |-
      1 Producentenorganisaties die een operationeel programma ten uitvoer leggen kunnen een onderling fonds als bedoeld
      in artikel 33, derde lid, onderdeel d, van [verordening 1308/2013](32013R1308) oprichten.

      2 De aanvulling van het onderlinge fonds uit het actiefonds na uitkering van vergoedingen aan een of meerdere leden
      is subsidiabel indien aan de volgende voorwaarden is voldaan:

      a. de vergoeding is uitgekeerd ter compensatie van:

      1°. een daling van het gemiddelde inkomen van het lid als gevolg van ongunstige marktomstandigheden met meer dan
      20%, waarbij het gemiddelde inkomen wordt berekend op basis van de waarde van de door het lid afgezette productie
      over de drie voorafgaande jaren; of

      2°. de stijging van de prijzen van grondstoffen met meer dan 20% over de drie voorafgaande jaren zonder dat deze
      prijsstijging heeft geleid tot een evenredige toename van de waarde van de afgezette productie van het lid; en

      b. de vergoeding heeft niet meer bedragen dan 70% van het inkomensverlies van het betreffende lid.

      3 De ongunstige marktomstandigheden of stijging van de grondstofprijzen worden door de producentenorganisatie
      gemotiveerd en gedocumenteerd. Bewijsstukken daaromtrent worden bij de subsidieaanvraag gevoegd.

      4 Een onderling fonds wordt opgericht door middel van een notariële akte, waarin in ieder geval is bepaald:

      a. de gevallen waarin en de voorwaarden waaronder het onderlinge fonds in overeenstemming met artikel 33, derde
      lid, van [verordening 1308/2013](32013R1308) uitkeert;

      b. de wijze waarop het onderlinge fonds wordt beheerd, inclusief sancties bij niet naleving van de voorwaarden door
      de leden en terugbetaling uit het fonds na minimaal 5 jaren;

      c. de wijze waarop het onderlinge fonds wordt gevuld; en

      d. de wijze waarop uitkeringen plaats zullen vinden.

      5 Het voornemen tot het oprichten van het fonds en de ontwerp akte, bedoeld in het vierde lid, worden door de
      algemene vergadering goedgekeurd.

      6 Indien de bijdragen aan of de uitkering uit het onderlinge fonds gedifferentieerd worden, wordt deze
      differentiatie in de notariële akte vastgelegd.

      7 Het vermogen van het onderlinge fonds wordt afgezonderd van overige financiële middelen van de
      producentenorganisatie. Hiertoe wordt in ieder geval een aparte bankrekening gebruikt.

      8 Uitgaven, inclusief personeelskosten, die gepaard gaan met het oprichten van het onderlinge fonds zijn
      subsidiabel binnen de voorwaarden en maxima uit artikel 40 van [verordening 2017/891](32791R2017) en hebben
      betrekking op het beheer van het fonds, waaronder leges en overhead.

      9 Uitkering van vergoedingen als bedoeld in het tweede lid is slechts mogelijk indien voor de betreffende
      ongunstige marktomstandigheden of stijging van de prijzen van grondstoffen geen andere activiteiten uit
      [paragraaf 3][ref1] en [4 van deze titel][ref2] worden ingezet.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel182
