        bwb_id: BWBR0041140
        artikel: '98'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '104'
    text: |-
      1 De aankoop van investeringen voor lage emissie apparatuur, is subsidiabel indien de technische specificatie van
      de investering een vermindering van het gebruik van chemische gewasbeschermingsmiddelen van minimaal 15 procent
      geeft zoals vooraf aangetoond in overeenstemming met artikel 3, vierde lid van [verordening 2017/892](32792R2017).

      2 In afwijking van het eerste lid is de eis dat de betrokken investering een vermindering van het gebruik van
      chemische gewasbeschermingsmiddelen van minimaal 15 procent geeft niet van toepassing indien de investering wordt
      ingezet in het kader van de biologische productie van groenten en fruit.

      3 Subsidiabel zijn:

      a. apparatuur en bijbehorende besturingssystemen voor precisietoepassingstechnieken; en

      b. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel zoals bedoeld in artikel 2, onderdeel f, onder iv en v, van [verordening
      2017/891](32791R2017).

      4 In het geval van lage emissie apparatuur als onderdeel van zelfrijdende landbouwmachines komt alleen het
      spuitsysteem in aanmerking voor subsidie.

      5 GPS systemen in het kader van de precisielandbouwtechnieken zijn subsidiabel indien de GPS systemen aantoonbaar
      worden ingezet voor:

      a. precisiezaaien of planten;

      b. precisietoediening van meststoffen en gewasbeschermingsmiddelen; of

      c. precisie mechanische onkruidbestrijding.

      6 Niet subsidiabel zijn:

      a. transportsystemen voor het verplaatsen van spuitrobots naar de volgende rij of afdeling;

      b. investeringen in spuitleidingen; en

      c. standaard agrarische apparatuur en onderdelen, zoals een tractor, gereedschapsdrager, motor en cabine.

      7 In afwijking van [artikel 98, derde lid, aanhef en onderdeel b][ref1], onderbouwt de producentenorganisatie de
      emissiebeperking door bij de indiening van de subsidieaanvraag een jaarlijkse opgave van het totale gebruik aan
      werkzame stof in kilogram per hectare, uitgesplitst naar gewas(groep), te overleggen waarbij de nulsituatie wordt
      weergegeven, aan de hand van registraties van de teeltbedrijven.

      8 De nulsituatie is het gemiddelde gebruik aan werkzame stof in kilogram per hectare van het betrokken teeltbedrijf
      over drie voorgaande jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel98
