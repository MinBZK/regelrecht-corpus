      Ter uitvoering van artikel 27, vijfde lid, van [verordening 2017/891](32791R2017) mag een project als bedoeld in
      [artikel 51, eerste lid, onderdeel d][ref1] niet meer dan 75 procent en een activiteit niet meer dan 50 procent van
      de uitgaven van de uitvoering van het operationeel programma betreffen.


