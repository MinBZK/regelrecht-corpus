      1 Alleen een erkende producentenorganisatie kan lid zijn van een unie van producentenorganisaties.

      2 De minister kan op een gemotiveerd verzoek besluiten om een unie van producentenorganisaties een erkenning te
      verlenen op een lager niveau dan de GN-code.
