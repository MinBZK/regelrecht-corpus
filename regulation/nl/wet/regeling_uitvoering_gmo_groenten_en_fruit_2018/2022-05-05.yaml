    text: |-
      In geval van uitgaven voor het huren van koelsystemen als bedoeld in [artikel 142][ref1] of conditioneringssystemen
      als bedoeld in [artikel 143, eerste lid][ref2], overlegt de producentenorganisatie ter uitvoering van artikel 31,
      eerste lid, en punt 10 van bijlage III van [verordening 2017/891](32791R2017) jaarlijks bij het indienen van de
      subsidieaanvraag aan de minister een bewijs van die uitgaven, bestaande uit een registratie van de in- en uitslag.


