  - number: '78'
    text: |-
      1 In aanvulling op artikel 31, zesde lid, van [verordening 2017/891](32791R2017) worden, indien het eigendom van
      een investering teniet gaat als gevolg van een oorzaak waarvoor de producentenorganisatie een uitkering van een
      verzekeraar ontvangt en deze uitkering niet wordt aangewend voor de vervanging van de betreffende investering, de
      verzekeringspenningen teruggestort in het Europees Landbouwgarantiefonds.

      2 Voorgaande is niet van toepassing als het op grond van artikel 31, zesde lid, van [verordening 2017/891]
      (32791R2017) berekende bedrag lager is dan het in het eerste lid bedoelde bedrag. In dat geval wordt het berekende
      bedrag teruggestort in het Europees Landbouwgarantiefonds.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel78
  - number: '79'
    text: |-
      1 De in artikel 31, zesde lid, van [verordening 2017/891](32791R2017) bedoelde tranches betreffen identieke
      bedragen.

      2 Indien een producentenorganisatie of unie van producentenorganisaties uitgaven voor een investering in een
      duurzaam productiemiddel in identieke tranches in de subsidieaanvraag opneemt, wordt de eerste tranche niet eerder
      opgenomen dan in de subsidieaanvraag die de periode betreft die de factuurdatum van de laatste factuur voor het
      duurzame productiemiddel omvat.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel79
  - number: '80'
    text: |-
      1 Duurzame productiemiddelen kunnen ten laste van het actiefonds worden gebracht gedurende maximaal de periode,
      bedoeld in [artikel 76][ref1].

      2 Uitgaven voor duurzame productiemiddelen, inclusief duurzame productiemiddelen die worden verworven door middel
      van langlopende leasecontracten, kunnen ook voor het volgende operationele programma in aanmerking worden genomen,
      indien de periode, bedoeld in [artikel 76][ref2], langer is dan de looptijd van het operationele programma.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel76
