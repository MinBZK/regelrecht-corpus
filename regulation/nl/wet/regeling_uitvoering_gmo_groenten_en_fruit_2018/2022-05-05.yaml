  - number: 51a
    text: |-
      1 Een project heeft een vernieuwend karakter als bedoeld in [artikel 51, eerste lid, onderdeel d, onder 3°][ref1],
      wanneer de producentenorganisatie in het voorafgaande operationele programma geen planmatige of bewuste
      activiteiten heeft ondernomen op het gebied van het betreffende project.

      2 Projecten die zijn opgenomen in het eerste operationele programma dat wordt ingediend na inwerkingtreding van
      deze regeling worden geacht een vernieuwend karakter te hebben.

      3 In geval van een fusie worden voor de toepassing van het eerste lid de activiteiten die zijn opgenomen in de
      operationele programma’s van de fuserende producentenorganisaties gezamenlijk bekeken. Bij fusie is het tweede lid
      niet van toepassing.

      4 In afwijking van [artikel 51, eerste lid, onderdeel d, onder 3°][ref2], geldt het vereiste dat een project een
      vernieuwend karakter moet hebben niet voor:

      a. projecten die zijn opgenomen onder het strategisch doel verduurzaming en invulling geven aan de maatregelen als
      bedoeld in artikel 2, onderdeel f, onder vii, van [verordening 2017/891](32791R2017);

      b. projecten die overeenkomstig [artikel 51, zesde lid, tweede volzin][ref3], in een volgend operationeel programma
      zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel51
