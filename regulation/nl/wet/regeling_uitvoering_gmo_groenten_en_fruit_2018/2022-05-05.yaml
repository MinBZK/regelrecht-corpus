  - number: '58'
    text: |-
      Indien een producentenorganisatie of unie van producentenorganisaties de uitvoering van haar operationele programma
      voor het einde van de geplande looptijd ervan stopzet, meldt zij dit onverwijld aan de minister.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel58
  - number: '59'
    text: |-
      Een verzoek om bij fusie operationele programma’s parallel uit te voeren tot het einde van de looptijd, als bedoeld
      in artikel 15, tweede lid, van [verordening 2017/891](32791R2017), wordt ingediend voor 15 juli van het jaar van
      de fusie.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel59
  - number: '60'
    text: |-
      1 De uitgaven, bedoeld in dit hoofdstuk, zijn subsidiabel indien zij op grond van [deel 4, hoofdstuk 4][ref1],
      subsidiabel worden gesteld.

      2 De uitgaven, bedoeld in [bijlage I][ref2], zijn niet subsidiabel.

      3 Ter uitvoering van artikel 30, derde lid van [verordening 2017/891](32791R2017) is het subsidieniveau
      voor activiteiten die subsidiabel zijn op grond van [deel 4, hoofdstuk 4][ref3], waarvoor door leden van de
      producentenorganisatie of van een bij de unie van producentenorganisaties aangesloten producentenorganisatie
      ten tijde van de indiening van het operationeel programma of een verzoek tot wijziging van het operationeel
      programma als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) tevens subsidie kan worden
      aangevraagd op grond van [verordening 1305/2013](32013R1305), niet hoger dan het maximale subsidiebedrag voor deze
      activiteiten op grond van [verordening 1305/2013](32013R1305).

      4 Ter uitvoering van artikel 30, zesde lid, van [verordening 2017/891](32791R2017) zijn activiteiten niet
      subsidiabel als voor die activiteiten subsidie is verleend uit hoofde van een afzetbevorderingsprogramma dat in
      het kader van verordening (EU) nr. 1144/2014 van het Europees Parlement en de Raad van 22 oktober 2014 inzake
      voorlichtings- en afzetbevorderingsacties betreffende landbouwproducten uitgevoerd op de interne markt en in
      derde landen en tot intrekking van [Verordening (EG) nr. 3/2008](32008R0003) van de Raad (PB EU 2014 L 317) is
      goedgekeurd.


