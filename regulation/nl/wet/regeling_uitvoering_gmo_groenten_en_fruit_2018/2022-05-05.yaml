  - number: '76'
    text: |-
      1 Ter uitvoering van artikel 31, vijfde lid, van [verordening 2017/891](32791R2017) behoudt de eigenaar het
      eigendom en bezit van duurzame roerende productiemiddelen tot ten minste vijf jaar na ontvangst van de laatste
      subsidiebetaling voor de desbetreffende investering.

      2 Ter uitvoering van artikel 31, vijfde lid, van [verordening 2017/891](32791R2017) behoudt de eigenaar het
      eigendom en bezit van duurzame onroerende productiemiddelen tot ten minste tien jaar na de factuurdatum van de
      laatste factuur en tot ten minste vijf jaar na ontvangst van de laatste subsidiebetaling voor de desbetreffende
      investering.

      3 Indien de producentenorganisatie of unie van producentenorganisaties aantoont dat de fiscale afschrijvingsperiode
      van duurzame onroerende productiemiddelen korter is dan de periode, bedoeld in het tweede lid, blijven duurzame
      onroerende productiemiddelen tot het einde van de fiscale afschrijvingsperiode in eigendom en bezit van de
      eigenaar.

      4 In afwijking van het tweede en derde lid wordt de opbrengst van duurzame onroerende productiemiddelen,
      zijnde bomen en meerjarige planten, geleverd aan de producentenorganisatie, unie van producentenorganisaties of
      dochteronderneming:

      a. tot ten minste vijf jaar na ontvangst van de laatste subsidiebetaling voor de desbetreffende investering; of

      b. indien de producentenorganisatie of unie van producentenorganisaties aantoont dat de fiscale
      afschrijvingsperiode van de boom of meerjarige plant korter is dan de periode, bedoeld in onderdeel a, tot ten
      minste het einde van de fiscale afschrijvingsperiode.

      5 Indien een producentenorganisatie, unie van producentenorganisaties of een dochteronderneming daarvan de eigenaar
      is van een duurzaam productiemiddel en een lid van de producentenorganisatie of de unie van producentenorganisaties
      de houder is van dat duurzame productiemiddel, geldt de termijn, bedoeld in het eerste, tweede of derde lid,
      slechts voor het eigendom van het duurzame productiemiddel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel76
  - number: '77'
    text: |-
      1 Indien, binnen de termijn bedoeld in [artikel 76][ref1], een lid de producentenorganisatie verlaat of een
      producentenorganisatie de unie van producentenorganisaties verlaat, wordt een duurzaam productiemiddel dat op het
      terrein van het lid of van de producentenorganisaties of een dochteronderneming daarvan is geplaatst, herplaatst of
      vordert de producentenorganisatie of unie van producentenorganisaties binnen twee maanden na datum van uittreding
      de restwaarde van het duurzame productiemiddel terug en stort deze in het actiefonds.

      2 In geval van herplaatsing van een duurzaam productiemiddel dat is gefinancierd met behulp van het actiefonds van
      een producentenorganisatie wordt het op het terrein van het uittredende lid geplaatste duurzame productiemiddel
      herplaatst op een locatie van de producentenorganisatie, een dochteronderneming, of een lid.

      3 In geval van herplaatsing van een duurzaam productiemiddel dat is gefinancierd met behulp van het actiefonds
      van een unie van producentenorganisaties wordt het duurzame productiemiddel herplaatst op een locatie van de unie
      van producentenorganisaties, een aangesloten producentenorganisatie, een dochteronderneming of een lid van een
      aangesloten producentenorganisatie.

      4 De restwaarde wordt bepaald naar evenredigheid van het aantal volledige maanden dat resteert tot het einde van de
      periode, bedoeld in [artikel 76][ref2].

      5 Indien de producentenorganisatie of unie van producentenorganisaties in het jaar waarin de restwaarde in het
      actiefonds wordt gestort en in de twee daaropvolgende jaren geen operationeel programma heeft, wordt het gedeelte
      van de restwaarde waarvoor Uniesteun is betaald door de minister gerecupereerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel76
