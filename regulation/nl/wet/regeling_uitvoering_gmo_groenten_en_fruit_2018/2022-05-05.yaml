  - number: 122a
    text: |-
      1 Uitgaven van producentenorganisaties voor personeelskosten bestemd voor standaard activiteiten in het kader van
      de kwaliteitskeuring van producten van de leden zijn subsidiabel voor zover de kwaliteit in geval van de uitvoering
      van het keurproces bij de leden van een producentenorganisatie aantoonbaar geborgd wordt door middel van periodieke
      audits.

      2 De activiteiten, bedoeld in het eerste lid, hebben in ieder geval betrekking op het:

      a. uitvoeren van keuringen en opstellen van een keurrapport;

      b. bewaken van de kwaliteit tijdens de periode van overslag;

      c. uitvoeren van metingen aan het product;

      d. monitoren van de houdbaarheid en het uitstalleven van producten;

      e. uitvoeren van specifieke keuringen op basis van klantspecificaties;

      f. onderhouden van contact met het lid van een producentenorganisatie over keurresultaten en in voorkomende
      gevallen binnengekomen klachten;

      g. geven van een instructie aan het lid om de kwaliteit te verbeteren;

      h. dagelijks analyseren van en rapporteren over de kwaliteit van de aangevoerde producten en zo nodig aanpassen van
      de procedures en keurpraktijk;

      i. opstellen van procedures;

      j. opstellen van risicoanalyses;

      k. opstellen van keurplannen;

      l. mede opstellen van kwaliteitsplannen per product;

      m. mede bepalen van het kwaliteitsbeleid van de afzetorganisatie en het concretiseren daarvan in de dagelijkse
      praktijk, of

      n. fungeren als aanspreekpunt voor controles door Stichting Kwaliteits-Controle-Bureau.

      3 Uitgaven voor personeelskosten in het kader van de kwaliteitskeuring die commerciële afzet, logistieke handeling
      of andere activiteiten betreffen zijn niet subsidiabel.

      4 Uitgaven van de producentenorganisatie voor gekwalificeerde externe diensten bestemd voor productcontroles
      en begeleiding en audits van kwaliteitscontrolesystemen zoals voor keurmerken voor productkwaliteit,
      voedselveiligheid, microbiologie en fyto-sanitaire kwaliteit zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel122a
  - number: '123'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de borging van de productkwaliteit van een nieuw product
      of concept in de keten, inclusief personeelskosten, zijn subsidiabel, indien het gaat om uitgaven voor:

      a. het voor de eerste keer laten certificeren van keurmerken voor nieuwe producten en nieuwe concepten; of

      b. het voor de eerste keer laten certificeren van keurmerken op het gebied van duurzaamheid, kwaliteit en
      voedselveiligheid in de keten.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:

      a. uitgaven voor onderhoudsabonnementen;

      b. uitgaven voor de aanschaf van een Global Location Number (GLN);

      c. uitgaven van de producentenorganisatie om aan keurmerken te voldoen; of

      d. uitgaven voor ICT voorzieningen voor tracking en tracing systemen indien het gaat om ICT voorzieningen ten
      behoeve van:

      1°. de registraties van productherkomst, ziekten, plagen, middelen of meststoffen; of

      2°. het laten functioneren van oogstkarren, weeginstallaties of kantelinstallaties.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel123
  - number: '124'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten zijn subsidiabel indien:

      a. het gaat om de aanschaf van:

      1°. bomen of meerjarig plantmateriaal; of

      2°. kruisbestuivers die nodig zijn voor de aanplant van nieuw in het operationeel programma op te nemen bomen en
      meerjarige planten; en

      b. de producentenorganisatie door middel van contracten of andere schriftelijke bescheiden aantoont dat de bomen
      of meerjarig plantmateriaal gedurende de looptijd van het project slechts op een vooraf vastgestelde hoeveelheid
      areaal wordt geproduceerd.

      2 Uitgaven voor identieke investeringen zijn uitsluitend subsidiabel in geval van uitgaven gedaan binnen vier jaar
      na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Uitgaven voor de aankoop van meerjarig plantmateriaal en bomenzijn evenwel slechts subsidiabel indien:

      a. er gedurende meerdere jaren van de bomen en planten geoogst wordt; en

      b. het gaat om de uitgaven voor de initiële aanplant.

      4 De producentenorganisatie overlegt voor de uitgavenjaarlijks bij de indiening van de subsidieaanvraag informatie
      over het desbetreffende product aan de minister met gebruikmaking van een door de minister beschikbaar gesteld
      middel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel124
  - number: '125'
    text: |-
      1 Uitgaven van de producentenorganisatie gericht op afzetverbetering en bundeling van productstromen zijn
      subsidiabel indien het gaat om:

      a. sorteer- en verpakcentra;

      b. distributiecentra;

      c. verwerkingscentra;

      d. fustopslag;

      e. dockboards; en

      f. sorteer- en verpakkingslijnen.

      2 Uitgaven zijn niet subsidiabel indien het gaat om:

      a. investeringen ter vervanging van oude centra als bedoeld in het eerste lid;

      b. vervanging van standaard sorteer- en verpakkingslijnen; of

      c. met de sorteerlijn geïntegreerde aanvoerprognosesystemen.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de subsidieaanvraag aan de minister een
      overzicht van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel125
  - number: '126'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen ten behoeve van het vergroten van de afzetwaarde
      van producten door middel van het vergroten van de duurzaamheid van het product en van het productieproces zijn
      subsidiabel, indien het gaat om:

      a. een volledige investering in fertigatie in het kader van precisiebemestingtechnieken die bestemd is voor
      besparing en het gereguleerd doseren van water en meststoffen aan gewassen in vollegrondsfruitteelt;

      b. de besparing op het meststoffenverbruik door de producentenorganisatie is aangetoond; en

      c. de investering niet leidt tot een hoger watergebruik.

      2 Onder een investering in fertigatie wordt verstaan:

      a. een waterafgiftesysteem op het perceel, waaronder de waterpomp, verdeelleidingen en druppelleidingen die niet
      uitsluitend worden gebruikt voor het geven van water;

      b. een regeleenheid;

      c. vochtmeetapparatuur;

      d. apparatuur voor het bepalen van het mineralengehalte en pH; of

      e. voorzieningen voor dosering en menging van meststoffen.

      3 Druppelleidingen zijn uitsluitend subsidiabel bij initiële investeringen.

      4 Investeringen in een waterafgiftesysteem zijn niet subsidiabel indien het investeringen betreft in:

      a. fertigatie in teeltsystemen los van de grond;

      b. aanleg van een waterbron; of

      c. afvoerleidingen naar het te fertigeren perceel.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel126
  - number: '127'
    text: |-
      1 De producentenorganisatie overlegt bij de indiening van de subsidieaanvraag aan de minister, met gebruikmaking
      van een door de minister beschikbaar gesteld middel, voor de investering, bedoeld in [artikel 126][ref1], een
      opgave van de gerealiseerde besparing op het meststoffenverbruik en waterverbruik.

      2 De berekening van de gerealiseerde besparing op het meststoffenverbruik, gemeten in kilogrammen, als gevolg van
      een investering als bedoeld in [artikel 126][ref2], vindt plaats op basis van een vergelijking tussen:

      a. het mineralenverbruik, volgens de mineralenregistratie, van het jaar voorafgaand aan het jaar van
      inbedrijfstelling van de investering; en

      b. het mineralenverbruik, volgens de mineralenregistratie, gedurende het jaar:

      1°. van ingebruikname van de investering; of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.

      3 Het vaststellen van veranderingen in het waterverbruik en meststoffenverbruik, gemeten in m3, als gevolg van een
      investering als bedoeld in [artikel 126, eerste lid][ref3], vindt plaats op basis van een vergelijking tussen:

      a. het waterverbruik en meststoffenverbruik van het jaar voorafgaand aan het jaar van inbedrijfstelling van de
      investering; en

      b. het waterverbruik en meststoffenverbruik gedurende het jaar:

      1°. van ingebruikname van de investering; of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041140#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0041140#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0041140#Artikel126
