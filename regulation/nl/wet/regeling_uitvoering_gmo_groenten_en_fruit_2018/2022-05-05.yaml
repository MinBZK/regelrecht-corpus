  - number: '105'
    text: |-
      1 Uitgaven voor investeringen in installaties ten behoeve van het zuiveren van water voorafgaand aan lozing zijn
      subsidiabel indien het bevoegd gezag heeft bepaald, dat de verplichting om water dat gewasbeschermingsmiddelen
      bevat voorafgaand aan het lozen door een zuiveringsvoorziening te leiden die ten minste 95 procent van de werkzame
      stoffen die bestaan uit organische verbindingen uit het afvalwater verwijdert, voor de desbetreffende inrichting
      niet geldt en de specificatie van de investering een reductie van de emissie van afvalstoffen in het geloosde
      afvalwater van minimaal 15 procent geeft zoals vooraf aangetoond in overeenstemming met artikel 3, vierde lid van
      [verordening 2017/892](32792R2017).

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van de emissie
      van afvalstoffen in het geloosde afvalwater van minimaal 7 procent toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.

      3 Investeringen, zoals bedoeld in het eerste lid zijn:

      a. waterzuiveringsapparatuur;

      b. helofytenfilters;

      c. biofilters; en

      d. maatregelen om uitstoot van landbouwproducten te voorkomen (puntbelasting).

      4 Subsidiabel zijn:

      a. apparatuur en bijbehorende controlesystemen door toepassing van waterzuiveringstechnieken; en

      b. advieskosten en vooronderzoek indien opgenomen in de gedetailleerde factuur, mits het niet gaat om een
      onderzoeksmaatregel of opleidingsmaatregel die deel uitmaakt van de maatregelen zoals bedoeld in artikel 2,
      onderdeel f, onder iv en v, van [verordening 2017/891](32791R2017).

      5 Niet subsidiabel zijn investeringen in standaard waterzuivering.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel105
  - number: '106'
    text: |-
      1 Subsidiabel zijn uitgaven voor:

      a. organische onkruidwerende materialen; en

      b. insectengaas.

      2 In het geval van biologisch afbreekbare folie bestemd voor onkruidbestrijding komen alleen de specifieke
      kosten voor biologisch afbreekbare folie in vergelijking met conventionele kunststoffolie in aanmerking voor
      ondersteuning.

      3 Niet subsidiabel zijn:

      a. bodem- en materiaalsterilisatie in de kas; en

      b. vliesdoeken.

      4 De producentenorganisatie onderbouwt het effect van organische onkruidwerende materialen en insectengaas op
      het terugdringen van het gebruik van werkzame stof uit chemische gewasbeschermingsmiddelen, met gebruikmaking
      van een door de minister beschikbaar gesteld middel, aan de hand van een jaarlijkse opgave van het totale gebruik
      aan werkzame stof in kilogram per hectare, uitgesplitst naar gewas(groep) aan de hand van registraties van de
      teeltbedrijven.

      5 Het vierde lid is niet van toepassing op uitgaven die worden gedaan in het kader van de biologische productie van
      groenten en fruit.
    url: https://wetten.overheid.nl/BWBR0041140/2022-05-05#Artikel106
  - number: '107'
    text: |-
      1 Uitgaven voor de aankoop van producten voor biologische of geïntegreerde gewasbescherming en bijbehorende
      apparatuur en de aankoop van andere apparatuur in verband met de toepassing van niet-chemische methoden voor
      gewasbescherming zijn subsidiabel.

      2 In het geval van middelen voor biologische of geïntegreerde gewasbescherming en bijbehorende apparatuur zijn de
      volgende kosten subsidiabel:

      a. macrobiologische bestrijders en nematoden, die zijn toegelaten op grond van de
      [Regeling natuurbescherming][ref1];

      b. microbiologische bestrijders die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref2];

      c. overige gewasbeschermingsmiddelen van natuurlijke oorsprong die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref3];

      d. middelen voor feromoonverwarring die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref4];

      e. feromonen als lokstof;

      f. kalkmelk voor de fruitteelt;

      g. organismen, voeding en middelen voor dosering ter ondersteuning van biologische gewasbescherming;

      i. natuurlijke vijanden waarvoor een ontheffing van de minister geldt; en

      j. natuurlijke vijanden waarvoor het College voor de toelating van gewasbeschermingsmiddelen en biociden een
      "dringend vereiste" vergunning heeft afgegeven.

      3 In het geval van biologische gewasbeschermingsmiddelen zijn de volgende kosten subsidiabel:

      a. verblazingsapparatuur voor het effectief doseren van natuurlijke vijanden;

      b. een scoutbox voor automatische detectie en diagnose van plagen;

      c. eenmalig de kosten voor de scoutbox-softwarelicentie;

      d. vliegenlampen en sporenfilters voor de champignonteelt; en

      e. vangplaten en rollertraps.

      4 Niet subsidiabel zijn:

      a. gewasbescherming van conventionele, niet natuurlijke oorsprong;

      b. toeslag voor behandelingskosten doorbelast door leveranciers of plantenkwekers; en

      c. ondersteunende materialen zoals afdichtingsmateriaal ten behoeve van het afdichten van champignoncellen.

      5 Uitgaven voor een softwarelicentie voor een scoutbox als bedoeld in het derde lid onderdeel c, gedaan voor
      het einde van het kwartaal dat de factuurdatum van de laatste factuur voor de scoutbox omvat, zijn eenmalig
      subsidiabel.

      6 In afwijking van het vierde lid, onderdeel a, zijn gewasbeschermingsmiddelen met door de Europese Commissie
      goedgekeurde laagrisico stoffen en basisstoffen subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0038668
      [ref2]: https://wetten.overheid.nl/BWBR0021670
