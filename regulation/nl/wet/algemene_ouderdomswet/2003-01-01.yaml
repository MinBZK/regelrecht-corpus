---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemene_ouderdomswet
regulatory_layer: WET
publication_date: '2026-02-03'
valid_from: '2003-01-01'
bwb_id: BWBR0002221
url: https://wetten.overheid.nl/BWBR0002221/2003-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte verzekering tegen geldelijke gevolgen van ouderdom;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.1.b
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel1
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke in Nederland hun thuishaven hebben,
      ten opzichte van de bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in de
      Nederlandse Antillen, Aruba of op het grondgebied van een andere Mogendheid te hebben gewoond, wordt ook voor de
      duur van zijn afwezigheid geacht in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel3
  - number: '6.1'
    text: |-
      Verzekerd overeenkomstig de bepalingen van deze wet is degene, die nog niet de leeftijd van 65 jaar heeft bereikt,
      en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland in dienstbetrekking verrichte arbeid aan de loonbelasting is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: '6.4'
    text: 'Bij een maatregel, als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: 6.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a
    text: |-
      Zo nodig in afwijking van [artikel 6][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel6
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
  - number: 6a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6a
  - number: 6a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel6a
  - number: '7'
    text: Recht op ouderdomspensioen overeenkomstig de bepalingen van deze wet heeft degene, die
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel7
  - number: 7.a
    text: de leeftijd van 65 jaar heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel7
  - number: 7.b
    text: |-
      ingevolge deze wet verzekerd is geweest in het tijdvak, aanvangende met de dag waarop de leeftijd van 15 jaar is
      bereikt en eindigende met de dag voorafgaande aan de dag waarop de leeftijd van 65 jaar is bereikt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel7
  - number: '8.1'
    text: |-
      De gehuwde pensioengerechtigde die voor 1 januari 2015 recht heeft op ouderdomspensioen en van wie de echtgenoot
      jonger is dan 65 jaar, heeft overeenkomstig de bepalingen van deze wet recht op een toeslag, tenzij, met
      inachtneming van [artikel 11][ref1], het inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven van
      die echtgenoot meer bedraagt dan de volledige bruto-toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Waar in deze wet en in de tot haar uitvoering genomen besluiten wordt gesproken van ouderdomspensioen wordt
      daaronder mede verstaan de in het eerste lid bedoelde toeslag, voor zover niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8
  - number: 8a.1
    text: |-
      Geen recht op toeslag heeft de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die niet in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.2
    text: |-
      Het eerste lid is niet van toepassing indien de pensioengerechtigde woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op toeslag kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Voor de pensioengerechtigde, wiens recht op toeslag op grond van het eerste lid niet is ontstaan of is geëindigd,
      ontstaat respectievelijk herleeft het recht op toeslag op de eerste dag van de maand:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.3.a
    text: waarin hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.3.b
    text: |-
      waarop een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht is
      geworden in het land waar betrokkene woont, op grond waarvan recht op toeslag kan bestaan;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.4.a
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die werkzaamheden verricht in het algemeen belang
      en niet in Nederland woont;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.4.b
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die op de Nederlandse Antillen of Aruba woont; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.4.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.5
    text: |-
      Voor de toepassing van dit artikel wordt met wonen in Nederland onderscheidenlijk niet wonen in Nederland
      gelijkgesteld het langer dan drie maanden onafgebroken in Nederland verblijven onderscheidenlijk het langer dan
      drie maanden onafgebroken niet in Nederland verblijven. Voor de toepassing van de eerste zin worden perioden van
      verblijf samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: 8a.6
    text: |-
      Onze Minister maakt de landen bekend waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op toeslag kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel8a
  - number: '9.1'
    text: 'Deze wet kent een bruto-ouderdomspensioen voor:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.1.a
    text: de ongehuwde pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.1.b
    text: de gehuwde pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.1.c
    text: |-
      de ongehuwde pensioengerechtigde die een kind heeft jonger dan 18 jaar, dat niet als eigen kind,
      aangehuwd kind of pleegkind tot het huishouden van een ander behoort en voor wie hij op grond van de
      [Algemene Kinderbijslagwet][ref1] (*Stb.* 1990, 128) kinderbijslag ontvangt of zal ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '9.2'
    text: De in het eerste lid bedoelde ouderdomspensioenen worden afgeleid van het netto-minimumloon per maand.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onder het in het tweede lid bedoelde netto-minimumloon wordt verstaan het in
      [artikel 8, eerste lid, onderdeel ][ref1] (*Stb.* 1968, 657) bedoelde bedrag, na aftrek van de premies
      ingevolge de sociale verzekeringswetten en loonbelasting. De loonbelasting en premie voor de volksverzekeringen,
      bedoeld in [artikel 1 van de Wet financiering volksverzekeringen][ref2], worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref3], over het in de vorige volzin bedoelde bedrag, vermeerderd
      met het werkgeversaandeel in de procentuele premie ingevolge de [Ziekenfondswet][ref4] en verminderd met het
      werknemersaandeel in de premie ingevolge de [Werkloosheidswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0002460
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0002460
      - id: ref5
        bwb_id: BWBR0004045
  - number: '9.4'
    text: |-
      Indien ingevolge een van de sociale verzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het derde lid een gemiddeld percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: '9.5'
    text: 'De in het eerste lid bedoelde bruto-ouderdomspensioenen worden zodanig vastgesteld, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.5.a
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel *a*,
      gelijk is aan 70% van het netto-minimumloon per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.5.b
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel *b*,
      gelijk is aan 50% van het netto-minimumloon per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.5.c
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel *c*,
      gelijk is aan 90% van het netto-minimumloon per maand.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: '9.6'
    text: |-
      Onder het in het vijfde lid, onderdeel *a*, bedoelde netto-ouderdomspensioen wordt verstaan het in het tiende lid,
      onderdeel *a*, bedoelde bruto-ouderdomspensioen, na aftrek van:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.6.a
    text: |-
      de loonbelasting en premie voor de volksverzekeringen, voor een persoon van 65 jaar of ouder rekening houdend met
      uitsluitend de algemene heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref1], over
      dat pensioen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
  - number: 9.6.b
    text: |-
      de met toepassing van het geldende premiepercentage, in te houden premie op grond van de [Ziekenfondswet][ref1]
      over dat pensioen, vermeerderd met de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '9.7'
    text: |-
      Onder het in het vijfde lid, onderdeel b, bedoelde netto-ouderdomspensioen wordt verstaan het in het tiende lid,
      onderdeel b, bedoelde bruto-ouderdomspensioen, na aftrek van:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.7.a
    text: |-
      de helft van de loonbelasting en premie voor de volksverzekeringen, voor een persoon van 65
      jaar of ouder, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref1], over tweemaal het bruto-ouderdomspensioen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
  - number: 9.7.b
    text: |-
      de met toepassing van het geldende premiepercentage, in te houden premie op grond van de [Ziekenfondswet][ref1]
      over dat pensioen, vermeerderd met de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '9.8'
    text: |-
      Onder het in het vijfde lid, onderdeel *c*, bedoelde netto-ouderdomspensioen wordt verstaan het in het tiende lid,
      onderdeel *c*, bedoelde bruto-ouderdomspensioen, na aftrek van:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.8.a
    text: |-
      de loonbelasting en premie voor de volksverzekeringen, voor een persoon van 65 jaar of ouder, rekening houdend met
      uitsluitend de algemene heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref1] en de
      alleenstaande-ouderkorting, bedoeld in [artikel 8.15 van de Wet inkomstenbelasting 2001][ref2], over dat pensioen,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 9.8.b
    text: |-
      de met toepassing van het geldende premiepercentage, in te houden premie op grond van de [Ziekenfondswet][ref1]
      over dat pensioen, vermeerderd met de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '9.9'
    text: |-
      De volledige bruto-toeslag, bedoeld in [artikel 8][ref1], is gelijk aan het bruto-ouderdomspensioen, bedoeld in het
      tiende lid, onderdeel *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.10'
    text: |-
      Het bruto-ouderdomspensioen, vastgesteld met inachtneming van het bepaalde bij of krachtens het eerste tot en met
      het achtste lid, bedraagt per maand:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.10.a
    text: voor de pensioengerechtigde, bedoeld in het eerste lid, onderdeel *a*, € 869,24;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.10.b
    text: voor de pensioengerechtigde, bedoeld in het eerste lid, onderdeel *b*, € 598,07;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9.10.c
    text: voor de pensioengerechtigde, bedoeld in het eerste lid, onderdeel *c*, € 1.077,54.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9
  - number: 9a.1
    text: |-
      In afwijking van [artikel 9][ref1] is voor de pensioengerechtigde, die niet in Nederland woont, het bruto-
      ouderdomspensioen gelijk aan het bedrag, bedoeld in [artikel 9, tiende lid, onderdeel b][ref2], onverminderd
      [artikel 13, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.2
    text: |-
      [Artikel 8a, tweede en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8a
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
  - number: 9a.3.a
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref1], die werkzaamheden verricht in
      het algemeen belang en niet in Nederland woont;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3.b
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref1], die op de Nederlandse Antillen
      of Aruba woont; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
  - number: 9a.4
    text: |-
      Onze Minister maakt de landen bekend waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op ouderdomspensioen bestaat alsof de pensioengerechtigde in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel9a
  - number: '10.1'
    text: |-
      De volledige bruto-toeslag wordt toegekend voorzolang, met inachtneming van het bepaalde in [artikel 11][ref1], het
      inkomen uit of in verband met arbeid in het bedrijfs- en beroepsleven van de echtgenoot van de pensioengerechtigde
      nihil bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Op de volledige bruto-toeslag wordt in mindering gebracht het inkomen van de echtgenoot van de pensioengerechtigde
      uit of in verband met arbeid in het bedrijfs- en beroepsleven, vastgesteld met inachtneming van het bepaalde in
      [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '10.3'
    text: |-
      De met toepassing van het tweede lid berekende niet-volledige bruto-toeslag wordt voor de toepassing van
      [artikelen 29, tweede lid][ref1], en [72, tweede lid][ref2], uitgedrukt in een percentage van de volledige bruto-
      toeslag. Dit percentage wordt rekenkundig afgerond op een veelvoud van éénhonderdste.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel72
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '72'
        hoofdstuk: X
  - number: '10.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de vaststelling van het inkomen,
      bedoeld in de vorige leden en in de [artikelen 8, eerste lid][ref1], en [11][ref2], alsmede de periode waarop de
      vaststelling betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11'
    text: |-
      Voor de toepassing van de [artikelen 8][ref1] en [10][ref2] wordt van het inkomen uit arbeid in het bedrijfs- en
      beroepsleven buiten aanmerking gelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: 11.1°
    text: |-
      een bedrag, gelijk aan 15% van het in [artikel 9][ref1] bedoelde bruto-minimumloon; alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 11.2°
    text: |-
      indien en voor zover het inkomen meer bedraagt dan het onder 1° bedoelde bedrag, een derde gedeelte van dat
      inkomen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel11
  - number: '12.1'
    text: |-
      De bedragen, genoemd in [artikel 9, tiende lid][ref1], worden bij ministeriële regeling telkens herzien voor zover
      er in de in [artikel 9, vijfde lid][ref2], respectievelijk negende lid bedoelde gelijkheid een verstoring optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Een herziening overeenkomstig het vorige lid, vindt plaats met ingang van de dag, waarop de verstoring optreedt,
      met dien verstande, dat wanneer de verstoring optreedt met ingang van een andere dag dan de eerste dag van een
      maand, deze herziening plaatsvindt met ingang van de eerste dag van de maand volgende op die, waarin de verstoring
      optreedt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel12
  - number: '12.3'
    text: |-
      De op grond van de vorige leden herziene bedragen treden in de plaats van de bedragen, genoemd in
      [artikel 9, tiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.4'
    text: |-
      Op een beschikking als gevolg van een herziening van de bedragen, genoemd in
      [artikel 9, tiende lid][ref1], ingevolge het bepaalde in dit artikel zijn de [artikelen 3:41][ref2] en
      [3:45 van de Algemene wet bestuursrecht][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.1'
    text: |-
      Op de bedragen, genoemd in [artikel 9, tiende lid][ref1], wordt een korting toegepast van 2%:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13.1.a
    text: |-
      voor elk kalenderjaar, dat de pensioengerechtigde na het bereiken van de 15-jarige, doch vóór het bereiken van de
      65-jarige leeftijd niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
  - number: 13.1.b
    text: |-
      voor elke jaarpremie ingevolge deze wet, welke de pensioengerechtigde na het bereiken van zijn 15-jarige leeftijd
      schuldig nalatig is geweest te betalen als bedoeld in [artikel 18 van de Wet financiering volksverzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel18
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '18'
  - number: '13.2'
    text: |-
      Op de bruto-toeslag wordt, na toepassing van [artikel 10][ref1], een korting toegepast van 2%:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13.2.a
    text: |-
      voor elk kalenderjaar, dat de echtgenoot van de pensioengerechtigde na het bereiken van zijn 15-jarige leeftijd,
      doch vóór het bereiken van de 65-jarige leeftijd van de pensioengerechtigde niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
  - number: 13.2.b
    text: |-
      voor elke jaarpremie ingevolge deze wet, welke de echtgenoot van de pensioengerechtigde na het bereiken van zijn
      15-jarige leeftijd, doch vóór het bereiken van de 65-jarige leeftijd van de pensioengerechtigde schuldig nalatig is
      geweest te betalen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de herleiding van gedeelten van kalenderjaren tot gehele
      kalenderjaren en gedeelten van jaarpremies tot gehele jaarpremies.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt op aanvraag toegekend door de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid is de Sociale verzekeringsbank bevoegd het ouderdomspensioen of een
      verhoging van het ouderdomspensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel14
  - number: '15.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel15
  - number: '15.2'
    text: |-
      De pensioengerechtigde, zijn echtgenoot, dan wel zijn wettelijke vertegenwoordiger of de instelling waaraan
      ingevolge [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht de voorschriften op te volgen die
      de Sociale verzekeringsbank ten behoeve van een doelmatige controle stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Het ouderdomspensioen gaat in op de eerste dag der maand, waarin de belanghebbende aan de voorwaarden voor het
      recht op ouderdomspensioen voldoet.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan een ouderdomspensioen niet vroeger ingaan dan een jaar vóór
      de eerste dag der maand, waarin de aanvraag werd ingediend of waarin ambtshalve toekenning plaatsvond. De Sociale
      verzekeringsbank kan voor bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het ouderdomspensioen wordt door de Sociale verzekeringsbank ingetrokken of herzien, wanneer degene, aan wie het
      is toegekend, ingevolge het bij of krachtens deze wet bepaalde daarvoor niet of niet meer in aanmerking komt,
      onderscheidenlijk voor een hoger of lager ouderdomspensioen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17
  - number: '17.2'
    text: |-
      De herziening van het ouderdomspensioen, welke voortvloeit uit een wijziging der omstandigheden en welke een
      verhoging van dit ouderdomspensioen tot gevolg heeft, gaat in op de eerste dag der maand, waarin de wijziging
      dier omstandigheden heeft plaatsgevonden. Het bepaalde in [artikel 16, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel16
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.3'
    text: |-
      De intrekking van het ouderdomspensioen of de herziening daarvan, welke voortvloeit uit een wijziging der
      omstandigheden en welke een verlaging van dit ouderdomspensioen tot gevolg heeft, gaat, behoudens in de bij
      ministeriële regeling aan te wijzen gevallen, in op de eerste dag der maand, volgende op die, waarin de dag is
      gelegen met ingang waarvan degene, aan wie ouderdomspensioen is toegekend, daarvoor niet meer in aanmerking komt,
      onderscheidenlijk voor een lager ouderdomspensioen in aanmerking komt. Indien het ouderdomspensioen ten onrechte of
      tot een te hoog bedrag is toegekend, wordt het ingetrokken onderscheidenlijk herzien met ingang van de dag, waarop
      het is ingegaan.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17
  - number: '17.4'
    text: |-
      De herziening van het ouderdomspensioen, welke verband houdt met het bepaalde in [artikel 12][ref1], gaat,
      in afwijking van het bepaalde in het tweede en derde lid, in op de dag, met ingang waarvan op grond van
      [artikel 12][ref2] de bedragen, genoemd in [artikel 9][ref3], zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.5'
    text: |-
      Ter uitvoering van dit artikel kunnen bij ministeriële regeling nadere voorschriften worden gegeven. Daarbij
      kunnen tevens regels worden gesteld met betrekking tot schorsing en opschorting van de uitbetaling van het
      ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17
  - number: 17a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van ouderdomspensioen en terzake van weigering van ouderdomspensioen, herziet de Sociale verzekeringsbank een
      dergelijk besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17a
  - number: 17a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15, tweede lid][ref1], of
      [49][ref2], heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17a.1.b
    text: indien anderszins het ouderdomspensioen ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17a
  - number: 17a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 15, tweede lid][ref1], of
      [49][ref2], ertoe leidt dat niet kan worden vastgesteld of nog recht op ouderdomspensioen bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17a
  - number: 17b.1
    text: |-
      Het ouderdomspensioen wordt door de Sociale verzekeringsbank geheel of gedeeltelijk, tijdelijk of blijvend
      geweigerd, indien de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een
      verplichting op grond van [artikel 15, tweede lid][ref1], opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting bedoeld in [artikel 49][ref3] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17b.2
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
  - number: 17b.3
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 49][ref1], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen kan de Sociale verzekeringsbank afzien
      van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van de
      verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17b.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
  - number: 17b.5
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 17c][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
  - number: 17b.6
    text: De Sociale verzekeringsbank stelt nadere regels met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17b
  - number: 17c.1
    text: |-
      Indien de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger de verplichting bedoeld in
      [artikel 49][ref1] niet of niet behoorlijk is nagekomen, legt de Sociale verzekeringsbank hem een boete op van ten
      hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de pensioengerechtigde, zijn
      echtgenoot, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin
      hij verkeert. Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
  - number: 17c.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 49][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen, kan de Sociale verzekeringsbank
      afzien van het opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      boete af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
  - number: 17c.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
  - number: 17c.6
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
  - number: 17c.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17c
  - number: 17d.1
    text: |-
      Indien de Sociale verzekeringsbank jegens de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat aan
      hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de pensioengerechtigde dan wel de betrokken
      persoon niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het betreft de
      boeteoplegging. De pensioengerechtigde, dan wel de betrokken persoon wordt hiervan in kennis gesteld alvorens hem
      mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17d
  - number: 17d.2
    text: |-
      Indien de Sociale verzekeringsbank voornemens is om aan de pensioengerechtigde, dan wel de betrokken persoon een
      boete op te leggen, wordt hiervan kennis gegeven aan de pensioengerechtigde, dan wel de betrokken persoon onder
      vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17d
  - number: 17d.3
    text: |-
      Op verzoek van de pensioengerechtigde, dan wel de betrokken persoon die de in het vorige lid bedoelde kennisgeving
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de Sociale verzekeringsbank
      er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de pensioengerechtigde, dan wel de
      betrokken persoon worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17d
  - number: 17d.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de Sociale verzekeringsbank de
      pensioengerechtigde, dan wel de betrokken persoon in de gelegenheid om naar keuze schriftelijk of mondeling zijn
      zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 17d.5
    text: |-
      Indien de pensioengerechtigde, dan wel de betrokken persoon zijn zienswijze mondeling naar voren brengt, draagt de
      Sociale verzekeringsbank er op verzoek van de pensioengerechtigde, dan wel de betrokken persoon die de Nederlandse
      taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan
      worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17d
  - number: 17e.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 17i][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
  - number: 17e.2
    text: |-
      Op verzoek van de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger die het in het eerste
      lid bedoelde besluit wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de Sociale
      verzekeringsbank er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan hem of hun wordt
      meegedeeld in een voor hem of hun begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17e
  - number: 17e.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17e
  - number: 17f.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17f
  - number: 17f.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de
      pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het
      onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 17f.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan de
      Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17f
  - number: 17g.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat de Sociale verzekeringsbank de pensioengerechtigde, zijn echtgenoot,
      of zijn wettelijke vertegenwoordiger overeenkomstig het bepaalde in [artikel 17][ref1], in de gelegenheid heeft
      gesteld zijn of hun zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of proces-verbaal is
      opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na die waarop het openbaar ministerie aan de
      Sociale verzekeringsbank heeft medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17g
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17g
        hoofdstuk: III
        paragraaf: '2'
  - number: 17g.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17g
  - number: 17h
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de pensioengerechtigde, zijn echtgenoot, of zijn
      wettelijke vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 17i.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het [Tweede Boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend). De titel heeft mede betrekking op de rente en kosten, bedoeld
      in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
  - number: 17i.2
    text: |-
      Indien degene aan wie een boete is opgelegd, ouderdomspensioen op grond van deze wet ontvangt, wordt het besluit
      waarbij de boete is opgelegd tenuitvoergelegd door verrekening met dat pensioen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
  - number: 17i.3
    text: |-
      Indien degene aan wie een boete is opgelegd, een uitkering ontvangt op grond van de [Algemene bijstandswet][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening kunstenaars][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8],
      de[ Wet op de Arbeidsongeschiktheidsverzekering][ref9] of de [Wet arbeid en zorg][ref10] of een toeslag op
      grond van de [Toeslagenwet][ref11], betaalt de betrokken gemeente, onderscheidenlijk het Uitvoeringsinstituut
      werknemersverzekeringen het bedrag van die boete, zonder dat daarvoor diens machtiging nodig is, op haar verzoek
      aan de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0009344
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0002524
      [ref10]: https://wetten.overheid.nl/BWBR0013008
      [ref11]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0009344
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0002524
      - id: ref10
        bwb_id: BWBR0013008
      - id: ref11
        bwb_id: BWBR0004043
  - number: 17i.4
    text: |-
      Indien degene aan wie een boete is opgelegd geen pensioen of uitkering als bedoeld in het tweede of derde lid
      ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde lid niet mogelijk
      is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 17i.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
  - number: 17i.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
  - number: 17i.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door de Sociale verzekeringsbank op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie een boete is
      opgelegd, zijn de [artikelen 479][ref1], behoudens [artikel 479][ref2] van overeenkomstige toepassing. De in
      [artikel 479][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan de
      Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 17i.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat degene aan wie een boete
      is opgelegd en zijn echtgenoot blijven beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 17i.9
    text: |-
      Het achtste lid geldt niet, zolang de belanghebbende zijn verplichting bedoeld in [artikel 17c, vijfde lid][ref1],
      niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Na het overlijden van degene, aan wie ouderdomspensioen is toegekend, wordt met ingang van de dag na het
      overlijden, ouderdomspensioen in de vorm van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: 18.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: 18.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: 18.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen, aan degenen ten aanzien van wie de
      overledene grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '18.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van het ouderdomspensioen over één maand, met uitzondering
      van de toeslag, berekend naar de hoogte van het ouderdomspensioen in de maand van overlijden van degene aan wie
      ouderdomspensioen is toegekend.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '18.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '18.4'
    text: De overlijdensuitkering wordt in een bedrag ineens aan de rechthebbende of rechthebbenden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '18.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan ouderdomspensioen dat, over na het
      overlijden gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '18.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het ouderdomspensioen wordt betaalbaar gesteld door de Sociale verzekeringsbank. De betaling geschiedt als regel
      maandelijks.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19
  - number: '19.2'
    text: |-
      De Sociale verzekeringsbank kan de aan een gehuwde pensioengerechtigde toegekende toeslag betaalbaar stellen aan
      de echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19
  - number: '19.3'
    text: |-
      In geval het ouderdomspensioen in het buitenland wordt uitbetaald, worden de daaraan verbonden kosten van
      overmaking op het ouderdomspensioen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19
  - number: '19.4'
    text: |-
      Wanneer een pensioengerechtigde een ander machtigt om het ouderdomspensioen in ontvangst te nemen,
      onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een
      betalingstermijn, aanvangende na de dag, waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening,
      onderscheidenlijk intrekking der machtiging.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19
  - number: 19a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van het ouderdomspensioen op indien degene aan wie een
      ouderdomspensioen is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 19a.2
    text: |-
      De betaling van het ouderdomspensioen wordt hervat indien betrokkene daartoe een aanvraag indient en het de Sociale
      verzekeringsbank is gebleken dat hij feitelijk buiten Nederland woont of verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19a
  - number: 19b.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de
      pensioengerechtigde verstrekte adres van hemzelf of van zijn echtgenoot afwijkt van het adres waaronder de
      pensioengerechtigde of zijn echtgenoot in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: 19b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: 19b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: 19b.2.b
    text: indien de pensioengerechtigde van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: 19b.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: 19b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel19b
  - number: '20.1'
    text: |-
      Indien degene, aan wie een ouderdomspensioen is toegekend, ingevolge het bepaalde bij of krachtens
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] een bijdrage verschuldigd is in de
      kosten van een verstrekking als bedoeld in de [artikelen 6][ref2] en [11 van die wet][ref3] of een vergoeding
      als bedoeld in de [artikelen 11][ref4] en [12 van die wet][ref5], is de Sociale verzekeringsbank bevoegd
      het ouderdomspensioen tot het bedrag van die bijdrage in plaats van aan degene, aan wie ouderdomspensioen
      is toegekend, zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002614
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '20.2'
    text: |-
      Indien degene, aan wie een ouderdomspensioen is toegekend, in een inrichting ter verpleging van geesteszieken of
      van zwakzinnigen is opgenomen en de Sociale verzekeringsbank, van de desbetreffende inrichting of van de gemeente
      die de opnamekosten betaalt, het verzoek ontvangt om het ouderdomspensioen aan die inrichting of die gemeente
      uit te betalen, is de Sociale verzekeringsbank bevoegd dat verzoek zonder het stellen van andere voorwaarden in
      te willigen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel20
  - number: '20.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op
      het gedeelte van het ouderdomspensioen, dat niet aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1] wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '20.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '22'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      ouderdomspensioen ingevolge deze wet met uitkering bij ouderdom ingevolge de sociale wetgeving van een andere
      Mogendheid.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel22
  - number: '23'
    text: |-
      De termijnen van het ouderdomspensioen, welke niet zijn ingevorderd binnen twee jaren na de eerste dag, waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het ouderdomspensioen dat als gevolg van een besluit als bedoeld in [artikel 17][ref1] onverschuldigd is
      betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de
      pensioengerechtigde, of zijn wettelijke vertegenwoordiger teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de pensioengerechtigde, of zijn wettelijke vertegenwoordiger:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: '24.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen [475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '24.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: '24.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 24a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 24a
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: '24.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24
  - number: 24a.1
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24a
  - number: 24a.2
    text: |-
      [Artikel 17i][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 24, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [24a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 24a
        hoofdstuk: III
        paragraaf: '2'
  - number: '26.1'
    text: 'Het ouderdomspensioen is:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel26
  - number: 26.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel26
  - number: 26.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel26
  - number: '26.2'
    text: |-
      Volmacht tot ontvangst van ouderdomspensioen, onder welke vorm of welke benaming ook door de gepensioneerde
      verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel26
  - number: '26.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel26
  - number: '28'
    text: |-
      Degene, die over een maand recht heeft op ouderdomspensioen, heeft over die maand tevens recht op vakantie-
      uitkering.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel28
  - number: '29.1'
    text: 'De bruto-vakantie-uitkering wordt zodanig vastgesteld, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
  - number: 29.1.a
    text: |-
      de netto-vakantie-uitkering per maand van een gehuwde pensioengerechtigde, aan wie een volledige bruto-toeslag is
      toegekend als bedoeld in [artikel 9, negende lid][ref1], gelijk is aan de netto-minimumvakantiebijslag per maand;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 29.1.b
    text: |-
      de netto-vakantie-uitkering per maand van de ongehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1], gelijk is aan 90% van de netto-minimumvakantiebijslag per maand;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 29.1.c
    text: |-
      de netto-vakantie-uitkering per maand van een ongehuwde pensioengerechtigde gelijk is aan 70% van de netto-
      minimumvakantiebijslag per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
  - number: 29.1.d
    text: |-
      de netto-vakantie-uitkering per maand van de gehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid onderdeel b][ref1], van wie de echtgenoot 65 jaar of ouder is dan wel jonger is dan 65 jaar
      maar voor wie geen recht op toeslag bestaat als bedoeld in [artikel 8, eerste lid][ref2], gelijk is aan 50% van de
      netto-minimumvakantiebijslag per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29.2'
    text: |-
      De bruto-vakantie-uitkering per maand van een gehuwde pensioengerechtigde aan wie een niet-volledige toeslag
      is toegekend met toepassing van het bepaalde in [artikel 10, tweede lid][ref1], is gelijk aan de bruto-
      vakantie-uitkering als bedoeld in het eerste lid, onderdeel *d*, vermeerderd met de met behulp van de in
      [artikel 10, derde lid][ref2], bedoelde percenten over het verschil tussen de vastgestelde bruto-vakantie-uitkering
      als bedoeld in het eerste lid, onderdeel *a* en *d*, berekende bruto-vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29.3'
    text: |-
      Onder de in het eerste lid, onderdelen a tot en met d, bedoelde netto-vakantie-uitkeringen worden verstaan
      de in het zesde lid, onderdelen a tot en met d, bedoelde bruto-vakantie-uitkeringen na aftrek van de
      daarvan in te houden loonbelasting en premie voor de volksverzekeringen voor een persoon van 65 jaar
      of ouder met toepassing van de tabel voor bijzondere beloningen waarin de arbeidskorting, bedoeld in
      [artikel 22a van de Wet op de loonbelasting 1964][ref1], niet is verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 22a
  - number: '29.4'
    text: |-
      Onder de in het eerste lid bedoelde netto-minimumvakantiebijslag wordt
      verstaan de bruto-vakantiebijslag, waarop degene, die aanspraak heeft op het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde
      minimumloon, ingevolge artikel 15 van die wet aanspraak heeft, na aftrek van de daarvan in te houden premies
      ingevolge de sociale verzekeringswetten en loonbelasting. De in te houden loonbelasting en premie ingevolge de
      volksverzekeringen, bedoeld in [artikel 1 van de Wet financiering volksverzekeringen][ref2], worden berekend voor
      een werknemer, jonger dan 65 jaar, met toepassing van de tabel voor bijzondere beloningen waarin de arbeidskorting,
      bedoeld in [artikel 22a van de Wet op de loonbelasting 1964][ref3], niet is verwerkt, over het in de vorige volzin
      bedoelde bedrag, vermeerderd met het werkgeversaandeel in de procentuele premie ingevolge de [Ziekenfondswet][ref4]
      en verminderd met het werknemersaandeel in de premie ingevolge de [Werkloosheidswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0002460
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 22a
      - id: ref4
        bwb_id: BWBR0002460
      - id: ref5
        bwb_id: BWBR0004045
  - number: '29.5'
    text: |-
      Indien ingevolge een van de sociale verzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het vierde lid een gemiddeld percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
  - number: '29.6'
    text: |-
      De bruto-vakantie-uitkering, vastgesteld met inachtneming van het bepaalde bij of krachtens het eerste tot en met
      het vijfde lid, bedraagt per maand:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
  - number: 29.6.a
    text: |-
      voor de gehuwde pensioengerechtigde, aan wie een volledige bruto-toeslag is toegekend als bedoeld in
      [artikel 9, negende lid][ref1], € 62,08;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 29.6.b
    text: |-
      voor de ongehuwde pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], € 55,87;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 29.6.c
    text: voor de ongehuwde pensioengerechtigde, € 43,45;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
  - number: 29.6.d
    text: |-
      voor de gehuwde pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], van wie de echtgenoot
      65 jaar of ouder is dan wel jonger is dan 65 jaar maar voor wie geen recht op toeslag bestaat als bedoeld in
      [artikel 8, eerste lid][ref2], € 31,04.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29.7'
    text: |-
      In de gevallen, dat op het ouderdomspensioen, genoemd in [artikel 9, tiende lid][ref1], met toepassing van
      [artikel 13][ref2] een korting wordt toegepast, wordt op de in het negende lid genoemde bruto-vakantie-uitkering,
      een evenredige korting toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '30.1'
    text: |-
      De bedragen, genoemd in [artikel 29, negende lid][ref1], worden bij ministeriële regeling telkens herzien, voor
      zover er in de in [artikel 29, eerste en tweede lid][ref2], bedoelde gelijkheid een verstoring optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
  - number: '30.2'
    text: |-
      Een herziening overeenkomstig het vorige lid, vindt plaats met ingang van de dag, waarop de verstoring optreedt,
      met dien verstande, dat wanneer de verstoring optreedt met ingang van een andere dag van een maand, deze herziening
      plaatsvindt met ingang van de eerste dag van de maand volgende op die, waarin de verstoring optreedt.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel30
  - number: '30.3'
    text: |-
      De op grond van de vorige leden herziene bedragen treden in de plaats van de bedragen, genoemd in
      [artikel 29, negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
  - number: '31.1'
    text: Eenmaal per jaar vindt ambtshalve uitbetaling van de vakantie-uitkering plaats.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel31
  - number: '31.2'
    text: |-
      De in het vorige lid bedoelde uitbetaling vindt plaats in de maand mei en omvat de vakantie-uitkering, waarop recht
      bestond over de periode van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel31
  - number: '32'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 18][ref1], [19][ref2], [20][ref3], [23][ref4], [24][ref5], [25][ref6],
      [26][ref7] en [49][ref8] vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering, voor zover bij of
      krachtens deze paragraaf niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0002221#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0002221#Artikel26
      [ref8]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002221
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0002221
        artikel: '26'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '33'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot deze paragraaf nadere regels worden gesteld. Daarbij kan worden
      afgeweken van het bepaalde in [artikel 31, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel31
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
  - number: 33a
    text: |-
      Op de toekenning van de vakantie-uitkering zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '34'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder gewezen verzekerde: degene, wiens
      verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel34
  - number: '35.1'
    text: |-
      De gewezen verzekerde van 15 jaar of ouder kan zich, zolang hij de leeftijd van 65 jaar nog niet heeft bereikt,
      vrijwillig verzekeren over een periode van maximaal tien jaar, met ingang van de dag na de dag waarop de verplichte
      verzekering is geëindigd. De eerste zin is alleen van toepassing indien de gewezen verzekerde direct voorafgaande
      aan de periode van vrijwillige verzekering ten minste een jaar verplicht verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: '35.2'
    text: |-
      Indien de periode van vrijwillige verzekering is onderbroken door een periode van verplichte verzekering korter dan
      een jaar, kan de gewezen verzekerde zich opnieuw vrijwillig verzekeren voor de resterende periode van de tien jaar.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: '35.3'
    text: 'De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.a
    text: |-
      de gewezen verzekerde die in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel
      uit anderen hoofde loon geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.b
    text: |-
      de gewezen verzekerde die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in overeenstemming
      met Onze Minister voor Ontwikkelingssamenwerking aan te wijzen organisaties voor ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.c
    text: |-
      de gewezen verzekerde die werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en
      Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.d
    text: |-
      de gewezen verzekerde die werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van
      het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal
      verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie; of
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.e
    text: |-
      de gewezen verzekerde, die op de dag waarop de verplichte verzekering is geëindigd de leeftijd van 50 jaar heeft
      bereikt, niet in Nederland woont en recht heeft op een:
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.e.1°
    text: |-
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 35.3.e.2°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 35.3.e.3°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 35.3.e.4°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 35.3.e.5°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de [Wet privatisering Spoorwegpensioenfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006319
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006319
  - number: 35.3.e.6°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de Algemene militaire pensioenwet, zoals die luidde voor 1
      januari 1998; of
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: 35.3.e.7°
    text: |-
      nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref1],
      mits die uitkering of dat pensioen ten minste gelijk is aan 35% van het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2] bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '35.4'
    text: |-
      De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op de echtgenoot van de in het
      derde lid genoemde gewezen verzekerde en de inwonende minderjarige kinderen met wie die gewezen verzekerde of die
      echtgenoot in familierechtelijke betrekking staat. Voor de toepassing van dit lid wordt onder de in het derde lid
      genoemde gewezen verzekerde mede verstaan de gewezen verzekerde, bedoeld in onderdeel e van dat lid, wiens recht
      op een uitkering als bedoeld in dat onderdeel uitsluitend als gevolg van het bereiken van de leeftijd van 65 jaar
      is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: '35.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel35
  - number: '36.1'
    text: |-
      De gewezen verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], gebruik wil
      maken, is verplicht uiterlijk een jaar na de dag, waarop de verplichte verzekering is geëindigd, een aanvraag
      daartoe in te dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: '36.2'
    text: |-
      De aanvraag wordt afgewezen indien de gewezen verzekerde niet voldoet aan de bij of krachtens dit hoofdstuk
      gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel36
  - number: '37.1'
    text: |-
      De vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: 37.1.a
    text: |-
      indien de gewezen verzekerde schriftelijk aan de Sociale verzekeringsbank te kennen geeft niet langer van de
      vrijwillige verzekering gebruik te willen maken;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
  - number: 37.1.b
    text: met ingang van de dag, waarop de gewezen verzekerde 65 jaar wordt;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
  - number: 37.1.c
    text: |-
      met ingang van de dag, waarop de periode van tien jaar, bedoeld in [artikel 35, eerste lid][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: 37.1.d
    text: met ingang van de dag, waarop de gewezen verzekerde verplicht verzekerd wordt op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
  - number: 37.1.e
    text: |-
      indien de verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering, bedoeld in
      [artikel 26 van de Wet financiering volksverzekeringen][ref1], uiterlijk drie maanden na een door de Sociale
      verzekeringsbank vastgestelde termijn niet of niet geheel is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel26
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '26'
  - number: 37.1.f
    text: |-
      indien de gewezen verzekerde de van hem, in verband met de toepassing van dit hoofdstuk, verlangde inlichtingen
      niet binnen een door de Sociale verzekeringsbank gestelde termijn heeft verstrekt, tenzij de gewezen verzekerde
      aannemelijk maakt dat dat hem niet in overwegende mate kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
  - number: '37.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a, e en f, wordt de vrijwillige verzekering geacht te zijn
      geëindigd, met ingang van de dag volgende op die waarover voor het laatst premie is betaald.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel37
  - number: '38.1'
    text: |-
      De verzekerde, die voorafgaand aan de verplichte verzekering niet eerder verplicht verzekerd is geweest, kan zich,
      zolang hij de leeftijd van 65 jaar nog niet heeft bereikt, vrijwillig verzekeren vanaf de 15-jarige leeftijd, over
      de achterliggende periode, waarin hij niet verplicht verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel38
  - number: '38.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel38
  - number: '39.1'
    text: |-
      De verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 38, eerste lid][ref1], gebruik wil maken, is
      verplicht uiterlijk vijf jaar na de dag, waarop de verplichte verzekering is ontstaan, een aanvraag daartoe in te
      dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '38'
        hoofdstuk: IV
  - number: '39.2'
    text: |-
      De [artikelen 36, tweede lid][ref1], en [37, eerste lid, onderdelen e en f, en tweede lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel37
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '37'
        hoofdstuk: IV
  - number: '47'
    text: |-
      Degene, die gemoedsbezwaren heeft tegen de in deze wet geregelde verzekering, alsmede de rechtspersoon waarbij
      natuurlijke personen zijn betrokken die zodanige gemoedsbezwaren hebben, kunnen van verplichtingen, welke hun bij
      of krachtens [Hoofdstuk II van de Wet financiering volksverzekeringen][ref1] zijn opgelegd, overeenkomstig het bij
      of krachtens [paragraaf 8 van dat hoofdstuk][ref2] bepaalde, worden vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004538
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004538
        paragraaf: '8'
  - number: '48.1'
    text: |-
      Degene, van wie ingevolge [artikel 20 van de Wet financiering volksverzekeringen][ref1] belasting is geheven of in
      door Onze Minister en Onze Minister van Financiën bij ministeriële regeling aan te wijzen gevallen geacht wordt te
      zijn geheven, heeft recht op een uitkering, indien en zolang hij recht heeft op ouderdomspensioen krachtens deze
      wet en hij wegens gemoedsbezwaren geen aanspraak maakt op dit ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '20'
  - number: '48.2'
    text: |-
      Degene, die ingevolge het eerste lid recht op een uitkering heeft, dient de Sociale verzekeringsbank schriftelijk
      in kennis te stellen, zodra naar zijn oordeel het totaal aan uitkering betaalde bedragen heeft overschreden
      het totaal van de bedragen, die van hem op grond van de in de aanhef van het eerste lid bedoelde bepalingen aan
      belasting zijn geheven of geacht worden te zijn geheven. De uitbetaling van deze uitkering wordt dan beëindigd met
      ingang van een betalingstermijn, aanvangende na de dag, waarop de kennisgeving door de Sociale verzekeringsbank is
      ontvangen, doch niet later dan de eerste dag van de tweede maand na de dag van ontvangst van die kennisgeving.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: '48.3'
    text: 'Voor de toepassing van het bepaalde in het vorige lid wordt het totaal van de aan belasting geheven bedragen:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: 48.3.a
    text: verminderd met de bedragen die niet zijn ingevorderd, dan wel die de verzekerde nalatig is gebleven te betalen;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: 48.3.b
    text: vermeerderd met een door de in het eerste lid bedoelde uitkeringsgerechtigde te bepalen opslag.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: '48.4'
    text: |-
      Het bedrag van de uitkering is gelijk aan het bedrag aan ouderdomspensioen en vakantie-uitkering, waarop de
      belanghebbende krachtens deze wet recht heeft.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: '48.5'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 14 tot en met 26][ref1], [31][ref2] en [33][ref3] is, voorzover daarvan
      in bij ministeriële regeling te stellen regels niet wordt afgeweken, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel33
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '33'
        hoofdstuk: III
        paragraaf: '3'
  - number: '48.6'
    text: |-
      Het bepaalde bij [artikel 49][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '48.7'
    text: |-
      Onze Minister en Onze Minister van Financiën kunnen bij ministeriële regeling ter zake van het bepaalde in het
      eerste tot en met het zesde lid nadere regels en uitvoeringsvoorschriften geven.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel48
  - number: '49'
    text: |-
      De pensioengerechtigde, zijn echtgenoot, alsmede zijn wettelijke vertegenwoordiger of de instelling waaraan
      ingevolge [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering of op het bedrag van de uitkering, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
  - number: '51.1'
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel51
  - number: '51.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel51
  - number: '51.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel51
  - number: '51.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel51
  - number: '52'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '53.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [2][ref2], [3][ref3]
      en [6][ref4] en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel6
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '3'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
  - number: '53.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel53
  - number: '55.1'
    text: |-
      Degene, die vóór het in werking treden van [artikel 6][ref1] de leeftijd van 15, doch nog niet die van 65
      jaar heeft bereikt, en die - al dan niet onafgebroken - gedurende zes jaren na de voleindiging van zijn 59ste
      levensjaar in Nederland, de Nederlandse Antillen of Aruba heeft gewoond, wordt voor de toepassing van het
      bepaalde in [artikel 13, eerste lid, onderdeel a][ref2], gedurende het tijdvak, gelegen tussen de voleindiging
      van zijn 15de levensjaar en het in werking treden van [artikel 6][ref3], geacht verzekerd te zijn geweest. Voor
      de toepassing van het bepaalde in de vorige volzin wordt, uitsluitend voor de vaststelling van de toeslag, bedoeld
      in [artikel 8][ref4] met toepassing van het bepaalde in [artikel 13, tweede lid, onderdeel a][ref5], de jongere
      echtgenoot van de pensioengerechtigde geacht het 59ste levensjaar te hebben voleindigd op dezelfde dag als de
      pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '55.2'
    text: |-
      Degene, die voldoet aan het bepaalde in de eerste volzin van het eerste lid, doch nimmer ingevolge deze wet
      verzekerd is geweest, wordt nochtans voor de toepassing van [artikel 7][ref1] geacht verzekerd te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '56'
    text: |-
      De voordelen uit [artikel 55][ref1] voortvloeiende komen enkel toe aan degene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel55
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '55'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 56.a
    text: Nederlander is, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel56
  - number: 56.b
    text: in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel56
  - number: '57'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel57
  - number: 57.a
    text: |-
      voor de toepassing van [artikel 56][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 57.b
    text: |-
      voor de toepassing van de [artikelen 55][ref1] en [56][ref2] het wonen buiten Nederland wordt gelijkgesteld met het
      wonen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '55'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '56'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '58'
    text: |-
      Degene, die vóór of op de dag van het in werking treden van [artikel 7][ref1] de leeftijd van 65 jaar heeft bereikt
      en die - al dan niet onafgebroken - gedurende zes jaren na de voleindiging van zijn 59ste levensjaar in Nederland,
      de Nederlandse Antillen of Aruba heeft gewoond, heeft recht op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '59'
    text: |-
      Voor het recht op ouderdomspensioen overeenkomstig [artikel 58][ref1] is vereist, dat de belanghebbende:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel58
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: 59.a
    text: Nederlander is, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel59
  - number: 59.b
    text: in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel59
  - number: '60'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel60
  - number: 60.a
    text: |-
      voor de toepassing van [artikel 59][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel59
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '59'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: 60.b
    text: |-
      voor de toepassing van de [artikelen 58][ref1] en [59][ref2] het wonen buiten Nederland wordt gelijkgesteld met het
      wonen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel59
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '59'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '61'
    text: |-
      Ten aanzien van het bedrag van het ouderdomspensioen bedoeld in [artikel 58][ref1], blijft [artikel 13][ref2]
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '62.1'
    text: 'Artikel 8a is tot 1 januari 2004 niet van toepassing op de pensioengerechtigde, die:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.1.a
    text: op 31 december 1999 op grond van artikel 8 recht heeft op een toeslag;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.1.b
    text: op die dag niet woont in Nederland, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.1.c
    text: op 1 januari 2003 woont in een van de in het vierde lid aangewezen landen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: '62.2'
    text: 'Artikel 9a is tot 1 januari 2004 niet van toepassing op de pensioengerechtigde, die:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.2.a
    text: |-
      op 31 december 1999 aanspraak heeft op een bruto-ouderdomspensioen gelijk aan het bedrag, bedoeld in artikel 9,
      tiende lid, onderdeel a of c;
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.2.b
    text: op die dag niet woont in Nederland, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.2.c
    text: op 1 januari 2003 woont in een van de in het vierde lid aangewezen landen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: '62.3'
    text: 'Het eerste en tweede lid is van overeenkomstige toepassing op de pensioengerechtigde, die:'
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.3.a
    text: |-
      op en na 1 februari 1994 recht heeft op ouderdomspensioen op grond van artikel II van de wet van 23 oktober 1993
      tot wijziging van de Algemene Ouderdomswet (wijziging in de verhouding van ouderdomspensioen en toeslag, Stb. 592);
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.3.b
    text: op 31 december 1999 niet woont in Nederland, en
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: 62.3.c
    text: op 1 januari 2003 woont in een van de in het vierde lid aangewezen landen.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: '62.4'
    text: |-
      Voor de toepassing van het eerste tot en met derde lid worden de volgende landen aangewezen: Armenië, Barbados,
      Belize, Benin, Burkina Faso, Botswana, China, Colombia, Dominicaanse Republiek, Eritrea, Ethiopië, Gambia, Ghana,
      Guatemala, Honduras, Jamaica, Japan, Kenia, Koeweit, Madagaskar, Maleisië, Mali, Mauritius, Nicaragua, Nigeria,
      Oekraïne, Pakistan, Russische Federatie, Sri Lanka, St. Vincent & Grenadines, Swaziland, Tanzania, Togo, Venezuela,
      Verenigd Koninkrijk van Groot-Britannië en Noord-Ierland, uitsluitend voorzover het de Baljuwschappen Jersey en
      Guernsey betreffen, Vietnam en Zimbabwe.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: '62.5'
    text: Dit artikel vervalt met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel62
  - number: '65'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie. Het feit wordt beschouwd als een overtreding. Het in de eerste zin
      bedoelde feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel65
  - number: '68'
    text: |-
      Het recht tot strafvordering vervalt indien de Sociale verzekeringsbank aan de pensioengerechtigde, zijn
      echtgenoot, of zijn wettelijke vertegenwoordiger ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel68
  - number: '70'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel70
  - number: '71.1'
    text: |-
      Indien in een pensioenregeling van een pensioenfonds of van een werkgever bepalingen zijn of worden opgenomen
      krachtens welke op enigerlei wijze geheel of gedeeltelijk met het ouderdomspensioen ingevolge deze wet rekening
      wordt gehouden, dient bij de toepassing van deze bepalingen in acht te worden genomen, dat een verhoging van het
      ouderdomspensioen op grond van [artikel 12][ref1], welke plaatsvindt na de datum van beëindiging van de actieve
      deelneming aan de pensioenregeling, buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel12
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '71.2'
    text: |-
      Het eerste lid is niet van toepassing op pensioenregelingen waarin bepalingen zijn opgenomen volgens welke het
      ouderdomspensioen ingevolge deze wet en de premievrije aanspraken of het pensioen van die regeling tezamen na
      beëindiging van de actieve deelneming jaarlijks ten minste worden verhoogd met het percentage van de in het eerste
      lid bedoelde verhoging van het ouderdomspensioen of het percentage van de loon- of prijsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel71
  - number: '75.1'
    text: Deze wet kan worden aangehaald onder de titel "Algemene Ouderdomswet".
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel75
  - number: '75.2'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2003-01-01#Artikel75
