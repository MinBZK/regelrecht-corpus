  - number: '40'
    text: |-
      In afwijking van [hoofdstuk IV][ref1], [hoofdstuk III van de Wet financiering volksverzekeringen][ref2] en
      [hoofdstuk 6 van de Wet financiering sociale verzekeringen][ref3], kunnen bij of krachtens algemene maatregel van
      bestuur regels worden gesteld voor de vrijwillige verzekering van de gewezen verzekerde die niet in Nederland woont
      maar wel in een andere lidstaat van de Europese Unie, in een land aangesloten bij de Europese Economische Ruimte
      dan wel in Zwitserland, en in Nederland verplicht verzekerd is gebleven voor een of meer andere takken van sociale
      zekerheid genoemd in artikel 4, eerste lid, van de [Verordening (EEG) nr.1408/71](31971R1408) van de Raad van de
      Europese gemeenschappen van 14 juni 1971 betreffende de toepassing van de socialezekerheidsregelingen op werknemers
      en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de gemeenschap verplaatsen (PbEG L 149).


      [ref1]: https://wetten.overheid.nl/BWBR0004538#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004538#HoofdstukIII
