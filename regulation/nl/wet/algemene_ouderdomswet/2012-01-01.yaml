  - number: '26'
    text: |-
      1 Het ouderdomspensioen is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening.

      2 Volmacht tot ontvangst van ouderdomspensioen, onder welke vorm of welke benaming ook door de gepensioneerde
      verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel26
  - number: '28'
    text: |-
      Degene, die over een maand recht heeft op ouderdomspensioen, heeft over die maand tevens recht op vakantie-
      uitkering.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel28
  - number: '29'
    text: |-
      1 De bruto-vakantie-uitkering wordt zodanig vastgesteld, dat:

      a. de netto-vakantie-uitkering per maand van de ongehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1], gelijk is aan 90% van de netto-minimumvakantiebijslag per maand;

      b. de netto-vakantie-uitkering per maand van een ongehuwde pensioengerechtigde gelijk is aan 70% van de netto-
      minimumvakantiebijslag per maand;

      c. de netto-vakantie-uitkering per maand van de gehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid onderdeel b][ref2], van wie de echtgenoot 65 jaar of ouder is dan wel jonger is dan 65 jaar
      maar voor wie geen recht op toeslag bestaat als bedoeld in [artikel 8, eerste lid][ref3], gelijk is aan 50% van de
      netto-minimumvakantiebijslag per maand.

      2 De bruto-vakantie-uitkering per maand van een gehuwde pensioengerechtigde:

      a. aan wie een volledige toeslag is toegekend is gelijk aan tweemaal de bruto-vakantie-uitkering als bedoeld in het
      eerste lid, onderdeel c;

      b. aan wie een niet-volledige toeslag is toegekend met toepassing van [artikel 10, tweede lid][ref4],
      [artikel 13, tweede lid][ref5], of [artikel 12, eerste lid][ref6], is gelijk aan de bruto-vakantie-uitkering,
      bedoeld in het eerste lid, onderdeel c, vermeerderd met de met behulp van de in artikel 12, tweede lid, bedoelde
      percenten over het verschil tussen de vastgestelde bruto-vakantie-uitkering, bedoeld in onderdeel a en de
      vastgestelde bruto-vakantie-uitkering, bedoeld in het eerste lid, onderdeel c.

      3 De in het eerste lid bedoelde netto minimumvakantiebijslag bedraagt het verschil tussen het bedrag, dat
      voor een werknemer jonger dan 65 jaar ontstaat door toepassing van [artikel 9, derde lid][ref7], op het in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref8] bedoelde bedrag
      vermeerderd met de aanspraak op vakantiebijslag op grond van [artikel 15 van die wet][ref9] van degene die
      aanspraak heeft op laatstgenoemd bedrag, en het netto-minimumloon, bedoeld in [artikel 9, derde lid][ref10].

      4 In de gevallen, dat op het ouderdomspensioen, vastgesteld op grond van [artikel 9][ref11], met toepassing van
      [artikel 13, eerste lid][ref12], een korting wordt toegepast, wordt op de, op grond van het eerste en derde lid,
      vastgestelde bruto-vakantie-uitkering, een evenredige korting toegepast.


