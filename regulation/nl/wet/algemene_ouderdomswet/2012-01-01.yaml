  - number: 9a
    text: |-
      1 In afwijking van [artikel 9][ref1] is voor de pensioengerechtigde, die niet in Nederland woont, het
      bruto-ouderdomspensioen gelijk aan het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref2], onverminderd [artikel 13, eerste lid][ref3].

      2 [Artikel 8a, tweede lid][ref4], is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:

      a. de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref5], die werkzaamheden verricht
      in het algemeen belang en niet in Nederland woont;

      b. de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref6], die in Aruba, Curaçao, Sint
      Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.

      4 Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op ouderdomspensioen bestaat alsof de pensioengerechtigde in Nederland woont. In deze mededeling
      wordt tevens opgenomen:

      a. de vindplaats van het desbetreffende verdrag of besluit, en

      b. de eventueel in dat verdrag of besluit aanwezige beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
