  - number: '57'
    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald, dat:

      a. voor de toepassing van [artikel 56][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;

      b. voor de toepassing van de [artikelen 55][ref2] en [56][ref3] het wonen buiten Nederland wordt gelijkgesteld met
      het wonen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel56
