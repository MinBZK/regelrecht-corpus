        artikel: '71'
  - number: '38'
    text: |-
      1 De verzekerde, die voorafgaand aan de verplichte verzekering niet eerder verplicht verzekerd is geweest, kan
      zich, zolang hij de leeftijd van 65 jaar nog niet heeft bereikt, vrijwillig verzekeren vanaf de 15-jarige leeftijd,
      over de achterliggende periode, waarin hij niet verplicht verzekerd is geweest.

      2 Voor de toepassing van het eerste lid wordt degene wiens verplichte verzekering voor het bereiken van de 15-
      jarige leeftijd is beëindigd, geacht niet verplicht verzekerd te zijn geweest gedurende de periode voorafgaand aan
      het bereiken van de 15-jarige leeftijd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel38
  - number: '39'
    text: |-
      1 De verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 38, eerste lid][ref1], gebruik wil maken,
      is verplicht uiterlijk tien jaar na de dag, waarop de verplichte verzekering is ontstaan, een aanvraag daartoe in
      te dienen bij de Sociale verzekeringsbank.

      2 De [artikelen 36, tweede lid][ref2], en [37, onderdelen e en f][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel37
