  - number: 17a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van ouderdomspensioen en terzake van weigering van ouderdomspensioen, herziet de Sociale verzekeringsbank een
      dergelijk besluit of trekt zij dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15, tweede lid][ref1],
      of [49][ref2], heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen;

      b. indien anderszins het ouderdomspensioen ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 15, tweede lid][ref3],
      of [49][ref4], ertoe leidt dat niet kan worden vastgesteld of nog recht op ouderdomspensioen bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel17a
