  - number: '64'
    text: |-
      Ten aanzien van de persoon wiens vrijheid op de dag voorafgaande aan de inwerkingtreding van [artikel 8b][ref1]
      reeds rechtens was ontnomen wordt voor de toepassing van [dat artikel][ref2] als eerste dag waarop de
      vrijheidsontneming plaatsvindt, aangemerkt de dag van inwerkingtreding van [artikel 8b][ref3] en eindigt het recht
      op ouderdomspensioen in afwijking van [artikel 8b, tweede lid][ref4], vanaf de dag dat deze vrijheidsontneming
      zes maanden heeft geduurd. De beëindiging gaat in op de eerste dag van de maand volgend op de maand waarin de
      vrijheidsontneming als bedoeld in de eerste zin zes maanden heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
