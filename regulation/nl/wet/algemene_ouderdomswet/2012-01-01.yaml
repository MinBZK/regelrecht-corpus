  - number: 17e
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 17i, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
