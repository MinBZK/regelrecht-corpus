  - number: 17c
    text: |-
      1 De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste € 2 269 ter zake van het niet of
      niet behoorlijk nakomen door de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger van de
      verplichting, bedoeld in [artikel 49][ref1].

      2 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het eerste
      lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen
      van de verplichting, bedoeld in [artikel 49][ref2], indien dit niet heeft geleid tot het ten onrechte of tot een
      te hoog bedrag verlenen van ouderdomspensioen, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de pensioengerechtigde,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.

      3 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.

      4 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
