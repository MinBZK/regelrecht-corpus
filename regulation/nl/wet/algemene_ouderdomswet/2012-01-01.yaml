  - number: '31'
    text: |-
      1 Eenmaal per jaar vindt ambtshalve uitbetaling van de vakantie-uitkering plaats.

      2 De in het vorige lid bedoelde uitbetaling vindt plaats in de maand mei en omvat de vakantie-uitkering, waarop
      recht bestond over de periode van twaalf maanden, voorafgaande aan de maand mei.

      3 De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel31
  - number: '32'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 18][ref1], [19][ref2], [20][ref3], [23][ref4], [24][ref5], [25][ref6],
      [26][ref7] en [49][ref8] vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering, voor zover bij of
      krachtens deze paragraaf niet anders is bepaald.


