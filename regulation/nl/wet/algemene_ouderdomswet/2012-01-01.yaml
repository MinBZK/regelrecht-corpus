  - number: '18'
    text: |-
      1 Na het overlijden van degene, aan wie ouderdomspensioen is toegekend, wordt met ingang van de dag na het
      overlijden, ouderdomspensioen in de vorm van een overlijdensuitkering uitbetaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel a bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.

      2 De overlijdensuitkering is gelijk aan het bedrag van het ouderdomspensioen over één maand, met uitzondering
      van de toeslag, berekend naar de hoogte van het ouderdomspensioen in de maand van overlijden van degene aan wie
      ouderdomspensioen is toegekend.

      3 De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.

      4 De overlijdensuitkering wordt in een bedrag ineens aan de rechthebbende of rechthebbenden uitbetaald.

      5 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan ouderdomspensioen dat, over na het
      overlijden gelegen dagen, reeds is uitbetaald.

      6 De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel18
  - number: '19'
    text: |-
      1 De Sociale verzekeringsbank betaalt het ouderdomspensioen waarop op grond van deze wet recht bestaat. De betaling
      geschiedt als regel maandelijks.

      2 De Sociale verzekeringsbank kan de aan een gehuwde pensioengerechtigde toegekende toeslag betaalbaar stellen aan
      de echtgenoot.

      3 Indien het ouderdomspensioen in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.

      4 Wanneer een pensioengerechtigde een ander machtigt om het ouderdomspensioen in ontvangst te nemen,
      onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een
      betalingstermijn, aanvangende na de dag, waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening,
      onderscheidenlijk intrekking der machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel489
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel19
