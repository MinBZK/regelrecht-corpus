  - number: '55'
    text: |-
      1 Degene, die vóór het in werking treden van [artikel 6][ref1] de leeftijd van 15, doch nog niet die van 65
      jaar heeft bereikt, en die - al dan niet onafgebroken - gedurende zes jaren na de voleindiging van zijn 59ste
      levensjaar in Nederland, Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en
      Saba heeft gewoond, wordt voor de toepassing van het bepaalde in [artikel 13, eerste lid, onderdeel a][ref2],
      gedurende het tijdvak, gelegen tussen de voleindiging van zijn 15de levensjaar en het in werking treden van
      [artikel 6][ref3], geacht verzekerd te zijn geweest. Voor de toepassing van het bepaalde in de vorige volzin wordt,
      uitsluitend voor de vaststelling van de toeslag, bedoeld in [artikel 8][ref4] met toepassing van het bepaalde in
      [artikel 13, tweede lid, onderdeel a][ref5], de jongere echtgenoot van de pensioengerechtigde geacht het 59ste
      levensjaar te hebben voleindigd op dezelfde dag als de pensioengerechtigde.

      2 Degene, die voldoet aan het bepaalde in de eerste volzin van het eerste lid, doch nimmer ingevolge deze wet
      verzekerd is geweest, wordt nochtans voor de toepassing van [artikel 7][ref6] geacht verzekerd te zijn geweest.


