  - number: '14'
    text: |-
      1 Het ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt op aanvraag toegekend door de Sociale
      verzekeringsbank.

      2 In afwijking van het bepaalde in het vorige lid is de Sociale verzekeringsbank bevoegd het ouderdomspensioen of
      een verhoging van het ouderdomspensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet
      verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De pensioengerechtigde, zijn echtgenoot, dan wel zijn wettelijke vertegenwoordiger of de instelling waaraan
      ingevolge [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht de voorschriften op te volgen die
      de Sociale verzekeringsbank ten behoeve van een doelmatige controle stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16'
    text: |-
      1 Het ouderdomspensioen gaat in op de eerste dag der maand, waarin de belanghebbende aan de voorwaarden voor het
      recht op ouderdomspensioen voldoet.

      2 In afwijking van het bepaalde in het eerste lid kan een ouderdomspensioen niet vroeger ingaan dan een jaar vóór
      de eerste dag der maand, waarin de aanvraag werd ingediend of waarin ambtshalve toekenning plaatsvond. De Sociale
      verzekeringsbank kan voor bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het ouderdomspensioen wordt door de Sociale verzekeringsbank ingetrokken of herzien, wanneer degene, aan wie
      het is toegekend, ingevolge het bij of krachtens deze wet bepaalde daarvoor niet of niet meer in aanmerking komt,
      onderscheidenlijk voor een hoger of lager ouderdomspensioen in aanmerking komt.

      2 In afwijking van het eerste lid vindt geen herziening van het ouderdomspensioen plaats indien:

      a. sprake is van zorg voor een pensioengerechtigde die hulpbehoevend is als bedoeld in
      [artikel 1, onderdeel j, van de Algemene nabestaandenwet][ref1];

      b. door deze zorg een gezamenlijke huishouding ontstaat van twee pensioengerechtigden, en

      c. de pensioengerechtigde en de hulpbehoevende pensioengerechtigde ieder beschikken over een woning en daarvoor de
      financiële lasten dragen.

      3 De herziening van het ouderdomspensioen, welke voortvloeit uit een wijziging der omstandigheden en welke een
      verhoging van dit ouderdomspensioen tot gevolg heeft, gaat in op de eerste dag der maand, waarin de wijziging
      dier omstandigheden heeft plaatsgevonden. Het bepaalde in [artikel 16, tweede lid][ref2], is van overeenkomstige
      toepassing.

      4 De intrekking van het ouderdomspensioen of de herziening daarvan, welke voortvloeit uit een wijziging der
      omstandigheden en welke een verlaging van dit ouderdomspensioen tot gevolg heeft, gaat, behoudens in de bij
      ministeriële regeling aan te wijzen gevallen, in op de eerste dag der maand, volgende op die, waarin de dag is
      gelegen met ingang waarvan degene, aan wie ouderdomspensioen is toegekend, daarvoor niet meer in aanmerking komt,
      onderscheidenlijk voor een lager ouderdomspensioen in aanmerking komt. Indien het ouderdomspensioen ten onrechte of
      tot een te hoog bedrag is toegekend, wordt het ingetrokken onderscheidenlijk herzien met ingang van de dag, waarop
      het is ingegaan.

      5 De herziening van het ouderdomspensioen als gevolg van een wijziging van het netto-minimumloon gaat, in afwijking
      van het bepaalde in het derde en vierde lid, in op de dag waarop het netto-minimumloon is herzien.

      6 De beëindiging van het ouderdomspensioen op grond van [artikel 8b, tweede lid][ref3], gaat in op de eerste dag
      van de maand volgend op de maand waarin de vrijheidsontneming een maand heeft geduurd.

      7 Ter uitvoering van dit artikel kunnen bij ministeriële regeling nadere voorschriften worden gegeven. Daarbij
      kunnen tevens regels worden gesteld met betrekking tot schorsing en opschorting van de uitbetaling van het
      ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel17
