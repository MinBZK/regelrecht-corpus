        artikel: '49'
        hoofdstuk: VI
  - number: 17b
    text: |-
      1 De Sociale verzekeringsbank weigert het ouderdomspensioen geheel of gedeeltelijk, tijdelijk of
      blijvend, indien de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een
      verplichting, hem op grond van [artikel 15, tweede lid][ref1], opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 49][ref3] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.

      3 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en
      volstaan met het geven van een schriftelijke waarschuwing ter zake het niet tijdig nakomen van de verplichting,
      bedoeld in [artikel 49][ref4], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen, tenzij het niet tijdig nakomen van
      de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      belanghebbende een zodanige waarschuwing is gegeven.

      4 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.

      5 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 17c][ref5] wordt opgelegd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
