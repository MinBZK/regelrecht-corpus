  - number: 24a
    text: |-
      1 De Sociale verzekeringsbank kan het onverschuldigd betaalde ouderdomspensioen, bedoeld in
      [artikel 24, eerste lid][ref1], invorderen bij dwangbevel.

      2 [Artikel 17i][ref2] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref3] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref4] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


