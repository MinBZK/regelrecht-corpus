  - number: '13'
    text: |-
      1 Op het bruto-ouderdomspensioen, vastgesteld op grond van [artikel 9][ref1] wordt een korting toegepast van 2%:

      a. voor elk kalenderjaar, dat de pensioengerechtigde na het bereiken van de 15-jarige, doch vóór het bereiken van
      de 65-jarige leeftijd niet verzekerd is geweest;

      b. voor elke jaarpremie op grond van de [Wet financiering sociale verzekeringen][ref2], welke de
      pensioengerechtigde na het bereiken van zijn 15-jarige leeftijd schuldig nalatig is geweest te betalen als bedoeld
      in [artikel 61 van die wet][ref3].

      2 Op de bruto-toeslag wordt, na toepassing van [artikel 10][ref4], een korting toegepast van 2%:

      a. voor elk kalenderjaar, dat de echtgenoot van de pensioengerechtigde na het bereiken van zijn 15-jarige leeftijd,
      doch vóór het bereiken van de 65-jarige leeftijd van de pensioengerechtigde niet verzekerd is geweest;

      b. voor elke jaarpremie op grond van de [Wet financiering sociale verzekeringen][ref5], welke de echtgenoot van de
      pensioengerechtigde na het bereiken van zijn 15-jarige leeftijd, doch vóór het bereiken van de 65-jarige leeftijd
      van de pensioengerechtigde schuldig nalatig is geweest te betalen.

      3 Bij ministeriële regeling worden regels gesteld omtrent de herleiding van gedeelten van kalenderjaren tot gehele
      kalenderjaren en gedeelten van jaarpremies tot gehele jaarpremies.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017745
