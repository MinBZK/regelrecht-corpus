  - number: '11'
    text: |-
      Voor de toepassing van de [artikelen 8][ref1] en [10][ref2] wordt van het inkomen uit arbeid buiten aanmerking
      gelaten:

      1°. een bedrag, gelijk aan 15% van het bruto-minimumloon; alsmede

      2°. voor zover het inkomen uit arbeid meer bedraagt dan het onder 1° bedoelde bedrag, een derde gedeelte van dat
      meerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
