        artikel: 4:89
  - number: 19a
    text: |-
      1 De Sociale verzekeringsbank schort de betaling van het ouderdomspensioen op indien degene aan wie een
      ouderdomspensioen is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].

      2 De betaling van het ouderdomspensioen wordt hervat indien betrokkene daartoe een aanvraag indient en het de
      Sociale verzekeringsbank is gebleken dat hij feitelijk buiten Nederland woont of verblijf houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel19a
