  - number: '10'
    text: |-
      1 De volledige bruto-toeslag wordt toegekend voorzolang, met inachtneming van het bepaalde in [artikel 11][ref1],
      het inkomen uit arbeid of overig inkomen van de echtgenoot van de pensioengerechtigde nihil bedraagt.

      2 Op de volledige bruto-toeslag wordt in mindering gebracht het inkomen van de echtgenoot van de
      pensioengerechtigde uit arbeid of overig inkomen, vastgesteld met inachtneming van het bepaalde in
      [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
