  - number: '36'
    text: |-
      1 De gewezen verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], gebruik
      wil maken, is verplicht uiterlijk een jaar na de dag, waarop de verplichte verzekering is geëindigd, een aanvraag
      daartoe in te dienen bij de Sociale verzekeringsbank.

      2 De aanvraag wordt afgewezen indien de gewezen verzekerde niet voldoet aan de bij of krachtens dit hoofdstuk
      gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: '37'
    text: |-
      De vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], eindigt:

      a. met ingang van de eerste dag van de tweede maand volgend op die waarin de Sociale verzekeringsbank een
      schriftelijke opzegging van de gewezen verzekerde heeft ontvangen;

      b. met ingang van de dag, waarop de gewezen verzekerde 65 jaar wordt;

      c. met ingang van de dag, waarop de periode van tien jaar, bedoeld in [artikel 35, eerste lid][ref2], is
      verstreken;

      d. met ingang van de dag, waarop de gewezen verzekerde verplicht verzekerd wordt op grond van deze wet;

      e. met ingang van de eerste dag van de vierde maand volgend op de laatste dag van de door de Sociale
      verzekeringsbank gestelde termijn waarbinnen de verschuldigde premie voor de vrijwillige algemene
      ouderdomsverzekering, bedoeld in [artikel 71 van de Wet financiering sociale verzekeringen][ref3], dient te worden
      betaald, indien de betaling niet of niet geheel heeft plaatsgevonden;

      f. met ingang van de dag volgend op de laatste dag van een door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de gewezen verzekerde de van hem, in verband met de toepassing van dit hoofdstuk, verlangde inlichtingen
      dient te verstrekken, indien de gewezen verzekerde die gegevens niet heeft verstrekt, tenzij de gewezen verzekerde
      aannemelijk maakt dat dat hem niet in overwegende mate kan worden verweten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel71
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel37
