        hoofdstuk: II
  - number: '7'
    text: |-
      Recht op ouderdomspensioen overeenkomstig de bepalingen van deze wet heeft degene, die

      a. de leeftijd van 65 jaar heeft bereikt, en

      b. ingevolge deze wet verzekerd is geweest in het tijdvak, aanvangende met de dag waarop de leeftijd van 15 jaar is
      bereikt en eindigende met de dag voorafgaande aan de dag waarop de leeftijd van 65 jaar is bereikt.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 De gehuwde pensioengerechtigde die voor 1 januari 2015 recht heeft op ouderdomspensioen en van wie de echtgenoot
      jonger is dan 65 jaar, heeft overeenkomstig de bepalingen van deze wet recht op een toeslag, tenzij, met
      inachtneming van [artikel 11][ref1], het inkomen uit arbeid of overig inkomen van die echtgenoot meer bedraagt dan
      de volledige bruto-toeslag.

      2 Waar in deze wet en in de tot haar uitvoering genomen besluiten wordt gesproken van ouderdomspensioen wordt
      daaronder mede verstaan de in het eerste lid bedoelde toeslag, voor zover niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a
    text: |-
      1 Geen recht op toeslag heeft de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die niet in
      Nederland woont.

      2 Het eerste lid is niet van toepassing indien de pensioengerechtigde woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op toeslag kan bestaan.

      3 Voor de pensioengerechtigde, wiens recht op toeslag op grond van het eerste lid niet is ontstaan of is geëindigd,
      ontstaat respectievelijk herleeft het recht op toeslag op de eerste dag van de maand:

      a. waarin hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een
      volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op toeslag kan bestaan;

      en hij voldoet aan de voorwaarden, bedoeld in [artikel 8, eerste lid][ref2].

      4 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:

      a. de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref3], die werkzaamheden verricht in het algemeen
      belang en niet in Nederland woont;

      b. de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref4], die in Aruba, Curaçao, Sint Maarten of in de
      openbare lichamen Bonaire, Sint Eustatius en Saba woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.

      5 Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op toeslag kan bestaan. In deze mededeling wordt tevens opgenomen:

      a. de vindplaats van het desbetreffende verdrag of besluit, en

      b. de eventueel in dat verdrag of besluit aanwezige beperkingen.


