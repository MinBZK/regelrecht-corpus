  - number: '21'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op het nog niet vastgestelde
      ouderdomspensioen beschouwd als ouderdomspensioen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel21
  - number: '23'
    text: |-
      De termijnen van het ouderdomspensioen, welke niet zijn ingevorderd binnen twee jaren na de eerste dag, waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel23
  - number: '24'
    text: |-
      1 Het ouderdomspensioen dat als gevolg van een besluit als bedoeld in [artikel 17][ref1] onverschuldigd is
      betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de
      pensioengerechtigde, of zijn wettelijke vertegenwoordiger teruggevorderd.

      2 In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de pensioengerechtigde, of zijn wettelijke vertegenwoordiger:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      3 De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen
      [475c][ref2] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 49][ref4].

      4 Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.

      5 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.

      6 In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17
