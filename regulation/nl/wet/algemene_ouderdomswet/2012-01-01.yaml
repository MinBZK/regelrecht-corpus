  - number: 17i
    text: |-
      1 De Sociale verzekeringsbank verrekent de bestuurlijke boete met het ouderdomspensioen dat degene aan wie een
      bestuurlijke boete is opgelegd op grond van deze wet ontvangt.

      2 Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het
      Uitvoeringsinstituut werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat
      daarvoor een machtiging nodig is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie
      een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet werk en inkomen naar arbeidsvermogen][ref9], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de [Wet arbeid en zorg][ref11] of een toeslag op grond van
      de [Toeslagenwet][ref12].

      3 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref13] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref14], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.

      4 Zolang de belanghebbende zijn verplichting, bedoeld in [artikel 17c, vierde lid][ref15], niet of niet behoorlijk
      nakomt:

      a. is de Sociale verzekeringsbank, in afwijking van
      [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref16], bevoegd tot verrekening voor zover beslag op
      de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref17], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref18], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


