        hoofdstuk: III
        paragraaf: '1'
  - number: '59'
    text: |-
      Voor het recht op ouderdomspensioen overeenkomstig [artikel 58][ref1] is vereist, dat de belanghebbende:

      a. Nederlander is, en

      b. in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel58
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel59
