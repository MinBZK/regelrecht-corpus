  - number: 8c
    text: |-
      1 Voor de pensioengerechtigde ontstaat geen recht op ouderdomspensioen indien en voor zolang hij zich op de dag
      waarop het ouderdomspensioen zou ingaan en daarna onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel.

      2 Het recht op ouderdomspensioen eindigt, indien de pensioengerechtigde zich, nadat het recht op ouderdomspensioen
      is ingegaan, onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel.

      3 De persoon die op grond van het eerste of tweede lid geen recht op ouderdomspensioen heeft, heeft met ingang
      van de dag dat hij zich niet langer onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel met inachtneming van de bepalingen van deze wet recht op ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel8c
  - number: '9'
    text: |-
      1 Deze wet kent een bruto-ouderdomspensioen voor:

      a. de ongehuwde pensioengerechtigde;

      b. de gehuwde pensioengerechtigde;

      c. de ongehuwde pensioengerechtigde die een kind heeft jonger dan 18 jaar, dat niet als eigen kind,
      aangehuwd kind of pleegkind tot het huishouden van een ander behoort en voor wie aan hem op grond van
      [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag wordt betaald, zal worden betaald of zou worden
      betaald indien [artikel 7, tweede lid, van die wet][ref2] niet van toepassing zou zijn.

      2 De in het eerste lid bedoelde ouderdomspensioenen worden afgeleid van het netto-minimumloon per maand.

      3 Onder het netto-minimumloon wordt verstaan het bruto-minimumloon, na aftrek van premies op grond
      van de [Wet financiering sociale verzekeringen][ref3], de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref4], over het bruto-minimumloon en loonbelasting, en vermeerderd met de
      vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref5].

      4 De loonbelasting en premie voor de volksverzekeringen, bedoeld in
      [artikel 1 van de Wet financiering sociale verzekeringen][ref6], worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref7], over het bruto-minimumloon vermeerderd met de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref8], en verminderd met het werknemersaandeel in de premie,
      bedoeld in [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref9].

      5 Indien op grond van de [Wet financiering sociale verzekeringen][ref10] een premie wordt ingehouden waarvan het
      percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen
      regels bij ministeriële regeling voor de toepassing van het vierde lid een gemiddeld percentage vastgesteld.

      6 De bruto-ouderdomspensioenen worden zodanig vastgesteld, dat na aftrek van de in te houden loonbelasting en
      premie voor de volksverzekeringen, rekening houdend met de toepasselijke heffingskortingen voor een persoon van 65
      jaar en ouder, en van de inkomensafhankelijke bijdrage, bedoeld in [artikel 41 van de Zorgverzekeringswet][ref11]:

      a. het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel a,
      gelijk is aan 70% van het netto-minimumloon per maand;

      b. het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel b,
      gelijk is aan 50% van het netto-minimumloon per maand;

      c. het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel c,
      gelijk is aan 90% van het netto-minimumloon per maand.

      7 De volledige bruto-toeslag, bedoeld in [artikel 8][ref12], is gelijk aan het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in het eerste lid, onderdeel b.

      8 Een herziening van het bruto-ouderdomspensioen in verband met een wijziging van het netto-minimumloon vindt
      plaats zonder dat dit bij beschikking is vastgesteld.

      9 De Sociale verzekeringsbank betaalt het herziene ouderdomspensioen, bedoeld in het achtste lid, bij de
      eerstvolgende betaling van het ouderdomspensioen nadat de herziening, bedoeld in het achtste lid, heeft
      plaatsgevonden.


