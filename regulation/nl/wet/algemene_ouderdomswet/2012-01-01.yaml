  - number: '49'
    text: |-
      De pensioengerechtigde, zijn echtgenoot, alsmede zijn wettelijke vertegenwoordiger of de instelling waaraan
      ingevolge [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering of op het bedrag van de uitkering, dat wordt betaald. De verplichting geldt niet indien die feiten en
      omstandigheden door de Sociale verzekeringsbank kunnen worden vastgesteld op grond van bij wettelijk voorschrift
      als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen
      administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel49
    references:
      - id: ref1
