    text: |-
      Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald, dat:

      a. voor de toepassing van [artikel 59][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;

      b. voor de toepassing van de [artikelen 58][ref2] en [59][ref3] het wonen buiten Nederland wordt gelijkgesteld met
      het wonen in Nederland.


