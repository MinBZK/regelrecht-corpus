  - number: '34'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder gewezen verzekerde: degene, wiens
      verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel34
  - number: '35'
    text: |-
      1 De gewezen verzekerde van 15 jaar of ouder kan zich, zolang hij de leeftijd van 65 jaar nog niet heeft bereikt,
      vrijwillig verzekeren over een periode van maximaal tien jaar, met ingang van de dag na de dag waarop de verplichte
      verzekering is geëindigd. De eerste zin is alleen van toepassing indien de gewezen verzekerde direct voorafgaande
      aan de periode van vrijwillige verzekering ten minste een jaar verplicht verzekerd is geweest.

      2 Indien de periode van vrijwillige verzekering is onderbroken door een periode van verplichte verzekering korter
      dan een jaar, kan de gewezen verzekerde zich opnieuw vrijwillig verzekeren voor de resterende periode van de tien
      jaar.

      3 De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op:

      a. de gewezen verzekerde die in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel
      uit anderen hoofde loon geniet van een zodanige rechtspersoon;

      b. de gewezen verzekerde die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in
      overeenstemming met Onze Minister van Buitenlandse Zaken aan te wijzen organisaties voor ontwikkelingssamenwerking;

      c. de gewezen verzekerde die werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en
      Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;

      d. de gewezen verzekerde die werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in
      opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie; of

      e. de gewezen verzekerde, die op de dag waarop de verplichte verzekering is geëindigd de leeftijd van 50 jaar heeft
      bereikt, niet in Nederland woont en recht heeft op een:

      1°. uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];

      2°. uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2];

      3°. uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3];

      4°. uitkering of op recht op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4];

      5°. uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref5];

      6°. pensioen op basis van arbeidsongeschiktheid op grond van de [Wet privatisering Spoorwegpensioenfonds][ref6];

      7°. pensioen op basis van arbeidsongeschiktheid op grond van de Algemene militaire pensioenwet, zoals die luidde
      voor 1 januari 1998; of

      8°. nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref7], mits die uitkering of dat pensioen ten
      minste gelijk is aan 35% van het bruto-minimumloon.

      4 De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op de echtgenoot van de in
      het derde lid genoemde gewezen verzekerde en de inwonende minderjarige kinderen met wie die gewezen verzekerde of
      die echtgenoot in familierechtelijke betrekking staat. Voor de toepassing van dit lid wordt onder de in het derde
      lid genoemde gewezen verzekerde mede verstaan de gewezen verzekerde, bedoeld in onderdeel e van dat lid, wiens
      recht op een uitkering als bedoeld in dat onderdeel uitsluitend als gevolg van het bereiken van de leeftijd van 65
      jaar is geëindigd.

      5 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van dit artikel nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
