  - number: 64a_bis
    text: |-
      1 De [artikelen 8, eerste lid][ref1], [10][ref2], [11][ref3] en [22][ref4] en de daarop berustende
      bepalingen, zoals deze luidden op de dag voor inwerkingtreding van de Wet harmonisatie en vereenvoudiging
      socialezekerheidswetgeving, blijven van toepassing op de persoon op wie een op deze artikelen berustende bepaling
      werd toegepast op de dag voor inwerkingtreding van die wet, voor zolang de toepassing duurt, doch ten hoogste
      gedurende twee jaar na de dag waarop die wet in werking is getreden.

      2 Dit artikel vervalt twee jaar na het tijdstip van inwerkingtreding.


