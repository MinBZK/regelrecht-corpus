  - number: '12'
    text: |-
      1 Op de bruto-toeslag, vastgesteld op grond van [artikel 10][ref1] en, indien van toepassing, na
      toepassing van [artikel 13, tweede lid][ref2], wordt een korting toegepast tot 10% voor zover de toeslag
      samen met het gezamenlijke inkomen uit arbeid of overig inkomen van de gehuwde pensioengerechtigde en
      diens echtgenoot vermeerderd met het op grond van de [artikelen 9, zesde lid, onderdeel b][ref3] en
      [13, eerste lid][ref4], vastgestelde bruto-ouderdomspensioen door de toepassing van de korting niet minder
      bedraagt dan 162% van het bruto-minimumloon met inbegrip van de bruto-minimumvakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref5].

      2 De met toepassing van [artikel 10, tweede lid][ref6], of [artikel 13, tweede lid][ref7],
      of het eerste lid berekende niet-volledige bruto-toeslag wordt voor toepassing van
      [artikel 29, tweede lid, aanhef en onderdeel b][ref8], uitgedrukt in een percentage van de volledige bruto-toeslag.
      Dit percentage wordt rekenkundig afgerond op een veelvoud van éénhonderdste.

      3 Dit artikel is van overeenkomstige toepassing op de pensioengerechtigde, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________ (Stb. 592). Ten aanzien van die pensioengerechtigden dient:

      a. [artikel 10, vierde lid][ref10], zoals dat luidde voor de datum van inwerkingtreding van [die wet][ref11], te
      worden gelezen alsof «en 11» is vervangen door «11 en 12»; en

      b. [artikel 29, tweede lid][ref12], zoals dat luidde voor de datum van inwerkingtreding van [die wet][ref13], te
      worden gelezen alsof «met toepassing van artikel 10, tweede lid,» is vervangen door «met toepassing van artikel
      10, tweede lid, of artikel 13, tweede lid, of artikel 12, eerste lid,» en «de in artikel 10, derde lid, bedoelde
      percenten» is vervangen door «de in artikel 12, tweede lid, bedoelde percenten».


