  - number: '62'
    text: |-
      De [artikelen 8a][ref1] en [9a][ref2] zijn niet van toepassing op de pensioengerechtigde, die:

      a. op 31 december 1999 recht heeft op een ouderdomspensioen en op die dag niet in Nederland woont, en

      b. op 19 december 2005 dit recht op een ouderdomspensioen uitsluitend nog heeft op grond van [artikel 2 van
      de wet van 9 december 2004, houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te
      Genève tot stand gekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen
      met betrekking tot de sociale zekerheid](onbekend) (Verdrag nr. 118 aangenomen door de Internationale
      Arbeidsconferentie in haar zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9a
