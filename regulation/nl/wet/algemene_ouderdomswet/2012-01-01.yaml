        bwb_id: BWBR0011823
        artikel: '8'
  - number: 19b
    text: |-
      1 De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de
      pensioengerechtigde verstrekte adres van hemzelf of van zijn echtgenoot afwijkt van het adres waaronder de
      pensioengerechtigde of zijn echtgenoot in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;

      b. indien de pensioengerechtigde van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de belanghebbende.

      4 De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel19b
  - number: '20'
    text: |-
      1 Indien degene aan wie een ouderdomspensioen is toegekend, aanspraak heeft op verstrekking of vergoeding van
      zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van die wet een bijdrage voor die
      zorg verschuldigd is, is de Sociale verzekeringsbank bevoegd het ouderdomspensioen tot het bedrag van die bijdrage
      in plaats van aan degene, aan wie ouderdomspensioen is toegekend, zonder diens machtiging uit te betalen aan het
      College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].

      2 Indien degene, aan wie een ouderdomspensioen is toegekend, in een inrichting ter verpleging van geesteszieken
      of van zwakzinnigen is opgenomen en de Sociale verzekeringsbank, van de desbetreffende inrichting of van het
      college van burgemeester en wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om het
      ouderdomspensioen aan die inrichting of die gemeente uit te betalen, is de Sociale verzekeringsbank bevoegd dat
      verzoek zonder het stellen van andere voorwaarden in te willigen.

      3 Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van het ouderdomspensioen, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.

      4 Een herziening van het ouderdomspensioen op grond van het eerste lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
