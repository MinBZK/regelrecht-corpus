  - number: '65'
    text: |-
      Een gedraging die in strijd is met een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie. Het feit wordt beschouwd als een overtreding. Het in de eerste zin
      bedoelde feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel65
  - number: '70'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt geregeld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel70
  - number: '71'
    text: |-
      1 Indien in een pensioenregeling van een pensioenfonds of van een werkgever bepalingen zijn of worden opgenomen
      krachtens welke op enigerlei wijze geheel of gedeeltelijk met het ouderdomspensioen ingevolge deze wet rekening
      wordt gehouden, dient bij de toepassing van deze bepalingen in acht te worden genomen, dat een verhoging van het
      ouderdomspensioen, welke plaatsvindt na de datum van beëindiging van de actieve deelneming aan de pensioenregeling,
      buiten beschouwing blijft.

      2 Het eerste lid is niet van toepassing op pensioenregelingen waarin bepalingen zijn opgenomen volgens welke het
      ouderdomspensioen ingevolge deze wet en de premievrije aanspraken of het pensioen van die regeling tezamen na
      beëindiging van de actieve deelneming jaarlijks ten minste worden verhoogd met het percentage van de in het eerste
      lid bedoelde verhoging van het ouderdomspensioen of het percentage van de loon- of prijsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel71
  - number: '75'
    text: |-
      1 Deze wet kan worden aangehaald onder de titel "Algemene Ouderdomswet".

      2 De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat
      voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel75
