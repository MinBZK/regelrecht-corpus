  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.

      2 Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van
      de bemanning als deel van Nederland beschouwd.

      3 Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002221/2012-01-01#Artikel3
  - number: '6'
    text: |-
      1 Verzekerd overeenkomstig de bepalingen van deze wet is degene, die nog niet de leeftijd van 65 jaar heeft
      bereikt, en

      a. ingezetene is;

      b. geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte
      arbeid aan de loonbelasting is onderworpen.

      2 Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].

      3 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan
      wel beperking worden gegeven aan de kring der verzekerden.

      4 Bij een maatregel, als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten aanzien van:

      a. vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
