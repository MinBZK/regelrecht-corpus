  - number: 8b
    text: |-
      1 Geen recht op ouderdomspensioen ontstaat voor de pensioengerechtigde, aan wie rechtens zijn vrijheid is
      ontnomen indien de dag waarop het ouderdomspensioen zou ingaan dan wel de dag na afloop van de toepassing van
      [artikel 8c, eerste lid][ref1], met betrekking tot dat recht op ouderdomspensioen, is gelegen in de periode dat hem
      rechtens zijn vrijheid is ontnomen.

      2 Het recht op ouderdomspensioen eindigt, indien de pensioengerechtigde rechtens zijn vrijheid is ontnomen
      gedurende ten minste een maand.

      3 De persoon die op grond van het eerste of tweede lid geen recht op ouderdomspensioen heeft, heeft met ingang van
      de eerste dag van de maand waarin hij in vrijheid is gesteld met inachtneming van de bepalingen van deze wet recht
      op ouderdomspensioen.

      4 Voor de toepassing van het tweede lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.

      5 Het eerste en tweede lid zijn niet van toepassing en het derde lid is van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.

      6 Voor de pensioengerechtigde die op de dag voorafgaande aan de vrijheidsontneming geen recht heeft op
      ouderdomspensioen op grond van [artikel 8c, tweede lid][ref2], eindigt het recht op ouderdomspensioen, in afwijking
      van het tweede lid, vanaf de dag dat de vrijheidsontneming ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8c
