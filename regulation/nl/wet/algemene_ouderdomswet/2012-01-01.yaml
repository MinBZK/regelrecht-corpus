  - number: '48'
    text: |-
      1 Degene, van wie ingevolge [artikel 65, eerste lid, van de Wet financiering sociale verzekeringen][ref1] belasting
      is geheven of in door Onze Minister en Onze Minister van Financiën bij ministeriële regeling aan te wijzen gevallen
      geacht wordt te zijn geheven, heeft recht op een uitkering, indien en zolang hij recht heeft op ouderdomspensioen
      krachtens deze wet en hij wegens gemoedsbezwaren geen aanspraak maakt op dit ouderdomspensioen.

      2 Degene, die ingevolge het eerste lid recht op een uitkering heeft, dient de Sociale verzekeringsbank schriftelijk
      in kennis te stellen, zodra naar zijn oordeel het totaal aan uitkering betaalde bedragen heeft overschreden
      het totaal van de bedragen, die van hem op grond van de in de aanhef van het eerste lid bedoelde bepalingen aan
      belasting zijn geheven of geacht worden te zijn geheven. De uitbetaling van deze uitkering wordt dan beëindigd met
      ingang van een betalingstermijn, aanvangende na de dag, waarop de kennisgeving door de Sociale verzekeringsbank is
      ontvangen, doch niet later dan de eerste dag van de tweede maand na de dag van ontvangst van die kennisgeving.

      3 Voor de toepassing van het bepaalde in het vorige lid wordt het totaal van de aan belasting geheven bedragen:

      a. verminderd met de bedragen die niet zijn ingevorderd, dan wel die de verzekerde nalatig is gebleven te betalen;

      b. vermeerderd met een door de in het eerste lid bedoelde uitkeringsgerechtigde te bepalen opslag.

      4 Het bedrag van de uitkering is gelijk aan het bedrag aan ouderdomspensioen en vakantie-uitkering, waarop de
      belanghebbende krachtens deze wet recht heeft.

      5 Het bepaalde bij of krachtens de [artikelen 14 tot en met 26][ref2], [31][ref3] en [33][ref4] is, voorzover
      daarvan in bij ministeriële regeling te stellen regels niet wordt afgeweken, van overeenkomstige toepassing.

      6 Het bepaalde bij [artikel 49][ref5] is van overeenkomstige toepassing.

      7 Onze Minister en Onze Minister van Financiën kunnen bij ministeriële regeling ter zake van het bepaalde in het
      eerste tot en met het zesde lid nadere regels en uitvoeringsvoorschriften geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel33
