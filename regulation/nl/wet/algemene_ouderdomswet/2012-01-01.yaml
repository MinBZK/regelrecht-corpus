    text: |-
      1 De besluiten tot herziening van het ouderdomspensioen, genomen met toepassing van [artikel 17][ref1] zoals
      [dat artikel][ref2] luidde op de dag voorafgaand aan de datum van inwerkingtreding van de wet van 2 november 2006
      tot wijziging van de Algemene Ouderdomswet in verband met samenwonen ten behoeve van zorg voor een hulpbehoevende
      (Stb. 558), worden op aanvraag door de Sociale verzekeringsbank met toepassing van [artikel 17, tweede lid][ref3],
      gewijzigd met ingang van 4 april 2006 of indien de herziening op een later tijdstip heeft plaatsgevonden met ingang
      van dat tijdstip indien:

      a. de herziening voortvloeit uit de omstandigheid van het voeren van een gezamenlijke huishouding in
      verband met zorg door een pensioengerechtigde voor een hulpbehoevende pensioengerechtigde als bedoeld in
      [artikel 1, onderdeel j, van de Algemene nabestaandenwet][ref4];

      b. de pensioengerechtigden ieder beschikken over een eigen woning.

      2 De aanvraag, bedoeld in het eerste lid, wordt ingediend binnen zes maanden na de datum van inwerkingtreding van
      de in het eerste lid genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17
