  - number: '56'
    text: |-
      De voordelen uit [artikel 55][ref1] voortvloeiende komen enkel toe aan degene, die:

      a. Nederlander is, en

      b. in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel55
