        paragraaf: '3'
  - number: '12.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de pensioengerechtigde, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________ (Stb. 592). Ten aanzien van die pensioengerechtigden dient:


      [ref1]: https://wetten.overheid.nl/BWBR0006200#ArtikelII
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006200
        artikel: II
  - number: 12.3.a
    text: |-
      [artikel 10, vierde lid][ref1], zoals dat luidde voor de datum van inwerkingtreding van [die wet][ref2], te worden
      gelezen alsof «en 11» is vervangen door «11 en 12»; en


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006200
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006200
  - number: 12.3.b
    text: |-
      [artikel 29, tweede lid][ref1], zoals dat luidde voor de datum van inwerkingtreding van [die wet][ref2], te worden
      gelezen alsof «met toepassing van artikel 10, tweede lid,» is vervangen door «met toepassing van artikel 10, tweede
      lid, of artikel 13, tweede lid, of artikel 12, eerste lid,» en «de in artikel 10, derde lid, bedoelde percenten» is
      vervangen door «de in artikel 12, tweede lid, bedoelde percenten».


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006200
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '29'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006200
  - number: 12a
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid en overig inkomen als bedoeld in de
      [artikelen 8, eerste lid][ref1], [10, eerste en tweede lid][ref2], [11][ref3] en [12][ref4] wordt verstaan. Daarbij
      kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten als
      gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in aanmerking wordt genomen alsof
      het wel volledig wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel12
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Op het bruto-ouderdomspensioen, vastgesteld op grond van [artikel 9][ref1] wordt een korting toegepast van 2%:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13.1.a
    text: |-
      voor elk kalenderjaar, dat de pensioengerechtigde na het bereiken van de aanvangsleeftijd, doch vóór het bereiken
      van de pensioengerechtigde leeftijd niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
  - number: 13.1.b
    text: |-
      voor elke jaarpremie op grond van de [Wet financiering sociale verzekeringen][ref1], welke de
      pensioengerechtigde na het bereiken van de aanvangsleeftijd schuldig nalatig is geweest te betalen als bedoeld in
      [artikel 61 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel61
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '61'
  - number: '13.2'
    text: |-
      Op de bruto-toeslag wordt, na toepassing van [artikel 10][ref1], een korting toegepast van 2%:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13.2.a
    text: |-
      voor elk kalenderjaar, dat de echtgenoot van de pensioengerechtigde na het bereiken van de aanvangsleeftijd, doch
      vóór het bereiken van de pensioengerechtigde leeftijd van de pensioengerechtigde niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
  - number: 13.2.b
    text: |-
      voor elke jaarpremie op grond van de [Wet financiering sociale verzekeringen][ref1], welke de echtgenoot van de
      pensioengerechtigde na het bereiken van de aanvangsleeftijd, doch vóór het bereiken van de pensioengerechtigde
      leeftijd van de pensioengerechtigde schuldig nalatig is geweest te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '13.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de herleiding van gedeelten van kalenderjaren tot gehele
      kalenderjaren en gedeelten van jaarpremies tot gehele jaarpremies.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13
  - number: 13a.1
    text: |-
      [Artikel 13, eerste lid, onderdeel a][ref1], is niet van toepassing op de vrouwelijke pensioengerechtigde voor elk
      kalenderjaar dat zij in de periode van 1 januari 1957 tot 1 april 1985 niet verzekerd was, doordat zij in Nederland
      woonde en gehuwd dan wel gehuwd geweest was met een persoon, die in die periode niet verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13a.2
    text: |-
      [Artikel 13, tweede lid, onderdeel a][ref1], is niet van toepassing op de pensioengerechtigde voor elk kalenderjaar
      dat zijn echtgenoot in de periode van 1 januari 1957 tot 1 april 1985 niet verzekerd was, doordat die echtgenoot in
      Nederland woonde en gehuwd dan wel gehuwd geweest was met een persoon, die in die periode niet verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Het ouderdomspensioen alsmede een verhoging van het ouderdomspensioen wordt op aanvraag toegekend door de Sociale
      verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid is de Sociale verzekeringsbank bevoegd het ouderdomspensioen of een
      verhoging van het ouderdomspensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel14
  - number: '15.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel15
  - number: '15.2'
    text: |-
      De pensioengerechtigde, zijn echtgenoot dan wel zijn wettelijke vertegenwoordiger of de instelling waaraan op
      grond van [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, is verplicht de voorschriften op te volgen en
      anderszins aan de Sociale verzekeringsbank desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor
      de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Het ouderdomspensioen gaat in op de dag waarop de belanghebbende aan de voorwaarden voor het recht op
      ouderdomspensioen voldoet.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan een ouderdomspensioen niet vroeger ingaan dan een jaar vóór
      de dag waarop de aanvraag werd ingediend of vóór de dag waarop ambtshalve toekenning plaatsvond. De Sociale
      verzekeringsbank kan voor bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het ouderdomspensioen wordt door de Sociale verzekeringsbank ingetrokken of herzien, wanneer degene, aan wie het
      is toegekend, ingevolge het bij of krachtens deze wet bepaalde daarvoor niet of niet meer in aanmerking komt,
      onderscheidenlijk voor een hoger of lager ouderdomspensioen in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: '17.2'
    text: 'In afwijking van het eerste lid vindt geen herziening van het ouderdomspensioen plaats indien:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: 17.2.a
    text: |-
      sprake is van zorg voor een pensioengerechtigde die hulpbehoevend is als bedoeld in
      [artikel 1, onderdeel j, van de Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '1'
  - number: 17.2.b
    text: door deze zorg een gezamenlijke huishouding ontstaat van twee pensioengerechtigden, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: 17.2.c
    text: |-
      de pensioengerechtigde en de hulpbehoevende pensioengerechtigde ieder beschikken over een woning en daarvoor de
      financiële lasten dragen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: '17.3'
    text: |-
      De herziening van het ouderdomspensioen, welke voortvloeit uit een wijziging der omstandigheden en welke een
      verhoging van dit ouderdomspensioen tot gevolg heeft, gaat in op de eerste dag der maand, waarin de wijziging
      dier omstandigheden heeft plaatsgevonden. Het bepaalde in [artikel 16, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel16
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '16'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17.4'
    text: |-
      De Sociale verzekeringsbank kent, indien de pensioengerechtigde of zijn wettelijke vertegenwoordiger niet
      op grond van [artikel 50][ref1] desgevraagd aantoont, dat hij een pensioengerechtigde is als bedoeld in
      [artikel 9, eerste lid, onderdeel a of c][ref2], of dat zijn feitelijke woonsituatie in overeenstemming is met het
      door hem dan wel zijn wettelijke vertegenwoordiger verstrekte adres, een ouderdomspensioen toe gelijk aan dat van
      een pensioengerechtigde als bedoeld in artikel 9, eerste lid, onderdeel b, dan wel herziet het ouderdomspensioen
      tot het bedrag van dat ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '50'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.5'
    text: |-
      De intrekking van het ouderdomspensioen of de herziening daarvan, welke voortvloeit uit een wijziging der
      omstandigheden en welke een verlaging van dit ouderdomspensioen tot gevolg heeft, gaat, behoudens in de bij
      ministeriële regeling aan te wijzen gevallen, in op de eerste dag der maand, volgende op die, waarin de dag is
      gelegen met ingang waarvan degene, aan wie ouderdomspensioen is toegekend, daarvoor niet meer in aanmerking komt,
      onderscheidenlijk voor een lager ouderdomspensioen in aanmerking komt. Indien het ouderdomspensioen ten onrechte of
      tot een te hoog bedrag is toegekend, wordt het ingetrokken onderscheidenlijk herzien met ingang van de dag, waarop
      het is ingegaan.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: '17.6'
    text: |-
      De herziening van het ouderdomspensioen als gevolg van een wijziging van het netto-minimumloon gaat, in afwijking
      van het bepaalde in het derde en vierde lid, in op de dag waarop het netto-minimumloon is herzien.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: '17.7'
    text: |-
      De beëindiging van het ouderdomspensioen op grond van [artikel 8b, tweede lid][ref1], gaat in op de eerste dag van
      de maand volgend op de maand waarin de vrijheidsontneming een maand heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8b
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.8'
    text: Ter uitvoering van dit artikel kunnen bij ministeriële regeling nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17
  - number: 17a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van ouderdomspensioen en terzake van weigering van ouderdomspensioen, herziet de Sociale verzekeringsbank een
      dergelijk besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17a
  - number: 17a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 15, tweede lid][ref1],
      of [49][ref2], heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van ouderdomspensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17a.1.b
    text: indien anderszins het ouderdomspensioen ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17a
  - number: 17a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 15, tweede lid][ref1],
      of [49][ref2], ertoe leidt dat niet kan worden vastgesteld of nog recht op ouderdomspensioen bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17a
  - number: 17b.1
    text: |-
      De Sociale verzekeringsbank weigert het ouderdomspensioen geheel of gedeeltelijk, tijdelijk of
      blijvend, indien de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een
      verplichting, hem op grond van [artikel 15, tweede lid][ref1], opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 49][ref3] niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17b.2
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
  - number: 17b.3
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake het niet tijdig nakomen van de verplichting, bedoeld
      in [artikel 49][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van ouderdomspensioen, tenzij het niet tijdig nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een
      zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17b.4
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
  - number: 17b.5
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 17c][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
  - number: 17b.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17b
  - number: 17c.1
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet of
      niet behoorlijk nakomen door de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger van de
      verplichting, bedoeld in [artikel 49][ref1]. De bestuurlijke boete is niet lager dan de boete die op grond van het
      derde lid zou worden opgelegd indien er geen sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 49][ref1], ten onrechte of tot een te hoog bedrag aan
      ouderdomspensioen is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 49][ref1], niet heeft geleid tot een benadelingsbedrag,
      legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 17c.4
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het derde lid
      en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 49][ref1], tenzij het niet of niet behoorlijk nakomen van de verplichting plaats
      vindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de pensioengerechtigde, zijn
      echtgenoot, of zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.5
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door
      de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 49][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan ouderdomspensioen is ontvangen,
      van ten hoogste 150 procent van het benadelingsbedrag indien binnen een tijdvak van vijf jaar voorafgaand aan de
      dag van het begaan van de overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens
      een eerdere overtreding, bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 17c.6
    text: |-
      Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen van
      de verplichting, bedoeld in de [artikelen 49][ref1] van deze wet of [35 van de Algemene nabestaandenwet][ref2]
      als gevolg waarvan ten onrechte of tot een te hoog bedrag aan ouderdomspensioen, nabestaandenuitkering,
      halfwezenuitkering, of wezenuitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '35'
  - number: 17c.7
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de
      eerdere overtreding, bedoeld in het vijfde lid, de pensioengerechtigde, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger is gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.8
    text: 'De Sociale verzekeringsbank kan:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.8.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.8.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.9
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.10
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
  - number: 17c.11
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de pensioengerechtigde, zijn echtgenoot,
      of zijn wettelijke vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 17e
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 17i, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
  - number: 17i.1
    text: |-
      De Sociale verzekeringsbank verrekent de bestuurlijke boete met het ouderdomspensioen dat degene aan wie een
      bestuurlijke boete is opgelegd op grond van deze wet ontvangt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
  - number: 17i.2
    text: |-
      Onverminderd het eerste lid kan de Sociale verzekeringsbank de bestuurlijke boete verrekenen met een vordering die
      degene aan wie de bestuurlijke boete is opgelegd op hem heeft.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
  - number: 17i.3
    text: |-
      Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het
      Uitvoeringsinstituut werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat
      daarvoor een machtiging nodig is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie
      een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de [Wet werk en inkomen naar arbeidsvermogen][ref9], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de [Wet arbeid en zorg][ref11] of een toeslag op grond van
      de [Toeslagenwet][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0019057
      [ref10]: https://wetten.overheid.nl/BWBR0002524
      [ref11]: https://wetten.overheid.nl/BWBR0013008
      [ref12]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0019057
      - id: ref10
        bwb_id: BWBR0002524
      - id: ref11
        bwb_id: BWBR0013008
      - id: ref12
        bwb_id: BWBR0004043
  - number: 17i.4
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17i.5
    text: |-
      Zolang de belanghebbende zijn verplichting, bedoeld in [artikel 17c, negende lid][ref1], niet of niet behoorlijk
      nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
  - number: 17i.5.a
    text: |-
      is de Sociale verzekeringsbank, in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1],
      bevoegd tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17i.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17j.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 17i, eerste lid][ref1], wordt de bestuurlijke boete,
      bedoeld in [artikel 17c, vijfde lid][ref2], door Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref3], verrekend gedurende een tijdvak van ten
      hoogste vijf jaar vanaf het moment van de dagtekening waarop de bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17j.2
    text: |-
      [Artikel 17i, eerste lid][ref1], en het eerste lid zijn van overeenkomstige toepassing op de verrekening van de
      bestuurlijke boete wegens eenzelfde gedraging als bedoeld in [artikel 17c, zesde lid][ref2], indien en voor zover
      op het moment van verrekening, bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
  - number: 17j.3
    text: |-
      De Sociale verzekeringsbank kan op verzoek van degene aan wie de bestuurlijke boete is opgelegd besluiten het
      eerste en tweede lid niet of niet meer toe te passen indien, gelet op bijzondere omstandigheden, dringende redenen
      daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
  - number: 17j.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van [artikel 17i, eerste lid][ref1],
      na het tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
  - number: 17j.5
    text: |-
      Indien als gevolg van de verrekening, bedoeld in het eerste en tweede lid, algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] wordt toegekend, wordt bij de verrekening een bij ministeriële regeling bepaald deel
      van het ouderdomspensioen op grond van deze wet op aanvraag vrijgelaten in verband met zorgkosten, woonkosten en
      de kosten van kinderen. Het vrij te laten deel van het ouderdomspensioen kan afhankelijk worden gesteld van de
      leefsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 17j.6
    text: Voor de toepassing van het vijfde lid kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
  - number: 17j.7
    text: |-
      Het vrijgelaten deel, bedoeld in het vijfde lid, is niet vatbaar voor beslag, waaronder begrepen beslag ingevolge
      faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel17j
  - number: '18.1'
    text: |-
      Na het overlijden van degene, aan wie ouderdomspensioen is toegekend, wordt met ingang van de dag na het
      overlijden, ouderdomspensioen in de vorm van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: 18.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: 18.1.b
    text: |-
      bij ontstentenis van de in onderdeel a bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: 18.1.c
    text: |-
      bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '18.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van het ouderdomspensioen over één maand, met uitzondering
      van de toeslag, berekend naar de hoogte van het ouderdomspensioen in de maand van overlijden van degene aan wie
      ouderdomspensioen is toegekend.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '18.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '18.4'
    text: De overlijdensuitkering wordt in een bedrag ineens aan de rechthebbende of rechthebbenden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '18.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan ouderdomspensioen dat, over na het
      overlijden gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '18.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel18
  - number: '19.1'
    text: |-
      De Sociale verzekeringsbank betaalt het ouderdomspensioen waarop op grond van deze wet recht bestaat. De betaling
      geschiedt als regel maandelijks.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: '19.2'
    text: |-
      De Sociale verzekeringsbank kan de aan een gehuwde pensioengerechtigde toegekende toeslag betaalbaar stellen aan
      de echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: '19.3'
    text: |-
      Indien het ouderdomspensioen in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '19.4'
    text: |-
      Wanneer een pensioengerechtigde een ander machtigt om het ouderdomspensioen in ontvangst te nemen,
      onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een
      betalingstermijn, aanvangende na de dag, waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening,
      onderscheidenlijk intrekking der machtiging.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: '19.5'
    text: |-
      De Sociale verzekeringsbank schort de betaling van het ouderdomspensioen op of schorst de betaling indien zij op
      grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: 19.5.a
    text: het recht op ouderdomspensioen niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: 19.5.b
    text: recht op een lager ouderdomspensioen bestaat; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: 19.5.c
    text: |-
      de pensioengerechtigde, zijn echtgenoot dan wel zijn wettelijke vertegenwoordiger of de instelling waaraan
      op grond van [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, een verplichting als bedoeld in
      [artikel 15, tweede lid][ref2], [artikel 49][ref3] of [artikel 50][ref4] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel50
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '50'
        hoofdstuk: VI
  - number: '19.6'
    text: |-
      De Sociale verzekeringsbank stelt de betrokken persoon of instelling onverwijld schriftelijk in kennis van de
      beslissing, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19
  - number: 19a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van het ouderdomspensioen op indien degene aan wie een
      ouderdomspensioen is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 19a.2
    text: |-
      De betaling van het ouderdomspensioen wordt hervat indien betrokkene daartoe een aanvraag indient en het de Sociale
      verzekeringsbank is gebleken dat hij feitelijk buiten Nederland woont of verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19a
  - number: 19b.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de
      pensioengerechtigde verstrekte adres van hemzelf of van zijn echtgenoot afwijkt van het adres waaronder de
      pensioengerechtigde of zijn echtgenoot in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: 19b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: 19b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: 19b.2.b
    text: indien de pensioengerechtigde van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: 19b.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: 19b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel19b
  - number: '20.1'
    text: |-
      Indien degene aan wie een ouderdomspensioen is toegekend, aanspraak heeft op verstrekking of vergoeding van zorg
      als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van die wet een bijdrage voor die zorg
      verschuldigd is, is de Sociale verzekeringsbank bevoegd het ouderdomspensioen tot het bedrag van die bijdrage
      in plaats van aan degene, aan wie ouderdomspensioen is toegekend, zonder diens machtiging uit te betalen aan het
      College voor zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '20.2'
    text: |-
      Indien degene, aan wie een ouderdomspensioen is toegekend, in een inrichting ter verpleging van geesteszieken
      of van zwakzinnigen is opgenomen en de Sociale verzekeringsbank, van de desbetreffende inrichting of van het
      college van burgemeester en wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om het
      ouderdomspensioen aan die inrichting of die gemeente uit te betalen, is de Sociale verzekeringsbank bevoegd dat
      verzoek zonder het stellen van andere voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel20
  - number: '20.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het gedeelte
      van het ouderdomspensioen, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel20
  - number: '20.4'
    text: |-
      Een herziening van het ouderdomspensioen op grond van het eerste lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel20
  - number: '21'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op het nog niet vastgestelde
      ouderdomspensioen beschouwd als ouderdomspensioen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel21
  - number: '22.1'
    text: |-
      De Sociale verzekeringsbank verleent op aanvraag aan personen die de pensioengerechtigde leeftijd bereiken in de
      jaren 2013, 2014 of 2015 een voorschot op het ouderdomspensioen in de vorm van een renteloze lening.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel22
  - number: '22.2'
    text: |-
      De voorschotverlening gaat in op de dag waarop de persoon, bedoeld in het eerste lid, de leeftijd van 65 jaar
      bereikt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel22
  - number: '22.3'
    text: |-
      Het bedrag van het voorschot over een maand, respectievelijk van de voorschotten over twee en drie maanden
      wordt verrekend met het ouderdomspensioen over respectievelijk de eerste zes volledige kalendermaanden, de
      eerste twaalf volledige kalendermaanden en de eerste achttien volledige kalendermaanden na het bereiken van de
      pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel22
  - number: '22.4'
    text: Dit artikel vervalt met ingang van 1 juli 2017.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel22
  - number: '23'
    text: |-
      De termijnen van het ouderdomspensioen, welke niet zijn ingevorderd binnen twee jaren na de eerste dag, waarop zij
      konden worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel23
  - number: '24.1'
    text: |-
      Het ouderdomspensioen dat als gevolg van een besluit als bedoeld in [artikel 17][ref1] onverschuldigd is
      betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van de
      pensioengerechtigde, of zijn wettelijke vertegenwoordiger teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de pensioengerechtigde, of zijn wettelijke vertegenwoordiger:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: '24.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '24.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen [475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '24.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: '24.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: '24.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24
  - number: 24a.1
    text: |-
      De Sociale verzekeringsbank kan het onverschuldigd betaalde ouderdomspensioen, bedoeld in
      [artikel 24, eerste lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel24
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
  - number: 24a.2
    text: |-
      [Artikel 17i][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 17i
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 24b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel24b
  - number: '25.1'
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de
      pensioengerechtigde, of zijn wettelijke vertegenwoordiger, besluiten gedeeltelijk van terugvordering of
      gedeeltelijk van verdere terugvordering af te zien door medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel24
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
  - number: 25.1.a
    text: |-
      redelijkerwijs te voorzien is dat de pensioengerechtigde niet zal kunnen voortgaan met het betalen van zijn
      schulden of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.1.c
    text: |-
      de vordering van de Sociale verzekeringsbank wegens onverschuldigde betaling ten minste zal worden voldaan naar
      evenredigheid met de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.1.d
    text: |-
      een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 25.1.e
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.1.f
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: '25.2'
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de
      pensioengerechtigde van de verplichting, bedoeld in [artikel 49][ref1], en met betrekking tot het niet naleven
      van die verplichting een boete als bedoeld in [artikel 17c][ref2] is opgelegd, dan wel indien hiervoor aangifte is
      gedaan op grond van het [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 17c
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001854
  - number: '25.3'
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van de
      belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.3.b
    text: |-
      de pensioengerechtigde, of zijn wettelijke vertegenwoordiger, zijn schuld aan de Sociale verzekeringsbank niet
      overeenkomstig de schuldregeling voldoet; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25
  - number: 25a
    text: |-
      Een vordering van de Sociale verzekeringsbank als bedoeld in de [artikelen 24][ref1] en [25][ref2] is bevoorrecht
      en volgt onmiddellijk na de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '25'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '26.1'
    text: 'Het ouderdomspensioen is:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel26
  - number: 26.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel26
  - number: 26.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel26
  - number: '26.2'
    text: |-
      Volmacht tot ontvangst van ouderdomspensioen, onder welke vorm of welke benaming ook door de gepensioneerde
      verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel26
  - number: '26.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel26
  - number: '28'
    text: |-
      Degene, die over een maand recht heeft op ouderdomspensioen, heeft over die maand tevens recht op vakantie-
      uitkering.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel28
  - number: '29.1'
    text: 'De bruto-vakantie-uitkering wordt zodanig vastgesteld, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
  - number: 29.1.a
    text: |-
      de netto-vakantie-uitkering per maand van de ongehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1], gelijk is aan 90% van de netto-minimumvakantiebijslag per maand;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 29.1.b
    text: |-
      de netto-vakantie-uitkering per maand van een ongehuwde pensioengerechtigde gelijk is aan 70% van de netto-
      minimumvakantiebijslag per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
  - number: 29.1.c
    text: |-
      de netto-vakantie-uitkering per maand van de gehuwde pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid onderdeel b][ref1], van wie de echtgenoot de pensioengerechtigde leeftijd heeft bereikt dan
      wel de pensioengerechtigde leeftijd nog niet heeft bereikt. maar voor wie geen recht op toeslag bestaat als bedoeld
      in [artikel 8, eerste lid][ref2], gelijk is aan 50% van de netto-minimumvakantiebijslag per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29.2'
    text: 'De bruto-vakantie-uitkering per maand van een gehuwde pensioengerechtigde:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
  - number: 29.2.a
    text: |-
      aan wie een volledige toeslag is toegekend is gelijk aan tweemaal de bruto-vakantie-uitkering als bedoeld in het
      eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
  - number: 29.2.b
    text: |-
      aan wie een niet-volledige toeslag is toegekend met toepassing van [artikel 10, tweede lid][ref1],
      [artikel 13, tweede lid][ref2], of [artikel 12, eerste lid][ref3], is gelijk aan de bruto-vakantie-uitkering,
      bedoeld in het eerste lid, onderdeel c, vermeerderd met de met behulp van de in artikel 12, tweede lid, bedoelde
      percenten over het verschil tussen de vastgestelde bruto-vakantie-uitkering, bedoeld in onderdeel a en de
      vastgestelde bruto-vakantie-uitkering, bedoeld in het eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel12
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '12'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29.3'
    text: |-
      De in het eerste lid bedoelde netto minimumvakantiebijslag bedraagt het verschil tussen het bedrag, dat voor een
      werknemer jonger dan de pensioengerechtigde leeftijd ontstaat door toepassing van [artikel 9, derde lid][ref1],
      op het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2] bedoelde
      bedrag vermeerderd met de aanspraak op vakantiebijslag op grond van [artikel 15 van die wet][ref3] van degene die
      aanspraak heeft op laatstgenoemd bedrag, en het netto-minimumloon, bedoeld in artikel 9, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '29.4'
    text: |-
      In de gevallen, dat op het ouderdomspensioen, vastgesteld op grond van [artikel 9][ref1], met toepassing van
      [artikel 13, eerste lid][ref2], een korting wordt toegepast, wordt op de, op grond van het eerste en derde lid,
      vastgestelde bruto-vakantie-uitkering, een evenredige korting toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '31.1'
    text: Eenmaal per jaar vindt ambtshalve uitbetaling van de vakantie-uitkering plaats.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel31
  - number: '31.2'
    text: |-
      De in het vorige lid bedoelde uitbetaling vindt plaats in de maand mei en omvat de vakantie-uitkering, waarop recht
      bestond over de periode van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel31
  - number: '31.3'
    text: De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel31
  - number: '32'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 18][ref1], [19][ref2], [20][ref3], [23][ref4], [24][ref5], [26][ref6]
      en [49][ref7] vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering, voor zover bij of krachtens
      deze paragraaf niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0002221#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002221
        artikel: '26'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '33'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot deze paragraaf nadere regels worden gesteld. Daarbij kan worden
      afgeweken van het bepaalde in [artikel 31, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel31
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
  - number: '34'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder gewezen verzekerde: degene, wiens
      verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel34
  - number: '35.1'
    text: |-
      De gewezen verzekerde die de aanvangsleeftijd heeft bereikt kan zich, zolang hij de pensioengerechtigde leeftijd
      nog niet heeft bereikt, vrijwillig verzekeren over een periode van maximaal tien jaar, met ingang van de dag na
      de dag waarop de verplichte verzekering is geëindigd. De eerste zin is alleen van toepassing indien de gewezen
      verzekerde direct voorafgaande aan de periode van vrijwillige verzekering ten minste een jaar verplicht verzekerd
      is geweest.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: '35.2'
    text: |-
      Indien de periode van vrijwillige verzekering is onderbroken door een periode van verplichte verzekering korter dan
      een jaar, kan de gewezen verzekerde zich opnieuw vrijwillig verzekeren voor de resterende periode van de tien jaar.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: '35.3'
    text: 'De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.a
    text: |-
      de gewezen verzekerde die in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel
      uit anderen hoofde loon geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.b
    text: |-
      de gewezen verzekerde die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in overeenstemming
      met Onze Minister van Buitenlandse Zaken aan te wijzen organisaties voor ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.c
    text: |-
      de gewezen verzekerde die werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en
      Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.d
    text: |-
      de gewezen verzekerde die werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van
      het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal
      verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.e
    text: |-
      de gewezen verzekerde, die op de dag waarop de verplichte verzekering is geëindigd de leeftijd van 50 jaar heeft
      bereikt, niet in Nederland woont en recht heeft op een:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.e.1°
    text: |-
      uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 35.3.e.2°
    text: |-
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 35.3.e.3°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 35.3.e.4°
    text: |-
      uitkering of op recht op arbeidsondersteuning op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 35.3.e.5°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 35.3.e.6°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de [Wet privatisering Spoorwegpensioenfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006319
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006319
  - number: 35.3.e.7°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de Algemene militaire pensioenwet, zoals die luidde voor 1
      januari 1998; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: 35.3.e.8°
    text: |-
      nabestaandenuitkering op grond van de [Algemene nabestaandenwet][ref1], mits die uitkering of dat pensioen ten
      minste gelijk is aan 35% van het bruto-minimumloon;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 35.3.f
    text: de gewezen verzekerde, bedoeld in artikel 40.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: '35.4'
    text: |-
      De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op de echtgenoot van de in het
      derde lid genoemde gewezen verzekerde en de inwonende minderjarige kinderen met wie die gewezen verzekerde of die
      echtgenoot in familierechtelijke betrekking staat. Voor de toepassing van dit lid wordt onder de in het derde lid
      genoemde gewezen verzekerde mede verstaan de gewezen verzekerde, bedoeld in onderdeel e van dat lid, wiens recht
      op een uitkering als bedoeld in dat onderdeel uitsluitend als gevolg van het bereiken van de pensioengerechtigde
      leeftijd is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: '35.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel35
  - number: '36.1'
    text: |-
      De gewezen verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], gebruik wil
      maken, is verplicht uiterlijk een jaar na de dag, waarop de verplichte verzekering is geëindigd, een aanvraag
      daartoe in te dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: '36.2'
    text: |-
      De aanvraag wordt afgewezen indien de gewezen verzekerde niet voldoet aan de bij of krachtens dit hoofdstuk
      gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel36
  - number: '37'
    text: |-
      De vrijwillige verzekering, bedoeld in [artikel 35, eerste lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: 37.a
    text: |-
      met ingang van de eerste dag van de tweede maand volgend op die waarin de Sociale verzekeringsbank een
      schriftelijke opzegging van de gewezen verzekerde heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
  - number: 37.b
    text: met ingang van de dag waarop de gewezen verzekerde de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
  - number: 37.c
    text: |-
      met ingang van de dag, waarop de periode van tien jaar, bedoeld in [artikel 35, eerste lid][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel35
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '35'
        hoofdstuk: IV
  - number: 37.d
    text: met ingang van de dag, waarop de gewezen verzekerde verplicht verzekerd wordt op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
  - number: 37.e
    text: |-
      met ingang van de eerste dag van de vierde maand volgend op de laatste dag van de door de Sociale verzekeringsbank
      gestelde termijn waarbinnen de verschuldigde premie voor de vrijwillige algemene ouderdomsverzekering, bedoeld in
      [artikel 71 van de Wet financiering sociale verzekeringen][ref1], dient te worden betaald, indien de betaling niet
      of niet geheel heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel71
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '71'
  - number: 37.f
    text: |-
      met ingang van de dag volgend op de laatste dag van een door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de gewezen verzekerde de van hem, in verband met de toepassing van dit hoofdstuk, verlangde inlichtingen
      dient te verstrekken, indien de gewezen verzekerde die gegevens niet heeft verstrekt, tenzij de gewezen verzekerde
      aannemelijk maakt dat dat hem niet in overwegende mate kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel37
  - number: '38.1'
    text: |-
      De verzekerde, die voorafgaand aan de verplichte verzekering niet eerder verplicht verzekerd is geweest, kan zich,
      zolang hij de pensioengerechtigde leeftijd nog niet heeft bereikt, vrijwillig verzekeren vanaf de aanvangsleeftijd,
      over de achterliggende periode, waarin hij niet verplicht verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel38
  - number: '38.2'
    text: |-
      Voor de toepassing van het eerste lid wordt degene wiens verplichte verzekering voor het bereiken van de
      aanvangsleeftijd is beëindigd, geacht niet verplicht verzekerd te zijn geweest gedurende de periode voorafgaand aan
      het bereiken van de aanvangsleeftijd.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel38
  - number: '38.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel38
  - number: '39.1'
    text: |-
      De verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 38, eerste lid][ref1], gebruik wil maken, is
      verplicht uiterlijk tien jaar na de dag, waarop de verplichte verzekering is ontstaan, een aanvraag daartoe in te
      dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel38
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '38'
        hoofdstuk: IV
  - number: '39.2'
    text: |-
      De [artikelen 36, tweede lid][ref1], en [37, onderdelen e en f][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel37
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '37'
        hoofdstuk: IV
  - number: '40'
    text: |-
      De [artikelen 34 tot en met 39][ref1] zijn van overeenkomstige toepassing op de gewezen verzekerde die op
      31 december 2005 vrijwillig verzekerd was op grond van een algemene maatregel van bestuur die gebaseerd was op
      artikel 40, zoals dat luidde op de dag voor inwerkingtreding van de Wet tot wijziging van een aantal wetten op het
      terrein van het Ministerie van Sociale Zaken en Werkgelegenheid teneinde deze in overeenstemming te brengen met de
      motie van het lid Jurgens c.s.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel34
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '34'
        hoofdstuk: IV
  - number: '48.1'
    text: |-
      Degene, van wie ingevolge [artikel 65, eerste lid, van de Wet financiering sociale verzekeringen][ref1] belasting
      is geheven of in door Onze Minister en Onze Minister van Financiën bij ministeriële regeling aan te wijzen gevallen
      geacht wordt te zijn geheven, heeft recht op een uitkering, indien en zolang hij recht heeft op ouderdomspensioen
      krachtens deze wet en hij wegens gemoedsbezwaren geen aanspraak maakt op dit ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel65
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '65'
  - number: '48.2'
    text: |-
      Degene, die ingevolge het eerste lid recht op een uitkering heeft, dient de Sociale verzekeringsbank schriftelijk
      in kennis te stellen, zodra naar zijn oordeel het totaal aan uitkering betaalde bedragen heeft overschreden
      het totaal van de bedragen, die van hem op grond van de in de aanhef van het eerste lid bedoelde bepalingen aan
      belasting zijn geheven of geacht worden te zijn geheven. De uitbetaling van deze uitkering wordt dan beëindigd met
      ingang van een betalingstermijn, aanvangende na de dag, waarop de kennisgeving door de Sociale verzekeringsbank is
      ontvangen, doch niet later dan de eerste dag van de tweede maand na de dag van ontvangst van die kennisgeving.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: '48.3'
    text: 'Voor de toepassing van het bepaalde in het vorige lid wordt het totaal van de aan belasting geheven bedragen:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: 48.3.a
    text: verminderd met de bedragen die niet zijn ingevorderd, dan wel die de verzekerde nalatig is gebleven te betalen;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: 48.3.b
    text: vermeerderd met een door de in het eerste lid bedoelde uitkeringsgerechtigde te bepalen opslag.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: '48.4'
    text: |-
      Het bedrag van de uitkering is gelijk aan het bedrag aan ouderdomspensioen en vakantie-uitkering, waarop de
      belanghebbende krachtens deze wet recht heeft.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: '48.5'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 14 tot en met 26][ref1], [31][ref2] en [33][ref3] is, voor zover
      daarvan ten aanzien van de [artikelen 17, derde lid][ref4], [18][ref5], en [24, eerste lid][ref6], bij ministeriële
      regeling niet wordt afgeweken, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0002221#Artikel24
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '14'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '33'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002221
        artikel: '24'
        hoofdstuk: III
        paragraaf: '2'
  - number: '48.6'
    text: |-
      Het bepaalde bij [artikel 49][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: '48.7'
    text: |-
      Onze Minister en Onze Minister van Financiën kunnen bij ministeriële regeling ter zake van het bepaalde in het
      eerste tot en met het zesde lid nadere regels en uitvoeringsvoorschriften geven.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel48
  - number: '49'
    text: |-
      De pensioengerechtigde, zijn echtgenoot, alsmede zijn wettelijke vertegenwoordiger of de instelling waaraan
      ingevolge [artikel 20][ref1] ouderdomspensioen wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering of op het bedrag van de uitkering, dat wordt betaald. De verplichting geldt niet indien die feiten en
      omstandigheden door de Sociale verzekeringsbank kunnen worden vastgesteld op grond van bij wettelijk voorschrift
      als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen
      administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel20
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
  - number: '50'
    text: |-
      In aanvulling op [artikel 49][ref1] kan de Sociale verzekeringsbank de pensioengerechtigde of zijn wettelijke
      vertegenwoordiger verzoeken aan te tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '49'
        hoofdstuk: VI
  - number: 50.a
    text: |-
      de pensioengerechtigde een pensioengerechtigde is als bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 50.b
    text: |-
      de feitelijke woonsituatie van de pensioengerechtigde in overeenstemming is met het door hem dan wel zijn
      wettelijke vertegenwoordiger verstrekte adres.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel50
  - number: '51.1'
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel51
  - number: '51.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel51
  - number: '51.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel51
  - number: '52'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '53.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [2][ref2], [3][ref3]
      en [6][ref4] en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel6
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '3'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
  - number: '53.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel53
  - number: '55.1'
    text: |-
      Degene, die vóór het in werking treden van [artikel 6][ref1] de leeftijd van 15, doch nog niet die van 65
      jaar heeft bereikt, en die - al dan niet onafgebroken - gedurende zes jaren na de voleindiging van zijn 59ste
      levensjaar in Nederland, Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en
      Saba heeft gewoond, wordt voor de toepassing van het bepaalde in [artikel 13, eerste lid, onderdeel a][ref2],
      gedurende het tijdvak, gelegen tussen de voleindiging van zijn 15de levensjaar en het in werking treden van
      [artikel 6][ref3], geacht verzekerd te zijn geweest. Voor de toepassing van het bepaalde in de vorige volzin wordt,
      uitsluitend voor de vaststelling van de toeslag, bedoeld in [artikel 8][ref4] met toepassing van het bepaalde in
      [artikel 13, tweede lid, onderdeel a][ref5], de jongere echtgenoot van de pensioengerechtigde geacht het 59ste
      levensjaar te hebben voleindigd op dezelfde dag als de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '55.2'
    text: |-
      Degene, die voldoet aan het bepaalde in de eerste volzin van het eerste lid, doch nimmer ingevolge deze wet
      verzekerd is geweest, wordt nochtans voor de toepassing van [artikel 7][ref1] geacht verzekerd te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '56'
    text: |-
      De voordelen uit [artikel 55][ref1] voortvloeiende komen enkel toe aan degene, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel55
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '55'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 56.a
    text: Nederlander is, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel56
  - number: 56.b
    text: in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel56
  - number: '57'
    text: 'Bij algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel57
  - number: 57.a
    text: |-
      voor de toepassing van [artikel 56][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 57.b
    text: |-
      voor de toepassing van de [artikelen 55][ref1] en [56][ref2] het wonen buiten Nederland wordt gelijkgesteld met het
      wonen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '55'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '56'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '62'
    text: |-
      De [artikelen 8a][ref1] en [9a][ref2] zijn niet van toepassing op de pensioengerechtigde, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9a
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 9a
        hoofdstuk: III
        paragraaf: '1'
  - number: 62.a
    text: op 31 december 1999 recht heeft op een ouderdomspensioen en op die dag niet in Nederland woont, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel62
  - number: 62.b
    text: |-
      op 19 december 2005 dit recht op een ouderdomspensioen uitsluitend nog heeft op grond van [artikel 2 van de wet van
      9 december 2004, houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te Genève tot stand
      gekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen met betrekking
      tot de sociale zekerheid](onbekend) (Verdrag nr. 118 aangenomen door de Internationale Arbeidsconferentie in haar
      zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel62
  - number: '63.1'
    text: |-
      De besluiten tot herziening van het ouderdomspensioen, genomen met toepassing van [artikel 17][ref1] zoals
      [dat artikel][ref2] luidde op de dag voorafgaand aan de datum van inwerkingtreding van de wet van 2 november 2006
      tot wijziging van de Algemene Ouderdomswet in verband met samenwonen ten behoeve van zorg voor een hulpbehoevende
      (Stb. 558), worden op aanvraag door de Sociale verzekeringsbank met toepassing van [artikel 17, tweede lid][ref3],
      gewijzigd met ingang van 4 april 2006 of indien de herziening op een later tijdstip heeft plaatsgevonden met ingang
      van dat tijdstip indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel17
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '17'
        hoofdstuk: III
        paragraaf: '2'
  - number: 63.1.a
    text: |-
      de herziening voortvloeit uit de omstandigheid van het voeren van een gezamenlijke huishouding in
      verband met zorg door een pensioengerechtigde voor een hulpbehoevende pensioengerechtigde als bedoeld in
      [artikel 1, onderdeel j, van de Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '1'
  - number: 63.1.b
    text: de pensioengerechtigden ieder beschikken over een eigen woning.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel63
  - number: '63.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt ingediend binnen zes maanden na de datum van inwerkingtreding van de
      in het eerste lid genoemde wet.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel63
  - number: 63a
    text: |-
      [Artikel 1, achtste en negende lid][ref1], is niet van toepassing, indien voor de inwerkingtreding van deze
      artikelleden, op grond van [artikel 8][ref2] recht bestaat op toeslag, omdat de ongehuwde pensioengerechtigde
      wegens een gezamenlijke huishouding met een meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind
      is aangemerkt als gehuwd, voor zolang dit recht op toeslag bestaat, tenzij toepassing van de genoemde artikelleden
      leidt tot een hoger ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '64'
    text: |-
      Ten aanzien van de persoon wiens vrijheid op de dag voorafgaande aan de inwerkingtreding van [artikel 8b][ref1]
      reeds rechtens was ontnomen wordt voor de toepassing van [dat artikel][ref2] als eerste dag waarop de
      vrijheidsontneming plaatsvindt, aangemerkt de dag van inwerkingtreding van [artikel 8b][ref3] en eindigt het recht
      op ouderdomspensioen in afwijking van [artikel 8b, tweede lid][ref4], vanaf de dag dat deze vrijheidsontneming
      zes maanden heeft geduurd. De beëindiging gaat in op de eerste dag van de maand volgend op de maand waarin de
      vrijheidsontneming als bedoeld in de eerste zin zes maanden heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel8b
