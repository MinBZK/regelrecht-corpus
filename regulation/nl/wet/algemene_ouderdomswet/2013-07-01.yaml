preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen inzake een algemene, de gehele
    bevolking omvattende, verplichte verzekering tegen geldelijke gevolgen van ouderdom;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.1.b
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.1.c
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 1.1.d
    text: |-
      bruto-minimumloon: het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      bedoelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 1.1.e
    text: |-
      rechtens zijn vrijheid is ontnomen: rechtens zijn vrijheid is ontnomen, behoudens de
      gevallen, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.1.f
    text: |-
      justitiële inrichting: een penitentiaire inrichting of een inrichting voor verpleging van ter beschikking
      gestelden;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.1.g
    text: |-
      continentaal plat: de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref1], voor zover deze grenst aan de
      territoriale zee van Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0010480#Artikel1
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010480
        artikel: '1'
  - number: 1.1.g
    text: |-
      vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf of
      vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref1], behoudens de gevallen, bedoeld in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.1.h
    text: |-
      pensioengerechtigde leeftijd: leeftijd, bedoeld in [artikel 7a][ref1], waarop recht op ouderdomspensioen ontstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.1.i
    text: |-
      aanvangsleeftijd: leeftijd, bedoeld in [artikel 7a][ref1], met ingang waarvan een niet verzekerd tijdvak leidt tot
      een korting op het ouderdomspensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.1.j
    text: |-
      CBS: Centraal bureau voor de statistiek, bedoeld in
      [artikel 2, eerste lid, van de Wet op het Centraal bureau voor de statistiek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel2
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '2'
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.8'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het derde lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
  - number: '1.9'
    text: |-
      Onder voormalig pleegkind als bedoeld in het achtste lid wordt verstaan een pleegkind waarvoor de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of kinderbijslag
      ontving op grond van de [Algemene Kinderbijslagwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0002368
  - number: '2'
    text: Ingezetene in de zin van deze wet is degene, die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen welke in Nederland hun thuishaven hebben, ten opzichte van de
      bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel3
  - number: '3.3'
    text: |-
      Hij die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels in
      Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van een
      andere Mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel3
  - number: '6.1'
    text: |-
      Verzekerd overeenkomstig de bepalingen van deze wet is degene, die nog niet de pensioengerechtigde leeftijd heeft
      bereikt, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte arbeid
      aan de loonbelasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: '6.4'
    text: 'Bij een maatregel, als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: 6.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in artikel 8, onder g of h, van de Vreemdelingenwet 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6a
    text: |-
      Zo nodig in afwijking van [artikel 6][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel6
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '6'
        hoofdstuk: II
  - number: 6a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6a
  - number: 6a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel6a
  - number: '7'
    text: Recht op ouderdomspensioen overeenkomstig de bepalingen van deze wet heeft degene, die
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7
  - number: 7.a
    text: de pensioengerechtigde leeftijd heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7
  - number: 7.b
    text: |-
      ingevolge deze wet verzekerd is geweest in het tijdvak, aanvangende met de dag waarop de aanvangsleeftijd is
      bereikt en eindigende met de dag voorafgaande aan de dag waarop de pensioengerechtigde leeftijd is bereikt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7
  - number: 7a.1
    text: 'De pensioengerechtigde leeftijd en de aanvangsleeftijd zijn:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.a
    text: 'vóór 1 januari 2013: 65, respectievelijk 15 jaar;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.b
    text: 'in 2013: 65 jaar en één maand, respectievelijk 15 jaar en één maand;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.c
    text: 'in 2014: 65 jaar en twee maanden, respectievelijk 15 jaar en twee maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.d
    text: 'in 2015: 65 jaar en drie maanden, respectievelijk 15 jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.e
    text: 'in 2016: 65 jaar en vijf maanden, respectievelijk 15 jaar en vijf maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.f
    text: 'in 2017: 65 jaar en zeven maanden, respectievelijk 15 jaar en zeven maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.g
    text: 'in 2018: 65 jaar en negen maanden, respectievelijk 15 jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.h
    text: 'in 2019: 66 jaar, respectievelijk 16 jaar;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.i
    text: 'in 2020: 66 jaar en drie maanden, respectievelijk 16 jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.j
    text: 'in 2021: 66 jaar en zes maanden, respectievelijk 16 jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.k
    text: 'in 2022: 66 jaar en negen maanden, respectievelijk 16 jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.1.l
    text: 'in 2023: 67 jaar, respectievelijk 17 jaar.'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.2
    text: |-
      De verdere verhoging van de pensioengerechtigde leeftijd en de aanvangsleeftijd wordt jaarlijks, voor de eerste
      maal uiterlijk op 1 januari 2019 voor het jaar 2024, bij algemene maatregel van bestuur vastgesteld volgens de
      volgende formule: V = (L – 18,26) – (P – 65) waarbij: V staat voor de periode waarmee de pensioengerechtigde
      leeftijd respectievelijk aanvangsleeftijd wordt verhoogd, uitgedrukt in perioden van een jaar; L staat voor de
      geraamde macro gemiddelde resterende levensverwachting op 65-jarige leeftijd in het kalenderjaar van verhoging;
      P staat voor de pensioengerechtigde leeftijd in het kalenderjaar voorafgaande aan het kalenderjaar van verhoging.
      Indien V negatief is of minder dan 0,25 bedraagt, wordt deze gesteld op 0. Indien V 0,25 of meer bedraagt, wordt
      deze gesteld op drie maanden.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.3
    text: |-
      De verhoging, bedoeld in het tweede lid, treedt telkens in werking vijf jaar na de uiterste datum van vaststelling,
      bedoeld in het tweede lid, voor de eerste maal met ingang van 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: 7a.4
    text: |-
      De ramingen van de macro gemiddelde resterende levensverwachting, bedoeld in het tweede lid, worden uitgevoerd en
      bekendgemaakt door het CBS.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel7a
  - number: '8.1'
    text: |-
      De pensioengerechtigde die voor 1 januari 2015 is gehuwd en voor die datum recht heeft op ouderdomspensioen en van
      wie de echtgenoot jonger is dan de pensioengerechtigde leeftijd, heeft overeenkomstig de bepalingen van deze wet
      recht op een toeslag, tenzij, met inachtneming van [artikel 11][ref1], het inkomen uit arbeid of overig inkomen van
      die echtgenoot meer bedraagt dan de volledige bruto-toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid ontstaat op of na 1 januari 2015 als gevolg van wijziging van het inkomen, bedoeld
      in het eerste lid, geen recht meer op toeslag.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8
  - number: '8.3'
    text: |-
      Waar in deze wet en in de tot haar uitvoering genomen besluiten wordt gesproken van ouderdomspensioen wordt
      daaronder mede verstaan de in het eerste lid bedoelde toeslag, voor zover niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8
  - number: 8a.1
    text: |-
      Geen recht op toeslag heeft de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die niet in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.2
    text: |-
      Het eerste lid is niet van toepassing indien de pensioengerechtigde woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op toeslag kan bestaan.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.3
    text: |-
      Voor de pensioengerechtigde, wiens recht op toeslag op grond van het eerste lid niet is ontstaan of is geëindigd,
      ontstaat respectievelijk herleeft het recht op toeslag op de eerste dag van de maand:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.3.a
    text: waarin hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op toeslag kan bestaan;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.4
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht heeft op toeslag:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.4.a
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die werkzaamheden verricht in het algemeen belang
      en niet in Nederland woont;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.4.b
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 8, eerste lid][ref1], die in Aruba, Curaçao, Sint Maarten of in de
      openbare lichamen Bonaire, Sint Eustatius en Saba woont; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.4.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.5
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op toeslag kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.5.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8a.5.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8a
  - number: 8b.1
    text: |-
      Geen recht op ouderdomspensioen ontstaat voor de pensioengerechtigde, aan wie rechtens zijn vrijheid is
      ontnomen indien de dag waarop het ouderdomspensioen zou ingaan dan wel de dag na afloop van de toepassing van
      [artikel 8c, eerste lid][ref1], met betrekking tot dat recht op ouderdomspensioen, is gelegen in de periode dat hem
      rechtens zijn vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8c
        hoofdstuk: III
        paragraaf: '1'
  - number: 8b.2
    text: |-
      Het recht op ouderdomspensioen eindigt, indien de pensioengerechtigde rechtens zijn vrijheid is ontnomen gedurende
      ten minste een maand.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
  - number: 8b.3
    text: |-
      De persoon die op grond van het eerste of tweede lid geen recht op ouderdomspensioen heeft, heeft met ingang van de
      dag waarop hij in vrijheid is gesteld met inachtneming van de bepalingen van deze wet recht op ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
  - number: 8b.4
    text: |-
      Voor de toepassing van het tweede lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
  - number: 8b.5
    text: |-
      Het eerste en tweede lid zijn niet van toepassing en het derde lid is van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
  - number: 8b.6
    text: |-
      Voor de pensioengerechtigde die op de dag voorafgaande aan de vrijheidsontneming geen recht heeft op
      ouderdomspensioen op grond van [artikel 8c, tweede lid][ref1], eindigt het recht op ouderdomspensioen, in afwijking
      van het tweede lid, vanaf de dag dat de vrijheidsontneming ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8c
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8c
        hoofdstuk: III
        paragraaf: '1'
  - number: 8c.1
    text: |-
      Voor de pensioengerechtigde ontstaat geen recht op ouderdomspensioen indien en voor zolang hij zich op de dag
      waarop het ouderdomspensioen zou ingaan en daarna onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8c
  - number: 8c.2
    text: |-
      Het recht op ouderdomspensioen eindigt, indien de pensioengerechtigde zich, nadat het recht op ouderdomspensioen is
      ingegaan, onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8c
  - number: 8c.3
    text: |-
      De persoon die op grond van het eerste of tweede lid geen recht op ouderdomspensioen heeft, heeft met ingang van
      de dag dat hij zich niet langer onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel met inachtneming van de bepalingen van deze wet recht op ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel8c
  - number: '9.1'
    text: 'Deze wet kent een bruto-ouderdomspensioen voor:'
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9.1.a
    text: de ongehuwde pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9.1.b
    text: de gehuwde pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9.1.c
    text: |-
      de ongehuwde pensioengerechtigde die een kind heeft jonger dan 18 jaar, dat niet als eigen kind,
      aangehuwd kind of pleegkind tot het huishouden van een ander behoort en voor wie aan hem op grond van
      [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag wordt betaald, zal worden betaald of zou worden
      betaald indien [artikel 7, tweede lid, van die wet][ref2] niet van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '9.2'
    text: De in het eerste lid bedoelde ouderdomspensioenen worden afgeleid van het netto-minimumloon per maand.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: '9.3'
    text: |-
      Onder het netto-minimumloon wordt verstaan het bruto-minimumloon, na aftrek van premies op grond van de
      [Wet financiering sociale verzekeringen][ref1] en loonbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '9.4'
    text: |-
      De loonbelasting en premie voor de volksverzekeringen, bedoeld in
      [artikel 1 van de Wet financiering sociale verzekeringen][ref1], worden berekend voor een werknemer, jonger dan
      de pensioengerechtigde leeftijd, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref2], over het bruto-minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '22'
  - number: '9.5'
    text: |-
      De bruto-ouderdomspensioenen worden zodanig vastgesteld, dat na aftrek van de in te houden loonbelasting
      en premie voor de volksverzekeringen, rekening houdend met de toepasselijke heffingskortingen voor een
      persoon van de pensioengerechtigde leeftijd en ouder, en van de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 9.5.a
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel a,
      gelijk is aan 70% van het netto-minimumloon per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9.5.b
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel b,
      gelijk is aan 50% van het netto-minimumloon per maand;
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9.5.c
    text: |-
      het netto-ouderdomspensioen per maand van een pensioengerechtigde als bedoeld in het eerste lid, onderdeel c,
      gelijk is aan 90% van het netto-minimumloon per maand.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: '9.6'
    text: |-
      De volledige bruto-toeslag, bedoeld in [artikel 8][ref1], is gelijk aan het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.7'
    text: |-
      Een herziening van het bruto-ouderdomspensioen in verband met een wijziging van het netto-minimumloon vindt plaats
      zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: '9.8'
    text: |-
      De Sociale verzekeringsbank betaalt het herziene ouderdomspensioen, bedoeld in het zevende lid, bij de
      eerstvolgende betaling van het ouderdomspensioen nadat de herziening, bedoeld in het zevende lid, heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9
  - number: 9a.1
    text: |-
      In afwijking van [artikel 9][ref1] is voor de pensioengerechtigde, die niet in Nederland woont, het bruto-
      ouderdomspensioen gelijk aan het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in artikel 9, eerste
      lid, onderdeel b, onverminderd [artikel 13, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.2
    text: |-
      [Artikel 8a, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8a
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht heeft op ouderdomspensioen alsof hij
      in Nederland woont:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
  - number: 9a.3.a
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref1], die werkzaamheden verricht in
      het algemeen belang en niet in Nederland woont;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3.b
    text: |-
      de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onderdeel a of c][ref1], die in Aruba, Curaçao, Sint
      Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba woont; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: 9a.3.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
  - number: 9a.4
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op ouderdomspensioen bestaat alsof de pensioengerechtigde in Nederland woont. In deze mededeling
      wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
  - number: 9a.4.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
  - number: 9a.4.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel9a
  - number: '10.1'
    text: |-
      De volledige bruto-toeslag wordt toegekend voorzolang, met inachtneming van het bepaalde in [artikel 11][ref1], het
      inkomen uit arbeid of overig inkomen van de echtgenoot van de pensioengerechtigde nihil bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Op de volledige bruto-toeslag wordt in mindering gebracht het inkomen van de echtgenoot van de pensioengerechtigde
      uit arbeid of overig inkomen, vastgesteld met inachtneming van het bepaalde in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.1'
    text: |-
      Voor de toepassing van de [artikelen 8][ref1] en [10][ref2] wordt van het inkomen uit arbeid buiten aanmerking
      gelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
  - number: 11.1.1°
    text: een bedrag, gelijk aan 15% van het bruto-minimumloon; alsmede
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel11
  - number: 11.1.2°
    text: |-
      voor zover het inkomen uit arbeid meer bedraagt dan het onder 1° bedoelde bedrag, een derde gedeelte van dat
      meerdere.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid wordt in de maand waarin de pensioengerechtigde of de echtgenoot van de
      pensioengerechtigde de pensioengerechtigde leeftijd heeft bereikt, het bruto-minimumloon, bedoeld in het eerste
      lid, onder 1°, vermenigvuldigd met de factor X/Y, waarbij: - X staat voor: a. het aantal dagen gelegen in de maand
      waarin de pensioengerechtigde de pensioengerechtigde leeftijd bereikt, vanaf de dag dat de pensioengerechtigde deze
      leeftijd heeft bereikt, of b. het aantal dagen gelegen in de maand waarin de echtgenoot van de pensioengerechtigde
      de pensioengerechtigde leeftijd bereikt, voordat de echtgenoot deze leeftijd heeft bereikt, en
        - Y staat voor het aantal dagen van de maand waarin de pensioengerechtigde of de echtgenoot van de
      pensioengerechtigde de pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel11
  - number: '12.1'
    text: |-
      Op de bruto-toeslag, vastgesteld op grond van [artikel 10][ref1] en, indien van toepassing, na toepassing
      van [artikel 13, tweede lid][ref2], wordt een korting toegepast tot 10% voor zover de toeslag samen
      met het gezamenlijke inkomen uit arbeid of overig inkomen van de gehuwde pensioengerechtigde en
      diens echtgenoot vermeerderd met het op grond van de [artikelen 9, zesde lid, onderdeel b][ref3] en
      [13, eerste lid][ref4], vastgestelde bruto-ouderdomspensioen door de toepassing van de korting niet minder
      bedraagt dan 162% van het bruto-minimumloon met inbegrip van de bruto-minimumvakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '12.2'
    text: |-
      De met toepassing van [artikel 10, tweede lid][ref1], of [artikel 13, tweede lid][ref2],
      of het eerste lid berekende niet-volledige bruto-toeslag wordt voor toepassing van
      [artikel 29, tweede lid, aanhef en onderdeel b][ref3], uitgedrukt in een percentage van de volledige bruto-toeslag.
      Dit percentage wordt rekenkundig afgerond op een veelvoud van éénhonderdste.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002221/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
