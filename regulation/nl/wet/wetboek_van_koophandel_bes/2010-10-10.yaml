url: https://wetten.overheid.nl/BWBR0028278/2010-10-10
articles:
  - number: '1'
    text: |-
      Het Burgerlijk Wetboek BES is, voor zover daarvan bij dit Wetboek niet is afgeweken, ook op de in dit Wetboek
      behandelde onderwerpen toepasselijk.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel1
  - number: '10'
    text: |-
      De in deze titel genoemde vennootschappen worden geregeerd door de overeenkomsten van partijen, door dit Wetboek en
      door het burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel10
  - number: '11'
    text: |-
      De vennootschap onder een firma is de maatschap, tot de uitoefening van een bedrijf onder een gemeenschappelijke
      naam aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Iedere vennoot, die daarvan niet is uitgesloten, is bevoegd ten name van de vennootschap te handelen, gelden uit te
      geven en te ontvangen, en de vennootschap aan derden en derden aan de vennootschap te verbinden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Handelingen, welke niet tot de vennootschap betrekkelijk zijn of tot welke de vennoten volgens de overeenkomst niet
      bevoegd zijn, worden onder de bepaling van [artikel 12][ref1] niet begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel12
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '12'
        afdeling: Tweede
  - number: '14'
    text: |-
      In een vennootschap onder een firma is iedere vennoot wegens de verbintenissen der vennootschap hoofdelijk
      verbonden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel14
  - number: '15'
    text: |-
      De vennootschap bij wijze van geldschieting, anders en commandite genaamd, wordt aangegaan tussen een persoon, of
      tussen meer dan een hoofdelijk verbonden vennoten, en een of meer andere personen als geldschieters.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Een vennootschap kan alzo tegelijkertijd zijn een vennootschap onder een firma, ten aanzien van de vennoten onder
      de firma, en een vennootschap bij wijze van geldschieting, ten aanzien van de geldschieter.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Behoudens de uitzondering, in het [tweede lid van artikel 27][ref1] voorkomende, mag de naam van de vennoot bij
      wijze van geldschieting in de firma niet worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel27
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '27'
        afdeling: Tweede
  - number: '17.2'
    text: De vennoot mag noch daden van beheer verrichten, noch in de zaken van de vennootschap werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel17
  - number: '17.3'
    text: |-
      Hij draagt niet verder in de schade dan ten belope van de gelden, welke hij in de vennootschap heeft ingebracht of
      heeft moeten inbrengen, zonder dat hij immer tot teruggave van genoten winsten verplicht zij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel17
  - number: '17.4'
    text: |-
      Tenzij tussen partijen anders is overeengekomen, kan een vennoot zijn belang in de vennootschap niet overdragen
      zonder toestemming van de overige vennoten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De vennoot bij wijze van geldschieting, die de bepalingen van het
      [eerste of van het tweede lid van het vorige artikel][ref1] overtreedt, is wegens alle schulden en verbintenissen
      van de vennootschap hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel17
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '17'
        afdeling: Tweede
  - number: '19.1'
    text: |-
      De vennootschap onder firma en de commanditaire vennootschap worden aangegaan bij authentieke of bij onderhandse
      akte; het gemis van een akte mag echter aan derden niet worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel19
  - number: '19.2'
    text: In de akte van vennootschap worden inrichting en structuur van de vennootschap bepaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel19
  - number: '19.3'
    text: |-
      De akte van vennootschap houdt in de woonplaats van de vennootschap. Indien overeenkomstig de akte de woonplaats
      is gelegen in het openbaar lichaam Bonaire, Sint Eustatius of Saba, en de vennootschap in het handelsregister
      is ingeschreven met vermelding van deze woonplaats wordt de vennootschap beheerst door het recht van de openbare
      lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel19
  - number: '19.4'
    text: |-
      Partijen kunnen anders overeenkomen indien dit in overeenstemming is met het in de openbare lichamen Bonaire, Sint
      Eustatius en Saba geldende internationaal privaatrecht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel19
  - number: '20'
    text: |-
      De vennoten onder een firma zijn verplicht de vennootschap te doen inschrijven in het handelsregister
      overeenkomstig de daarvoor geldende wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel20
  - number: '26'
    text: |-
      Zolang de inschrijving in het handelsregister niet is geschied, wordt de vennootschap onder een firma ten aanzien
      van derden aangemerkt als algemeen voor alle zaken, als aangegaan voor een onbepaalde tijd en als geen der vennoten
      uitsluitende van het recht om voor de firma te handelen en te tekenen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      De firma van een ontbonden vennootschap mag, hetzij uit kracht van de overeenkomst, hetzij indien de gewezen
      vennoot wiens naam in de firma voorkwam daarin uitdrukkelijk toestemt, of bij overlijden diens erfgenamen zich
      daartegen niet verzetten, door een of meer personen worden aangehouden, die ten blijke daarvan een akte moeten
      uitbrengen en dezelve doen inschrijven in het handelsregister overeenkomstig de daarvoor geldende wettelijke
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      De bepaling van het [eerste lid van artikel 17][ref1] is niet toepasselijk, indien de afgetredene van vennoot onder
      een firma vennoot bij wijze van geldschieting is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel17
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '17'
        afdeling: Tweede
  - number: '28'
    text: |-
      De ontbinding van een vennootschap onder een firma vóór de tijd bij de overeenkomst bepaald, of door afstand of
      opzegging tot stand gebracht, haar verlenging na verloop van het bepaalde tijdstip, en alle veranderingen in de
      oorspronkelijke overeenkomst gemaakt, welke derden aangaan, zijn onderworpen aan de voormelde inschrijving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      Bij de ontbinding van de vennootschap moeten de vennoten, die het recht van beheer hebben gehad, de zaken der
      gewezen vennootschap in haar naam vereffenen, tenzij bij de overeenkomst anders ware bepaald of de gezamenlijke
      vennoten (die bij wijze van geldschieting daaronder niet begrepen) hoofdelijk en bij meerderheid van stemmen een
      andere vereffenaar hebben
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel29
  - number: '30'
    text: |-
      Indien de staat van de kas der ontbonden vennootschap niet toereikt om de opeisbare schulden te betalen, zijn
      de vereffenaars bevoegd om de benodigde penningen te vorderen; iedere vennoot moet deze voor zijn aandeel in de
      vennootschap inbrengen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel30
  - number: '31'
    text: |-
      De gelden, welke gedurende de vereffening uit de kas der vennootschap kunnen gemist worden, mogen voorlopig worden
      verdeeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel31
  - number: '173'
    text: |-
      De voerlieden en kapiteins zijn aansprakelijk voor alle schaden aan de ten vervoer overgenomen goederen overkomen,
      uitgezonderd die, welke uit een gebrek van het goed zelf, door overmacht, of door schuld of nalatigheid van de
      afzender of expediteur, veroorzaakt zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel173
  - number: '174'
    text: De voerman of de kapitein is niet ter zake van vertraging aansprakelijk, indien deze door overmacht is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel174
  - number: '175.1'
    text: |-
      Door het bestellen en aannemen van de vervoerde goederen en door de betaling van het vrachtloon, is elke
      rechtsvordering ter zake van uiterlijk zichtbare beschadiging of vermindering tegen de voerman of de kapitein
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel175
  - number: '175.2'
    text: |-
      Indien de beschadiging of vermindering niet uiterlijk zichtbaar was, mag een gerechtelijke bezichtiging gedaan
      worden nadat de goederen zijn aangenomen, om het even of de vracht al dan niet voldaan zij, mits die bezichtiging
      gevraagd worde binnen tweemaal vierentwintig uren na de ontvangst en van de eenzelvigheid van de goederen blijke.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel175
  - number: '176.1'
    text: |-
      Indien de aanneming van de goederen wordt geweigerd of daarover geschil valt, doet de rechter in eerste aanleg, op
      een eenvoudig verzoekschrift, waarop de wederpartij, zo zij zich daar ter plaatse bevindt, moet worden gehoord, de
      nodige voorziening tot het opnemen van het goed door deskundigen, en mag hij insgelijks bevelen, dat de goederen
      in een behoorlijke bewaarplaats worden opgeslagen, om daaruit aan de voerman of de kapitein het beloop van zijn
      vrachtloon om onkosten te voldoen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel176
  - number: '176.2'
    text: |-
      De rechter in eerste aanleg is bevoegd om, op gelijke wijze als hierboven is bepaald, machtiging te verlenen tot de
      openbare verkoop van bederfelijke waren of van zodanig gedeelte van de goederen, als tot voldoening van vrachtloon
      en kosten vereist wordt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel176
  - number: '177.1'
    text: |-
      Alle rechtsvordering tegen de expediteur, voerman of kapitein, uit hoofde van geheel verlies, vertraging in
      de bezorging of geleden schade aan goederen, verjaart met de tijd van zes maanden, ten aanzien van binnen de
      openbare lichamen Bonaire, Sint Eustatius en Saba gedane verzendingen, en met verloop van een jaar ten aanzien van
      verzendingen uit de openbare lichamen Bonaire, Sint Eustatius en Saba naar elders gedaan, gerekend, in geval van
      verlies, van de dag dat het vervoer van de goederen had moeten volbracht zijn, en, in geval van beschadiging of te
      late bezorging, van de dag dat het goed ter plaatse van zijn bestemming is aangekomen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel177
  - number: '177.2'
    text: Deze verjaring is niet toepasselijk in geval van bedrog of ontrouw.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel177
  - number: '178'
    text: |-
      De rechten en verplichtingen omtrent de scheepvaart, bij het tweede boek van dit wetboek voorgeschreven, zijn ook
      toepasselijk op de vaart langs de kusten, voor zover dit uitdrukkelijk bij dat boek is bepaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel178
  - number: '179'
    text: De bepalingen van deze titel zijn niet toepasselijk op de rechten en verplichtingen tussen de koper en de verkoper.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel179
  - number: '180.1'
    text: 'De wisselbrief behelst:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.1°
    text: de benaming «wisselbrief», opgenomen in de tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.2°
    text: de onvoorwaardelijke opdracht tot betaling van een bepaalde som;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.3°
    text: de naam van degene, die betalen moet (betrokkene);
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.4°
    text: de aanwijzing van de vervaldag;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.5°
    text: die van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.6°
    text: de naam van degene, aan wie of aan wiens order de betaling moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.7°
    text: de vermelding van de dagtekening, alsmede van de plaats, waar de wisselbrief is getrokken;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: 180.1.8°
    text: de handtekening van degene, die de wisselbrief uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: '180.2'
    text: |-
      De titel, waarin één van de in het voorgaande lid aangegeven vermeldingen ontbreekt, geldt niet als wisselbrief,
      behoudens in de hieronder genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: '180.3'
    text: De wisselbrief, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: '180.4'
    text: |-
      Bij gebreke van een bijzondere aanwijzing wordt de plaats, aangegeven naast de naam van de betrokkene, geacht te
      zijn de plaats van betaling en tevens de plaats van het domicilie van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: '180.5'
    text: |-
      De wisselbrief, welke niet de plaats aanwijst, waar hij is getrokken, wordt geacht te zijn ondertekend in de
      plaats, aangegeven naast de naam van de trekker.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel180
  - number: '181.1'
    text: De wisselbrief mag aan de order van de trekker luiden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '181.2'
    text: Hij mag worden getrokken op de trekker zelf.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '181.3'
    text: |-
      Hij mag worden getrokken voor rekening van een derde. De trekker wordt geacht voor zijn eigen rekening te hebben
      getrokken, indien uit de wisselbrief of uit de adviesbrief niet blijkt, voor wiens rekening zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '181.4'
    text: |-
      Indien de trekker op de wisselbrief de vermelding «waarde ter incassering», «ter incasso», «in lastgeving», of
      enige andere vermelding, met zich brengend een blote opdracht tot inning, heeft geplaatst, is de nemer bevoegd om
      alle uit de wisselbrief voortvloeiende rechten uit te oefenen, maar hij kan deze niet anders endosseren dan bij
      wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '181.5'
    text: |-
      Bij een zodanige incasso-wisselbrief mogen de wisselschuldenaren aan de houder slechts de verweermiddelen
      tegenwerpen, welke aan de trekker zouden mogen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '181.6'
    text: |-
      De opdracht, vervat in een incasso-wisselbrief, eindigt niet door de dood of de latere onbekwaamheid van de
      lastgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel181
  - number: '182'
    text: |-
      Een wisselbrief mag betaalbaar zijn aan de woonplaats van een derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel182
  - number: '183.1'
    text: |-
      In een wisselbrief, betaalbaar op zicht of een zekere tijd na zicht, mag de trekker bepalen, dat de som rente
      draagt. In elke andere wisselbrief wordt deze clausule voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel183
  - number: '183.2'
    text: |-
      De rentevoet moet in de wisselbrief worden aangegeven. Bij gebreke hiervan wordt de renteclausule voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel183
  - number: '183.3'
    text: De rente loopt gerekend van de dagtekening van de wisselbrief, tenzij een andere dag is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel183
  - number: '184.1'
    text: |-
      De wisselbrief, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van
      verschil, ten belope van de som, voluit in letters geschreven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel184
  - number: '184.2'
    text: |-
      De wisselbrief, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt, in
      geval van verschil, slechts ten belope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel184
  - number: '185.1'
    text: |-
      Indien de wisselbrief handtekeningen bevat van personen, die onbekwaam zijn zich door middel van een wisselbrief te
      verbinden, valse handtekeningen, of handtekeningen van verdachte personen, of handtekeningen, welke, onverschillig
      om welke andere reden, de personen, die die handtekeningen hebben geplaatst of in wier naam zulks is geschied, niet
      mogen verbinden, zijn de verbintenissen van de andere personen, wier handtekeningen op de wisselbrief voorkomen,
      desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel185
  - number: '185.2'
    text: |-
      Ieder, die zijn handtekening op een wisselbrief plaatst als vertegenwoordiger van een persoon, voor wie hij niet
      de bevoegdheid had te handelen, is zelf krachtens de wisselbrief verbonden, en heeft, betaald hebbende, dezelfde
      rechten, als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van de vertegenwoordiger,
      die zijn bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel185
  - number: '186.1'
    text: De trekker staat in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel186
  - number: '186.2'
    text: |-
      Hij mag zijn verplichting, voor de acceptatie in te staan, uitsluiten; elke clausule, waarbij hij de verplichting,
      voor de betaling in te staan, uitsluit, wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel186
  - number: '187'
    text: |-
      Indien een wisselbrief, onvolledig ten tijde van de uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, mag de niet-naleving van die overeenkomsten niet worden tegengeworpen aan de houder, die de wissel
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel187
  - number: '188.1'
    text: |-
      De trekker is verplicht, ter keuze van de nemer, de wisselbrief te stellen betaalbaar aan de nemer zelf, of aan
      enige andere persoon, in beide gevallen aan order of zonder bijvoeging van order dan wel met bijvoeging van een
      uitdrukking, als bedoeld in [artikel 189, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel189
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '189'
        afdeling: Tweede
  - number: '188.2'
    text: |-
      De trekker, of degene voor wiens rekening de wisselbrief is getrokken, is verplicht zorg te dragen dat de
      betrokkene, ten vervaldage, in handen hebbe het nodige fonds tot betaling, zelfs indien de wisselbrief bij een
      derde is betaalbaar gesteld, met dien verstande echter, dat de trekker zelf in alle gevallen aan de houder en de
      vroegere endossanten persoonlijk verantwoordelijk blijft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel188
  - number: '188.3'
    text: |-
      De betrokkene wordt geacht het nodige fonds in handen te hebben, indien hij bij het vervallen van de wisselbrief of
      op het tijdstip, waarop ingevolge het [derde lid van artikel 217][ref1] de houder regres kan nemen, aan de trekker
      of aan degene voor wiens rekening is getrokken, een opeisbare som schuldig is, tenminste gelijkstaande met het
      beloop van de wisselbrief.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel217
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '217'
        afdeling: Zevende
  - number: '189.1'
    text: |-
      Elke wisselbrief, ook die welke niet uitdrukkelijk aan order luidt, mag door middel van endossementen worden
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '189.2'
    text: |-
      Indien de trekker in de wisselbrief de woorden: «niet aan order» of een soortgelijke uitdrukking heeft opgenomen,
      mag het stuk slechts worden overgedragen in de vorm en met de gevolgen van een gewone cessie. Een op zulk een
      wisselbrief geplaatst endossement geldt als een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '189.3'
    text: |-
      Het endossement mag worden gesteld zelfs ten voordele van de betrokkene, al of niet acceptant, van de trekker, of
      van elke andere wisselschuldenaar. Deze personen mogen de wisselbrief opnieuw endosseren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '189.4'
    text: Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '189.5'
    text: Het gedeeltelijke endossement is nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '189.6'
    text: Het endossement aan toonder geldt als endossement in blanco.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel189
  - number: '190.1'
    text: |-
      Het endossement moet worden gesteld op de wisselbrief of op een daaraan vastgehecht blad (verlengstuk). Het moet
      worden ondertekend door de endossant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel190
  - number: '190.2'
    text: |-
      Het endossement mag de geëndosseerde onvermeld laten of bestaan uit de enkele handtekening van de endossant
      (endossement in blanco). In het laatste geval moet het endossement, om geldig te zijn, op de rugzijde van de
      wisselbrief of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel190
  - number: '191.1'
    text: Door het endossement worden alle uit de wisselbrief voortvloeiende rechten overgedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel191
  - number: '191.2'
    text: 'Indien het endossement in blanco is, mag de houder:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel191
  - number: 191.2.1°
    text: het blanco invullen hetzij met zijn eigen naam, hetzij met de naam van een andere persoon;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel191
  - number: 191.2.2°
    text: de wisselbrief wederom in blanco of aan een andere persoon endosseren;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel191
  - number: 191.2.3°
    text: de wisselbrief aan een derde overgeven, zonder het blanco in te vullen en zonder hem te endosseren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel191
  - number: '192.1'
    text: Tenzij het tegendeel bedongen is, staat de endossant in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel192
  - number: '192.2'
    text: |-
      Hij is bevoegd om een nieuw endossement te verbieden; in dat geval staat hij tegenover de personen, aan wie de
      wisselbrief later is geëndosseerd, niet in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel192
  - number: '193.1'
    text: |-
      Hij, die een wisselbrief onder zich heeft, wordt beschouwd als de rechtmatige houder, indien hij van zijn recht
      doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste endossement in blanco is
      gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet-geschreven gehouden. Indien een endossement
      in blanco door een ander endossement is gevolgd, wordt de ondertekenaar van dit laatste geacht de wisselbrief door
      een endossement in blanco verkregen te hebben.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel193
  - number: '193.2'
    text: |-
      Indien iemand, op welke wijze dan ook, het bezit van de wisselbrief heeft verloren, is de houder, die van zijn
      recht doet blijken op de wijze, bij het voorgaande lid aangegeven, niet verplicht de wisselbrief af te geven, die
      de wissel te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel193
  - number: '193.3'
    text: |-
      Zij, die uit hoofde van de wisselbrief worden aangesproken, mogen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot de trekker of tot vroegere houders, niet aan de houder tegenwerpen, tenzij deze bij de verkrijging
      van de wisselbrief desbewust ten nadele van de schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel193
  - number: '194.1'
    text: |-
      Indien het endossement de vermelding bevat: «waarde ter incassering», «ter incasso», «in lastgeving», of enige
      andere vermelding, met zich brengend een blote opdracht tot inning, mag de houder alle uit de wisselbrief
      voortvloeiende rechten uitoefenen, maar hij mag deze niet anders endosseren dan bij wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel194
  - number: '194.2'
    text: |-
      De wisselschuldenaren mogen in dat geval aan de houder slechts de verweermiddelen tegenwerpen, welke aan de
      endossant zouden mogen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel194
  - number: '194.3'
    text: |-
      De opdracht, vervat in een incasso-endossement, eindigt niet door de dood of door de latere onbekwaamheid van de
      lastgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel194
  - number: '195.1'
    text: |-
      Indien een endossement de vermelding bevat: «waarde tot zekerheid», «waarde tot pand», of enige andere vermelding,
      welke inpandgeving met zich brengt, mag de houder alle uit de wisselbrief voortvloeiende rechten uitoefenen, maar
      een door hem gesteld endossement geldt slechts als endossement bij wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel195
  - number: '195.2'
    text: |-
      De wisselschuldenaren mogen de houder de verweermiddelen, gegrond op hun persoonlijke verhouding tot de endossant,
      niet tegenwerpen, tenzij de houder bij de ontvangst van de wisselbrief desbewust ten nadele van de schuldenaar
      heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel195
  - number: '196.1'
    text: |-
      Een endossement, gesteld na de vervaldag, heeft dezelfde gevolgen als een endossement, gesteld vóór de vervaldag.
      Echter heeft het endossement, gesteld na het protest van nonbetaling of na het verstrijken van de termijn, voor het
      opmaken van het protest, bepaald, slechts de gevolgen van een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel196
  - number: '196.2'
    text: |-
      Behoudens tegenbewijs wordt het endossement zonder dagtekening geacht te zijn gesteld vóór het verstrijken van de
      termijn, voor het opmaken van het protest bepaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel196
  - number: '197'
    text: |-
      De wisselbrief mag tot de vervaldag door de houder of door iemand, die hem enkel onder zich heeft, aan de
      betrokkene te zijner woonplaats ter acceptatie worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel197
  - number: '198.1'
    text: |-
      In elke wisselbrief mag de trekker, al dan niet met vaststelling van een termijn, bepalen, dat deze ter acceptatie
      moet worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel198
  - number: '198.2'
    text: |-
      De trekker mag in de wisselbrief de aanbieding ter acceptatie verbieden, behoudens in wisselbrieven, betaalbaar bij
      een derde, of betaalbaar in een andere plaats dan die van het domicilie van de betrokkene of betaalbaar een zekere
      tijd na zicht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel198
  - number: '198.3'
    text: |-
      De trekker is ook bevoegd om te bepalen, dat de aanbieding ter acceptatie niet mag plaats hebben vóór een bepaalde
      dag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel198
  - number: '198.4'
    text: |-
      Tenzij de trekker heeft verklaard, dat de wisselbrief niet vatbaar is voor acceptatie, mag elke endossant, al dan
      niet met vaststelling van een termijn, bepalen, dat hij ter acceptatie moet worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel198
  - number: '199.1'
    text: |-
      Wisselbrieven, betaalbaar een zekere tijd na zicht, moeten ter acceptatie worden aangeboden binnen een jaar na
      hun dagtekening.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel199
  - number: '199.2'
    text: De trekker mag deze termijn verkorten of verlengen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel199
  - number: '199.3'
    text: De endossanten mogen deze termijnen verkorten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel199
  - number: '199.4'
    text: |-
      De betrokkene mag verzoeken, dat hem een tweede aanbieding wordt gedaan de dag, volgende op de eerste.
      Belanghebbenden mogen zich er niet op beroepen, dat aan dit verzoek geen gevolg is gegeven, tenzij het verzoek in
      het protest is vermeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel199
  - number: '199.5'
    text: De houder is niet verplicht, de ter acceptatie aangeboden wisselbrief aan de betrokkene af te geven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel199
  - number: '200.1'
    text: |-
      De acceptatie wordt op de wisselbrief gesteld. Zij wordt uitgedrukt door het woord «geaccepteerd», of door een
      soortgelijk woord; zij wordt door de betrokkene ondertekend. De enkele handtekening van de betrokkene, op de
      voorzijde van de wisselbrief gesteld, geldt als acceptatie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel200
  - number: '200.2'
    text: |-
      Indien de wisselbrief betaalbaar is een zekere tijd na zicht, of indien hij krachtens een uitdrukkelijk beding
      ter acceptatie moet worden aangeboden binnen een bepaalde termijn, moet de acceptatie als dagtekening inhouden
      de dag, waarop zij is geschied, tenzij de houder die van de aanbieding eist. Bij gebreke van dagtekening moet de
      houder dit verzuim door een tijdig protest doen vaststellen, op straffe van verlies van zijn recht van regres op de
      endossanten en op de trekker, die fonds heeft bezorgd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel200
  - number: '200.3'
    text: De acceptatie is onvoorwaardelijk, maar de betrokkene mag haar beperken tot een gedeelte van de som.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel200
  - number: '200.4'
    text: |-
      Elke andere wijziging, door de acceptant met betrekking tot het in de wisselbrief vermelde aangebracht, geldt als
      weigering van acceptie. De acceptant is echter gehouden overeenkomstig de inhoud van zijn acceptatie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel200
  - number: '201.1'
    text: |-
      Indien de trekker de wisselbrief op een andere plaats dan die van het domicilie van de betrokkene heeft betaalbaar
      gesteld, zonder een derde aan te wijzen, bij wie de betaling moet worden gedaan, mag de betrokkene deze bij de
      acceptatie aanwijzen. Bij gebreke van zodanige aanwijzing wordt de acceptant geacht zich verbonden te hebben zelf
      te betalen op de plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel201
  - number: '201.2'
    text: |-
      Indien de wisselbrief betaalbaar is aan het domicilie van de betrokkene, mag deze, in de acceptatie, een adres
      aanwijzen, in dezelfde plaats, waar de betaling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel201
  - number: '202.1'
    text: Door de acceptatie verbindt de betrokkene zich, de wisselbrief op de vervaldag te betalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
  - number: '202.2'
    text: |-
      Bij gebreke van betaling heeft de houder, al ware hij de trekker, tegen de acceptant een rechtstreekse
      vordering, uit de wisselbrief voortspruitend, voor al hetgeen mag worden gevorderd krachtens
      [artikel 224, vierde en vijfde lid][ref1], en [artikel 225][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel224
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel225
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '224'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '225'
        afdeling: Zevende
  - number: '202.3'
    text: |-
      Hij, die het nodig fonds in handen heeft, bijzonderlijk bestemd tot de betaling van een getrokken wisselbrief, is,
      op straffe van vergoeding van schadevergoeding jegens de trekker, tot de acceptatie verplicht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
  - number: '202.4'
    text: |-
      Belofte om een briefwissel te zullen accepteren geldt niet als acceptatie, maar geeft aan de trekker een
      rechtsvordering tot schadevergoeding tegen de belover, die weigert zijn belofte gestand te doen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
  - number: '202.5'
    text: |-
      Deze schade bestaat in de kosten van protest en herwissel, indien de wisselbrief voor des trekkers eigen rekening
      was getrokken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
  - number: '202.6'
    text: |-
      Indien de trekking voor rekening van een derde was gedaan, bestaat de schade in de kosten van protest en herwissel
      en in het beloop van hetgeen de trekker, uit hoofde van de bekomen toezegging van de belover, aan die derde, op het
      krediet van de wisselbrief heeft voorgeschoten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel202
  - number: '203.1'
    text: |-
      De trekker is verplicht aan de betrokkene tijdig kennis of advies te geven van de door hem getrokken wisselbrief,
      en, bij nalatigheid daarvan, gehouden tot vergoeding van de kosten, door weigering van acceptatie of betaling uit
      dien hoofde gevallen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel203
  - number: '203.2'
    text: Indien de wisselbrief voor rekening van een derde is getrokken, is deze alleen daarvoor aan de acceptant verbonden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel203
  - number: '204.1'
    text: |-
      Indien de betrokkene zijn op de wisselbrief gestelde acceptatie heeft doorgehaald vóór de teruggave van de
      wisselbrief, wordt de acceptatie geacht te zijn geweigerd. Behoudens tegenbewijs wordt de doorhaling geacht te zijn
      geschied vóór de teruggave van de wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel204
  - number: '204.2'
    text: |-
      Indien echter de betrokkene van zijn acceptatie schriftelijk heeft doen blijken aan de houder of aan iemand,
      wiens handtekening op de wisselbrief voorkomt, is hij tegenover deze gehouden overeenkomstig de inhoud van zijn
      acceptatie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel204
  - number: '205.1'
    text: |-
      De betaling van een wisselbrief kan voor het geheel of een gedeelte van de wisselsom door een borgtocht (aval)
      worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel205
  - number: '205.2'
    text: |-
      Deze borgtocht mag door een derde, of zelfs door iemand, wiens handtekening op de wisselbrief voorkomt, worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel205
  - number: '206.1'
    text: Het aval wordt op de wisselbrief of op een verlengstuk gesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel206
  - number: '206.2'
    text: |-
      Het wordt uitgedrukt door de woorden: «goed voor aval» of door een soortgelijke uitdrukking; het wordt door de
      avalgever ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel206
  - number: '206.3'
    text: |-
      De enkele handtekening van de avalgever, gesteld op de voorzijde van de wisselbrief, geldt als aval, behalve indien
      de handtekening die is van de betrokkene of van de trekker.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel206
  - number: '206.4'
    text: Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel206
  - number: '206.5'
    text: |-
      In het aval moet worden vermeld, voor wie het is gegeven; bij gebreke hiervan wordt het geacht voor de trekker te
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel206
  - number: '207.1'
    text: De avalgever is op dezelfde wijze verbonden als degene, voor wie het aval is gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel207
  - number: '207.2'
    text: |-
      Zijn verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek, de door hem gewaarborgde
      verbintenis nietig is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel207
  - number: '207.3'
    text: |-
      Door te betalen verkrijgt de avalgever de rechten, welke krachtens de wisselbrief kunnen worden uitgeoefend tegen
      degene, voor wie het aval is gegeven en tegen degenen, die tegenover deze krachtens de wisselbrief verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel207
  - number: '208.1'
    text: |-
      Een wisselbrief mag worden getrokken: op zicht; op een zekere tijd na zicht; op een zekere tijd na dagtekening; op
      een bepaalde dag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel208
  - number: '208.2'
    text: Wisselbrieven met anders bepaalde vervaldagen of in termijnen betaalbaar zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel208
  - number: '209.1'
    text: |-
      De wisselbrief, getrokken op zicht, is betaalbaar bij de aanbieding. Hij moet ter betaling worden aangeboden
      binnen een jaar na zijn dagtekening. De trekker mag deze termijn verkorten of verlengen. De endossanten mogen deze
      termijnen verkorten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel209
  - number: '209.2'
    text: |-
      De trekker mag voorschrijven, dat een wisselbrief niet ter betaling mag worden aangeboden vóór een bepaalde dag. In
      dat geval loopt de termijn van de aanbieding van die dag af.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel209
  - number: '210.1'
    text: |-
      De vervaldag van een wisselbrief, getrokken op een zekere tijd na zicht, wordt bepaald, hetzij door de dagtekening
      van de acceptatie, hetzij door die van het protest.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel210
  - number: '210.2'
    text: |-
      Bij gebreke van protest wordt de niet-gedagtekende acceptatie ten aanzien van de acceptant geacht te zijn gedaan op
      de laatste dag van de termijn, voor de aanbieding ter acceptatie voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel210
  - number: '211.1'
    text: |-
      De wisselbrief, getrokken op een of meer maanden na dagtekening of na zicht, vervalt op de overeenkomstige dag
      van de maand, waarin de betaling moet worden gedaan. Bij gebreke van een overeenkomstige dag vervalt een zodanige
      wisselbrief op de laatste dag van die maand.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel211
  - number: '211.2'
    text: |-
      Bij een wisselbrief, getrokken op een of meer maanden en een halve maand na dagtekening of na zicht, worden eerst
      de gehele maanden gerekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel211
  - number: '211.3'
    text: |-
      Is de vervaldag bepaald op het begin, het midden (half januari, half februari enz.) of op het einde van een maand,
      dan wordt onder die uitdrukkingen verstaan: de eerste, de vijftiende, de laatste van die maand.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel211
  - number: '211.4'
    text: |-
      Onder de uitdrukkingen: «acht dagen», «vijftien dagen», moet worden verstaan niet één of twee weken, maar een
      termijn van acht of van vijftien dagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel211
  - number: '211.5'
    text: De uitdrukking «halve maand» duidt een termijn van vijftien dagen aan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel211
  - number: '212.1'
    text: |-
      De vervaldag van een wisselbrief, betaalbaar op een bepaalde dag, in een plaats, waar de tijdrekening een andere
      is dan die van de plaats van uitgifte, wordt geacht te zijn vastgesteld volgens de tijdrekening van de plaats van
      betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel212
  - number: '212.2'
    text: |-
      De dag van uitgifte van een wisselbrief, getrokken tussen twee plaatsen met verschillende tijdrekening en
      betaalbaar een zekere tijd na dagtekening, wordt herleid tot de overeenkomstige dag van de tijdrekening van de
      plaats van betaling en de vervaldag wordt dienovereenkomstig vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel212
  - number: '212.3'
    text: |-
      De termijnen van aanbieding van de wisselbrieven worden berekend overeenkomstig de bepalingen van het voorgaande
      lid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel212
  - number: '212.4'
    text: |-
      Dit artikel is niet van toepassing, indien uit een in de wisselbrief opgenomen clausule of uit zijn bewoordingen
      een afwijkende bedoeling mag worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel212
  - number: '213.1'
    text: |-
      De houder van een wisselbrief, betaalbaar op een bepaalde dag of een zekere tijd na dagtekening of na zicht, moet
      deze ter betaling aanbieden, hetzij de dag, waarop hij betaalbaar is, hetzij een der twee daaropvolgende werkdagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel213
  - number: '213.2'
    text: |-
      De aanbieding van een wisselbrief aan een verrekeningskamer geldt als aanbieding ter betaling. Bij algemene
      maatregel van bestuur worden de instellingen aangewezen, welke in de zin van deze Titel als verrekeningskamers
      worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel213
  - number: '213.3'
    text: |-
      Buiten het geval, in het [tweede lid van artikel 241][ref1] vermeld, is de betrokkene, de wisselbrief betalende,
      bevoegd te vorderen, dat hem deze, van behoorlijke kwijting van de houder voorzien, wordt uitgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel241
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '241'
        paragraaf: '3'
        afdeling: Negende
  - number: '213.4'
    text: De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel213
  - number: '213.5'
    text: |-
      In geval van gedeeltelijke betaling mag de betrokkene vorderen, dat van die betaling op de wisselbrief melding
      wordt gemaakt en dat hem daarvoor kwijting wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel213
  - number: '214.1'
    text: De houder van een wisselbrief mag niet genoodzaakt worden, vóór de vervaldag betaling te ontvangen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel214
  - number: '214.2'
    text: De betrokkene, die vóór de vervaldag betaalt, doet zulks op eigen verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel214
  - number: '214.3'
    text: |-
      Hij, die op de vervaldag betaalt, is deugdelijk gekweten, mits er zijnerzijds geen bedrog plaats heeft of grove
      schuld aanwezig is. Hij is gehouden, de regelmatigheid van de reeks van endossementen, maar niet de handtekening
      van de endossanten te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel214
  - number: '214.4'
    text: |-
      Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de wissel niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel214
  - number: '215.1'
    text: |-
      Een wisselbrief, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, mag worden
      betaald in het geld van het land volgens zijn waarde op de vervaldag. Indien de schuldenaar in gebreke is, mag de
      houder te zijner keuze vorderen, dat de wisselsom betaald wordt in het geld van het land volgens de koers, hetzij
      van de vervaldag, hetzij van de dag van betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel215
  - number: '215.2'
    text: |-
      De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker mag echter
      voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in de wisselbrief voorgeschreven koers.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel215
  - number: '215.3'
    text: |-
      Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden in
      een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel215
  - number: '215.4'
    text: |-
      Indien het bedrag van de wisselbrief is aangegeven in geld, hetwelk dezelfde benaming, maar een verschillende
      waarde heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling
      te hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel215
  - number: '216'
    text: |-
      Bij gebreke van aanbieding ter betaling van de wisselbrief binnen de termijn, bij [artikel 213, eerste lid][ref1],
      vastgesteld, heeft elke schuldenaar de bevoegdheid, het bedrag te bevoegder plaatse in consignatie te geven, op
      kosten en onder verantwoordelijkheid van de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel213
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '213'
        afdeling: Zesde
  - number: '217'
    text: |-
      De houder mag zijn recht van regres op de endossanten, de trekker en de andere wisselschuldenaren uitoefenen: Op de
      vervaldag; indien de betaling niet heeft plaats gehad; Zelfs vóór de vervaldag;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel217
  - number: 217.1°
    text: indien de acceptatie geheel of gedeeltelijk is geweigerd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel217
  - number: 217.2°
    text: |-
      in geval van faillissement van de betrokkene, al of niet acceptant, en van het ogenblik af, waarop een hem
      verleende surséance van betaling is ingegaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel217
  - number: 217.3°
    text: in geval van faillissement van de trekker van een niet voor acceptatie vatbare wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel217
  - number: '218.1'
    text: |-
      De weigering van acceptatie of van betaling moet worden vastgesteld bij authentieke akte (protest van non-
      acceptatie of van non-betaling).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
  - number: '218.2'
    text: |-
      Het protest van non-acceptatie moet worden opgemaakt binnen de voor de aanbieding ter acceptatie vastgestelde
      termijnen. Indien, in het geval bij [artikel 199, vierde lid][ref1], voorzien, de eerste aanbieding heeft plaats
      gehad op de laatste dag van de termijn, mag het protest nog op de volgende dag worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel199
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '199'
        afdeling: Derde
  - number: '218.3'
    text: |-
      Het protest van non-betaling van een wisselbrief, betaalbaar op een bepaalde dag of zekere tijd na dagtekening of
      na zicht, moet worden gedaan op één van de twee werkdagen, volgende op de dag, waarop de wisselbrief betaalbaar
      is. Indien het een wisselbrief betaalbaar op zicht betreft, moet het protest worden gedaan, overeenkomstig de
      bepalingen bij het voorgaande lid vastgesteld voor het opmaken van het protest van non-acceptatie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
  - number: '218.4'
    text: Het protest van non-acceptatie maakt de aanbieding ter betaling en het protest van non-betaling overbodig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
  - number: '218.5'
    text: |-
      In geval van benoeming van bewindvoerders op verzoek van de betrokkene, al of niet acceptant, tot surséance
      van betaling mag de houder zijn recht van regres niet uitoefenen, dan nadat de wisselbrief ter betaling aan de
      betrokkene is aangeboden en protest is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
  - number: '218.6'
    text: |-
      Indien de betrokkene, al of niet acceptant, is failliet verklaard, of indien de trekker van een wisselbrief, welke
      niet vatbaar is voor acceptatie, is failliet verklaard, mag de houder, voor de uitoefening van zijn recht van
      regres, volstaan met overlegging van het vonnis, waarbij het faillissement is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel218
  - number: '219.1'
    text: |-
      De betaling van een wisselbrief moet gevraagd en het daarop volgend protest gedaan worden ter woonplaatse van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel219
  - number: '219.2'
    text: |-
      Indien de wisselbrief getrokken is om in een andere aangewezen woonplaats of door een andere aangewezen persoon
      te worden betaald, moet de betaling gevraagd en het protest opgemaakt worden ter aangewezene woonplaats of aan de
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel219
  - number: '219.3'
    text: |-
      Wanneer degene, die de wisselbrief moet betalen geheel onbekend of niet te vinden is, moet het protest gedaan
      worden aan een postkantoor op het eiland waar de ter betaling aangewezen woonplaats is gelegen. Hetzelfde moet
      plaats hebben indien een wisselbrief is getrokken om op een ander eiland te worden betaald dan dat waar de
      betrokkene woont, en de woonplaats waar de betaling moet geschieden niet is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel219
  - number: '220.1'
    text: |-
      De protesten, zo van non-acceptatie als van non-betaling, worden gedaan door een notaris, door de griffier van het
      gerecht in eerste aanleg of door een deurwaarder. Zij moeten vergezeld zijn van twee getuigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: '220.2'
    text: 'De protesten behelzen:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: 220.2.1°
    text: |-
      een letterlijk afschrift van de wisselbrief, van de acceptatie, van de endossementen, van het aval en van de
      adressen daarop gesteld;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: 220.2.2°
    text: |-
      de vermelding dat zij de acceptatie of de betaling aan de personen, of ter plaatse in het
      [voorgaande artikel][ref1] gemeld, afgevraagd en niet bekomen hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel219
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '219'
        afdeling: Zevende
  - number: 220.2.3°
    text: de vermelding van de opgegeven reden van non-acceptatie of non-betaling;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: 220.2.4°
    text: de aanmaning om het protest te tekenen, en de redenen van weigering;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: 220.2.5°
    text: |-
      de vermelding, dat hij, notaris, griffier of deurwaarder, wegens die non-acceptatie of die non-betaling heeft
      geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: '220.3'
    text: |-
      Indien het protest een vermiste wisselbrief betreft, volstaat, in plaats van het bepaalde onder 1°. van het
      voorgaande lid, een zo nauwkeurig mogelijke omschrijving van de inhoud van de wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: '220.4'
    text: |-
      De notarissen, griffiers of deurwaarders zijn verplicht, op straffe van schadevergoeding, afschrift van het protest
      te laten, en hiervan melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een
      bijzonder register, genummerd en gewaarmerkt door de rechter in eerste aanleg van hun woonplaats, en om wijders,
      zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden te leveren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: '220.5'
    text: |-
      Als protest van non-acceptatie, onderscheidenlijk van non-betaling geldt de door degene, aan wie de acceptatie
      of de betaling wordt afgevraagd, met toestemming van de houder op de wisselbrief gestelde, gedagtekende en
      ondertekende verklaring, dat hij haar weigert, tenzij de trekker heeft aangetekend, dat hij een authentiek protest
      verlangt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel220
  - number: '221.1'
    text: |-
      De houder moet van de non-acceptatie of van de non-betaling kennis geven aan zijn endossant en aan de trekker
      binnen de vier werkdagen, volgende op de dag van het protest of, indien de wisselbrief getrokken is met de
      clausule zonder kosten, volgende op die van de aanbieding. Iedere endossant moet binnen de twee werkdagen, volgende
      op de dag van ontvangst van de kennisgeving, de door hem ontvangen kennisgeving aan zijn endossant mededelen,
      met aanwijzing van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zo
      vervolgens, teruggaande tot de trekker. Deze termijnen lopen van de ontvangst van de voorafgaande kennisgeving af.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '221.2'
    text: |-
      Indien overeenkomstig het voorgaande lid een kennisgeving is gedaan aan iemand, wiens handtekening op de
      wisselbrief voorkomt, moet gelijke kennisgeving binnen dezelfde termijn aan diens avalgever worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '221.3'
    text: |-
      Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, mag worden volstaan met kennisgeving
      aan de voorafgaande endossant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '221.4'
    text: |-
      Hij, die een kennisgeving heeft te doen, kan zulks doen in iedere vorm, zelfs door enkele terugzending van de
      wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '221.5'
    text: |-
      Hij moet bewijzen, dat hij de kennisgeving binnen de vastgestelde termijn heeft gedaan. Deze termijn wordt gehouden
      te zijn in acht genomen, wanneer een brief, welke de kennisgeving behelst, binnen de genoemde termijn ter post
      is bezorgd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '221.6'
    text: |-
      Hij, die de kennisgeving niet binnen de bovenvermelde termijn doet, stelt zich niet bloot aan verval van
      zijn recht; hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijn nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de wisselsom mag te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel221
  - number: '222.1'
    text: |-
      De trekker, een endossant of een avalgever is bevoegd om, door de clausule «zonder kosten», «zonder protest», of
      een andere soortgelijke op de wisselbrief gestelde en ondertekende clausule, de houder van het opmaken van een
      protest van non-acceptatie of van non-betaling, ter uitoefening van zijn recht van regres, te ontslaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel222
  - number: '222.2'
    text: |-
      Deze clausule ontslaat de houder niet van de aanbieding van de wisselbrief binnen de voorgeschreven termijnen, noch
      van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming van de termijnen moet worden geleverd door
      degene, die zich daarop tegenover de houder beroept.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel222
  - number: '222.3'
    text: |-
      Is de clausule door de trekker gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handtekeningen op de
      wisselbrief voorkomen; is zij door een endossant of door een avalgever gesteld, dan heeft zij gevolgen alleen
      voor deze endossant of voor deze avalgever. Indien de houder, ondanks de door de trekker gestelde clausule, toch
      protest doet opmaken, zijn de kosten daarvan voor zijn rekening. Indien de clausule van een endossant of van een
      avalgever afkomstig is, mogen de kosten van het protest, indien dit is opgemaakt, op allen, wier handtekeningen op
      de wisselbrief voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel222
  - number: '223.1'
    text: |-
      Allen, die een wisselbrief hebben getrokken, geaccepteerd, geëndosseerd, of voor aval getekend, zijn hoofdelijk
      tegenover de houder verbonden. Bovendien is ook de derde, voor wiens rekening de wisselbrief is getrokken en die de
      waarde daarvoor heeft genoten, jegens de houder aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel223
  - number: '223.2'
    text: |-
      De houder kan deze personen, zowel ieder afzonderlijk, als gezamenlijk, aanspreken, zonder verplicht te zijn de
      volgorde, waarin zij zich hebben verbonden, in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel223
  - number: '223.3'
    text: |-
      Hetzelfde recht komt toe aan ieder, wiens handtekening op de wisselbrief voorkomt en die deze, ter voldoening aan
      zijn regresplicht, heeft betaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel223
  - number: '223.4'
    text: |-
      De vordering, ingesteld tegen één der wisselschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden aan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel223
  - number: '224.1'
    text: |-
      De houder van een geprotesteerde wisselbrief heeft in geen geval enig recht op het fonds, dat de betrokkene van de
      trekker in handen heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: '224.2'
    text: |-
      Indien de wisselbrief niet is geaccepteerd, behoren die penningen, bij faillissement van de trekker, aan diens
      boedel.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: '224.3'
    text: |-
      In geval van acceptatie, blijft het fonds, tot het beloop van de wisselbrief, aan de betrokkene, behoudens de
      verplichting van deze om jegens de houder aan zijn acceptatie te voldoen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: '224.4'
    text: 'De houder is bevoegd om van degene, tegen wie hij zijn recht van regres uitoefent, te vorderen:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: 224.4.1°
    text: de som van de niet-geaccepteerde of niet-betaalde wisselbrief met de rente, zo deze bedongen is;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: 224.4.2°
    text: |-
      de wettelijke interesten, te rekenen van de vervaldag, voor wissels die in de openbare lichamen Bonaire, Sint
      Eustatius en Saba uitgegeven en betaalbaar zijn, en een rente van zes ten honderd, te rekenen van de vervaldag,
      voor alle overige wissels;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: 224.4.3°
    text: de kosten van protest, die van de gedane kennisgevingen alsmede de andere kosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: '224.5'
    text: |-
      Zo de uitoefening van het recht van regres vóór de vervaldag plaats heeft, wordt op de wisselsom een korting
      toegepast. Deze korting wordt berekend volgens het officiële disconto (bankdisconto), geldende ter woonplaats van
      de houder, op de dag van de uitoefening van het recht van regres.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel224
  - number: '225'
    text: |-
      Hij, die ter voldoening aan zijn regresplicht de wisselbrief heeft betaald, mag van degenen, die tegenover hem
      regresplichtig zijn, vorderen:
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel225
  - number: 225.1°
    text: het gehele bedrag, dat hij betaald heeft;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel225
  - number: 225.2°
    text: |-
      de wettelijke interesten, te rekenen van de dag der betaling, voor wissels die in de openbare lichamen Bonaire,
      Sint Eustatius en Saba uitgegeven en betaalbaar zijn, en een rente van zes ten honderd, te rekenen van de dag der
      betaling, voor alle overige wissels;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel225
  - number: 225.3°
    text: de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel225
  - number: '226.1'
    text: |-
      Elke wisselschuldenaar, tegen wie het recht van regres wordt of mag worden uitgeoefend, is bevoegd om, tegen
      betaling ter voldoening aan zijn regresplicht, de afgifte te vorderen van de wisselbrief met het protest, alsmede
      een voor voldaan getekende rekening.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel226
  - number: '226.2'
    text: |-
      Elke endossant, die ter voldoening aan zijn regresplicht de wisselbrief heeft betaald, mag zijn endossement en dat
      van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel226
  - number: '227'
    text: |-
      Bij gedeeltelijke acceptatie is degene, die ter voldoening aan zijn regresplicht het niet-geaccepteerde gedeelte
      van de wisselsom heeft betaald, bevoegd te vorderen, dat die betaling op de wisselbrief wordt vermeld en dat hem
      daarvan kwijting wordt gegeven. De houder moet hem daarenboven uitleveren een voor eensluidend getekend afschrift
      van de wisselbrief, alsmede het protest, om hem de uitoefening van zijn verdere regresrechten mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel227
  - number: '228.1'
    text: |-
      Ieder, die een recht van regres mag uitoefenen, is, tenzij het tegendeel bedongen is, bevoegd om zich de vergoeding
      te bezorgen door middel van een nieuwe wisselbrief (herwissel), getrokken op zicht op één van degenen, die
      tegenover hem regresplichtig zijn en betaalbaar te diens woonplaats.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel228
  - number: '228.2'
    text: |-
      De herwissel omvat, behalve de bedragen in het [vierde en vijfde lid van artikel 224][ref1] en in
      [artikel 225][ref2] aangegeven, de bedragen van provisie en het zegel van de herwissel.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel224
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel225
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '224'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '225'
        afdeling: Zevende
  - number: '228.3'
    text: |-
      Indien de herwissel door de houder is getrokken, wordt het bedrag bepaald volgens de koers van een zichtwissel,
      getrokken van de plaats, waar de oorspronkelijke wisselbrief betaalbaar was, op de woonplaats van de
      regresplichtige. Indien de herwissel is getrokken door een endossant, wordt het bedrag bepaald volgens de
      koers van een zichtwissel, getrokken van de woonplaats van de trekker van de herwissel op de woonplaats van de
      regresplichtige.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel228
  - number: '229.1'
    text: |-
      Na afloop van de termijnen vastgesteld: voor de aanbieding van een wisselbrief getrokken op zicht of zekere tijd na
      zicht; voor het opmaken van het protest van non-acceptatie of van non-betaling; voor de aanbieding ter betaling in
      geval van beding zonder kosten, vervalt het recht van de houder tegen de endossanten, tegen de trekker, en tegen de
      andere wisselschuldenaren, met uitzondering van de acceptant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel229
  - number: '229.2'
    text: |-
      Bij gebreke van aanbieding ter acceptatie binnen de door de trekker voorgeschreven termijn, vervalt het recht
      van regres van de houder, zowel wegens non-betaling als wegens non-acceptatie, tenzij uit de bewoordingen van de
      wisselbrief blijkt, dat de trekker zich slechts heeft willen bevrijden van zijn verplichting, voor de acceptatie in
      te staan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel229
  - number: '229.3'
    text: |-
      Indien de bepaling van een termijn voor de aanbieding in een endossement is vervat, mag alleen de endossant daarop
      een beroep doen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel229
  - number: '230.1'
    text: |-
      De wisselbrief van non-acceptatie of van non-betaling zijnde geprotesteerd, is niettemin de trekker, al ware het
      protest niet intijds gedaan, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op de vervaldag het
      nodige fonds tot betaling van de wisselbrief in handen had. Indien het vereiste fonds slechts gedeeltelijk aanwezig
      was, is de trekker voor het ontbrekende gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel230
  - number: '230.2'
    text: |-
      Was de wisselbrief niet geaccepteerd, dan is, in geval van niet tijdig protest, de trekker, op straffe van tot
      vrijwaring te zijn gehouden, verplicht, de houder af te staan en over te dragen de vordering op het fonds, dat de
      betrokkene van hem ten vervaldage heeft in handen gehad, en zulks tot het beloop van de wisselbrief; en hij moet
      aan de houder, op diens kosten, de nodige bewijzen verschaffen om die vordering te doen gelden. Indien de trekker
      in staat van faillissement is verklaard, zijn de curatoren in zijn boedel tot dezelfde verplichtingen gehouden, ten
      ware deze mochten verkiezen, de houder als schuldeiser voor het beloop van de wisselbrief, toe te laten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel230
  - number: '231.1'
    text: |-
      Indien de aanbieding van de wisselbrief of het opmaken van het protest binnen de voorgeschreven termijnen wordt
      verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift of ander geval van overmacht), worden deze
      termijnen verlengd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
  - number: '231.2'
    text: |-
      De houder is verplicht, van de overmacht onverwijld aan zijn endossant kennis te geven, en deze kennisgeving
      gedagtekend en ondertekend op de wisselbrief of op een verlengstuk te vermelden; voor het overige zijn de
      bepalingen van [artikel 221][ref1] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel221
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '221'
        afdeling: Zevende
  - number: '231.3'
    text: |-
      Na het ophouden van de overmacht moet de houder onverwijld de wisselbrief ter acceptatie of ter betaling aanbieden
      en, indien daartoe aanleiding bestaat, protest doen opmaken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
  - number: '231.4'
    text: |-
      Indien de overmacht meer dan dertig dagen, gerekend van de vervaldag, aanhoudt, mag het recht van regres worden
      uitgeoefend, zonder dat de aanbieding of het opmaken van protest nodig is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
  - number: '231.5'
    text: |-
      Voor wisselbrieven, getrokken op zicht of op zekere tijd na zicht, loopt de termijn van dertig dagen van de dag,
      waarop de houder, al ware het vóór het einde van de aanbiedingstermijn, van de overmacht aan zijn endossant heeft
      kennis gegeven; voor wisselbrieven, getrokken op zekere tijd na zicht, wordt de termijn van dertig dagen verlengd
      met de zichttermijn, in de wisselbrief aangegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
  - number: '231.6'
    text: |-
      Feiten, welke voor de houder, of voor degene, die hij met de aanbieding van de wisselbrief of met het opmaken van
      het protest belastte, van zuiver persoonlijke aard zijn, worden niet beschouwd als gevallen van overmacht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel231
  - number: '232.1'
    text: |-
      De trekker, een endossant, of een avalgever mag iemand aanwijzen om, in geval van nood, te accepteren of te
      betalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel232
  - number: '232.2'
    text: |-
      Onder de hierna vastgestelde voorwaarden mag de wisselbrief worden geaccepteerd of betaald door iemand, die
      tussenkomt voor een schuldenaar, op wie recht van regres mag worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel232
  - number: '232.3'
    text: |-
      De interveniënt mag een derde zijn, zelfs de betrokkene, of een reeds krachtens de wisselbrief verbonden persoon,
      behalve de acceptant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel232
  - number: '232.4'
    text: |-
      De interveniënt geeft binnen de termijn van twee werkdagen van zijn tussenkomst kennis aan degene, voor wie
      hij tussenkwam. In geval van niet-inachtneming van die termijn is hij, indien daartoe aanleiding bestaat,
      verantwoordelijk voor de schade, door zijn nalatigheid veroorzaakt, zonder dat echter de schadevergoeding de
      wisselsom mag te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel232
  - number: '233.1'
    text: |-
      De acceptatie bij tussenkomst mag plaats hebben in alle gevallen, waarin de houder van een voor acceptatie vatbare
      wisselbrief vóór de vervaldag recht van regres mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel233
  - number: '233.2'
    text: |-
      Wanneer op de wisselbrief iemand is aangewezen om deze, in geval van nood, ter plaatse van betaling te accepteren
      of te betalen, mag de houder zijn recht tegen degene, die de aanwijzing heeft gedaan en tegen hen, die daarna hun
      handtekeningen op de wisselbrief hebben geplaatst, niet vóór de vervaldag uitoefenen, tenzij hij de wisselbrief aan
      de aangewezen persoon heeft aangeboden, en van diens weigering tot acceptatie protest is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel233
  - number: '233.3'
    text: |-
      In de andere gevallen van tussenkomst mag de houder de acceptatie bij tussenkomst weigeren. Indien hij haar echter
      aanneemt, verliest hij zijn recht van regres, hetwelk hem vóór de vervaldag toekomt tegen degene, voor wie de
      acceptatie is gedaan, en tegen hen, die daarna hun handtekeningen op de wisselbrief hebben geplaatst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel233
  - number: '233.4'
    text: |-
      De acceptatie bij tussenkomst wordt op de wisselbrief vermeld; zij wordt door de interveniënt ondertekend. Zij
      wijst aan, voor wie zij is geschied; bij gebreke van die aanwijzing wordt zij geacht voor de trekker te zijn
      geschied.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel233
  - number: '234.1'
    text: |-
      De acceptant bij tussenkomst is tegenover de houder en tegenover de endossant en, die de wisselbrief hebben
      geëndosseerd na degene, voor wie de tussenkomst is geschied, op dezelfde wijze als deze laatste verbonden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel234
  - number: '234.2'
    text: |-
      Niettegenstaande de acceptatie bij tussenkomst zijn degene, voor wie zij werd gedaan en degenen, die tegenover deze
      regresplichtig zijn, bevoegd om van de houder, indien daartoe aanleiding bestaat, tegen terugbetaling van de bij
      het [vierde en vijfde lid van artikel 224][ref1] aangewezen som, de afgifte van de wisselbrief, van het protest en
      van een voor voldaan getekende rekening te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel224
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '224'
        afdeling: Zevende
  - number: '235.1'
    text: |-
      De betaling bij tussenkomst mag plaats hebben in alle gevallen, waarin, hetzij op de vervaldag, hetzij vóór de
      vervaldag, de houder recht van regres heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel235
  - number: '235.2'
    text: De betaling moet de gehele som belopen, welke degene, voor wie zij heeft plaats gehad, moest voldoen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel235
  - number: '235.3'
    text: |-
      Zij moet plaats hebben uiterlijk op de dag volgende op de laatste dag, waarop het protest van non-betaling mag
      worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel235
  - number: '236.1'
    text: |-
      Indien de wisselbrief is geaccepteerd door interveniënten, wier domicilie ter plaatse van betaling is gevestigd,
      of indien personen, wier domicilie in dezelfde plaats is gevestigd, zijn aangeduid om in geval van nood te betalen,
      moet de houder de wisselbrief aan al die personen aanbieden, en, indien daartoe aanleiding bestaat, protest van
      non-betaling doen opmaken uiterlijk op de dag volgende op de laatste dag, waarop dit mag geschieden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel236
  - number: '236.2'
    text: |-
      Bij gebreke van protest binnen die termijn zijn degene, die het noodadres heeft gesteld of voor wie de wisselbrief
      is geaccepteerd, en de latere endossanten van hun verbintenis bevrijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel236
  - number: '236.3'
    text: |-
      De houder, die weigert de betaling bij tussenkomst aan te nemen, verliest zijn recht van regres op hen, die
      daardoor zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel236
  - number: '236.4'
    text: |-
      De betaling bij tussenkomst moet worden vastgesteld door een kwijting, geplaatst op de wisselbrief met aanwijzing
      van degene, voor wie zij is gedaan. Bij gebreke van die aanwijzing wordt de betaling geacht voor de trekker te
      zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel236
  - number: '236.5'
    text: |-
      De wisselbrief en het protest, indien dit is opgemaakt, moeten worden uitgeleverd aan hem, die bij tussenkomst
      betaalt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel236
  - number: '237.1'
    text: |-
      Hij, die bij tussenkomst betaalt, verkrijgt de rechten, uit de wisselbrief voortvloeiende, tegen degene, voor wie
      hij heeft betaald, en tegen degenen, die tegenover deze laatste krachtens de wisselbrief verbonden zijn. Hij mag
      echter de wisselbrief niet opnieuw endosseren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel237
  - number: '237.2'
    text: De endossanten, volgende op degene, voor wie de betaling heeft plaats gehad, zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel237
  - number: '237.3'
    text: |-
      Indien zich meer personen tot de betaling bij tussenkomst aanbieden, heeft de voorkeur de betaling, welke het
      grootste aantal bevrijdingen teweegbrengt. De interveniënt, die desbewust in strijd hiermede handelt, verliest zijn
      recht van regres tegen hen, die anders zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel237
  - number: '238.1'
    text: De wisselbrief mag in meer gelijkluidende exemplaren worden getrokken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel238
  - number: '238.2'
    text: |-
      Die exemplaren moeten in de tekst zelf van de titel worden genummerd, bij gebreke waarvan elk exemplaar wordt
      beschouwd als een afzonderlijke wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel238
  - number: '238.3'
    text: |-
      Iedere houder van een wisselbrief, waarin niet is vermeld, dat deze in een enkel exemplaar getrokken is, mag op
      zijn kosten de levering van meer exemplaren vorderen. Te dien einde moet hij zich tot zijn onmiddellijke endossant
      wenden, die verplicht is zijn medewerking te verlenen om zijn eigen endossant aan te spreken, en zo vervolgens,
      teruggaande tot de trekker. De endossanten zijn verplicht, de endossementen ook op de nieuwe exemplaren aan te
      brengen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel238
  - number: '238.4'
    text: |-
      De betaling, op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht van de
      andere exemplaren te niet doet. Echter blijft de betrokkene verbonden wegens elk geaccepteerd exemplaar, dat hem
      niet is uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel238
  - number: '238.5'
    text: |-
      De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, welke hun handtekening dragen en welke niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel238
  - number: '239.1'
    text: |-
      Hij, die één der exemplaren ter acceptatie heeft gezonden, moet op de andere exemplaren de naam van de persoon
      aanwijzen, in wiens handen dat exemplaar zich bevindt. Deze is verplicht dit aan de rechtmatige houder van een
      ander exemplaar uit te leveren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel239
  - number: '239.2'
    text: |-
      Weigert hij dit, dan mag de houder slechts zijn recht van regres uitoefenen, nadat hij door een protest heeft doen
      vaststellen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel239
  - number: 239.2.1°
    text: dat het ter acceptatie gezonden exemplaar hem desgevraagd niet is uitgeleverd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel239
  - number: 239.2.2°
    text: dat hij de acceptatie of de betaling op een ander exemplaar niet heeft kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel239
  - number: '240.1'
    text: Elke houder van een wisselbrief heeft het recht, daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '240.2'
    text: |-
      Het afschrift moet het oorspronkelijke nauwkeurig weergeven met de endossementen en alle andere vermeldingen, welke
      er op voorkomen. Het moet aangeven, waar het afschrift ophoudt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '240.3'
    text: |-
      Het kan worden geëndosseerd en voor aval getekend op dezelfde wijze en met dezelfde gevolgen, als het
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '240.4'
    text: |-
      Het afschrift moet degene, in wiens handen het oorspronkelijke stuk zich bevindt, vermelden. Deze is verplicht het
      oorspronkelijke stuk aan de rechtmatige houder van het afschrift uit te leveren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '240.5'
    text: |-
      Weigert hij dit, dan mag de houder zijn recht van regres tegen hen, die het afschrift hebben geëndosseerd of voor
      aval getekend, slechts uitoefenen, nadat hij door een protest heeft doen vaststellen, dat het oorspronkelijke stuk
      hem desgevraagd niet is uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '240.6'
    text: |-
      Indien na het laatste daarop geplaatste endossement, alvorens het afschrift is vervaardigd, het oorspronkelijke
      stuk de clausule draagt: «van hier af geldt het endossement slechts op de copie», of enige andere soortgelijke
      clausule, is een nadien op het oorspronkelijke stuk geplaatst endossement nietig
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel240
  - number: '241.1'
    text: |-
      Degene die een wisselbrief waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek BES][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel49
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '49'
  - number: '241.2'
    text: |-
      Degene, die een wisselbrief, waarvan hij houder was, en welke is vervallen en, zoveel nodig, geprotesteerd,
      vermist, kan met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek BES][ref1] zijn
      rechten alleen tegen de acceptant en tegen de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel49
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '49'
  - number: '242'
    text: |-
      In geval van verandering van de tekst van een wisselbrief, zijn zij, die daarna hun handtekeningen op de
      wisselbrief geplaatst hebben, volgens de veranderde tekst verbonden; zij, die daarvoor hun handtekeningen op de
      wisselbrief geplaatst hebben, zijn verbonden volgens de oorspronkelijke tekst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel242
  - number: '243.1'
    text: |-
      Behoudens de bepalingen van de volgende leden gaat wisselschuld te niet door alle middelen van schuldbevrijding,
      bij het Burgerlijk Wetboek BES aangewezen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel243
  - number: '243.2'
    text: |-
      Alle rechtsvorderingen, welke uit de wisselbrief tegen de acceptant voortspruiten, verjaren door een tijdsverloop
      van drie jaren, gerekend van de vervaldag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel243
  - number: '243.3'
    text: |-
      De rechtsvorderingen van de houder tegen de endossanten en tegen de trekker verjaren door een tijdsverloop van een
      jaar, gerekend van de dagtekening van het tijdig opgemaakte protest of, in geval van de clausule zonder kosten, van
      de vervaldag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel243
  - number: '243.4'
    text: |-
      De rechtsvorderingen van de endossanten tegen elkander en tegen de trekker verjaren door tijdsverloop van zes
      maanden, gerekend van de dag, waarop de endossant ter voldoening aan zijn regresplicht de wisselbrief heeft
      betaald, of van de dag, waarop hij zelf in rechte is aangesproken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel243
  - number: '243.5'
    text: |-
      De in het tweede lid bedoelde verjaring mag niet worden ingeroepen door de acceptant, indien of voor zover hij
      fonds heeft ontvangen of zich ongerechtvaardigd zou hebben verrijkt; evenmin mag de in het derde en vierde lid
      bedoelde verjaring worden ingeroepen door de trekker, indien of voor zover hij geen fonds heeft bezorgd, noch door
      de trekker of de endossanten, die zich ongerechtigd zouden hebben verrijkt; alles onverminderd het bepaalde bij
      [artikel 306 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel306
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '306'
  - number: '244.1'
    text: |-
      De stuiting van de verjaring is slechts van kracht tegen degene, ten aanzien van wie de stuitingshandeling heeft
      plaats gehad.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel244
  - number: '244.2'
    text: |-
      Op de in het [vorig artikel][ref1] bedoelde verjaringen is
      [artikel 321, eerste lid, onder a tot en met d, van Boek 3 van het Burgerlijk Wetboek BES][ref2] niet van
      toepassing; in de gevallen bedoeld in artikel 321, eerste lid, onder b en c, van Boek 3 van het Burgerlijk
      Wetboek BES heeft de onbekwame of rechthebbende wiens rechtsvordering is verjaard, verhaal op de wettelijk
      vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel321
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '243'
        afdeling: Elfde
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '321'
  - number: '245.1'
    text: |-
      De betaling van een wisselbrief, waarvan de vervaldag een wettelijke feestdag is, mag eerst worden gevorderd
      op de eerstvolgende werkdag. Evenzo mogen alle andere handelingen met betrekking tot wisselbrieven, met name de
      aanbieding ter acceptatie en het protest, niet plaats hebben dan op een werkdag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel245
  - number: '245.2'
    text: |-
      Wanneer één van die handelingen moet worden verricht binnen een zekere termijn, waarvan de laatste dag een
      wettelijke feestdag is, wordt deze termijn verlengd tot de eerste werkdag, volgende op het einde van die termijn.
      De tussenliggende feestdagen zijn begrepen in de berekening van de termijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel245
  - number: '245.3'
    text: |-
      Als wettelijke feestdag in de zin van deze afdeling worden beschouwd: de zondag; de nieuwjaarsdag; de datum
      vallende na de, in ieder van de openbare lichamen Bonaire, Sint Eustatius en Saba afzonderlijk, gehouden
      Carnavalsoptocht; de Goede Vrijdag; de Christelijke tweede Paasdag; de Hemelvaartsdag; de dag waarop de verjaardag
      van de Koningin officieel wordt gevierd; de dag waarop de dag van de arbeid (1 mei) officieel wordt gevierd; de
      eerste en tweede Kerstdag; de datum 6 september voor wat betreft het openbaar lichaam Bonaire; de datum 16 november
      voor wat betreft het openbaar lichaam Sint Eustatius en de eerste vrijdag in de maand december voor wat betreft het
      openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel245
  - number: '245.4'
    text: |-
      In de wettelijke of bij overeenkomst vastgestelde termijnen is niet begrepen de dag, waarop deze termijnen beginnen
      te lopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel245
  - number: '245.5'
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel245
  - number: '246.1'
    text: 'Het orderbriefje behelst:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.1°
    text: |-
      hetzij de orderclausule, hetzij de benaming «orderbriefje» of «promesse aan order», opgenomen in de tekst zelf, en
      uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.2°
    text: de onvoorwaardelijke belofte een bepaalde som te betalen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.3°
    text: de aanwijzing van de vervaldag;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.4°
    text: die van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.5°
    text: de naam van degene, aan wie of aan wiens order de betaling moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.6°
    text: de vermelding van de dagtekening, alsmede van de plaats, waar het orderbiljet is ondertekend;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: 246.1.7°
    text: de handtekening van hem, die de titel uitgeeft (ondertekenaar).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: '246.2'
    text: |-
      De titel, waarin één van de vermeldingen, in het voorgaande lid aangegeven, ontbreekt, geldt niet als orderbriefje,
      behoudens in de hieronder genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: '246.3'
    text: Het orderbriefje, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: '246.4'
    text: |-
      Bij gebreke van een bijzondere aanwijzing wordt de plaats van de ondertekening van de titel geacht te zijn de
      plaats van betaling en tevens de plaats van het domicilie van de ondertekenaar.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: '246.5'
    text: |-
      Het orderbriefje, dat de plaats van zijn ondertekening niet vermeldt, wordt geacht te zijn ondertekend in de
      plaats, aangegeven naast de naam van de ondertekenaar.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel246
  - number: '247.1'
    text: |-
      Voor zover zij niet onverenigbaar zijn met de aard van het orderbriefje, zijn daarop toepasselijk de
      bepalingen over wisselbrieven betreffende: het endossement ([artikelen 189–196][ref1]); de vervaldag
      ([artikelen 208–212][ref2]); de betaling ([artikelen 213–216][ref3]); het recht van regres in
      geval van non-betaling ([artikelen 217–226][ref4], [228–231][ref5]); de betaling bij tussenkomst
      ([artikelen 232][ref6], [235–237][ref7]); de wisselafschriften ([artikel 240][ref8]); de vermiste wisselbrieven
      ([artikel 241, eerste lid][ref9]); de veranderingen ([artikel 242][ref10]); de verjaring ([artikelen 243][ref11] en
      [244][ref12]); de feestdagen, de berekening der termijnen en het verbod van respijtdagen ([artikel 245][ref13]).


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel208
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel217
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel228
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel232
      [ref7]: https://wetten.overheid.nl/BWBR0028278#Artikel235
      [ref8]: https://wetten.overheid.nl/BWBR0028278#Artikel240
      [ref9]: https://wetten.overheid.nl/BWBR0028278#Artikel241
      [ref10]: https://wetten.overheid.nl/BWBR0028278#Artikel242
      [ref11]: https://wetten.overheid.nl/BWBR0028278#Artikel243
      [ref12]: https://wetten.overheid.nl/BWBR0028278#Artikel244
      [ref13]: https://wetten.overheid.nl/BWBR0028278#Artikel245
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '189'
        afdeling: Tweede
