  - number: '554.2'
    text: |-
      Bepalingen in de arbeidsovereenkomst, welke afwijkingen bevatten van de algemene verordeningen betreffende de
      bevoegdheid van de rechter om kennis te nemen van geschillen betrekkelijk deze overeenkomst, zijn nietig, met
      uitzondering van die, waarbij partijen zich verbinden om dergelijke geschillen aan de uitspraak van scheidslieden
      te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel554
  - number: '555.1'
    text: |-
      Een beschikking ingevolge de [artikelen 516 vierde lid][ref1], [525 laatste lid][ref2], [540][ref3], [546][ref4],
      [550][ref5], [551][ref6] en [552][ref7] geeft de rechter in eerste aanleg niet dan na verhoor, althans na
      behoorlijke oproeping door de griffier, van partijen. Bij de oproeping van de wederpartij wordt een afschrift van
      het verzoekschrift gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel516
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel525
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel540
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel546
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel550
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel551
      [ref7]: https://wetten.overheid.nl/BWBR0028278#Artikel552
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel555
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '516'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '525'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '540'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028278
