        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '546'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '550'
        paragraaf: '2'
      - id: ref5
