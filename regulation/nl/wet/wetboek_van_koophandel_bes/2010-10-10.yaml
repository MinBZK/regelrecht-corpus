  - number: '484.2'
    text: |-
      [Artikel 530][ref1] vindt toepassing ten aanzien van de [artikelen 476][ref2], [480][ref3] en [539][ref4] in
      verband met [artikel 484, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel530
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel476
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel480
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel539
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel484
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel484
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '530'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '476'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '480'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '539'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '484'
  - number: '484.3'
    text: |-
      Als gewichtige redenen worden, behalve die, genoemd in [artikel 540][ref1], ook beschouwd omstandigheden, na
      de aanvang van de dienst aan boord aan de verzoeker gebleken of nadien opgekomen, waardoor de voortzetting van
      de reis, waarop het schip zich bevindt, de kapitein of de opvarenden aan onvoorzien, groot levensgevaar zou
      blootstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel540
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel484
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '540'
        paragraaf: '2'
  - number: '485'
    text: |-
      Bij overeenkomst mogen partijen niet afwijken van het bepaalde in de [artikelen 475][ref1],
      [476][ref2], [478][ref3] en [483][ref4], noch ook ten nadele van de kapitein van het bepaalde in
      [artikel 484, laatste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel475
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel476
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel478
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel483
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel484
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel485
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '475'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '476'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '478'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '483'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '484'
  - number: '486'
    text: |-
      De bepalingen van de [artikelen 475–485][ref1] gelden niet voor kapiteins van ten minste twintig kubieke meters
      bruto-inhoud metende, langs de kusten varende vaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel475
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel486
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '475'
  - number: '487.1'
    text: Scheepsofficieren zijn de schepelingen, aan wie de monsterrol de rang van officier toekent.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel487
  - number: '487.2'
    text: Scheepsgezellen zijn alle overige schepelingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel487
  - number: '488'
    text: |-
      Voor zover de zeewerkgever de verhouding tussen de scheepsofficieren onderling, tussen de scheepsgezellen onderling
      en tussen de scheepsofficieren en de scheepsgezellen niet heeft geregeld, beslist de kapitein daaromtrent.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel488
  - number: '489'
    text: |-
      Wanneer de monsterrol bepaalt, dat er aan boord een commissie van schepelingen zal zijn, stelt zij daarvan tevens
      de samenstelling en de bevoegdheid vast.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel489
  - number: '490.1'
    text: |-
      Als schepelingen worden alleen aangemerkt personen, die een arbeidsovereenkomst met de zeewerkgever hebben
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel490
  - number: '490.2'
    text: |-
      De kapitein vertegenwoordigt de zeewerkgever in de uitvoering van de arbeidsovereenkomsten met de schepelingen, die
      in dienst zijn aan boord van het door hem gevoerde schip.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel490
  - number: '491'
    text: |-
      Op de arbeidsovereenkomst tussen de zeewerkgever en de schepeling zijn de bepalingen van het Burgerlijk Wetboek
      BES met uitzondering evenwel van die van de [zevende Titel van het derde Boek][ref1], van toepassing, voor zover
      daarvan bij algemene verordening niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel491
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '492.1'
    text: |-
      De arbeidsovereenkomst tussen de zeewerkgever en de schepeling moet, op straffe van nietigheid, schriftelijk worden
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel492
  - number: '492.2'
    text: De kosten van de akte en andere bijkomende kosten zijn ten laste van de zeewerkgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel492
  - number: '493'
    text: |-
      De overeenkomst moet worden aangegaan hetzij voor een bepaalde tijd, hetzij voor één of meer reizen (bij de reis),
      hetzij voor onbepaalde tijd of tot wederopzegging.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel493
  - number: '494'
    text: |-
      Indien de duur van een dienstbetrekking noch bij overeenkomst of reglement, noch bij wettelijk voorschrift, noch
      ook door het gebruik, is aangegeven, wordt zij geacht voor onbepaalde tijd te zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel494
  - number: '495.1'
    text: |-
      Indien partijen de dienstbetrekking na het verstrijken van de tijd, waarvoor zij is aangegaan, zonder tegenspraak
      voortzetten, wordt die overeenkomst geacht voor dezelfde tijd op de vroegere voorwaarden wederom te zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel495
  - number: '495.2'
    text: |-
      Hetzelfde geldt, indien de bedongen opzegging achterwege blijft en partijen de gevolgen daarvan niet opzettelijk
      hebben geregeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel495
  - number: '496'
    text: 'De overeenkomst moet, behalve hetgeen elders bij algemene verordening daartoe is voorgeschreven, behelzen:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.1°
    text: de naam en de voornamen van de schepeling, de dag van zijn geboorte of zijn leeftijd, en zijn geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.2°
    text: de plaats en de dag van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.3°
    text: de aanduiding van het schip of de schepen, waarop de schepeling zich verbindt dienst te doen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.4°
    text: de te ondernemen reis of reizen, indien deze reeds vaststaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.5°
    text: de hoedanigheid, waarin de schepeling in dienst zal treden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.6°
    text: indien mogelijk, de plaats waar en de dag waarop de dienst aan boord aanvangt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.7°
    text: |-
      het bepaalde bij [artikel 515][ref1] nopens het recht op vrije dagen;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel515
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '515'
        paragraaf: '2'
  - number: 496.8°
    text: 'de beëindiging van de dienstbetrekking, namelijk:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
  - number: 496.8°.a
    text: |-
      indien de overeenkomst voor een bepaalde tijd wordt aangegaan, de dag waarop de dienstbetrekking eindigt, met
      vermelding van de inhoud van [artikel 532][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel532
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '532'
        paragraaf: '2'
  - number: 496.8°.b
    text: |-
      indien de overeenkomst bij de reis wordt aangegaan, de haven overeengekomen voor de beëindiging
      van de dienstbetrekking, met vermelding van de inhoud van [artikel 533, tweede lid][ref1], alsmede,
      indien de haven een haven in de openbare lichamen Bonaire, Sint Eustatius en Saba is, van het
      [eerste of van het tweede lid van artikel 534][ref2], naar gelang de haven al of niet met name is genoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel533
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel534
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '533'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '534'
        paragraaf: '2'
  - number: 496.8°.c
    text: |-
      indien de overeenkomst voor onbepaalde tijd wordt aangegaan, de inhoud van [artikel 535, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel535
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel496
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '535'
        paragraaf: '2'
  - number: '497.1'
    text: |-
      Voor zover de namen, de plaats of de dag van geboorte van de schepeling niet bekend zijn, wordt dit in de
      overeenkomst vermeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel497
  - number: '497.2'
    text: |-
      De aanduiding in de overeenkomst van het schip of de schepen, waarop de schepeling zich verbindt dienst te doen,
      kan ook geschieden door te bepalen, dat hij dienst zal doen op een of meer door de zeewerkgever aangewezen schepen,
      behorende tot die, welke de zeewerkgever voor de vaart ter zee gebruikt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel497
  - number: '497.3'
    text: |-
      Indien partijen van het bepaalde bij de [artikelen 515][ref1], [532][ref2], [533, tweede lid][ref3],
      [534, eerste of tweede lid][ref4], of [535, eerste lid][ref5], wensen af te wijken, voor zover wettelijk
      geoorloofd, wordt in plaats daarvan die afwijkende regeling in de overeenkomst opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel532
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel533
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel534
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel535
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel497
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '515'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '532'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '533'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '534'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '535'
        paragraaf: '2'
  - number: '498.1'
    text: |-
      Een minderjarige is bekwaam als schepeling overeenkomsten aan te gaan, indien hij daartoe door zijn wettelijke
      vertegenwoordiger, hetzij mondeling, hetzij schriftelijk, is gemachtigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel498
  - number: '498.2'
    text: |-
      Een mondelinge machtiging strekt slechts tot het aangaan van een bepaalde overeenkomst. Zij wordt verleend in
      tegenwoordigheid van de zeewerkgever of van degene, die namens deze handelt. Zij mag niet voorwaardelijk worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel498
  - number: '498.3'
    text: |-
      Indien de machtiging schriftelijk is verleend, is de minderjarige verplicht de volmacht ter hand te stellen aan de
      zeewerkgever, die de minderjarige onverwijld een gewaarmerkt afschrift daarvan doet toekomen en de volmacht bij het
      einde van de dienstbetrekking aan de minderjarige of diens rechtverkrijgenden teruggeeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel498
  - number: '498.4'
    text: |-
      Voor zover zulks niet door het stellen van bepaalde voorwaarden in de machtiging uitdrukkelijk is uitgesloten,
      staat de minderjarige in alles, wat betrekking heeft op de overeenkomst, door hem ingevolge de verleende machtiging
      aangegaan, met een meerderjarige gelijk. Echter mag hij niet in rechte verschijnen zonder bijstand van zijn
      wettelijke vertegenwoordiger, behalve wanneer aan de rechter gebleken is, dat de wettelijke vertegenwoordiger niet
      bij machte is zich te verklaren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel498
  - number: '499'
    text: |-
      Indien een daartoe niet bekwaam minderjarige een overeenkomst heeft aangegaan en dientengevolge gedurende vier
      weken, zonder verzet van zijn wettelijke vertegenwoordiger, in dienst arbeid heeft verricht, wordt hij geacht door
      die vertegenwoordiger mondeling tot het aangaan van die overeenkomst gemachtigd te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel499
  - number: '500.1'
    text: |-
      Indien in de in [artikel 498][ref1] genoemde schriftelijke machtiging de voorwaarde is opgenomen, dat het in geld
      vastgesteld loon, geheel of gedeeltelijk, in stede van aan de minderjarige, aan de wettelijke vertegenwoordiger
      zelf moet worden voldaan, wordt deze ten opzichte van de voldoening van het loon, of van het gedeelte hetwelk hem
      moet worden uitgekeerd, als de schepeling aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel498
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel500
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '498'
        paragraaf: '2'
  - number: '500.2'
    text: |-
      Ook indien een zodanige voorwaarde niet in de machtiging is opgenomen, wordt het aan de minderjarige verschuldigd
      in geld vastgesteld loon aan de wettelijke vertegenwoordiger voldaan, wanneer deze zich tegen de voldoening aan de
      minderjarige schriftelijk verzet.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel500
  - number: '500.3'
    text: |-
      In andere gevallen dan die, bedoeld in het eerste en het tweede lid van dit artikel, is de zeewerkgever door
      betaling aan de minderjarige behoorlijk gekweten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel500
  - number: '501'
    text: |-
      Een door de zeewerkgever vastgesteld reglement betreffende de dienst aan boord is voor de schepeling
      verbindend, mits een in de Nederlandse taal en in Bonaire onderscheidenlijk in Sint Eustatius en Saba bovendien
      onderscheidenlijk in het Papiaments en in de Engelse taal gesteld exemplaar daarvan in een mede voor hem bestemd
      dagverblijf der schepelingen is en blijft opgehangen en behoorlijk leesbaar is, en voor zover de inhoud niet in
      strijd is met de door hem aangegane arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel501
  - number: '502'
    text: |-
      Een verklaring van de schepeling, waarbij hij zich verbindt zich met elk in de toekomst vastgesteld reglement of
      met elke toekomstige wijziging van een bestaand reglement te verenigen, is nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel502
  - number: '503'
    text: |-
      Nietig is een beding waarbij de schepeling wordt beperkt in zijn vrijheid om na het einde van de dienstbetrekking
      arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel503
  - number: '504'
    text: |-
      Van het ogenblik waarop volgens de arbeidsovereenkomst de dienstbetrekking aanvangt is de schepeling verplicht zich
      te houden ter beschikking van de zeewerkgever om gemonsterd te worden op een in de overeenkomst aangeduid schip.
      Is omtrent de aanvang van de dienstbetrekking niets bepaald, dan wordt die voor de toepassing van dit voorschrift
      geacht samen te vallen met het sluiten van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel504
  - number: '505'
    text: |-
      De schepeling wordt geacht in dienst te zijn aan boord van een schip van de daarvoor in de monsterrol aangewezen
      dag of, bij gebreke daarvan, van de dag, waarop de monsterrol is opgemaakt, tot en met de dag, waarop hij van zijn
      werkzaamheden aan boord wordt ontheven of bij deze neerlegt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel505
  - number: '506.1'
    text: 'Schepelingen-dienst mogen niet verrichten:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel506
  - number: 506.1.1°
    text: zij die niet met de zeewerkgever een arbeidsovereenkomst hebben aangegaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel506
  - number: 506.1.2°
    text: |-
      zij, die, hoewel zij met de zeewerkgever een arbeidsovereenkomst hebben aangegaan, niet in de monsterrol zijn
      genoemd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel506
  - number: '506.2'
    text: |-
      Het onder 2°. bedoeld verbod geldt niet voor opstappers, mits zij in de eerste haven, welke het schip aandoet, op
      de monsterrol worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel506
  - number: '507.1'
    text: |-
      De zeewerkgever is verplicht te zorgen voor behoorlijke voeding en voor behoorlijk dag- en nachtverblijf van de
      schepelingen aan boord.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel507
  - number: '507.2'
    text: |-
      In geen geval mag de zeewerkgever de voeding of de levering van de daarvoor benodigde eet- en drinkwaren bij wijze
      van aanbesteding opdragen aan de kapitein of aan een schepeling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel507
  - number: '508'
    text: |-
      De schepeling heeft voor iedere dag, waarop hem de verschuldigde voeding niet of niet ten volle wordt verstrekt,
      recht op een vergoeding, waarvan het bedrag bij de arbeidsovereenkomst of, bij stilzwijgen van deze, door het
      gebruik of de billijkheid wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel508
  - number: '509.1'
    text: |-
      Ten verzoeke van een derde van de schepelingen heeft buiten de openbare lichamen Bonaire, Sint Eustatius en Saba
      een onderzoek plaats naar de deugdelijkheid en voldoende hoeveelheid van de eet- en drinkwaren. Het onderzoek wordt
      door de Nederlandse consulaire ambtenaar of bij gebreke van deze, en in het Europese deel van Nederland, Curaçao,
      Sint Maarten of Aruba door het bevoegde gezag ingesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel509
  - number: '509.2'
    text: |-
      De kapitein is verplicht onbruikbare eet- en drinkwaren, op last van deze autoriteiten, tegen bruikbare te
      verwisselen en het nodige zich aan te schaffen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel509
  - number: '510.1'
    text: |-
      Een gelijk deel van de schepelingen is bevoegd om bij dezelfde autoriteiten buiten de openbare lichamen Bonaire,
      Sint Eustatius en Saba over onvoldoende ligging of ruimte, na de afreis ontstaan, te klagen; ook hiernaar wordt een
      onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel510
  - number: '510.2'
    text: De kapitein is op last van de autoriteiten verplicht in het gebrekkige te voorzien.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel510
  - number: '510.3'
    text: |-
      De kapitein, die aan de hem, overeenkomstig dit en het [vorige artikel][ref1], gegeven bevelen niet heeft voldaan,
      wordt geacht zich jegens de schepelingen te hebben misdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel509
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel510
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '509'
        paragraaf: '2'
  - number: '511.1'
    text: De schepeling mag noch sterke drank noch wapens aan boord brengen of hebben zonder toestemming van de kapitein.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel511
  - number: '511.2'
    text: |-
      De kapitein is bevoegd om hetgeen hij in strijd met deze bepaling aan boord aantreft, in beslag te nemen en, voor
      zover zulks niet met de ter zake en ter plaatse bestaande wettelijke voorschriften in strijd is, te vernietigen of
      ten bate van één of meer door de voorzitter van de Raad voor de Scheepvaart aangewezen instellingen ten behoeve van
      zeelieden te verkopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel511
  - number: '511.3'
    text: |-
      Dezelfde bevoegdheid heeft de kapitein ten aanzien van smokkelwaren, contrabande en opium of andere verdovende
      middelen, welke de schepeling aan boord brengt of heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel511
  - number: '512.1'
    text: |-
      De overeenkomst moet, op straffe van nietigheid, het bedrag van het in geld uit te betalen loon bevatten dan
      wel aangeven hoe het zal worden bepaald. De bepaling mag niet aan het goedvinden van een der partijen worden
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel512
  - number: '512.2'
    text: |-
      Bij de toepassing van het bepaalde in de [artikelen 516 eerste lid][ref1], [524 eerste lid][ref2],
      [526 derde lid][ref3], [531][ref4], [534 derde lid][ref5], [539][ref6] en [541][ref7] wordt loon, vastgesteld bij
      de reis, geacht te zijn vastgesteld voor een tijdruimte gelijk aan de gemiddelde duur van de reis.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel516
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel524
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel526
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel531
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel534
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel539
      [ref7]: https://wetten.overheid.nl/BWBR0028278#Artikel541
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel512
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '516'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '524'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '526'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '531'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '534'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0028278
        artikel: '539'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0028278
        artikel: '541'
        paragraaf: '2'
  - number: '513.1'
    text: |-
      Ongeoorloofd en nietig is elk beding tussen de zeewerkgever en een schepeling, waarbij deze zich verbindt, het loon
      of zijn overige inkomsten of een gedeelte daarvan op een bepaalde wijze te besteden, of zich zijn benodigdheden op
      een bepaalde plaats of bij een bepaalde persoon aan te schaffen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel513
  - number: '513.2'
    text: Van deze bepaling zijn uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel513
  - number: 513.2.1°
    text: het beding, waarbij de schepeling deel neemt in enig aan wettelijke voorschriften voldoend fonds;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel513
  - number: 513.2.2°
    text: |-
      ten aanzien van minderjarige schepelingen het beding, dat de zeewerkgever een gedeelte van het gedurende de
      minderjarigheid verdiende loon ten name van de schepeling plaats in de Postspaarbank of in een aan wettelijke
      voorschriften voldoend spaarfonds, met bepaling, dat de schepeling het eerst mag opvorderen, nadat hij meerderjarig
      is geworden of nadat de rechter in eerste aanleg in het openbaar lichaam, waar de minderjarige werkelijk verblijf
      houdt, op verzoek van diens wettelijke vertegenwoordiger en na verhoor of behoorlijke oproeping van de minderjarige
      en van de zeewerkgever tot de uitbetaling machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel513
  - number: '514.1'
    text: |-
      Bestaat het loon voor het geheel of voor een gedeelte in een bedrag, dat afhankelijk is gesteld van enig
      gegeven, dat uit de boekhouding van de zeewerkgever moet kunnen blijken, dan heeft de schepeling het recht van de
      zeewerkgever mededeling te verlangen van zodanige bewijsstukken, als voor hem nodig zijn om tot de kennis van dat
      gegeven te geraken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel514
  - number: '514.2'
    text: |-
      Bij schriftelijk aangegane overeenkomst of bij reglement mag worden bepaald, dat mededeling van de genoemde
      bewijsstukken, in plaats van aan iedere schepeling afzonderlijk zal geschieden aan een bepaald aantal schepelingen
      in dienst van de zeewerkgever of aan een of meer deskundigen inzake boekhouding, allen door de schepelingen bij
      schriftelijke keuze aangewezen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel514
  - number: '514.3'
    text: |-
      De mededeling van de bewijsstukken door of vanwege de zeewerkgever geschiedt desverlangd onder uitdrukkelijke
      verplichting van geheimhouding door de schepeling en degene, die hem overeenkomstig het voorgaande lid vervangt;
      deze mag echter niet tot geheimhouding tegenover de schepeling worden verplicht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel514
  - number: '514.4'
    text: De verplichting tot geheimhouding is voor zover nodig opgeheven, indien de opgave in rechte wordt betwist.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel514
  - number: '514.5'
    text: |-
      Voor zover het gegeven, in het eerste lid bedoeld, betreft de winst, in de onderneming van de zeewerkgever of in
      een deel daarvan behaald, mag van de bepalingen van het eerste lid bij schriftelijk aangegane overeenkomst of bij
      reglement, ook op andere wijze dan in het tweede lid omschreven, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel514
  - number: '515'
    text: |-
      De schepeling heeft voor ieder jaar, dat hij zonder onderbreking in dienst is van de wederpartij, recht op ten
      minste zeven of tweemaal vijf achtereenvolgende vrije dagen met behoud van loon, tenzij de arbeidsovereenkomst
      is aangegaan bij de reis. Deze vrije dagen moeten zó worden gegeven, dat de schepeling telkens na afloop van twee
      jaren of, indien de dienstbetrekking korter duurt, bij het eindigen van die betrekking alle dagen heeft genoten,
      waarop hij recht heeft. De schepeling, die in het openbaar lichaam Bonaire, Sint Eustatius of Saba thuis behoort,
      worden, indien hij zulks verlangt, de vrije dagen in het openbaar lichaam Bonaire, Sint Eustatius of Saba gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel515
  - number: '516.1'
    text: |-
      De schepeling die in het buitenland ziek wordt, heeft, zolang hij niet is hersteld, ook wanneer de dienstbetrekking
      eerder eindigt, recht op tegemoetkoming bestaande uit:
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: 516.1.a
    text: |-
      behoorlijke geneeskundige behandeling en verpleging, vervoer in verband met de ziekte, genees- en verbandmiddelen,
      (1) indien hij in het buitenland wordt achtergelaten, tot zijn herstel of, indien hij eerder in de openbare
      lichamen Bonaire, Sint Eustatius en Saba terugkeert, tot ten hoogste tien weken na zijn terugkeer, doch in geen
      geval gedurende meer dan zesentwintig weken, (2) indien hij aan boord van het schip blijft, tot ten hoogste tien
      weken na zijn terugkomst daarmede in de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: 516.1.b
    text: |-
      een uitkering in geld, ziekengeld genaamd, welke wordt genoten gedurende ten hoogste twaalf weken en welke bedraagt
      50% van het naar tijdruimte in geld vastgesteld loon, dat de schepeling genoot toen hij ziek werd. Deze termijn van
      twaalf weken gaat in (1) indien de schepeling ziek wordt, terwijl hij niet aan boord van een schip is, op de dag,
      waarop hij ziek wordt, (2) indien hij ziek wordt, terwijl hij aan boord van een schip is, op de dag, waarop hij aan
      de wal ter verpleging wordt achtergelaten of waarop hij, nog niet hersteld, met het schip terugkomt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: '516.2'
    text: Zolang hij aan boord is, blijft hij in het genot van het volle loon.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: '516.3'
    text: |-
      Wordt de schepeling in het buitenland ter verpleging achtergelaten, dan heeft hij bovendien recht op vrij vervoer
      tot een haven in de openbare lichamen Bonaire, Sint Eustatius en Saba te zijner keuze. Onder het vrij vervoer zijn
      begrepen de kosten van onderhoud en nachtverblijf gedurende de reis.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: '516.4'
    text: |-
      Indien de ziekte een gevolg is van opzet of grove schuld, wordt het ziekengeld verbeurd of verminderd, ter
      beoordeling van de rechter in eerste aanleg binnen wiens gebied de zetel van het scheepsbedrijf is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: '516.5'
    text: |-
      De schepeling, die in het buitenland door een ongeval als bedoeld in de [Wet ongevallenverzekering BES][ref1] wordt
      getroffen, heeft hetzelfde recht op geneeskundige behandeling en verpleging en op vrij vervoer als de schepeling
      die in het buitenland ziek wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028497
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
    references:
      - id: ref1
        bwb_id: BWBR0028497
  - number: '516.6'
    text: 'Voor de toepassing van dit artikel wordt:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: 516.6.a
    text: |-
      met ziekte gelijkgesteld een ongeval als bedoeld in [artikel 4, eerste lid van de Wet Ziekteverzekering BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel4
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '4'
  - number: 516.6.b
    text: |-
      de schepeling geacht mede in het buitenland te zijn, indien hij aan boord is van een vertrekkend schip, dat zich
      bevindt binnen de territoriale wateren van de openbare lichamen Bonaire, Sint Eustatius en Saba, terwijl hij niet
      hier te lande ter verpleging wordt achtergelaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel516
  - number: '517'
    text: |-
      Indien de schepeling buiten de openbare lichamen Bonaire, Sint Eustatius en Saba overlijdt terwijl hij in dienst is
      aan boord van een schip, wordt het lijk begraven of overboord gezet op kosten van de zeewerkgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel517
  - number: '518.1'
    text: |-
      Gedurende de tijd, dat de schepeling in dienst is aan boord van een schip, is hij verplicht de bevelen van de
      kapitein met stiptheid op te volgen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel518
  - number: '518.2'
    text: |-
      Indien hij meent, dat deze bevelen onrechtmatig zijn, is hij bevoegd om in de eerste haven, die het schip aandoet
      de tussenkomst in te roepen in de openbare lichamen Bonaire, Sint Eustatius en Saba van de scheepvaartinspectie
      of de betrokken gezaghebber, in het Europese deel van Nederland, Aruba, Curaçao of Sint Maarten van het bevoegde
      gezag en buiten het Koninkrijk, indien dit redelijkerwijze zonder oponthoud van het schip kan geschieden, van de
      Nederlandse diplomatieke of bezoldigde consulaire ambtenaar, die het eerst te bereiken is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel518
  - number: '519.1'
    text: |-
      De kapitein is verplicht de arbeid van de schepeling te regelen in overeenstemming met de daaromtrent bij wet en,
      binnen de grenzen der wetgeving, bij de arbeidsovereenkomst gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel519
  - number: '519.2'
    text: Op zondag behoort de arbeid in ieder geval beperkt te blijven tot het noodzakelijke.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel519
  - number: '520.1'
    text: |-
      De schepeling is verplicht het hem door de kapitein opgedragen werk te verrichten, doch heeft recht op een bijslag
      op het loon voor de tijd, gedurende welke hij langer dan de bij wet of bij arbeidsovereenkomst bepaalde normale
      arbeidsduur werk verricht, tenzij de kapitein het werk noodzakelijk acht tot behoud van het schip, de opvarenden of
      de zaken aan boord. Het bedrag van die bijslag wordt bepaald door de arbeidsovereenkomst of, bij haar stilzwijgen,
      door het gebruik of de billijkheid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel520
  - number: '520.2'
    text: |-
      De kapitein doet van ieder geval van overwerk aantekening houden in een daartoe bestemd register. Elke aantekening
      wordt door de daarbij betrokken schepeling mede-ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel520
  - number: '520.3'
    text: |-
      Het recht, betaling van de bijslag te vorderen, vervalt door verloop van één maand na het eindigen van de dienst
      aan boord in een een haven in Bonaire, Sint Eustatius en Saba en van zes maanden na het eindigen van de dienst aan
      boord buiten de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel520
  - number: '520.4'
    text: |-
      Op de scheepsofficier, tevens hoofd van dienst, de geneeskundige en de marconist zijn de bepalingen van dit artikel
      niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel520
  - number: '521'
    text: |-
      Indien aan de schepeling andere werkzaamheden worden opgedragen dan hij heeft te verrichten overeenkomstig de
      hoedanigheid, waarin hij volgens de arbeidsovereenkomst aan boord dienst doet, en deze werkzaamheden volgens
      overeenkomst of gebruik hoger worden beloond, heeft hij eventueel aanspraak op het daarmede overeenkomend hoger
      loon.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel521
  - number: '522.1'
    text: Zonder toestemming van de kapitein mag de schepeling het schip niet verlaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel522
  - number: '522.2'
    text: |-
      Weigert de kapitein toestemming, dan is hij verplicht de reden voor zijn weigering in het dagboek te vermelden en
      aan de schepeling, op diens verlangen, deze weigering binnen twaalf uur schriftelijk te bevestigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel522
  - number: '523'
    text: |-
      De kapitein heeft disciplinair gezag over de schepeling. Hij is bevoegd om tot handhaving van dit gezag de
      redelijkerwijze nodige maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel523
  - number: '524.1'
    text: |-
      De kapitein is bevoegd om aan de schepeling in geval van verwijdering van boord zonder zijn toestemming, van
      niet tijdig terugkeren aan boord, van dienstweigering, van gebrekkige dienstvervulling, van onbehoorlijk optreden
      tegen een lid van de bemanning of een van de andere opvarenden en van ordeverstoring, een boete op te leggen ten
      bedrage van het naar tijdruimte in geld vastgestelde loon over ten hoogste tien dagen; echter mag de boete niet
      meer bedragen dan een derde van dat loon voor de gehele duur van de reis. In een tijdverloop van tien dagen mag aan
      dezelfde schepeling in totaal niet meer aan boeten worden opgelegd dan de genoemde hoogste bedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel524
  - number: '524.2'
    text: De oplegging van de boete mag voorwaardelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel524
  - number: '524.3'
    text: |-
      Indien de kapitein wegens een dringende reden als bedoeld in [artikel 536][ref1] de dienstbetrekking doet eindigen,
      mag hij te dier zake niet tevens een disciplinaire straf opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel536
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel524
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '536'
        paragraaf: '2'
  - number: '524.4'
    text: |-
      De bestemming van de boeten moet in de arbeidsovereenkomst worden aangegeven. De boete mag noch aan de zeewerkgever
      noch aan de kapitein ten goede komen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel524
  - number: '525.1'
    text: |-
      Alvorens boete op te leggen is de kapitein verplicht de betrokkene en de getuigen te horen in het bijzijn, zo
      mogelijk, van ten minste twee schepelingen van gelijke of hogere rang, overeenkomstig de monsterrol daartoe
      aangewezen. Het proces-verbaal van dit verhoor moet door allen, die daarbij tegenwoordig zijn geweest, worden
      ondertekend. Van weigering om te ondertekenen wordt daarin melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel525
  - number: '525.2'
    text: |-
      Boete mag niet vroeger worden opgelegd dan twaalf uren en niet later dan een week, nadat het feit heeft plaats
      gehad, tenzij bijzondere omstandigheden afwijking noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel525
  - number: '525.3'
    text: |-
      Elke boete moet onverwijld worden ingeschreven in een daartoe bestemd register, met vermelding van het feit, dat
      tot de oplegging aanleiding heeft gegeven, en van de dag waarop het heeft plaats gehad, alsmede van de dag waarop
      de boete is opgelegd. Iedere inschrijving moet worden ondertekend door de kapitein en de in het eerste lid bedoelde
      schepelingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel525
  - number: '525.4'
    text: Een niet in het register ingeschreven boete wordt geacht ten onrechte te zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel525
  - number: '525.5'
    text: |-
      De schepeling is bevoegd om van de oplegging van boete in beroep te komen bij de rechter in eerste aanleg, binnen
      wiens rechtsgebied het schip is aangekomen of de monsterrol is opgemaakt. Het [derde lid van artikel 520][ref1]
      vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel520
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel525
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '520'
        paragraaf: '2'
  - number: '526.1'
    text: |-
      Gedurende de tijd, dat de schepeling in dienst van de zeewerkgever aan boord van een schip of buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba verblijft, heeft zijn niet van tafel en bed gescheiden echtgenote recht op
      uitbetaling, op de voet als in de volgende leden bepaald, van ten hoogste het twee derde gedeelte van het in geld
      vastgesteld loon, tot onderhoud van haar en haar kinderen, die niet in staat zijn in hun onderhoud te voorzien.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel526
  - number: '526.2'
    text: |-
      De uitbetaling door de zeewerkgever geschiedt aan de echtgenote tegen overlegging van een met het oog op de laatste
      monstering afgegeven verklaring van haar man of beschikking van de rechter in eerste aanleg van haar woonplaats en
      wel voor het in die verklaring of die beschikking genoemde gedeelte van het aan de schepeling verschuldigde loon.
      Wanneer een onmiddellijke voorziening wordt vereist, bepaalt de rechter in eerste aanleg aanstonds het gedeelte van
      het loon van de schepeling, op welks uitbetaling de echtgenote voorlopig recht heeft tot onderhoud van haar en de
      in het eerste lid bedoelde kinderen. Deze beschikking behoudt tegenover de zeewerkgever haar kracht gedurende een
      maand na de dag van haar dagtekening, voor zoveel hem niet vóór de afloop van die termijn de eindbeschikking van de
      rechter in eerste aanleg is overlegd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel526
  - number: '526.3'
    text: |-
      Het gedeelte van het loon, op welks uitbetaling de echtgenote recht heeft, wordt haar uitgekeerd op de tijdstippen
      voor de uitbetaling bepaald door de arbeidsovereenkomst of, bij stilzwijgen van deze, door het gebruik of de
      billijkheid, met dien verstaande, dat, indien het loon naar tijdruimte is vastgesteld, de hierbedoelde uitbetaling
      uiterlijk telkens na een maand geschiedt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel526
  - number: '527.1'
    text: |-
      De uitbetaling van het in geld vastgesteld deel van het in dienst aan boord van een schip verdiend loon moet
      geschieden in de munt, waarin het bij de arbeidsovereenkomst is uitgedrukt, of in de munt, gangbaar ter plaatse van
      de uitbetaling. De koers waartegen in het laatste geval de herleiding is geschied moet de schepeling schriftelijk
      worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel527
  - number: '527.2'
    text: |-
      Onverminderd het bepaalde in [artikel 546][ref1], is de schepeling, indien hij meent, dat de hem medegedeelde koers
      niet juist is, bevoegd om zich na afloop van de reis deswege te wenden tot de rechter in eerste aanleg, binnen
      wiens rechtsgebied het schip is aangekomen of de monsterrol is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel546
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel527
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '546'
        paragraaf: '2'
  - number: '528.1'
    text: |-
      Behoudens het bepaalde in [artikel 526][ref1] heeft de schepeling recht op uitbetaling van het in dienst aan boord
      van een schip verdiend loon:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel526
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel528
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '526'
        paragraaf: '2'
  - number: 528.1.1°
    text: |-
      indien het naar tijdruimte is vastgesteld, in iedere haven, welke het schip gedurende de reis aandoet, mits ten
      minste zeven dagen verlopen zijn sedert de laatste uitbetaling;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel528
  - number: 528.1.2°
    text: |-
      indien het niet naar tijdruimte is vastgesteld, op de tijdstippen voor de uitbetaling bepaald door de
      arbeidsovereenkomst of, bij haar stilzwijgen, door het gebruik of de billijkheid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel528
  - number: '528.2'
    text: |-
      Zolang de reis niet is geëindigd, is de zeewerkgever niet verplicht in het geheel meer dan vijf zesde gedeelte van
      het loon uit te betalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel528
  - number: '528.3'
    text: |-
      De uitbetaling van het in het eerste lid onder 1°. bedoeld loon geschiedt uiterlijk op de dag volgende op die van
      de aankomst, de in [artikel 451][ref1] bedoelde dagen niet medegerekend, doch in ieder geval vóór het vertrek uit
      de haven.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel451
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel528
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '451'
  - number: '529'
    text: |-
      De schepeling mag zijn recht op het in geld vastgesteld deel van zijn in dienst aan boord van een schip verdiend
      loon, voor zover dit te zijner beschikking is, alleen afstaan, in pand geven daaronder begrepen, ten behoeve van
      zijn echtgenote voor ten hoogste één derde, van zijn kinderen, de verzorgers van zijn kinderen en zijn ouders voor
      ten hoogste de helft, en van andere bloedverwanten tot de vierde graad en van aanverwanten tot dezelfde graad voor
      ten hoogste één derde; alles met dien verstaande, dat het bedrag van hetgeen hij afstaat, gevoegd bij het ingevolge
      [artikel 526][ref1] aan de echtgenote uit te betalen bedrag, twee derde gedeelte van het gehele in geld vastgesteld
      loon niet mag overtreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel526
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel529
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '526'
        paragraaf: '2'
  - number: '530.1'
    text: |-
      De boeten en de schadeloosstelling, bedoeld in de [artikel 524][ref1] en [539][ref2], zijn bevoorrecht op het in
      geld vastgestelde deel van het loon van de schepeling, hetwelk tot het bedrag daarvan mag worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel524
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel539
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel530
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '524'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '539'
        paragraaf: '2'
  - number: '530.2'
    text: |-
      Boete en schadeloosstelling komen in de eerste plaats ten laste van het deel van het loon, dat aan de schepeling
      persoonlijk moet worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel530
  - number: '531.1'
    text: De dienstbetrekking eindigt door de dood van de schepeling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel531
  - number: '531.2'
    text: |-
      Indien de schepeling overlijdt in dienst aan boord van een schip, wordt het naar tijdruimte in geld vastgestelde
      deel van het loon uitbetaald tot het einde van de maand, waarin het overlijden heeft plaats gehad, doch niet langer
      dan tot de dag, waarop de dienst aan boord van het schip volgens de overeenkomst zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel531
  - number: '532'
    text: |-
      Indien de dienstbetrekking is aangegaan voor een bepaalde tijd en deze verstrijkt terwijl het schip, waarop de
      schepeling in dienst is, zich op reis bevindt, eindigt de dienstbetrekking in de eerste haven, welke het schip
      daarna aandoet.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel532
  - number: '533.1'
    text: |-
      De dienstbetrekking, aangegaan bij de reis, eindigt als de reis of de reizen, waarvoor zij is aangegaan, is of
      zijn afgelopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel533
  - number: '533.2'
    text: |-
      Evenwel is de schepeling bevoegd om, na verloop van anderhalf jaar, de dienstbetrekking zonder schadeloosstelling
      door opzegging te doen eindigen in iedere haven, welke het schip daarna aandoet. Bij de opzegging moet hij de
      termijn in acht nemen, welke redelijkerwijze nodig is voor zijn vervanging in die haven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel533
  - number: '534.1'
    text: |-
      Indien is overeengekomen, dat de dienstbetrekking zal eindigen bij terugkomst van het schip in een met name
      genoemde een haven in Bonaire, Sint Eustatius of Saba, is de zeewerkgever bevoegd haar te doen eindigen in een
      haven, van waaruit de genoemde een haven in Bonaire, Sint Eustatius of Saba, anders dan met een luchtvaartuig,
      binnen vierentwintig uur kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel534
  - number: '534.2'
    text: |-
      Is de haven in Bonaire, Sint Eustatius of Saba, waarop het schip zal terugkomen, niet met name genoemd, dan is de
      zeewerkgever bevoegd de dienstbetrekking te doen eindigen in een haven buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba, van waaruit het eiland waar de overeenkomst is aangegaan op de in het eerste lid bedoelde wijze
      kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel534
  - number: '534.3'
    text: |-
      Behalve de reiskosten heeft de zeewerkgever de schepeling voor de dagen na de beëindiging van de dienstbetrekking
      tot de dag, volgende op die, waarop deze ter plaatse had kunnen aankomen, loon te betalen op de voet van het in de
      arbeidsovereenkomst naar tijdruimte in geld vastgestelde deel van het loon, alsmede de kosten van onderhoud en zo
      nodig van nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel534
  - number: '535.1'
    text: |-
      De dienstbetrekking, aangegaan voor onbepaalde tijd, mag ieder der partijen gedurende de tijd, dat de schepeling in
      dienst is aan boord van een schip door opzegging, met inachtneming van de daarvoor gestelde termijn, doen eindigen
      in iedere haven, waar het schip laadt of lost. Tenzij een langere termijn van opzegging is overeengekomen, bedraagt
      deze vierentwintig uren. De opzegging geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel535
  - number: '535.2'
    text: De opzeggingstermijn mag voor de zeewerkgever niet korter worden gesteld dan voor de schepeling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel535
  - number: '535.3'
    text: |-
      Dit artikel is mede van toepassing indien, bij een dienstbetrekking voor een bepaalde tijd of voor een of meer
      reizen aangegaan, de zeewerkgever overlijdt gedurende de tijd, dat de schepeling in dienst is aan boord van een
      schip en hetzij de erfgenamen van de reder hetzij de schepeling de dienstbetrekking willen doen eindigen als ware
      zij aangegaan voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel535
  - number: '536.1'
    text: |-
      Ieder der partijen is bevoegd om de dienstbetrekking zonder opzegging of zonder inachtneming van de voor opzegging
      geldende bepalingen en zonder schadeloosstelling te doen eindigen om een dringende, aan de wederpartij onverwijld
      medegedeelde, reden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel536
  - number: '536.2'
    text: |-
      Gedurende een reis van het schip, waarop de schepeling in dienst is, is een der partijen bevoegd om de
      dienstbetrekking om een dringende reden als bedoeld in het eerste lid, alleen te doen eindigen tegen het tijdstip,
      op hetwelk het schip zich in een haven bevindt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel536
  - number: '537.1'
    text: |-
      Voor de zeewerkgever worden als dringende redenen in de zin van het [voorgaande artikel][ref1] beschouwd de
      volgende daden, eigenschappen of gedragingen van schepeling, welke ten gevolge hebben, dat van de zeewerkgever
      redelijkerwijze niet mag gevergd worden de dienstbetrekking te laten voortduren, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel536
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '536'
        paragraaf: '2'
  - number: 537.1.1°
    text: |-
      indien de schepeling bij de afsluiting van de overeenkomst de zeewerkgever heeft misleid door het vertonen van
      valse of vervalste getuigschriften, of deze opzettelijk valse inlichtingen heeft gegeven, omtrent de wijze waarop
      zijn vorige dienstbetrekking is geëindigd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.2°
    text: |-
      indien hij, in ernstige mate, de bekwaamheid of geschiktheid blijkt te missen tot de arbeid, waarvoor hij zich
      heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.3°
    text: indien hij zich ondanks waarschuwing overgeeft aan dronkenschap of ander liederlijk gedrag;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.4°
    text: |-
      indien hij zich schuldig maakt aan diefstal, verduistering, bedrog of andere misdrijven, waardoor hij het
      vertrouwen van de zeewerkgever onwaardig wordt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.5°
    text: |-
      indien hij opzettelijk, of ondanks waarschuwing roekeloos, zichzelf of anderen aan ernstig gevaar blootstelt of de
      eigendom van de zeewerkgever beschadigt of aan ernstig gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.6°
    text: |-
      indien hij hardnekkig weigert te voldoen aan redelijke bevelen of opdrachten, hem door of namens de zeewerkgever
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.7°
    text: indien hij op andere wijze grovelijk de plichten veronachtzaamt, welke de arbeidsovereenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.8°
    text: indien hij door opzet of roekeloosheid buiten staat geraakt de bedongen arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.9°
    text: |-
      indien hij de kapitein of een opvarende van het schip mishandelt, grovelijk beledigt of op ernstige wijze bedreigt
      of hem verleidt of tracht te verleiden tot handelingen strijdig met de wet of met de goede zeden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.10°
    text: |-
      indien hij, na de aanvang van de dienstbetrekking, zich niet op de door de zeewerkgever aangegeven tijd doet
      monsteren of zich na de monstering aan boord van het schip aanmeldt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.11°
    text: |-
      indien de schepeling hetzij tijdelijk, hetzij voorgoed de bevoegdheid wordt ontnomen, op een schip dienst te doen
      in de hoedanigheid, waarin hij zich heeft verbonden dienst te doen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: 537.1.12°
    text: |-
      indien de schepeling, buiten weten van de zeewerkgever of de kapitein, sterke drank, wapens, smokkelwaren,
      contrabande, opium of andere verdovende middelen aan boord heeft gebracht of daar onder zijn berusting heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: '537.2'
    text: |-
      Bedingen, waardoor aan de zeewerkgever de beslissing zou worden overgelaten, of er een dringende reden aanwezig is,
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel537
  - number: '538.1'
    text: |-
      Voor de schepeling worden als dringende redenen in de zin van [artikel 536][ref1] beschouwd de volgende
      omstandigheden, welke ten gevolge hebben, dat van de schepeling redelijkerwijze niet mag gevergd worden de
      dienstbetrekking te laten voortduren, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel536
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '536'
        paragraaf: '2'
  - number: 538.1.1°
    text: |-
      indien de zeewerkgever de schepeling, diens familieleden of huisgenoten mishandelt, grovelijk beledigt of op
      ernstige wijze bedreigt, of gedoogt, dat dergelijke handelingen door een van zijn huisgenoten of ondergeschikten
      worden gepleegd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.2°
    text: |-
      indien de zeewerkgever de schepeling, diens familieleden of huisgenoten verleidt of tracht te verleiden tot
      handelingen, strijdig met de wet of met de goede zeden, of gedoogt dat dergelijke verleiding of poging tot
      verleiding door een van zijn huisgenoten of ondergeschikten worden gepleegd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.3°
    text: indien het loon niet op de bepaalde tijd wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.4°
    text: |-
      indien de schepeling door ziekte of andere oorzaken zonder zijn toedoen buiten staat geraakt de bedongen arbeid
      te verrichten;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.5°
    text: |-
      indien de zeewerkgever de schepeling orders geeft welke in strijd zijn met de arbeidsovereenkomst of met
      verplichtingen, welke de wet de schepeling oplegt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.6°
    text: |-
      indien de zeewerkgever het schip bestemt naar een haven van een land, dat in een zee-oorlog is gewikkeld, of naar
      een haven welke is geblokkeerd, tenzij de arbeidsovereenkomst dit uitdrukkelijk voorziet en is gesloten na het
      uitbreken van de oorlog of na het afkondigen van de blokkade;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.7°
    text: |-
      indien in het geval van [artikel 466][ref1] de reder orders geeft te vertrekken naar een vijandelijke haven;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel466
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '466'
  - number: 538.1.8°
    text: |-
      indien de zeewerkgever het schip gebruikt of laat gebruiken voor slavenhandel, zeeroof, strafbare kaapvaart of het
      vervoer van goederen waarvan de invoer verboden is in het land van bestemming;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.9°
    text: |-
      indien de zeewerkgever het schip bestemt voor vervoer van contrabande, tenzij de arbeidsovereenkomst dit duidelijk
      voorziet en is gesloten na het uitbreken van de oorlog;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.10°
    text: indien voor hem aan boord gevaar voor mishandeling van de zijde van de kapitein of van een opvarende dreigt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.11°
    text: indien het logies aan boord in een toestand verkeert, welke schadelijk is voor de gezondheid der bemanning;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.12°
    text: |-
      indien hem de voeding, waarop hij recht heeft, niet of niet in deugdelijke toestand wordt verstrekt, of indien de
      zeewerkgever handelt in strijd met het bepaalde bij het [tweede lid van artikel 507][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel507
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '507'
        paragraaf: '2'
  - number: 538.1.13°
    text: indien het schip het recht verliest om de Nederlandse vlag te voeren;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: 538.1.14°
    text: |-
      indien de arbeidsovereenkomst is aangegaan voor één of meer bepaalde reizen en de reder het schip andere reizen
      laat maken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: '538.2'
    text: |-
      Bedingen waardoor aan de schepelingen de beslissing zou worden overgelaten, of er een dringende reden aanwezig is,
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel538
  - number: '539.1'
    text: |-
      Indien een voor bepaalde tijd aangegane dienstbetrekking gedurende een reis van het schip wordt beëindigd zonder
      inachtneming van het daaromtrent bepaalde bij de arbeidsovereenkomst of bij de wet, is een schadeloosstelling
      verschuldigd, gelijk aan het bedrag van het voor de dienst aan boord van een schip in geld vastgestelde loon voor
      de tijd, dat de dienstbetrekking volgens de overeenkomst of volgens de wet had behoren voort te duren, doch niet
      langer dan drie maanden. Hetzelfde geldt wanneer de dienstbetrekking bij de reis is aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel539
  - number: '539.2'
    text: |-
      Bij een dienstbetrekking, voor een onbepaalde tijd aangegaan, is de schadeloosstelling ten minste gelijk aan het
      bedrag van het voor de dienst aan boord van een schip in geld vastgestelde loon voor één maand.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel539
  - number: '540.1'
    text: |-
      Ieder van de partijen is te allen tijde, ook vóórdat de dienstbetrekking is aangevangen, bevoegd zich wegens
      gewichtige redenen te wenden tot de rechter in eerste aanleg, binnen wiens gebied de plaats van haar werkelijk
      verblijf gelegen is, of het schip zich bevindt, of in het Europese deel van Nederland, Aruba, Curaçao of Sint
      Maarten het bevoegde gezag of buiten het Koninkrijk tot de eerst bereikte Nederlandse diplomatieke of bezoldigde
      consulaire ambtenaar, met het verzoek de overeenkomst ontbonden te verklaren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '540.2'
    text: |-
      Als gewichtige redenen worden, behalve de dringende redenen, ook beschouwd veranderingen in de persoonlijke
      of vermogenstoestand van de verzoeker of van de wederpartij of in de omstandigheden, waaronder de arbeid wordt
      verricht welke van dien aard zijn, dat de dienstbetrekking billijkheidshalve dadelijk of na korte tijd behoort
      te eindigen, zomede omstandigheden, na de aanvang van de dienst aan boord aan de verzoeker gebleken of nadien
      opgekomen, waardoor de voortzetting van de reis, welke het schip maakt, hem aan onvoorzien, groot levensgevaar
      zou blootstellen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '540.3'
    text: |-
      Indien het de schepeling mogelijk is een hogere betrekking te verkrijgen, is hij steeds bevoegd het in het eerste
      lid bedoelde te doen, mits hij zorgt voor zijn vervanging zonder nieuwe kosten voor de zeewerkgever en te diens
      genoegen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '540.4'
    text: De rechter willigt het verzoek niet in dan na verhoor of behoorlijke oproeping van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '540.5'
    text: Indien de rechter het verzoek inwilligt, bepaalt hij op welk ogenblik de dienstbetrekking eindigt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '540.6'
    text: Tegen deze beschikking is generlei voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel540
  - number: '541.1'
    text: |-
      Indien de dienstbetrekking is aangegaan bij de reis en tengevolge van een maatregel van hogerhand of van andere
      overmacht de reis niet wordt aangevangen of, nadat zij is aangevangen, wordt gestaakt, neemt de dienstbetrekking
      een einde. De schepeling heeft in het laatstbedoelde geval recht op het naar tijdruimte in geld vastgestelde loon,
      totdat hij in de openbare lichamen Bonaire, Sint Eustatius en Saba kan zijn teruggekomen of totdat hij eerder werk
      heeft gevonden. In geval van geschil wordt het bedrag van het loon vastgesteld door de rechter in eerste aanleg,
      binnen wiens gebied de monsterrol is opgemaakt of de zetel van het scheepsbedrijf is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel541
  - number: '541.2'
    text: |-
      Indien de schepeling zich heeft verbonden om uitsluitend aan boord van een bepaald schip dienst te doen en dit
      schip vergaat, geldt het in het eerste lid bepaalde, ook al is de dienstbetrekking niet bij de reis aangegaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel541
  - number: '542'
    text: |-
      Voor zover het in geld uitgedrukte deel van het loon is vastgesteld bij de reis, heeft de schepeling recht op een
      evenredige verhoging van het loon, indien de reis door toedoen van de zeewerkgever, door molest of door verblijf in
      een noodhaven of een andere soortgelijke reden in het belang van het schip en zaken aan boord wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel542
  - number: '543'
    text: |-
      Indien de dienstbetrekking is aangegaan bij de reis en de reis door toedoen van de zeewerkgever niet wordt
      aangevangen of, nadat zij is aangevangen, wordt gestaakt, neemt de dienstbetrekking een einde. De schepeling heeft
      alsdan het recht op de schadeloosstelling, bepaald in [artikel 539, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel539
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel543
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '539'
        paragraaf: '2'
  - number: '544.1'
    text: |-
      Eindigt de dienstbetrekking buiten de openbare lichamen Bonaire, Sint Eustatius en Saba, dan heeft de schepeling
      recht op vrij vervoer, indien hij Nederlander of Nederlands onderdaan is, tot een haven te zijner keuze in de
      openbare lichamen Bonaire, Sint Eustatius en Saba, indien hij niet Nederlander of Nederlands onderdaan is, ter
      keuze van de zeewerkgever, tot de plaats waar de dienst aan boord van het schip is begonnen of tot een haven van
      het land waar hij thuis behoort, mits de schepeling zijn verlangen daartoe te kennen geeft uiterlijk op de dag
      volgende op die, waarop de dienstbetrekking eindigt, de in [artikel 451][ref1] bedoelde dagen niet medegerekend,
      doch in ieder geval vóór het vertrek van het schip. Echter heeft de schepeling dit recht niet, indien hij de
      dienstbetrekking onrechtmatig doet eindigen of de zeewerkgever haar doet eindigen om een dringende, aan de
      schepeling onverwijld medegedeelde reden, of de arbeidsovereenkomst is ontbonden op verzoek van de schepeling, op
      grond van gewichtige redenen, welke niet tevens zijn dringende redenen in de zin van [artikel 538][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel451
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel538
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel544
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '451'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '538'
        paragraaf: '2'
  - number: '544.2'
    text: |-
      Onder het vrij vervoer zijn begrepen de kosten van onderhoud en nachtverblijf van het eindigen van de
      dienstbetrekking af tot de aankomst van de schepeling in de plaats van zijn bestemming.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel544
  - number: '545'
    text: |-
      De kapitein tekent iedere beëindiging van de dienst aan boord van het schip aan op de monsterrol. Deze aantekening
      wordt, indien de kapitein of de schepeling zulks verzoekt, door de ambtenaar van aanmonstering voor gezien
      getekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel545
  - number: '546.1'
    text: |-
      De zeewerkgever is verplicht om bij het einde van de dienst aan boord aan de schepeling een schriftelijke
      afrekening ter hand te stellen. Indien geschil ontstaat over de afrekening, is de meest gerede partij bevoegd zich
      te wenden tot de rechter in eerste aanleg, binnen wiens rechtsgebied het schip is aangekomen of de monsterrol is
      opgemaakt, met het verzoek de afrekening te onderzoeken en vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel546
  - number: '546.2'
    text: |-
      Eindigt de dienst buiten de openbare lichamen Bonaire, Sint Eustatius en Saba, dan mag ieder van de partijen, ter
      verkrijging van een voorlopige beslissing, zich wenden in het Europese deel van Nederland, Aruba, Curaçao of Sint
      Maarten tot het bevoegde gezag, en buiten het Koninkrijk, tot de Nederlandse diplomatieke of bezoldigde consulaire
      ambtenaar, die hij het eerst heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel546
  - number: '547'
    text: |-
      Na het eindigen van de reis is de schepeling, wiens dienstbetrekking is afgelopen, niettemin gedurende drie
      werkdagen gehouden op verlangen van de kapitein mede te werken tot het opmaken van een scheepsverklaring.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel547
  - number: '548'
    text: |-
      De zeewerkgever verbeurt voor iedere dag, dat hij een officier of een scheepsgezel, gedurende of bij het einde van
      de dienst aan boord van een schip, zonder wettige redenen, ophoudt in het verkrijgen van het in geld vastgestelde
      deel van zijn loon, ten behoeve van de officier drie gulden en ten behoeve van de scheepsgezel een gulden vijftig
      cent.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel548
  - number: '549.1'
    text: |-
      De zeewerkgever is verplicht om aan de schepeling bij het eindigen van de dienstbetrekking op diens verlangen een
      getuigschrift uit te reiken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel549
  - number: '549.2'
    text: |-
      Het getuigschrift moet een juiste opgave bevatten omtrent de aard van de verrichte arbeid en de duur van de
      dienstbetrekking, alsmede, doch alleen op bijzonder verzoek van degene, aan wie het getuigschrift moet worden
      uitgereikt, omtrent de wijze, waarop de schepeling aan zijn verplichtingen heeft voldaan en de wijze, waarop de
      dienstbetrekking geëindigd is; heeft de zeewerkgever de dienstbetrekking echter zonder het aanvoeren van redenen
      doen eindigen, dan is hij slechts gehouden zulks te vermelden, zonder verplicht te zijn de reden zelf mede te
      delen; heeft de schepeling de dienstbetrekking onrechtmatig doen eindigen, dan is de zeewerkgever gerechtigd zulks
      in het getuigschrift te vermelden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel549
  - number: '549.3'
    text: |-
      De zeewerkgever, die weigert het gevraagde getuigschrift af te geven, die in het getuigschrift tegen beter
      weten onjuiste mededelingen opneemt, of die het getuigschrift van een kenmerk voorziet, bestemd om aangaande de
      schepeling enige mededeling te doen, welke niet in de bewoordingen van het getuigschrift is vervat, is zowel jegens
      de schepeling als jegens derden aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel549
  - number: '549.4'
    text: Elk beding, waardoor deze verplichtingen van de zeewerkgever zouden worden uitgesloten of beperkt, is nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel549
  - number: '550.1'
    text: |-
      De schepelingen zijn verplicht om aan het behoud van het schip en de zaken aan boord mede te werken. Zij hebben het
      recht op buitengewone beloning voor de dagen, gedurende welke zij hiertoe werkzaam zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel550
  - number: '550.2'
    text: |-
      In geval van geschil stelt de rechter in eerste aanleg, binnen wiens gebied de werkzaamheden tot behoud hebben
      plaats gehad, de beloning vast. In het Europese deel van Nederland, Aruba, Curaçao of Sint Maarten geschiedt
      de vaststelling door het bevoegde gezag en buiten het Koninkrijk door de Nederlandse diplomatieke of bezoldigde
      consulaire ambtenaar, die het eerst bereikt is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel550
  - number: '551.1'
    text: |-
      Indien een schip, dat tot het verrichten van sleepdienst niet is bestemd, aan een ander in open zee aangetroffen
      schip sleepdienst bewijst onder omstandigheden, welke aanspraak op hulploon uitsluiten, hebben niettemin de
      schepelingen recht op een aandeel in het sleeploon. De reder is verplicht aan iedere schepeling vóór de uitbetaling
      desverlangd het bedrag van het sleeploon en de verdeling daarvan schriftelijk mede te delen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel551
  - number: '551.2'
    text: |-
      In geval van geschil stelt de rechter in eerste aanleg, binnen wiens gebied het schip is aangekomen of de
      monsterrol is opgemaakt, het aandeel van de schepelingen in het sleeploon naar billijkheid vast.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel551
  - number: '552.1'
    text: |-
      In geval van verlies van het schip door schipbreuk, is de zeewerkgever verplicht om aan de schepeling zolang deze
      dientengevolge werkloos is doch ten hoogste gedurende twee maanden een schadeloosstelling te betalen tot een bedrag
      gelijk aan het bij de arbeidsovereenkomst in geld vastgestelde deel van het loon. Is het loon geheel of voor een
      deel niet naar tijdruimte vastgesteld, dan is een bedrag verschuldigd gelijk aan het loon, dat volgens het gebruik
      wegens een reis als die waarop het schip is verloren gegaan, bij vaststelling van het gehele loon naar tijdruimte,
      wordt betaald. In geval van geschil beslist de rechter in eerste aanleg binnen wiens gebied de monsterrol is
      opgemaakt of de zetel van het scheepsbedrijf is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel552
  - number: '552.2'
    text: |-
      Voor zover de schepeling krachtens het bepaalde in [artikel 541][ref1] recht heeft op loon, komt dit loon in
      mindering van de hierbedoelde schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel541
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '541'
        paragraaf: '2'
  - number: '552.3'
    text: |-
      De vordering tot schadeloosstelling is bevoorrecht op alle goederen van de zeewerkgever; het voorrecht staat in
      rang gelijk met dat bedoeld in [artikel 288, onder e, van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel288
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel552
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '288'
  - number: '552.4'
    text: |-
      De zeewerkgever, die vermeent, dat een of meer van de schepelingen ten aanzien van de schipbreuk grove schuld
      treft, is bevoegd om zich te wenden tot de rechter in eerste aanleg met verzoek zijn in het eerste lid bedoelde
      verplichting tegenover bepaalde schepelingen voor een bij zijn beslissing bepaalde en op dezelfde wijze verlengbare
      tijd op te schorten, totdat omtrent de oorzaak van de ramp uitspraak is gedaan. De rechter in eerste aanleg mag
      naar aanleiding van die uitspraak de zeewerkgever voorgoed van zijn verplichting ontheffen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel552
  - number: '553.1'
    text: |-
      De zeewerkgever, die verplicht is tot vrij vervoer van de schepelingen naar een haven, heeft het recht om zich van
      die verplichting te kwijten door hem, mits hij tot werken in staat is, aan boord van een naar die haven bestemd
      schip een betrekking te verschaffen overeenkomstig die, welke hij in dienst van de reder bekleedde.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel553
  - number: '553.2'
    text: |-
      Geschillen over de uitvoering van deze bepaling beslist in het Europese deel van Nederland, Aruba, Curaçao, Sint
      Maarten het bevoegde gezag en buiten het Koninkrijk de Nederlandse diplomatieke of bezoldigde consulaire ambtenaar,
      die het eerst te bereiken is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel553
  - number: '554.1'
    text: |-
      Bij overeenkomst mogen partijen niet afwijken van het bepaalde in de [artikelen 492][ref1], [493][ref2],
      [496][ref3], [497][ref4], [507][ref5], [508][ref6], [512][ref7], [517–520][ref8], [522–527][ref9],
      [529][ref10], [540, eerste en tweede lid][ref11], [546][ref12], [550][ref13] en [551][ref14], noch ook ten
      nadele van schepelingen van het bepaalde in de [artikelen 501][ref15], [515][ref16], [516][ref17], [521][ref18],
      [528][ref19], [531][ref20], [533–535][ref21], [539][ref22], [540, derde lid][ref23], [541–544][ref24],
      [548][ref25], [552][ref26] en [553][ref27].


