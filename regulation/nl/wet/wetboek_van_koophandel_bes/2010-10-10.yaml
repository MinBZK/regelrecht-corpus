        artikel: '430'
  - number: '556.1'
    text: |-
      De monsterrol is een, ten overstaan van de bevoegde ambtenaar opgemaakte, staat van de bemanning van een schip.
      Zij wordt in tweevoud opgemaakt en vermeldt, onverminderd hetgeen elders is voorgeschreven, de naam van het schip,
      de met het schip te maken reis of reizen, de namen van de zeewerkgever, van de kapitein en van de schepelingen, de
      hoedanigheid in welke iedere schepeling aan boord dienst zal doen, wie hunner de rang van officier zullen hebben,
      en hetgeen partijen daarin verder verlangen op te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel556
  - number: '556.2'
    text: Zij wordt door of namens de zeewerkgever, door de kapitein en door de schepelingen ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel556
  - number: '556.3'
    text: |-
      Nietig zijn bepalingen in de monsterrol, welke afwijken van de met een schepeling gesloten arbeidsovereenkomst of
      welke deze aanvullen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel556
  - number: '557.1'
    text: |-
      Bij het opmaken van de monsterrol is de rechter verplicht de met de schepelingen gesloten arbeidsovereenkomst aan
      de ambtenaar van aanmonstering over te leggen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel557
  - number: '557.2'
    text: |-
      De ambtenaar van aanmonstering vergewist zich, dat de schepelingen de inhoud van de arbeidsovereenkomst hebben
      begrepen en dat partijen de overeenkomsten hebben ondertekend. Hij neemt daaromtrent een verklaring in de
      monsterrol op.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel557
  - number: '557.3'
    text: |-
      De ambtenaar voegt gewaarmerkte afschriften van de overeenkomsten als bijlagen bij de monsterrol. Iedere schepeling
      moet aan boord in de gelegenheid worden gesteld van de hem betreffende overeenkomst inzage te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel557
  - number: '558.1'
    text: |-
      De ambtenaren van aanmonstering geven aan ieder, die zich daartoe aanmeldt en aan wie niet reeds eerder een nog
      geldig monsterboekje is afgegeven, een monsterboekje af.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel558
  - number: '558.2'
    text: |-
      Zij kunnen de afgifte van een monsterboekje weigeren, wanneer hij, die zich daartoe aanmeldt, bij rechterlijk
      vonnis, in het Koninkrijk of in het buitenland gewezen, onherroepelijk veroordeeld is geworden wegens het door
      de wetten van het betreffende land strafbaar gestelde, onbevoegd in- of uitvoeren van in die wetten bepaalde
      verdovende middelen en er sinds de dagtekening van vorenbedoeld vonnis geen vijf jaren verstreken zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel558
  - number: '558.3'
    text: Het boekje bevat de nodige gegevens omtrent de persoon van de houder.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel558
  - number: '559.1'
    text: |-
      Onverminderd het bepaalde in het [volgende artikel][ref1] en in andere wetten, laat de ambtenaar van aanmonstering
      alleen hen, die een monsterboekje overleggen, toe om als schepeling een monsterrol te ondertekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel560
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel559
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '560'
        paragraaf: '3'
  - number: '559.2'
    text: |-
      De ambtenaar van aanmonstering vermeldt in het boekje de ondertekening van de monsterrol en de hoedanigheid, waarin
      de schepeling dienst zal doen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel559
  - number: '560.1'
    text: |-
      De schepeling moet met het monsterboekje overleggen een bewijs van gezondheid, niet langer dan een jaar tevoren
      afgegeven door een in de openbare lichamen Bonaire, Sint Eustatius en Saba tot de uitoefening van de geneeskunst
      bevoegde geneeskundige en vaststellende, dat de schepeling niet lichamelijk ongeschikt is tot het verrichten van
      de werkzaamheden aan boord, waartoe hij zich wenst te verbinden, en dat zijn tegenwoordigheid aan boord geen gevaar
      voor de gezondheid van de overige opvarenden oplevert.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel560
  - number: '560.2'
    text: |-
      Indien de monsterrol in het Europese deel van Nederland, Aruba, Curaçao, Sint Maarten door de daartoe bevoegde
      autoriteit wordt opgemaakt, worden de ter plaatse geldende voorschriften gevolgd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel560
  - number: '561.1'
    text: |-
      De ambtenaar van aanmonstering stelt na afloop van de monstering het monsterboekje in handen van de kapitein; deze
      geeft het de schepeling terug bij het einde van de dienst aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
  - number: '561.2'
    text: |-
      De kapitein vermeldt in het boekje de datum waarop en de plaats waar de dienst aan boord van het schip is
      geëindigd. Deze vermelding wordt, indien de kapitein of de schepeling zulks verzoekt, door de ambtenaar van
      aanmonstering voor gezien getekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
  - number: '561.4'
    text: |-
      De Commissie van Onderzoek, als bedoeld in [artikel 26 bis van de Schepenwet][ref1], is bevoegd, op verzoek van
      de zeewerkgever, de Inspecteur voor de Scheepvaart gehoord, het monsterboekje gedurende de tijd van ten hoogste
      één jaar in te houden, ingeval de schepeling de overeenkomst onrechtmatig heeft doen eindigen. De schepeling wordt
      vooraf opgeroepen om te worden gehoord; hij mag ook verschijnen bij een bijzonder gemachtigde of vergezeld van
      een raadsman.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel26bis
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 26bis
  - number: '561.5'
    text: |-
      De ambtenaar van aanmonstering kan het monsterboekje gedurende de tijd van ten hoogste drie jaar inhouden, ingeval
      de schepeling bij rechterlijk vonnis, in het Koninkrijk of in het buitenland gewezen, onherroepelijk veroordeeld
      is geworden wegens het door de wetten van het betreffende land strafbaar gestelde, onbevoegd in- of uitvoeren
      van in die wetten bepaalde verdovende middelen en er sinds de dagtekening van vorenbedoeld vonnis geen vijf jaren
      verstreken zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
  - number: '561.6'
    text: |-
      De officier van Justitie verschaft aan de ambtenaar van aanmonstering inlichtingen omtrent de namen der personen
      die bij rechterlijk vonnis onherroepelijk veroordeeld zijn geworden wegens het onbevoegd in- of uitvoeren van
      verdovende middelen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
  - number: '561.7'
    text: |-
      De bevoegdheid van de zeewerkgever tot het doen van het verzoek vervalt door verloop van één maand na het eindigen
      van de arbeidsovereenkomst in een haven in Bonaire, Sint Eustatius of Saba en van zes maanden na het eindigen van
      die overeenkomst buiten Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel561
  - number: '562'
    text: Het monsterboekje mag het loon niet noemen en gedragsbeoordelingen niet bevatten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel562
  - number: '563.1'
    text: |-
      Indien de schepelingen van mening is, dat de kapitein in zijn monsterboekje onjuiste feiten heeft vermeld, mag hij
      zich daarover beklagen bij de Commissie van Onderzoek, als bedoeld in [artikel 26 bis van de Schepenwet][ref1].
      Deze beslist, de Inspecteur voor de Scheepvaart gehoord, na verhoor of behoorlijke oproeping van de kapitein en
      brengt de door haar nodig geachte verbetering in het boekje aan.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel26bis
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel563
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 26bis
  - number: '563.2'
    text: |-
      Het [laatste lid van artikel 561][ref1] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel561
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel563
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '561'
        paragraaf: '3'
  - number: '564'
    text: |-
      De ambtenaren van aanmonstering houden een register van de te hunnen overstaan opgemaakte monsterrollen alsmede een
      register van de door hen afgegeven monsterboekjes.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel564
  - number: '565'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent alles wat in verband staat met de
      monsterrol en het monsterboekje, daaronder begrepen het wegens de bemoeiingen van de ambtenaar van aanmonstering
      aan de Schatkist verschuldigde en de inrichting en bijhouding van de in het [voorgaande artikel][ref1] bedoelde
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel564
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel565
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '564'
        paragraaf: '3'
  - number: '566.1'
    text: |-
      De bepalingen van de [tweede][ref1] en de [derde paragraaf van deze Titel][ref2] blijven buiten toepassing ten
      aanzien van schepelingen op ten hoogste vijftig kubieke meters bruto-inhoud metende langs de kusten varende
      vaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel566
    references:
      - id: ref1
        bwb_id: BWBR0028278
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028278
        paragraaf: '3'
  - number: '566.2'
    text: |-
      De verplichtingen en rechten van deze schepelingen worden beoordeeld volgens de bepalingen van het Burgerlijk
      Wetboek BES en van andere algemene verordeningen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel566
  - number: '666'
    text: |-
      Voor zover niet anders overeengekomen is op de tijdbevrachting van een schip dat de Nederlandse vlag voert,
      [titel 5, afdeling 2, van Boek 8 van het Burgerlijk Wetboek][ref1] van toepassing, onverschillig waar de
      bevrachting tot stand komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel666
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '2'
  - number: '719'
    text: |-
      Voor zover niet anders is overeengekomen zijn de [artikelen 378][ref1] en
      [484 tot en met 485 van Boek 8 van het Burgerlijk Wetboek BES][ref2] van toepassing indien een reisbevrachting
      in de zin van [artikel 373][ref3] van dat boek betreft hetzij een schip dat de Nederlandse vlag voert, hetzij het
      vervoer van zaken van of naar een haven in Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel484
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel373
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel719
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '378'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '484'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: '373'
  - number: '750'
    text: |-
      [Titel 5, afdeling 3, van Boek 8 van het Burgerlijk Wetboek BES][ref1] is van toepassing op het vervoer van
      personen van havens in Bonaire, Sint Eustatius en Saba. Zij is mede van toepassing op het vervoer naar havens in
      Bonaire, Sint Eustatius en Saba met dien verstande echter, dat bedingen die volgens deze afdeling nietig zijn,
      geldig zijn voor zover zij dit zijn volgens de wet van het land waar de inscheping geschied is.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel750
    references:
      - id: ref1
        bwb_id: BWBR0028753
  - number: '763'
    text: |-
      Voor zover niet anders is overeengekomen is op tijdbevrachting van een schip dat de Nederlandse vlag voert,
      [titel 5, afdeling 3, van Boek 8 van het Burgerlijk Wetboek BES][ref1] van toepassing, onverschillig waar de
      bevrachting tot stand komt.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel763
    references:
      - id: ref1
        bwb_id: BWBR0028753
  - number: '813'
    text: |-
      Behalve de bij [art. 325][ref1] vermelde vereisten moet de polis uitdrukken:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel325
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '325'
  - number: 813.1°
    text: |-
      de naam van de kapitein, die van het schip, met vermelding van het soort, en, bij verzekering van het schip, de
      opgave, of het van vurenhout is, of de verklaring, dat de verzekerde van die omstandigheid onkundig is;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.2°
    text: de plaats, waar de goederen zijn ingeladen of moeten ingeladen worden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.3°
    text: de haven, vanwaar het schip heeft moeten vertrekken, of moet vertrekken;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.4°
    text: de havens of de reden, waar het moet laden of ontladen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.5°
    text: die, waar het moet inlopen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.6°
    text: de plaats, vanwaar het gevaar voor rekening van de verzekeraar begint te lopen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: 813.7°
    text: de waarde van het verzekerde schip;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel813
  - number: '814.1'
    text: |-
      De zeeassurantie heeft in het bijzonder tot onderwerp: het casco en de kiel van het schip, ledig of geladen,
      gewapend of niet, alleen of te zamen met andere varende; het tuig en de takelage; het oorlogstuig; mondbehoeften
      en in het algemeen alles wat het schip, tot het in zee brengen toe, gekost heeft; de ingeladen goederen; verwacht
      wordende winst; de te verdienen vrachtpenningen; het gevaar van de slavernij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel814
  - number: '814.2'
    text: |-
      Bij een verzekering op het schip, zonder verdere aanduiding, wordt daaronder verstaan het casco en de kiel, het
      tuig, de takelage en het oorlogstuig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel814
  - number: '815'
    text: |-
      Verzekering kan gesloten worden op het geheel of op een gedeelte van de voorwerpen, gezamenlijk of afzonderlijk;
      in de tijd van vrede of in de tijd van oorlog, vóór of gedurende de reis van het schip; voor de heen- en terugreis,
      voor een van beide, voor de gehele reis, of voor een bepaalde tijd; voor alle zeegevaren; op goede en kwade
      tijdingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel815
  - number: '816'
    text: |-
      Indien de verzekerde onkundig is, in welk schip verwacht wordende goederen zullen worden geladen, wordt de
      vermelding van de kapitein of van het schip niet vereist, mits bij de polis verklaring worde gedaan van des
      verzekerden onkunde daaromtrent, alsmede opgave van de dagtekening en de ondertekenaar van de laatste advies- of
      orderbrief. Het belang van de verzekerde mag op deze wijze slechts voor een bepaalde tijd verzekerd worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel816
  - number: '817.1'
    text: |-
      Indien de verzekerde onkundig is, waarin de goederen, welke aan hem worden toegezonden of geconsigneerd zijn,
      bestaan, mag hij verzekering op die goederen laten doen onder de algemene benaming van «goederen».
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel817
  - number: '817.2'
    text: |-
      Onder zodanige verzekering zijn niet begrepen gemunt goud en zilver, gouden en zilveren staven, juwelen, paarlen of
      kleinoden en krijgsbehoeften.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel817
  - number: '818'
    text: |-
      Indien de verzekering is gedaan op schepen of goederen, welke, ten tijde van het sluiten van de overeenkomst,
      reeds behouden ter plaatse van hun bestemming waren aangekomen, of op enig belang, waarvan de schade, tegen welke
      verzekerd is, reeds op voorgeschreven tijdstip bestond, zijn op die gevallen toepasselijk de bepalingen van de
      [artikelen 336][ref1] en [337][ref2], indien namelijk bewezen wordt of er vermoeden bestaat, dat de verzekeraar
      van de behouden aankomst, of de verzekerde of diens lasthebber van het aanwezen der schade, bij het sluiten van de
      overeenkomst, heeft kennis gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel336
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel337
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel818
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '336'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '337'
  - number: '819.1'
    text: |-
      Het vermoeden, bij [artikel 337][ref1] vermeld, geldt ten aanzien van de verzekerde niet, indien de verzekering
      is gesloten op goede of kwade tijding, mits in dat geval in de polis worde vermeld het laatste bericht, hetwelk
      de verzekerde ten aanzien van het verzekerde voorwerp heeft bekomen, en, bij een verzekering voor rekening van
      een derde, mits in geval van schade, deugdelijk blijke van de dagtekening van de last, welke de lasthebber tot het
      sluiten van de verzekering bekomen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel337
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel819
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '337'
  - number: '819.2'
    text: |-
      Met dat beding mag de verzekering alleen dan worden vernietigd, indien bewezen wordt, dat de verzekerde of diens
      lasthebber, ten tijde van het sluiten van de overeenkomst, van de geleden schade heeft kennis gedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel819
  - number: '820'
    text: 'Verzekeringen zijn nietig, wanneer zij gesloten zijn:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel820
  - number: 820.1°
    text: op voorwerpen, waarin, volgens de wet niet mag worden handel gedreven, en
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel820
  - number: 820.2°
    text: op schepen, welke worden gebruikt tot vervoer van voorwerpen als sub 1°. worden bedoeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel820
  - number: '821'
    text: |-
      Verzekering op het casco en de kiel van het schip mag gesloten worden voor de volle waarde van het schip met al
      zijn toebehoren, en alle onkosten, tot in zee toe.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel821
  - number: '822.1'
    text: |-
      Verzekering mag gesloten worden op schepen en goederen, welke reeds vertrokken of vervoerd waren van de plaats,
      vanwaar het gevaar voor rekening van de verzekeraar zou beginnen te lopen, mits in de polis worde uitgedrukt hetzij
      het juiste tijdstip van het vertrek van het schip of van het vervoer van om, op de vordering van de goederen,
      hetzij de onwetendheid van de verzekerde te dien opzichte.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel822
  - number: '822.2'
    text: |-
      In allen gevalle moet, op straffe van nietigheid, in de polis worden uitgedrukt de laatste tijding, welke de
      verzekerde van het schip of van de goederen bekomen heeft, en, indien de verzekering voor rekening van een derde
      geschiedt, de dagtekening van de order- of adviesbrief of de uitdrukkelijke vermelding, dat de verzekering, zonder
      lastgeving van de belanghebbende, plaats heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel822
  - number: '823'
    text: |-
      Indien de verzekerde in de polis doet opnemen de bij het [voorgaande artikel][ref1] bedoelde verklaring van
      onwetendheid en het naderhand blijkt, dat de verzekering gedaan is, nadat de schepen vertrokken waren van de
      plaats, vanwaar het gevaar voor rekening van de verzekeraar zou beginnen te lopen, moet, in geval van schade,
      de verzekerde, op de vordering van de verzekeraar, zijn verklaring van onwetendheid voor de rechter met ede
      bevestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel822
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel823
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '822'
        afdeling: Eerste
  - number: '824'
    text: |-
      Indien in de polis noch van het vertrek van het schip, noch van de onwetendheid deswege melding is gemaakt, wordt
      zulks gehouden voor een erkenning dat het schip, bij het afgaan van de laatste post, welke vóór het sluiten van de
      polis is aangekomen, of, indien geregelde posten er niet zijn, bij de laatste bekwame gelegenheid om tijding over
      te brengen, zich nog bevond ter plaatse, vanwaar het moest vertrekken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel824
  - number: '825.1'
    text: |-
      Indien verzekering is gesloten op schepen, welke nog niet op de plaats zijn, vanwaar het gevaar moet beginnen, of
      welke tot het aannemen van de reis of tot het innemen van de lading nog niet gereed zijn, of op goederen, welke
      niet terstond kunnen geladen worden, is de verzekering nietig, ten ware die omstandigheid in de polis vermeld
      zij of daarbij zij opgegeven, dat de verzekerde daarvan niet kennis draagt, met vermelding van de advies- of
      orderbrief, of van de verklaring dat een advies- of orderbrief niet bestaat, mitsgaders in allen gevalle van de
      laatste tijding, welke hij van het schip of van het goed bekomen heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel825
  - number: '825.2'
    text: |-
      De verzekerde en diens lasthebber zijn, in geval van schade, verplicht verzekeraar, hun onwetendheid voor de
      rechter met ede te bevestigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel825
  - number: '826'
    text: |-
      Goederen mogen verzekerd worden voor de volle waarde, welke zij hebben ten tijde en ter plaatse van de verzending,
      met alle onkosten tot aan boord, de premie van verzekering daaronder begrepen, zonder dat men een afzonderlijke
      begroting van ieder voorwerp mag vorderen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel826
  - number: '827'
    text: |-
      De werkelijke waarde van de verzekerde goederen mag verhoogd worden met de vracht, inkomende rechten en andere
      onkosten, welke bij de behouden aankomst noodzakelijk moeten worden betaald, mits daarvan in de polis melding worde
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel827
  - number: '828.1'
    text: |-
      De verhoging bij het [voorgaande artikel][ref1] omschreven is niet geldig, indien en voor zover ten gevolge van
      de omstandigheid dat het verzekerde niet te bestemder plaats aankomt, de betaling van vracht, inkomende rechten en
      andere onkosten geheel of ten dele vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel827
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel828
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '827'
        afdeling: Eerste
  - number: '828.2'
    text: |-
      Maar indien de vracht, volgens overeenkomst met de schipper vóór zijn vertrek gemaakt, heeft moeten vooruit betaald
      worden, blijft de verzekering te dien aanzien stand grijpen; in geval van ramp of schade moet de vooruitbetaling
      bewezen worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel828
  - number: '829.1'
    text: |-
      Verzekering op verwacht wordende winst moet afzonderlijk bij de polis begroot worden, met bijzondere opgave, op
      welke goederen de verzekering wordt gesloten; bij gebreke hiervan is de verzekering nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel829
  - number: '829.2'
    text: |-
      Indien de waarde van het verzekerde in het algemeen is uitgedrukt, met stellige bepaling, dat al hetgeen de waarde
      van de goederen te boven gaat voor verwacht wordende winst zal worden gehouden, is de verzekering geldig voor de
      waarde van de verzekerde voorwerpen; het overschietende wordt echter herleid tot de bewijsbare hoegrootheid van de
      verwacht wordende winst, berekend naar de maatstaf bij de [artikelen 835][ref1] en [836][ref2] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel835
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel836
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel829
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '835'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '836'
        afdeling: Tweede
  - number: '830'
    text: Vrachtpenningen mogen voor hun vol beloop worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel830
  - number: '831'
    text: |-
      Indien het schip vergaat of strandt, wordt de verzekering ingekort, voor zoveel het beloop betreft van hetgeen de
      schipper of de eigenaar van het schip ten gevolge van dat ongeval voor onkosten van de reis minder heeft te betalen
      dan bij behouden aankomst het geval zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel831
  - number: '832.1'
    text: |-
      Verzekering tegen slavernij wordt gesloten tot een bepaalde som, voor welke de persoon, die in slavernij gebracht
      en wiens vrijheid verzekerd is, mag vrijgekocht worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel832
  - number: '832.2'
    text: |-
      Het onderscheid tussen de rantsoenprijs en de verzekerde som komt ten voordele van de verzekeraar; en, ingeval een
      grotere som dan die, bij de overeenkomst bepaald, tot het vrijkopen vereist wordt, volstaat hij met de voldoening
      van de in de polis uitgedrukte som.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel832
  - number: '833'
    text: |-
      De rechter is bevoegd om, indien de volle waarde op de kiel of het casco van een schip verzekerd is, die waarde,
      hoezeer bevorens getaxeerd, bij vonnis, desnoods na bericht van deskundigen, nader te bepalen of te verminderen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel833
  - number: 833.1°
    text: |-
      ingeval het schip bij de polis is getaxeerd naar de inkoopsprijs, of naar hetgeen het van bouwen gekost heeft, en
      het schip, hetzij door ouderdom, hetzij door het afleggen van vele reizen, reeds minder waarde had;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel833
  - number: 833.2°
    text: |-
      ingeval het schip, voor onderscheidene reizen verzekerd zijnde, na een of meer reizen te hebben afgelegd en uit
      dien hoofde vracht te hebben verdiend, vervolgens op een der verzekerde reizen is vergaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel833
  - number: '834'
    text: |-
      Indien de verzekering gedaan is voor de terugreis uit een land, waar handel alleen bij wijze van ruiling plaats
      heeft, wordt de begroting van de waarde van de verzekerde goederen berekend op de voet van hetgeen de in de ruiling
      gegeven goederen gekost hebben, met bijvoeging van de transportkosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel834
  - number: '835'
    text: |-
      Verwacht wordende winst wordt berekend volgens prijscouranten, of, bij gebreke daarvan, volgens een begroting van
      deskundigen, waaruit blijkt van de winst, welke de verzekerde goederen, bij behouden aankomst, na het afleggen van
      een gewone reis, redelijkerwijze, op de plaats van bestemming zouden hebben opgeleverd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel835
  - number: '836'
    text: |-
      Indien uit de prijscouranten of uit een begroting van deskundigen blijkt, dat, bij behouden aankomst, de winst
      minder zou hebben bedragen dan de som, welke de verzekerde bij de polis had opgegeven, volstaat de verzekeraar met
      de betaling van dat mindere. Hij is niets verschuldigd, indien de verzekerde voorwerpen enige winst niet zouden
      hebben opgebracht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel836
  - number: '837.1'
    text: Het bedrag van de vrachtpenningen wordt bewezen door de charter-partij of de cognossementen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel837
  - number: '837.2'
    text: |-
      Bij gebreke van charter-partij en cognossementen, of indien het goederen geldt aan de scheepseigenaars zelf
      toebehorende, wordt het bedrag van de vracht door deskundigen begroot.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel837
  - number: '838'
    text: |-
      Bij verzekering op het schip, begint het gevaar voor de verzekeraar te lopen van het ogenblik, dat de kapitein een
      begin heeft gemaakt met het laden van goederen; of, zo hij alleen in ballast moet vertrekken, zodra hij een begin
      heeft gemaakt met de ballast te laden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel838
  - number: '839'
    text: |-
      In de bij het [voorgaande artikel][ref1] gemelde verzekering eindigt het gevaar voor de verzekeraar eenentwintig
      dagen nadat het verzekerde schip te bestemder plaats is aangekomen, of zoveel eerder als de laatste goederen gelost
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel838
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel839
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '838'
        afdeling: Derde
  - number: '840'
    text: |-
      Bij verzekering van een schip voor een uit- en thuisreis, of voor meer dan één reis, loopt de verzekeraar, zonder
      tussenpozing, het gevaar tot en met de eenentwintigste dag nadat de laatste reis is volbracht, of zovele dagen
      eerder als de laatste goederen gelost zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel840
  - number: '841'
    text: |-
      Goederen verzekerd zijnde, begint het gevaar voor rekening van de verzekeraar te lopen, zodra de goederen zijn
      gebracht op de kade of op de wal, om vandaar ingeladen en vervoerd te worden naar de schepen, waarin zij geladen
      worden; deze verzekering eindigt vijftien dagen nadat het schip te bestemder plaats zal zijn aangekomen, of zoveel
      eerder als de verzekerde goederen aldaar zullen zijn gelost en op de kade of op de wal geplaatst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel841
  - number: '842'
    text: |-
      Bij verzekering op goederen loopt het gevaar onafgebroken voort, ook al is de schipper genoodzaakt geweest in een
      noodhaven in te lopen, aldaar te lossen en te repareren, totdat òf de reis wettig gestaakt, òf door de verzekerde
      bevel tot het niet-weder-inschepen van de goederen gegeven, òf de reis geheel volbracht zij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel842
  - number: '843'
    text: |-
      Indien de kapitein of de verzekerde op goederen door wettige redenen verhinderd wordt binnen de bij
      [artikel 841][ref1] bepaalde tijd te lossen, zonder zich aan vertraging schuldig te maken, loopt het gevaar voor de
      verzekeraar door totdat de goederen gelost zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel841
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel843
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '841'
        afdeling: Derde
  - number: '844.1'
    text: |-
      In een verzekering op te verdienen vrachtpenningen begint de verzekeraar het gevaar te lopen van het ogenblik en
      naarmate dat de vracht-betalende goederen in het schip geladen zijn; zij eindigt vijftien dagen nadat het schip te
      bestemder losplaats is aangekomen, of zoveel eerder als de vracht-betalende goederen zijn gelost.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel844
  - number: '844.2'
    text: |-
      De bepaling van [artikel 843][ref1] is ook ten dezen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel843
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel844
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '843'
        afdeling: Derde
  - number: '845'
    text: |-
      Wanneer de reis gestaakt wordt nadat een verzekeraar heeft begonnen gevaar te lopen, blijft het gevaar in een
      verzekering op goederen lopen vijftien dagen, en in een verzekering op het schip eenentwintig dagen nadat de
      staking van de reis heeft plaats gehad of zoveel korter als de laatste goederen gelost zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel845
  - number: '846'
    text: |-
      De tijd van de aanvraag en van het eindigen van het gevaar op verwacht wordende winst staat gelijk met de daartoe
      voor de verzekering op goederen bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel846
  - number: '847'
    text: |-
      Het staat in alle verzekeringen aan partijen vrij, om bij de polis andere bedingen te maken nopens het beginnen en
      het eindigen van de tijd van het gevaar.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel847
  - number: '848.1'
    text: Bij staking van de reis vóórdat de verzekeraar heeft begonnen enig gevaar te lopen, vervalt de verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel848
  - number: '848.2'
    text: |-
      De premie wordt door de verzekerde ingehouden of door de verzekeraar teruggegeven, in beide gevallen tegen genot
      van een half ten honderd van de verzekerde som, of wel van de halve premie, indien deze minder dan één ten honderd
      mocht belopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel848
  - number: '849.1'
    text: |-
      Indien de reis gestaakt wordt nadat de verzekeraar heeft begonnen gevaar te lopen, doch vóórdat het schip op de
      laatste uitklaringsplaats het anker of de touwen heeft losgemaakt, geniet de verzekeraar één ten honderd van de
      verzekerde som, indien de premie één ten honderd of meer bedraagt; doch, minder bedragende, geniet de verzekeraar
      haar in haar geheel.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel849
  - number: '849.2'
    text: De volle premie is altijd verdiend, indien de verzekerde enige schadevergoeding, hoe ook genaamd, vordert.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel849
  - number: '850'
    text: |-
      Voor rekening van de verzekeraar zijn alle verliezen en schaden, welke aan de verzekerde voorwerpen zijn
      overkomen door storm, onweder, schipbreuk, stranding, het overzeilen, aanzeilen, aanvaren of aandrijven,
      gedwongen verandering van koers, van de reis of van het schip, door het werpen van goederen, door brand, geweld,
      overstroming, neming, kapers, rovers, aanhouding op last van hogerhand, verklaring van oorlog, represailles; alle
      schade veroorzaakt door nalatigheid, verzuim of schelmerij van de kapitein, de scheepsofficieren of de andere
      schepelingen, en, in het algemeen, door alle van buiten aankomende onheilen, hoe ook genaamd, tenzij de verzekeraar
      hetzij bij wet hetzij ingevolge een beding bij de polis, van het lopen van enige van deze gevaren is vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel850
  - number: '851.1'
    text: |-
      Bij verzekering van het schip houdt de verplichting van de verzekeraar op door elke willekeurige verandering van
      koers of van de reis en, bij verzekering op vrachtpenningen, door elke willekeurige verandering van koers of van
      de reis, dan wel door verwisseling van het schip, in beide gevallen door de kapitein uit zich zelf of op last van
      de eigenaars van het schip gedaan; tenzij, ten aanzien van de kapitein, die zulks uit zich zelf heeft gedaan, het
      tegendeel uitdrukkelijk bij de polis ware bedongen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel851
  - number: '851.2'
    text: |-
      Bij een verzekering op goederen geldt hetzelfde, indien de willekeurige verandering van koers, reis of schip heeft
      plaats gehad op last of met uitdrukkelijke of met stilzwijgende toestemming van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel851
  - number: '851.3'
    text: |-
      De reis wordt gerekend veranderd te zijn, zodra de kapitein deze naar een andere bestemming, dan die waarvoor
      verzekerd is, heeft aangevangen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel851
  - number: '852.1'
    text: |-
      De willekeurige verandering van koers bestaat niet in een geringe afwijking, maar is alleen aanwezig indien de
      kapitein, buiten erkende noodzakelijkheid of nuttigheid en zonder voldoende aanleiding in het belang van het schip
      en de lading, een haven, buiten de koers gelegen, aandoet of een andere streek volgt dan die waartoe hij verplicht
      was.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel852
  - number: '852.2'
    text: In geval van geschil hieromtrent beslist de rechter, na verhoor van deskundigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel852
  - number: '853.1'
    text: |-
      In een verzekering op het schip en de vrachtpenningen, is de verzekeraar niet verplicht om de door schelmerij van
      de kapitein veroorzaakte schade te betalen, tenzij bij de polis anders ware bedongen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel853
  - number: '853.2'
    text: |-
      Zodanig beding is echter niet geoorloofd, indien de kapitein de enige eigenaar van het schip is of daarin aandeel
      heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel853
  - number: '854'
    text: |-
      In een verzekering op goederen, toebehorende aan de eigenaars van het schip, waarin zij geladen zijn, zijn de
      verzekeraars mede niet aansprakelijk voor schelmerij van de kapitein, of voor de verliezen of schaden, welke door
      zijn willekeurige verandering van koers, van de reis of van het schip veroorzaakt worden, al ware zulks buiten
      schuld of voorkennis van de verzekerde gedaan, tenzij bij de polis anders ware bedongen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel854
  - number: '855'
    text: |-
      Bij een verzekering op de vrachtpenningen is de verzekeraar niet verantwoordelijk voor de schade, opgekomen
      sedert het ogenblik, dat de kapitein, van al het nodige tot de reis voorzien zijnde, zonder wettige reden in het
      belang van het schip en de lading, de gelegenheid heeft verzuimd om de reis te bevorderen; tenware de verzekeraar
      daartegen uitdrukkelijk mocht hebben verzekerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel855
  - number: '856.1'
    text: |-
      De verzekeraar is, in geval van verzekering van vloeibare waren, als wijn, brandewijn, olie, honing, pek, teer,
      stroop of dergelijke, en van zout of suiker, niet gehouden tot vergoeding van enige schade, veroorzaakt door
      lekkage of smelting, tenzij deze door stoten, schipbreuk of stranden van het schip zijn ontstaan, of wel doordien
      de verzekerde goederen in een noodhaven zijn gelost en herladen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel856
  - number: '856.2'
    text: |-
      Indien er een of meer oorzaken bestaan, uit hoofde van welke de verzekeraar verplicht is de schade, door lekkage
      of smelting veroorzaakt, te betalen, moet daarvan zoveel worden afgetrokken, als soortgelijke goederen, volgens
      oordeel van deskundigen, gewoonlijk verliezen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel856
  - number: '857.1'
    text: |-
      Indien in de bij wet aangewezen gevallen verzekeringen is gedaan onder de algemene benaming van goederen, of
      in welke zaken ook het belang van de verzekerde mocht bestaan, en het gevaar is gelopen op voorwerpen, welke
      lichtelijk aan bederf of vermindering onderhevig zijn, is de verzekeraar niet gehouden tot zodanig beloop in de
      schade daaruit ontstaande, als hetwelk, volgens de bestaande gebruiken, op de plaats van de verzekering, niet door
      de verzekeraars gedragen wordt. Bij verschil bepaalt de rechter dit, na verhoor van deskundigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel857
  - number: '857.2'
    text: |-
      Indien er onder de voorschreven goederen zodanige waren, welke, ter plaatse waar de verzekering is gedaan,
      gewoonlijk niet anders verzekerd worden dan vrij van beschadiging, lekkage of smelting, dan is de verzekeraar van
      die schade bevrijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel857
  - number: '858'
    text: |-
      Indien de goederen van de soort, in het [voorgaande artikel][ref1] gemeld, in de polis met hun namen zijn
      uitgedrukt, zonder enig bijzonder beding, dan is de verzekeraar niet aansprakelijk voor de averij onder de drie
      ten honderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel857
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '857'
        afdeling: Vierde
  - number: '859.1'
    text: |-
      Indien een verzekering is gesloten met het beding «vrij van beschadigdheid», om het even of daarbij al of niet is
      gevoegd, «bij behouden aankomst», is de verzekeraar niet verantwoordelijk voor enige schade, wanneer de verzekerde
      voorwerpen bedorven of beschadigd ter plaatse van hun bestemming zijn aangekomen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel859
  - number: '859.2'
    text: |-
      Dezelfde bepaling is toepasselijk op het geval, dat de voorwerpen onderweg of in een noodhaven, uit hoofde van
      beschadigdheid of uit vrees dat zij zouden bederven of andere goederen aansteken, zijn verkocht geworden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel859
  - number: '859.3'
    text: |-
      Averij-grosse mitsgaders schade door werping, neming, roof of dergelijke, of door het vergaan van het schip
      veroorzaakt, worden niettemin, bij dat beding door de verzekeraar gedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel859
  - number: '860.1'
    text: |-
      In een verzekering onder het beding «vrij van molest», is de verzekeraar bevrijd, zodra het verzekerde voorwerp
      vergaat of bederft door geweld, neming, kaperij, zeeroverij, aanhouding op last van hogerhand, verklaring van
      oorlog en represailles.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel860
  - number: '860.2'
    text: De verzekering vervalt, zodra het verzekerde door het molest wordt opgehouden of van de koers gebracht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel860
  - number: '860.3'
    text: Alles behoudens de verplichting van de verzekeraar om de schade te voldoen, welke vóór het molest is ontstaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel860
  - number: '861.1'
    text: |-
      Indien de verzekerde bij het beding van «vrij van molest» bedongen heeft, dat de verzekeraar, niettegenstaande
      de opbrenging, het gewone gevaar zou blijven lopen, draagt de verzekeraar, zelfs na dit molest, alle gewone
      schaden, welke aan het verzekerde overkomen, totdat het schip is opgebracht en het anker heeft laten vallen, met
      uitzondering echter van de zodanige, welke ongetwijfeld uit het molest dadelijk voortspruiten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel861
  - number: '861.2'
    text: |-
      Bijaldien de oorzaak van het vergaan twijfelachtig is, wordt vermoed, dat het verzekerde door een gewone ramp is
      vergaan, waarvoor de verzekeraar aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel861
  - number: '862'
    text: |-
      Indien een «vrij van molest» verzekerd schip of goed in een haven ligt en vóór zijn vertrek vijandig wordt bezet,
      of indien het wordt aangehouden, wordt zulks met opbrengen gelijkgesteld en houdt het gevaar voor de verzekeraar
      op.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel862
  - number: '863'
    text: |-
      Indien de verzekering voor een bepaalde tijd gedaan is, in voege als bij [artikel 816][ref1] gemeld is, moet de
      verzekerde het bewijs leveren, dat het verzekerde goed in het schip, dat enige ramp geleden heeft of vergaan is,
      binnen de bepaalde tijd geladen is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel816
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '816'
        afdeling: Eerste
  - number: '864'
    text: |-
      Bij schadevergoeding wegens goederen door de kapitein ingekocht of ingeladen, hetzij voor zijn eigen rekening,
      hetzij voor die van het schip, moet het bewijs van de inkoop en een cognossement daarvan, door twee leden van de
      bemanning ondertekend, worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel864
  - number: '865'
    text: |-
      Indien de verzekering bij verdeling plaats heeft ten aanzien van goederen, welke geladen moeten worden in
      onderscheidene aangeduide schepen, met uitdrukking van de som, welke op elk schip verzekerd wordt, en indien de
      gehele lading wordt geladen in één schip of in een minder getal schepen dan in de overeenkomst bepaald was, is de
      verzekeraar niet verder aansprakelijk dan voor de som, welke hij verzekerd heeft op het schip of op de schepen,
      welke de lading hebben ingenomen, niettegenstaande al de genoemde schepen verongelukt zijn; en hij zal desniettemin
      een half ten honderd of minder, volgens de onderscheiding van [artikel 848][ref1], ontvangen van de som, waarvan de
      verzekering bevonden wordt krachteloos te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel848
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel865
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '848'
        afdeling: Vierde
  - number: '866.1'
    text: |-
      De verzekeraar is ontslagen van het verder gevaar en is gerechtigd tot de premie, indien de verzekerde het schip
      zendt naar een meer afgelegen plaats, dan bij de polis genoemd was.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel866
  - number: '866.2'
    text: De verzekering heeft volkomen gevolg, indien de reis verkort is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel866
  - number: '867.1'
    text: |-
      De verzekerde is verplicht aan de verzekeraar, of, indien er meer dan een op dezelfde polis getekend hebben,
      aan de eerste ondertekenaar, onverwijld mede te delen alle tijdingen, welke hij opzichtelijk een aan schip of
      goed overkomen ramp bekomt; hij moet afschriften of uittreksels van de brieven, waarin de tijdingen vervat zijn,
      mededelen aan diegenen van de verzekeraars, die zulks mochten verlangen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel867
  - number: '867.2'
    text: Bij verzuim daarvan is de verzekerde gehouden de schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel867
  - number: '868.1'
    text: |-
      Zolang de verzekerde niet gerechtigd is om het verzekerde aan zijn verzekeraar te abandonneren en dientengevolge
      het niet werkelijk abandonneert, is hij verplicht, bij schipbreuk, stranding, opbrenging of aanhouding, alle
      mogelijke vlijt en gepaste pogingen aan te wenden om het te redden of te doen vrijgeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel868
  - number: '868.2'
    text: |-
      Hij heeft hiertoe een bijzondere volmacht van de verzekeraar niet nodig en is zelfs gerechtigd om van deze te
      vorderen een toereikende som ter bestrijding van de onkosten, welke tot redding of tot reclame moeten worden
      uitgegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel868
  - number: '869'
    text: |-
      De verzekerde, die buiten de openbare lichamen Bonaire, Sint Eustatius en Saba een poging tot redding of tot
      reclame moet laten doen, de last daartoe opgedragen hebbende aan zijn gewone correspondent of aan een ander huis of
      persoon, te goeder naam en faam bekend staande, is voor de lasthebber niet verantwoordelijk doch is gehouden zijn
      rechtsvorderingen tegen hem aan de verzekeraar af te staan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel869
  - number: '870'
    text: |-
      In een verzekering voor onbepaalde rekening, dat is, indien in de polis niet is uitgedrukt, tot welke natie de
      eigenaar van het verzekerde behoort, is de verzekerde mede tot het doen van de reclame verplicht, bijaldien de
      opbrenging of aanhouding is wederrechtelijk, tenware hij bij de polis daarvan zij ontslagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel870
  - number: '871'
    text: |-
      Een vonnis van een vreemde rechter, waarbij schepen of goederen, welke als bepaald onzijdig eigendom zijn
      verzekerd, verklaard worden niet onzijdig eigendom te zijn en daarom zijn prijs verklaard, is niet voldoende om
      de verzekeraar van het betalen van de schade vrij te stellen, bijaldien de verzekerde bewijst, dat het verzekerde
      waarlijk onzijdig eigendom is geweest, en dat hij bij de rechter, die het schip of de goederen heeft prijs
      verklaard, alle middelen aangewend en alle bewijsstukken ingediend heeft, om zodanige prijsverklaring af te weren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel871
  - number: '872'
    text: |-
      Indien verhoging van premie, voor het geval van opkomende oorlog of andere te verwachten gebeurtenissen, bedongen
      is, regelt desnoods de rechter de hoegrootheid van de verhoging, voor zover die niet bij de polis uitgedrukt, na
      verhoor van deskundigen en met inachtneming van het gevaar, de omstandigheden en de bij de polis gemaakte bedingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel872
  - number: '873.1'
    text: |-
      In alle gevallen, in welke òf de verzekerde goederen niet zijn verzonden, òf in mindere hoeveelheid verzonden
      worden, òf bij mistasting te veel is verzekerd, en voorts in het algemeen in de gevallen bij [artikel 348][ref1]
      voorzien, geniet de verzekeraar een half ten honderd van de verzekerde som of de halve premie, en zulks op dezelfde
      grondslag als bij [artikel 848][ref2] is omschreven, tenzij hem bij wet of bij de overeenkomst meer is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel348
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel848
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel873
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '348'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '848'
        afdeling: Vierde
  - number: '873.2'
    text: |-
      Hij, die een verzekering ten behoeve van een ander heeft gesloten, zonder diens naam in de polis te doen vermelden,
      mag de premie niet terugvorderen op grond dat de belanghebbende de verzekerde goederen niet of in mindere
      hoeveelheid heeft afgezonden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel873
  - number: '892'
    text: |-
      De polis moet, behalve de vereisten bij [artikel 325][ref1] vermeld, uitdrukken de naam van de voerman, van de
      kapitein of gezagvoerder, of van de expediteur, die het vervoer op zich heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel325
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel892
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '325'
  - number: '893'
    text: |-
      De verzekeringen, welke tot voorwerp hebben de gevaren van vervoer te land of langs de kusten, worden in het
      algemeen en naar de omstandigheden geregeld door de voorschriften van dit wetboek omtrent de verzekeringen ter zee,
      behoudens de bepalingen in de volgende artikelen voorkomende.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel893
  - number: '894'
    text: |-
      Bij verzekering van goederen begint het gevaar voor rekening van de verzekeraar te lopen, zodra de goederen
      gebracht of besteld zijn aan het voer- of vaartuig, het kantoor, of op zodanige andere plaats, alwaar men gewoon
      is het goed ter verzending te ontvangen, en eindigt, wanneer die goederen ter plaatse van hun bestemming zijn
      aangekomen en aldaar aan de geadresseerde zijn afgegeven of in de macht van de verzekerde of van zijn gemachtigden
      gesteld zijn. moeten vervoerd worden, loopt het gevaar voor rekening van de verzekeraar voort, al ware het ook, dat
      de goederen, tijdens de reis, in andere voer- of vaartuigen worden overgeladen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel894
  - number: '896.1'
    text: |-
      Hetzelfde heeft plaats bij verzekering van goederen, welke langs de kusten moeten vervoerd worden, wanneer die
      goederen in andere vaartuigen worden overgeladen, tenware de verzekering op in een bepaald vaartuig geladen
      goederen mocht gesloten zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel896
  - number: '896.2'
    text: |-
      Zelfs in dit laatste geval loopt het gevaar bij en na overlading van de goederen in andere vaartuigen, voor
      rekening van de verzekeraar door, indien die overlading is geschied ten einde het
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel896
  - number: '897'
    text: |-
      Bij verzekering van goederen, welke te land verzonden worden, is de verzekeraar ook aansprakelijk voor de schade
      en de verliezen, veroorzaakt door schuld of schelmerij van de met de aanneming, het vervoer en de bezorging belaste
      personen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel897
  - number: '898'
    text: |-
      De bepalingen van de vijfde Afdeling van de tiende Titel zijn insgelijks toepasselijk op de in deze Titel vermelde
      verzekeringen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel898
  - number: '899'
    text: |-
      Het staat aan partijen vrij om bij overeenkomst van de bij de [artikelen 894][ref1] en volgende vermelde bepalingen
      af te wijken.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel894
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel899
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '894'
  - number: '900'
    text: |-
      Alle buitengewone onkosten ten dienste van het schip en de goederen gezamenlijk of afzonderlijk
      gemaakt, alle schade, welke aan het schip en aan de goederen overkomt gedurende de tijd, bij de
      [derde Afdeling van de tiende Titel][ref1] ten aanzien van het beginnen en het eindigen van het gevaar bepaald,
      worden als averij gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel900
    references:
      - id: ref1
        bwb_id: BWBR0028278
        afdeling: Derde
  - number: '901'
    text: |-
      Indien tussen partijen niet anders is bedongen, worden de averijen geregeld overeenkomstig de navolgende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel901
  - number: '902.1'
    text: 'Er zijn twee soorten van averijen: averij-grosse of algemene averij, en eenvoudige of bijzondere averij.'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel902
  - number: '902.2'
    text: |-
      De eerste wordt geregeld volgens [titel 6, afdeling 3, van Boek 8 van het Burgerlijk Wetboek BES][ref1]; de laatste
      komt ten laste van het schip of van het goed afzonderlijk hetwelk de schade geleden of de kosten veroorzaakt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel902
    references:
      - id: ref1
        bwb_id: BWBR0028753
  - number: '905'
    text: 'Bijzondere averijen zijn:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.1°
    text: |-
      alle schaden en verliezen aan het schip of aan de lading overkomen door storm, neming, schipbreuk of toevallige
      stranding;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.2°
    text: lonen en kosten van berging;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.3°
    text: |-
      het verlies van en de schade geleden aan kabels, ankers, touwen, zeilen, boegspriet, stengen, raas, boten en
      scheepsgereedschappen, veroorzaakt door storm of ander onheil op zee;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.4°
    text: |-
      reclame-kosten alsmede kosten van onderhoud en gages van de bemanning gedurende de reclame, indien slechts het
      schip of de lading is aangehouden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.5°
    text: |-
      de kosten van bijzondere reparaties van de fustage en de kosten van beredding van de beschadigde goederen, voor
      zover dit een en ander niet het onmiddellijk gevolg is van een ramp, welke tot averij-grosse aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: 905.6°
    text: |-
      de onkosten, vallende op het verder vervoer van de goederen, wanneer, in het geval van
      [artikel 425 van Boek 8 van het Burgerlijk Wetboek BES][ref1], de bevrachtingsovereenkomst is vervallen; en


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel425
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '425'
  - number: 905.7°
    text: |-
      In het algemeen alle schade, verliezen en de gemaakte kosten, die niet zijn averijgrosse maar die zijn geleden door
      of gemaakt ten behoeve van schip alleen of voor de schade alleen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel905
  - number: '906'
    text: |-
      Indien een schip, uit hoofde van steeds bestaande droogten, ondiepten of banken, met zijn volle lading noch van de
      plaats vanwaar het vertrekken moet, noch naar de plaats van zijn bestemming kan gevoerd worden en alzo een gedeelte
      van de lading met lichters aangevoerd of in lichters moet gelost worden, worden zodanige lichterlonen niet als
      averij beschouwd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel906
  - number: '912.1'
    text: |-
      De loods-, sleep- en andere gelden om de havens of rivieren in- of uit te lopen, de tollen en uitgaven bij het
      afvaren en voorbijzeilen, de tonne-, anker-, vuur- en baakgelden en alle andere rechten, welke tot de scheepvaart
      betrekkelijk zijn, zijn geen averijen, maar gewone kosten voor rekening van het schip, tenzij bij het cognossement
      of de charter-partij anders bedongen zij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel912
  - number: '912.2'
    text: |-
      Deze kosten komen slechts ten laste van de verzekeraars indien zij het gevolg zijn van gedurende de reis opgekomen
      onvoorziene en buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel912
  - number: '913.1'
    text: |-
      Om de bijzondere averij te vinden, welke een verzekeraar moet betalen, die de goederen voor alle gevaar verzekerd
      heeft, gelden de volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel913
  - number: '913.2'
    text: |-
      Hetgeen onderweg is geroofd, vermist, of uit hoofde van beschadiging door zeeramp of uit een andere oorzaak
      waartegen verzekerd is, verkocht, wordt begroot volgens de factuurswaarde, of, deze ontbrekende, naar de waarde,
      waarvoor de goederen overeenkomstig de wettelijke voorschriften verzekerd zijn; de verzekeraar betaalt dit bedrag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel913
  - number: '913.3'
    text: |-
      Bij behouden aankomst van het verzekerde goed, wanneer dit geheel of gedeeltelijk beschadigd is, bepalen
      deskundigen, hoeveel de goederen, indien deze gezond waren aangebracht, waard zouden zijn geweest en voorts hoeveel
      zij nu waard zijn; de verzekeraar betaalt zodanig aandeel van de getekende som, als in evenredigheid staat met het
      verschil tussen de beide waarden, benevens de kosten op de begroting van de schade gevallen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel913
  - number: '913.4'
    text: Alles onverminderd de begroting van verwacht wordende winst, indien deze verzekerd is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel913
  - number: '914'
    text: |-
      De verzekeraar is slechts bevoegd om de verzekerde te noodzaken om, ter bepaling van de waarde, de verzekerde
      voorwerpen te verkopen, indien zulks bij de polis werd bedongen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel914
  - number: '915'
    text: |-
      Indien de schade buiten de openbare lichamen Bonaire, Sint Eustatius en Saba moeten worden opgemaakt, worden daarin
      gevolgd de ter plaatse waar de opmaking moet geschieden bestaande wettelijke voorschriften of plaats hebbenden
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel915
  - number: '916.1'
    text: |-
      Indien de verzekerde goederen beschadigd of verminderd in de openbare lichamen Bonaire, Sint Eustatius en Saba
      aangebracht worden en de schade uiterlijk zichtbaar is, moeten de bezichtiging van de goederen en de begroting van
      de schade door deskundigen gedaan worden vóórdat de goederen onder het beheer van de verzekerde zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel916
  - number: '916.2'
    text: |-
      Indien de schade of de vermindering bij de lossing uiterlijk niet zichtbaar is, mag de bezichtiging gedaan
      worden nadat de goederen onder het beheer van de verzekerde zijn gekomen, mits zulks geschiede binnen driemaal
      vierentwintig uren na de lossing; onverminderd hetgeen verder van de ene of de andere zijde tot bewijs nodig zal
      bevonden worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel916
  - number: '917'
    text: |-
      In geval van door zeeramp geleden schade aan een verzekerd schip, draagt de verze-keraar slechts twee derde van
      de herstelkosten, om het even of het herstel al of niet hebbe plaats gehad, en zulks in evenredigheid van het
      verzekerde tot het onverzekerde gedeelte. Een derde blijft voor rekening van de verzekerde, wegens vooronderstelde
      verbetering van oud tot nieuw.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel917
  - number: '918.1'
    text: |-
      Indien het herstel heeft plaats gehad, wordt het bedrag van de kosten bewezen door rekeningen en alle andere
      middelen van bewijs, desnoods door begroting van deskundigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel918
  - number: '918.2'
    text: Ingeval het herstel niet gedaan is, worden de kosten daarvan door deskundigen begroot.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel918
  - number: '919'
    text: |-
      Indien het, desnoods na verhoor van deskundigen, blijkt, dat door het verricht herstel de waarde van het schip met
      meer dan één derde is vermeerderd, betaalt de verzekeraar, in evenredigheid als bij [artikel 917][ref1] is vermeld,
      het volle beloop van de gemaakte kosten, onder aftrek van de door verbetering vermeerderde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel917
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel919
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '917'
        afdeling: Eerste
  - number: '920'
    text: |-
      Indien daarentegen de verzekerde, desnoods na begroting als voren, bewijst, dat het herstel een verbetering of een
      vermeerdering van de waarde van het schip niet heeft teweeggebracht, en wel bepaaldelijk doordien het schip nieuw
      en op zijn eerste reis de schade heeft geleden, of doordien de schade is aangekomen aan nieuwe zeilen of nieuw
      scheepsgereedschap, of wel aan ankers, ijzeren kettingkabels of aan een nieuwe koperen huid, heeft de aftrek van
      één derde niet plaats en is de verzekeraar verplicht het gehele beloop van de herstelkosten, in evenredigheid als
      bij [artikel 917][ref1] is vermeld, te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel917
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel920
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '917'
        afdeling: Eerste
  - number: '921.1'
    text: |-
      Indien de herstelkosten meer dan drie vierde van de waarde van het schip zouden belopen, moet het schip ten aanzien
      van de verzekeraar gehouden worden als afgekeurd; de verzekeraar is alsdan, voor zover abandonnement niet heeft
      plaats gehad, verplicht de som, waarvoor hij verzekerd heeft, aan de verzekerde te betalen, onder korting van de
      waarde van het beschadigde schip of wrak.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel921
  - number: '922.1'
    text: |-
      Ingeval een schip in een noodhaven is aangekomen en vervolgens op enige wijze verloren gaat, is de verzekeraar niet
      verder gehouden dan tot de betaling van de som, welke hij verzekerd heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel922
  - number: '922.2'
    text: |-
      Hetzelfde heeft plaats, wanneer een schip, door onderscheidene herstellingen, meer dan de verzekerde som voor
      herstel heeft uitgegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel922
  - number: '923'
    text: |-
      Onverminderd de bepalingen van de [artikelen 856][ref1], [857][ref2] en [858][ref3], is de verzekeraar niet
      gehouden om enige bijzondere averij te dragen, indien deze, behalve de kosten van bezichtiging, begroting en
      opmaking, minder dan één ten honderd van de waarde van het beschadigde voorwerp beloopt; partijen zijn echter
      bevoegd om ten dezen andere bedingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel856
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel857
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel858
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel923
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '856'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '857'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '858'
        afdeling: Vierde
  - number: '924'
    text: |-
      De verzekeraars zo op het schip als op de vracht en op de lading betalen ieder zoveel wegens averij-grosse, als die
      voorwerpen, voor zover daarop verzekering is gedaan, respectievelijk in de averij-grosse moeten dragen, en zulks in
      evenredigheid van het verzekerde tot het niet-verzekerde gedeelte.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel924
  - number: '925'
    text: |-
      Zodra de algemene en de bijzondere averij geregeld zijn, moeten de schaderekening benevens de daartoe betrekkelijke
      bescheiden aan de verzekeraars overgegeven worden. Dezen zijn verplicht om het door hen verschuldigde binnen zes
      weken daarna te voldoen en zijn na dat tijdsverloop wettelijke interesten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel925
  - number: '949.1'
    text: Door verloop van vijf jaren verjaart elke rechtsvordering voortspruitende uit een polis van verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel949
  - number: '949.2'
    text: Deze verjaring begint te lopen van de dag, waarop de vordering opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel949
  - number: '951'
    text: |-
      Elke aanspraak tegen de verzekeraars wegens aan ingeladen goederen overkomen schade vervalt, indien zij, zonder
      bezichtiging en begroting van die schade, op de wijze bij dit Wetboek voorgeschreven, zijn aangenomen, of, ingeval
      niet uiterlijk van de schade bleek, de bezichtiging en de begroting niet heeft plaats gehad binnen de bij dit
      Wetboek bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel951
  - number: '954'
    text: |-
      Ten aanzien van minder dan twintig kubieke meters bruto-inhoud metende zeeschepen en minder dan twintig kubieke
      meters bruto-inhoud metende langs de kusten varende vaartuigen, gelden de navolgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel954
  - number: '956'
    text: |-
      De voorschriften van de [derde Titel van dit Boek][ref1] zijn op de kapiteins van de schepen en vaartuigen
      hiervoren in [artikel 954][ref2] vermeld, alleen toepasselijk, voor zoveel betreft de bepalingen van de
      [artikelen 436][ref3], [439][ref4], [440][ref5], [441][ref6], [442][ref7], [454][ref8] en 473, behoudens hetgeen
      bij wet deswege is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel954
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel436
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel439
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel440
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel441
      [ref7]: https://wetten.overheid.nl/BWBR0028278#Artikel442
      [ref8]: https://wetten.overheid.nl/BWBR0028278#Artikel454
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel956
    references:
      - id: ref1
        bwb_id: BWBR0028278
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '954'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '436'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '439'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '440'
      - id: ref6
        bwb_id: BWBR0028278
        artikel: '441'
      - id: ref7
        bwb_id: BWBR0028278
        artikel: '442'
      - id: ref8
        bwb_id: BWBR0028278
        artikel: '454'
  - number: '957'
    text: |-
      De voorschriften van de [vierde Titel][ref1], van dit Boek zijn ten dezen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel957
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '958'
    text: |-
      De rechten en verplichtingen van kapiteins, van scheepsofficieren en van andere schepelingen der bij
      [artikel 954][ref1] vermelde schepen en vaartuigen uit arbeidsovereenkomst voortvloeiende, worden geregeld naar de
      overeenkomst, naar de bepalingen van de zevende Titel A van het Burgerlijk Wetboek BES omtrent de overeenkomsten
      tot het verrichten van arbeid en naar andere daaromtrent vastgestelde algemene verordeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel954
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel958
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '954'
  - number: '959'
    text: |-
      De uit bevrachting voortvloeiende rechten en verplichtingen, de tijd van laden en lossen, mitsgaders al hetgeen
      daartoe betrekkelijk is, worden, met betrekking tot de bij [artikel 954][ref1] vermelde schepen en vaartuigen,
      geregeld naar de bepalingen van de [vierde Titel van het eerste Boek][ref2] van dit Wetboek, naar die van het
      Burgerlijk Wetboek BES omtrent huur en verhuur, naar nadere daaromtrent vastgestelde algemene verordeningen en, bij
      ontstentenis van deze, naar de plaatselijke gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel954
      [ref2]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel959
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '954'
      - id: ref2
        bwb_id: BWBR0028278
  - number: '962'
    text: |-
      De voorschriften van de [elfde Titel][ref1] zijn ook op minder dan twintig kubieke meters bruto-inhoud metende
      zeeschepen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel962
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '963'
    text: |-
      De bepalingen van de [artikelen 913–923][ref1] en [925][ref2] zijn ook op de in [artikel 954][ref3] vermelde
      schepen en vaartuigen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel913
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel925
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel954
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '913'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '925'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '954'
  - number: '964'
    text: |-
      Indien, tot behoud van schip of vaartuig en lading, goederen worden geworpen, heeft de omslag plaats op dezelfde
      wijze en naar de regelen, welke dienaangaande ten aanzien van de zeevaart zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel964
  - number: '965.1'
    text: Dezelfde bepaling geldt, indien, tot behoud van schip en lading, goederen in lichters of in boten zijn overgeladen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel965
  - number: '965.2'
    text: |-
      De daartoe vereiste kosten, de aan de goederen overkomen schade en de wegens het gebruik van lichters of van boten
      verschuldigde schadeloosstellingen worden op de voet van het [vorige artikel][ref1] door het principale schip of
      vaartuig en de lading gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel964
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel965
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '964'
  - number: '966'
    text: |-
      De overige bepalingen van de [twaalfde Titel][ref1], alsmede
      [titel 6, afdeling 3, van Boek 8 van het Burgerlijk Wetboek BES][ref2] zijn niet toepasselijk op de in
      [artikel 954][ref3] vermelde schepen en vaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
      [ref2]: https://wetten.overheid.nl/BWBR0028753
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel954
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel966
    references:
      - id: ref1
        bwb_id: BWBR0028278
      - id: ref2
        bwb_id: BWBR0028753
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '954'
  - number: '967'
    text: |-
      De voorschriften van de [dertiende Titel][ref1] gelden behoudens het bepaalde in de
      [vierde Titel van het eerste Boek][ref2] van dit Wetboek, in het algemeen en naar de omstandigheden ook op de in
      [artikel 954][ref3] vermelde schepen en vaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
      [ref2]: https://wetten.overheid.nl/BWBR0028278
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel954
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel967
    references:
      - id: ref1
        bwb_id: BWBR0028278
      - id: ref2
        bwb_id: BWBR0028278
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '954'
  - number: '968.1'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen gesteld in de hierna genoemde onderdelen
      van dit wetboek: van het Eerste Boek: de [vijfde][ref2] en [zesde titel][ref3]; van het Tweede Boek: de
      [derde][ref4] en [vierde titel][ref5], alsmede de [derde afdeling van de tiende titel][ref6]; zij is echter wel van
      toepassing op de termijnen gesteld in de [artikelen 520][ref7] en [561][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0028278
      [ref3]: https://wetten.overheid.nl/BWBR0028278
      [ref4]: https://wetten.overheid.nl/BWBR0028278
      [ref5]: https://wetten.overheid.nl/BWBR0028278
      [ref6]: https://wetten.overheid.nl/BWBR0028278#AfdelingDerde
      [ref7]: https://wetten.overheid.nl/BWBR0028278#Artikel520
      [ref8]: https://wetten.overheid.nl/BWBR0028278#Artikel561
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel968
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0028278
      - id: ref3
        bwb_id: BWBR0028278
      - id: ref4
        bwb_id: BWBR0028278
      - id: ref5
        bwb_id: BWBR0028278
      - id: ref6
        bwb_id: BWBR0028278
        afdeling: Derde
      - id: ref7
        bwb_id: BWBR0028278
        artikel: '520'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0028278
        artikel: '561'
        paragraaf: '3'
  - number: '968.2'
    text: |-
      Onder algemeen erkende feestdagen worden in dit wetboek verstaan de in
      [artikel 3 van de Algemene termijnenwet][ref1] als zodanig genoemde en de bij krachtens dat artikel daarmede
      gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel968
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '968.3'
    text: 'Deze wet wordt aangehaald als: Wetboek van Koophandel BES.'
