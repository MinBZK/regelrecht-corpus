  - number: '247.2'
    text: |-
      Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende de wisselbrief, betaalbaar bij een derde
      of in een andere plaats dan die van het domicilie van de betrokkene ([artikelen 182][ref1] en [201][ref2]), de
      renteclausule ([artikel 183][ref3]), de verschillen in de vermelding met betrekking tot de som, welke moet worden
      betaald ([artikel 184][ref4]), de gevolgen van het plaatsen van een handtekening onder de omstandigheden bedoeld
      in [artikel 185, eerste lid][ref5], die van de handtekening van een persoon, die handelt zonder bevoegdheid of die
      zijn bevoegdheid overschrijdt (artikel 185, tweede lid), en de wisselbrief in blanco ([artikel 187][ref6]).


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel182
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel201
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel183
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel184
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel185
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel187
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '182'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028278
