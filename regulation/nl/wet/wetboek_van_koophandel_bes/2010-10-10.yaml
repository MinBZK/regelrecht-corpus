        bwb_id: BWBR0028278
        artikel: '185'
        afdeling: Eerste
      - id: ref6
        bwb_id: BWBR0028278
        artikel: '187'
        afdeling: Eerste
  - number: '247.3'
    text: |-
      Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende het aval ([artikelen 205–207][ref1]);
      indien overeenkomstig hetgeen is bepaald bij [artikel 206, laatste lid][ref2], het aval niet vermeldt, voor wie het
      is gegeven, wordt het geacht voor rekening van de ondertekenaar van het orderbriefje te zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel205
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel206
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '205'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '206'
        afdeling: Vierde
  - number: '248.1'
    text: De ondertekenaar van een orderbriefje is op dezelfde wijze verbonden als de acceptant van een wisselbrief.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel248
  - number: '248.2'
    text: |-
      De orderbriefjes, betaalbaar zekere tijd na zicht, moeten ter tekening voor «gezien» aan de ondertekenaar
      worden aangeboden binnen de bij [artikel 199, eerste, tweede of derde lid][ref1], vastgestelde termijn. De
      zichttermijn loopt van de dagtekening van het visum, hetwelk door de ondertekenaar op het orderbriefje moet
      worden geplaatst. De weigering van deze zijn visum te plaatsen, moet worden vastgesteld door een protest
      ([artikel 200, tweede lid][ref2]), van welks dagtekening de zichttermijn begint te lopen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel200
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '199'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '200'
        afdeling: Derde
  - number: '249.1'
    text: 'De cheque behelst:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.1°
    text: de benaming «cheque», opgenomen in de tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.2°
    text: de onvoorwaardelijke opdracht tot betaling van een bepaalde som;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.3°
    text: de naam van degene, die betalen moet (betrokkene);
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.4°
    text: de aanwijzing van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.5°
    text: de vermelding van de dagtekening, alsmede van de plaats, waar de cheque is getrokken;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: 249.1.6°
    text: de handtekening van degene, die de cheque uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: '249.2'
    text: |-
      De titel, waarin één der vermeldingen, in het voorgaande lid aangegeven, ontbreekt, geldt niet als cheque,
      behoudens in de hieronder genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: '249.3'
    text: |-
      Bij gebreke van een bijzondere aanwijzing, wordt de plaats, aangegeven naast de naam van de betrokkene, geacht te
      zijn de plaats van betaling. Indien meer plaatsen zijn aangegeven naast de naam van de betrokkene, is de cheque
      betaalbaar in de eerstaangegeven plaats.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: '249.4'
    text: |-
      Bij gebreke van die aanwijzingen of van iedere andere aanwijzing, is de cheque betaalbaar in de plaats, waar het
      hoofdkantoor van de betrokkene is gevestigd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: '249.5'
    text: |-
      De cheque, welke niet de plaats aanwijst, waar zij is getrokken, wordt geacht te zijn ondertekend in de plaats,
      aangegeven naast de naam van de trekker.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel249
  - number: '250.1'
    text: |-
      De cheque moet worden getrokken op een bankier, die fonds onder zich heeft ter beschikking van de trekker, en
      krachtens een uitdrukkelijke of stilzwijgende overeenkomst, volgens welke de trekker het recht heeft per cheque
      over dat fonds te beschikken. In geval van nietinachtneming van die voorschriften blijft de titel echter als cheque
      geldig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel250
  - number: '250.2'
    text: |-
      De cheque mag niet worden geaccepteerd. Een vermelding van acceptatie, op de cheque gesteld, wordt voor niet-
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel250
  - number: '251.1'
    text: |-
      De cheque mag betaalbaar worden gesteld: aan een met name genoemde persoon, met of zonder uitdrukkelijke clausule:
      «aan order»; aan een met name genoemde persoon, met de clausule: «niet aan order», of een soortgelijke clausule;
      aan toonder.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '251.2'
    text: |-
      De cheque, betaalbaar gesteld aan een met name genoemde persoon, met de vermelding: «of aan toonder», of een
      soortgelijke uitdrukking, geldt als cheque aan toonder.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '251.3'
    text: De cheque zonder vermelding van de nemer geldt als cheque aan toonder.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '251.4'
    text: De cheque mag aan de order van de trekker luiden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '251.5'
    text: |-
      De cheque mag worden getrokken voor rekening van een derde. De trekker wordt geacht voor eigen rekening te hebben
      getrokken, indien uit de cheque of uit de adviesbrief niet blijkt, voor wiens rekening zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '251.6'
    text: De cheque mag op de trekker zelf getrokken worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel251
  - number: '252.1'
    text: |-
      Wanneer de trekker op de cheque de vermelding «waarde ter incassering», «ter incasso», «in lastgeving» of enige
      andere vermelding, met zich brengend een blote opdracht tot inning, heeft geplaatst, is de nemer bevoegd alle
      uit de cheque voortvloeiende rechten uit te oefenen, maar hij mag deze niet anders overdragen dan bij wege van
      lastgeving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel252
  - number: '252.2'
    text: |-
      Bij een zodanige cheque kunnen de chequeschuldenaren aan de houder slechts de verweermiddelen tegenwerpen, welke
      aan de trekker zouden kunnen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel252
  - number: '252.3'
    text: |-
      De opdracht, vervat in een incasso-cheque, eindigt niet door de dood of door de latere onbekwaamheid van de
      lastgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel252
  - number: '253'
    text: Een in de cheque opgenomen renteclausule wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel253
  - number: '254.1'
    text: |-
      De cheque mag betaalbaar zijn aan de woonplaats van een derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel254
  - number: '254.2'
    text: |-
      De cheque, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van verschil,
      ten belope van de som, voluit in letters geschreven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel254
  - number: '254.3'
    text: |-
      De cheque, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt, in geval
      van verschil, slechts ten belope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel254
  - number: '255.1'
    text: |-
      Indien de cheque handtekeningen bevat van personen, die onbekwaam zijn zich door middel van een cheque te
      verbinden, valse handtekeningen of handtekeningen van verdichte personen, of handtekeningen, welke, onverschillig
      om welke andere reden de personen, die die handtekeningen hebben geplaatst of in wier naam zulks is geschied,
      niet kunnen verbinden, zijn de verbintenissen van de andere personen, wier handtekeningen op de cheque voorkomen,
      desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel255
  - number: '255.2'
    text: |-
      Ieder, die zijn handtekening op een cheque plaatst als vertegenwoordiger van een persoon, voor wie hij niet de
      bevoegdheid had te handelen, is zelf krachtens de cheque verbonden, en heeft, betaald hebbende, dezelfde rechten,
      als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van de vertegenwoordiger, die zijn
      bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel255
  - number: '256.1'
    text: |-
      De trekker staat in voor de betaling. Elke clausule, waarbij hij deze verplichting uitsluit, wordt voor niet-
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel256
  - number: '256.2'
    text: |-
      Indien een cheque, onvolledig ten tijde der uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, mag de niet-naleving van die overeenkomsten niet worden tegengeworpen aan de houder, die de cheque
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel256
  - number: '256.3'
    text: |-
      De trekker, of degene voor wiens rekening de cheque is getrokken, is verplicht zorg te dragen dat het nodige fonds
      tot betaling op de dag van de aanbieding in handen van de betrokkene zij, zelfs indien de cheque bij een derde is
      betaalbaar gesteld, onverminderd de verplichting van de trekker overeenkomstig het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel256
  - number: '256.4'
    text: |-
      De betrokkene wordt geacht, het nodige fonds in handen te hebben, indien hij bij de aanbieding van de cheque aan de
      trekker of aan degene voor wiens rekening is getrokken, een opeisbare som schuldig is, ten minste gelijkstaande met
      het beloop van de cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel256
  - number: '257.1'
    text: |-
      De cheque, welke betaalbaar is gesteld aan een met name genoemde persoon met of zonder uitdrukkelijke clausule:
      «aan order», mag door middel van endossement worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel257
  - number: '257.2'
    text: |-
      De cheque, welke betaalbaar is gesteld aan een met name genoemde persoon met de clausule: «niet aan order», of een
      soortgelijke clausule, mag slechts worden overgedragen in de vorm en met de gevolgen van een gewone cessie. Een op
      zulk een cheque geplaatst endossement geldt als een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel257
  - number: '257.3'
    text: |-
      Het endossement mag worden gesteld zelfs ten voordele van de trekker of van iedere andere chequeschuldenaar. Deze
      personen zijn bevoegd de cheque opnieuw te endosseren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel257
  - number: '258.1'
    text: Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.2'
    text: Het gedeeltelijke endossement is nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.3'
    text: Eveneens is nietig het endossement van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.4'
    text: Het endossement aan toonder geldt als endossement in blanco.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.5'
    text: |-
      Het endossement aan de betrokkene geldt slechts als kwijting, behoudens wanneer de betrokkene meer kantoren heeft
      en wanneer het endossement is gesteld ten voordele van een ander kantoor dan dat, waarop de cheque is getrokken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.6'
    text: |-
      Het endossement moet gesteld worden op de cheque of op een vastgehecht blad (verlengstuk). Het moet worden
      ondertekend door de endossant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '258.7'
    text: |-
      Het endossement kan de geëndosseerde onvermeld laten, of bestaan uit de enkele handtekening van de endossant
      (endossement in blanco). In het laatste geval moet het endossement om geldig te zijn, op de rugzijde van de cheque
      of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel258
  - number: '259.1'
    text: Door het endossement worden alle uit de cheque voortvloeiende rechten overgedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: '259.2'
    text: 'Indien het endossement in blanco is, is de houder bevoegd om:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: 259.2.1°
    text: het blanco in te vullen, hetzij met zijn eigen naam, hetzij met de naam van een andere persoon;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: 259.2.2°
    text: de cheque wederom in blanco of aan een andere persoon te endosseren;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: 259.2.3°
    text: de cheque aan een derde over te geven, zonder het blanco in te vullen, en zonder haar te endosseren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: '259.3'
    text: Tenzij het tegendeel bedongen is, staat de endossant in voor de betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: '259.4'
    text: |-
      Hij is bevoegd om een nieuw endossement te verbieden; maakt hij van die bevoegdheid gebruik, dan staat hij
      tegenover de personen, aan wie de cheque later is geëndosseerd, niet in voor de betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel259
  - number: '260.1'
    text: |-
      Hij, die een door endossement overdraagbare cheque onder zich heeft, wordt beschouwd als de rechtmatige houder,
      indien hij van zijn recht doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste
      endossement in blanco is gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet-geschreven
      gehouden. Wanneer een endossement in blanco door een ander endossement is gevolgd, wordt de ondertekenaar van dit
      laatste geacht, de cheque door het endossement in blanco verkregen te hebben.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel260
  - number: '260.2'
    text: |-
      Een op een cheque aan toonder voorkomend endossement maakt de endossant verantwoordelijk overeenkomstig de
      bepalingen betreffende het recht van regres; het maakt overigens de titel niet tot een cheque aan order.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel260
  - number: '261'
    text: |-
      Indien iemand, op welke wijze dan ook, het bezit van de cheque heeft verloren, is de houder, in wiens handen de
      cheque zich bevindt, niet verplicht de cheque af te geven, indien hij deze te goeder trouw heeft verkregen en zulks
      onverschillig of het betreft een cheque aan toonder, dan wel een voor endossement vatbare cheque, ten aanzien van
      welke de houder op de wijze in het [eerste lid van artikel 260][ref1] voorzien van zijn recht doet blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel260
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '260'
        afdeling: Tweede
  - number: '262.1'
    text: |-
      Zij, die uit hoofde van de cheque worden aangesproken, mogen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot de trekker of tot vroegere houders, niet aan de houder tegenwerpen, tenzij deze bij de verkrijging
      van de cheque desbewust ten nadele van de schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel262
  - number: '262.2'
    text: |-
      Indien het endossement de vermelding bevat: «waarde ter incassering», «ter incasso», «in lastgeving» of enige
      andere vermelding, met zich brengend een blote opdracht tot inning, mag de houder alle uit de cheque voortvloeiende
      rechten uitoefenen, maar hij mag deze niet anders endosseren dan bij wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel262
  - number: '262.3'
    text: |-
      De chequeschuldenaren mogen in dat geval aan de houder slechts de verweermiddelen tegenwerpen, welke aan de
      endossant zouden mogen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel262
  - number: '262.4'
    text: |-
      De opdracht, vervat in een incasso-endossement, eindigt niet door de dood of door de latere onbekwaamheid van de
      lastgever.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel262
  - number: '263.1'
    text: |-
      Het endossement, na het protest of de daarmede gelijkstaande verklaring, of na het einde van de aanbiedingstermijn
      op de cheque gesteld, heeft slechts de gevolgen van een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel263
  - number: '263.2'
    text: |-
      Behoudens tegenbewijs, wordt het endossement zonder dagtekening geacht te zijn gesteld vóór het protest of de
      daarmede gelijkstaande verklaringen, of vóór het verstrijken van de in het voorgaande lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel263
  - number: '264.1'
    text: |-
      De betaling van de cheque mag zowel voor haar gehele bedrag als voor een gedeelte daarvan door een borgtocht (aval)
      worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel264
  - number: '264.2'
    text: |-
      Deze borgtocht mag door een derde, behalve door de betrokkene, of zelfs door iemand, wiens handtekening op de
      cheque voorkomt, worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel264
  - number: '265.1'
    text: Het aval wordt op de cheque of op een verlengstuk gesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel265
  - number: '265.2'
    text: |-
      Het wordt uitgedrukt door de woorden: «goed voor aval», of door een soortgelijke uitdrukking; het wordt door de
      avalgever ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel265
  - number: '265.3'
    text: |-
      De enkele handtekening van de avalgever, gesteld op de voorzijde van de cheque, geldt als aval, behalve indien de
      handtekening die is van de trekker.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel265
  - number: '265.4'
    text: Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel265
  - number: '265.5'
    text: |-
      In het aval moet worden vermeld, voor wie het is gegeven. Bij gebreke hiervan wordt het geacht voor de trekker te
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel265
  - number: '266.1'
    text: De avalgever is op dezelfde wijze verbonden als degene, voor wie het aval is gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel266
  - number: '266.2'
    text: |-
      Zijn verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek de door hem gewaarborgde
      verbintenis nietig is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel266
  - number: '266.3'
    text: |-
      Door te betalen verkrijgt de avalgever de rechten, welke krachtens de cheque kunnen worden uitgeoefend tegen
      degene, voor wie het aval is gegeven en tegen degenen, die tegenover deze krachtens de cheque verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel266
  - number: '267.1'
    text: De cheque is betaalbaar op zicht. Elke vermelding van het tegendeel wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel267
  - number: '267.2'
    text: |-
      De cheque, welke ter betaling wordt aangeboden vóór de dag, vermeld als datum van uitgifte, is betaalbaar op de dag
      van de aanbieding.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel267
  - number: '268.1'
    text: |-
      De cheque, welke in hetzelfde land uitgegeven en betaalbaar is, moet binnen de termijn van acht dagen ter betaling
      worden aangeboden. Indien echter uit de cheque zelf blijkt, dat zij bestemd is om in een ander land te circuleren,
      wordt deze termijn verlengd, hetzij tot dertig, hetzij tot zeventig dagen, al naar gelang zij bestemd was in
      hetzelfde of in een ander werelddeel te circuleren. Voor de toepassing van de eerste en tweede zin gelden Curaçao,
      Sint Maarten en de openbare lichamen Bonaire, Sint Eustatius en Saba niet als verschillende landen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel268
  - number: '268.2'
    text: |-
      De cheque, uitgegeven in de openbare lichamen Bonaire, Sint Eustatius en Saba en betaalbaar in het Europese deel
      van Nederland, of omgekeerd, moet ter betaling aangeboden worden binnen de tijd van zeventig dagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel268
  - number: '268.3'
    text: |-
      De cheque, welke uitgegeven is in een ander land dan dat, waarzij betaalbaar is, moet worden aangeboden binnen
      een termijn, hetzij van dertig dagen, hetzij van zeventig dagen, naar gelang de plaats van uitgifte en de plaats
      van betaling gelegen zijn in hetzelfde of in een ander werelddeel. De derde volzin van het eerste lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel268
  - number: '268.4'
    text: De bovengenoemde termijnen beginnen te lopen van de dag, op de cheque als datum van uitgifte vermeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel268
  - number: '269'
    text: |-
      De dag van uitgifte van een cheque, getrokken tussen twee plaatsen met verschillende tijdrekening, wordt herleid
      tot de overeenkomstige dag van de tijdrekening van de plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel269
  - number: '270.1'
    text: De aanbieding aan een verrekeningskamer geldt als aanbieding ter betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel270
  - number: '270.2'
    text: |-
      Bij algemene maatregel van bestuur worden de instellingen aangewezen, welke in de zin van deze Titel als
      verrekeningskamers worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel270
  - number: '271.1'
    text: De herroeping van de cheque is slechts van kracht na het einde van de termijn van aanbieding.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel271
  - number: '271.2'
    text: Indien een herroeping niet plaats heeft, is de betrokkene bevoegd zelfs na het einde van die termijn te betalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel271
  - number: '271.3'
    text: |-
      Noch de dood van de trekker, noch zijn na de uitgifte opgekomen onbekwaamheid zijn van invloed op de gevolgen van
      de cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel271
  - number: '272.1'
    text: |-
      Buiten het geval, in het [eerste lid van artikel 287][ref1] vermeld, is de betrokkene, de cheque betalende, bevoegd
      te vorderen, dat hem deze, van behoorlijke kwijting van de houder voorzien, wordt uitgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel287
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '287'
        afdeling: Zevende
  - number: '272.2'
    text: De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel272
  - number: '272.3'
    text: |-
      In geval van gedeeltelijke betaling mag de betrokkene vorderen, dat van die betaling op de cheque melding wordt
      gemaakt en dat hem daarvoor kwijting wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel272
  - number: '272.4'
    text: |-
      De betrokkene, die een door endossement overdraagbare cheque betaalt, is gehouden de regelmatigheid van de reeks
      van endossementen, maar niet de handtekening der endossanten te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel272
  - number: '272.5'
    text: |-
      Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de cheque niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel272
  - number: '273.1'
    text: |-
      Een cheque, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, mag binnen de
      termijn van aanbieding worden betaald in het geld van het land volgens zijn waarde op de dag van betaling. Indien
      de betaling niet heeft plaats gehad bij de aanbieding, is de houder te zijner keuze bevoegd te vorderen, dat de
      chequesom voldaan wordt in het geld van het land volgens de koers, hetzij van de dag van aanbieding, hetzij van de
      dag van betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel273
  - number: '273.2'
    text: |-
      De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker mag echter
      voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in de cheque voorgeschreven koers.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel273
  - number: '273.3'
    text: |-
      Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden in
      een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel273
  - number: '273.4'
    text: |-
      Indien het bedrag van de cheque is aangegeven in geld, hetwelk dezelfde benaming maar een verschillende waarde
      heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling te
      hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel273
  - number: '274.1'
    text: |-
      De trekker of de houder van een cheque is bevoegd deze te kruisen met de in het [volgende artikel][ref1] genoemde
      gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel275
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '275'
        afdeling: Vijfde
  - number: '274.2'
    text: |-
      De kruising geschiedt door het plaatsen van twee evenwijdige lijnen op de voorzijde van de cheque. Zij kan algemeen
      zijn of bijzonder.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel274
  - number: '274.3'
    text: |-
      De kruising is algemeen, indien zij tussen de twee lijnen geen enkele aanwijzing bevat, ofwel de vermelding:
      «bankier», of een soortgelijk woord; zij is bijzonder, indien de naam van een bankier voorkomt tussen de twee
      lijnen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel274
  - number: '274.4'
    text: |-
      De algemene kruising mag worden veranderd in een bijzondere, maar de bijzondere kruising mag niet worden veranderd
      in een algemene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel274
  - number: '274.5'
    text: De doorhaling van de kruising of van de naam van de aangewezen bankier wordt geacht niet te zijn geschied.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel274
  - number: '275.1'
    text: |-
      De betrokkene mag een cheque met algemene kruising slechts betalen aan een bankier of aan een cliënt van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel275
  - number: '275.2'
    text: |-
      De betrokkene mag een cheque met bijzondere kruising slechts betalen aan de aangewezen bankier of, indien deze de
      betrokkene is, slechts aan een van zijn cliënten. Echter is de aangegeven bankier bevoegd de cheque ter incassering
      aan een andere bankier over te dragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel275
  - number: '275.3'
    text: |-
      Een bankier mag een gekruiste cheque slechts in ontvangst nemen van een van zijn cliënten of van een ander bankier.
      Hij mag haar niet innen voor rekening van andere personen dan van deze.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel275
  - number: '275.4'
    text: |-
      De betrokkene mag een cheque, welke meer dan één bijzondere kruising draagt, slechts betalen, indien er niet meer
      dan twee kruisingen zijn, waarvan de éne strekt tot inning door een verrekeningskamer.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel275
  - number: '275.5'
    text: |-
      De betrokkene of de bankier, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot
      beloop van het bedrag van de cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel275
  - number: '276.1'
    text: |-
      De trekker, alsmede de houder van een cheque, kan verbieden, dat deze in baar geld betaald wordt door op de
      voorzijde in schuinse richting te vermelden: «in rekening te brengen», of een soortgelijke uitdrukking op te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel276
  - number: '276.2'
    text: |-
      In dat geval mag de cheque de betrokkene slechts aanleiding geven tot een boeking (rekening-courant, giro of
      schuldvergelijking). De boeking geld als betaling.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel276
  - number: '276.3'
    text: 'De doorhaling van de vermelding: «in rekening te brengen» wordt geacht niet te zijn geschied.'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel276
  - number: '276.4'
    text: |-
      De betrokkene, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot beloop van het
      bedrag van de cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel276
  - number: '277'
    text: |-
      De houder mag zijn recht van regres uitoefenen op de endossanten, de trekker en de andere chequeschuldenaren,
      indien de cheque, tijdig aangeboden, niet wordt betaald en indien de weigering van betaling wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel277
  - number: 277.1°
    text: hetzij door authentieke akte (protest);
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel277
  - number: 277.2°
    text: |-
      hetzij door een verklaring van de betrokkene, gedagtekend en geschreven op de cheque onder vermelding van de dag
      van aanbieding;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel277
  - number: 277.3°
    text: |-
      hetzij door een gedagtekende verklaring van een verrekeningskamer, waarbij vastgesteld wordt, dat de cheque tijdig
      aangeboden en niet betaald is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel277
  - number: '278.1'
    text: |-
      Indien de non-betaling van de cheque door protest of een daarmee gelijkstaande verklaring is vastgesteld, is
      niettemin de trekker, al ware het protest niet intijds gedaan of de met protest gelijkstaande verklaring niet
      intijds afgegeven, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op de dag van de aanbieding het
      nodig fonds tot betaling van de cheque in handen had. Indien het vereiste fonds slechts gedeeltelijk aanwezig was,
      is de trekker voor het ontbrekende gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel278
  - number: '278.2'
    text: |-
      In geval van niet tijdig protest of niet tijdige met protest gelijkstaande verklaring is de trekker, op straffe van
      tot vrijwaring te zijn gehouden, verplicht, aan de houder af te staan en over te dragen de vordering op het fonds,
      dat de betrokkene van hem op de dag van de aanbieding heeft in handen gehad, en zulks tot het beloop van de cheque;
      en hij moet aan de houder, op diens kosten, de nodige bewijzen verschaffen om die vordering te doen gelden. Indien
      de trekker in staat van faillissement is verklaard, zijn de curatoren in zijn boedel tot dezelfde verplichtingen
      gehouden, ten ware dezen mochten verkiezen, de houder als schuldeiser, voor het beloop van de cheque, toe te laten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel278
  - number: '279.1'
    text: |-
      Het protest of de daarmede gelijkstaande verklaring moet worden gedaan vóór het einde van de termijn van
      aanbieding.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel279
  - number: '279.2'
    text: |-
      Indien de aanbieding plaats heeft op de laatste dag van de termijn, mag het protest of de daarmede gelijkstaande
      verklaring op de eerstvolgende werkdag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel279
  - number: '279.3'
    text: |-
      De betaling van een cheque moet gevraagd en het daaropvolgend protest gedaan worden ter woonplaatse van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel279
  - number: '279.4'
    text: |-
      Indien de cheque getrokken is om in een andere aangewezen woonplaats of door een andere aangewezen persoon, hetzij
      op hetzelfde, hetzij op een ander eiland te worden betaald, moet de betaling gevraagd en het protest opgemaakt
      worden ter aangewezen woonplaats of aan de aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel279
  - number: '279.5'
    text: |-
      Wanneer degene, die de cheque moet betalen, geheel onbekend of niet te vinden is, moet het protest gedaan worden
      aan een postkantoor op het eiland waar de ter betaling aangewezen woonplaats is gelegen. Hetzelfde moet plaats
      hebben indien een cheque is getrokken om op een ander eiland te worden betaald dan dat waar de betrokkene woont, en
      de woonplaats waar de betaling moet geschieden niet is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel279
  - number: '280.1'
    text: |-
      Het protest van non-betaling wordt gedaan door een notaris, door de griffier van het gerecht in eerste aanleg, of
      door een deurwaarder, die vergezeld moeten zijn van twee getuigen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: '280.2'
    text: 'Het protest behelst:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: 280.2.1°
    text: een letterlijk afschrift van de cheque, van de endossementen, van het aval en van de adressen daarop gesteld;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: 280.2.2°
    text: |-
      de vermelding dat zij de betaling aan de personen, of ter plaatse in het [voorgaande artikel][ref1] gemeld,
      afgevraagd en niet bekomen hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel279
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '279'
        afdeling: Zesde
  - number: 280.2.3°
    text: de vermelding van de opgegeven reden van non-betaling;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: 280.2.4°
    text: de aanmaning om het protest te tekenen, en de redenen van weigering;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: 280.2.5°
    text: de vermelding, dat hij, notaris, griffier of deurwaarder, wegens die non-betaling heeft geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: '280.3'
    text: |-
      Indien het protest een vermiste cheque betreft, volstaat, in plaats van het bepaalde onder 1°. van het voorgaande
      lid, een zo nauwkeurig mogelijke omschrijving van de inhoud der cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: '280.4'
    text: |-
      De notaris, de griffier of de deurwaarder is verplicht, op straffe van schadevergoeding, afschrift van het protest
      te laten, en hiervan melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een
      bijzonder register, genummerd en gewaarmerkt door de rechter in eerste aanleg van zijn woonplaats, en om wijders,
      zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden te leveren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel280
  - number: '281.1'
    text: |-
      De houder moet van de non-betaling kennisgeven aan zijn endossant en aan de trekker binnen vier werkdagen, volgende
      op de dag van het protest of de daarmede gelijkstaande verklaring en, indien de cheque getrokken is met de clausule
      zonder kosten, volgende op die van de aanbieding. Elke endossant moet binnen de twee werkdagen, volgende op de dag
      van ontvangst van de kennisgeving, de door hem ontvangen kennisgeving aan zijn endossant mededelen, met aanwijzing
      van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zo vervolgens,
      teruggaande tot de trekker. Deze termijnen lopen van de ontvangst van de voorafgaande kennisgeving af.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '281.2'
    text: |-
      Indien overeenkomstig het voorgaande lid een kennisgeving is gedaan door iemand, wiens handtekening op de cheque
      voorkomt, moet gelijke kennisgeving binnen dezelfde termijn aan diens avalgever worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '281.3'
    text: |-
      Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, mag worden volstaan met kennisgeving
      aan de voorafgaande endossant.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '281.4'
    text: |-
      Hij, die een kennisgeving heeft te doen, is bevoegd zulks te doen in iedere vorm, zelfs door enkele terugzending
      van de cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '281.5'
    text: |-
      Hij moet bewijzen, dat hij de kennisgeving binnen de vastgestelde termijn heeft gedaan. Deze termijn wordt gehouden
      te zijn in acht genomen, wanneer een brief, welke de kennisgeving behelst, binnen de genoemde termijn ter post
      is bezorgd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '281.6'
    text: |-
      Hij, die de kennisgeving niet binnen de bovenvermelde termijn doet, stelt zich niet bloot aan verval van
      zijn recht; hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijn nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de chequesom mag te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel281
  - number: '282.1'
    text: |-
      De trekker, een endossant of een avalgever is bevoegd om door de clausule «zonder kosten», «zonder protest», of een
      andere soortgelijke op de cheque gestelde en ondertekende clausule, de houder van het opmaken van een protest of
      een daarmede gelijkstaande verklaring ter uitoefening van zijn recht van regres te ontslaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel282
  - number: '282.2'
    text: |-
      Deze clausule ontslaat de houder niet van de aanbieding van de cheque binnen de voorgeschreven termijnen, noch
      van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming van de termijnen moet worden geleverd door
      degene, die zich daarop tegenover de houder beroept.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel282
  - number: '282.3'
    text: |-
      Heeft de trekker de clausule gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handtekeningen op de
      cheque voorkomen; heeft een endossant of een avalgever haar gesteld, dan heeft zij gevolgen alleen voor deze
      endossant of avalgever. Indien de houder, ondanks de door de trekker gestelde clausule, toch de weigering van
      betaling doet vaststellen door protest of een daarmede gelijkstaande verklaring, zijn de kosten daarvan voor zijn
      rekening. Indien de clausule van een endossant of een avalgever afkomstig is, mogen de kosten van het protest of
      van de daarmede gelijkstaande verklaring, indien een akte van dien aard is opgesteld, op allen, wier handtekeningen
      op de cheque voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel282
  - number: '283.1'
    text: |-
      Allen, die uit hoofde van een cheque verbonden zijn, zijn hoofdelijk jegens de houder verbonden. Bovendien is ook
      de derde, voor wiens rekening de cheque is getrokken en die de waarde daarvoor heeft genoten, jegens de houder
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel283
  - number: '283.2'
    text: |-
      De houder is bevoegd om deze personen, zowel ieder afzonderlijk, als gezamenlijk, aan te spreken, zonder verplicht
      te zijn de volgorde, waarin zij zich hebben verbonden, in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel283
  - number: '283.3'
    text: |-
      Hetzelfde recht komt toe aan ieder, wiens handtekening op de cheque voorkomt en die deze, ter voldoening aan zijn
      regresplicht, heeft betaald.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel283
  - number: '283.4'
    text: |-
      De vordering, ingesteld tegen één der chequeschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden dan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel283
  - number: '284.1'
    text: |-
      De houder van een cheque, waarvan de non-betaling door protest of een daarmede gelijkstaande verklaring is
      vastgesteld, heeft in geen geval enig recht op het fonds, dat de betrokkene van de trekker in handen heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '284.2'
    text: Bij faillissement van de trekker behoren die penningen aan diens boedel.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '284.3'
    text: 'De houder is bevoegd om van degene, tegen wie hij zijn recht van regres uitoefent, te vorderen:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.3.1°
    text: de som van de niet-betaalde cheque;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.3.2°
    text: |-
      de wettelijke interesten, te rekenen van de dag der aanbieding, voor cheques die in de openbare lichamen Bonaire,
      Sint Eustatius en Saba uitgegeven en betaalbaar zijn, en een rente van zes ten honderd, te rekenen van de dag der
      aanbieding, voor alle overige cheques;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.3.3°
    text: |-
      de kosten van protest of van de daarmede gelijkstaande verklaring, die van de gedane kennisgevingen, alsmede de
      andere kosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '284.4'
    text: |-
      Hij, die ter voldoening aan zijn regresplicht de cheque heeft betaald, mag van degenen, die tegenover hem
      regresplichtig zijn, vorderen:
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.4.1°
    text: het gehele bedrag, dat hij betaald heeft;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.4.2°
    text: |-
      de wettelijke interesten, te rekenen van de dag der betaling, voor cheques die in de openbare lichamen Bonaire,
      Sint Eustatius en Saba uitgegeven en betaalbaar zijn, en een rente van zes ten honderd, te rekenen van de dag der
      betaling, voor alle overige cheques;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: 284.4.3°
    text: de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '284.5'
    text: |-
      Iedere chequeschuldenaar, tegen wie het recht van regres wordt of mag worden uitgeoefend, is bevoegd om, tegen
      betaling ter voldoening aan zijn regresplicht, de afgifte te vorderen van de cheque met het protest, of van de
      daarmede gelijkstaande verklaring, alsmede van een voor voldaan getekende rekening.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '284.6'
    text: |-
      Iedere endossant, die ter voldoening aan zijn regresplicht, de cheque heeft betaald, mag zijn endossement en dat
      van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel284
  - number: '285.1'
    text: |-
      Indien de aanbieding van de cheque, het opmaken van het protest, of de daarmede gelijkstaande verklaring, binnen
      de voorgeschreven termijnen wordt verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift of ander geval
      van overmacht), worden deze termijnen verlengd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel285
  - number: '285.2'
    text: |-
      De houder is verplicht van de overmacht onverwijld aan zijn endossant kennis te geven, en deze kennisgeving,
      gedagtekend en ondertekend op de cheque of op een verlengstuk te vermelden; voor het overige zijn de bepalingen van
      [artikel 281][ref1] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel281
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '281'
        afdeling: Zesde
  - number: '285.3'
    text: |-
      Na ophouden van de overmacht moet de houder onverwijld de cheque ter betaling aanbieden, en, indien daartoe
      aanleiding bestaat, de weigering van betaling doen vaststellen door protest of een daarmede gelijkstaande
      verklaring.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel285
  - number: '285.4'
    text: |-
      Indien de overmacht meer dan vijftien dagen aanhoudt, gerekend van de dag, waarop de houder, al ware het vóór het
      einde van de aanbiedingstermijn, van de overmacht aan zijn endossant heeft kennis gegeven, mag het recht van regres
      worden uitgeoefend, zonder dat de aanbieding of het opmaken van protest of de daarmede gelijkstaande verklaring
      nodig zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel285
  - number: '285.5'
    text: |-
      Feiten, welke voor de houder of voor degene, die hij met de aanbieding van de cheque of met het opmaken van het
      protest of de daarmede gelijkstaande verklaring belastte, van zuiver persoonlijke aard zijn, worden niet beschouwd
      als gevallen van overmacht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel285
  - number: '286.1'
    text: |-
      Behoudens de cheques aan toonder, mag elke cheque, uitgegeven in een land en betaalbaar in een ander land of in een
      overzees gebied van hetzelfde land en omgekeerd, of wel uitgegeven en betaalbaar in een zelfde overzees gebied of
      in verschillende overzeese gebieden van hetzelfde land, in meer gelijkluidende exemplaren worden getrokken. Indien
      een cheque in meer exemplaren is getrokken, moeten die exemplaren in de tekst zelf van de titel worden genummerd,
      bij gebreke waarvan elk exemplaar wordt beschouwd als een afzonderlijke cheque.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel286
  - number: '286.2'
    text: |-
      De betaling op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht van de
      andere exemplaren te niet doet.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel286
  - number: '286.3'
    text: |-
      De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, die hun handtekening dragen en die niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel286
  - number: '287.1'
    text: |-
      Degene die een cheque waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek BES][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel49
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '49'
  - number: '287.2'
    text: |-
      Degene die een cheque, waarvan hij houder was, en welke is vervallen, en, zoveel nodig, geprotesteerd, vermist, kan
      met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek BES][ref1] zijn rechten alleen
      tegen de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel49
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel287
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '49'
  - number: '288'
    text: |-
      In geval van verandering van de tekst van een cheque zijn zij, die daarna hun handtekeningen op de cheque geplaatst
      hebben, volgens de veranderde tekst verbonden; zij, die daarvóór hun handtekeningen op de cheque geplaatst hebben,
      zijn verbonden volgens de oorspronkelijke tekst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel288
  - number: '289'
    text: |-
      Behoudens de bepalingen van het [volgende artikel][ref1] gaat schuld uit een cheque te niet door alle middelen van
      schuldbevrijding, bij het Burgerlijk Wetboek BES aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel290
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel289
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '290'
        afdeling: Negende
  - number: '290.1'
    text: |-
      De regresvorderingen van de houder tegen de endossanten, de trekker en de andere chequeschuldenaren verjaren door
      een tijdsverloop van zes maanden, gerekend van het einde van de termijn van aanbieding.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel290
  - number: '290.2'
    text: |-
      De regresvorderingen van de verschillende chequeschuldenaren tegen elkander, die gehouden zijn tot de betaling van
      een cheque, verjaren door een tijdsverloop van zes maanden, gerekend van de dag, waarop de chequeschuldenaar ter
      voldoening aan zijn regresplicht de cheque heeft betaald, of van de dag, waarop hij zelf in rechte is aangesproken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel290
  - number: '290.3'
    text: |-
      De trekker is niet bevoegd om de in het eerste en tweede lid bedoelde verjaring in te roepen, indien of voor zover
      hij geen fonds heeft bezorgd, en evenmin de trekker of de endossanten, die zich ongerechtvaardigd zouden hebben
      verrijkt; alles onverminderd het bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel306
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '306'
  - number: '291.1'
    text: |-
      De stuiting van de verjaring is slechts van kracht tegen degene, ten aanzien van wie de stuitingshandeling heeft
      plaats gehad.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel291
  - number: '291.2'
    text: |-
      Op de in het [vorig artikel][ref1] bedoelde verjaringen is
      [artikel 321, eerste lid, onder a tot en met d, van Boek 3 van het Burgerlijk Wetboek BES][ref2] niet van
      toepassing; in de gevallen bedoeld in artikel 321, eerste lid, onder b en c, van Boek 3 van het Burgerlijk
      Wetboek BES heeft de onbekwame of rechthebbende wiens rechtsvordering is verjaard, verhaal op de wettelijk
      vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel321
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '290'
        afdeling: Negende
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '321'
  - number: '292'
    text: |-
      Met bankiers, genoemd in de voorgaande afdelingen van deze Titel worden gelijkgesteld alle personen of
      instellingen, die in hun werkzaamheid regelmatig gelden ter onmiddellijke beschikking van anderen houden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel292
  - number: '293.1'
    text: De aanbieding en het protest van een cheque kunnen niet plaats hebben dan op een werkdag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel293
  - number: '293.2'
    text: |-
      Wanneer de laatste dag van de termijn, bij algemene verordening gesteld voor het verrichten van handelingen
      nopens de cheque, met name voor de aanbieding en voor het opmaken van het protest of een daarmede gelijkstaande
      verklaring, een wettelijke feestdag is, wordt deze termijn verlengd tot de eerste werkdag, volgende op het einde
      van die termijn. De tussenliggende feestdagen zijn begrepen in de berekening van de termijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel293
  - number: '293.3'
    text: |-
      Als wettelijke feestdag in de zin van deze afdeling worden beschouwd: de zondag; de nieuwjaarsdag; de datum
      vallende na de, in ieder van de openbare lichamen Bonaire, Sint Eustatius en Saba afzonderlijk, gehouden
      Carnavalsoptocht; de Goede Vrijdag; de Christelijke tweede Paasdag; de Hemelvaartsdag; de dag waarop de verjaardag
      van de Koningin officieel wordt gevierd; de dag waarop de dag van de arbeid (1 mei) officieel wordt gevierd; de
      eerste en tweede Kerstdag; de datum 6 september voor wat betreft het openbaar lichaam Bonaire; de datum 16 november
      voor wat betreft het openbaar lichaam Sint Eustatius en de eerste vrijdag in de maand december voor wat betreft het
      openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel293
  - number: '294.1'
    text: |-
      In de termijnen, bij de voorafgaande afdelingen van deze Titel voorzien, is niet begrepen de dag, waarop deze
      termijnen beginnen te lopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel294
  - number: '294.2'
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel294
  - number: '295.1'
    text: Kwitanties en promessen aan toonder moeten de juiste dagtekening van de oorspronkelijke uitgifte bevatten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel295
  - number: '295.2'
    text: |-
      De oorspronkelijke uitgever van kwitanties aan toonder, door een derde betaalbaar, is jegens iedere houder voor de
      voldoening aansprakelijk gedurende tien dagen na de dagtekening, die dag daaronder niet begrepen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel295
  - number: '295.3'
    text: |-
      De verantwoordelijkheid van de oorspronkelijke uitgever blijft echter voortduren, tenzij hij bewees, dat hij,
      gedurende de bij het vorige lid bepaalde tijd, fonds heeft gehad ten belope van het uitgegeven papier bij de
      persoon, op wie dit is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel295
  - number: '295.4'
    text: |-
      De oorspronkelijke uitgever is, op straffe van voortduring van zijn verantwoordelijkheid, verplicht de houder af
      te staan en over te dragen de vordering op het fonds, dat de persoon, op wie het papier is afgegeven van hem ten
      vervaldage heeft in handen gehad, en zulks ten belope van het uitgegeven papier; en hij moet aan de houder, te
      diens koste, de nodige bewijzen verschaffen om die vordering te doen gelden. Indien de oorspronkelijke uitgever in
      staat van faillissement is verklaard, zijn de curatoren in zijn boedel tot dezelfde verplichtingen gehouden, ten
      ware deze mochten verkiezen, de houder als schuldeiser, ten belope van het uitgegeven papier, toe te laten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel295
  - number: '296.1'
    text: |-
      Buiten de oorspronkelijke uitgever, blijft een ieder die het voormeld papier in betaling heeft gegeven, gedurende
      de tijd van drie dagen daarna, de dag van de uitgifte daaronder niet begrepen, aansprakelijk jegens degene, die het
      van hem heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel296
  - number: '296.2'
    text: |-
      De houder van een promesse aan toonder is verplicht voldoening te vorderen binnen de tijd van drie dagen na de dag,
      op welke hij dat papier in betaling heeft genomen, die dag daaronder niet gerekend, en hij moet, bij wanbetaling,
      binnen een gelijke termijn daarna, de promesse ter intrekking aanbieden aan degene die hem dat papier in betaling
      heeft gegeven, alles op verbeurte van zijn verhaal tegen deze, doch onverminderd zijn recht tegen hem die de
      promesse heeft getekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel296
  - number: '296.3'
    text: |-
      Indien in de promesse de dag is uitgedrukt op welke zij betaalbaar is, begint de termijn van drie dagen eerst te
      lopen daags na de uitgedrukte betaaldag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel296
  - number: '297'
    text: |-
      Indien de laatste dag van enige termijn, waaromtrent in deze afdeling enige bepaling voorkomt, invalt op
      een wettelijke feestdag in de zin van het [laatste lid van artikel 293][ref1], blijft de verplichting en de
      verantwoordelijkheid voortduren tot en met de eerste daaropvolgende dag, welke geen wettelijke feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel293
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel297
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '293'
        afdeling: Tiende
  - number: '298.1'
    text: |-
      Alle rechtsvordering tegen de in deze afdeling vermelde uitgevers van papier, of tegen hen, die buiten de
      oorspronkelijke uitgever het papier in betaling hebben gegeven, verjaart door tijdsverloop van zes maanden,
      gerekend van de dag van de oorspronkelijke uitgifte.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel298
  - number: '298.2'
    text: |-
      De in het vorige lid bedoelde verjaring mag niet worden ingeroepen door de uitgever, indien of voor zover hij
      geen fonds heeft bezorgd, noch door de uitgever of door hen, die buiten de oorspronkelijke uitgever het papier
      in betaling hebben gegeven, voor zover ze zich ongerechtvaardigd zouden hebben verrijkt; alles onverminderd het
      bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: '298.3'
    text: |-
      Op de in dit artikel genoemde verjaringen is het [tweede lid van artikel 291][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel291
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '291'
        afdeling: Negende
  - number: '315'
    text: |-
      Assurantie of verzekering is een overeenkomst, bij welke de verzekeraar zich aan de verzekerde, tegen genot van een
      premie, verbindt om hem schadeloos te stellen wegens een verlies, schade of gemis van verwacht voordeel, hetwelk
      hij door een onzeker voorval zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel315
  - number: '316'
    text: |-
      De verzekeringen kunnen, onder andere, ten onderwerp hebben: de gevaren van brand ([artikelen 353–364][ref1]);
      de gevaren, waaraan de voortbrengselen van de landbouw te velde onderhevig zijn ([artikelen 365–367][ref2]);
      het leven van een of meer personen ([artikelen 368–374][ref3]); de gevaren van de zee en die van
      de slavernij ([artikelen 813–891][ref4]); en de gevaren van het vervoer te lande en langs de kusten
      ([artikelen 892–899][ref5]).


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel365
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel368
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel813
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel892
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '353'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '365'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '368'
        afdeling: Derde
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '813'
        afdeling: Eerste
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '892'
  - number: '317'
    text: |-
      Op alle verzekeringen, waarover zo in dit als in het tweede boek wordt gehandeld, zijn toepasselijk de bepalingen
      bij de volgende artikelen vervat.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel317
  - number: '318'
    text: |-
      Tot vergoeding voor schade of verlies uit enig gebrek, eigen bederf of uit de aard en de natuur van de verzekerde
      zaak zelf onmiddellijk voortgesproten, is de verzekeraar slechts gehouden, indien ook daarvoor uitdrukkelijk
      verzekerd werd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel318
  - number: '319'
    text: |-
      Indien hij, die voor zich zelf heeft laten verzekeren, of hij, voor wiens rekening door een ander is verzekerd, ten
      tijde van de verzekering geen belang in het verzekerd voorwerp heeft, is de verzekeraar niet tot schadeloosstelling
      gehouden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel319
  - number: '320'
    text: |-
      Elke verkeerde of onwaarachtige opgave, of elke verzwijging van aan de verzekerde bekende omstandigheden, hoezeer
      te goeder trouw aan diens zijde hebbende plaats gehad, welke van dien aard is, dat de overeenkomst niet, of
      niet onder dezelfde voorwaarden, zou zijn gesloten, indien de verzekeraar van de ware staat van zaken had kennis
      gedragen, maakt de verzekering vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel320
  - number: '321'
    text: |-
      Uitgezonderd in de gevallen bij wet bepaald, mag een tweede verzekering niet gedaan worden voor dezelfde tijd en
      voor hetzelfde gevaar op voorwerpen, welke reeds voor hun volle waarde verzekerd zijn, en zulks op straffe van
      nietigheid van de tweede verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel321
  - number: '322.1'
    text: |-
      Verzekering, welke het beloop van de waarde of het wezenlijk belang te boven gaat, is alleen geldig tot het beloop
      daarvan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel322
  - number: '322.2'
    text: |-
      Indien de volle waarde van het voorwerp niet is verzekerd, is de verzekeraar, in geval van schade, slechts
      verbonden in evenredigheid van het verzekerde tot het niet-verzekerde gedeelte.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel322
  - number: '322.3'
    text: |-
      Het staat echter aan partijen vrij uitdrukkelijk te bedingen, dat, afgezien van de grotere waarde van het verzekerd
      voorwerp, de daaraan overkomen schade tot het vol beloop van de verzekerde som moet worden vergoed.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel322
  - number: '323'
    text: |-
      Afstand bij het aangaan van de verzekering of gedurende haar loop gedaan van hetgeen bij wet tot het wezen van de
      overeenkomst wordt vereist of van hetgeen uitdrukkelijk is verboden, is nietig.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel323
  - number: '324'
    text: De verzekering moet schriftelijk worden aangegaan bij een akte, welke de naam van polis draagt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel324
  - number: '325.1'
    text: 'Alle polissen, met uitzondering van die van levensverzekering, moeten uitdrukken:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.1°
    text: de dag, waarop de verzekering is gesloten;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.2°
    text: de naam van degene, die de verzekering voor eigen rekening of voor die van een derde sluit;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.3°
    text: een genoegzaam duidelijke omschrijving van het verzekerde voorwerp;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.4°
    text: het bedrag van de som, waarvoor verzekerd wordt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.5°
    text: de gevaren, welke de verzekeraar voor zijn rekening neemt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.6°
    text: de tijd, op welke het gevaar voor rekening van de verzekeraar begint te lopen en eindigt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.7°
    text: de premie van verzekering, en
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: 325.1.8°
    text: |-
      in het algemeen, alle omstandigheden, welker kennis van wezenlijk belang voor de verzekeraar kan zijn, en alle
      andere tussen de partijen gemaakte bedingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: '325.2'
    text: De polis moet door iedere verzekeraar worden ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel325
  - number: '326.1'
    text: |-
      De overeenkomst van verzekering bestaat, zodra zij is gesloten; de wederzijdse rechten en verplichtingen van de
      verzekeraar en van de verzekerde nemen van dat ogenblik hun aanvang, zelfs vóórdat de polis is ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel326
  - number: '326.2'
    text: |-
      Het sluiten van de overeenkomst brengt de verplichting van de verzekeraar mede, om de polis binnen de bepaalde tijd
      te tekenen en aan de verzekerde uit te leveren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel326
  - number: '327.1'
    text: |-
      De overeenkomst wordt tegenover de verzekeraar slechts door geschrift bewezen. Indien het geschrift de overeenkomst
      niet volledig omschrijft, kan, zolang de polis niet door de verzekeringnemer als bewijs is aanvaard, bewijs van het
      niet omschreven deel van de overeenkomst en van de wijzigingen daarin met alle middelen worden bijgebracht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel327
  - number: '327.2'
    text: |-
      Op wijzigingen in de overeenkomst, tot stand gekomen nadat de polis als bewijs is aanvaard, is het vorige lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel327
  - number: '328.1'
    text: |-
      Wanneer de verzekering is gesloten, moet de verzekeraar de polis, binnen vierentwintig uren na de aanbieding,
      ondertekenen en uitleveren, tenware bij wet in enig bijzonder geval een langere termijn bepaald zij.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel328
  - number: '328.2'
    text: |-
      Bij nalatigheid hiervan is de verzekeraar ten behoeve van de verzekerde gehouden tot vergoeding van de schade,
      welke uit dat verzuim mocht zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel328
  - number: '329'
    text: |-
      Hij, die, van een ander order ontvangende tot het laten doen van verzekering, deze voor zijn eigen rekening houdt,
      wordt verstaan verzekeraar te zijn op de aan hem opgegeven voorwaarden en bij gebreke van die opgave, op zodanige
      voorwaarden als waarop de verzekering had kunnen worden gesloten ter plaatse, alwaar hij de last had moeten
      uitvoeren, en, indien deze plaats niet is aangeduid, te zijner woonplaats.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel329
  - number: '330'
    text: |-
      Bij overgang van een zaak of een beperkt recht waaraan een zaak is onderworpen, loopt de verzekering van rechtswege
      ten voordele van de nieuwe rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel330
  - number: '331'
    text: |-
      Verzekering mag niet alleen voor eigen rekening, maar ook voor die van een derde worden gesloten, hetzij uit
      kracht van een algemene of van een bijzondere last, hetzij zelfs buiten weten van de belanghebbende, en zulks met
      inachtneming van de volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel331
  - number: '332'
    text: |-
      Bij verzekering ten behoeve van een derde moet uitdrukkelijk in de polis worden vermeld, of zulks uit kracht van
      een lastgeving of buiten weten van de belanghebbende plaats heeft.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel332
  - number: '333'
    text: |-
      De verzekering zonder lastgeving en buiten weten van de belanghebbende gedaan, is nietig, indien en voor zover
      de belanghebbende of een derde op zijn last hetzelfde voorwerp reeds had verzekerd vóór het tijdstip, waarop hij
      kennis droeg van de buiten zijn weten gesloten verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel333
  - number: '334'
    text: |-
      Indien bij de polis niet vermeld is, dat de verzekering voor rekening van een derde is geschied, wordt de
      verzekerde geacht die voor zich zelf te hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel334
  - number: '335'
    text: |-
      De verzekering mag tot voorwerp hebben elk belang, hetwelk op geld waardeerbaar, aan gevaar onderhevig en bij wet
      niet uitgezonderd is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel335
  - number: '336'
    text: |-
      Alle verzekering, gedaan op enig belang hoegenaamd, waarvan de schade, tegen welke verzekerd is, reeds op het
      tijdstip van het sluiten van de overeenkomst bestond, is nietig, indien de verzekerde, of hij die met of zonder
      last heeft doen verzekeren, van het bestaan van de schade heeft kennis gedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel336
  - number: '337.1'
    text: |-
      Het geldt als een vermoeden, dat men van het bestaan van die schade heeft kennis gedragen, indien de rechter, met
      inachtneming van de omstandigheden, oordeelt, dat er sedert het ontstaan van de schade zoveel tijd is verlopen, dat
      de verzekerde daarvan had moeten kennis dragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel337
  - number: '337.2'
    text: |-
      In geval van twijfel staat het de rechter vrij, om aan verzekerden en aan hun lasthebbers de eed op te leggen, dat
      zij, ten tijde van het sluiten van de overeenkomst van het bestaan van de schade niet hebben kennis gedragen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel337
  - number: '337.3'
    text: |-
      Indien de ene partij die eed aan haar wederpartij wenst op te dragen, moet hij in alle gevallen door de rechter
      worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel337
  - number: '338'
    text: De verzekeraar is altijd bevoegd om hetgeen hij verzekerd heeft wederom te laten verzekeren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel338
  - number: '339.1'
    text: |-
      Indien de verzekerde de verzekeraar, bij een gerechtelijke opzegging, van zijn verplichtingen voor het toekomende
      ontslaat, is hij bevoegd om zijn belang voor dezelfde tijd en hetzelfde gevaar andermaal te doen verzekeren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel339
  - number: '339.2'
    text: |-
      In dat geval moet, op straffe van nietigheid, in de nieuwe polis worden melding gemaakt zowel van de vroegere
      verzekering, als van de gerechtelijke opzegging.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel339
  - number: '342'
    text: |-
      De verzekerde zal krachtens een schadevergoeding geen vergoeding ontvangen waardoor hij in een duidelijk
      voordeliger positie zou geraken. De vorige volzin mist toepassing bij voorafgaande taxatie van de waarde van
      een zaak, of een beperkt recht waaraan een zaak is onderworpen, tot stand gekomen krachtens een aan deskundige
      opgedragen beslissing, of krachtens een beslissing van partijen overeenkomstig het advies van een deskundige.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel342
  - number: '343'
    text: |-
      Verliezen of schaden, door eigen schuld van een verzekerde veroorzaakt, komen niet ten laste van de verzekeraar.
      Hij is zelfs bevoegd om de premie te behouden of te vorderen, indien hij reeds begonnen had enig gevaar te lopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel343
  - number: '344.1'
    text: |-
      Indien onderscheidene verzekeringen te goeder trouw ten aanzien van hetzelfde voorwerp zijn aangegaan en bij de
      eerste de volle waarde is verzekerd, houdt deze alléén stand en zijn de volgende verzekeraars ontslagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel344
  - number: '344.2'
    text: |-
      Indien bij de eerste verzekering de volle waarde niet is verzekerd, zijn de volgende verzekeraars aansprakelijk
      voor de grotere waarde volgens de orde des tijds, waarop de volgende verzekeringen zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel344
  - number: '345.1'
    text: |-
      Bijaldien onderscheiden verzekeraars op een en dezelfde polis, al ware het op onderscheiden dagen, meer dan de
      waarde hebben verzekerd, dragen zij allen te zamen naar evenredigheid van de som, voor welke zij getekend hebben,
      alleen de juiste verzekerde waarde.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel345
  - number: '345.2'
    text: |-
      Dezelfde bepaling geldt, wanneer ten zelfden dage ten opzichte van hetzelfde voorwerp onderscheiden verzekeringen
      gesloten zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel345
  - number: '346.1'
    text: |-
      De verzekerde mag, in de gevallen bij de voorgaande twee artikelen vermeld, de oudste verzekeringen niet
      vernietigen om daardoor de latere verzekeraars te verbinden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel346
  - number: '346.2'
    text: |-
      Indien de verzekerde de eerste verzekeraars ontslaat, wordt hij geacht zich, voor dezelfde som en in dezelfde orde,
      in hun plaats als verzekeraar gesteld te hebben.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel346
  - number: '346.3'
    text: Indien hij zich laat herverzekeren, treden de herverzekeraars in dezelfde orde in zijn plaats op.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel346
  - number: '347.1'
    text: |-
      Het wordt niet als een ongeoorloofde overeenkomst beschouwd, indien na de verzekering van een voorwerp voor de
      volle waarde de belanghebbende het vervolgens geheel of gedeeltelijk laat verzekeren, onder de uitdrukkelijke
      bepaling, dat hij zijn recht tegen de verzekeraars alleen mag doen gelden, indien en voor zover hij de schade op de
      vroegere niet zal kunnen verhalen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel347
  - number: '347.2'
    text: |-
      Bij het aangaan van zodanige overeenkomst moeten, op straffe van nietigheid, de vroeger gesloten overeenkomsten
      duidelijk worden omschreven; alsdan zijn de bepalingen van de [artikelen 344][ref1] en [345][ref2] insgelijks
      daarop toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel344
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel345
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '344'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '345'
  - number: '348'
    text: |-
      In alle gevallen, in welke de overeenkomst van verzekering voor het geheel of ten dele vervalt of nietig wordt,
      en mits de verzekerde te goeder trouw hebbe gehandeld, moet de verzekeraar de premie teruggeven hetzij voor het
      geheel, hetzij voor zodanig gedeelte als waarvoor hij geen gevaar heeft gelopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel348
  - number: '349'
    text: |-
      Bijaldien de nietigheid van de overeenkomst uit hoofde van list, bedrog of schelmerij van de verzekerde ontstaat,
      geniet de verzekeraar de premie, onverminderd de vervolging tot straf, zo daartoe gronden zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel349
  - number: '350.1'
    text: |-
      Behoudens de bijzondere bepalingen ten aanzien van deze of gene soort van verzekering gemaakt, is de verzekerde
      verplicht om alle vlijt en naarstigheid in het werk te stellen, ten einde schade te voorkomen of te verminderen;
      hij is voorts verplicht om, dadelijk na haar ontstaan, daarvan aan de verzekeraar kennis te geven; alles op straffe
      van schadevergoeding, zo daartoe gronden zijn.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel350
  - number: '350.2'
    text: |-
      De onkosten, door de verzekerde gemaakt ten einde schade te voorkomen of te verminderen, zijn ten laste van de
      verzekeraar, al ware het dat deze onkosten, gevoegd bij de geleden schade, het beloop van de verzekerde som te
      boven zouden gaan of de aangewende pogingen vruchteloos zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel350
  - number: '351'
    text: |-
      Indien de verzekerde ter zake van door hem geleden schade vorderingen tot schadevergoeding op derden heeft, anders
      dan uit verzekering, gaan die vorderingen bij wijze van subrogatie over op de verzekeraar voor zover deze die
      schade vergoedt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel351
  - number: '353'
    text: |-
      De brandpolis moet, behalve de vereisten bij [artikel 325][ref1] vermeld, uitdrukken:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel325
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '325'
  - number: 353.1°
    text: de ligging en de belending van de verzekerde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
  - number: 353.2°
    text: hun gebruik;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
  - number: 353.3°
    text: de aard en het gebruik van de belendende gebouwen, voor zover zulks invloed op de verzekering kan hebben;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
  - number: 353.4°
    text: de waarde van de verzekerde zaken, en
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
  - number: 353.5°
    text: |-
      de ligging en de belending van de gebouwen en plaatsen waar verzekerde roerende zaken zich bevinden, zijn geborgen
      of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel353
  - number: '356'
    text: |-
      Voor rekening van de verzekeraar zijn alle verliezen en schaden, welke aan de verzekerde voorwerpen zullen
      zijn overkomen door brand, veroorzaakt door onweder of enig ander toeval, eigen vuur, onachtzaamheid, schuld of
      schelmerij van eigen bedienden, buren, vijanden, rovers, en alle anderen hoe ook genaamd, op welke wijze de brand
      ook zou mogen ontstaan, bedacht of onbedacht, gewoon of ongewoon geen uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel356
  - number: '357'
    text: |-
      Met schade, door brand veroorzaakt, wordt gelijk gesteld die, welke als een gevolg van ontstane brand wordt
      aangemerkt, ook wanneer die voortkomt uit brand in een naburig gebouw, als daar zijn bederf of vermindering van het
      verzekerde voorwerp door het water en andere middelen tot stuiting of tot blussing van de brand gebruikt, of het
      vermissen van iets daarvan door dieverij of op enige andere wijze gedurende de brandblussing of beredding, alsmede
      de schade, welke veroorzaakt wordt door de gehele of gedeeltelijke vernieling van het verzekerde, op last van
      hogerhand geschied, ten einde de voortgang van de ontstane brand te stuiten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel357
  - number: '358'
    text: |-
      Met schade, door brand veroorzaakt, wordt eveneens gelijk gesteld die, welke ontstaan is door ontploffing van
      buskruit, door het springen van een stoomketel, door het inslaan van de bliksem of dergelijke, ook al heeft die
      ontploffing, dat springen, of dat inslaan geen brand ten gevolge gehad.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel358
  - number: '359'
    text: |-
      Indien een verzekerd gebouw een andere bestemming verkrijgt en daardoor aan groter brandgevaar komt bloot te staan,
      zodat de verzekeraar, indien zulks vóór de verzekering had bestaan, het òf in het geheel niet, òf niet op dezelfde
      voorwaarden zou hebben verzekerd, houdt zijn verplichting op.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel359
  - number: '360'
    text: |-
      De verzekeraar is ontslagen van de verplichting tot voldoening van de schade, indien hij bewijst, dat de brand door
      merkelijke schuld of nalatigheid van de verzekerde zelf veroorzaakt is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel360
  - number: '361'
    text: De schade wordt berekend naar de waarde, welke de zaken ten tijde van de brand hebben gehad.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel361
  - number: '365'
    text: |-
      Behalve de vereisten bij [artikel 325][ref1] vermeld moet de polis uitdrukken:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel325
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '325'
  - number: 365.1°
    text: de ligging en belending van de landerijen, welker voortbrengselen zijn verzekerd, en
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel365
  - number: 365.2°
    text: haar gebruik.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel365
  - number: '366.1'
    text: De verzekering mag voor een of meer jaren worden gesloten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel366
  - number: '366.2'
    text: Bij gebreke van tijdsbepaling wordt de verzekering verondersteld voor één jaar te zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel366
  - number: '367'
    text: |-
      Bij het opmaken van de schade wordt berekend, hoeveel de vruchten zonder het ontstaan van de ramp ten tijde van
      hun inoogsting of van hun genot zouden zijn waard geweest en hun waarde na de ramp. De verzekeraar betaalt als
      schadevergoeding het verschil.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel367
  - number: '368'
    text: |-
      Het leven van iemand kan ten behoeve van een daarbij belanghebbende verzekerd worden, hetzij voor de ganse duur van
      dat leven, hetzij voor een bij de overeenkomst bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel368
  - number: '369'
    text: |-
      De belanghebbende is bevoegd de verzekering te sluiten zelfs buiten kennis of toestemming van degene, wiens leven
      wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel369
  - number: '370'
    text: 'De polis bevat:'
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.1°
    text: de dag, waarop de verzekering is gesloten;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.2°
    text: de naam van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.3°
    text: de naam van de persoon, wiens leven is verzekerd;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.4°
    text: de tijd, waarop het gevaar voor de verzekeraar begint te lopen en eindigt;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.5°
    text: de som, waarvoor is verzekerd en
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: 370.6°
    text: de premie voor de verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel370
  - number: '371'
    text: |-
      De begroting van de som en de bepaling van de voorwaarden van de verzekering staan geheel aan het goedvinden van
      partijen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel371
  - number: '372'
    text: |-
      Indien de persoon, wiens leven verzekerd is, op het ogenblik van het sluiten van de verzekering, reeds was
      overleden, vervalt de overeenkomst, al had de verzekerde van het overlijden geen kennis kunnen dragen, tenzij
      anders ware bedongen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel372
  - number: '373'
    text: |-
      Indien hij, die zijn leven heeft laten verzekeren, zich van het leven berooft of met de dood wordt gestraft,
      vervalt de verzekering.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel373
  - number: '374'
    text: |-
      Onder deze afdeling zijn niet begrepen weduwefondsen, tontines, maatschappijen van onderlinge levensverzekering en
      andere dergelijke overeenkomsten op levens- en sterftekansen gegrond, waartoe een inleg of een bepaalde bijdrage,
      of beide, gevorderd wordt of worden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel374
  - number: '375.1'
    text: |-
      De betekenis van begrippen voorkomende in [Boek 8 van het Burgerlijk Wetboek BES][ref1], met uitzondering van die
      voorkomende in de [artikelen 5][ref2], [6][ref3] en [10][ref4], geldt evenzeer voor dit wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0028753
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028753#Artikel10
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel375
    references:
      - id: ref1
        bwb_id: BWBR0028753
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028753
        artikel: '10'
  - number: '375.2'
    text: Onder zeewerkgever is te verstaan de eigenaar of, in geval van rompbevrachting, de rompbevrachter.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel375
  - number: '375.3'
    text: |-
      In dit Boek wordt met Nederlandse schepen en schepen die varen onder de Nederlandse vlag gedoeld op schepen waarvan
      de Nederlandse nationaliteit voortvloeit uit de Rijksregelgeving ter zake van de nationaliteit van schepen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel375
  - number: '376'
    text: |-
      In de [eerste tot en met de vierde Titel][ref1] van dit Boek worden onder schepen uitsluitend verstaan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel376
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '377'
    text: |-
      In geval van verkoop uit hoofde van [artikel 175 van Boek 8 van het Burgerlijk Wetboek][ref1] wordt het schip
      geacht de hoedanigheid van Nederlands schip niet te hebben verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel175
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel377
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '175'
  - number: '404'
    text: |-
      Indien de gerechtelijke verdeling van de opbrengst van een vreemd schip in de openbare lichamen Bonaire, Sint
      Eustatius en Saba plaats heeft, worden de kosten van uitwinning, het hulploon, de loods- en havengelden en
      andere scheepvaartrechten in ieder geval geplaatst in de rang, hun door de [artikelen 210][ref1], [211][ref2],
      [213][ref3][217][ref4] en [218 van Boek 8 van het Burgerlijk Wetboek BES][ref5] toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028753#Artikel210
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel211
      [ref3]: https://wetten.overheid.nl/BWBR0028753#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0028753#Artikel217
      [ref5]: https://wetten.overheid.nl/BWBR0028753#Artikel218
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel404
    references:
      - id: ref1
        bwb_id: BWBR0028753
        artikel: '210'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '211'
      - id: ref3
        bwb_id: BWBR0028753
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0028753
        artikel: '217'
      - id: ref5
        bwb_id: BWBR0028753
        artikel: '218'
  - number: '405'
    text: |-
      Op ten minste twintig kubieke meters bruto-inhoud metende, langs de kusten varende vaartuigen, zijn de bepalingen
      van deze Titel van toepassing.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel405
  - number: '407'
    text: |-
      [Artikel 404][ref1] is niet van toepassing op aan de Staat of aan een van de openbare lichamen Bonaire, Sint
      Eustatius en Saba toebehorende schepen, welke tot de openbare dienst zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel404
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel407
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '404'
  - number: '436.1'
    text: |-
      De kapitein voert het schip. De gehele bemanning is hem ondergeschikt. Hij oefent aan boord over alle opvarenden
      gezag. Dezen zijn gehouden de bevelen na te komen, welke de kapitein geeft in het belang van de veiligheid of tot
      handhaving van orde en tucht.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel436
  - number: '436.2'
    text: Onder opvarenden worden in deze Titel verstaan allen, die zich aan boord bevinden, buiten de kapitein.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel436
  - number: '437.1'
    text: Op Nederlandse schepen mogen alleen Nederlanders of Nederlandse onderdanen als kapitein in dienst worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel437
  - number: '437.2'
    text: |-
      Onze minister van Verkeer en Waterstaat is bevoegd om al dan niet voor een bepaalde tijd, ten aanzien van met name
      genoemde personen, of met name vermelde Nederlandse schepen dispensatie van het in het eerste lid bedoelde verbod
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel437
  - number: '438'
    text: |-
      In geval van ontstentenis van de kapitein treedt als zodanig op de eerste stuurman; in geval ook van diens
      ontstentenis, indien aan boord aanwezig zijn één of meer stuurlieden, bevoegd als kapitein op te treden, de oudste
      in rang, vervolgens van de overige stuurlieden de oudste in rang, en bij ontstentenis ook van dezen de door een
      scheepsraad aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel438
  - number: '439'
    text: |-
      De kapitein is verplicht met zodanige bekwaamheid en nauwgezetheid en met zodanig beleid te handelen als voor een
      behoorlijke vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel439
  - number: '440.1'
    text: |-
      De kapitein is verplicht de gebruikelijke regels en de bestaande voorschriften ter verzekering van de
      zeewaardigheid en de veiligheid van het schip, van de veiligheid van de opvarenden en der zaken aan boord met
      nauwgezetheid op te volgen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel440
  - number: '440.2'
    text: |-
      Hij onderneemt de reis niet, tenzij het schip tot het volvoeren daarvan geschikt, naar behoren uitgerust en
      voldoende bemand is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel440
  - number: '441'
    text: |-
      De kapitein is verplicht om overal waar een wettelijk voorschrift, de gewoonte of de voorzichtigheid dit gebiedt,
      zich van een loods te bedienen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel441
  - number: '442'
    text: |-
      De kapitein mag gedurende de vaart of bij dreigend gevaar het schip niet verlaten, tenzij zijn afwezigheid
      volstrekt noodzakelijk is of de zorg voor lijfsbehoud hem daartoe dwingt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel442
  - number: '443'
    text: |-
      De kapitein is verplicht voor de aan boord zijnde goederen van een gedurende de reis overleden opvarende te zorgen
      en ten overstaan van twee der opvarenden daarvan een behoorlijke beschrijving te maken of te doen maken, welke hij
      met deze opvarenden ondertekent.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel443
  - number: '444.1'
    text: |-
      De kapitein moet aan boord voorzien zijn van: de zeebrief, de meetbrief en een uittreksel uit het scheepsregister,
      bevattende alle boekingen welke op het schip betrekking hebben tot de dag van het laatste vertrek van het schip uit
      een haven in Bonaire, Sint Eustatius of Saba; de monsterrol, het manifest van de lading, de charter-partij en de
      cognossementen, dan wel afschriften van die stukken; de wettelijke regelingen in de openbare lichamen Bonaire, Sint
      Eustatius en Saba op de reis van toepassing, en alle verder nodige papieren.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel444
  - number: '444.2'
    text: |-
      Ten aanzien van de charter-partij en de cognossementen geldt deze verplichting niet in de bij algemene maatregel
      van bestuur te omschrijven omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel444
  - number: '445.1'
    text: |-
      De kapitein zorgt, dat aan boord een scheepsdagboek (dagregister of journaal) wordt gehouden, waarin alles van enig
      belang, dat op de reis voorvalt, nauwkeurig wordt opgetekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel445
  - number: '445.2'
    text: |-
      De kapitein van een schip, dat door mechanische kracht wordt voortbewogen, zorgt bovendien, dat een lid van het
      machinekamer-personeel een machine-dagboek bijhoudt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel445
  - number: '446.1'
    text: |-
      Op Nederlandse schepen mogen alleen dagboeken in gebruik worden genomen, welke de ambtenaar, te wiens overstaan de
      monstering geschiedt, of in het Europese deel van Nederland, Aruba, Curaçao of Sint Maarten het bevoegde gezag, of
      buiten het Koninkrijk een Nederlands consulair ambtenaar blad voor blad heeft genummerd en gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel446
  - number: '446.2'
    text: |-
      De dagboeken worden, zo mogelijk dagelijks bijgehouden, gedagtekend en door de kapitein en de schepeling, die hij
      met het houden van het boek heeft belast, ondertekend.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel446
  - number: '446.3'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de inrichting van de dagboeken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel446
  - number: '447'
    text: |-
      De kapitein, de eigenaar en de rompbevrachter zijn verplicht aan belanghebbenden op hun aanvrage inzage en, tegen
      betaling van de kosten, afschrift van of uittreksel uit de dagboeken te geven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel447
  - number: '448'
    text: |-
      Wanneer de kapitein zich in zaken van aanbelang met leden van de bemanning heeft beraden, wordt van de hem gegeven
      adviezen in het scheepsdagboek melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel448
  - number: '449.1'
    text: |-
      De kapitein is verplicht binnen 48 uren na aankomst in een noodhaven of in de haven van eindbestemming aan de
      ambtenaar, te wiens overstaan de monstering geschiedt, zijn scheepsdagboek of -dagboeken te vertonen of te doen
      vertonen en ze door deze ambtenaar voor gezien te laten tekenen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel449
  - number: '449.2'
    text: |-
      De kapitein heeft zich te wenden in het Europese deel van Nederland, Curaçao, Sint Maarten of Aruba tot het
      bevoegde gezag en buiten het Koninkrijk tot de Nederlandse consulaire ambtenaar, of, bij ontstentenis van zodanige
      ambtenaar, tot het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel449
  - number: '450.1'
    text: |-
      Na aankomst in een haven is de kapitein bevoegd om door een notaris een scheepsverklaring te doen opmaken omtrent
      de voorvallen van de reis.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel450
  - number: '450.2'
    text: |-
      Indien het schip of de zaken aan boord schade hebben geleden of enig buitengewoon voorval heeft plaats gehad, is
      de kapitein verplicht binnen 48 uren na aankomst, in de plaats van aankomst of in een nabijgelegen plaats althans
      een voorlopige verklaring te doen opmaken. Een voorlopige verklaring moet binnen acht dagen door een volledige
      verklaring worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel450
  - number: '450.3'
    text: |-
      De kapitein heeft zich te wenden in het Europese deel van Nederland, Curaçao of Sint Maarten of Aruba tot het
      bevoegde gezag en buiten het Koninkrijk tot de Nederlandse consulaire ambtenaar of, bij ontstentenis van zodanige
      ambtenaar, tot het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel450
  - number: '450.4'
    text: |-
      De notaris is verplicht van scheepsverklaringen tegen betaling van de kosten afschrift uit te reiken aan ieder die
      het verlangt.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel450
  - number: '451'
    text: |-
      Bij het berekenen van de in [artikelen 449][ref1] en [450][ref2] genoemde wettelijke termijnen tellen de zondag en
      de algemeen erkende feestdagen, en, in het buitenland, de aldaar erkende wettelijke feestdagen niet mee.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel450
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '449'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '450'
  - number: '452'
    text: |-
      De door de kapitein daartoe aangewezen schepelingen zijn verplicht bij het opmaken van de scheepsverklaring hun
      medewerking te verlenen door van hun bevinding verklaring af te leggen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel452
  - number: '453'
    text: |-
      De beoordeling van de bewijskracht van scheepsdagboeken en scheepsverklaringen ten aanzien van de daarin vermelde
      voorvallen van de reis is voor ieder geval aan de rechter overgelaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel453
  - number: '454'
    text: |-
      De kapitein is bevoegd, indien dit tot behoud van schip of lading noodzakelijk is, scheepstoebehoren en
      bestanddelen van de lading overboord te werpen of te verbruiken.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel454
  - number: '455'
    text: |-
      De kapitein is in geval van nood gedurende de reis bevoegd, levensmiddelen, welke in het bezit zijn van opvarenden
      of tot de lading behoren, tegen schadevergoeding tot zich te nemen, ten einde die te doen verbruiken in het belang
      van allen, die zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel455
  - number: '456.1'
    text: |-
      De kapitein is verplicht aan personen, die in gevaar verkeren, en in het bijzonder indien zijn schip bij een
      aanvaring betrokken is geweest, aan de andere daarbij betrokken schepen en de personen, die zich aan boord van die
      schepen bevinden, de hulp te verlenen, waartoe hij bij machte is zonder zijn eigen schip en de opvarenden daarvan
      aan ernstig gevaar bloot te stellen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel456
  - number: '456.2'
    text: |-
      Hij is bovendien verplicht, voor zover hem dit mogelijk is, aan de andere bij de aanvaring betrokken schepen op te
      geven de naam van zijn schip, van de haven waar het thuis behoort en van de havens vanwaar het komt en waarheen het
      bestemd is.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel456
  - number: '456.3'
    text: |-
      Niet-nakoming van deze verplichtingen door de kapitein geschiedt buiten aansprakelijkheid van hem, dit uit welken
      hoofde dan ook verantwoordelijk is voor het optreden van de kapitein.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel456
  - number: '457.1'
    text: |-
      De kapitein van een Nederlands naar de openbare lichamen Bonaire, Sint Eustatius en Saba bestemd en in een haven
      buiten de openbare lichamen Bonaire, Sint Eustatius en Saba vertoevend schip is verplicht, zich daar bevindende,
      hulpbehoevende Nederlandse zeelieden, voor zover aan boord voor hen plaats is, op verlangen van de Nederlandse
      consulaire ambtenaar of, waar deze ontbreekt, van de plaatselijke overheid, naar de openbare lichamen Bonaire, Sint
      Eustatius en Saba over te brengen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel457
  - number: '457.2'
    text: |-
      De kosten hiervan zijn voor rekening van de Staat. Bij algemene maatregel van bestuur kunnen regels worden gesteld
      betreffende de vaststelling van die kosten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel457
  - number: '458.1'
    text: |-
      De kapitein is belast met het laden en lossen van de lading, voor zover de reder of de rompbevrachter niet andere
      personen daarmee heeft belast.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel458
  - number: '458.2'
    text: |-
      De scheepsbeheerder draagt zorg voor het voldoende en doelmatig bemannen van een schip, dit met inachtneming van de
      regelen gesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel458
  - number: '463.1'
    text: |-
      Tegenover de zeewerkgever is de kapitein steeds verplicht te handelen overeenkomstig de bepalingen, waaronder hij
      is aangesteld, en de hem krachtens die aanstelling gegeven orders, mits deze bepalingen of deze orders niet in
      strijd zijn met de verplichtingen, hem als gezagvoerder bij wettelijk voorschrift opgelegd.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel463
  - number: '463.2'
    text: |-
      Hij geeft de zeewerkgever doorlopend kennis van alles wat het schip en de zaken aan boord betreft, en vraagt diens
      orders, alvorens tot enige maatregel van geldelijk aanbelang over te gaan.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel463
  - number: '463.3'
    text: |-
      Overigens is het bepaalde bij [artikel 458][ref1] ook op zijn verhouding tot de zeewerkgever van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel458
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '458'
  - number: '466'
    text: |-
      De kapitein, vernemende dat de vlag, waaronder hij vaart, onvrij is geworden, is verplicht in de meest in de
      nabijheid gelegen onzijdige haven binnen te lopen en aldaar te blijven liggen, totdat hij op veilige wijze kan
      vertrekken of van de zeewerkgever stellige orders om te vertrekken heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel466
  - number: '467'
    text: |-
      Indien de kapitein blijkt, dat de haven, waarheen het schip is bestemd, wordt geblokkeerd, is hij verplicht in de
      meest geschikte in de nabijheid gelegen haven binnen te lopen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel467
  - number: '469'
    text: De kapitein mag van de koers, welke hij moet volgen, afwijken ter redding van mensenlevens.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel469
  - number: '471'
    text: |-
      Indien gedurende de reis iemand aan boord wordt ontdekt, die niet in het bezit is van een geldig reisbiljet en
      niet bereid of niet in staat is op eerste aanmaning van de kapitein vracht te betalen, heeft deze het recht hem aan
      boord werk te laten verrichten, waartoe hij in staat is, en hem bij de eerste gelegenheid, welke zich voordoet, van
      boord te verwijderen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel471
  - number: '472'
    text: |-
      Noch de kapitein, noch een opvarende mag voor eigen rekening goederen in het schip vervoeren, tenzij krachtens
      overeenkomst met of krachtens verlof van de zeewerkgever en, indien het schip is vervracht, ook van de bevrachter.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel472
  - number: '474.1'
    text: |-
      Op ten minste twintig kubieke meters bruto-inhoud metende, langs de kusten varende vaartuigen zijn in het
      algemeen en naar de omstandigheden de voorgaande artikelen van deze Titel van toepassing, met uitzondering
      evenwel van [artikel 444][ref1], het [tweede lid van artikel 445][ref2], het [eerste lid van artikel 446][ref3]
      en [artikel 449][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel444
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel445
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel446
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel449
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '444'
      - id: ref2
        bwb_id: BWBR0028278
        artikel: '445'
      - id: ref3
        bwb_id: BWBR0028278
        artikel: '446'
      - id: ref4
        bwb_id: BWBR0028278
        artikel: '449'
  - number: '474.2'
    text: |-
      Aan boord moeten aanwezig zijn een uittreksel uit het scheepsregister, de monsterrol, indien deze is opgemaakt, en
      de wettelijke regelingen op deze schepen van toepassing.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel474
  - number: '475'
    text: |-
      Een door de zeewerkgever vastgesteld reglement betreffende de dienst aan boord is voor de kapitein verbindend,
      mits hem een exemplaar daarvan is verstrekt en voor zover de inhoud niet in strijd is met de door hem aangegane
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel475
  - number: '476'
    text: |-
      Boete mag de kapitein slechts worden opgelegd krachtens beding in de arbeidsovereenkomst wegens overtreding
      van daarin omschreven bepalingen en tot het daarin vastgestelde maximum. De bestemming van de boete moet in de
      overeenkomst worden aangegeven. De boete mag niet aan de zeewerkgever ten goede komen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel476
  - number: '477.1'
    text: |-
      Van het ogenblik, waarop volgens de arbeidsovereenkomst de dienstbetrekking aanvangt, heeft de kapitein zich te
      houden ter beschikking van de zeewerkgever tot het voeren van het in de overeenkomst aangewezen schip, of, bij
      stilzwijgen van deze, van een door de zeewerkgever daartoe aangewezen schip, mits dit behoort tot de schepen, welke
      de zeewerkgever voor de vaart ter zee gebruikt. Is omtrent de aanvang van de dienstbetrekking niets bepaald, dan
      wordt die voor de toepassing van dit voorschrift geacht samen te vallen met het sluiten van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel477
  - number: '477.2'
    text: |-
      De kapitein wordt geacht te zijn aan boord van een schip van de dag, waarop hij zijn taak aan boord op zich neemt,
      tot de dag, waarop hij daarvan wordt ontheven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel477
  - number: '478'
    text: De kapitein heeft gedurende de tijd dat hij in dienst is aan boord van een schip, recht op voeding en logies.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel478
  - number: '479'
    text: |-
      Behalve in de gevallen, genoemd in [artikel 537 onder 1°. tot en met 8°.][ref1], kunnen voor de zeewerkgever
      dringende redenen aanwezig worden geacht:


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel537
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel479
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '537'
        paragraaf: '2'
  - number: 479.1°
    text: |-
      indien de kapitein een opvarende van het door hem gevoerde schip mishandelt, grovelijk beledigt of op ernstige
      wijze bedreigt of verleidt of tracht te verleiden tot handelingen, strijdig met wettelijke regelingen of met de
      goede zeden;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel479
  - number: 479.2°
    text: |-
      indien de kapitein weigert te voldoen aan een opdracht hem gegeven overeenkomstig het bepaalde in
      [artikel 477][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel477
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel479
    references:
      - id: ref1
        bwb_id: BWBR0028278
        artikel: '477'
  - number: 479.3°
    text: |-
      indien aan de kapitein, hetzij tijdelijk, hetzij voorgoed, de bevoegdheid is ontnomen, als zodanig op een schip
      dienst te doen;
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel479
  - number: 479.4°
    text: |-
      indien de kapitein, buiten weten van de zeewerkgever, smokkelwaren aan boord heeft gebracht of daar heeft
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel479
  - number: '480'
    text: |-
      De kapitein, die de dienstbetrekking doet eindigen terwijl het door hem gevoerde schip zich op reis bevindt, is,
      op straffe van schadevergoeding, verplicht die maatregelen te nemen, welke in verband daarmede nodig zijn voor de
      veiligheid van het schip, de opvarenden en de zaken aan boord.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel480
  - number: '481'
    text: |-
      De bepalingen van de vorige artikelen laten onaangetast de bevoegdheid van de zeewerkgever, om aan de kapitein te
      allen tijde het gezag over het schip te ontnemen.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel481
  - number: '482'
    text: |-
      Na afloop van een reis is de kapitein verplicht de scheepspapieren tegen ontvangstbewijs aan de zeewerkgever af
      te geven.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel482
  - number: '483'
    text: |-
      De zeewerkgever verbeurt ten behoeve van de kapitein voor iedere dag, dat hij deze, gedurende of bij het einde van
      zijn dienst aan boord van een schip, zonder wettige reden ophoudt in het verkrijgen van het in geld vastgestelde
      deel van zijn loon, drie gulden.
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel483
  - number: '484.1'
    text: |-
      De [artikelen 491–493][ref1], [497][ref2], [503][ref3], [508][ref4], [512–517][ref5], [526][ref6], [527][ref7],
      [529][ref8], [531–536][ref9], [538][ref10], [539][ref11], [541–544][ref12], [553–555][ref13] zijn van
      overeenkomstige toepassing op de arbeidsovereenkomst van de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel491
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel497
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel503
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel508
