        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028278
        artikel: '550'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0028278
        artikel: '551'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0028278
        artikel: '552'
        paragraaf: '2'
  - number: '555.2'
    text: |-
      In de gevallen van de [artikelen 516, vierde lid][ref1], [525, vijfde lid][ref2], [546][ref3],
      [550][ref4], [551][ref5] en [552][ref6] kan de beschikking worden gegeven in de vorm bij
      [artikel 430 van het Wetboek van Burgerlijke Rechtsvordering][ref7] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028278#Artikel516
      [ref2]: https://wetten.overheid.nl/BWBR0028278#Artikel525
      [ref3]: https://wetten.overheid.nl/BWBR0028278#Artikel546
      [ref4]: https://wetten.overheid.nl/BWBR0028278#Artikel550
      [ref5]: https://wetten.overheid.nl/BWBR0028278#Artikel551
      [ref6]: https://wetten.overheid.nl/BWBR0028278#Artikel552
      [ref7]: https://wetten.overheid.nl/BWBR0001827#Artikel430
    url: https://wetten.overheid.nl/BWBR0028278/2010-10-10#Artikel555
    references:
      - id: ref1
