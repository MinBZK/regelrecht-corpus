  - number: '2.1'
    text: |-
      De geneeskundige, die de verklaring van overlijden of levenloze geboorte als bedoeld in het
      [eerste lid van artikel 1][ref1] afgeeft, doet ten behoeve van de statistiek afzonderlijk opgave van de
      doodsoorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
  - number: '2.2'
    text: |-
      De verklaring, behelzende de opgave van de doodsoorzaak, wordt tegelijk met de in [artikel 1][ref1] bedoelde
      verklaring in een gesloten omslag aan de ambtenaar van de burgerlijke stand overgelegd. Deze zendt haar ongeopend
      aan de Inspecteur van de Volksgezondheid, op zodanige wijze dat niet kan blijken op wie de opgave betrekking heeft.
      Onze Minister van Volksgezondheid, Welzijn en Sport kan bepalen dat deze enveloppen rechtstreeks zullen worden
      toegezonden aan de medisch ambtenaar van het Centraal bureau voor de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
  - number: '2.3'
    text: |-
      De modellen van de verklaringen als bedoeld in het [eerste lid van artikel 1][ref1] en in het
      [tweede lid van artikel 2][ref2] en van de bijbehorende omslag worden bij algemene maatregel van bestuur
      vastgesteld. De verklaringen zijn vrij van het recht van zegel en van registratie. De invulling geschiedt na
      voorafgaande kennisneming van geboorte-bewijzen of andere officiële stukken, welke omtrent naam, voornamen en
      leeftijd van de overledene, respectievelijk van de ouders van het doodgeboren kind inlichtingen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel2
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '2'
  - number: '2.4'
    text: |-
      De vorm en de inrichting van de modellen van de mededeling en het verslag, bedoeld in [artikel 1, derde lid][ref1],
      en van het formulier, bedoeld in [artikel 5][ref2], worden vastgesteld door de Minister van Veiligheid en Justitie
      en de Minister van Volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel5
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '5'
  - number: '3'
    text: |-
      De nodige exemplaren van de modellen in de vorige artikelen bedoeld, worden door de Inspecteur van de
      volksgezondheid, kosteloos en vrachtvrij met de daarbij behorende enveloppen, aan de geneeskundigen toegezonden.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel3
  - number: '4'
    text: |-
      Ontbreekt de verklaring in [art. 1][ref1] bedoeld, dan wordt de doodschouw verricht, door het bestuurscollege
      daartoe aangewezen geneeskundige, die daarna eene schriftelijke verklaring, ten behoeve van den ambtenaar van den
      Burgerlijken Stand, afgeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
  - number: '5'
    text: |-
      Indien sprake is van een mededeling als bedoeld in [artikel 1, derde lid][ref1] brengt de op grond van
      [artikel 4][ref2] aangewezen geneeskundige door invulling van een formulier onverwijld verslag uit aan: - de
      officier van justitie;
        - de ambtenaar van de Burgerlijke Stand;
        - de regionale toetsingscommissie, bedoeld in
      [artikel 19c van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref3]. De op grond van
      [artikel 4][ref4] aangewezen ambtenaar zendt het beredeneerd verslag als bedoeld in [artikel 1, derde lid][ref5]
      mee.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012410#Artikel19c
      [ref4]: https://wetten.overheid.nl/BWBR0028199#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0028199#Artikel1
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0012410
        artikel: 19c
      - id: ref4
        bwb_id: BWBR0028199
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0028199
        artikel: '1'
  - number: '6'
    text: |-
      De ambtenaar van den Burgerlijken Stand betracht omtrent de bij hem ingekomen verklaringen, in deze wet genoemd, de
      noodige geheimhouding.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel6
  - number: '7'
    text: |-
      Indien de verklaringen, bedoeld in [art. 1][ref1] en [art. 4][ref2], ontbreken, is het hoofd van het gezin, of wie
      in zijne plaats treedt, verplicht hiervan onverwijld den ambtenaar van den Burgerlijken Stand kennis te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel4
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '4'
  - number: '8.1'
    text: |-
      De met lijkschouwing belaste personen zijn ter verrichting daarvan bevoegd om woningen waarin zich een lijk
      bevindt, zonder de uitdrukkelijke toestemming van de bewoner binnen te treden.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel8
  - number: '8.2'
    text: |-
      Op het binnentreden in woningen als bedoeld in het tweede lid, onderdeel e, is titel X van het Derde
      boek van het Wetboek van strafvordering BES van overeenkomstige toepassing, met uitzondering van
      de [artikelen 155, vierde lid][ref1], [156, tweede lid][ref2], [157, tweede en derde lid][ref3],
      [158, eerste lid, laatste zinsnede][ref4], en [160, eerste lid][ref5], en met dien verstande dat de machtiging
      wordt verleend door de Gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '9'
    text: |-
      De ambtenaar van den Burgerlijken Stand mag geen verlof tot begraven of verbranden geven zoolang eene der
      verklaringen, in deze wet aangeduid, niet bij hem zijn ingekomen.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel9
  - number: '10'
    text: |-
      Ontbreekt eene der verklaringen, in deze wet aangeduid, op het tijdstip, dat het lijk uit de woning moet worden
      verwijderd, dan gelast de ambtenaar van den burgerlijken Stand de overbrenging van het lijk naar het lijkenhuis der
      begraafplaats, waarop de teraardebestelling zal plaats vinden, dan wel het lijkenhuis van het crematorium, waarin
      de verbranding zal gescheiden.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel10
  - number: '11'
    text: |-
      Bij het verleenen van het verlof, genoemd in [art. 9][ref1], en bij de lastgeving bedoeld in [art. 10][ref2],
      verbiedt de ambtenaar van den Burgerlijken Stand uitdrukkelijk het anders dan op eene baar dragen van een kinder-
      lijk, indien blijkt, dat het kind is overleden aan eene besmettelijke ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel10
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '10'
  - number: '12.1'
    text: |-
      Met een geldboete van de eerste categorie worden gestraft de geneeskundigen, bij verzuim der verplichtingen hun
      opgelegd in de [artikelen 1][ref1], [2][ref2] en [4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028199#Artikel4
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0028199
        artikel: '4'
  - number: '12.2'
    text: |-
      Met een geldboete van de eerste categorie wordt gestraft de ambtenaar van de Burgerlijke stand, bij verzuim van het
      hem opgelegde in de [artikelen 9][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel10
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '10'
  - number: '12.3'
    text: |-
      Met een geldboete van de eerste categorie worden gestraft de personen, die met de aangifte van het overlijden
      belast zijn, bij verzuim van het hun opgelegde in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel7
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '7'
  - number: '12.4'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet verklaringen van overlijden BES.'
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel13
