articles:
  - number: '1.1'
    text: |-
      De geneeskundigen geven bij het vaststellen hunnerzijds van het overlijden van een persoon en van de geboorte van
      een dood kind ten behoeve van de ambtenaar van de burgerlijke stand een verklaring van overlijden respectievelijk
      van levenloze geboorte af.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel1
  - number: '1.2'
    text: |-
      Zij geven de in het vorige lid bedoelde verklaringen niet dan na zich door persoonlijke schouwing overtuigd te
      hebben van het overlijden respectievelijk van de levenloze geboorte.
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel1
  - number: '1.3'
    text: |-
      Indien het overlijden het gevolg was van de toepassing van levensbeëindiging op verzoek
      of hulp bij zelfdoding als bedoeld in [artikel 306, tweede lid][ref1], onderscheidenlijk
      [artikel 307, tweede lid, van het Wetboek van Strafrecht BES][ref2] geeft de behandelend geneeskundige geen
      verklaring van overlijden af en doet hij van de oorzaak van het overlijden onverwijld door invulling van een
      formulier mededeling aan de op grond van [artikel 4][ref3] door het bestuurscollege aangewezen geneeskundige. Bij
      de mededeling voegt de geneeskundige een beredeneerd verslag inzake de inachtneming van de zorgvuldigheidseisen,
      bedoeld in [artikel 2 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel306
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel307
      [ref3]: https://wetten.overheid.nl/BWBR0028199#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012410
    url: https://wetten.overheid.nl/BWBR0028199/2011-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '306'
      - id: ref2
