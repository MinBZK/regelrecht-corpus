        artikel: '5'
  - number: '8'
    text: |-
      1 Het formulier voor het indienen van een verzoek ter verkrijging van een verklaring als bedoeld in de
      [artikelen 4][ref1] en [5][ref2], wordt vastgesteld overeenkomstig de bij deze regeling behorende bijlage.

      2 Het in het eerste lid bedoelde formulier dient juist en volledig te worden ingevuld en, vergezeld van de
      gevraagde bijlagen, schriftelijk te worden ingediend bij SenterNovem te Zwolle.

      3 Een verzoek ter verkrijging van een verklaring als bedoeld in de [artikelen 4][ref3] en [5][ref4], wordt niet
      behandeld, indien:

      a. een eerder gedaan verzoek voor die film nog in behandeling is, of;

      b. voor de filminvestering al eerder een verklaring als bedoeld in de [artikelen 4][ref5] en [5][ref6] is
      afgegeven en deze niet is ingetrokken op grond van [artikel 7, onderdeel a][ref7];

      c. voor de filminvestering al eerder een verklaring als bedoeld in de [artikelen 4][ref8] en [5][ref9], is
      afgegeven en deze is ingetrokken op grond van [artikel 7, onderdeel b of c][ref10];

      d. het verzoek per fax of per e-mail is ingediend.

      4 Verzoeken ter verkrijging van een verklaring als bedoeld in de [artikelen 4][ref11] en [5][ref12], worden in
      volgorde van ontvangst behandeld, met dien verstande dat, indien de belastingplichtige of zijn gemachtigde niet
      heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van het verzoek en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref13] de gelegenheid heeft gehad het verzoek aan te vullen, de
      dag waarop het verzoek voldoet aan de wettelijke voorschriften met betrekking tot de behandeling als datum van
      ontvangst geldt.


