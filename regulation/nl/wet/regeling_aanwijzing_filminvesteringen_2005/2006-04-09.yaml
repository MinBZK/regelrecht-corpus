        artikel: XXXIa
  - number: '3'
    text: |-
      Als een filminvestering, bedoeld in [artikel 3.33 van de wet][ref1], wordt aangewezen een investering in een film
      die primair is bestemd voor vertoning in bioscopen, doch niet een reclamefilm of voorlichtingsfilms betreffend, aan
      de voortbrenging waarvan een projectvoorstel ten grondslag ligt, bestaande uit:

      a. het scenario, inclusief synopsis, van de film, ter zake waarvan wordt aangetoond dat de exclusieve
      verfilmingsrechten, of in ieder geval een optierecht daarop, in handen zijn van de filmonderneming, dan wel van de
      aanvrager die deze rechten aan de filmonderneming zal overdragen;

      b. een gespecificeerde projectbegroting uit welker specificatie onder meer blijkt dat de voortbrengingskosten een
      totaal bedrag van € 15.000.000 niet overstijgen;

      c. een gespecificeerd financieringsplan waaruit blijkt dat tenminste 50% van de voortbrengingskosten, zoals
      opgenomen in de projectbegroting, reeds is gedekt door bijdragen van derden die ofwel schriftelijk zijn toegezegd
      als garantieopbrengst ofwel schriftelijk zijn toegezegd als subsidie, lening of investering ter dekking van de
      projectbegroting.

      d. een gespecificeerd verkoop- en exploitatieplan, uit welker specificatie onder meer blijkt:

      1. een schatting van de opbrengsten, en;

      2. dat de schriftelijk toegezegde garantieopbrengsten tenminste 25% van de voortbrengingskosten, zoals opgenomen in
      de projectbegroting, bedragen;

      e. een gespecificeerd marketing- en promotieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.33
    url: https://wetten.overheid.nl/BWBR0018542/2006-04-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.33'
  - number: '4'
    text: |-
      1 Op filminvesteringen mag alleen willekeurig worden afgeschreven, indien door de minister op een door of namens
      de belastingplichtige gedaan verzoek een verklaring als bedoeld in [artikel 3.37, eerste lid, van de wet][ref1],
      is afgegeven.

      2 De Minister geeft slechts een in het eerste lid bedoelde verklaring af, indien de filminvesteringen voldoen aan
      de vereisten, bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.37
      [ref2]: https://wetten.overheid.nl/BWBR0018542#Artikel3
    url: https://wetten.overheid.nl/BWBR0018542/2006-04-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.37'
      - id: ref2
        bwb_id: BWBR0018542
        artikel: '3'
  - number: '5'
    text: |-
      De minister geeft op een door of namens de belastingplichtige gedaan verzoek een verklaring af als bedoeld in
      [artikel 3.42b, eerste lid, van de wet][ref1], indien de filminvesteringen voldoen aan de vereisten, bedoeld
      in [artikel 3][ref2], en toekenning van de filminvesteringsaftrek terzake past binnen het hiervoor in de
      rijksbegroting opgenomen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.42b
      [ref2]: https://wetten.overheid.nl/BWBR0018542#Artikel3
    url: https://wetten.overheid.nl/BWBR0018542/2006-04-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 3.42b
      - id: ref2
        bwb_id: BWBR0018542
        artikel: '3'
  - number: '6'
    text: |-
      De verklaring, bedoeld in [artikel 5][ref1] wordt afgegeven onder de voorwaarde dat:

      a. binnen 3 maanden na afgifte van de verklaring een met de rijksbelastingdienst gesloten vaststellingsovereenkomst
      ter zake van de filminvesteringen aan SenterNovem te Zwolle is overgelegd, waarin onder meer is overeengekomen dat
      het verlies van de filmonderneming slechts toerekenbaar is aan medegerechtigden in die onderneming tot het beloop
      van hun inbreng, en

      b. binnen 6 maanden na afgifte van de onder a bedoelde verklaring aan SenterNovem te Zwolle schriftelijk
      opgave is verstrekt van de gegevens betreffende de belastingplichtigen die vanwege hun medegerechtigheid in de
      filmonderneming aanspraak zullen maken op filminvesteringsaftrek, en van het bedrag aan filminvesteringen waarvoor
      deze belastingplichtigen aanspraak zullen maken op filminvesteringsaftrek.


      [ref1]: https://wetten.overheid.nl/BWBR0018542#Artikel5
    url: https://wetten.overheid.nl/BWBR0018542/2006-04-09#Artikel6
    references:
