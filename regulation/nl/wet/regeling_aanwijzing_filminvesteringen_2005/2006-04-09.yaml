        artikel: '5'
  - number: '7'
    text: |-
      De minister kan een verklaring als bedoeld in de [artikelen 4][ref1] en [5][ref2] intrekken

      a. op verzoek van de aanvrager zelf;

      b. omdat niet aan de voorwaarden, waaronder de verklaring is afgegeven, is voldaan, of;

      c. indien de aan de minister verstrekte gegevens of bescheiden zodanig onjuist of onvolledig zijn geweest dat
      op het verzoek een andere beslissing zou zijn genomen, indien bij de beoordeling daarvan de juiste gegevens en
      bescheiden volledig bekend zouden zijn geweest en de onjuistheid of onvolledigheid van de gegevens of bescheiden de
      minister niet bekend was of redelijkerwijs niet bekend had kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018542#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018542#Artikel5
    url: https://wetten.overheid.nl/BWBR0018542/2006-04-09#Artikel7
