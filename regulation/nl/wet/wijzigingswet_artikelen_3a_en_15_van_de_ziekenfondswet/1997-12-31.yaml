preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de artikelen 3a en 15, tweede lid, van de
    Ziekenfondswet in technische zin te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009274/1997-12-31#ArtikelAanhef
articles:
  - number: III
    text: |-
      In afwijking van [artikel 3a van de Ziekenfondswet][ref1] wordt bij de eerstvolgende herziening van het bedrag,
      bedoeld in artikel 3, eerste lid, van die wet,

      a. zoals dat is komen te luiden ingevolge [artikel I, onderdeel A, eerste lid, onder][ref2] «indexcijfer, dat bij
      de laatste herziening is gehanteerd» verstaan het indexcijfer voor de maand juli 1992 op basis van het jaar 1990
      = 100;

      b. zoals dat is komen te luiden ingevolge [artikel II, onder][ref3] «indexcijfer, dat bij de laatste herziening is
      gehanteerd» verstaan het indexcijfer voor de maand juli 1995 op basis van het jaar 1990 = 100.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009274#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0009274#ArtikelII
