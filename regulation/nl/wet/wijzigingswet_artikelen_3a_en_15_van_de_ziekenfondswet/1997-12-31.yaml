  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst. Artikel I, onderdeel A, onder 1, eerste volzin van artikel 3a, tweede lid, en artikel III, aanhef en
      onder a, werken terug tot en met 1 oktober 1993. [Artikel II][ref1] en [artikel III, onder b][ref2], werken terug
      tot en met 1 oktober 1996.


