    text: |-
      1 Het resultaat dat overeenkomstig [artikel 1.7][ref1] wordt verstrekt, bestaat uit sturingsinformatie.

      2 Overeenkomstig [artikel 1.7, tweede lid][ref2], kunnen de resultaten van de verwerking aan een derde worden
      verstrekt.


