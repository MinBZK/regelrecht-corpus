  - number: '2.14'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop indicatoren als
      bedoeld in [artikel 2.13][ref1] worden vastgesteld, met inbegrip van regels over de kwaliteit van de hypothese
      waarop deze zijn gebaseerd.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de uitvoering van de
      gegevensanalyse. Deze regels hebben betrekking op:

      a. de wijze waarop de bescherming van de persoonlijke levenssfeer nader wordt gewaarborgd;

      b. de methoden van verwerking;

      c. voorzieningen ter bevordering van de kwaliteit van de gehanteerde methodiek;

      d. het voorzien van de gegevens van een indicatie over hun betrouwbaarheid;

      e. de wijze waarop de verbanden tussen gegevens zichtbaar worden gemaakt;

      f. de vereiste kwaliteit van de gegevens die ten behoeve van de uit te voeren analyse worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.13
