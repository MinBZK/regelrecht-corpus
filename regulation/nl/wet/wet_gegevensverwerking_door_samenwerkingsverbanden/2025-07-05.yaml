  - number: '2.28'
    text: |-
      1 De deelnemers, bedoeld in [artikel 2.27, eerste lid][ref1], van een Zorg- en Veiligheidshuis die gegevens
      over een betrokkene verwerken ter uitvoering van de activiteiten, bedoeld in [artikel 2.26][ref2], kunnen ter
      vaststelling of die betrokkene bekend is bij een ander Zorg- en Veiligheidshuis, identificerende en contactgegevens
      alsmede het burgerservicenummer van die betrokkene uitwisselen met de deelnemers, bedoeld in artikel 2.27,
      eerste lid, van een ander Zorg- en Veiligheidshuis voor zover dat noodzakelijk is voor het doel, bedoeld in
      [artikel 2.25][ref3].

      2 Indien na het uitwisselen van identificerende en contactgegevens alsmede het burgerservicenummer van die
      betrokkene blijkt dat de betrokkene bekend is bij een ander Zorg- en Veiligheidshuis, kunnen de deelnemers,
      bedoeld in [artikel 2.27, eerste lid][ref4], overgaan tot het uitwisselen van andere relevante gegevens, bedoeld in
      [artikel 2.30][ref5], voor zover dat noodzakelijk is voor het doel, bedoeld in [artikel 2.25][ref6].

      3 De deelnemers, bedoeld in [artikel 2.27, eerste lid][ref7], van een Zorg- en Veiligheidshuis, die gegevens
      van een betrokkene verwerken, kunnen tijdens de uitvoering van de activiteiten, bedoeld in [artikel 2.26][ref8],
      gegevens, bedoeld in [artikel 2.30][ref9], aan de deelnemers, bedoeld in artikel 2.27, eerste lid, van een ander
      Zorg- en Veiligheidshuis verstrekken indien uit feiten en omstandigheden blijkt dat de verstrekking noodzakelijk is
      voor het doel, bedoeld in [artikel 2.25][ref10].

      4 Verstrekking van bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard aan de
      deelnemers, bedoeld in [artikel 2.27, eerste lid][ref11], van een ander Zorg- en Veiligheidshuis vindt uitsluitend
      plaats nadat de deelnemer of de deelnemers die deze persoonsgegevens aan het Zorg- en Veiligheidshuis heeft of
      hebben verstrekt, hiermee heeft of hebben ingestemd.


