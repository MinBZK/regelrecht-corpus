  - number: '2.12'
    text: |-
      1 Met het oog op de uitvoering van de activiteiten, bedoeld in [artikel 2.13][ref1], zijn de door de deelnemers te
      verstrekken categorieën gegevens:

      a. personalia en andere identificerende gegevens van de betrokken natuurlijke persoon of rechtspersoon, waaronder
      persoonsnummers;

      b. gegevens over inkomen en vermogensbestanddelen;

      c. gegevens die zicht geven op de relatie tussen de betrokken natuurlijke persoon of rechtspersoon en zijn
      vermogensbestanddelen;

      d. gegevens betreffende eerdere onrechtmatigheid in de relatie tussen de betrokken natuurlijke persoon of
      rechtspersoon en vermogensbestanddelen;

      e. gegevens die zicht geven op relevante relaties of contacten van natuurlijke personen of rechtspersonen die
      mogelijk in verband gebracht kunnen worden met mogelijke onverklaarbare of criminele vermogensbestanddelen of
      witwas- of fraudeconstructies;

      f. politiegegevens, die op grond van [artikel 20, derde lid, van de Wet politiegegevens][ref2] worden verstrekt;

      g. justitiële en strafvorderlijke gegevens en tenuitvoerleggingsgegevens die op grond van de [artikelen 8b][ref3],
      [39fa][ref4] en [51ca van de Wet justitiële en strafvorderlijke gegevens][ref5] worden verstrekt.

      2 De in het eerste lid bedoelde gegevens worden uitsluitend verstrekt, voor zover deze betrekking hebben op:

      a. natuurlijke personen of rechtspersonen die potentieel in verband gebracht kunnen worden met onverklaarbare of
      criminele vermogensbestanddelen of witwas- of fraudeconstructies;

      b. relevante relaties van natuurlijke personen of rechtspersonen die mogelijk in verband gebracht kunnen worden met
      mogelijke onverklaarbare of criminele vermogensbestanddelen of witwas- of fraudeconstructies;

      c. natuurlijke personen of rechtspersonen ten aanzien van wie een overheidsvordering bestaat die oninbaar dreigt
      te worden;

      d. natuurlijke personen of rechtspersonen die in verband gebracht kunnen worden met financieel toezicht of
      andere aan de bestrijding van financieel-economische criminaliteit gerelateerde taken dan wel met taken waarmee
      marktwerking wordt bewaakt en bevorderd.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de categorieën van gegevens, bedoeld
      in het eerste lid, en de bronnen van waaruit die gegevens afkomstig zijn en kunnen aanvullende categorieën gegevens
      worden aangewezen, voor zover dat noodzakelijk is voor het doel, bedoeld in [artikel 2.10][ref6]. De voordracht
      voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.13
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel39fa
      [ref5]: https://wetten.overheid.nl/BWBR0014194#Artikel51ca
      [ref6]: https://wetten.overheid.nl/BWBR0049962#Artikel2.10
