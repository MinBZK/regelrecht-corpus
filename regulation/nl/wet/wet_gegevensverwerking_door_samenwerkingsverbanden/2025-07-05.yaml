        artikel: '2.25'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '2.27'
    text: |-
      1 Als deelnemers worden aangewezen:

      a. de Raad voor de Kinderbescherming, voor de uitvoering van de wettelijke taken en bevoegdheden
      op grond van de [artikelen 255][ref1] en [257 van Boek 1 van het Burgerlijk Wetboek][ref2],
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref3],
      [artikel 3.1 van de Jeugdwet][ref4] en de [artikelen 5, eerste lid][ref5], [6][ref6], [10][ref7] en
      [25 van de Wet opneming buitenlandse kinderen ter adoptie][ref8];

      b. de Dienst Justitiële Inrichtingen, voor de uitvoering van de wettelijke taken
      op grond van [artikel 2 van de Beginselenwet justitiële jeugdinrichtingen][ref9],
      [artikel 2 van de Beginselenwet verpleging ter beschikking gestelden][ref10],
      [artikel 2 van de Penitentiaire beginselenwet][ref11],
      [artikel 2.2, eerste en tweede lid, van de Wet forensische zorg][ref12], alsmede de daaruit voortvloeiende
      bevoegdheden en [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref13];

      c. de politie, voor de uitoefening van de taak bedoeld in [artikel 3 van de Politiewet 2012][ref14]
      en de daaruit voortvloeiende bevoegdheden, en de wettelijke taken en bevoegdheden op grond
      van de [artikelen 5:3][ref15], [7:3][ref16], [8:1][ref17], [8:2][ref18], [8:10][ref19] en
      [13:3 van de Wet verplichte geestelijke gezondheidszorg][ref20] en de [artikelen 28b, tweede lid][ref21], en
      [33 van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref22];

      d. het openbaar ministerie, voor de uitoefening van de in
      [artikel 124 van de Wet op de rechterlijke organisatie][ref23] opgedragen taak en de daaruit
      voortvloeiende bevoegdheden, en de uitoefening van de wettelijke taken en bevoegdheden op
      grond van de [artikelen 5:3][ref24], [5:16][ref25], [5:17, eerste lid][ref26], [5:18][ref27],
      [5:19][ref28], [7:7, eerste lid][ref29], [7:11, eerste lid][ref30], [8:1, eerste en derde lid][ref31],
      [8:17, zevende lid][ref32], [8:18, derde lid, en tiende lid][ref33], [8:19, derde lid, aanhef][ref34],
      [13:3, eerste, vierde en vijfde lid, van de Wet verplichte geestelijke gezondheidszorg][ref35],
      de [artikelen 28a, derde lid, aanhef][ref36],
      [28b, eerste lid, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref37] en
      [artikel 2.3 van de Wet forensische zorg][ref38];

      e. de burgemeester voor de uitoefening van zijn wettelijke taken en bevoegdheden op het terrein van de
      handhaving van de openbare orde bij of krachtens [hoofdstuk XI van titel III van de Gemeentewet][ref39],
      [paragraaf 2.3 van de Politiewet 2012][ref40], [artikel 13b van de Opiumwet][ref41] of een
      gemeentelijke verordening en voor de uitoefening van zijn wettelijke taken en bevoegdheden bij
      of krachtens de [Wet tijdelijk huisverbod][ref42] en de [artikelen 7:1][ref43], [7:2][ref44],
      [7:4][ref45] en [8:1 van de Wet verplichte geestelijke gezondheidszorg][ref46] en de
      __REF008___________________________________________________________________________________________________________
      ____;

      f. het college van burgemeester en wethouders voor de uitoefening van zijn wettelijke taken en bevoegdheden
      bij of krachtens de [artikelen 2.1.1, eerste lid][ref48], [2.1.7][ref49], [2.3.1 tot en met 2.3.6][ref50],
      [2.3.9][ref51], [2.3.10][ref52] en [2.4.1 van de Wet maatschappelijke ondersteuning 2015][ref53], de
      [artikelen 2.3][ref54] en [2.4 van de Jeugdwet][ref55], [artikel 7 van de Participatiewet][ref56],
      [artikel 3 van de Wet gemeentelijke schuldhulpverlening][ref57], [artikel 16 van de Leerplichtwet 1969][ref58]
      en de wettelijke taken en bevoegdheden, bedoeld in de [artikelen 5:1][ref59], [5:2][ref60],
      [5:3][ref61] en [5:16 van de Wet verplichte geestelijke gezondheidszorg][ref62],
      [artikel 28c van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref63] en
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref64];

      g. een instelling voor gemeentelijke gezondheidsdienst voor het in opdracht van het college van burgemeester en
      wethouders uitvoeren van de wettelijke taken en bevoegdheden bij of krachtens de [Wet publieke gezondheid][ref65]
      en [artikel 2.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref66].

      2 Als deelnemers worden aangewezen de volgende private partijen die bij of krachtens de wet taken of bevoegdheden
      uitoefenen of daartoe door een bestuursorgaan gemandateerd zijn of van een bestuursorgaan de opdracht
      daartoe hebben gekregen of daaraan gerelateerde noodzakelijke werkzaamheden verrichten, of krachtens een
      behandelingsovereenkomst als bedoeld in [afdeling 5 van titel 7 van Boek 7 van het Burgerlijk Wetboek][ref67] of de
      Jeugdwet diensten verlenen en die verband houden met het doel, bedoeld in [artikel 2.25][ref68]:

      a. de door Onze Minister op grond van [artikel 4, eerste lid, van de Reclasseringsregeling 1995][ref69] erkende
      reclasseringsinstelling voor de taken bedoeld in [hoofdstuk 3 van de Reclasseringsregeling 1995][ref70] en
      [artikel 2:7 van het Besluit tenuitvoerlegging strafrechtelijke beslissingen][ref71];

      b. de door het college van burgemeester en wethouders op grond van
      [artikel 4.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref72] aangewezen organisatie van
      een Veilig Thuis-organisatie voor de taken bedoeld in artikel 4.1.1, tweede lid, van de Wet maatschappelijke
      ondersteuning 2015;

      c. de gecertificeerde instelling die in het bezit is van een certificaat of voorlopig certificaat als bedoeld in
      [artikel 3.4 van de Jeugdwet][ref73] en die jeugdreclassering of een kinderbeschermingsmaatregel als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref74] uitvoert;

      d. een instelling voor geestelijke gezondheidszorg die werkzaamheden verricht, bedoeld in de [artikelen 1:1][ref75]
      en [2:1 van de Wet verplichte geestelijke gezondheidszorg][ref76], [artikel 1.1.1 van de Wet langdurige zorg][ref77],
      [artikel 1.1 van de Wet forensische zorg][ref78], de [artikelen 1][ref79] en
      [5 tot en met 9 van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref80],
      [artikel 1.1 van de Jeugdwet][ref81], de [artikelen 1.1.1][ref82] en
      [2.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref83], of een behandeling uitvoert uit hoofde
      van een behandelingsovereenkomst, bedoeld in [artikel 446 van Boek 7 van het Burgerlijk Wetboek][ref84];

      e. een instelling die in opdracht van het college van burgemeester en wethouders werkzaamheden verricht ter
      uitvoering van de [artikelen 2.3.1 tot en met 2.3.5 van de Wet maatschappelijke ondersteuning 2015][ref85],
      de [artikelen 2.3][ref86] en [2.4 van de Jeugdwet][ref87], [artikel 7 van de Participatiewet][ref88] of
      [artikel 3 van de Wet gemeentelijke schuldhulpverlening][ref89].

      3 In afwijking van [artikel 1.4, eerste lid][ref90], zijn uitsluitend de deelnemers, bedoeld in het eerste lid,
      gezamenlijke verwerkingsverantwoordelijken als bedoeld in artikel 26, eerste lid, van de Algemene verordening
      gegevensbescherming voor de gezamenlijke verwerking van persoonsgegevens door de Zorg- en Veiligheidshuizen.
      Artikel 1.4, tweede tot en met vierde lid, is van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wettelijke taken en
      bevoegdheden van de deelnemers en daaraan gerelateerde noodzakelijke werkzaamheden waarvoor gegevens kunnen worden
      verwerkt binnen de Zorg- en Veiligheidshuizen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen andere overheidsorganen of overheidsinstanties of
      private partijen als deelnemer worden aangewezen, voor zover dat noodzakelijk is voor het doel, bedoeld in
      [artikel 2.25][ref91]. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
      Een krachtens dit lid vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat
      de inwerkingtreding van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe
      strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien
      een van de Kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van
      bestuur ingetrokken.


