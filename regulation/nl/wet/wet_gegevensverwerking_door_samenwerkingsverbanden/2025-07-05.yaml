  - number: '2.5'
    text: |-
      1 Door het Financieel Expertisecentrum worden de volgende activiteiten verricht:

      a. signalenoverleg; en

      b. gegevensanalyse.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de activiteiten,
      bedoeld in het eerste lid, en kunnen aanvullende activiteiten, waaronder geautomatiseerde gegevensanalyse, worden
      aangewezen, voor zover die noodzakelijk zijn voor het doel, bedoeld in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0049962
        artikel: '2.2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.6'
    text: |-
      1 Indien een deelnemer signalen heeft inzake bedreigingen of risico’s van inbreuken op de integriteit van de
      financiële sector als bedoeld in [artikel 2.2][ref1] kunnen deelnemers daarover overleggen. Daarbij verstrekken zij
      elkaar gegevens voor zover dat noodzakelijk is om het signaal te kwalificeren als sturingsinformatie.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de criteria om een bepaald signaal voor
      te dragen voor het signalenoverleg, waaronder over de aard, de eisen van kwaliteit en betrouwbaarheid waaraan het
      signaal moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0049962
        artikel: '2.2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.7'
    text: |-
      1 De deelnemers kunnen hun gegevens op verzoek van een of meer van hen, gezamenlijk analyseren ten behoeve van het
      doel, bedoeld in [artikel 2.2][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van de gegevensanalyse.
      Deze regels kunnen betrekking hebben op:

      a. de wijze waarop de bescherming van de persoonlijke levenssfeer nader wordt gewaarborgd;

      b. de methoden waarop de gegevens vergeleken kunnen worden;

      c. voorzieningen ter bevordering van de kwaliteit van de gehanteerde methodiek;

      d. het voorzien van de gegevens van een indicatie over betrouwbaarheid;

      e. de wijze waarop de verbanden zichtbaar gemaakt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0049962
        artikel: '2.2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.8'
    text: |-
      1 Het resultaat van de gegevensanalyse dat overeenkomstig [artikel 1.7][ref1] wordt verstrekt, bestaat uit
      sturingsinformatie.

      2 Overeenkomstig [artikel 1.7, tweede lid][ref2], kunnen de resultaten van de verwerking aan een derde worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.7
