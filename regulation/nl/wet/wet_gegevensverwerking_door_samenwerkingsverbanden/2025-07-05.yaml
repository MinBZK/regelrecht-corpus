  - number: '2.13'
    text: |-
      De Infobox Crimineel en Onverklaarbaar Vermogen kan de ontvangen gegevens op verzoek van een of meer deelnemers al
      dan niet met behulp van geautomatiseerde gegevensanalyse verwerken om:

      a. een rapportage op te stellen die een overzicht geeft van het vermogen en inkomsten van een of meer natuurlijke
      of rechtspersonen (iRVI),

      b. een rapportage op te stellen over de financieel-zakelijke relaties rondom natuurlijke of rechtspersonen (iRR),

      c. een geanonimiseerde rapportage op te stellen die aan de hand van vooraf vastgestelde indicatoren en gegevens
      over bepaalde gepseudonimiseerde natuurlijke personen of rechtspersonen een ontwikkeling of trend in een bepaalde
      regio of met betrekking tot een bepaald fenomeen weergeeft teneinde inzicht te krijgen in problematiek met
      betrekking tot het in [artikel 2.10][ref1] vastgelegde doel (iRT NN);

      d. op basis van een rapportage als bedoeld onder c een rapportage als bedoeld onder a of b op te stellen (iRT
      compact).


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.13
