preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijk kader te scheppen voor de gezamenlijke
    verwerking van gegevens door bepaalde samenwerkingsverbanden ten behoeve van een doelstelling van zwaarwegend
    algemeen belang en daarbij de nodige waarborgen op te nemen voor de bescherming van de persoonlijke levenssfeer;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bijzondere categorieën van persoonsgegevens:* de categorieën van persoonsgegevens, bedoeld in artikel 9, eerste
      lid, van de Algemene verordening gegevensbescherming;
        - *deelnemers:* als deelnemers van een samenwerkingsverband aangewezen overheidsinstanties, overheidsorganen en
      private partijen als bedoeld in [artikel 1.3][ref1];
        - *geautomatiseerde gegevensanalyse:* bij algemene maatregel van bestuur aangewezen vormen van analyse van
      persoonsgegevens die worden verricht zonder menselijke tussenkomst;
        - *gegevens:* persoonsgegevens en andere gegevens;
        - *handhavingsknelpunt:* door de deelnemers van een Regionaal Informatie- en Expertisecentrum aangewezen
      personen, groepen van personen, gebieden of branches, waarover bij de deelnemers van een Regionaal Informatie- en
      Expertisecentrum dusdanige aanwijzingen zijn dat de vigerende wet- en regelgeving structureel niet wordt nageleefd,
      dat dit duidt op verschijningsvormen van georganiseerde criminaliteit;
        - *persoonsgegevens van strafrechtelijke aard:* persoonsgegevens van strafrechtelijke aard als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2];
        - *samenwerkingsverband:* verband van deelnemers die gezamenlijk gegevens verwerken voor een bij of krachtens deze
      wet vastgestelde doelstelling van zwaarwegend algemeen belang;
        - *signaal:* melding van een of meer deelnemers in een samenwerkingsverband dat bepaalde gedragingen of situaties
      betreffende natuurlijke personen, rechtspersonen of fenomenen aanleiding kunnen zijn om ten behoeve van het doel
      van het samenwerkingsverband gezamenlijk gegevens te verwerken;
        - *sturingsinformatie:* gegevens betreffende natuurlijke personen, rechtspersonen of fenomenen, inhoudende een
      eerste vermoeden dat sprake is van onrechtmatige activiteiten, of voornemens daartoe, op de bestrijding waarvan het
      samenwerkingsverband is gericht, met inbegrip van de onderliggende gegevens uit een risicoanalyse, ten behoeve van
      de uitvoering van publiekrechtelijke taken of uitoefening van publiekrechtelijke bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.3
