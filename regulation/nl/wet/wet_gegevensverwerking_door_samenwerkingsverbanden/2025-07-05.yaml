  - number: '5.1'
    text: |-
      1 Onze Minister van Justitie en Veiligheid zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en effecten van deze wet in de praktijk.

      2 Het eerste lid is van overeenkomstige toepassing op algemene maatregelen van bestuur waarmee krachtens deze wet
      samenwerkingsverbanden worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel5.1
  - number: '5.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel5.2
  - number: '5.3'
    text: 'Deze wet wordt aangehaald als: Wet gegevensverwerking door samenwerkingsverbanden.'
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel5.3
