  - number: '2.31'
    text: |-
      1 Een deelnemer kan een casus voor overleg aanmelden bij een Zorg- en Veiligheidshuis naar aanleiding van
      gedragingen van een betrokkene of een situatie waarin een betrokkene verkeert, die verband houden met het doel,
      bedoeld in [artikel 2.25][ref1], en daartoe gegevens verwerken.

      2 De deelnemers bedoeld in [artikel 2.27, eerste lid][ref2], beoordelen of de melding van een casus in
      overeenstemming is met het doel, bedoeld in [artikel 2.25][ref3].

      3 Indien de melding van een casus naar het oordeel van de deelnemers, bedoeld in [artikel 2.27, eerste lid][ref4],
      in overeenstemming is met het doel, bedoeld in [artikel 2.25][ref5], kunnen deze deelnemers overgaan tot
      verzameling en uitwisseling van, alsmede samenvoeging met andere relevante gegevens die beschikbaar zijn bij de
      deelnemers. Hierbij kunnen zij deelnemers als bedoeld in artikel 2.27, tweede lid, betrekken.

      4 De deelnemers, bedoeld in [artikel 2.27, eerste lid][ref6], beoordelen welke deelnemers met het oog op het doel
      in de zin van [artikel 2.25][ref7] moeten worden betrokken bij de behandeling van de casus en daarbij gegevens
      mogen verwerken. Hierbij kunnen zij deelnemers als bedoeld in artikel 2.27, tweede lid, betrekken.

      5 Bij het casusoverleg kunnen de betrokken deelnemers overgaan tot het verder verzamelen en uitwisselen van en
      samenvoegen met andere relevante gegevens. Indien dit naar het oordeel van de betrokken deelnemers noodzakelijk is
      met het oog op het doel in de zin van [artikel 2.25][ref8], kunnen de deelnemers in afstemming afspraken maken over
      interventies die ten aanzien van een betrokkene worden ingezet en kunnen zij daartoe gegevens verwerken.

      6 Indien de deelnemers in afstemming afspraken hebben gemaakt over interventies die ten aanzien van een betrokkene
      worden ingezet, kunnen de betrokken deelnemers gegevens verwerken die met het oog op het doel in de zin van
      [artikel 2.25][ref9] noodzakelijk zijn voor de uitvoering, evaluatie en zo nodig het bijstellen van die afspraken
      alsmede voor het overleggen over afsluiting van de casus.

      7 Bij de verwerking van gegevens, bedoeld in het eerste tot en met zesde lid, kunnen de deelnemers ten aanzien van
      betrokkene en natuurlijke personen uit de directe kring van betrokkene de categorieën gegevens verwerken, bedoeld
      in [artikel 2.30][ref10], voor zover dat noodzakelijk is voor het doel, bedoeld in [artikel 2.25][ref11].

      8 Indien de deelnemers, bedoeld in [artikel 2.27, eerste lid][ref12], de casus afsluiten, worden de
      persoonsgegevens die in de casus zijn opgenomen, na afsluiting afgeschermd totdat uitvoering wordt gegeven aan
      [artikel 1.8, zevende lid][ref13].

      9 Indien noodzakelijk voor het doel, bedoeld in [artikel 2.25][ref14], kunnen de deelnemers, bedoeld in
      [artikel 2.27, eerste lid][ref15], derden op incidentele basis laten deelnemen aan het overleg, bedoeld in
      het vijfde en zesde lid. Deze derden krijgen uitsluitend toegang tot de persoonsgegevens die in het Zorg- en
      Veiligheidshuis worden verwerkt voor zover dat noodzakelijk is voor het doel, bedoeld in artikel 2.25.

      10 Bij toepassing van het negende lid zijn de artikelen die bij of krachtens deze wet van toepassing zijn op de
      deelnemers, bedoeld in [artikel 2.27, tweede lid][ref16], van overeenkomstige toepassing en zien de deelnemers,
      bedoeld in artikel 2.27, eerste lid, erop toe dat derden die op incidentele basis deelnemen aan het casusoverleg
      voldoen aan de Algemene verordening gegevensbescherming en het bepaalde bij of krachtens deze wet.

      11 Overeenkomstig [artikel 1.7, tweede lid][ref17], kunnen de resultaten van de gezamenlijke verwerking van
      gegevens op grond van deze bepaling door de deelnemers, bedoeld in [artikel 2.27, eerste lid][ref18], aan een derde
      worden verstrekt.

      12 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gezamenlijke
      verwerking van gegevens bij het casusoverleg, waaronder over de criteria waaraan een casus moet voldoen om te
      kunnen worden behandeld in het Zorg- en Veiligheidshuis, de eisen van kwaliteit en betrouwbaarheid waaraan de casus
      moet voldoen, de criteria voor verstrekking van de resultaten van de gezamenlijke verwerking van gegevens aan een
      derde, over incidentele deelname van derden aan het overleg alsmede de criteria die daarvoor gelden en de werkwijze
      die daarbij wordt gevolgd.

      13 Indien de deelnemers van een Zorg- en Veiligheidshuis ten aanzien van een aangemelde of in behandeling genomen
      casus aanleiding hebben om te vermoeden dat die casus in overeenstemming is met het doel van het casusoverleg
      ten behoeve van de persoonsgerichte aanpak van radicalisering en terroristische activiteiten, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___, dan dragen die deelnemers er zorg voor dat de casus overeenkomstig [artikel 5, eerste lid, van die wet][ref20]
      voor overleg wordt aangemeld bij de politie, het openbaar ministerie of de burgemeester van de gemeente van
      verblijf van de betrokkene. Indien de casus op grond van artikel 5, vierde lid, van de Wet gegevensverwerking
      persoonsgerichte aanpak radicalisering en terroristische activiteiten in behandeling wordt genomen door het
      casusoverleg als bedoeld in artikel 2 van die wet, dan vindt het onderhavige artikel 2.31 geen verdere toepassing.


