  - number: '1.2'
    text: |-
      1 Deze wet heeft betrekking op het gezamenlijk verwerken van gegevens door deelnemers van een samenwerkingsverband
      in de zin van deze wet.

      2 Deze wet laat onverlet dat deelnemers van een samenwerkingsverband onderling gegevens kunnen blijven verwerken
      bij of krachtens een andere dan deze wet.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.2
  - number: '1.3'
    text: |-
      1 De deelnemers zijn de bij of krachtens deze wet aangewezen overheidsinstanties, overheidsorganen en private
      partijen.

      2 Aanwijzing van een overheidsinstantie of overheidsorgaan als deelnemer kan geschieden, indien deelname
      noodzakelijk is voor het doel van het samenwerkingsverband.

      3 Aanwijzing van een private partij als deelnemer kan geschieden, indien het doel van het samenwerkingsverband
      redelijkerwijze niet kan worden bereikt zonder deelname van deze private partij en indien tevens
      overheidsinstanties of overheidsorganen deelnemen.

      4 De aanwijzing als deelnemer brengt geen wijziging aan in de publiekrechtelijke taken en bevoegdheden van de
      deelnemers.

      5 De deelnemers vormen een samenwerkingsverband zonder rechtspersoonlijkheid.

      6 Bij algemene maatregel van bestuur kan de deelname worden beëindigd indien deelname niet meer noodzakelijk is
      voor het doel van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.3
  - number: '1.4'
    text: |-
      1 De deelnemers van een samenwerkingsverband zijn gezamenlijke verwerkingsverantwoordelijken als bedoeld in artikel
      26, eerste lid, van de Algemene verordening gegevensbescherming voor de verwerking van persoonsgegevens door het
      samenwerkingsverband.

      2 De deelnemers wijzen één van de functionarissen voor gegevensbescherming van de deelnemende overheidsinstanties
      of overheidsorganen aan die als coördinerend functionaris voor gegevensbescherming voor het samenwerkingsverband
      optreedt.

      3 De deelnemers wijzen personeel aan ten behoeve van de inzet in het samenwerkingsverband, dat in dienst blijft van
      de betreffende deelnemers. Een private deelnemer wijst ten behoeve van de inzet in het samenwerkingsverband slechts
      personen aan die niet tevens worden belast met commerciële werkzaamheden voor die private partij.

      4 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de werkwijze en de respectievelijke verantwoordelijkheden van de deelnemers, waaronder met betrekking tot
      de uitoefening van de rechten van betrokkene en hun respectieve verplichtingen om de informatie te verstrekken,
      bedoeld in de artikelen 13 en 14 van de Algemene verordening gegevensbescherming;

      b. de aanwijzing van een deelnemende overheidsinstantie of deelnemend overheidsorgaan als contactpunt
      voor betrokkenen voor de uitoefening van de rechten op grond van hoofdstuk III van de Algemene verordening
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.4
  - number: '1.5'
    text: |-
      1 Elke deelnemer verstrekt de bij of krachtens deze wet aangewezen categorieën van gegevens aan het
      samenwerkingsverband, voor zover dat noodzakelijk is voor het doel van het samenwerkingsverband, tenzij naar het
      oordeel van de deelnemer zwaarwegende redenen zich daartegen verzetten. Deze verplichting tot verstrekking is
      mede van toepassing indien een specifieke geheimhoudingsbepaling van toepassing is die het toelaat dat een ander
      wettelijk voorschrift daarop een uitzondering maakt.

      2 Voor zover een specifieke geheimhoudingsbepaling van toepassing is die het niet toelaat dat een ander
      wettelijk voorschrift daarop een uitzondering maakt, verstrekt een deelnemer de gegevens op grond van de volgende
      uitzonderingen:

      a. [artikel 20, derde lid, van de Wet politiegegevens][ref1];

      b. de [artikelen 8b][ref2], [39fa][ref3] en [51ca van de Wet justitiële en strafvorderlijke gegevens][ref4];

      c. [artikel 1:93ga van de Wet op het financieel toezicht][ref5];

      d. [artikel 63ea van de Wet toezicht accountantsorganisaties][ref6];

      e. [artikel 56a van de Wet toezicht trustkantoren 2018][ref7];

      f. de [artikelen 22d][ref8] en [23aa van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref9];

      g. [artikel 10i van de Sanctiewet 1977][ref10];

      h. [artikel 6a van de Wet toezicht financiële verslaggeving][ref11];

      i. [artikel 3.3 0a van de Wet handhaving consumentenbescherming][ref12];

      j. [artikel 208c van de Pensioenwet][ref13];

      k. [artikel 202c van de Wet verplichte beroepspensioenregeling][ref14].

      3 Het eerste lid is mede van toepassing op persoonsgegevens van strafrechtelijke aard.

      4 Onverminderd [artikel 20, derde lid, van de Wet politiegegevens][ref15], verstrekt de rijksbelastingdienst,
      bedoeld in [artikel 3 van de Algemene wet inzake rijksbelastingen][ref16], geen gegevens aan deelnemers voor zover
      dit private partijen zijn.


