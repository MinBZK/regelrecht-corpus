  - number: '2.24'
    text: |-
      1 Als samenwerkingsverbanden in de zin van deze wet worden aangewezen de Zorg- en Veiligheidshuizen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de territoriale werkgebieden
      van de Zorg- en Veiligheidshuizen.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.24
  - number: '2.25'
    text: |-
      De Zorg- en Veiligheidshuizen verwerken bij de behandeling van complexe casuïstiek uitsluitend gegevens ten aanzien
      van een betrokkene voor zover dat noodzakelijk is voor de uitoefening, afstemming en coördinatie van de inzet
      van de wettelijke taken en bevoegdheden waarmee de deelnemers zijn belast en daaraan gerelateerde noodzakelijke
      werkzaamheden op het terrein van strafrechtelijke en bestuursrechtelijke handhaving alsmede begeleiding en zorg- en
      hulpverlening in het belang van het voorkomen, verminderen en bestrijden van criminaliteit en ernstige overlast en
      het voorkomen en verminderen van onveilige situaties voor personen of binnen een gebied.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.25
  - number: '2.26'
    text: |-
      De Zorg- en Veiligheidshuizen verrichten met het oog op het doel, bedoeld in [artikel 2.25][ref1], de volgende
      activiteiten:

      a. het voeren van casusoverleggen, waarbij betrokken deelnemers afspraken maken over interventies die ten aanzien
      van een betrokkene worden ingezet, de uitvoering, evaluatie en zo nodig het bijstellen van die afspraken alsmede
      overleggen over afsluiting van de casus, ten behoeve van het bepalen en uitvoeren van een gezamenlijke strategie
      voor de uitoefening van de wettelijke taken en bevoegdheden waarmee de deelnemers zijn belast alsmede daaraan
      gerelateerde noodzakelijke werkzaamheden die worden verricht door de deelnemers;

      b. het vaststellen van lijsten met geprioriteerde casussen ten behoeve van het bepalen en uitvoeren van een
      gezamenlijke strategie voor de uitoefening van de wettelijke taken en bevoegdheden waarmee de deelnemers zijn
      belast alsmede daaraan gerelateerde noodzakelijke werkzaamheden die worden verricht door de deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.25
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.26
