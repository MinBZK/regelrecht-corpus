  - number: '3.1'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, indien de totstandkoming van een wet niet kan worden afgewacht,
      andere samenwerkingsverbanden worden aangewezen als samenwerkingsverband in de zin van deze wet, voor een bij deze
      algemene maatregel van bestuur omschreven doelstelling van zwaarwegend algemene belang inzake:

      a. het voorkomen en bestrijden van ernstige vormen van criminaliteit;

      b. het voorkomen en bestrijden van grootschalig of systematisch onrechtmatig gebruik van overheidsgelden en
      overheidsvoorzieningen; of

      c. het voorkomen en bestrijden van grootschalige of systematische ontduiking van wettelijke verplichtingen tot
      betaling van belastingen, retributies en rechten bij in- en uitvoer.

      2 Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Tweede Kamer der
      Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken.
      Wordt het voorstel tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van
      inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel3.1
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de aanwijzing van overheidsinstanties en overheidsorganen als deelnemer;

      b. de aanwijzing van private partijen als deelnemer, onder de voorwaarde, bedoeld in
      [artikel 1.3, derde lid][ref1];

      c. de te verstrekken categorieën van gegevens;

      d. de grondslagen voor gezamenlijke verwerking van gegevens en de activiteiten die het samenwerkingsverband
      verricht, waaronder geautomatiseerde gegevensanalyse;

      e. de verstrekking van resultaten aan derden overeenkomstig [artikel 1.7, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0049962#Artikel1.7
