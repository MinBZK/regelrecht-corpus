  - number: '2.29'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming,
      kunnen de deelnemers van de Zorg- en Veiligheidshuizen, voor zover dit noodzakelijk is voor het
      doel, bedoeld in [artikel 2.25][ref1], persoonsgegevens over gezondheid verwerken. De deelnemers
      kunnen voor het doel, bedoeld in artikel 2.25, gebruikmaken van het burgerservicenummer, bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref2].

      2 In afwijking van [artikel 1.5, eerste lid][ref3], verstrekt een deelnemer
      waarop het bepaalde in [artikel 457 van Boek 7 van het Burgerlijk Wetboek][ref4],
      [artikel 88 van de Wet op de beroepen in de individuele gezondheidszorg][ref5] of
      [artikel 7.3.11 van de Jeugdwet][ref6] van toepassing is, uitsluitend gegevens aan een Zorg- en Veiligheidshuis
      indien betrokkene daartoe uitdrukkelijk toestemming heeft gegeven, behoudens de gevallen waarin enig wettelijk
      voorschrift een deelnemer verplicht gegevens te verstrekken of enig wettelijk voorschrift toestaat gegevens zonder
      uitdrukkelijke toestemming van betrokkene te verstrekken of de verstrekking van gegevens noodzakelijk is uit het
      oogpunt van goed hulpverlenerschap.

      3 Een deelnemer die op grond van [artikel 1.5, eerste lid][ref7], de in artikel 1.5, tweede lid, genoemde
      bepalingen, of overeenkomstig [artikel 2.29, tweede lid][ref8], gegevens verstrekt aan het Zorg- en Veiligheidshuis
      kan voorwaarden en beperkingen stellen aan het verstrekken van de resultaten aan deelnemers of derden op grond van
      [artikel 1.7, eerste en tweede lid][ref9] en [artikel 2.31, elfde lid][ref10].

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van verwerking
      van bijzondere categorieën van persoonsgegevens en het burgerservicenummer.


