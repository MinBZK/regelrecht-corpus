  - number: '2.16'
    text: |-
      1 Als samenwerkingsverbanden in de zin van deze wet worden aangewezen de Regionale Informatie- en Expertisecentra.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de territoriale werkgebieden
      van de Regionale Informatie- en Expertisecentra.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.16
  - number: '2.17'
    text: |-
      De Regionale Informatie- en Expertisecentra verwerken uitsluitend gegevens voor zover dat noodzakelijk is voor
      de uitoefening van de wettelijke taken en bevoegdheden van de deelnemers op het terrein van strafrechtelijke,
      bestuursrechtelijke en fiscaalrechtelijke handhaving in het belang van de bestrijding van georganiseerde
      criminaliteit.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.17
  - number: '2.18'
    text: |-
      1 De Regionale Informatie- en Expertisecentra verrichten met oog op het doel, bedoeld in [artikel 2.17][ref1], de
      volgende activiteiten ten behoeve van het bepalen en uitvoeren van gezamenlijke strategieën voor de uitoefening van
      de wettelijke taken en de inzet van hun wettelijke bevoegdheden door de deelnemers:

      a. het aanwijzen en analyseren van handhavingsknelpunten;

      b. het voeren van casusoverleggen;

      c. het verrichten van gebiedscans en thematische scans bij misstanden in maatschappelijke sectoren en publieke
      voorzieningen die vatbaar zijn voor innesteling van georganiseerde criminaliteit.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de activiteiten,
      bedoeld in het eerste lid, en kunnen aanvullende activiteiten, waaronder geautomatiseerde gegevensanalyse, worden
      aangewezen, voor zover die noodzakelijk zijn voor het doel, bedoeld in [artikel 2.17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0049962#Artikel2.17
