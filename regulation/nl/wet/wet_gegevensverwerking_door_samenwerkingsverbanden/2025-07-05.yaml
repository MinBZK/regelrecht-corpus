  - number: '1.6'
    text: |-
      1 Het samenwerkingsverband verwerkt gezamenlijk gegevens ten behoeve van een bij of krachtens deze wet vastgestelde
      doelstelling van zwaarwegend algemeen belang.

      2 Het eerste lid is mede van toepassing op persoonsgegevens van strafrechtelijke aard.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.6
  - number: '1.7'
    text: |-
      1 Tenzij naar het oordeel van een of meer deelnemers op wier gegevens de resultaten zijn gebaseerd zwaarwegende
      redenen zich daartegen verzetten, worden de resultaten van de verwerking binnen het samenwerkingsverband verstrekt
      aan een of meer deelnemers, voor zover de verstrekking noodzakelijk is voor:

      a. de vervulling van een publiekrechtelijke taak die aan de deelnemer is opgedragen, wanneer deze taak verenigbaar
      is met het doel van het samenwerkingsverband, of

      b. de behartiging van de gerechtvaardigde belangen of uitvoering van wettelijke verplichtingen van een private
      deelnemer, wanneer deze belangen of verplichtingen verenigbaar zijn met het doel van het samenwerkingsverband.

      2 Tenzij een deelnemer daartegen bezwaar heeft, kunnen de resultaten van de verwerking binnen het
      samenwerkingsverband aan een derde worden verstrekt, voor zover de verstrekking bij of krachtens deze
      wet van een grondslag is voorzien, de verstrekking door de rechtmatigheidsadviescommissie, bedoeld in
      [artikel 1.8, zesde lid][ref1], op rechtmatigheid is getoetst en de verstrekking noodzakelijk is voor:

      a. de vervulling van een publiekrechtelijke taak die aan de derde is opgedragen, wanneer deze taak verenigbaar is
      met het doel van het samenwerkingsverband, of

      b. de behartiging van de gerechtvaardigde belangen of uitvoering van wettelijke verplichtingen van een private
      derde, wanneer deze belangen of verplichtingen verenigbaar zijn met het doel van het samenwerkingsverband.

      3 Voor zover de verstrekking van bijzondere categorieën persoonsgegevens en persoonsgegevens van strafrechtelijke
      aard aan derden is toegestaan, vindt deze verstrekking uitsluitend plaats nadat de deelnemers die deze
      persoonsgegevens aan het samenwerkingsverband hebben verstrekt, hiermee hebben ingestemd.

      4 Degenen die op grond van het eerste of het tweede lid resultaten ontvangen, koppelen daarvan ten minste jaarlijks
      de effectiviteit en de bruikbaarheid terug aan het samenwerkingsverband, en, indien de ontvangst van de resultaten
      niet tot vervolgacties heeft geleid, de redenen hiervan.

      5 De deelnemers evalueren periodiek de gehanteerde werkwijze en, indien van toepassing, de gehanteerde patronen
      en indicatoren, aan de hand van de ontvangen terugkoppelingen, bedoeld in het vierde lid, ten behoeve van de
      verbetering van de patronen en indicatoren.

      6 De resultaten bedoeld in het eerste en tweede lid, worden, voor zover zij mede gebaseerd zijn op gegevens van
      de rijksbelastingdienst, met uitzondering van de Fiscale Inlichtingen- en Opsporingsdienst, niet aan een private
      partij verstrekt in het kader van een gerechtvaardigd belang als bedoeld in het eerste lid, onderdeel b, en het
      tweede lid, onderdeel b.

      7 Dit artikel is mede van toepassing op persoonsgegevens van strafrechtelijke aard.

      8 De resultaten van de verwerking binnen het samenwerkingsverband kunnen worden verstrekt aan een ander
      samenwerkingsverband als bedoeld in deze wet, voor zover de verstrekking noodzakelijk is voor het doel van het
      ontvangende samenwerkingsverband en uitsluitend voor zover de deelnemers die de betreffende persoonsgegevens
      aan het samenwerkingsverband hebben verstrekt, daarmee instemmen. Ter vaststelling of de betrokkene bekend is
      bij een ander samenwerkingsverband, kunnen de deelnemers van de beide samenwerkingsverbanden identificerende en
      contactgegevens alsmede het burgerservicenummer van die betrokkene uitwisselen.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.8
