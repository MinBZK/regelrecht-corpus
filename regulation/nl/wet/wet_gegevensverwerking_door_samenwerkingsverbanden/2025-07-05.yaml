  - number: '2.22'
    text: |-
      1 Met het oog op de uitvoering van de activiteiten, bedoeld in [artikel 2.18][ref1], zijn de door de deelnemers aan
      het Regionaal Informatie- en Expertisecentrum te verstrekken categorieën gegevens:

      a. ten aanzien van de betrokkene of betrokkenen over wie of de rechtspersoon of rechtspersonen waarover een signaal
      is ontvangen:

      1° - identificerende en contactgegevens;
        - het burgerservicenummer;
        - gegevens betreffende de verblijfsstatus;
        - gegevens omtrent de woonsituatie;
        - voertuiggegevens;
        - financiële gegevens;
        - kadastrale gegevens;
        - bedrijfsgegevens;
        - inkomensgegevens;
        - gegevens betreffende zakelijke relaties;
        - gegevens betreffende vergunning- of subsidieaanvragen, hierop genomen besluiten en juridische procedures;
        - gegevens inzake toezicht en handhaving alsmede getroffen bestuurlijke maatregelen;

      2° - fiscale gegevens;
        - politiegegevens in de zin van de [artikelen 8][ref2] en [13 van de Wet politiegegevens][ref3] die krachtens
      [artikel 20, derde lid, van die wet][ref4] aan de deelnemers worden verstrekt;
        - justitiële en strafvorderlijke gegevens en tenuitvoerleggingsgegevens die door het openbaar ministerie op grond
      van de [artikelen 8b][ref5], [39fa][ref6] en [51ca van de Wet justitiële en strafvorderlijke gegevens][ref7] aan
      de deelnemers worden verstrekt;
        - gegevens over het seksueel gedrag of seksuele gerichtheid;

      3° - politiegegevens in de zin van de [artikelen 9][ref8] en
      [10, eerste lid, onderdelen a en c, van de Wet politiegegevens][ref9] die op grond van
      [artikel 20, derde lid, van die wet][ref10] aan de deelnemers worden verstrekt. b. ten aanzien van personen uit
      de directe kring van betrokkene of betrokkenen of personen die in direct verband staan met de rechtspersoon of
      rechtspersonen: 1°. dezelfde categorieën gegevens als genoemd in onderdeel a, onder 1°; 2°. dezelfde categorieën
      gegevens als genoemd in onderdeel a, onder 2°; 3°. dezelfde categorieën gegevens als genoemd in onderdeel a, onder
      3°; c. ten aanzien van medewerkers van deelnemers:
        - identificerende en contactgegevens;
        - autorisatieniveau;
        - de wijze waarop deze medewerker is gescreend.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over de categorieën van gegevens en de
      concretisering daarvan, bedoeld in het eerste lid, de bronnen van waaruit die gegevens afkomstig zijn en kunnen
      aanvullende categorieën gegevens worden aangewezen, voor zover dat noodzakelijk is voor het doel, bedoeld in
      [artikel 2.17][ref11]. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.18
