  - number: '2.32'
    text: |-
      1 De deelnemers, bedoeld in [artikel 2.27, eerste lid][ref1], stellen objectieve criteria vast op grond waarvan de
      casus van een betrokkene op de lijst met geprioriteerde casussen van een Zorg- en Veiligheidshuis wordt geplaatst
      en maken deze criteria openbaar.

      2 De deelnemers, bedoeld in [artikel 2.27, eerste lid][ref2], kunnen gegevens, bedoeld in [artikel 2.30][ref3],
      verwerken om vast te stellen welke casussen voldoen aan de vastgestelde criteria en welke casussen met het oog op
      het doel, bedoeld in [artikel 2.25][ref4], op de lijst geplaatst dienen te worden.

      3 Indien de casus van een betrokkene op de lijst wordt geplaatst, wordt de casus behandeld als een melding van een
      casus aan het Zorg- en Veiligheidshuis die in overeenstemming is met het doel, bedoeld in [artikel 2.25][ref5], en
      is [artikel 2.31, derde tot en met twaalfde lid][ref6], van overeenkomstige toepassing.

      4 Zodra opname op de lijst niet of niet langer noodzakelijk is voor het doel, bedoeld in [artikel 2.25][ref7],
      worden de casus van betrokkene en alle op hem betrekking hebbende gegevens onverwijld van de lijst verwijderd.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over deze bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.27
