  - number: '2.20'
    text: |-
      1 De deelnemers van een Regionaal Informatie- en Expertisecentrum kunnen, ter uitvoering van de activiteiten,
      bedoeld in [artikel 2.18][ref1], gegevens uitwisselen met de deelnemers van de andere Regionale Informatie- en
      Expertisecentra voor zover dat noodzakelijk is voor het doel, bedoeld in [artikel 2.17][ref2].

      2 Verstrekking van bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard aan de
      deelnemers van een ander Regionaal Informatie- en Expertisecentrum vindt uitsluitend plaats nadat de deelnemer of
      deelnemers die deze persoonsgegevens aan het Regionaal Informatie- en Expertisecentrum heeft of hebben verstrekt,
      hiermee heeft of hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.18
      [ref2]: https://wetten.overheid.nl/BWBR0049962#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.20
    references:
