  - number: '2.4'
    text: |-
      1 Met het oog op de uitvoering van de activiteiten, bedoeld in [artikel 2.5][ref1], zijn de door de deelnemers te
      verstrekken categorieën gegevens:

      a. personalia en andere identificerende gegevens van de betrokken natuurlijke persoon of rechtspersoon, waaronder
      persoonsnummers;

      b. identificerende gegevens betreffende vermogensbestanddelen;

      c. gegevens die zicht geven op de relatie tussen de betrokken natuurlijke persoon of rechtspersoon en zijn
      vermogensbestanddelen;

      d. gegevens betreffende eerdere onrechtmatigheid in de relatie tussen de betrokken natuurlijke persoon of
      rechtspersoon en vermogensbestanddelen;

      e. gegevens die zicht geven op relevante relaties of contacten van natuurlijke personen of rechtspersonen die
      mogelijk in verband gebracht kunnen worden met mogelijke onverklaarbare of criminele vermogensbestanddelen of
      witwasconstructies, met mogelijke financiering van terrorisme of andere financieel-economische criminaliteit;

      f. gegevens die zicht geven op het opzetten van mogelijke constructies voor witwassen of financiering van
      terrorisme of andere financieel-economische criminaliteit;

      g. gegevens die relevant kunnen zijn voor de beoordeling van de betrouwbaarheid van natuurlijke personen of
      rechtspersonen door de toezichthouders;

      h. politiegegevens die op grond van [artikel 20, derde lid, van de Wet politiegegevens][ref2] worden verstrekt;

      i. justitiële en strafvorderlijke gegevens die op grond van de [artikelen 8b][ref3] en
      [39fa van de Wet justitiële en strafvorderlijke gegevens][ref4] worden verstrekt.

      2 Bij algemene maatregel van bestuur kunnen categorieën van gegevens worden aangevuld en kunnen nadere regels
      worden gesteld over de categorieën van gegevens, bedoeld in het eerste lid, en de bronnen van waaruit die gegevens
      afkomstig zijn. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel39fa
