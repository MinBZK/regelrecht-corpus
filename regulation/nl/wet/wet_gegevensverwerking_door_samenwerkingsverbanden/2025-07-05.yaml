  - number: '2.21'
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming kunnen de Regionale
      Informatie- en Expertisecentra, voor zover dit noodzakelijk is voor het doel, bedoeld in [artikel 2.17][ref1],
      persoonsgegevens met betrekking tot iemands seksueel gedrag of seksuele gerichtheid verwerken. De deelnemers
      kunnen voor het doel, bedoeld in artikel 2.17, gebruikmaken van het burgerservicenummer, bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref2].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van verwerking
      van bijzondere categorieën van persoonsgegevens en het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.21
