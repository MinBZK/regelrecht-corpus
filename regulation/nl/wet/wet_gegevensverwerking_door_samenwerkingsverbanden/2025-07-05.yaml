        hoofdstuk: '1'
  - number: '1.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan alle
      verwerkingen van gegevens op grond van deze wet.

      2 Uitsluitend door de deelnemers geautoriseerde personen hebben toegang tot de systemen waarin de deelnemers
      gezamenlijk persoonsgegevens verwerken. De deelnemers onderhouden een systeem van autorisaties dat voldoet aan
      de vereisten van zorgvuldigheid en evenredigheid. Geautoriseerd worden slechts personen die zijn aangewezen ten
      behoeve van de inzet in het samenwerkingsverband en die zijn belast met:

      a. de uitvoering van de gegevensverwerking voor de doelen van het samenwerkingsverband,

      b. de toetsing op rechtmatigheid, of

      c. het onderhoud of de ondersteuning van de systemen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de betrouwbaarheidsvereisten
      aan geautoriseerde personen als bedoeld in het tweede lid.

      4 De deelnemers dragen zorg voor de vastlegging langs elektronische weg (logging) van bij of krachtens algemene
      maatregel van bestuur te beschrijven verwerkingen van persoonsgegevens in geautomatiseerde systemen van het
      samenwerkingsverband. De vastgelegde gegevens worden uitsluitend gebruikt voor de controle van de rechtmatigheid
      van de gegevensverwerking, voor interne controles, ter waarborging van de integriteit en de beveiliging van de
      persoonsgegevens en voor gerechtelijke procedures.

      5 De deelnemers treffen passende organisatorische maatregelen om te waarborgen dat per geval de gegevens enkel voor
      het vooraf vastgestelde doel worden verwerkt.

      6 De deelnemers stellen een rechtmatigheidsadviescommissie in, die tot taak heeft de rechtmatigheid van de
      verwerking van persoonsgegevens in het samenwerkingsverband structureel te beoordelen bij nieuwe verwerkingen
      en wijziging in verwerkingen en om voorstellen aan het samenwerkingsverband te doen om onrechtmatigheden op
      te lossen. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de werkwijze
      en de samenstelling van de rechtmatigheidsadviescommissie, de wijze van benoeming en ontslag van haar
      leden en de instelling van één gezamenlijke rechtmatigheidsadviescommissie ten behoeve van een cluster van
      samenwerkingsverbanden.

      7 De persoonsgegevens die door het samenwerkingsverband gezamenlijk worden verwerkt, worden vernietigd of
      geanonimiseerd zodra zij niet langer noodzakelijk zijn voor het doel van het samenwerkingsverband, en worden
      in ieder geval uiterlijk vijf jaar na de datum van eerste verwerking verwijderd uit de systemen van het
      samenwerkingsverband of geanonimiseerd, tenzij een wettelijk voorschrift daaraan in de weg staat of de verwerking
      noodzakelijk is voor de instelling, uitoefening of onderbouwing van een rechtsvordering. In bijzondere gevallen
      en voor zover dat noodzakelijk is voor het doel van het samenwerkingsverband kunnen persoonsgegevens die
      worden bewaard, in opdracht van de deelnemers, na verkregen instemming van de deelnemer die de betreffende
      persoonsgegevens heeft verstrekt, ter beschikking worden gesteld voor hernieuwde verwerking.

      8 Binnen het samenwerkingsverband worden persoonsgegevens uitsluitend verwerkt in systemen waarvoor een adequaat
      beveiligingsniveau geldt. Daarbij worden persoonsgegevens beveiligd ten minste volgens door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties vastgestelde richtlijnen.

      9 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de waarborgen, waaronder
      opleidingseisen voor personen die zijn aangewezen ten behoeve van de inzet in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.8
  - number: '1.9'
    text: |-
      1 De deelnemers dragen zorg voor adequate en uniforme technische en organisatorische maatregelen in verband met de
      bevordering van de kwaliteit van de gezamenlijke geautomatiseerde gegevensanalyse alsmede ter bevordering van de
      juistheid en de volledigheid van de gegevens die daarbij worden verwerkt.

      2 Een resultaat van geautomatiseerde gegevensanalyse kan uitsluitend aan een deelnemer of derde worden verstrekt
      na menselijke tussenkomst waarbij wordt beoordeeld of het resultaat op zorgvuldige wijze tot stand is gekomen.
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van deze
      tussenkomst.

      3 Indien een samenwerkingsverband gezamenlijke geautomatiseerde gegevensanalyse verricht, verschaft het aan het
      publiek op toegankelijke wijze uitleg over de gehanteerde patronen en indicatoren of andere onderliggende logica.

      4 Mocht gedurende de geautomatiseerde gegevensanalyse blijken dat persoonsgegevens onjuist zijn, dan worden deze
      onverwijld gecorrigeerd en wordt een melding gedaan aan de organisatie waarvan de persoonsgegevens afkomstig zijn,
      opdat ook in haar gegevensbestanden kan worden gecontroleerd of de persoonsgegevens juist zijn geregistreerd en na
      validatie de gegevens kunnen worden gecorrigeerd.

      5 Indien binnen een samenwerkingsverband persoonsgegevens geautomatiseerd geanalyseerd worden, vindt dit op
      zodanige wijze plaats dat de persoonsgegevens in bij of krachtens algemene maatregel van bestuur vastgestelde fasen
      van de gegevensanalyse niet meer aan een specifieke betrokkene kunnen worden gekoppeld zonder dat er aanvullende
      gegevens worden gebruikt. Zij laten deze aanvullende gegevens apart bewaren en nemen technische en organisatorische
      maatregelen om ervoor te zorgen dat de persoonsgegevens niet aan een geïdentificeerde of identificeerbare
      natuurlijke persoon worden gekoppeld. De deelnemers koppelen alleen die gegevens opnieuw aan de persoon wanneer
      die op basis van de resultaten van een gegevensanalyse duiden op een verhoogd risico met betrekking tot het doel
      waarvoor het samenwerkingsverband gegevens verwerkt.

      6 Bij de geautomatiseerde gegevensanalyse door het samenwerkingsverband worden geen algoritmes gehanteerd waarvan
      de uitkomsten niet navolgbaar en controleerbaar zijn.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.9
  - number: '1.10'
    text: |-
      1 Het samenwerkingsverband doet de uitvoering van de bij of krachtens deze wet gegeven regels en de Algemene
      verordening gegevensbescherming controleren door middel van het periodiek doen verrichten van privacy audits.

      2 Het samenwerkingsverband zendt een afschrift van de controleresultaten van de privacy audits aan de Autoriteit
      persoonsgegevens.

      3 Indien uit de controleresultaten blijkt dat niet wordt voldaan aan het bij of krachtens deze wet bepaalde, laat
      het samenwerkingsverband binnen een jaar een hercontrole uitvoeren op die onderdelen die niet voldeden aan de
      gestelde voorwaarden. Het tweede lid is van overeenkomstige toepassing.

      4 Een ieder die betrokken is bij een controle als bedoeld in dit artikel is verplicht tot geheimhouding van de
      persoonsgegevens waarover hij de beschikking heeft gekregen, behoudens voor zover enig wettelijk voorschrift hem
      tot mededeling verplicht of zijn taak daartoe noodzaakt.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inhoud en wijze van
      uitvoering van controle, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.10
  - number: '1.11'
    text: |-
      1 Eenieder die betrokken is bij de werkzaamheden van het samenwerkingsverband en daarbij de beschikking krijgt
      over persoonsgegevens, en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van
      die gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding van die gegevens, behoudens voor zover
      [artikel 1.7][ref1] of enig ander wettelijk voorschrift voorziet in de bevoegdheid of verplichting om de gegevens
      te verstrekken of voor zover de gegevensverstrekking noodzakelijk is voor het afleggen van verantwoording door een
      medewerker aan de deelnemer die hem heeft aangewezen voor de inzet in het samenwerkingsverband.

      2 De ontvanger van het resultaat van de verwerking voor wie niet reeds uit hoofde van ambt, beroep of wettelijk
      voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding, behoudens
      voor zover enig wettelijk voorschrift voorziet in de bevoegdheid of verplichting om de gegevens te verstrekken.

      3 Het eerste lid is van overeenkomstige toepassing op andere gegevens waarvan degene die betrokken is bij de
      werkzaamheden van het samenwerkingsverband het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0049962
        artikel: '1.7'
        hoofdstuk: '1'
  - number: '1.12'
    text: |-
      1 Een samenwerkingsverband stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de op grond van
      [artikel 1.7, vierde lid][ref1], ontvangen terugkoppelingen van de effectiviteit en de bruikbaarheid van
      de resultaten, voor zover de bekendmaking van deze gegevens de verwezenlijking van de doeleinden van het
      samenwerkingsverband niet onmogelijk dreigt te maken of ernstig in het gedrang dreigt te brengen. Een cluster van
      samenwerkingsverbanden kan beslissen om één gezamenlijk jaarverslag uit te brengen.

      2 Het jaarverslag wordt bekendgemaakt door plaatsing op internet.


      [ref1]: https://wetten.overheid.nl/BWBR0049962#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0049962
        artikel: '1.7'
        hoofdstuk: '1'
  - number: '2.1'
    text: Als samenwerkingsverband in de zin van deze wet wordt aangewezen het Financieel Expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.1
  - number: '2.2'
    text: |-
      1 Met het oog op risico’s van inbreuken op de integriteit van het financiële stelsel, of onderdelen daarvan,
      verwerkt het Financieel Expertisecentrum gegevens, voor zover dat noodzakelijk is voor de uitoefening van
      publiekrechtelijke taken en bevoegdheden van de deelnemers.

      2 Onder risico’s als bedoeld in het eerste lid worden verstaan risico’s met betrekking tot de integriteit van
      natuurlijke of rechtspersonen die binnen het financiële stelsel werkzaam zijn, alsmede risico’s als gevolg van het
      doen en nalaten van partijen binnen het financiële stelsel of onderdelen daarvan, met betrekking tot financieel-
      economische criminaliteit en andere ernstige vormen van criminaliteit of van terrorismefinanciering.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.2
  - number: '2.3'
    text: |-
      1 Als deelnemers van het Financieel Expertisecentrum worden aangewezen:

      a. het openbaar ministerie, voor de uitoefening van de in
      [artikel 124 van de Wet op de rechterlijke organisatie][ref1] opgedragen taak en de daaruit voortvloeiende
      bevoegdheden;

      b. de politie, voor de uitoefening van de taak bedoeld in [artikel 3 van de Politiewet 2012][ref2] en de daaruit
      voortvloeiende bevoegdheden;

      c. de Financiële inlichtingen eenheid, voor de taak, bedoeld in
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3];

      d. de rijksbelastingdienst, met in begrip van alle onderdelen daarvan, bedoeld in de op
      [artikel 3 van de Algemene wet inzake rijksbelastingen][ref4] gebaseerde ministeriële regeling, voor
      het uitoefenen van de wettelijke taken en bevoegdheden bij of krachtens de belastingwet, genoemd in
      [artikel 2, eerste lid, onderdeel a, van voornoemde wet][ref5], de [Invorderingswet 1990][ref6] en het toezicht op
      de naleving van de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref7];

      e. de Fiscale Inlichtingen- en Opsporingsdienst, voor de uitoefening van de taken, bedoeld in
      [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref8], en de daaruit voortvloeiende bevoegdheden;

      f. de Stichting Autoriteit Financiële Markten, voor de uitoefening van haar wettelijke
      taken en bevoegdheden bij of krachtens de [Wet handhaving consumentenbescherming][ref9],
      [Wet op het financieel toezicht][ref10], [Wet ter voorkoming van witwassen en financieren van terrorisme][ref11],
      [Wet toezicht accountantsorganisaties][ref12], [Wet toezicht financiële verslaggeving][ref13],
      [Pensioenwet][ref14], [Wet verplichte beroepspensioenregeling][ref15], de [Sanctiewet 1977][ref16] en bindende
      rechtshandelingen van de Europese Unie;

      g. De Nederlandsche Bank N.V., voor de uitoefening van zijn wettelijke taken en bevoegdheden
      bij of krachtens de [Bankwet 1998][ref17], [Wet op het financieel toezicht][ref18],
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref19], [Wet toezicht trustkantoren 2018][ref20],
      [Pensioenwet][ref21], [Wet verplichte beroepspensioenregeling][ref22], de [Sanctiewet 1977][ref23],
      [Wet toezicht effectenverkeer 1995][ref24], en bindende rechtshandelingen van de Europese Unie;

      h. bij of krachtens algemene maatregel van bestuur aangewezen overheidsorganen of overheidsinstanties en private
      partijen, voor zover dat noodzakelijk is voor het doel van het samenwerkingsverband en het om daarbij beschreven
      specifieke verwerkingen of onderdelen daarvan gaat.

      2 De voordracht voor een krachtens het eerste lid, onder h, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      3 Een krachtens het eerste lid, onder h, vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt
      een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken
      of indien een van de Kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene
      maatregel van bestuur ingetrokken.


