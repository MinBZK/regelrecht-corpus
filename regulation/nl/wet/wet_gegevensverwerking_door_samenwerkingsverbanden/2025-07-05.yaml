  - number: '2.9'
    text: Als samenwerkingsverband in de zin van deze wet wordt aangewezen de Infobox Crimineel en Onverklaarbaar Vermogen.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.9
  - number: '2.10'
    text: |-
      Met het oog op het in kaart brengen van onverklaarbaar of crimineel vermogen, het bestrijden van witwas- of
      fraudeconstructies, het kunnen innen van overheidsvorderingen die oninbaar dreigen te worden en het uitoefenen van
      toezicht op de goede werking van de markt, verwerkt de Infobox Crimineel en Onverklaarbaar Vermogen in opdracht van
      een of meer deelnemers gegevens voor zover dat noodzakelijk is voor de uitoefening van publiekrechtelijke taken en
      bevoegdheden van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0049962/2025-07-05#Artikel2.10
  - number: '2.11'
    text: |-
      1 Als deelnemers van de Infobox Crimineel en Onverklaarbaar Vermogen worden aangewezen:

      a. het openbaar ministerie, voor de uitoefening van de in
      [artikel 124 van de Wet op de rechterlijke organisatie][ref1] opgedragen taak en de daaruit voortvloeiende
      bevoegdheden;

      b. de politie, voor de uitoefening van de taak bedoeld in [artikel 3 van de Politiewet 2012][ref2] en de daaruit
      voortvloeiende bevoegdheden;

      c. de Rijksrecherche, voor de uitoefening van de taak bedoeld in [artikel 3 van de Politiewet 2012][ref3] en de
      daaruit voortvloeiende bevoegdheden;

      d. de Financiële inlichtingen eenheid, voor de taak, bedoeld in
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4];

      e. het Centraal Justitieel Incassobureau, ter uitoefening van de taken omtrent het verrichten van innings- en
      incassowerkzaamheden en de daaruit voortvloeiende bevoegdheden;

      f. de rijksbelastingdienst, met in begrip van alle onderdelen daarvan, bedoeld in de op
      [artikel 3 van de Algemene wet inzake rijksbelastingen][ref5] gebaseerde ministeriële regeling, voor
      het uitoefenen van de wettelijke taken en bevoegdheden bij of krachtens de belastingwet, genoemd in
      [artikel 2, eerste lid, onderdeel a, van voornoemde wet][ref6], de [Invorderingswet 1990][ref7], het toezicht
      op de naleving van de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref8], de wettelijke
      taken en bevoegdheden bij of krachtens de [Algemene douanewet][ref9] en het Douanewetboek van de Unie en de
      [Algemene wet inkomensafhankelijke regelingen][ref10];

      g. de bijzondere opsporingsdiensten, bedoeld in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref11],
      voor de uitoefening van de taken, bedoeld in [artikel 3 van die wet][ref12], en de daaruit voortvloeiende
      bevoegdheden;

      h. de Autoriteit Consument en Markt, voor de uitoefening van het toezicht op de naleving van de
      [Mededingingswet][ref13] en de overige taken die haar bij of krachtens de wet zijn opgedragen, en de daaruit
      voortvloeiende bevoegdheden;

      i. De Nederlandsche Bank N.V., voor de uitoefening van zijn wettelijke taken en bevoegdheden
      bij of krachtens de [Bankwet 1998][ref14], [Wet op het financieel toezicht][ref15],
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref16], [Wet toezicht trustkantoren 2018][ref17],
      [Pensioenwet][ref18], [Wet verplichte beroepspensioenregeling][ref19], de [Sanctiewet 1977][ref20],
      [Wet toezicht effectenverkeer 1995][ref21], en bindende rechtshandelingen van de Europese Unie;

      j. bij of krachtens algemene maatregel van bestuur aangewezen overheidsinstanties en overheidsorganen die belast
      zijn met toezicht op de naleving, opsporing of de inning van overheidsvorderingen.

      2 De voordracht voor een krachtens het eerste lid, onder j, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      3 Een krachtens het eerste lid, onder j, vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers
      of door ten minste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt
      gegeven dat de inwerkingtreding van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt
      een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken
      of indien een van de Kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene
      maatregel van bestuur ingetrokken.


