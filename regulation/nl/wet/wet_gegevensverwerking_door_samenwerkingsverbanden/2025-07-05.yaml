  - number: '2.30'
    text: |-
      1 Met het oog op de uitvoering van de activiteiten, bedoeld in [artikel 2.26][ref1], zijn de door de deelnemers aan
      het Zorg- en Veiligheidshuis te verstrekken categorieën gegevens:

      a. ten aanzien van de betrokkene of betrokkenen waarop een melding als bedoeld in [artikel 2.31][ref2] betrekking
      heeft dan wel die voldoet of voldoen aan de criteria voor plaatsing op de lijst met geprioriteerde casussen,
      bedoeld in [artikel 2.32, eerste lid][ref3]:

        - identificerende en contactgegevens;
        - het burgerservicenummer;
        - gegevens omtrent de woonsituatie;
        - financiële gegevens;
        - inkomensgegevens;
        - persoonsgegevens over gezondheid;
        - politiegegevens in de zin van de [artikelen 8][ref4] en [13 van de Wet politiegegevens][ref5] die krachtens
      [artikel 20, derde lid, van die wet][ref6] aan de deelnemers worden verstrekt;
        - justitiële en strafvorderlijke gegevens en tenuitvoerleggingsgegevens die door het openbaar ministerie op grond
      van de [artikelen 8b][ref7], [39fa][ref8] en [51ca van de Wet justitiële en strafvorderlijke gegevens][ref9] aan
      de deelnemers worden verstrekt;
        - gegevens betreffende relaties met gezinsleden en andere directe sociale contacten;
        - gegevens inzake toezicht en handhaving alsmede getroffen bestuurlijke maatregelen of opgelegde beperkingen;
        - gegevens over geïndiceerde en toegekende zorg of voorzieningen in het sociaal domein;
        - gegevens over begeleiding, zorg en hulpverlening;

      b. ten aanzien van natuurlijke personen uit de directe kring van betrokkene:

      dezelfde categorieën gegevens als genoemd in onderdeel a;

      c. ten aanzien van medewerkers van deelnemers en medewerkers van andere instanties, overheidsorganen of
      instellingen die betrokken zijn bij de begeleiding, zorg- en hulpverlening van betrokkene: identificerende en
      contactgegevens.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de categorieën van gegevens, bedoeld
      in het eerste lid, de concretisering daarvan, de bronnen van waaruit die gegevens afkomstig zijn, en kunnen
      aanvullende categorieën gegevens worden aangewezen, voor zover dat noodzakelijk is voor het doel, bedoeld in
      [artikel 2.25][ref10]. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


