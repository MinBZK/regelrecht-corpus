  - number: '2.23'
    text: |-
      1 Een deelnemer kan bij een Regionaal Informatie- en Expertisecentrum een signaal dat verband houdt met het doel,
      bedoeld in [artikel 2.17][ref1], melden en daartoe gegevens verwerken.

      2 De deelnemers beoordelen of het signaal in overeenstemming is met het doel, bedoeld in [artikel 2.17][ref2].

      3 Bij de afweging of een signaal voldoende aanleiding geeft tot gezamenlijke verwerking van gegevens in het
      Regionaal Informatie- en Expertisecentrum, toetsen de deelnemers aan:

      a. het type signaal;

      b. het aantal signalen alsmede de aard en omvang daarvan;

      c. het gewicht van het signaal en de reeds gepleegde interventies ter zake van het signaal of de signalen, en

      d. het aantal deelnemers dat overeenkomstige signalen meldt, alsmede het verband tussen de signalen.

      4 Indien dit signaal naar het oordeel van de deelnemers aanleiding geeft tot het verrichten van een activiteit,
      bedoeld in [artikel 2.18][ref3], in het Regionaal Informatie- en Expertisecentrum en dit noodzakelijk is met het
      oog op het doel, bedoeld in [artikel 2.17][ref4], kunnen de deelnemers overgaan tot verzameling en uitwisseling
      van, alsmede samenvoeging met andere relevante gegevens, bedoeld in [artikel 2.22][ref5], die beschikbaar zijn bij
      de deelnemers.

      5 De deelnemers beoordelen welke deelnemers met het oog op het doel in de zin van [artikel 2.17][ref6] moeten
      worden betrokken bij de te verrichten activiteit en daarbij gegevens mogen verwerken.

      6 Bij de verwerking van gegevens in het kader van een activiteit, bedoeld in [artikel 2.18, eerste lid][ref7], zijn
      de volgende bepalingen van toepassing:

      a. indien een signaal aanleiding geeft tot gezamenlijke verwerking van gegevens in het kader
      van een activiteit, bedoeld in [artikel 2.18, eerste lid][ref8], met het oog op het doel,
      bedoeld in [artikel 2.17][ref9], kunnen de betrokken deelnemers relevante gegevens, bedoeld in
      [artikel 2.22, eerste lid, onderdeel a, onderdeel 1°, en onderdeel b, onderdeel 1°][ref10], verwerken;

      b. indien de deelnemers gezamenlijk gegevens verwerken ter uitvoering van een activiteit, bedoeld in
      [artikel 2.18, eerste lid][ref11], en dat noodzakelijk is met het oog op het doel, bedoeld in [artikel 2.17][ref12],
      kunnen de deelnemers in aanvulling op de gegevens, bedoeld in onderdeel a van dit lid, de gegevens verwerken,
      bedoeld in [artikel 2.22, eerste lid, onderdeel a, onderdeel 2°, en onderdeel b, onderdeel 2°][ref13];

      c. indien de deelnemers gezamenlijk gegevens verwerken ter uitvoering van een activiteit,
      bedoeld in [artikel 2.18, eerste lid, onderdelen a of b][ref14], en dat noodzakelijk is met
      het oog op het doel, bedoeld in [artikel 2.17][ref15], kunnen de deelnemers in aanvulling
      op de gegevens, bedoeld in onderdelen a en b van dit lid, de gegevens verwerken, bedoeld in
      [artikel 2.22, eerste lid, onderdeel a, onderdeel 3°, en onderdeel b, onderdeel 3°][ref16].

      7 Indien dit naar het oordeel van de deelnemers noodzakelijk is met het oog op het doel in de zin van
      [artikel 2.17][ref17], kunnen de deelnemers in afstemming afspraken maken over interventies, kunnen zij
      interventieadviezen geven aan een of meer deelnemers en kunnen zij daartoe gegevens verwerken. Indien de deelnemers
      in afstemming afspraken hebben gemaakt over interventies die ten aanzien van een betrokkene of betrokkenen of een
      rechtspersoon of rechtspersonen worden ingezet, kunnen zij ter uitvoering daarvan gegevens verwerken.

      8 Overeenkomstig [artikel 1.7, tweede lid][ref18], kunnen de resultaten van de gezamenlijke verwerking van gegevens
      op grond van dit artikel aan een derde worden verstrekt.

      9 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de gezamenlijke
      verwerking van gegevens ter uitvoering van de activiteiten, bedoeld in [artikel 2.18][ref19], waaronder over de
      criteria waaraan een signaal moet voldoen en de criteria voor verstrekking van de resultaten van de gezamenlijke
      verwerking van gegevens aan een derde.


