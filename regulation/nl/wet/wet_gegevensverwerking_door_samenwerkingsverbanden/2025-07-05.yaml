  - number: '2.19'
    text: |-
      1 Als deelnemers worden aangewezen:

      a. de politie, voor de uitoefening van de taak bedoeld in [artikel 3 van de Politiewet 2012][ref1] en de daaruit
      voortvloeiende bevoegdheden;

      b. de rijksbelastingdienst, met in begrip van alle onderdelen daarvan, bedoeld in de op
      [artikel 3 van de Algemene wet inzake rijksbelastingen][ref2] gebaseerde ministeriële regeling,
      voor het uitvoeren van de wettelijke taken en bevoegdheden bij of krachtens de belastingwet,
      genoemd in [artikel 2, eerste lid, onderdeel a, van de Algemene wet inzake rijksbelastingen][ref3],
      de [Invorderingswet 1990][ref4], de wettelijke taken en bevoegdheden bij of krachtens de
      [Algemene douanewet][ref5] en het Douanewetboek van de Unie, en de [hoofdstukken 2][ref6] en
      [3 van de Algemene wet inkomensafhankelijke regelingen][ref7];

      c. de Fiscale Inlichtingen- en Opsporingsdienst, voor de uitoefening van de wettelijke taken, bedoeld in
      [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref8], en de daaruit voortvloeiende bevoegdheden;

      d. de Koninklijke marechaussee, voor de uitoefening van de wettelijke taken en bevoegdheden bij of krachtens
      [artikel 4 van de Politiewet 2012][ref9];

      e. het Uitvoeringsinstituut werknemersverzekeringen, voor de uitoefening van de wettelijke taken en bevoegdheden
      bij of krachtens [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10];

      f. de Immigratie- en Naturalisatiedienst, voor de uitvoering van de wettelijke taken en bevoegdheden
      op het terrein van toezicht en handhaving bij of krachtens de [Vreemdelingenwet 2000][ref11] en de
      [Rijkswet op het Nederlanderschap][ref12];

      g. het openbaar ministerie, voor de uitoefening van de in
      [artikel 124 van de Wet op de rechterlijke organisatie][ref13] opgedragen taak en de daaruit voortvloeiende
      bevoegdheden;

      h. de burgemeester voor de uitoefening van zijn wettelijke taken en bevoegdheden op het terrein van de
      handhaving van de openbare orde bij of krachtens [hoofdstuk XI van titel III van de Gemeentewet][ref14],
      [paragraaf 2.3 van de Politiewet 2012][ref15], [artikel 13b van de Opiumwet][ref16] of een gemeentelijke
      verordening en voor de uitoefening van zijn wettelijke taken en bevoegdheden bij of krachtens [artikel 3][ref17] en
      de [paragrafen 4 tot en met 7 van de Alcoholwet][ref18], [paragraaf 2 van titel VA][ref19], [titel VIa][ref20] en
      [titel VIb van de Wet op de kansspelen][ref21] en de [artikelen 26 tot en met 28 van de Paspoortwet][ref22];

      i. het college van burgemeester en wethouders voor de uitoefening van zijn wettelijke taken en bevoegdheden
      bij of krachtens [hoofdstuk X van titel III][ref23] en [hoofdstuk XV van titel IV, van de Gemeentewet][ref24],
      [titels I][ref25], [Ia][ref26] en [VIb van de Wet op de kansspelen][ref27], de [artikelen 5][ref28],
      [10][ref29], [10b][ref30] en [10c van de Wet bijzondere maatregelen grootstedelijke problematiek][ref31],
      [artikel 7 van de Participatiewet][ref32], de [hoofdstukken 2][ref33], [3][ref34]
      en [5 van de Wet algemene bepalingen omgevingsrecht][ref35], [artikel 17][ref36] en
      [hoofdstuk VI van de Woningwet][ref37], de [artikelen 8][ref38], [21][ref39], [22][ref40],
      [25][ref41] en [26][ref42] en [hoofdstuk 6 van de Huisvestingswet 2014][ref43],
      [artikel 1.4, eerste lid, van de Wet basisregistratie personen][ref44] en de wettelijke taken en bevoegdheden op
      het terrein van toezicht en handhaving bij of krachtens de [Wet ruimtelijke ordening][ref45] en een gemeentelijke
      verordening;

      j. het provinciebestuur voor de uitoefening van de wettelijke taken en bevoegdheden
      bij of krachtens de [Provinciewet][ref46], de [hoofdstukken 2][ref47], [3][ref48] en
      [5 van de Wet algemene bepalingen omgevingsrecht][ref49], of een provinciale verordening;

      k. de Nederlandse Arbeidsinspectie, voor de uitoefening van de wettelijke taken, bedoeld
      in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref50] en de daaruit
      voortvloeiende bevoegdheden en de wettelijke taken en bevoegdheden bij of krachtens
      [artikel 24 van de Arbeidsomstandighedenwet][ref51], [artikel 8:1 van de Arbeidstijdenwet][ref52],
      de [Warenwet][ref53], [artikel 13 van de Wet allocatie arbeidskrachten door intermediairs][ref54],
      [artikel 14 van de Wet arbeid vreemdelingen][ref55], de [Wet gelijke behandeling van mannen en vrouwen][ref56],
      [artikel 18a van de Wet minimumloon en minimumvakantiebijslag][ref57], de [Wet op de loonvorming][ref58] en
      [artikel 5 van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref59].

      l. de Nederlandse Voedsel- en Warenautoriteit, voor de uitoefening van de wettelijke taken, bedoeld in
      [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref60] en de daaruit voortvloeiende bevoegdheden.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wettelijke taken
      en bevoegdheden van de deelnemers waarvoor gegevens kunnen worden verwerkt binnen de Regionale Informatie- en
      Expertisecentra.

      3 Bij of krachtens algemene maatregel van bestuur kunnen andere overheidsorganen of overheidsinstanties of
      private partijen als deelnemer worden aangewezen, voor zover dat noodzakelijk is voor het doel, bedoeld in
      [artikel 2.17][ref61], en het om daarbij beschreven specifieke verwerkingen of onderdelen daarvan gaat. De
      voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Een krachtens dit lid
      vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal overgelegd. Hij treedt
      in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt
      vastgesteld, tenzij binnen die termijn door of namens een van de Kamers of door ten minste een vijfde van het
      grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat de inwerkingtreding van de
      algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de Kamers van de Staten
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


