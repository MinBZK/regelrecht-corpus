  - number: '14'
    text: |-
      1 Indien een aanvraag om een vergunning is ingediend voor het tijdstip waarop deze wet met betrekking tot zodanige
      aanvraag in werking treedt, blijft het voor dat tijdstip ten aanzien van zodanige aanvraag geldende recht van
      toepassing tot het tijdstip waarop de beschikking op de aanvraag onherroepelijk is geworden.

      2 Voor de toepassing van de [artikelen 3][ref1], [4][ref2] en [6][ref3] bedraagt de afstand tussen een
      veehouderij en een woning die op of na 19 maart 2000 is gebouwd:

      a. op een kavel die op dat tijdstip in gebruik was als veehouderij,

      b. in samenhang met het geheel of gedeeltelijk buiten werking stellen van de veehouderij, en

      c. in samenhang met de sloop van de bedrijfsgebouwen die onderdeel hebben uitgemaakt van de veehouderij,

      ten minste 100 meter indien de woning binnen de bebouwde kom is gelegen en ten minste 50 meter indien de woning
      buiten de bebouwde kom is gelegen.

      3 Het tweede lid is van overeenkomstige toepassing op een geurgevoelig object dat op de in dat lid bedoelde kavel
      aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
