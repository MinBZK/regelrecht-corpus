  - number: '7'
    text: |-
      1 Om te voorkomen dat een gebied minder geschikt wordt voor het behalen van de met de verordening, bedoeld
      in [artikel 6][ref1], te verwezenlijken doelstelling kan de gemeenteraad besluiten dat in afwachting van die
      verordening een beslissing op een aanvraag voor het oprichten of veranderen van een veehouderij wordt aangehouden.

      2 Bij het aanhoudingsbesluit wordt bepaald voor welk gebied het geldt en met ingang van welke dag het in werking
      treedt.

      3 Een aanhoudingsbesluit vervalt op het tijdstip waarop de verordening ter voorbereiding waarvan het besluit is
      genomen, in werking treedt. Een aanhoudingsbesluit vervalt tevens indien niet binnen een jaar na de datum van
      inwerkingtreding daarvan het ontwerp voor de verordening bij de raad aanhangig is gemaakt of niet binnen twee jaar
      na de datum van inwerkingtreding daarvan de verordening in werking is getreden.

      4 Een aanhoudingsbesluit wordt bekendgemaakt door terinzagelegging van dit besluit.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref2] is van toepassing. Van het aanhoudingsbesluit wordt tevens
      mededeling gedaan langs elektronische weg.

      5 Het bevoegd gezag houdt, in afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref3], de beslissing
      aan, indien voor het gebied waarop de veehouderij zal worden opgericht of veranderd vóór de dag van ontvangst
      van de aanvraag een aanhoudingsbesluit in werking is getreden. De aanhouding duurt totdat het aanhoudingsbesluit
      overeenkomstig het derde lid is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel342
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel318
