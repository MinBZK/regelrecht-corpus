    text: |-
      1 Bij een beslissing inzake de omgevingsvergunning voor het oprichten of veranderen van een veehouderij betrekt het
      bevoegd gezag de geurhinder door de geurbelasting vanwege tot veehouderijen behorende dierenverblijven uitsluitend
      op de wijze als aangegeven bij of krachtens de [artikelen 3 tot met 9][ref1].

      2 Het eerste lid geldt niet voor het weigeren van de omgevingsvergunning op de grond dat door verlening daarvan
      niet aan [artikel 2.14, eerste lid, onder c, onder 1°, van de Wet algemene bepalingen omgevingrecht][ref2]
      kan worden voldaan en voor voorschriften die met toepassing van het bepaalde krachtens
      [artikel 2.22, derde lid, van die wet][ref3] of [artikel 1.3c][ref4] of [8.40 van de Wet milieubeheer][ref5]
      worden gesteld om te bereiken dat in de veehouderij ten minste de voor de veehouderij in aanmerking komende beste
      beschikbare technieken worden toegepast.

      3 In afwijking van het eerste lid is [artikel 1.1a van de Wet algemene bepalingen omgevingsrecht][ref6]
      van overeenkomstige toepassing op het nemen van een beslissing als bedoeld in dat lid. De eerste volzin is
      niet van toepassing op gevallen als bedoeld in [artikel 3, tweede lid][ref7], voor zover het betreft een
      geurgevoelig object dat op of na 19 maart 2000 heeft opgehouden deel uit te maken van een andere veehouderij, en
      [artikel 14, tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
