  - number: '10'
    text: |-
      Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer worden, in
      overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit, regels gesteld over de wijze waarop:

      a. de geurbelasting, bedoeld in [artikel 3][ref1], wordt bepaald;

      b. de afstand, bedoeld in de [artikelen 3][ref2] en [4, eerste lid][ref3], wordt gemeten.


