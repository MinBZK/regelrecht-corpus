preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot beslissingen
    inzake vergunningen krachtens de Wet milieubeheer voor veehouderijen, voorzover het betreft geurhinder vanwege tot
    die veehouderijen behorende dierenverblijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020396/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *concentratiegebied*: concentratiegebied Zuid of concentratiegebied Oost als aangegeven in
      [bijlage I bij de Meststoffenwet][ref1], of een als zodanig bij gemeentelijke verordening aangewezen gebied;

      *dierenverblijf*: al dan niet overdekte ruimte waarbinnen dieren worden gehouden;

      *geuremissiefactor*: bij ministeriële regeling vastgestelde geuremissie per dier, behorende bij een daartoe
      aangewezen diercategorie en huisvestingssysteem;

      *geurgevoelig object*: gebouw, bestemd voor en blijkens aard, indeling en inrichting geschikt om te worden gebruikt
      voor menselijk wonen of menselijk verblijf en die daarvoor permanent of een daarmee vergelijkbare wijze van
      gebruik, wordt gebruikt, waarbij onder «gebouw, bestemd voor menselijk wonen of menselijk verblijf» wordt verstaan:
      gebouw dat op grond van het bestemmingsplan, bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref2],
      een inpassingsplan als bedoeld in [artikel 3.26][ref3] of [3.28 van die wet][ref4] daaronder
      mede begrepen, de beheersverordening, bedoeld in [artikel 3.38 van die wet][ref5], of, indien met
      toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref6]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning, bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref7] mag worden gebruikt voor menselijk wonen of menselijk
      verblijf;

      *geurhinder*: gevolgen voor het milieu door de emissie van geur;

      *huisvestingssysteem:* gedeelte van een dierenverblijf, waarin dieren van één diercategorie op dezelfde wijze
      worden gehouden;

      *omgevingsvergunning:* omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref8];

      *veehouderij*: inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref9] aangewezen categorie behoort en is
      bestemd voor het fokken, mesten, houden, verhandelen, verladen of wegen van dieren.


