  - number: '3'
    text: |-
      1 Een omgevingsvergunning met betrekking tot een veehouderij wordt geweigerd indien de geurbelasting van die
      veehouderij op een geurgevoelig object, gelegen:

      a. binnen een concentratiegebied, binnen de bebouwde kom meer bedraagt dan 3,0 odour units per kubieke meter lucht;

      b. binnen een concentratiegebied, buiten de bebouwde kom meer bedraagt dan 14,0 odour units per kubieke meter
      lucht;

      c. buiten een concentratiegebied, binnen de bebouwde kom meer bedraagt dan 2,0 odour units per kubieke meter lucht;

      d. buiten een concentratiegebied, buiten de bebouwde kom meer bedraagt dan 8,0 odour units per kubieke meter lucht.

      2 In afwijking van het eerste lid bedraagt de afstand tussen een veehouderij en een geurgevoelig object dat
      onderdeel uitmaakt van een andere veehouderij, of dat op of na 19 maart 2000 heeft opgehouden deel uit te maken van
      een andere veehouderij:

      a. ten minste 100 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en

      b. ten minste 50 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.

      3 Indien de geurbelasting, bedoeld in het eerste lid, groter is dan aangegeven in dat lid of de afstand, bedoeld
      in het tweede lid, kleiner is dan aangegeven in dat lid, wordt een omgevingsvergunning, in afwijking van het
      eerste en tweede lid, niet geweigerd indien de geurbelasting niet toeneemt en het aantal dieren van één of meer
      diercategorieën niet toeneemt.

      4 Indien de geurbelasting, bedoeld in het eerste lid, groter is dan aangegeven in dat lid, het aantal dieren van
      één of meer diercategorieën toeneemt, en een geurbelastingreducerende maatregel zal worden toegepast, dan wordt
      een omgevingsvergunning verleend voor zover het betreft de wijziging van het aantal dieren, voorzover de toename
      van de geurbelasting ten gevolge van die wijziging niet meer bedraagt dan de helft van de vermindering van de
      geurbelasting die het gevolg zou zijn van de toegepaste geurbelastingreducerende maatregel bij het eerder vergunde
      veebestand.
    url: https://wetten.overheid.nl/BWBR0020396/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 De afstand tussen een veehouderij waar dieren worden gehouden van een diercategorie waarvoor niet bij
      ministeriële regeling een geuremissiefactor is vastgesteld, en een geurgevoelig object bedraagt:

      a. ten minste 100 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en

      b. ten minste 50 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.

      2 In afwijking van het eerste lid wordt de afstand of de geuremissiefactor voor pelsdieren vastgesteld bij
      ministeriële regeling.

      3 Indien de afstand, bedoeld in het eerste of tweede lid, kleiner is dan aangegeven in dat lid, wordt een
      omgevingsvergunning, in afwijking van die leden, niet geweigerd indien de afstand tussen de veehouderij en het
      geurgevoelig object dat binnen de in het eerste of tweede lid bedoelde afstand is gelegen, niet afneemt en het
      aantal dieren van één of meer diercategorieën waarvoor geen geuremissiefactor is vastgesteld niet toeneemt.
    url: https://wetten.overheid.nl/BWBR0020396/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd de [artikelen 3][ref1] en [4][ref2] bedraagt de afstand van de buitenzijde van een dierenverblijf
      tot de buitenzijde van een geurgevoelig object:

      a. ten minste 50 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en

      b. ten minste 25 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.

      2 Indien de afstand, bedoeld in het eerste lid, kleiner is dan aangegeven in dat lid, wordt een
      omgevingsvergunning, in afwijking van het eerste lid, niet geweigerd indien de afstand, bedoeld in het eerste lid,
      niet afneemt en:

      a. de geurbelasting op het geurgevoelige object dat binnen de in het eerste lid genoemde afstand is gelegen, en het
      aantal dieren van één of meer diercategorieën, niet toenemen, of

      b. de in [artikel 4][ref3] bedoelde afstand tussen de veehouderij en het geurgevoelig object dat binnen de in het
      eerste lid genoemde afstand is gelegen, niet afneemt en het aantal dieren van één of meer diercategorieën waarvoor
      geen geuremissiefactor is vastgesteld niet toeneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020396#Artikel4
