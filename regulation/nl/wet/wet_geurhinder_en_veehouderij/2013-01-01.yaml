  - number: '6'
    text: |-
      1 Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente een
      andere waarde van toepassing is dan de desbetreffende waarde, genoemd in [artikel 3, eerste lid][ref1], met dien
      verstande dat deze andere waarde:

      a. binnen een concentratiegebied, binnen de bebouwde kom niet minder bedraagt dan 0,1 odour unit per kubieke meter
      lucht en niet meer dan 14,0 odour units per kubieke meter lucht;

      b. binnen een concentratiegebied, buiten de bebouwde kom niet minder bedraagt dan 3,0 odour units per kubieke meter
      lucht en niet meer dan 35,0 odour units per kubieke meter lucht;

      c. buiten een concentratiegebied, binnen de bebouwde kom niet minder bedraagt dan 0,1 odour unit per kubieke meter
      lucht en niet meer dan 8,0 odour units per kubieke meter lucht;

      d. buiten een concentratiegebied, buiten de bebouwde kom niet minder bedraagt dan 2,0 odour units per kubieke meter
      lucht en niet meer dan 20,0 odour units per kubieke meter lucht.

      2 Bij gemeentelijke verordening kan worden bepaald dat een bij die verordening vast te stellen andere waarde of
      afstand als bedoeld in [artikel 3][ref2] of [4][ref3] van toepassing is voor geurgevoelige objecten die onderdeel
      hebben uitgemaakt van een veehouderij.

      3 Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente een
      andere afstand van toepassing is dan de afstand, genoemd in [artikel 4, eerste lid][ref4], met dien verstande dat
      deze:

      a. ten minste 50 meter bedraagt indien het geurgevoelige object binnen de bebouwde kom is gelegen, en

      b. ten minste 25 meter bedraagt indien het geurgevoelige object buiten de bebouwde kom is gelegen.

      4 Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente voor
      pelsdieren een andere afstand van toepassing is met dien verstande dat deze ten minste de helft bedraagt van de
      afstand, bedoeld in [artikel 4, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel3
