$id: wet_geurhinder_en_veehouderij
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2010-10-01'
bwb_id: BWBR0020396
url: https://wetten.overheid.nl/BWBR0020396/2010-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot beslissingen
    inzake vergunningen krachtens de Wet milieubeheer voor veehouderijen, voorzover het betreft geurhinder vanwege tot
    die veehouderijen behorende dierenverblijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: *concentratiegebied*: concentratiegebied
      Zuid of concentratiegebied Oost als aangegeven in [bijlage I bij de Meststoffenwet][ref1], of een als zodanig
      bij gemeentelijke verordening aangewezen gebied; *dierenverblijf*: al dan niet overdekte ruimte waarbinnen dieren
      worden gehouden; *geuremissiefactor*: bij ministeriële regeling vastgestelde geuremissie per dier, behorende
      bij een daartoe aangewezen diercategorie en huisvestingssysteem; *geurgevoelig object*: gebouw, bestemd voor en
      blijkens aard, indeling en inrichting geschikt om te worden gebruikt voor menselijk wonen of menselijk verblijf en
      die daarvoor permanent of een daarmee vergelijkbare wijze van gebruik, wordt gebruikt; *geurhinder*: gevolgen voor
      het milieu door de emissie van geur; *huisvestingssysteem:* gedeelte van een dierenverblijf, waarin dieren van één
      diercategorie op dezelfde wijze worden gehouden; *omgevingsvergunning:* omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2]; *veehouderij*:
      inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref3]
      aangewezen categorie behoort en is bestemd voor het fokken, mesten, houden, verhandelen, verladen of wegen van
      dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '1'
  - number: '2.1'
    text: |-
      Bij een beslissing inzake de omgevingsvergunning voor het oprichten of veranderen van een veehouderij betrekt het
      bevoegd gezag de geurhinder door de geurbelasting vanwege tot veehouderijen behorende dierenverblijven uitsluitend
      op de wijze als aangegeven bij of krachtens de [artikelen 3 tot met 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
  - number: '2.2'
    text: |-
      Het eerste lid geldt niet voor het weigeren van de omgevingsvergunning met toepassing van
      [artikel 2.14, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref1] of voor voorschriften die worden
      gesteld met toepassing van het bepaalde krachtens [artikel 1.3c][ref2] of [8.40 van de Wet milieubeheer][ref3] of
      het bepaalde bij of krachtens [artikel 2.22 van de Wet algemene bepalingen omgevingsrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '3.1'
    text: |-
      Een omgevingsvergunning met betrekking tot een veehouderij wordt geweigerd indien de geurbelasting van die
      veehouderij op een geurgevoelig object, gelegen:
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.1.a
    text: binnen een concentratiegebied, binnen de bebouwde kom meer bedraagt dan 3,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.1.b
    text: binnen een concentratiegebied, buiten de bebouwde kom meer bedraagt dan 14,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.1.c
    text: buiten een concentratiegebied, binnen de bebouwde kom meer bedraagt dan 2,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.1.d
    text: buiten een concentratiegebied, buiten de bebouwde kom meer bedraagt dan 8,0 odour units per kubieke meter lucht.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid bedraagt de afstand tussen een veehouderij en een geurgevoelig object dat onderdeel
      uitmaakt van een andere veehouderij, of dat op of na 19 maart 2000 heeft opgehouden deel uit te maken van een
      andere veehouderij:
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.2.a
    text: ten minste 100 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: 3.2.b
    text: ten minste 50 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de geurbelasting, bedoeld in het eerste lid, groter is dan aangegeven in dat lid of de afstand, bedoeld
      in het tweede lid, kleiner is dan aangegeven in dat lid, wordt een omgevingsvergunning, in afwijking van het
      eerste en tweede lid, niet geweigerd indien de geurbelasting niet toeneemt en het aantal dieren van één of meer
      diercategorieën niet toeneemt.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: '3.4'
    text: |-
      Indien de geurbelasting, bedoeld in het eerste lid, groter is dan aangegeven in dat lid, het aantal dieren van
      één of meer diercategorieën toeneemt, en een geurbelastingreducerende maatregel zal worden toegepast, dan wordt
      een omgevingsvergunning verleend voor zover het betreft de wijziging van het aantal dieren, voorzover de toename
      van de geurbelasting ten gevolge van die wijziging niet meer bedraagt dan de helft van de vermindering van de
      geurbelasting die het gevolg zou zijn van de toegepaste geurbelastingreducerende maatregel bij het eerder vergunde
      veebestand.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel3
  - number: '4.1'
    text: |-
      De afstand tussen een veehouderij waar dieren worden gehouden van een diercategorie waarvoor niet bij ministeriële
      regeling een geuremissiefactor is vastgesteld, en een geurgevoelig object bedraagt:
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel4
  - number: 4.1.a
    text: ten minste 100 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel4
  - number: 4.1.b
    text: ten minste 50 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid wordt de afstand of de geuremissiefactor voor pelsdieren vastgesteld bij
      ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de afstand, bedoeld in het eerste of tweede lid, kleiner is dan aangegeven in dat lid, wordt een
      omgevingsvergunning, in afwijking van die leden, niet geweigerd indien de afstand tussen de veehouderij en het
      geurgevoelig object dat binnen de in het eerste of tweede lid bedoelde afstand is gelegen, niet afneemt en het
      aantal dieren van één of meer diercategorieën waarvoor geen geuremissiefactor is vastgesteld niet toeneemt.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd de [artikelen 3][ref1] en [4][ref2] bedraagt de afstand van de buitenzijde van een dierenverblijf tot
      de buitenzijde van een geurgevoelig object:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '4'
  - number: 5.1.a
    text: ten minste 50 meter indien het geurgevoelige object binnen de bebouwde kom is gelegen, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
  - number: 5.1.b
    text: ten minste 25 meter indien het geurgevoelige object buiten de bebouwde kom is gelegen.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de afstand, bedoeld in het eerste lid, kleiner is dan aangegeven in dat lid, wordt een omgevingsvergunning,
      in afwijking van het eerste lid, niet geweigerd indien de afstand, bedoeld in het eerste lid, niet afneemt en:
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
  - number: 5.2.a
    text: |-
      de geurbelasting op het geurgevoelige object dat binnen de in het eerste lid genoemde afstand is gelegen, en het
      aantal dieren van één of meer diercategorieën, niet toenemen, of
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
  - number: 5.2.b
    text: |-
      de in [artikel 4][ref1] bedoelde afstand tussen de veehouderij en het geurgevoelig object dat binnen de in het
      eerste lid genoemde afstand is gelegen, niet afneemt en het aantal dieren van één of meer diercategorieën waarvoor
      geen geuremissiefactor is vastgesteld niet toeneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '6.1'
    text: |-
      Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente een andere
      waarde van toepassing is dan de desbetreffende waarde, genoemd in [artikel 3, eerste lid][ref1], met dien verstande
      dat deze andere waarde:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
  - number: 6.1.a
    text: |-
      binnen een concentratiegebied, binnen de bebouwde kom niet minder bedraagt dan 0,1 odour unit per kubieke meter
      lucht en niet meer dan 14,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: 6.1.b
    text: |-
      binnen een concentratiegebied, buiten de bebouwde kom niet minder bedraagt dan 3,0 odour units per kubieke meter
      lucht en niet meer dan 35,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: 6.1.c
    text: |-
      buiten een concentratiegebied, binnen de bebouwde kom niet minder bedraagt dan 0,1 odour unit per kubieke meter
      lucht en niet meer dan 8,0 odour units per kubieke meter lucht;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: 6.1.d
    text: |-
      buiten een concentratiegebied, buiten de bebouwde kom niet minder bedraagt dan 2,0 odour units per kubieke meter
      lucht en niet meer dan 20,0 odour units per kubieke meter lucht.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: '6.2'
    text: |-
      Bij gemeentelijke verordening kan worden bepaald dat een bij die verordening vast te stellen andere waarde of
      afstand als bedoeld in [artikel 3][ref1] of [4][ref2] van toepassing is voor geurgevoelige objecten die onderdeel
      hebben uitgemaakt van een veehouderij.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '6.3'
    text: |-
      Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente een andere
      afstand van toepassing is dan de afstand, genoemd in [artikel 4, eerste lid][ref1], met dien verstande dat deze:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '4'
  - number: 6.3.a
    text: ten minste 50 meter bedraagt indien het geurgevoelige object binnen de bebouwde kom is gelegen, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: 6.3.b
    text: ten minste 25 meter bedraagt indien het geurgevoelige object buiten de bebouwde kom is gelegen.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
  - number: '6.4'
    text: |-
      Bij gemeentelijke verordening kan worden bepaald dat binnen een deel van het grondgebied van de gemeente voor
      pelsdieren een andere afstand van toepassing is met dien verstande dat deze ten minste de helft bedraagt van de
      afstand, bedoeld in [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '7.1'
    text: |-
      Om te voorkomen dat een gebied minder geschikt wordt voor het behalen van de met de verordening, bedoeld in
      [artikel 6][ref1], te verwezenlijken doelstelling kan de gemeenteraad besluiten dat in afwachting van die
      verordening een beslissing op een aanvraag voor het oprichten of veranderen van een veehouderij wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel6
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '6'
  - number: '7.2'
    text: |-
      Bij het aanhoudingsbesluit wordt bepaald voor welk gebied het geldt en met ingang van welke dag het in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel7
  - number: '7.3'
    text: |-
      Een aanhoudingsbesluit vervalt op het tijdstip waarop de verordening ter voorbereiding waarvan het besluit is
      genomen, in werking treedt. Een aanhoudingsbesluit vervalt tevens indien niet binnen een jaar na de datum van
      inwerkingtreding daarvan het ontwerp voor de verordening bij de raad aanhangig is gemaakt of niet binnen twee jaar
      na de datum van inwerkingtreding daarvan de verordening in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel7
  - number: '7.4'
    text: |-
      Een aanhoudingsbesluit wordt bekendgemaakt door terinzagelegging van dit besluit.
      [Artikel 3:42 van de Algemene wet bestuursrecht][ref1] is van toepassing. Van het aanhoudingsbesluit wordt tevens
      mededeling gedaan langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.5'
    text: |-
      Het bevoegd gezag houdt, in afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref1], de beslissing
      aan, indien voor het gebied waarop de veehouderij zal worden opgericht of veranderd vóór de dag van ontvangst
      van de aanvraag een aanhoudingsbesluit in werking is getreden. De aanhouding duurt totdat het aanhoudingsbesluit
      overeenkomstig het derde lid is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.1'
    text: |-
      Bij het bepalen van de andere waarde of afstand, bedoeld in [artikel 6][ref1], betrekt de gemeenteraad in elk
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel6
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '6'
  - number: 8.1.a
    text: de huidige en de te verwachten geursituatie vanwege de veehouderijen in het gebied;
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: 8.1.b
    text: het belang van een geïntegreerde aanpak van de verontreiniging, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: 8.1.c
    text: de noodzaak van een even hoog niveau van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: '8.2'
    text: 'Bij het bepalen van de andere waarde of afstand betrekt de gemeenteraad tevens:'
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: 8.2.a
    text: de gewenste ruimtelijke inrichting van het gebied, of
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: 8.2.b
    text: de afwijkende relatie tussen geurbelasting en geurhinder.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel8
  - number: '9'
    text: |-
      Wanneer voor een gebied als bedoeld in [artikel 6][ref1] een andere waarde of andere afstand dan genoemd in de
      [artikelen 3][ref2] of [4][ref3] wordt vastgesteld, en het effect vanwege het vaststellen van die andere waarde
      of andere afstand doorwerkt naar het grondgebied van een naburige gemeente, kan de gemeenteraad daartoe slechts
      overgaan na overleg met die naburige gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '10'
    text: |-
      Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer worden, in
      overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit, regels gesteld over de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel10
  - number: 10.a
    text: |-
      de geurbelasting, bedoeld in [artikel 3][ref1], wordt bepaald;


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
  - number: 10.b
    text: |-
      de afstand, bedoeld in de [artikelen 3][ref1] en [4, eerste lid][ref2], wordt gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '4'
  - number: '13'
    text: |-
      De [Wet stankemissie veehouderijen in landbouwontwikkelings- en verwevingsgebieden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013693
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013693
  - number: '14.1'
    text: |-
      Indien een aanvraag om een vergunning is ingediend voor het tijdstip waarop deze wet met betrekking tot zodanige
      aanvraag in werking treedt, blijft het voor dat tijdstip ten aanzien van zodanige aanvraag geldende recht van
      toepassing tot het tijdstip waarop de beschikking op de aanvraag onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
  - number: '14.2'
    text: |-
      Voor de toepassing van de [artikelen 3][ref1], [4][ref2] en [6][ref3] bedraagt de afstand tussen een veehouderij
      en een woning die op of na 19 maart 2000 is gebouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0020396#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020396#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020396#Artikel6
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020396
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020396
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020396
        artikel: '6'
  - number: 14.2.a
    text: op een kavel die op dat tijdstip in gebruik was als veehouderij,
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
  - number: 14.2.b
    text: in samenhang met het geheel of gedeeltelijk buiten werking stellen van de veehouderij, en
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
  - number: 14.2.c
    text: in samenhang met de sloop van de bedrijfsgebouwen die onderdeel hebben uitgemaakt van de veehouderij,
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
  - number: '14.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een geurgevoelig object dat op de in dat lid bedoelde kavel
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet geurhinder en veehouderij.'
    url: https://wetten.overheid.nl/BWBR0020396/2010-10-01#Artikel16
