preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen ter bestrijding van
    ongerechtvaardigde leegstand van woningen en andere gebouwen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet met uitzondering van de [artikelen 4][ref1], [8][ref2], [9][ref3] en 19 wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003403#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003403#Artikel9
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003403
        artikel: '8'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003403
        artikel: '9'
        hoofdstuk: IV
  - number: 1.a
    text: 'woning: een gebouwde onroerende zaak of een gedeelte daarvan, die een zelfstandige woongelegenheid vormt;'
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
  - number: 1.b
    text: |-
      gebouw: gebouw als bedoeld in [artikel 1, onderdeel c, van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.c
    text: 'eigenaar: degene, die bevoegd is tot het in gebruik geven van een woning of een gebouw;'
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
  - number: 1.d
    text: |-
      leegstaan: het niet of niet krachtens een zakelijk of persoonlijk recht in gebruik zijn alsmede een gebruik dat de
      kennelijke strekking heeft afbreuk te doen aan de werking van deze wet;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
  - number: 1.e
    text: 'Onze Minister: Onze Minister, belast met de zorg voor de volkshuisvesting;'
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
  - number: 1.f
    text: |-
      leegstandverordening: leegstandverordening als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel2
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '2'
        hoofdstuk: II
  - number: '2'
    text: De gemeenteraad kan een leegstandverordening vaststellen.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeenteraad kan in de leegstandverordening bepalen dat de leegstand van een of meer daarbij aangewezen
      categorieën gebouwen of gedeelten daarvan, niet zijnde woonruimte, gelegen in de gemeente of daarbij aangegeven
      delen van de gemeente, door de eigenaar wordt gemeld aan burgemeester en wethouders, zodra die leegstand langer
      duurt dan een in die verordening aangegeven termijn van ten minste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Burgemeester en wethouders houden een lijst bij van de overeenkomstig het eerste lid gemelde gebouwen of gedeelten
      daarvan. Op deze lijst houden zij ook de gebouwen of gedeelten daarvan bij, waarvan ambtshalve geconstateerd is dat
      deze leegstaan en waarvan de leegstand overeenkomstig het eerste lid van dit artikel gemeld had moeten worden door
      de eigenaar.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel3
  - number: '3.3'
    text: In de leegstandverordening worden nadere regels gegeven omtrent het melden, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      De termijnen, bedoeld in het eerste lid en [artikel 5][ref1], vangen aan op de dag na de datum van inwerkingtreding
      van de leegstandverordening, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel5
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '5'
        hoofdstuk: IV
  - number: '4.1'
    text: |-
      Burgemeester en wethouders voeren binnen drie maanden na ontvangst van de melding, bedoeld in [artikel 3][ref1],
      overleg met de eigenaar van het gebouw omtrent het gebruik van dat gebouw respectievelijk dat gedeelte van het
      gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel3
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '3'
        hoofdstuk: III
  - number: '4.2'
    text: |-
      Burgemeester en wethouders kunnen na het overleg, bedoeld in het eerste lid, of zonder overleg indien de eigenaar
      aan dat overleg geen medewerking verleent, in een leegstandsbeschikking vaststellen of het gebouw respectievelijk
      het gedeelte daarvan geschikt is voor gebruik.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      Burgemeester en wethouders kunnen aan de eigenaar van een leegstaand gebouw, respectievelijk het leegstaand
      gedeelte daarvan, dat is aangewezen overeenkomstig [artikel 3, eerste lid][ref1], een gebruiker voordragen zodra
      die leegstand langer duurt dan een in de leegstandverordening aangegeven termijn van ten minste twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel3
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '3'
        hoofdstuk: III
  - number: '5.2'
    text: |-
      Een voordracht als bedoeld in het eerste lid wordt slechts gedaan als voordien in een leegstandbeschikking als
      bedoeld in [artikel 4, tweede lid][ref1], is vastgesteld dat het gebouw respectievelijk het gedeelte daarvan
      geschikt is voor gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel4
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '4'
        hoofdstuk: III
  - number: '6'
    text: |-
      Burgemeester en wethouders kunnen in hun besluit, bedoeld in [artikel 5][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel5
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '5'
        hoofdstuk: IV
  - number: 6.a
    text: een of meer natuurlijke personen of rechtspersonen als gebruiker voordragen;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel6
  - number: 6.b
    text: |-
      indien het gebouw noodzakelijke voorzieningen behoeft om weer op redelijke wijze tot gebruik te kunnen dienen, de
      eigenaar verplichten om binnen een door hen te bepalen termijn de door hen aan te geven voorzieningen te treffen;
      en
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel6
  - number: 6.c
    text: zo nodig andere voorwaarden aan de uitvoering van het besluit stellen.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      De eigenaar is verplicht om de overeenkomstig [artikel 5][ref1] voorgedragen gebruiker binnen drie maanden na de
      voordracht, een overeenkomst tot ingebruikname van het gebouw, respectievelijk het leegstaand gedeelte daarvan, aan
      te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel5
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '5'
        hoofdstuk: IV
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing indien de eigenaar binnen de termijn, bedoeld in het eerste lid, een
      overeenkomst is aangegaan met een andere gebruiker, die het gebouw, respectievelijk het gedeelte ervan, binnen
      redelijke termijn in gebruik neemt.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De eigenaar is verplicht om binnen vier weken na beëindiging van het gebruik overeenkomstig dit artikel de
      leegstand van het gebouw, respectievelijk het gedeelte ervan, te melden aan burgemeester en wethouders, tenzij het
      gebouw langer dan één jaar in gebruik is geweest.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel7
  - number: '15.1'
    text: |-
      Burgemeester en wethouders kunnen de eigenaar vergunning verlenen tot het aangaan van overeenkomsten
      van huur en verhuur van woonruimte op welke overeenkomsten de [artikelen 206 lid 3][ref1], [232][ref2],
      [242][ref3], [269 lid 1 en 2][ref4], [270][ref5], [271 leden 4 tot en met 8][ref6], [272 tot en met 277][ref7],
      [278 leden 1 en 2][ref8] en [281 van Boek 7 van het Burgerlijk Wetboek][ref9] niet van toepassing zijn, indien het
      gaat om:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel232
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel242
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel269
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel270
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel272
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel278
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel281
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '206'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '232'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '242'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '269'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '270'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '271'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '272'
      - id: ref8
        bwb_id: BWBR0005290
        artikel: '278'
      - id: ref9
        bwb_id: BWBR0005290
        artikel: '281'
  - number: 15.1.a
    text: |-
      woonruimte in een gebouw, dat blijkens zijn constructie dan wel inrichting bestemd is voor doeleinden van
      groepsgewijze huisvesting, van verzorging of verpleging, van logiesverschaffing, van administratie of van onderwijs
      of voor een samenstel van twee of meer van deze doeleinden;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.1.b
    text: woonruimte in een voor de verkoop bestemde woning welke
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.1.b.1°
    text: nimmer bewoond is geweest, hetzij
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.1.b.2°
    text: |-
      gedurende een tijdvak van ten minste twaalf maanden voorafgaand aan het tijdstip waarop die woning laatstelijk
      geheel is komen leeg te staan of, indien die woning in haar geheel binnen een tijdvak van twaalf maanden
      voorafgaand aan dat tijdstip voor bewoning gereed is gekomen, gedurende het overblijvende gedeelte van het
      laatstgenoemde tijdvak, onafgebroken geheel of grotendeels door de eigenaar als eigenaar bewoond is geweest, hetzij
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.1.b.3°
    text: |-
      gedurende een tijdvak van tien jaren voorafgaand aan het tijdstip waarop de vergunning is aangevraagd, niet langer
      dan gedurende een al dan niet aaneengesloten tijdvak van drie jaren geheel of grotendeels als woonruimte verhuurd
      is geweest;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.1.c
    text: |-
      woonruimte in een voor de verhuur bestemde woning welke ten tijde van het aanvragen van de vergunning bestemd is
      voor afbraak of voor vernieuwbouw.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      De vergunning wordt door de eigenaar aangevraagd door het indienen van een volledig en naar waarheid ingevuld
      formulier, dat van gemeentewege overeenkomstig een door Onze Minister vastgesteld model beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.3'
    text: 'De vergunning wordt slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.3.a
    text: het gebouw of de woning, voor de verhuring waarvan de vergunning wordt gevraagd, leeg staat;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.3.b
    text: |-
      van de eigenaar in redelijkheid niet kan worden gevergd dat hij het gebouw of de woning op een andere wijze dan
      door het aangaan van een of meer huurovereenkomsten als bedoeld in het eerste lid, eerste zin, dienstbaar maakt aan
      de volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.3.c
    text: |-
      de eigenaar aantoont dat de te verhuren woonruimte, gelet op de omstandigheden en mogelijkheden, in voldoende mate
      zal worden bewoond;
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: 15.3.d
    text: |-
      de eigenaar, indien het gaat om woonruimte als bedoeld in het eerste lid, onder *c*, aantoont dat de vernieuwbouw
      van ingrijpende aard zal zijn en voorts dat de afbraak of de vernieuwbouw binnen een redelijke termijn zal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      De vergunning wordt ten aanzien van hetzelfde gebouw of dezelfde woning slechts eenmaal verleend en wel voor een
      duur van ten hoogste twee jaren. Op verzoek van de eigenaar kunnen burgemeester en wethouders deze duur telkens met
      ten hoogste een jaar verlengen, met dien verstande dat de gehele duur van de vergunning ten hoogste vijf jaren kan
      bedragen. Op een verzoek om verlenging van de vergunning is het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.5'
    text: |-
      Een verzoek tot verlenging kan uiterlijk tot het tijdstip waarop de vergunning haar geldigheid verliest, worden
      ingediend. Het bepaalde in het derde lid, onder *b, c* en *d*, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.6'
    text: |-
      Beslissen burgemeester en wethouders op een verzoek tot verlenging eerst na het tijdstip waarop de vergunning
      haar geldigheid verliest, dan blijft een huurovereenkomst als bedoeld in het eerste lid, eerste zin, welke op dat
      tijdstip voortduurt, in afwijking van het bepaalde in [artikel 16, zevende lid][ref1], van kracht uiterlijk totdat
      burgemeester en wethouders hebben beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel16
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '16'
        hoofdstuk: V
  - number: '15.7'
    text: |-
      Indien burgemeester en wethouders het verzoek tot verlenging toewijzen, loopt een huurovereenkomst als bedoeld
      in het eerste lid, eerste zin, welke op dat tijdstip voortduurt, tenzij uit die overeenkomst een bepaalde tijd
      voortvloeit of partijen een bepaalde tijd overeenkomen, voor onbepaalde tijd door, doch uiterlijk tot het tijdstip
      waarop de vergunning opnieuw haar geldigheid verliest.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.8'
    text: |-
      Elk beding dat strijdig is met dit artikel of met [artikel 8:5 van de Algemene wet bestuursrecht][ref1] in
      samenhang met artikel 1 van de bij die wet behorende [Bevoegdheidsregeling bestuursrechtspraak][ref2], is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '15.10'
    text: |-
      Een beschikking tot verlenging als bedoeld in het vierde lid die van rechtswege is gegeven vervalt van rechtswege
      een jaar na het tijdstip van inwerkingtreding van de beschikking tot verlenging, indien de duur waarvoor de
      verlenging is aangevraagd meer dan een jaar bedraagt, of, indien als gevolg van die verlenging de gehele duur van
      de vergunning meer dan vijf jaren zou bedragen, op het tijdstip waarop de gehele duur van de vergunning vijf jaren
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '15.11'
    text: |-
      Burgemeester en wethouders kunnen een vergunning als bedoeld in het eerste lid die van rechtswege is verleend
      intrekken, indien ten aanzien van hetzelfde gebouw of dezelfde woning al eerder een zodanige vergunning is
      verleend. [Artikel 4:20f, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.12'
    text: |-
      Tegen de beslissing van burgemeester en wethouders tot weigering van de vergunning of tot afwijzing van het verzoek
      tot verlenging, alsmede tegen een beslissing door burgemeester en wethouders betreffende de huurprijs als bedoeld
      in [artikel 16, negende lid, eerste zin, of tiende lid, eerste zin][ref1], staat geen beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel16
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '16'
        hoofdstuk: V
  - number: '15.13'
    text: Elk met dit artikel strijdig beding is nietig.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Ten aanzien van de huur en verhuur van woonruimte met betrekking tot de verhuring waarvan een vergunning
      als bedoeld in [artikel 15, eerste lid, eerste zin][ref1], is verleend, blijven de [artikelen 232][ref2] en
      [247 van Boek 7 van het Burgerlijk Wetboek][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel232
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel247
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '232'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '247'
  - number: '16.2'
    text: |-
      Ten aanzien van huurovereenkomsten, als bedoeld in [artikel 15, eerste lid, eerste zin][ref1], gelden de volgende
      bijzondere bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
        hoofdstuk: V
  - number: '16.3'
    text: De huurovereenkomst wordt aangegaan voor ten minste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
  - number: '16.4'
    text: Bij opzegging door de huurder is de termijn niet langer dan een maand.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
  - number: '16.5'
    text: Bij opzegging door de verhuurder is de termijn niet korter dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
  - number: '16.6'
    text: |-
      Een opzegging die in strijd met het vierde lid van dit artikel of met het eerste of tweede lid van
      [artikel 271 van Boek 7 van het Burgerlijk Wetboek][ref1] is gedaan en een opzegging die op kortere termijn is
      gedaan dan is voorgeschreven in het vijfde lid van dit artikel gelden niettemin als waren zij gedaan tegen de
      voorgeschreven dag en met inachtneming van de voorgeschreven termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
  - number: '16.7'
    text: De huurovereenkomst eindigt in elk geval op het tijdstip, waarop de vergunning haar geldigheid verliest.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
  - number: '16.8'
    text: |-
      Elk beding waarbij in strijd met het vierde lid een langere opzeggingstermijn of in strijd met het vijfde lid
      een kortere opzeggingstermijn wordt overeengekomen of waarbij van andere bepalingen van dit artikel dan wel van
      [artikel 271, eerste, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] wordt afgeweken, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
  - number: '16.9'
    text: |-
      Burgemeester en wethouders vermelden in de vergunning tegen welke huurprijs ten hoogste mag worden verhuurd.
      Aan de berekening van het huurbedrag leggen zij de krachtens de [artikelen 10, eerste lid][ref1], en
      [12, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref2] gegeven regels ten grondslag. Komen partijen
      een hogere huurprijs overeen dan waartegen de woonruimte ten hoogste mag worden verhuurd, dan treedt de huurprijs
      welke in de vergunning is vermeld in de plaats van de overeengekomen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '12'
  - number: '16.10'
    text: |-
      Indien de vergunning van rechtswege is verleend, verbinden burgemeester en wethouders alsnog een voorschrift aan de
      vergunning, inhoudende de huurprijs tegen welke ten hoogste mag worden verhuurd. Aan de eerste zin wordt uitvoering
      gegeven binnen zes weken na de bekendmaking van de vergunning van rechtswege. Het negende lid, tweede en derde zin,
      is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
  - number: '16.11'
    text: |-
      De huurovereenkomst moet bij geschrifte worden aangegaan. Daarbij moet melding worden gemaakt van de vergunning
      bedoeld in [artikel 15, eerste lid, eerste zin][ref1], het tijdvak waarvoor deze is verleend en de daarin vermelde
      huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
        hoofdstuk: V
  - number: '16.12'
    text: |-
      Indien aan het bepaalde in het elfde lid niet is voldaan, kan de verhuurder zich niet beroepen op het buiten
      toepassing blijven van de artikelen genoemd in [artikel 15, eerste lid, eerste zin][ref1], en op het van toepassing
      zijn van het bepaalde in het derde tot en met achtste lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel15
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '15'
        hoofdstuk: V
  - number: '17'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      burgemeester en wethouders aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      De gemeenteraad kan bij verordening bepalen dat een bestuurlijke boete kan worden opgelegd terzake van overtreding
      van de [artikelen 3, eerste lid][ref1], en [7, derde lid][ref2]. Burgemeester en wethouders zijn bevoegd tot het
      opleggen van een bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003403#Artikel7
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '3'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003403
        artikel: '7'
        hoofdstuk: IV
  - number: '18.2'
    text: De bestuurlijke boete kan niet hoger zijn dan € 7 500.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      De gemeenteraad stelt bij verordening het bedrag vast van de bestuurlijke boete die voor de verschillende
      overtredingen kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel18
  - number: '21.1'
    text: |-
      Van deze wet, welke kan worden aangehaald als Leegstandwet, treden de [artikelen 1][ref1] en [4][ref2], hoofdstuk
      V, paragraaf E van artikel 18 en hoofdstuk VII in werking op een door Ons te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003403#Artikel4
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003403
        artikel: '4'
        hoofdstuk: III
  - number: '21.2'
    text: |-
      De [paragrafen A-D van artikel 18][ref1] treden in werking twaalf maanden na het tijdstip, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003403#Artikel18
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003403
        artikel: '18'
        hoofdstuk: VI
  - number: '21.3'
    text: |-
      De overige bepalingen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat is gelegen na het
      tijdstip, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003403/2013-01-01#Artikel21
