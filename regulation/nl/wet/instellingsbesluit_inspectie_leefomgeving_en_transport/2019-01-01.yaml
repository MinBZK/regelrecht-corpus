$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingsbesluit_inspectie_leefomgeving_en_transport
regulatory_layer: WET
publication_date: '2023-05-24'
valid_from: '2019-01-01'
bwb_id: BWBR0031032
url: https://wetten.overheid.nl/BWBR0031032/2019-01-01
preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Er is een Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel1
  - number: '1.2'
    text: De Inspectie Leefomgeving en Transport staat onder leiding van de inspecteur-generaal Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel1
  - number: '1.3'
    text: |-
      De Inspectie Leefomgeving en Transport ressorteert rechtstreeks onder de secretaris-generaal van het Ministerie van
      Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel1
  - number: '1.4'
    text: De organisatie van de Inspectie Leefomgeving en Transport wordt nader vastgesteld door de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel1
  - number: '2.1'
    text: |-
      De Inspectie Leefomgeving en Transport bewaakt en stimuleert de naleving van wet- en regelgeving voor een veilige
      en duurzame leefomgeving en transport. Daarmee is de Inspectie Leefomgeving en Transport en haar onderdelen, voor
      zover het betreft het werkterrein van het Ministerie van Infrastructuur en Waterstaat, belast met de volgende taken
      en alle daarmee samenhangende activiteiten:
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.1.a
    text: handhaving van wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.1.b
    text: vergunningverlening en het verlenen van andere toestemmingen waaronder certificering en ontheffingen;
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.1.c
    text: het verrichten van ongevalonderzoek verband houdende met de taken genoemd in de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.1.d
    text: |-
      de voorbereiding van een besluit tot het nemen, intrekken, dan wel uitvoeren van een besluit
      tot indeplaatsstelling op grond van [titel III, hoofdstuk VIII, van de Provinciewet][ref1] en
      [hoofdstuk VIII, paragraaf 3, van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0005416
        paragraaf: '3'
  - number: '2.2'
    text: 'De Inspectie Leefomgeving en Transport is voorts belast met:'
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.2.a
    text: |-
      het toetsen van de uitvoerbaarheid en handhaafbaarheid van alle beleidsnota’s en nieuwe wet- en regelgeving, die
      voor de uitvoering van de taken genoemd in het eerste lid, onderdelen a tot en met c, van belang zijn;
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.2.b
    text: |-
      het geven van signalen over de naleving van wet- en regelgeving die betrekking kunnen hebben op wenselijke
      wijzigingen van de wetgeving;
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.2.c
    text: |-
      de taken van de bevoegde autoriteit, bedoeld in de in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1]
      genoemde basisverordening, en de verordeningen die zijn vastgesteld krachtens deze verordening, tenzij deze taken
      bij of krachtens wettelijk voorschrift elders zijn belegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 2.2.d
    text: |-
      het geven en intrekken van een beschikking, bedoeld in
      [artikel 25, derde lid, van de Wet belastingen op milieugrondslag][ref1] en alle daarmee samenhangende
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
  - number: '2.3'
    text: |-
      Onverminderd het bepaalde in het eerste en het tweede lid kan de Inspectie Leefomgeving en Transport specifieke
      taken uitvoeren die voortvloeien uit verdragsrechtelijke verplichtingen of Europese regelgeving, waaronder:
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.3.a
    text: |-
      de taken van de veiligheidsinstantie, bedoeld in artikel 3, onderdeel g, van [richtlijn nr. 2004/49/EG]
      (32004L0049), van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake veiligheid
      op de communautaire spoorwegen en tot wijziging van [richtlijn 95/18/EG](31995L0018) van de Raad betreffende
      de verlening van vergunningen aan spoorwegondernemingen, en van [richtlijn 2001/14/EG](32001L0014) van de
      Raad inzake de toewijzing van spoorweginfrastructuurcapaciteit en de heffing van rechten voor het gebruik van
      spoorweginfrastructuur alsmede inzake veiligheidscertificering (Spoorwegveiligheidsrichtlijn) (PbEG L 164);
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: 2.3.b
    text: |-
      de taken van de nationale toezichthoudende instantie, bedoeld in artikel 4, eerste lid, van verordening (EG)
      nr. 549/2004 van het Europees Parlement en de Raad van 10 maart 2004 tot vaststelling van het kader voor de
      totstandbrenging van het gemeenschappelijke Europese luchtruim (de kaderverordening) (PbEG L 96/1).
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: '2.4'
    text: De Inspectie Leefomgeving en Transport kan handhavende taken verrichten op het werkterrein van andere ministeries.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel2
  - number: '3.1'
    text: |-
      Indien de Minister van Infrastructuur en Waterstaat of, als de Inspectie Leefomgeving en Transport op grond van
      [artikel 2, vierde lid][ref1], taken verricht op het werkterrein van een ander ministerie, de minister die het
      aangaat de inspecteur-generaal Leefomgeving en Transport een aanwijzing van algemene of bijzondere aard geeft ten
      aanzien van de uitoefening van een bevoegdheid die bij of krachtens wettelijke regeling of verdrag of besluit van
      een volkenrechtelijke organisatie of instelling aan de inspecteur-generaal of aan de ambtenaren van de inspectie is
      toegekend, doet hij daarvan onverwijld mededeling aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0031032#Artikel2
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031032
        artikel: '2'
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op aanwijzingen die betrekking hebben op beheersmatige aspecten van de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel3
  - number: '4'
    text: De Inspectie Leefomgeving en Transport stelt jaarlijks een meerjarenplan en een jaarverslag op.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel4
  - number: '5'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel5
  - number: 5.a
    text: |-
      het [Instellingsbesluit Inspectie Verkeer en Waterstaat][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012546
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012546
  - number: 5.b
    text: |-
      de [Regeling Inspectie Verkeer en Waterstaat 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013627
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013627
  - number: '6'
    text: |-
      Rechten en verplichtingen van zijn rechtsvoorgangers gelden als rechten en verplichtingen van de inspecteur-
      generaal Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel6
  - number: '7'
    text: Dit besluit treedt in werking met ingang van 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Inspectie Leefomgeving en Transport.'
    url: https://wetten.overheid.nl/BWBR0031032/2019-01-01#Artikel8
