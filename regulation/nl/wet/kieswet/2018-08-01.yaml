  - number: Ya 4
    text: |-
      Op de dag van de kandidaatstelling kunnen tevens bij een gezaghebber, van negen tot zeventien uur,
      kandidatenlijsten worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_4
  - number: Ya 5
    text: |-
      1 De verklaringen of bewijzen die moeten worden overgelegd bij een kandidatenlijst, die is ingeleverd bij
      een gezaghebber of het centraal stembureau, kunnen tevens afzonderlijk worden ingeleverd op de dag van
      kandidaatstelling, van negen tot zeventien uur, bij een gezaghebber of het centraal stembureau.

      2 De inlevering geschiedt door de degene die de kandidatenlijst heeft ingeleverd of een persoon die, blijkens de
      kandidatenlijst, bevoegd is tot het herstel van verzuimen.

      3 De inleveraar identificeert zich bij een gezaghebber dan wel het centraal stembureau met een document als
      bedoeld in [artikel 2 van de Wet op de identificatieplicht BES][ref1], respectievelijk een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2].

      4 Degene die verklaringen of bewijzen afzonderlijk inlevert, ontvangt daarvan een bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_5
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: Ya 7
    text: |-
      1 De gezaghebber beoordeelt de authenticiteit van de stukken die bij hem worden ingeleverd en legt zijn bevindingen
      vast in een begeleidingsverklaring. Bij ministeriële regeling wordt voor de begeleidingsverklaring een model
      vastgesteld.

      2 De gezaghebber brengt terstond langs elektronische weg de begeleidingsverklaring en de stukken ter kennis van het
      centraal stembureau.

      3 De gezaghebber maakt van de begeleidingsverklaring en de stukken gewaarmerkte afschriften. Hij vernietigt
      deze afschriften onverwijld nadat de beslissing van het centraal stembureau over de geldigheid van de lijsten
      onherroepelijk is geworden. Van de vernietiging wordt proces-verbaal opgemaakt.

      4 De gezaghebber doet de stukken in een pak, dat hij verzegelt. Het verzegelde pak wordt zo spoedig mogelijk per
      post naar het centraal stembureau overgebracht.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_7
  - number: Ya 8
    text: |-
      1 Indien het centraal stembureau een of meer verzuimen heeft geconstateerd bij een lijst die in een openbaar
      lichaam is ingeleverd, geeft het onverwijld langs elektronische weg kennis hiervan aan de gezaghebber van dat
      openbaar lichaam.

      2 De gezaghebber geeft van de verzuimen onverwijld bij aangetekende brief of tegen gedagtekend ontvangstbewijs
      kennis aan degene die de lijst heeft ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_8
  - number: Ya 9
    text: |-
      Een herstelbaar verzuim kan tevens uiterlijk de eerste werkdag vóór de dag, bedoeld in [artikel I 4][ref1], worden
      hersteld bij een gezaghebber van negen tot zeventien uur. [Artikel Ya 7][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_4
        hoofdstuk: I
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: Ya_7
        hoofdstuk: Ya
        paragraaf: '2'
        afdeling: Va
  - number: Ya 10
    text: |-
      1 Het centraal stembureau verzendt afschriften van de kandidatenlijsten die voor kieskring 20 (Bonaire) zijn
      ingeleverd en, indien vereist, verklaringen van ondersteuning, onverwijld na het onderzoek van de lijsten langs
      elektronische weg naar de gezaghebbers.

      2 De gezaghebbers leggen de stukken op het bestuurskantoor voor een ieder ter inzage, zodra deze zijn ontvangen.

      3 De gezaghebbers vernietigen de stukken onverwijld nadat over de toelating van de gekozenen is beslist. Van de
      vernietiging wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_10
  - number: Ya 10a
    text: |-
      1 [Artikel I 5, aanhef en onder a][ref1], is niet van toepassing indien een lijst op de dag van de
      kandidaatstelling tussen negen en zeventien uur bij een gezaghebber is ingeleverd.

      2 Een verklaring of bewijs dat afzonderlijk wordt ingeleverd, is niet geldig indien deze niet overeenkomstig
      [artikel Ya 5, eerste tot en met derde lid][ref2], is ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_5
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_5
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_10a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_5
