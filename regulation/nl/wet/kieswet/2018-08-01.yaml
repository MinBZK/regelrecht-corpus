  - number: I 3
    text: |-
      1 Onmiddellijk nadat de lijsten door het centraal stembureau zijn onderzocht, worden deze en, indien vereist, de
      verklaringen van ondersteuning, voor een ieder ter inzage gelegd bij het centraal stembureau.

      2 Op de voet van [artikel I 1, tweede lid][ref1], toegezonden afschriften van ingeleverde kandidatenlijsten worden
      bij de gemeente waar het hoofdstembureau is gevestigd ter inzage gelegd, zodra deze zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
