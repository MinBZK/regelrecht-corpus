  - number: I 6
    text: |-
      1 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, van de lijst voor een kieskring de naam
      van de kandidaat:

      a. die niet is vermeld overeenkomstig het bepaalde krachtens [artikel H 8][ref1];

      b. van wie niet uit de overgelegde verklaring blijkt dat hij instemt met zijn kandidaatstelling op de lijst voor
      deze kieskring;

      c. wiens woonplaats buiten het Europese deel van Nederland is gelegen, indien de aanwijzing van een gemachtigde
      ontbreekt;

      d. die tijdens de zittingsperiode van het orgaan waarvoor de verkiezing zal plaatshebben, niet de voor het zitting
      nemen in dat orgaan vereiste leeftijd bereikt;

      e. die bij een verkiezing van de leden van provinciale staten, van het algemeen bestuur of van de gemeenteraad geen
      ingezetene is van de provincie, het waterschap onderscheidenlijk de gemeente, en ten aanzien van wie de verklaring
      dat hij voornemens is zich bij benoeming te vestigen in de provincie, het waterschap onderscheidenlijk de gemeente,
      ontbreekt;

      f. die heeft verklaard dat hij voornemens is zich bij benoeming te vestigen in de provincie, het waterschap,
      onderscheidenlijk de gemeente, en ten aanzien van wie blijkt dat hij tevens een zodanige verklaring heeft afgelegd
      voor de verkiezing van de leden van de staten van een andere provincie, van het algemeen bestuur van een ander
      waterschap, onderscheidenlijk van de raad van een andere gemeente;

      g. die voorkomt op meer dan één van de lijsten die voor deze kieskring zijn ingeleverd;

      h. van wie een uittreksel uit het register van overlijden dan wel een afschrift van de akte van overlijden is
      overgelegd;

      i. die op de lijst voorkomt na het ten hoogste toegelaten aantal.

      2 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, de aanduiding van een politieke groepering
      van de lijst voor een kieskring, indien:

      a. een daarop betrekking hebbende verklaring als bedoeld in het [tweede of derde lid van artikel H 3][ref2]
      ontbreekt;

      b. de aanduiding geplaatst is boven meer dan één van de voor dezelfde kieskring ingeleverde lijsten.

      3 Indien de aanduiding van een politieke groepering niet in overeenstemming is met die waaronder zij is
      geregistreerd, brengt het centraal stembureau deze ambtshalve daarmee in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
