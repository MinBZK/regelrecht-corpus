  - number: E 1
    text: |-
      1 Voor de verkiezing van de leden van de Tweede Kamer wordt Nederland verdeeld in kieskringen, overeenkomstig de
      bij deze wet gevoegde tabel.

      2 De kieskringen voor de verkiezing van de leden van de Tweede Kamer, voor zover gelegen in het Europese deel van
      Nederland, vormen tevens de kieskringen voor de verkiezing van de leden van provinciale staten. Provinciale staten
      kunnen voor de verkiezing van de leden van provinciale staten deze kieskringen in meer kieskringen verdelen.

      3 Voor de verkiezing van de leden van het algemeen bestuur vormt elk waterschap één kieskring.

      4 Voor de verkiezing van de leden van de gemeenteraad vormt elke gemeente één kieskring.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_1
  - number: E 3
    text: |-
      1 Burgemeester en wethouders stellen één of meer stembureaus in de gemeente in.

      2 De stembureaus voor de verkiezing van de leden van provinciale staten zijn tevens de stembureaus voor de
      verkiezing van de leden van het algemeen bestuur.

      3 Een stembureau bestaat uit een bij algemene maatregel van bestuur vast te stellen aantal leden, van wie er één
      voorzitter is.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_3
  - number: E 4
    text: |-
      1 Burgemeester en wethouders benoemen tijdig voor elke verkiezing de leden van elk stembureau en een voldoend
      aantal plaatsvervangende leden.

      2 Als lid en plaatsvervangend lid van het stembureau kunnen worden benoemd degenen die op de dag van de stemming
      de leeftijd van achttien jaar hebben bereikt en na het volgen van een training naar het oordeel van burgemeester
      en wethouders over voldoende kennis en vaardigheden beschikken op het terrein van het verkiezingsproces, met
      uitzondering van degenen:

      a. die op de dag van de kandidaatstelling bij onherroepelijke rechterlijke uitspraak van het kiesrecht zijn ontzet;

      b. die als lid van het hoofdstembureau dan wel het centraal stembureau voor de desbetreffende verkiezing zijn
      benoemd;

      c. die als stembureaulid bij een vorige verkiezing hebben gehandeld of een handeling hebben nagelaten in strijd met
      het bij of krachtens deze wet bepaalde.

      3 Het lidmaatschap van het stembureau eindigt van rechtswege nadat over de toelating van de gekozenen is beslist.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de training, waaronder regels over
      een toets. Hierbij kan worden bepaald dat uitsluitend degenen die de toets met goed gevolg hebben afgelegd als lid
      of plaatsvervangend lid van het stembureau kunnen worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_4
  - number: E 5
    text: |-
      1 Voor de verkiezing van de leden van de Tweede Kamer wordt voor elke kieskring een hoofdstembureau ingesteld. Het
      is gevestigd in de gemeente, daartoe aangewezen in de tabel, genoemd in [artikel E 1, eerste lid][ref1].

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 Voorzitter is de burgemeester van de gemeente waar het hoofdstembureau is gevestigd. De plaatsvervangend
      voorzitter en de andere leden, alsmede drie plaatsvervangende leden, worden benoemd en ontslagen door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_1
