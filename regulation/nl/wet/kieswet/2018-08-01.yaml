        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: Ya_5
        hoofdstuk: Ya
        paragraaf: '2'
        afdeling: Va
  - number: Ya 11
    text: |-
      De gezaghebbers van Sint Eustatius en Saba dragen er tevens zorg voor dat de in [artikel N 12, eerste lid][ref1],
      genoemde processen-verbaal en de opgave van de door hen vastgestelde aantallen stemmen langs elektronische weg
      onverwijld na de vaststelling ter kennis worden gebracht van de voorzitter van het hoofdstembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_11
    references:
