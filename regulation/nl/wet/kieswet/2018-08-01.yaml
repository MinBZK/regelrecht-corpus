      - id: ref3
        bwb_id: BWBR0004627
        artikel: V_6
        hoofdstuk: V
        paragraaf: '1'
        afdeling: IV
  - number: J 26
    text: |-
      1 De kiezer gaat na ontvangst van het stembiljet naar een stemhokje en stemt aldaar door een wit stipje, geplaatst
      vóór de kandidaat van zijn keuze, rood te maken.

      2 Hij vouwt vervolgens het stembiljet dicht en gaat daarmee naar het stembureau.

      3 Het derde lid van het stembureau ziet erop toe, dat de kiezer het stembiljet in de stembus steekt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_26
  - number: J 27
    text: |-
      1 Indien een kiezer zich bij de invulling van zijn stembiljet vergist, geeft hij dit aan de voorzitter terug. Deze
      verstrekt hem op zijn verzoek eenmaal een nieuw biljet.

      2 De teruggegeven stembiljetten worden door de voorzitter onmiddellijk onbruikbaar gemaakt op bij algemene
      maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_27
  - number: J 28
    text: |-
      Wanneer aan het stembureau blijkt dat een kiezer wegens zijn lichamelijke gesteldheid hulp behoeft, staat het toe
      dat deze zich laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_28
  - number: J 29
    text: |-
      1 Indien het stembureau blijkt dat een kiezer het stembiljet niet in de stembus steekt, houdt de voorzitter daarvan
      aantekening.

      2 Indien een kiezer zijn stembiljet teruggeeft, wordt dit door de voorzitter onmiddellijk onbruikbaar gemaakt op
      een bij algemene maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_29
  - number: J 30
    text: |-
      Zodra de voor de stemming bepaalde tijd verstreken is, wordt dit door de voorzitter aangekondigd en worden alleen
      de op dat ogenblik in het stemlokaal of bij de ingang daarvan aanwezige kiezers nog tot de stemming toegelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_30
  - number: J 31
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de gang van zaken bij de
      stemming.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_31
  - number: J 35
    text: |-
      1 Gedurende de tijd dat het stembureau zitting houdt, zijn de kiezers bevoegd in het stemlokaal te vertoeven, voor
      zover de orde daardoor niet wordt verstoord en de voortgang van de zitting niet wordt belemmerd.

      2 De in het stemlokaal aanwezige kiezers kunnen mondeling bezwaren inbrengen, indien de stemming niet
      overeenkomstig de wet geschiedt.

      3 De bezwaren worden in het proces-verbaal van de zitting van het stembureau vermeld. Voor zover sprake is
      van verwerking van persoonsgegevens op grond van deze bepaling zijn de artikelen 15, 16 en 18 van de Algemene
      verordening gegevensbescherming niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_35
  - number: J 36
    text: In het stemlokaal worden geen activiteiten ontplooid die erop gericht zijn de kiezers in hun keuze te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_36
  - number: J 37
    text: |-
      De voorzitter is belast met de handhaving van de orde tijdens de zitting. Hij kan daartoe de burgemeester om
      bijstand verzoeken.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_37
  - number: J 38
    text: |-
      1 Indien zich naar het oordeel van het stembureau omstandigheden voordoen in of bij het stemlokaal die de
      behoorlijke voortgang van de zitting onmogelijk maken, wordt dit door de voorzitter verklaard. De zitting wordt
      daarop geschorst. De voorzitter doet hiervan terstond mededeling aan de burgemeester. De burgemeester bepaalt
      vervolgens wanneer en waar de zitting wordt hervat.

      2 Bij of krachtens algemene maatregel van bestuur worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_38
  - number: J 39
    text: |-
      1 Onze Minister van Buitenlandse Zaken kan ter uitvoering van een verdrag of een internationale afspraak personen
      toelaten die als waarnemer getuige mogen zijn van het verloop van de verkiezingen.

      2 Een waarnemer is bevoegd in het stemlokaal te vertoeven gedurende de tijd dat het stembureau zitting houdt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent waarneming bij de
      verkiezingen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_39
  - number: K 1
    text: |-
      1 Aan de kiezer wordt overeenkomstig de bepalingen van dit hoofdstuk op zijn verzoek toegestaan binnen het gebied
      van het orgaan waarvoor de verkiezing wordt gehouden, aan de stemming deel te nemen in een stembureau van zijn
      keuze.

      2 Onverminderd het eerste lid kan de kiezer stemmen in de stemlokalen, bedoeld in [artikel J 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_5
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_5
        hoofdstuk: J
        paragraaf: '1'
        afdeling: II
  - number: K 2
    text: |-
      Het in [artikel K 1][ref1] bepaalde geldt niet voor de kiezer aan wie op zijn verzoek is toegestaan bij volmacht te
      stemmen of een briefstembewijs is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_1
        hoofdstuk: K
        afdeling: II
  - number: K 3
    text: |-
      1 De kiezer richt zijn verzoek, schriftelijk of mondeling, aan de burgemeester van de gemeente waar hij op de dag
      van de kandidaatstelling als kiezer is geregistreerd.

      2 Het schriftelijk verzoek dient uiterlijk vijf dagen voor de stemming te zijn ontvangen. Het mondeling verzoek
      wordt uiterlijk op de dag voor de stemming om twaalf uur gedaan. De burgemeester brengt deze termijnen op de dag
      van de kandidaatstelling ter openbare kennis.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_3
  - number: K 4
    text: |-
      1 Aan de kiezer wordt als bewijs dat aan zijn verzoek is voldaan een verklaring uitgereikt of verzonden, genaamd
      kiezerspas.

      2 De kiezer aan wie een kiezerspas is uitgereikt of verzonden, kan uitsluitend met deze pas aan de verkiezing
      deelnemen.

      3 Aan de kiezer wiens kiezerspas in het ongerede is geraakt, wordt geen nieuwe uitgereikt of verzonden.

      4 Bij ministeriële regeling wordt voor de kiezerspas een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_4
  - number: K 6
    text: |-
      1 Voor het indienen van een schriftelijk verzoek wordt een formulier gebruikt. Bij ministeriële regeling wordt voor
      het formulier een model vastgesteld.

      2 Een mondeling verzoek geschiedt door de kiezer in persoon bij de gemeente waar hij op de dag van de
      kandidaatstelling als kiezer is geregistreerd.

      3 Indien de kiezer reeds een stempas heeft ontvangen, voegt hij deze bij het schriftelijk verzoek, dan wel legt hij
      deze over bij het mondeling verzoek.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_6
  - number: K 7
    text: |-
      1 In afwijking van [artikel K 3][ref1] dient een persoon die als kiezer is geregistreerd als bedoeld in
      [artikel D 2][ref2], een schriftelijk verzoek in bij de burgemeester van 's-Gravenhage.

      2 Een verzoek dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_3
        hoofdstuk: K
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_2
        hoofdstuk: D
        afdeling: II
  - number: K 8
    text: |-
      1 Op het schriftelijk verzoek wordt zo spoedig mogelijk beslist. Op het mondeling verzoek wordt terstond beslist.

      2 Het verzoek wordt slechts afgewezen, indien de verzoeker op de dag van de kandidaatstelling niet als kiezer is
      geregistreerd, hem overeenkomstig [paragraaf 2 van hoofdstuk L][ref1] is toegestaan bij volmacht te stemmen, of een
      briefstembewijs is verstrekt.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld.

      4 [Artikel D 8][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_8
        hoofdstuk: D
        afdeling: II
  - number: K 9
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen met een
      kiezerspas, onder meer over de indiening van een verzoek, de beslissing op een verzoek en de verstrekking van
      formulieren, bedoeld in [artikel K 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_6
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_6
        hoofdstuk: K
        afdeling: II
  - number: K 11
    text: |-
      1 Bij de stemming overhandigt de kiezer het in [artikel J 24, eerste lid, onder a][ref1], genoemde
      identiteitsdocument, en de kiezerspas aan de voorzitter van het stembureau.

      2 [Artikel J 25, tweede tot en met tiende lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelK_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_24
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_25
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
  - number: L 1
    text: |-
      De kiezer die verwacht niet in staat te zullen zijn in persoon aan de stemming deel te nemen, kan overeenkomstig de
      bepalingen van dit hoofdstuk bij volmacht stemmen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_1
  - number: L 2
    text: |-
      1 Een volmacht kan worden verleend hetzij op een schriftelijke aanvraag overeenkomstig het bepaalde in
      [paragraaf 2][ref1], hetzij door overdracht van de stempas of kiezerspas overeenkomstig het bepaalde in
      [paragraaf 3 van dit hoofdstuk][ref2].

      2 Een schriftelijke aanvraag om bij volmacht te stemmen kan niet worden ingediend door de kiezer aan wie een
      kiezerspas of een briefstembewijs is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 3
    text: De gemachtigde kan een volmachtstem uitsluitend tegelijk met zijn eigen stem voor die verkiezing uitbrengen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_3
  - number: L 4
    text: Een kiezer mag per verkiezing niet meer dan twee aanwijzingen als gemachtigde aannemen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_4
  - number: L 5
    text: |-
      1 De volmachtgever is niet bevoegd een eenmaal verleende schriftelijke volmacht in te trekken of na het verlenen
      van volmacht in persoon aan de stemming deel te nemen.

      2 Een volmacht die is verleend door overdracht van de stempas of kiezerspas kan tot het uitbrengen van een stem
      door de gemachtigde door de volmachtgever worden ingetrokken.

      3 Een schriftelijke aanvraag om bij volmacht te stemmen kan worden ingetrokken, zolang daarop niet is beslist.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_5
  - number: L 6
    text: |-
      1 Aan de gemachtigde wordt ten bewijze van zijn bevoegdheid een verklaring verstrekt, genaamd volmachtbewijs.

      2 Aan de gemachtigde wiens volmachtbewijs in het ongerede is geraakt, wordt geen nieuw verstrekt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_6
  - number: L 7
    text: |-
      1 Het verzoekschrift, bedoeld in [artikel L 8][ref1], dient uiterlijk vijf dagen voor de stemming te zijn
      ontvangen.

      2 De burgemeester brengt deze termijn op de dag van de kandidaatstelling ter openbare kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 8
    text: |-
      1 De kiezer die bij volmacht wenst te stemmen, dient daartoe een verzoekschrift in bij de burgemeester van de
      gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd. Voor het indienen van een
      verzoekschrift wordt een formulier gebruikt. De burgemeester kan ter voorkoming van misbruik beperkingen stellen
      aan de verkrijgbaarstelling. Een daartoe strekkend besluit brengt hij ter openbare kennis.

      2 In zijn verzoekschrift wijst de kiezer een gemachtigde aan. Als gemachtigde kan slechts optreden degene die op de
      dag van de kandidaatstelling als kiezer is geregistreerd binnen het gebied waarvoor de verkiezing geldt.

      3 Bij het verzoekschrift wordt ingediend een verklaring van de gemachtigde dat deze bereid is als zodanig op te
      treden.

      4 Bij ministeriële regeling worden voor het formulier en de verklaring modellen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_8
  - number: L 9
    text: |-
      1 In afwijking van [artikel L 8, eerste lid, eerste volzin][ref1], dient een persoon die als kiezer is
      geregistreerd als bedoeld in [artikel D 2][ref2], een verzoekschrift in bij de burgemeester van 's-Gravenhage.

      2 Een verzoekschrift dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_2
        hoofdstuk: D
        afdeling: II
  - number: L 10
    text: |-
      Het verzoek wordt afgewezen, indien:

      a. blijkt dat de kiezer niet zelf de gemachtigde heeft aangewezen;

      b. aan de kiezer die het verzoek heeft ingediend reeds een kiezerspas of een briefstembewijs is verstrekt;

      c. de verklaring van de gemachtigde dat deze bereid is als zodanig op te treden, ontbreekt;

      d. degene die als gemachtigde is aangewezen, niet als kiesgerechtigde is geregistreerd binnen het gebied waarvoor
      de verkiezing geldt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_10
  - number: L 11
    text: |-
      1 Op het verzoek wordt zo spoedig mogelijk beslist, doch niet eerder dan op de dag van de kandidaatstelling.

      2 Bij inwilliging wordt een volmachtbewijs opgemaakt. Bij ministeriële regeling wordt voor dit bewijs een model
      vastgesteld. De inwilliging wordt aan de volmachtgever bekendgemaakt.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld. Degene die zich bereid heeft verklaard als gemachtigde op te
      treden wordt van de beslissing in kennis gesteld.

      4 [Artikel D 8][ref1] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_8
        hoofdstuk: D
        afdeling: II
  - number: L 12
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen bij volmacht,
      onder meer over de indiening van een verzoekschrift, de beslissing op een verzoekschrift en de verstrekking van
      formulieren, bedoeld in [artikel L 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_12
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 14
    text: |-
      1 De kiezer met een stempas kan een andere kiezer machtigen om voor hem te stemmen, indien de gemachtigde stemt in
      de gemeente van de volmachtgever.

      2 De kiezer met een kiezerspas kan een andere kiezer machtigen om voor hem te stemmen.

      3 Hij tekent daartoe het formulier dat voorkomt op de stempas of kiezerspas en laat de pas door de gemachtigde
      mede-ondertekenen.

      4 Hij draagt de aldus in een volmachtbewijs omgezette stempas of kiezerspas aan de gemachtigde over.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_14
  - number: L 15
    text: |-
      1 De kiezer verleent geen volmacht in een stemlokaal.

      2 Indien een volmacht is verleend in het stemlokaal, kan de gemachtigde de volmachtstem niet uitbrengen. Indien
      de gemachtigde het volmachtbewijs aan de voorzitter van het stembureau heeft overhandigd, geeft de voorzitter het
      volmachtbewijs aan de volmachtgever, of, indien deze het stemlokaal heeft verlaten, aan de gemachtigde.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_15
  - number: L 17
    text: |-
      1 De gemachtigde overhandigt aan de voorzitter van het stembureau het volmachtbewijs.

      2 Indien het een volmachtbewijs betreft als bedoeld in [hoofdstuk L, paragraaf 3][ref1], overhandigt de
      gemachtigde tevens een kopie van een identiteitsdocument als bedoeld in [artikel J 24][ref2], van de volmachtgever.

      3 [Artikel J 25, tweede tot en met tiende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelL_17
    references:
