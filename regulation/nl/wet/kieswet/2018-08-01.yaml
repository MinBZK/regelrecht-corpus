        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: B_5
        hoofdstuk: B
        afdeling: II
  - number: D 3
    text: |-
      1 Registratie van een persoon als bedoeld in [artikel D 2][ref1] gebeurt op aanvraag, onverminderd
      [artikel D 6, tweede en derde lid][ref2]. Een aanvraag van een persoon die de leeftijd van zeventien jaar heeft,
      wordt in behandeling genomen ten behoeve van een registratie met ingang van de vierenveertigste dag voor het
      bereiken van de achttienjarige leeftijd.

      2 Een aanvraag dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen om registratie ten behoeve
      van die stemming mogelijk te maken.

      3 In afwijking van het tweede lid dient een aanvraag om een registratie te wijzigen uiterlijk negen weken voor de
      dag van de stemming te zijn ontvangen om registratie ten behoeve van die stemming mogelijk te maken.

      4 Voor het indienen van een aanvraag wordt een formulier gebruikt. Bij ministeriële regeling wordt voor de
      formulieren een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_6
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_3
