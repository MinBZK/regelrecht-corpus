  - number: Y 36
    text: |-
      Het centraal stembureau stelt door tussenkomst van Onze Minister van Buitenlandse Zaken de andere lidstaten in
      kennis van de namen van hun onderdanen, die niet tevens de Nederlandse nationaliteit hebben en die op de geldige
      kandidatenlijsten voorkomen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelY_36
  - number: Y 38
    text: |-
      1 Indien de autoriteit, bedoeld in [artikel Y 35b, eerste lid][ref1], het centraal stembureau verzoekt te verklaren
      of een kandidaat in Nederland is uitgesloten van het recht om te worden gekozen, verzoekt het centraal stembureau
      Onze Minister van Veiligheid en Justitie een dergelijke verklaring te verstrekken. De verklaring wordt onverwijld
      verstrekt.

      2 Het centraal stembureau geleidt de verklaring van Onze Minister van Veiligheid en Justitie zo spoedig mogelijk,
      doch uiterlijk binnen vijf werkdagen na ontvangst van het verzoek van de autoriteit door naar die autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35b
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelY_38
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_35b
        hoofdstuk: Y
        paragraaf: '4'
        afdeling: V
  - number: Y 39
    text: |-
      Bij ministeriële regeling kunnen krachtens de [afdelingen II][ref1] en [IV][ref2] vastgestelde modellen die
      ingevolge bepalingen van deze afdeling van overeenkomstige toepassing worden verklaard voor de verkiezing van de
      leden van het Europees Parlement, voor deze verkiezing nader worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#AfdelingII
      [ref2]: https://wetten.overheid.nl/BWBR0004627#AfdelingIV
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelY_39
    references:
      - id: ref1
        bwb_id: BWBR0004627
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        afdeling: IV
  - number: Ya 1
    text: |-
      Deze wet en de daarop berustende bepalingen is mede van toepassing in Bonaire, Sint Eustatius en Saba, met
      inachtneming van het in deze afdeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_1
  - number: Ya 2
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. openbaar lichaam: openbaar lichaam Bonaire, Sint Eustatius of Saba;

      b. het Gemeenschappelijk Hof: het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_2
  - number: Ya 3
    text: |-
      1 Voor de toepassing van de bij of krachtens deze wet gestelde bepalingen in Bonaire, Sint Eustatius en Saba wordt,
      voor zover deze afdeling niet anders bepaalt, telkens in die bepalingen gelezen in plaats van:

      a. «de gemeente»: het openbaar lichaam;

      b. «de burgemeester»: de gezaghebber;

      c. «burgemeester en wethouders»: het bestuurscollege;

      d. «de gemeenteraad»: de eilandsraad;

      e. «gemeentehuis»: het bestuurskantoor;

      f. «[artikel 1 van de Wet op de identificatieplicht][ref1]»:
      [artikel 2 van de Wet op de identificatieplicht BES][ref2].

      2 Indien uitsluitend de gemeente, de burgemeester of burgemeester en wethouders van ’s-Gravenhage wordt bedoeld,
      geldt het eerste lid, onder a tot en met c, niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028575
        artikel: '2'
  - number: Ya 3a
    text: |-
      In aanvulling op [artikel D 6, eerste lid, onderdeel a][ref1], kan een registratie van een ingezetene van de
      openbare lichamen Bonaire, Sint Eustatius of Saba op aanvraag worden gewijzigd indien de persoon niet op de juiste
      wijze als kiezer is geregistreerd. [Artikel D 7, eerste lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_3a
    references:
