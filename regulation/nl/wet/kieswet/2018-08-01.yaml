  - number: N 1
    text: |-
      1 Onmiddellijk nadat de stemming is geëindigd, stelt het stembureau vast de aantallen geldige stempassen,
      kiezerspassen en volmachtbewijzen. De som van deze aantallen is het aantal kiezers dat tot de stemming is
      toegelaten.

      2 De aantallen worden door de voorzitter aan de aanwezige kiezers medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_1
  - number: N 2
    text: |-
      1 Het stembureau doet in afzonderlijke pakken:

      a. de geldige stempassen, kiezerspassen en volmachtbewijzen;

      b. de onbruikbaar gemaakte stempassen, kiezerspassen en volmachtbewijzen;

      c. de onbruikbaar gemaakte stembiljetten;

      d. de niet gebruikte stembiljetten;

      e. het uittreksel van ongeldige stempassen.

      2 Elk pak wordt verzegeld en voorzien van de naam van de gemeente en het nummer van het stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_2
  - number: N 3
    text: |-
      Onmiddellijk na de in [artikel N 2][ref1] voorgeschreven verzegelingen wordt de stembus geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 5
    text: |-
      De leden van het stembureau openen de stembiljetten en voegen deze lijstgewijze bijeen. Zij kunnen zich bij
      deze werkzaamheden doen bijstaan door plaatsvervangende leden en door ambtenaren van de gemeente, daartoe door
      burgemeester en wethouders aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_5
  - number: N 6
    text: |-
      1 Het stembureau stelt ten aanzien van iedere lijst vast:

      a. het aantal op iedere kandidaat uitgebrachte stemmen;

      b. de som van de aantallen stemmen, bedoeld onder a.

      2 Daarnaast stelt het stembureau vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen.

      3 De som van de aantallen op kandidaten uitgebrachte stemmen, blanco stemmen en ongeldige stemmen is het aantal
      stemmen dat is geteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_6
  - number: N 7
    text: |-
      1 Blanco is de stem uitgebracht op een stembiljet dat door de kiezer is ingeleverd zonder dat hij geheel of
      gedeeltelijk een wit stipje in een stemvak rood heeft gemaakt en zonder dat hij anderszins op het stembiljet
      geschreven of getekend heeft.

      2 Ongeldig is de stem uitgebracht op een ander stembiljet dan bij of krachtens deze wet mag worden gebruikt.

      3 Voorts is ongeldig de stem die niet als blanco wordt aangemerkt, maar waarbij de kiezer op het stembiljet
      niet, door het geheel of gedeeltelijk rood maken van het witte stipje in een stemvak, op ondubbelzinnige wijze
      heeft kenbaar gemaakt op welke kandidaat hij zijn stem uitbrengt, of waarbij op het stembiljet bijvoegingen zijn
      geplaatst waardoor de kiezer kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_7
  - number: N 8
    text: |-
      1 Het stembureau beslist met inachtneming van [artikel N 7][ref1] over de geldigheid van het stembiljet.

      2 De voorzitter maakt de reden van ongeldigverklaring en van twijfel over de geldigheid, alsmede de beslissing
      daaromtrent onmiddellijk bekend.

      3 Indien een van de aanwezige kiezers dit verlangt, moet het biljet worden getoond. De kiezers kunnen mondeling
      bezwaren tegen de genomen beslissing inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_7
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 8a
    text: |-
      Het stembureau stelt vast het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal
      stemmen dat is geteld. Voor zover mogelijk geeft het stembureau hiervoor een verklaring.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_8a
  - number: N 9
    text: |-
      1 Terstond nadat de stemmen zijn opgenomen, deelt de voorzitter de aantallen, bedoeld in de [artikelen N 6][ref1]
      en [N 8a][ref2], mede. Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.

      2 Vervolgens worden de stembiljetten met een blanco stem en de ongeldig verklaarde stembiljetten in pakken gedaan,
      die worden verzegeld. Op deze pakken wordt vermeld:

      a. de naam van de gemeente en het nummer van het stembureau;

      b. het aantal stembiljetten dat het pak bevat.

      3 Daarop worden de geldige stembiljetten, lijstgewijs gerangschikt, in een of meer pakken gedaan, die worden
      verzegeld.

      4 Op ieder pak, in het derde lid bedoeld, worden vermeld:

      a. de naam van de gemeente en het nummer van het stembureau;

      b. het aantal stembiljetten dat het pak bevat, alsmede, indien de biljetten in meer dan één pak worden gedaan, de
      nummers van de lijsten waarop de ingesloten biljetten betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8a
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_9
    references:
      - id: ref1
