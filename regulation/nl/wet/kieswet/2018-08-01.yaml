      1 Tegen een beschikking op grond van de [artikelen I 4][ref1], [S 2][ref2] en [Y 2][ref3] in samenhang met artikel
      I 4 van deze wet die betreft:

      a. een kandidatenlijst waarboven bij de inlevering van de lijst een aanduiding is geplaatst van een politieke
      groepering die blijkens de statuten haar zetel heeft in Bonaire, Sint Eustatius of Saba, of

      b. een kandidatenlijst waarboven geen aanduiding is geplaatst maar waarvan de eerstgenoemde kandidaat
      ingezetene is van Bonaire, Sint Eustatius of Saba, kan door een belanghebbende, in afwijking van
      [artikel 7 Wet administratieve rechtspraak BES][ref4], en iedere kiezer uitsluitend beroep worden ingesteld bij het
      Gemeenschappelijk Hof.

      2 De [artikelen I 7, eerste lid, tweede volzin, derde tot en met vijfde lid][ref5], [I 8][ref6] en
      [Ya 42, tweede tot en met vijfde lid][ref7], zijn van overeenkomstige toepassing.


