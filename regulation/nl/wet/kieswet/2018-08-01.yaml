  - number: Ya 16
    text: |-
      In de [artikelen H 10, eerste lid][ref1], [I 2, eerste lid, onderdeel e][ref2], en
      [I 6, eerste lid, onderdeel c][ref3], wordt in plaats van «het Europese deel van Nederland» telkens gelezen «het
      openbaar lichaam waar hij zich kandidaat stelt» en in artikel H 10, eerste lid, wordt in plaats van «in één van de
      openbare lichamen Bonaire, Sint Eustatius en Saba» gelezen: in Nederland, maar niet in één van de openbare lichamen
      Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_6
