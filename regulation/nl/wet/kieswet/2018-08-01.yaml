        bwb_id: BWBR0020495
        artikel: '22'
  - number: A 5
    text: |-
      1 De Kiesraad bestaat uit een voorzitter en zes andere leden. De Kiesraad kan uit de leden ondervoorzitters
      aanwijzen.

      2 Artikel 11 van de Kaderwet adviescolleges is van toepassing op de Kiesraad.

      3 De leden van de Kiesraad worden benoemd op grond van hun deskundigheid op het gebied van het kiesrecht en de
      verkiezingen. [Artikel 12, derde lid, van de Kaderwet adviescolleges][ref1] is van toepassing.

      4 De leden van de Kiesraad worden op eigen aanvraag door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ontslagen. Zij kunnen voorts bij koninklijk besluit worden geschorst en ontslagen wegens
      ongeschiktheid, onbekwaamheid dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen.
      De voordracht voor schorsing of ontslag wordt niet gedaan dan nadat de Kiesraad daarover is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel12
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelA_5
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '12'
  - number: A 6
    text: |-
      1 De [artikelen 15, eerste, derde, vierde en vijfde lid][ref1], en [16 van de Kaderwet adviescolleges][ref2] zijn
      van toepassing op de Kiesraad.

      2 De [artikelen 21][ref3] en [29 van de Kaderwet adviescolleges][ref4] zijn niet van toepassing op de Kiesraad.


