  - number: M 17
    text: |-
      Voor de zitting van briefstembureaus buiten Nederland kan Onze Minister van Buitenlandse Zaken danwel Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties danwel Onze Minister van Defensie, een later aanvangstijdstip bepalen
      dan het in [artikel J 1, tweede lid][ref1], genoemde.


