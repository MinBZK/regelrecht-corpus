        afdeling: II
  - number: J 2
    text: |-
      De stemming geschiedt in elke kieskring over de kandidaten wier namen voorkomen op de voor die kieskring geldig
      verklaarde kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_2
  - number: J 4
    text: |-
      1 Burgemeester en wethouders wijzen voor elk stembureau een geschikt stemlokaal aan. Bij algemene maatregel van
      bestuur kunnen hieromtrent nadere regels worden gesteld. De burgemeester brengt de adressen van de stemlokalen ter
      kennis van de kiezer op bij algemene maatregel van bestuur vast te stellen wijze.

      2 Burgemeester en wethouders dragen er zorg voor dat tenminste 25% van de in de gemeente aangewezen stemlokalen
      zodanig zijn gelegen en zo zijn ingericht dat kiezers met lichamelijke beperkingen zoveel mogelijk hun stem
      zelfstandig kunnen uitbrengen.

      3 Op verzoek van burgemeester en wethouders stellen de besturen van bijzondere scholen de daarvoor in aanmerking
      komende lokalen en het zich daarin bevindende materiaal voor de inrichting en het gebruik als stemlokaal
      beschikbaar, desgewenst tegen vergoeding van de daaruit voortvloeiende onkosten.

      4 De burgemeester draagt zorg voor de inrichting van het stemlokaal en wijst zo nodig personen aan die het
      stembureau ten dienste worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_4
  - number: J 4a
    text: |-
      1 Burgemeester en wethouders kunnen in hun gemeente mobiele stembureaus aanwijzen. De burgemeester brengt een
      dergelijke aanwijzing ten minste veertien dagen voor de stemming ter openbare kennis.

      2 Burgemeester en wethouders stellen de zittingstijden vast en onderscheiden plaatsen waar de mobiele stembureaus
      gedurende de dag der stemming worden gestationeerd. De tijdstippen en plaatsen worden bekend gemaakt in de openbare
      kennisgeving, bedoeld in het eerste lid.

      3 Alvorens een stembureau als bedoeld in het eerste lid naar een andere standplaats vertrekt, wordt de sleuf van de
      stembus door de voorzitter van het stembureau in tegenwoordigheid van de aanwezige kiezers afgesloten en verzegeld.
      De voorzitter bewaart de sleutel waarmee de stembus is afgesloten, tijdens het verplaatsen naar de volgende
      standplaats. De voorzitter opent na de aankomst van het mobiele stembureau op de nieuwe standplaats de stembus in
      tegenwoordigheid van de aanwezige kiezers.

      4 [Artikel J 1, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_4a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_1
        hoofdstuk: J
        paragraaf: '1'
        afdeling: II
  - number: J 5
    text: |-
      1 Behoudens de gevallen, genoemd in de [hoofdstukken K][ref1], [L][ref2] en [M][ref3] neemt de kiezer deel aan de
      stemming in een stemlokaal van zijn keuze dat ligt in de gemeente waar hij op de dag van de kandidaatstelling als
      kiezer is geregistreerd en dat ligt in het gebied van het orgaan waarvoor de verkiezing wordt gehouden.

      2 Burgemeester en wethouders kunnen besluiten dat kiezers kunnen stemmen in één of meer stemlokalen die liggen in
      de gemeente maar buiten het gebied van het orgaan waarvoor de verkiezing wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukK
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref3]: https://wetten.overheid.nl/BWBR0004627#HoofdstukM
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: K
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        hoofdstuk: L
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004627
        hoofdstuk: M
        afdeling: II
  - number: J 6
    text: |-
      De gemeenteraad kan bepalen dat tegelijk met de stemming in het stemlokaal een andere, door de gemeenteraad
      uitgeschreven, stemming plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_6
  - number: J 6a
    text: |-
      De stemmingen voor de verkiezing van de leden van provinciale staten en de verkiezing van de leden van het algemeen
      bestuur vinden in dezelfde stemlokalen plaats.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_6a
  - number: J 6b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met het oog op de combinatie van
      stemmingen als bedoeld in de [artikelen J 6][ref1] en [J 6a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6a
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_6b
    references:
