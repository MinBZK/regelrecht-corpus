  - number: H 11
    text: |-
      1 Kandidatenlijsten, ingeleverd voor verschillende kieskringen, waarop dezelfde kandidaten in gelijk aantal en in
      dezelfde volgorde zijn geplaatst, vormen tezamen een stel gelijkluidende lijsten.

      2 Kandidatenlijsten, ingeleverd voor verschillende kieskringen, waarboven dezelfde aanduiding van een politieke
      groepering is geplaatst of waarvan de eerste kandidaat dezelfde is, vormen tezamen een lijstengroep. Het bepaalde
      in de vorige volzin is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer
      groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_11
  - number: H 12
    text: |-
      1 Indien het betreft de verkiezing van de leden van de Tweede Kamer, moet voor elke lijstengroep, elk niet van een
      groep deel uitmakend stel gelijkluidende lijsten en elke op zichzelf staande lijst een waarborgsom van € 11 250 dan
      wel, indien boven de kandidatenlijst de aanduiding is geplaatst van een groepering die blijkens de statuten haar
      zetel heeft in Bonaire, Sint Eustatius of Saba of, indien het een kandidatenlijst betreft waarboven geen aanduiding
      is geplaatst, indien de eerstgenoemde kandidaat ingezetene is van Bonaire, Sint Eustatius of Saba, een waarborgsom
      van USD 11 250 worden betaald aan de Staat.

      2 [Artikel H 4, achtste lid][ref1], is van overeenkomstige toepassing.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt voor elke kieskring een bewijs
      daarvan. Bij de indiening van een lijst voor een of meer kieskringen moet een bewijs worden ingeleverd.

      4 Indien geen geldige lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door de
      Staat de waarborgsom teruggegeven aan degene die de betaling heeft verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijstengroep, het niet van een
      groep deel uitmakende stel gelijkluidende lijsten of de op zichzelf staande lijst lager is dan 75 procent van de
      kiesdeler, bedoeld in [artikel P 5][ref2]. In dat geval vervalt de waarborgsom aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_5
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_12
