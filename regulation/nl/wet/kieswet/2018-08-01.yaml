  - number: Y 22a
    text: |-
      De stemming geschiedt in elke kieskring over de kandidaten wier namen voorkomen op de voor het gehele land geldig
      verklaarde kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelY_22a
  - number: Y 22b
    text: |-
