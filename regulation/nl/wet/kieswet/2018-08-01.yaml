  - number: N 17
    text: |-
      1 Indien in een briefstembureau buiten Nederland de stemopneming, gemeten naar Nederlandse tijd, eerder aanvangt
      dan in Nederland, blijft [artikel N 9, eerste lid][ref1], buiten toepassing.

      2 In dat geval draagt het hoofd van de diplomatieke of consulaire vertegenwoordiging danwel de vertegenwoordiger
      van Nederland in Aruba, Curaçao of Sint Maarten danwel de Nederlandse leiding van de militaire missie er zorg voor
      dat een afschrift van het proces-verbaal van het briefstembureau vanaf de volgende dag gedurende vier weken bij de
      vertegenwoordiging danwel de Nederlandse leiding van de militaire missie voor een ieder ter inzage ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
