  - number: U 17
    text: |-
      Het centraal stembureau kan, hetzij ambtshalve, hetzij naar aanleiding van een met opgave van redenen gedaan
      verzoek van een of meer leden van de staten van een provincie, tot een nieuwe opneming van stembiljetten uit een of
      meer provincies overgaan.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelU_17
  - number: U 18
    text: |-
      1 Zodra de uitslag van de verkiezing is vastgesteld, worden de geopende verzegelde pakken, nadat alle stembiljetten
      weer daarin zijn gedaan, opnieuw verzegeld.

      2 Het centraal stembureau bewaart de verzegelde pakken drie maanden nadat over de toelating van de gekozenen is
      beslist. Daarna vernietigt het deze pakken onmiddellijk. Van deze vernietiging wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelU_18
  - number: U 19
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelU_19
  - number: V 1
    text: |-
      1 De voorzitter van het centraal stembureau geeft de benoemde schriftelijk kennis van zijn benoeming. De brief,
      houdende deze kennisgeving, wordt uiterlijk de dag na de vaststelling van de uitslag van de verkiezingen of na de
      benoemdverklaring tegen gedagtekend ontvangstbewijs uitgereikt of aangetekend verzonden. Aan benoemde leden van de
      Tweede Kamer respectievelijk de Eerste Kamer wordt de brief binnen deze termijn tegen gedagtekend ontvangstbewijs
      uitgereikt of aangetekend verzonden door de voorzitter van de Tweede Kamer respectievelijk de Eerste Kamer
      der Staten-Generaal. De voorzitter van het centraal stembureau overhandigt de brief hiertoe onverwijld na de
      vaststelling van de uitslag of de benoemdverklaring aan de voorzitter van de Tweede Kamer respectievelijk de Eerste
      Kamer der Staten-Generaal.

      2 Indien de benoemde een gemachtigde heeft aangewezen, geschiedt de toezending of uitreiking aan die gemachtigde.

      3 De voorzitter geeft tegelijkertijd schriftelijk kennis van de benoeming aan het vertegenwoordigend orgaan. Deze
      kennisgeving strekt de benoemde tot geloofsbrief.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_1
  - number: V 2
    text: |-
      1 De benoemde draagt er zorg voor dat uiterlijk op de tiende of, bij een benoeming in een na de eerste samenkomst
      van het nieuw gekozen orgaan opengevallen plaats, de achtentwintigste dag na de dagtekening van de kennisgeving
      van benoeming het vertegenwoordigend orgaan van hem, onderscheidenlijk van de gemachtigde, bij brief mededeling
      ontvangt dat hij de benoeming aanneemt.

      2 Is binnen die tijd de mededeling niet ontvangen, dan wordt hij geacht de benoeming niet aan te nemen.

      3 De voorzitter van het vertegenwoordigend orgaan deelt aan de voorzitter van het centraal stembureau onverwijld
      mede, dat de benoemde de benoeming heeft aangenomen, dan wel dat hij geacht wordt de benoeming niet aan te nemen.

      4 Indien de benoemde de benoeming niet aanneemt, doet hij of zijn gemachtigde daarvan binnen de in het eerste lid
      bedoelde termijn bij brief mededeling aan de voorzitter van het centraal stembureau. Deze geeft hiervan kennis aan
      het vertegenwoordigend orgaan.

      5 Zolang nog niet tot toelating van de benoemde is besloten, kan deze, onderscheidenlijk zijn gemachtigde, bij
      brief aan het vertegenwoordigend orgaan mededelen dat hij op de aanneming van de benoeming terugkomt. Hij wordt
      dan geacht de benoeming niet te hebben aangenomen. De voorzitter van het vertegenwoordigend orgaan geeft van de
      ontvangst van deze mededeling onverwijld kennis aan de voorzitter van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_2
  - number: V 3
    text: |-
      1 Tegelijk met de mededeling dat hij zijn benoeming aanneemt, legt de benoemde, onderscheidenlijk zijn gemachtigde,
      aan het vertegenwoordigend orgaan een door hem ondertekende verklaring over, vermeldende alle openbare betrekkingen
      die de benoemde bekleedt.

      2 Tenzij de benoemde op het tijdstip van benoeming reeds lid van het vertegenwoordigend orgaan was, legt hij
      tevens een gewaarmerkt afschrift van gegevens uit de basisregistratie personen over, waaruit zijn woonplaats,
      datum en plaats van de geboorte, alsmede, indien het betreft een benoeming tot lid van de Tweede of Eerste Kamer of
      provinciale staten, zijn Nederlanderschap blijken.

      3 De gemachtigde van de benoemde die buiten Nederland woonplaats heeft, legt in plaats van het afschrift, bedoeld
      in het tweede lid, een uittreksel uit de geboorteregisters over, waaruit datum en plaats van de geboorte van de
      benoemde blijken, alsmede een bewijs van Nederlanderschap betreffende de benoemde.

      4 Indien een tot lid van de gemeenteraad benoemde persoon geen onderdaan is van een lidstaat van de Europese
      Unie, legt hij een gewaarmerkt afschrift van gegevens uit de basisregistratie personen over, waaruit blijkt of hij
      voldoet aan de vereisten, bedoeld in [artikel 10, tweede lid, van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel10
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_3
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '10'
  - number: V 4
    text: |-
      1 Het vertegenwoordigend orgaan waarvoor de verkiezing is geschied, onderzoekt de geloofsbrief onverwijld en
      beslist of de benoemde als lid van dat orgaan wordt toegelaten. Daarbij gaat het na, of de benoemde aan de
      vereisten voor het lidmaatschap voldoet en geen met het lidmaatschap onverenigbare betrekking vervult, en beslist
      het de geschillen welke met betrekking tot de geloofsbrief of de verkiezing zelf rijzen. Indien de benoemde voor de
      eerste samenkomst van het nieuw gekozen orgaan de voor het lidmaatschap vereiste leeftijd zal hebben bereikt, wordt
      daarmee bij het nemen van de beslissing rekening gehouden. De wijze waarop het onderzoek van de geloofsbrieven van
      de leden van de Tweede, onderscheidenlijk van de Eerste Kamer geschiedt, wordt geregeld in het reglement van orde
      van de desbetreffende kamer.

      2 Het onderzoek van de geloofsbrief strekt zich niet uit tot de geldigheid van de kandidatenlijsten.

      3 Betreft het de toelating van degene die is benoemd in een tussentijds opengevallen plaats, dan strekt het
      onderzoek zich niet uit tot punten die het verloop van de verkiezing of de vaststelling van de uitslag betreffen.

      4 Ten behoeve van het onderzoek, bedoeld in het eerste lid, kan het vertegenwoordigend orgaan tot een nieuwe
      opneming van stembiljetten, zowel uit alle als uit een of meer stembureaus of provincies, besluiten. De
      burgemeester of het centraal stembureau, voor zover die de desbetreffende stembiljetten onder zich heeft,
      onderscheidenlijk de voorzitter van het centraal stembureau voor de verkiezing van de leden van de Eerste Kamer,
      doet deze op verzoek van het vertegenwoordigend orgaan onverwijld naar dat orgaan overbrengen. Na ontvangst van
      de stembiljetten gaat het vertegenwoordigend orgaan onmiddellijk tot de opneming over. Het is bevoegd daartoe
      de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de stembureaus. Bij deze
      opneming zijn de [artikelen N 5][ref1], [ N 8][ref2] en [N 9][ref3] van overeenkomstige toepassing.

      5 Ten behoeve van het onderzoek, bedoeld in het eerste lid, is het vertegenwoordigend orgaan tevens bevoegd de
      verzegelde pakken, bedoeld in [artikel N 2][ref4], te openen. De burgemeester die de desbetreffende pakken onder
      zich heeft, doet deze op verzoek van het vertegenwoordigend orgaan onverwijld naar dat orgaan overbrengen. Na
      beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op de in
      [artikel N 2][ref5] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_5
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref5]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
