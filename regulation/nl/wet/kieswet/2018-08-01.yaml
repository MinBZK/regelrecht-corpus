  - number: H 4
    text: |-
      1 Bij de lijst worden, voor iedere kieskring waarvoor de lijst wordt ingeleverd, schriftelijke verklaringen van
      ondersteuning overgelegd, waarop de kandidaten op dezelfde wijze en in dezelfde volgorde worden vermeld als op de
      lijst. Het minimum aantal te overleggen verklaringen bedraagt:

      a. voor kieskring 20 (Bonaire): tien.

      b. voor de kieskring bij de verkiezing van de leden van een gemeenteraad waarbij het aantal te verdelen zetels
      minder dan negentien is: tien.

      c. voor de kieskring bij de verkiezing van de leden van een gemeenteraad waarin het aantal te verdelen zetels
      minder dan negenendertig, doch minimaal negentien is: twintig.

      d. voor iedere andere kieskring: dertig.

      2 Verklaringen van ondersteuning voor een kieskring kunnen slechts worden afgelegd door personen die binnen die
      kieskring als kiezer zijn geregistreerd voor de desbetreffende verkiezing.

      3 De kiezer die een verklaring van ondersteuning wenst af te leggen, ondertekent binnen een termijn van
      veertien dagen voorafgaand aan of op de dag van de kandidaatstelling deze verklaring in het gemeentehuis van
      de gemeente waar hij als kiezer is geregistreerd, in aanwezigheid van de burgemeester of een door deze daartoe
      aangewezen ambtenaar. De kiezer overhandigt aan de burgemeester of de ambtenaar een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      4 De burgemeester of de door hem daartoe aangewezen ambtenaar gaat onverwijld na of de ondertekenaar als kiezer in
      zijn gemeente is geregistreerd. Indien hem blijkt dat dit het geval is, tekent hij dit op de verklaring aan.

      5 Een kiezer mag niet meer dan één verklaring van ondersteuning ondertekenen.

      6 Een overgelegde verklaring van ondersteuning kan niet worden ingetrokken.

      7 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen van
      ondersteuning, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een
      model vastgesteld.

      8 De in het eerste lid bedoelde verplichting geldt niet voor een kandidatenlijst van een politieke groepering,
      indien de aanduiding daarvan was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden verkiezing van
      de leden van het desbetreffende vertegenwoordigende orgaan een of meer zetels zijn toegekend. De vorige volzin is
      mede van toepassing ten aanzien van:

      a. samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de laatstgehouden verkiezing van de
      leden van het desbetreffende orgaan, hetzij aan de gezamenlijke groeperingen, hetzij aan tenminste één daarvan, één
      of meer zetels zijn toegekend;

      b. een nieuwe aanduiding indien twee of meer groeperingen als één groepering onder een nieuwe naam samen aan de
      verkiezingen deelnemen en bij de laatstgehouden verkiezingen van de leden van het desbetreffende orgaan, aan ieder
      van de afzonderlijke groeperingen één of meer zetels zijn toegekend;

      c. een nieuwe aanduiding indien twee of meer groeperingen als één groepering onder een nieuwe naam samen aan de
      verkiezingen deelnemen en bij de laatstgehouden verkiezingen van de leden van het desbetreffende orgaan onder een
      samengevoegde aanduiding met een gezamenlijke lijst deelnamen en daaraan één of meer zetels zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_4
    references:
