    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende het betalen van waarborgsommen ten
      behoeve van de registratie.

      2 Bij ministeriële regeling worden modellen vastgesteld voor de registers waarin de aanduidingen voor politieke
      groeperingen worden vermeld, de openbare kennisgevingen inzake de geregistreerde aanduidingen en de namen van de
      gemachtigden en hun plaatsvervangers, alsmede voor de bewijzen van betaling van de waarborgsom.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelG_6
  - number: H 1
    text: |-
      1 Op de dag van de kandidaatstelling kunnen bij het centraal stembureau van negen tot zeventien uur
      kandidatenlijsten worden ingeleverd.

      2 Ten minste drie weken voor de kandidaatstelling brengt het centraal stembureau ter openbare kennis waar en
      wanneer kandidatenlijsten, alsmede de daarbij horende stukken, kunnen worden ingeleverd.

      3 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de kandidatenlijsten,
      kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een model
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_1
  - number: H 2
    text: Op de kandidatenlijst wordt vermeld voor welke kieskring of kieskringen zij wordt ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_2
  - number: H 3
    text: |-
      1 De inlevering van de lijst geschiedt persoonlijk door een kiezer, bevoegd tot deelneming aan
      de desbetreffende verkiezing. De inleveraar identificeert zich met een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1]. De kandidaten kunnen bij de inlevering aanwezig zijn.

      2 Aan degene die de lijst inlevert, kan door de gemachtigde, bedoeld in het derde lid van de [artikelen G 1][ref2],
      [G 2][ref3], [G 2a][ref4] of [G 3][ref5], de bevoegdheid worden verleend boven de lijst de aanduiding van de
      desbetreffende groepering te plaatsen, zoals deze door het centraal stembureau is geregistreerd. Een verklaring van
      de gemachtigde waaruit deze bevoegdheid blijkt, wordt bij de lijst overgelegd.

      3 Degene die de lijst inlevert, is bevoegd daarboven een aanduiding te plaatsen, gevormd door samenvoeging van voor
      de desbetreffende verkiezing geregistreerde aanduidingen of afkortingen daarvan, indien hem daartoe de bevoegdheid
      is verleend door de gemachtigden van de onderscheidene groeperingen. Verklaringen van de gemachtigden waaruit deze
      bevoegdheid blijkt, worden bij de lijst overgelegd. Een aldus gevormde aanduiding mag niet meer dan 35 letters of
      andere tekens bevatten.

      4 Degene die de lijst heeft ingeleverd, ontvangt daarvan een bewijs.

      5 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen met
      betrekking tot het plaatsen van aanduidingen van politieke groeperingen boven kandidatenlijsten, kosteloos,
      verkrijgbaar zijn. Bij ministeriële regeling wordt voor de formulieren een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
