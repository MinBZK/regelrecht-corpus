      1 Bij de lijst wordt van iedere daarop voorkomende kandidaat een schriftelijke verklaring overgelegd dat hij niet
      in een andere lidstaat kandidaat voor het lidmaatschap van het Europees Parlement zal zijn.

      2 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de in het eerste lid
      bedoelde verklaring, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.
