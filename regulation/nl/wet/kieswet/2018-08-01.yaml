  - number: D 9
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de registratie van de
      kiesgerechtigdheid, onder meer over:

      a. de indiening van een aanvraag, de beslissing op een aanvraag en de verstrekking van formulieren, bedoeld in
      artikel D 3; en

      b. ambtshalve wijzigingen als bedoeld in artikel D 6.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_9
  - number: D 10
    text: |-
      Artikel 18 van de Algemene verordening gegevensbescherming is niet van toepassing op verwerking van
      persoonsgegevens op grond van [artikel D 1][ref1].


