  - number: Z 11a
    text: |-
      1 De [artikelen 14 tot en met 21 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] zijn van
      overeenkomstige toepassing op de uitoefening van de taken en bevoegdheden van de Autoriteit persoonsgegevens in het
      kader van deze wet.

      2 De [artikelen 124][ref2] en [268 van de Gemeentewet][ref3] blijven buiten toepassing ten aanzien van het toezicht
      op het college van burgemeester en wethouders en de burgemeester inzake verwerking van persoonsgegevens in het
      kader van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel14
