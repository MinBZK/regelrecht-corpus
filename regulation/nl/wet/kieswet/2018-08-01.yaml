  - number: N 16
    text: |-
      1 Bij een briefstembureau wordt, nadat aan [artikel N 1, tweede lid][ref1], toepassing is gegeven, de lijst van
      personen die per brief mogen stemmen met een gewaarmerkte verklaring van het stembureau betreffende het aantal
      gezette parafen, in een pak gedaan, dat wordt verzegeld. Vervolgens worden op overeenkomstige wijze ingepakt de
      retourenveloppen, bedoeld in [artikel M 11][ref2], alsmede de ingeleverde briefstembewijzen.

      2 Alvorens over te gaan tot de handelingen, bedoeld in [artikel N 5][ref3], opent de voorzitter van het
      briefstembureau de enveloppen die zich in de stembus bevinden. Indien in een enveloppe zich geen of meer dan één
      stembiljet bevindt, wordt hiervan een aantekening gemaakt. Indien zich meer dan één stembiljet in één enveloppe
      bevindt, doet de voorzitter van het briefstembureau deze biljetten wederom in de enveloppe en legt hij deze, na
      haar te hebben verzegeld, terzijde.

      3 [Artikel N 7][ref4] is van toepassing, met dien verstande dat voor de toepassing van het eerste lid, in plaats
      van «rood heeft gemaakt» wordt gelezen: rood, blauw, zwart of groen heeft gemaakt, en dat voor de toepassing van
      het derde lid, in plaats van «rood maken» wordt gelezen: rood, blauw, zwart of groen maken.

      4 [Artikel N 8, eerste lid][ref5], is van toepassing, met dien verstande dat in plaats van «artikel N 7» wordt
      gelezen: [artikel N 16, derde lid][ref6],.


