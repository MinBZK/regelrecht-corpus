  - number: I 19
    text: |-
      Het centraal stembureau vernietigt de ingeleverde kandidatenlijsten alsmede de daarbij horende stukken, met
      uitzondering van de overgelegde verklaringen van instemming, na de vaststelling van de uitslag. Van de vernietiging
      wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_19
  - number: I 20
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens door het centraal stembureau bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_20
  - number: J 1
    text: |-
      1 De stemming vindt plaats op de vierenveertigste dag na de kandidaatstelling. Indien toepassing is gegeven
      aan [artikel F 1, derde lid][ref1], kan bij het koninklijk besluit, bedoeld in dat artikel, de dag van stemming
      worden vastgesteld op een dag na de vierenveertigste dag na de kandidaatstelling, met dien verstande dat de dag
      van stemming met niet meer dagen wordt verplaatst dan het aantal dagen waarmee de dag van kandidaatstelling is
      vervroegd.

      2 De stemming vangt aan om zeven uur dertig en duurt tot eenentwintig uur.

      3 Burgemeester en wethouders kunnen voor stembureaus waar dat wenselijk is met het oog op de plaats waar de bureaus
      zitting houden bepalen dat de stemming in deze stembureaus aanvangt op een eerder of een later tijdstip dan zeven
      uur dertig en eindigt op een eerder tijdstip dan eenentwintig uur. De burgemeester brengt deze tijdstippen ten
      minste veertien dagen voor de stemming ter openbare kennis.

      4 De stemopneming van de stembureaus, bedoeld in het derde lid, vindt plaats om eenentwintig uur op een door
      burgemeester en wethouders vast te stellen en bekend te maken plaats. De plaats van stemopneming wordt bekend
      gemaakt in de openbare kennisgeving, bedoeld in het derde lid.

      5 Een stembureau als bedoeld in het derde lid is, met uitzondering van een stembureau als bedoeld in
      [artikel J 4a][ref2], op de dag van de stemming ten minste acht uur aaneengesloten geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelF_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_4a
