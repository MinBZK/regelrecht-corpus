    text: |-
      In afwijking van [artikel N 1, eerste lid][ref1], stelt het stembureau vast het aantal door het stembureau
      ontvangen retourenveloppen en het aantal ingevolge [artikel M 11][ref2] terzijde gelegde retourenveloppen. Het
      verschil tussen deze aantallen is het aantal kiezers dat tot de stemming is toegelaten.


