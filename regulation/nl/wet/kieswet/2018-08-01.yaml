  - number: I 17
    text: |-
      1 Nadat onherroepelijk is beslist over de geldigheid van de ingeleverde lijsten maakt het centraal stembureau de
      lijsten zo spoedig mogelijk openbaar.

      2 De openbaarmaking geschiedt:

      indien het betreft de verkiezing van de leden van de Tweede Kamer, door plaatsing van de lijsten naar de
      kieskringen gerangschikt en met vermelding van hun nummers en, in voorkomend geval, de aanduidingen van de
      politieke groeperingen in de Staatscourant;

      indien het betreft de verkiezing van de leden van provinciale staten, het algemeen bestuur of de gemeenteraad, door
      de van de nummers en, in voorkomend geval, de aanduidingen van de politieke groeperingen voorziene lijsten op een
      algemeen toegankelijke wijze openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_17
  - number: I 18
    text: |-
      1 Van de in de [artikelen I 1][ref1] en [I 4][ref2] bedoelde zittingen wordt proces-verbaal opgemaakt. Het proces-
      verbaal wordt voor een ieder ter inzage gelegd.

      2 De bij de in [artikel I 4][ref3] bedoelde zitting aanwezige kiezers kunnen mondeling bezwaren inbrengen. Van deze
      bezwaren wordt in het proces-verbaal melding gemaakt.

      3 Bij algemene maatregel van bestuur worden geregeld:

      a. de plaats waar de processen-verbaal ter inzage worden gelegd;

      b. de bekendmaking van het tijdstip en de plaats van de zitting, bedoeld in [artikel I 4][ref4].

      4 Bij ministeriële regeling worden voor de processen-verbaal modellen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
