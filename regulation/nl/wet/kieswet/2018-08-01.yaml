  - number: H 13
    text: |-
      1 Indien het betreft de verkiezing van de leden van provinciale staten, moet voor elke lijstengroep, elk niet van
      een groep deel uitmakend stel gelijkluidende lijsten en elke op zichzelf staande lijst een waarborgsom van € 1 125
      dan wel, indien boven de kandidatenlijst de aanduiding is geplaatst van een groepering die blijkens de statuten
      haar zetel heeft in Bonaire, Sint Eustatius of Saba of, indien het een kandidatenlijst betreft waarboven geen
      aanduiding is geplaatst, indien de eerstgenoemde kandidaat ingezetene is van Bonaire, Sint Eustatius of Saba, een
      waarborgsom van USD 1 125 worden betaald aan de gemeente waar het centraal stembureau is gevestigd.

      2 [Artikel H 4, achtste lid][ref1], is van overeenkomstige toepassing.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt voor elke kieskring een bewijs
      daarvan. Bij de indiening van een lijst voor een of meer kieskringen moet een bewijs worden ingeleverd.

      4 Indien geen geldige lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door de
      gemeente waar het centraal stembureau is gevestigd de waarborgsom teruggegeven aan degene die de betaling heeft
      verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijstengroep, het niet van
      een groep deel uitmakende stel gelijkluidende lijsten of de op zichzelf staande lijst lager is dan 75 procent van
      de kiesdeler, bedoeld in [artikel P 5][ref2], en aan de lijst geen zetel is toegewezen. In dat geval vervalt de
      waarborgsom aan de gemeente waar het centraal stembureau is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_5
