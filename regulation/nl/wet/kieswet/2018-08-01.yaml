      1 In afwijking van de [artikelen 6:7][ref1] en [6:8, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt een
      beroepschrift tegen:

      a. een beschikking als bedoeld in de [artikelen G 1][ref3] en [G 2][ref4] ingediend uiterlijk op de zesde dag na de
      dagtekening van de Staatscourant waarin die beschikking is medegedeeld;

      b. een beschikking als bedoeld in de [artikelen G 2a][ref5] en [G 3][ref6] ingediend uiterlijk op de zesde dag na
      de dagtekening van de openbare kennisgeving, bedoeld in het vijfde lid van dat artikel;

      c. een beschikking als bedoeld in [artikel G 4][ref7] ingediend uiterlijk op de zesde dag na de dagtekening waarop
      die beschikking is bekendgemaakt.

      2 [Artikel D 8][ref8] is van overeenkomstige toepassing.


