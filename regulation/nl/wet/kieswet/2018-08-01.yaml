  - number: J 8
    text: |-
      1 Aan de tot deelneming aan de stemming bevoegde kiezer wiens stempas in het ongerede is geraakt of die geen
      stempas heeft ontvangen, wordt op zijn verzoek door de burgemeester een nieuwe stempas uitgereikt of verzonden.

      2 De kiezer doet hiervoor een schriftelijk of mondeling verzoek aan de burgemeester.

      3 Het schriftelijk verzoek dient uiterlijk vijf dagen voor de stemming te zijn ontvangen. Het mondeling verzoek
      wordt uiterlijk op de dag voor de stemming om twaalf uur gedaan. Deze termijnen worden op de stempas vermeld.

      4 De kiezer legt bij zijn verzoek een kopie over van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      5 Aan de kiezer wiens stempas op grond van [artikel J 7a, tweede lid, onderdelen a, c, d en e][ref2], ongeldig is,
      wordt geen nieuwe stempas uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_7a
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
  - number: J 9
    text: |-
      De burgemeester brengt de kandidatenlijsten ter kennis van de kiezers op bij algemene maatregel van bestuur vast te
      stellen wijze. De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing
      op verwerking van persoonsgegevens bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_9
  - number: J 10
    text: |-
      Iedere werkgever is verplicht te zorgen dat iedere kiezer die bij hem in dienstbetrekking is, de gelegenheid krijgt
      zijn stem uit te brengen voor zover dit niet kan geschieden buiten de vastgestelde arbeidstijd en mits de kiezer
      daardoor niet meer dan twee uur verhinderd is zijn arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_10
  - number: J 11
    text: |-
      1 De voorzitter en de leden van het stembureau, alsmede de personen die het stembureau ten dienste staan, die in
      een andere gemeente dan waar zij als kiesgerechtigde zijn geregistreerd aan de stemming deelnemen, kunnen, indien
      zij kiesgerechtigd zijn voor het orgaan waarvoor de verkiezing wordt gehouden, naar keuze bij dit stembureau of bij
      een stembureau binnen de gemeente waar zij als kiesgerechtigde geregistreerd zijn, aan de stemming deelnemen.

      2 Van het uitbrengen van hun stem wordt melding gemaakt in het proces-verbaal.

      3 Dit artikel is niet van toepassing bij een verkiezing van de leden van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_11
  - number: J 12
    text: |-
      1 Gedurende de zitting zijn steeds de voorzitter en twee leden van het stembureau aanwezig.

      2 Het stembureau bepaalt wie als tweede en derde lid van het stembureau optreden.

      3 Bij ontstentenis van de voorzitter treedt het tweede lid en bij diens ontstentenis het derde lid als voorzitter
      op.

      4 Bij ontstentenis van een lid treedt een door of vanwege burgemeester en wethouders aan te wijzen plaatsvervangend
      lid op.

      5 Indien geen plaatsvervangend lid beschikbaar is, verzoekt de voorzitter een van de in het stemlokaal aanwezige
      kiezers die hij daartoe geschikt acht, als zodanig op te treden totdat dit wel het geval is.

      6 Van de wisselingen in de samenstelling van het stembureau wordt in het proces-verbaal aantekening gehouden met
      opgave van de tijd van de vervanging.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_12
  - number: J 13
    text: Indien bij het nemen van een beslissing door het stembureau de stemmen staken, beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_13
  - number: J 14
    text: De leden van het stembureau geven tijdens de uitoefening van hun functie geen blijk van hun politieke gezindheid.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_14
  - number: J 15
    text: Het stemlokaal is zodanig ingericht dat het stemgeheim is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_15
  - number: J 16
    text: |-
      1 In het stemlokaal zijn geplaatst een tafel voor het stembureau en een of meer stembussen en stemhokjes.

      2 De toegang tot de stemhokjes moet zichtbaar zijn voor het publiek.

      3 In ieder stemhokje bevindt zich een handleiding voor de kiezer. Bij ministeriële regeling wordt voor de
      handleiding een model vastgesteld.

      4 De tafel voor het stembureau is zo geplaatst dat de kiezers de verrichtingen van het stembureau kunnen gadeslaan.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_16
  - number: J 17
    text: |-
      1 Op de tafel voor het stembureau ligt het uittreksel van ongeldige stempassen. De burgemeester draagt er zorg voor
      dat elk stembureau over dit uittreksel beschikt.

      2 Ieder stembureau beschikt over de wettelijke voorschriften die op de stemming betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_17
  - number: J 18
    text: |-
      1 De stembus, vervaardigd volgens bij algemene maatregel van bestuur te geven voorschriften, staat bij de tafel,
      binnen het bereik van het lid van het stembureau dat belast is met de in [artikel J 26, derde lid][ref1], bedoelde
      taak.

      2 Tijdig voor de aanvang van de stemming sluit het stembureau de stembus, na zich ervan overtuigd te hebben dat zij
      leeg is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_26
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_18
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_26
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
  - number: J 19
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van het
      stemlokaal.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_19
  - number: J 20
    text: |-
      1 Op bij de verkiezingen te bezigen stembiljetten kunnen kiezers een keuze maken uit de kandidaten over wie de
      stemming moet geschieden. De stembiljetten zijn voorzien van de handtekening van de voorzitter van het centraal
      stembureau alsmede van de naam van het vertegenwoordigend orgaan waarvoor de verkiezing geldt en een aanduiding van
      de kieskring.

      2 Bij ministeriële regeling wordt voor de stembiljetten een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_20
  - number: J 21
    text: |-
      De burgemeester draagt zorg dat voldoende stembiljetten en formulieren voor de processen-verbaal voor aanvang
      van de stemming bij elk stembureau in zijn gemeente aanwezig zijn. De artikelen 15, 16 en 18 van de Algemene
      verordening gegevensbescherming zijn niet van toepassing op verwerking van persoonsgegevens bij of krachtens dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_21
  - number: J 24
    text: |-
      1 Tot de stemming wordt slechts toegelaten de kiezer die bevoegd is aan de verkiezing deel te nemen, voor zover:

      a. de voorzitter van het stembureau de identiteit van de kiezer heeft vastgesteld aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1];

      b. de kiezer in het bezit is van de hem toegezonden of ingevolge [artikel J 8][ref2] uitgereikte stempas, dan wel
      een kiezerspas of een volmachtbewijs.

      2 De in het eerste lid, onder a, bedoelde vaststelling van de identiteit kan ook geschieden aan de hand van
      een schriftelijke bevestiging van de betreffende autoriteit van het melden van de vermissing, overeenkomstig
      [artikel 5a van de Paspoortwet][ref3], in combinatie met een document van de kiesgerechtigde op diens naam en
      voorzien van zijn foto.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_8
      [ref3]: https://wetten.overheid.nl/BWBR0005212#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_24
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_8
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0005212
        artikel: 5a
  - number: J 25
    text: |-
      1 De kiezer overhandigt aan de voorzitter van het stembureau het in [artikel J 24, eerste lid, onder a][ref1],
      genoemde identiteitsdocument, en de stempas.

      2 Indien de voorzitter constateert dat de kiezer niet beschikt over een geldig identiteitsdocument, wordt de kiezer
      niet toegelaten tot de stemming.

      3 Indien de kiezer naar het oordeel van de voorzitter over een geldig identiteitsdocument beschikt, controleert de
      voorzitter de echtheid van de stempas.

      4 Indien het stembureau constateert dat de stempas niet echt is neemt de voorzitter de stempas in en wordt de
      kiezer niet toegelaten tot de stemming.

      5 Indien de stempas echt is, gaat het tweede lid van het stembureau na of het volgnummer van de stempas voorkomt in
      het uittreksel van ongeldige stempassen, bedoeld in [artikel J 7a, tweede volzin][ref2]. Indien dat het geval is,
      neemt het tweede lid van het stembureau de stempas in en wordt de kiezer niet toegelaten tot de stemming.

      6 Indien het volgnummer van de stempas niet voorkomt in het uittreksel van ongeldige stempassen, controleert de
      voorzitter vervolgens of de gegevens op het identiteitsdocument overeenkomen met de gegevens op de stempas. Indien
      de voorzitter constateert dat de gegevens niet overeenkomen, wordt de kiezer niet toegelaten tot de stemming.

      7 Indien de kiezer beschikt over een geldig identiteitdocument en een geldige stempas en de identiteit
      op beide documenten overeenkomt, neemt het tweede lid van het stembureau de stempas in en wordt de kiezer
      toegelaten tot de stemming. Voor zover deze handeling als gevolg van een nieuwe stemming als bedoeld in
      [artikel V 6, tweede lid][ref3], een verwerking van persoonsgegevens als bedoeld in artikel 4 van de Algemene
      verordening gegevensbescherming betreft, zijn de artikelen 15, 16 en 18 van die verordening niet van toepassing.

      8 Vervolgens overhandigt de voorzitter aan de kiezer een stembiljet.

      9 De voorzitter houdt aantekening van het aantal ingenomen geldige stempassen.

      10 De ingevolge dit artikel ingenomen stempassen die niet echt of ongeldig zijn, worden door het stembureau
      onbruikbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_6
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_25
