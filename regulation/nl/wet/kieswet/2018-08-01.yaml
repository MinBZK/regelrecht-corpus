  - number: S 7
    text: |-
      1 Van de in de [artikelen S 1][ref1] en [S 2][ref2] bedoelde zittingen wordt proces-verbaal opgemaakt.

      2 De bij de in [artikel S 2][ref3] bedoelde zitting aanwezige personen kunnen mondeling bezwaren inbrengen. Van
      deze bezwaren wordt in het proces-verbaal melding gemaakt.

      3 Bij ministeriële regeling worden voor deze processen-verbaal modellen vastgesteld.


