        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 11
    text: |-
      1 Het proces-verbaal wordt met de verzegelde pakken, bedoeld in [artikel N 2][ref1], alsmede met die, bedoeld
      in [artikel N 9][ref2], door de voorzitter of een door hem aan te wijzen ander lid van het stembureau naar de
      burgemeester overgebracht.

      2 Nadat de burgemeester van alle in zijn gemeente gevestigde stembureaus het proces-verbaal heeft ontvangen, stelt
      hij ten aanzien van iedere kandidaat en iedere lijst vast het aantal stemmen dat in zijn gemeente op die kandidaat,
      onderscheidenlijk die lijst, is uitgebracht.

      3 De burgemeester stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal stemmen dat bij volmacht is uitgebracht; en

      d. het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld.
      Voor zover mogelijk geeft de burgemeester hiervoor een verklaring.

      4 De burgemeester van ’s-Gravenhage maakt bij de vaststelling, bedoeld in het tweede en derde lid, apart melding
      van het aantal stemmen dat ten aanzien van iedere kandidaat en iedere lijst in de briefstembureaus op die
      kandidaat, onderscheidenlijk die lijst, is uitgebracht.

      5 Voor de in het tweede en derde lid bedoelde vaststelling wordt gebruik gemaakt van een formulier waarvoor bij
      ministeriële regeling een model wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
