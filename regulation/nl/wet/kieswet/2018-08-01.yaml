  - number: U 16
    text: |-
      1 Het centraal stembureau stelt de uitslag van de verkiezingen zo spoedig mogelijk vast. De
      vaststelling en bekendmaking geschieden in een openbare zitting van het centraal stembureau. De
      [artikelen P 20, tweede tot en met vierde lid][ref1], en [P 22][ref2] zijn van toepassing.

      2 Het centraal stembureau maakt zijn proces-verbaal onverwijld op een algemeen toegankelijke wijze elektronisch
      openbaar. Bij ministeriële regeling kan hiervoor een internetadres worden aangewezen.

      3 De voorzitter van het centraal stembureau doet een afschrift van het proces-verbaal toekomen aan de Eerste Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
