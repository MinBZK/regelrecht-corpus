  - number: S 5
    text: |-
      1 Tegen een beschikking als bedoeld in [artikel S 2][ref1] kan, in afwijking van
      [artikel 8:1 van de Algemene wet bestuursrecht][ref2], beroep worden ingesteld door een belanghebbende en iedere
      kiezer.

      2 [Artikel I 7, eerste lid, tweede volzin, en tweede tot en met vierde lid][ref3], is van overeenkomstige
      toepassing.

      3 De voorzitter van de Afdeling bestuursrechtspraak van de Raad van State stelt partijen en de voorzitter van het
      centraal stembureau onverwijld in kennis van de uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel81
