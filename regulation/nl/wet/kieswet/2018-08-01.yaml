  - number: Y 6
    text: |-
      1 Voor Nederlanders die hun werkelijke woonplaats in een andere lidstaat hebben, bevat de aanvraag, bedoeld in
      [artikel Y 2][ref1] juncto [D 3][ref2], mede hun verklaring dat zij niet tevens zullen deelnemen aan de verkiezing
      in de andere lidstaat.

      2 Bij ministeriële regeling wordt voor de verklaring een model vastgesteld.

      3 Burgemeester en wethouders van 's-Gravenhage wijzen een aanvraag mede af of verwijderen een persoon mede uit de
      registratie, bedoeld in artikel [Y 2][ref3] juncto [D 2][ref4], indien zij van de lidstaat bericht hebben ontvangen
      dat de persoon in die lidstaat als kiezer is geregistreerd. De [artikelen D 7][ref5], [D 8][ref6] en [D 9][ref7]
      zijn van overeenkomstige toepassing op de beslissing van burgemeester en wethouders.


