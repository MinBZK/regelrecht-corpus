  - number: Ya 42
    text: |-
      1 In afwijking van [artikel 7 van de Wet administratieve rechtspraak BES][ref1] wordt het beroep tegen
      een beschikking van het bestuurscollege als bedoeld in [artikel D 7, eerste lid][ref2], een beschikking
      van de gezaghebber als bedoeld in de [artikelen K 8, eerste lid][ref3], [L 11, eerste lid][ref4], en
      [M 4, eerste lid][ref5], tegen een beschikking van het kiescollege als bedoeld in [artikel X 4, derde lid][ref6],
      en tegen een beschikking van de eilandsraad als bedoeld in de [artikelen X 5, derde lid][ref7], en
      [X 8, vierde lid][ref8], ingesteld bij het Gemeenschappelijk Hof.

      2 Op het beroep zijn de [hoofdstukken 3][ref9] en [6][ref10], met uitzondering van [§ 1][ref11] en
      [§ 3, van de Wet administratieve rechtspraak BES][ref12] van overeenkomstige toepassing.

      3 De [artikelen 54][ref13] en [55 van de Wet administratieve rechtspraak BES][ref14] zijn niet van toepassing.

      4 In afwijking van [artikel 17, vijfde lid, van de Wet administratieve rechtspraak BES][ref15] bedraagt de termijn
      binnen welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De
      president van het Gemeenschappelijk Hof kan een kortere termijn stellen.

      5 Het Gemeenschappelijk Hof behandelt de zaak met overeenkomstige toepassing van
      [§ 2 van hoofdstuk 6 van de Wet administratieve rechtspraak BES][ref16]. Aan het bestuursorgaan wordt terstond
      een afschrift van het beroepschrift toegezonden.


