  - number: M 10
    text: |-
      1 De voorzitter van het stembureau opent de retourenveloppe en neemt het briefstembewijs, de kopie van het
      identiteitsdocument, indien van toepassing de verklaring vanwege de Nederlandse openbare dienst, en de enveloppe
      met het stembiljet eruit. Hij controleert aan de hand van de kopie of het identiteitsdocument geldig was op de dag
      van de kandidaatstelling. Hij controleert indien van toepassing of de verklaring vanwege de Nederlandse openbare
      dienst is ondertekend. Hij controleert of de verklaring dat de kiezer het stembiljet persoonlijk heeft ingevuld, is
      ondertekend en of de daaronder geplaatste handtekening overeenstemt met de handtekening op het identiteitsdocument
      en indien van toepassing met de handtekening onder de verklaring vanwege de Nederlandse openbare dienst.

      2 Het tweede lid van het stembureau houdt aantekening dat een persoon van zijn kiesrecht gebruik heeft gemaakt door
      op de lijst van personen die per brief mogen stemmen zijn paraaf te zetten.

      3 De voorzitter overhandigt vervolgens de enveloppe met het stembiljet ongeopend aan het derde lid van het
      stembureau. Indien het stembiljet zich niet in de daartoe bestemde enveloppe bevindt, overhandigt de voorzitter het
      stembiljet, zonder het in te zien, dichtgevouwen aan het derde lid van het stembureau.

      4 Het derde lid van het stembureau steekt de enveloppe met het stembiljet in de stembus. Indien het stembiljet zich
      niet in de daartoe bestemde enveloppe bevindt, steekt het derde lid van het stembureau het stembiljet, zonder het
      in te zien, dichtgevouwen in de stembus.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_10
  - number: M 11
    text: |-
      Indien de retourenveloppe niet alle stembescheiden bevat of de stembescheiden anders dan het stembiljet, niet
      voldoen aan de vereisten die bij of krachtens dit hoofdstuk zijn gesteld, doet de voorzitter de aangetroffen
      bescheiden, zonder het stembiljet in te zien of zonder de enveloppe met het stembiljet te openen, wederom in de
      retourenveloppe en legt hij deze, na haar te hebben verzegeld, terzijde. De voorzitter doet hetzelfde indien in een
      retourenveloppe stembescheiden van meer personen zijn gevoegd waarvan er een of meer niet voldoet aan de vereisten
      die bij of krachtens dit hoofdstuk zijn gesteld of waarvan het aantal stembescheiden niet overeenkomt met het
      aantal stembiljetten, onderscheidenlijk enveloppen met stembiljet.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_11
  - number: M 13
    text: |-
      1 Onze Minister van Buitenlandse Zaken kan in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in een land een diplomatieke of consulaire vertegenwoordiging van Nederland aanwijzen waar een
      briefstembureau wordt ingesteld. Van deze aanwijzing wordt mededeling gedaan in de Staatscourant.

      2 Een briefstembureau kan ook voor personen die hun werkelijke woonplaats in een ander land hebben dan het land
      waarin de diplomatieke of consulaire vertegenwoordiging van Nederland gevestigd is, worden ingesteld.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in Aruba, in Curaçao en in Sint Maarten
      briefstembureaus in bij de Vertegenwoordiging van Nederland.

      4 Onze Minister van Defensie kan in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      een of meer militaire missies buiten het Koninkrijk aanwijzen ten behoeve waarvan aldaar een briefstembureau wordt
      ingesteld.

      5 De leden en plaatsvervangende leden van de in het eerste, derde en vierde lid bedoelde briefstembureaus worden
      tijdig voor elke verkiezing benoemd door Onze Minister van Buitenlandse Zaken, onderscheidenlijk Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, onderscheidenlijk Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_13
  - number: M 14
    text: |-
      Indien op grond van [artikel M 13][ref1] een briefstembureau is ingesteld, zendt de burgemeester van ’s-Gravenhage
      de lijst van personen die per brief mogen stemmen naar dat briefstembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_14
