        paragraaf: '1'
        afdeling: II
  - number: J 7
    text: |-
      Ten minste veertien dagen voor de stemming ontvangt elke kiezer die bevoegd is aan de stemming deel te nemen,
      van de burgemeester van de gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd, een
      stempas. Op de stempas wordt een volgnummer vermeld. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      stelt bij ministeriële regeling een model vast voor de stempas. Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties verstrekt tijdig voor de verkiezing aan de gemeente de informatie nodig voor het produceren
      van de stempas. Artikel 18 van de Algemene verordening gegevensbescherming is niet van toepassing op verwerking van
      persoonsgegevens bij of krachtens de eerste volzin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_7
  - number: J 7a
    text: |-
      1 Er is een register van ongeldige stempassen. De burgemeester stelt de dag voor de stemming in zijn gemeente uit
      het register een uittreksel van ongeldige stempassen vast.

      2 Ongeldig is de stempas:

      a. waarvoor in plaats daarvan door de burgemeester een kiezerspas of een volmachtbewijs is afgegeven;

      b. waarvoor krachtens [artikel J 8][ref1] een vervangende stempas is verstrekt;

      c. van de kiezer aan wie overeenkomstig [hoofdstuk M][ref2] een briefstembewijs is verstrekt;

      d. van iemand die niet als kiezer behoort te zijn geregistreerd, dan wel voor het uitbrengen van zijn stem is
      overleden;

      e. waarvan is vastgesteld dat deze stempas is ontvreemd of anderszins onrechtmatig in omloop is.

      3 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke gegevens het register, alsmede het
      uittreksel, bedoeld in het eerste lid, bevatten.

      4 De burgemeester bewaart het register drie maanden nadat over de toelating van de gekozenen is beslist. Daarna
      vernietigt hij deze onmiddellijk. Van de vernietiging wordt proces-verbaal opgemaakt.

      5 De artikelen 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking van
      persoonsgegevens bij of krachtens dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukM
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelJ_7a
    references:
