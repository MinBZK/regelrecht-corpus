  - number: B 1
    text: |-
      1 De leden van de Tweede Kamer der Staten-Generaal worden gekozen door degenen die op de dag van de
      kandidaatstelling Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt, met
      uitzondering van degenen die op de dag van de kandidaatstelling hun werkelijke woonplaats hebben in Aruba, Curaçao
      of Sint Maarten.

      2 Deze uitzondering geldt niet voor:

      a. de Nederlander die gedurende ten minste tien jaren ingezetene van Nederland is geweest;

      b. de Nederlander die in Nederlandse openbare dienst in Aruba, Curaçao of Sint Maarten werkzaam is, alsmede
      zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelB_1
  - number: B 2
    text: |-
      De leden van provinciale staten worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van de provincie, mits zij Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelB_2
  - number: B 2a
    text: |-
      1 De leden van het algemeen bestuur worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van het waterschap en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt.

      2 [Artikel B 3, tweede lid, aanhef en onderdeel a, en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_3
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelB_2a
    references:
      - id: ref1
