  - number: C 4
    text: |-
      1 De leden van provinciale staten, de algemene besturen, onderscheidenlijk gemeenteraden worden gekozen voor vier
      jaren.

      2 Zij treden tegelijk af met ingang van de donderdag in de periode van 23 tot en met 29 maart.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelC_4
  - number: C 5
    text: |-
      Degene die ter vervulling van een opengevallen plaats tot lid is benoemd, treedt af op het tijdstip waarop degene
      in wiens plaats hij is benoemd, zou hebben moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelC_5
  - number: D 1
    text: Burgemeester en wethouders registreren de kiesgerechtigdheid van de ingezetenen van de gemeente.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_1
  - number: D 2
    text: |-
      Burgemeester en wethouders van 's-Gravenhage dragen zorg voor een registratie van personen die hun werkelijke
      woonplaats buiten Nederland hebben en aan wie kiesrecht toekomt op grond van [artikel B 1][ref1] en die niet zijn
      uitgesloten van het kiesrecht op grond van [artikel B 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_5
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: B_1
