  - number: P 19a
    text: Indien een kandidaat is overleden, wordt deze bij de toepassing van deze paragraaf buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_19a
  - number: P 20
    text: |-
      1 Het centraal stembureau stelt de uitslag van de verkiezingen zo spoedig mogelijk vast. Het centraal stembureau
      stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal stemmen dat bij volmacht is uitgebracht; en

      d. het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld.
      Voor zover mogelijk geeft het centraal stembureau hiervoor een verklaring.

      2 De vaststelling en bekendmaking geschieden in een openbare zitting van het centraal stembureau. Dag en uur van
      de zitting worden door de voorzitter van het centraal stembureau tijdig bekend gemaakt. De wijze van bekendmaking
      wordt geregeld bij algemene maatregel van bestuur.

      3 De aanwezige kiezers kunnen mondeling bezwaren inbrengen.

      4 De voorzitter van het centraal stembureau is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_20
  - number: P 21
    text: |-
      1 Het centraal stembureau kan op de in [artikel P 20][ref1] bedoelde zitting, voordat de uitslag van de verkiezing
      bekend wordt gemaakt, hetzij ambtshalve, hetzij naar aanleiding van een met opgave van redenen gedaan verzoek van
      een of meer kiezers, tot een nieuwe opneming van stembiljetten, zowel uit alle als uit een of meer stembureaus,
      besluiten, indien een ernstig vermoeden bestaat dat door een of meer stembureaus bij de stemopneming zodanige
      fouten zijn gemaakt dat zij van invloed op de zetelverdeling kunnen zijn. De burgemeester die de desbetreffende
      stembiljetten onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar het centraal
      stembureau overbrengen.

      2 Na ontvangst van de stembiljetten gaat het centraal stembureau onmiddellijk tot de opneming over. Het is bevoegd
      daartoe de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de stembureaus.

      3 Bij deze opneming zijn de [artikelen N 5][ref2], [N 8][ref3] en [N 9][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_5
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_21
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_20
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
      - id: ref2
