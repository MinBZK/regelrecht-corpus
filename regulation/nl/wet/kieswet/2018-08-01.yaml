  - number: H 15
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende het betalen van waarborgsommen ten
      behoeve van de kandidatenlijsten. Bij ministeriële regeling worden voor de bewijzen van betaling van de waarborgsom
      modellen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_15
  - number: H 16
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens door het centraal stembureau bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelH_16
  - number: I 1
    text: |-
      1 Op de dag na de kandidaatstelling, om zestien uur, houdt het centraal stembureau een zitting tot het onderzoeken
      van de kandidatenlijsten voor iedere kieskring waarvoor zij zijn ingeleverd.

      2 Bij een verkiezing van de leden van de Tweede Kamer, onderscheidenlijk provinciale staten van een provincie
      die uit meer dan één kieskring bestaat, draagt het centraal stembureau er zorg voor dat de hoofdstembureaus op
      de tweede dag na de kandidaatstelling een afschrift van de kandidatenlijsten ontvangen die voor de desbetreffende
      kieskring zijn ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_1
  - number: I 2
    text: |-
      1 Indien bij het onderzoek van een kandidatenlijst voor een kieskring blijkt van een of meer van de volgende
      verzuimen, geeft het centraal stembureau onverwijld bij aangetekende brief of tegen gedagtekend ontvangstbewijs
      kennis aan degene die de lijst heeft ingeleverd:

      a. dat, indien bij de lijst verklaringen van ondersteuning moeten worden overgelegd, niet ten minste het aantal
      verklaringen voor deze kieskring, genoemd in [artikel H 4, eerste lid][ref1], is overgelegd, waarbij niet meetellen
      de verklaringen die niet aan het bepaalde in [artikel H 4, eerste lid, tweede volzin, en tweede lid][ref2],
      voldoen, de verklaringen waarop niet een aantekening als bedoeld in [artikel H 4, vierde lid][ref3], voorkomt en de
      verklaringen van een kiezer die meer dan één verklaring heeft ondertekend;

      b. dat, indien zich het geval voordoet, bedoeld in [artikel H 7, derde lid][ref4], de verklaring dat de kandidaat
      voornemens is zich bij benoeming te vestigen in de provincie, het waterschap, onderscheidenlijk de gemeente,
      ontbreekt;

      c. dat een kandidaat niet is vermeld overeenkomstig het bepaalde krachtens [artikel H 8][ref5];

      d. dat voor een kandidaat ontbreekt de verklaring dat hij instemt met zijn kandidaatstelling op de lijst voor deze
      kieskring;

      e. dat ten aanzien van een kandidaat die buiten het Europese deel van Nederland woonplaats heeft in zijn verklaring
      van instemming de aanwijzing van een gemachtigde ontbreekt;

      f. dat, indien ten behoeve van de lijst een waarborgsom moet worden betaald, het bewijs dat deze betaling is
      verricht, ontbreekt;

      g. dat de lijst niet persoonlijk is ingeleverd door een kiezer, bevoegd tot deelneming aan de desbetreffende
      verkiezing;

      h. dat de inleveraar zich niet heeft geïdentificeerd met een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref6];

      i. dat een verklaring, bedoeld in het [tweede of derde lid van artikel H 3][ref7], ontbreekt.

      2 Binnen de termijn van drie dagen na de zitting, bedoeld in [artikel I 1, eerste lid][ref8], kan degene die de
      lijst heeft ingeleverd, het verzuim of de verzuimen, in de kennisgeving aangeduid, herstellen bij het centraal
      stembureau, op de eerste en tweede dag van negen tot zeventien uur en op de derde dag van negen tot vijftien uur.

      3 In het geval, bedoeld in het eerste lid onder a, kunnen kiezers gedurende de verzuimperiode alsnog
      ondersteuningsverklaringen afleggen.

      4 In het geval, bedoeld in het eerste lid onder f, kan gedurende de verzuimperiode de waarborgsom alsnog worden
      betaald.

      5 In het geval, bedoeld in het eerste lid onder g, kan gedurende de verzuimperiode een kiezer die tot het
      inleveren van de lijst bevoegd zou zijn geweest, door persoonlijke verschijning bij het centraal stembureau
      zich in de plaats van de onbevoegde inleveraar stellen; hij identificeert zich met een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref9]. Het in de vorige zin bepaalde vindt overeenkomstige
      toepassing, indien in geval van onderdeel h de inleveraar zich niet alsnog tijdens de verzuimperiode identificeert.

      6 Bij verhindering of ontstentenis van degene die de lijst heeft ingeleverd, treedt in diens plaats een ingevolge
      [artikel H 5][ref10] op de lijst vermelde vervanger.


