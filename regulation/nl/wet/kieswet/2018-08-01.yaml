  - number: N 22
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelN_22
  - number: O 1
    text: |-
      1 Het hoofdstembureau houdt op de tweede dag na de stemming om tien uur een openbare zitting.

      2 In afwijking van het eerste lid houdt het hoofdstembureau voor de verkiezing van de leden van provinciale staten
      met één kieskring of voor de verkiezing van de leden van het algemeen bestuur op de vijfde dag na de stemming om
      tien uur een openbare zitting.

      3 De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_1
  - number: O 2
    text: |-
      1 Het hoofdstembureau stelt ten aanzien van iedere lijst vast het aantal op iedere kandidaat uitgebrachte stemmen
      en de som van deze aantallen. Deze som wordt stemcijfer genoemd.

      2 Het hoofdstembureau stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal stemmen dat bij volmacht is uitgebracht; en

      d. het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld.
      Voor zover mogelijk geeft het hoofdstembureau hiervoor een verklaring.

      3 De voorzitter maakt de aldus verkregen uitkomsten bekend.

      4 Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_2
  - number: O 3
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan onmiddellijk proces-verbaal opgemaakt. Alle ingebrachte
      bezwaren worden in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.

      4 Indien het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van provinciale staten van
      een provincie die één kieskring vormt, maakt het proces-verbaal deel uit van het proces-verbaal, bedoeld in
      [artikel P 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_22
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
  - number: O 4
    text: |-
      1 Het hoofdstembureau maakt het proces-verbaal onverwijld op een algemeen toegankelijke wijze elektronisch
      openbaar. Bij ministeriële regeling kan hiervoor een internetadres worden aangewezen.

      2 Tenzij het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van provinciale staten van
      een provincie die één kieskring vormt, brengt het hoofdstembureau zijn proces-verbaal onverwijld naar het centraal
      stembureau over.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_4
  - number: O 5
    text: |-
      1 Het hoofdstembureau brengt de processen-verbaal van de stembureaus en de opgaven van de burgemeesters en, tenzij
      het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van provinciale staten van een provincie
      die één kieskring vormt, een afschrift van zijn proces-verbaal terstond over aan het orgaan waarvoor de verkiezing
      plaatsvindt.

      2 Het orgaan waarvoor de verkiezing plaatsvindt, bewaart de processen-verbaal van de stembureaus drie maanden nadat
      over de toelating van de gekozenen is beslist. Daarna vernietigt hij deze stukken onmiddellijk. Van de vernietiging
      wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_5
  - number: O 6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de vaststelling van de verkiezingsuitslag.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_6
  - number: O 7
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelO_7
  - number: P 1
    text: |-
      Onmiddellijk nadat de processen-verbaal van alle hoofdstembureaus zijn ontvangen, gaat het centraal stembureau over
      tot het verrichten van de werkzaamheden ter vaststelling en bekendmaking van de uitslag van de verkiezing. Indien
      het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van provinciale staten van een provincie
      die één kieskring vormt, gaat het centraal stembureau daartoe onmiddellijk over nadat de werkzaamheden, bedoeld in
      de [artikelen O 1][ref1] en [O 2][ref2], zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: O_1
        hoofdstuk: O
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: O_2
        hoofdstuk: O
        afdeling: II
  - number: P 1a
    text: |-
      1 Indien het centraal stembureau programmatuur gebruikt ten behoeve van de berekening van de uitslag van de
      verkiezing of de berekening van de zetelverdeling, maakt het centraal stembureau elektronisch op een algemeen
      toegankelijke wijze openbaar welke programmatuur het gebruikt.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de openbaarmaking van de
      programmatuur en wordt bepaald onder welke voorwaarden het centraal stembureau programmatuur kan gebruiken ten
      behoeve van de berekening van de uitslag van de verkiezing of de berekening van de zetelverdeling en aan welke
      eisen deze programmatuur moet voldoen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_1a
  - number: P 2
    text: |-
      1 Een stel gelijkluidende lijsten als bedoeld in [artikel H 11, eerste lid][ref1], geldt voor de vaststelling van
      de uitslag van de verkiezing als één lijst.

      2 Het centraal stembureau telt van deze gelijkluidende lijsten tezamen de stemcijfers en de aantallen op iedere
      kandidaat uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 3
    text: |-
      Een lijstengroep als bedoeld in [artikel H 11, tweede lid][ref1], geldt voor het bepalen van het aantal daaraan toe
      te wijzen zetels als één lijst met een stemcijfer gelijk aan de som van de stemcijfers van de lijsten waaruit de
      groep bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 5
    text: |-
      1 Het centraal stembureau deelt de som van de stemcijfers van alle lijsten door het aantal te verdelen zetels.

      2 Het aldus verkregen quotiënt wordt kiesdeler genoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_5
  - number: P 6
    text: Zoveel maal als de kiesdeler is begrepen in het stemcijfer van een lijst wordt aan die lijst een zetel toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_6
  - number: P 7
    text: |-
      1 De overblijvende zetels, die restzetels worden genoemd, worden, indien het aantal te verdelen zetels negentien
      of meer bedraagt, achtereenvolgens toegewezen aan de lijsten die na toewijzing van de zetel het grootste gemiddelde
      aantal stemmen per toegewezen zetel hebben. Indien gemiddelden gelijk zijn, beslist zo nodig het lot.

      2 Indien het betreft de verkiezing van de leden van de Tweede Kamer, komen bij deze toewijzing niet in aanmerking
      lijsten waarvan het stemcijfer lager is dan de kiesdeler.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_7
  - number: P 8
    text: |-
      1 De restzetels worden, indien het aantal te verdelen zetels minder dan negentien bedraagt, achtereenvolgens
      toegewezen aan de lijsten waarvan de stemcijfers bij deling door de kiesdeler de grootste overschotten hebben.
      Hierbij worden lijsten die geen overschot hebben, geacht lijsten te zijn met het kleinste overschot. Indien
      overschotten gelijk zijn, beslist zo nodig het lot.

      2 Bij deze toewijzing komen niet in aanmerking lijsten met een stemcijfer dat lager is dan 75% van de kiesdeler.

      3 Wanneer alle lijsten die daarvoor in aanmerking komen een restzetel hebben ontvangen en er nog zetels te
      verdelen blijven, worden deze zetels toegewezen volgens het stelsel van de grootste gemiddelden als bedoeld in
      [artikel P 7, eerste lid][ref1], met dien verstande, dat bij deze toewijzing aan geen van de lijsten meer dan één
      zetel wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_7
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 9
    text: |-
      Indien aan een lijst die de volstrekte meerderheid van de uitgebrachte geldige stemmen heeft verkregen, een aantal
      zetels is toegewezen, kleiner dan de volstrekte meerderheid van het aantal toe te wijzen zetels, wordt aan die
      lijst alsnog één zetel toegewezen en vervalt daartegenover één zetel, toegewezen aan de lijst die voor het kleinste
      gemiddelde of het kleinste overschot een zetel heeft verworven. Indien twee of meer lijsten voor hetzelfde kleinste
      gemiddelde of hetzelfde kleinste overschot een zetel hebben verworven, beslist het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_9
  - number: P 10
    text: |-
      Indien bij de toepassing van de vorige bepalingen aan een lijst meer zetels zouden moeten worden toegewezen dan er
      kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van die bepalingen over op één
      of meer van de overige lijsten, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_10
  - number: P 12
    text: |-
      1 De verdeling van de aan een lijstengroep toegewezen zetels over de lijsten waaruit de groep bestaat, geschiedt
      als volgt.

      2 Het centraal stembureau deelt het stemcijfer van de lijstengroep door het aantal aan de groep toegewezen zetels.

      3 Het aldus verkregen quotiënt wordt groepskiesdeler genoemd.

      4 Zoveel maal als de groepskiesdeler is begrepen in het stemcijfer van elk van de lijsten waaruit de groep bestaat,
      wordt aan die lijst een van de aan de groep toegewezen zetels toegewezen.

      5 De restzetels worden achtereenvolgens toegewezen aan de lijsten van de groep waarvan de stemcijfers bij deling
      door de groepskiesdeler de grootste overschotten hebben. Hierbij worden lijsten die geen overschot hebben, geacht
      lijsten te zijn met het kleinste overschot. Indien overschotten gelijk zijn, beslist zo nodig het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_12
  - number: P 13
    text: |-
      1 Indien bij de toepassing van [artikel P 12][ref1] aan een lijst meer zetels zouden moeten worden toegewezen dan
      er kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van dat artikel over op een
      van de andere lijsten van de groep, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.

      2 Zijn er na toepassing van het eerste lid nog zetels toe te wijzen, dan worden deze toegewezen volgens het stelsel
      van de grootste gemiddelden als bedoeld in [artikel P 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_12
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: P_7
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 14
    text: |-
      De in de voorgaande artikelen bedoelde lotingen vinden plaats in de in [artikel P 20][ref1] bedoelde zitting van
      het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_14
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_20
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
  - number: P 15
    text: |-
      1 In de volgorde van de aantallen op hen uitgebrachte stemmen zijn gekozen die kandidaten die op de gezamenlijke
      lijsten waarop zij voorkomen, een aantal stemmen hebben verkregen, groter dan 25% van de kiesdeler, voor zover
      aan de lijstengroep of de niet van een lijstengroep deel uitmakende lijst voldoende zetels zijn toegewezen. Indien
      aantallen gelijk zijn, beslist zo nodig het lot.

      2 Indien het aantal bij de verkiezing van de leden van de gemeenteraad te verdelen zetels minder dan negentien
      bedraagt, wordt bij de toepassing van het eerste lid niet 25% van de kiesdeler, maar de helft van de kiesdeler in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_15
  - number: P 16
    text: |-
      1 Betreft het een lijstengroep, dan geldt, indien een aldus gekozen kandidaat op meer dan één lijst is vermeld,
      die kandidaat als gekozen op de lijst waarop het grootste aantal stemmen op hem is uitgebracht; voor zover aan
      die lijst voldoende zetels zijn toegewezen. Voor zover aantallen gelijk zijn, geldt hij als gekozen op de lijst,
      ingeleverd voor de kieskring, met het laagste nummer.

      2 Indien aan geen van de lijsten waarop de gekozen kandidaat is vermeld, voldoende zetels zijn toegewezen,
      wordt aan hem niettemin een zetel toegewezen op de lijst waarop hij het grootste aantal stemmen heeft verkregen,
      en vervalt daartegenover de zetel die met toepassing van [artikel P 12][ref1] of [P 13][ref2] het laatst was
      toegewezen aan een van de lijsten van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_13
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_16
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_12
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: P_13
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 17
    text: |-
      De zetels, toegewezen aan de al dan niet van een lijstengroep deel uitmakende lijsten, die na toepassing van de
      [artikelen P 15][ref1] en [P 16][ref2] nog niet aan een kandidaat zijn toegewezen, worden aan de nog niet gekozen
      kandidaten van de desbetreffende lijsten toegewezen in de volgorde van de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_16
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_15
        hoofdstuk: P
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: P_16
        hoofdstuk: P
        paragraaf: '3'
        afdeling: II
  - number: P 18
    text: |-
      1 Betreft het een lijstengroep, dan geldt, indien een kandidaat met toepassing van artikel P 17 op meer dan één
      lijst van de lijstengroep gekozen is, die kandidaat als gekozen op de lijst waarop het grootste aantal stemmen
      op hem is uitgebracht. Voor zover aantallen gelijk zijn, geldt hij als gekozen op de lijst, ingeleverd voor de
      kieskring met het laagste nummer.

      2 De aan een lijst toegewezen zetels die na toepassing van het eerste lid nog niet aan een kandidaat zijn
      toegewezen, worden aan de nog niet gekozen kandidaten van de desbetreffende lijst toegewezen in de volgorde van
      de lijst.

      3 Indien na toepassing van het tweede lid opnieuw een kandidaat op meer dan één lijst is gekozen, wordt de
      procedure, bedoeld in het eerste en tweede lid, zo lang herhaald, totdat alle aan de lijsten toegewezen zetels aan
      kandidaten zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_18
  - number: P 19
    text: |-
      1 Het centraal stembureau rangschikt ten aanzien van iedere lijst de daarop voorkomende kandidaten zodanig, dat
      bovenaan komen te staan de kandidaten aan wie een zetel is toegewezen met toepassing van [artikel P 15][ref1], in
      de volgorde waarin de zetels zijn toegewezen.

      2 Vervolgens worden, in de volgorde van de aantallen op hen uitgebrachte stemmen, gerangschikt de op de lijst
      voorkomende kandidaten die op de gezamenlijke lijsten waarop zij voorkomen een aantal stemmen hebben verkregen,
      groter dan 25% van de kiesdeler onderscheidenlijk groter dan de helft van de kiesdeler, doch die niet met
      toepassing van [artikel P 15, eerste onderscheidenlijk tweede lid][ref2], zijn gekozen verklaard. Indien aantallen
      gelijk zijn, beslist de volgorde van de lijst.

      3 Tenslotte worden, in de volgorde van de lijst, gerangschikt de overige op de lijst voorkomende kandidaten.

      4 Bij de rangschikking blijft [artikel P 18][ref3] buiten toepassing.

      5 Behoudens ten aanzien van de verkiezing waarbij het aantal te verdelen zetels minder dan dertien bedraagt, blijft
      de rangschikking achterwege, voor zover het lijsten betreft waarop geen kandidaten gekozen zijn verklaard en die
      niet deel uitmaken van een lijstengroep waaraan één of meer zetels zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_18
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_19
