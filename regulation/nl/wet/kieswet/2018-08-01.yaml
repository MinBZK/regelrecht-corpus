  - number: R 3
    text: |-
      Op de lijst worden een of meer personen vermeld die bij verhindering van de inleveraar bevoegd zijn tot het herstel
      van verzuimen, bedoeld in [artikel S 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_1
