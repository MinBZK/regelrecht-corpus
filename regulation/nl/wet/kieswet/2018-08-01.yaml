  - number: Y 10
    text: |-
      Behalve op de in [artikel G 1, vierde lid][ref1], genoemde gronden wordt op een verzoek om registratie van de
      aanduiding van een politieke groepering ten behoeve van de verkiezing van de leden van het Europees Parlement
      afwijzend beschikt, indien de aanduiding geheel of in hoofdzaak overeenstemt met een aanduiding van een andere
      politieke groepering die reeds ten behoeve van de verkiezing van de leden van de Tweede Kamer is geregistreerd,
      of met een aanduiding waarvoor reeds eerder ten behoeve van die verkiezing een registratieverzoek is ontvangen, en
      daardoor verwarring te duchten is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
