        hoofdstuk: Y
        paragraaf: '4'
        afdeling: V
  - number: Y 35b
    text: |-
      1 Het centraal stembureau zendt de verklaring, bedoeld in [artikel Y 35, eerste lid][ref1], onverwijld aan de
      daartoe aangewezen autoriteit in de andere lidstaat.

      2 Het centraal stembureau verzoekt de in het eerste lid bedoelde autoriteit voor aanvang van de zitting,
      bedoeld in [artikel I 4][ref2], schriftelijk te verklaren of de kandidaat op wie de verklaring, bedoeld in
      [artikel Y 35, eerste lid][ref3], betrekking heeft in die lidstaat is uitgesloten van het recht om te worden
      gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35
