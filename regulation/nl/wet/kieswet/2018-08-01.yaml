        artikel: M_7
        hoofdstuk: M
        paragraaf: '1'
        afdeling: II
  - number: M 3
    text: |-
      1 Een verzoek om per brief te stemmen wordt ingediend bij de burgemeester van 's-Gravenhage.

      2 Een verzoek dient uiterlijk op de achtentwintigste dag voor de stemming te zijn ontvangen.

      3 Voor het indienen van een verzoek wordt een formulier gebruikt. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_3
  - number: M 4
    text: |-
      1 Op het verzoek wordt zo spoedig mogelijk beslist.

      2 Het verzoek wordt slechts afgewezen, indien gebleken is dat de verzoeker niet tot de in
      [artikel M 1, tweede lid,][ref1] bedoelde kiezers behoort.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld.

      4 De burgemeester van 's-Gravenhage doet zo spoedig mogelijk mededeling van de beslissing aan de burgemeester van
      de gemeente waar de persoon als kiezer is geregistreerd.

      5 [Artikel D 8][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_1
        hoofdstuk: M
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_8
        hoofdstuk: D
        afdeling: II
  - number: M 6
    text: |-
      1 De burgemeester van ’s-Gravenhage zendt de personen, bedoeld in [artikel M 1][ref1], zo spoedig mogelijk op bij
      algemene maatregel van bestuur te bepalen wijze:

      a. een stembiljet;

      b. een geadresseerde retourenveloppe;

      c. het briefstembewijs, bevattende een door de persoon te ondertekenen verklaring dat hij het stembiljet
      persoonlijk heeft ingevuld;

      d. een enveloppe voor het stembiljet;

      e. een handleiding voor de kiezer.

      2 Bij ministeriële regeling worden voor de stukken, bedoeld in het eerste lid, onder b, c, d en e, modellen
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_6
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_1
        hoofdstuk: M
        paragraaf: '1'
        afdeling: II
  - number: M 7
    text: |-
      1 Een persoon stemt door op het hem toegezonden stembiljet een wit stipje, geplaatst vóór de kandidaat van zijn
      keuze, rood, blauw, zwart of groen te maken.

      2 Daarna vouwt hij het stembiljet dicht op zodanige wijze dat de namen van de kandidaten niet zichtbaar zijn en
      doet hij het stembiljet in de enveloppe voor het stembiljet.

      3 Hij ondertekent een op het briefstembewijs gestelde verklaring, dat hij het stembiljet persoonlijk heeft
      ingevuld.

      4 Hij voegt een kopie van een identiteitsdocument toe dat bij algemene maatregel van bestuur is aangewezen.
      Het identiteitsdocument is geldig op de dag van de kandidaatstelling. Een persoon als bedoeld in
      [artikel B 1, tweede lid, onderdeel b][ref1], voegt een verklaring toe dat hij of een aan hem gerelateerde persoon
      in Nederlandse openbare dienst is.

      5 Vervolgens doet hij het briefstembewijs, de kopie van het identiteitsdocument, indien van toepassing de
      verklaring vanwege de Nederlandse openbare dienst, en de enveloppe met het stembiljet in de bijbehorende
      retourenveloppe en retourneert hij deze gesloten. De persoon draagt er zorg voor dat de retourenveloppe voldoende
      is gefrankeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_7
    references:
