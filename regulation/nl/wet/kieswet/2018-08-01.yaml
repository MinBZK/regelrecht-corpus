  - number: M 16
    text: |-
      1 De [artikelen M 8, eerste tot en met het derde lid][ref1], en [M 9][ref2] zijn van overeenkomstige toepassing op
      briefstembureaus in het buitenland, met dien verstande dat:

      a. aan de burgemeester opgedragen taken worden verricht door het briefstembureau dan wel door de vertegenwoordiger
      van Nederland in Aruba, Curaçao of Sint Maarten;

      b. de bevoegdheden van burgemeester en wethouders bevoegdheden zijn van Onze Minister van Buitenlandse Zaken, Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, respectievelijk Onze Minister van Defensie;

      c. indien een tijdsverschil met Nederland bestaat, de genoemde tijdstippen naar plaatselijke tijd gelden.

      2 De [artikelen M 10][ref3] en [M 11][ref4] zijn van toepassing op briefstembureaus in het buitenland.


