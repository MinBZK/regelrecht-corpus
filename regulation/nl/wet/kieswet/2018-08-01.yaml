  - number: V 5
    text: |-
      De ongeldigheid van de stemming in één of meer stembureaus of provincies of een onjuistheid in de vaststelling van
      de uitslag van de verkiezing staat niet in de weg aan de toelating van de leden, op wier verkiezing de ongeldigheid
      of onjuistheid geen invloed kan hebben gehad, en, in geval van ongeldigheid van de stemming, de nieuwe stemming
      geen invloed kan hebben.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_5
  - number: V 6
    text: |-
      1 Indien het orgaan waarvoor de benoeming is geschied, besluit tot niet-toelating van één of meer leden wegens de
      ongeldigheid van de stemming in één of meer stembureaus of provincies geeft de voorzitter daarvan onverwijld kennis
      aan:

      a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft een verkiezing van de leden van
      de Tweede of Eerste Kamer;

      b. gedeputeerde staten, indien het betreft een verkiezing van de leden van de staten van een provincie;

      c. het dagelijks bestuur, indien het betreft een verkiezing van de leden van het algemeen bestuur;

      d. burgemeester en wethouders, indien het betreft een verkiezing van de leden van de gemeenteraad.

      2 Uiterlijk op de dertigste dag nadat deze kennisgeving is ontvangen, vindt in de in het eerste lid bedoelde
      stembureaus, onderscheidenlijk provincies, een nieuwe stemming plaats en wordt de uitslag van de verkiezing opnieuw
      vastgesteld. De dag van de stemming wordt vastgesteld door:

      a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft een verkiezing van de leden van
      de Tweede of Eerste Kamer;

      b. gedeputeerde staten, indien het betreft een verkiezing van de leden van de staten van een provincie;

      c. het dagelijks bestuur, indien het betreft een verkiezing van de leden van het algemeen bestuur;

      d. burgemeester en wethouders, indien het betreft een verkiezing van de leden van de gemeenteraad.

      3 Bij deze vaststelling blijft degene die reeds als lid is toegelaten, gekozen verklaard, ook indien mocht blijken
      dat dit ten onrechte is geschied. Tegenover hem valt dan af de kandidaat die, indien de toegelatene niet gekozen
      was verklaard, gekozen zou zijn.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_6
  - number: V 7
    text: |-
      1 Aan de in [artikel V 6, tweede lid][ref1], bedoelde stemming zijn de kiezers bevoegd deel te nemen wier namen
      voorkomen op de geldige stempassen, kiezerspassen, volmachtbewijzen, voor zover het de volmachtgever betreft, en
      briefstembewijzen, die zijn ingeleverd bij de ongeldig verklaarde stemming, met uitzondering van personen waarvan
      na de ongeldig verklaarde stemming blijkt dat zij ten onrechte als kiezer waren geregistreerd. Voor zover ten
      aanzien van de bescheiden sprake is van verwerking van persoonsgegevens als gevolg van een in artikel V 6, tweede
      lid, bedoelde stemming, zijn de artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming niet van
      toepassing.

      2 Indien de in [artikel V 6, tweede lid][ref2], bedoelde stemming alle stembureaus in een gemeente betreft, zijn
      bevoegd deel te nemen aan de nieuwe stemming de personen die voor de ongeldig verklaarde stemming:

      a. in de gemeente terecht als kiezer waren geregistreerd of ten onrechte niet als kiezer waren geregistreerd, met
      uitzondering van personen:

        - aan wie een kiezerspas is verstrekt die niet is ingeleverd bij de ongeldig verklaarde stemming in de gemeente;
        - ten behoeve van wie een volmachtbewijs is verstrekt dat niet is ingeleverd bij de ongeldig verklaarde stemming in
      de gemeente; of
        - aan wie een briefstembewijs is verstrekt.

      b. in een andere gemeente terecht als kiezer waren geregistreerd en voorkomen op de bij de ongeldig verklaarde
      stemming in de gemeente ingeleverde geldige kiezerspassen of volmachtbewijzen, voor zover het de volmachtgever
      betreft.

      3 Het tweede lid is niet van toepassing op briefstembureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_6
