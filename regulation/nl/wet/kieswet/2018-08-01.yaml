        artikel: B_3
        hoofdstuk: B
        afdeling: II
  - number: B 3
    text: |-
      1 De leden van de gemeenteraden worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen zijn
      van de gemeente en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt.

      2 Zij die geen onderdaan van een lidstaat van de Europese Unie zijn, dienen om kiesgerechtigd te zijn op de dag van
      de kandidaatstelling tevens te voldoen aan de vereisten dat:

      a. zij rechtmatig in Nederland verblijven op grond van
      [artikel 8, onder a, b, c, d, e of l, van de Vreemdelingenwet 2000][ref1] of op grond van een verdrag tussen een
      internationale organisatie en de Staat der Nederlanden inzake de zetel van deze organisatie in Nederland, en

      b. zij onmiddellijk voorafgaand aan de dag van de kandidaatstelling gedurende een onafgebroken periode van ten
      minste vijf jaren ingezetene van Nederland waren en beschikten over een verblijfsrecht als bedoeld onder a, dan wel
      op grond van [artikel 3][ref2] of [artikel 6 van de Wet toelating en uitzetting BES][ref3].

      3 Niet kiesgerechtigd zijn zij die geen Nederlander zijn en, als door andere staten uitgezonden leden van
      diplomatieke of consulaire vertegenwoordigingen, in Nederland werkzaam zijn, alsmede hun niet-Nederlandse
      echtgenoten, geregistreerde partners of levensgezellen en kinderen, voor zover dezen met hen een gemeenschappelijke
      huishouding voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel6
