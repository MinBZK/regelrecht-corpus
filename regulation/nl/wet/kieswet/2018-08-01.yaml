  - number: G 2a
    text: |-
      1 Een politieke groepering die een vereniging met volledige rechtsbevoegdheid of een stichting is, en waarvan
      de aanduiding niet reeds bij het centraal stembureau voor de verkiezing van de leden van de Tweede Kamer
      is geregistreerd, kan aan het centraal stembureau voor de verkiezing van de leden van het algemeen bestuur,
      schriftelijk verzoeken de aanduiding waarmee zij voor die verkiezing op de kandidatenlijst wenst te worden
      vermeld, in te schrijven in een register dat door het centraal stembureau wordt bijgehouden. De verzoeken die zijn
      ontvangen of aangevuld als bedoeld in [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1], na de
      tweeënveertigste dag voor de kandidaatstelling, blijven voor de daaropvolgende verkiezing buiten behandeling.

      2 Voor de in het eerste lid bedoelde registratie moet een waarborgsom van € 225 dan wel, indien het een groepering
      betreft die blijkens de statuten haar zetel heeft in Bonaire, Sint Eustatius of Saba, een waarborgsom van USD
      225 worden betaald aan het waterschap. Degene die de betaling heeft verricht, ontvangt een bewijs daarvan. Na
      inlevering van een geldige kandidatenlijst voor de eerstkomende verkiezing na de beslissing op het verzoek wordt
      hem de waarborgsom teruggegeven.

      3 Bij het verzoek worden overgelegd:

      a. een afschrift van de notariële akte waarin de statuten van de vereniging of stichting zijn opgenomen;

      b. een bewijs van inschrijving in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref2]
      dan wel [artikel 2 van de Handelsregisterwet 2009 BES][ref3];

      c. het in het tweede lid bedoelde bewijs van betaling;

      d. een verklaring van de politieke groepering, houdende aanwijzing van haar gemachtigde en plaatsvervangend
      gemachtigde bij het centraal stembureau, welke geldt zolang zij niet door een andere is vervangen.

      4 Het centraal stembureau beslist slechts afwijzend op het verzoek, indien:

      a. de aanduiding strijdig is met de openbare orde;

      b. de aanduiding geheel of in hoofdzaak overeenstemt met een reeds op de voet van dit artikel of
      [artikel G 1][ref4] geregistreerde aanduiding van een andere politieke groepering of met een aanduiding waarvoor
      reeds eerder op grond van dit artikel een registratieverzoek is ontvangen, en daardoor verwarring te duchten is;

      c. de aanduiding anderszins misleidend is voor de kiezers;

      d. de aanduiding meer dan 35 letters of andere tekens bevat;

      e. de aanduiding geheel of in hoofdzaak overeenstemt met die van een rechtspersoon die bij onherroepelijke
      rechterlijke uitspraak verboden is verklaard en deswege is ontbonden;

      f. het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak gelijkluidende aanduiding, tenzij dat andere verzoek reeds wordt
      afgewezen op een van de gronden, genoemd in de onderdelen a tot en met e.

      5 De beslissing van het centraal stembureau op het verzoek wordt aan de gemachtigde bekendgemaakt, alsmede ter
      openbare kennis gebracht op de in het waterschap gebruikelijke wijze.

      6 Een politieke groepering waarvan de aanduiding is ingeschreven in het register, kan schriftelijk een verzoek tot
      wijziging van deze aanduiding indienen bij het centraal stembureau. De laatste volzin van het eerste lid, alsmede
      het vierde en vijfde lid zijn op verzoeken tot wijziging van overeenkomstige toepassing.

      7 Het centraal stembureau schrapt de aanduiding in het register en brengt dit ter openbare kennis op de in het
      waterschap gebruikelijke wijze, wanneer:

      a. de politieke groepering heeft opgehouden te bestaan;

      b. de politieke groepering een verzoek daartoe heeft gedaan;

      c. de politieke groepering als vereniging of stichting bij onherroepelijke rechterlijke uitspraak verboden is
      verklaard en deswege is ontbonden;

      d. voor de laatstgehouden verkiezing van de leden van het algemeen bestuur geen geldige kandidatenlijst is
      ingeleverd.

      8 Het centraal stembureau vernietigt het verzoekschrift en de daarbij overgelegde stukken, bedoeld in het derde
      lid, zodra de schrapping van de aanduiding van de politieke groepering onherroepelijk is. De verklaring, bedoeld in
      het derde lid, onderdeel d, wordt tevens vernietigd wanneer de verklaring wordt vervangen door een andere.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
