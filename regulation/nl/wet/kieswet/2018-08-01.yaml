preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen inzake het kiesrecht en de
    verkiezingen van de leden van de Tweede Kamer en de Eerste Kamer der Staten-Generaal, alsmede van de leden van
    provinciale staten en de gemeenteraden, vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelAanhef
articles:
  - number: A 1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *algemeen bestuur:* vertegenwoordigend orgaan van een waterschap voor zover het leden betreft van de categorie,
      bedoeld in [artikel 12, tweede lid, onderdeel a, van de Waterschapswet][ref1];
        - *dagelijks bestuur:* dagelijks bestuur van een waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel12
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelA_1
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '12'
  - number: A 2
    text: Er is een Kiesraad, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelA_2
  - number: A 3
    text: |-
      1 De Kiesraad treedt op als centraal stembureau in de gevallen waarin de wet dat voorschrijft.

      2 De Kiesraad heeft voorts tot taak de regering en de beide kamers der Staten-Generaal van advies te dienen in
      uitvoeringstechnische aangelegenheden die het kiesrecht of de verkiezingen betreffen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelA_3
  - number: A 4
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de Kiesraad, met uitzondering van de
      [artikelen 12][ref2], [21][ref3] en [22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelA_4
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref3
