  - number: V 10
    text: |-
      Indien het orgaan waarvoor de benoeming is geschied, heeft besloten de benoemde niet als lid toe te laten op de
      grond dat hij niet voldoet aan de vereisten voor het lidmaatschap, dat hij een met het lidmaatschap onverenigbare
      betrekking vervult of dat de benoemdverklaring van de voorzitter van het centraal stembureau in strijd is met het
      bepaalde in [hoofdstuk W][ref1] geeft de voorzitter van dat orgaan daarvan onverwijld kennis aan de voorzitter van
      het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukW
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: W
        afdeling: IV
  - number: V 11
    text: |-
      Het lidmaatschap van een tot lid van een vertegenwoordigend orgaan benoemde vangt aan zodra de beschikking omtrent
      zijn toelating aan de benoemde bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_11
  - number: V 12
    text: |-
      De beslissing betreffende de toelating van de tot lid van provinciale staten, het algemeen bestuur
      onderscheidenlijk van de gemeenteraad benoemden wordt onverwijld genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_12
  - number: V 13
    text: |-
      1 Elke beslissing betreffende de toelating van de benoemden tot lid van provinciale staten, het algemeen bestuur,
      onderscheidenlijk de gemeenteraad, wordt door de voorzitter van provinciale staten, de voorzitter van het
      vertegenwoordigend orgaan van het waterschap, onderscheidenlijk de voorzitter van de gemeenteraad, terstond aan de
      benoemde bekendgemaakt.

      2 Aan de niet-toegelatene worden de redenen van de beslissing meegedeeld.

      3 Het eerste lid is van overeenkomstige toepassing, indien door het vertegenwoordigend orgaan, wegens herhaalde
      staking van stemmen of wegens staking van stemmen in een voltallige vergadering over een voorstel omtrent toelating
      geen beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_13
  - number: V 15
    text: |-
      1 Indien op het tijdstip van periodieke aftreding van de leden van provinciale staten, het vertegenwoordigend
      orgaan van het waterschap, onderscheidenlijk van de gemeenteraad, niet de geloofsbrieven van meer dan de helft
      van het wettelijk voorgeschreven aantal leden is goedgekeurd, houden de leden van dat vertegenwoordigend orgaan
      zitting, totdat zulks is geschied. Gedurende deze tijd oefenen de bij de verkiezing gekozen leden hun functie niet
      uit.

      2 Een plaats die openvalt na het tijdstip van periodieke aftreding, wordt vervuld op dezelfde wijze, als zou zijn
      geschied, indien zij voor dat tijdstip zou zijn opengevallen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelV_15
  - number: W 1
    text: |-
      1 Wanneer, anders dan bij de vaststelling van de uitslag van een verkiezing, in een opengevallen plaats moet worden
      voorzien, verklaart de voorzitter van het centraal stembureau bij een met redenen omkleed besluit, uiterlijk op de
      veertiende dag nadat dit te zijner kennis is gekomen, benoemd de daarvoor in aanmerking komende kandidaat die in
      de volgorde, bedoeld in [artikel P 19][ref1] dan wel [artikel U 15, tweede lid][ref2], het hoogst is geplaatst op
      de lijst waarop degene die moet worden opgevolgd, is gekozen. Indien het lid in wiens plaats moet worden voorzien,
      ontslag heeft genomen met ingang van een bepaald tijdstip, vangt de termijn, bedoeld in de eerste volzin, aan op
      dat tijdstip.

      2 Indien een plaats openvalt die door toepassing van [artikel P 16, tweede lid][ref3], was vervuld, verklaart de
      voorzitter van het centraal stembureau, in afwijking van het eerste lid, benoemd de daarvoor in aanmerking komende
      kandidaat op de lijst waaraan ingevolge [artikel P16, tweede lid][ref4] , een zetel was onthouden.

      3 Indien de lijst, bedoeld in het eerste lid, deel uitmaakt van een lijstengroep en op een of meer andere lijsten
      of stellen gelijkluidende lijsten van die groep kandidaten voorkomen die op de gezamenlijke lijsten waarop zij
      voorkomen, een aantal stemmen hebben verkregen groter dan 25% van de kiesdeler, doch die niet met toepassing van
      [artikel P 15][ref5] zijn gekozen, verklaart de voorzitter van het centraal stembureau, in afwijking van het eerste
      lid, benoemd diegene van deze kandidaten op wie het grootste aantal stemmen is uitgebracht.

      4 Indien het de opvolging van een lid van een gemeenteraad met minder dan negentien zetels betreft, wordt bij de
      toepassing van het derde lid de helft van de kiesdeler in aanmerking genomen in plaats van 25% van de kiesdeler.

      5 Indien een plaats openvalt die door toepassing van het derde lid was vervuld en dat lid niet opnieuw moet worden
      toegepast, verklaart de voorzitter van het centraal stembureau benoemd de daarvoor in aanmerking komende kandidaat
      op de lijst waaraan ingevolge het derde lid een zetel was onthouden.

      6 Bij ministeriële regeling wordt een model vastgesteld voor het besluit van de voorzitter van het centraal
      stembureau ter benoeming van een lid van een vertegenwoordigend orgaan, noodzakelijk geworden door:

      a. het niet-aannemen van de benoeming door een kandidaat;

      b. het niet-toelaten als lid van een kandidaat, of

      c. het openvallen van een plaats in dat orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_19
