  - number: M 1
    text: |-
      1 Een persoon die als kiezer is geregistreerd als bedoeld in [artikel D 2][ref1], ontvangt als bewijs dat hij per
      brief mag stemmen voor de stemming een briefstembewijs. Hij ontvangt geen briefstembewijs indien hem is toegestaan
      bij volmacht te stemmen of een kiezerspas is verstrekt.

      2 Voor de verkiezing van de leden van de Tweede Kamer wordt een persoon die kiesgerechtigd is en op de dag van de
      stemming buiten Nederland zal verblijven overeenkomstig het bepaalde bij of krachtens dit hoofdstuk op zijn verzoek
      toegestaan per brief te stemmen. Aan hem wordt als bewijs dat aan zijn verzoek is voldaan een briefstembewijs
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_2
        hoofdstuk: D
        afdeling: II
  - number: M 2
    text: |-
      1 Een aan een persoon verzonden briefstembewijs kan niet door een nieuw worden vervangen.

      2 Aan een persoon aan wie een briefstembewijs is verstrekt, wordt geen stempas toegezonden. Hij mag slechts op de
      in [artikel M 7][ref1] aangewezen wijze aan de stemming deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelM_2
    references:
