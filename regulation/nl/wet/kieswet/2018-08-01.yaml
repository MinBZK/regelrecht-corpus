  - number: E 9
    text: |-
      1 Voor het houden van de zittingen van het hoofdstembureau wijzen burgemeester en wethouders een geschikte ruimte
      aan.

      2 In afwijking van het eerste lid wijst het dagelijks bestuur een geschikte ruimte aan voor het houden van de
      zittingen van het hoofdstembureau voor de verkiezing van de leden van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_9
  - number: E 10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent inrichting, samenstelling en
      werkwijze van het hoofdstembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_10
  - number: E 11
    text: |-
      1 Er is voor de verkiezing van elk vertegenwoordigend orgaan een centraal stembureau.

      2 Voor de verkiezing van de leden van de Tweede Kamer treedt de Kiesraad als centraal stembureau op.

      3 Voor de verkiezing van de leden van provinciale staten treedt het hoofdstembureau van de kieskring waarin de
      gemeente is gelegen waar de vergadering van de staten wordt gehouden, tevens als centraal stembureau op.

      4 Voor de verkiezing van de leden van het algemeen bestuur treedt het hoofdstembureau tevens als centraal
      stembureau op.

      5 Voor de verkiezing van de leden van de gemeenteraad treedt het hoofdstembureau tevens als centraal stembureau op.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_11
  - number: F 1
    text: |-
      1 De kandidaatstelling voor de verkiezing van de leden van de Tweede Kamer, provinciale staten, het algemeen
      bestuur en de gemeenteraad vindt plaats op de maandag in de periode van 30 januari tot en met 5 februari of, in een
      schrikkeljaar, op de maandag in de periode van 31 januari tot en met 6 februari.

      2 In het geval, bedoeld in [artikel C 3, eerste lid][ref1], vindt de kandidaatstelling voor de verkiezing van de
      leden van de Tweede Kamer plaats op de maandag in de periode van 28 maart tot en met 3 april.

      3 Bij koninklijk besluit kan, indien zwaarwichtige redenen verband houdend met de dag van kandidaatstelling of
      met de dag van stemming daartoe nopen, worden bepaald dat de kandidaatstelling plaatsvindt op de maandag, dinsdag,
      woensdag, donderdag of vrijdag vóór de in het eerste onderscheidenlijk tweede lid genoemde dag. Het koninklijk
      besluit wordt bekend gemaakt uiterlijk zes maanden vóór de in het eerste onderscheidenlijk tweede lid genoemde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_3
