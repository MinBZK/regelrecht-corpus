  - number: Z 1
    text: |-
      Degene die stembiljetten, stempassen, kiezerspassen, volmachtbewijzen of briefstembewijzen namaakt of vervalst
      met het oogmerk deze als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_1
  - number: Z 2
    text: |-
      Degene die opzettelijk als echt en onvervalst gebruikt of door anderen doet gebruiken stembiljetten, stempassen,
      kiezerspassen, volmachtbewijzen of briefstembewijzen, die hij zelf heeft nagemaakt of vervalst of waarvan de
      valsheid of vervalsing hem, toen hij ze ontving, bekend was, of deze, met het oogmerk om ze als echt en onvervalst
      te gebruiken of door anderen te doen gebruiken, in voorraad heeft, wordt gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_2
  - number: Z 3
    text: |-
      Degene die stembiljetten, stempassen, kiezerspassen, volmachtbewijzen of briefstembewijzen voorhanden heeft met het
      oogmerk deze wederrechtelijk te gebruiken of door anderen te doen gebruiken, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_3
  - number: Z 4
    text: |-
      1 Degene die bij een verkiezing door gift of belofte een kiezer omkoopt om volmacht te geven tot het uitbrengen van
      zijn stem, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Degene die bij een verkiezing door gift of belofte een kiezer omkoopt dan wel anderszins daartoe dwingt om een
      verklaring als bedoeld in [artikel H 4, eerste lid][ref1], af te leggen ter ondersteuning van een lijst, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      3 Met dezelfde straf wordt gestraft de kiezer die zich door gift of belofte tot het bij volmacht stemmen of het
      afleggen van een ondersteuningsverklaring laat omkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_4
