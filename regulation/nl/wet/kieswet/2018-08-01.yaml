  - number: Y 34
    text: |-
      In de in [artikel H 1][ref1] bedoelde openbare kennisgeving wordt tevens melding gemaakt van de mogelijkheid van
      kandidaatstelling van niet-Nederlanders die onderdanen zijn van andere lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_1
