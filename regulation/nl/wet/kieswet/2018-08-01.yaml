        paragraaf: '1'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: P 22
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden de uitslag van de verkiezing, alsmede alle ingebrachte bezwaren vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_22
  - number: P 23
    text: |-
      Het centraal stembureau maakt zijn proces-verbaal onverwijld op een algemeen toegankelijke wijze elektronisch
      openbaar. Bij ministeriële regeling kan hiervoor een internetadres worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_23
  - number: P 24
    text: |-
      Het centraal stembureau doet een afschrift van het proces-verbaal toekomen aan het orgaan waarvoor de verkiezing
      plaats heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_24
  - number: P 25
    text: |-
      1 Het centraal stembureau bewaart de pakken, bedoeld in [artikel P 21, tweede lid][ref1], drie maanden nadat over
      de toelating van de gekozenen is beslist. Daarna vernietigt hij deze stukken onmiddellijk, tenzij:

      a. de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek
      heeft gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is
      afgerond;

      b. strafvervolging is ingesteld wegens een strafbaar gestelde gedraging in de
      Kieswet, de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref2] of de
      [artikelen 131 tot en met 135 van het Wetboek van Strafrecht BES][ref3], in welk geval de vernietiging plaatsvindt
      nadat er een onherroepelijke rechterlijke uitspraak is.

      2 Van de vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_21
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel131
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelP_25
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_21
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '125'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '131'
  - number: P 26
    text: |-
      Nadat is beslist over de toelating van de gekozenen, is het centraal stembureau bevoegd, de pakken, bedoeld in
      [artikel P 21, tweede lid][ref1], het proces-verbaal, bedoeld in [artikel P 22][ref2], en, tenzij het de verkiezing
      betreft van de gemeenteraad of van provinciale staten van een provincie die één kieskring vormt, de processen-
      verbaal van de hoofdstembureaus, ten dienste van een onderzoek naar enig strafbaar feit aan de officier van
      justitie over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_21
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
