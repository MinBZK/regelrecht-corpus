  - number: D 5
    text: |-
      Burgemeester en wethouders respectievelijk burgemeester en wethouders van 's-Gravenhage delen een persoon op zijn
      verzoek onverwijld mee of hij als kiezer is geregistreerd. Indien hij niet als kiezer is geregistreerd, worden hem
      uiterlijk op een bij algemene maatregel van bestuur te bepalen moment de redenen daarvan meegedeeld.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_5
  - number: D 6
    text: |-
      1 In aanvulling op artikel 16 van de Algemene verordening gegevensbescherming kan een registratie worden gewijzigd:

      a. wat betreft een registratie als bedoeld in [artikel D 1][ref1], indien de persoon niet als kiezer is
      geregistreerd, op aanvraag; en

      b. wat betreft een registratie als bedoeld in [artikel D 2][ref2], voor zover niet op aanvraag, ambtshalve
      overeenkomstig het tweede en derde lid.

      2 Burgemeester en wethouders van 's-Gravenhage verwerken in de registratie gegevens van een persoon die
      voortvloeien uit een wijziging van zijn gegevens in de basisregistratie personen.

      3 Burgemeester en wethouders van ’s-Gravenhage verwijderen een persoon uit de registratie indien aan hen
      omstandigheden bekend worden op grond waarvan de persoon niet als kiezer behoort te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelD_6
