  - number: Y 35c
    text: |-
      1 Het centraal stembureau schrapt van de lijst de kandidaat die blijkens een verklaring als bedoeld in
      [artikel Y 35b, tweede lid][ref1], in een andere lidstaat is uitgesloten van het recht om te worden gekozen, indien
      deze verklaring is ontvangen voor aanvang van de zitting, bedoeld in [artikel I 4][ref2].

      2 Indien het centraal stembureau na het tijdstip, bedoeld in het eerste lid, een verklaring als bedoeld in
      [artikel Y 35b, tweede lid][ref3], ontvangt dat een kandidaat in de lidstaat waarvan hij onderdaan is, is
      uitgesloten van het recht om te worden gekozen, zendt het centraal stembureau de verklaring:

      a. gelijktijdig met de kennisgeving, bedoeld in [artikel V 1, derde lid][ref4], aan de Tweede Kamer, indien de
      kandidaat benoemd wordt tot lid van het Europees Parlement;

      b. onverwijld aan de Tweede Kamer, indien de kandidaat lid is van het Europees Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35b
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35b
