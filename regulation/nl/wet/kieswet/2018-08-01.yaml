  - number: Y 33
    text: |-
      1 De kiesgerechtigdheid van de niet-Nederlander die onderdaan is van een andere lidstaat blijft geregistreerd
      zolang betrokkene ingezetene is van een Nederlandse gemeente of totdat de registratie van de kiesgerechtigdheid van
      betrokkene is geschrapt.

      2 Burgemeester en wethouders schrappen de registratie van de kiesgerechtigdheid van de als kiezer geregistreerde
      niet-Nederlander die onderdaan is van een andere lidstaat:

      a. op verzoek van betrokkene;

      b. indien aan hen omstandigheden bekend worden op grond waarvan de desbetreffende persoon niet als kiezer behoort
      te zijn geregistreerd.

      3 Burgemeester en wethouders doen van een schrapping van de registratie van de kiesgerechtigdheid onverwijld
      mededeling aan betrokkene en aan de door de desbetreffende lidstaat aangewezen autoriteit waarvan betrokkene
      onderdaan is.

      4 [Artikel D 8][ref1] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelY_33
    references:
