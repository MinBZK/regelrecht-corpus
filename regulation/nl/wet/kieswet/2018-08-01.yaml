  - number: I 15
    text: |-
      1 Onmiddellijk nadat de nummering heeft plaatsgevonden maakt de voorzitter openbaar welk nummer aan de
      onderscheidene lijsten is toegekend.

      2 Indien het betreft de verkiezing van de leden van de Tweede Kamer, geschiedt de openbaarmaking in de
      Staatscourant.

      3 Indien het betreft de verkiezing van de leden van provinciale staten, het algemeen bestuur of de gemeenteraad,
      geschiedt de openbaarmaking op de in de provincie, het waterschap, onderscheidenlijk de gemeente, gebruikelijke
      wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_15
  - number: I 16
    text: |-
      1 Indien de uitspraak van de Afdeling bestuursrechtspraak van de Raad van State strekt tot ongeldigverklaring van
      een kandidatenlijst, heeft dat geen gevolgen voor de nummers, toegekend aan de overige kandidatenlijsten.

      2 Indien de uitspraak van de Afdeling bestuursrechtspraak van de Raad van State strekt tot geldigverklaring van een
      kandidatenlijst, wordt deze kandidatenlijst, indien nog niet genummerd, door haar genummerd met het nummer volgende
      op het laatste krachtens [artikel I 14][ref1] en, indien van toepassing, bij eerdere uitspraak van de Afdeling
      toegekende nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_14
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelI_16
