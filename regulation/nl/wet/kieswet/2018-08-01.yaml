  - number: Ya 31d
    text: |-
      1 De voorzitter van het stembureau in een openbaar lichaam draagt er tevens zorg voor dat het proces-verbaal,
      bedoeld in [artikel T 11, eerste lid][ref1], langs elektronische weg terstond nadat de leden het proces-verbaal
      hebben getekend, ter kennis wordt gebracht van het centraal stembureau.

      2 De voorzitter maakt van het proces-verbaal een gewaarmerkt afschrift. Hij vernietigt dit afschrift onverwijld
      nadat het centraal stembureau de uitslag van de verkiezing heeft bekendgemaakt en over de toelating van de
      gekozenen is beslist. Van de vernietiging wordt proces-verbaal opgemaakt.

      3 De voorzitter draagt er ten slotte zorg voor dat de stukken, genoemd in [artikel T 11, derde lid][ref2], zo
      spoedig mogelijk per post naar het centraal stembureau worden overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelT_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelT_11
