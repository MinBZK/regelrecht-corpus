  - number: E 6
    text: |-
      1 Voor de verkiezing van de leden van provinciale staten wordt voor elke kieskring een hoofdstembureau ingesteld.
      Het is gevestigd in de gemeente, daartoe aangewezen door provinciale staten.

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 Voorzitter is de burgemeester van de gemeente waar het hoofdstembureau is gevestigd. De plaatsvervangend
      voorzitter en de andere leden, alsmede drie plaatsvervangende leden, worden benoemd en ontslagen door gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_6
  - number: E 6a
    text: |-
      1 Voor de verkiezing van de leden van het algemeen bestuur wordt een hoofdstembureau ingesteld. Het is gevestigd in
      de gemeente, daartoe aangewezen door het vertegenwoordigend orgaan van het waterschap.

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 Voorzitter is de voorzitter van het waterschap. De plaatsvervangend voorzitter en de andere leden, alsmede drie
      plaatsvervangende leden, worden benoemd en ontslagen door het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_6a
  - number: E 7
    text: |-
      1 Voor de verkiezing van de leden van de gemeenteraad wordt een hoofdstembureau ingesteld, bestaande uit vijf
      leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      2 De burgemeester is voorzitter van het hoofdstembureau. De plaatsvervangend voorzitter en de andere leden, alsmede
      drie plaatsvervangende leden, worden door burgemeester en wethouders benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelE_7
  - number: E 8
    text: |-
      De in de [artikelen E 5][ref1], [E 6][ref2], [E 6a][ref3] en [E 7][ref4] bedoelde benoemingen geschieden voor vier
      kalenderjaren. Degene die ter vervulling van een opengevallen plaats is benoemd, treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou hebben moeten aftreden.


