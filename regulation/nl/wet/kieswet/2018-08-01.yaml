  - number: X 10
    text: |-
      1 De voorzitter van een vertegenwoordigend orgaan verleent aan een lid van dat orgaan dat is toegelaten op diens
      verzoek tijdelijk ontslag wegens zwangerschap en bevalling op de in het verzoek vermelde dag die ligt tussen ten
      hoogste zes en ten minste vier weken voor de vermoedelijke datum van de bevalling die blijkt uit een door het lid
      overgelegde verklaring van een arts of verloskundige. Aan het verzoek, bedoeld in de eerste volzin, wordt niet
      voldaan, indien het tijdstip waarop het verzoek wordt gedaan ligt binnen een periode van zestien weken voor het
      einde van de zittingsduur als bedoeld in [hoofdstuk C][ref1].

      2 De voorzitter van een vertegenwoordigend orgaan verleent aan een lid van dat orgaan op diens verzoek tijdelijk
      ontslag, indien het lid wegens ziekte niet in staat is het lidmaatschap uit te oefenen en blijkens de verklaring
      van een arts aannemelijk is dat hij de uitoefening van het lidmaatschap niet binnen acht weken zal kunnen
      hervatten. Het tijdelijk ontslag gaat in op de dag na de bekendmaking van de beslissing op het verzoek. Aan het
      verzoek, bedoeld in de eerste volzin, wordt niet voldaan, indien het tijdstip waarop het verzoek wordt gedaan ligt
      binnen een periode van zestien weken voor het einde van de zittingsduur als bedoeld in [hoofdstuk C][ref2].

      3 Het lidmaatschap van het lid aan wie tijdelijk ontslag als bedoeld in het eerste lid of tweede lid is verleend,
      herleeft van rechtswege met ingang van de dag waarop zestien weken zijn verstreken sinds de dag van ingang van het
      tijdelijk ontslag.

      4 Aan een lid van een vertegenwoordigend orgaan wordt ten hoogste drie maal per zittingsperiode tijdelijk ontslag
      als bedoeld in het eerste of het tweede lid verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukC
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukC
