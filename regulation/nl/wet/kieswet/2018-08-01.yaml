  - number: Ya 46
    text: |-
      1 In afwijking van [artikel 7 van de Wet administratieve rechtspraak BES][ref1] wordt het beroep tegen een
      beschikking op grond van de [artikelen G 2][ref2], [G 3][ref3], of [G 4][ref4] die wordt genomen in het kader
      van de verkiezing van de leden van de eilandsraad of de verkiezing van de leden van het kiescollege, ingesteld bij
      het Gemeenschappelijk Hof.

      2 Tegen een beschikking op grond van [artikel I 4][ref5] die wordt genomen in het kader van de verkiezing van
      de leden van de eilandsraad of in het kader van de verkiezing van de leden van het kiescollege, kan door een
      belanghebbende, in afwijking van [artikel 7 van de Wet administratieve rechtspraak BES][ref6], en iedere kiezer
      uitsluitend beroep worden ingesteld bij het Gemeenschappelijk Hof.

      3 [Artikel G 5, eerste lid, aanhef en onderdelen b en c][ref7], is van overeenkomstige toepassing indien het
      betreft een beschikking op grond van [artikel G 2][ref8], [G 3][ref9] of [G 4][ref10].

      4 De [artikelen I 7, derde tot en met vijfde lid][ref11], en [I 8][ref12] zijn van overeenkomstige toepassing
      indien het betreft een beschikking op grond van [artikel I 4][ref13].

      5 [Artikel Ya 42, tweede tot en met vijfde lid][ref14], is van overeenkomstige toepassing.


