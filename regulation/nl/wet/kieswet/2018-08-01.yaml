  - number: Ya 20
    text: |-
      Voor de toepassing van [artikel W 2, eerste lid, onderdeel h][ref1],
      wordt in plaats van «[artikel 11 van de Gemeentewet][ref2]» gelezen:
      [artikel 12 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_2
