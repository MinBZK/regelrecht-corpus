  - number: W 6
    text: |-
      Indien de voorzitter van een centraal stembureau op dezelfde dag kennis krijgt van het openvallen van meer dan
      één plaats in een vertegenwoordigend orgaan en als gevolg hiervan een kandidaat op meer dan één lijst benoemd zou
      moeten worden verklaard, wordt deze benoemd met overeenkomstige toepassing van [artikel P 18][ref1].


