  - number: M 9
    text: |-
      1 Burgemeester en wethouders van 's-Gravenhage wijzen in hun gemeente briefstembureaus aan. Deze stembureaus
      zijn uitsluitend bestemd voor per brief uit te brengen stemmen. Ten aanzien van deze stembureaus zijn
      [artikel J 11][ref1] en [artikel J 16][ref2], voor zover dat artikel betrekking heeft op stemhokjes, niet van
      toepassing.

      2 Burgemeester en wethouders kunnen in afwijking van [artikel J 1][ref3] bepalen, dat deze stembureaus ten behoeve
      van het verrichten van de handelingen, bedoeld in de [artikelen M 10][ref4] en [M 11][ref5], tevens zitting
      houden vanaf veertien dagen voor de dag van stemming op door burgemeester en wethouders te bepalen tijden. In dat
      geval draagt de burgemeester er in afwijking van [artikel M 8, tweede lid][ref6], zorg voor dat de binnengekomen
      retourenveloppen die voldoende zijn gefrankeerd, op deze dagen worden overhandigd aan de voorzitter van de
      briefstembureaus.

      3 Indien burgemeester en wethouders van 's-Gravenhage gebruik hebben gemaakt van de bevoegdheid, bedoeld
      in het tweede lid, vangen deze stembureaus op de dag van stemming eerst met de handelingen bedoeld in de
      [artikelen M 10][ref7] en [M 11][ref8], aan, nadat het stembureau overeenkomstig [artikel N 16a, eerste lid][ref9],
      de stemopneming heeft verricht ten aanzien van de stembiljetten die zich bij aanvang van de dag van stemming in de
      stembus bevinden.

      4 In afwijking van [artikel J 1, tweede lid][ref10], eindigt de stemming op de dag der stemming zodra de
      briefstembureaus de handelingen, bedoeld in de [artikelen M 10][ref11] en [M 11][ref12], ten aanzien van alle
      tijdig binnengekomen retourenveloppen hebben beëindigd.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de zittingen, bedoeld in het
      tweede lid, en het bewaren van de stembescheiden.

      6 In plaats van het in [artikel J 17, eerste lid][ref13], bedoelde afschrift ligt op de tafel van deze stembureaus
      een lijst van personen die per brief mogen stemmen. Bij algemene maatregel van bestuur wordt vastgesteld uit welke
      gegevens de lijst bestaat.

      7 [Artikel E 4][ref14] is van overeenkomstige toepassing.


