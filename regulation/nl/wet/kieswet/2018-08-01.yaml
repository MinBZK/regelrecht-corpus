  - number: S 2
    text: |-
      1 Uiterlijk op de tiende dag na de kandidaatstelling beslist het centraal stembureau in een openbare zitting
      over de geldigheid van de lijsten voor iedere provincie waarvoor zij zijn ingeleverd en over het handhaven van de
      daarop voorkomende kandidaten, alsmede over het handhaven van de daarboven geplaatste aanduiding van een politieke
      groepering.

      2 De voorzitter van het centraal stembureau kondigt vooraf dag en uur van de zitting in de Staatscourant aan.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelS_2
  - number: S 3
    text: |-
      Voor een provincie is ongeldig de lijst:

      a. die niet op de dag van de kandidaatstelling tussen negen en zeventien uur bij het centraal stembureau door
      persoonlijke overhandiging is ingeleverd;

      b. waarbij niet is overgelegd een verklaring als bedoeld in [artikel R 2, eerste lid][ref1], van een lid van
      provinciale staten van deze provincie, waarbij buiten beschouwing blijven de verklaringen van een lid van
      provinciale staten dat meer dan één verklaring heeft ondertekend;

      c. die niet voldoet aan het bij ministeriële regeling vastgestelde model;

      d. waarop door toepassing van [artikel S 4][ref2] alle kandidaten zijn geschrapt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_4
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelS_3
    references:
