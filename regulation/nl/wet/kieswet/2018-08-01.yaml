        paragraaf: '1'
        afdeling: II
  - number: Ya 12
    text: |-
      1 De voorzitter van het hoofdstembureau van kieskring 20 (Bonaire) draagt er tevens zorg voor dat het proces-
      verbaal, bedoeld in [artikel O 3][ref1], langs elektronische weg terstond nadat de leden het proces-verbaal hebben
      getekend, ter kennis wordt gebracht van het centraal stembureau.

      2 De voorzitter van het hoofdstembureau draagt er ten slotte zorg voor dat de stukken genoemd in
      [artikel O 5, eerste lid][ref2], tevens langs elektronische weg terstond ter kennis worden gebracht van de Tweede
      Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_5
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelYa_12
