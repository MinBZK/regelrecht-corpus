  - number: Z 6
    text: |-
      Degene die bij een verkiezing als gemachtigde stemt voor een persoon, wetende dat deze overleden is, wordt gestraft
      met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_6
  - number: Z 8
    text: |-
      Degene die stelselmatig personen aanspreekt of anderszins persoonlijk benadert ten einde hen te bewegen het
      formulier op hun stempas, bestemd voor het stemmen bij volmacht, te ondertekenen en deze pas af te geven, wordt
      gestraft met hechtenis van ten hoogste een maand of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_8
  - number: Z 8a
    text: |-
      De onderdaan van een lidstaat van de Europese Unie die zowel in Nederland als in een andere lidstaat aan een
      stemming voor de verkiezing van de leden van het Europees Parlement deelneemt, wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_8a
  - number: Z 9
    text: |-
      De werkgever die de hem bij [artikel J 10][ref1] opgelegde verplichting niet nakomt, wordt gestraft met hechtenis
      van ten hoogste veertien dagen of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_10
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_10
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
  - number: Z 10
    text: |-
      De voorzitter, de leden en de opgeroepen plaatsvervangende leden van het stembureau die gedurende de zitting buiten
      noodzaak afwezig zijn zonder dat in vervanging is voorzien, worden gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2018-08-01#ArtikelZ_10
  - number: Z 11
    text: |-
      De in de [artikelen Z 1 tot en met Z 4][ref1] bedoelde strafbare feiten worden als misdrijven beschouwd en de in de
      [artikelen Z 6 tot en met Z 10][ref2] bedoelde strafbare feiten als overtredingen.


