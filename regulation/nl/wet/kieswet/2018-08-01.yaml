      2 [Artikel H 4, achtste lid][ref1], is van overeenkomstige toepassing.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt een bewijs daarvan. Dit bewijs moet
      bij de indiening van de lijst worden overgelegd.

      4 Indien geen geldige lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door de
      gemeente de waarborgsom teruggegeven aan degene die de betaling heeft verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijst lager is dan 75 procent
      van de kiesdeler, bedoeld in [artikel P 5][ref2], en aan de lijst geen zetel is toegewezen. In dat geval vervalt de
      waarborgsom aan de gemeente.


