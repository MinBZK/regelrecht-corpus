  - number: N 12
    text: |-
      1 De burgemeester brengt de processen-verbaal en de opgave van de door hem vastgestelde aantallen stemmen
      onverwijld over naar het hoofdstembureau. Tevens legt hij een afschrift van deze stukken onverwijld voor een ieder
      ter inzage op het gemeentehuis totdat over de toelating van de gekozenen is beslist.

      2 De burgemeester brengt de pakken, bedoeld in [artikel N 9][ref1], op verzoek van het centraal stembureau over
      naar het centraal stembureau.

      3 De burgemeester bewaart de pakken, bedoeld in de [artikelen N 2][ref2] en [N 9][ref3], die niet naar het centraal
      stembureau zijn overgebracht, en de afschriften, bedoeld in het eerste lid, drie maanden nadat over de toelating
      van de gekozenen is beslist. Daarna vernietigt hij deze stukken onmiddellijk, tenzij:

      a. de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek
      heeft gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is
      afgerond;

      b. strafvervolging is ingesteld wegens een strafbaar gestelde gedraging in de
      Kieswet, de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref4] of de
      [artikelen 131 tot en met 135 van het Wetboek van Strafrecht BES][ref5], in welk geval de vernietiging plaatsvindt
      nadat er een onherroepelijke rechterlijke uitspraak is.

      4 Van de vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
