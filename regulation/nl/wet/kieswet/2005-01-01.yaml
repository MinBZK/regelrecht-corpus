  - number: J 1
    text: |-
      1 De stemming vindt plaats op de drieënveertigste dag na de kandidaatstelling.

      2 De stemming vangt aan om zeven uur dertig en duurt tot eenentwintig uur.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_1
  - number: J 2
    text: |-
      De stemming geschiedt in elke kieskring over de kandidaten wier namen voorkomen op de voor die kieskring geldig
      verklaarde kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_2
  - number: J 3
    text: |-
      Behoudens in de gevallen, genoemd in de [hoofdstukken K][ref1], [L][ref2] en [M][ref3], neemt de kiezer aan de
      stemming deel in de gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukK
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref3]: https://wetten.overheid.nl/BWBR0004627#HoofdstukM
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: K
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        hoofdstuk: L
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004627
        hoofdstuk: M
        afdeling: II
  - number: J 4
    text: |-
      1 Burgemeester en wethouders wijzen voor elk stemdistrict een geschikt stemlokaal aan. Bij algemene maatregel van
      bestuur kunnen hieromtrent nadere regels worden gesteld.

      2 Burgemeester en wethouders dragen er zorg voor dat zoveel mogelijk stemlokalen zodanig zijn gelegen en ingericht,
      dat zij geschikt zijn voor kiezers met lichamelijke gebreken. De burgemeester brengt de adressen van deze
      stemlokalen ter openbare kennis onder vermelding van de mogelijkheid aldaar met toepassing van het bepaalde in
      [hoofdstuk K][ref1] de stem uit te brengen.

      3 Op verzoek van burgemeester en wethouders stellen de besturen van bijzondere scholen de daarvoor in aanmerking
      komende lokalen en het zich daarin bevindende materiaal voor de inrichting en het gebruik als stemlokaal
      beschikbaar, desgewenst tegen vergoeding van de daaruit voortvloeiende onkosten.

      4 De burgemeester draagt zorg voor de inrichting van het stemlokaal en wijst zo nodig personen aan die het
      stembureau ten dienste worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukK
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: K
        afdeling: II
  - number: J 5
    text: De kiezer stemt in het stemlokaal van het voor hem aangewezen stemdistrict.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_5
  - number: J 6
    text: |-
      De gemeenteraad kan bepalen dat tegelijk met de stemming in het stemlokaal een andere, door de gemeenteraad
      uitgeschreven, stemming plaatsvindt. Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven
      met het oog op de combinatie van de stemmingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_6
  - number: J 7
    text: |-
      Ten minste veertien dagen voor de stemming ontvangt elke kiezer die bevoegd is aan de stemming deel te nemen,
      van de burgemeester van de gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd, een
      oproepingskaart. Bij ministeriële regeling wordt voor de oproepingskaart een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_7
  - number: J 8
    text: |-
      Aan de tot deelneming aan de stemming bevoegde kiezer wiens oproepingskaart in het ongerede is geraakt of die
      geen kaart heeft ontvangen, wordt op zijn aanvraag door of vanwege de burgemeester een nieuwe oproepingskaart
      uitgereikt, mits hij voldoende van zijn identiteit doet blijken. Ook het stembureau is tot die uitreiking bevoegd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_8
  - number: J 9
    text: |-
      De burgemeester brengt de kandidatenlijsten ter kennis van de kiezers op bij algemene maatregel van bestuur vast te
      stellen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_9
  - number: J 10
    text: |-
      Iedere werkgever is verplicht te zorgen dat iedere kiezer die bij hem in dienstbetrekking is, de gelegenheid krijgt
      zijn stem uit te brengen voor zover dit niet kan geschieden buiten de vastgestelde arbeidstijd en mits de kiezer
      daardoor niet meer dan twee uur verhinderd is zijn arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_10
  - number: J 11
    text: |-
      1 De voorzitter en de leden van het stembureau, alsmede de personen die het stembureau ten dienste staan, kunnen,
      indien zij kiesgerechtigd zijn voor het orgaan waarvoor de verkiezing wordt gehouden, naar keuze bij dit stembureau
      of bij het stembureau van het voor hen aangewezen stemdistrict aan de stemming deelnemen.

      2 Indien zij behoren tot een ander stemdistrict, wordt van het uitbrengen van hun stem melding gemaakt in het
      proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_11
  - number: J 12
    text: |-
      1 Gedurende de zitting zijn steeds de voorzitter en twee leden van het stembureau aanwezig.

      2 Het stembureau bepaalt wie als tweede en derde lid van het stembureau optreden.

      3 Bij ontstentenis van de voorzitter treedt het tweede lid en bij diens ontstentenis het derde lid als voorzitter
      op.

      4 Bij ontstentenis van een lid treedt een door of vanwege burgemeester en wethouders aan te wijzen plaatsvervangend
      lid op.

      5 Indien geen plaatsvervangend lid beschikbaar is, verzoekt de voorzitter een van de in het stemlokaal aanwezige
      kiezers die hij daartoe geschikt acht, als zodanig op te treden totdat dit wel het het geval is.

      6 Van de wisselingen in de samenstelling van het stembureau wordt in het proces-verbaal aantekening gehouden met
      opgave van de tijd van de vervanging.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_12
  - number: J 13
    text: Indien bij het nemen van een beslissing door het stembureau de stemmen staken, beslist de stem van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_13
  - number: J 14
    text: De leden van het stembureau geven tijdens de uitoefening van hun functie geen blijk van hun politieke gezindheid.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_14
  - number: J 15
    text: Het stemlokaal is zodanig ingericht dat het stemgeheim is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_15
  - number: J 16
    text: |-
      1 In het stemlokaal zijn geplaatst een tafel voor het stembureau, een stembus en een of meer stemhokjes.

      2 De toegang tot de stemhokjes moet zichtbaar zijn voor het publiek.

      3 In ieder stemhokje bevindt zich een handleiding voor de kiezer. Bij ministeriële regeling wordt voor de
      handleiding een model vastgesteld.

      4 De tafel voor het stembureau is zo geplaatst dat de kiezers de verrichtingen van het stembureau kunnen gadeslaan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_16
  - number: J 17
    text: |-
      1 Op de tafel voor het stembureau ligt een afschrift van gegevens uit de gemeentelijke administratie, bevattende
      een genummerde opgave van de kiezers die in het stemdistrict bevoegd zijn aan de stemming deel te nemen. Bij
      algemene maatregel van bestuur wordt bepaald welke gegevens deze opgave bevat.

      2 Ieder stembureau beschikt over de wettelijke voorschriften die op de stemming betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_17
  - number: J 18
    text: |-
      1 De stembus, vervaardigd volgens bij algemene maatregel van bestuur te geven voorschriften, staat bij de tafel,
      binnen het bereik van het lid van het stembureau dat belast is met de in [artikel J 26, derde lid][ref1], bedoelde
      taak.

      2 Tijdig voor de aanvang van de stemming sluit het stembureau de stembus, na zich ervan overtuigd te hebben dat zij
      leeg is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_26
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_18
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_26
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
  - number: J 19
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van het
      stemlokaal.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_19
  - number: J 20
    text: |-
      1 Op het bij de verkiezing te bezigen stembiljet zijn aan de ene zijde gedrukt de lijsten van kandidaten over
      wie de stemming moet geschieden, zoals deze ter kennis van de kiezers worden gebracht, en aan de andere zijde de
      handtekening van de voorzitter van het hoofdstembureau. Aan de zijde waar de handtekening van de voorzitter van
      het hoofdstembureau is gedrukt, kunnen voorts worden gedrukt de naam van het vertegenwoordigend orgaan waarvoor de
      verkiezing geldt, alsmede een aanduiding van de kieskring.

      2 Bij ministeriële regeling wordt voor het stembiljet een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_20
  - number: J 21
    text: |-
      1 De burgemeester van de gemeente waar het hoofdstembureau is gevestigd, draagt zorg dat de stembiljetten alsmede
      de formulieren voor de processen-verbaal voor alle tot de kieskring behorende gemeenten tijdig in gereedheid worden
      gebracht.

      2 Hij zendt in één of meer verzegelde pakken aan de burgemeester van elke tot de kieskring behorende gemeente
      tijdig de benodigde stembiljetten en formulieren voor de procesen-verbaal. Op elk pak wordt het aantal zich daarin
      bevindende stembiljetten of formulieren vermeld.

      3 De kosten van het vervaardigen en toezenden van de stembiljetten en de formulieren worden naar evenredigheid over
      de gemeenten verdeeld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_21
  - number: J 22
    text: |-
      1 De burgemeester draagt zorg dat voor de aanvang van de stemming bij elk stembureau in zijn gemeente de benodigde
      stembiljetten en formulieren voor de processen-verbaal aanwezig zijn.

      2 De stembiljetten worden aan het stembureau ter beschikking gesteld in één of meer verzegelde pakken, op elk
      waarvan het aantal zich daarin bevindende stembiljetten is vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_22
  - number: J 23
    text: |-
      Het stembureau opent tijdig voor de aanvang van de stemming de pakken met stembiljetten en stelt het aantal
      biljetten vast.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_23
  - number: J 24
    text: |-
      1 Tot de stemming wordt slechts toegelaten degene die bevoegd is aan de verkiezing deel te nemen, voor zover hij
      in het bezit is van de hem toegezonden of ingevolge [artikel J 8][ref1] uitgereikte oproepingskaart, dan wel een
      kiezerspas of een volmachtbewijs.

      2 De voorzitter van het stembureau kan, alvorens iemand tot de stemming toe te laten, verlangen dat hij van zijn
      identiteit doet blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_8
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_24
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_8
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
  - number: J 25
    text: |-
      1 De kiezer overhandigt aan de voorzitter van het stembureau de oproepingskaart.

      2 De voorzitter noemt duidelijk verstaanbaar het nummer waaronder de kiezer volgens de oproepingskaart in het
      afschrift van gegevens uit de gemeentelijke administratie voorkomt.

      3 Het tweede lid van het stembureau noemt de naam die in het afschrift van gegevens uit de gemeentelijke
      administratie bij het door de voorzitter genoemde nummer is vermeld. De voorzitter controleert de naam aan de hand
      van de oproepingskaart.

      4 Het tweede lid van het stembureau houdt, door in het afschrift van gegevens uit de gemeentelijke administratie
      naast de naam van de kiezer zijn paraaf te plaatsen, aantekening dat deze zich heeft aangemeld.

      5 Vervolgens overhandigt de voorzitter aan de kiezer een stembiljet.

      6 De voorzitter houdt aantekening van het aantal uitgereikte stembiljetten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_25
  - number: J 26
    text: |-
      1 De kiezer gaat na ontvangst van het stembiljet naar een stemhokje en stemt aldaar door een wit stipje, geplaatst
      in het stemvak vóór de naam van de kandidaat van zijn keuze, rood te maken.

      2 Hij vouwt vervolgens het stembiljet dicht en gaat daarmee naar het stembureau.

      3 Het derde lid van het stembureau ziet erop toe, dat de kiezer het stembiljet in de stembus steekt.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_26
  - number: J 27
    text: |-
      1 Indien een kiezer zich bij de invulling van zijn stembiljet vergist, geeft hij dit aan de voorzitter terug. Deze
      verstrekt hem op zijn verzoek eenmaal een nieuw biljet.

      2 De teruggegeven stembiljetten worden door de voorzitter onmiddellijk onbruikbaar gemaakt op bij algemene
      maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_27
  - number: J 28
    text: |-
      Wanneer aan het stembureau blijkt dat een kiezer wegens zijn lichamelijke gesteldheid hulp behoeft, staat het toe
      dat deze zich laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_28
  - number: J 29
    text: |-
      Indien een kiezer weigert het stembiljet in de bus te steken, houdt de voorzitter daarvan aantekening. Indien
      een stembiljet wordt teruggegeven, wordt dit door de voorzitter onmiddellijk onbruikbaar gemaakt op bij algemene
      maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_29
  - number: J 30
    text: |-
      Zodra de voor de stemming bepaalde tijd verstreken is, wordt dit door de voorzitter aangekondigd en worden alleen
      de op dat ogenblik in het stemlokaal of bij de ingang daarvan aanwezige kiezers nog tot de stemming toegelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_30
  - number: J 31
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de gang van zaken bij de
      stemming.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_31
  - number: J 32
    text: |-
      Bij de daartoe door de raad of krachtens diens machtiging door burgemeester en wethouders aangewezen stembureaus
      kan op andere wijze dan door middel van stembiljetten worden gestemd. De bepalingen van deze wet die betrekking
      hebben op het gebruik van stembiljetten, blijven dan buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_32
  - number: J 33
    text: |-
      1 Het stemmen anders dan door middel van stembiljetten vindt alleen plaats, indien daarbij overeenkomstig
      bij algemene maatregel van bestuur gestelde nadere regels een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties goedgekeurde techniek wordt gebezigd.

      2 Aan een techniek als vorenbedoeld wordt alleen dan goedkeuring verleend, indien deze tenminste aan de volgende
      eisen voldoet:

      a. het geheime karakter van de stemming moet zijn gewaarborgd, ook indien de kiezer geen keuze wenst te maken;

      b. de te bezigen apparatuur dient van degelijke makelij te zijn en moet door de kiezer op eenvoudige wijze en
      zonder gevaar voor storingen of onvolkomen werking kunnen worden bediend;

      c. de kandidatenlijsten, het aan elke lijst toegekende nummer en de aanduiding van de politieke groepering, moeten
      op duidelijke wijze kunnen worden vermeld;

      d. de kiezer moet zijn stem slechts éénmaal kunnen uitbrengen en moet de gelegenheid hebben een gemaakte vergissing
      te herstellen.

      3 Aan de goedkeuring kunnen voorschriften worden verbonden.

      4 Van de goedkeuring wordt mededeling gedaan in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_33
  - number: J 34
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende het stemmen anders dan
      door middel van stembiljetten. Deze regels worden zoveel mogelijk vastgesteld overeenkomstig de bepalingen van deze
      wet betreffende het stemmen door middel van stembiljetten.

      2 Een wijziging van de algemene maatregel van bestuur, bedoeld in het eerste lid, treedt niet eerder in werking
      dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin zij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_34
  - number: J 35
    text: |-
      1 Gedurende de tijd dat het stembureau zitting houdt, zijn de kiezers bevoegd in het stemlokaal te vertoeven, voor
      zover de orde daardoor niet wordt verstoord en de voortgang van de zitting niet wordt belemmerd.

      2 De in het stemlokaal aanwezige kiezers kunnen mondeling bezwaren inbrengen, indien de stemming niet
      overeenkomstig de wet geschiedt.

      3 De bezwaren worden in het proces-verbaal van de zitting van het stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_35
  - number: J 36
    text: In het stemlokaal worden geen activiteiten ontplooid die erop gericht zijn de kiezers in hun keuze te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_36
  - number: J 37
    text: |-
      De voorzitter is belast met de handhaving van de orde tijdens de zitting. Hij kan daartoe de burgemeester om
      bijstand verzoeken.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_37
  - number: J 38
    text: |-
      1 Indien zich naar het oordeel van het stembureau omstandigheden voordoen in of bij het stemlokaal die de
      behoorlijke voortgang van de zitting onmogelijk maken, wordt dit door de voorzitter verklaard. De zitting wordt
      daarop geschorst. De voorzitter doet hiervan terstond mededeling aan de burgemeester. De burgemeester bepaalt
      vervolgens wanneer en waar de zitting wordt hervat.

      2 Bij of krachtens algemene maatregel van bestuur worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_38
  - number: J 39
    text: |-
      1 Onze Minister van Buitenlandse Zaken kan ter uitvoering van een verdrag of een internationale afspraak personen
      toelaten die als waarnemer getuige mogen zijn van het verloop van de verkiezingen.

      2 Een waarnemer is bevoegd in het stemlokaal te vertoeven gedurende de tijd dat het stembureau zitting houdt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent waarneming bij de
      verkiezingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelJ_39
  - number: K 1
    text: |-
      Aan de kiezer wordt overeenkomstig de bepalingen van dit hoofdstuk op zijn verzoek toegestaan binnen het gebied van
      het orgaan waarvoor de verkiezing wordt gehouden, aan de stemming deel te nemen in een stembureau van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_1
  - number: K 2
    text: |-
      Het in [artikel K 1][ref1] bepaalde geldt niet voor de kiezer aan wie op zijn verzoek is toegestaan bij volmacht of
      per brief te stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_1
        hoofdstuk: K
        afdeling: II
  - number: K 3
    text: |-
      1 De kiezer die van de in [artikel K 1][ref1] bedoelde gelegenheid wenst gebruik te maken, doet overeenkomstig het
      bepaalde in [artikel K 6][ref2] schriftelijk, of overeenkomstig het bepaalde in [artikel K 10][ref3] mondeling,
      het verzoek daartoe aan de burgemeester van de gemeente waar hij op de dag van de kandidaatstelling als kiezer
      is geregistreerd.

      2 De burgemeester brengt op de dag van de kandidaatstelling ter openbare kennis dat uiterlijk op de in
      [artikel K 6, eerste lid][ref4], bedoelde dag schriftelijk, en binnen de in [artikel K 10, eerste lid][ref5],
      bedoelde termijn mondeling, een verzoek als in het eerste lid bedoeld kan worden gedaan.


