  - number: P 20
    text: |-
      1 De voorzitter van het centraal stembureau maakt de uitslag van de verkiezing zo spoedig mogelijk bekend. De
      bekendmaking geschiedt in een openbare zitting van het centraal stembureau.

      2 Dag en uur van de zitting worden door de voorzitter tijdig bekend gemaakt. De wijze van bekendmaking wordt
      geregeld bij algemene maatregel van bestuur.

      3 De aanwezige kiezers kunnen mondeling bezwaren inbrengen.

      4 De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_20
  - number: P 21
    text: |-
      1 Het centraal stembureau kan op de in artikel P 20 bedoelde zitting, voordat de uitslag van de verkiezing bekend
      wordt gemaakt, hetzij ambtshalve, hetzij naar aanleiding van een met opgave van redenen gedaan verzoek van een
      of meer kiezers, tot een nieuwe opneming van stembiljetten, zowel uit alle als uit een of meer stemdistricten,
      besluiten, indien een ernstig vermoeden bestaat dat door een of meer stembureaus bij de stemopneming zodanige
      fouten zijn gemaakt dat zij van invloed op de zetelverdeling kunnen zijn. De burgemeester die de desbetreffende
      stembiljetten onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar het centraal
      stembureau overbrengen.

      2 Na ontvangst van de stembiljetten gaat het centraal stembureau onmiddellijk tot de opneming over. Het is bevoegd
      daartoe de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de stembureaus.

      3 Bij deze opneming zijn de [artikelen N 5][ref1],  N 8 en N 9 van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_5
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_21
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_5
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: P 22
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden de uitslag van de verkiezing, alsmede alle ingebrachte bezwaren vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_22
  - number: P 23
    text: |-
      1 De voorzitter van het centraal stembureau maakt de uitslag van de verkiezing van de leden van de Tweede
      Kamer zo spoedig mogelijk openbaar door plaatsing van een afschrift van het proces-verbaal in de *Nederlandse
      Staatscourant*.

      2 De voorzitter van het centraal stembureau maakt de uitslag van de verkiezing van de leden van provinciale staten
      en van de gemeenteraad zo spoedig mogelijk openbaar door een afschrift van het proces-verbaal voor een ieder ter
      inzage te leggen ter provinciale griffie, onderscheidenlijk ter gemeentesecretarie. Van de terinzagelegging wordt
      tegelijk openbare kennisgeving gedaan door de commissaris van de Koning, onderscheidenlijk de burgemeester. De
      terinzagelegging wordt beëindigd, zodra over de toelating van de gekozen leden onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_23
  - number: P 24
    text: |-
      De voorzitter van het centraal stembureau doet een afschrift van het proces-verbaal toekomen aan het orgaan
      waarvoor de verkiezing plaats heeft gevonden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_24
  - number: P 25
    text: |-
      De voorzitter van het centraal stembureau draagt zorg voor de bewaring van de verzegelde pakken met stembiljetten
      die op grond van het [eerste lid van artikel P 21][ref1] naar het centraal stembureau zijn overgebracht.

      Hij vernietigt deze pakken, nadat over de toelating van de benoemden onherroepelijk is beslist. Van deze
      vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_21
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_25
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_21
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
  - number: Q 1
    text: |-
      1 De leden van de Eerste Kamer worden gekozen door de leden van provinciale staten.

      2 De leden van provinciale staten komen per provincie in vergadering bijeen tot het uitbrengen van hun stem.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_1
  - number: Q 2
    text: |-
      1 De leden van de Eerste Kamer worden gekozen voor vier jaren.

      2 Zij treden tegelijk af met ingang van de dinsdag in de periode van 7 tot en met 13 juni in het jaar waarin de
      leden van provinciale staten worden gekozen.

      3 Indien de eerste samenkomst van de na een ontbinding gekozen Eerste Kamer valt voor het tijdstip waarop de
      zittingsduur van de ontbonden kamer zou zijn geëindigd, treden de leden van de nieuw gekozen kamer tegelijk op dat
      tijdstip af.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_2
  - number: Q 3
    text: |-
      Degene die ter vervulling van een opengevallen plaats tot lid van de Eerste Kamer is benoemd, treedt af op het
      tijdstip waarop degene in wiens plaats hij is benoemd, zou hebben moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_3
  - number: Q 4
    text: |-
      De kandidaatstelling voor de verkiezing van de leden van de Eerste Kamer vindt plaats op de dinsdag in de periode
      van 19 tot en met 25 april.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_4
  - number: Q 5
    text: |-
      In geval van ontbinding van de Eerste Kamer vindt de kandidaatstelling plaats binnen veertig dagen na de
      dagtekening van het koninklijk besluit tot ontbinding, op een bij dat besluit te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_5
  - number: Q 6
    text: |-
      1 De registratie van een aanduiding van een politieke groepering voor de verkiezing van de leden van de Tweede
      Kamer, als bedoeld in [artikel G 1][ref1], geldt tevens voor de verkiezing van de leden van de Eerste Kamer.

      2 Een politieke groepering die een vereniging is met volledige rechtsbevoegdheid, waarvan de aanduiding niet
      is geregistreerd voor de verkiezing van de leden van de Tweede Kamer, kan aan het centraal stembureau voor
      de verkiezingen van de leden van de Eerste Kamer schriftelijk verzoeken de aanduiding waarmee zij voor die
      verkiezingen op de kandidatenlijst wenst te worden vermeld, in te schrijven in een register dat door het centraal
      stembureau wordt bijgehouden. Verzoeken, ingediend na de drieënveertigste dag voor de kandidaatstelling, blijven
      voor de daaropvolgende verkiezing buiten behandeling.

      3 Het [tweede tot en met zevende lid van artikel G 1][ref2] zijn van overeenkomstige toepassing, met
      dien verstande dat voor de toepassing van het zevende lid, onder d, in plaats van «de Tweede Kamer» wordt
      gelezen «de Eerste Kamer» en in plaats van «[tweede of derde lid van artikel H 3][ref3]» wordt gelezen:
      [eerste of tweede lid van artikel R 7][ref4].

      4 Behalve op de in [artikel G 1, vierde lid][ref5], genoemde gronden wordt op een verzoek om registratie van de
      aanduiding van een politieke groepering ten behoeve van de verkiezingen van de leden van de Eerste Kamer afwijzend
      beschikt, indien de aanduiding geheel of in hoofdzaak overeenstemt met een aanduiding van een andere politieke
      groepering die reeds ten behoeve van de verkiezingen van de leden van de Tweede Kamer is geregistreerd, of met een
      aanduiding waarvoor reeds eerder of op dezelfde dag ten behoeve van de verkiezing van de leden van de Tweede Kamer
      een registratieverzoek is ingediend, en daardoor verwarring te duchten is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_7
      [ref5]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelQ_6
