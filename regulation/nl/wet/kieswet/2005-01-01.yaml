  - number: K 8
    text: |-
      1 Zo spoedig mogelijk na ontvangst van het verzoek wordt door de burgemeester of de door hem daartoe aangewezen
      ambtenaar een beslissing genomen.

      2 Het verzoek wordt slechts afgewezen, indien de verzoeker op de dag van de kandidaatstelling niet als kiezer is
      geregistreerd, hem overeenkomstig [paragraaf 2 van hoofdstuk L][ref1] is toegestaan bij volmacht te stemmen, of hem
      is toegestaan per brief te stemmen.

      3 Indien het verzoek niet in verdere behandeling kan worden genomen of moet worden afgewezen, wordt de reden
      hiervan op het verzoekschrift vermeld, waarna dit onverwijld aan de verzoeker wordt teruggezonden.

      4 [Artikel D 9][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
