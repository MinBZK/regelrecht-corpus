  - number: R 1
    text: |-
      1 Op de dag van de kandidaatstelling kunnen bij de commissaris van de Koning of een door gedeputeerde staten
      aangewezen lid van dat college, van negen tot zeventien uur, kandidatenlijsten door persoonlijke overhandiging
      worden ingeleverd.

      2 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de kandidatenlijsten,
      kosteloos, voor de leden van provinciale staten verkrijgbaar zijn. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_1
  - number: R 2
    text: |-
      Iedere kandidatenlijst wordt ondertekend door ten minste één lid van provinciale staten. Hetzelfde lid mag niet
      meer dan één lijst ondertekenen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_2
  - number: R 3
    text: |-
      Op de lijst kunnen een gemachtigde en desgewenst diens plaatsvervangers worden aangewezen, bevoegd tot het
      verbinden van de lijst met andere lijsten tot een lijstencombinatie. Voorts worden op de lijst een of meer
      personen vermeld die bij verhindering van de inleveraar bevoegd zijn tot het herstel van verzuimen, bedoeld in
      [artikel S 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: S_1
        hoofdstuk: S
        paragraaf: '1'
        afdeling: III
  - number: R 4
    text: |-
      1 De namen van de kandidaten worden op de lijsten geplaatst in de volgorde waarin aan hen de voorkeur wordt
      gegeven.

      2 Op dezelfde lijst mogen de namen van ten hoogste dertig kandidaten worden geplaatst. Op dezelfde lijst van
      een politieke groepering wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van de Eerste Kamer meer dan vijftien zetels zijn toegekend, mag een aantal namen worden
      geplaatst dat ten hoogste tweemaal het aantal zetels bedraagt, doch nimmer meer dan tachtig. Het bepaalde in de
      vorige volzin is van overeenkomstige toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer
      groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_4
  - number: R 5
    text: |-
      De naam van een kandidaat mag niet voorkomen op meer dan één van de lijsten die in eenzelfde provincie zijn
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_5
  - number: R 6
    text: De wijze waarop kandidaten op de lijst worden vermeld, wordt geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_6
  - number: R 7
    text: |-
      1 De gemachtigde, bedoeld in [artikel G 1, derde lid, onder d][ref1], onderscheidenlijk
      [artikel Q 6, derde lid][ref2], in samenhang met [artikel G 1, derde lid, onder d][ref3], kan aan degene die de
      kandidatenlijst inlevert de bevoegdheid verlenen boven de lijst de aanduiding van de desbetreffende groepering te
      plaatsen, zoals die door het centraal stembureau is geregistreerd. Een verklaring van de gemachtigde waaruit deze
      bevoegdheid blijkt, wordt bij de lijst overgelegd.

      2 Degene die de lijst inlevert, is bevoegd daarboven een aanduiding te plaatsen, gevormd door samenvoeging van door
      het centraal stembureau voor de verkiezing van de leden van de Eerste Kamer of van de Tweede Kamer geregistreerde
      aanduidingen of afkortingen daarvan, indien hem daartoe de bevoegdheid is verleend door de gemachtigden van de
      onderscheidene groeperingen. Verklaringen van de gemachtigden waaruit deze bevoegdheid blijkt, worden bij de lijst
      overgelegd. Een aldus gevormde aanduiding mag niet meer dan 35 letters of andere tekens bevatten.

      3 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen met
      betrekking tot het plaatsen van aanduidingen van politieke groeperingen boven kandidatenlijsten, kosteloos,
      verkrijgbaar zijn. Bij ministeriële regeling wordt voor de formulieren een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelQ_6
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_7
