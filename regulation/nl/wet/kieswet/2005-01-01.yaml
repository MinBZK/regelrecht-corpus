        hoofdstuk: H
        afdeling: II
  - number: Y 14
    text: |-
      In afwijking van [artikel H 3, eerste lid, tweede volzin][ref1], legt elke inleveraar van een lijst een verklaring
      over van burgemeester en wethouders van de gemeente waar hij als kiezer is geregistreerd, dat hij bevoegd is tot
      deelneming aan de verkiezing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_14
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_3
        hoofdstuk: H
        afdeling: II
  - number: Y 15
    text: |-
      1 In afwijking van [artikel I 2, eerste lid, onder ][ref1], wordt als verzuim aangemerkt dat de lijst is ingeleverd
      door een kiezer die niet heeft overgelegd een verklaring van burgemeester en wethouders van de gemeente waar hij
      is geregistreerd, dat hij bevoegd is tot deelneming aan de verkiezing. Als verzuim wordt mede aangemerkt dat ten
      aanzien van een kandidaat de verklaring, bedoeld in [artikel Y 13, eerste lid][ref2], ontbreekt.

      2 Het herstellen van verzuimen geschiedt ten kantore van het centraal stembureau.

      3 [Artikel I 2, derde lid, eerste volzin][ref3], vindt overeenkomstige toepassing, indien de in het eerste lid
      bedoelde verklaring niet alsnog wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_15
    references:
