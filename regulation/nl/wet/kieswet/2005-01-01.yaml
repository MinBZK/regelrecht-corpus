  - number: W 4
    text: |-
      1 Indien bij plaatsvervanging van leden van een gemeenteraad met negen of elf leden geen kandidaat meer voor
      benoeming in aanmerking komt op de lijst, waarop degene is gekozen die moet worden vervangen, of op de lijsten die
      met deze lijst een lijstengroep of lijstencombinatie vormen, wordt door toepassing van [artikel P 10][ref1] beslist
      aan welke van de andere lijsten de plaats zal worden toegekend. De kandidaat die op de lijst waaraan de plaats
      wordt toegekend, naar de volgorde, vastgesteld overeenkomstig [artikel P 19][ref2], voor benoeming in aanmerking
      komt, wordt benoemd verklaard.

      2 Indien bij de toepassing van de bepalingen van dit hoofdstuk op geen van de lijsten een kandidaat meer
      voor benoeming in aanmerking komt, beslist het centraal stembureau dat geen opvolger kan worden benoemd. Bij
      ministeriële regeling wordt voor het besluit een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_19
