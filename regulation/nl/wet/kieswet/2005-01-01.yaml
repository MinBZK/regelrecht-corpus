  - number: N 16a
    text: |-
      1 Indien burgemeester en wethouders van 's-Gravenhage gebruik hebben gemaakt van de bevoegdheid, bedoeld in
      [artikel M 9, tweede lid][ref1], vangen zij in afwijking van [artikel N 1][ref2] de stemopneming op de dag van
      stemming aan om zeven uur dertig ten aanzien van de stembiljetten die zich op dat moment in de stembus bevinden.

      2 Ten behoeve van de handelingen, bedoeld in de [artikelen M 10][ref3] en [M 11][ref4], ten aanzien van de nog
      niet geopende retourenveloppen wordt de stemopneming volgens bij algemene maatregel van bestuur te stellen regels
      geschorst. Zodra deze handelingen ten aanzien van alle tijdig binnengekomen retourenveloppen zijn beëindigd, wordt
      de stemopneming volgens bij algemene maatregel van bestuur te stellen regels hervat.

      3 Zolang de stemming niet op alle stembureaus in Nederland is geëindigd, blijft [artikel N 9][ref5] buiten
      toepassing. Voorts is een ieder die ambtshalve kennis kan nemen van de vastgestelde aantallen stemmen, zolang
      verplicht tot geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref5]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
