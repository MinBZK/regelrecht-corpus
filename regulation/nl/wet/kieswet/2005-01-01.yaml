  - number: E 9
    text: |-
      Voor het houden van de zittingen van het hoofdstembureau wijzen burgemeester en wethouders een geschikte ruimte
      aan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_9
  - number: E 10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent inrichting, samenstelling en
      werkwijze van het hoofdstembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_10
  - number: E 11
    text: |-
      1 Er is voor de verkiezing van elk vertegenwoordigend orgaan een centraal stembureau.

      2 Voor de verkiezing van de leden van de Tweede Kamer treedt de Kiesraad als centraal stembureau op.

      3 Voor de verkiezing van de leden van provinciale staten treedt het hoofdstembureau van de kieskring waarin de
      gemeente is gelegen waar de vergadering van de staten wordt gehouden, tevens als centraal stembureau op.

      4 Voor de verkiezing van de leden van de gemeenteraad treedt het hoofdstembureau tevens als centraal stembureau op.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_11
  - number: F 1
    text: |-
      1 De kandidaatstelling voor de verkiezing van de leden van de Tweede Kamer, provinciale staten en de gemeenteraad
      vindt plaats op de dinsdag in de periode van 18 tot en met 24 januari.

      2 In het geval, bedoeld in [artikel C 3, eerste lid][ref1], vindt de kandidaatstelling voor de verkiezing van de
      leden van de Tweede Kamer plaats op de dinsdag in de periode van 29 maart tot en met 4 april.

      3 Bij koninklijk besluit kan, indien zwaarwichtige redenen verband houdend met de dag van stemming daartoe nopen,
      worden bepaald dat de kandidaatstelling plaatsvindt op de dinsdag, woensdag, donderdag, of maandag vóór de in het
      eerste onderscheidenlijk tweede lid genoemde dag. Het koninklijk besluit wordt bekend gemaakt uiterlijk zes maanden
      vóór de in het eerste onderscheidenlijk tweede lid genoemde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelF_1
    references:
