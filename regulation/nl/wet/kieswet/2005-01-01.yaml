  - number: D 10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de registratie van de
      kiesgerechtigdheid.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_10
  - number: E 1
    text: |-
      1 Voor de verkiezing van de leden van de Tweede Kamer wordt Nederland verdeeld in kieskringen, overeenkomstig de
      bij deze wet gevoegde tabel.

      2 De kieskringen voor de verkiezing van de leden van de Tweede Kamer vormen tevens de kieskringen voor de
      verkiezing van de leden van provinciale staten. Provinciale staten kunnen voor de verkiezing van de leden van
      provinciale staten deze kieskringen in meer kieskringen verdelen.

      3 Voor de verkiezing van de leden van de gemeenteraad vormt elke gemeente één kieskring.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_1
  - number: E 2
    text: |-
      De gemeente kan door burgemeester en wethouders in stemdistricten worden verdeeld. Heeft deze verdeling niet
      plaats, dan vormt de gemeente één stemdistrict.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_2
  - number: E 3
    text: |-
      1 Er is voor elk stemdistrict een stembureau.

      2 Elk stembureau bestaat uit drie leden, van wie er één voorzitter is.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_3
  - number: E 4
    text: |-
      Burgemeester en wethouders benoemen tijdig voor elke verkiezing de leden van elk stembureau en een voldoend aantal
      plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_4
  - number: E 5
    text: |-
      1 Voor de verkiezing van de leden van de Tweede Kamer wordt voor elke kieskring een hoofdstembureau ingesteld. Het
      is gevestigd in de gemeente, daartoe aangewezen in de tabel, genoemd in [artikel E 1, eerste lid][ref1].

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 Voorzitter is de burgemeester van de gemeente waar het hoofdstembureau is gevestigd. De plaatsvervangend
      voorzitter en de andere leden, alsmede drie plaatsvervangende leden, worden benoemd en ontslagen door Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelE_5
    references:
