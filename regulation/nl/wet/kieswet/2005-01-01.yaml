  - number: H 6
    text: |-
      1 De namen van de kandidaten worden op de lijsten geplaatst in de volgorde waarin aan hen de voorkeur wordt
      gegeven.

      2 Op dezelfde lijst mogen de namen van ten hoogste dertig kandidaten worden geplaatst. Op dezelfde lijst van
      een politieke groepering wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van het desbetreffende vertegenwoordigend orgaan meer dan vijftien zetels zijn toegekend,
      mag een aantal namen worden geplaatst dat ten hoogste tweemaal het aantal zetels bedraagt, doch nimmer meer dan
      tachtig. Het bepaalde in de vorige volzin is van overeenkomstige toepassing ten aanzien van samenvoeging van
      aanduidingen van twee of meer groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_6
  - number: H 7
    text: |-
      1 De naam van een kandidaat mag niet voorkomen op een lijst, indien de kandidaat tijdens de zittingsperiode van
      het orgaan waarvoor de verkiezing zal plaatshebben, niet de voor het zitting nemen in dat orgaan vereiste leeftijd
      zal bereiken.

      2 De naam van eenzelfde kandidaat mag niet voorkomen op meer dan één van de lijsten welke bij eenzelfde
      hoofdstembureau zijn ingeleverd.

      3 Indien voor de verkiezing van de leden van provinciale staten of de gemeenteraad op een lijst de naam voorkomt
      van een kandidaat die geen ingezetene is van de provincie, onderscheidenlijk de gemeente, dient bij de lijst te
      worden overgelegd een door die kandidaat ondertekende verklaring, waaruit blijkt, dat hij voornemens is zich bij
      benoeming te vestigen in de provincie, onderscheidenlijk gemeente.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_7
  - number: H 8
    text: De wijze waarop kandidaten op de lijst worden vermeld, wordt geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_8
  - number: H 9
    text: |-
      1 Bij de lijst wordt overgelegd een schriftelijke verklaring van iedere daarop voorkomende kandidaat dat hij
      instemt met zijn kandidaatstelling op deze lijst.

      2 Een overgelegde verklaring van instemming kan niet worden ingetrokken.

      3 Bij de lijst wordt van iedere kandidaat die geen zitting heeft in het vertegenwoordigend orgaan waarvoor de
      verkiezing wordt gehouden, tevens een kopie van een geldig legitimatiebewijs overgelegd. Indien van een dergelijke
      kandidaat een kopie van een geldig legitimatiebewijs ontbreekt, wordt de verklaring van instemming van de
      betreffende kandidaat geacht te ontbreken.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen van
      instemming, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een
      model vastgesteld.

      5 Indien de kandidaat zich buiten Nederland bevindt, is de verklaring niet aan enig formulier gebonden en kan zij
      ook telegrafisch of per telex geschieden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_9
  - number: H 10
    text: |-
      1 De kandidaat wiens woonplaats buiten Nederland is gelegen, wijst in de verklaring van instemming tevens een
      in Nederland wonende gemachtigde aan met vermelding van diens naam, voorletters, woonplaats en adres. Indien de
      kandidaat voorkomt op meer dan één lijst, moet in iedere verklaring dezelfde gemachtigde worden aangewezen. Deze
      gemachtigde is met uitsluiting van de kandidaat bevoegd tot de handelingen, bedoeld in de artikelen V 2, eerste,
      vierde en vijfde lid, [V 3, eerste en derde lid][ref1], en [W 2, eerste lid, onder ][ref2].

      2 De kandidaat is bevoegd de overeenkomstig het eerste lid gegeven volmacht in te trekken. Hij geeft hiervan
      schriftelijk, telegrafisch of per telex kennis aan de voorzitter van het centraal stembureau, zo nodig met
      aanwijzing van een nieuwe gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_10
