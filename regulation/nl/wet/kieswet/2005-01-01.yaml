  - number: M 4
    text: |-
      1 Zo spoedig mogelijk na ontvangst van het verzoek wordt door de burgemeester of de door hem daartoe aangewezen
      ambtenaar een beslissing genomen.

      2 Het verzoek wordt slechts afgewezen, indien gebleken is dat de verzoeker niet tot de in [artikel M 1][ref1]
      bedoelde kiezers behoort.

      3 Indien het verzoek niet in verdere behandeling kan worden genomen of moet worden afgewezen, wordt de reden
      daarvan vermeld op het verzoekschrift, dat daarna onverwijld wordt teruggezonden.

      4 Bij inwilliging van het verzoek tekent de burgemeester of de door hem daartoe aangewezen ambtenaar dit op het
      verzoekschrift aan. Indien het een verzoekschrift als bedoeld in artikel M 3, eerste lid, tweede volzin, betreft en
      het verzoekschrift afkomstig is van een persoon die als kiezer in een andere gemeente in Nederland is geregistreerd
      dan de gemeente 's-Gravenhage, zendt de burgemeester of de door hem daartoe aangewezen ambtenaar het ingewilligde
      verzoekschrift zo spoedig mogelijk door naar de burgemeester van 's-Gravenhage.

      5 [Artikel D 9][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
