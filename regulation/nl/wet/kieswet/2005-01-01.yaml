  - number: G 5
    text: |-
      1 Tegen een beschikking als bedoeld in de [artikelen G 1][ref1], [G 2][ref2], [G 3][ref3], en [G 4][ref4] kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref5] wordt een beroepschrift ingevolge die
      wet tegen:

      a. een beschikking als bedoeld in de [artikelen G 1][ref6] en [G 2][ref7] ingediend uiterlijk op de zesde dag na
      de dagtekening van de *Staatscourant* waarin de beschikking is opgenomen, dan wel na de dag waarop de beschikking
      geacht wordt te zijn geweigerd,

      b. een beschikking als bedoeld in [artikel G 3][ref8] ingediend uiterlijk op de zesde dag na de dagtekening van de
      openbare kennisgeving, bedoeld in het vijfde lid van dat artikel, dan wel na de dag waarop de beschikking geacht
      wordt te zijn geweigerd, en

      c. een beschikking als bedoeld in [artikel G 4][ref9] ingediend uiterlijk op de zesde dag na de dag waarop
      de beschikking, als bedoeld in het tweede lid van dat artikel is bekendgemaakt, dan wel na de dag waarop de
      beschikking geacht wordt te zijn geweigerd.

      3 [Artikel D 9, tweede tot en met vierde lid][ref10], is van overeenkomstige toepassing.


