  - number: Z 12
    text: |-
      1 Wanneer bij of krachtens deze wet voorgeschreven verrichtingen op een zaterdag, zondag of algemeen erkende
      feestdag zouden vallen, treedt de eerstvolgende dag, geen zaterdag, zondag of algemeen erkende feestdag
      zijnde, daarvoor in de plaats. Deze bepaling is mede van toepassing op het tegelijk aftreden van de leden van
      vertegenwoordigende organen.

      2 Voor zover de bepaling van de tijd voor die verrichtingen aan het openbaar gezag is opgedragen, worden daarvoor
      geen zaterdagen, zondagen of algemeen erkende feestdagen aangewezen.

      3 Onder algemeen erkende feestdagen worden verstaan de in [artikel 3 van de Algemene termijnenwet][ref1] (*Stb.*
      1964, 314) als zodanig genoemde en de bij of krachtens dat artikel daarmee gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_12
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: Z 13
    text: De bij deze wet gevoegde tabel maakt deel uit van deze wet.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_13
  - number: Z 14
    text: |-
      De benoemdverklaring van plaatsvervangers in plaatsen welke openvallen in de Tweede en Eerste Kamer, in provinciale
      staten en in de gemeenteraden geschiedt, zolang deze organen nog niet volgens de bepalingen van deze wet zijn
      gekozen, op de wijze als vóór de inwerkingtreding van deze wet was bepaald.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_14
  - number: Z 15
    text: De Kieswet (*Stb.* 1951, 290) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_15
  - number: Z 16
    text: |-
      1 De bij de inwerkingtreding van deze wet bestaande indeling van Nederland in kieskringen voor de verkiezing van
      de leden van de Tweede Kamer blijft tot een bij koninklijk besluit te bepalen tijdstip van kracht, doch uiterlijk
      tot de dag waarop de Tweede Kamer na de eerste verkiezing na de inwerkingtreding van deze wet voor het eerst
      bijeenkomt.

      2 De bij de inwerkingtreding van deze wet bestaande indeling van een provincie in kieskringen voor de verkiezing
      van de leden van provinciale staten blijft van kracht, totdat provinciale staten met betrekking tot de indeling in
      kieskringen voor die verkiezingen een besluit hebben genomen, doch uiterlijk tot de dag waarop provinciale staten
      na de eerste verkiezing na de inwerkingtreding van deze wet voor het eerst bijeenkomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_16
  - number: Z 17
    text: |-
      In afwijking van de [artikelen F 1][ref1] en [C 4][ref2] vindt de kandidaatstelling voor de periodieke verkiezingen
      van de leden van de gemeenteraden in 1990 plaats op dinsdag 6 februari en treden de leden van de oude gemeenteraden
      af met ingang van dinsdag 1 mei.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelF_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: F_1
        hoofdstuk: F
