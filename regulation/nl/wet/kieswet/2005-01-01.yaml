  - number: I 8
    text: |-
      1 Indien beroep is ingesteld tegen een beschikking waarbij het hoofdstembureau een lijst ongeldig heeft verklaard
      of de naam van een kandidaat dan wel de aanduiding van een politieke groepering heeft geschrapt op grond van
      een of meer van de verzuimen, vermeld in [artikel I 2, eerste lid][ref1], zonder dat het hoofdstembureau tevoren
      overeenkomstig het in dat artikel bepaalde kennis heeft gegeven van het bestaan daarvan aan degene die de lijst
      heeft ingeleverd, kan deze het verzuim of de verzuimen alsnog herstellen ter secretarie van de Raad van State.
      [Artikel I 2, derde en vierde lid][ref2], is van overeenkomstige toepassing.

      2 Indien een verzuim overeenkomstig het eerste lid is hersteld, houdt de Afdeling bestuursrechtspraak van de Raad
      van State bij haar uitspraak daarmee rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
