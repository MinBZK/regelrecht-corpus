  - number: V 5
    text: |-
      De ongeldigheid van de stemming in één of meer stemdistricten of provincies of een onjuistheid in de vaststelling
      van de uitslag van de verkiezing staat niet in de weg aan de toelating van de leden, op wier verkiezing de
      ongeldigheid of onjuistheid geen invloed kan hebben gehad, en, in geval van ongeldigheid van de stemming, de nieuwe
      stemming geen invloed kan hebben.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_5
  - number: V 6
    text: |-
      1 Indien het orgaan waarvoor de benoeming is geschied, besluit tot niet-toelating van één of meer leden wegens de
      ongeldigheid van de stemming in één of meer stemdistricten of provincies geeft de voorzitter daarvan onverwijld
      kennis aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft een verkiezing van de
      leden van de Tweede of Eerste Kamer, aan gedeputeerde staten, indien het betreft een verkiezing van de leden van
      de staten van een provincie en aan burgemeester en wethouders, indien het betreft een verkiezing van de leden van
      de gemeenteraad.

      2 Uiterlijk op de dertigste dag nadat deze kennisgeving is ontvangen, vindt in de in het eerste lid bedoelde
      stemdistricten, onderscheidenlijk provincies, een nieuwe stemming plaats en wordt de uitslag van de verkiezing
      opnieuw vastgesteld. De dag van de stemming wordt, indien het betreft een verkiezing van de leden van de Tweede
      of Eerste Kamer, vastgesteld door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het betreft
      een verkiezing van de leden van de staten van een provincie, door gedeputeerde staten, en indien het betreft een
      verkiezing van de leden van de gemeenteraad, door burgemeester en wethouders.

      3 Bij deze vaststelling blijft degene die reeds als lid is toegelaten, gekozen verklaard, ook indien mocht blijken
      dat dit ten onrechte is geschied. Tegenover hem valt dan af de kandidaat die, indien de toegelatene niet gekozen
      was verklaard, gekozen zou zijn.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_6
  - number: V 7
    text: |-
      1 Aan de in [artikel V 6][ref1] bedoelde stemming zijn de kiezers bevoegd deel te nemen wier namen voorkomen
      in de afschriften, bedoeld in [artikel J 17 eerste lid][ref2], met uitzondering van degenen bij wier naam de
      aantekening "pas", "volmacht" of "brief" is geplaatst. Tevens zijn daartoe bevoegd de kiezers wier namen voorkomen
      op de ingeleverde kiezerspassen, volmachtbewijzen en briefstembewijzen, voor zover de genoemde bescheiden
      gebezigd zijn bij de ongeldig verklaarde stemming. Betreft het een stembureau als bedoeld in [artikel M 9][ref3],
      dan zijn daartoe bevoegd de kiezers wier namen voorkomen op de in [artikel M 4, vierde lid][ref4], bedoelde
      verzoekschriften.

      2 Personen ten aanzien van wie na de ongeldig verklaarde stemming blijkt, dat hun naam ten onrechte ontbreekt
      dan wel ten onrechte voorkomt in de afschriften, bedoeld in [artikel J 17][ref5], eerste lid, zijn bevoegd,
      onderscheidenlijk niet bevoegd, aan de in [artikel V 6][ref6] bedoelde stemming deel te nemen. De afschriften
      worden daartoe aangepast.

      3 Een voor de ongeldig verklaarde stemming verleende toestemming om bij volmacht te stemmen geldt niet voor de in
      het eerste lid bedoelde nieuwe stemming.


