      - id: ref3
        bwb_id: BWBR0004627
        artikel: P_1
        hoofdstuk: P
        paragraaf: '1'
        afdeling: II
  - number: Y 23
    text: |-
      Waar in de [artikelen O 4, tweede lid][ref1], en [O 5, eerste lid][ref2], sprake is van het orgaan waarvoor de
      verkiezing plaats heeft, onderscheidenlijk heeft plaats gehad, treedt daarvoor de Tweede Kamer in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_5
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_23
