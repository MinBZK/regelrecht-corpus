  - number: I 4
    text: |-
      Op de derde dag na de kandidaatstelling beslist het hoofdstembureau in een openbare zitting die om zestien uur
      aanvangt, over de geldigheid van de lijsten en over het handhaven van de daarop voorkomende kandidaten, alsmede
      over het handhaven van de daarboven geplaatste aanduiding van een politieke groepering.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_4
  - number: I 5
    text: |-
      Ongeldig is de lijst:

      a. die niet op de dag van de kandidaatstelling tussen negen en vijftien uur bij de voorzitter van het
      hoofdstembureau of het door deze aangewezen lid is ingeleverd;

      b. waarbij, indien ten behoeve van de lijst een waarborgsom moet worden betaald, niet gevoegd is het bewijs dat
      deze betaling is verricht;

      c. waarbij, indien bij de lijst verklaringen van ondersteuning moeten worden overgelegd, niet ten minste het aantal
      geldige verklaringen, genoemd in [artikel H 4, eerste lid][ref1], is overgelegd;

      d. die niet voldoet aan het bij ministeriële regeling vastgestelde model;

      e. die niet persoonlijk is ingeleverd door een kiezer, bevoegd tot deelneming aan de verkiezing;

      f. waarbij, voor zover vereist, niet is overgelegd de verklaring van burgemeester en wethouders dat de inleveraar
      als kiezer is geregistreerd in hun gemeente en bevoegd is aan de verkiezing deel te nemen;

      g. waarop door toepassing van [artikel I 6][ref2] alle kandidaten zijn geschrapt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_6
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_5
