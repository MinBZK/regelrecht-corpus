        paragraaf: '1'
        afdeling: II
  - number: Y 16
    text: |-
      Onmiddellijk nadat de lijsten door het centraal stembureau zijn onderzocht, worden deze en, indien vereist, de in
      [artikel H 4][ref1] bedoelde verklaringen van ondersteuning door de voorzitter op het Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties voor een ieder ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_16
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_4
        hoofdstuk: H
        afdeling: II
  - number: Y 17
    text: |-
      Het centraal stembureau schrapt van de lijst in de eerste plaats de naam van de kandidaat van wie de verklaring,
      bedoeld in [artikel Y 13, eerste lid][ref1], niet is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_13
        hoofdstuk: Y
        paragraaf: '2'
        afdeling: V
  - number: Y 18
    text: |-
      [Artikel I 9][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_18
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_9
        hoofdstuk: I
        paragraaf: '1'
        afdeling: II
  - number: Y 19
    text: |-
      1 Op de dag van de kandidaatstelling, tussen negen en zeventien uur, kunnen kandidatenlijsten van verschillende
      politieke groeperingen tot een lijstencombinatie worden verbonden door inlevering bij het centraal stembureau van
      een daartoe strekkende schriftelijke gemeenschappelijke verklaring van de op de lijsten vermelde gemachtigden. Bij
      ministeriële regeling wordt voor deze verklaring een model vastgesteld.

      2 Een lijst kan niet deel uitmaken van meer dan één lijstencombinatie. Heeft een gemachtigde meer dan één
      verklaring betreffende dezelfde lijst ondertekend, dan is zijn ondertekening onder alle verklaringen ongeldig.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_19
  - number: Y 22
    text: |-
      Voor de toepassing van [artikel N 12][ref1], [hoofdstuk O][ref2] en [artikel P 1][ref3] treden de hoofdstembureaus
      voor de verkiezing van de leden van de Tweede Kamer op als hoofdstembureaus voor de verkiezing van de leden van het
      Europees Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukO
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_22
