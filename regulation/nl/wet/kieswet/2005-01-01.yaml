  - number: I 3
    text: |-
      1 Onmiddellijk nadat de lijsten door het hoofdstembureau zijn onderzocht, worden deze en, indien vereist, de
      verklaringen van ondersteuning, door de voorzitter ter secretarie van de gemeente waar het hoofdstembureau is
      gevestigd, voor een ieder ter inzage gelegd.

      2 Op de voet van [artikel I 1, derde lid][ref1], toegezonden afschriften van ingeleverde kandidatenlijsten worden
      ter secretarie van de gemeente waar het hoofdstembureau is gevestigd ter inzage gelegd, zodra deze zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_3
