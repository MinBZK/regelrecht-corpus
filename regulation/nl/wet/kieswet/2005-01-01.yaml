  - number: I 10
    text: |-
      1 Op de dag van de kandidaatstelling, tussen negen en zeventien uur, kunnen kandidatenlijsten van verschillende
      politieke groeperingen tot een lijstencombinatie worden verbonden door inlevering bij het centraal stembureau van
      een daartoe strekkende schriftelijke gemeenschappelijke verklaring van de op de lijsten vermelde gemachtigden.

      2 Zodanige verbinding kan slechts worden aangebracht tussen politieke groeperingen waarvan de aanduiding ten
      behoeve van de desbetreffende verkiezing is geregistreerd.

      3 Indien het betreft de verkiezing van de leden van de Tweede Kamer of van provinciale staten van een provincie die
      uit meer dan één kieskring bestaat, kan een verbinding voorts slechts worden aangebracht indien

      a. de onderscheidene groeperingen in alle kieskringen een lijst hebben ingediend en

      b. de combinatie betrekking heeft op alle in de onderscheidene kieskringen vanwege een groepering ingediende
      lijsten.

      4 Het bepaalde in het tweede lid is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee
      of meer groeperingen, indien de aldus gevormde aanduiding voorkomt op alle vanwege die groeperingen ingediende
      lijsten.

      5 Bij ministeriële regeling wordt voor de in het eerste lid bedoelde verklaring een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_10
  - number: I 11
    text: |-
      Het centraal stembureau beslist over de geldigheid van de lijstencombinaties in de zitting, bedoeld in
      [artikel I 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_12
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_12
        hoofdstuk: I
        paragraaf: '3'
        afdeling: II
  - number: I 12
    text: |-
      Op de tweede dag na de kandidaatstelling nummert het centraal stembureau in een openbare zitting de
      kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_12
  - number: I 13
    text: |-
      Bij de nummering gelden de lijstengroepen alsmede de niet van een groep deel uitmakende stellen gelijkluidende
      lijsten als één lijst.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_13
  - number: I 14
    text: |-
      1 Eerst worden genummerd de lijsten van politieke groeperingen wier aanduiding was geplaatst boven een
      kandidatenlijst waaraan bij de laatstgehouden verkiezing van de leden van het desbetreffende vertegenwoordigend
      orgaan een of meer zetels zijn toegekend. Aan deze lijsten worden de nummers 1 en volgende toegekend in de volgorde
      van de bij die verkiezing op de desbetreffende lijsten uitgebrachte aantallen stemmen, met dien verstande dat aan
      de lijst van de groepering met het hoogste aantal stemmen het nummer 1 wordt toegekend. Bij gelijkheid van het
      aantal beslist het lot.

      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van samenvoeging van aanduidingen
      van twee of meer groeperingen, indien bij de laatstgehouden verkiezing van de leden van het desbetreffende
      vertegenwoordigende orgaan, hetzij aan de gezamenlijke groeperingen, hetzij aan ten minste één daarvan, één of meer
      zetels zijn toegekend. In het geval waarbij aan ten minste één van de betrokken groeperingen één of meer zetels
      zijn toegekend worden voor de toepassing van het bepaalde in de tweede volzin van het eerste lid, de op de lijsten
      uitgebrachte aantallen stemmen van de groeperingen waaraan die zetels zijn toegekend, bij elkaar opgeteld.

      3 Vervolgens worden, met de nummers volgende op het laatste krachtens het eerste lid toegekende nummer, genummerd
      de overige lijstengroepen en stellen gelijkluidende lijsten waarvan in alle kieskringen een lijst is ingeleverd, in
      de volgorde door het lot aangewezen.

      4 Daarna worden, met de nummers volgende op het laatste krachtens het tweede lid toegekende nummer, genummerd de
      overige lijstengroepen en stellen gelijkluidende lijsten in de volgorde van het aantal kieskringen waar een daartoe
      behorende lijst is ingeleverd, met dien verstande, dat het eerstvolgende nummer wordt toegekend aan de lijstengroep
      of het stel gelijkluidende lijsten waarvan een lijst is ingeleverd in de meeste kieskringen. Bij een gelijk aantal
      kieskringen beslist het lot.

      5 Ten slotte worden ten aanzien van iedere kieskring aan de op zichzelf staande lijsten bij loting toegekend de
      nummers die nog niet in enige kieskring aan een andere lijst zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_14
  - number: I 15
    text: |-
      1 Onmiddellijk nadat de nummering heeft plaatsgevonden, brengt de voorzitter van het centraal stembureau ter
      openbare kennis welk nummer aan de onderscheidene lijsten is toegekend.

      2 Indien het betreft de verkiezing van de leden van de Tweede Kamer, geschiedt de kennisgeving in de Nederlandse
      Staatscourant.

      3 Indien het betreft de verkiezing van de leden van provinciale staten of de gemeenteraad, geschiedt de
      kennisgeving op de in de provincie, onderscheidenlijk de gemeente, gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_15
  - number: I 16
    text: |-
      Een beslissing tot ongeldigverklaring van een kandidatenlijst heeft geen gevolg ten aanzien van de nummers,
      toegekend aan de overige kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_16
  - number: I 17
    text: |-
      1 Nadat van alle hoofdstembureaus de in [artikel I 9, eerste lid, eerste volzin][ref1], bedoelde mededeling
      is ontvangen, maakt de voorzitter van het centraal stembureau de lijsten zo spoedig mogelijk openbaar. Daarbij
      vermeldt hij tevens welke lijsten tot een lijstencombinatie zijn verbonden.

      2 De openbaarmaking geschiedt:

      indien het betreft de verkiezing van de leden van de Tweede Kamer, door plaatsing van de lijsten naar de
      kieskringen gerangschikt en met vermelding van hun nummers en, in voorkomend geval, de aanduidingen van de
      politieke groeperingen in de Nederlandse Staatscourant;

      indien het betreft de verkiezing van de leden van provinciale staten of de gemeenteraad, door de van de nummers en,
      in voorkomend geval, de aanduidingen van de politieke groeperingen voorziene lijsten ter secretarie van de gemeente
      waar het centraal stembureau is gevestigd, onderscheidenlijk ter secretarie van de gemeente, voor een ieder ter
      inzage te leggen. Van de terinzagelegging geschiedt tegelijk openbare kennisgeving door de voorzitter van het
      centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_9
        hoofdstuk: I
        paragraaf: '1'
        afdeling: II
  - number: I 18
    text: |-
      1 Van de in de [artikelen I 1][ref1], [I 4][ref2] en [I 12][ref3] bedoelde zittingen wordt proces-verbaal
      opgemaakt. Het proces-verbaal wordt voor een ieder ter inzage gelegd.

      2 De bij de in de [artikelen I 4][ref4] en [I 12][ref5] bedoelde zittingen aanwezige kiezers kunnen mondeling
      bezwaren inbrengen. Van deze bezwaren wordt in het proces-verbaal melding gemaakt.

      3 Bij algemene maatregel van bestuur worden geregeld:

      a. de plaats waar de processen-verbaal ter inzage worden gelegd;

      b. de bekendmaking van het tijdstip en de plaats van de zitting, bedoeld in [artikel I 4][ref6]
      onderscheidenlijk[ I 12][ref7].

      4 Bij ministeriële regeling worden voor de processen-verbaal modellen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
