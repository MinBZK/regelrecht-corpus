  - number: H 11
    text: |-
      1 Kandidatenlijsten, ingeleverd in verschillende kieskringen, waarop dezelfde kandidaten in gelijk aantal en in
      dezelfde volgorde zijn geplaatst, vormen te zamen een stel gelijkluidende lijsten.

      2 Kandidatenlijsten, ingeleverd in verschillende kieskringen, waarboven dezelfde aanduiding van een politieke
      groepering is geplaatst of waarvan de eerste kandidaat dezelfde is, vormen te zamen een lijstengroep. Het
      bepaalde in de vorige volzin is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer
      groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_11
  - number: H 12
    text: |-
      1 Indien het betreft de verkiezing van de leden van de Tweede Kamer, moet voor elke lijstengroep, elk niet van een
      groep deel uitmakend stel gelijkluidende lijsten en elke op zichzelf staande lijst een waarborgsom van € 11. 250
      worden betaald aan het Rijk.

      2 De in het eerste lid bedoelde verplichting tot betaling geldt niet voor een kandidatenlijst van een politieke
      groepering, indien de aanduiding daarvan was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van de Tweede Kamer een of meer zetels zijn toegekend. Het bepaalde in de vorige volzin
      is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de
      laatstgehouden verkiezing van de leden van de Tweede Kamer, hetzij aan de gezamenlijke groeperingen, hetzij aan ten
      minste één daarvan, één of meer zetels zijn toegekend.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt voor elke kieskring een bewijs
      daarvan. Dit bewijs moet bij de indiening van de lijst worden ingeleverd.

      4 Indien geen lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door het Rijk de
      waarborgsom teruggegeven aan degene die de betaling heeft verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijstengroep, het niet van een
      groep deel uitmakende stel gelijkluidende lijsten of de op zichzelf staande lijst lager is dan 75 procent van de
      kiesdeler, bedoeld in [artikel P 5][ref1]. In dat geval vervalt de waarborgsom aan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_5
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_12
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_5
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: H 13
    text: |-
      1 Indien het betreft de verkiezing van de leden van provinciale staten, moet voor elke lijstengroep, elk niet van
      een groep deel uitmakend stel gelijkluidende lijsten en elke op zichzelf staande lijst een waarborgsom van € 1 125
      worden betaald aan de gemeente waar het centraal stembureau is gevestigd.

      2 De in het eerste lid bedoelde verplichting tot betaling geldt niet voor een kandidatenlijst van een politieke
      groepering, indien de aanduiding daarvan was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van provinciale staten een of meer zetels zijn toegekend. Het bepaalde in de vorige volzin
      is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de
      laatstgehouden verkiezing van de leden van provinciale staten, hetzij aan de gezamenlijke groeperingen, hetzij aan
      ten minste één daarvan, één of meer zetels zijn toegekend.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt voor elke kieskring een bewijs
      daarvan. Dit bewijs moet bij de indiening van de lijst worden ingeleverd.

      4 Indien geen lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door de gemeente
      waar het centraal stembureau is gevestigd de waarborgsom teruggegeven aan degene die de betaling heeft verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijstengroep, het niet van
      een groep deel uitmakende stel gelijkluidende lijsten of de op zichzelf staande lijst lager is dan 75 procent van
      de kiesdeler, bedoeld in [artikel P 5][ref1], en aan de lijst geen zetel is toegewezen. In dat geval vervalt de
      waarborgsom aan de gemeente waar het centraal stembureau is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_5
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_13
