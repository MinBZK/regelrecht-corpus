  - number: S 2
    text: |-
      1 Uiterlijk op de tiende dag na de kandidaatstelling beslist het centraal stembureau in een openbare zitting over
      de geldigheid van de lijsten en over het handhaven van de daarop voorkomende kandidaten, alsmede over het handhaven
      van de daarboven geplaatste aanduiding van een politieke groepering.

      2 De voorzitter van het centraal stembureau kondigt vooraf dag en uur van de zitting in de *Nederlandse
      Staatscourant* aan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelS_2
  - number: S 3
    text: |-
      Ongeldig is de lijst:

      a. die niet op de dag van de kandidaatstelling tussen negen en zeventien uur bij de commissaris van de Koning of
      het daartoe aangewezen lid van gedeputeerde staten door persoonlijke overhandiging is ingeleverd;

      b. die niet overeenkomstig het bepaalde in [artikel R 2][ref1] is ondertekend;

      c. die niet voldoet aan het bij ministeriële regeling vastgestelde model;

      d. waarop door toepassing van [artikel S 4][ref2] alle kandidaten zijn geschrapt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_4
