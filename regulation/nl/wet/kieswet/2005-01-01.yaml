        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: P_13
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 17
    text: |-
      De zetels, toegewezen aan de al dan niet van een lijstengroep deel uitmakende lijsten of stellen gelijkluidende
      lijsten, die na toepassing van de [artikelen P 15][ref1] en [P 16][ref2] nog niet aan een kandidaat zijn
      toegewezen, worden aan de nog niet gekozen kandidaten van de desbetreffende lijsten of stellen gelijkluidende
      lijsten toegewezen in de volgorde van de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_16
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_17
