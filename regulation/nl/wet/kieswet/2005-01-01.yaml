  - number: Y 24
    text: |-
      Bij algemene maatregel van bestuur kunnen voor zover nodig voorschriften worden gegeven die afwijken van krachtens
      [afdeling II][ref1] bij algemene maatregel van bestuur gestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#AfdelingII
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_24
    references:
      - id: ref1
        bwb_id: BWBR0004627
        afdeling: II
  - number: Y 25
    text: |-
      1 De Tweede Kamer onderzoekt zo spoedig mogelijk of de benoemde op grond van de nationale bepalingen als lid van
      het Europees Parlement kan worden toegelaten.

      2 De [artikelen V 1 tot en met V 10][ref1] zijn daarbij van overeenkomstige toepassing, met dien verstande dat
      waar in deze artikelen sprake is van het vertegenwoordigend orgaan of het orgaan waarvoor de benoeming is geschied,
      daarvoor de Tweede Kamer in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_25
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: V_1
        hoofdstuk: V
        paragraaf: '1'
        afdeling: IV
  - number: Y 26
    text: |-
      De voorzitter van de Tweede Kamer geeft van de uitkomst van het onderzoek onverwijld kennis aan de voorzitter van
      het Europees Parlement en aan de benoemde. Indien de Tweede Kamer heeft besloten dat de benoemde op grond van de
      nationale bepalingen als lid van het Europees Parlement kan worden toegelaten, zendt de voorzitter van de Tweede
      Kamer aan de voorzitter van het Europees Parlement tevens de geloofsbrief van de benoemde toe.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_26
  - number: Y 27
    text: |-
      Wanneer, anders dan bij de vaststelling van de uitslag van een verkiezing, in een opengevallen plaats moet worden
      voorzien, geschiedt dit met overeenkomstige toepassing van [hoofdstuk W][ref1], met dien verstande dat voor de
      toepassing van [artikel W 1, derde lid][ref2], voor «25% van de kiesdeler» wordt gelezen: 10% van de kiesdeler.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukW
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_27
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: W
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0004627
        artikel: W_1
        hoofdstuk: W
        afdeling: IV
  - number: Y 28
    text: |-
      Zodra onherroepelijk is komen vast te staan dat een lid van het Europees Parlement een van de in
      [artikel Y 4][ref1] bedoelde vereisten voor het lidmaatschap niet bezit of een ingevolge de nationale bepalingen
      met het lidmaatschap onverenigbare betrekking vervult, houdt hij op lid te zijn. De voorzitter van de Tweede Kamer
      geeft hiervan onverwijld kennis aan de voorzitter van het Europees Parlement en aan de voorzitter van het centraal
      stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_28
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_4
        hoofdstuk: Y
        paragraaf: '2'
        afdeling: V
  - number: Y 29
    text: |-
      1 Wanneer een lid van het Europees Parlement komt te verkeren in een van de gevallen, genoemd in
      [artikel Y 28][ref1], geeft hij hiervan kennis aan de voorzitter van de Tweede Kamer, met vermelding van de reden.

      2 Indien de kennisgeving niet is gedaan en de voorzitter van de Tweede Kamer van oordeel is dat een lid van
      het Europees Parlement verkeert in een van de gevallen, genoemd in [artikel Y 28][ref2], waarschuwt hij de
      belanghebbende schriftelijk.

      3 Het staat deze vrij de zaak uiterlijk op de achtste dag na de dagtekening van de in het tweede lid bedoelde
      waarschuwing aan het oordeel van de Tweede Kamer te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_28
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_28
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_29
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_28
        hoofdstuk: Y
        paragraaf: '3'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0004627
        artikel: Y_28
        hoofdstuk: Y
        paragraaf: '3'
        afdeling: V
  - number: Y 30
    text: |-
      Indien de voorzitter van de Tweede Kamer een bericht ontvangt van de voorzitter van het Europees Parlement dat het
      lidmaatschap van een lid van het Europees Parlement is beëindigd wegens ontslag, overlijden of het vervullen van
      een ingevolge de Akte onverenigbare functie, geeft hij hiervan onverwijld kennis aan de voorzitter van het centraal
      stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_30
  - number: Y 31
    text: |-
      De kiesgerechtigde niet-Nederlander die onderdaan is van een andere lid-staat van de Europese Unie die zijn
      werkelijke woonplaats in Nederland heeft, neemt aan de verkiezing deel hetzij in Nederland, hetzij in de lid-staat
      waarvan hij onderdaan is.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_31
  - number: Y 32
    text: |-
      1 Burgemeester en wethouders registreren de kiesgerechtigdheid van de in [artikel Y 3, onder b][ref1], bedoelde
      personen die ingezetene zijn van de gemeente in de gemeentelijke administratie, indien zij daartoe een schriftelijk
      verzoek hebben ingediend.

      2 Bij het verzoek vermeldt verzoeker zijn adres van verblijf en, voor zover van toepassing, de plaats in de lid-
      staat waarvan hij onderdaan is, waar hij het laatst als kiezer was geregistreerd. Bij het verzoek legt verzoeker
      een kopie over van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2]. Voorts
      verklaart hij dat hij in de lid-staat waarvan hij onderdaan is, niet van het kiesrecht is uitgesloten en dat hij
      het kiesrecht uitsluitend in Nederland zal uitoefenen.

      3 Verzoeken die worden ingediend na de dag van de kandidaatstelling blijven voor de daaropvolgende verkiezing
      buiten beschouwing.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer het formulier voor het verzoek, kosteloos,
      voor de kiezers verkrijgbaar is. Van het formulier maken de verklaringen, bedoeld in het tweede lid, deel uit. Bij
      ministeriële regeling wordt voor het formulier een model vastgesteld.

      5 Burgemeester en wethouders zenden aan de niet-Nederlander, die de nationaliteit van een andere lid-staat van
      de Europese Unie heeft, en die zich van buiten Nederland vestigt in de gemeente, een formulier toe waarmee hij
      registratie van zijn kiesgerechtigdheid kan verzoeken.

      6 Burgemeester en wethouders beslissen op het verzoek uiterlijk op de zevende dag nadat zij het verzoek hebben
      ontvangen en maken de beslissing onverwijld aan de verzoeker bekend.

      7 Indien burgemeester en wethouders van een andere lid-staat bericht hebben ontvangen dat een niet-Nederlander die
      onderdaan is van die lid-staat aldaar van het kiesrecht is uitgesloten, registreren zij de kiesgerechtigdheid van
      betrokkene niet.

      8 Nadat het verzoek om registratie is ingewilligd, delen burgemeester en wethouders aan de door de desbetreffende
      lid-staat aangewezen autoriteit mede, dat betrokkene in Nederland als kiezer is geregistreerd. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze en het tijdstip waarop deze
      mededeling dient te geschieden.

      9 Ten minste zes weken voor de kandidaatstelling brengt de burgemeester de mogelijkheid van registratie voor niet-
      Nederlanders die onderdanen zijn van andere lid-staten ter openbare kennis.

      10 [Artikel D 9][ref3] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_3
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_32
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_3
        hoofdstuk: Y
        paragraaf: '2'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0004627
        artikel: D_9
        hoofdstuk: D
        afdeling: II
  - number: Y 33
    text: |-
      1 De kiesgerechtigdheid van de niet-Nederlander die onderdaan is van een andere lidstaat blijft geregistreerd
      zolang betrokkene ingezetene is van een Nederlandse gemeente of totdat de registratie van de kiesgerechtigdheid van
      betrokkene is geschrapt.

      2 Burgemeester en wethouders schrappen de registratie van de kiesgerechtigdheid van de als kiezer geregistreerde
      niet-Nederlander die onderdaan is van een andere lid-staat in de gemeentelijke administratie:

      a. op verzoek van betrokkene;

      b. indien aan hen omstandigheden bekend worden op grond waarvan de desbetreffende persoon niet als kiezer behoort
      te zijn geregistreerd.

      3 Burgemeester en wethouders doen van een schrapping van de registratie van de kiesgerechtigdheid onverwijld
      mededeling aan betrokkene en aan de door de desbetreffende lid-staat aangewezen autoriteit waarvan betrokkene
      onderdaan is.

      4 [Artikel D 9][ref1] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_33
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_9
        hoofdstuk: D
        afdeling: II
  - number: Y 33a
    text: |-
      Burgemeester en wethouders schrappen de registratie van de kiesgerechtigdheid als bedoeld in
      [artikel Y 32, eerste lid][ref1], indien betrokkene het Nederlanderschap verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_32
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_33a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_32
        hoofdstuk: Y
        paragraaf: '4'
        afdeling: V
  - number: Y 34
    text: |-
      In de in [artikel H 1][ref1] bedoelde openbare kennisgeving wordt tevens melding gemaakt van de mogelijkheid van
      kandidaatstelling niet-Nederlanders die onderdanen zijn van andere lid-staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_34
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_1
        hoofdstuk: H
        afdeling: II
  - number: Y 35
    text: |-
      1 De kandidaat die onderdaan is van een andere lid-staat en niet tevens de Nederlandse nationaliteit heeft,
      vermeldt op de in [artikel Y 13][ref1] bedoelde verklaring tevens zijn nationaliteit en de plaats in die lid-staat
      waar hij het laatst als kiezer was ingeschreven.

      2 Bij de lijst wordt van iedere daarop voorkomende kandidaat die onderdaan is van een andere lid-staat en niet
      tevens de Nederlandse nationaliteit heeft een schriftelijke verklaring van de daartoe bevoegde autoriteiten uit die
      lid-staat overgelegd dat hij, voor zover de autoriteiten bekend is, in die lid-staat niet is uitgesloten van het
      recht om te worden gekozen.

      3 In aanvulling op [artikel I 2, eerste lid][ref2], wordt het ontbreken van de verklaring, bedoeld in het tweede
      lid, tevens als verzuim aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_35
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_13
        hoofdstuk: Y
        paragraaf: '2'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0004627
        artikel: I_2
        hoofdstuk: I
        paragraaf: '1'
        afdeling: II
  - number: Y 35a
    text: |-
      Het centraal stembureau schrapt van de lijst de kandidaat van wie de verklaring, bedoeld in
      [artikel Y 35, tweede lid][ref1], niet is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_35a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_35
        hoofdstuk: Y
        paragraaf: '4'
        afdeling: V
  - number: Y 36
    text: |-
      Het centraal stembureau stelt door tussenkomst van Onze Minister van Buitenlandse Zaken de andere lid-staten in
      kennis van de namen van hun onderdanen, die niet tevens de Nederlandse nationaliteit hebben en die op de geldige
      kandidatenlijsten voorkomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_36
  - number: Y 38
    text: |-
      Een Nederlander die werkelijke woonplaats heeft in een andere lid-staat, kan ten behoeve van de kandidaatstelling
      in die lid-staat Onze Minister van Justitie verzoeken hem een verklaring te verstrekken, inhoudende dat hij in
      Nederland niet is uitgesloten van het recht om gekozen te worden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_38
  - number: Y 39
    text: |-
      Bij ministeriële regeling kunnen krachtens de [afdelingen II][ref1] en [IV][ref2] vastgestelde modellen die
      ingevolge bepalingen van deze afdeling van overeenkomstige toepassing worden verklaard voor de verkiezing van de
      leden van het Europees Parlement, voor deze verkiezing nader worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#AfdelingII
      [ref2]: https://wetten.overheid.nl/BWBR0004627#AfdelingIV
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_39
    references:
      - id: ref1
        bwb_id: BWBR0004627
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        afdeling: IV
  - number: Z 1
    text: |-
      Degene die stembiljetten, kiezerspassen, volmachtbewijzen of briefstembewijzen namaakt of vervalst met het oogmerk
      deze als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_1
  - number: Z 2
    text: |-
      Degene die opzettelijk als echt en onvervalst gebruikt of door anderen doet gebruiken stembiljetten, kiezerspassen,
      volmachtbewijzen of briefstembewijzen, die hij zelf heeft nagemaakt of vervalst of waarvan de valsheid of
      vervalsing hem, toen hij ze ontving, bekend was, of deze, met het oogmerk om ze als echt en onvervalst te gebruiken
      of door anderen te doen gebruiken, in voorraad heeft, wordt gestraft met gevangenisstraf van ten hoogste zes jaren
      of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_2
  - number: Z 3
    text: |-
      Degene die stembiljetten, kiezerspassen, volmachtbewijzen of briefstembewijzen voorhanden heeft met het oogmerk
      deze wederrechtelijk te gebruiken of door anderen te doen gebruiken, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_3
  - number: Z 4
    text: |-
      1 Degene die bij een verkiezing door gift of belofte een kiezer omkoopt om volmacht te geven tot het uitbrengen van
      zijn stem, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Degene die bij een verkiezing door gift of belofte een kiezer omkoopt dan wel anderszins daartoe dwingt om een
      verklaring als bedoeld in [artikel H 4, eerste lid][ref1], af te leggen ter ondersteuning van een lijst, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      3 Met dezelfde straf wordt gestraft de kiezer die zich door gift of belofte tot het bij volmacht stemmen of het
      afleggen van een ondersteuningsverklaring laat omkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_4
        hoofdstuk: H
        afdeling: II
  - number: Z 5
    text: |-
      1 Bij veroordeling wegens een van de in de [artikelen Z 1 tot en met Z 4][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°, van het Wetboek van Strafrecht][ref2] vermelde
      rechten worden uitgesproken.

      2 Bij veroordeling tot een vrijheidsstraf van ten minste een jaar wegens een van de in
      de [artikelen Z 1 tot en met Z 3][ref3] omschreven misdrijven, kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref4] vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelZ_1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
