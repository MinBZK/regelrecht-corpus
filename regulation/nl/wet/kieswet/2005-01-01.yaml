      - id: ref2
        bwb_id: BWBR0004627
        artikel: C_4
        hoofdstuk: C
        afdeling: II
  - number: Z 18
    text: |-
      De registers, door de Kiesraad en door de centrale stembureaus voor de verkiezing van de leden
      van provinciale staten bijgehouden ingevolge [artikel G 1, eerste lid][ref1], onderscheidenlijk
      [artikel G 2, eerste lid, van de Kieswet][ref2] (*Stb.* 1951, 290), zoals deze luiden op het
      tijdstip van inwerkingtreding van deze wet, vervallen met ingang van dat tijdstip. In het ingevolge
      [artikel G 1, eerste lid][ref3], van deze wet door het centraal stembureau voor de verkiezing van de leden van de
      Tweede Kamer bij te houden register schrijft het centraal stembureau ambtshalve als aanduiding in, naar keuze van
      de desbetreffende groeperingen, de naam of de aanduiding dan wel, mits niet meer dan 35 letters of andere tekens
      omvattende, de naam en de aanduiding van de politieke groeperingen, wier naam of aanduiding was geplaatst boven een
      kandidatenlijst waaraan bij de laatstgehouden verkiezing van de leden van de Tweede Kamer een of meer zetels zijn
      toegekend. Deze namen of aanduidingen worden in het register ingeschreven, zoals en in de volgorde waarin deze tot
      dat tijdstip in het register waren opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_18
    references:
