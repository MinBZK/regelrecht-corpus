  - number: Z 19
    text: |-
      Bij de eerste verkiezing van de leden van de Eerste Kamer na de inwerkingtreding van deze wet wordt:

      a. bij de toepassing van [artikel R 4, tweede lid, tweede volzin][ref1], in plaats van "dezelfde lijst van een
      politieke groepering wier aanduiding was geplaatst boven een kandidatenlijst waaraan" gelezen: dezelfde lijst van
      een politieke groepering aan wier kandidatenlijsten.

      b. bij de toepassing van [artikel S 12, eerste lid, eerste volzin][ref2], in plaats van "de lijsten van politieke
      groeperingen wier aanduiding was geplaatst boven een kandidatenlijst waaraan" gelezen: de lijsten van politieke
      groeperingen aan wier kandidatenlijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_12
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_19
