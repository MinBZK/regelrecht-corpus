  - number: D 3a
    text: |-
      1 Burgemeester en wethouders van 's-Gravenhage houden een bestand bij van personen aan wie voor elke verkiezing van
      de leden van de Tweede Kamer zonder een afzonderlijk daartoe strekkend verzoek een formulier tot registratie van de
      kiesgerechtigdheid wordt toegezonden.

      2 Opname in het bestand geschiedt op verzoek van de desbetreffende persoon of na een verzoek tot registratie van de
      kiesgerechtigdheid voor de verkiezing van de leden van de Tweede Kamer, ongeacht of dat verzoek is ingewilligd.

      3 Burgemeester en wethouders van 's-Gravenhage verwijderen uit het bestand de geregistreerde gegevens, wanneer:

      a. de geregistreerde daarom verzoekt;

      b. er geen verzoek tot registratie is ingediend voor de laatstgehouden verkiezing van de leden van de Tweede Kamer.

      4 Bij algemene maatregel van bestuur wordt vastgesteld welke gegevens in het bestand geregistreerd worden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_3a
  - number: D 4
    text: |-
      Burgemeester en wethouders delen aan een ieder op zijn verzoek onverwijld mede of hij als kiezer is geregistreerd.
      Indien de verzoeker niet als kiezer is geregistreerd, worden hem uiterlijk op de zevende dag na de ontvangst van
      het verzoek de redenen daarvan meegedeeld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_4
  - number: D 5
    text: |-
      1 Een ieder kan schriftelijk aan burgemeester en wethouders om herziening van de registratie verzoeken op de grond
      dat hij niet of niet op de juiste wijze als kiezer is geregistreerd.

      2 Het verzoekschrift dient gemotiveerd te zijn.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_5
  - number: D 6
    text: |-
      Burgemeester en wethouders beslissen op het verzoek om herziening uiterlijk op de zevende dag na de ontvangst en
      brengen zo nodig de gemeentelijke administratie hiermee in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_6
  - number: D 7
    text: Burgemeester en wethouders maken hun beslissing onverwijld aan de verzoeker bekend.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_7
  - number: D 8
    text: |-
      Burgemeester en wethouders van 's-Gravenhage verwijderen de naam van een persoon die ingevolge
      [artikel D 3, eerste lid][ref1], als kiezer is geregistreerd, uit de registratie, indien aan hen omstandigheden
      bekend worden op grond waarvan de desbetreffende persoon niet als kiezer behoort te zijn geregistreerd. Zij maken
      de verwijdering onverwijld aan hem bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
