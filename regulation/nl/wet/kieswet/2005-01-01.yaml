  - number: P 18a
    text: |-
      Indien een gekozen kandidaat is overleden, wordt deze bij de toepassing van deze paragraaf buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_18a
  - number: P 19
    text: |-
      1 Het centraal stembureau rangschikt ten aanzien van iedere lijst of ieder stel gelijkluidende lijsten de daarop
      voorkomende kandidaten zodanig, dat bovenaan komen te staan de kandidaten aan wie een zetel is toegewezen met
      toepassing van [artikel P 15][ref1], in de volgorde waarin de zetels zijn toegewezen.

      2 Vervolgens worden, in de volgorde van de aantallen op hen uitgebrachte stemmen, gerangschikt de op de lijst of
      het stel gelijkluidende lijsten voorkomende kandidaten die op de gezamenlijke lijsten waarop zij voorkomen een
      aantal stemmen hebben verkregen, groter dan 25% van de kiesdeler onderscheidenlijk groter dan de helft van de
      kiesdeler, doch die niet met toepassing van [artikel P 15, eerste onderscheidenlijk tweede lid][ref2], zijn gekozen
      verklaard. Indien aantallen gelijk zijn, beslist de volgorde van de lijst.

      3 Tenslotte worden, in de volgorde van de lijst, gerangschikt de overige op de lijst of het stel gelijkluidende
      lijsten voorkomende kandidaten.

      4 Bij de rangschikking blijft [artikel P 18][ref3] buiten toepassing.

      5 Behoudens ten aanzien van de verkiezing van de leden van de gemeenteraden met negen of elf leden, blijft de
      rangschikking achterwege, voor zover het lijsten of stellen gelijkluidende lijsten betreft waarop geen kandidaten
      gekozen zijn verklaard en die niet deel uitmaken van een lijstencombinatie of lijstengroep waaraan één of meer
      zetels zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_18
