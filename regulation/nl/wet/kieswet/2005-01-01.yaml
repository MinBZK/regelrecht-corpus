        paragraaf: '2'
        afdeling: II
  - number: M 15
    text: |-
      De kiezer die bij een diplomatieke of consulaire vertegenwoordiging van Nederland in het buitenland of bij
      de Vertegenwoordiging van Nederland in de Nederlandse Antillen of in Aruba per brief stemt, ontvangt van de
      burgemeester van 's-Gravenhage een retourenveloppe, geadresseerd aan de voorzitter van het daar gevestigde
      briefstembureau. Hij zendt de retourenveloppe, na de in [artikel M 7][ref1] bedoelde handelingen te hebben
      verricht, naar deze voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_15
