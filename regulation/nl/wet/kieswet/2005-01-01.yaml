  - number: S 4
    text: |-
      1 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, van de lijst de naam van de kandidaat:

      a. die niet is vermeld overeenkomstig het bepaalde krachtens [artikel R 6][ref1];

      b. van wie niet is overgelegd de verklaring dat hij instemt met zijn kandidaatstelling op de lijst;

      c. wiens woonplaats buiten Nederland is gelegen, indien de aanwijzing van een gemachtigde ontbreekt;

      d. die voorkomt op meer dan één van de in eenzelfde provincie ingeleverde lijsten;

      e. van wie een uittreksel uit het register van overlijden dan wel een afschrift van de akte van overlijden is
      overgelegd;

      f. die op de lijst voorkomt na het ten hoogste toegelaten aantal.

      2 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, de aanduiding van een politieke
      groepering, indien:

      a. een daarop betrekking hebbende verklaring als bedoeld in [artikel R 7][ref2] ontbreekt;

      b. de aanduiding geplaatst is boven meer dan één van de door verschillende politieke groeperingen bij het centraal
      stembureau ingeleverde lijsten.

      3 Indien de aanduiding van een politieke groepering niet in overeenstemming is met die waaronder zij is
      geregistreerd, brengt het centraal stembureau deze ambtshalve daarmee in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_7
