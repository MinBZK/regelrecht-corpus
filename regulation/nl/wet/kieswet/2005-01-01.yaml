        artikel: M_7
        hoofdstuk: M
        paragraaf: '1'
        afdeling: II
  - number: M 16
    text: |-
      1 De in [artikel M 8, eerste tot en met derde lid][ref1], aan de burgemeester opgedragen taken worden verricht door
      het hoofd van de diplomatieke of consulaire vertegenwoordiging van Nederland in het desbetreffende land danwel door
      de vertegenwoordiger van Nederland in de Nederlandse Antillen of in Aruba.

      2 Indien een tijdsverschil met Nederland bestaat, gelden de in [artikel M 8, eerste en tweede lid][ref2], genoemde
      tijdstippen naar plaatselijke tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_8
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_16
