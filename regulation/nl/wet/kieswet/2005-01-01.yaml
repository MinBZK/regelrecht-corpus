        paragraaf: '1'
        afdeling: II
  - number: M 11
    text: |-
      1 Indien de retourenveloppe niet zowel een geldig briefstembewijs als een stembiljet, onderscheidenlijk de
      in [artikel M 6, eerste lid, onder d][ref1], bedoelde enveloppe met stembiljet, bevat, dan wel de op het
      briefstembewijs gestelde verklaring van de kiezer dat hij het stembiljet persoonlijk heeft ingevuld, niet door
      deze is ondertekend, voegt de voorzitter de aangetroffen bescheiden, zonder het stembiljet in te zien dan wel
      zonder de enveloppe met het stembiljet te openen, wederom in de retourenveloppe en legt hij deze, na haar te hebben
      verzegeld, terzijde.

      2 Indien in een retourenveloppe twee of meer stembiljetten, onderscheidenlijk enveloppen met stembiljet, zijn
      gevoegd, doet de voorzitter alle stembiljetten, onderscheidenlijk enveloppen met stembiljet en briefstembewijzen,
      zonder de stembiljetten in te zien dan wel de enveloppen met stembiljet te openen, wederom in de retourenveloppe en
      legt hij deze, na haar te hebben verzegeld, terzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_11
