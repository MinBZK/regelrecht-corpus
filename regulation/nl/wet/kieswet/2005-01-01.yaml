preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen inzake het kiesrecht en de
    verkiezingen van de leden van de Tweede Kamer en de Eerste Kamer der Staten-Generaal, alsmede van de leden van
    provinciale staten en de gemeenteraden, vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelAanhef
articles:
  - number: A 1
    text: Er is een Kiesraad, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelA_1
  - number: A 2
    text: |-
      1 De Kiesraad heeft tot taak de regering en de beide kamers der Staten-Generaal van advies te dienen in
      uitvoeringstechnische aangelegenheden die het kiesrecht of de verkiezingen betreffen.

      2 De Kiesraad treedt voorts op als centraal stembureau in de gevallen waarin de wet dat voorschrijft.

      3 De Kiesraad bestaat uit zeven leden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelA_2
  - number: B 1
    text: |-
      1 De leden van de Tweede Kamer der Staten-Generaal worden gekozen door degenen die op de dag van de
      kandidaatstelling Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt, met
      uitzondering van degenen die op de dag van de kandidaatstelling hun werkelijke woonplaats hebben in de Nederlandse
      Antillen of Aruba.

      2 Deze uitzondering geldt niet voor:

      a. de Nederlander die gedurende ten minste tien jaren ingezetene van Nederland is geweest;

      b. de Nederlander die in Nederlandse openbare dienst in de Nederlandse Antillen of Aruba werkzaam is, alsmede
      zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_1
  - number: B 2
    text: |-
      De leden van provinciale staten worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van de provincie, mits zij Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_2
  - number: B 3
    text: |-
      1 De leden van de gemeenteraden worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen zijn
      van de gemeente en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt.

      2 Zij die geen onderdaan van een lidstaat van de Europese Unie zijn, dienen om kiesgerechtigd te zijn op de dag van
      de kandidaatstelling tevens te voldoen aan de vereisten dat:

      a. zij rechtmatig in Nederland verblijven op grond van
      [artikel 8, onder a, b, d, e of l, van de Vreemdelingenwet 2000][ref1] of op grond van een overeenkomst tussen een
      internationale organisatie en de Staat der Nederlanden inzake de zetel van deze organisatie in Nederland, en

      b. zij onmiddellijk voorafgaand aan de dag van de kandidaatstelling gedurende een onafgebroken periode van ten
      minste vijf jaren ingezetene van Nederland waren en beschikten over een verblijfsrecht als bedoeld onder a, dan wel
      rechtmatig in Nederland verbleven op grond van [artikel 8, onder c, van de Vreemdelingenwet 2000][ref2].

      3 Niet kiesgerechtigd zijn zij die geen Nederlander zijn en, als door andere staten uitgezonden leden van
      diplomatieke of consulaire vertegenwoordigingen, in Nederland werkzaam zijn, alsmede hun niet-Nederlandse
      echtgenoten, geregistreerde partners of levensgezellen en kinderen, voor zover dezen met hen een gemeenschappelijke
      huishouding voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_3
