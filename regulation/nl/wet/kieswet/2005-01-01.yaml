  - number: V 11
    text: |-
      Het lidmaatschap van een tot lid van een vertegenwoordigend orgaan benoemde vangt aan zodra zijn toelating
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_11
  - number: V 12
    text: |-
      De beslissing betreffende de toelating van de tot lid van provinciale staten onderscheidenlijk van de gemeenteraad
      benoemden wordt onverwijld genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_12
  - number: V 13
    text: |-
      1 Elke beslissing betreffende de toelating van de tot lid van provinciale staten, onderscheidenlijk de
      gemeenteraad, benoemden, wordt door gedeputeerde staten, onderscheidenlijk burgemeester en wethouders, terstond aan
      de benoemde bekendgemaakt.

      2 Aan de niet-toegelatene worden de redenen van de beslissing meegedeeld.

      3 Het eerste lid is van overeenkomstige toepassing, indien door provinciale staten, onderscheidenlijk de
      gemeenteraad, wegens herhaalde staking van stemmen of wegens staking van stemmen in een voltallige vergadering over
      een voorstel omtrent toelating geen beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_13
  - number: V 15
    text: |-
      1 Indien op het tijdstip van periodieke aftreding van de leden van provinciale staten, onderscheidenlijk van de
      gemeenteraad, niet de goedkeuring van de geloofsbrieven van meer dan de helft van het wettelijk voorgeschreven
      aantal leden onherroepelijk is geworden, houden de leden van provinciale staten, onderscheidenlijk van de
      gemeenteraad, zitting, totdat zulks is geschied. Gedurende deze tijd oefenen de bij de verkiezing gekozen leden hun
      functie niet uit.

      2 Een plaats die openvalt na het tijdstip van periodieke aftreding, wordt vervuld op dezelfde wijze, als zou zijn
      geschied, indien zij voor dat tijdstip zou zijn opengevallen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_15
  - number: W 1
    text: |-
      1 Wanneer, anders dan bij de vaststelling van de uitslag van een verkiezing, in een opengevallen plaats moet worden
      voorzien, verklaart de voorzitter van het centraal stembureau bij een met redenen omkleed besluit, uiterlijk op
      de veertiende dag nadat dit te zijner kennis is gekomen, benoemd de daarvoor in aanmerking komende kandidaat die
      in de volgorde, bedoeld in [artikel P 19][ref1], het hoogst is geplaatst op de lijst waarop degene die moet worden
      vervangen, is gekozen. Indien het lid in wiens plaats moet worden voorzien, ontslag heeft genomen met ingang van
      een bepaald tijdstip, vangt de termijn, bedoeld in de eerste volzin, aan op dat tijdstip.

      2 Indien een plaats openvalt die door toepassing van [artikel P 16, tweede lid][ref2], was vervuld, verklaart de
      voorzitter van het centraal stembureau, in afwijking van het eerste lid, benoemd de daarvoor in aanmerking komende
      kandidaat op de lijst waaraan ingevolge [artikel P16, tweede lid][ref3] , een zetel was onthouden.

      3 Indien de lijst, bedoeld in het eerste lid, deel uitmaakt van een lijstengroep en op een of meer andere lijsten
      of stellen gelijkluidende lijsten van die groep kandidaten voorkomen die op de gezamenlijke lijsten waarop zij
      voorkomen, een aantal stemmen hebben verkregen groter dan 25% van de kiesdeler, doch die niet met toepassing van
      [artikel P 15][ref4] zijn gekozen, verklaart de voorzitter van het centraal stembureau, in afwijking van het eerste
      lid, benoemd diegene van deze kandidaten op wie het grootste aantal stemmen is uitgebracht.

      4 Indien het de plaatsvervanging van een lid van de Eerste Kamer of van een lid van een gemeenteraad met minder dan
      negentien zetels betreft wordt bij de toepassing van het derde lid niet 25% van de kiesdeler, maar de helft van de
      kiesdeler in aanmerking genomen.

      5 Indien een plaats openvalt die door toepassing van het derde lid was vervuld en dat lid niet opnieuw moet worden
      toegepast, verklaart de voorzitter van het centraal stembureau benoemd de daarvoor in aanmerking komende kandidaat
      op de lijst waaraan ingevolge het derde lid een zetel was onthouden.

      6 Bij ministeriële regeling wordt een model vastgesteld voor het besluit van de voorzitter van het centraal
      stembureau ter benoeming van een lid van een vertegenwoordigend orgaan, noodzakelijk geworden door:

      a. het niet-aannemen van de benoeming door een kandidaat;

      b. het niet-toelaten als lid van een kandidaat, of

      c. het openvallen van een plaats in dat orgaan.


