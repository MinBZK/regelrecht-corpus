    text: |-
      1 Indien beroep is ingesteld tegen een beschikking waarbij het centraal stembureau een lijst ongeldig heeft
      verklaard of de naam van een kandidaat dan wel de aanduiding van een politieke groepering heeft geschrapt op
      grond van een of meer der verzuimen, vermeld in [artikel S 1, derde lid][ref1], zonder dat het centraal stembureau
      tevoren overeenkomstig het in dat artikel bepaalde kennis heeft gegeven van het bestaan daarvan aan degene die
      de lijst heeft ingeleverd, kan deze het verzuim of de verzuimen alsnog herstellen ter secretarie van de Raad van
      State. [Artikel S 1, vijfde lid][ref2], is van overeenkomstige toepassing.

      2 Indien een verzuim overeenkomstig het eerste lid is hersteld, houdt de Afdeling bestuursrechtspraak van de Raad
      van State bij haar uitspraak daarmee rekening.


