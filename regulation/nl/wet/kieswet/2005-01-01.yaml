        paragraaf: '4'
        afdeling: II
  - number: M 6
    text: |-
      1 Door de burgemeester van 's-Gravenhage worden vervolgens op bij algemene maatregel van bestuur te bepalen wijze
      zo spoedig mogelijk aan de kiezer gezonden:

      a. een stembiljet;

      b. een aan de burgemeester geadresseerde retourenveloppe;

      c. het briefstembewijs, bevattende een door de kiezer te ondertekenen verklaring dat hij het stembiljet persoonlijk
      heeft ingevuld;

      d. een enveloppe voor het stembiljet;

      e. een handleiding voor de kiezer.

      2 Bij ministeriële regeling worden voor de stukken, bedoeld in het eerste lid, onder b, c ,d en e, modellen
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_6
  - number: M 7
    text: |-
      1 De kiezer stemt door op het hem toegezonden stembiljet een wit stipje, geplaatst in het stemvak vóór de naam van
      de kandidaat van zijn keuze, rood te maken.

      2 Daarna vouwt hij het stembiljet dicht op zodanige wijze dat de namen van de kandidaten niet zichtbaar zijn en
      doet hij het stembiljet in de enveloppe voor het stembiljet.

      3 Hij ondertekent een op het briefstembewijs gestelde verklaring, dat hij het stembiljet persoonlijk heeft
      ingevuld.

      4 Vervolgens doet hij het briefstembewijs en de enveloppe met het stembiljet in de bijbehorende retourenveloppe
      en zendt hij deze gesloten naar de burgemeester van 's-Gravenhage dan wel naar het hoofd van de consulaire post
      waaronder de woon- en verblijfplaats van verzoeker ressorteert, die voor spoedige doorzending naar de burgemeester
      van 's-Gravenhage zorg draagt.

      5 De kiezer draagt er zorg voor dat de retourenveloppe voldoende is gefrankeerd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_7
  - number: M 8
    text: |-
      1 De stukken, bedoeld in [artikel M 7, vierde lid][ref1], dienen uiterlijk op de dag der stemming om vijftien uur
      in het bezit te zijn van de burgemeester van 's-Gravenhage.

      2 De burgemeester draagt er zorg voor dat de tijdig binnengekomen retourenveloppen die voldoende zijn gefrankeerd,
      op de dag der stemming voor eenentwintig uur ongeopend overhandigd worden aan de voorzitters van de stembureaus,
      bedoeld in [artikel M 9][ref2].

      3 Op de retourenveloppen die te laat zijn binnengekomen, worden door de burgemeester de dag en, indien dit de dag
      van de stemming is, tevens het uur van binnenkomst aangetekend. Deze retourenveloppen en de retourenveloppen die
      niet voldoende zijn gefrankeerd, worden door de burgemeester ongeopend in een of meer te verzegelen pakken gedaan.
      Ook de binnengekomen stembiljetten en briefstembewijzen die niet in de daarvoor bestemde retourenveloppen zijn
      teruggezonden, worden door de burgemeester in een of meer te verzegelen pakken gedaan. Op deze pakken wordt vermeld
      het aantal retourenveloppen, onderscheidenlijk stembiljetten en briefstembewijzen, dat het pak bevat.

      4 De burgemeester zorgt dat de verzegelde pakken, bedoeld in het derde lid, worden vernietigd, nadat het centraal
      stembureau de uitslag van de verkiezing heeft vastgesteld en over de toelating van de gekozenen onherroepelijk is
      beslist. Van de vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
