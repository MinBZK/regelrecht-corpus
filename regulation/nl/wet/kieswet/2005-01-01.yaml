  - number: Y 12
    text: |-
      De kandidatenlijsten gelden voor het gehele land. De inlevering van de lijsten bij de voorzitter van het centraal
      stembureau of bij het door deze aan te wijzen lid van dat bureau geschiedt op het Ministerie van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_12
  - number: Y 13
    text: |-
      1 Bij de lijst wordt van iedere daarop voorkomende kandidaat naast de in [artikel H 9][ref1] bedoelde verklaring
      van instemming een schriftelijke verklaring overgelegd dat hij niet in een andere lid-staat kandidaat voor het
      lidmaatschap van het Europees Parlement zal zijn.

      2 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de in het eerste lid
      bedoelde verklaring, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_13
    references:
