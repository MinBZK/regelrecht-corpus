  - number: K 9
    text: |-
      De beslissing tot inwilliging van het verzoek wordt vermeld op de oproepingskaart van de verzoeker met
      gebruikmaking van het op die kaart daartoe voorkomend formulier.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_9
  - number: K 10
    text: |-
      1 Een mondeling verzoek als bedoeld in [artikel K 3, eerste lid][ref1], kan geschieden na ontvangst van de
      oproepingskaart, doch uiterlijk op de vijfde dag voor de stemming, door de kiezer in persoon ter secretarie van de
      gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd.

      2 De kiezer legt bij het verzoek de hem ingevolge [artikel J 7][ref2] toegezonden of ingevolge [artikel J 8][ref3]
      uitgereikte oproepingskaart over.

      3 Op een verzoek als in het eerste lid bedoeld, wordt door de burgemeester of de door hem daartoe aangewezen
      ambtenaar terstond een beslissing genomen.

      4 Het verzoek wordt slechts afgewezen, indien de verzoeker op de dag van de kandidaatstelling niet als kiezer is
      geregistreerd, hem overeenkomstig [paragraaf 2 van hoofdstuk L][ref4] is toegestaan bij volmacht te stemmen of hem
      is toegestaan per brief te stemmen.

      5 De beslissing tot inwilliging van het verzoek wordt op de oproepingskaart vermeld met gebruikmaking van het op
      die kaart daartoe voorkomend formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7
