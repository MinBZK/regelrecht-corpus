  - number: M 17
    text: |-
      Voor de zitting van briefstembureaus buiten Nederland kan Onze Minister van Buitenlandse Zaken danwel Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, een later aanvangstijdstip bepalen dan het in artikel J 1, tweede
      lid, genoemde.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_17
  - number: N 1
    text: |-
      1 Onmiddellijk nadat de stemming is geëindigd, stelt het stembureau vast:

      a. het aantal kiezers dat zich heeft aangemeld;

      b. het aantal uitgereikte stembiljetten;

      c. het aantal kiezers dat geweigerd heeft het stembiljet in de stembus te steken;

      d. het aantal teruggegeven en onbruikbaar gemaakte stembiljetten;

      e. het aantal niet gebruikte stembiljetten.

      2 De aantallen, bedoeld in het eerste lid, worden door de voorzitter aan de aanwezige kiezers bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_1
  - number: N 2
    text: |-
      1 Door het stembureau wordt vervolgens op het afschrift, bedoeld in [artikel J 17, eerste lid][ref1], of op een
      daarbij gevoegde verklaring het aantal daarop geplaatste parafen vermeld en gewaarmerkt. Deze stukken worden in een
      pak gedaan, dat vervolgens wordt verzegeld.

      2 Daarna worden de ingeleverde kiezerspassen en volmachtbewijzen, te zamen met een gewaarmerkte verklaring van het
      stembureau betreffende het aantal geplaatste parafen, in een pak gedaan, dat eveneens wordt verzegeld.

      3 Tenslotte worden op overeenkomstige wijze ingepakt:

      a. de niet gebruikte stembiljetten;

      b. de teruggegeven en onbruikbaar gemaakte stembiljetten;

      c. de ingeleverde oproepingskaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_17
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: N 3
    text: |-
      Onmiddellijk na de in [artikel N 2][ref1] voorgeschreven verzegelingen wordt de stembus geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 4
    text: |-
      De stembiljetten worden geteld en hun aantal wordt vergeleken met het aantal kiezers dat aan de stemming heeft
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_4
  - number: N 5
    text: |-
      De leden van het stembureau openen de stembiljetten en voegen deze lijstgewijze bijeen. Zij kunnen zich bij
      deze werkzaamheden doen bijstaan door plaatsvervangende leden en door ambtenaren van de gemeente, daartoe door
      burgemeester en wethouders aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_5
  - number: N 6
    text: |-
      Het stembureau stelt ten aanzien van iedere lijst vast:

      a. het aantal op iedere kandidaat uitgebrachte stemmen;

      b. de som van de aantallen stemmen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_6
  - number: N 7
    text: |-
      1 Ongeldig zijn andere stembiljetten dan die welke volgens het bepaalde bij of krachtens deze wet mogen worden
      gebruikt.

      2 Voorts zijn ongeldig de stembiljetten waarop de kiezer niet, door het geheel of gedeeltelijk rood maken van
      het witte stipje in een stemvak, op ondubbelzinnige wijze heeft kenbaar gemaakt op welke kandidaat hij zijn stem
      uitbrengt of waarop bijvoegingen zijn geplaatst waardoor de kiezer kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_7
  - number: N 8
    text: |-
      1 Het stembureau beslist met inachtneming van [artikel N 7][ref1] over de geldigheid van het stembiljet.

      2 De voorzitter maakt de reden van ongeldigverklaring en van twijfel over de geldigheid, alsmede de beslissing
      daaromtrent onmiddellijk bekend.

      3 Indien een van de aanwezige kiezers dit verlangt, moet het biljet worden getoond. De kiezers kunnen mondeling
      bezwaren tegen de genomen beslissing inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_7
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 9
    text: |-
      1 Terstond nadat de stemmen zijn opgenomen, maakt de voorzitter ten aanzien van iedere lijst bekend, zowel het
      aantal op iedere kandidaat uitgebrachte stemmen als het gezamenlijke aantal uitgebrachte stemmen. Door de aanwezige
      kiezers kunnen mondeling bezwaren worden ingebracht.

      2 Vervolgens worden de ongeldig verklaarde stembiljetten in een pak gedaan, dat wordt verzegeld. Op dit pak worden
      vermeld:

      a. de naam van de gemeente en het nummer van het stemdistrict;

      b. het aantal stembiljetten dat het pak bevat.

      3 Daarop worden de geldige stembiljetten, lijstgewijs gerangschikt, in een of meer pakken gedaan, die worden
      verzegeld.

      4 Op ieder pak, in het derde lid bedoeld, worden vermeld:

      a. de naam van de gemeente en het nummer van het stemdistrict;

      b. het aantal stembiljetten dat het pak bevat, alsmede, indien de biljetten in meer dan één pak worden gedaan, de
      nummers van de lijsten waarop de ingesloten biljetten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_9
  - number: N 10
    text: |-
      1 Nadat alle werkzaamheden, in [artikel N 9][ref1] vermeld, zijn beëindigd, wordt onmiddellijk proces-verbaal
      opgemaakt van de stemming en van de stemopneming. Alle ingebrachte bezwaren worden in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het stembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 11
    text: |-
      1 Het proces-verbaal wordt met de verzegelde pakken, bedoeld in [artikel N 2][ref1], alsmede met die, bedoeld
      in [artikel N 9][ref2], door de voorzitter of een door hem aan te wijzen ander lid van het stembureau naar de
      burgemeester of een door deze aan te wijzen ambtenaar overgebracht.

      2 Nadat de burgemeester van alle in zijn gemeente gevestigde stembureaus het proces-verbaal heeft ontvangen, stelt
      hij ten aanzien van iedere kandidaat en iedere lijst vast het aantal stemmen dat in zijn gemeente op die kandidaat,
      onderscheidenlijk die lijst, is uitgebracht.

      3 Voor de in het tweede lid bedoelde vaststelling wordt gebruik gemaakt van een formulier waarvoor bij ministeriële
      regeling een model wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 12
    text: |-
      1 De burgemeester draagt er zorg voor dat de processen-verbaal, met daarbij gevoegd de opgave van de door hem
      vastgestelde aantallen stemmen, onverwijld naar de voorzitter van het hoofdstembureau worden overgebracht.

      2 De burgemeester draagt er zorg voor dat de in [artikel N 9][ref1] bedoelde verzegelde pakken met stembiljetten op
      verzoek van de voorzitter van het centraal stembureau onmiddellijk naar het centraal stembureau worden overgebracht
      en dat de niet naar het centraal stembureau overgebrachte verzegelde pakken worden vernietigd, nadat het centraal
      stembureau de uitslag van de verkiezing heeft vastgesteld en over de toelating van de gekozenen onherroepelijk
      is beslist.

      3 Indien de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een
      verzoek heeft gedaan tot overdracht van de in artikel N 2 bedoelde pakken, worden deze pakken niet vernietigd
      voordat dit onderzoek is afgerond, of, indien strafvervolging is ingesteld wegens op grond van de Kieswet of op
      grond van de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref2] strafbaar gestelde gedragingen,
      voordat er een onherroepelijke rechterlijke uitspraak is.

      4 Van de vernietiging van de verzegelde pakken wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel125
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_12
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '125'
  - number: N 13
    text: |-
      De burgemeester is bevoegd de verzegelde pakken met de in [artikel N 2][ref1] bedoelde bescheiden te openen en,
      nadat onherroepelijk is beslist over de toelating van de gekozen leden tot het vertegenwoordigend orgaan, deze
      pakken ten dienste van een onderzoek naar enig strafbaar feit aan de officier van justitie over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 14
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld betreffende de stemopneming in stembureaus waarin
      op andere wijze dan door middel van stembiljetten wordt gestemd. Deze regels worden zoveel mogelijk vastgesteld
      overeenkomstig de bepalingen van dit hoofdstuk.

      2 Een wijziging van de algemene maatregel van bestuur, bedoeld in het eerste lid, treedt niet eerder in werking
      dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin zij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_14
  - number: N 15
    text: |-
      Bij een briefstembureau betreft de vaststelling, bedoeld in [artikel N 1][ref1]:

      a. het aantal door het stembureau ontvangen retourenveloppen;

      b. het aantal ingevolge [artikel M 11][ref2] terzijde gelegde retourenveloppen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_15
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_1
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_11
        hoofdstuk: M
        paragraaf: '1'
        afdeling: II
  - number: N 16
    text: |-
      1 Bij een briefstembureau worden, nadat aan [artikel N 1, tweede lid][ref1], toepassing is gegeven, de
      verzoekschriften, bedoeld in [artikel M 4, vierde lid][ref2], te zamen met een gewaarmerkte verklaring van het
      stembureau betreffende het aantal gestelde parafen, in een pak gedaan, dat wordt verzegeld. Vervolgens worden
      op overeenkomstige wijze ingepakt de retourenveloppen, bedoeld in [artikel M 11][ref3], alsmede de ingeleverde
      briefstembewijzen.

      2 Alvorens over te gaan tot de handelingen, bedoeld in [artikel N 4][ref4], opent de voorzitter van het
      briefstembureau de enveloppen die zich in de stembus bevinden. Indien in een enveloppe zich geen of meer dan één
      stembiljet bevindt, wordt hiervan een aantekening gemaakt. Indien zich meer dan één stembiljet in één enveloppe
      bevindt, doet de voorzitter van het briefstembureau deze biljetten wederom in de enveloppe en legt hij deze, na
      haar te hebben verzegeld, terzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_11
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_16
