  - number: H 14
    text: |-
      1 Indien het betreft de verkiezing van de leden van de gemeenteraad, moet voor elke lijst een waarborgsom van € 225
      worden betaald aan de gemeente.

      2 De in het eerste lid bedoelde verplichting tot betaling geldt niet voor een kandidatenlijst van een politieke
      groepering, indien de aanduiding daarvan was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van de gemeenteraad een of meer zetels zijn toegekend. Het bepaalde in de vorige volzin
      is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de
      laatstgehouden verkiezing van de leden van de gemeenteraad, hetzij aan de gezamenlijke groeperingen, hetzij aan ten
      minste één daarvan, één of meer zetels zijn toegekend.

      3 Degene die de in het eerste lid bedoelde betaling heeft verricht, ontvangt een bewijs daarvan. Dit bewijs moet
      bij de indiening van de lijst worden overgelegd.

      4 Indien geen lijst wordt ingeleverd, wordt na de vaststelling van de uitslag van de verkiezing door de gemeente de
      waarborgsom teruggegeven aan degene die de betaling heeft verricht.

      5 Na de vaststelling van de uitslag van de verkiezing door het centraal stembureau wordt de waarborgsom
      teruggegeven aan degene die de betaling heeft verricht, tenzij het stemcijfer van de lijst lager is dan 75 procent
      van de kiesdeler, bedoeld in [artikel P 5][ref1], en aan de lijst geen zetel is toegewezen. In dat geval vervalt de
      waarborgsom aan de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_5
