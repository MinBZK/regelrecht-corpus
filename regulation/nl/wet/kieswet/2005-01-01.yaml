  - number: H 3
    text: |-
      1 De inlevering van de lijst geschiedt persoonlijk door een kiezer, bevoegd tot deelneming aan de verkiezing.
      Indien de inleveraar niet als kiezer is geregistreerd in de gemeente waar het hoofdstembureau is gevestigd, legt
      hij tevens over een verklaring van burgemeester en wethouders van de gemeente waar hij als kiezer is geregistreerd,
      dat hij bevoegd is tot deelneming aan de verkiezing. De voorzitter van het hoofdstembureau of het door deze
      aangewezen lid van dat bureau kan verlangen dat de inleveraar van zijn identiteit doet blijken. De kandidaten
      kunnen bij de inlevering aanwezig zijn.

      2 Aan degene die de lijst inlevert, kan door de gemachtigde, bedoeld in het derde lid van de [artikelen G 1][ref1],
      [G 2][ref2] of [G 3][ref3], de bevoegdheid worden verleend boven de lijst de aanduiding van de desbetreffende
      groepering te plaatsen, zoals deze door het centraal stembureau is geregistreerd. Een verklaring van de gemachtigde
      waaruit deze bevoegdheid blijkt, wordt bij de lijst overgelegd.

      3 Degene die de lijst inlevert, is bevoegd daarboven een aanduiding te plaatsen, gevormd door samenvoeging van voor
      de desbetreffende verkiezing geregistreerde aanduidingen of afkortingen daarvan, indien hem daartoe de bevoegdheid
      is verleend door de gemachtigden van de onderscheidene groeperingen. Verklaringen van de gemachtigden waaruit deze
      bevoegdheid blijkt, worden bij de lijst overgelegd. Een aldus gevormde aanduiding mag niet meer dan 35 letters of
      andere tekens bevatten.

      4 Degene die de lijst heeft ingeleverd, ontvangt van de voorzitter van het hoofdstembureau of van het door deze
      aangewezen lid van dat bureau een bewijs daarvan.

      5 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen met
      betrekking tot het plaatsen van aanduidingen van politieke groeperingen boven kandidatenlijsten, kosteloos,
      verkrijgbaar zijn. Bij ministeriële regeling wordt voor de formulieren een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_3
