  - number: R 8
    text: |-
      1 Bij de lijst wordt overgelegd een schriftelijke verklaring van iedere daarop voorkomende kandidaat dat hij
      instemt met zijn kandidaatstelling op deze lijst.

      2 Een overgelegde verklaring van instemming kan niet worden ingetrokken.

      3 Bij de lijst wordt van iedere kandidaat die geen zitting in de Eerste Kamer heeft, tevens een kopie van een
      geldig legitimatiebewijs overgelegd. Indien van een dergelijke kandidaat een kopie van een geldig legitimatiebewijs
      ontbreekt, wordt de verklaring van instemming van de betreffende kandidaat geacht te ontbreken.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen van
      instemming, kosteloos, verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een model vastgesteld.

      5 Indien de kandidaat zich buiten Nederland bevindt, is de verklaring niet aan enig formulier gebonden en kan zij
      ook telegrafisch of per telex geschieden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_8
  - number: R 9
    text: |-
      1 De kandidaat wiens woonplaats buiten Nederland is gelegen, wijst in de verklaring van instemming
      tevens een in Nederland wonende gemachtigde aan met vermelding van diens naam, voorletters, woonplaats en
      adres. Indien de kandidaat voorkomt op meer dan één lijst, moet in iedere verklaring dezelfde gemachtigde
      worden aangewezen. Deze gemachtigde is met uitsluiting van de kandidaat bevoegd tot de handelingen,
      bedoeld in de [artikelen V 2, eerste, vierde en vijfde lid][ref1], [V 3, eerste en derde lid][ref2], en
      [W 2, eerste lid, onder ][ref3].

      2 De kandidaat is bevoegd de overeenkomstig het eerste lid gegeven volmacht in te trekken. Hij geeft hiervan
      schriftelijk, telegrafisch of per telex kennis aan de voorzitter van het centraal stembureau, zo nodig met
      aanwijzing van een nieuwe gemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_3
