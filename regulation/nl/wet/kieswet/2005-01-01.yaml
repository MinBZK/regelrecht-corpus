  - number: Z 20
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Voor de bekendmaking van deze wet stelt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nummering
      van de artikelen, paragrafen en hoofdstukken van deze wet opnieuw vast en brengt hij de in deze wet voorkomende
      aanhalingen van de artikelen, paragrafen en hoofdstukken met de nieuwe nummering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_20
  - number: Z 21
    text: Deze wet kan worden aangehaald als Kieswet.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelZ_21
