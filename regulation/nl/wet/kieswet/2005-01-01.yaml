  - number: N 21
    text: |-
      De vaststelling van de aantallen stemmen, bedoeld in [artikel N 11, tweede lid][ref1], vindt door de burgemeester
      van 's-Gravenhage eerst plaats nadat hem tevens alle processen-verbaal van de briefstembureaus buiten Nederland per
      telefax ter kennis zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_21
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_11
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: O 1
    text: |-
      1 Het hoofdstembureau houdt op de tweede dag na de stemming om tien uur een openbare zitting.

      2 De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_1
  - number: O 2
    text: |-
      1 Het hoofdstembureau stelt ten aanzien van iedere lijst vast het aantal op iedere kandidaat uitgebrachte stemmen
      en de som van deze aantallen. Deze som wordt stemcijfer genoemd.

      2 De voorzitter maakt de aldus verkregen uitkomsten bekend.

      3 Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_2
  - number: O 3
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan onmiddellijk proces-verbaal opgemaakt. Alle ingebrachte
      bezwaren worden in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.

      4 Indien het de verkiezing betreft van de gemeenteraad of van provinciale staten van een provincie die één
      kieskring vormt, maakt het proces-verbaal deel uit van het proces-verbaal, bedoeld in [artikel P 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_22
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
  - number: O 4
    text: |-
      1 Tenzij het de verkiezing betreft van de gemeenteraad of van provinciale staten van een provincie die één
      kieskring vormt, doet de voorzitter terstond een afschrift van het proces-verbaal, bedoeld in [artikel O 3][ref1],
      naar het centraal stembureau overbrengen en doet hij tegelijkertijd het proces-verbaal ter secretarie van de
      gemeente waar het hoofdstembureau is gevestigd, voor een ieder ter inzage leggen. De terinzagelegging wordt
      beëindigd, zodra over de toelating van de benoemden onherroepelijk is beslist.

      2 De voorzitter doet de processen-verbaal van de stembureaus, de opgave, bedoeld in
      [artikel N 12, eerste lid][ref2], en, tenzij het de verkiezing betreft van de gemeenteraad of van provinciale
      staten van een provincie die één kieskring vormt, een afschrift van het proces-verbaal van de zitting van het
      hoofdstembureau terstond overbrengen aan het orgaan waarvoor de verkiezing plaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: O_3
        hoofdstuk: O
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_12
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: O 5
    text: |-
      1 De voorzitter van het orgaan waarvoor de verkiezing heeft plaats gehad, kan de processen-verbaal van de
      stembureaus en de opgave, bedoeld in [artikel N 12, eerste lid][ref1], vernietigen, nadat het centraal stembureau
      de uitslag van de verkiezing heeft vastgesteld en over de toelating van de gekozenen onherroepelijk is beslist.

      2 Van een vernietiging als bedoeld in dit artikel wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_12
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: O 6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de vaststelling van de verkiezingsuitslag.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelO_6
  - number: P 1
    text: |-
      Onmiddellijk nadat de afschriften van de processen-verbaal van alle hoofdstembureaus zijn ontvangen, gaat
      het centraal stembureau over tot het verrichten van de werkzaamheden ter vaststelling van de uitslag van de
      verkiezing. Indien het de verkiezing betreft van de gemeenteraad of van provinciale staten van een provincie die
      één kieskring vormt, gaat het centraal stembureau daartoe onmiddellijk over nadat de werkzaamheden, bedoeld in de
      [artikelen O 1][ref1] en [O 2][ref2], zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: O_1
        hoofdstuk: O
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: O_2
        hoofdstuk: O
        afdeling: II
  - number: P 2
    text: |-
      1 Een stel gelijkluidende lijsten als bedoeld in [artikel H 11, eerste lid][ref1], geldt voor de vaststelling van
      de uitslag van de verkiezing als één lijst.

      2 Het centraal stembureau telt van deze gelijkluidende lijsten te zamen de stemcijfers en de aantallen op iedere
      kandidaat uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 3
    text: |-
      Een lijstengroep als bedoeld in [artikel H 11, tweede lid][ref1], geldt voor het bepalen van het aantal daaraan toe
      te wijzen zetels als één lijst met een stemcijfer gelijk aan de som van de stemcijfers van de lijsten waaruit de
      groep bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 4
    text: |-
      1 Een lijstencombinatie als bedoeld in [artikel I 10][ref1] geldt voor het bepalen van het aantal daaraan toe te
      wijzen zetels als één lijst, met een stemcijfer gelijk aan de som van de stemcijfers van de lijsten waaruit die
      combinatie bestaat.

      2 Een lijstencombinatie wordt slechts in aanmerking genomen, indien aan ten minste twee van de verbonden
      lijsten een zetel zou zijn toegewezen, indien geen lijstencombinaties zouden zijn gevormd. Verbonden lijsten die
      zelfstandig geen zetel zouden hebben verworven, worden geacht geen deel uit te maken van de lijstencombinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_10
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_10
        hoofdstuk: I
        paragraaf: '2'
        afdeling: II
  - number: P 5
    text: |-
      1 Het centraal stembureau deelt de som van de stemcijfers van alle lijsten door het aantal te verdelen zetels.

      2 Het aldus verkregen quotiënt wordt kiesdeler genoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_5
  - number: P 6
    text: Zoveel maal als de kiesdeler is begrepen in het stemcijfer van een lijst wordt aan die lijst een zetel toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_6
  - number: P 7
    text: |-
      1 De overblijvende zetels, die restzetels worden genoemd, worden, indien het aantal te verdelen zetels negentien
      of meer bedraagt, achtereenvolgens toegewezen aan de lijsten die na toewijzing van de zetel het grootste gemiddelde
      aantal stemmen per toegewezen zetel hebben. Indien gemiddelden gelijk zijn, beslist zo nodig het lot.

      2 Indien het betreft de verkiezing van de leden van de Tweede Kamer, komen bij deze toewijzing niet in aanmerking
      lijsten waarvan het stemcijfer lager is dan de kiesdeler.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_7
  - number: P 8
    text: |-
      1 De restzetels worden, indien het aantal te verdelen zetels minder dan negentien bedraagt, achtereenvolgens
      toegewezen aan de lijsten waarvan de stemcijfers bij deling door de kiesdeler de grootste overschotten hebben.
      Hierbij worden lijsten die geen overschot hebben, geacht lijsten te zijn met het kleinste overschot. Indien
      overschotten gelijk zijn, beslist zo nodig het lot.

      2 Bij deze toewijzing komen niet in aanmerking lijsten met een stemcijfer dat lager is dan 75% van de kiesdeler.

      3 Wanneer alle lijsten die daarvoor in aanmerking komen een restzetel hebben ontvangen en er nog zetels te
      verdelen blijven, worden deze zetels toegewezen volgens het stelsel van de grootste gemiddelden als bedoeld in
      [artikel P 7, eerste lid][ref1], met dien verstande, dat bij deze toewijzing aan geen van de lijsten meer dan één
      zetel wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_7
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 9
    text: |-
      Indien aan een lijst die de volstrekte meerderheid van de uitgebrachte geldige stemmen heeft verkregen, een aantal
      zetels is toegewezen, kleiner dan de volstrekte meerderheid van het aantal toe te wijzen zetels, wordt aan die
      lijst alsnog één zetel toegewezen en vervalt daartegenover één zetel, toegewezen aan de lijst die voor het kleinste
      gemiddelde of het kleinste overschot een zetel heeft verworven. Indien twee of meer lijsten voor hetzelfde kleinste
      gemiddelde of hetzelfde kleinste overschot een zetel hebben verworven, beslist het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_9
  - number: P 10
    text: |-
      Indien bij de toepassing van de vorige bepalingen aan een lijst meer zetels zouden moeten worden toegewezen dan er
      kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van die bepalingen over op één
      of meer van de overige lijsten, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_10
  - number: P 11
    text: |-
      1 De verdeling van de aan een lijstencombinatie toegewezen zetels over de lijsten welke zijn gecombineerd,
      geschiedt als volgt.

      2 Het centraal stembureau deelt het stemcijfer van de lijstencombinatie door het aantal aan de lijstencombinatie
      toegewezen zetels.

      3 Het aldus verkregen quotiënt wordt combinatiekiesdeler genoemd.

      4 Zoveel maal als de combinatiekiesdeler is begrepen in het stemcijfer van elk van de lijsten waaruit de combinatie
      bestaat, wordt aan die lijst een van de aan de combinatie toegewezen zetels toegewezen.

      5 De restzetels worden achtereenvolgens toegewezen aan de lijsten van de combinatie waarvan de stemcijfers bij
      deling door de combinatiekiesdeler de grootste overschotten hebben. Hierbij worden lijsten die geen overschot
      hebben, geacht lijsten te zijn met het kleinste overschot. Indien overschotten gelijk zijn, beslist zo nodig het
      lot.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_11
  - number: P 12
    text: |-
      1 De verdeling van de aan een lijstengroep toegewezen zetels over de lijsten waaruit de groep bestaat, geschiedt
      als volgt.

      2 Het centraal stembureau deelt het stemcijfer van de lijstengroep door het aantal aan de groep toegewezen zetels.

      3 Het aldus verkregen quotiënt wordt groepskiesdeler genoemd.

      4 Zoveel maal als de groepskiesdeler is begrepen in het stemcijfer van elk van de lijsten waaruit de groep bestaat,
      wordt aan die lijst een van de aan de groep toegewezen zetels toegewezen.

      5 De restzetels worden achtereenvolgens toegewezen aan de lijsten van de groep waarvan de stemcijfers bij deling
      door de groepskiesdeler de grootste overschotten hebben. Hierbij worden lijsten die geen overschot hebben, geacht
      lijsten te zijn met het kleinste overschot. Indien overschotten gelijk zijn, beslist zo nodig het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_12
  - number: P 13
    text: |-
      1 Indien bij de toepassing van [artikel P 11][ref1] of [artikel P 12][ref2] aan een lijst meer zetels zouden moeten
      worden toegewezen dan er kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van
      dat artikel over op een van de andere lijsten van de combinatie, onderscheidenlijk van de groep, waarop kandidaten
      voorkomen aan wie geen zetel is toegewezen.

      2 Zijn er na toepassing van het eerste lid nog zetels toe te wijzen, dan worden deze toegewezen volgens het stelsel
      van de grootste gemiddelden als bedoeld in [artikel P 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_12
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_11
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: P_12
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004627
        artikel: P_7
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 14
    text: |-
      De in de voorgaande artikelen bedoelde lotingen vinden plaats in de in [artikel P 20][ref1] bedoelde zitting van
      het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_14
    references:
      - id: ref1
