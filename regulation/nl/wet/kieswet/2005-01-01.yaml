  - number: H 4
    text: |-
      1 Bij de lijst worden overgelegd schriftelijke verklaringen van kiezers dat zij de lijst ondersteunen. Op deze
      verklaringen worden de kandidaten op dezelfde wijze en in dezelfde volgorde vermeld als op de lijst. Bij een
      verkiezing van de leden van de Tweede Kamer, provinciale staten onderscheidenlijk een gemeenteraad waarin het
      aantal te verdelen zetels in de raad ten minste negenendertig is bedraagt het aantal over te leggen verklaringen
      ten minste dertig, bij een verkiezing van de leden van een gemeenteraad waarin het aantal te verdelen zetels minder
      dan negenendertig, doch minimaal negentien is, bedraagt het aantal over te leggen verklaringen ten minste twintig
      en bij een verkiezing van de leden van een gemeenteraad waarin het aantal te verdelen zetels minder dan negentien
      is, bedraagt het aantal over te leggen verklaringen ten minste tien.

      2 Verklaringen van ondersteuning kunnen slechts worden afgelegd door personen die binnen de kieskring waarvoor die
      lijst geldt, als kiezer zijn geregistreerd voor de desbetreffende verkiezing.

      3 De kiezer die een verklaring van ondersteuning wenst af te leggen, ondertekent binnen een termijn van zeven dagen
      voorafgaand aan of op de dag van de kandidaatstelling deze verklaring ter secretarie van de gemeente waar hij als
      kiezer is geregistreerd, in aanwezigheid van de burgemeester of een door deze daartoe aangewezen ambtenaar. De
      kiezer geeft daarbij de burgemeester of de ambtenaar blijk van zijn identiteit.

      4 De burgemeester of de door hem daartoe aangewezen ambtenaar gaat onverwijld na of de ondertekenaar als kiezer in
      zijn gemeente is geregistreerd. Indien hem blijkt dat dit het geval is, tekent hij dit op de verklaring aan.

      5 Een kiezer mag niet meer dan één verklaring van ondersteuning ondertekenen.

      6 Een overgelegde verklaring van ondersteuning kan niet worden ingetrokken.

      7 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen van
      ondersteuning, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een
      model vastgesteld.

      8 De in het eerste lid bedoelde verplichting geldt niet voor een kandidatenlijst van een politieke groepering,
      indien de aanduiding daarvan was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden verkiezing van
      de leden van het desbetreffende vertegenwoordigende orgaan een of meer zetels zijn toegekend. De vorige volzin is
      mede van toepassing ten aanzien van:

      a. samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de laatstgehouden verkiezing van de
      leden van het desbetreffende orgaan, hetzij aan de gezamenlijke groeperingen, hetzij aan tenminste één daarvan, één
      of meer zetels zijn toegekend;

      b. een nieuwe aanduiding indien twee of meer groeperingen als één groepering onder een nieuwe naam samen aan de
      verkiezingen deelnemen en bij de laatstgehouden verkiezingen van de leden van het desbetreffende orgaan, aan ieder
      van de afzonderlijke groeperingen één of meer zetels zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_4
  - number: H 5
    text: |-
      Op de lijst kunnen een gemachtigde en desgewenst diens plaatsvervangers worden aangewezen, bevoegd tot het
      verbinden van de lijst met andere lijsten tot een lijstencombinatie. Voorts worden op de lijst een of meer
      personen vermeld die bij verhindering van de inleveraar bevoegd zijn tot het herstel van verzuimen, bedoeld in
      [artikel I 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_5
