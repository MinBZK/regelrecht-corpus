  - number: N 17
    text: |-
      1 Indien in een briefstembureau buiten Nederland de stemopneming, gemeten naar Nederlandse tijd, eerder aanvangt
      dan in Nederland, blijft [artikel N 9, eerste lid][ref1], buiten toepassing.

      2 In dat geval draagt het hoofd van de diplomatieke of consulaire vertegenwoordiging danwel de vertegenwoordiger
      van Nederland in de Nederlandse Antillen of in Aruba er zorg voor dat een afschrift van het proces-verbaal van
      het briefstembureau vanaf de volgende dag gedurende vier weken bij de vertegenwoordiging voor een ieder ter inzage
      ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 18
    text: |-
      De leden van een briefstembureau buiten Nederland kunnen zich doen bijstaan door plaatsvervangende leden en
      door personen, werkzaam op de diplomatieke of consulaire vertegenwoordiging danwel op de Vertegenwoordiging van
      Nederland in de Nederlandse Antillen of in Aruba, daartoe aan te wijzen door de voorzitter van het briefstembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_18
  - number: N 19
    text: |-
      Bij briefstembureaus buiten Nederland wordt op de in [artikel N 9][ref1] bedoelde pakken de naam van het land
      waarin het briefstembureau is gevestigd, vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelN_19
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_9
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 20
    text: |-
      1 Het proces-verbaal van een briefstembureau buiten Nederland wordt met de in [artikel N 2][ref1] en [N 9][ref2]
      bedoelde verzegelde pakken overgedragen aan het hoofd van de ingevolge [artikel M 13, eerste lid][ref3], aangewezen
      diplomatieke of consulaire vertegenwoordiging danwel aan de vertegenwoordiger van Nederland in de Nederlandse
      Antillen of in Aruba.

      2 Deze draagt er zorg voor dat het proces-verbaal terstond per telefax ter kennis van de burgemeester van 's-
      Gravenhage wordt gebracht.

      3 Voorts draagt hij er zorg voor dat het proces-verbaal met de in de [artikelen M 8][ref4], [N 2][ref5] en
      [N 16][ref6] bedoelde verzegelde pakken zo spoedig mogelijk per diplomatieke post naar de burgemeester van 's-
      Gravenhage worden overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
