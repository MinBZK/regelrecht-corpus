  - number: V 4
    text: |-
      1 Het vertegenwoordigend orgaan waarvoor de verkiezing is geschied, onderzoekt de geloofsbrief en beslist of de
      benoemde als lid van dat orgaan wordt toegelaten. Daarbij gaat het na, of de benoemde aan de vereisten voor het
      lidmaatschap voldoet en geen met het lidmaatschap onverenigbare betrekking vervult, en beslist het de geschillen
      welke met betrekking tot de geloofsbrief of de verkiezing zelf rijzen. Indien de benoemde voor de eerste samenkomst
      van het nieuw gekozen orgaan de voor het lidmaatschap vereiste leeftijd zal hebben bereikt, wordt daarmee bij
      het nemen van de beslissing rekening gehouden. De wijze waarop het onderzoek van de geloofsbrieven van de leden
      van de Tweede, onderscheidenlijk van de Eerste Kamer geschiedt, wordt geregeld in het reglement van orde van de
      desbetreffende kamer.

      2 Het onderzoek van de geloofsbrief strekt zich niet uit tot de geldigheid van de kandidatenlijsten en van de
      lijstverbindingen.

      3 Betreft het de toelating van degene die is benoemd in een tussentijds opengevallen plaats, dan strekt het
      onderzoek zich niet uit tot punten die het verloop van de verkiezing of de vaststelling van de uitslag betreffen.

      4 Ten behoeve van het onderzoek, bedoeld in het eerste lid, kan het vertegenwoordigend orgaan tot een nieuwe
      opneming van stembiljetten, zowel uit alle als uit een of meer stemdistricten of provincies, besluiten. De
      burgemeester die de desbetreffende stembiljetten onder zich heeft, onderscheidenlijk de voorzitter van het centraal
      stembureau voor de verkiezing van de leden van de Eerste Kamer, doet deze op verzoek van het vertegenwoordigend
      orgaan onverwijld naar dat orgaan overbrengen. Na ontvangst van de stembiljetten gaat het vertegenwoordigend
      orgaan onmiddellijk tot de opneming over. Het is bevoegd daartoe de verzegelde pakken te openen en de inhoud
      te vergelijken met de processen-verbaal van de stembureaus. Bij deze opneming zijn de [artikelen N 5][ref1],
      [ N 8][ref2] en [N 9][ref3] van overeenkomstige toepassing.

      5 Ten behoeve van het onderzoek, bedoeld in het eerste lid, is het vertegenwoordigend orgaan tevens bevoegd de
      verzegelde pakken, bedoeld in [artikel N 2][ref4], te openen. De burgemeester die de desbetreffende pakken onder
      zich heeft, doet deze op verzoek van het vertegenwoordigend orgaan onverwijld naar dat orgaan overbrengen. Na
      beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op de in
      [artikel N 2][ref5] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_5
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8
