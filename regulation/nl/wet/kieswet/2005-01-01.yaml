  - number: K 4
    text: |-
      1 Aan de kiezer wordt als bewijs dat aan zijn verzoek is voldaan een verklaring verstrekt, genaamd kiezerspas.

      2 De kiezer aan wie een kiezerspas is verstrekt, kan uitsluitend met deze pas aan de verkiezing deelnemen.

      3 Aan de kiezer wiens kiezerspas in het ongerede is geraakt, wordt geen nieuwe verstrekt.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_4
  - number: K 5
    text: |-
      Bij de naam van de kiezer aan wie een kiezerspas is verstrekt, wordt in het in [artikel J 17, eerste lid][ref1],
      bedoelde afschrift de aantekening "pas" geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_17
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: K 6
    text: |-
      1 Een schriftelijk verzoek aan de burgemeester als bedoeld in [artikel K 3, eerste lid][ref1], kan worden gedaan
      uiterlijk op de veertiende dag voor de stemming. Indien de kiezer reeds een oproepingskaart heeft ontvangen, voegt
      hij deze bij het verzoek.

      2 Voor het verzoek wordt gebruik gemaakt van een formulier dat ter secretarie van elke gemeente kosteloos
      verkrijgbaar is.

      3 Bij ministeriële regeling wordt voor het formulier een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_6
    references:
