  - number: I 7
    text: |-
      1 Tegen een beschikking als bedoeld in [artikel I 4][ref1] kan een belanghebbende en iedere kiezer
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. In afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref2] bedraagt de termijn voor het indienen van een beroepschrift
      vier dagen.

      2 [Artikel D 9, tweede tot en met vierde lid][ref3], is van overeenkomstige toepassing.

      3 De Afdeling doet uitspraak uiterlijk op de zesde dag nadat het beroepschrift is ontvangen.

      4 Indien de uitspraak van de Afdeling strekt tot gegrondverklaring van het beroep, bepaalt zij dat haar uitspraak
      in de plaats treedt van de vernietigde beschikking.

      5 De voorzitter van de Afdeling stelt partijen en de voorzitter van het hoofdstembureau onverwijld in kennis van
      de uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
