  - number: P 18
    text: |-
      1 Betreft het een lijstengroep dan geldt, indien een kandidaat met toepassing van [artikel P 17][ref1] op meer
      dan één lijst of stel gelijkluidende lijsten van de lijstengroep gekozen is, die kandidaat als gekozen op de lijst
      of het stel gelijkluidende lijsten waarop het grootste aantal stemmen op hem is uitgebracht. Voor zover aantallen
      gelijk zijn, geldt hij als gekozen op de lijst, ingeleverd in de kieskring met het laagste nummer, dan wel op het
      stel gelijkluidende lijsten waartoe de lijst behoort, ingeleverd in de kieskring met het laagste nummer.

      2 De aan een lijst of stel gelijkluidende lijsten toegewezen zetels die na toepassing van het eerste lid nog niet
      aan een kandidaat zijn toegewezen, worden aan de nog niet gekozen kandidaten van de desbetreffende lijst of het
      desbetreffende stel gelijkluidende lijsten toegewezen in de volgorde van de lijst.

      3 Indien na toepassing van het tweede lid opnieuw een kandidaat op meer dan één lijst of stel gelijkluidende
      lijsten is gekozen, wordt de procedure, bedoeld in het eerste en tweede lid, zo lang herhaald, totdat alle aan de
      lijsten of stellen gelijkluidende lijsten toegewezen zetels aan kandidaten zijn toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_17
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_18
