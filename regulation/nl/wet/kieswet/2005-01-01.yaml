  - number: R 9a
    text: |-
      1 De in Nederland wonende kandidaat kan bij de verklaring van instemming tevens een in Nederland wonende gemachtigde
      aanwijzen met vermelding van diens naam, voorletters, woonplaats en adres. Indien de kandidaat voorkomt op meer
      dan één lijst, wordt in iedere verklaring dezelfde gemachtigde aangewezen. Deze gemachtigde is met uitsluiting
      van de kandidaat bevoegd tot de handelingen, bedoeld in de [artikelen V 2, eerste, vierde en vijfde lid][ref1],
      [V 3, eerste en tweede lid][ref2], en [W 2, eerste lid, onder ][ref3].

      2 Van de machtiging kan alleen gebruik worden gemaakt, indien dit gebruik ertoe strekt dat kandidaten van de
      gezamenlijke lijsten van de politieke groepering benoemd worden verklaard in de volgorde die voor de dag van de
      stemming door de politieke groepering is vastgesteld.

      3 In geval van een benoeming voorafgaande aan de eerste samenkomst van het nieuw gekozen orgaan, kan van de
      machtiging geen gebruik worden gemaakt ten aanzien van kandidaten die op de gezamenlijke lijsten waarop zij
      voorkomen een aantal stemmen hebben verkregen, groter dan de helft van de kiesdeler.

      4 De politieke groepering deelt de in het tweede lid bedoelde volgorde uiterlijk twee weken na de kandidaatstelling
      mee aan het centraal stembureau. De voorzitter van het centraal stembureau draagt er zorg voor dat de volgorde zo
      spoedig mogelijk in de *Staatscourant* wordt bekendgemaakt.

      5 [Artikel R 9, tweede lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_3
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_2
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_9
