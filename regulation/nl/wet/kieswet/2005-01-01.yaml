  - number: R 10
    text: |-
      1 Kandidatenlijsten, ingeleverd in verschillende provincies, waarop dezelfde kandidaten in gelijk aantal en in
      dezelfde volgorde zijn geplaatst, vormen te zamen een stel gelijkluidende lijsten.

      2 Kandidatenlijsten waarboven dezelfde aanduiding van een politieke groepering is geplaatst of waarvan de eerste
      kandidaat dezelfde is, vormen te zamen een lijstengroep. Het bepaalde in de vorige volzin is mede van toepassing
      ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_10
  - number: R 11
    text: |-
      1 De commissaris van de Koning of het door gedeputeerde staten daartoe aangewezen lid van dat college stelt een
      bewijs van ontvangst ter hand aan degene die de lijst inlevert en doet de bij hem ingeleverde lijsten onverwijld
      ter provinciale griffie voor een ieder ter inzage leggen.

      2 Op de tweede dag na de kandidaatstelling doet de commissaris van de Koning de lijsten in een pak, verzegelt
      dit en plaatst op de buitenzijde daarvan een verklaring dat het de ingeleverde kandidatenlijsten bevat. In de
      verklaring, die door hem wordt ondertekend, wordt het aantal lijsten vermeld.

      3 Het pak wordt na de verzegeling onverwijld overgebracht naar de voorzitter van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelR_11
  - number: S 1
    text: |-
      1 Er is voor de verkiezing van de leden van de Eerste Kamer een centraal stembureau. De Kiesraad treedt als zodanig
      op.

      2 Het centraal stembureau houdt een zitting tot het onderzoeken van de kandidatenlijsten.

      3 Indien bij het onderzoek blijkt van een of meer van de volgende verzuimen, geeft het centraal stembureau
      onverwijld bij aangetekende brief of tegen gedagtekend ontvangstbewijs kennis aan degene die de lijst heeft
      ingeleverd:

      a. dat de lijst niet is ondertekend door ten minste één lid van provinciale staten, bij de beoordeling waarvan de
      ondertekenaar die meer dan één lijst heeft ondertekend, buiten beschouwing blijft;

      b. dat een kandidaat niet is vermeld overeenkomstig het bepaalde krachtens [artikel R 6][ref1];

      c. dat ten aanzien van een kandidaat ontbreekt de verklaring dat hij instemt met zijn kandidaatstelling op de
      lijst;

      d. dat ten aanzien van een kandidaat die buiten Nederland woonplaats heeft, in zijn verklaring van instemming de
      aanwijzing van een gemachtigde ontbreekt;

      e. dat een verklaring, bedoeld in [artikel R 7][ref2], ontbreekt.

      4 Uiterlijk op de derde dag na de zitting, bedoeld in het tweede lid, kan degene die de lijst heeft ingeleverd,
      het verzuim of de verzuimen, in de kennisgeving aangeduid, herstellen op het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties van negen tot zeventien uur.

      5 Bij verhindering of ontstentenis van degene die de lijst heeft ingeleverd, treedt in diens plaats een ingevolge
      [artikel R 3, tweede volzin][ref3], op de lijst vermelde vervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_7
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_3
