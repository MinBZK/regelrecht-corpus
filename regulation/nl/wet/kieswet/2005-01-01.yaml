      1 Wanneer een lid van de gemeenteraad komt te verkeren in een van de gevallen, genoemd in het eerste lid van
      artikel X 1, geeft hij hiervan kennis aan de raad, met vermelding van de reden.

      2 Indien de kennisgeving niet is gedaan en burgemeester en wethouders van oordeel zijn, dat een lid van de
      gemeenteraad verkeert in een van de gevallen, genoemd in het [eerste lid van artikel X 1][ref1], waarschuwen zij de
      belanghebbende schriftelijk.

      3 Het staat deze vrij de zaak uiterlijk op de achtste dag na de dagtekening van de in het tweede lid bedoelde
      waarschuwing aan het oordeel van de raad te onderwerpen.


