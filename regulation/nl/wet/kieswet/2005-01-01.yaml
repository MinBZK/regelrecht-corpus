  - number: K 13
    text: |-
      1 Burgemeester en wethouders kunnen in hun gemeente mobiele stembureaus aanwijzen. Deze mobiele stembureaus zijn
      uitsluitend bestemd voor het uitbrengen van stemmen op de wijze als geregeld in dit hoofdstuk, dan wel voor het,
      met inachtneming van de bepalingen van [hoofdstuk L][ref1], uitbrengen van een volmachtstem waarvoor de kiezer
      overeenkomstig [artikel L 8][ref2] is gemachtigd. Indien burgemeester en wethouders een dergelijk stembureau
      aanwijzen, brengt de burgemeester dit ten minste veertien dagen voor de stemming ter openbare kennis onder
      vermelding van de mogelijkheid aldaar met behulp van een kiezerspas een stem uit te brengen.

      2 Burgemeester en wethouders stellen de zittingstijden vast en de onderscheiden plaatsen waar de mobiele
      stembureaus gedurende de dag der stemming worden gestationeerd. De tijdstippen en plaatsen worden bekend gemaakt in
      de openbare kennisgeving, bedoeld in het eerste lid.

      3 Alvorens een stembureau als bedoeld in het eerste lid naar een andere standplaats vertrekt, wordt de sleuf
      van de stembus door de voorzitter van het stembureau in tegenwoordigheid van de aanwezige kiezers afgesloten en
      verzegeld. De sleutel waarmee de stembus is afgesloten, wordt tijdens het verplaatsen naar de volgende standplaats
      bewaard door de voorzitter. Na de aankomst van het mobiele stembureau op de nieuwe standplaats, wordt de stembus in
      tegenwoordigheid van de aanwezige kiezers geopend door de voorzitter.

      4 [Artikel K 12, tweede, derde en vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_12
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_13
