  - number: S 9
    text: |-
      Het centraal stembureau beslist over de geldigheid van de lijstencombinaties in de zitting, bedoeld in
      [artikel S 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_2
