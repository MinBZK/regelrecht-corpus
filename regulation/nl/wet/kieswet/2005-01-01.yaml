      d. voor de laatstgehouden verkiezing van de leden van provinciale staten geen gebruik is gemaakt van de
      bevoegdheid, bedoeld in het [tweede of derde lid van artikel H 3][ref3].

      8 Op de veertiende dag voor de kandidaatstelling voor de verkiezing van de leden van provinciale staten, alsmede
      op de veertigste dag vóór de kandidaatstelling voor de verkiezing van de leden van de gemeenteraad, brengt het
      centraal stembureau de door hem geregistreerde aanduidingen van politieke groeperingen, voor zover de registratie
      daarvan onherroepelijk is, alsmede de namen van de gemachtigden en hun plaatsvervangers ter openbare kennis in de
      Nederlandse Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
