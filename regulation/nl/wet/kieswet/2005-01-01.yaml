  - number: L 1
    text: |-
      De kiezer die verwacht niet in staat te zullen zijn in persoon aan de stemming deel te nemen, kan overeenkomstig de
      bepalingen van dit hoofdstuk bij volmacht stemmen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_1
  - number: L 2
    text: |-
      1 Een volmacht kan worden verleend hetzij op een schriftelijke aanvraag overeenkomstig het bepaalde in paragraaf 2,
      hetzij door overdracht van de oproepingskaart overeenkomstig het bepaalde in paragraaf 3 van dit hoofdstuk.

      2 Een schriftelijke aanvraag om bij volmacht te stemmen kan niet worden ingediend door de kiezer aan wie is
      toegestaan in een stembureau van zijn keuze of per brief te stemmen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_2
  - number: L 3
    text: De gemachtigde kan een volmachtstem uitsluitend tegelijk met zijn eigen stem uitbrengen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_3
  - number: L 4
    text: Een kiezer mag niet meer dan twee aanwijzingen als gemachtigde aannemen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_4
  - number: L 5
    text: |-
      1 De volmachtgever is niet bevoegd een eenmaal verleende volmacht in te trekken of na het verlenen van volmacht in
      persoon aan de stemming deel te nemen.

      2 Een stem, uitgebracht door een volmachtgever in strijd met het bepaalde in het eerste lid, wordt niettemin geacht
      geldig te zijn uitgebracht.

      3 Een schriftelijke aanvrage om bij volmacht te stemmen kan worden ingetrokken, zolang daarop niet is beslist.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_5
  - number: L 6
    text: |-
      1 Aan de gemachtigde wordt ten bewijze van zijn bevoegdheid een verklaring verstrekt, genaamd volmachtbewijs.

      2 Aan de gemachtigde wiens volmachtbewijs in het ongerede is geraakt, wordt geen nieuw verstrekt.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_6
  - number: L 7
    text: |-
      De burgemeester brengt op de dag van de kandidaatstelling ter openbare kennis, dat uiterlijk op de veertiende
      dag voor de stemming voor de kiezers gelegenheid bestaat het in [artikel L 8][ref1] bedoelde verzoekschrift in
      te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 8
    text: |-
      1 De kiezer die bij volmacht wenst te stemmen, dient uiterlijk op de veertiende dag voor de stemming daartoe
      een verzoekschrift in bij de burgemeester van de gemeente waar hij op de dag van de kandidaatstelling als kiezer
      is geregistreerd. Voor dit verzoekschrift wordt gebruik gemaakt van een formulier, dat ter secretarie van elke
      gemeente, kosteloos, verkrijgbaar is. De burgemeester kan ter voorkoming van misbruik beperkingen stellen aan de
      verkrijgbaarstelling. Een daartoe strekkend besluit brengt hij ter openbare kennis.

      2 In zijn verzoekschrift wijst de kiezer een gemachtigde aan. Als gemachtigde kan slechts optreden degene die op de
      dag van de kandidaatstelling als kiezer is geregistreerd binnen het gebied waarvoor de verkiezing geldt.

      3 Bij het verzoekschrift wordt ingediend een verklaring van de gemachtigde dat deze bereid is als zodanig op te
      treden, alsmede, indien de gemachtigde niet in dezelfde gemeente als kiezer is geregistreerd als de volmachtgever,
      een door burgemeester en wethouders van de gemeente waar de gemachtigde als kiezer is geregistreerd, afgegeven
      verklaring, dat de gemachtigde als kiezer is geregistreerd in hun gemeente en dat de bereidverklaring van de
      gemachtigde in overeenstemming is met het bepaalde in [artikel L 4][ref1] .

      4 Bij ministeriële regeling worden voor het verzoekschrift en de verklaring modellen vastgesteld.

      5 De in het derde lid bedoelde verklaring van burgemeester en wethouders van de gemeente waar de gemachtigde als
      kiezer is geregistreerd, is niet vereist, indien de volmachtgever zijn werkelijke woonplaats buiten Nederland
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_4
        hoofdstuk: L
        paragraaf: '1'
        afdeling: II
  - number: L 9
    text: |-
      De kiezer die zijn werkelijke woonplaats buiten Nederland heeft, dient, indien hij bij volmacht wenst te stemmen,
      gelijktijdig met het registratieverzoek, bedoeld in [artikel D 3][ref1], daartoe een schriftelijk verzoek in bij de
      burgemeester van 's-Gravenhage. Voor het verzoekschrift wordt gebruik gemaakt van een formulier dat is opgenomen in
      het in [artikel D 3, negende lid][ref2], bedoelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_3
        hoofdstuk: D
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_3
        hoofdstuk: D
        afdeling: II
  - number: L 10
    text: |-
      Het verzoek wordt afgewezen, indien:

      a. blijkt dat de kiezer niet zelf de gemachtigde heeft aangewezen;

      b. aan de kiezer die het verzoek heeft ingediend reeds is toegestaan in een stembureau van zijn keuze of per brief
      te stemmen;

      c. degene die als gemachtigde is aangewezen, de aanwijzing in strijd met het bepaalde in [artikel L 4][ref1] heeft
      aangenomen;

      d. degene die als gemachtigde is aangewezen, niet als kiesgerechtigde is geregistreerd binnen het gebied waarvoor
      de verkiezing geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_4
        hoofdstuk: L
        paragraaf: '1'
        afdeling: II
  - number: L 11
    text: |-
      1 Zo spoedig mogelijk na ontvangst van het verzoek doch niet eerder dan op de dag van de kandidaatstelling wordt
      door de burgemeester of de door hem daartoe aangewezen ambtenaar een beslissing genomen.

      2 Bij inwilliging wordt een volmachtbewijs opgemaakt. Bij ministeriële regeling wordt voor dit bewijs een model
      vastgesteld. De inwilliging wordt aan de volmachtgever bekendgemaakt.

      3 Indien het verzoek niet in verdere behandeling kan worden genomen of moet worden afgewezen, wordt de beslissing
      met opgave van redenen op het verzoekschrift vermeld. Het verzoekschrift wordt dan aan de verzoeker teruggezonden,
      terwijl degene die zich bereid heeft verklaard als gemachtigde op te treden van de beslissing in kennis wordt
      gesteld.

      4 [Artikel D 9][ref1] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_9
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_11
    references:
