        artikel: K_3
        hoofdstuk: K
        afdeling: II
  - number: K 7
    text: |-
      De kiezer die zijn werkelijke woonplaats buiten Nederland heeft, dient, indien hij in een stembureau van zijn keuze
      wenst te stemmen, gelijktijdig met het registratieverzoek, bedoeld in [artikel D 3][ref1], daartoe een schriftelijk
      verzoek in bij de burgemeester van 's-Gravenhage. Voor het verzoekschrift wordt gebruik gemaakt van een formulier
      dat is opgenomen in het in [artikel D 3, negende lid][ref2], bedoelde formulier,


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_7
