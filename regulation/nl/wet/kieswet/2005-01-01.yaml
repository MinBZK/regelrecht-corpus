        paragraaf: '4'
        afdeling: II
  - number: P 15
    text: |-
      1 In de volgorde van de aantallen op hen uitgebrachte stemmen zijn gekozen die kandidaten die op de gezamenlijke
      lijsten waarop zij voorkomen, een aantal stemmen hebben verkregen, groter dan 25% van de kiesdeler, voor zover aan
      de lijstengroep, het niet van een lijstengroep deel uitmakend stel gelijkluidende lijsten of de op zichzelf staande
      lijst voldoende zetels zijn toegewezen. Indien aantallen gelijk zijn, beslist zo nodig het lot.

      2 Indien het aantal bij de verkiezing te verdelen zetels minder dan negentien bedraagt, wordt bij de toepassing van
      het eerste lid niet 25% van de kiesdeler, maar de helft van de kiesdeler in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_15
  - number: P 16
    text: |-
      1 Betreft het een lijstengroep, dan geldt, indien een aldus gekozen kandidaat op meer dan één lijst of stel
      gelijkluidende lijsten is vermeld, die kandidaat als gekozen op de lijst of het stel gelijkluidende lijsten waarop
      het grootste aantal stemmen op hem is uitgebracht; voor zover aan die lijst of dat stel gelijkluidende lijsten
      voldoende zetels zijn toegewezen. Voor zover aantallen gelijk zijn, geldt hij als gekozen op de lijst, ingeleverd
      in de kieskring met het laagste nummer, dan wel op het stel gelijkluidende lijsten waartoe de lijst behoort,
      ingeleverd in de kieskring met het laagste nummer.

      2 Indien aan geen van de lijsten of stellen gelijkluidende lijsten waarop de gekozen kandidaat is vermeld,
      voldoende zetels zijn toegewezen, wordt aan hem niettemin een zetel toegewezen op de lijst of het stel
      gelijkluidende lijsten waarop hij het grootste aantal stemmen heeft verkregen, en vervalt daartegenover de zetel
      die met toepassing van [artikel P 12][ref1] of [P 13][ref2] het laatst was toegewezen aan een van de lijsten of
      stellen gelijkluidende lijsten van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_13
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelP_16
    references:
