  - number: C 4
    text: |-
      1 De leden van provinciale staten onderscheidenlijk gemeenteraden worden gekozen voor vier jaren.

      2 Zij treden tegelijk af met ingang van de donderdag in de periode van 10 tot en met 16 maart of, in een
      schrikkeljaar met ingang van de donderdag in de periode van 9 tot en met 15 maart.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelC_4
  - number: C 5
    text: |-
      Degene die ter vervulling van een opengevallen plaats tot lid is benoemd, treedt af op het tijdstip waarop degene
      in wiens plaats hij is benoemd, zou hebben moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelC_5
  - number: D 1
    text: |-
      Burgemeester en wethouders registreren de kiesgerechtigdheid van de ingezetenen van de gemeente in de gemeentelijke
      administratie.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelD_1
  - number: D 3
    text: |-
      1 Burgemeester en wethouders van 's-Gravenhage registreren voor elke verkiezing van de Tweede Kamer de
      kiesgerechtigdheid van personen die hun werkelijke woonplaats buiten Nederland hebben, indien dezen daartoe een
      schriftelijk verzoek hebben ingediend.

      2 Het verzoek wordt niet eerder ingediend dan zes maanden voor de dag van stemming.

      3 Het verzoek wordt ingediend bij het hoofd van de consulaire post waaronder de woonplaats van verzoeker
      ressorteert. Deze zendt het verzoekschrift zo spoedig mogelijk door naar burgemeester en wethouders van 's-
      Gravenhage.

      4 Indien het verzoek wordt gedaan door een persoon als bedoeld in [artikel B 1, tweede lid, onder a][ref1], wordt
      het verzoek ingediend bij de vertegenwoordiger van Nederland in de Nederlandse Antillen of in Aruba. Deze zendt het
      verzoekschrift zo spoedig mogelijk door naar burgemeester en wethouders van 's-Gravenhage.

      5 Indien het verzoek wordt gedaan door een persoon als bedoeld in [artikel B 1, tweede lid, onder b][ref2],
      die niet gedurende ten minste tien jaren zijn werkelijke woonplaats in Nederland heeft gehad, wordt het verzoek
      ingediend bij Onze Minister onder wiens ministerie de werkzaamheden van de betrokken functionaris ressorteren. Deze
      zendt het verzoekschrift zo spoedig mogelijk door naar burgemeester en wethouders van 's-Gravenhage.

      6 Indien het verzoek wordt gedaan door een persoon die zijn werkelijke woonplaats heeft in een land waarmee
      Nederland geen diplomatieke betrekkingen onderhoudt, wordt het verzoek ingediend bij burgemeester en wethouders van
      's-Gravenhage.

      7 Het verzoek dient uiterlijk zes weken voor de dag van stemming te zijn ontvangen door het orgaan waarbij het moet
      worden ingediend.

      8 Burgemeester en wethouders van 's-Gravenhage beslissen op het verzoek uiterlijk op de zevende dag nadat zij dit
      hebben ontvangen.

      9 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verzoeken, kosteloos,
      voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor de formulieren een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
