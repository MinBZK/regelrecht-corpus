  - number: M 5
    text: |-
      Bij de naam van de kiezer aan wie is toegestaan per brief te stemmen, wordt in het in
      [artikel J 17, eerste lid][ref1], bedoelde afschrift de aantekening "brief" geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
