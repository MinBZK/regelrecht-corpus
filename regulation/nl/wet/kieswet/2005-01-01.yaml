  - number: U 17
    text: |-
      Het centraal stembureau kan, hetzij ambtshalve, hetzij naar aanleiding van een met opgave van redenen gedaan
      verzoek van een of meer leden van de staten van een provincie, tot een nieuwe opneming van stembiljetten uit een of
      meer provincies overgaan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelU_17
  - number: U 18
    text: |-
      1 Zodra de uitslag van de verkiezing is vastgesteld, worden de geopende verzegelde pakken, nadat alle stembiljetten
      weer daarin zijn gedaan, opnieuw verzegeld.

      2 Het proces-verbaal, bedoeld in [artikel U 16][ref1], en de verzegelde pakken blijven berusten onder het centraal
      stembureau. Zodra over de toelating van de gekozenen is beslist, worden de verzegelde pakken vernietigd. Van deze
      vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelU_16
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelU_18
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: U_16
        hoofdstuk: U
        paragraaf: '4'
        afdeling: III
  - number: V 1
    text: |-
      1 De voorzitter van het centraal stembureau geeft de benoemde schriftelijk kennis van zijn benoeming. De brief,
      houdende deze kennisgeving, wordt uiterlijk de dag na de vaststelling van de uitslag van de verkiezing of na de
      benoemdverklaring uitgereikt. Ten aanzien van de verkiezing van de Tweede Kamer respectievelijk de Eerste Kamer der
      Staten-Generaal vindt deze uitreiking plaats door overhandiging van de brief door de voorzitter van het centraal
      stembureau aan de voorzitter van de Tweede Kamer respectievelijk de Eerste Kamer der Staten-Generaal.

      2 Indien de benoemde een gemachtigde heeft aangewezen, geschiedt de toezending of uitreiking aan die gemachtigde.

      3 De voorzitter geeft tegelijkertijd schriftelijk kennis van de benoeming aan het vertegenwoordigend orgaan. Deze
      kennisgeving strekt de benoemde tot geloofsbrief.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_1
  - number: V 2
    text: |-
      1 De benoemde draagt er zorg voor dat uiterlijk op de tiende of, bij een benoeming in een na de eerste samenkomst
      van het nieuw gekozen orgaan opengevallen plaats, de achtentwintigste dag na de dagtekening van de kennisgeving van
      benoeming het vertegenwoordigend orgaan van hem, onderscheidenlijk van de gemachtigde, bij brief of telegrafisch
      mededeling ontvangt dat hij de benoeming aanneemt.

      2 Is binnen die tijd de mededeling niet ontvangen, dan wordt hij geacht de benoeming niet aan te nemen.

      3 De voorzitter van het vertegenwoordigend orgaan deelt aan de voorzitter van het centraal stembureau onverwijld
      mede, dat de benoemde de benoeming heeft aangenomen, dan wel dat hij geacht wordt de benoeming niet aan te nemen.

      4 Indien de benoemde de benoeming niet aanneemt, doet hij of zijn gemachtigde daarvan binnen de in het eerste lid
      bedoelde termijn bij brief of telegrafisch mededeling aan de voorzitter van het centraal stembureau. Deze geeft
      hiervan kennis aan het vertegenwoordigend orgaan.

      5 Zolang nog niet, of nog niet onherroepelijk, tot toelating van de benoemde is besloten, kan deze,
      onderscheidenlijk zijn gemachtigde, bij brief of telegrafisch aan het vertegenwoordigend orgaan mededelen dat
      hij op de aanneming van de benoeming terugkomt. Hij wordt dan geacht de benoeming niet te hebben aangenomen. De
      voorzitter van het vertegenwoordigend orgaan geeft van de ontvangst van deze mededeling onverwijld kennis aan de
      voorzitter van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_2
  - number: V 3
    text: |-
      1 Tegelijk met de mededeling dat hij zijn benoeming aanneemt, legt de benoemde, onderscheidenlijk zijn gemachtigde,
      aan het vertegenwoordigend orgaan een door hem ondertekende verklaring over, vermeldende alle openbare betrekkingen
      die de benoemde bekleedt.

      2 Tenzij de benoemde op het tijdstip van benoeming reeds lid van het vertegenwoordigend orgaan was, legt hij tevens
      een gewaarmerkt afschrift van gegevens uit de basisadministratie persoonsgegevens van de gemeente waar hij als
      ingezetene is ingeschreven over, waaruit zijn woonplaats, datum en plaats van de geboorte, alsmede, indien het
      betreft een benoeming tot lid van de Tweede of Eerste Kamer of provinciale staten, zijn Nederlanderschap blijken.

      3 De gemachtigde van de benoemde die buiten Nederland woonplaats heeft, legt in plaats van het afschrift, bedoeld
      in het tweede lid, een uittreksel uit de geboorteregisters over, waaruit datum en plaats van de geboorte van de
      benoemde blijken, alsmede een bewijs van Nederlanderschap betreffende de benoemde.

      4 Indien een tot lid van de gemeenteraad benoemde persoon geen onderdaan is van een lid-staat van de Europese
      Unie, legt hij een gewaarmerkt afschrift van gegevens uit de basisadministratie persoonsgegevens van de gemeente
      waar hij als ingezetene is ingeschreven over, waaruit blijkt of hij voldoet aan de vereisten, bedoeld in
      [artikel 10, tweede lid, van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel10
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_3
