  - number: Y 8
    text: |-
      1 De stemming voor de verkiezing van de leden van het Europees Parlement vindt plaats op de donderdag, gelegen in
      de daarvoor ingevolge artikel 11, eerste en tweede lid, van de Akte bepaalde periode.

      2 De kandidaatstelling vindt plaats op de drieënveertigste dag voor de stemming.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelY_8
  - number: Y 9
    text: |-
      1 De Kiesraad treedt op als centraal stembureau.

      2 Waar in de [hoofdstukken H][ref1] en [I][ref2] sprake is van het hoofdstembureau, treedt daarvoor in de plaats
      het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukH
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukI
