  - number: M 1
    text: |-
      Bij de verkiezing van de leden van de Tweede Kamer wordt aan de kiezer die op de dag van de kandidaatstelling zijn
      werkelijke woonplaats buiten Nederland heeft, dan wel op de dag der stemming wegens zijn beroep of werkzaamheden
      of wegens het beroep of de werkzaamheden van zijn echtgenoot, geregistreerde partner, levensgezel of ouder, buiten
      Nederland zal verblijven, overeenkomstig het bepaalde in dit hoofdstuk op zijn verzoek toegestaan per brief te
      stemmen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_1
  - number: M 2
    text: |-
      1 De aan de kiezer ten bewijze van de voldoening aan zijn verzoek te verstrekken verklaring draagt de naam van
      briefstembewijs.

      2 Een aan de kiezer verzonden briefstembewijs kan niet door een nieuw worden vervangen.

      3 Aan de kiezer aan wie een briefstembewijs is verstrekt, wordt geen oproepingskaart toegezonden. Hij mag slechts
      op de in artikel M 7 aangewezen wijze aan de stemming deelnemen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_2
  - number: M 3
    text: |-
      1 De kiezer die zijn werkelijke woonplaats buiten Nederland heeft, dient, indien hij per brief wenst te stemmen,
      gelijktijdig met het registratieverzoek, bedoeld in [artikel D 3][ref1], daartoe een schriftelijk verzoek
      in bij de burgemeester van 's-Gravenhage. De overige kiezers dienen een zodanig verzoekschrift uiterlijk
      op de achtentwintigste dag voor de stemming in bij de burgemeester van de gemeente waar zij als kiezer zijn
      geregistreerd. In het verzoekschrift geeft de kiezer een adres op buiten Nederland waar hij de stukken, bedoeld in
      [artikel M 6, eerste lid][ref2], wenst te ontvangen.

      2 Voor het verzoekschrift, bedoeld in het eerste lid, eerste volzin, wordt gebruik gemaakt van een formulier dat is
      opgenomen in het in [artikel D 3, negende lid][ref3], bedoelde formulier.

      3 Voor het verzoekschrift, bedoeld in het eerste lid, tweede volzin, wordt gebruik gemaakt van een formulier dat
      ter secretarie van elke gemeente, kosteloos, verkrijgbaar is. Bij ministeriële regeling wordt voor het formulier
      een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
