        artikel: C_3
        hoofdstuk: C
        afdeling: II
  - number: F 2
    text: |-
      In geval van ontbinding van de Tweede Kamer vindt de kandidaatstelling plaats binnen veertig dagen na de
      dagtekening van het koninklijk besluit tot ontbinding, op een bij dat besluit te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelF_2
  - number: G 1
    text: |-
      1 Een politieke groepering die een vereniging is met volledige rechtsbevoegdheid kan aan het centraal stembureau
      voor de verkiezing van de leden van de Tweede Kamer schriftelijk verzoeken de aanduiding waarmee zij voor die
      verkiezing op de kandidatenlijst wenst te worden vermeld, in te schrijven in een register dat door het centraal
      stembureau wordt bijgehouden. Verzoeken, ingediend na de drieënveertigste dag voor de kandidaatstelling, blijven
      voor de daaropvolgende verkiezing buiten behandeling.

      2 Voor de in het eerste lid bedoelde registratie moet een waarborgsom van € 450 worden betaald aan het Rijk. Degene
      die de betaling heeft verricht, ontvangt een bewijs daarvan. Na inlevering van een geldige kandidatenlijst voor de
      eerstkomende verkiezing na de beslissing op het verzoek wordt hem de waarborgsom teruggegeven.

      3 Bij het verzoek worden overgelegd:

      a. een afschrift van de notariële akte waarin de statuten van de vereniging zijn opgenomen;

      b. een bewijs van inschrijving in het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref1];

      c. het in het tweede lid bedoelde bewijs van betaling;

      d. een verklaring van de politieke groepering, houdende aanwijzing van haar gemachtigde en plaatsvervangend
      gemachtigde bij het centraal stembureau, welke geldt zolang zij niet door een andere is vervangen.

      4 Het centraal stembureau beschikt slechts afwijzend op het verzoek, indien:

      a. de aanduiding strijdig is met de openbare orde;

      b. de aanduiding geheel of in hoofdzaak overeenstemt met een reeds geregistreerde aanduiding van een andere
      politieke groepering, of met een aanduiding waarvoor reeds eerder op grond van dit artikel een registratieverzoek
      is ingediend, en daardoor verwarring te duchten is;

      c. de aanduiding anderszins misleidend is voor de kiezers;

      d. de aanduiding meer dan 35 letters of andere tekens bevat;

      e. de aanduiding geheel of in hoofdzaak overeenstemt met die van een rechtspersoon die bij onherroepelijke
      rechterlijke uitspraak verboden is verklaard en deswege is ontbonden;

      f. het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak gelijkluidende aanduiding, tenzij dat andere verzoek reeds op een der
      onder *a* tot en met *e* genoemde gronden moet worden afgewezen.

      5 De beslissing van het centraal stembureau op het verzoek wordt aan de gemachtigde bekendgemaakt. Van de
      beslissing wordt mededeling gedaan in de Nederlandse Staatscourant.

      6 Een politieke groepering waarvan de aanduiding is ingeschreven in het register, kan schriftelijk een verzoek tot
      wijziging van deze aanduiding indienen bij het centraal stembureau. De laatste volzin van het eerste lid, alsmede
      het vierde en vijfde lid zijn op verzoeken tot wijziging van overeenkomstige toepassing.

      7 Het centraal stembureau schrapt de aanduiding in het register en doet hiervan mededeling in de *Nederlandse
      Staatscourant*, wanneer:

      a. de politieke groepering heeft opgehouden te bestaan;

      b. de politieke groepering een verzoek daartoe heeft gedaan;

      c. de politieke groepering als vereniging bij onherroepelijke rechterlijke uitspraak verboden is verklaard en
      deswege is ontbonden;

      d. voor de laatstgehouden verkiezing van de leden van de Tweede Kamer geen gebruik is gemaakt van de bevoegdheid,
      bedoeld in het [tweede of derde lid van artikel H 3][ref2].

      8 Op de veertiende dag voor de kandidaatstelling voor de verkiezing van de leden van de Tweede Kamer, alsmede
      op de veertigste dag voor de kandidaatstelling voor de verkiezing van de leden van provinciale staten of van de
      gemeenteraad, brengt het centraal stembureau de door hem geregistreerde aanduidingen van politieke groeperingen,
      voor zover de registratie daarvan onherroepelijk is, alsmede de namen van de gemachtigden en hun plaatsvervangers
      ter openbare kennis in de Nederlandse Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
