  - number: M 12
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen per brief.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_12
  - number: M 13
    text: |-
      1 Onze Minister van Buitenlandse Zaken kan in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in een land een diplomatieke of consulaire vertegenwoordiging van Nederland aanwijzen waar een
      briefstembureau wordt ingesteld. Van deze aanwijzing wordt mededeling gedaan in de *Nederlandse Staatscourant*.

      2 Een briefstembureau kan ook voor kiesgerechtigden die hun werkelijke woonplaats in een ander land hebben dan het
      land waarin de diplomatieke of consulaire vertegenwoordiging van Nederland gevestigd is, worden ingesteld.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt in de Nederlandse Antillen en in Aruba
      briefstembureaus in bij de Vertegenwoordiging van Nederland.

      4 De leden en plaatsvervangende leden van de in het eerste en het derde lid bedoelde briefstembureaus worden
      tijdig voor elke verkiezing benoemd door Onze Minister van Buitenlandse Zaken, onderscheidenlijk Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_13
  - number: M 14
    text: |-
      De burgemeester van 's-Gravenhage of de door hem daartoe aangewezen ambtenaar zendt de ingewilligde
      verzoekschriften, afkomstig van personen die hun werkelijke woonplaats hebben in een land als bedoeld in
      [artikel M 13][ref1] of daar op de dag der stemming zullen verblijven, zo spoedig mogelijk per diplomatieke
      post naar het hoofd van de ingevolge [artikel M 13, eerste lid][ref2], aangewezen diplomatieke of consulaire
      vertegenwoordiging van Nederland in het desbetreffende land dan wel naar de vertegenwoordiger van Nederland in de
      Nederlandse Antillen of in Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_13
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_14
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: M_13
        hoofdstuk: M
