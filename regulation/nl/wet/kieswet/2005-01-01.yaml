  - number: W 2
    text: |-
      1 Bij de toepassing van [artikel W 1][ref1] wordt buiten rekening gelaten de kandidaat:

      a. die is overleden;

      b. wiens vacature vervuld wordt;

      c. die in de vacature benoemd is verklaard, maar schriftelijk verklaard heeft of geacht wordt de benoeming niet
      aan te nemen, de in [artikel V 3][ref2] genoemde stukken niet tijdig heeft ingezonden of bij onherroepelijk besluit
      niet tot het vertegenwoordigend orgaan is toegelaten;

      d. die lid is van het vertegenwoordigend orgaan of als zodanig benoemd is verklaard, terwijl over zijn toelating
      als lid nog niet onherroepelijk is beslist;

      e. van wie door de voorzitter van het centraal stembureau een schriftelijke verklaring is ontvangen dat hij niet
      voor benoeming in aanmerking wenst te komen;

      f. die, indien het de verkiezing van provinciale staten onderscheidenlijk de gemeenteraad betreft,
      niet benoembaar is ingevolge het bepaalde in [artikel 12 van de Provinciewet][ref3] onderscheidenlijk
      [artikel 11 van de Gemeentewet][ref4].

      2 Een verklaring als bedoeld in het eerste lid, onder *e*, kan worden ingetrokken.

      3 Bij ministeriële regeling wordt een model vastgesteld voor de verklaring, bedoeld in het eerste lid, onder *e*.


