  - number: U 16
    text: |-
      1 De voorzitter van het centraal stembureau maakt de uitslag van de verkiezing zo spoedig
      mogelijk bekend. De bekendmaking geschiedt in een openbare zitting van het centraal stembureau. De
      [artikelen P 20, tweede tot en met vierde lid][ref1], en [P 22][ref2] zijn van toepassing.

      2 De voorzitter van het centraal stembureau maakt de uitslag van de verkiezing zo spoedig mogelijk openbaar door
      plaatsing van een afschrift van het proces-verbaal van de zitting in de Nederlandse Staatscourant.

      3 De voorzitter van het centraal stembureau doet een afschrift van het proces-verbaal toekomen aan de Eerste Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelU_16
