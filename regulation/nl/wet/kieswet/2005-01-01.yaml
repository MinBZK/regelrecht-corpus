  - number: D 9
    text: |-
      1 Tegen een beschikking als bedoeld in de [artikelen D 3, achtste lid][ref1], [D 6][ref2] en [D 8][ref3] kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 [Artikel 7:1][ref4] en [titel 8.3 van de Algemene wet bestuursrecht][ref5] blijven buiten toepassing.

      3 In afwijking van [artikel 8:41, tweede lid, van de Algemene wet bestuursrecht][ref6] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling kan een kortere termijn stellen.

      4 De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref7].
      [Afdeling 8.2.4][ref8] blijft buiten toepassing. Aan burgemeester en wethouders wordt terstond een afschrift van
      het beroepschrift gezonden.


