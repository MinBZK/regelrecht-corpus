  - number: W 3
    text: |-
      1 Indien bij de toepassing van de bepalingen van dit hoofdstuk geen kandidaat meer voor benoeming in aanmerking
      komt op de lijst waarop degene is gekozen die moet worden vervangen, en deze lijst te zamen met één of meer
      andere lijsten een lijstengroep, onderscheidenlijk een lijstencombinatie, vormt, gaat de zetel door toepassing
      van [artikel P 13][ref1], onderscheidenlijk [artikel U 13][ref2], over op één van die andere lijsten. De kandidaat
      van deze lijst die naar de volgorde, vastgesteld overeenkomstig [artikel P 19][ref3], voor benoeming in aanmerking
      komt, wordt benoemd verklaard. Komt ook op deze lijst geen kandidaat meer voor benoeming in aanmerking, dan wordt
      de plaats aan een andere van de groep, onderscheidenlijk de combinatie, deel uitmakende lijst toegekend door
      verdere toepassing van het in dit lid bepaalde, en zo vervolgens.

      2 Bij de toepassing van het eerste lid komen het eerst in aanmerking de lijsten die te zamen met de desbetreffende
      lijst een lijstengroep vormen en vervolgens de lijsten die met die lijst tot een lijstencombinatie zijn verbonden.


