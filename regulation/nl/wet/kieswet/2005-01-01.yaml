  - number: G 6
    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende het betalen van waarborgsommen ten
      behoeve van de registratie.

      2 Bij ministeriële regeling worden modellen vastgesteld voor de registers waarin de aanduidingen voor politieke
      groeperingen worden vermeld, de openbare kennisgevingen inzake de geregistreerde aanduidingen en de namen van de
      gemachtigden en hun plaatsvervangers, alsmede voor de bewijzen van betaling van de waarborgsom.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelG_6
  - number: H 1
    text: |-
      1 Op de dag van de kandidaatstelling kunnen bij de voorzitter van het hoofdstembureau of bij het door deze aan te
      wijzen lid van dat bureau, op de secretarie van de gemeente waar dit bureau is gevestigd, van negen tot vijftien
      uur, kandidatenlijsten worden ingeleverd. Ten minste drie weken voor de kandidaatstelling brengt de burgemeester
      van elke gemeente dit ter openbare kennis.

      2 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de kandidatenlijsten,
      kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een model
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_1
  - number: H 2
    text: |-
      1 Bij een verkiezing van de leden van de Tweede Kamer, onderscheidenlijk provinciale staten van een provincie
      die uit meer dan één kieskring bestaat, kan, indien in alle kieskringen aan de verkiezing wordt deelgenomen met
      kandidatenlijsten waarop meer dan dertig namen van kandidaten zijn geplaatst en waarvan behoudens ten hoogste
      de laatste vijf, de namen dezelfden zijn en in dezelfde volgorde zijn geplaatst, worden volstaan met inlevering
      bij één hoofdstembureau. Voor zover het kandidatenlijsten betreft waarop alle kandidaten dezelfden zijn en in
      dezelfde volgorde zijn geplaatst, kan voor kandidatenlijsten van politieke groeperingen wier aanduiding was
      geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden verkiezing van de leden van de Tweede Kamer,
      onderscheidenlijk provinciale staten, een of meer zetels zijn toegekend, worden volstaan met inlevering van
      één lijst bij één hoofdstembureau. Het bepaalde in de vorige volzinnen is mede van toepassing ten aanzien van
      samenvoeging van aanduidingen van twee of meer groeperingen, indien bij de laatstgehouden verkiezing van de leden
      van het desbetreffende vertegenwoordigende orgaan, hetzij aan de gezamenlijke groeperingen, hetzij aan ten minste
      één daarvan, één of meer zetels zijn toegekend.

      2 De in het eerste lid bedoelde inlevering geschiedt bij het hoofdstembureau van kieskring 12 ('s-Gravenhage),
      indien het betreft een verkiezing van de leden van de Tweede Kamer, en bij het hoofdstembureau van de kieskring
      waarin de gemeente is gelegen waar de vergadering van de staten wordt gehouden, indien het betreft een verkiezing
      van de leden van provinciale staten. Voor de toepassing van de [artikelen H 11][ref1] en [I 10, derde lid][ref2],
      wordt deze inlevering geacht te hebben plaatsgevonden in alle kieskringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_10
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_2
