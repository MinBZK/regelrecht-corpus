  - number: I 9
    text: |-
      1 Zodra de termijn, bedoeld in [artikel I 7, eerste lid][ref1], is verstreken zonder dat beroep is ingesteld, of in
      geval van beroep, zodra aan [het vijfde lid van artikel I 7][ref2] toepassing is gegeven, deelt de voorzitter van
      het hoofdstembureau onverwijld aan het centraal stembureau mede, welke geldige lijsten zijn ingeleverd. Hij geeft
      daarbij aan welke wijzigingen daarin zijn aangebracht na de dag van de kandidaatstelling. Indien gebruik wordt
      gemaakt van de mogelijkheid, bedoeld in [artikel H 2, eerste lid][ref3], vindt eenzelfde mededeling plaats aan de
      overige hoofdstembureaus.

      2 Indien het betreft de verkiezing van de leden van de gemeenteraad of van provinciale staten van een provincie
      die één kieskring vormt, kan de mededeling aan het centraal stembureau achterwege blijven. Voor de toepassing van
      [artikel I 17, eerste lid][ref4], wordt zij geacht onverwijld te zijn gedaan.

      3 Bij ministeriële regeling wordt voor deze mededeling een model vastgesteld.


