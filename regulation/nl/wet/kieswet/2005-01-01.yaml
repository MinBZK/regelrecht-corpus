        bwb_id: BWBR0004627
        artikel: D_9
        hoofdstuk: D
        afdeling: II
  - number: L 12
    text: De burgemeester houdt aantekening van de namen van de kiezers die een aanwijzing als gemachtigde hebben aangenomen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_12
  - number: L 13
    text: |-
      1 De burgemeester doet het volmachtbewijs aan de gemachtigde toekomen.

      2 Bij de naam van de kiezer, ten behoeve van wie aan een gemachtigde een volmachtbewijs is toegezonden, wordt in
      het in [artikel J 17, eerste lid][ref1], bedoelde afschrift de aantekening "volmacht" geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_13
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_17
        hoofdstuk: J
        paragraaf: '4'
        afdeling: II
  - number: L 14
    text: |-
      1 De kiezer kan een andere kiezer die op de dag van de kandidaatstelling in hetzelfde stemdistrict als hij staat
      ingeschreven, machtigen in het stembureau van dat stemdistrict voor hem te stemmen.

      2 Hij tekent daartoe het formulier dat voorkomt op de oproepingskaart en laat de kaart door de gemachtigde mede-
      ondertekenen.

      3 Hij draagt de aldus in een volmachtbewijs omgezette oproepingskaart aan de gemachtigde over.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_14
  - number: L 15
    text: |-
      Indien bij aanmelding van de gemachtigde blijkt dat de volmachtgever reeds zijn stem heeft uitgebracht, wordt de
      gemachtigde als zodanig niet tot de stemming toegelaten en wordt het volmachtbewijs door de voorzitter van het
      stembureau ingehouden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_15
  - number: L 16
    text: |-
      Indien na het uitbrengen van een stem door een gemachtigde de volmachtgever of een andere gemachtigde zich
      alsnog tot het uitbrengen van een stem aanmeldt, wordt deze niet tot de stemming toegelaten en wordt de daarbij
      overgelegde oproepingskaart of het daarbij overgelegde volmachtbewijs door de voorzitter van het stembureau
      ingehouden.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_16
  - number: L 17
    text: |-
      1 De gemachtigde overhandigt aan de voorzitter van het stembureau het volmachtbewijs.

      2 Het tweede lid van het stembureau houdt, door op het volmachtbewijs zijn paraaf te plaatsen, aantekening dat de
      gemachtigde zich heeft aangemeld.

      3 Indien een in een volmachtbewijs omgezette oproepingskaart als bedoeld in [artikel L 14][ref1] wordt overgelegd,
      plaatst het tweede lid tevens in het in [artikel J 17, eerste lid][ref2], bedoelde afschrift de aantekening
      "volmacht" bij de naam van de volmachtgever.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_14
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelL_17
