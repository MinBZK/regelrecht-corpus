  - number: B 4
    text: |-
      1 Onder ingezetenen van Nederland, van de provincie en van de gemeente verstaat deze wet hen die onderscheidenlijk
      in Nederland, in de provincie en in de gemeente werkelijke woonplaats hebben.

      2 Zij die als ingezetene met een adres zijn ingeschreven in de basisadministratie persoonsgegevens van een
      gemeente, worden voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats
      te hebben in die gemeente.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_4
  - number: B 5
    text: |-
      1 Van het kiesrecht zijn uitgesloten:

      a. zij die bij onherroepelijke rechterlijke uitspraak van het kiesrecht zijn ontzet;

      b. zij die krachtens onherroepelijke rechterlijke uitspraak wegens een geestelijke stoornis onbekwaam zijn
      rechtshandelingen te verrichten.

      De uitsluiting wordt beoordeeld naar de toestand op de dag van de kandidaatstelling.

      2 Onze Minister van Justitie draagt zorg, dat van elke onherroepelijke rechterlijke uitspraak als bedoeld in het
      eerste lid zo spoedig mogelijk mededeling wordt gedaan aan de burgemeester van de gemeente waar de betrokkene
      in de basisadministratie persoonsgegevens is ingeschreven of, als het een persoon betreft die niet in een
      basisadministratie persoonsgegevens is ingeschreven, aan de burgemeester van de gemeente 's-Gravenhage, met
      vermelding van naam, voorletters of voornamen, adres en geboortedatum alsmede van de duur van de uitsluiting.

      3 De burgemeester stelt na ontvangst van de in het tweede lid bedoelde mededeling betrokkene in kennis van zijn
      uitsluiting en de duur daarvan.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_5
  - number: B 6
    text: |-
      1 Kiesgerechtigde personen aan wie op de dag van de stemming rechtmatig hun vrijheid is ontnomen, oefenen hun
      kiesrecht uit door bij volmacht te stemmen.

      2 Deze beperking geldt niet:

      a. voor hen die op de dag van de stemming een zodanige feitelijke bewegingsvrijheid genieten dat zij in persoon aan
      de stemming kunnen deelnemen;

      b. voor hen die op grond van het regime van de inrichting waarin zij verblijven aanspraak hebben op periodiek
      verlof.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende het stemmen bij volmacht door
      de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelB_6
  - number: C 1
    text: |-
      1 De leden van de Tweede Kamer worden gekozen voor vier jaren.

      2 Zij treden tegelijk af op de donderdag op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip in
      de periode van 10 tot en met 16 maart of, in een schrikkeljaar, op de donderdag op een door de Voorzitter van de
      Tweede Kamer te bepalen tijdstip in de periode van 9 tot en met 15 maart.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelC_1
  - number: C 2
    text: |-
      1 De leden van de Tweede Kamer, gekozen na ontbinding van de kamer, treden tegelijk af op een door de Voorzitter
      van de Tweede Kamer te bepalen tijdstip op de eerstvolgende donderdag in de in [artikel C 1][ref1], tweede lid,
      bedoelde periode nadat vier jaren zijn verstreken sedert de zitting van het centraal stembureau waarin de uitslag
      van de verkiezing is bekendgemaakt.

      2 Indien deze vier jaren eindigen in een periode, aanvangend met het in [artikel C 1][ref2], tweede lid, bedoelde
      tijdstip en op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip eindigend op de donderdag in de
      periode van 19 tot en met 25 mei, treden zij af met ingang van de eerstvolgende donderdag in de in dat lid bedoelde
      periode nadat drie jaren zijn verstreken sedert de zitting van het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_1
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelC_2
