  - number: M 10
    text: |-
      1 De voorzitter van het stembureau opent de retourenveloppe en neemt het briefstembewijs en de enveloppe met het
      stembiljet eruit. Hij controleert of de verklaring dat de kiezer het stembiljet persoonlijk heeft ingevuld, is
      ondertekend en of de daaronder geplaatste handtekening overeenstemt met de handtekening onder het verzoekschrift,
      bedoeld in [artikel M 4, vierde lid][ref1]. Vervolgens overhandigt hij het briefstembewijs aan het tweede lid van
      het stembureau.

      2 Het tweede lid van het stembureau houdt, door op het verzoekschrift zijn paraaf te stellen, aantekening dat de
      kiezer van zijn kiesrecht gebruik heeft gemaakt.

      3 De voorzitter overhandigt vervolgens de enveloppe met het stembiljet ongeopend aan het derde lid van het
      stembureau. Indien het stembiljet zich niet in de daartoe bestemde enveloppe bevindt, overhandigt de voorzitter het
      stembiljet, zonder het in te zien, dichtgevouwen aan het derde lid van het stembureau.

      4 Het derde lid van het stembureau steekt de enveloppe met het stembiljet in de stembus. Indien het stembiljet zich
      niet in de daartoe bestemde enveloppe bevindt, steekt het derde lid van het stembureau het stembiljet, zonder het
      in te zien, dichtgevouwen in de stembus.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_4
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelM_10
    references:
