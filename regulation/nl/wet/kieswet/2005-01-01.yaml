  - number: H 15
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld betreffende het betalen van waarborgsommen ten
      behoeve van de kandidatenlijsten. Bij ministeriële regeling worden voor de bewijzen van betaling van de waarborgsom
      modellen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelH_15
  - number: I 1
    text: |-
      1 Op de dag van de kandidaatstelling, om zestien uur, houdt het hoofdstembureau een zitting tot het onderzoeken van
      de kandidatenlijsten.

      2 Het hoofdstembureau draagt er zorg voor dat het centraal stembureau op de dag na de kandidaatstelling afschriften
      van de ingeleverde kandidatenlijsten ontvangt.

      3 Indien gebruik wordt gemaakt van de mogelijkheid, bedoeld in [artikel H 2][ref1], draagt het hoofdstembureau er
      zorg voor dat de overige hoofdstembureaus op de dag na de kandidaatstelling een afschrift van de kandidatenlijst
      ontvangen die voor de desbetreffende kieskring is ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_2
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelI_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_2
        hoofdstuk: H
        afdeling: II
  - number: I 2
    text: |-
      1 Indien bij het onderzoek blijkt van een of meer van de volgende verzuimen, geeft het hoofdstembureau onverwijld
      bij aangetekende brief of tegen gedagtekend ontvangstbewijs kennis aan degene die de lijst heeft ingeleverd:

      a. dat, indien bij de lijst verklaringen van ondersteuning moeten worden overgelegd, niet ten minste het aantal
      verklaringen, genoemd in [artikel H 4, eerste lid][ref1], is overgelegd, waarbij niet meetellen de verklaringen die
      niet aan het bepaalde in [artikel H 4, eerste lid, tweede volzin, en tweede lid][ref2], voldoen, de verklaringen
      waarop niet een aantekening als bedoeld in [artikel H 4, vierde lid][ref3], voorkomt en de verklaringen van een
      kiezer die meer dan één verklaring heeft ondertekend;

      b. dat, indien zich het geval voordoet, bedoeld in [artikel H 7, derde lid][ref4], de verklaring dat de kandidaat
      voornemens is zich bij benoeming te vestigen in de provincie, onderscheidenlijk gemeente, ontbreekt;

      c. dat een kandidaat niet is vermeld overeenkomstig het bepaalde krachtens [artikel H 8][ref5];

      d. dat ten aanzien van een kandidaat ontbreekt de verklaring dat hij instemt met zijn kandidaatstelling op de
      lijst;

      e. dat, indien het een verkiezing van de leden van de Tweede Kamer betreft, ten aanzien van een kandidaat die
      buiten Nederland woonplaats heeft in zijn verklaring van instemming de aanwijzing van een gemachtigde ontbreekt;

      f. dat, indien ten behoeve van de lijst een waarborgsom moet worden betaald, het bewijs dat deze betaling is
      verricht, ontbreekt;

      g. dat de lijst niet persoonlijk is ingeleverd door een kiezer, bevoegd tot deelneming aan de verkiezing;

      h. dat, indien de lijst is ingeleverd door een kiezer die niet als zodanig is geregistreerd in de gemeente waar het
      hoofdstembureau is gevestigd, deze kiezer niet heeft overgelegd een verklaring van burgemeester en wethouders van
      de gemeente waar hij is geregistreerd, dat hij bevoegd is tot deelneming aan de verkiezing;

      i. dat een verklaring, bedoeld in het [tweede of derde lid van artikel H 3][ref6], ontbreekt.

      2 Uiterlijk op de derde dag na de kandidaatstelling kan degene die de lijst heeft ingeleverd, het verzuim of de
      verzuimen, in de kennisgeving aangeduid, herstellen ter secretarie van de gemeente waar het hoofdstembureau is
      gevestigd, op de eerste en tweede dag van negen tot zeventien uur en op de derde dag van negen tot vijftien uur.

      3 In het geval, bedoeld in het eerste lid onder *g*, kan een kiezer die tot het inleveren van de lijst bevoegd zou
      zijn geweest, door persoonlijke verschijning ter secretarie zich alsnog in de plaats van de onbevoegde inleveraar
      stellen; hij wordt dan geacht de lijst persoonlijk te hebben ingeleverd. Het in de vorige volzin bepaalde
      vindt overeenkomstige toepassing, indien de verklaring, in het eerste lid onder *h* bedoeld, niet alsnog wordt
      overgelegd.

      4 Bij verhindering of ontstentenis van degene die de lijst heeft ingeleverd, treedt in diens plaats een ingevolge
      [artikel H 5, tweede volzin][ref7], op de lijst vermelde vervanger.


