  - number: K 11
    text: |-
      1 Bij de stemming overhandigt de kiezer de kiezerspas aan de voorzitter van het stembureau.

      2 Het tweede lid van het stembureau houdt door op de kiezerspas zijn paraaf te plaatsen aantekening dat de kiezer
      zich heeft aangemeld.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelK_11
  - number: K 12
    text: |-
      1 Burgemeester en wethouders kunnen in hun gemeente stembureaus aanwijzen die uitsluitend bestemd zijn voor
      het uitbrengen van stemmen op de wijze als geregeld in dit hoofdstuk, dan wel voor het, met inachtneming
      van de bepalingen van [hoofdstuk L][ref1], uitbrengen van een volmachtstem waarvoor de kiezer overeenkomstig
      [artikel L 8][ref2] is gemachtigd. Indien burgemeester en wethouders een dergelijk stembureau aanwijzen, brengt de
      burgemeester de adressen van deze stembureaus ten minste veertien dagen voor de stemming ter openbare kennis onder
      vermelding van de mogelijkheid aldaar met behulp van een kiezerspas een stem uit te brengen.

      2 Burgemeester en wethouders kunnen in afwijking van [artikel J 1, tweede lid][ref3], bepalen dat de stemming
      in deze stembureaus aanvangt op een eerder of een later tijdstip dan zeven uur dertig en eindigt op een eerder
      tijdstip dan eenentwintig uur. De tijdstippen worden in dat geval bekend gemaakt in de openbare kennisgeving,
      bedoeld in het eerste lid.

      3 De stemopneming vindt plaats om eenentwintig uur op een door burgemeester en wethouders vast te stellen en bekend
      te maken plaats. De plaats van stemopneming wordt bekend gemaakt in de openbare kennisgeving, bedoeld in het eerste
      lid.

      4 [Artikel J 17, eerste lid][ref4], is niet van toepassing op deze stembureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_17
