  - number: S 8
    text: |-
      1 Op de derde dag na de kandidaatstelling, tussen negen en zeventien uur, kunnen kandidatenlijsten van
      verschillende politieke groeperingen tot een lijstencombinatie worden verbonden door inlevering bij het centraal
      stembureau van een daartoe strekkende schriftelijke gemeenschappelijke verklaring van de op de lijsten vermelde
      gemachtigden.

      2 Zodanige verbinding kan slechts worden aangebracht:

      a. tussen politieke groeperingen waarvan de aanduiding voor de verkiezingen van de leden van de Eerste of Tweede
      Kamer ingevolge [artikel Q 6][ref1], onderscheidenlijk [artikel G 1][ref2], is geregistreerd;

      b. indien de combinatie betrekking heeft op alle in de onderscheidene provincies vanwege een groepering ingediende
      lijsten en

      c. indien de combinatie in alle provincies geschiedt met dezelfde groepering of groeperingen.

      3 Het bepaalde in het tweede lid, aanhef en onder *a*, is mede van toepassing ten aanzien van samenvoeging van
      aanduidingen van twee of meer groeperingen, indien de aldus gevormde aanduiding voorkomt op alle vanwege die
      groeperingen ingediende lijsten.

      4 Bij ministeriële regeling wordt voor de in het eerste lid bedoelde verklaring een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelQ_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
