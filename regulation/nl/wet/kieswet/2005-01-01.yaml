  - number: I 6
    text: |-
      1 Het hoofdstembureau schrapt, in de volgorde in dit lid aangewezen, van de lijst de naam van de kandidaat:

      a. die niet is vermeld overeenkomstig het bepaalde krachtens [artikel H 8][ref1];

      b. van wie niet is overgelegd de verklaring dat hij instemt met zijn kandidaatstelling op de lijst;

      c. wiens woonplaats buiten Nederland is gelegen, indien de aanwijzing van een gemachtigde ontbreekt;

      d. die tijdens de zittingsperiode van het orgaan waarvoor de verkiezing zal plaatshebben, niet de voor het zitting
      nemen in dat orgaan vereiste leeftijd bereikt;

      e. die bij een verkiezing van de leden van provinciale staten of van de gemeenteraad geen ingezetene is van de
      provincie, onderscheidenlijk de gemeente, en ten aanzien van wie de verklaring dat hij voornemens is zich bij
      benoeming te vestigen in de provincie, onderscheidenlijk gemeente, ontbreekt;

      f. die heeft verklaard dat hij voornemens is zich bij benoeming te vestigen in de provincie, onderscheidenlijk
      gemeente, en ten aanzien van wie blijkt dat hij tevens een zodanige verklaring heeft afgelegd voor de verkiezing
      van de leden van de staten van een andere provincie, onderscheidenlijk van de raad van een andere gemeente;

      g. die tenzij het kandidatenlijsten betreft als bedoeld in [artikel H 2, eerste lid][ref2], eerste volzin, voorkomt
      op meer dan één van de bij het hoofdstembureau ingeleverde lijsten;

      h. van wie een uittreksel uit het register van overlijden dan wel een afschrift van de akte van overlijden is
      overgelegd;

      i. die op de lijst voorkomt na het ten hoogste toegelaten aantal.

      2 Het hoofdstembureau schrapt, in de volgorde in dit lid aangewezen, de aanduiding van een politieke groepering,
      indien:

      a. een daarop betrekking hebbende verklaring als bedoeld in het [tweede of derde lid van artikel H 3][ref3]
      ontbreekt;

      b. de aanduiding geplaatst is boven meer dan één van de bij het hoofdstembureau ingeleverde lijsten.

      3 Indien de aanduiding van een politieke groepering niet in overeenstemming is met die waaronder zij is
      geregistreerd, brengt het hoofdstembureau deze ambtshalve daarmee in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_3
