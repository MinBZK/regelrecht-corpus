  - number: V 8
    text: |-
      Indien het orgaan waarvoor de benoeming is geschied, heeft besloten om één of meer van de benoemde leden wegens
      de onjuistheid van de vaststelling van de uitslag van de verkiezing niet toe te laten, wordt daarvan door de
      voorzitter onverwijld kennis gegeven aan het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_8
  - number: V 9
    text: |-
      1 Uiterlijk op de veertiende dag nadat de kennisgeving, bedoeld in artikel V 8, is ontvangen, houdt het centraal
      stembureau een openbare zitting en stelt het met inachtneming van de in artikel V 8 bedoelde beslissing de uitslag
      van de verkiezing voor zover nodig opnieuw vast.

      2 De [artikelen P 20][ref1] en [P 22 tot en met P 24 vinden ov][ref2]ereenkomstige toepassing.

      3 Het onderzoek van de geloofsbrief van de aldus nieuw gekozen verklaarde strekt zich niet uit tot punten, die het
      verloop van de verkiezing raken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_22
    url: https://wetten.overheid.nl/BWBR0004627/2005-01-01#ArtikelV_9
