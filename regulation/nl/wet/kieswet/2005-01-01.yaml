  - number: U 15
    text: |-
      1 Gekozen zijn de kandidaten van de lijst, daartoe aangewezen door overeenkomstige toepassing van de
      [artikelen P 15 tot en met P 18][ref1].

      2 De rangschikking van de kandidaten geschiedt overeenkomstig het bepaalde in [artikel P 19][ref2].

      3 In afwijking van de [artikelen P 15, eerste lid][ref3], en [P 19, tweede lid][ref4], zijn gekozen
      onderscheidenlijk worden gerangschikt in de volgorde van de aantallen op hen uitgebrachte stemmen, de kandidaten
      die op de gezamenlijke lijsten waarop zij voorkomen een aantal stemmen hebben verkregen dat groter is dan de helft
      van de kiesdeler.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
