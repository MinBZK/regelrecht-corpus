  - number: Pa 13
    text: |-
      1 In afwijking van [artikel H 10, eerste lid, eerste volzin][ref1], kan een kandidaat ervoor kiezen om in zijn
      verklaring van instemming geen gemachtigde aan te wijzen.

      2 Indien een kandidaat geen gemachtigde aanwijst, tekent hij op de verklaring van instemming, bedoeld in
      [artikel H 9, eerste lid][ref2], aan dat hij ermee instemt de kennisgeving van zijn benoeming te ontvangen via een
      elektronisch systeem voor gegevensverwerking waarin de geadresseerde toegang heeft tot het bericht via een publiek
      uitgegeven authenticatiemiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_10
