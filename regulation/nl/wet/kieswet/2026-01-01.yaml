  - number: Yb 5
    text: |-
      1 In aanvulling op de [artikelen I 4][ref1], [O 19, eerste lid][ref2], en [P 20, tweede lid][ref3], kunnen
      personen, aanwezig zijn door de zitting bij te wonen in een digitale omgeving. Daarnaast dienen geïnteresseerden de
      zitting op afstand te kunnen volgen door middel van een live-verbinding.

      2 Indien gewenst kunnen een of meer leden van het nationaal briefstembureau dan wel centraal stembureau de zitting
      in de digitale omgeving bijwonen.

      3 Een zitting als bedoeld in de [artikelen I 4][ref4], [O 19, eerste lid][ref5], en [P 20, tweede lid][ref6],
      vindt slechts doorgang voor zover:

      a. de leden zichtbaar en hoorbaar herkenbaar zijn op een zodanige wijze dat hun identiteit kan worden vastgesteld;

      b. de andere deelnemers zichtbaar en hoorbaar kunnen zijn voor zover de voorzitter hun het woord verleent; en

      c. de voorzitter in staat is de orde te handhaven.

      4 Indien een persoon om technische redenen niet in staat is om zijn bezwaar in de digitale omgeving zelf toe te
      lichten, kan hij de voorzitter verzoeken om dit namens hem te doen.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de digitale omgeving, de live-
      verbinding en de wijze waarop geïnteresseerden via de digitale omgeving bezwaren kunnen inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
