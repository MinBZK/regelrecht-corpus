  - number: P 1
    text: |-
      Onverwijld nadat het centraal stembureau het proces-verbaal van een gemeentelijk stembureau dan wel een
      hoofdstembureau heeft ontvangen, gaat het over tot het verrichten van de werkzaamheden ter vaststelling en
      bekendmaking van de uitslag van de verkiezing.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_1
  - number: P 1b
    text: |-
      1 Eenieder kan schriftelijk bij het centraal stembureau een onderbouwde melding maken van een vermeende fout in het
      proces-verbaal van een stembureau of gemeentelijk stembureau.

      2 Een melding als bedoeld in het eerste lid kan ook betrekking hebben op een vermeende fout in het met de
      programmatuur gegenereerde digitale bestand met de uitkomst van de stemming.

      3 De melding dient uiterlijk achtenveertig uur voorafgaand aan de zitting, bedoeld in
      [artikel P 20, tweede lid][ref1], door het centraal stembureau te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_1b
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_20
        hoofdstuk: P
        paragraaf: '4'
        afdeling: II
  - number: P 1c
    text: |-
      1 Het centraal stembureau controleert of het digitale bestand, bedoeld in [artikel Na 32, derde lid][ref1],
      overeenkomstig daaraan bij of krachtens algemene maatregel van bestuur gestelde eisen aan hem is verstrekt.

      2 Het centraal stembureau verzoekt het gemeentelijk stembureau dat het betreft alsnog onverwijld zorg te dragen
      voor verstrekking van het bestand overeenkomstig deze eisen, indien het constateert dat dat niet is gebeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_32
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_1c
