    text: |-
      In afwijking van [artikel P 19, vijfde lid][ref1], blijft de rangschikking achterwege ten aanzien van de verkiezing
      van de leden van het kiescollege, voor zover het lijsten betreft waarop geen kandidaten gekozen zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_19
