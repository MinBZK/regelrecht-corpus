      1 De retourenveloppe, bedoeld in [artikel M 7, zevende lid][ref1], dient uiterlijk op de vijfde dag na de dag van
      de stemming om zeventien uur Nederlandse tijd in het bezit te zijn van de burgemeester van ’s-Gravenhage.

      2 De burgemeester draagt er zorg voor dat de tijdig binnengekomen retourenveloppen, zo spoedig mogelijk maar
      uiterlijk op de vijfde dag na de dag van de stemming om eenentwintig uur ongeopend overhandigd worden aan de
      voorzitter van het briefstembureau, bedoeld in [artikel E 5, eerste lid][ref2].

      3 [Artikel M 8, derde en vierde lid][ref3], is van overeenkomstige toepassing.


