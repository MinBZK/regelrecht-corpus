  - number: M 7
    text: |-
      1 Een kiezer stemt door op het stembiljet:

      1°. het stemvakje, geplaatst vóór de lijst waartoe de kandidaat van zijn keuze behoort, in te kleuren met een kleur
      naar keuze; en vervolgens

      2°. het stemvakje, geplaatst vóór het nummer van de kandidaat van zijn keuze op die lijst, in te kleuren met een
      kleur naar keuze.

      2 Daarna vouwt hij het stembiljet dicht op zodanige wijze dat de namen van de kandidaten niet zichtbaar zijn en
      doet hij het stembiljet in de enveloppe voor het stembiljet dan wel een andere enveloppe.

      3 Hij ondertekent een op het briefstembewijs dan wel op het vervangend briefstembewijs gestelde verklaring, dat hij
      het stembiljet persoonlijk heeft ingevuld.

      4 Hij voegt een kopie van een identiteitsdocument toe dat bij algemene maatregel van bestuur is aangewezen.
      Het identiteitsdocument is geldig op de dag van de kandidaatstelling. Een persoon als bedoeld in
      [artikel B 1, tweede lid, onderdeel b][ref1], voegt een verklaring toe dat hij of een aan hem gerelateerde persoon
      in Nederlandse openbare dienst is.

      5 Vervolgens doet hij het briefstembewijs dan wel vervangend briefstembewijs, de kopie van het identiteitsdocument,
      indien van toepassing de verklaring vanwege de Nederlandse openbare dienst, en de enveloppe met het stembiljet in
      de toegestuurde retourenveloppe of een andere retourenveloppe en retourneert hij deze gesloten.

      6 Een kiezer kan de retourenveloppe per post of in persoon doen toekomen aan de burgemeester van ‘s-Gravenhage,
      onverminderd het zevende lid.

      a. Indien deze per post wordt geretourneerd, draagt de kiezer er zorg voor dat de retourenveloppe, is gefrankeerd.

      b. Indien de retourenveloppe persoonlijk wordt afgegeven, houdt degene die de retourenveloppe ten behoeve van de
      burgemeester in ontvangst neemt, daarvan aantekening door in ieder geval op de retourenveloppe de datum en het
      tijdstip van ontvangst en zijn handtekening te plaatsen.

      7 De kiezer kan de toegestuurde retourenveloppe of een andere retourenveloppe ook per post of in persoon doen
      toekomen aan het hoofd van een diplomatieke of consulaire vertegenwoordiging van Nederland in het buitenland.
      Het zesde lid is van overeenkomstige toepassing. Het hoofd van de diplomatieke of consulaire vertegenwoordiging
      draagt er zorg voor dat de retourenveloppe na ontvangst onverwijld wordt doorgezonden naar de burgemeester van ’s-
      Gravenhage. Daarbij draagt hij er zorg voor dat de retourenveloppen die uiterlijk op de vijfde dag voor de dag
      van de stemming om tien uur lokale tijd in zijn bezit zijn, tijdig in het bezit zijn van de burgemeester van ’s-
      Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelM_7
