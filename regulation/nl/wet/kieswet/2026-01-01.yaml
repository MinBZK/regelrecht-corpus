  - number: A 5
    text: |-
      1 De Kiesraad bestaat uit een voorzitter, zes andere leden en twee buitengewone leden. De Kiesraad kan uit de leden
      ondervoorzitters aanwijzen.

      2 De buitengewone leden oefenen alleen de taak van de Kiesraad, bedoeld in artikel A 3, eerste lid, onderdeel a,
      uit. Zij worden niet als ondervoorzitter aangewezen.

      3 Artikel 11 van de Kaderwet adviescolleges is van toepassing op de Kiesraad.

      4 De leden en de buitengewone leden van de Kiesraad worden benoemd op grond van hun deskundigheid op het gebied van
      het kiesrecht en de verkiezingen. [Artikel 12, derde lid, van de Kaderwet adviescolleges][ref1] is van toepassing.

      5 De leden en de buitengewone leden van de Kiesraad worden op eigen aanvraag door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties ontslagen. Zij kunnen voorts bij koninklijk besluit worden geschorst en ontslagen
      wegens ongeschiktheid, onbekwaamheid dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen
      redenen. De voordracht voor schorsing of ontslag wordt niet gedaan dan nadat de Kiesraad daarover is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel12
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_5
