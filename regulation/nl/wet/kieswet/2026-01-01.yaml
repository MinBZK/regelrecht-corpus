  - number: G 1a
    text: |-
      1 Een politieke groepering kan aan het centraal stembureau voor de verkiezing van de leden van
      de Tweede Kamer schriftelijk verzoeken haar logo bij te schrijven in het register, bedoeld in
      [artikel G 1][ref1] van de Kieswet. De verzoeken die zijn ontvangen of aangevuld als bedoeld in
      [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref2], na de tweeënveertigste dag voor de
      kandidaatstelling, blijven voor de daaropvolgende verkiezing buiten behandeling.

      2 Het centraal stembureau beschikt slechts afwijzend op het verzoek, indien:

      a. bij dat centraal stembureau de aanduiding van de politieke groepering niet is geregistreerd of, indien van
      toepassing, een reeds ingediend verzoek tot registratie van de aanduiding wordt afgewezen;

      b. het logo strijdig is met de openbare orde;

      c. het logo geheel of in hoofdzaak overeenstemt met een reeds geregistreerd logo van een andere politieke
      groepering, of met een logo waarvoor reeds eerder op grond van dit artikel een registratieverzoek is ontvangen, en
      daardoor verwarring te duchten is;

      d. het logo anderszins misleidend is voor de kiezers;

      e. het logo geheel of in hoofdzaak overeenstemt met dat van een rechtspersoon die bij onherroepelijke rechterlijke
      uitspraak verboden is verklaard en deswege is ontbonden;

      f. het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak overeenstemmend logo, tenzij dat andere verzoek reeds op een van de
      onder a tot en met e genoemde gronden moet worden afgewezen.

      3 Van de beslissing van het centraal stembureau op het verzoek wordt mededeling gedaan aan de gemachtigde en in
      de Staatscourant.

      4 Een politieke groepering waarvan het logo is bijgeschreven in het register, kan schriftelijk een verzoek tot
      wijziging van dit logo indienen bij het centraal stembureau. De laatste volzin van het eerste lid, alsmede het
      tweede en derde lid, zijn op verzoeken tot wijziging van overeenkomstige toepassing.

      5 Het centraal stembureau schrapt het logo van een politieke groepering wanneer het de aanduiding van die politieke
      groepering schrapt, dan wel op verzoek van die politieke groepering.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop een logo wordt
      overgelegd.


