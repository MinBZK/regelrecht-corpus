        paragraaf: '3'
        afdeling: V
  - number: Y 30
    text: |-
      Indien de voorzitter van de Tweede Kamer een bericht ontvangt van de voorzitter van het Europees Parlement dat het
      lidmaatschap van een lid van het Europees Parlement is beëindigd wegens ontslag, overlijden of het vervullen van
      een ingevolge de Akte onverenigbare functie, geeft hij hiervan onverwijld kennis aan de voorzitter van het centraal
      stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_30
  - number: Y 31
    text: |-
      De kiesgerechtigde niet-Nederlander die onderdaan is van een andere lidstaat van de Europese Unie die zijn
      werkelijke woonplaats in het Europese deel van Nederland heeft, neemt aan de verkiezing deel hetzij in het Europese
      deel van Nederland, hetzij in de lidstaat waarvan hij onderdaan is.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_31
  - number: Y 32
    text: |-
      1 Burgemeester en wethouders registreren de kiesgerechtigdheid van de in [artikel Y 3, onder b][ref1], bedoelde
      personen die ingezetene zijn van de gemeente, indien zij daartoe een schriftelijk verzoek hebben ingediend.

      2 Bij het verzoek vermeldt verzoeker zijn adres van verblijf en, voor zover van toepassing, de plaats in de
      lidstaat waarvan hij onderdaan is, waar hij het laatst als kiezer was geregistreerd. Bij het verzoek legt verzoeker
      een kopie over van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2]. Voorts
      verklaart hij dat hij in de lidstaat waarvan hij onderdaan is, niet van het kiesrecht is uitgesloten en dat hij het
      kiesrecht uitsluitend in Nederland zal uitoefenen.

      3 Verzoeken die worden ontvangen na de dag van de kandidaatstelling blijven voor de daaropvolgende verkiezing
      buiten beschouwing.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer het formulier voor het verzoek, kosteloos,
      voor de kiezers verkrijgbaar is. Van het formulier maken de verklaringen, bedoeld in het tweede lid, deel uit. Bij
      ministeriële regeling wordt voor het formulier een model vastgesteld.

      5 Burgemeester en wethouders zenden aan de niet-Nederlander, die de nationaliteit van een andere lidstaat van de
      Europese Unie heeft, en die zich van buiten het Europese deel van Nederland vestigt in de gemeente, een formulier
      toe waarmee hij registratie van zijn kiesgerechtigdheid kan verzoeken.

      6 Burgemeester en wethouders beslissen op het verzoek uiterlijk op de zevende dag nadat zij het verzoek hebben
      ontvangen en maken de beslissing onverwijld aan de verzoeker bekend.

      7 Indien burgemeester en wethouders van een andere lidstaat bericht hebben ontvangen dat een niet-Nederlander die
      onderdaan is van die lidstaat aldaar van het kiesrecht is uitgesloten, registreren zij de kiesgerechtigdheid van
      betrokkene niet.

      8 Nadat het verzoek om registratie is ingewilligd, delen burgemeester en wethouders aan de door de desbetreffende
      lidstaat aangewezen autoriteit mede, dat betrokkene in Nederland als kiezer is geregistreerd. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze en het tijdstip waarop deze
      mededeling dient te geschieden.

      9 Ten minste zes weken voor de kandidaatstelling doet de burgemeester van de mogelijkheid van registratie voor
      niet-Nederlanders die onderdanen zijn van andere lidstaten mededeling in het gemeenteblad.

      10 [Artikel D 8][ref3] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_3
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_32
