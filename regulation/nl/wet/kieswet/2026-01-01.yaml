  - number: W 2
    text: |-
      1 Bij de toepassing van [artikel W 1][ref1] wordt buiten rekening gelaten de kandidaat:

      a. die is overleden;

      b. aan wie tijdelijk ontslag is verleend wegens zwangerschap en bevalling of ziekte;

      c. wiens vacature vervuld wordt;

      d. die in de vacature benoemd is verklaard, maar schriftelijk verklaard heeft of geacht wordt de benoeming niet
      aan te nemen, de in [artikel V 3][ref2] genoemde stukken niet tijdig heeft ingezonden of bij besluit niet tot het
      vertegenwoordigend orgaan is toegelaten;

      e. die lid is van het vertegenwoordigend orgaan of als zodanig benoemd is verklaard, terwijl over zijn toelating
      als lid nog niet is beslist, tenzij hij is benoemd tot vervanger voor de plaats die is opengevallen als gevolg van
      een tijdelijk ontslag als bedoeld in [paragraaf 3 van hoofdstuk X][ref3];

      f. van wie door de voorzitter van het centraal stembureau een schriftelijke verklaring is ontvangen dat hij niet
      voor benoeming in aanmerking wenst te komen;

      g. die lid was van het vertegenwoordigend orgaan, terwijl ook ten aanzien van deze kandidaat ter kennis van de
      voorzitter van het centraal stembureau is gekomen dat in zijn opengevallen plaats moet worden voorzien;

      h. die, indien het de verkiezing van provinciale staten, het algemeen bestuur onderscheidenlijk de
      gemeenteraad betreft, niet benoembaar is ingevolge het bepaalde in [artikel 12 van de Provinciewet][ref4],
      [artikel 31b van de Waterschapswet][ref5] onderscheidenlijk [artikel 11 van de Gemeentewet][ref6].

      2 Een verklaring als bedoeld in het eerste lid, onder f, kan worden ingetrokken.

      3 Bij regeling van de Kiesraad wordt een model vastgesteld voor de verklaring, bedoeld in het eerste lid, onder
      f. Het door de Kiesraad vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


