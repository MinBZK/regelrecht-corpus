  - number: Ya 1
    text: |-
      Deze wet en de daarop berustende bepalingen is mede van toepassing in Bonaire, Sint Eustatius en Saba, met
      inachtneming van het in deze afdeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYa_1
  - number: Ya 2
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. openbaar lichaam: openbaar lichaam Bonaire, Sint Eustatius of Saba;

      b. het Gemeenschappelijk Hof: het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYa_2
  - number: Ya 3
    text: |-
      1 Voor de toepassing van de bij of krachtens deze wet gestelde bepalingen in Bonaire, Sint Eustatius en Saba wordt,
      voor zover deze afdeling niet anders bepaalt, telkens in die bepalingen gelezen in plaats van:

      a. «de gemeente»: het openbaar lichaam;

      b. «de burgemeester»: de gezaghebber;

      c. «burgemeester en wethouders»: het bestuurscollege;

      d. «de gemeenteraad»: de eilandsraad;

      e. «gemeentehuis»: het bestuurskantoor;

      f. «gemeenteblad»: afkondigingsblad;

      g. «gemeentelijk stembureau»: stembureau van het openbaar lichaam;

      h. «[artikel 1 van de Wet op de identificatieplicht][ref1]»: [artikel 2 van de Wet identificatieplicht BES][ref2].

      2 Indien uitsluitend de gemeente, de burgemeester of burgemeester en wethouders van ’s-Gravenhage wordt bedoeld,
      geldt het eerste lid, onder a tot en met c, niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
