    text: |-
      1 Indien de omstandigheden daartoe nopen, kunnen burgemeester en wethouders tot een dag voor de dag van de stemming
      een andere dan een eerder aangewezen locatie aanwijzen voor de zitting van een stembureau.

      2 Op de locatie die gelet op de in het eerste lid genoemde omstandigheden niet meer beschikbaar is, wordt bij de
      ingang van die locatie een kennisgeving daarvan bevestigd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYb_8
  - number: Yb 9
    text: |-
      1 Burgemeester en wethouders kunnen voor een stembureau, niet zijnde een stembureau als bedoeld in de
      [artikelen J 1a, eerste lid][ref1], of [J 4a, eerste lid][ref2], ook een stemlokaal aanwijzen dat uitsluitend
      geschikt is voor het houden van een zitting voor zover het de stemming betreft. [Artikel J 1a, derde lid][ref3],
      is van overeenkomstige toepassing.

      2 Onverminderd het bepaalde in [artikel J 4][ref4] kunnen burgemeester en wethouders voor een stembureau als
      bedoeld in [artikel J 1a, eerste lid][ref5], ten behoeve van de stemming een stemlokaal aanwijzen waartoe de
      toegang wordt beperkt tot een door burgemeester en wethouders aangewezen groep personen. De stemopneming geschiedt
      in het openbaar.

      3 Op een stemlokaal als bedoeld in het tweede lid is [artikel J 35, eerste lid][ref6], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1a
