      1 Het nationaal briefstembureau deelt de aantallen, bedoeld in de [artikelen O 16][ref1] en [O 18][ref2], zo
      spoedig mogelijk mee in een openbare zitting.

      2 Dag en uur van de zitting alsmede de locatie worden door de burgemeester van ’s-Gravenhage vastgesteld en
      bekendgemaakt.

      3 De aanwezige personen kunnen mondeling bezwaren inbrengen. De bezwaren, alsmede de reactie van het nationaal
      briefstembureau daarop, worden in het proces-verbaal van het nationaal briefstembureau vermeld.

      4 De voorzitter van het nationaal briefstembureau is belast met de handhaving van de orde tijdens de zitting. Hij
      kan daartoe de burgemeester van ’s-Gravenhage om bijstand verzoeken.


