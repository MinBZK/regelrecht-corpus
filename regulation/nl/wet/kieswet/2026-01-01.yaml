  - number: O 18
    text: |-
      Burgemeester en wethouders van ’s-Gravenhage informeren het nationaal briefstembureau op basis van de registratie,
      bedoeld in [artikel D 2][ref1], over het aantal kiesgerechtigden voor de stemming. Dit aantal wordt door het
      nationaal briefstembureau in de programmatuur en het proces-verbaal overgenomen.


