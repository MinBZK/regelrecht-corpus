  - number: M 3
    text: |-
      1 Een verzoek om per brief te stemmen wordt ingediend bij de burgemeester van 's-Gravenhage.

      2 De kiezer legt bij zijn verzoek een kopie over van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      3 Een verzoek dient uiterlijk op de achtentwintigste dag voor de stemming te zijn ontvangen.

      4 De kiezer vermeldt bij zijn verzoek het e-mailadres waarop hij het stembiljet wil ontvangen. Indien hij geen e-
      mailadres vermeldt, wordt hem het stembiljet per post toegezonden.

      5 De kiezer die het stembiljet per post wil ontvangen, vermeldt dit bij zijn verzoek.

      6 Voor het indienen van een verzoek wordt een formulier gebruikt. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelM_3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: M 4
    text: |-
      1 Op het verzoek wordt zo spoedig mogelijk beslist.

      2 Het verzoek wordt slechts afgewezen, indien gebleken is dat de verzoeker niet tot de in
      [artikel M 1, tweede lid,][ref1] bedoelde kiezers behoort.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld.

      4 De burgemeester van 's-Gravenhage doet zo spoedig mogelijk mededeling van de beslissing aan de burgemeester van
      de gemeente waar de verzoeker als kiezer is geregistreerd.

      5 [Artikel D 8][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
