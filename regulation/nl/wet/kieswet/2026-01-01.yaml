  - number: R 1
    text: |-
      1 Op de dag van de kandidaatstelling kunnen bij het centraal stembureau van negen tot zeventien uur
      kandidatenlijsten door persoonlijke overhandiging worden ingeleverd.

      2 Op de kandidatenlijst wordt vermeld voor welke provincie of provincies zij wordt ingeleverd.

      3 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de kandidatenlijsten,
      kosteloos, voor de leden van provinciale staten verkrijgbaar zijn. Bij ministeriële regeling wordt voor het
      formulier een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_1
  - number: R 2
    text: |-
      1 Bij de lijst wordt overgelegd een schriftelijke verklaring van ten minste één lid van provinciale staten van
      iedere provincie waarvoor de lijst wordt ingeleverd dat hij de lijst ondersteunt. Op deze verklaring worden de
      kandidaten op dezelfde wijze en in dezelfde volgorde vermeld als op de lijst.

      2 Een lid van provinciale staten mag niet meer dan één verklaring van ondersteuning ondertekenen.

      3 Een overgelegde verklaring van ondersteuning kan niet worden ingetrokken.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaring van
      ondersteuning, kosteloos, voor de leden van provinciale staten verkrijgbaar zijn. Bij ministeriële regeling wordt
      voor het formulier een model vastgesteld.

      5 [Artikel H 4, achtste lid][ref1], is van toepassing.


