  - number: I 7
    text: |-
      1 Tegen een beschikking als bedoeld in [artikel I 4][ref1] kan, in afwijking van
      [artikel 8:1 van de Algemene wet bestuursrecht][ref2], beroep worden ingesteld door een belanghebbende en iedere
      kiezer. In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref3] bedraagt de termijn voor het
      indienen van een beroepschrift vier dagen.

      2 [Artikel D 8][ref4] is van overeenkomstige toepassing.

      3 De Afdeling bestuursrechtspraak van de Raad van State doet uitspraak uiterlijk op de zesde dag nadat het
      beroepschrift is ontvangen.

      4 Indien de uitspraak van de Afdeling bestuursrechtspraak van de Raad van State strekt tot gegrondverklaring van
      het beroep, bepaalt zij dat haar uitspraak in de plaats treedt van de vernietigde beschikking.

      5 De voorzitter van de Afdeling bestuursrechtspraak van de Raad van State stelt partijen en de voorzitter van het
      centraal stembureau onverwijld in kennis van de uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
