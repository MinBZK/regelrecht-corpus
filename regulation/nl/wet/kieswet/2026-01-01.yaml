  - number: P 19a
    text: Indien een kandidaat is overleden, wordt deze bij de toepassing van deze paragraaf buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_19a
  - number: P 20
    text: |-
      1 Het centraal stembureau stelt de uitslag van de verkiezing zo spoedig mogelijk vast doch niet eerder dan de
      achtste dag nadat de stemming heeft plaatsgevonden. Het centraal stembureau stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal geldige stempassen;

      d. het aantal geldige kiezerspassen;

      e. het aantal geldige volmachtbewijzen;

      f. het aantal geldige briefstembewijzen en vervangend briefstembewijzen;

      g. de som van de aantallen bedoeld onder c, d, e en f;

      h. het aantal kiesgerechtigden; en

      i. het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal stemmen dat is geteld.
      Voor zover mogelijk geeft het centraal stembureau hiervoor een verklaring.

      2 De vaststelling en bekendmaking geschieden in een openbare zitting van het centraal stembureau. Dag en uur van de
      zitting worden door de voorzitter van het centraal stembureau tijdig bekendgemaakt. De wijze van bekendmaking wordt
      geregeld bij algemene maatregel van bestuur.

      3 De aanwezige personen kunnen mondeling bezwaren inbrengen.

      4 De voorzitter van het centraal stembureau is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_20
  - number: P 20a
    text: |-
      1 Het centraal stembureau voert onder vermelding van de naam van de kieskring in ieder geval de aantallen, bedoeld
      in [artikel P 20, eerste tot en met derde lid][ref1], uit het proces-verbaal in de programmatuur in.

      2 De invoer, bedoeld in het eerste lid:

      a. wordt afzonderlijk van elkaar, door twee leden van het centraal stembureau of ondersteuners gedaan; en

      b. geschiedt tenminste éénmaal handmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_20
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_20a
