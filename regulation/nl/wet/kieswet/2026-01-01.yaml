  - number: G 4
    text: |-
      1 Onverminderd het bepaalde in het tweede lid geldt een geregistreerde aanduiding die overeenkomstig het bepaalde
      in het [achtste lid van artikel G 1][ref1] of [G 2][ref2] is medegedeeld, tevens voor de verkiezing van de leden
      van provinciale staten, van het algemeen bestuur en van de gemeenteraad, onderscheidenlijk voor de verkiezing van
      de leden van de gemeenteraad.

      2 Het centraal stembureau voor de verkiezing van de leden van provinciale staten, het algemeen bestuur,
      onderscheidenlijk de gemeenteraad, bepaalt, dat de in het eerste lid bedoelde doorwerking van de registratie
      voor die verkiezing niet plaatsvindt, indien de geregistreerde aanduiding geheel of in hoofdzaak overeenstemt
      met een reeds op de voet van [artikel G 2][ref3], [artikel G 2a][ref4], onderscheidenlijk [artikel G 3][ref5],
      geregistreerde aanduiding van een andere politieke groepering, en daardoor verwarring te duchten is.

      3 Een beschikking als bedoeld in het tweede lid wordt genomen uiterlijk op de veertiende dag na de dagtekening
      van de Staatscourant of het provinciaal blad waarin de mededeling, bedoeld in [artikel G 1, achtste lid][ref6],
      onderscheidenlijk [artikel G 2, achtste lid][ref7], is gedaan. De beschikking wordt terstond aan de gemachtigde van
      de desbetreffende groepering bekendgemaakt.


