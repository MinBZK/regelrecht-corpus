  - number: Na 17
    text: |-
      1 Het gemeentelijk stembureau stelt voor elk stembureau de uitkomst van de stemming vast.

      2 De leden van het gemeentelijk stembureau zijn bevoegd daartoe de transportbox en de pakken, bedoeld in
      [artikel N 11, eerste lid][ref1], alsook de enveloppe, bedoeld in artikel N 11, tweede lid, te openen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
