      1 De voorzitter van het centraal stembureau benoemt een vervanger voor de plaats die is opengevallen als gevolg van
      een tijdelijk ontslag als bedoeld in deze paragraaf. De [hoofdstukken V][ref1] en [W][ref2] zijn van toepassing,
      met dien verstande dat in afwijking van [artikel V 2, eerste lid][ref3], de benoeming uiterlijk op de tiende dag na
      de dagtekening van de kennisgeving van benoeming wordt aangenomen.

      2 Degene die als vervanger is benoemd, houdt op lid te zijn met ingang van de dag waarop zestien weken zijn
      verstreken sinds de dag van ingang van het tijdelijk ontslag, onverminderd de mogelijkheid dat het vervangende
      lidmaatschap ingevolge deze wet op een eerder tijdstip eindigt.

      3 Indien de vervanger van het lid van een vertegenwoordigend orgaan aan wie tijdelijk ontslag is verleend
      wegens zwangerschap en bevalling of ziekte, voortijdig ontslag neemt, dan wel wordt benoemd tot lid van het
      vertegenwoordigend orgaan voor een plaats die is opengevallen anders dan als gevolg van een tijdelijk ontslag,
      benoemt de voorzitter van het centraal stembureau een nieuwe tijdelijke vervanger voor de resterende periode van
      het tijdelijk ontslag.

      4 [Artikel X 6][ref4] is niet van toepassing op een vervanger.


