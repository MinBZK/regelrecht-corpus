  - number: S 6
    text: |-
      1 Indien beroep is ingesteld tegen een beschikking waarbij het centraal stembureau een lijst voor een provincie
      ongeldig heeft verklaard of de naam van een kandidaat dan wel de aanduiding van een politieke groepering heeft
      geschrapt op grond van een of meer der verzuimen, vermeld in [artikel S 1, derde lid][ref1], zonder dat het
      centraal stembureau tevoren overeenkomstig het in dat artikel bepaalde kennis heeft gegeven van het bestaan daarvan
      aan degene die de lijst heeft ingeleverd, kan deze persoon, dan wel een persoon als bedoeld in [artikel R 3][ref2],
      het verzuim of de verzuimen alsnog herstellen bij de Afdeling bestuursrechtspraak van de Raad van State. Artikel S
      1, vijfde lid, is van overeenkomstige toepassing.

      2 Indien een verzuim overeenkomstig het eerste lid is hersteld, houdt de Afdeling bestuursrechtspraak van de Raad
      van State bij haar uitspraak daarmee rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_3
