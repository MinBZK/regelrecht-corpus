      1 Indien de retourenveloppe niet terzijde is gelegd wordt de enveloppe met het stembiljet ongeopend in de stembus
      gestoken. Indien het stembiljet zich niet in de daartoe bestemde enveloppe bevindt, wordt het, zonder het in te
      zien, dichtgevouwen in de stembus gestoken.

      2 Indien de som van het aantal briefstembewijzen en vervangend briefstembewijzen overeenkomt met het aantal
      stembiljetten, onderscheidenlijk enveloppen met stembiljet, maar er meer dan één briefstembewijs of vervangend
      briefstembewijs in een retourenveloppe zit, houdt het briefstembureau hier aantekening van bij.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_20
  - number: N 21
    text: |-
      1 Het briefstembureau stelt de som van het aantal ontvangen briefstembewijzen en vervangend briefstembewijzen vast.
      Dit is het aantal kiezers dat tot de stemming is toegelaten.

      2 De voorzitter stelt de aanwezige personen in kennis van het aantal kiezers dat tot de stemming is toegelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_21
  - number: N 22
    text: |-
      1 Het briefstembureau doet in een of meer afzonderlijke pakken:

      a. de ontvangen briefstembewijzen en vervangend briefstembewijzen;

      b. de enveloppen die op grond van [artikel N 18, tweede lid][ref1], terzijde zijn gelegd.

      2 Elk pak wordt verzegeld, voorzien van de naam van de gemeente en een beschrijving van de inhoud.


