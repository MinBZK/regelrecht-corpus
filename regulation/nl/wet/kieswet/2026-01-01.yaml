  - number: Ya 22
    text: |-
      De bij of krachtens deze wet gestelde bepalingen betreffende de verkiezing van de leden van provinciale staten,
      betreffende het begin van en de veranderingen in het lidmaatschap van provinciale staten en betreffende de
      beëindiging van het lidmaatschap en tijdelijke vervanging als lid, zijn, voor zover deze paragraaf niet anders
      bepaalt, van toepassing op het kiescollege, met dien verstande dat telkens in die bepalingen wordt gelezen in
      plaats van:

      a. «de provincie» en «een provincie die één kieskring vormt»: het openbaar lichaam;

      b. «provinciale staten» en «staten»: het kiescollege;

      c. «gedeputeerde staten»: het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYa_22
  - number: Ya 23
    text: Voor de verkiezing van de leden van het kiescollege vormt elk openbaar lichaam één kieskring.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYa_23
  - number: Ya 24
    text: |-
      De stembureaus, het stembureau van het openbaar lichaam en het centraal stembureau voor de verkiezing van de
      leden van de eilandsraad zijn tevens de stembureaus, het stembureau van het openbaar lichaam onderscheidenlijk het
      centraal stembureau voor de verkiezing van de leden van het kiescollege.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelYa_24
  - number: Ya 25
    text: |-
      1 In [artikel G 2, eerste lid][ref1], wordt in plaats van «voor de verkiezing van de leden van de Tweede Kamer»
      gelezen: voor de verkiezing van de leden van de Tweede Kamer of voor de verkiezing van de leden van de eilandsraad.

      2 De politieke groepering die een verzoek tot registratie van de aanduiding als bedoeld in
      [artikel G 2, eerste lid][ref2], indient bij het centraal stembureau voor de verkiezing van de leden van het
      kiescollege betaalt aan het openbaar lichaam een waarborgsom van USD 225.

      3 In aanvulling op het bepaalde in [artikel G 2, derde lid][ref3], wordt bij het verzoek
      tevens overgelegd een gewaarmerkt bewijs van inschrijving in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref4] dan wel [artikel 2 van de Handelsregisterwet 2009 BES][ref5].

      4 In [artikel G 2, vierde lid, onderdeel b][ref6], wordt in plaats van «of [artikel G 1][ref7]» gelezen: , artikel
      G 1 of artikel [Ya 15][ref8], in samenhang met [artikel G 3][ref9].

      5 Het centraal stembureau doet van de beslissing, bedoeld in [artikel G 2, vijfde lid][ref10], en het schrappen
      van de aanduiding in het register, bedoeld in artikel G 2, zevende lid, mededeling in het afkondigingsblad.


