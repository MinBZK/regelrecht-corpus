  - number: M 2
    text: |-
      Aan een persoon aan wie een briefstembewijs is verstrekt, wordt geen stempas toegezonden. Hij mag slechts op de in
      [artikel M 7][ref1] aangewezen wijze aan de stemming deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
