  - number: A 7
    text: |-
      De Kiesraad stelt een bestuursreglement vast en maakt het reglement na de goedkeuring, bedoeld in artikel 11 van de
      Kaderwet zelfstandige bestuursorganen, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_7
  - number: A 8
    text: |-
      1 De Kiesraad heeft een secretaris en een ondersteunend bureau.

      2 De secretaris en de medewerkers van het bureau zijn geen lid van de Kiesraad.

      3 In afwijking van artikel 4.6, eerste lid, van de Comptabiliteitswet 2016 vertegenwoordigt de voorzitter van de
      Kiesraad de Staat bij het sluiten, wijzigen en beëindigen van individuele arbeidsovereenkomsten met de secretaris
      en de medewerkers van de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_8
  - number: A 9
    text: |-
      1 De Kiesraad kan personen aanwijzen die namens hem uitvoering geven aan de taak, bedoeld in artikel A 11, eerste
      lid.

      2 De personen, bedoeld in het eerste lid, zijn geen lid van de Kiesraad of een persoon die een functie vervult
      in het verkiezingsproces die onverenigbaar is met de taak, bedoeld in artikel A 11, eerste lid, en kunnen worden
      aangewezen, indien zij:

      a. op de dag van de stemming de leeftijd van achttien jaar hebben bereikt;

      b. op de dag van aanwijzing niet:

      1⁰. bij onherroepelijke rechterlijke uitspraak van het kiesrecht zijn ontzet;

      2⁰. een gekozen lid van het vertegenwoordigend orgaan waarvoor de verkiezing wordt gehouden of een kandidaat voor
      de verkiezing zijn, en

      c. naar het oordeel van de Kiesraad over voldoende kennis en vaardigheden beschikken op het terrein van het
      verkiezingsproces.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de toekenning door de Kiesraad van een vergoeding aan
      de personen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_9
  - number: A 10
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:

        - *stembureau:* elk stembureau, briefstembureau, gemeentelijk stembureau, hoofdstembureau, nationaal
      briefstembureau en centraal stembureau als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_10
  - number: A 11
    text: |-
      1 Ter bevordering van de kwaliteit van het verkiezingsproces ondersteunt de Kiesraad de burgemeester, burgemeester
      en wethouders, het dagelijks bestuur en een stembureau bij de uitvoering van de taken die op grond van deze wet
      aldaar zijn belegd.

      2 De Kiesraad stelt, na overleg met een instantie die representatief kan worden geacht voor de colleges van
      burgemeester en wethouders, een instantie die representatief kan worden geacht voor de dagelijkse besturen, dan
      wel de openbare lichamen, bedoeld in artikel Ya 2, onderdeel a, een plan op voor de wijze waarop de Kiesraad
      met de burgemeester, het college van burgemeester en wethouders, de dagelijkse besturen, de bestuurscolleges en
      de gezaghebbers van de openbare lichamen, bedoeld in artikel Ya 2, onderdeel a, en een stembureau samenwerkt en
      de wijze waarop de ondersteuning, bedoeld in het eerste lid, en de bevoegdheid, bedoeld in artikel A 12, worden
      uitgeoefend. De Kiesraad maakt het plan op een algemeen toegankelijke wijze elektronisch openbaar.

      3 Ter ondersteuning van de uitvoering van het verkiezingsproces kan de Kiesraad instructies en
      kwaliteitsstandaarden voor een goede uitvoering van het bepaalde bij of krachtens deze wet opstellen.

      4 In geval van onvoorziene omstandigheden gedurende de uitvoering van het verkiezingsproces kan de Kiesraad
      regels stellen met betrekking tot de wijze waarop de stembureaus in die omstandigheden moeten handelen. Daarbij
      wordt tevens de datum vastgesteld waarop deze regels vervallen. De door de Kiesraad gestelde regels behoeven de
      goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop en de voorwaarden waaronder
      de Kiesraad de colleges van burgemeester en wethouders, de dagelijkse besturen en de openbare lichamen betrekt bij
      de uitoefening van de taak, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_11
  - number: A 12
    text: |-
      1 De Kiesraad kan de voorzitter van een stembureau of een stembureau een procesaanwijzing geven, indien:

      a. zich onregelmatigheden voordoen met betrekking tot de feitelijke gang van zaken op plaatsen of gedeelten daarvan
      die door een stembureau in gebruik zijn ten behoeve van de uitvoering van een verkiezing als bedoeld in deze wet,
      die kunnen leiden tot risico’s voor het verloop van de verkiezing of de betrouwbaarheid van de uitslag van de
      verkiezing, en

      b. overleg er niet toe heeft geleid dat de onregelmatigheden en het gevaar voor de geconstateerde risico’s zijn
      weggenomen.

      2 Een procesaanwijzing heeft in ieder geval geen betrekking op:

      a. de uitoefening van de taken en bevoegdheden die in deze wet aan de burgemeester, burgemeester en wethouders, dan
      wel het dagelijks bestuur zijn toegekend, en

      b. de uitkomst van een vaststelling als bedoeld in de artikelen N 6, N 25, Na 18, Na 26, O 5, P 20 en T 10.

      3 Een procesaanwijzing is evenredig aan het doel waarvoor zij wordt gegeven.

      4 De Kiesraad stelt bij het geven van een procesaanwijzing een termijn waarbinnen aan de procesaanwijzing moet
      zijn voldaan.

      5 Ingeval van een procesaanwijzing stelt de Kiesraad de burgemeester en burgemeester en wethouders van de
      betreffende gemeente hiervan onmiddellijk in kennis.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_12
  - number: A 13
    text: |-
      1 De Kiesraad stelt bij een verkiezing een rapportage van bevindingen op over de onregelmatigheden die door de
      Kiesraad zijn vastgesteld met betrekking tot de feitelijke gang van zaken op plaatsen of gedeelten daarvan die door
      een stembureau in gebruik zijn ten behoeve van de uitvoering van een verkiezing als bedoeld in deze wet en van de
      procesaanwijzingen die op grond van artikel A 12, eerste lid, zijn gegeven.

      2 De Kiesraad zendt de rapportage van bevindingen zo spoedig mogelijk na vaststelling ervan aan het betrokken
      vertegenwoordigend orgaan en maakt deze op algemeen toegankelijke wijze elektronisch openbaar.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_13
  - number: A 14
    text: |-
      1 Indien de Kiesraad naar aanleiding van geconstateerde onregelmatigheden met betrekking tot een verkiezing die
      leiden tot risico’s voor de geldigheid van de stemming van oordeel is dat een nieuwe stemming als bedoeld in
      artikel V 6, tweede lid, in één of meer stembureaus of provincies noodzakelijk is, maakt de Kiesraad dit uiterlijk
      voor aanvang van het onderzoek, bedoeld in artikel V 4, eerste lid, schriftelijk aan het vertegenwoordigend orgaan
      kenbaar en vermeldt daarbij de stembureaus of provincies die het betreft.

      2 De Kiesraad maakt een oordeel als bedoeld in het eerste lid op algemeen toegankelijke wijze elektronisch
      openbaar.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_14
  - number: A 15
    text: |-
      Burgemeester, burgemeester en wethouders, het dagelijks bestuur, het gemeentelijk stembureau, het nationaal
      briefstembureau, het hoofdstembureau en het centraal stembureau verstrekken de Kiesraad desgevraagd en uit eigen
      beweging gegevens en inlichtingen die de Kiesraad nodig heeft voor de uitvoering van zijn taken en bevoegdheden,
      bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_15
  - number: A 16
    text: |-
      Onverminderd artikel 20 van de Kaderwet zelfstandige bestuursorganen verstrekt de Kiesraad aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties uit eigen beweging inlichtingen over een door de Kiesraad geconstateerde
      onregelmatigheid die leidt tot ernstige risico’s voor het verloop van de verkiezing of de betrouwbaarheid van de
      uitslag van de verkiezing.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_16
  - number: B 1
    text: |-
      1 De leden van de Tweede Kamer der Staten-Generaal worden gekozen door degenen die op de dag van de
      kandidaatstelling Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt, met
      uitzondering van degenen die op de dag van de kandidaatstelling hun werkelijke woonplaats hebben in Aruba, Curaçao
      of Sint Maarten.

      2 Deze uitzondering geldt niet voor:

      a. de Nederlander die gedurende ten minste tien jaren ingezetene van Nederland is geweest;

      b. de Nederlander die in Nederlandse openbare dienst in Aruba, Curaçao of Sint Maarten werkzaam is, alsmede
      zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_1
  - number: B 2
    text: |-
      De leden van provinciale staten worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van de provincie, mits zij Nederlander zijn en op de dag van de stemming de leeftijd van achttien jaar hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_2
  - number: B 2a
    text: |-
      1 De leden van het algemeen bestuur worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van het waterschap en op de dag van de stemming de leeftijd van achttien jaar hebben bereikt.

      2 [Artikel B 3, tweede lid, aanhef en onderdeel a, en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_3
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_2a
