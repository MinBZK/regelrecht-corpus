  - number: I 3
    text: |-
      Onmiddellijk nadat de lijsten door het centraal stembureau zijn onderzocht, worden deze en, indien vereist, de
      verklaringen van ondersteuning, voor eenieder ter inzage gelegd bij het centraal stembureau totdat onherroepelijk
      over de geldigheid van de ingeleverde lijsten is beslist.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_3
  - number: I 4
    text: |-
      Op de dag na de termijn, genoemd in [artikel I 2, tweede lid][ref1], beslist het centraal stembureau in een
      openbare zitting die om zeventien uur aanvangt, over de geldigheid van de lijsten voor iedere kieskring waarvoor
      zij zijn ingeleverd en over het handhaven van de daarop voorkomende kandidaten, alsmede over het handhaven van de
      daarboven geplaatste aanduiding van een politieke groepering, en maakt deze beslissingen op de zitting bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_4
