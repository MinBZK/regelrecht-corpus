  - number: N 17
    text: |-
      1 De voorzitter van het briefstembureau schorst de zitting in elk geval indien:

      a. zich naar het oordeel van het briefstembureau in of nabij de locatie van het briefstembureau omstandigheden
      voordoen die de behoorlijke voortgang van de zitting onmogelijk maken;

      b. de zitting niet op één dag kan worden afgerond.

      2 Indien zich naar het oordeel van het briefstembureau een situatie voordoet als bedoeld in het eerste lid,
      onderdeel a, wordt dit door de voorzitter verklaard. De zitting wordt daarop geschorst. De voorzitter doet hiervan
      terstond mededeling aan de burgemeester. De burgemeester bepaalt vervolgens wanneer en waar de zitting wordt
      hervat.

      3 Bij of krachtens algemene maatregel van bestuur worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_17
  - number: N 18
    text: |-
      1 Het briefstembureau opent de retourenveloppe en neemt het briefstembewijs dan wel het vervangend briefstembewijs,
      de kopie van het identiteitsdocument, de enveloppe met het stembiljet en, indien van toepassing, de verklaring
      vanwege de Nederlandse openbare dienst, eruit. Vervolgens controleert het:

      a. of het briefstembewijs dan wel het vervangend briefstembewijs echt is;

      b. of het nummer van het briefstembewijs onderscheidenlijk vervangend briefstembewijs niet voorkomt in het
      uittreksel van ongeldige briefstembewijzen, bedoeld in [artikel M 5, derde lid][ref1];

      c. of er blijkens het uittreksel van geldige briefstembewijzen, bedoeld in [artikel M 5, derde lid][ref2], niet
      eerder een briefstembewijs dan wel een vervangend briefstembewijs met dit nummer is ontvangen;

      d. aan de hand van de kopie van het identiteitsdocument, of dit document geldig was op de dag van de
      kandidaatstelling;

      e. of de verklaring dat de kiezer het stembiljet persoonlijk heeft ingevuld, is ondertekend en of de daaronder
      geplaatste handtekening overeenkomt met de handtekening op het identiteitsdocument; en

      f. indien van toepassing, of de verklaring vanwege de Nederlandse openbare dienst is ondertekend en of de daaronder
      geplaatste handtekening overeenkomt met de handtekening op het identiteitsdocument.

      2 Indien het lid vaststelt dat de retourenveloppe niet alle benodigde bescheiden bevat is hij bevoegd de enveloppe
      met het stembiljet te openen om vast te stellen of het ontbrekende bescheid zich daarin bevindt. Het stembiljet mag
      hierbij niet worden ingezien.

      3 Het lid van het briefstembureau doet de aangetroffen bescheiden wederom in de retourenveloppe, verzegelt deze, en
      legt deze terzijde, indien:

      a. de retourenveloppe niet alle benodigde bescheiden bevat;

      b. de stembescheiden, anders dan het stembiljet, niet voldoen aan de vereisten, bedoeld in het eerste lid; of

      c. in een retourenveloppe stembescheiden van meer personen zijn gevoegd, waarvan er een of meer niet voldoen aan
      de vereisten, bedoeld in het eerste lid, of waarvan het aantal stembescheiden niet overeenkomt met het aantal
      stembiljetten, onderscheidenlijk enveloppen met stembiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_5
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_5
