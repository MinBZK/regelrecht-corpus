  - number: N 33
    text: |-
      1 De burgemeester bewaart de pakken, bedoeld in de [artikelen N 22][ref1] en [N 28][ref2], en de afschriften,
      bedoeld in [artikel N 31, derde lid][ref3], onderscheidenlijk [artikel N 32, tweede lid][ref4], drie maanden nadat
      over de toelating van de gekozenen is beslist. Daarna worden deze stukken onmiddellijk vernietigd, tenzij:

      a. de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek
      heeft gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is
      afgerond;

      b. strafvervolging is ingesteld wegens een strafbaar gestelde gedraging in deze
      wet, de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref5] of de
      [artikelen 131 tot en met 135 van het Wetboek van Strafrecht BES][ref6], in welk geval de vernietiging plaatsvindt
      nadat er een onherroepelijke rechterlijke uitspraak is.

      2 Van de vernietiging wordt proces-verbaal opgemaakt.


