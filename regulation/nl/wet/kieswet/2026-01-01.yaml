    text: |-
      1 Het briefstembureau houdt in het uittreksel van geldige briefstembewijzen, bedoeld in
      [artikel M 5, derde lid][ref1], aantekening van de kiezers die tot de stemming zijn toegelaten op basis van een
      vervangend briefstembewijs.

      2 Indien het nummer van een briefstembewijs dan wel vervangend briefstembewijs niet voorkomt in het uittreksel,
      bedoeld in het eerste lid, neemt het briefstembureau contact op met de burgemeester van 's-Gravenhage.

      3 Indien de burgemeester blijkt dat een briefstembewijs of vervangend briefstembewijs met dat nummer eerder
      is ontvangen door een ander briefstembureau, is [artikel N 18, tweede lid][ref2], van toepassing. Heeft niet
      eerder een ander briefstembureau een briefstembewijs of vervangend briefstembewijs met dat nummer ontvangen, dan
      voegt het briefstembureau dat het briefstembewijs of vervangend briefstembewijs heeft ontvangen het nummer toe
      aan zijn uittreksel van geldige briefstembewijzen en tekent het briefstembureau in wiens uittreksel van geldige
      briefstembewijzen het nummer voorkomt daarin aan dat het ontvangen is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_5
