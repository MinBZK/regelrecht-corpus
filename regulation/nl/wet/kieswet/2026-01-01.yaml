  - number: N 9
    text: |-
      1 Het stembureau doet in pakken:

      a. de stembiljetten met een blanco stem;

      b. de stembiljetten met een ongeldige stem.

      2 Elk pak wordt verzegeld en voorzien van:

      a. de naam van de gemeente;

      b. het nummer van het stembureau; en

      c. een beschrijving van de inhoud.

      3 Daarna worden de stembiljetten met een geldige stem op een kandidaat, lijstgewijs gerangschikt, in een of meer
      pakken gedaan. Het tweede lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_9
  - number: N 10
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt onmiddellijk proces-verbaal opgemaakt van de stemming en van de
      stemopneming.

      2 Het proces-verbaal wordt door alle aanwezige leden van het stembureau getekend.

      3 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_10
  - number: N 11
    text: |-
      1 Na zich ervan overtuigd te hebben dat de transportbox leeg is, doet het stembureau de pakken, bedoeld in de
      [artikelen N 2][ref1] en [N 9][ref2], in de transportbox. De transportbox wordt voorzien van de naam van de
      gemeente, het nummer van het stembureau en een aanduiding van de verkiezing. Daarna wordt de transportbox op slot
      gedaan en verzegeld.

      2 Het stembureau bewaart de sleutel van de transportbox en zijn proces-verbaal in een enveloppe, die het eveneens
      verzegelt. Op deze enveloppe wordt de naam van de gemeente, het nummer van het stembureau en een aanduiding van de
      verkiezing vermeld.

      3 Het stembureau draagt de transportbox en de enveloppe zo spoedig mogelijk over aan de burgemeester. Tot aan
      die overdracht draagt het stembureau er zorg voor dat de zegels op de transportbox en de enveloppe niet worden
      verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
