        bwb_id: BWBR0006297
        artikel: '1'
  - number: H 5
    text: |-
      Op de lijst worden een of meer personen vermeld die bij verhindering van de inleveraar bevoegd zijn tot het herstel
      van verzuimen, bedoeld in [artikel I 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelH_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_2
        hoofdstuk: I
        paragraaf: '1'
        afdeling: II
  - number: H 6
    text: |-
      1 De namen van de kandidaten worden op de lijsten geplaatst in de volgorde waarin aan hen de voorkeur wordt
      gegeven.

      2 Op dezelfde lijst mogen de namen van ten hoogste vijftig kandidaten worden geplaatst. Op dezelfde lijst van
      een politieke groepering wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van het desbetreffende vertegenwoordigend orgaan meer dan vijftien zetels zijn toegekend,
      mag een aantal namen worden geplaatst dat ten hoogste tachtig bedraagt. Het bepaalde in de vorige volzin is van
      overeenkomstige toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelH_6
  - number: H 7
    text: |-
      1 De naam van een kandidaat mag niet voorkomen op een lijst, indien de kandidaat tijdens de zittingsperiode van
      het orgaan waarvoor de verkiezing zal plaatshebben, niet de voor het zitting nemen in dat orgaan vereiste leeftijd
      zal bereiken.

      2 De naam van een kandidaat mag niet voorkomen op meer dan één van de lijsten die voor eenzelfde kieskring zijn
      ingeleverd.

      3 Indien voor de verkiezing van de leden van provinciale staten, de leden van het algemeen bestuur of de
      gemeenteraad op een lijst de naam voorkomt van een kandidaat die geen ingezetene is van de provincie, het
      waterschap, onderscheidenlijk de gemeente, dient bij de lijst te worden overgelegd een door die kandidaat
      ondertekende verklaring, waaruit blijkt, dat hij voornemens is zich bij benoeming te vestigen in de provincie, het
      waterschap, onderscheidenlijk de gemeente.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelH_7
  - number: H 8
    text: De wijze waarop kandidaten op de lijst worden vermeld, wordt geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelH_8
  - number: H 9
    text: |-
      1 Bij de lijst wordt overgelegd een schriftelijke verklaring van iedere daarop voorkomende kandidaat dat hij
      instemt met zijn kandidaatstelling op deze lijst voor de kieskring of de kieskringen waarvoor zij is ingeleverd.
      Tenzij een gemachtigde, bedoeld in de [artikelen H 10, eerste lid][ref1], of [H 10a, eerste lid][ref2], wordt
      aangewezen, wordt op deze verklaring vermeld op welk adres de kandidaat de kennisgeving van zijn benoeming, bedoeld
      in [artikel V 1][ref3], wil ontvangen.

      2 Een overgelegde verklaring van instemming kan niet worden ingetrokken.

      3 Bij de lijst wordt van iedere kandidaat die geen zitting heeft in het vertegenwoordigend
      orgaan waarvoor de verkiezing wordt gehouden, tevens een kopie van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref4] overgelegd. Indien van een dergelijke kandidaat een kopie
      van een document als bedoeld in artikel 1 van de Wet op de identificatieplicht ontbreekt, wordt de verklaring van
      instemming van de betreffende kandidaat geacht te ontbreken.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen van
      instemming, kosteloos, voor de kiezers verkrijgbaar zijn. Bij ministeriële regeling wordt voor het formulier een
      model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_10a
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_1
      [ref4]: https://wetten.overheid.nl/BWBR0006297#Artikel1
