  - number: Z 6
    text: |-
      Degene die bij een verkiezing als gemachtigde stemt voor een persoon, wetende dat deze overleden is, wordt gestraft
      met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelZ_6
  - number: Z 8
    text: |-
      Degene die opzettelijk een persoon benadert om die persoon ertoe te bewegen:

      a. het formulier op zijn stempas, bestemd voor het stemmen bij volmacht als bedoeld in artikel L 14, te
      ondertekenen en deze pas af te geven; of

      b. een verzoekschrift als bedoeld in artikel L 8 in te dienen,

      wordt, als schuldig aan ronselen, gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de
      derde categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelZ_8
  - number: Z 8a
    text: |-
      De onderdaan van een lidstaat van de Europese Unie die zowel in Nederland als in een andere lidstaat aan een
      stemming voor de verkiezing van de leden van het Europees Parlement deelneemt, wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelZ_8a
  - number: Z 9
    text: |-
      De werkgever die de hem bij [artikel J 10][ref1] opgelegde verplichting niet nakomt, wordt gestraft met hechtenis
      van ten hoogste veertien dagen of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_10
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelZ_9
