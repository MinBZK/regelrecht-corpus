  - number: R 4
    text: |-
      1 De namen van de kandidaten worden op de lijsten geplaatst in de volgorde waarin aan hen de voorkeur wordt
      gegeven.

      2 Op dezelfde lijst mogen de namen van ten hoogste vijftig kandidaten worden geplaatst. Op dezelfde lijst van
      een politieke groepering wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden
      verkiezing van de leden van het desbetreffende vertegenwoordigend orgaan meer dan vijftien zetels zijn toegekend,
      mag een aantal namen worden geplaatst dat ten hoogste tachtig zetels bedraagt. Het bepaalde in de vorige volzin is
      van overeenkomstige toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_4
  - number: R 5
    text: |-
      1 De naam van een kandidaat mag niet voorkomen op een lijst, indien de kandidaat tijdens de zittingsperiode van
      de Eerste Kamer waarvoor de verkiezing zal plaatshebben, niet de voor het zitting nemen in dat orgaan vereiste
      leeftijd zal bereiken.

      2 De naam van een kandidaat mag niet voorkomen op meer dan één van de lijsten die voor eenzelfde provincie zijn
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_5
  - number: R 6
    text: De wijze waarop kandidaten op de lijst worden vermeld, wordt geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_6
  - number: R 7
    text: |-
      1 De gemachtigde, bedoeld in [artikel G 1, derde lid, onder c][ref1], onderscheidenlijk
      [artikel Q 6, derde lid][ref2], in samenhang met artikel G 1, derde lid, onder c, kan aan degene die de
      kandidatenlijst inlevert de bevoegdheid verlenen boven de lijst de aanduiding van de desbetreffende groepering te
      plaatsen, zoals die door het centraal stembureau is geregistreerd. Een verklaring van de gemachtigde waaruit deze
      bevoegdheid blijkt, wordt bij de lijst overgelegd.

      2 Degene die de lijst inlevert, is bevoegd daarboven een aanduiding te plaatsen, gevormd door samenvoeging van door
      het centraal stembureau voor de verkiezing van de leden van de Eerste Kamer of van de Tweede Kamer geregistreerde
      aanduidingen of afkortingen daarvan, indien hem daartoe de bevoegdheid is verleend door de gemachtigden van de
      onderscheidene groeperingen. Verklaringen van de gemachtigden waaruit deze bevoegdheid blijkt, worden bij de lijst
      overgelegd. Een aldus gevormde aanduiding mag niet meer dan 35 letters of andere tekens bevatten.

      3 Degene die de lijst heeft ingeleverd, ontvangt daarvan een bewijs.

      4 Bij algemene maatregel van bestuur wordt geregeld waar en wanneer de formulieren voor de verklaringen met
      betrekking tot het plaatsen van aanduidingen van politieke groeperingen boven kandidatenlijsten, kosteloos,
      verkrijgbaar zijn. Bij ministeriële regeling wordt voor de formulieren een model vastgesteld.


