  - number: Ea 6
    text: |-
      1 Burgemeester en wethouders stellen bij elke verkiezing de gebruiker, niet zijnde de Kiesraad in zijn functie als
      centraal stembureau, in staat om op een betrouwbare en veilige wijze de uitslagprogrammatuur te kunnen gebruiken.
      Daartoe richten zij decentrale voorzieningen in en treffen decentrale maatregelen, en dragen er zorg voor dat deze
      decentrale voorzieningen en maatregelen aan de aansluitvoorschriften voldoen.

      2 Burgemeester en wethouders onderzoeken uiterlijk op een bij algemene maatregel van bestuur te bepalen tijdstip
      voor de dag van stemming of de decentrale voorzieningen en maatregelen aan de aansluitvoorschriften voldoen en
      stellen een verklaring op over de uitkomsten van dit onderzoek. De Kiesraad stelt bij regeling een model voor deze
      verklaring vast. Burgemeester en wethouders maken deze verklaring onverwijld op een algemeen toegankelijke wijze
      elektronisch openbaar. Zij verstrekken deze verklaring tevens onverwijld aan de Kiesraad.

      3 Burgemeester en wethouders onderbreken al dan niet tijdelijk het gebruik van de uitslagprogrammatuur door
      een gebruiker, niet zijnde de Kiesraad in zijn functie als centraal stembureau, indien zij constateren dat de
      decentrale voorzieningen of maatregelen niet langer aan de aansluitvoorschriften voldoen. Zodra burgemeester en
      wethouders vaststellen dat de decentrale voorzieningen en maatregelen opnieuw aan de aansluitvoorschriften voldoen,
      stellen zij de betrokken gebruiker opnieuw in staat om de uitslagprogrammatuur te gebruiken.

      4 Burgemeester en wethouders stellen de Kiesraad onverwijld in kennis van een onderbreken en van een opnieuw in
      staat stellen van het gebruik van de uitslagprogrammatuur als bedoeld in het derde lid.

      5 Indien het college van burgemeester en wethouders het gebruik van de uitslagprogrammatuur onderbreekt, als
      bedoeld in het derde lid, neemt het maatregelen om het gebruik zo spoedig als mogelijk te kunnen hervatten.

      6 Indien het na onderbreking van het gebruik van de uitslagprogrammatuur, op grond van het derde lid, niet mogelijk
      is om het gebruik binnen afzienbare tijd te hervatten, neemt het college van burgemeester en wethouders contact op
      met de Kiesraad.

      7 Dit artikel is van overeenkomstige toepassing op:

      a. de Kiesraad, die zichzelf in zijn functie als centraal stembureau voor de verkiezing van de leden van de Tweede
      Kamer, in staat stelt om op een betrouwbare en veilige wijze de uitslagprogrammatuur te kunnen gebruiken en, in de
      situatie bedoeld in het derde lid, zijn gebruik van de uitslagprogrammatuur al dan niet tijdelijk onderbreekt. Het
      tweede lid, laatste volzin, het vierde lid en het zesde lid, zijn niet van toepassing.

      b. het dagelijks bestuur voor wat betreft het centraal stembureau voor de verkiezing van de leden van het algemeen
      bestuur.

      8 Bij algemene maatregel van bestuur worden nadere regels gesteld over het onderzoek en de verklaring, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelEa_6
  - number: Ea 7
    text: |-
      1 De gebruiker maakt bij de vaststelling, bedoeld in de [artikelen Na 26][ref1], [O 5][ref2] en [O 16][ref3],
