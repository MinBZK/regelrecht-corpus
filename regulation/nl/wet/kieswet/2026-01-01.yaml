      De [artikelen M 7, zesde lid][ref1], [M 7a, aanhef en onderdeel b][ref2], en [M 8][ref3], zijn van overeenkomstige
      toepassing op briefstembureaus, bedoeld in [artikel E 5, tweede en derde lid][ref4], met dien verstande dat:

      a. aan de burgemeester opgedragen taken worden verricht door de vertegenwoordiger van Nederland in Aruba, Curaçao
      of Sint Maarten dan wel door de burgemeester van de aangewezen gemeente;

      b. de genoemde tijdstippen naar plaatselijke tijd gelden.


