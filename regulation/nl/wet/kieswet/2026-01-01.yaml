  - number: N 12
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de transportbox, het vervoer en de
      opslag van de stembescheiden, het proces-verbaal van het stembureau alsmede over de overdracht van de transportbox
      en enveloppe.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_12
  - number: N 15
    text: |-
      1 Het briefstembureau houdt twee openbare zittingen. De zittingen strekken respectievelijk tot:

      a. het verrichten van de handelingen, bedoeld in de [artikelen N 18 tot en met N 22][ref1];

      b. het verrichten van de stemopneming en de vaststelling en bekendmaking van de uitkomsten daarvan.

      2 Burgemeester en wethouders wijzen voor elke dag waarop het briefstembureau zitting houdt één geschikte locatie
      aan voor de zittingen van het briefstembureau. Deze locatie kan ook buiten de grenzen van de eigen gemeente zijn
      gelegen.

      3 Voor zover de zittingen gelijktijdig plaatsvinden, worden de handelingen die verricht worden ten behoeve van
      beide zittingen verricht door verschillende leden van het briefstembureau.

      4 De [artikelen J 12 tot en met J 14][ref2], [J 16][ref3], met uitzondering van de voorschriften die betrekking
      hebben op stemhokjes, [J 17, tweede lid][ref4], [J 18][ref5], [J 19][ref6], [J 35][ref7], [J 37][ref8] en
      [J 39, tweede en derde lid][ref9], zijn van overeenkomstige toepassing op de zittingen van het briefstembureau,
      met dien verstande dat in artikel J 18, eerste lid, in plaats van «[artikel J 26, derde lid][ref10]» gelezen wordt
      «[artikel N 20, eerste lid][ref11]».


