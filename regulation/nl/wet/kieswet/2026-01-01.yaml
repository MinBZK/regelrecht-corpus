  - number: Na 24
    text: |-
      1 Het proces-verbaal van het gemeentelijk stembureau bevat de uitkomst van de stemming per stembureau.

      2 Voorts wordt daarin melding gemaakt van alle bezwaren die in de processen-verbaal van de stembureaus zijn
      vermeld, alsmede van de reactie die het stembureau daarop heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_24
  - number: Na 25
    text: |-
      1 Nadat de stemopneming voor een stembureau is afgerond worden het proces-verbaal van dat stembureau en de sleutel
      van de transportbox in een enveloppe gedaan. De enveloppe wordt verzegeld.

      2 Op de enveloppe wordt de naam van de gemeente, het nummer van het stembureau en een aanduiding van de verkiezing
      vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_25
  - number: Na 26
    text: |-
      1 Het gemeentelijk stembureau stelt ten aanzien van iedere kandidaat en iedere lijst vast het aantal stemmen dat
      binnen de gemeente op die kandidaat, onderscheidenlijk die lijst, is uitgebracht.

      2 Het gemeentelijk stembureau stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal geldige stempassen;

      d. het aantal geldige kiezerspassen;

      e. het aantal geldige volmachtbewijzen; en

      f. de som van de aantallen bedoeld onder c, d en e.

      3 Voorts stelt het gemeentelijk stembureau het verschil vast tussen het aantal kiezers dat tot de stemming is
      toegelaten en het aantal stemmen dat is geteld. Voor zover mogelijk geeft het gemeentelijk stembureau hiervoor
      een verklaring.

      4 De aantallen, bedoeld in het eerste tot en met derde lid, worden in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_26
  - number: Na 26a
    text: |-
      1 Het gemeentelijk stembureau voert onder vermelding van het nummer van het stembureau in ieder geval de aantallen,
      bedoeld in [artikel Na 26, eerste tot en met derde lid][ref1], uit het proces-verbaal in de programmatuur in.

      2 De invoer, bedoeld in het eerste lid:

      a. wordt afzonderlijk van elkaar, door twee leden van het gemeentelijk stembureau of ondersteuners gedaan; en

      b. geschiedt handmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_26
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_26a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Na_26
        hoofdstuk: Na
        paragraaf: '4'
        afdeling: II
  - number: Na 27
    text: |-
      1 Het gemeentelijk stembureau controleert de met de programmatuur gegenereerde uitkomst van de stemming op
      gemeentelijk niveau aan de hand van een door de Kiesraad op te stellen controleprotocol. Indien het gemeentelijk
      stembureau tot het oordeel komt dat de programmatuur niet betrouwbaar heeft gefunctioneerd en het gebrek na
      onderzoek niet hersteld kan worden, laat het de met de programmatuur gegenereerde uitkomst buiten beschouwing en
      stelt het de Kiesraad onverwijld van dit oordeel in kennis.

      2 De uitkomst van de controle, bedoeld in het eerste lid, wordt in het proces-verbaal van het gemeentelijk
      stembureau vermeld.

      3 De Kiesraad maakt het controleprotocol, bedoeld in het eerste lid, voor een verkiezing uiterlijk op de dag van de
      kandidaatstelling in de Staatscourant bekend.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_27
  - number: Na 28
    text: |-
      Burgemeester en wethouders informeren het gemeentelijk stembureau op basis van de registratie, bedoeld in
      [artikel D 1][ref1], over het aantal kiesgerechtigden voor de stemming. Dit aantal wordt door het gemeentelijk
      stembureau in de programmatuur en het proces-verbaal overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_28
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_1
        hoofdstuk: D
        afdeling: II
  - number: Na 29
    text: |-
      Het gemeentelijk stembureau stelt de aanwezige personen in kennis van de aantallen, bedoeld in de
      [artikelen Na 26][ref1] en [Na 28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_26
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_28
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_29
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Na_26
        hoofdstuk: Na
        paragraaf: '4'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: Na_28
        hoofdstuk: Na
        paragraaf: '4'
        afdeling: II
  - number: Na 30
    text: |-
      De aanwezige personen kunnen mondeling bezwaren inbrengen. De bezwaren, alsmede de reactie van het gemeentelijk
      stembureau daarop, worden in het proces-verbaal van het gemeentelijk stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_30
  - number: Na 31
    text: |-
      1 Nadat alle werkzaamheden zijn voltooid, wordt daarvan aanstonds proces-verbaal opgemaakt.

      2 Het proces-verbaal wordt door alle aanwezige leden van het gemeentelijk stembureau getekend, onder wie ten minste
      de voorzitter en alle plaatsvervangend voorzitters.

      3 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_31
  - number: Na 32
    text: |-
      1 Het gemeentelijk stembureau draagt zijn proces-verbaal onverwijld over aan de burgemeester. Ook de eerder op
      grond van [artikel Na 9][ref1] ontvangen transportboxen en enveloppen worden terug overgedragen.

      2 Tot aan de overdracht draagt het gemeentelijk stembureau er zorg voor dat de zegels op de transportboxen en de
      enveloppen niet worden verbroken.

      3 Het gemeentelijk stembureau brengt het met de programmatuur gegenereerde digitale bestand met de uitkomst van
      de stemming op gemeentelijk niveau langs elektronische weg over naar de burgemeester, het hoofdstembureau en het
      centraal stembureau, dan wel, indien het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van
      provinciale staten van een provincie die één kieskring vormt, naar de burgemeester en het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_9
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_32
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Na_9
        hoofdstuk: Na
        paragraaf: '1'
        afdeling: II
  - number: Na 33
    text: |-
      1 De burgemeester maakt het proces-verbaal van het gemeentelijk stembureau, het met de programmatuur gegenereerde
      digitale bestand met de uitkomst van de stemming op gemeentelijk niveau, de processen-verbaal van de stembureaus
      en, indien van toepassing, de bijbehorende corrigenda, met weglating van de ondertekening, onverwijld op een
      algemeen toegankelijke wijze elektronisch openbaar.

      2 De openbaarmaking geschiedt ten minste tot drie maanden nadat over de toelating van de gekozenen is beslist.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de elektronische
      openbaarmaking van de processen-verbaal, corrigenda en de digitale bestanden.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_33
  - number: Na 34
    text: |-
      1 De burgemeester legt onverwijld afschriften van het proces-verbaal van het gemeentelijk stembureau, de processen-
      verbaal van de stembureaus en, indien van toepassing, de bijbehorende corrigenda, voor eenieder ter inzage in het
      gemeentehuis totdat over de toelating van de gekozenen is beslist.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de terinzagelegging van
      de processen-verbaal en de corrigenda.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_34
  - number: Na 35
    text: |-
      1 Het proces-verbaal van het gemeentelijk stembureau wordt onverwijld overgebracht naar het hoofdstembureau dan
      wel, indien het de verkiezing betreft van de gemeenteraad, van het algemeen bestuur of van provinciale staten van
      een provincie die één kieskring vormt, het centraal stembureau. Indien in de gemeente geen centrale stemopneming
      heeft plaatsgevonden, worden daarbij tevens de processen-verbaal van de stembureaus en de corrigenda overgebracht.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de overdracht, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_35
  - number: Na 36
    text: |-
      1 Indien het betreft de verkiezing van de leden van de gemeenteraad, provinciale staten of het algemeen bestuur,
      verstrekt de burgemeester zo spoedig mogelijk nadat over de toelating van de gekozenen is beslist het digitale
      bestand met de uitkomst van de stemopneming aan de Kiesraad.

      2 Indien het gemeentelijk stembureau geen programmatuur heeft gebruikt ten behoeve van de vaststelling van de
      uitkomst van de stemopneming verstrekt de burgemeester in plaats van het digitale bestand, bedoeld in het eerste
      lid, een afschrift van het proces-verbaal van het gemeentelijk stembureau aan de Kiesraad alsmede, indien er geen
      centrale stemopneming heeft plaatsgevonden, afschriften van de processen-verbaal van de stembureaus.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_36
  - number: Na 37
    text: |-
      1 De burgemeester bewaart de pakken, bedoeld in [artikel N 2][ref1] en [N 9][ref2], en de afschriften, bedoeld in
      [artikel Na 34, eerste lid][ref3], tot drie maanden nadat over de toelating van de gekozenen is beslist. Daarna
      worden deze stukken onmiddellijk vernietigd, tenzij:

      a. de officier van justitie of de rechter-commissaris in het kader van een strafrechtelijk onderzoek een verzoek
      heeft gedaan tot overdracht van deze stukken, in welk geval de vernietiging plaatsvindt nadat dit onderzoek is
      afgerond;

      b. strafvervolging is ingesteld wegens een strafbaar gestelde gedraging in deze
      wet, de [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref4] of de
      [artikelen 131 tot en met 135 van het Wetboek van Strafrecht BES][ref5], in welk geval de vernietiging plaatsvindt
      nadat er een onherroepelijke rechterlijke uitspraak is.

      2 Van de vernietiging wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_34
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel125
      [ref5]: https://wetten.overheid.nl/BWBR0028570#Artikel131
