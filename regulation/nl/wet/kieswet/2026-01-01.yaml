    text: |-
      Bij ministeriële regeling kunnen krachtens de [afdelingen II][ref1] en [IV][ref2] vastgestelde modellen die
      ingevolge bepalingen van deze afdeling van overeenkomstige toepassing worden verklaard voor de verkiezing van de
      leden van het Europees Parlement, voor deze verkiezing nader worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#AfdelingII
      [ref2]: https://wetten.overheid.nl/BWBR0004627#AfdelingIV
