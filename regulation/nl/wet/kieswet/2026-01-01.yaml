  - number: Pa 16
    text: |-
      1 Bij de zitting bedoeld in [artikel I 4][ref1] kunnen geïnteresseerden, anders dan fysiek aanwezigen, aanwezig
      zijn door deze bij te wonen in een digitale omgeving. Daarnaast dienen geïnteresseerden de zitting op afstand te
      kunnen volgen door middel van een live-verbinding.

      2 Een zitting bedoeld in het eerste lid vindt slechts doorgang voor zover:

      a. de leden zichtbaar en hoorbaar herkenbaar zijn op een zodanige wijze dat hun identiteit kan worden vastgesteld;

      b. de andere deelnemers zichtbaar en hoorbaar kunnen zijn voor zover de voorzitter hun het woord verleent; en

      c. de voorzitter in staat is de orde te handhaven.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de digitale omgeving, de live-
      verbinding en de wijze waarop geïnteresseerden via de digitale omgeving bezwaren kunnen inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
