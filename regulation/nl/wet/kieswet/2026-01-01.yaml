        artikel: J_7a
        hoofdstuk: J
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004627
        artikel: V_6
        hoofdstuk: V
        paragraaf: '1'
        afdeling: IV
  - number: J 26
    text: |-
      1 De kiezer gaat na ontvangst van het stembiljet naar een stemhokje en stemt aldaar door een wit stipje, geplaatst
      vóór de kandidaat van zijn keuze, rood te maken.

      2 Hij vouwt vervolgens het stembiljet dicht en gaat daarmee naar het stembureau.

      3 Het derde lid van het stembureau ziet erop toe, dat de kiezer het stembiljet in de stembus steekt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_26
  - number: J 27
    text: |-
      1 Indien een kiezer zich bij de invulling van zijn stembiljet vergist, geeft hij dit aan de voorzitter terug. Deze
      verstrekt hem op zijn verzoek eenmaal een nieuw biljet.

      2 De teruggegeven stembiljetten worden door de voorzitter onmiddellijk onbruikbaar gemaakt op bij algemene
      maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_27
  - number: J 28
    text: |-
      Wanneer aan het stembureau blijkt dat een kiezer wegens zijn lichamelijke gesteldheid hulp behoeft, staat het toe
      dat deze zich laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_28
  - number: J 29
    text: |-
      1 Indien het stembureau blijkt dat een kiezer het stembiljet niet in de stembus steekt, houdt de voorzitter daarvan
      aantekening.

      2 Indien een kiezer zijn stembiljet teruggeeft, wordt dit door de voorzitter onmiddellijk onbruikbaar gemaakt op
      een bij algemene maatregel van bestuur te regelen wijze.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_29
  - number: J 30
    text: |-
      Zodra de voor de stemming bepaalde tijd verstreken is, wordt dit door de voorzitter aangekondigd en worden alleen
      de op dat ogenblik in het stemlokaal of bij de ingang daarvan aanwezige kiezers nog tot de stemming toegelaten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_30
  - number: J 31
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de gang van zaken bij de
      stemming.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_31
  - number: J 35
    text: |-
      1 Gedurende de tijd dat het stembureau zitting houdt, is eenieder bevoegd in het stemlokaal te vertoeven, voor
      zover de orde daardoor niet wordt verstoord en de voortgang van de zitting niet wordt belemmerd.

      2 De in het stemlokaal aanwezige personen kunnen mondeling bezwaren inbrengen.

      3 De bezwaren, alsmede de reactie van het stembureau daarop, worden in het proces-verbaal van de zitting van het
      stembureau vermeld. Voor zover sprake is van verwerking van persoonsgegevens op grond van deze bepaling zijn de
      artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_35
  - number: J 36
    text: In het stemlokaal worden geen activiteiten ontplooid die erop gericht zijn de kiezers in hun keuze te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_36
  - number: J 37
    text: |-
      De voorzitter is belast met de handhaving van de orde tijdens de zitting. Hij kan daartoe de burgemeester om
      bijstand verzoeken.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_37
  - number: J 38
    text: |-
      1 Indien zich naar het oordeel van het stembureau omstandigheden voordoen in of bij het stemlokaal die de
      behoorlijke voortgang van de zitting onmogelijk maken, wordt dit door de voorzitter verklaard. De zitting wordt
      daarop geschorst. De voorzitter doet hiervan terstond mededeling aan de burgemeester. De burgemeester bepaalt
      vervolgens wanneer en waar de zitting wordt hervat.

      2 Bij of krachtens algemene maatregel van bestuur worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_38
  - number: J 39
    text: |-
      1 Onze Minister van Buitenlandse Zaken kan ter uitvoering van een verdrag of een internationale afspraak personen
      toelaten die als waarnemer getuige mogen zijn van het verloop van de verkiezingen.

      2 Een waarnemer is bevoegd in het stemlokaal te vertoeven gedurende de tijd dat het stembureau zitting houdt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent waarneming bij de
      verkiezingen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_39
  - number: K 1
    text: |-
      1 Aan de kiezer wordt overeenkomstig de bepalingen van dit hoofdstuk op zijn verzoek toegestaan binnen het gebied
      van het orgaan waarvoor de verkiezing wordt gehouden, aan de stemming deel te nemen in een stembureau van zijn
      keuze.

      2 Onverminderd het eerste lid kan de kiezer stemmen in de stemlokalen, bedoeld in [artikel J 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_5
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_5
        hoofdstuk: J
        paragraaf: '1'
        afdeling: II
  - number: K 2
    text: |-
      Het in [artikel K 1][ref1] bepaalde geldt niet voor de kiezer aan wie op zijn verzoek is toegestaan bij volmacht te
      stemmen of een briefstembewijs is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_1
        hoofdstuk: K
        afdeling: II
  - number: K 3
    text: |-
      1 De kiezer richt zijn verzoek, schriftelijk of mondeling, aan de burgemeester van de gemeente waar hij op de dag
      van de kandidaatstelling als kiezer is geregistreerd.

      2 De kiezer legt bij zijn verzoek een kopie over van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      3 Het schriftelijk verzoek dient op de vijfde dag voor de dag van de stemming te zijn ontvangen. Het mondeling
      verzoek wordt uiterlijk op de dag voor de stemming om twaalf uur gedaan. De burgemeester doet van deze termijnen op
      de dag van de kandidaatstelling mededeling in het gemeenteblad.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: K 4
    text: |-
      1 Aan de kiezer wordt als bewijs dat aan zijn verzoek is voldaan een verklaring uitgereikt of verzonden, genaamd
      kiezerspas.

      2 De kiezer aan wie een kiezerspas is uitgereikt of verzonden, kan uitsluitend met deze pas aan de verkiezing
      deelnemen.

      3 Aan de kiezer wiens kiezerspas in het ongerede is geraakt, wordt geen nieuwe uitgereikt of verzonden.

      4 Bij ministeriële regeling wordt voor de kiezerspas een model vastgesteld. Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties verstrekt tijdig voor de verkiezing aan de gemeente de informatie nodig voor het produceren van
      de kiezerspas.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_4
  - number: K 6
    text: |-
      1 Voor het indienen van een schriftelijk verzoek wordt een formulier gebruikt. Bij ministeriële regeling wordt voor
      het formulier een model vastgesteld.

      2 Een mondeling verzoek geschiedt door de kiezer in persoon bij de gemeente waar hij op de dag van de
      kandidaatstelling als kiezer is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_6
  - number: K 7
    text: |-
      1 In afwijking van [artikel K 3][ref1] dient een persoon die als kiezer is geregistreerd als bedoeld in
      [artikel D 2][ref2], een schriftelijk verzoek in bij de burgemeester van 's-Gravenhage.

      2 Een verzoek dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_3
        hoofdstuk: K
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_2
        hoofdstuk: D
        afdeling: II
  - number: K 8
    text: |-
      1 Op het schriftelijk verzoek wordt zo spoedig mogelijk beslist. Op het mondeling verzoek wordt terstond beslist.

      2 Het verzoek wordt slechts afgewezen, indien de verzoeker op de dag van de kandidaatstelling niet als kiezer is
      geregistreerd, hem overeenkomstig [paragraaf 2 van hoofdstuk L][ref1] is toegestaan bij volmacht te stemmen, of een
      briefstembewijs is verstrekt.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld.

      4 [Artikel D 8][ref2] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_8
        hoofdstuk: D
        afdeling: II
  - number: K 9
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen met een
      kiezerspas, onder meer over de indiening van een verzoek, de beslissing op een verzoek en de verstrekking van
      formulieren, bedoeld in [artikel K 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_6
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: K_6
        hoofdstuk: K
        afdeling: II
  - number: K 11
    text: |-
      1 Bij de stemming overhandigt de kiezer het in [artikel J 24, eerste lid, onder a][ref1], genoemde
      identiteitsdocument, en de kiezerspas aan de voorzitter van het stembureau.

      2 [Artikel J 25, tweede tot en met vierde lid, en zesde tot en met tiende lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelK_11
