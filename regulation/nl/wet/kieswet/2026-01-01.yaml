  - number: E 1
    text: |-
      1 Voor de verkiezing van de leden van de Tweede Kamer wordt Nederland verdeeld in kieskringen, overeenkomstig de
      bij deze wet gevoegde tabel.

      2 De kieskringen voor de verkiezing van de leden van de Tweede Kamer, voor zover gelegen in het Europese deel van
      Nederland, vormen tevens de kieskringen voor de verkiezing van de leden van provinciale staten. Provinciale staten
      kunnen voor de verkiezing van de leden van provinciale staten deze kieskringen in meer kieskringen verdelen en
      wijzen daarbij de gemeenten aan waar een hoofdstembureau wordt gevestigd.

      3 Voor de verkiezing van de leden van het algemeen bestuur vormt elk waterschap één kieskring.

      4 Voor de verkiezing van de leden van de gemeenteraad vormt elke gemeente één kieskring.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_1
  - number: E 3
    text: |-
      1 Burgemeester en wethouders stellen één of meer stembureaus in de gemeente in. Ieder stembureau heeft een nummer.

      2 De stembureaus voor de verkiezing van de leden van provinciale staten zijn tevens de stembureaus voor de
      verkiezing van de leden van het algemeen bestuur.

      3 Een stembureau bestaat uit een bij algemene maatregel van bestuur vast te stellen aantal leden, van wie er één
      voorzitter is.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_3
  - number: E 4
    text: |-
      1 Burgemeester en wethouders benoemen tijdig voor elke verkiezing de leden van elk stembureau en een voldoend
      aantal plaatsvervangende leden.

      2 Als lid of plaatsvervangend lid van het stembureau kan worden benoemd degene die op de dag van de stemming de
      leeftijd van achttien jaar heeft bereikt en, na het volgen van een training, naar het oordeel van burgemeester
      en wethouders over voldoende kennis en vaardigheden beschikt op het terrein van het verkiezingsproces, met
      uitzondering van degene:

      a. die op de dag van de kandidaatstelling bij onherroepelijke rechterlijke uitspraak van het kiesrecht is ontzet;

      b. die lid of plaatsvervangend lid is van het gemeentelijk stembureau, hoofdstembureau of centraal stembureau voor
      de desbetreffende verkiezing;

      c. die als lid van een stembureau bij een vorige verkiezing heeft gehandeld of een handeling heeft nagelaten in
      strijd met het bij of krachtens deze wet bepaalde;

      d. die kandidaat is voor de verkiezing in de betreffende kieskring;

      e. die gekozen lid is van het vertegenwoordigend orgaan waarvoor de verkiezing wordt gehouden.

      3 Het lidmaatschap van het stembureau eindigt van rechtswege nadat over de toelating van de gekozenen is beslist.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de training, waaronder regels over
      een toets. Hierbij kan worden bepaald dat uitsluitend degenen die de toets met goed gevolg hebben afgelegd als lid
      of plaatsvervangend lid van het stembureau kunnen worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_4
  - number: E 5
    text: |-
      1 Burgemeester en wethouders van ’s-Gravenhage stellen voor elke verkiezing van de leden van de Tweede Kamer een
      briefstembureau in de gemeente in.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt bij de Vertegenwoordiging van Nederland in
      Aruba, Curaçao en Sint Maarten voor elke verkiezing van de leden van de Tweede Kamer een briefstembureau in.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan, in overeenstemming met burgemeester en
      wethouders van de desbetreffende gemeente, voor elke verkiezing van de leden van de Tweede Kamer een gemeente
      aanwijzen waar door burgemeester en wethouders ook een briefstembureau wordt ingesteld.

      4 Een briefstembureau bestaat uit een bij algemene maatregel van bestuur vast te stellen aantal leden, van wie er
      één voorzitter is.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_5
  - number: E 6
    text: |-
      1 Burgemeester en wethouders van 's-Gravenhage respectievelijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties respectievelijk burgemeester en wethouders van de aangewezen gemeente benoemen tijdig
      voor elke verkiezing van de leden van de Tweede Kamer de leden van het briefstembureau en een voldoend aantal
      plaatsvervangende leden.

      2 [Artikel E 4, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat:

      a. in het tweede lid in plaats van onderdeel b wordt gelezen: die lid of plaatsvervangend lid is van het nationaal
      briefstembureau of centraal stembureau voor de desbetreffende verkiezing.

      b. de bevoegdheden van burgemeester en wethouders ten aanzien van een briefstembureau als bedoeld in
      [artikel E 5, tweede lid][ref2], toekomen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_5
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_6
