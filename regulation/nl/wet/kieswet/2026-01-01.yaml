        paragraaf: '4'
        afdeling: II
  - number: P 20b
    text: |-
      1 Het centraal stembureau controleert de met de programmatuur gegenereerde uitkomst van de stemming aan de hand
      van een door de Kiesraad op te stellen controleprotocol. Indien het centraal stembureau tot het oordeel komt dat
      de programmatuur niet betrouwbaar heeft gefunctioneerd en het gebrek na onderzoek niet hersteld kan worden, laat
      het de met de programmatuur gegenereerde uitkomst buiten beschouwing. Indien het de verkiezing van de leden van
      de gemeenteraad, de provinciale staten of het algemeen bestuur betreft, stelt het centraal stembureau de Kiesraad
      onverwijld van dit oordeel in kennis.

      2 De Kiesraad maakt het controleprotocol, bedoeld in het eerste lid, voor een verkiezing uiterlijk op de dag van de
      kandidaatstelling in de Staatscourant bekend.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_20b
  - number: P 21
    text: |-
      1 Indien een ernstig vermoeden bestaat dat een of meer gemeentelijk stembureaus of briefstembureaus bij de
      stemopneming zodanige fouten hebben gemaakt dat die van invloed kunnen zijn op de zetelverdeling, kan het
      centraal stembureau op de in [artikel P 20][ref1] bedoelde zitting, voordat de uitslag van de verkiezing bekend
      wordt gemaakt, hetzij ambtshalve, hetzij naar aanleiding van een onderbouwd verzoek van een of meer personen,
      besluiten over te gaan tot een nieuwe opneming van stembiljetten, zowel uit alle als uit een of meer stembureaus
      of briefstembureaus.

      2 Een nieuwe stemopneming als bedoeld in het eerste lid, wordt onder mandaat en machtiging van het centraal
      stembureau in het openbaar uitgevoerd door het gemeentelijk stembureau of het briefstembureau dat de stemmen eerder
      heeft opgenomen.

      3 De burgemeester dan wel de vertegenwoordiger van Nederland in Aruba, Sint Maarten of Curaçao wijst een of meer
      geschikte locaties aan voor de nieuwe stemopneming en de vaststelling en bekendmaking van de uitkomsten van deze
      stemopneming. Voorts wordt vastgesteld op welke dag en op welk tijdstip de nieuwe stemopneming aanvangt. Het
      besluit hieromtrent wordt onverwijld op een algemeen toegankelijke wijze elektronisch openbaar gemaakt.

      4 Indien de nieuwe stemopneming wordt uitgevoerd door een gemeentelijk stembureau zijn de
      [artikelen P 1e, derde tot en met zevende lid][ref2], [P 1f][ref3] en [P 1g][ref4] van overeenkomstige toepassing.

      5 Indien de nieuwe stemopneming wordt uitgevoerd door een briefstembureau, is
      [artikel P 1i, tweede tot en met vierde lid][ref5], van overeenkomstige toepassing.

      6 Indien bij een gecombineerde stemming als bedoeld in [artikel J 6][ref6] of [J 6a][ref7] van de Kieswet een
      nieuwe stemopneming plaatsvindt, geschiedt deze mede in aanwezigheid van het centraal stembureau voor de andere
      verkiezing. Het centraal stembureau dat mede aanwezig is bij de nieuwe stemopneming doet daarvan verslag aan het
      vertegenwoordigend orgaan waarvoor het de verkiezingsuitslag vaststelt of heeft vastgesteld.

      7 Omtrent de nieuwe stemopneming kunnen bij algemene maatregel van bestuur nadere regels worden gesteld.


