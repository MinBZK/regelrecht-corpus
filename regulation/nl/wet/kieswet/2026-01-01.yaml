  - number: P 18
    text: |-
      1 Betreft het een lijstengroep, dan geldt, indien een kandidaat met toepassing van artikel P 17 op meer dan één
      lijst van de lijstengroep gekozen is, die kandidaat als gekozen op de lijst waarop het grootste aantal stemmen
      op hem is uitgebracht. Voor zover aantallen gelijk zijn, geldt hij als gekozen op de lijst, ingeleverd voor de
      kieskring met het laagste nummer.

      2 De aan een lijst toegewezen zetels die na toepassing van het eerste lid nog niet aan een kandidaat zijn
      toegewezen, worden aan de nog niet gekozen kandidaten van de desbetreffende lijst toegewezen in de volgorde van
      de lijst.

      3 Indien na toepassing van het tweede lid opnieuw een kandidaat op meer dan één lijst is gekozen, wordt de
      procedure, bedoeld in het eerste en tweede lid, zo lang herhaald, totdat alle aan de lijsten toegewezen zetels aan
      kandidaten zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_18
  - number: P 19
    text: |-
      1 Het centraal stembureau rangschikt ten aanzien van iedere lijst de daarop voorkomende kandidaten zodanig, dat
      bovenaan komen te staan de kandidaten aan wie een zetel is toegewezen met toepassing van [artikel P 15][ref1], in
      de volgorde waarin de zetels zijn toegewezen.

      2 Vervolgens worden, in de volgorde van de aantallen op hen uitgebrachte stemmen, gerangschikt de op de lijst
      voorkomende kandidaten die op de gezamenlijke lijsten waarop zij voorkomen een aantal stemmen hebben verkregen,
      groter dan 25% van de kiesdeler onderscheidenlijk groter dan de helft van de kiesdeler, doch die niet met
      toepassing van [artikel P 15, eerste onderscheidenlijk tweede lid][ref2], zijn gekozen verklaard. Indien aantallen
      gelijk zijn, beslist de volgorde van de lijst.

      3 Tenslotte worden, in de volgorde van de lijst, gerangschikt de overige op de lijst voorkomende kandidaten.

      4 Bij de rangschikking blijft [artikel P 18][ref3] buiten toepassing.

      5 Behoudens ten aanzien van de verkiezing waarbij het aantal te verdelen zetels minder dan negentien bedraagt,
      blijft de rangschikking achterwege, voor zover het lijsten betreft waarop geen kandidaten gekozen zijn verklaard en
      die niet deel uitmaken van een lijstengroep waaraan één of meer zetels zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
