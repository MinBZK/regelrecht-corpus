  - number: Ya 26
    text: |-
      1 Onverminderd het bepaalde in het tweede lid, geldt een geregistreerde aanduiding waarvan overeenkomstig het
      bepaalde in [artikel G 1, achtste lid][ref1], dan wel [artikel Ya 15, derde lid][ref2], mededeling is gedaan,
      tevens voor de verkiezing van de leden van het kiescollege.

      2 Het centraal stembureau voor de verkiezing van de leden van het kiescollege bepaalt dat de in het eerste
      lid bedoelde doorwerking van de registratie voor die verkiezing niet plaatsvindt, indien de geregistreerde
      aanduiding geheel of in hoofdzaak overeenstemt met een reeds op de voet van [artikel G 2][ref3] in samenhang
      met [artikel Ya 25][ref4] geregistreerde aanduiding van een andere politieke groepering, en daardoor verwarring te
      duchten is.

      3 Een beschikking als bedoeld in het tweede lid wordt genomen uiterlijk op de veertiende dag na de dagtekening van
      de Staatscourant waarin de mededeling, bedoeld in [artikel G 1, achtste lid][ref5], is gedaan of uiterlijk op
      de veertiende dag na de dagtekening van de mededeling, bedoeld in [artikel Ya 15, derde lid][ref6]. De beschikking
      wordt terstond aan de gemachtigde van de desbetreffende groepering bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelYa_15
