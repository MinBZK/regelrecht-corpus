  - number: W 8
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de voorziening in opengevallen
      plaatsen in vertegenwoordigende organen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelW_8
  - number: X 1
    text: |-
      1 Zodra onherroepelijk is komen vast te staan dat een lid van een vertegenwoordigend orgaan een van de vereisten
      voor het lidmaatschap niet bezit of dat hij een met het lidmaatschap onverenigbare betrekking vervult, houdt hij op
      lid te zijn.

      2 De voorzitter van het vertegenwoordigend orgaan geeft hiervan onverwijld kennis aan de voorzitter van het
      centraal stembureau.

      3 Een overeenkomstige kennisgeving vindt plaats, indien door het overlijden van een lid een plaats in het
      vertegenwoordigend orgaan is opengevallen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelX_1
  - number: X 2
    text: |-
      1 Een lid van een vertegenwoordigend orgaan, tot wiens toelating is besloten, kan te allen tijde zijn ontslag
      nemen. Ontslagneming met terugwerkende kracht is niet mogelijk.

      2 Hij bericht dit schriftelijk aan de voorzitter van het vertegenwoordigend orgaan. Deze geeft hiervan onverwijld
      kennis aan de voorzitter van het centraal stembureau.

      3 Op een ingediend ontslag kan niet worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelX_2
  - number: X 3
    text: |-
      1 Wanneer een lid van de Tweede of van de Eerste Kamer wordt benoemd in een ambt als bedoeld in
      [artikel 57, tweede lid, van de Grondwet][ref1], houdt zijn lidmaatschap van de Kamer van rechtswege op.

      2 Wanneer een lid van de Tweede of van de Eerste Kamer komt te verkeren in een van de gevallen, genoemd in het
      [eerste lid van artikel X 1][ref2], anders dan op grond van het voorgaande lid, geeft hij hiervan kennis aan de
      kamer, met vermelding van de reden.

      3 Indien de kennisgeving niet is gedaan en de voorzitter van de kamer van oordeel is, dat een lid van de
      kamer verkeert in een van de gevallen, genoemd in het [eerste lid van artikel X 1][ref3], waarschuwt hij de
      belanghebbende schriftelijk.

      4 Het staat deze vrij de zaak uiterlijk op de achtste dag na de dagtekening van de in het derde lid bedoelde
      waarschuwing aan het oordeel van de kamer te onderwerpen.


