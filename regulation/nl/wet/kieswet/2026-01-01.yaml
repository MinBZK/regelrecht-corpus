        paragraaf: '1'
        afdeling: II
  - number: I 13
    text: |-
      Bij de nummering gelden de lijstengroepen alsmede de niet van een groep deel uitmakende stellen gelijkluidende
      lijsten als één lijst.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_13
  - number: I 14
    text: |-
      1 Eerst worden genummerd de lijsten van politieke groeperingen wier aanduiding was geplaatst boven een
      kandidatenlijst waaraan bij de laatstgehouden verkiezing van de leden van het desbetreffende vertegenwoordigend
      orgaan een of meer zetels zijn toegekend. Aan deze lijsten worden de nummers 1 en volgende toegekend in de volgorde
      van de bij die verkiezing op de desbetreffende lijsten uitgebrachte aantallen stemmen, met dien verstande dat aan
      de lijst van de groepering met het hoogste aantal stemmen het nummer 1 wordt toegekend. Bij gelijkheid van het
      aantal beslist het lot.

      2 Het eerste lid is van overeenkomstige toepassing voor de gevallen, bedoeld in
      [artikel H 4, achtste lid, onderdelen a, b en c][ref1]. In de gevallen, bedoeld in artikel H 4, achtste lid,
      onderdelen a en b, waarbij aan ten minste één van de betrokken groeperingen één of meer zetels zijn toegekend
      worden voor de toepassing van het bepaalde in de tweede volzin van het eerste lid, de op de lijsten uitgebrachte
      aantallen stemmen van de groeperingen waaraan die zetels zijn toegekend, bij elkaar opgeteld.

      3 Vervolgens worden, met de nummers volgende op het laatste krachtens het eerste lid toegekende nummer, genummerd
      de overige lijsten in de volgorde van het aantal kieskringen waarvoor de lijst geldt, met dien verstande dat het
      eerstvolgende nummer wordt toegekend aan de lijst die geldt voor de meeste kieskringen. Bij een gelijk aantal
      kieskringen beslist het lot.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_14
    references:
      - id: ref1
