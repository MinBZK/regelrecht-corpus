  - number: Pa 4
    text: |-
      Voor de verkiezing van de leden van het kiescollege vormt het gebied buiten Nederland één kieskring: kieskring
      buitenland.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelPa_4
  - number: Pa 5
    text: |-
      1 Voor de verkiezing van de leden van het kiescollege stellen burgemeester en wethouders geen stembureaus
      in als bedoeld in [artikel E 3, eerste lid][ref1], en geen gemeentelijk stembureau als bedoeld in
      [artikel E 6, eerste lid][ref2].

      2 Voor de verkiezing van de leden van het kiescollege wordt een briefstembureau ingesteld als bedoeld in
      [artikel E 5, eerste lid][ref3].

      3 De [artikelen E 5, vierde lid][ref4], en E 5a zijn van overeenkomstige toepassing op het briefstembureau bedoeld
      in het tweede lid, met dien verstande dat in plaats van artikel E 5a, eerste lid, wordt gelezen: Burgemeester en
      wethouders van ’s-Gravenhage benoemen tijdig voor de verkiezing van de leden van het kiescollege de leden van het
      briefstembureau en een voldoend aantal plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_3
