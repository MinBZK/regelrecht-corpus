  - number: N 38
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_38
  - number: Na 1
    text: |-
      1 Het gemeentelijk stembureau houdt op de dag na de dag van de stemming een openbare zitting.

      2 In afwijking van het eerste lid houdt het gemeentelijk stembureau bij de verkiezing van de leden van het algemeen
      bestuur op de eerste of de tweede dag na de dag van de stemming een openbare zitting.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_1
  - number: Na 2
    text: |-
      1 Burgemeester en wethouders wijzen voor de zitting van het gemeentelijk stembureau een of meer geschikte locaties
      aan. Voorts stellen zij voor elke locatie de dag en het tijdstip vast waarop de werkzaamheden aanvangen.

      2 De aanwijzing van een of meer locaties, de dag en het aanvangstijdstip van de werkzaamheden worden ten minste
      veertien dagen voor de dag van de stemming bekendgemaakt.

      3 Indien voor de controle van de processen-verbaal dan wel de centrale stemopneming meer dan één locatie wordt
      aangewezen, stellen burgemeester en wethouders tevens voor elk stembureau vast op welke locatie de werkzaamheden
      plaatsvinden. Het tweede lid is van overeenkomstige toepassing.

      4 Burgemeester en wethouders doen op bij algemene maatregel van bestuur vast te stellen wijze mededeling aan
      de kiezer van de locatie waar de werkzaamheden voor elk stembureau plaatsvinden alsmede van de dag en het
      aanvangstijdstip van de werkzaamheden van het gemeentelijk stembureau op elke aangewezen locatie.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_2
  - number: Na 3
    text: |-
      De burgemeester draagt zorg voor de inrichting van de locatie waar het gemeentelijk stembureau zijn werkzaamheden
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_3
  - number: Na 4
    text: |-
      1 Gedurende de zitting zijn op elke locatie waar het gemeentelijk stembureau zitting houdt ten minste vijf leden
      aanwezig, onder wie de voorzitter of een plaatsvervangend voorzitter.

      2 In afwijking van het eerste lid zijn voor de verkiezing van de leden van de gemeenteraad op elke locatie
      waar het gemeentelijk stembureau zitting houdt ten minste drie leden aanwezig, onder wie de voorzitter of een
      plaatsvervangend voorzitter.

      3 Bij afwezigheid van de voorzitter worden de bij of krachtens de wet aan hem opgedragen taken en bevoegdheden
      uitgeoefend door een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_4
  - number: Na 5
    text: |-
      1 Indien de werkzaamheden op meer dan één locatie plaatsvinden, besluiten en handelen de op elke locatie aanwezige
      leden van het gemeentelijk stembureau namens het gemeentelijk stembureau.

      2 Indien bij het nemen van een beslissing door de aanwezige leden de stemmen staken, beslist de stem van de
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_5
  - number: Na 6
    text: |-
      1 De leden van het gemeentelijk stembureau kunnen zich bij hun werkzaamheden doen bijstaan door een of meer
      ondersteuners. Ondersteuners kunnen zijn: ambtenaren van de gemeente, daartoe door burgemeester en wethouders
      aangewezen, alsmede andere personen, daartoe door burgemeester en wethouders benoemd.

      2 [Artikel E 4, tweede lid, aanhef en onderdelen a, c tot en met e, derde en vierde lid][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_6
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: E_4
        hoofdstuk: E
        paragraaf: '2'
        afdeling: II
  - number: Na 7
    text: |-
      De voorzitter van het gemeentelijk stembureau is belast met de handhaving van de orde tijdens de zitting. Hij kan
      daartoe de burgemeester om bijstand verzoeken.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_7
  - number: Na 8
    text: |-
      1 De voorzitter van het gemeentelijk stembureau schorst de zitting, indien:

      a. de werkzaamheden niet afgerond kunnen worden op de dag waarop zij zijn aangevangen; of

      b. zich naar het oordeel van het gemeentelijk stembureau in of nabij de locatie waar de zitting wordt gehouden
      omstandigheden voordoen die de behoorlijke voortgang van de zitting onmogelijk maken.

      2 Indien zich naar het oordeel van het gemeentelijk stembureau een situatie voordoet als bedoeld in het eerste lid,
      wordt dit door de voorzitter verklaard. De zitting wordt daarop geschorst. De voorzitter doet hiervan onverwijld
      mededeling aan de burgemeester. De burgemeester bepaalt vervolgens wanneer en waar de zitting wordt hervat.

      3 Bij of krachtens algemene maatregel van bestuur worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_8
  - number: Na 9
    text: |-
      De burgemeester draagt er zorg voor dat van elk stembureau de transportbox, bedoeld in
      [artikel N 11, eerste lid][ref1], en de enveloppe, bedoeld in artikel N 11, tweede lid, tijdig worden overgedragen
      aan het gemeentelijk stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_11
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: Na 10
    text: |-
      Deze paragraaf is van toepassing als bij de verkiezing geen centrale stemopneming plaatsvindt als bedoeld in
      [artikel N 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_1
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: Na 11
    text: |-
      Het gemeentelijk stembureau controleert de juistheid van de uitkomst van de stemming zoals vastgesteld door elk
      stembureau. Het is bevoegd daartoe de enveloppen, bedoeld in [artikel N 11, tweede lid][ref1], te openen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_11
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: Na 12
    text: |-
      Het gemeentelijk stembureau gaat over tot een nieuwe opneming van de stembescheiden, dan wel een deel daarvan,
      indien:

      a. het stembureau in zijn proces-verbaal melding heeft gemaakt van een verschil tussen het aantal tot de stemming
      toegelaten kiezers en het aantal uitgebrachte stemmen en het stembureau dit verschil niet volledig heeft verklaard
      in zijn proces-verbaal;

      b. het gemeentelijk stembureau vermoedt dat het stembureau een of meer fouten heeft gemaakt bij de stemopneming; of

      c. het stembureau een of meer fouten heeft gemaakt bij de vaststelling van de uitkomst van de stemming.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_12
  - number: Na 13
    text: |-
      1 De leden van het gemeentelijk stembureau zijn bevoegd om de transportbox en de pakken, bedoeld in
      [artikel N 11, eerste lid][ref1], te openen ten behoeve van een nieuwe stemopneming.

      2 Het gemeentelijk stembureau vermeldt in zijn proces-verbaal ten aanzien van welke stembureaus een nieuwe
      opneming van stembescheiden heeft plaatsgevonden, de reden op grond waarvan het daartoe is overgegaan alsmede welke
      stembescheiden het betrof.

      3 De nieuwe stemopneming van stembescheiden vindt plaats met inachtneming van hetgeen bij of krachtens de wet is
      bepaald ten aanzien van de stemopneming door een stembureau.

      4 Nadat de nieuwe stemopneming is afgerond worden de stembescheiden uit de geopende pakken opnieuw ingepakt
      en verzegeld op de in de [artikelen N 2][ref2] en [N 9][ref3] beschreven wijze. Vervolgens worden de pakken
      teruggelegd in de transportbox. Daarna wordt de transportbox op slot gedaan en verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_13
