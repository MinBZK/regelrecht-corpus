  - number: H 10
    text: |-
      1 De kandidaat wiens woonplaats buiten het Europese deel van Nederland is gelegen, wijst in de verklaring van
      instemming tevens een in het Europese deel van Nederland wonende gemachtigde aan met vermelding van diens naam,
      voorletters, woonplaats en adres. Indien de kandidaat voorkomt op meer dan één lijst, moet in iedere verklaring
      dezelfde gemachtigde worden aangewezen. Deze gemachtigde is met uitsluiting van de kandidaat bevoegd tot de
      handelingen, bedoeld in de [artikelen V 2, eerste, vierde en vijfde lid][ref1], [V 3, eerste en derde lid][ref2],
      en [W 2, eerste lid, onder f][ref3]. Indien de kandidaat woonachtig is in één van de openbare lichamen Bonaire,
      Sint Eustatius en Saba, is de gemachtigde met uitsluiting van de kandidaat bevoegd tot de handelingen, bedoeld in
      de artikelen V 2, eerste, vierde en vijfde lid, V 3, eerste en tweede lid, en W 2, eerste lid, onder f.

      2 De kandidaat is bevoegd de overeenkomstig het eerste lid gegeven volmacht in te trekken. Hij geeft hiervan
      schriftelijk kennis aan de voorzitter van het centraal stembureau, zo nodig met aanwijzing van een nieuwe
      gemachtigde. Indien geen nieuwe gemachtigde wordt aangewezen, vermeldt de kandidaat op welk adres hij de
      kennisgeving van zijn benoeming, bedoeld in [artikel V 1][ref4], wil ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_3
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_2
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_1
