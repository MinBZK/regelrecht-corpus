  - number: S 10
    text: |-
      In de zitting, bedoeld in [artikel S 2][ref1], nummert het centraal stembureau de kandidatenlijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelS_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: S_2
        hoofdstuk: S
        paragraaf: '1'
        afdeling: III
  - number: S 11
    text: |-
      Bij de nummering gelden de lijstengroepen alsmede de niet van een groep deel uitmakende stellen gelijkluidende
      lijsten als één lijst.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_11
  - number: S 12
    text: |-
      1 Eerst worden genummerd de lijsten van politieke groeperingen wier aanduiding was geplaatst boven een
      kandidatenlijst waaraan bij de laatstgehouden verkiezing van de leden van de Eerste Kamer een of meer zetels zijn
      toegekend. Aan deze lijsten worden de nummers 1 en volgende toegekend in de volgorde van de stemcijfers van de
      desbetreffende lijsten bij die verkiezing, met dien verstande dat aan de lijst van de groepering met het hoogste
      stemcijfer het nummer 1 wordt toegekend. Bij gelijkheid van het aantal beslist het lot.

      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van samenvoeging van aanduidingen
      van twee of meer groeperingen, indien bij de laatstgehouden verkiezing van de leden van de Eerste Kamer, hetzij
      aan de gezamenlijke groeperingen, hetzij aan ten minste één daarvan, één of meer zetels zijn toegekend. In het
      geval dat aan ten minste één van de groeperingen één of meer zetels zijn toegekend worden voor de toepassing
      van het bepaalde in de tweede volzin van het eerste lid, de op de lijsten uitgebrachte aantallen stemmen van de
      groeperingen waaraan die zetels zijn toegekend, bij elkaar opgeteld.

      3 Vervolgens worden, met de nummers volgende op het laatste krachtens het eerste lid toegekende nummer, genummerd
      de overige lijsten in de volgorde van het aantal provincies waarvoor de lijst geldt, met dien verstande dat het
      eerstvolgende nummer wordt toegekend aan de lijst die geldt voor de meeste provincies. Bij een gelijk aantal
      provincies beslist het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_12
  - number: S 13
    text: |-
      Nadat onherroepelijk is beslist over de geldigheid van de ingeleverde lijsten, maakt de voorzitter van het centraal
      stembureau de lijsten uiterlijk op de zevende dag voor de stemming openbaar door plaatsing van de lijsten naar de
      provincies gerangschikt en met vermelding van hun nummers en, in voorkomend geval, de aanduidingen van de politieke
      groeperingen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_13
  - number: S 14
    text: |-
      Een beslissing in beroep tot ongeldigverklaring van een kandidatenlijst heeft geen gevolg ten aanzien van de
      nummers, toegekend aan de overige kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_14
  - number: S 15
    text: |-
      Het centraal stembureau vernietigt de ingeleverde kandidatenlijsten alsmede de daarbij horende stukken, met
      uitzondering van de overgelegde verklaringen van instemming, na de vaststelling van de uitslag. Van de vernietiging
      wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_15
  - number: S 16
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens door het centraal stembureau bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_16
  - number: T 1
    text: |-
      1 De stemming vindt plaats op de vierendertigste dag na de kandidaatstelling.

      2 De stemming vindt plaats om vijftien uur (Europees-Nederlandse tijd).
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_1
  - number: T 2
    text: |-
      1 Op het bij de verkiezing te bezigen stembiljet zijn aan de ene zijde gedrukt de lijsten van kandidaten over wie
      de stemming moet geschieden, en aan de andere zijde de naam van de provincie en de handtekening van de voorzitter
      van de staten.

      2 Bij ministeriële regeling wordt voor het stembiljet een model vastgesteld.

      3 De voorzitter draagt zorg dat het benodigde aantal stembiljetten vóór de aanvang van de stemming in de
      vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_2
  - number: T 3
    text: De voorzitter benoemt uit de statenvergadering drie leden, die met hem als voorzitter het stembureau vormen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_3
  - number: T 4
    text: |-
      1 Een statenlid brengt zijn stem uit door een wit stipje, geplaatst vóór de kandidaat van zijn keuze, rood te
      maken.

      2 Aan een statenlid wordt op zijn verzoek toegestaan bij volmacht te stemmen. Het lid dat van deze bevoegdheid
      gebruik wenst te maken, doet daarvan voor de aanvang van de zitting van de staten waarin de stemming zal worden
      gehouden, schriftelijk aan de voorzitter mededeling, onder aanwijzing van een lid van de staten dat bereid is als
      gemachtigde op te treden. Een statenlid mag niet meer dan één aanwijzing als gemachtigde aannemen. Bij ministeriële
      regeling wordt voor deze mededeling een model vastgesteld.

      3 [Artikel J 27][ref1] is van toepassing, met dien verstande dat in plaats van «een kiezer» wordt gelezen: een
      statenlid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_27
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_27
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
  - number: T 5
    text: Na het uitbrengen van zijn stem levert het statenlid het stembiljet dichtgevouwen bij de voorzitter in.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_5
  - number: T 6
    text: |-
      1 De voorzitter deelt mee hoeveel stembiljetten zijn ingeleverd.

      2 De stemming is nietig, indien dit aantal groter is dan het aantal in de vergadering aanwezige leden, vermeerderd
      met het aantal aanwezige leden die als gemachtigde aan de stemming mogen deelnemen.

      3 In dit geval vernietigt de voorzitter de ingeleverde stembiljetten en heeft een nieuwe stemming plaats.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_6
  - number: T 7
    text: |-
      1 De voorzitter opent de stembiljetten.

      2 Vervolgens deelt hij ten aanzien van elk stembiljet mee voor welke lijst en welke kandidaat het geldt. Indien
      sprake is van een blanco of ongeldige stem maakt hij hiervan tevens melding.

      3 Nadat een van de leden van het stembureau het stembiljet heeft nagezien, houden de beide andere leden aantekening
      van iedere uitgebrachte stem.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_7
  - number: T 8
    text: |-
      1 Blanco is de stem uitgebracht op een stembiljet dat door de kiezer is ingeleverd zonder dat hij geheel of
      gedeeltelijk een wit stipje in een stemvak rood heeft gemaakt en zonder dat hij anderszins op het stembiljet
      geschreven of getekend heeft.

      2 Ongeldig is de stem uitgebracht op een ander stembiljet dan bij of krachtens deze wet mag worden gebruikt.

      3 Voorts is ongeldig de stem die niet als blanco wordt aangemerkt, maar waarbij de kiezer op het stembiljet
      niet, door het geheel of gedeeltelijk rood maken van het witte stipje in een stemvak, op ondubbelzinnige wijze
      heeft kenbaar gemaakt op welke kandidaat hij zijn stem uitbrengt, of waarbij op het stembiljet bijvoegingen zijn
      geplaatst waardoor de kiezer kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_8
  - number: T 9
    text: |-
      In geval van twijfel over de geldigheid van een stembiljet beslist de vergadering. Bij staken van stemmen beslist
      de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_9
  - number: T 10
    text: |-
      1 Terstond nadat de stemmen zijn opgenomen, deelt de voorzitter ten aanzien van iedere lijst mede, zowel het aantal
      op iedere kandidaat uitgebrachte stemmen als het gezamenlijke aantal uitgebrachte stemmen, dat stemcijfer wordt
      genoemd. Tevens deelt hij het aantal blanco en het aantal ongeldige stemmen mede.

      2 Vervolgens worden de stembiljetten met een blanco stem en de ongeldig verklaarde stembiljetten in pakken gedaan,
      die worden verzegeld. Op deze pakken wordt vermeld:

      a. de naam van de provincie;

      b. het aantal stembiljetten dat het pak bevat.

      3 Daarop worden de geldige stembiljetten, lijstgewijs gerangschikt, in een pak gedaan, dat wordt verzegeld. Op dit
      pak worden vermeld;

      a. de naam van de provincie;

      b. het aantal stembiljetten dat het pak bevat.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_10
  - number: T 11
    text: |-
      1 Nadat alle werkzaamheden, in [artikel T 10][ref1] vermeld, zijn beëindigd, wordt onmiddellijk proces-verbaal
      opgemaakt van de stemming en van de stemopneming.

      2 Het proces-verbaal wordt door de voorzitter en alle leden van het stembureau getekend.

      3 Het proces-verbaal wordt met de verzegelde pakken, bedoeld in [artikel T 10][ref2], onverwijld na afloop van de
      stemming overgebracht naar de voorzitter van het centraal stembureau.

      4 De voorzitter van het centraal stembureau maakt de processen-verbaal met weglating van de ondertekening
      onverwijld op een algemeen toegankelijke wijze elektronisch openbaar. Daarnaast legt deze een afschrift van de
      processen-verbaal onverwijld voor eenieder ter inzage bij het centraal stembureau totdat over de toelating van de
      gekozenen is beslist.

      5 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelT_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelT_10
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelT_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: T_10
        hoofdstuk: T
        afdeling: III
      - id: ref2
        bwb_id: BWBR0004627
        artikel: T_10
        hoofdstuk: T
        afdeling: III
  - number: U 1
    text: |-
      Onmiddellijk nadat de processen-verbaal zijn ontvangen, gaat het centraal stembureau over tot het verrichten van de
      werkzaamheden ter vaststelling en bekendmaking van de uitslag van de verkiezing.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_1
  - number: U 2
    text: |-
      1 Elke stem geldt, naar gelang van de provincie waar zij is uitgebracht, voor een aantal stemmen, gelijk aan het
      getal dat verkregen wordt door het inwonertal van de provincie te delen door het honderdvoud van het aantal leden
      waaruit provinciale staten bestaan. Het quotiënt wordt daarna afgerond tot een geheel getal, naar boven, indien
      een breuk 1/2 of meer, en naar beneden, indien een breuk minder dan 1/2 bedraagt. Dit getal wordt de stemwaarde
      genoemd.

      2 Als het inwonertal van een provincie geldt het inwonertal volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfers per 1 januari van het jaar waarin de verkiezing plaatsvindt.

      3 Indien, in geval van ontbinding van de Eerste Kamer, de inwonertallen van de provincies per 1 januari van
      het jaar waarin de verkiezing plaatsvindt drie weken voor de dag van de kandidaatstelling nog niet openbaar
      zijn gemaakt, geldt als inwonertal van een provincie het inwonertal volgens de door het Centraal Bureau voor de
      Statistiek openbaar gemaakte bevolkingscijfers per de eerste dag van de vierde maand voorafgaande aan de maand
      waarin de kandidaatstelling plaatsvindt.

      4 Het centraal stembureau stelt de stemwaarden overeenkomstig dit artikel vast en maakt deze voor de dag van
      stemming openbaar door publicatie in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_2
  - number: U 3
    text: |-
      Ten aanzien van iedere provincie vermenigvuldigt het centraal stembureau de aantallen op iedere kandidaat
      uitgebrachte stemmen en de stemcijfers van de lijsten met de voor die provincie geldende stemwaarde. Voor de
      vaststelling van de uitslag van de verkiezing gelden de aldus verkregen produkten als de aantallen op ieder
      kandidaat uitgebrachte stemmen, onderscheidenlijk de stemcijfers van de lijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_3
  - number: U 3a
    text: |-
      1 Het centraal stembureau voert in ieder geval de aantallen, bedoeld in [artikel U 3][ref1], in de programmatuur
      in.

      2 De invoer, bedoeld in het eerste lid:

      a. wordt afzonderlijk van elkaar, door twee leden van het centraal stembureau of ondersteuners gedaan; en

      b. geschiedt handmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelU_3
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_3a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: U_3
        hoofdstuk: U
        paragraaf: '2'
        afdeling: III
  - number: U 4
    text: |-
      1 Een stel gelijkluidende lijsten als bedoeld in [artikel R 10, eerste lid][ref1], geldt voor de vaststelling van
      de uitslag van de verkiezing als één lijst.

      2 Het centraal stembureau telt van deze gelijkluidende lijsten tezamen de stemcijfers en de aantallen op iedere
      kandidaat uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_10
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_4
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: R_10
        hoofdstuk: R
        afdeling: III
  - number: U 5
    text: |-
      Een lijstengroep als bedoeld in [artikel R 10, tweede lid][ref1], geldt voor het bepalen van het aantal daaraan toe
      te wijzen zetels als één lijst, met een stemcijfer gelijk aan de som van de stemcijfers van de lijsten waaruit de
      groep bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_10
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_5
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: R_10
        hoofdstuk: R
        afdeling: III
  - number: U 7
    text: |-
      1 Het centraal stembureau deelt de som van de stemcijfers van alle lijsten door het aantal te verdelen zetels.

      2 Het aldus verkregen quotiënt wordt kiesdeler genoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_7
  - number: U 8
    text: Zoveel maal als de kiesdeler is begrepen in het stemcijfer van een lijst wordt aan die lijst een zetel toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_8
  - number: U 9
    text: |-
      De overblijvende zetels, die restzetels worden genoemd, worden achtereenvolgens toegewezen aan de lijsten die na
      toewijzing van de zetels het grootste gemiddelde aantal stemmen per toegewezen zetel hebben. Indien gemiddelden
      gelijk zijn, beslist zo nodig het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_9
  - number: U 10
    text: |-
      Indien bij de toepassing van de vorige bepalingen aan een lijst meer zetels zouden moeten worden toegewezen dan er
      kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van die bepalingen over op één
      of meer van de overige lijsten waarop kandidaten voorkomen aan wie geen zetel is toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_10
  - number: U 12
    text: |-
      1 De verdeling van de aan een lijstengroep toegewezen zetels over de lijsten waaruit de groep bestaat, geschiedt
      als volgt.

      2 Het centraal stembureau deelt het stemcijfer van de lijstengroep door het aantal aan de groep toegewezen zetels.

      3 Het aldus verkregen quotiënt wordt groepskiesdeler genoemd.

      4 Zoveel maal als de groepskiesdeler is begrepen in het stemcijfer van elk van de lijsten waaruit de groep bestaat,
      wordt aan die lijst een van de aan de groep toegewezen zetels toegewezen.

      5 De restzetels worden achtereenvolgens toegewezen aan de lijsten van de groep waarvan de stemcijfers bij deling
      door de groepskiesdeler de grootste overschotten hebben. Hierbij worden lijsten die geen overschot hebben, geacht
      lijsten te zijn met het kleinste overschot. Indien overschotten gelijk zijn, beslist zo nodig het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_12
  - number: U 13
    text: |-
      1 Indien bij de toepassing van [artikel U 12][ref1] aan een lijst meer zetels zouden moeten worden toegewezen dan
      er kandidaten zijn, gaan de overblijvende zetel of zetels door voorgezette toepassing van dat artikel over op een
      van de andere lijsten van de groep, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.

      2 Zijn er na toepassing van het eerste lid nog zetels toe te wijzen, dan worden deze toegewezen volgens het stelsel
      van de grootste gemiddelden als bedoeld in [artikel U 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelU_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelU_9
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_13
