  - number: P 1i
    text: |-
      1 De [artikelen P 1b][ref1], [P 1d][ref2] en [P 1e, eerste, tweede, zesde en zevende lid][ref3], zijn van
      overeenkomstige toepassing op de processen-verbaal van briefstembureaus, met dien verstande dat ten aanzien van de
      briefstembureaus in Aruba, Curaçao en Sint Maarten de aan de burgemeester opgedragen taken worden verricht door de
      vertegenwoordiger van Nederland in het betreffende land.

      2 Een nieuwe opneming van stembescheiden vindt plaats met inachtneming van hetgeen bij of krachtens de wet is
      bepaald ten aanzien van het briefstembureau, met dien verstande dat [artikel Na 14][ref4] van overeenkomstige
      toepassing is.

      3 De [artikelen P 1f][ref5] en [P 1g][ref6] zijn van toepassing, met dien verstande dat voor de toepassing in die
      bepaling wordt gelezen in plaats van:

      a. «gemeentelijk stembureau»: briefstembureau;

      b. «hoofdstembureau»: nationaal briefstembureau;

      c. «[artikelen O 4][ref7] en [O 5][ref8]»: [artikelen O 22][ref9] en [O 23][ref10];

      d. «[artikel O 5][ref11]»: [artikel O 23][ref12].


