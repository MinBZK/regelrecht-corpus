        hoofdstuk: H
        afdeling: II
  - number: Pa 11
    text: |-
      1 In afwijking van [artikel H 4, derde lid][ref1], legt een kiezer een verklaring van ondersteuning af in een
      digitale omgeving, ten overstaan van de burgemeester van ’s-Gravenhage of een door deze daartoe aangewezen
      ambtenaar van de gemeente. In de digitale omgeving maakt de kiezer door middel van een wilsuitdrukking kenbaar
      hoe de verklaring ingevuld dient te worden en dat de burgemeester of ambtenaar de ondersteuningsverklaring
      namens hem mag invullen. De burgemeester of ambtenaar verklaart dat de ondersteuningsverklaring overeenstemt met
      de wilsuitdrukking van de kiezer door de verklaring te ondertekenen. Bij ministeriële regeling wordt voor het
      formulier voor de verklaring een model vastgesteld.

      2 De kiezer identificeert zich door een kopie van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] in de digitale omgeving te tonen.

      3 In afwijking van [artikel H 4, vierde lid, tweede volzin][ref3], gaat de burgemeester of ambtenaar onverwijld na
      of de in de digitale omgeving aanwezige persoon geregistreerd is voor de verkiezing van het kiescollege en tekent
      dit op de verklaring aan.

      4 Het afleggen van de ondersteuningsverklaring vindt slechts doorgang voor zover:

      a. de kiezer en de burgemeester of ambtenaar elkaar via het audiovisuele communicatiemiddel kunnen zien en
      verstaan; en

      b. het invullen en ondertekenen van de verklaring van ondersteuning door de burgemeester of ambtenaar zichtbaar is
      voor de kiezer.

      5 Onmiddellijk na het afleggen van de verklaring van ondersteuning wordt een kopie van de verklaring langs
      elektronische weg aan de kiezer toegestuurd. De kiezer en de burgemeester blijven aanwezig in de digitale omgeving
      totdat de kiezer de kopie van de verklaring ontvangt en kenbaar maakt of de verklaring op de juiste wijze namens
      hem is ingevuld en ondertekend. Indien dat niet het geval is, kan de kiezer verzoeken om een nieuwe verklaring af
      te leggen. De nieuwe verklaring treedt in de plaats van de eerste verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
