  - number: D 8
    text: |-
      1 [Titel 8.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beschikkingen als bedoeld in dit
      hoofdstuk.

      2 In afwijking van [artikel 8:41, vijfde lid, van de Algemene wet bestuursrecht][ref2] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling bestuursrechtspraak van de Raad van State kan een kortere termijn stellen.

      3 De Afdeling bestuursrechtspraak van de Raad van State behandelt de zaak met toepassing van
      [afdeling 8.2.3 van de Algemene wet bestuursrecht][ref3]. [Afdeling 8.2.4][ref4] blijft buiten toepassing. Aan
      burgemeester en wethouders wordt terstond een afschrift van het beroepschrift gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel841
