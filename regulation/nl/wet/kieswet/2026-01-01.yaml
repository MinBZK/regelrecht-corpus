  - number: Na 38
    text: |-
      Nadat is beslist over de toelating van de gekozenen, is de burgemeester bevoegd de pakken, bedoeld in de
      [artikelen N 2][ref1] en [N 9][ref2], alsmede de afschriften, bedoeld in [artikel Na 34, eerste lid][ref3], over te
      dragen aan de officier van justitie ten dienste van een onderzoek naar enig strafbaar feit.


