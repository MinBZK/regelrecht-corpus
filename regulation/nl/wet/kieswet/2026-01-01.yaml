      1 De Kiesraad stelt een rapportage van bevindingen op over de onregelmatigheden die door de Kiesraad zijn
      vastgesteld en die ertoe leiden dat de betrouwbare of veilige werking van de uitslagprogrammatuur in gevaar is
      geweest.

      2 Burgemeester en wethouders, het dagelijks bestuur en de gebruiker verstrekkende Kiesraad desgevraagd en uit eigen
      beweging gegevens en inlichtingen die de Kiesraad nodig heeft voor de opstelling van de rapportage.

      3 De Kiesraad zendt een rapportage zo spoedig mogelijk na vaststelling naar het betrokken vertegenwoordigend orgaan
      en maakt deze op een algemeen toegankelijke wijze elektronisch openbaar.
