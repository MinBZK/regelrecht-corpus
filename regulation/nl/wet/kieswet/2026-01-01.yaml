  - number: S 4
    text: |-
      1 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, van de lijst voor een provincie de naam
      van de kandidaat:

      a. die niet is vermeld overeenkomstig het bepaalde krachtens [artikel R 6][ref1];

      b. van wie niet is overgelegd de verklaring dat hij instemt met zijn kandidaatstelling op de lijst voor deze
      provincie;

      c. wiens woonplaats buiten het Europese deel van Nederland is gelegen, indien de aanwijzing van een gemachtigde
      ontbreekt;

      d. die tijdens de zittingsperiode van de Eerste Kamer waarvoor de verkiezing zal plaatsvinden, niet de voor het
      zitting nemen in dat orgaan vereiste leeftijd bereikt;

      e. die voorkomt op meer dan één van de voor deze provincie ingeleverde lijsten;

      f. van wie een uittreksel uit het register van overlijden dan wel een afschrift van de akte van overlijden is
      overgelegd;

      g. die op de lijst voorkomt na het ten hoogste toegelaten aantal.

      2 Het centraal stembureau schrapt, in de volgorde in dit lid aangewezen, de aanduiding van een politieke groepering
      van de lijst voor een provincie, indien:

      a. een daarop betrekking hebbende verklaring als bedoeld in [artikel R 7][ref2] ontbreekt;

      b. de aanduiding geplaatst is boven meer dan één van de bij het centraal stembureau ingeleverde lijsten voor deze
      provincie.

      3 Indien de aanduiding van een politieke groepering niet in overeenstemming is met die waaronder zij is
      geregistreerd, brengt het centraal stembureau deze ambtshalve daarmee in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_7
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelS_4
