  - number: Q 1
    text: |-
      1 De leden van de Eerste Kamer worden gekozen door de leden van provinciale staten.

      2 De leden van provinciale staten komen per provincie in vergadering bijeen tot het uitbrengen van hun stem.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelQ_1
  - number: Q 2
    text: |-
      1 De leden van de Eerste Kamer worden gekozen voor vier jaren.

      2 Zij treden tegelijk af met ingang van de dinsdag in de periode van 7 tot en met 13 juni in het jaar waarin de
      leden van provinciale staten worden gekozen.

      3 Indien de eerste samenkomst van de na een ontbinding gekozen Eerste Kamer valt voor het tijdstip waarop de
      zittingsduur van de ontbonden kamer zou zijn geëindigd, treden de leden van de nieuw gekozen kamer tegelijk op dat
      tijdstip af.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelQ_2
  - number: Q 3
    text: |-
      Degene die ter vervulling van een opengevallen plaats tot lid van de Eerste Kamer is benoemd, treedt af op het
      tijdstip waarop degene in wiens plaats hij is benoemd, zou hebben moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelQ_3
  - number: Q 4
    text: |-
      De kandidaatstelling voor de verkiezing van de leden van de Eerste Kamer vindt plaats op de dinsdag in de periode
      van 19 tot en met 25 april.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelQ_4
  - number: Q 5
    text: |-
      In geval van ontbinding van de Eerste Kamer vindt de kandidaatstelling plaats binnen veertig dagen na de
      dagtekening van het koninklijk besluit tot ontbinding, op een bij dat besluit te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelQ_5
  - number: Q 6
    text: |-
      1 De registratie van een aanduiding van een politieke groepering voor de verkiezing van de leden van de Tweede
      Kamer, als bedoeld in [artikel G 1][ref1], geldt tevens voor de verkiezing van de leden van de Eerste Kamer.

      2 Een politieke groepering die een vereniging is met volledige rechtsbevoegdheid, waarvan de aanduiding niet
      is geregistreerd voor de verkiezing van de leden van de Tweede Kamer, kan aan het centraal stembureau voor
      de verkiezingen van de leden van de Eerste Kamer schriftelijk verzoeken de aanduiding waarmee zij voor die
      verkiezingen op de kandidatenlijst wenst te worden vermeld, in te schrijven in een register dat door het centraal
      stembureau wordt bijgehouden. Verzoeken, ontvangen na de negenentwintigste dag voor de kandidaatstelling, blijven
      voor de daaropvolgende verkiezing buiten behandeling.

      3 Het [tweede tot en met zevende en negende lid van artikel G 1][ref2] zijn van overeenkomstige toepassing, met
      dien verstande dat voor de toepassing van het zevende lid, onder d, in plaats van «de Tweede Kamer» wordt gelezen
      «de Eerste Kamer».

      4 Behalve op de in [artikel G 1, vierde lid][ref3], genoemde gronden wordt op een verzoek om registratie van
      de aanduiding van een politieke groepering ten behoeve van de verkiezingen van de leden van de Eerste Kamer
      afwijzend beschikt, indien de aanduiding geheel of in hoofdzaak overeenstemt met een aanduiding van een andere
      politieke groepering die reeds ten behoeve van de verkiezingen van de leden van de Tweede Kamer is geregistreerd,
      of met een aanduiding waarvoor reeds eerder ten behoeve van de verkiezing van de leden van de Tweede Kamer een
      registratieverzoek is ontvangen, en daardoor verwarring te duchten is.

      5 In afwijking van de [artikelen 6:7][ref4] en [6:8, eerste lid, van de Algemene wet bestuursrecht][ref5] wordt
      een beroepschrift tegen een beschikking als bedoeld in dit artikel ingediend uiterlijk op de zesde dag na de
      dagtekening van de Staatscourant waarin de beschikking is medegedeeld. [Artikel D 8][ref6] is van overeenkomstige
      toepassing.


