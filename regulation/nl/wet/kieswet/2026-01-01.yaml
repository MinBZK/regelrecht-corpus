  - number: P 17
    text: |-
      De zetels, toegewezen aan de al dan niet van een lijstengroep deel uitmakende lijsten, die na toepassing van de
      [artikelen P 15][ref1] en [P 16][ref2] nog niet aan een kandidaat zijn toegewezen, worden aan de nog niet gekozen
      kandidaten van de desbetreffende lijsten toegewezen in de volgorde van de lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_15
