        paragraaf: '2'
        afdeling: II
  - number: N 30
    text: |-
      1 Na zich ervan overtuigd te hebben dat de transportbox leeg is, doet het briefstembureau de pakken, bedoeld in
      de [artikelen N 22][ref1] en [N 28][ref2], in de transportbox. De transportbox wordt voorzien van de naam van de
      gemeente en een aanduiding van de verkiezing. Daarna wordt de transportbox op slot gedaan en verzegeld.

      2 Het briefstembureau bewaart de sleutel van de transportbox in een enveloppe, die het eveneens verzegelt. Op deze
      enveloppe wordt de naam van de gemeente en een aanduiding van de verkiezing vermeld.

      3 Het briefstembureau draagt de transportbox en de enveloppe zo spoedig mogelijk over aan de burgemeester. Tot aan
      die overdracht draagt het briefstembureau er zorg voor dat de zegels op de transportbox en de enveloppe niet worden
      verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_22
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_28
