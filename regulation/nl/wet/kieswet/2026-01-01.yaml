  - number: Y 35
    text: |-
      1 Bij de lijst wordt van iedere daarop voorkomende kandidaat die onderdaan is van een andere lidstaat en niet
      tevens de Nederlandse nationaliteit heeft een schriftelijke verklaring van de kandidaat overgelegd dat hij in die
      lidstaat niet is uitgesloten van het recht om te worden gekozen. De kandidaat vermeldt op deze verklaring tevens
      zijn nationaliteit, geboortedatum, geboorteplaats en zijn laatste adres in die lidstaat.

      2 De formulieren voor de verklaring zijn kosteloos voor de kiezers verkrijgbaar op dezelfde wijze en gedurende
      dezelfde termijn als de formulieren, bedoeld in [artikel Y 13, tweede lid][ref1]. Bij ministeriële regeling wordt
      voor het formulier een model vastgesteld.

      3 In aanvulling op [artikel I 2, eerste lid][ref2], wordt het ontbreken van de verklaring, bedoeld in het eerste
      lid, tevens als verzuim aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_13
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_35
