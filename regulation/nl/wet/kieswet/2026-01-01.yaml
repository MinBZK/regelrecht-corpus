  - number: E 7
    text: |-
      1 Burgemeester en wethouders stellen voor elke verkiezing een gemeentelijk stembureau in.

      2 In afwijking van het eerste lid kunnen burgemeester en wethouders bij de gecombineerde stemming voor de
      verkiezing van de leden van provinciale staten en de leden van een algemeen bestuur, een of meer gemeentelijk
      stembureaus instellen die de stemopneming voor een of meer verkiezingen verrichten.

      3 De gemeenteraad kan bepalen dat een gemeentelijk stembureau dat ten behoeve van een verkiezing op basis van
      deze wet is ingesteld, tevens functioneert als gemeentelijk stembureau voor een andere, door de gemeenteraad
      uitgeschreven, stemming.

      4 Een gemeentelijk stembureau bestaat uit een bij algemene maatregel van bestuur vast te stellen aantal leden, van
      wie er één voorzitter is en ten minste één plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_7
  - number: E 8
    text: |-
      1 Burgemeester en wethouders benoemen tijdig voor elke verkiezing de leden van het gemeentelijk stembureau en een
      voldoend aantal plaatsvervangende leden.

      2 [Artikel E 4, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat
      in het tweede lid in plaats van onderdeel b wordt gelezen: die lid of plaatsvervangend lid is van het stembureau,
      hoofdstembureau of centraal stembureau voor de desbetreffende verkiezing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_8
