  - number: Y 24
    text: |-
      Bij algemene maatregel van bestuur kunnen voor zover nodig voorschriften worden gegeven die afwijken van krachtens
      [afdeling II][ref1] bij algemene maatregel van bestuur gestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#AfdelingII
