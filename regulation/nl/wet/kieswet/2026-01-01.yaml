      1 Het lid van het algemeen bestuur dat in strijd met [artikel 33, eerste lid, van de Waterschapswet][ref1] handelt,
      kan in zijn betrekking worden geschorst door de voorzitter van het vertegenwoordigend orgaan van het waterschap. De
      voorzitter onderwerpt de zaak aan het oordeel van het vertegenwoordigend orgaan in zijn eerstvolgende vergadering.

      2 Het vertegenwoordigend orgaan van het waterschap kan, na de geschorste in de gelegenheid te hebben gesteld zich
      mondeling te verdedigen, hem van zijn lidmaatschap vervallen verklaren. Indien hij daartoe geen aanleiding vindt,
      heft hij de schorsing op.

      3 Het vertegenwoordigend orgaan van het waterschap kan ook ambtshalve het lid dat in strijd met
      [artikel 33, eerste lid, van de Waterschapswet][ref2] handelt, na hem in de gelegenheid te hebben gesteld zich
      mondeling te verdedigen, van zijn lidmaatschap vervallen verklaren.

      4 Het besluit van het vertegenwoordigend orgaan van het waterschap, bedoeld in het tweede en derde lid, wordt
      terstond aan de belanghebbende bekendgemaakt.

      5 De werking van een besluit, inhoudende de vervallenverklaring, wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist. Ingeval de vervallenverklaring ambtshalve
      heeft plaatsgevonden, is het lid van het algemeen bestuur gedurende deze periode in zijn betrekking geschorst.

      6 Indien een lid van het algemeen bestuur als bedoeld in het eerste lid op grond van dit artikel onherroepelijk
      van zijn lidmaatschap vervallen is verklaard, doet de voorzitter van het waterschap daarvan mededeling aan de
      voorzitter van het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel33
