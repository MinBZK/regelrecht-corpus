    text: |-
      1 Van iedere benoeming die met toepassing van de bepalingen van dit hoofdstuk geschiedt, wordt terstond mededeling
      gedaan in de Staatscourant of, indien het betreft de benoeming van een lid van provinciale staten, het algemeen
      bestuur of de gemeenteraad, in het provinciaal blad, het waterschapsblad onderscheidenlijk het gemeenteblad.

      2 De voorzitter van het centraal stembureau doet een afschrift van het benoemingsbesluit toekomen aan het
      vertegenwoordigend orgaan.
