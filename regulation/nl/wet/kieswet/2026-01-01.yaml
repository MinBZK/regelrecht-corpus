  - number: Ea 11
    text: |-
      1 De Kiesraad kan het gebruik van de uitslagprogrammatuur door een gebruiker al dan niet tijdelijk onderbreken of
      doen onderbreken indien:

      a. een beheersaanwijzing als bedoeld in [artikel Ea 10][ref1] niet wordt nageleefd;

      b. anderszins sprake is van een ernstige storing of aantasting van de werking, beveiliging of betrouwbaarheid van
      de uitslagprogrammatuur of de dreiging daarvan; of

      c. anderszins sprake is van een misbruik of oneigenlijk gebruik van de toegang tot de uitslagprogrammatuur of de
      dreiging daarvan.

      2 Onderbreking van het gebruik van de uitslagprogrammatuur op grond van het eerste lid, is een uiterst middel dat
      slechts kan worden ingezet indien het geven van instructies en het geven van een beheersaanwijzing niet mogelijk
      dan wel niet toereikend blijkt te zijn om het gesignaleerde risico voor de betrouwbare en veilige werking van de
      uitslagprogrammatuur weg te nemen.

      3 Zodra de Kiesraad vaststelt dat de grond die aanleiding gaf tot het onderbreken van het gebruik zich niet langer
      voordoet, stelt hij de betrokken gebruiker opnieuw in staat of doet hij de betrokken gebruiker opnieuw in staat
      stellen om de uitslagprogrammatuur te gebruiken.

      4 De Kiesraad stelt burgemeester en wethouders of het dagelijks bestuur en de gebruiker zo mogelijk voorafgaand
      aan een onderbreken en van het opnieuw in staat stellen van het gebruik van de uitslagprogrammatuur, doch in ieder
      geval onverwijld na een onderbreken of het opnieuw in staat stellen van het gebruik, in kennis hiervan.

      5 Bij de kennisgeving over het onderbreken van het gebruik van de uitslagprogrammatuur, geeft de Kiesraad
      instructies aan het betrokken college van burgemeester en wethouders of het dagelijks bestuur, en de betrokken
      gebruiker over de te nemen maatregelen om het gebruik te kunnen hervatten.

      6 De Kiesraad stelt tevens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties onverwijld in kennis van een
      onderbreken van het gebruik en van het opnieuw in staat stellen van het gebruik van de uitslagprogrammatuur.

      7 Bij algemene maatregel van bestuur worden regels gesteld over de gevolgen van het onderbreken of doen onderbreken
      van het gebruik van de uitslagprogrammatuur.


