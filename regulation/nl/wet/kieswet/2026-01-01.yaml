  - number: C 3
    text: |-
      1 Indien het in [artikel C 1][ref1], tweede lid, of in [artikel C 2][ref2] bepaalde tijdstip valt in een jaar
      waarin de verkiezingen van de leden van provinciale staten onderscheidenlijk de gemeenteraad worden gehouden,
      treden de leden van de Tweede Kamer tegelijk af op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip
      op de woensdag in de periode van 25 tot en met 31 mei.

      2 De leden van de Tweede Kamer die zijn gekozen ter vervulling van de plaatsen van leden die op het in het
      eerste lid genoemde tijdstip zijn afgetreden, treden, tenzij zich opnieuw het geval als bedoeld in het eerste
      lid voordoet, tegelijk af op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip op de eerstvolgende
      woensdag in de in [artikel C 1, tweede lid][ref3], bedoelde periode nadat drie jaren zijn verstreken sedert de
      zitting van het centraal stembureau waarin de uitslag van de verkiezing is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_2
