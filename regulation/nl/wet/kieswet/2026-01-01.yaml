  - number: M 6
    text: |-
      1 De burgemeester van ’s-Gravenhage zendt de personen, bedoeld in [artikel M 1][ref1], op bij algemene maatregel
      van bestuur te bepalen wijze:

      a. een stembiljet;

      b. een overzicht van de kandidaten, geordend per lijst;

      c. een geadresseerde retourenveloppe;

      d. het briefstembewijs, bevattende een door de persoon te ondertekenen verklaring dat hij het stembiljet
      persoonlijk heeft ingevuld;

      e. een enveloppe voor het stembiljet;

      f. een handleiding voor de kiezer.

      2 Op het briefstembewijs wordt een nummer vermeld.

      3 De stukken, bedoeld in het eerste lid, worden aan de personen, bedoeld in [artikel M 1, eerste lid][ref2],
      uiterlijk twaalf weken voor de dag van de stemming en aan de personen, bedoeld in artikel M 1, tweede lid, zo
      spoedig mogelijk toegezonden, behoudens het stembiljet en het overzicht van de kandidatenlijsten, die zo spoedig
      mogelijk aan alle personen, bedoeld in artikel M 1, worden toegezonden. Aan kiezers die hun werkelijke woonplaats
      in Aruba, Curaçao of Sint Maarten hebben, worden de stembescheiden met tussenkomst van de Vertegenwoordiging van
      Nederland in Aruba, Curaçao of Sint Maarten toegezonden.

      4 Onverminderd het bepaalde in het derde lid maakt de burgemeester van 's-Gravenhage het overzicht, bedoeld in het
      eerste lid, onder b, zo spoedig mogelijk op een algemeen toegankelijke wijze elektronisch openbaar.

      5 Bij ministeriële regeling worden voor de stukken, bedoeld in het eerste lid, onder a tot en met f, modellen
      vastgesteld. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties verstrekt tijdig voor de verkiezing aan de
      gemeente ’s-Gravenhage de informatie nodig voor het produceren van het briefstembewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_1
