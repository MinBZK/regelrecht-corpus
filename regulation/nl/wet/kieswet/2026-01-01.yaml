      1 Het lid van de gemeenteraad dat in strijd met [artikel 15, eerste lid, van de Gemeentewet][ref1] handelt, kan in
      zijn betrekking worden geschorst door de voorzitter van de gemeenteraad. De voorzitter onderwerpt de zaak aan het
      oordeel van de raad in zijn eerstvolgende vergadering.

      2 De raad kan, na de geschorste in de gelegenheid te hebben gesteld zich mondeling te verdedigen, hem van zijn
      lidmaatschap vervallen verklaren. Indien hij daartoe geen aanleiding vindt, heft hij de schorsing op.

      3 De raad kan ook ambtshalve het lid dat in strijd met [artikel 15, eerste lid, van de Gemeentewet][ref2] handelt,
      na hem in de gelegenheid te hebben gesteld zich mondeling te verdedigen, van zijn lidmaatschap vervallen verklaren.

      4 Het besluit van de raad, bedoeld in het tweede en derde lid, wordt terstond aan de belanghebbende bekendgemaakt.

      5 De werking van een besluit, inhoudende de vervallenverklaring, wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist. Ingeval de vervallenverklaring ambtshalve
      heeft plaatsgevonden, is het lid van de raad gedurende deze periode in zijn betrekking geschorst.

      6 Indien een lid van de raad op grond van dit artikel onherroepelijk van zijn lidmaatschap vervallen is verklaard,
      doet de burgemeester daarvan mededeling aan de voorzitter van het centraal stembureau.


