  - number: Na 18
    text: |-
      1 Het gemeentelijk stembureau stelt ten aanzien van iedere lijst vast:

      a. het aantal op iedere kandidaat uitgebrachte stemmen;

      b. de som van de aantallen stemmen, bedoeld onder a.

      2 Daarnaast stelt het gemeentelijk stembureau vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen.

      3 De som van de aantallen op kandidaten uitgebrachte stemmen, blanco stemmen en ongeldige stemmen is het aantal
      stemmen dat is geteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_18
  - number: Na 19
    text: |-
      1 Indien een ondersteuner twijfelt over de geldigheid van een stem of van oordeel is dat een stem ongeldig is,
      wordt het stembiljet ter beoordeling voorgelegd aan een of meer leden van het gemeentelijk stembureau. De leden
      beslissen over de geldigheid van de stem met inachtneming van [artikel N 7][ref1].

      2 Aan de aanwezige personen wordt onmiddellijk mededeling gedaan van de reden van twijfel over de geldigheid dan
      wel de reden van ongeldigverklaring van een stem.

      3 Indien een van de aanwezige personen dit verlangt, wordt het stembiljet getoond. De aanwezige personen kunnen
      mondeling bezwaren tegen de genomen beslissing inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_19
