  - number: L 1
    text: |-
      De kiezer die verwacht niet in staat te zullen zijn in persoon aan de stemming deel te nemen, kan overeenkomstig de
      bepalingen van dit hoofdstuk bij volmacht stemmen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_1
  - number: L 2
    text: |-
      1 Een volmacht kan worden verleend hetzij op een schriftelijke aanvraag overeenkomstig het bepaalde in
      [paragraaf 2][ref1], hetzij door overdracht van de stempas of kiezerspas overeenkomstig het bepaalde in
      [paragraaf 3 van dit hoofdstuk][ref2]. De volmachtgever wijst zelf een gemachtigde aan. De volmachtgever informeert
      de gemachtigde tijdig over de wijze waarop hij wil dat de volmacht wordt uitgeoefend door aan te geven op welke
      kandidaat de stem moet worden uitgebracht, of door aan te geven dat de stem blanco moet worden uitgebracht.

      2 Een schriftelijke aanvraag om bij volmacht te stemmen kan niet worden ingediend door de kiezer aan wie een
      kiezerspas of een briefstembewijs is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 3
    text: De gemachtigde kan een volmachtstem uitsluitend tegelijk met zijn eigen stem voor die verkiezing uitbrengen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_3
  - number: L 4
    text: Een kiezer mag per verkiezing niet meer dan twee aanwijzingen als gemachtigde aannemen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_4
  - number: L 5
    text: |-
      1 De volmachtgever is niet bevoegd een eenmaal verleende schriftelijke volmacht in te trekken of na het verlenen
      van volmacht in persoon aan de stemming deel te nemen.

      2 Een volmacht die is verleend door overdracht van de stempas of kiezerspas kan tot het uitbrengen van een stem
      door de gemachtigde door de volmachtgever worden ingetrokken.

      3 Een schriftelijke aanvraag om bij volmacht te stemmen kan worden ingetrokken, zolang daarop niet is beslist.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_5
  - number: L 6
    text: |-
      1 Aan de gemachtigde wordt ten bewijze van zijn bevoegdheid een verklaring verstrekt, genaamd volmachtbewijs.

      2 Aan de gemachtigde wiens volmachtbewijs in het ongerede is geraakt, wordt geen nieuw verstrekt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_6
  - number: L 7
    text: |-
      1 Het verzoekschrift, bedoeld in [artikel L 8][ref1], dient op de vijfde dag voor de dag van de stemming te zijn
      ontvangen.

      2 De burgemeester doet van deze termijn op de dag van de kandidaatstelling mededeling in het gemeenteblad.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_7
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 8
    text: |-
      1 De kiezer die bij volmacht wenst te stemmen, dient daartoe een verzoekschrift in bij de burgemeester van de
      gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd. Voor het indienen van een
      verzoekschrift wordt een formulier gebruikt. De burgemeester kan ter voorkoming van misbruik beperkingen stellen
      aan de verkrijgbaarstelling. Van een daartoe strekkend besluit doet hij mededeling in het gemeenteblad.

      2 In zijn verzoekschrift wijst de kiezer een gemachtigde aan. Als gemachtigde kan slechts optreden degene die op de
      dag van de kandidaatstelling als kiezer is geregistreerd binnen het gebied waarvoor de verkiezing geldt.

      3 Bij het verzoekschrift wordt ingediend een verklaring van de gemachtigde dat deze bereid is als zodanig op te
      treden.

      4 Bij ministeriële regeling worden voor het formulier en de verklaring modellen vastgesteld. Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties verstrekt tijdig voor de verkiezing aan de gemeente de informatie nodig
      voor het produceren van de verklaring.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_8
  - number: L 9
    text: |-
      1 In afwijking van [artikel L 8, eerste lid, eerste volzin][ref1], dient een persoon die als kiezer is
      geregistreerd als bedoeld in [artikel D 2][ref2], een verzoekschrift in bij de burgemeester van 's-Gravenhage.

      2 Een verzoekschrift dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_9
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: D_2
        hoofdstuk: D
        afdeling: II
  - number: L 10
    text: |-
      Het verzoek wordt afgewezen, indien:

      a. blijkt dat de kiezer niet zelf de gemachtigde heeft aangewezen;

      b. aan de kiezer die het verzoek heeft ingediend reeds een kiezerspas of een briefstembewijs is verstrekt;

      c. de verklaring van de gemachtigde dat deze bereid is als zodanig op te treden, ontbreekt;

      d. degene die als gemachtigde is aangewezen, niet als kiesgerechtigde is geregistreerd binnen het gebied waarvoor
      de verkiezing geldt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_10
  - number: L 11
    text: |-
      1 Op het verzoek wordt zo spoedig mogelijk beslist, doch niet eerder dan op de dag van de kandidaatstelling.

      2 Bij inwilliging wordt een volmachtbewijs opgemaakt. Bij ministeriële regeling wordt voor dit bewijs een model
      vastgesteld. De inwilliging wordt aan de volmachtgever bekendgemaakt.

      3 Indien het verzoek niet in verdere behandeling wordt genomen of wordt afgewezen, wordt de beslissing met opgave
      van redenen schriftelijk aan de verzoeker medegedeeld. Degene die zich bereid heeft verklaard als gemachtigde op te
      treden wordt van de beslissing in kennis gesteld.

      4 [Artikel D 8][ref1] is van overeenkomstige toepassing op een beschikking als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_11
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_8
        hoofdstuk: D
        afdeling: II
  - number: L 12
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen bij volmacht,
      onder meer over de indiening van een verzoekschrift, de beslissing op een verzoekschrift en de verstrekking van
      formulieren, bedoeld in [artikel L 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_8
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_12
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: L_8
        hoofdstuk: L
        paragraaf: '2'
        afdeling: II
  - number: L 14
    text: |-
      1 De kiezer met een stempas kan een andere kiezer machtigen om voor hem te stemmen, indien de gemachtigde stemt in
      de gemeente van de volmachtgever.

      2 De kiezer met een kiezerspas kan een andere kiezer machtigen om voor hem te stemmen.

      3 Hij tekent daartoe het formulier dat voorkomt op de stempas of kiezerspas en laat de pas door de gemachtigde
      mede-ondertekenen.

      4 Hij draagt de aldus in een volmachtbewijs omgezette stempas of kiezerspas aan de gemachtigde over.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_14
  - number: L 15
    text: |-
      1 De kiezer verleent geen volmacht in een stemlokaal.

      2 Indien een volmacht is verleend in het stemlokaal, kan de gemachtigde de volmachtstem niet uitbrengen. Indien
      de gemachtigde het volmachtbewijs aan de voorzitter van het stembureau heeft overhandigd, geeft de voorzitter het
      volmachtbewijs aan de volmachtgever, of, indien deze het stemlokaal heeft verlaten, aan de gemachtigde.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_15
  - number: L 17
    text: |-
      1 De gemachtigde overhandigt aan de voorzitter van het stembureau het volmachtbewijs.

      2 Indien het een volmachtbewijs betreft als bedoeld in [hoofdstuk L, paragraaf 3][ref1], overhandigt de
      gemachtigde tevens een kopie van een identiteitsdocument als bedoeld in [artikel J 24][ref2], van de volmachtgever.

      3 [Artikel J 25, tweede tot en met tiende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelL_17
    references:
      - id: ref1
        bwb_id: BWBR0004627
        hoofdstuk: L
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_24
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0004627
        artikel: J_25
        hoofdstuk: J
        paragraaf: '6'
        afdeling: II
  - number: M 1
    text: |-
      1 Degene die als kiezer is geregistreerd als bedoeld in [artikel D 2][ref1], ontvangt als bewijs dat hij per brief
      mag stemmen voor de stemming een briefstembewijs. Hij ontvangt geen briefstembewijs indien hem is toegestaan bij
      volmacht te stemmen of een kiezerspas is verstrekt.

      2 Voor de verkiezing van de leden van de Tweede Kamer wordt degene die kiesgerechtigd is en op de dag van de
      stemming buiten Nederland zal verblijven overeenkomstig het bepaalde bij of krachtens dit hoofdstuk op zijn verzoek
      toegestaan per brief te stemmen. Aan hem wordt als bewijs dat aan zijn verzoek is voldaan een briefstembewijs
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelM_1
