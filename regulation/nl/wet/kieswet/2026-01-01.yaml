  - number: V 9
    text: |-
      1 Indien het vertegenwoordigend orgaan waarvoor de benoeming is geschied, toepassing heeft gegeven aan
      [artikel V 4a][ref1] of [V 4b][ref2], stelt het centraal stembureau uiterlijk op de veertiende dag na de dag van de
      stemming de uitslag van de verkiezing voor zover nodig opnieuw vast, en maakt deze op zitting bekend.

      2 De [artikelen P 20][ref3] en [P 22 tot en met P 24][ref4] vinden overeenkomstige toepassing.

      3 Het onderzoek van de geloofsbrief van de aldus nieuw gekozen verklaarde strekt zich niet uit tot punten, die het
      verloop van de verkiezing raken.


