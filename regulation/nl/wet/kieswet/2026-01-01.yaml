    text: |-
      Indien de Kiesraad bij een verkiezing geen uitslagprogrammatuur ter beschikking stelt of de Kiesraad het gebruik
      van de uitslagprogrammatuur onderbreekt of doet onderbreken, zijn bij de vaststelling van de uitkomst van de
      stemming en van de uitslag van de verkiezing door de gebruiker, de artikelen in de [hoofdstukken Na][ref1],
      [O][ref2] en [P][ref3] voor zover die betrekking hebben op het gebruik van de uitslagprogrammatuur niet van
      toepassing.


