  - number: Z 5
    text: |-
      1 Bij veroordeling wegens een van de in de [artikelen Z 1 tot en met Z 4][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°, van het Wetboek van Strafrecht][ref2]
      dan wel, indien de ontzetting wordt uitgesproken door de strafrechter in Bonaire, Sint Eustatius of Saba,
      [artikel 32, onder 1°, 2° en 4°, van het Wetboek van Strafrecht BES][ref3] vermelde rechten worden uitgesproken.

      2 Bij veroordeling tot een vrijheidsstraf van ten minste een jaar wegens een van de in
      de [artikelen Z 1 tot en met Z 3][ref4] omschreven misdrijven, kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref5] dan wel, indien
      de ontzetting wordt uitgesproken door de strafrechter in Bonaire, Sint Eustatius of Saba,
