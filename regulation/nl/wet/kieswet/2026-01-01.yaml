  - number: M 6a
    text: |-
      1 Op het stembiljet en het overzicht van de kandidaten, bedoeld in [artikel M 6, eerste lid, onder a en b][ref1],
      wordt het logo van een politieke groepering geplaatst, indien:

      a. dat logo is geregistreerd bij het centraal stembureau; en

      b. op het stembiljet en het overzicht van de kandidaten de aanduiding van die groepering wordt geplaatst.

      2 De logo’s van twee of meer politieke groeperingen worden gezamenlijk geplaatst, indien:

      a. die logo’s zijn geregistreerd bij het centraal stembureau; en

      b. op het stembiljet en het overzicht van de kandidaten een aanduiding staat, gevormd door samenvoeging van
      geregistreerde aanduidingen of afkortingen daarvan, van die politieke groeperingen.

      3 Indien op het stembiljet en het overzicht van de kandidaten een aanduiding staat, gevormd door samenvoeging van
      geregistreerde aanduidingen of afkortingen van twee of meer politieke groeperingen, en niet van al deze politieke
      groeperingen een logo is geregistreerd bij het centraal stembureau, wordt geen logo op het stembiljet en het
      overzicht van de kandidaten geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_6
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelM_6a
