        artikel: Ea_12
        hoofdstuk: Ea
        afdeling: II
  - number: Ea 10
    text: |-
      1 De Kiesraad kan burgemeester en wethouders of het dagelijks bestuur een beheersaanwijzing geven met betrekking
      tot decentrale voorzieningen en decentrale maatregelen als bedoeld in [artikel Ea 6, eerste lid][ref1], indien:

      a. burgemeester en wethouders of het dagelijks bestuur tekortschieten, respectievelijk tekortschiet in de naleving
      van de aansluitvoorschriften en daardoor de betrouwbare of veilige werking van de uitslagprogrammatuur in gevaar
      is; of

      b. sprake is van onvoorziene omstandigheden die van dien aard zijn, dat de betrouwbare of veilige werking van de
      uitslagprogrammatuur in gevaar is.

      2 De Kiesraad kan de gebruiker een beheersaanwijzing geven met betrekking tot het gebruik van de
      uitslagprogrammatuur indien:

      a. de gebruiker tekortschiet in de naleving van de gebruiksvoorschriften en daardoor de betrouwbare of veilige
      werking van de uitslagprogrammatuur in gevaar is; of

      b. sprake is van onvoorziene omstandigheden die van dien aard zijn, dat de betrouwbare of veilige werking van de
      uitslagprogrammatuur in gevaar is.

      3 Een beheersaanwijzing is evenredig aan het doel waarvoor zij wordt gegeven.

      4 De Kiesraad stelt in de beheersaanwijzing een termijn waarbinnen aan de aanwijzing moet zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_6
