        paragraaf: '1'
        afdeling: II
  - number: M 6b
    text: |-
      1 Aan de tot deelneming aan de stemming bevoegde kiezer wiens briefstembewijs in het ongerede is geraakt of die
      geen briefstembewijs heeft ontvangen, wordt door de burgemeester van ’s-Gravenhage op zijn verzoek een nieuw
      briefstembewijs verstrekt. Dit is een vervangend briefstembewijs. Het voorgaande is van overeenkomstige toepassing
      op de kiezer wiens vervangend briefstembewijs in het ongerede is geraakt of die het vervangend briefstembewijs niet
      heeft ontvangen.

      2 De kiezer doet het verzoek schriftelijk of mondeling bij de burgemeester van ’s-Gravenhage. De kiezer kan het
      verzoek ook schriftelijk of mondeling indienen via de Vertegenwoordiger van Nederland in Aruba, Curaçao of Sint
      Maarten, mits de kiezer op de dag van kandidaatstelling aldaar zijn werkelijke woonplaats heeft.

      3 Het schriftelijk verzoek dient uiterlijk op de twaalfde dag voor de dag van de stemming te zijn ontvangen.
      De kiezer legt bij zijn verzoek een kopie over van een bij algemene maatregel van bestuur aangewezen
      identiteitsdocument. De kiezer vermeldt in het verzoekschrift of hij zijn vervangend briefstembewijs per post of
      per e-mail wil ontvangen. Op dit verzoek wordt zo spoedig mogelijk beslist.

      4 Het mondeling verzoek dient uiterlijk de negende dag voor de dag van de stemming om twaalf uur te zijn gedaan. De
      kiezer identificeert zich met een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1],
      met een verklaring over het bezit van het Nederlanderschap of met de documenten als bedoeld in
      [artikel J 24, tweede lid][ref2], van de Kieswet. Op dit verzoek wordt terstond beslist.

      5 Aan de kiezer die zijn werkelijke woonplaats in Aruba, Curaçao of Sint Maarten heeft kan het vervangend
      briefstembewijs alleen per post worden toegezonden of in persoon worden uitgereikt.

      6 Op het vervangend briefstembewijs wordt een nummer vermeld.

      7 Bij ministeriële regeling wordt voor het verzoekschrift, bedoeld in het derde lid, en het vervangend
      briefstembewijs een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
