  - number: Pa 15
    text: |-
      Het centraal stembureau gaat na afloop van de zittingen, bedoeld in [artikel I 1, eerste lid][ref1],
      respectievelijk [artikel I 4][ref2], voor de verkiezing van de leden van provinciale staten van Zuid-Holland over
      tot het houden van deze zittingen voor de verkiezing van de leden van het kiescollege. Het tijdstip van de zitting
      bedoeld in artikel I 4 wordt tijdig op een algemeen toegankelijke wijze elektronisch openbaar gemaakt. Bij algemene
      maatregel van bestuur wordt de bekendmaking van het tijdstip en de digitale locatie van de zitting geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
