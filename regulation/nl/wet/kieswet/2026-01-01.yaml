  - number: Yb 1
    text: |-
      1 Indien er sprake is van een of meer op grond van de
      [artikelen 58f tot en met 58i van de Wet publieke gezondheid][ref1] bij ministeriële regeling vastgestelde
      maatregelen en er binnen afzienbare tijd een verkiezing zal plaatsvinden, kunnen voor die verkiezing bij koninklijk
      besluit een of meer bepalingen in deze afdeling van kracht worden verklaard.

      2 In het geval dat in de ministeriële regeling op grond van
      [artikel 58e, eerste lid, onder a, van de Wet publieke gezondheid][ref2] onderscheid wordt gemaakt in die zin dat
      er geen maatregelen gelden in het Europese deel van Nederland, Bonaire, Sint Eustatius of Saba, zijn de van kracht
      zijnde bepalingen uit deze afdeling niet van kracht in het betreffende deel van Nederland.

      3 De bepalingen in deze afdeling blijven van kracht zolang er sprake is van maatregelen als bedoeld in het eerste
      lid. Indien de dag waarop er niet langer sprake is van maatregelen als bedoeld in het eerste lid, gelegen is op of
      na de dag dat de termijn in [artikel Yb 2][ref3] aanvangt, geldt in afwijking van de eerste zin dat de bepalingen
      in deze afdeling van kracht blijven tot de verkiezing is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58e
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelYb_2
