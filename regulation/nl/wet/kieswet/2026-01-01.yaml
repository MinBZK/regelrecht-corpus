  - number: P 2
    text: |-
      1 Een stel gelijkluidende lijsten als bedoeld in [artikel H 11, eerste lid][ref1], geldt voor de vaststelling van
      de uitslag van de verkiezing als één lijst.

      2 Het centraal stembureau telt van deze gelijkluidende lijsten tezamen de stemcijfers en de aantallen op iedere
      kandidaat uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 3
    text: |-
      Een lijstengroep als bedoeld in [artikel H 11, tweede lid][ref1], geldt voor het bepalen van het aantal daaraan toe
      te wijzen zetels als één lijst met een stemcijfer gelijk aan de som van de stemcijfers van de lijsten waaruit de
      groep bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_11
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: H_11
        hoofdstuk: H
        afdeling: II
  - number: P 5
    text: |-
      1 Het centraal stembureau deelt de som van de stemcijfers van alle lijsten door het aantal te verdelen zetels.

      2 Het aldus verkregen quotiënt wordt kiesdeler genoemd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_5
  - number: P 6
    text: Zoveel maal als de kiesdeler is begrepen in het stemcijfer van een lijst wordt aan die lijst een zetel toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_6
  - number: P 7
    text: |-
      1 De overblijvende zetels, die restzetels worden genoemd, worden, indien het aantal te verdelen zetels negentien
      of meer bedraagt, achtereenvolgens toegewezen aan de lijsten die na toewijzing van de zetel het grootste gemiddelde
      aantal stemmen per toegewezen zetel hebben. Indien gemiddelden gelijk zijn, beslist zo nodig het lot.

      2 Indien het betreft de verkiezing van de leden van de Tweede Kamer, komen bij deze toewijzing niet in aanmerking
      lijsten waarvan het stemcijfer lager is dan de kiesdeler.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_7
  - number: P 8
    text: |-
      1 De restzetels worden, indien het aantal te verdelen zetels minder dan negentien bedraagt, achtereenvolgens
      toegewezen aan de lijsten waarvan de stemcijfers bij deling door de kiesdeler de grootste overschotten hebben.
      Hierbij worden lijsten die geen overschot hebben, geacht lijsten te zijn met het kleinste overschot. Indien
      overschotten gelijk zijn, beslist zo nodig het lot.

      2 Bij deze toewijzing komen niet in aanmerking lijsten met een stemcijfer dat lager is dan 75% van de kiesdeler.

      3 Wanneer alle lijsten die daarvoor in aanmerking komen een restzetel hebben ontvangen en er nog zetels te
      verdelen blijven, worden deze zetels toegewezen volgens het stelsel van de grootste gemiddelden als bedoeld in
      [artikel P 7, eerste lid][ref1], met dien verstande, dat bij deze toewijzing aan geen van de lijsten meer dan één
      zetel wordt toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_7
        hoofdstuk: P
        paragraaf: '2'
        afdeling: II
  - number: P 9
    text: |-
      Indien aan een lijst die de volstrekte meerderheid van de uitgebrachte geldige stemmen heeft verkregen, een aantal
      zetels is toegewezen, kleiner dan de volstrekte meerderheid van het aantal toe te wijzen zetels, wordt aan die
      lijst alsnog één zetel toegewezen en vervalt daartegenover één zetel, toegewezen aan de lijst die voor het kleinste
      gemiddelde of het kleinste overschot een zetel heeft verworven. Indien twee of meer lijsten voor hetzelfde kleinste
      gemiddelde of hetzelfde kleinste overschot een zetel hebben verworven, beslist het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_9
  - number: P 10
    text: |-
      Indien bij de toepassing van de vorige bepalingen aan een lijst meer zetels zouden moeten worden toegewezen dan er
      kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van die bepalingen over op één
      of meer van de overige lijsten, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_10
  - number: P 12
    text: |-
      1 De verdeling van de aan een lijstengroep toegewezen zetels over de lijsten waaruit de groep bestaat, geschiedt
      als volgt.

      2 Het centraal stembureau deelt het stemcijfer van de lijstengroep door het aantal aan de groep toegewezen zetels.

      3 Het aldus verkregen quotiënt wordt groepskiesdeler genoemd.

      4 Zoveel maal als de groepskiesdeler is begrepen in het stemcijfer van elk van de lijsten waaruit de groep bestaat,
      wordt aan die lijst een van de aan de groep toegewezen zetels toegewezen.

      5 De restzetels worden achtereenvolgens toegewezen aan de lijsten van de groep waarvan de stemcijfers bij deling
      door de groepskiesdeler de grootste overschotten hebben. Hierbij worden lijsten die geen overschot hebben, geacht
      lijsten te zijn met het kleinste overschot. Indien overschotten gelijk zijn, beslist zo nodig het lot.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_12
  - number: P 13
    text: |-
      1 Indien bij de toepassing van [artikel P 12][ref1] aan een lijst meer zetels zouden moeten worden toegewezen dan
      er kandidaten zijn, gaan de overblijvende zetel of zetels door voortgezette toepassing van dat artikel over op een
      van de andere lijsten van de groep, waarop kandidaten voorkomen aan wie geen zetel is toegewezen.

      2 Zijn er na toepassing van het eerste lid nog zetels toe te wijzen, dan worden deze toegewezen volgens het stelsel
      van de grootste gemiddelden als bedoeld in [artikel P 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_7
