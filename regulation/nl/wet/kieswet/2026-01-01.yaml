        hoofdstuk: N
        paragraaf: '2'
        afdeling: II
  - number: N 29
    text: |-
      1 Nadat alle werkzaamheden zijn voltooid, maakt het briefstembureau voor elk van de zittingen, bedoeld in
      [artikel N 15, eerste lid][ref1], afzonderlijk een proces-verbaal op. In deze processen-verbaal legt het
      briefstembureau verantwoording af over elke dag waarop het zitting heeft gehouden.

      2 De processen-verbaal worden door alle aanwezige leden van het briefstembureau getekend, onder wie ten minste de
      voorzitter en alle plaatsvervangend voorzitters.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verantwoording door
      het briefstembureau.

      4 Bij regeling van de Kiesraad wordt voor elk van de processen-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_15
