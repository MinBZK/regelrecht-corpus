  - number: Na 40
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_40
  - number: O 1
    text: |-
      Onverwijld nadat het hoofdstembureau het proces-verbaal van een gemeentelijk stembureau heeft ontvangen, gaat het
      over tot het verrichten van de werkzaamheden ter vaststelling en bekendmaking van de uitkomst van de stemming bij
      de stembureaus op kieskringniveau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_1
  - number: O 2
    text: |-
      1 Het hoofdstembureau controleert of het digitale bestand, bedoeld in [artikel Na 32, derde lid][ref1],
      overeenkomstig daaraan bij of krachtens algemene maatregel van bestuur gestelde eisen aan hem is verstrekt.

      2 Het hoofdstembureau verzoekt het gemeentelijk stembureau dat het betreft alsnog onverwijld zorg te dragen voor
      verstrekking van het bestand overeenkomstig deze eisen, indien het constateert dat dat niet is gebeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_32
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_2
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Na_32
        hoofdstuk: Na
        paragraaf: '4'
        afdeling: II
  - number: O 3
    text: |-
      Indien het hoofdstembureau een digitaal bestand als bedoeld in [artikel Na 32, derde lid][ref1], heeft ontvangen,
      en de in dit bestand vermelde uitkomst op gemeentelijk niveau niet overeenkomt met de uitkomst zoals vastgesteld in
      het bijbehorende proces-verbaal van het gemeentelijk stembureau, gaat het hoofdstembureau uit van de juistheid van
      de laatste en maakt het hiervan melding in zijn proces-verbaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_32
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_3
    references:
