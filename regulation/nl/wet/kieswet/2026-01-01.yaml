        artikel: W_1
        hoofdstuk: W
        afdeling: IV
  - number: Y 28
    text: |-
      Zodra onherroepelijk is komen vast te staan dat een lid van het Europees Parlement een van de in
      [artikel Y 4][ref1] bedoelde vereisten voor het lidmaatschap niet bezit of een ingevolge de nationale bepalingen
      met het lidmaatschap onverenigbare betrekking vervult, houdt hij op lid te zijn. De voorzitter van de Tweede Kamer
      geeft hiervan onverwijld kennis aan de voorzitter van het Europees Parlement en aan de voorzitter van het centraal
      stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_28
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: Y_4
        hoofdstuk: Y
        paragraaf: '2'
        afdeling: V
  - number: Y 29
    text: |-
      1 Wanneer een lid van het Europees Parlement komt te verkeren in een van de gevallen, genoemd in
      [artikel Y 28][ref1], geeft hij hiervan kennis aan de voorzitter van de Tweede Kamer, met vermelding van de reden.

      2 Indien de kennisgeving niet is gedaan en de voorzitter van de Tweede Kamer van oordeel is dat een lid van
      het Europees Parlement verkeert in een van de gevallen, genoemd in [artikel Y 28][ref2], waarschuwt hij de
      belanghebbende schriftelijk.

      3 Het staat deze vrij de zaak uiterlijk op de achtste dag na de dagtekening van de in het tweede lid bedoelde
      waarschuwing aan het oordeel van de Tweede Kamer te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_28
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_28
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_29
    references:
