  - number: O 20
    text: |-
      1 Nadat alle werkzaamheden zijn voltooid, maakt het nationaal briefstembureau daarvan aanstonds proces-verbaal op.

      2 Het proces-verbaal wordt door alle aanwezige leden getekend, onder wie ten minste de voorzitter en alle
      plaatsvervangend voorzitters.

      3 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_20
  - number: O 21
    text: |-
      1 Het nationaal briefstembureau brengt zijn proces-verbaal, alsmede de processen-verbaal en het corrigendum van het
      briefstembureau dat is gevestigd in ‘s-Gravenhage onverwijld over naar het centraal stembureau. Tevens brengt het
      een afschrift van zijn proces-verbaal zo spoedig mogelijk naar de burgemeester van ’s-Gravenhage.

      2 Het nationaal briefstembureau brengt de langs elektronische weg ontvangen processen-verbaal en corrigenda van
      de overige briefstembureaus onverwijld langs elektronische weg ter kennis van het centraal stembureau. Bij of
      krachtens algemene maatregel van bestuur kan worden bepaald aan welke eisen de overdracht moet voldoen.

      3 Het nationaal briefstembureau verstrekt het met de programmatuur gegenereerde digitale bestand met de uitkomst
      van de stemming per brief langs elektronische weg aan het centraal stembureau en aan de burgemeester van ‘s-
      Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_21
  - number: O 22
    text: |-
      1 De burgemeester van ’s-Gravenhage maakt het afschrift van het proces-verbaal van het nationaal briefstembureau,
      met weglating van de ondertekening, onverwijld op een algemeen toegankelijke wijze elektronisch openbaar.

      2 De burgemeester van ’s-Gravenhage maakt het met de programmatuur gegenereerde digitale bestand met de uitkomst
      van de stemming per brief onverwijld op een algemeen toegankelijke wijze elektronisch openbaar.

      3 De openbaarmaking geschiedt ten minste tot drie maanden nadat over de toelating van de gekozenen is beslist.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de elektronische
      openbaarmaking van het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_22
