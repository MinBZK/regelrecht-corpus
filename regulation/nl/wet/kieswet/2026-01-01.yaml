  - number: Y 36
    text: |-
      Het centraal stembureau stelt door tussenkomst van Onze Minister van Buitenlandse Zaken de andere lidstaten in
      kennis van de namen van hun onderdanen, die niet tevens de Nederlandse nationaliteit hebben en die op de geldige
      kandidatenlijsten voorkomen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_36
  - number: Y 38
    text: |-
      1 Indien de autoriteit, bedoeld in [artikel Y 35b, eerste lid][ref1], het centraal stembureau verzoekt te verklaren
      of een kandidaat in Nederland is uitgesloten van het recht om te worden gekozen, verzoekt het centraal stembureau
      Onze Minister van Justitie en Veiligheid een dergelijke verklaring te verstrekken. De verklaring wordt onverwijld
      verstrekt.

      2 Het centraal stembureau geleidt de verklaring van Onze Minister van Justitie en Veiligheid zo spoedig mogelijk,
      doch uiterlijk binnen vijf werkdagen na ontvangst van het verzoek van de autoriteit door naar die autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35b
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_38
