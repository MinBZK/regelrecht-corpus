  - number: Ya 41
    text: |-
      Degene die een aanvraag indient als bedoeld in [artikel D 6, eerste lid][ref1], verschaft de gegevens en bescheiden
      die voor de beslissing op de aanvraag nodig zijn en waarover hij redelijkerwijs de beschikking kan krijgen.


