        paragraaf: '1'
        afdeling: II
  - number: I 5
    text: |-
      Voor een kieskring is ongeldig de lijst:

      a. die niet op de dag van kandidaatstelling tussen negen en zeventien uur bij het centraal stembureau is
      ingeleverd;

      b. waarbij, indien ten behoeve van de lijst een waarborgsom moet worden betaald, niet gevoegd is het bewijs dat
      deze betaling is verricht;

      c. waarbij, indien bij de lijst verklaringen van ondersteuning moeten worden overgelegd, niet ten minste het aantal
      geldige verklaringen voor deze kieskring, genoemd in [artikel H 4, eerste lid][ref1], is overgelegd;

      d. die niet voldoet aan het bij ministeriële regeling vastgestelde model;

      e. die niet persoonlijk is ingeleverd door een kiezer, bevoegd tot deelneming aan de desbetreffende verkiezing;

      f. waarbij de inleveraar zich niet heeft geïdentificeerd met een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2];

      g. waarop door toepassing van [artikel I 6][ref3] alle kandidaten zijn geschrapt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_6
