    text: |-
      1 De zitting, bedoeld in [artikel N 15, eerste lid, onder a][ref1], vangt aan op een door burgemeester en
      wethouders vast te stellen dag en tijdstip, maar niet eerder dan de zevende dag voor de stemming.

      2 De zitting, bedoeld in [artikel N 15, eerste lid, onder b][ref2], vangt aan op de dag van de stemming om zeven
      uur dertig ten aanzien van de stembiljetten die zich op dat moment in de stembus bevinden, of zoveel later als
      burgemeester en wethouders bepalen.

      3 De aanwijzing van de locaties, bedoeld in [artikel N 15, tweede lid][ref3], en de tijdstippen wordt ten minste
      zeven dagen voor aanvang van de eerste zittingsdag van het briefstembureau bekendgemaakt.


