  - number: N 36
    text: |-
      [Paragraaf 3][ref1] is van overeenkomstige toepassing op de briefstembureaus die gevestigd zijn in Aruba, Curaçao
      en Sint Maarten, met uitzondering van de [artikelen N 24, tweede volzin][ref2], en [N 31][ref3], en met dien
      verstande dat:

      a. de bevoegdheden van de burgemeester bevoegdheden zijn van de vertegenwoordiger van Nederland in Aruba, Curaçao
      of Sint Maarten;

      b. de bevoegdheden van burgemeester en wethouders bevoegdheden zijn van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties;

      c. de genoemde tijdstippen naar plaatselijke tijd gelden;

      d. als locatie van het briefstembureau de locatie van de vertegenwoordiging van Nederland in het betreffende land
      wordt aangewezen;

      e. in afwijking van de [artikelen N 22, tweede lid][ref4], en [N 28, tweede lid][ref5], niet de naam van de
      gemeente, maar de naam van het land wordt vermeld;

      f. indien de zitting, bedoeld in [artikel N 15, eerste lid, onderdeel b][ref6], gemeten naar Nederlandse tijd,
      eerder aanvangt dan in Nederland, [artikel N 27, tweede lid][ref7], buiten toepassing blijft;

      g. de vertegenwoordiger het afschrift van de processen-verbaal, bedoeld in [artikel N 32, tweede lid][ref8], ter
      inzage legt bij de vertegenwoordiging van Nederland in het betreffende land.


