  - number: R 10
    text: |-
      1 Kandidatenlijsten, ingeleverd voor verschillende provincies, waarop dezelfde kandidaten in gelijk aantal en in
      dezelfde volgorde zijn geplaatst, vormen tezamen een stel gelijkluidende lijsten.

      2 Kandidatenlijsten, ingeleverd voor verschillende provincies, waarboven dezelfde aanduiding van een politieke
      groepering is geplaatst of waarvan de eerste kandidaat dezelfde is, vormen tezamen een lijstengroep. Het bepaalde
      in de vorige volzin is mede van toepassing ten aanzien van samenvoeging van aanduidingen van twee of meer
      groeperingen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_10
  - number: R 11
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens door het centraal stembureau bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelR_11
  - number: S 1
    text: |-
      1 Er is voor de verkiezing van de leden van de Eerste Kamer een centraal stembureau. De Kiesraad treedt als zodanig
      op.

      2 Het centraal stembureau houdt een zitting tot het onderzoeken van de kandidatenlijsten.

      3 Indien bij het onderzoek blijkt van een of meer van de volgende verzuimen, geeft het centraal stembureau
      onverwijld bij aangetekende brief of tegen gedagtekend ontvangstbewijs kennis aan degene die de lijst heeft
      ingeleverd:

      a. dat voor een of meer provincies niet een verklaring als bedoeld in [artikel R 2, eerste lid][ref1], is
      overgelegd, waarbij buiten beschouwing blijven de verklaringen van een lid van provinciale staten dat meer dan één
      verklaring heeft ondertekend;

      b. dat een kandidaat niet is vermeld overeenkomstig het bepaalde krachtens [artikel R 6][ref2];

      c. dat ten aanzien van een kandidaat ontbreekt de verklaring dat hij instemt met zijn kandidaatstelling op de lijst
      voor de provincie of provincies waarvoor deze lijst is ingeleverd;

      d. dat ten aanzien van een kandidaat die buiten het Europese deel van Nederland woonplaats heeft, in zijn
      verklaring van instemming de aanwijzing van een gemachtigde ontbreekt;

      e. dat een verklaring, bedoeld in [artikel R 7][ref3], ontbreekt.

      4 Uiterlijk op de derde dag na de zitting, bedoeld in het tweede lid, kan degene die de lijst heeft ingeleverd,
      het verzuim of de verzuimen, in de kennisgeving aangeduid, herstellen bij het centraal stembureau van negen tot
      zeventien uur.

      5 Bij verhindering of ontstentenis van degene die de lijst heeft ingeleverd, treedt in diens plaats een ingevolge
      [artikel R 3][ref4] op de lijst vermelde vervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelR_2
