  - number: O 16a
    text: |-
      1 Het nationaal briefstembureau voert onder vermelding van het nummer van het stembureau in ieder geval de
      aantallen, bedoeld in [artikel O 16, eerste tot en met het derde lid][ref1], uit het proces-verbaal in de
      programmatuur in.

      2 De invoer, bedoeld in het eerste lid:

      a. wordt afzonderlijk van elkaar, door twee leden van het nationaal briefstembureau of ondersteuners gedaan; en

      b. geschiedt handmatig.

