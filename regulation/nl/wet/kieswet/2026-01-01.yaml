        artikel: '12'
  - number: A 2
    text: Er is een Kiesraad, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_2
  - number: A 3
    text: |-
      1 De Kiesraad heeft tot taak:

      a. op te treden als centraal stembureau in de gevallen waarin de wet dat voorschrijft;

      b. de regering en de beide kamers der Staten-Generaal van advies te dienen in aangelegenheden die de verkiezingen
      of uitvoeringstechnische aangelegenheden die het kiesrecht betreffen;

      c. zorg te dragen voor programmatuur die bij de verkiezingen wordt gebruikt overeenkomstig de bij of krachtens deze
      wet te stellen bepalingen;

      d. de kwaliteit van de uitvoering van het verkiezingsproces te bevorderen in de gevallen waarin de wet dat
      voorschrijft;

      e. de uitslagen van de op basis van deze wet gehouden verkiezingen te verzamelen en op een algemeen toegankelijke
      wijze te ontsluiten;

      f. de overige in deze wet aan hem opgedragen taken ten uitvoer te leggen.

      2 De taak, bedoeld in het eerste lid, onderdeel a, wordt door de voorzitter, de daartoe aangewezen leden en de
      buitengewone leden van de Kiesraad uitgeoefend.

      3 Indien het een verkiezing betreft als bedoeld in het eerste lid, onderdeel a, worden de taken en bevoegdheden,
      bedoeld in de artikelen A 12, A 13, Ea 10, Ea 11 en Ea 12 uitgeoefend door een ondervoorzitter en daartoe
      aangewezen leden van de Kiesraad die niet tevens belast zijn met de uitoefening van de taak, bedoeld in het eerste
      lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelA_3
  - number: A 4
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op de Kiesraad, met uitzondering van de
      [artikelen 12][ref2], [21][ref3] en [22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
