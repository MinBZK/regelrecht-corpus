  - number: E 22
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de samenstelling en werkwijze van
      centraal stembureaus, niet zijnde de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_22
  - number: Ea 1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *uitslagprogrammatuur:* a. programmatuur die het gemeentelijk stembureau gebruikt ten behoeve van de
      vaststelling van de aantallen, bedoeld in [artikel Na 26][ref1]; b. programmatuur die het hoofdstembureau gebruikt
      ten behoeve van de vaststelling van de aantallen, bedoeld in [artikel O 5][ref2]; c. programmatuur die het
      nationaal briefstembureau gebruikt voor de vaststelling van de aantallen, bedoeld in [artikel O 16][ref3]; en d.
      programmatuur die het centraal stembureau gebruikt ten behoeve van de vaststelling van de uitslag van de verkiezing
      en de vaststelling van de aantallen, bedoeld in [artikel P 20, eerste lid][ref4];
        - *gebruiker:* het gemeentelijk stembureau, het nationaal briefstembureau, het hoofdstembureau of het centraal
      stembureau;
        - *aansluitvoorschriften:* de aansluitvoorschriften, bedoeld in [artikel Ea 4, eerste lid, aanhef en onder a][ref5];
        - *gebruiksvoorschriften:* de gebruiksvoorschriften, bedoeld in [artikel Ea 4, eerste lid, aanhef en onder b][ref6];
        - *burgemeester en wethouders:* burgemeester en wethouders die het gemeentelijk stembureau hebben ingesteld,
      burgemeester en wethouders van ’s-Gravenhage die het nationaal briefstembureau hebben ingesteld, burgemeester
      en wethouders van de gemeente waar het centraal stembureau voor de verkiezing van de leden van de gemeenteraad,
      onderscheidenlijk provinciale staten is gevestigd;
        - *dagelijks bestuur:* het dagelijks bestuur van het waterschap waarvoor het centraal stembureau voor de verkiezing
      van de leden van het algemeen bestuur is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_26
