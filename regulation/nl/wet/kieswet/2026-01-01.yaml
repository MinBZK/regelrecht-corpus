  - number: D 4
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld uit welke gegevens en bescheiden een registratie als bedoeld
      in [artikel D 2][ref1] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
