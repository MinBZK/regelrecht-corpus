  - number: P 22
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      wordt vermeld:

      a. de uitslag van de verkiezing, die voor iedere kieskring herleidbaar is;

      b. het aantal stemmen dat op elke kandidaat is uitgebracht en het stemcijfer van elke lijst;

      c. de ontvangen meldingen als bedoeld in [artikel P 1b, eerste lid][ref1], en hoe daarmee is omgegaan; en

      d. de mondeling ingebrachte bezwaren alsmede de reactie van het centraal stembureau daarop.

      Het proces-verbaal bevat ten aanzien van iedere kandidaat en iedere lijst het aantal stemmen dat op die kandidaat,
      onderscheidenlijk die lijst, is uitgebracht.

      2 Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau getekend.

      3 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_1b
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_22
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: P_1b
        hoofdstuk: P
        paragraaf: '1'
        afdeling: II
  - number: P 23
    text: |-
      1 Het centraal stembureau maakt zijn proces-verbaal, met weglating van de ondertekening, onverwijld op een algemeen
      toegankelijke wijze elektronisch openbaar.

      2 Het centraal stembureau legt voorts onverwijld een afschrift van zijn proces-verbaal voor eenieder ter inzage
      totdat over de toelating van de gekozenen is beslist.

      3 Het centraal stembureau maakt tevens het met de programmatuur gegenereerde digitale bestand op een algemeen
      toegankelijk wijze elektronisch openbaar.

      4 Indien het betreft de verkiezing van de leden van de gemeenteraad, de provinciale staten of het algemeen bestuur,
      verstrekt het centraal stembureau zo spoedig mogelijk de digitale bestanden dan wel, indien het centraal stembureau
      geen gebruik heeft gemaakt van programmatuur ten behoeve van de berekening van de uitslag van de verkiezing, een
      afschrift van zijn proces-verbaal aan de Kiesraad.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de elektronische
      openbaarmaking van het proces-verbaal en de digitale bestanden.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_23
  - number: P 24
    text: |-
      1 Het centraal stembureau doet aan het vertegenwoordigend orgaan toekomen:

      a. een afschrift van zijn proces-verbaal; en

      b. de processen-verbaal van de gemeentelijk stembureaus.

      2 Indien het centraal stembureau over de navolgende bescheiden beschikt, doet het deze eveneens toekomen aan het
      vertegenwoordigend orgaan:

      a. het proces-verbaal van het nationaal briefstembureau;

      b. de processen-verbaal van de briefstembureaus;

      c. de processen-verbaal van de hoofdstembureaus;

      d. de processen-verbaal van de stembureaus; en

      e. de corrigenda bij de bovengenoemde processen-verbaal.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_24
  - number: P 27
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelP_27
  - number: Pa 1
    text: |-
      De leden van het kiescollege worden, voor zover dit hoofdstuk niet anders bepaalt, gekozen met overeenkomstige
      toepassing van de bij of krachtens deze afdeling gestelde bepalingen inzake de verkiezing van de leden van
      provinciale staten van een provincie die één kieskring vormt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelPa_1
  - number: Pa 2
    text: |-
      1 De leden van het kiescollege worden gekozen door degenen die Nederlander zijn, op de dag van de stemming de
      leeftijd van achttien jaar hebben bereikt en op de dag van kandidaatstelling geen ingezetenen van Nederland zijn,
      met uitzondering van degenen die op de dag van de kandidaatstelling hun werkelijke woonplaats hebben in Aruba,
      Curaçao of Sint Maarten.

      2 Deze uitzondering geldt niet voor:

      a. de Nederlander die gedurende ten minste tien jaren ingezetene van Nederland is geweest;

      b. de Nederlander die in Nederlandse openbare dienst in Aruba, Curaçao of Sint Maarten werkzaam is, alsmede
      zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelPa_2
  - number: Pa 3
    text: |-
      Het bij en krachtens [hoofdstuk D][ref1] bepaalde is van overeenkomstige toepassing op de verkiezing van het
      kiescollege, met dien verstande dat in [artikel D 2][ref2] in plaats van «aan wie kiesrecht toekomt op grond van
      [artikel B 1][ref3]» wordt gelezen: aan wie kiesrecht toekomt op grond van [artikel Pa 2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukD
