  - number: J 8
    text: |-
      1 Aan de tot deelneming aan de stemming bevoegde kiezer wiens stempas in het ongerede is geraakt of die geen
      stempas heeft ontvangen, wordt op zijn verzoek door de burgemeester een nieuwe stempas uitgereikt of verzonden.

      2 De kiezer doet hiervoor een schriftelijk of mondeling verzoek aan de burgemeester.

      3 Het schriftelijk verzoek dient op de vijfde dag voor de dag van de stemming te zijn ontvangen. Het mondeling
      verzoek wordt uiterlijk op de dag voor de stemming om twaalf uur gedaan. Deze termijnen worden op de stempas
      vermeld.

      4 De kiezer legt bij zijn verzoek een kopie over van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      5 Aan de kiezer wiens stempas op grond van [artikel J 7a, tweede lid, onderdelen a, c, d en e][ref2], ongeldig is,
      wordt geen nieuwe stempas uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
