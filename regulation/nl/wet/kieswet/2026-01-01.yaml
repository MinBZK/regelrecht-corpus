  - number: Na 14
    text: |-
      1 Het gemeentelijk stembureau legt de uitkomst van de nieuwe stemopneming vast in een corrigendum dat het bij het
      proces-verbaal van het stembureau voegt.

      2 De in het corrigendum vastgelegde aantallen treden in de plaats van de aantallen zoals deze eerder door het
      stembureau in zijn proces-verbaal zijn vermeld.

      3 Het corrigendum wordt ondertekend door de leden van het gemeentelijk stembureau die de nieuwe stemopneming hebben
      uitgevoerd.

      4 Op het proces-verbaal van het stembureau wordt aantekening gemaakt van het bestaan van het corrigendum.

      5 Bij regeling van de Kiesraad wordt voor het corrigendum bij het proces-verbaal van het stembureau een model
      vastgesteld. Het door de Kiesraad vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_14
  - number: Na 15
    text: |-
      1 Nadat de controle van het proces-verbaal van een stembureau is afgerond worden het proces-verbaal van dat
      stembureau en, indien van toepassing, het corrigendum, alsook de sleutel van de transportbox, in een enveloppe
      gedaan. De enveloppe wordt verzegeld.

      2 Op de enveloppe wordt de naam van de gemeente, het nummer van het stembureau en een aanduiding van de verkiezing
      vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_15
  - number: Na 16
    text: |-
      Deze paragraaf is van toepassing als bij de verkiezing een centrale stemopneming plaatsvindt als bedoeld in
      [artikel N 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
