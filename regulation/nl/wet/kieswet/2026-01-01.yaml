  - number: Pa 8
    text: |-
      1 Het bepaalde bij of krachtens [artikel G 1a][ref1] over het registreren van logo’s is van overeenkomstige
      toepassing op de verkiezing van de leden van het kiescollege, met dien verstande dat in plaats van het eerste lid,
      eerste volzin, wordt gelezen: Een politieke groepering waarvan het logo niet reeds bij het centraal stembureau voor
      de verkiezing van de leden van de Tweede Kamer is geregistreerd, kan aan het centraal stembureau voor de verkiezing
      van de leden van het kiescollege schriftelijk verzoeken haar logo bij te schrijven in het register, bedoeld in
      [artikel Pa 1][ref2] in samenhang met [G 2][ref3] van de Kieswet.

      2 Een geregistreerd logo voor de verkiezing van de leden van de Tweede Kamer, waarvan mededeling is gedaan in de
      Staatscourant, geldt tevens voor de verkiezing van de leden van het kiescollege.


