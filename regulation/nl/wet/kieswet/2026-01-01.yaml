    text: |-
      Het minimumaantal over te leggen verklaringen van ondersteuning, bedoeld in [artikel H 4, eerste lid][ref1],
      bedraagt voor de verkiezing van de leden van het kiescollege: 10.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelPa_10
