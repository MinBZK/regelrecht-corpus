    text: |-
      1 Het bestuursorgaan zendt geschriften tot behandeling waarvan kennelijk een ander bestuursorgaan bevoegd is,
      onverwijld door naar dat orgaan, onder gelijktijdige mededeling daarvan aan de afzender.

      2 Het bestuurorgaan zendt geschriften die niet voor hem bestemd zijn en die ook niet worden doorgezonden, zo
      spoedig mogelijk terug aan de afzender.
