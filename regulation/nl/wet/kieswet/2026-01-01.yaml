  - number: Xa 1
    text: |-
      De bij of krachtens deze afdeling gestelde bepalingen betreffende het begin van en de veranderingen in het
      lidmaatschap van provinciale staten en betreffende de beëindiging van het lidmaatschap en tijdelijke vervanging als
      lid, zijn, voor zover dit hoofdstuk niet anders bepaalt, van overeenkomstige toepassing op het lidmaatschap van het
      kiescollege, met dien verstande dat telkens in die bepalingen in plaats van «provinciale staten» en «staten» wordt
      gelezen: het kiescollege.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelXa_1
  - number: Xa 2
    text: |-
      1 Indien een benoemde geen gemachtigde heeft aangewezen als bedoeld in [artikel Pa 13, eerste lid][ref1], wordt
      de brief houdende de kennisgeving van zijn benoeming, in afwijking van [artikel V 1, eerste lid][ref2], met
      tussenkomt van de burgemeester van ’s-Gravenhage verzonden via een elektronisch systeem voor gegevensverwerking
      waarin de geadresseerde toegang heeft tot het bericht via een publiek uitgegeven authenticatiemiddel.

      2 Ingeval het eerste lid van toepassing is, geldt voor de handelingen bedoeld in de
      [artikelen V 2, eerste, vierde en vijfde lid][ref3], [V 3][ref4], [W 2, eerste lid onder f][ref5], en
      [Xa 3][ref6], dat de benoemde deze verricht via het versturen van een bericht langs elektronische weg aan het
      kiescollege dan wel het centraal stembureau.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het langs elektronische
      weg verrichten van de handelingen bedoeld in het eerste en tweede lid en het gebruik van het elektronisch systeem
      voor gegevensverwerking.


