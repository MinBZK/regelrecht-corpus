  - number: Ea 2
    text: |-
      1 De Kiesraad draagt overeenkomstig de bij of krachtens dit hoofdstuk gestelde bepalingen zorg voor de
      beschikbaarstelling, instandhouding, betrouwbare werking en beveiliging van de uitslagprogrammatuur.

      2 De Kiesraad stelt bij elke verkiezing de uitslagprogrammatuur ter beschikking aan de gebruiker, mits vooraf een
      toets als bedoeld in [artikel Ea 5, eerste lid][ref1], heeft plaatsgevonden.

      3 Als de uitslagprogrammatuur gebruik maakt van centrale voorzieningen, richt de Kiesraad deze in en treft de
      Kiesraad centrale maatregelen, met het oog op de betrouwbare werking en beveiliging van de uitslagprogrammatuur.

      4 Bij algemene maatregel van bestuur worden regels gesteld over het ter beschikking stellen van de
      uitslagprogrammatuur aan de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_5
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelEa_2
