  - number: Ea 8
    text: |-
      1 De Kiesraad, de colleges van burgemeester en wethouders, de dagelijkse besturen en de gebruikers werken bij de
      uitvoering van de bij of krachtens dit hoofdstuk aan hen toegekende taken samen om tot een betrouwbaar en veilig
      gebruik van de uitslagprogrammatuur te komen.

      2 De Kiesraad stelt ter bevordering van het betrouwbaar en veilig gebruik van de uitslagprogrammatuur een
      samenwerkingsprotocol vast na overleg met: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, een
      instantie die representatief kan worden geacht voor de colleges van burgemeester en wethouders alsmede een
      instantie die representatief kan worden geacht voor de dagelijks besturen.

      3 In het samenwerkingsprotocol worden in ieder geval procedures vastgelegd voor gevallen waarin:

      a. decentrale voorzieningen of maatregelen als bedoeld in [artikel Ea 6, eerste lid, onder a][ref1], niet in
      overeenstemming zijn met de aansluitvoorschriften;

      b. het gebruik van de uitslagprogrammatuur door de gebruiker niet in overeenstemming is met de
      gebruiksvoorschriften;

      c. anderszins sprake is van een storing in of aantasting van de werking, betrouwbaarheid of beveiliging van de
      uitslagprogrammatuur, misbruik of oneigenlijk gebruik van de toegang tot de uitslagprogrammatuur, of het vermoeden
      of de dreiging daarvan.

      4 De Kiesraad maakt het samenwerkingsprotocol in de Staatscourant bekend. Tevens maakt de Kiesraad het
      samenwerkingsprotocol voor de dag van de kandidaatstelling op een algemeen toegankelijke wijze elektronisch
      openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_6
