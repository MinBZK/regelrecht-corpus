  - number: Ea 9
    text: |-
      1 De Kiesraad verstrekt burgemeester en wethouders, het dagelijks bestuur en de gebruiker desgevraagd en uit eigen
      beweging gegevens en inlichtingen over een inbreuk op de betrouwbare en veilige werking van de uitslagprogrammatuur
      of de dreiging of het vermoeden daarvan, voor zover dit noodzakelijk is voor het betrouwbare en veilige gebruik van
      de uitslagprogrammatuur.

      2 Burgemeester en wethouders, het dagelijks bestuur en de gebruiker stellen, onderscheidenlijk stelt de Kiesraad
      desgevraagd en uit eigen beweging onverwijld in kennis van:

      a. een misbruik of oneigenlijk gebruik van de uitslagprogrammatuur of het vermoeden daarvan;

      b. een inbreuk op de beveiliging of de integriteit van de decentrale voorzieningen en maatregelen;

      c. andere informatie die de Kiesraad nodig heeft om maatregelen te kunnen nemen om een inbreuk op de betrouwbare en
      veilige werking van de uitslagprogrammatuur te voorkomen of te beëindigen.

      3 Eenieder kan schriftelijk bij de Kiesraad een onderbouwde melding maken van een vermeende of geconstateerde
      storing in of aantasting van de werking, betrouwbaarheid of beveiliging van de uitslagprogrammatuur of de dreiging
      daarvan. Onverminderd [artikel Ea 12, tweede lid, aanhef en onder b][ref1], maakt de Kiesraad deze meldingen bij
      elke verkiezing op een algemeen toegankelijke wijze elektronisch openbaar.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de publicatie van de meldingen, bedoeld in
      het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_12
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelEa_9
