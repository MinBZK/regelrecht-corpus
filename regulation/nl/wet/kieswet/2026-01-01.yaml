        paragraaf: '1'
        afdeling: II
  - number: Na 20
    text: |-
      1 Het gemeentelijk stembureau gaat over tot een nieuwe opneming van de aantallen geldige stempassen, kiezerspassen
      en volmachtbewijzen, indien:

      a. het stembureau in zijn proces-verbaal melding heeft gemaakt van een telverschil als bedoeld in
      [artikel N 8a, eerste lid][ref1], en het stembureau hiervoor geen verklaring heeft gegeven; of

      b. er een verschil is tussen het aantal tot de stemming toegelaten kiezers als bedoeld in artikel N 1a,
      eerste lid, en het door het gemeentelijk stembureau vastgestelde aantal uitgebrachte stemmen als bedoeld in
      [artikel Na 18, derde lid][ref2], en het stembureau hiervoor geen verklaring heeft gegeven.

      2 In afwijking van artikel N 1a, eerste lid, is de som van de aantallen, bedoeld in het eerste lid, het aantal
      kiezers dat tot de stemming is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8a
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_18
