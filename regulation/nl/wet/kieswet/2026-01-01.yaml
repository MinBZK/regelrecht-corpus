      1 De voorzitter van het briefstembureau opent de enveloppen die zich in de stembus bevinden.

      2 Indien in een enveloppe zich geen of meer dan één stembiljet bevindt, wordt hiervan een aantekening gemaakt
      in het proces-verbaal. Indien zich meer dan één stembiljet in een enveloppe bevindt, doet de voorzitter van het
