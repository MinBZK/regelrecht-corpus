  - number: J 2
    text: |-
      De stemming geschiedt in elke kieskring over de kandidaten wier namen voorkomen op de voor die kieskring geldig
      verklaarde kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_2
  - number: J 4
    text: |-
      1 Burgemeester en wethouders wijzen voor elk stembureau een geschikt stemlokaal aan. Bij algemene maatregel van
      bestuur kunnen hieromtrent nadere regels worden gesteld. De burgemeester doet van de adressen van de stemlokalen
      mededeling aan de kiezer op bij algemene maatregel van bestuur vast te stellen wijze.

      2 Burgemeester en wethouders dragen er zorg voor dat alle in de gemeente aangewezen stemlokalen zodanig zijn
      gelegen en zo zijn ingericht en uitgerust dat kiezers met lichamelijke beperkingen zoveel mogelijk hun stem
      zelfstandig kunnen uitbrengen.

      3 Indien burgemeester en wethouders niet voldoen aan het tweede lid informeren zij de gemeenteraad over de reden
      hiervoor.

      4 Op verzoek van burgemeester en wethouders stellen de besturen van bijzondere scholen de daarvoor in aanmerking
      komende lokalen en het zich daarin bevindende materiaal voor de inrichting en het gebruik als stemlokaal
      beschikbaar, desgewenst tegen vergoeding van de daaruit voortvloeiende onkosten.

      5 De burgemeester draagt zorg voor de inrichting van het stemlokaal en wijst zo nodig personen aan die het
      stembureau ten dienste worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_4
  - number: J 4a
    text: |-
      1 Burgemeester en wethouders kunnen in hun gemeente mobiele stembureaus aanwijzen. De burgemeester doet van een
      dergelijke aanwijzing ten minste veertien dagen voor de stemming mededeling in het gemeenteblad.

      2 Burgemeester en wethouders stellen de zittingstijden vast en onderscheiden plaatsen waar de mobiele stembureaus
      gedurende de dag der stemming worden gestationeerd. De tijdstippen en plaatsen worden bekendgemaakt in de
      mededeling, bedoeld in het eerste lid.

      3 Alvorens een stembureau als bedoeld in het eerste lid naar een andere standplaats vertrekt, wordt de sleuf
      van de stembus door de voorzitter van het stembureau in tegenwoordigheid van de aanwezige personen afgesloten
      en verzegeld. De voorzitter bewaart de sleutel waarmee de stembus is afgesloten, tijdens het verplaatsen naar de
      volgende standplaats. De voorzitter opent na de aankomst van het mobiele stembureau op de nieuwe standplaats de
      stembus in tegenwoordigheid van de aanwezige personen.

      4 [Artikel J 1a, derde lid][ref1], is van overeenkomstige toepassing.

      5 [Artikel J 1a, vierde lid en vijfde lid][ref2], is van overeenkomstige toepassing op de locatie waar het
      stembureau laatstelijk zitting houdt ten behoeve van de stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1a
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1a
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_4a
