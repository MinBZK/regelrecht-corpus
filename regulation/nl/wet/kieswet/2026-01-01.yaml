  - number: Ya 12
    text: |-
      In afwijking van [artikel O 10, eerste lid][ref1], draagt de voorzitter van het hoofdstembureau ervoor zorg dat de
      in die bepaling bedoelde verkiezingsbescheiden terstond nadat de leden het proces-verbaal van het hoofdstembureau
      hebben getekend, langs elektronische weg ter kennis wordt gebracht van het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_10
