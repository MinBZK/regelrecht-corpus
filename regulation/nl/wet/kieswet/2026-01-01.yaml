      In [artikel H 7, derde lid][ref1], wordt gelezen: Indien voor de verkiezing van de leden van het kiescollege op een
      lijst de naam voorkomt van een kandidaat die ingezetene is van Nederland, dient bij de lijst te worden overgelegd
      een door die kandidaat ondertekende verklaring, waaruit blijkt, dat hij voornemens is of dat hij bij benoeming
      bereid is zich te vestigen buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelH_7
