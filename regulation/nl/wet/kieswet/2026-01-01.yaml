  - number: Ea 3
    text: |-
      1 Onverminderd de artikelen Ea 3, vierde lid, en [Ea 5, vierde lid][ref1], maakt de Kiesraad, met het oog op
      transparantie van de uitslagprogrammatuur, voorafgaand aan elke verkiezing op een algemeen toegankelijke wijze
      elektronisch openbaar:

      a. gegevens, waaronder in ieder geval technische gegevens, met betrekking tot de uitslagprogrammatuur die bij die
      verkiezing wordt gebruikt, en

      b. indien de situatie, bedoeld in [artikel Ea 2, derde lid][ref2], zich voordoet: een beschrijving van de in dat
      artikel bedoelde centrale voorzieningen en maatregelen van de Kiesraad.

      2 Van het eerste lid kan worden afgeweken, voor zover zwaarwegende redenen met betrekking tot de beveiliging van de
      uitslagprogrammatuur of de centrale voorzieningen en maatregelen zich tegen openbaarmaking verzetten.

      3 De Kiesraad stelt voor de uitslagprogrammatuur een specificatie op, die duidelijk maakt op welke wijze in de
      uitslagprogrammatuur de voor de berekening en vaststelling van de uitslag van de verkiezing relevante bepalingen
      van [hoofdstuk P][ref3] worden toegepast.

      4 De Kiesraad laat de specificatie toetsen door een deskundige en onafhankelijke instantie, en maakt de
      specificatie en de uitkomst van de toets op een algemeen toegankelijke wijze elektronisch openbaar.

      5 De uitslagprogrammatuur bevat de functionaliteiten die overeenkomstig de specificatie, bedoeld in het derde lid,
      nodig zijn voor de berekening en vaststelling van de uitslag van de verkiezingen.

      6 Het ontwerp van de uitslagprogrammatuur is erop gericht om toevallig of opzettelijk foutief gebruik daarvan te
      voorkomen.

      7 Bij algemene maatregel van bestuur worden nadere regels gesteld over:

      a. de gegevens, bedoeld in het eerste lid, onder a, en de wijze van openbaarmaking van die gegevens en van de
      beschrijving, bedoeld in het eerste lid, onder b,

      b. de werking, het ontwerp, de betrouwbaarheid en de beveiliging van de uitslagprogrammatuur, en

      c. de inrichting, de werking, de betrouwbaarheid en de beveiliging van de in [artikel Ea 2, derde lid][ref4]
      bedoelde centrale voorzieningen en de eisen met betrekking tot de in dat artikellid bedoelde maatregelen.


