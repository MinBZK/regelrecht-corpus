  - number: Ya 11
    text: |-
      1 In afwijking van [artikel Na 35, eerste lid][ref1], dragen de gezaghebbers van Sint Eustatius en Saba ervoor zorg
      dat het proces-verbaal van het stembureau van het openbaar lichaam onverwijld langs elektronische weg ter kennis
      van het hoofdstembureau wordt gebracht.

      2 Indien in het openbaar lichaam geen centrale stemopneming heeft plaatsgevonden, worden op dezelfde wijze tevens
      de processen-verbaal van de stembureaus en corrigenda ter kennis van het hoofdstembureau gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_35
