  - number: I 12
    text: |-
      Het centraal stembureau nummert in de zitting, bedoeld in [artikel I 4][ref1], de kandidatenlijsten die hij geldig
      heeft verklaard en maakt deze beslissing op de zitting bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_12
