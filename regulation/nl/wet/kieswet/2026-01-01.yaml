      In geval van ontbinding van de Tweede Kamer vindt de kandidaatstelling plaats op een bij het koninklijk besluit tot
      ontbinding te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelF_2
  - number: G 1
    text: |-
      1 Een politieke groepering die een vereniging is met volledige rechtsbevoegdheid kan aan het centraal
      stembureau voor de verkiezing van de leden van de Tweede Kamer schriftelijk verzoeken de aanduiding waarmee
      zij voor die verkiezing op de kandidatenlijst wenst te worden vermeld, in te schrijven in een register dat
      door het centraal stembureau wordt bijgehouden. De verzoeken die zijn ontvangen of aangevuld als bedoeld
      in [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1], na de tweeënveertigste dag voor de
      kandidaatstelling, blijven voor de daaropvolgende verkiezing buiten behandeling.

      2 Voor de in het eerste lid bedoelde registratie moet een waarborgsom van € 450 dan wel, indien het een groepering
      betreft die blijkens de statuten haar zetel heeft in Bonaire, Sint Eustatius of Saba, een waarborgsom van USD 450
      worden betaald aan de Staat. Degene die de betaling heeft verricht, ontvangt een bewijs daarvan. Na inlevering
      van een geldige kandidatenlijst voor de eerstkomende verkiezing na de beslissing op het verzoek wordt hem de
      waarborgsom teruggegeven.

      3 Bij het verzoek worden overgelegd:

      a. een afschrift van de notariële akte waarin de statuten van de vereniging zijn opgenomen;

      b. het in het tweede lid bedoelde bewijs van betaling;

      c. een verklaring van de politieke groepering, houdende aanwijzing van haar gemachtigde en plaatsvervangend
      gemachtigde bij het centraal stembureau, welke geldt zolang zij niet door een andere is vervangen.

      4 Het centraal stembureau beschikt slechts afwijzend op het verzoek, indien:

      a. de aanduiding strijdig is met de openbare orde;

      b. de aanduiding geheel of in hoofdzaak overeenstemt met een reeds geregistreerde aanduiding van een andere
      politieke groepering, of met een aanduiding waarvoor reeds eerder op grond van dit artikel een registratieverzoek
      is ontvangen, en daardoor verwarring te duchten is;

      c. de aanduiding anderszins misleidend is voor de kiezers;

      d. de aanduiding meer dan 35 letters of andere tekens bevat;

      e. de aanduiding geheel of in hoofdzaak overeenstemt met die van een rechtspersoon die bij onherroepelijke
      rechterlijke uitspraak verboden is verklaard en deswege is ontbonden;

      f. het verzoek op dezelfde dag bij het centraal stembureau is ingekomen als een ander verzoek, strekkende tot
      inschrijving van een geheel of in hoofdzaak gelijkluidende aanduiding, tenzij dat andere verzoek reeds op een der
      onder *a* tot en met *e* genoemde gronden moet worden afgewezen.

      5 Van de beslissing van het centraal stembureau op het verzoek wordt mededeling gedaan aan de gemachtigde en in
      de Staatscourant.

      6 Een politieke groepering waarvan de aanduiding is ingeschreven in het register, kan schriftelijk een verzoek tot
      wijziging van deze aanduiding indienen bij het centraal stembureau. De laatste volzin van het eerste lid, alsmede
      het vierde en vijfde lid zijn op verzoeken tot wijziging van overeenkomstige toepassing.

      7 Het centraal stembureau schrapt de aanduiding in het register en doet hiervan mededeling in de Staatscourant,
      wanneer:

      a. de politieke groepering heeft opgehouden te bestaan;

      b. de politieke groepering een verzoek daartoe heeft gedaan;

      c. de politieke groepering als vereniging bij onherroepelijke rechterlijke uitspraak verboden is verklaard en
      deswege is ontbonden;

      d. voor de laatstgehouden verkiezing van de leden van de Tweede Kamer geen geldige kandidatenlijst is ingeleverd.

      8 Op de veertigste dag voor de kandidaatstelling voor de verkiezing van de leden van provinciale staten, van het
      algemeen bestuur of van de gemeenteraad, doet het centraal stembureau van de door hem geregistreerde aanduidingen
      van politieke groeperingen, voor zover de registratie daarvan onherroepelijk is, alsmede van de namen van de
      gemachtigden en hun plaatsvervangers mededeling in de Staatscourant.

      9 Het centraal stembureau vernietigt het verzoekschrift en de daarbij overgelegde stukken, bedoeld in het derde
      lid, zodra de schrapping van de aanduiding van de politieke groepering onherroepelijk is. De verklaring, bedoeld in
      het derde lid, onderdeel c, wordt tevens vernietigd wanneer de verklaring wordt vervangen door een andere.


