  - number: U 17
    text: |-
      Het centraal stembureau kan, hetzij ambtshalve, hetzij naar aanleiding van een met opgave van redenen gedaan
      verzoek van een of meer leden van de staten van een provincie, tot een nieuwe opneming van stembiljetten uit een of
      meer provincies overgaan.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_17
  - number: U 18
    text: |-
      1 Zodra de uitslag van de verkiezing is vastgesteld, worden de geopende verzegelde pakken, nadat alle stembiljetten
      weer daarin zijn gedaan, opnieuw verzegeld.

      2 Het centraal stembureau bewaart de verzegelde pakken drie maanden nadat over de toelating van de gekozenen is
      beslist. Daarna vernietigt het deze pakken onmiddellijk. Van deze vernietiging wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_18
  - number: U 19
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelU_19
  - number: Ua 1
    text: |-
      1 De leden van de Eerste Kamer ter vertegenwoordiging van Nederlanders die geen ingezetenen zijn, worden gekozen
      door de leden van het kiescollege.

      2 De leden van het kiescollege komen tot het uitbrengen van hun stem in vergadering bijeen in het Europese deel
      van Nederland.

      3 Voor de verkiezing van de leden van de Eerste Kamer vormt het gebied buiten Nederland één kieskring: kieskring
      buitenland.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelUa_1
  - number: Ua 2
    text: |-
      De bij of krachtens deze afdeling gestelde bepalingen betreffende de verkiezing van de leden van de Eerste Kamer
      zijn, voor zover deze paragraaf niet anders bepaalt, van overeenkomstige toepassing op de verkiezing van deze leden
      door de leden van het kiescollege, met dien verstande dat telkens in die bepalingen mede wordt gelezen in plaats
      van:

      a. «provincie» of «provincies»: kieskring buitenland;

      b. «provinciale staten» en «staten»: het kiescollege;

      c. «statenlid»: kiescollegelid; en

      d. «statenvergadering»: vergadering van het kiescollege.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelUa_2
  - number: Ua 3
    text: |-
      1 In aanvulling op [artikel T 4, tweede lid][ref1], kan een lid van het kiescollege, indien hij verhinderd is om
      fysiek deel te nemen aan de stemming, zijn verzoek om bij volmacht te stemmen voor aanvang van de zitting langs
      elektronische weg aan de voorzitter mededelen.

      2 Bij ministeriële regeling wordt voor deze mededeling een model vastgesteld. Bij algemene maatregel van bestuur
      kunnen nadere regels worden gesteld over de mededeling langs elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelT_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelUa_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: T_4
        hoofdstuk: T
        afdeling: III
  - number: Ua 4
    text: |-
      1 In afwijking van [artikel U 2, eerste lid][ref1], geldt de stem van een lid van het kiescollege voor een aantal
      stemmen, gelijk aan het getal dat verkregen wordt door eerst het aantal geregistreerde kiezers voor de verkiezing
      van de leden van het kiescollege te delen door het honderdvoud van het aantal leden van het kiescollege op grond
      van [artikel 5, eerste lid, van de Wet kiescollege niet-ingezetenen][ref2] en het getal dat hieruit volgt te
      vermenigvuldigen met het getal dat verkregen wordt door het aantal inwoners van Nederland te delen door het aantal
      kiesgerechtigden voor de verkiezingen van de leden van provinciale staten en de kiescolleges voor de Eerste Kamer
      in Bonaire, Sint Eustatius en Saba. Het quotiënt wordt daarna afgerond tot een geheel getal, naar boven, indien
      een breuk 1/2 of meer, en naar beneden, indien een breuk minder dan 1/2 bedraagt. Dit getal wordt de stemwaarde
      genoemd.

      2 Als het aantal geregistreerde kiesgerechtigden voor de verkiezing van de leden van het kiescollege geldt het
      aantal voor deze verkiezing geregistreerde kiezers op grond van [Pa 3][ref3] in samenhang met [artikel D 2][ref4]
      vierendertig dagen voor de dag van de stemming. Burgemeester en wethouders verschaffen deze informatie onverwijld
      aan het centraal stembureau.

      3 Als het inwonertal van Nederland geldt het inwonertal volgens de door het Centraal Bureau voor de Statistiek
      openbaar gemaakte bevolkingscijfers per 1 januari van het jaar waarin de verkiezing plaatsvindt.

      4 Als het aantal kiesgerechtigden voor de verkiezingen van de leden van provinciale staten en de kiescolleges
      voor de Eerste Kamer in Bonaire, Sint Eustatius en Saba geldt het aantal personen dat kiesgerechtigd was bij de
      voorgaande verkiezing van provinciale staten en voornoemde kiescolleges.

      5 Indien, in geval van ontbinding van de Eerste Kamer, het inwonertal van Nederland per 1 januari van het jaar
      waarin de verkiezing plaatsvindt drie weken voor de dag van de kandidaatstelling nog niet openbaar is gemaakt,
      geldt het inwonertal volgens de door het Centraal Bureau voor de Statistiek openbaar gemaakte bevolkingscijfers per
      de eerste dag van de vierde maand voorafgaande aan de maand waarin de kandidaatstelling plaatsvindt.

      6 Het centraal stembureau stelt de stemwaarde overeenkomstig dit artikel vast en maakt deze voor de dag van
      stemming openbaar door publicatie in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelU_2
      [ref2]: https://wetten.overheid.nl/BWBR0047384#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelPa_3
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
