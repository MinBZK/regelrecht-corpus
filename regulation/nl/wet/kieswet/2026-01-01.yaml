  - number: B 4
    text: |-
      1 Onder ingezetenen van Nederland, van de provincie, van het waterschap en van de gemeente verstaat deze wet hen
      die onderscheidenlijk in Nederland, in de provincie, in het waterschap en in de gemeente werkelijke woonplaats
      hebben.

      2 Zij die als ingezetene met een adres in een gemeente zijn ingeschreven in de basisregistratie personen, worden
      voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in
      die gemeente.

      3 Zij die als ingezetene met een adres zijn ingeschreven in de basisregistratie personen, worden voor de toepassing
      van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in het waterschap
      waaronder dat adres valt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_4
  - number: B 5
    text: |-
      1 Van het kiesrecht zijn uitgesloten zij die bij onherroepelijke rechterlijke uitspraak van het kiesrecht zijn
      ontzet. De uitsluiting wordt beoordeeld naar de toestand op de dag van de kandidaatstelling.

      2 Onze Minister van Justitie en Veiligheid draagt zorg, dat van elke onherroepelijke rechterlijke uitspraak
      als bedoeld in het eerste lid zo spoedig mogelijk mededeling wordt gedaan. Indien de betrokkene als ingezetene
      is ingeschreven in de basisregistratie personen wordt mededeling gedaan aan de burgemeester van de gemeente
      waar betrokkene volgens de basisregistratie zijn adres heeft. In andere gevallen wordt mededeling gedaan aan
      de burgemeester van de gemeente ’s-Gravenhage. In de mededeling worden naam, voorletters of voornamen, adres en
      geboortedatum van de betrokkene alsmede de duur van de uitsluiting vermeld.

      3 De burgemeester respectievelijk de burgemeester van 's-Gravenhage stelt de persoon na ontvangst van de mededeling
      in kennis van zijn uitsluiting en de duur daarvan.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_5
  - number: B 6
    text: |-
      1 Kiesgerechtigde personen aan wie op de dag van de stemming rechtmatig hun vrijheid is ontnomen, oefenen hun
      kiesrecht uit door bij volmacht te stemmen.

      2 Deze beperking geldt niet:

      a. voor hen die op de dag van de stemming een zodanige feitelijke bewegingsvrijheid genieten dat zij in persoon aan
      de stemming kunnen deelnemen;

      b. voor hen die op grond van het regime van de inrichting waarin zij verblijven aanspraak hebben op periodiek
      verlof.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende het stemmen bij volmacht door
      de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelB_6
  - number: C 1
    text: |-
      1 De leden van de Tweede Kamer worden gekozen voor vier jaren.

      2 Zij treden tegelijk af op de woensdag op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip in de
      periode van 29 maart tot en met 4 april.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelC_1
  - number: C 2
    text: |-
      1 De leden van de Tweede Kamer, gekozen na ontbinding van de kamer, treden tegelijk af op een door de Voorzitter
      van de Tweede Kamer te bepalen tijdstip op de eerstvolgende woensdag in de in [artikel C 1][ref1], tweede lid,
      bedoelde periode nadat vier jaren zijn verstreken sedert de zitting van het centraal stembureau waarin de uitslag
      van de verkiezing is bekendgemaakt.

      2 Indien deze vier jaren eindigen in een periode, aanvangend met het in [artikel C 1][ref2], tweede lid, bedoelde
      tijdstip en op een door de Voorzitter van de Tweede Kamer te bepalen tijdstip eindigend op de woensdag in de
      periode van 25 tot en met 31 mei, treden zij af met ingang van de eerstvolgende woensdag in de in dat lid bedoelde
      periode nadat drie jaren zijn verstreken sedert de zitting van het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelC_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelC_2
    references:
