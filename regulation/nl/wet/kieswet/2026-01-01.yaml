  - number: N 31
    text: |-
      1 Een briefstembureau dat is ingesteld door burgemeester en wethouders van ’s-Gravenhage, brengt zijn processen-
      verbaal onverwijld over naar de burgemeester.

      2 De burgemeester maakt de processen-verbaal, met weglating van de ondertekening, onverwijld op een algemeen
      toegankelijke wijze elektronisch openbaar. Bij ministeriële regeling kan hiervoor een internetadres worden
      aangewezen. De openbaarmaking geschiedt ten minste tot drie maanden nadat over de toelating van de gekozenen is
      beslist.

      3 De burgemeester legt een afschrift van de processen-verbaal voor eenieder ter inzage in het gemeentehuis totdat
      over de toelating van de gekozenen is beslist. Voorts brengt de burgemeester de processen-verbaal onverwijld over
      naar het nationaal briefstembureau.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkwijze van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_31
  - number: N 32
    text: |-
      1 Een briefstembureau dat is ingesteld door burgemeester en wethouders van een andere gemeente, brengt zijn
      processen-verbaal onverwijld over naar de burgemeester.

      2 De burgemeester legt een afschrift van de processen-verbaal voor eenieder ter inzage in het gemeentehuis, totdat
      over de toelating van de gekozenen is beslist. Voorts brengt de burgemeester de processen-verbaal onverwijld langs
      elektronische weg ter kennis van het nationaal briefstembureau.

      3 [Artikel N 31, tweede en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_31
