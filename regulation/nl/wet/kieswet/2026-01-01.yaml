  - number: N 1
    text: |-
      1 Burgemeester en wethouders kunnen voor een verkiezing besluiten dat de vaststelling van het aantal stemmen dat op
      iedere kandidaat van een lijst is uitgebracht geschiedt door het gemeentelijk stembureau.

      2 Het in het eerste lid bedoelde besluit tot het houden van een centrale stemopneming wordt uiterlijk op de dag van
      de kandidaatstelling voor een verkiezing bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_1
  - number: N 1a
    text: |-
      1 Onmiddellijk nadat de stemming is geëindigd, stelt het stembureau vast de aantallen geldige stempassen,
      kiezerspassen en volmachtbewijzen. De som van deze aantallen is het aantal kiezers dat tot de stemming is
      toegelaten.

      2 De voorzitter deelt de aantallen mee aan de aanwezige personen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_1a
  - number: N 2
    text: |-
      1 Het stembureau doet in afzonderlijke pakken:

      a. de geldige stempassen, kiezerspassen en volmachtbewijzen;

      b. de onbruikbaar gemaakte stempassen, kiezerspassen en volmachtbewijzen;

      c. de onbruikbaar gemaakte stembiljetten;

      d. de niet gebruikte stembiljetten;

      e. het uittreksel van ongeldige stempassen.

      2 Elk pak wordt verzegeld en voorzien van de naam van de gemeente, het nummer van het stembureau alsook een
      beschrijving van de inhoud.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_2
  - number: N 3
    text: |-
      Onmiddellijk na de in [artikel N 2][ref1] voorgeschreven verzegelingen wordt de stembus geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_3
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_2
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 5
    text: |-
      De leden van het stembureau openen de stembiljetten en voegen deze lijstgewijze bijeen. Zij kunnen zich bij
      hun werkzaamheden doen bijstaan door plaatsvervangende leden en door ambtenaren van de gemeente, daartoe door
      burgemeester en wethouders aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_5
  - number: N 6
    text: |-
      1 Het stembureau stelt ten aanzien van iedere lijst vast:

      a. het aantal op iedere kandidaat uitgebrachte stemmen;

      b. de som van de aantallen stemmen, bedoeld onder a.

      2 Daarnaast stelt het stembureau vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen.

      3 De som van de aantallen op kandidaten uitgebrachte stemmen, blanco stemmen en ongeldige stemmen is het aantal
      stemmen dat is geteld.

      4 Het eerste lid, onderdeel a, is niet van toepassing als er een centrale stemopneming plaatsvindt.

      5 De aantallen, bedoeld in het eerste tot en met derde lid, worden in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_6
  - number: N 7
    text: |-
      1 Blanco is de stem uitgebracht op een stembiljet dat door de kiezer is ingeleverd zonder dat hij geheel of
      gedeeltelijk een wit stipje in een stemvak rood heeft gemaakt en zonder dat hij anderszins op het stembiljet
      geschreven of getekend heeft.

      2 Ongeldig is de stem uitgebracht op een ander stembiljet dan bij of krachtens deze wet mag worden gebruikt.

      3 Voorts is ongeldig de stem die niet als blanco wordt aangemerkt, maar waarbij de kiezer op het stembiljet
      niet, door het geheel of gedeeltelijk rood maken van het witte stipje in een stemvak, op ondubbelzinnige wijze
      heeft kenbaar gemaakt op welke kandidaat hij zijn stem uitbrengt, of waarbij op het stembiljet bijvoegingen zijn
      geplaatst waardoor de kiezer kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_7
  - number: N 8
    text: |-
      1 Het stembureau beslist met inachtneming van [artikel N 7][ref1] over de geldigheid van de stem.

      2 De voorzitter stelt de aanwezige personen onmiddellijk in kennis van de reden van ongeldigverklaring en van
      twijfel over de geldigheid, alsmede de beslissing daaromtrent.

      3 Indien een van de aanwezige personen dit verlangt, moet het stembiljet worden getoond. De aanwezige personen
      kunnen mondeling bezwaren tegen de genomen beslissing inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_8
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_7
        hoofdstuk: N
        paragraaf: '1'
        afdeling: II
  - number: N 8a
    text: |-
      1 Het stembureau stelt vast het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het aantal
      stemmen dat is geteld. Voor zover mogelijk geeft het stembureau hiervoor een verklaring.

      2 Onmiddellijk nadat de stemmen zijn opgenomen, stelt de voorzitter de aanwezige personen in kennis van die
      aantallen en de aantallen bedoeld in [artikel N 6][ref1].

      3 Door de aanwezige personen kunnen mondeling bezwaren worden ingebracht. De bezwaren, alsmede de reactie van het
      stembureau daarop, worden in het proces-verbaal van de zitting van het stembureau vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_6
