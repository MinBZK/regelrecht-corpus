  - number: E 21
    text: |-
      1 Voor het houden van de zittingen van het centraal stembureau, bedoeld in de [artikelen E 17][ref1] en
      [E 19][ref2], wijzen burgemeester en wethouders een geschikte ruimte aan.

      2 Voor het houden van de zittingen van het centraal stembureau voor de verkiezing van de leden van het algemeen
      bestuur wijst het dagelijks bestuur een geschikte ruimte aan.


