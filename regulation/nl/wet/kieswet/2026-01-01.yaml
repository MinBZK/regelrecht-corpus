  - number: E 14
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de samenstelling en werkwijze van het
      hoofdstembureau en het nationaal briefstembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_14
  - number: E 15
    text: Er is voor de verkiezing van elk vertegenwoordigend orgaan een centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_15
  - number: E 16
    text: |-
      Voor de verkiezing van de leden van de Tweede Kamer der Staten-Generaal treedt de Kiesraad als centraal stembureau
      op.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_16
  - number: E 17
    text: |-
      1 Voor de verkiezing van de leden van provinciale staten is het centraal stembureau gevestigd in de gemeente waar
      de vergadering van de staten wordt gehouden.

      2 Het centraal stembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 Voorzitter is de burgemeester van de gemeente waar het centraal stembureau is gevestigd. De plaatsvervangend
      voorzitter en de andere leden, alsmede ten minste drie plaatsvervangende leden, worden benoemd en ontslagen door
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_17
  - number: E 18
    text: |-
      1 Voor de verkiezing van de leden van het algemeen bestuur is het centraal stembureau gevestigd in een gemeente
      binnen het waterschap, daartoe aangewezen door het vertegenwoordigend orgaan van het waterschap.

      2 Het centraal stembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.

      3 De voorzitter van het waterschap is voorzitter van het centraal stembureau. De plaatsvervangend voorzitter en
      de andere leden, alsmede ten minste drie plaatsvervangende leden, worden benoemd en ontslagen door het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_18
  - number: E 19
    text: |-
      1 Voor de verkiezing van de leden van de gemeenteraad bestaat het centraal stembureau uit drie of vijf leden, van
      wie er één voorzitter en één plaatsvervangend voorzitter is.

      2 De burgemeester is voorzitter van het centraal stembureau. De plaatsvervangend voorzitter en de andere leden,
      alsmede ten minste drie plaatsvervangende leden, worden benoemd en ontslagen door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_19
  - number: E 20
    text: |-
      1 Als lid of plaatsvervangend lid van het centraal stembureau, niet zijnde de Kiesraad, kan worden
      benoemd degene die de leeftijd van achttien jaar heeft bereikt, met uitzondering van degene, bedoeld in
      [artikel E 4, tweede lid, onderdelen a en c tot en met e][ref1].

      2 De in de [artikelen E 17][ref2], [E 18][ref3] en [E 19][ref4] bedoelde benoemingen geschieden voor vier
      kalenderjaren. Degene die ter vervulling van een opengevallen plaats is benoemd, treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou hebben moeten aftreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
