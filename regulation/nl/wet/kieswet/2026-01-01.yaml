  - number: Yb 9a
    text: |-
      1 Indien burgemeester en wethouders voor een of meer stembureaus een stemlokaal hebben aangewezen als bedoeld
      in [Yb 9, tweede lid][ref1], benoemen zij tijdig voor elke verkiezing een of meer personen die als waarnemer
      getuige zijn van het verloop van de zitting bij deze stembureaus. Een waarnemer krijgt geen instructies betreffende
      de wijze waarop hij inhoud dient te geven aan zijn functie. [Artikel E 4, tweede en derde lid][ref2], is van
      overeenkomstige toepassing.

      2 Onverminderd [artikel E 4, tweede lid][ref3], kan degene die tot lid of plaatsvervangend lid van een stembureau
      is benoemd niet als waarnemer worden benoemd.

      3 Een waarnemer is bevoegd in het stemlokaal te vertoeven gedurende de tijd dat het stembureau in een stemlokaal
      zitting houdt.

      4 Onverminderd [artikel J 35, tweede lid][ref4], kan een waarnemer mondeling bezwaar indienen bij het stembureau.
      Artikel J 35, derde lid, is van overeenkomstige toepassing.

      5 Een waarnemer brengt uiterlijk op de dag na de dag van de stemming om twaalf uur ’s middags aan de burgemeester
      verslag uit van zijn bevindingen betreffende het verloop van de stemming. Bij ministeriële regeling wordt voor het
      verslag een model vastgesteld.

      6 De [artikelen Na 33, eerste lid][ref5], [Na 34, eerste lid][ref6], [Na 35, eerste lid][ref7] en
      [P 24, eerste lid][ref8], zijn van overeenkomstige toepassing op het verslag bedoeld in het vijfde lid.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent waarneming bij een stembureau dat gevestigd
      is in een stemlokaal als bedoeld in [artikel Yb 9, tweede lid][ref9].


