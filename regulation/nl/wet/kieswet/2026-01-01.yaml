  - number: P 1e
    text: |-
      1 Indien naar aanleiding van de controle, bedoeld in [artikel P 1d][ref1], het vermoeden bestaat dat een
      gemeentelijk stembureau een of meer fouten heeft gemaakt bij de stemopneming of de vaststelling van de uitkomst van
      de stemming, draagt de voorzitter van het centraal stembureau het gemeentelijk stembureau op de vermeende fouten
      nader te onderzoeken en daartoe, zo nodig, over te gaan tot een nieuwe opneming van de stembescheiden, dan wel een
      deel daarvan, ten aanzien van een of meer stembureaus.

      2 Het gemeentelijk stembureau verricht zijn werkzaamheden in een openbare zitting. Dag en uur van de zitting
      alsmede de locatie worden door de burgemeester vastgesteld en tijdig bekendgemaakt.

      3 Een nieuwe opneming van stembescheiden vindt plaats met inachtneming van hetgeen bij of krachtens de wet
      is bepaald ten aanzien van het gemeentelijk stembureau, met dien verstande dat [artikel Na 14][ref2] van
      overeenkomstige toepassing is op het proces-verbaal van het gemeentelijk stembureau.

      4 Het gemeentelijk stembureau brengt de inhoud van het met de programmatuur gegenereerde digitale bestand met de
      uitkomst van de stemming in een gemeente in overeenstemming met zijn proces-verbaal en, indien van toepassing, de
      processen-verbaal van de stembureaus met inachtneming van de correcties zoals deze in de corrigenda zijn opgenomen.

      5 Indien er een gecombineerde stemming als bedoeld in [artikel J 6][ref3] of [J 6a][ref4] van de Kieswet heeft
      plaatsgevonden, stelt het centraal stembureau het centraal stembureau voor de andere verkiezing onverwijld in
      kennis van een beslissing als bedoeld in het eerste lid.

      6 Omtrent het nader onderzoek door het gemeentelijk stembureau kunnen bij of krachtens algemene maatregel van
      bestuur nadere regels worden gesteld.

      7 Bij regeling van de Kiesraad wordt voor het corrigendum bij het proces-verbaal van het gemeentelijk stembureau
      een model vastgesteld. Het door de Kiesraad vastgestelde model behoeft de goedkeuring van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_1d
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_14
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6a
