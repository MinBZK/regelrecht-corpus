        artikel: Na_32
        hoofdstuk: Na
        paragraaf: '4'
        afdeling: II
  - number: P 1d
    text: |-
      1 Het centraal stembureau controleert de uitkomsten in de processen-verbaal van de gemeentelijk stembureaus.

      2 Indien burgemeester en wethouders niet hebben besloten dat bij de verkiezing een centrale stemopneming
      plaatsvindt als bedoeld in [artikel N 1][ref1], controleert het centraal stembureau tevens de uitkomsten in de
      processen-verbaal van de binnen die gemeente gelegen stembureaus.

      3 Het centraal stembureau maakt voor de controles, bedoeld in het eerste en tweede lid, gebruik van een door de
      Kiesraad op te stellen controle-protocol. De Kiesraad maakt dit controle-protocol voor een verkiezing uiterlijk op
      de dag van de kandidaatstelling in de Staatscourant bekend.

      4 Het centraal stembureau controleert voorts de juistheid van de uitkomsten in de processen-verbaal het
      digitale bestand, bedoeld in [artikel Na 32, derde lid][ref2], naar aanleiding van meldingen, bedoeld in
      [artikel P 1b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_32
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_1b
