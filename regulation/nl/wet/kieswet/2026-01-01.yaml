  - number: Ea 5
    text: |-
      1 Voordat de Kiesraad uitslagprogrammatuur bij een verkiezing ter beschikking stelt, is door een door de Kiesraad
      aan te wijzen deskundige en onafhankelijke instantie getoetst dat:

      a. de uitslagprogrammatuur voldoet aan de vereisten, bedoeld in
      [artikel Ea 3, vijfde en zesde lid en het zevende lid van dat artikel, aanhef en onder b][ref1],

      b. de in [artikel Ea 2, derde lid][ref2], bedoelde centrale voorzieningen en maatregelen van de
      Kiesraad voldoen aan de bij of krachtens algemene maatregel van bestuur te stellen regels, bedoeld in
      [artikel Ea 3, zevende lid, aanhef en onder c][ref3], en

      c. de aansluitvoorschriften en de gebruiksvoorschriften voldoen aan het vereiste, gesteld in
      [artikel Ea 4, tweede lid][ref4], en de bij of krachtens algemene maatregel van bestuur te stellen regels, bedoeld
      in artikel Ea 4, vierde lid.

      2 Indien de Kiesraad na het afronden van de toets, bedoeld in het eerste lid, wijzigingen van ondergeschikte
      aard aanbrengt in de uitslagprogrammatuur, de centrale voorzieningen en maatregelen van de Kiesraad, de
      aansluitvoorschriften of de gebruiksvoorschriften, behoeft geen hernieuwde toets plaats te vinden voordat hij de
      uitslagprogrammatuur aan de gebruiker ter beschikking stelt, mits deze wijzigingen in ieder geval geen betrekking
      hebben op:

      a. de wijze waarop in de uitslagprogrammatuur [hoofdstuk P][ref5] wordt toegepast om de zetels aan de lijsten en
      aan de kandidaten toe te wijzen;

      b. onderdelen die de beveiliging van de uitslagprogrammatuur ten doel hebben.

      3 Indien naar aanleiding van een aanbeveling uit de toets, bedoeld in het eerste lid, een niet-ondergeschikte
      wijziging in de uitslagprogrammatuur, de centrale voorzieningen en maatregelen, de aansluitvoorschriften of
      de gebruiksvoorschriften wordt doorgevoerd, wordt het onderdeel waarop de wijziging van toepassing is nogmaals
      getoetst door de instantie, bedoeld in het eerste lid.

      4 De Kiesraad maakt op een algemeen toegankelijke wijze elektronisch openbaar:

      a. de uitkomst van de toets, bedoeld in het eerste en derde lid, en

      b. indien van toepassing, gegevens met betrekking tot ondergeschikte wijzigingen als bedoeld in het tweede lid.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de openbaarmaking, bedoeld in het vierde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_3
