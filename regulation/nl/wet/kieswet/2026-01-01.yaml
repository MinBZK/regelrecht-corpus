  - number: O 4
    text: |-
      Op de vijfde dag na de dag van de stemming houdt het hoofdstembureau om tien uur een zitting om de uitkomst van de
      stemming bij de stembureaus op kieskringniveau vast te stellen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_4
  - number: O 5
    text: |-
      1 Het hoofdstembureau stelt ten aanzien van iedere lijst vast het aantal op iedere kandidaat uitgebrachte stemmen
      en de som van deze aantallen. Deze som wordt stemcijfer genoemd.

      2 Het hoofdstembureau stelt tevens vast:

      a. het aantal blanco stemmen;

      b. het aantal ongeldige stemmen;

      c. het aantal geldige stempassen;

      d. het aantal geldige kiezerspassen;

      e. het aantal geldige volmachtbewijzen;

      f. de som van de aantallen bedoeld onder c, d en e; en

      g. het aantal kiesgerechtigden.

      3 Voorts stelt het hoofdstembureau het verschil vast tussen het aantal kiezers dat tot de stemming is toegelaten en
      het aantal stemmen dat is geteld. Voor zover mogelijk geeft het hoofdstembureau hiervoor een verklaring.

      4 De aantallen, bedoeld in het eerste tot en met derde lid, worden in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_5
  - number: O 5a
    text: |-
      1 Het hoofdstembureau voert onder vermelding van het nummer van het stembureau in ieder geval de aantallen, bedoeld
      in [artikel O 5, eerste tot en met derde lid][ref1], uit het proces-verbaal in de programmatuur in.

      2 De invoer, bedoeld in het eerste lid:

      a. wordt afzonderlijk van elkaar, door twee leden van het hoofdstembureau of ondersteuners gedaan; en

      b. geschiedt tenminste éénmaal handmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_5
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_5a
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: O_5
        hoofdstuk: O
        paragraaf: '1'
        afdeling: II
  - number: O 6
    text: |-
      1 Het hoofdstembureau controleert de met de programmatuur gegenereerde uitkomst van de stemming op kieskringniveau
      aan de hand van een door de Kiesraad op te stellen controleprotocol. Indien het hoofdstembureau tot het oordeel
      komt dat de programmatuur niet betrouwbaar heeft gefunctioneerd en het gebrek na onderzoek niet hersteld kan
      worden, laat het de met de programmatuur gegenereerde uitkomst buiten beschouwing en stelt het de Kiesraad
      onverwijld van dit oordeel in kennis.

      2 De uitkomst van de controle, bedoeld in het eerste lid, wordt in het proces-verbaal van het hoofdstembureau
      vermeld.

      3 De Kiesraad maakt het controleprotocol, bedoeld in het eerste lid, voor een verkiezing uiterlijk op de dag van de
      kandidaatstelling in de Staatscourant bekend.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_6
  - number: O 7
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan onmiddellijk proces-verbaal opgemaakt.

      2 Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau getekend.

      3 Bij regeling van de Kiesraad wordt voor het proces-verbaal een model vastgesteld. Het door de Kiesraad
      vastgestelde model behoeft de goedkeuring van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_7
  - number: O 8
    text: |-
      1 Het proces-verbaal van het hoofdstembureau wordt, met weglating van de ondertekening, onverwijld op een algemeen
      toegankelijke wijze elektronisch openbaargemaakt.

      2 Het met de programmatuur gegenereerde digitale bestand met de uitkomst van de stemming in een kieskring wordt
      eveneens onverwijld op een algemeen toegankelijke wijze elektronisch openbaar gemaakt.

      3 De openbaarmaking geschiedt ten minste tot drie maanden nadat over de toelating van de gekozenen is beslist.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de elektronische
      openbaarmaking van het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_8
  - number: O 9
    text: |-
      1 In het gemeentehuis van de gemeente waar het hoofdstembureau is gevestigd wordt onverwijld een afschrift van het
      proces-verbaal van het hoofdstembureau voor eenieder ter inzage gelegd totdat over de toelating van de gekozenen
      is beslist.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de terinzagelegging van
      het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_9
  - number: O 10
    text: |-
      1 Het proces-verbaal van het hoofdstembureau en de processen-verbaal van de gemeentelijk stembureaus worden
      onverwijld overgebracht naar het centraal stembureau. Indien het hoofdstembureau processen-verbaal van stembureaus
      en corrigenda heeft ontvangen, worden deze daarbij eveneens overgebracht.

      2 Het met de programmatuur gegenereerde digitale bestand met de uitkomst van de stemming in een kieskring wordt
      eveneens onverwijld aan het centraal stembureau verstrekt.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de overdracht van de
      processen-verbaal en corrigenda en de verstrekking van het digitale bestand.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_10
  - number: O 11
    text: |-
      1 Indien het betreft de verkiezing van de leden van de staten in een provincie die in meerdere kieskringen is
      verdeeld, verstrekt de burgemeester van de gemeente waarin het hoofdstembureau is gevestigd zo spoedig mogelijk
      nadat over de toelating van de gekozenen is beslist het bestand met de uitkomst van de stemming op kieskringniveau
      aan de Kiesraad.

      2 Indien het hoofdstembureau geen programmatuur heeft gebruikt ten behoeve van de vaststelling van de uitkomst van
      de stemming, verstrekt de burgemeester in plaats van het digitale bestand, bedoeld in het eerste lid, een afschrift
      van het proces-verbaal van het hoofdstembureau aan de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_11
  - number: O 12
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de vaststelling van de verkiezingsuitslag.**
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_12
  - number: O 13
    text: |-
      Onverwijld nadat het nationaal briefstembureau de processen-verbaal van een briefstembureau heeft ontvangen, gaat
      het over tot het verrichten van de werkzaamheden, bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_13
  - number: O 14
    text: |-
      Het nationaal briefstembureau controleert de juistheid van de uitkomst van de stemming zoals vastgesteld door het
      briefstembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelO_14
  - number: O 15
    text: |-
      1 Naar aanleiding van de controle, bedoeld in [artikel O 14][ref1], draagt het nationaal briefstembureau een
      briefstembureau op over te gaan tot een nieuwe opneming van de stembescheiden, dan wel een deel daarvan, indien:

      a. het briefstembureau in zijn proces-verbaal melding heeft gemaakt van een verschil tussen het aantal tot de
      stemming toegelaten kiezers en het aantal uitgebrachte stemmen, en het briefstembureau dit verschil niet heeft
      verklaard;

      b. het vermoedt dat het briefstembureau een of meer fouten heeft gemaakt bij de stemopneming; of

      c. het briefstembureau een of meer fouten heeft gemaakt bij de vaststelling van de uitkomst van de stemming.

      2 Het nationaal briefstembureau vermeldt in zijn proces-verbaal welk briefstembureau een nieuwe opneming van
      stembescheiden heeft uitgevoerd alsmede welke opdracht het daarbij heeft gekregen.

      3 Het briefstembureau verricht zijn werkzaamheden zo spoedig mogelijk in een openbare zitting. Dag en uur van de
      zitting alsmede de locatie worden door de burgemeester dan wel de vertegenwoordiger van Nederland in Aruba, Curaçao
      of Sint Maarten vastgesteld en zo spoedig mogelijk bekendgemaakt. De wijze van bekendmaking wordt geregeld bij
      algemene maatregel van bestuur.

      4 De burgemeester dan wel de vertegenwoordiger van Nederland in Aruba, Curaçao of Sint Maarten brengt de
      transportbox en de enveloppe, bedoeld in [artikel N 30][ref2], onverwijld over naar de locatie waar het
      briefstembureau zitting houdt. Het nationaal briefstembureau dan wel de burgemeester dan wel de vertegenwoordiger
      brengt de processen-verbaal van het briefstembureau onverwijld over naar deze locatie.

      5 Een nieuwe opneming van stembescheiden vindt plaats met inachtneming van hetgeen bij of krachtens de wet is
      bepaald ten aanzien van het briefstembureau, met dien verstande dat [artikel Na 14][ref3] van overeenkomstige
      toepassing is.

      6 Bij ministeriële regeling wordt voor het proces-verbaal van de openbare zitting, bedoeld in het derde lid, een
      model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_14
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_30
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelNa_14
