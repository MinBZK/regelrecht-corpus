  - number: N 26
    text: |-
      1 Het briefstembureau beslist over de geldigheid van de stem.

      2 Een stem is geldig die op een kandidaat of blanco is uitgebracht, met een stembiljet dat bij of krachtens deze
      wet mag worden gebruikt en waarop geen bijvoegingen zijn geplaatst waardoor de kiezer kan worden geïdentificeerd.

      3 Een stem is op een kandidaat uitgebracht indien dat op ondubbelzinnige wijze kenbaar is gemaakt door het geheel
      of gedeeltelijk inkleuren van zowel het stemvakje, geplaatst vóór een lijst, als het stemvakje, geplaatst vóór het
      nummer van een kandidaat op die lijst.

      4 Onverminderd het derde lid is een stem op de eerste kandidaat van een lijst uitgebracht indien:

      a. de kiezer op ondubbelzinnige wijze kenbaar maakt dat de kandidaat van zijn keuze op die lijst staat door het
      geheel of gedeeltelijk inkleuren van het stemvakje, geplaatst vóór een lijst, en er geen stemvakje geplaatst vóór
      een kandidaatsnummer, geheel of gedeeltelijk is ingekleurd;

      b. ondubbelzinnig blijkt dat de kiezer niet met bijschrijvingen op een andere kandidaat heeft willen stemmen.

      5 Een stem is blanco uitgebracht indien dat op ondubbelzinnige wijze is kenbaar gemaakt doordat op het stembiljet
      geen stemvakje is ingekleurd.

      6 De voorzitter van het briefstembureau doet onmiddellijk mededeling van de reden van ongeldigverklaring en van
      twijfel over de geldigheid, alsmede de beslissing daaromtrent, aan de aanwezige personen.

      7 Indien een van de aanwezige personen dit verlangt, wordt het stembiljet getoond. De aanwezige personen kunnen
      mondeling bezwaren tegen de genomen beslissing inbrengen.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_26
  - number: N 27
    text: |-
      1 Het briefstembureau stelt vast het verschil tussen het aantal kiezers dat tot de stemming is toegelaten en het
      aantal stemmen dat is geteld. Voor zover mogelijk geeft het briefstembureau hiervoor een verklaring.

      2 De voorzitter van het briefstembureau stelt de aanwezige personen in kennis van die aantallen, alsmede de
      aantallen bedoeld in [artikel N 25][ref1], doch niet eerder dan nadat de stemming bij alle stembureaus in Nederland
      is beëindigd. Tot die tijd is eenieder die ambtshalve kennis kan nemen van de vastgestelde aantallen, verplicht tot
      geheimhouding daarvan.

      3 De aanwezige personen kunnen mondeling bezwaren inbrengen. De bezwaren, alsmede de reactie van het
      briefstembureau daarop, worden in het proces-verbaal van de zitting van het briefstembureau vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_25
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelN_27
