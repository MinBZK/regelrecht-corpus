        artikel: E_4
        hoofdstuk: E
        paragraaf: '2'
        afdeling: II
  - number: E 13
    text: |-
      1 Burgemeester en wethouders van ’s-Gravenhage stellen voor elke verkiezing van de leden van de Tweede Kamer een
      nationaal briefstembureau in.

      2 Het nationaal briefstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend
      voorzitter is.

      3 De voorzitter, plaatsvervangend voorzitter en de andere leden, alsmede ten minste drie plaatsvervangende leden,
      worden tijdig voor de verkiezing benoemd door burgemeester en wethouders.

      4 [Artikel E 4, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat in
      het tweede lid in plaats van onderdeel b wordt gelezen: die lid of plaatsvervangend lid is van het briefstembureau
      of centraal stembureau voor de desbetreffende verkiezing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
