  - number: Ya 3b
    text: |-
      1 In afwijking van [artikel Ea 7, eerste lid][ref1], stellen de Kiesraad en het bestuurscollege in onderling
      overleg vast of het stembureau van het openbaar lichaam en het centraal stembureau bij de vaststelling, bedoeld
      in de [artikelen Na 26a][ref2] en [P 20a][ref3], gebruik maken van de door de Kiesraad ter beschikking te stellen
      uitslagprogrammatuur.

      2 Indien het stembureau van het openbaar lichaam en het centraal stembureau bij de vaststelling, bedoeld in het
      eerste lid, geen gebruik maken van de uitslagprogrammatuur, zijn [hoofdstuk Ea][ref4] en de artikelen uit de
      [hoofdstukken O][ref5] en [P][ref6] die zien op het gebruik van de uitslagprogrammatuur niet van toepassing.


