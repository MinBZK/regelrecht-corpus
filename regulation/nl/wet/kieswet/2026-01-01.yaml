  - number: M 7a
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het stemmen per brief,
      onder meer over:

      a. de gegevens en bescheiden waaruit een verzoek bestaat, het indienen van een verzoek, de beslissing op een
      verzoek en de verstrekking van formulieren, bedoeld in [artikel M 3][ref1];

      b. de toezending en retourzending van stembescheiden; en

      c. de gegevens die het register van briefstembewijzen, alsmede de uittreksels, bedoeld in [artikel M 5][ref2],
      bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_3
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_5
