  - number: Na 22
    text: |-
      1 Het gemeentelijk stembureau stelt voor iedere lijst vast het verschil tussen de door hem vastgestelde som van het
      aantal op de kandidaten uitgebrachte stemmen en de som van het aantal op de kandidaten uitgebrachte stemmen zoals
      vastgesteld door het stembureau.

      2 Het gemeentelijk stembureau stelt vast het verschil tussen het aantal kiezers dat tot de stemming is toegelaten
      en het aantal stemmen dat is geteld.

      3 Voor zover mogelijk geeft het gemeentelijk stembureau voor de verschillen een verklaring.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelNa_22
  - number: Na 23
    text: |-
      Het gemeentelijk stembureau stelt de aanwezige personen in kennis van de aantallen, bedoeld in de artikelen
      N 1a, eerste lid, [Na 18, eerste tot en met derde lid][ref1], [Na 20, eerste en tweede lid][ref2], en
