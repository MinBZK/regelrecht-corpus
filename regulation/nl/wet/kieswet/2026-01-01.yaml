  - number: E 9
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de samenstelling en werkwijze van het
      gemeentelijk stembureau.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_9
  - number: E 10
    text: |-
      1 Voor elke verkiezing van de leden van de Tweede Kamer wordt door burgemeester en wethouders van de gemeente,
      daartoe aangewezen in de tabel behorend bij [artikel E 1, eerste lid][ref1], een hoofdstembureau ingesteld.

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_10
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: E_1
        hoofdstuk: E
        paragraaf: '1'
        afdeling: II
  - number: E 11
    text: |-
      1 Voor elke verkiezing van de leden van provinciale staten in een provincie die in meerdere kieskringen is
      verdeeld, wordt door burgemeester en wethouders van de gemeente, daartoe aangewezen door provinciale staten, een
      hoofdstembureau ingesteld.

      2 Het hoofdstembureau bestaat uit vijf leden, van wie er één voorzitter en één plaatsvervangend voorzitter is.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_11
  - number: E 12
    text: |-
      1 De voorzitter, plaatsvervangend voorzitter en de andere leden van het hoofdstembureau, alsmede ten minste drie
      plaatsvervangende leden, worden tijdig voor elke verkiezing door burgemeester en wethouders benoemd.

      2 Als lid of plaatsvervangend lid van het hoofdstembureau kan worden benoemd degene die op de dag van de stemming
      de leeftijd van achttien jaar heeft bereikt, met uitzondering van degene:

      a. die op de dag van de kandidaatstelling bij onherroepelijke rechterlijke uitspraak van het kiesrecht is ontzet;

      b. die lid of plaatsvervangend lid is van het stembureau, gemeentelijk stembureau of centraal stembureau voor de
      desbetreffende verkiezing;

      c. die als lid van een hoofdstembureau bij een vorige verkiezing heeft gehandeld of een handeling heeft nagelaten
      in strijd met het bij of krachtens deze wet bepaalde;

      d. die zich kandidaat heeft gesteld voor de desbetreffende verkiezing;

      e. die gekozen lid is van het vertegenwoordigend orgaan waarvoor de verkiezing wordt gehouden.

      3 [Artikel E 4, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelE_12
    references:
