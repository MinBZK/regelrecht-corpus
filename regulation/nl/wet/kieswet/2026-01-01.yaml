  - number: W 3
    text: |-
      Indien bij de toepassing van de bepalingen van dit hoofdstuk geen kandidaat meer voor benoeming in aanmerking
      komt op de lijst waarop degene is gekozen die moet worden opgevolgd, en deze lijst tezamen met één of meer
      andere lijsten een lijstengroep vormt, gaat de zetel door toepassing van [artikel P 13][ref1], onderscheidenlijk
      [artikel U 13][ref2], over op één van die andere lijsten. De kandidaat van deze lijst die naar de volgorde,
      vastgesteld overeenkomstig [artikel P 19][ref3], onderscheidenlijk [artikel U 15][ref4], voor benoeming in
      aanmerking komt, wordt benoemd verklaard. Komt ook op deze lijst geen kandidaat meer voor benoeming in aanmerking,
      dan wordt de plaats aan een andere van de groep deel uitmakende lijst toegekend door verdere toepassing van het in
      dit lid bepaalde, en zo vervolgens.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_13
