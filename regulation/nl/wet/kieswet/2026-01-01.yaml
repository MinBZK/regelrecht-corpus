  - number: I 19
    text: |-
      Het centraal stembureau vernietigt de ingeleverde kandidatenlijsten alsmede de daarbij horende stukken, met
      uitzondering van de overgelegde verklaringen van instemming, na de vaststelling van de uitslag. Van de vernietiging
      wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_19
  - number: I 20
    text: |-
      De artikelen 15, 16 en 18 van de Algemene verordening gegevensbescherming zijn niet van toepassing op verwerking
      van persoonsgegevens door het centraal stembureau bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_20
  - number: J 1
    text: |-
      1 De stemming vindt plaats op de vierenveertigste dag na de kandidaatstelling. Indien toepassing is gegeven aan
      [artikel F 1, derde lid][ref1], kan bij het koninklijk besluit, bedoeld in dat artikel, de dag van de stemming
      worden vastgesteld op een dag na de vierenveertigste dag na de kandidaatstelling, met dien verstande dat de dag
      van de stemming met niet meer dagen wordt verplaatst dan het aantal dagen waarmee de dag van kandidaatstelling
      is vervroegd.

      2 De stemming vangt aan om zeven uur dertig en duurt tot eenentwintig uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelF_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelJ_1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: F_1
        hoofdstuk: F
        afdeling: II
  - number: J 1a
    text: |-
      1 Burgemeester en wethouders kunnen voor stembureaus waar dat wenselijk is met het oog op de plaats waar de bureaus
      zitting houden bepalen dat de stemming bij deze stembureaus aanvangt op een eerder of een later tijdstip dan zeven
      uur dertig en eindigt op een eerder tijdstip dan eenentwintig uur. De burgemeester doet van deze tijdstippen ten
      minste veertien dagen voor de stemming mededeling in het gemeenteblad.

      2 Een stembureau als bedoeld in het eerste lid is op de dag van de stemming ten minste acht uur aaneengesloten
      geopend.

      3 De stemopneming van de stembureaus, bedoeld in het eerste lid, vindt plaats op een door burgemeester en
      wethouders vast te stellen en bekend te maken plaats en tijdstip, doch niet voor eenentwintig uur. De plaats en het
      tijdstip van de stemopneming worden bekendgemaakt in de mededeling, bedoeld in het eerste lid.

      4 Indien een stembureau als bedoeld in het eerste lid niet onmiddellijk na de stemming met de stemopneming
      aanvangt, vermeldt het in zijn proces-verbaal het aantal bedoeld in [artikel J 25, negende lid][ref1], alsook de
      aantallen bedoeld in de [artikelen K 11, tweede lid][ref2], en [L 17, derde lid][ref3], in samenhang met artikel
      J 25, negende lid.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het derde en
      vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_11
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_17
