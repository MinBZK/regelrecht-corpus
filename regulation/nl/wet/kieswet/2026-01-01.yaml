  - number: Ea 4
    text: |-
      1 De Kiesraad stelt met het oog op de betrouwbare werking en de beveiliging van de uitslagprogrammatuur voor elke
      verkiezing bij regeling vast:

      a. aansluitvoorschriften inzake de decentrale voorzieningen en maatregelen als bedoeld in
      [artikel Ea 6, eerste lid][ref1], voor het gebruik van de uitslagprogrammatuur;

      b. gebruiksvoorschriften inzake het gebruik van de uitslagprogrammatuur.

      2 De aansluitvoorschriften en gebruiksvoorschriften dragen bij aan het veilig en betrouwbaar gebruik van de
      uitslagprogrammatuur.

      3 Voorafgaand aan de vaststelling van de aansluitvoorschriften en gebruiksvoorschriften worden een instantie
      die representatief kan worden geacht voor de colleges van burgemeester en wethouders en een instantie die
      representatief kan worden geacht voor de dagelijks besturen geconsulteerd.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de onderwerpen waarop de aansluitvoorschriften
      en gebruiksvoorschriften betrekking kunnen hebben en het moment van vaststelling van de aansluitvoorschriften en
      gebruiksvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelEa_6
