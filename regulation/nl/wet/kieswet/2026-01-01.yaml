      2 De openbare zitting van het nationaal briefstembureau als bedoeld in artikel O 38, eerste lid, vindt niet eerder
      plaats dan nadat de stembussen in de lidstaat waar de kiezers het laatst hun stem uitbrengen tijdens de in de Akte
      bedoelde stemmingsperiode zijn gesloten.


