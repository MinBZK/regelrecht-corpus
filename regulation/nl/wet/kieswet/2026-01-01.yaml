        afdeling: II
  - number: Y 25
    text: |-
      1 De Tweede Kamer onderzoekt zo spoedig mogelijk of de benoemde op grond van de nationale bepalingen als lid van
      het Europees Parlement kan worden toegelaten.

      2 De [artikelen V 1 tot en met V 4a][ref1] en [V 5 tot en met V 10][ref2] zijn daarbij van overeenkomstige
      toepassing, met dien verstande dat waar in deze artikelen sprake is van het vertegenwoordigend orgaan of het orgaan
      waarvoor de benoeming is geschied, daarvoor de Tweede Kamer in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_5
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_25
