  - number: D 7
    text: |-
      1 Op een aanvraag als bedoeld in dit hoofdstuk of ter uitoefening van het recht op rectificatie, bedoeld in artikel
      16 van de Algemene verordening gegevensbescherming, ten aanzien van een registratie als bedoeld in artikel D 1 of D
      2, wordt uiterlijk op een bij algemene maatregel van bestuur te bepalen moment beslist.

      2 Ambtshalve wijzigingen als bedoeld in [artikel D 6][ref1] worden gelijkgesteld met een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_6
