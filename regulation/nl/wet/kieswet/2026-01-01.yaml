        paragraaf: '1'
        afdeling: IV
  - number: Y 26
    text: |-
      De voorzitter van de Tweede Kamer geeft van de uitkomst van het onderzoek onverwijld kennis aan de voorzitter van
      het Europees Parlement en aan de benoemde. Indien de Tweede Kamer heeft besloten dat de benoemde op grond van de
      nationale bepalingen als lid van het Europees Parlement kan worden toegelaten, zendt de voorzitter van de Tweede
      Kamer aan de voorzitter van het Europees Parlement tevens de geloofsbrief van de benoemde toe.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_26
  - number: Y 27
    text: |-
      Wanneer, anders dan bij de vaststelling van de uitslag van een verkiezing, in een opengevallen plaats moet worden
      voorzien, geschiedt dit met overeenkomstige toepassing van [hoofdstuk W][ref1], met dien verstande dat voor de
      toepassing van [artikel W 1, derde lid][ref2], voor «25% van de kiesdeler» wordt gelezen: 10% van de kiesdeler.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#HoofdstukW
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelW_1
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_27
    references:
