  - number: Y 35a
    text: |-
      Het centraal stembureau schrapt van de lijst de kandidaat van wie de verklaring, bedoeld in
      [artikel Y 35, eerste lid][ref1], niet is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelY_35
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelY_35a
    references:
