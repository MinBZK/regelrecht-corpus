        bwb_id: BWBR0004627
        artikel: I_14
        hoofdstuk: I
        paragraaf: '3'
        afdeling: II
  - number: I 17
    text: |-
      1 Nadat onherroepelijk is beslist over de geldigheid van de ingeleverde lijsten maakt het centraal stembureau de
      lijsten zo spoedig mogelijk openbaar.

      2 De openbaarmaking geschiedt:

      a. indien het betreft de verkiezing van de leden van de Tweede Kamer of van provinciale staten van een provincie
      met meer dan één kieskring, door plaatsing van de lijsten naar de kieskringen gerangschikt en met vermelding van
      hun nummers en, in voorkomend geval, de aanduidingen van de politieke groeperingen in de Staatscourant; en

      b. indien het betreft de verkiezing van de leden van provinciale staten van een provincie die één kieskring vormt,
      het algemeen bestuur dan wel de gemeenteraad, door plaatsing van de lijsten met vermelding van hun nummers en,
      in voorkomend geval, de aanduidingen van de politieke groeperingen in het provinciaal blad, het waterschapsblad
      onderscheidenlijk het gemeenteblad.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelI_17
  - number: I 18
    text: |-
      1 Van de in de [artikelen I 1][ref1] en [I 4][ref2] bedoelde zittingen wordt proces-verbaal opgemaakt. Het proces-
      verbaal wordt voor eenieder ter inzage gelegd.

      2 Voorts maakt het centraal stembureau de processen-verbaal, met weglating van de ondertekening, onverwijld op een
      algemeen toegankelijke wijze elektronisch openbaar.

      3 De bij de in [artikel I 4][ref3] bedoelde zitting aanwezige personen kunnen mondeling bezwaren inbrengen. Van
      deze bezwaren, alsmede van de reactie van het centraal stembureau daarop, wordt in het proces-verbaal melding
      gemaakt.

      4 Bij algemene maatregel van bestuur worden geregeld:

      a. de plaats waar de processen-verbaal ter inzage worden gelegd;

      b. de bekendmaking van het tijdstip en de plaats van de zitting, bedoeld in [artikel I 4][ref4].

      5 Bij ministeriële regeling worden voor de processen-verbaal modellen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
