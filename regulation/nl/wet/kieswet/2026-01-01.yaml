  - number: V 11
    text: |-
      Het lidmaatschap van een tot lid van een vertegenwoordigend orgaan benoemde vangt aan zodra de beschikking omtrent
      zijn toelating aan de benoemde bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0004627/2026-01-01#ArtikelV_11
  - number: V 11a
    text: |-
      1 Het vertegenwoordigend orgaan waarvoor de verkiezing plaatsvindt, bewaart de op grond van [artikel P 24][ref1]
      aan hem overgedragen stukken drie maanden nadat over de toelating van de gekozenen is beslist. Daarna vernietigt
      het deze stukken onmiddellijk, met uitzondering van het afschrift van het proces-verbaal van het centraal
      stembureau. Van de vernietiging wordt proces-verbaal opgemaakt.

      2 Op de in [artikel V 4b][ref2] bedoelde pakken is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_24
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_4b
