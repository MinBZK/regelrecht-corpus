---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringswet_verordening_terroristische_online_inhoud
regulatory_layer: WET
publication_date: '2023-04-18'
valid_from: '2025-09-05'
bwb_id: BWBR0048064
url: https://wetten.overheid.nl/BWBR0048064/2025-09-05
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van verordening
    2021/784 van het Europees Parlement en de Raad van 29 april 2021 inzake het tegengaan van de verspreiding van
    terroristische online-inhoud (PbEU 2021, L 172);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Autoriteit:* de autoriteit, genoemd in
      [artikel 2, eerste lid][ref1];
        - *terroristische inhoud:* een of meer van de soorten materiaal als bedoeld in artikel 2, zevende lid, van de
      verordening;
        - *Onze Minister:* de Minister van Justitie en Veiligheid;
        - *verordening:* [verordening (EU) 2021/784](32684R2021) van het Europees Parlement en de Raad van 29 april 2021
      inzake het tegengaan van de verspreiding van terroristische online-inhoud (PbEU 2021, L 172).


      [ref1]: https://wetten.overheid.nl/BWBR0048064#Artikel2
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0048064
        artikel: '2'
        paragraaf: '2'
  - number: '2.1'
    text: Er is een Autoriteit Online Terroristisch en Kinderpornografisch Materiaal.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: '2.2'
    text: |-
      De Autoriteit is de bevoegde autoriteit bedoeld in artikel 12, eerste lid, onderdelen a tot en met d, van de
      verordening en heeft de taken die de verordening aan de bevoegde autoriteit toekent.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: '2.3'
    text: |-
      De Autoriteit heeft met het oog op de maatregelen bedoeld in artikel 1, eerste lid, onderdeel b, van de verordening
      tot taak:
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: 2.3.a
    text: |-
      terroristische inhoud te identificeren en het ontoegankelijk maken van online terroristische inhoud te bevorderen
      en zo nodig af te dwingen; en;
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: 2.3.b
    text: |-
      onderzoek te doen naar, en informatie te verstrekken over, de aanwezigheid van online terroristisch materiaal
      teneinde de verspreiding daarvan onder het publiek te beperken, waar mogelijk in samenwerking met private en
      publieke partijen.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: '2.4'
    text: |-
      De leden van de Autoriteit en de bij besluit van de Autoriteit aangewezen ambtenaren zijn belast met het toezicht
      op de naleving van de artikelen 3, derde en zesde lid, artikel 4, tweede en zevende lid, artikel 5, eerste, tweede,
      derde, vijfde en zesde lid, artikelen 6, 7, 10 en 11, artikel 14, vijfde lid, artikel 15, eerste lid en artikel 17
      van de verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
  - number: '2.5'
    text: |-
      De Autoriteit heeft tevens tot taak het nemen van beslissingen als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048064#Artikel16
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0048064
        artikel: '16'
        paragraaf: '4'
  - number: '3.1'
    text: De Autoriteit bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '3.2'
    text: |-
      De leden van de Autoriteit worden op voordracht van Onze Minister bij koninklijk besluit benoemd, geschorst of
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '3.3'
    text: |-
      Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de
      Autoriteit, alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '3.4'
    text: |-
      De voorzitter wordt benoemd voor een periode van vijf jaar. De overige leden worden benoemd voor een periode van
      vier jaar. De voorzitter en de overige leden kunnen worden herbenoemd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '3.5'
    text: |-
      Schorsing en ontslag van de leden van de Autoriteit vindt slechts plaats wegens ongeschiktheid of onbekwaamheid dan
      wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen en geschiedt bij koninklijk besluit.
      De voordracht voor schorsing of ontslag wordt niet gedaan dan nadat de Autoriteit daarover is gehoord.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '3.6'
    text: Ontslag van een lid van de Autoriteit vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel3
  - number: '4.1'
    text: De Autoriteit stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel4
  - number: '4.2'
    text: |-
      De Autoriteit maakt het bestuursreglement bekend in de Staatscourant na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: '5.1'
    text: |-
      De [artikelen 12][ref1], [21][ref2] en [22 van de Kaderwet zelfstandige bestuursorganen][ref3] zijn niet van
      toepassing op de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '5.2'
    text: |-
      In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] is de Autoriteit slechts
      verplicht aan Onze Minister inlichtingen te verstrekken of inzage te geven in zakelijke gegevens en bescheiden met
      betrekking tot het gevoerde financiële beheer en de administratieve organisatie. De Autoriteit verstrekt aan Onze
      Minister de gegevens, bedoeld in artikel 21, eerste lid, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '5.3'
    text: |-
      [Artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt slechts toepassing ten aanzien van het door
      de Autoriteit gevoerde financiële beheer en de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: '6.1'
    text: |-
      De Autoriteit richt een contactpunt in ter uitvoering van artikel 12, tweede lid, van de verordening en maakt de
      informatie over dit contactpunt openbaar.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel6
  - number: '6.2'
    text: |-
      De Autoriteit voorziet in passende en veilige communicatiekanalen als bedoeld in artikel 14, derde lid, van de
      verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel6
  - number: '6.3'
    text: |-
      De Autoriteit bewaart de persoonsgegevens die noodzakelijk zijn in verband met de uitvoering van zijn taken en de
      administratieve en gerechtelijke procedures, waaronder de in artikel 6, eerste lid, van de verordening bedoelde
      gegevens, niet langer dan voor die doeleinden noodzakelijk is en ieder geval niet langer dan een jaar na de laatste
      verwerking.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt in het verkeer tussen
      de Autoriteit en een aanbieder van hostingdiensten als bedoeld in artikel 2, eerste lid, van de verordening een
      bericht uitsluitend elektronisch verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '7.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het elektronische berichtenverkeer ter uitvoering
      van artikel 3, vierde en vijfde lid, van de verordening en indien van toepassing door de Commissie vastgestelde
      gedelegeerde handelingen op grond van artikel 19, eerste lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel7
  - number: '8.1'
    text: |-
      Ter bevordering van de coördinatie van te nemen maatregelen overlegt de Autoriteit over de uitoefening van zijn
      taken en bevoegdheden met de politie, het openbaar ministerie en de Algemene Inlichtingen- en Veiligheidsdienst en
      Militaire Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel8
  - number: '8.2'
    text: |-
      De Autoriteit kan persoonsgegevens of inlichtingen, verkregen bij de uitvoering van de aan hem
      krachtens deze wet opgedragen taken, aan de politie verstrekken voor zover deze persoonsgegevens
      of inlichtingen noodzakelijk zijn voor de uitoefening van diens wettelijke taak, bedoeld in
      [artikel 3 van de Politiewet 2012][ref1] en aan de Algemene Inlichtingen- en Veiligheidsdienst en Militaire
      Inlichtingen- en Veiligheidsdienst voor zover deze noodzakelijk kunnen zijn voor hun taken op grond van de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0039896
  - number: '9.1'
    text: |-
      Gelet op artikel 9, aanhef en tweede lid, onderdeel g, van de Algemene verordening
      gegevensbescherming, is het verbod om bijzondere categorieën van persoonsgegevens, als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], te verwerken niet van toepassing
      indien de verwerking geschiedt door de Autoriteit voor zover de verwerking van deze gegevens noodzakelijk is voor
      de uitoefening van zijn bevoegdheden op grond van deze [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040940
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040940
  - number: '9.2'
    text: |-
      Gelet op artikel 10 van de Algemene verordening gegevensbescherming mag
      de Autoriteit persoonsgegevens van strafrechtelijke aard, als bedoeld in
      [artikel 1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], verwerken voorzover de
      verwerking noodzakelijk is voor de uitoefening van zijn bevoegdheden op grond van deze [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040940
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040940
  - number: '10.1'
    text: |-
      De verplichtingen en rechten als bedoeld in artikel 23, eerste lid, van de Algemene verordening
      gegevensbescherming, kunnen worden beperkt indien dit noodzakelijk en evenredig is ter waarborging van een in
      artikel 23, eerste lid, onderdelen a, c, d of i, van de Algemene verordening gegevensbescherming genoemd belang.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel10
  - number: '10.2'
    text: |-
      Indien de Autoriteit gebruik maakt van de in het eerste lid bedoelde bevoegdheid, deelt hij dit voorzien van een
      dragende onderbouwing schriftelijk mee aan de betrokkene wiens rechten worden beperkt.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel10
  - number: '10.3'
    text: |-
      In afwijking van het tweede lid wordt geen mededeling gedaan aan de betrokkene indien dit afbreuk doet aan het doel
      van de beperking.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel10
  - number: '11'
    text: |-
      De Autoriteit is bevoegd tot oplegging van een last onder dwangsom ter handhaving van artikel 18, eerste lid, van
      de verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel11
  - number: '12.1'
    text: 'De Autoriteit is bevoegd tot oplegging van een bestuurlijke boete bij overtreding van:'
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
  - number: 12.1.a
    text: artikel 3, derde en zesde lid, en artikel 4, tweede en zevende lid, van de verordening;
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
  - number: 12.1.b
    text: |-
      artikel 5, eerste, tweede, derde, vijfde en zesde lid, artikelen 6, 7, 10, 11, 14, vijfde lid, artikel 15, eerste
      lid, en artikel 17 van de verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
  - number: '12.2'
    text: 'De bestuurlijke boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
  - number: 12.2.a
    text: |-
      het bedrag dat is vastgesteld voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], bij een overtreding als bedoeld in het eerste
      lid, onderdeel a;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 12.2.b
    text: |-
      het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], bij een overtreding als bedoeld in het eerste
      lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '12.3'
    text: |-
      Indien de overtreding bestaat uit het systematisch of aanhoudend overtreden van artikel 3, derde lid, van de
      verordening, bedraagt de op te leggen bestuurlijke boete ten hoogste het bedrag dat is vastgesteld voor de
      zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien dat
      meer is, ten hoogste 4% van de mondiale omzet van de onderneming onderscheidenlijk indien de overtreding door
      een ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen die van de vereniging deel
      uitmaken, in het boekjaar voorafgaande aan de beschikking waarin de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '13.1'
    text: |-
      De Autoriteit kan een beschikking tot oplegging van een bestuurlijke boete als bedoeld in
      [artikel 12, eerste lid][ref1], openbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0048064#Artikel12
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048064
        artikel: '12'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      Op de openbaarmaking is [artikel 5.1 van de Wet open overheid][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '13.3'
    text: |-
      De openbaarmaking geschiedt niet eerder dan nadat twee weken zijn verstreken na de dag waarop het besluit bekend
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
  - number: '13.4'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter uitspraak heeft gedaan of het verzoek is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '13.5'
    text: |-
      Bij de openbaarmaking wordt vermeld of tegen het besluit tot oplegging van een bestuurlijke boete een rechtsmiddel
      is ingesteld dan wel of daartoe de mogelijkheid bestaat.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
  - number: '13.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de openbaar te maken gegevens,
      waaronder de wijze waarop de openbaarmaking plaatsvindt en de mogelijke reactie van de geadresseerde in verband met
      de openbaarmaking van zijn gegevens.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel13
  - number: '14'
    text: |-
      Een aanbieder van hostingdiensten als bedoeld in artikel 2, eerste lid, van de verordening, die zijn hoofdvestiging
      in Nederland heeft of waarvan zijn wettelijke vertegenwoordiger zijn verblijf- of vestigingsplaats in Nederland
      heeft, wijst aanbieders van inhoud die verwijderd is of waartoe de toegang geblokkeerd is ten gevolge van
      specifieke maatregelen op grond van artikel 5 van de verordening, steeds op de mogelijkheid om een klacht in
      te dienen als bedoeld in artikel 10 van de verordening, en op de mogelijkheid van geschillenbeslechting door de
      Autoriteit, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048064#Artikel16
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0048064
        artikel: '16'
        paragraaf: '4'
  - number: '15'
    text: |-
      Elke aanbieder van hostingdiensten als bedoeld in artikel 2, eerste lid, van de verordening, die zijn
      hoofdvestiging in Nederland heeft of waarvan zijn wettelijke vertegenwoordiger zijn verblijf- of vestigingsplaats
      in Nederland heeft, bericht de Autoriteit over alle bij hem ingediende klachten als bedoeld in artikel 10 van de
      verordening.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel15
  - number: '16.1'
    text: |-
      Een aanbieder van inhoud als bedoeld in artikel 2, tweede lid, van de verordening, die een geschil heeft over de
      afhandeling van een klacht als bedoeld in artikel 10 van de verordening met een aanbieder van hostingdiensten als
      bedoeld in artikel 2, eerste lid, van de verordening die zijn hoofdvestiging in Nederland heeft of waarvan zijn
      wettelijke vertegenwoordiger zijn verblijf- of vestigingsplaats in Nederland heeft, kan binnen een termijn van
      zes maanden na de klachtafhandeling door de aanbieder van hostingdiensten over het geschil een klacht indienen bij
      de Autoriteit.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel16
  - number: '16.2'
    text: |-
      De Autoriteit beslist op de klacht binnen zes weken na ontvangst ervan. Deze termijn kan met zes weken worden
      verlengd als de Autoriteit om aanvullende gegevens verzoekt. Met instemming van de klager is verdere verlenging
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel16
  - number: '16.3'
    text: De beslissing van de Autoriteit is bindend.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel16
  - number: '16.4'
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      aanbieder van inhoud een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel16
  - number: '16.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gesteld ten behoeve van de
      uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel16
  - number: '21'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel21
  - number: '22'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende onderdelen
      en artikelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet verordening terroristische online-inhoud.'
    url: https://wetten.overheid.nl/BWBR0048064/2025-09-05#Artikel23
