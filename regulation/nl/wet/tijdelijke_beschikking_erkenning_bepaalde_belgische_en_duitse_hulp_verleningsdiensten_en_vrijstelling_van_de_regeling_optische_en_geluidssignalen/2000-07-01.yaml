preamble:
  text: >-
    Overwegende, dat motorvoertuigen ten dienste van hulpverleningsdiensten uit België en Duitsland in voorkomend geval
    in Nederland kunnen worden ingezet bij de ongevals- en rampenbestrijding;


    Gelet op artikel 147 van de Wegenverkeerswet 1994 en op artikel 29, eerste lid, van het RVV 1990;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0011363/2000-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als hulpverleningsdiensten als bedoeld in [artikel 29, eerste lid, van het RVV 1990][ref1], worden aangewezen
      Belgische en Duitse organisaties die taken vervullen op het gebied van de spoedseisende geneeskundige hulpverlening
      alsmede het Belgische Korps Civiele Bescherming en het Duitse Technische Hilfswerk.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0011363/2000-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
  - number: '2'
    text: |-
      Belgische en Duitse motorvoertuigen ten dienste van politie en brandweer, Belgische en Duitse ziekenauto’s
      alsmede motorvoertuigen van de in [artikel 1][ref1] bedoelde Belgische en Duitse organisaties worden vrijgesteld
      van het bepaalde in [artikel 29, eerste lid, van het RVV 1990][ref2] en de [artikelen 3][ref3], [4][ref4] en
      [5 van de Regeling optische en geluidssignalen][ref5] onder de voorwaarde dat zij optische en geluidssignalen
      voeren overeenkomstig de voor hen in hun eigen land geldende wettelijke regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011363#Artikel1
