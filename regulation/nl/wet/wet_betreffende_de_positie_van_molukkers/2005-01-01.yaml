preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is enige voorzieningen te treffen ten behoeve van de
    positie van in Nederland wonende Molukkers die niet het Nederlanderschap bezitten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Molukkers, die door de zorg van de Nederlandse regering in 1951 of 1952 in groepsverband naar Nederland zijn
      overgebracht, op het tijdstip van het in werking treden van deze wet in Nederland woonplaats of werkelijk verblijf
      hebben en niet het Nederlanderschap bezitten, worden bij de toepassing van de Nederlandse wetgeving behandeld als
      Nederlander.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel1
  - number: '1.2'
    text: Zij verkrijgen daardoor niet de staat van Nederlander.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel1
  - number: '1.3'
    text: |-
      Zij die ingevolge deze wet als Nederlander worden behandeld, gelden, indien zij daarom verzoeken, als Nederlander
      in de zin van de [Paspoortwet][ref1]. In het aan hen op zodanig verzoek te verstrekken nationaal paspoort of
      ander reisdocument wordt ingevolge [artikel 3, zesde lid, eerste volzin, van de Paspoortwet][ref2] de Nederlandse
      nationaliteit vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005212
      [ref2]: https://wetten.overheid.nl/BWBR0005212#Artikel3
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
      - id: ref2
        bwb_id: BWBR0005212
        artikel: '3'
  - number: '2'
    text: |-
      De behandeling als Nederlander komt ook toe aan het niet- Nederlandse kind van een vader of van een moeder, die
      deze behandeling geniet of, indien nog in leven, zou hebben genoten, mits dat kind op het tijdstip van het in
      werking treden van deze wet in Nederland woonplaats of werkelijk verblijf heeft.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister van Justitie kan, op een daartoe gedaan verzoek, door een aan de verzoeker af te geven verklaring de
      toepassing van deze wet uitbreiden tot andere dan de in de [artikelen 1][ref1] en [2][ref2] bedoelde Molukkers,
      welke met dezen nauwe maatschappelijke banden hebben, die zich vóór 1 oktober 1965 in Nederland hebben gevestigd en
      aldaar ten tijde van het verzoek woonplaats of werkelijk verblijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003052#Artikel2
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003052
        artikel: '2'
  - number: '3.2'
    text: |-
      Op de kinderen van Molukkers aan wie de in het voorgaande lid bedoelde verklaring is afgegeven is [artikel 2][ref1]
      van overeenkomstige toepassing, indien zij op het tijdstip van de indiening van het verzoek in Nederland woonplaats
      of werkelijk verblijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel2
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '2'
  - number: '4'
    text: |-
      Zij die ingevolge deze wet als Nederlander worden behandeld zijn uitgesloten van het kiesrecht en de
      verkiesbaarheid voor de verkiezingen van de leden van de Staten-Generaal en van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel4
  - number: '6.1'
    text: |-
