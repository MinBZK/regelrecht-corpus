  - number: '6.2'
    text: |-
      Het niet-Nederlandse kind dat niet de behandeling als Nederlander geniet en dat na de inwerkingtreding van deze wet
      doch vóór de inwerkingtreding van de [Rijkswet op het Nederlanderschap][ref1] (*Stb.* 1984, 628) is geboren uit een
      vrouw die ten tijde van de geboorte van het kind de behandeling als Nederlander genoot dan wel deze op een later
      tijdstip heeft verkregen, verkrijgt de behandeling als Nederlander te rekenen van de geboorte, dan wel het tijdstip
      waarop de moeder de behandeling als Nederlander heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '6.3'
    text: |-
      Het niet-Nederlandse kind dat niet de behandeling als Nederlander geniet en dat na de inwerkingtreding van deze
      wet doch vóór de inwerkingtreding van de [Rijkswet op het Nederlanderschap][ref1] (*Stb.* 1984, 628) krachtens
      beslissing van de Nederlandse, de Nederlands-Antilliaanse of de Arubaanse rechter het adoptiefkind is geworden van
      een vrouw die ten tijde van de adoptie van het kind de behandeling als Nederlander genoot dan wel deze op een later
      tijdstip heeft verkregen, verkrijgt de behandeling als Nederlander, te rekenen van de adoptie dan wel het tijdstip
      waarop de moeder de behandeling als Nederlander heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '7.1'
    text: |-
      Aan degene op wie deze wet van toepassing is of ingevolge [artikel 3][ref1] van toepassing is verklaard wordt op
      zijn verzoek door de burgemeester van zijn woonplaats of van zijn werkelijke verblijfplaats dan wel, indien de
      verzoeker buiten Nederland woont, door de burgemeester van de gemeente waar hij laatstelijk woonplaats of werkelijk
      verblijf heeft gehad, een verklaring afgegeven dat hij overeenkomstig de bepalingen van deze wet als Nederlander
      wordt behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel3
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '3'
  - number: '7.2'
    text: |-
      Weigert de burgemeester een verklaring af te geven, dan kan de verzoeker daartegen beroep instellen bij Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      De niet-Nederlandse vrouw of man die sedert ten minste drie jaren de echtgenoot is van een persoon als bedoeld
      in [artikel 1][ref1] of 2, verkrijgt, indien zij of hij de behandeling als Nederlander niet reeds uit eigen
      hoofde bezit, die behandeling door haar of zijn wil daartoe te kennen te geven aan een autoriteit als bedoeld in
      [artikel 21 van de Rijkswet op het Nederlanderschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel21
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '21'
  - number: '8.2'
    text: |-
      De niet-Nederlandse vrouw of man, die de echtgenote of echtgenoot is van een persoon aan wie de behandeling als
      Nederlander wordt verleend krachtens [artikel 3][ref1] verkrijgt, indien zij of hij de behandeling als Nederlander
      niet reeds uit eigen hoofde bezit, die behandeling door haar of zijn wil daartoe te kennen te geven aan de
      burgemeester van haar of zijn woonplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel3
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '3'
  - number: '9'
    text: |-
      Deze wet kan worden aangehaald als "Wet betreffende de positie van Molukkers" en treedt in werking op een door Ons
      te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003052/2005-01-01#Artikel9
