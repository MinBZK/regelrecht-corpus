  - number: '75'
    text: |-
      1 Overdracht van een deel van de vergunning, als bedoeld in
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1], is slechts mogelijk voor zover daarin is voorzien
      door het goedgekeurde visplan, bedoeld in [artikel 67, eerste lid, onderdeel c][ref2], en kan tijdelijk zijn of
      voor onbepaalde tijd. Een tijdelijke overdracht kan slechts betrekking hebben op een aaneengesloten periode van ten
      hoogste 12 maanden, gerekend vanaf 1 juli.

      2 Een overdracht als bedoeld in het eerste lid, ongeacht of deze tijdelijk dan wel voor onbepaalde tijd is, is
      slechts mogelijk indien:

      a. De vrijstelling, bedoeld in [artikel 67, eerste lid][ref3], van kracht is, en

      b. zowel degene die overdraagt als degene aan wie wordt overgedragen, aangeslotene zijn.

      3 In geval van een overdracht als bedoeld in het eerste lid, wijzigt een erkende producentenorganisatie voor
      het IJsselmeer namens de Minister de desbetreffende vergunningen dienovereenkomstig, op verzoek van de betrokken
      aangeslotenen, mits is voldaan aan het tweede lid.

      4 In afwijking van het eerste en het tweede lid is een overdracht van een deel van een vergunning mogelijk, indien
      niet is voorzien in een goedgekeurd visplan en indien de vrijstelling, bedoeld in [artikel 67, eerste lid][ref4],
      niet van kracht is, voor zover die overdracht ziet op het gebruik van het aalkistje, de schietfuik, de grote fuik
      en het staand net.

      5 Een overdracht als bedoeld in het vierde lid dat op het gebruik ziet van het staand net, is slechts mogelijk,
      voor zover het aantal verhuurde staand netten in de periode van 1 juli tot en met 31 mei niet het aantal staand
      netten overschrijdt dat de verhuurder maximaal mag inzetten in deze vergunningsperiode.

      6 In afwijking van het eerste en tweede lid, is een overdracht van een deel van een vergunning mogelijk, indien
      niet is voorzien in een goedgekeurd visplan en indien de vrijstelling, bedoeld in [artikel 67, eerste lid][ref5],
      niet van kracht is, voor zover deze overdracht ziet op het gebruik van de zegen en voor onbepaalde tijd
      wordt aangevraagd. Een overdracht krachtens dit lid betekent tevens een overdracht van de dagen, bedoeld in
      [artikel 29, vierde lid][ref6].

      7 Een overdracht als bedoeld in het eerste, vierde en zesde lid, ongeacht of deze tijdelijk dan wel voor
      onbepaalde tijd is, is slechts mogelijk, indien daarvan uiterlijk op 1 april voorafgaand aan de eerstvolgende
      vergunningsperiode waarvoor de overdracht geldt, een aanvraag is ingediend bij de Minister.


