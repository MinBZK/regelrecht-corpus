  - number: '43'
    text: |-
      1 Van het verbod in de [artikelen 13, onderdeel a][ref1], en [21][ref2], voor wat betreft de Oosterschelde ten
      oosten van de Oosterscheldekering, is degene die op 15 april 2007 in het bezit was van een vergunning als bedoeld
      in [artikel 36][ref3], vrijgesteld onder de voorwaarden dat:

      a. eidragende zeekreeften, pas verschaalde zeekreeften en zeekreeften die zijn gevangen tussen 15 juli en de
      laatste donderdag van maart, onmiddellijk na de vangst worden teruggezet; en

      b. bijgevangen ondermaatse vis dan wel ondermaatse garnalen met behulp van water automatisch naar buitenboord
      worden afgevoerd via een uit glad materiaal bestaande glijgoot of afvoerpijp.

      2 Indien degene als bedoeld in het eerste lid, met een ander vissersvaartuig vist dan met het vaartuig waarvoor de
      in het eerste lid bedoelde vergunning is verleend, maakt hij hiervan twee weken van tevoren schriftelijk melding
      bij de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel36
