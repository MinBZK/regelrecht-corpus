  - number: '32'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 29 tot en met 31][ref1], is het verboden te vissen in het IJsselmeer
      gedurende een door de Minister te bepalen periode, met alle vistuigen behalve de hengel en de peur.

      2 De periode waarin het verboden is te vissen op grond van het vorige lid, wordt jaarlijks vastgesteld en
      bekendgemaakt in de Staatscourant.


