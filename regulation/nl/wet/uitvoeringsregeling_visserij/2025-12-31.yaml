        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0024539
      - id: ref3
        bwb_id: BWBR0024539
  - number: 52b
    text: |-
      1 Van het verbod, bedoeld in [artikel 12a][ref1] wordt, voor het grondgebied van de gemeenten, genoemd in bijlage
      19, vrijstelling verleend voor het gebruik voor de recreatieve visserij van een vistuig per persoon van het type
      staand want, mits:

      a. het een vistuig betreft

      1°. met een maaswijdte van ten minste 105 millimeter, gestrekt gemeten;

      2°. dat niet uit meerdere lagen netten bestaat;

      3°. dat bestaat uit enkeldradig of tot één draad gewonden garen;

      4°. met een lengte van ten hoogste 50 meter, gemeten langs de bovenpees van het net, en

      5°. met een hoogte van ten hoogste 110 centimeter, gestrekt gemeten.

      b. het net wordt verankerd aan de bodem, waarbij de bovenpees ten hoogste 65 centimeter boven de bodem aan de
      verankering wordt bevestigd;

      c. het net wordt geplaatst tussen de hoog- en de laagwaterlijn;

      d. het vistuig ten minste eenmaal per etmaal wordt geïnspecteerd en degene die vist bij de gemeente waar de
      visserij plaatsvindt in voorkomend geval opgave doet van de aantallen gevangen bruinvis en de plaats waar deze
      zijn gevangen.

      2 Op de vrijstelling, bedoeld in het eerste lid, zijn de voorwaarden bedoeld in
      [artikel 52a, onderdelen c en d][ref2], van overeenkomstige toepassing.

      3 [Artikel 52a, vierde en vijfde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel52a
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel52b
