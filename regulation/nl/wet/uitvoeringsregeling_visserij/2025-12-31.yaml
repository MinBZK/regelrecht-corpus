      1 Goedkeuring door de Minister van een visplan als bedoeld in [artikel 67, eerste lid, onderdeel c][ref1], kan
      slechts plaatsvinden indien:

      a. het plan vóór 1 januari van het desbetreffende jaar ter goedkeuring aan de Minister is voorgelegd;

      b. het plan aangeeft welke maatregelen genomen worden om de ten tijde van de inwerkingtreding van deze regeling
      op basis van [artikel 8 van het Reglement voor de binnenvisserij 1985][ref2] toegestane visserij-inspanning van de
      aangeslotenen te reduceren, waarbij de reductie met ingang van het jaar 2007 is vastgesteld op 32%, en

      c. het plan aangeeft welke maatregelen genomen worden om een duurzame wijze van vissen te waarborgen.

      2 In afwijking van het eerste lid kan ten genoegen van de Minister een andere datum dan 1 januari worden
      aangehouden mits deze zich naar het oordeel van de Minister verdraagt met het doel en de effectiviteit van het
      visplan.


