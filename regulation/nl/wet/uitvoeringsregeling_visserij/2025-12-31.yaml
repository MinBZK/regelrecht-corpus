        bwb_id: BWBR0030288
        artikel: '79'
  - number: '41'
    text: |-
      De vrijstellingen, bedoeld in de [artikelen 39][ref1] en [40][ref2], worden slechts verleend voor vaartuigen met
      één boomkor als bedoeld in [artikel 38, tweede lid][ref3], of met één bordennet waarvan de hoogte van de visborden
      niet meer bedraagt dan 70 centimeter en waarvan de lengte van de bovenpees, inclusief stroppen en kabels, niet meer
      bedraagt dan 225 centimeter, gemeten vanaf de achterzijde van het ene tot de achterzijde van het andere bord.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel38
