  text: |-
    Gelet op de artikelen 1, tweede lid, onderdelen a en b, en vijfde lid, 2c, eerste lid, 17, eerste en derde lid, en
    24 van de Visserijwet 1963;

    Gelet op de artikelen 3, 4 en 6d van het Reglement zee- en kustvisserij 1977;

    Gelet op de artikelen 1, eerste lid, onderdeel g, tweede en derde lid, 6, derde lid, 8, 10a, eerste en tweede lid,
    11, 12 en 13 van het Reglement voor de binnenvisserij 1985;

