        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '48'
    text: |-
      Van het verbod in [artikel 18, derde lid][ref1], wordt vrijstelling verleend aan:

      a. degene die handmatig schelpdieren raapt en visrechthebbende is op de desbetreffende schelpdierpercelen, dan wel
      van de visrechthebbende vooraf schriftelijke toestemming heeft gekregen om handmatig schelpdieren te rapen op die
      percelen, gelegen in het gebied, genoemd in [bijlage 5][ref2], en

      b. degene die handmatig schelpdieren raapt voor eigen gebruik, tot ten hoogste tien kilogram bruto per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0024539
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel48
