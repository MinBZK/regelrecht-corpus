  - number: '53'
    text: |-
      Van het bepaalde in [artikel 2, eerste lid][ref1] en
      [artikel 5, eerste lid, van het Reglement voor de Binnenvisserij 1985][ref2] wordt vrijstelling verleend voor zover
      het betreft het vissen met de oesterkor in het Grevelingenmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009027#Artikel5
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009027
        artikel: '5'
  - number: '54'
    text: |-
      Van het bepaalde in [artikel 6, eerste lid, onderdeel a, van het Reglement voor de binnenvisserij 1985][ref1]
      wordt vrijstelling verleend voor zover het betreft het vissen met de hengel, geaasd met enig kunstaas, in het
      Oostvoornsemeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel6
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '6'
  - number: '55'
    text: |-
      1 Het verbod, bedoeld in [artikel 7a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1], is niet van
      toepassing op de visrechthebbende en de houder van een schriftelijk toestemming, die:

      a. beschikt over minimaal 250 hectare viswater en daarmee inkomsten uit de visserij genereert van minimaal
      € 8.500,– bruto per jaar;

      b. zich daartoe heeft gemeld bij de Minister;

      c. de melding, bedoeld in onderdeel b, vergezeld heeft doen gaan van een assurance-rapport van een register-
      accountant of een accountant-administratieconsulent waaruit blijkt dat in het kalenderjaar voorafgaande aan de
      melding is voldaan aan het criterium, bedoeld in onderdeel a, en

      d. voorts telkens éénmaal in de vier jaar, te rekenen vanaf de melding, bedoeld in onderdeel b, de Minister een
      rapport heeft doen toekomen als bedoeld in onderdeel c, waaruit blijkt dat in het kalenderjaar voorafgaande aan de
      toezending van het assurance-rapport nog steeds is voldaan aan het criterium, bedoeld in onderdeel a.

      2 Het verbod, bedoeld in [artikel 7a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref2], is niet
      van toepassing op het vissen in een binnen een afgesloten erf gelegen viswater, dat geen voor het doorlaten van vis
      geschikte verbinding met andere wateren bezit, alsmede op het vissen in een viskwekerij.

      3 Bij de bepaling van het areaal, bedoeld in het eerste lid, onderdeel a, wordt mede begrepen het oppervlak aan
      viswater waarvoor vergunning is verleend ingevolge de [artikelen 12][ref3] en [36][ref4], met uitzondering van het
      viswater waarvoor vergunning is verleend voor recreatief vissen voor uitsluitend eigen gebruik met maximaal twee
      fuiken of met beperkte lengte hoekwant tot maximaal 200 meter, of met beperkte lengte staand want tot maximaal
      150 meter.

      4 In afwijking van het eerste lid, aanhef en onderdelen c en d, kan een rapport als bedoeld in die onderdelen
      gezamenlijk voor ten minste tien verschillende meldingen worden ingediend, indien uit dat rapport blijkt dat ten
      aanzien van ten minste 25% van degenen waarop de aanvraag ziet door de accountant bij wijze van steekproef is
      vastgesteld dat aan de criteria, bedoeld in het eerste lid, onderdeel a, is voldaan.

      5 Het aantal personen waarvan op grond van het vierde lid bij wijze van steekproef de gegevens wordt gecontroleerd,
      wordt, in voorkomend geval, afgerond op het naaste hele getal.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel7a
