  - number: '9'
    text: |-
      Alle bewijsstukken of bescheiden waarin de gegevens, bedoeld in [artikel 8][ref1], zijn vastgelegd, moeten vanaf
      het tijdstip van hun opstelling of verkrijging tot het tijdstip waarop drie kalenderjaren zijn verlopen, worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel8
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel9
