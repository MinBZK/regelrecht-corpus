  - number: '76'
    text: |-
      1 Een erkende producentenorganisatie voor het IJsselmeer wijzigt namens de Minister jaarlijks, voor zover nodig, de
      vergunningen van de aangeslotenen, om de reductie te bereiken van de visserij-inspanning, zoals vastgesteld in het
      goedgekeurde visplan, bedoeld in [artikel 67, eerste lid, onderdeel c][ref1].

      2 Indien met het oog op de te bereiken reductie, bedoeld in het eerste lid, een erkende producentenorganisatie voor
      het IJsselmeer merkjes van aangeslotenen inneemt en op hun naam reserveert, vindt de berekening ten behoeve van
      de wijziging van de vergunningen, bedoeld in het eerste lid, plaats aan de hand van de omrekentabel, opgenomen in
      [bijlage 12][ref2] bij deze regeling.

      3 Het bepaalde in het eerste lid is slechts van toepassing indien de vrijstelling in
      [artikel 67, eerste lid][ref3], van kracht is.


