        paragraaf: '3.1'
  - number: 77d
    text: |-
      De locaties in de gebieden, waarvoor een vergunning voor een mosselzaadinvanginstallatie kan worden verleend,
      worden voor een door de Minister te bepalen periode aangewezen.
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel77d
  - number: 77e
    text: |-
      1 De verlening van een vergunning voor een mosselzaadinvanginstallatie op een locatie in de gebieden, bedoeld
      in [artikel 77d][ref1], aan een aanvrager als bedoeld in [artikel 77a][ref2], geschiedt op basis van een door de
      Producentenorganisatie van de Nederlandse Mosselcultuur opgesteld visplan.

      2 Het visplan, bedoeld in het eerste lid, vermeldt de afmetingen en coördinaten van elke locatie in de gebieden,
      bedoeld in [artikel 77d][ref3].

      3 Indien er voor 31 december van het kalenderjaar waarin de termijn van de vergunning voor een
      mosselzaadinvanginstallatie afloopt, geen visplan voor de aanvrager, bedoeld in [artikel 77a][ref4], is
      vastgesteld, geschiedt de verlening van de vergunning door middel van loting.


