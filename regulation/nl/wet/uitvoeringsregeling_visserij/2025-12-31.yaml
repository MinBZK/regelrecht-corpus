      1 In afwijking van het verbod van [artikel 28, onderdeel d][ref1], is het uitzetten van graskarpers toegestaan
      indien:

      a. de eigenaar van het water waarin de graskarper wordt uitgezet hiermee instemt, en

      b. het uitzetten van de graskarper plaatsvindt in een water dat:

      1°. niet in enige open verbinding staat met andere wateren dan wel;

      2°. van andere wateren is gescheiden door een hekwerk, bestaande uit een spijlenhek met een onderlinge afstand
      tussen de spijlen van ten hoogste 3 cm of een gaashek, gegalvaniseerd en gelast met vierkante mazen van ten hoogste
      2,5 cm.

      2 Het hekwerk, bedoeld in het eerste lid, moet:

      a. in bodem en talud zijn ingegraven;

      b. voorzien zijn van een springflap van circa 50 cm schuin omhoog geplaatst onder een hoek van circa 45 graden in
      de richting van het water waarin de graskarper wordt uitgezet;

      c. met inbegrip van de in onderdeel b, bedoelde springflap bij de hoogste waterstand ten minste 50 cm boven water
      uitsteken, en

      d. aanwezig blijven en in deugdelijke staat te worden gehouden zolang de graskarper in het water dat met het
      hekwerk wordt afgesloten, aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel28
