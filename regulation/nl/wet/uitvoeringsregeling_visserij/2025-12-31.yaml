        artikel: 2a
  - number: 5c
    text: |-
      1 Het tijdvak, bedoeld in [artikel 2a, tweede lid, van de Visserijwet 1963][ref1], is:

        - 1 januari tot en met 31 december: beekforel, Deense houting, elft, houting, fint, kwabaal, meerval, serpeling,
      sneep, vlagzalm, zalm, zeeforel en zeeprik;
        - 1 maart tot en met 31 mei: snoek;
        - 1 maart tot en met 30 april en 1 november tot en met 31 januari: rivierprik;
        - 1 april tot en met 31 mei: baars, barbeel, kopvoorn, snoekbaars en winde.

      2 Het tijdvak, bedoeld in [artikel 2a, tweede lid, van de Visserijwet 1963][ref2], is voor zeebaars de periode van
      1 januari tot en met 31 december, met uitzondering van de periode waarin het vangen van zeebaars is toegestaan op
      grond van artikel 10, derde lid, eerste alinea, of vijfde lid, van de verordening vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
