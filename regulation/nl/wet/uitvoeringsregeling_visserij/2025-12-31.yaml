  - number: '40'
    text: |-
      Van [artikel 79, eerste lid, van de Uitvoeringsregeling zeevisserij][ref1] wordt vrijstelling verleend voor
      vaartuigen, andere dan vissersvaartuigen:

      a. met een lengte over alles kleiner dan 8 meter, voor zover het betreft het verbod om een boomkor aan boord te
      hebben in de visserijzone, het zeegebied en de Westerschelde, en

      b. met een lengte over alles kleiner dan 10 meter, voor zover het betreft het verbod om een bordennet aan boord te
      hebben in de visserijzone, het zeegebied en de Westerschelde.


      [ref1]: https://wetten.overheid.nl/BWBR0030288#Artikel79
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel40
    references:
