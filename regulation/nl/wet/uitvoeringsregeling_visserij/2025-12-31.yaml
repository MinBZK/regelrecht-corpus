  - number: '14'
    text: |-
      1 Het is verboden in het zeegebied en de kustwateren te vissen met:

      a. de harpoen, de elger, de aalschaar, of enig ander vistuig, hetwelk geëigend is de vis te verwonden, met
      uitzondering van het hoekwant, de reep, de dobber, de zetangel of fleur, de hengel of spieringtuig, en

      b. een visnet waarvan het netwerk van metaalgaas is vervaardigd, met uitzondering van de kreeftenkorf en enig ander
      net, bestemd of mede bestemd tot het vangen van schaal- en schelpdieren, zeesterren en zee- of koraalmos.

      2 Het is verboden in de kustwateren, genoemd in
      [artikel 2, eerste lid, van het Besluit aanwijzing zeegebied en kustwateren 1970][ref1], te vissen met een kuilnet
      waarvan de maaswijdte kleiner is dan 17 mm.

      3 Het is verboden in de kustwateren, genoemd in
      [artikel 2, derde tot en met zevende lid, van het Besluit aanwijzing zeegebied en kustwateren 1970][ref2], met de
      hierna genoemde vistuigen te vissen, indien de maaswijdte kleiner is dan het aantal millimeters, vermeld achter het
      desbetreffende vistuig:

      a. de ankerkuil 13 mm;

      b. het staande ansjovisnet, de fuik van een ansjovisweer 15 mm;

      c. het kuilnet 17 mm;

      d. de zegen 20 mm;

      e. het spieringdrijfnet 25 mm, en

      f. het schutnet, het staande botnet, de fuik aan een botweer 80 mm.

      4 Het is verboden in de kustwateren te vissen met een vistuig, waarvoor een minimummaaswijdte is vastgesteld,
      indien met betrekking tot dat vistuig enige handeling is verricht of enig middel is aangewend, waardoor het
      ontsnappen van vis kan worden bemoeilijkt of belet.


      [ref1]: https://wetten.overheid.nl/BWBR0002703#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002703#Artikel2
