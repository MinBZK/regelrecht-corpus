  - number: 11a
    text: |-
      Het is verboden te vissen in het gebied, bedoeld in [bijlage 3b][ref1], met uitzondering van het vissen met de
      volgende vistuigen:

      a. hengel;

      b. zegen, mits deze niet aan de zeebodem is verankerd, de onderpees niet meer weegt dan 18 kg per 100 m, en
      het uitgezette net, vertrekkend vanaf één zijde, zodanig in een langs het net varende hulpboot weer wordt
      binnengehaald, dat het nog niet binnengehaalde deel zoveel mogelijk in de oorspronkelijk uitgezette positie blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0024539
