  - number: 32a
    text: |-
      1 Onverminderd [artikel 13, tweede lid, van de Uitvoeringsregeling zeevisserij][ref1], zijn de zeevisserij en de
      kustvisserij verboden in de periode van 1 september tot en met 28 februari, of in een schrikkeljaar tot en met
      29 februari, en is de binnenvisserij verboden in de periode van 1 september tot en met 30 november met de volgende
      vistuigen:

      a. aaldogger als bedoeld in [artikel 1, onderdeel i, van het Reglement voor de binnenvisserij 1985][ref2];

      b. aalfuik als bedoeld in [artikel 1, onderdeel e, van het Reglement voor de binnenvisserij 1985][ref3];

      c. aalhoekwant als bedoeld in [artikel 1, onderdeel h, van het Reglement voor de binnenvisserij 1985][ref4];

      d. aalkistje als bedoeld in [artikel 1, onderdeel g, van het Reglement voor de binnenvisserij 1985][ref5];

      e. aalzegen als bedoeld in [artikel 1, onderdeel k, van het Reglement voor de binnenvisserij 1985][ref6];

      f. ankerkuil als bedoeld in [artikel 1, onderdeel f, van het Reglement voor de binnenvisserij 1985][ref7];

      g. electrovisapparaat als bedoeld in [artikel 1, onderdeel p, van het Reglement voor de binnenvisserij 1985][ref8];

      h. peur als bedoeld in [artikel 1, vijfde lid, van de wet][ref9];

      i. visfuik als bedoeld in [artikel 1, eerste lid, onderdeel d, van het Reglement voor de binnenvisserij 1985][ref10];

      j. kubbe; of

      k. enig ander vistuig, niet zijnde een hengel, dat in hoofdzaak gebruikt wordt of bestemd is voor de vangst van
      aal.

      2 Het is verboden om in de perioden, genoemd in het eerste lid, een vistuig als genoemd in het eerste lid,
      voorhanden te hebben op of in de nabijheid van de Nederlandse wateren waarvoor het verbod, genoemd in het eerste
      lid, geldt.

      3 Van het verbod, bedoeld in het eerste lid, onderdeel c, en in het tweede lid, wordt vrijstelling verleend voor de
      zee- en kustvisserij met een drijvend of in de waterkolom zwevend vistuig bestaande uit een lange lijn met daaraan
      aan zijlijntjes bevestigde enkeltandige haken, waarvan de kortste afstand tussen de punt en de steel ten minste 10
      mm bedraagt, die de zeebodem niet raken.


