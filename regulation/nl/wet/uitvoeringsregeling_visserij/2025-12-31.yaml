        artikel: 6c
  - number: '39'
    text: |-
      Van het bepaalde in [artikel 21][ref1], wordt vrijstelling verleend voor het vissen in de visserijzone en het
      zeegebied:

      a. met vaartuigen met een lengte over alles kleiner dan 8 meter, voor zover het betreft de visserij met een
      boomkor, en

      b. met vaartuigen met een lengte over alles kleiner dan 10 meter, voor zover het betreft de visserij met een
      bordennet.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel21
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel39
