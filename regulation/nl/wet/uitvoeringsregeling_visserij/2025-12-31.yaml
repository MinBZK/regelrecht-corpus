      1 Aal gevangen met een hengel of peur in de visserijzone, het zeegebied en de kustwateren wordt onmiddellijk levend
      in hetzelfde water teruggezet.

      2 Het is verboden aal voorhanden te hebben bij de uitoefening van de visserij, bedoeld in het eerste lid.
