  - number: 10a
    text: |-
      1 Een visser die gebruik maakt van de vistuigen, genoemd in [artikel 32a, eerste lid][ref1], met uitzondering van
      onderdeel h, doet wekelijks uiterlijk op dinsdag om 24.00 uur opgave aan de Minister van zijn aalvangsten en zijn
      visserij-inspanning in de voorafgaande week. Uit deze opgave blijkt:

      a. de naam van de visser;

      b. de hoeveelheid aal in kilogram, onderscheiden naar het soort vistuig, bedoeld in onderdeel d, waarmee het is
      gevangen;

      c. de herkomst van de aal;

      d. het aantal en het soort vistuigen waarmee de visser in de betreffende week op aal heeft gevist.

      2 De opgave geschiedt op een door de Minister beschikbaar te stellen format.

      3 In afwijking van het eerste lid kan een visser die in een bepaalde periode geen gebruik maakt van de vistuigen
      genoemd in [artikel 32a, eerste lid][ref2], hiervan voorafgaand aan die periode opgave doen.

      4 Van de verplichting uit het eerste lid zijn uitgezonderd diegenen, die op grond van
      [artikel 104, tweede lid, van de Uitvoeringsregeling zeevisserij][ref3] alle aalvangsten registreren.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0030288#Artikel104
