        artikel: '2'
  - number: 52a
    text: |-
      1 Van het verbod in [artikel 12][ref1] wordt voor de kustwateren vrijstelling verleend voor het gebruik voor de
      recreatieve visserij met vistuig van het type staand want.

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend voor één vistuig per persoon en geldt niet voor de
      gebieden bedoeld in [bijlage 17][ref2] bij deze regeling.

      3 Aan de vrijstelling, bedoeld in het eerste lid, zijn de volgende voorschriften verbonden:

      a. de netlengte van het vistuig bedraagt niet meer dan 100 meter, in de gebieden, bedoeld in [bijlage 18][ref3], en
      in andere gebieden niet meer dan 30 meter;

      b. het vistuig is voorzien van drijvers en ligt bij laag water plat op de bodem;

      c. degene die van de vrijstelling gebruik maakt heeft zijn voornemen hiertoe gemeld aan de gemeente binnen wiens
      grondgebied hij de recreatieve visserij, als bedoeld in het eerste lid, uitoefent;

      d. het vistuig is boven elk heersend waterpeil voorzien van een markering waarop duidelijk leesbaar het nummer,
      bedoeld in vijfde lid, is vermeld.

      4 De melding, bedoeld in het derde lid, onderdeel c, geschiedt per kalenderjaar en omvat de naam, het adres, de
      woonplaats en de geboortedatum van degene die voornemens is van de vrijstelling gebruik te maken.

      5 De gemeente verstrekt een uniek nummer aan degene die een melding als bedoeld in het derde lid, onderdeel c,
      doet.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024539
      [ref3]: https://wetten.overheid.nl/BWBR0024539
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel52a
    references:
      - id: ref1
