    text: |-
      Het is verboden de volgende rivierkreeften in de binnenwateren uit te zetten:

      a. Australische roodklauwkreeft;

      b. Californische rivierkreeft;

      c. Geknobbelde Amerikaanse rivierkreeft;

      d. Gestreepte Amerikaanse rivierkreeft;

      e. Gevlekte Amerikaanse rivierkreeft;

      f. Marmerkreeft;

      g. Rode Amerikaanse rivierkreeft;

      h. Steenkreeft;

      i. Turkse rivierkreeft.
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel28a
  - number: 28b
    text: |-
      1 Het is verboden te vissen in de wateren, genoemd in [bijlage 16][ref1], met de volgende vistuigen:

      a. aaldogger

      b. aalfuik

      c. aalhoekwant

      d. aalkistje

      e. aalzegen

      f. ankerkuil

      g. electrovisapparaat

      h. peur

      i. visfuik

      j. de kreeftenkorf

      2 Het verbod, bedoeld in het eerste lid, geldt voor het gehele gebied binnen de winterdijken van de wateren,
      genoemd in [bijlage 16][ref2], en voor alle havens, plassen, killen, gaten, putten, strangen, kreken, kanalen,
      beken en rivierarmen die in directe open verbinding staan met de wateren, genoemd in bijlage 16, tot aan de eerste
      waterkering gerekend vanaf die wateren.

      3 Het is verboden aal en Chinese wolhandkrab voorhanden of in voorraad te hebben op of in de onmiddellijke
      nabijheid van de wateren, genoemd in [bijlage 16][ref3], met uitzondering van:

      a. de haven van Urk;

      b. het gebied binnen de begrenzing van de betonning van de vaargeul naar Urk tot aan de lijn lopende over het
      groene en rode licht van de haveningang van Urk en de lijn van het groene licht van de haveningang naar het
      coördinaat 52°39.179' NB en 005°36.108' OL en de lijn lopend van dit coördinaat tot de groene betonning van de
      vaargeul.

      4 Het is verboden om Chinese wolhandkrab voorhanden of in voorraad te hebben in of in de onmiddellijke nabijheid
      van het Krammer Volkerak. Chinese wolhandkrab gevangen in het gedeelte van het Krammer Volkerak gelegen ten westen
      van de lijn lopend over de punten met de coördinaten:

      − 51°38.294’ NB en 004°16.465’ OL

      − 51°39.287’ NB en 004°16.446’ OL

      tot aan de ingang van het Schelde-Rijnkanaal, lopend over de punten met de coördinaten:

      − 51°38.064’ NB en 004°14.076’ OL

      − 51°38.023’ NB en 004°14.560’ OL

      wordt onmiddellijk in hetzelfde water teruggezet.

      5 Van het verbod, bedoeld in
      [artikel 10, eerste lid, onderdeel c, van het Reglement voor de binnenvisserij 1985][ref4], wordt vrijstelling
      verleend voor het voorhanden hebben van de vistuigen, genoemd in het eerste lid, in de wateren, genoemd in het
      derde lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0024539
      [ref2]: https://wetten.overheid.nl/BWBR0024539
      [ref3]: https://wetten.overheid.nl/BWBR0024539
      [ref4]: https://wetten.overheid.nl/BWBR0009027#Artikel10
