  - number: '2'
    text: |-
      Als vissen, onderscheidenlijk schaal- en schelpdieren als bedoeld in
      [artikel 1, tweede lid, onderdeel a, onderscheidenlijk onderdeel b, van de wet][ref1], worden aangewezen de in de
      [bijlage 1][ref2] opgenomen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024539
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel2
