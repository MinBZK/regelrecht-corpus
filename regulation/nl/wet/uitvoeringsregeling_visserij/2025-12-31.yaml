    text: |-
      Aan de aangeslotenen bij de Coöperatieve Producentenorganisatie Nederlandse Vissersbond-IJsselmeer U.A. wordt
      vrijstelling verleend als bedoeld in [artikel 67, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel67
