  - number: 75a
    text: |-
      1 Een overdracht van het aantal dagen, bedoeld in [artikel 29, vierde lid][ref1], is slechts mogelijk, voor zover
      het totale aantal dagen wordt overgedragen en het een tijdelijke overdracht betreft voor een aaneengesloten periode
      van ten hoogste 12 maanden, gerekend vanaf 1 juli.

      2 Een overdracht als bedoeld in het eerste lid is slechts mogelijk, indien daarvan uiterlijk op 1 april voorafgaand
      aan de eerstvolgende vergunningsperiode waarvoor de overdracht geldt, een aanvraag is ingediend bij de Minister.


