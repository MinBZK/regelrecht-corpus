  - number: '74'
    text: |-
      1 Overdracht van een gehele vergunning als bedoeld in
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1], is slechts mogelijk in het geval dat :

      a. ten behoeve van de ondernemer een pandrecht op een vergunning is verleend, indien een verklaring van de
      pandhouder is overgelegd waaruit blijkt dat deze met de overdracht instemt, en

      b. in het geval dat een aangeslotene is betrokken, indien een schriftelijke verklaring van een erkende
      producentenorganisatie voor het IJsselmeer is overgelegd waaruit blijkt dat deze organisatie een afschrift van de
      desbetreffende overdrachtstransactie heeft ontvangen.

      2 De instemming van de pandhouder, bedoeld in het eerste lid, onderdeel a, is slechts vereist indien de pandhouder
      de Minister door middel van een afschrift van de akte van verpanding in kennis heeft gesteld van het gevestigde
      pandrecht.

      3 De overdracht vindt plaats door een gelijktijdige kennisgeving door de Minister aan de aanvrager en aan de
      ondernemer aan wie de vergunning van het [Reglement voor de binnenvisserij 1985][ref2], wordt overgedragen, dat
      laatstgenoemde deze vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009027
