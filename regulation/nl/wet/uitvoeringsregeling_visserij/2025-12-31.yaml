  - number: 10b
    text: |-
      1 Een visser die gebruik maakt van het staand net, grote fuik of de zegen, doet ten aanzien van de vissoorten
      baars, blankvoorn, bot, brasem en snoekbaars op verzoek van de Minister opgave van:

      a. de naam van de vergunninghouder;

      b. per aanlandingsdatum:

      1°. de hoeveelheid aangelande vis in kilogram, onderscheiden naar het soort vis en naar het soort vistuig, waarmee
      het is gevangen;

      2°. de herkomst van de vis;

      3°. het aantal en het soort vistuigen waarmee de vergunninghouder in de betreffende periode de baars, blankvoorn,
      bot, brasem of snoekbaars heeft gevangen;

      4°. bij het staand net de lengte en de effectieve hoogte van dat vistuig;

      5°. de maaswijdte van het vistuig, of, wanneer bij het staand net meerdere maaswijdtes of effectieve hoogtes van
      het net zijn toegepast, de totale lengte per onderscheiden maaswijdte, respectievelijk effectieve hoogte van het
      net;

      6°. de totale effectieve visduur van het soort vistuig, waarmee de vis is gevangen.

      2 De visser registreert de gegevens, bedoeld in het eerste lid, uiterlijk binnen 24 uren na de aanlandingsdatum.

      3 De opgave geschiedt uiterlijk twee weken nadat het verzoek, bedoeld in het eerste lid, is gedaan, en op een door
      de Minister beschikbaar te stellen format.
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel10b
