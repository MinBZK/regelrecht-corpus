  - number: 1a
    text: |-
      Deze regeling berust op:

      a. de [artikelen 1, tweede lid, onderdelen a en b][ref1], [2c, eerste lid][ref2], [3a][ref3],
      [17, eerste en derde lid][ref4], en [24 van de wet][ref5];

      b. de [artikelen 3][ref6], [4][ref7] en [6d van het Reglement zee- en kustvisserij 1977][ref8], en

      c. de [artikelen 1, eerste lid, onderdeel g, tweede en derde lid][ref9], [6, vierde lid][ref10],
      [7a][ref11], [8][ref12], [10a][ref13], [10b][ref14], [11][ref15], [12][ref16] en
      [13 van het Reglement voor de binnenvisserij 1985][ref17].


