  - number: '70'
    text: |-
      1 Een vergunning als bedoeld in [artikel 36][ref1], bestemd voor het vissen met enig vistuig geschikt voor het
      vangen van garnalen in de visserijzone, het zeegebied of de kustwateren, bevat met ingang van 1 januari 2002 de
      volgende gegevens:

      a. de naam van de vergunninghouder, en

      b. de lettertekens, het nummer, het motorvermogen en de tonnage van het visservaartuig ten behoeve waarvan de
      vergunning is verleend.

      2 Indien de Minister niet binnen de in [artikel 4:13 van de Algemene wet bestuursrecht][ref2] gestelde termijn op
      een aanvraag voor een vergunning als bedoeld in het eerste lid heeft beslist en de aanvraag is in overeenstemming
      met het bepaalde in het derde, vierde en vijfde lid, is de vergunning van rechtswege verleend overeenkomstig de
      aanvraag.

      3 Een vergunning als bedoeld in het eerste lid wordt ten aanzien van een vissersvaartuig slechts verleend indien:

      a. het vissersvaartuig dient ter vervanging van een vissersvaartuig of vissersvaartuigen ten aanzien waarvan een
      vergunning als bedoeld in het eerste lid is verleend en de vergunninghouder afstand heeft gedaan van zijn gehele
      vergunning ten gunste van de aanvrager van de vergunning en het totaal verleende aantal vergunningen als bedoeld in
      het eerste lid niet toeneemt;

      b. het motorvermogen van dat vissersvaartuig niet meer bedraagt dan het motorvermogen van het vissersvaartuig of de
      vissersvaartuigen die worden vervangen;

      c. de aanvrager een meetrapport van een onderneming die is erkend op grond van
      [artikel 87a van de Uitvoeringsregeling zeevisserij][ref3], overlegt dat niet ouder is dan twee maanden en waaruit
      het motorvermogen blijkt van het vissersvaartuig ten behoeve waarvan de vergunning is aangevraagd.

      4 In afwijking van het derde lid, onderdelen a en b, kan de Minister op hun verzoek aan twee houders van
      vergunningen als bedoeld in het eerste lid, nieuwe vergunningen verlenen ten aanzien van hun vissersvaartuigen,
      onder de voorwaarde dat de som van het motorvermogen van die vaartuigen niet toeneemt.

      5 De vergunning, bedoeld in het eerste lid, wordt ingetrokken indien:

      a. de vergunninghouder afstand van de vergunning heeft gedaan als bedoeld in het derde lid, onderdeel a; of

      b. de visserijactiviteiten van een vissersvaartuig ten behoeve waarvan de vergunning is verleend definitief worden
      stopgezet en ten aanzien van de stopzetting door de minister of door de Europese Commissie subsidie is verleend.

      6 De Minister kan de vergunning, bedoeld in het eerste lid voor een periode van twee weken schorsen, indien naar
      het oordeel van de Minister met het vissersvaartuig ten behoeve waarvan de vergunning is toegekend is gehandeld in
      strijd met [artikel 22][ref4], of met [artikel 50][ref5].

      7 Indien binnen een jaar na afloop van de schorsing, als bedoeld in het vorige lid, naar het oordeel van de
      Minister nogmaals met het vaartuig in strijd met [artikel 22][ref6], of met [artikel 50][ref7], wordt gehandeld,
      kan de Minister de vergunning voor een periode van vier weken schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel413
      [ref3]: https://wetten.overheid.nl/BWBR0030288#Artikel87a
