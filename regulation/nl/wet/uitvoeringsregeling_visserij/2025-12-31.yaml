  - number: '10'
    text: |-
      De verplichting om een administratie bij te houden als bedoeld in [artikel 7, eerste lid][ref1], is niet van
      toepassing op:

      a. inrichtingen waarvoor een vergunning ingevolge [artikel 3 van de Alcoholwet][ref2] is vereist,

      b. ondernemingen waarin de detailhandel wordt uitgeoefend voor zover het de uitoefening van detailhandel betreft,

      c. ondernemingen waarin het hotel-, het pension-, het restaurant-, het café-, het cafetaria-, het lunchroom-
      of het partycateringbedrijf wordt uitgeoefend dan wel anderszins verstrekking van logies, gepaard gaande met
      dienstverlening of de verstrekking van maaltijden, spijzen of dranken voor verbruik ter plaatse, als bedrijf plaats
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel10
