  - number: '56'
    text: |-
      1 Het verbod, bedoeld in [artikel 7a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1], is niet van
      toepassing op de visrechthebbende en de houder van een schriftelijk toestemming, die:

      a. beschikt over minimaal 250 hectare viswater;

      b. zich daartoe heeft gemeld bij de Minister;

      c. de melding, bedoeld in onderdeel b, vergezeld heeft doen gaan van:

      1°. een bedrijfsplan, waaruit een perspectief kan worden afgeleid om binnen twee jaren na de melding te voldoen aan
      het inkomstencriterium, bedoeld in [artikel 55, eerste lid, onderdeel a][ref2], en

      2°. een assurance-rapport als bedoeld in [artikel 55, eerste lid, onderdeel c][ref3], waaruit blijkt dat op het
      tijdstip van de melding is voldaan aan het areaalcriterium, bedoeld in [artikel 55, eerste lid, onderdeel a][ref4],
      en

      d. gedurende een periode van twee jaren voorafgaande aan de melding, bedoeld in onderdeel b, niet heeft gevist op
      basis van de in het eerste lid bedoelde vrijstelling.

      2 De in het eerste lid bedoelde vrijstelling van het in
      [artikel 7a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref5] bedoelde verbod, geldt gedurende een
      periode van twee jaren, te rekenen vanaf de melding, bedoeld in onderdeel b.

      3 In afwijking van het eerste lid, aanhef en onderdeel c, onder 2˚, kan een rapport als bedoeld in dat onderdeel
      gezamenlijk voor ten minste tien verschillende meldingen worden ingediend, indien uit dat rapport blijkt dat ten
      aanzien van ten minste 25% van degenen waarop de aanvraag ziet door de accountant bij wijze van steekproef is
      vastgesteld dat aan het criterium, bedoeld in het eerste lid, onderdeel a, is voldaan.

      4 Het aantal personen waarvan op grond van het vierde lid bij wijze van steekproef de gegevens wordt gecontroleerd,
      wordt, in voorkomend geval, afgerond op het naaste hele getal.


