  - number: '78'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. de [Beschikking visserij visserijzone, zeegebied en kustwateren][ref1] (Stcrt 1977, 255);

      b. de [Regeling aanwijzing vissen, schaal- en schelpdieren][ref2] (Stcrt. 1982, 253);

      c. de [Regeling aassoorten spieringtuig][ref3] (Stcrt. 1985, 85);

      d. de [Aanwijzing verboden middelen tot bedwelming][ref4] (Stcrt. 1985, 85);

      e. de [Regeling aanwijzing wateren gesloten tijd][ref5] (Stcrt. 1985, 103);

      f. de [Regeling aanwijzing wateren verbod nachtvisserij][ref6] (Stcrt. 1985, 103);

      g. de [Uitzondering Grevelingenmeer van bepaling huur- en verhuur visrecht][ref7] (Stcrt. 1987, 80);

      h. de [Uitzet van graskarpers][ref8] (Stcrt. 1990, 104);

      i. de [Regeling IJsselmeervisserij 1993][ref9] (Stcrt. 1993, 40);

      j. de [Regeling vervroegde opening visseizoen][ref10] (Stcrt. 1994, 71);

      k. de [Regeling visserij-inspanning IJsselmeer][ref11] (Stcrt. 1996, 101);

      l. de [Regeling maat middellijn ringetjes en gaatjes in zijwanden aalkistjes][ref12] (Stcrt. 1997, 220);

      m de [Regeling eisen aan administratie inzake zoetwatervis][ref13] (Stcrt. 2003, 4);

      n. de [Vrijstellingsregeling visserij][ref14] (Stcrt. 2006, 247).


