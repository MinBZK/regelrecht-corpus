      - id: ref2
        bwb_id: BWBR0024539
  - number: '49'
    text: |-
      Van het verbod, bedoeld in [artikel 21][ref1], is vrijgesteld degene, die anders dan met behulp van een vaartuig op
      garnalen vist.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel21
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '50'
    text: |-
      Het verbod, bedoeld in [artikel 22][ref1], geldt niet

      a. indien het vissen wordt uitgevoerd als toeristische activiteit met een daarvoor geschikt vaartuig en de vangst
      niet op de markt wordt gebracht, en

      b. voor het buiten de haven zijn met een vaartuig dat enig vistuig aan boord heeft geschikt voor het vangen van
      garnalen buiten de Nederlandse wateren, tijdens opeenvolgende tijdvakken van twee weken telkens ten hoogste negen
      etmalen. Het eerste tijdvak begint op de eerste zondag in oktober om 24.00 uur en loopt twee weken later op zondag
      om 24.00 uur af.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel22
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel50
    references:
