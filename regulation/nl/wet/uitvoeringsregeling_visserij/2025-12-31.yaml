  - number: '44'
    text: |-
      Van het bepaalde in [artikel 17][ref1] wordt vrijstelling verleend voor het vissen met enig vistuig geschikt voor
      het vangen van:

      a. mosselen en zeesterren door de visrechthebbende op de mosselpercelen gelegen in de kustwateren;

      b. mosselen en zeesterren door de visrechthebbende dan wel degene die daartoe toestemming heeft gekregen van de
      visrechthebbende op verwaterpercelen, en

      c. oesters door de visrechthebbende op de oesterpercelen in de Oosterschelde.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel17
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel44
    references:
