        bwb_id: BWBR0002416
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024539
  - number: '4'
    text: |-
      Als middelen, bedoeld in [artikel 2c, eerste lid, van de wet][ref1], waarmee het verboden is vis te bedwelmen, te
      verwonden of te doden, worden aangewezen:

      a. kokkelbonen;

      b. tjoekvisje;

      c. ongebluste kalk;

      d. dynamiet, en

      e. andere vergiftigende, bedwelmende en ontplofbare stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2c
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2c
  - number: '5'
    text: |-
      Als water waarvoor de bepalingen van [paragraaf 5 van de wet][ref1] betreffende de huur en verhuur van visrecht
      niet gelden, wordt aangewezen: het Grevelingenmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel5
