        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 77b
    text: |-
      Een vergunning voor een mosselzaadinvanginstallatie kan op aanvraag door de Minister worden verleend aan personen
      die in de jaren 2003 en 2004 als pionier met een mosselzaadinvanginstallatie hebben geëxperimenteerd in de
      kustwateren dan wel hun rechtsopvolger en waarvoor door de Minister een ontheffing van het verbod, bedoeld in
      [artikel 17][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel17
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel77b
