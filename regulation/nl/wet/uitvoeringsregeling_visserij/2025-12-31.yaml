      1 Bij het verlenen van vrijstellingen of ontheffingen alsmede bij het daaraan
      verbinden van voorschriften en het verlenen onder beperkingen, als bedoeld in
      [artikel 6d, tweede lid, van het Reglement zee- en kustvisserij 1977][ref1], en de [artikel 11][ref2] en
      [12, van het Reglement voor de binnenvisserij 1985][ref3], wordt mede rekening gehouden met de belangen van de
      natuurbescherming.

      2 Aan vrijstellingen, ontheffingen en vergunningen als bedoeld in onderhavige regeling, kunnen voorschriften worden
      verbonden. Zij kunnen onder beperkingen worden verleend. Zij kunnen worden ingetrokken.

      3 Niet naleven van beperkingen of voorschriften als bedoeld in het eerste lid, wordt aangemerkt als handelen zonder
      vrijstelling, ontheffing of vergunning als bedoeld in het tweede lid.


