  - number: '42'
    text: |-
      1 Aan de vrijstellingen, bedoeld in [artikel 38, eerste lid, aanhef en onder a][ref1], [artikel 39][ref2] en
      [artikel 40][ref3], worden de volgende voorschriften verbonden:

      a. vangsten van vissoorten genoemd in bijlage I van de verordening vangstmogelijkheden, in bijlage I bij de
      verordening vangstmogelijkheden 2025, voor zover van toepassing voor 2026 gevangen in de bij die vissoorten
      genoemde wateren, dienen onmiddellijk na het ophalen ervan in hetzelfde water te worden teruggezet;

      b. indien de visserij op garnalen wordt uitgeoefend, dient de vangst direct na aan boord te zijn gehaald, te worden
      gesorteerd met behulp van een handzeef, en

      c. het is verplicht een handzeef aan boord te hebben van het vaartuig waarmee de garnalenvisserij wordt
      uitgeoefend.

      2 Aan de vrijstelling, bedoeld in [artikel 38, eerste lid, aanhef en onder b][ref4], worden de volgende
      voorschriften verbonden:

      a. Verordening (EU) 2019/1241 van het Europees Parlement en de Raad van 20 juni 2019 betreffende de instandhouding
      van visbestanden en de bescherming van mariene ecosystemen door middel van technische maatregelen, tot wijziging
      van de [Verordeningen (EG) nr. 1967/2006](32006R1967) en [(EG) nr. 1224/2009](32009R1224) van de Raad en de
      Verordeningen (EU) [nr. 2013/1380](33280R2013), (EU) [nr. 2016/1139](33039R2016), (EU) [2018/973](32873R2018), (EU)
      [2019/472](32372R2019) en (EU) [2019/1022](32922R2019) van het Europees Parlement en de Raad, en tot intrekking van
      de Verordeningen [(EG) nr. 894/97](31997R0894), [(EG) nr. 850/98](31998R0850), [(EG) nr. 2549/2000](32000R2549),
      [(EG) nr. 254/2002](32002R0254), [(EG) nr. 812/2004](32004R0812) en [(EG) nr. 2187/2005](32005R2187) van de Raad
      (PbEU 2019, L198) wordt, met uitzondering van artikel 15, eerste lid, in samenhang met bijlage V, deel C, punt 2,
      bij de uitoefening van de visserij in acht genomen;

      b. aanlandingen in Nederlandse havens vinden slechts overeenkomstig de [Uitvoeringsregeling zeevisserij][ref5]
      plaats, en

      c. bij aanlanding in een Nederlandse haven is de ondernemer verplicht onverwijld maar uiterlijk binnen een half uur
      na aanlanding per vissoort opgave van de vangsthoeveelheden te doen.

      3 De opgave, bedoeld in het tweede lid, onderdeel c, vindt plaats door middel van het indienen
      van het logboek, bedoeld in artikel 15, eerste lid, van de controleverordening, bedoeld in
      [artikel 1, tweede lid, van de Uitvoeringsregeling zeevisseri][ref6]j.

      4 Het indienen van het logboek, bedoeld in het derde lid, vindt plaats door overhandiging aan een functionaris of
      aan een ambtenaar van de Nederlandse Voedsel- en Warenautoriteit of deponering van het formulier in een opgavebus
      als bedoeld in [artikel 1, eerste lid, van de Uitvoeringsregeling zeevisserij][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel40
