  - number: '38'
    text: |-
      1 Van het bepaalde in [artikel 6c, eerste lid, van het Reglement zee- en kustvisserij 1977][ref1] wordt
      vrijstelling verleend:

      a. voor het uitoefenen van de visserij met de boomkor met vaartuigen, andere dan vissersvaartuigen met een lengte
      over alles kleiner dan 8 meter, in de visserijzone, het zeegebied en de Westerschelde, alsmede voor het in deze
      wateren aan boord van zodanige vaartuigen aanwezig hebben van een boomkor, en

      b. voor het uitoefenen van de riviervisserij met de boomkor met vaartuigen met een lengte over alles kleiner dan
      20 meter en met een motorvermogen van ten hoogste 221 kW waarmee uitsluitend de riviervisserij wordt uitgeoefend,
      alsmede voor het aan boord van zodanige vaartuigen aanwezig hebben van een boomkor.

      2 De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel a, wordt slechts verleend voor vaartuigen met één
      boomkor met een maximale breedte van 150 centimeter, gemeten tussen de uiteinden van de constructie, zonder dat er
      voorzieningen zijn getroffen waardoor de boomkor kan worden uitgeschoven of verlengd.

      3 De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel b, wordt slechts verleend:

      a. aan ondernemers te wiens naam het vaartuig in de Officiële lijst der Belgische Vissersvaartuigen, bedoeld in het
      Ministeriële besluit van 21 februari 1934, is geregistreerd, en

      b. voor vaartuigen:

      1°. met ten hoogste twee boomkorren waarvan de individuele lengte niet meer bedraagt dan 4.5 meter, gemeten
      tussen de uiteinden van de constructie, zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden
      uitgeschoven en verlengd;

      2°. ten behoeve waarvan aan de ondernemer, bedoeld in onderdeel a, een akte van consent is afgegeven door het
      Waterschoutsambt te Antwerpen voor de visserij op de Westerschelde als bedoeld in het Reglement van 20 mei 1843 ter
      uitvoering van artikel 9 van het Verdrag van 19 april 1839 betreffende de uitoefening van het recht der visscherij
      en van den vischhandel.

      4 In afwijking van het derde lid, onderdeel b, onder 1º, wordt voor de gerichte riviervisserij op garnalen de
      vrijstelling, bedoeld in het eerste lid, onderdeel b, verleend voor vaartuigen met ten hoogste twee boomkorren
      waarvan de individuele lengte niet meer bedraagt dan 12 meter, gemeten tussen de uiteinden van de constructie,
      zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden uitgeschoven of verlengd.

      5 Vaartuigen ten aanzien waarvan de in het eerste lid, aanhef en onderdeel b, bedoelde vrijstelling is verleend,
      staan vermeld op de door de bevoegde Belgische autoriteiten vastgestelde lijst van de Belgische zeeschepen onder
      ‘Schelde Fishing Vessels’. Deze lijst is beschikbaar via internetadres: [https://mobilit.belgium.be/nl/Resources/
      publicaties/scheepvaart/pub_koopvaardij_lijst_belg_schepen](https://mobilit.belgium.be/nl/Resources/publicaties/
      scheepvaart/pub_koopvaardij_lijst_belg_schepen).


      [ref1]: https://wetten.overheid.nl/BWBR0003144#Artikel6c
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel38
    references:
      - id: ref1
