  - number: '72'
    text: |-
      Een vergunning, als bedoeld in [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1], wordt slechts
      verleend, voor zover:

      a. de bij de desbetreffende vergunning behorende merkjes op of aan het betrokken vistuig of de betrokken vistuigen
      zijn bevestigd;

      b. niet wordt gevist met meer of andere vistuigen dan het aantal onderscheidenlijk de soort of soorten vistuigen
      waarmee de betrokken ondernemer op grond van de hem verleende vergunning gerechtigd is te vissen, en

      c. niet wordt gevist in strijd met de nadere voorschriften zoals deze in de desbetreffende vergunning zijn
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel8
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel72
