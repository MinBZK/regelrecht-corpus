    text: |-
      Van het verbod, bedoeld in [artikel 7a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1],
      is vrijgesteld degene die de visrechthebbende of de houder van de schriftelijke toestemming, bedoeld in de
      [artikelen 55, eerste lid][ref2], en [56, eerste lid][ref3], behulpzaam is bij het vissen met een vistuig, dat niet
      door één persoon kan worden bediend.


