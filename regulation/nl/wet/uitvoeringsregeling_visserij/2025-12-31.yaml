    text: |-
      Als water waarin het verboden is te vissen met de hengel in de periode van 1 april tot en met 31 mei, wordt
      aangewezen de in [bijlage 7][ref1] opgenomen wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0024539
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024539
  - number: '26'
    text: |-
      Als water, waarin het verboden is te vissen met enig vistuig wordt aangewezen: de Geul, bovenstrooms van de grens
      tussen de gemeenten Valkenburg en Meerssen en haar zijbeken, de Voerenbeek en de Noorbeek met dien verstande, dat
      het van 1 april tot en met 30 september toegestaan is te vissen met de hengel, voor zover deze niet is geaasd met
      worm of nabootsing daarvan.
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel26
  - number: '28'
    text: |-
      Het uitzetten van graskarpers is verboden in:

      a. beken en rivieren;

      b. wateren die geheel dan wel ten dele zijn gelegen in gebieden als bedoeld in
      [artikel 2.43, eerste lid of tweede lid, van de Omgevingswet][ref1];

      c. wateren die geheel dan wel ten dele zijn gelegen op percelen waaraan de functie natuur is toebedeeld in een
      omgevingsplan als bedoeld in [artikel 2.4 van de Omgevingswet][ref2], en

      d. overige wateren.


