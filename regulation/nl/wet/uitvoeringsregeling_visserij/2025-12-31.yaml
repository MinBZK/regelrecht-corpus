  - number: '67'
    text: |-
      1 Van het verbod, bedoeld in [artikel 32][ref1], wordt vrijstelling verleend indien de Minister:

      a. een producentenorganisatie voor het IJsselmeer heeft erkend overeenkomstig artikel 14 van de verordening;

      b. heeft vastgesteld dat het aantal bij de producentenorganisatie aangesloten producenten tenminste 59% bedraagt
      van het totaal aantal vergunninghouders, en

      c. de statuten en het huishoudelijk reglement van een erkende producentenorganisatie voor het IJsselmeer alsmede
      het door die organisatie opgestelde visplan voor het eerstvolgende visseizoen heeft goedgekeurd;

      d. en van oordeel is dat de naleving van deze regeling en van de afspraken die zijn gemaakt binnen een erkende
      producentenorganisatie voor het IJsselmeer voldoende verzekerd is.

      2 Een vrijstelling als bedoeld in het eerste lid:

      a. geldt slechts voor de bij de producentenorganisatie aangesloten producenten van wie de aansluiting dateert van
      vóór 1 januari van het jaar waarin de periode is gelegen waarop de vrijstelling betrekking heeft, en

      b. gaat in op het tijdstip dat door de Minister in de Staatscourant is bekend gemaakt.

      3 De Minister kan de in het eerste lid bedoelde vrijstelling intrekken, indien naar zijn oordeel niet langer is
      voldaan aan één of meer van de in het eerste lid, onderdelen a tot en met d, bedoelde voorwaarden.

      4 De Minister komt in ieder geval tot het oordeel dat niet langer aan het eerste lid, onderdeel d, is voldaan,
      indien het bestuur van een erkende producentenorganisatie voor het IJsselmeer naar zijn oordeel onvoldoende
      zorgdraagt voor:

      a. de controle op de naleving van het goedgekeurde visplan;

      b. de controle op de naleving door de aangeslotenen van de statuten, het huishoudelijke reglement en andere binnen
      een erkende producentenorganisatie voor het IJsselmeer gemaakte huishoudelijke afspraken;

      c. het in voorkomende gevallen overeenkomstig deze regeling wijzigen van de vergunningen, bedoeld in
      [artikel 75, derde lid][ref2], en [artikel 76, eerste lid][ref3];

      d. het voeren van een deugdelijke registratie en administratie van overdrachtstransacties van delen van
      vergunningen door aangeslotenen;

      e. het voeren van een deugdelijke administratie, waaruit te allen tijde blijkt:

      1°. wie aangeslotene is en vanaf welk tijdstip;

      2°. ten behoeve van wie een erkende producentenorganisatie voor het IJsselmeer namens de Minister een vergunning
      heeft gewijzigd, alsmede de reikwijdte van die vergunningen;

      f. het terstond berichten aan de Minister welke aangeslotenen de erkende producentenorganisatie hebben verlaten;

      g. het onverwijld doorgeven aan de Minister van elke wijziging van de statuten en huishoudelijke reglementen;

      h. het aan de Minister te allen tijd inzage geven in de gegevens, bedoeld in de onderdelen d, e, en f, en

      i. het desgevraagd onverwijld verstrekken aan de Minister van een afschrift van de in de onderdelen d, e en f
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel76
