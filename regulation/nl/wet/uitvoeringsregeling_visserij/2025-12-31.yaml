        artikel: '8'
  - number: '73'
    text: |-
      1 Een vergunning als bedoeld in [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1], wordt slechts
      verleend aan een ondernemer ten behoeve van een vissersvaartuig, dat in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie visservaartuigen 1998][ref2], staat geregistreerd.

      2 De Minister verleent aan de ondernemer die op 31 mei 1996 om 24.00 uur op grond van
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref3] gerechtigd was te vissen in
      het IJsselmeer, voor het desbetreffende vissersvaartuig een vergunning als bedoeld in van het
      [Reglement voor de binnenvisserij 1985][ref4].

      3 De reikwijdte van de vergunning, bedoeld in het tweede lid, wordt vastgesteld met inachtneming van de historische
      rechten waarover de desbetreffende ondernemer in de periode van 1 juni 1995 tot en met 31 mei 1996 op basis van
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref5] kon beschikken, met een minimum van 30 merkjes.

      4 Voor zover de vergunning, bedoeld in het tweede lid, betrekking heeft op het gebruik van het staand net, wordt
      die slechts verleend onder de beperking dat het aantal staand netten dat in een jaar mag worden ingezet ten behoeve
      van de schubvisvisserij ten hoogste het aantal is dat op basis van een dergelijke vergunning in de onmiddellijk aan
      dat jaar voorafgaande periode van zeven jaar ten hoogste als zodanig mocht worden ingezet.

      5 Indien de Minister niet binnen de in [artikel 4:13 van de Algemene wet bestuursrecht][ref6] gestelde termijn op
      een aanvraag voor een vergunning als bedoeld in het eerste lid heeft beslist en de aanvraag is in overeenstemming
      met het bepaalde in het eerste, tweede, derde en vierde lid, is de vergunning van rechtswege verleend
      overeenkomstig de aanvraag.


