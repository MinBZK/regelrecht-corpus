articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;

      b. visserijzone: in [artikel 1, vierde lid, onder a, van de wet][ref1] (Stb. 312) bedoelde zone;

      c. zeegebied: als zodanig in [artikel 1 van het Besluit aanwijzing zeegebied en kustwateren 1970][ref2] (Stb. 176)
      aangewezen wateren;

      d. kustwateren: als zodanig in [artikel 2 van het Besluit aanwijzing zeegebied en kustwateren 1970][ref3]
      aangewezen wateren;

      e. binnenwateren: wateren als bedoeld in [artikel 1, vierde lid, onderdeel d, van de wet][ref4];

      f. riviervisserij: visserij die op de Westerschelde ten oosten van de lijn van de coördinaten 51°26.57’ NB en
      003°33.07’ OL naar de coördinaten 51°24.25’ NB en 003°31.17’ OL wordt uitgeoefend;

      g. rapen: vergaren, niet zijnde het vissen met enig vistuig geschikt voor het vangen van schelpdieren;

      h. handmatig: met de hand, zonder gebruikmaking van enig hulpmiddel, dan wel louter met gebruikmaking van een riek
      of een spade;

      i. merkje: door of vanwege de Minister verstrekt, bij een vergunning behorend merkteken;

      j. verordening: verordening (EU) nr. 1379/2013 van het Europees parlement en de Raad van 11 december 2013
      houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten, tot wijziging van
      Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van de Verordening (EG) nr.
      104/2000 van de Raad;

      k. producentenorganisatie: organisatie als bedoeld in artikel 14 van de verordening;

      l. aangeslotene: aangeslotene bij een erkende producentenorganisatie voor het IJsselmeer;

      m. grote fuik: aalfuik die met behulp van stokken of palen wordt uitgezet en verbonden is aan schutwant, al dan
      niet deeluitmakend van een fuikregel;

      n. schietfuik binnenvisserij: aalfuik die door een vleugel met een tweede aalfuik wordt verbonden, welke beide
      fuiken paarsgewijs worden uitgezet;

      o. bordennet: vistuig dat bestaat uit één net dat bij het vissen wordt opengehouden door twee aan het net verbonden
      visborden;

      p. handzeef: zeef met een lengte en breedte van ten minste 80 centimeter respectievelijk 60 centimeter, in de
      lengterichting voorzien van gladde draadvormige spijlen, die op gelijke hoogte en met een onderlinge afstand van
      ten minste 7 millimeter zijn aangebracht;

      q. functionaris: functionaris als bedoeld in [artikel 1, eerste lid, van de Uitvoeringsregeling zeevisserij][ref5];

      r. visvak: in een tussen de Staat der Nederlanden en de huurder gesloten overeenkomst tot verhuur van het visrecht
      nader aangeduid visgebied, waarin op grond van deze overeenkomst met een aalfuik, staand want, hoekwant, aalkistje,
      ankerkuil of enig ander vast vistuig mag worden gevist;

      s. staatswateren: wateren waarvan de Staat der Nederlanden de eigendom heeft van de grond eronder;

      t. IJsselmeer: IJsselmeer zoals afgebakend in
      [artikel 1, tweede en derde lid, van het Reglement voor de binnenvisserij 1985][ref6];

      u. garnaal: noordzeegarnaal (Crangon crangon).

      v. spieringdrijfnet: ieder een- of meerwandig wargaren, dat bij gebruik door de stroom wordt voortbewogen, met een
      maaswijdte van 45 mm of minder;

      w. recreatieve visserij: het vissen met vaste vistuigen, waarbij de vangst uitsluitend bestemd is voor eigen
      gebruik;

      x. mosselzaadinvanginstallatie: al dan niet drijvend, aan de bodem verankerd of bevestigd vistuig, bestaande
      uit verbindingsmateriaal waaraan met het oogmerk om periodiek mosselzaad te oogsten invangsubstraat is bevestigd
      waaraan mossellarven zich kunnen hechten;

      y. vergunning voor een mosselzaadinvanginstallatie: vergunning als bedoeld in [artikel 36][ref7] voor het vissen
      met een mosselzaadinvanginstallatie;

      z. mosselperceel: perceel dat zich bevindt in een kustwater en dat bestemd is voor het kweken van mosselen;

      aa. wet: [Visserijwet 1963][ref8];

      bb. vistuig van het type staand want: kieuwnetten en warnetten als bedoeld in bijlage XI van Uitvoeringsverordening
      (EU) nr. 404/2011 van de Commissie van 8 april 2011 houdende bepalingen voor de uitvoering van [Verordening (EG)
      nr. 1224/2009](32009R1224) van de Raad tot vaststelling van een communautaire controleregeling die de naleving van
      de regels van het gemeenschappelijk visserijbeleid moet garanderen (PbEU 2011, L 112);

      cc. haven: het water dat begrensd wordt door havendammen en de uiteinden van deze dammen. De grens tussen het open
      water en de haven wordt gevormd door de lijn tussen de uiteinden van de havendammen;

      dd. effectieve visduur: de periode tussen het in het water brengen van een vistuig en het lichten daarvan;

      ee. overlevingsbun: opvangbak, ten minste een meter hoog, bestemd voor het ter verhoging van de overlevingskans
      van bijvangst in de aal- of schubvisvisserij, opvangen en automatisch sorteren van de bijvangst door middel van
      waterwervelingen, waarna terugvoer van de bijvangst plaatsvindt middels wateruitstroom door een in het water
      stekende afvoer;

      ff. coördinaten: coördinaten, uitgedrukt in lengte en breedte volgens het World Geodetic System 84 (WGS84), in
      graden en minuten;

      gg. verordening vangstmogelijkheden: verordening vangstmogelijkheden als bedoeld in
      [artikel 1, tweede lid, van de Uitvoeringsregeling zeevisserij][ref9];

      hh. kubbe: fuik met maximaal vijf hoepels, zonder vleugels of schutwant, die wordt opengehouden door hoepels
      van maximaal 60 centimeter en twee horizontaal geplaatste stokken met een inkeling in één uiteinde of aan beide
      uiteinden.


