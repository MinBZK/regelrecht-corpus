  - number: 77a
    text: |-
      Een vergunning voor een mosselzaadinvanginstallatie wordt op aanvraag door de Minister verleend aan rechthebbenden
      op een vergunning als bedoeld in [artikel 36][ref1] om met een vissersvaartuig op mosselen te vissen in de
      Waddenzee.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel36
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel77a
    references:
