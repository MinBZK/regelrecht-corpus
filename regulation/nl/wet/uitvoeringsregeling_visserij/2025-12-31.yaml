  - number: '7'
    text: |-
      1 Degene die vissen van de vissoorten alver, baars, barbeel, beekforel, blankvoorn, bot, brasem, giebel, graskarper,
      karper, kolblei, kopvoorn, kroeskarper, pos, rietvoorn, riviergrondel, rivierprik, roofblei, snoek, snoekbaars,
      spiering, winde, witvingrondel, zeelt, niet inheemse rivierkreeft en Chinese wolhandkrab aanvoert, degene die in de
      uitoefening van een beroep of bedrijf deze vissoorten afneemt en degene die bemiddeling verleent bij het veilen van
      deze vissoorten als bedoeld in [artikel 10a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1], zijn
      verplicht dagelijks een administratie bij te houden van de overdracht en de opslag van deze vissoorten.

      2 Degene die bemiddeling verleent bij het veilen van de vissoorten, genoemd in het eerste lid, is verplicht er voor
      zorg te dragen dat op bij de op de veiling aanwezige vissoorten de naam van de aanvoerder is vermeld alsmede de
      herkomst van de vissoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel10a
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: 10a
  - number: '8'
    text: |-
      1 In het geval een aanvoerder van aal als bedoeld in
      [artikel 10a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1], deze soort onder zich houdt, blijkt
      uit de administratie, bedoeld in [artikel 7, eerste lid][ref2]:

      a. de hoeveelheid;

      b. de plaats van opslag;

      c. de datum van aanvoer en de datum van verkoop;

      d. de herkomst, en

      e. de naam van de afnemer.

      2 In het geval een aanvoerder van vis meer dan 5 kilogram, die in overeenstemming met
      [artikel 7a van het Reglement voor de binnenvisserij 1985][ref3] is gevangen, onder zich houdt, als bedoeld in
      [artikel 10a, eerste lid, van het Reglement voor de binnenvisserij 1985][ref4], moet uit de administratie, bedoeld
      in [artikel 7, eerste lid][ref5], blijken:

      a. de vissoort;

      b. de hoeveelheid per vissoort;

      c. de plaats van opslag;

      d. de datum van aanvoer van de vissoorten en de datum van verkoop;

      e. de herkomst van de vissoort, en

      f. de naam van de afnemer.

      3 In het geval de vissoorten, bedoeld in het eerste en tweede lid, zonder bemiddeling van een veiling of visafslag
      worden verkocht, moet uit de administratie, bedoeld in [artikel 7, eerste lid][ref6], van de afnemer blijken:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de datum van aanvoer van de vissoorten en de datum van verkoop;

      d. de naam van de aanvoerder en diens woonadres, en

      e. de herkomst van de vissoort.

      4 In het geval de vissoorten, bedoeld in het eerste en tweede lid, via de bemiddeling van een veiling ter verkoop
      worden aangeboden, moet uit de administratie, bedoeld in [artikel 7, eerste lid][ref7], van degene die deze
      bemiddeling verleent, blijken:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerder;

      d. de naam van de afnemer;

      e. de datum van aanvoer van de vissoort en de datum van verkoop, en

      f. de herkomst van de vissoort.


