        bwb_id: BWBR0024539
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '45'
    text: |-
      Van het verbod in [artikel 19][ref1] wordt vrijstelling verleend voor zover het betreft het uitzetten of uitzaaien
      van mosselen, kokkels, oesters en Japanse oesters.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel19
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '46'
    text: |-
      De vrijstelling, bedoeld in [artikel 44][ref1], wordt slechts verleend voor zover de som van de totale breedte van
      de gebruikte mosselkorren, binnenwerks gemeten over het mes, maximaal 7,60 meter, per vissersvaartuig bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel44
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '47'
    text: |-
      Onverminderd het bepaalde in [artikel 46][ref1] is het vissen van mosselen, zeesterren en oesters, met uitzondering
      van het vissen op verwaterpercelen, verboden:

      a. tussen één uur na zonsondergang en één uur voor zonsopgang; en

      b. bij een zicht van 250 meter of minder.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel46
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel47
