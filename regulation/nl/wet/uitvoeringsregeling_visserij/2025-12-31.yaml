  - number: 28c
    text: |-
      1 Het is verboden met enig vistuig te vissen in de rivieren de Neder-Rijn, de Maas, de Lek en de Overijsselsche
      Vecht:

      a. binnen een afstand van 75 m stroomafwaarts van een stuw;

      b. in een bij een stuw aangebrachte vispassage;

      c. binnen een straal van 25 m voor de bovenmond van een bij een stuw aangebrachte vispassage.

      2 Het verbod geldt niet gedurende de tijden dat de stuw buiten werking is gesteld.
    url: https://wetten.overheid.nl/BWBR0024539/2025-12-31#Artikel28c
  - number: '29'
    text: |-
      1 Het is verboden te vissen in het IJsselmeer met:

      a. de grote fuik in de periode van 1 januari tot en met 30 april;

      b. het staand net in de periode van 16 maart tot en met 30 juni;

      c. de zegen in de periode van 16 maart tot en met 31 oktober;

      d. de schietfuik binnenvisserij in de periode van 1 oktober tot en met 30 april;

      e. het aalhoekwant in de periode van 1 november tot en met 11 april;

      f. het aalkistje in de periode van 1 november tot en met 11 april; en

      g. de aaskuil in de periode van 1 november tot en met 11 april.

      2 Het is verboden te vissen in het IJsselmeer met het staand net, het aalhoekwant of het aalkistje van
      vrijdagmiddag 16.00 uur tot de daaropvolgende maandagmorgen 8.00 uur.

      3 Het is verboden te vissen in het IJsselmeer met de aaskuil van donderdag zonsondergang tot de daaropvolgende
      maandag 8.00 uur en voorts dagelijks van zonsondergang tot de daaropvolgende morgen 8.00 uur.

      4 Het is buiten de periode, bedoeld in het eerste lid, onderdeel c, eveneens verboden met de zegen te vissen in
      het IJsselmeer op acht of meer, of ingeval van een overdracht als bedoeld in artikel 75, zesde lid, of 75a, een
      veelvoud van het aantal dagen, waarop het toegestaan is om met de zegen te vissen.

      5 Het is verboden met de zegen te vissen in het IJsselmeer op een dag waarvoor door de vergunninghouder niet ten
      minste twee werkdagen daarvoor melding is gedaan aan de minister.

      6 Voor zover nodig vanuit het oogpunt van visstandbeheer, kan de minister in de vergunning, bedoeld in
      [artikel 8 van het Reglement voor de binnenvisserij 1985][ref1], het aantal dagen waarop het is toegestaan om met
      de zegen te vissen, bedoeld in het vierde lid, voor dat visseizoen reduceren. In dat geval is het, in afwijking
      van het vierde lid, eveneens verboden om buiten de periode, bedoeld in het eerste lid, onderdeel c, met de zegen te
      vissen in het IJsselmeer op meer dagen dan het aantal dagen waarop het overeenkomstig de vergunning toegestaan is
      met de zegen te vissen.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel8
