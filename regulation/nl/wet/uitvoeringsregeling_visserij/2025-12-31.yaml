  - number: 23b
    text: |-
      1 Het is verboden te vissen in de wateren, genoemd in [bijlage 15][ref1], met de volgende vistuigen:

      a. aaldogger;

      b. aalfuik;

      c. aalhoekwant;

      d. aalkistje;

      e. aalzegen;

      f. ankerkuil;

      g. electrovisapparaat;

      h. peur;

      i. visfuik;

      j. kreeftenkorf;

      j. sleepnet;

      k. enig ander vistuig, niet zijnde een hengel, dat in hoofdzaak gebruikt wordt of bestemd is voor de vangst van aal
      of Chinese wolhandkrab.

      2 Het is verboden aal en Chinese wolhandkrab voorhanden te hebben in of in de onmiddellijke nabijheid van de
      gebieden, genoemd in [bijlage 15][ref2].

      3 Het is verboden om Chinese wolhandkrab voorhanden of in voorraad te hebben in of in de onmiddellijke nabijheid
      van de Maasvlakte 2. Chinese wolhandkrab gevangen in de Maasvlakte 2, ten westen van de lijn in de Yangtzehaven
      lopend over de punten met de coördinaten:

        - 51°58.411’ NB en 4°0.926’ OL
        - 51°58.663’ NB en 4°1.287’ OL,

      wordt onmiddellijk in hetzelfde water teruggezet.


