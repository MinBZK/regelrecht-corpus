  - number: 57a
    text: |-
      1 [Artikel 55, eerste lid][ref1], en de vrijstellingen, bedoeld in [artikel 56, eerste en tweede lid][ref2], en
      [57][ref3], gelden onder de voorwaarden dat:

      a. eidragende zeekreeften, pas verschaalde zeekreeften en zeekreeften die zijn gevangen tussen 15 juli en de
      laatste donderdag van maart, onmiddellijk na de vangst in het water worden teruggezet;

      b. door of vanwege de visrechthebbende of de houder van de schriftelijke toestemming, bedoeld in de
      [artikelen 55, eerste lid][ref4], en [56, eerste lid][ref5], op de wateren waarvoor de vrijstelling geldt, het
      aantal natuurlijke personen dat daadwerkelijk of feitelijk vist, gemiddeld niet meer bedraagt dan één persoon per
      83 hectare viswater, en

      c. hij aan de Minister opgave heeft gedaan van de namen van de personen, bedoeld in onderdeel b.

      2 Opgave van personen als bedoeld in het eerste lid, onderdeel c, geldt per kwartaal en wordt gedaan uiterlijk op
      1 januari, 1 april, 1 juli of 1 oktober voor het daaropvolgende kwartaal. De opgave kan tussentijds niet worden
      gewijzigd.

      3 In afwijking van het tweede lid, kan de Minister in bijzondere gevallen tussentijdse wijziging van de opgave
      toestaan, indien dat naar zijn oordeel aangewezen is om onevenredig nadeel te voorkomen.


