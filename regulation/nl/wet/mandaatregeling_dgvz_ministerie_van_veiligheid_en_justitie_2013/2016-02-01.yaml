preamble:
  text: |-
    Gelet op artikel 3 van de Mandaatregeling Ministerie van Veiligheid en Justitie 2011, artikel 4, eerste lid,
    onderdeel b, van het Algemeen Rijksambtenarenreglement en artikel 22, vierde lid, van de Comptabiliteitswet 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van het ingevolge
      [artikel 1 van de Mandaatregeling hoofden clusters Ministerie van Veiligheid en Justitie 2012][ref1] aan de
      directeur-generaal Vreemdelingenzaken verleende ondermandaat wordt ten aanzien van de aangelegenheden die hun
      directie, dienst, bureau of secretariaat betreffen ondermandaat verleend aan:

      a. het hoofd van het bureau Directeur-generaal Vreemdelingenzaken;

      b. het hoofd van het bureau Regie en besturing;

      c. de directeur van de directie Migratiebeleid;

      d. de directeur van de programmadirectie Identiteitsmanagement en Immigratie;

      e. de algemeen directeur van de dienst Terugkeer en Vertrek;

      f. de hoofddirecteur van de baten-lastendienst Immigratie- en Naturalisatiedienst;

      g. het hoofd van het secretariaat van de Adviescommissie voor Vreemdelingenzaken;

      h. het hoofd van het secretariaat van de Commissie Integraal Toezicht terugkeer.

      2


      [ref1]: https://wetten.overheid.nl/BWBR0032164#Artikel1
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032164
        artikel: '1'
  - number: '2'
    text: |-
      Als hoofd van dienst in de zin van
      [artikel 4, eerste lid, onderdeel b, van het Algemeen Rijksambtenarenreglement][ref1] ten aanzien van de onder
      hen ressorterende ambtenaren, worden aangewezen de ambtenaren, genoemd in kolom 1 van [bijlage 1][ref2] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037841
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037841
  - number: '3'
    text: |-
      Als bevoegd om te beschikken over bedragen voor het aangaan van verplichtingen en voor het verrichten van uitgaven,
      worden aangewezen de ambtenaren, genoemd in kolom 1 van [bijlage 2][ref1] bij deze regeling voor zover het betreft
      de bedragen, genoemd in kolom 2 van die bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0037841
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037841
  - number: '4'
    text: |-
      Aan de directeur-generaal blijft voorbehouden:

      a. de bevoegdheid om beslissingen te nemen inzake aanstelling, bevordering en ontslag van alsmede treffen van
      disciplinaire maatregelen jegens ambtenaren op managementfuncties van schaal 14 en hoger direct onder het niveau
      van het hoofd van de directie of dienst;

      b voor zover het de verlening van ondermandaat aan de in
      [artikel 1, eerste lid, onderdelen a tot en met d en g en h][ref1] genoemde ambtenaren betreft, de bevoegdheid tot
      inhuur van interim-management, organisatie- en formatieadvies, communicatieadvies en beleidsadvies.


      [ref1]: https://wetten.overheid.nl/BWBR0037841#Artikel1
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037841
        artikel: '1'
  - number: '5'
    text: |-
      De in [artikel 1, eerste lid, onderdelen e en f][ref1], genoemde ambtenaren kunnen geen ondermandaat verlenen van
      de in [artikel 4 onder b][ref2], genoemde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037841#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037841#Artikel4
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037841
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037841
        artikel: '4'
  - number: '6'
    text: |-
      De in [artikel 1, eerste lid, onderdelen e en f][ref1], genoemde ambtenaren worden aangewezen om de bevoegdheid
      tot het nemen van besluiten inzake financieel beheer en het nemen van rechtspositionele besluiten verder dan één
      hiërarchisch niveau door te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0037841#Artikel1
    url: https://wetten.overheid.nl/BWBR0037841/2016-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037841
        artikel: '1'
  - number: '7'
    text: |-
      1 Deze regeling, met uitzondering van [artikel 1, tweede lid][ref1], treedt in werking met ingang van de dag na de
      datum van uitgifte van de Staatscourant waarin zij wordt geplaatst en werkt terug tot en met 5 november 2012.

      2 [Artikel 1, tweede lid][ref2], van deze regeling treedt in werking op een bij regeling van de directeur-generaal
      Vreemdelingenzaken van het Ministerie van Veiligheid en Justitie te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0037841#Artikel1
