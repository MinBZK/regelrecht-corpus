  - number: VIII.2
    text: |-
      De [Wet op de expertisecentra][ref1] en de ter uitvoering daarvan vastgestelde voorschriften en overgangsregelingen
      zoals die luidden op 31 juli 1999, blijven van toepassing op geschillen met betrekking tot hun toepassing die op
      31 juli 1999 aanhangig waren of na die datum binnen de beroepstermijn aanhangig zijn gemaakt met betrekking tot een
      school genoemd in [artikel VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0010086#ArtikelVI
