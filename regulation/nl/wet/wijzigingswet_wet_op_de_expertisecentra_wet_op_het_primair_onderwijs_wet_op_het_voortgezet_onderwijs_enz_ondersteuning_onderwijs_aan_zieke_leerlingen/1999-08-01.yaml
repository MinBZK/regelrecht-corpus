  - number: VII.3
    text: |-
      De in het eerste en tweede lid bedoelde benoemingsverplichting geldt voor de betrekkingsomvang die voor de
      desbetreffende personeelsleden gold aan de scholen genoemd in [artikel VI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0010086
        artikel: VI
        hoofdstuk: II
  - number: VII.4
    text: |-
      Tot een bij koninklijk besluit te bepalen datum blijven voor het personeel, bedoeld in het eerste en tweede lid,
      in de nieuwe functie de regelingen met betrekking tot de rechtspositie zoals die op 31 juli 1999 voor dat personeel
      golden van overeenkomstige toepassing met uitzondering van de bepalingen die zien op de inhoud van de functie
      die zij op die datum bekleedden, met dien verstande dat die overeenkomstige toepassing in elk geval eindigt op de
      datum waarop door de schoolbegeleidingsdienst en de daarvoor in aanmerking komende personeelsorganisaties anders
      is overeengekomen. In de nieuwe functie geldt een carrièrepatroon en een maximumsalaris dat ten minste gelijk is
      aan het carrièrepatroon en het maximumsalaris dat behoorde bij de functie die het personeelslid op 31 juli 1999
      bekleedde aan de in het derde lid bedoelde school.
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVII
  - number: VIII.1
    text: |-
      De vaststelling en afrekening van de vergoedingen voor de periode voorafgaand aan 1 januari 1999 ten behoeve van
      een school genoemd in [artikel VI][ref1] geschieden overeenkomstig de [Wet op de expertisecentra][ref2] en de ter
      uitvoering daarvan vastgestelde voorschriften zoals die golden voor het jaar waarop de afrekening betrekking heeft.
      De vaststelling en afrekening van de vergoedingen voor de periode van 1 januari 1999 tot en met 31 juli 1999 van
      de scholen, bedoeld in de vorige volzin, geschieden overeenkomstig de [Wet op de expertisecentra][ref3] en de ter
      uitvoering daarvan vastgestelde voorschriften zoals die luidden op 31 juli 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVIII
