  - number: VII.2
    text: |-
      Indien een schoolbegeleidingsdienst uitgaat van een andere rechtspersoon dan de gemeente ontvangt de gemeente de
      specifieke uitkering bedoeld in [artikel IX][ref1] van deze wet uitsluitend indien de gemeente de uitkering aan
      die andere rechtspersoon toekent onder de voorwaarde dat die rechtspersoon op de aan deze specifieke uitkering
      gerelateerde formatieplaatsen personeel benoemt, dat op 31 juli 1999 was benoemd aan een of meer van de scholen
      genoemd in [artikel VI][ref2], tenzij die rechtspersoon aantoont dat met betrekking tot een formatieplaats geen lid
      van dat personeel beschikbaar was dat de formatieplaats aanvaardde.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
      [ref2]: https://wetten.overheid.nl/BWBR0010086#ArtikelVI
