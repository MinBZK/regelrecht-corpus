  - number: IX.2
    text: |-
      De hoogte van de specifieke uitkering voor de gemeente wordt bepaald op basis van het totale aantal leerlingen
      dat op 1 oktober 1996 op de scholen, bedoeld in de [Wet op het basisonderwijs][ref1], de scholen en instellingen,
      bedoeld in de[ Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2] en de scholen,
      bedoeld in de[ Wet op het voortgezet onderwijs][ref3] stond ingeschreven vermeerderd met het aantal leerlingen dat
      op 1 oktober 1996 op de beroepsopleiding van een instelling bedoeld in de[ Wet educatie en beroepsonderwijs][ref4]
      stond ingeschreven en bij de start van die opleiding leerplichtig was, in elke gemeente en een bedrag per
      leerling. Indien het aantal leerlingen in een gemeente na 1 oktober 1996 is veranderd of verandert als gevolg van
      een wijziging van de grenzen van de desbetreffende gemeente kan Onze minister met het oog op de berekening in de
      vorige volzin het aantal leerlingen in overeenstemming brengen met het aantal leerlingen bij de aanvang van het
      kalenderjaar na dat waarin de grenzen zijn gewijzigd. Indien het aantal leerlingen in een gemeente, anders dan door
      een wijziging van de grenzen van die gemeente, op 1 oktober van een van de jaren 1997, 1998, 1999 of 2000 toeneemt
      met een aantal dat uitkomt boven een door Onze Minister vast te stellen percentage van het totale aantal leerlingen
      per 1 oktober 1996, wordt het aantal leerlingen boven dat percentage voor het desbetreffende jaar meegeteld als
      leerling bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelIX
