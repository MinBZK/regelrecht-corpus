  - number: IX.1
    text: |-
      Onverminderd [artikel VII][ref1] wordt voor de periode van 1 augustus 1999 tot 1 augustus 2003 uit 's Rijks kas
      jaarlijks een specifieke uitkering verstrekt aan de gemeente ter tegemoetkoming in de kosten van ondersteuning
      bij het onderwijs aan zieke leerlingen als bedoeld in de [artikelen 9a van de Wet op het primair onderwijs][ref2],
      [18a van de Wet op de expertisecentra][ref3], [18][ref4] en [138a van de Wet op het voortgezet onderwijs][ref5] en
      [7.1.4. van de Wet educatie en beroepsonderwijs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelVII
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel18a
