  - number: X.1
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarover de specifieke uitkering is
      toegekend, legt het gemeentebestuur een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] over aan Onze Minister van Onderwijs,
      Cultuur en Wetenschappen, waaruit blijkt in hoeverre de toegekende uitkering is besteed in overeenstemming met de
      bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: X.2
    text: |-
      Indien de in het eerste lid bedoelde gegevens met betrekking tot de schoolbegeleidingsdienst voldoende blijken uit
      de vastgestelde rekening van de gemeente, kan worden volstaan met de toezending aan Onze Minister van de rekening,
      voorzien van een verklaring als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelX
  - number: X.3
    text: |-
      Voor zover niet uit de verklaring, bedoeld in het eerste lid, of uit de rekening, bedoeld in het tweede lid,
      blijkt dat de uitkering is besteed in overeenstemming met de bepalingen van deze wet, vordert Onze Minister het
      desbetreffende bedrag terug.
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelX
  - number: XI
    text: |-
      Het instellingsbestuur van een academisch ziekenhuis informeert Onze Minister van
      Onderwijs, Cultuur en Wetenschappen binnen 6 maanden na de datum van de inwerkingtreding
      van deze wet over de wijze waarop invulling is gegeven aan de taak bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: XIII
    text: Deze wet treedt in werking met ingang van 1 augustus 1999.
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelXIII
