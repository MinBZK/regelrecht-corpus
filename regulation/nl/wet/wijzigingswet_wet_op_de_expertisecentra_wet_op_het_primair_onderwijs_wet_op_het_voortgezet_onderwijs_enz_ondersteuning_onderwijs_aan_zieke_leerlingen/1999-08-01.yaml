preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is deWet op de expertisecentra, deWet op het primair
    onderwijs, deWet op het voortgezet onderwijs, de Wet educatie en beroepsonderwijs en de Wet op het hoger onderwijs
    en wetenschappelijk onderzoek te wijzigen teneinde vanwege het teruglopend aantal leerlingen van ziekenhuisscholen
    over te gaan tot het beëindigen van de bekostiging van ziekenhuisscholen en zorg te dragen voor de ondersteuning
    bij het onderwijs aan leerlingen van scholen in de zin van de Wet op het primair onderwijs, scholen en instellingen
    in de zin van de Wet op de expertisecentra, scholen in de zin van de Wet op het voortgezet onderwijs en
    instellingen voor beroepsonderwijs in de zin van deWet educatie en beroepsonderwijs, die ziek zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelAanhef
articles:
  - number: VI.1
    text: |-
      Met ingang van 1 augustus 1999 eindigt de bekostiging van de «Dokter Frankschool» te Santpoort Zuid, de
      «ziekenhuisschool Rotterdam en omstreken» te Rotterdam, de «ziekenhuisschool Zuid Holland West» te Leiden, de
      «school voor zieke kinderen» te Groningen, de «ziekenhuisschool Drenthe» te Emmen, de «ziekenhuisschool Friesland»
      te Leeuwarden, de «ziekenhuisschool Utrecht» te Utrecht, de «ziekenhuisschool Oost Nederland» te Hengelo, de«
      Radboudschool voor zieke kinderen» te Nijmegen en de «Rooms Katholieke ziekenhuisschool Limburg» te Sittard en
      worden de «openbare school voor kinderen die zijn opgenomen in het ziekenhuis» te Alkmaar en de «ziekenhuisschool
      Amsterdam genoemd A.D. Holterman» te Amsterdam opgeheven.
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVI
  - number: VI.2
    text: |-
      [Artikel 150 van de Wet op de expertisecentra][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel150
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '150'
  - number: VII.1
    text: |-
      Indien een schoolbegeleidingsdienst, bedoeld in [artikel 179 van de Wet op het primair onderwijs][ref1],
      [artikel 165 van de Wet op de expertisecentra][ref2] en [artikel 280 van de Wet op het voortgezet onderwijs][ref3],
      uitgaat van de gemeente ontvangt de gemeente de specifieke uitkering, bedoeld in [artikel IX][ref4] van deze
      wet uitsluitend indien de gemeente op de aan deze specifieke uitkering gerelateerde formatieplaatsen personeel
      benoemt, dat op 31 juli 1999 was benoemd aan een of meer van de scholen genoemd in [artikel VI][ref5], tenzij de
      schoolbegeleidingsdienst aantoont dat met betrekking tot een formatieplaats geen lid van dat personeel beschikbaar
      was dat de formatieplaats aanvaardde.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel280
      [ref4]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
      [ref5]: https://wetten.overheid.nl/BWBR0010086#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0010086/1999-08-01#ArtikelVII
