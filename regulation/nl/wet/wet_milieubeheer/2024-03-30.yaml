  - number: 19.1b.2
    text: |-
      Nadat een beschikking krachtens een in het eerste lid genoemde wet tot verlening of wijziging van een vergunning
      die betrekking heeft op een installatie als bedoeld in [Richtlijn 2010/75](32010L0075)/EU van het Europees
      Parlement en de Raad van 24 november 2010 inzake industriële emissies (geïntegreerde preventie en bestrijding van
      verontreiniging) (PbEU 2010, L 334) onherroepelijk is geworden, doet het bevoegd gezag daarvan in afwijking van het
      eerste lid mededeling in het publicatieblad van het openbaar lichaam waartoe het behoort.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1b
  - number: 19.1c
    text: |-
      Onverminderd de [artikelen 3.1][ref1] en [3.3 van de Wet open overheid][ref2] verstrekt een bestuursorgaan uit
      eigen beweging informatie over de openbare verantwoordelijkheden en functies die het heeft alsmede de openbare
      diensten die het verleent met betrekking tot het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1c
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '3'
  - number: 19.2.1
    text: |-
      In het geval van een gebeurtenis waardoor een onmiddellijke bedreiging van het leven of de gezondheid van personen,
      van het milieu of van grote materiële belangen is ontstaan, verstrekt de burgemeester voor zover deze informatie
      niet reeds ingevolge [artikel 7 van de Wet veiligheidsregio’s][ref1] of een ander wettelijk voorschrift moet
      worden verstrekt, aan de personen die getroffen kunnen worden, terstond op passende wijze alle informatie over
      de maatregelen die zijn getroffen ter voorkoming en beperking van de bedreiging en de daaruit voortvloeiende
      nadelige gevolgen en de daartoe door die personen te volgen gedragslijn. In geval van een situatie als bedoeld
      in [artikel 39 van de Wet veiligheidsregio’s][ref2] wordt de informatie verstrekt door de voorzitter van de
      veiligheidsregio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '39'
  - number: 19.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven over de gevallen waarin ingevolge het
      eerste lid informatie wordt verstrekt, over de inhoud van de te verstrekken informatie en over de wijze waarop de
      informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.2
  - number: 19.3.1
    text: |-
      Indien in een stuk ten aanzien waarvan bij of krachtens deze wet of door [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] openbaarmaking wordt voorgeschreven, milieu-informatie
      voorkomt of uit zodanig stuk milieu-informatie kan worden afgeleid, waarvan de geheimhouding op grond van
      [artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref3] gerechtvaardigd is, kan het bevoegd gezag
      op een daartoe strekkend schriftelijk verzoek van de belanghebbende toestaan dat deze ten behoeve van de
      openbaarmaking een, door het bevoegd gezag goedgekeurde, tweede tekst overlegt, waarin die informatie niet
      voorkomt, onderscheidenlijk waaruit deze niet kan worden afgeleid. Het bevoegd gezag maakt van deze bevoegdheid
      slechts gebruik met betrekking tot bedrijfsgeheimen en beveiligingsgegevens. Bij een algemene maatregel van bestuur
      krachtens deze wet kunnen ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend
      besluit van een volkenrechtelijke organisatie gegevens worden aangewezen waarvoor de in de eerste volzin bedoelde
      bevoegdheid eveneens geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.3
    references:
