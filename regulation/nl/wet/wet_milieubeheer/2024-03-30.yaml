  - number: 19.6a
    text: |-
      De [artikelen 19.3 tot en met 19.5][ref1] zijn van overeenkomstige toepassing op gegevens die voorkomen in een stuk
      ten aanzien waarvan openbaarmaking wordt voorgeschreven of die uit zodanig stuk kunnen worden afgeleid en die niet
      als milieu-informatie zijn te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.6b
    text: |-
      Indien bij de voorbereiding van een besluit als bedoeld in [artikel 16.43, eerste lid, van de Omgevingswet][ref1]
      bij de voorbereiding waarvan een milieueffectrapport moet worden gemaakt, dan wel van een besluit inzake een
      omgevingsvergunning voor een milieubelastende activiteit, ingevolge een wettelijk voorschrift of een besluit van
      het bevoegd gezag informatie openbaar wordt gemaakt, en dat wettelijk voorschrift of besluit zich op andere gronden
      dan voorzien in [artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref2] tegen de openbaarmaking verzet,
      is [artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref3] van overeenkomstige toepassing en blijft
      het wettelijk voorschrift of besluit dat zich tegen de openbaarmaking verzet, buiten toepassing. Indien milieu-
      informatie niet ter inzage wordt gelegd, wordt daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.6b
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 19.7.1
    text: |-
      Indien in een emissieverslag als bedoeld in [artikel 16.1][ref1] of een elektriciteitsemissieverslag als
      bedoeld in [artikel 16a.1][ref2] of een industrieel emissieverslag als bedoeld in [artikel 16b.1][ref3] milieu-
      informatie voorkomt of milieu-informatie daaruit kan worden afgeleid, waarvan de geheimhouding op grond van
      [artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref4] gerechtvaardigd is, kan het bestuur van de
      emissieautoriteit op een daartoe strekkend verzoek van degene die de inrichting drijft, toestaan dat een door het
      bestuur van de emissieautoriteit goedgekeurde, tweede tekst openbaar wordt gemaakt, waarin die informatie niet
      voorkomt, onderscheidenlijk waaruit die informatie niet kan worden afgeleid. Het bestuur van de emissieautoriteit
      maakt van deze bevoegdheid slechts gebruik met betrekking tot bedrijfsgeheimen en beveiligingsgegevens. Het in de
      eerste volzin bedoelde verzoek wordt gedaan uiterlijk drie maanden na afloop van het verslagjaar. Bij het verzoek
      wordt een tweede tekst overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
      [ref4]: https://wetten.overheid.nl/BWBR0045754#Artikel5
