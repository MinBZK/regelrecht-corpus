  - number: '18.17'
    text: |-
      Indien binnen een periode van vier jaar aan een persoon tweemaal voor eenzelfde feit een bestuurlijke boete
      als bedoeld in [artikel 18.16a][ref1] is opgelegd en de betrokken boeten binnen die periode onherroepelijk zijn
      geworden, kan het bestuur van de emissieautoriteit de vergunning, bedoeld in [artikel 16.5][ref2], die de betrokken
      persoon houdt, intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.17
