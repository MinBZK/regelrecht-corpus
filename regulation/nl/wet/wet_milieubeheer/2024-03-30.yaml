  - number: 2.16.2
    text: |-
      Bij het verstrekken van de in het eerste lid bedoelde gegevens wordt waar nodig aangegeven welke gegevens een
      vertrouwelijk karakter dragen. Dit vertrouwelijk karakter kan voortvloeien uit de aard van de gegevens, dan wel uit
      het feit dat personen deze aan de bestuursorganen, bedoeld in het eerste lid, hebben verstrekt onder het beding dat
      zij als vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.16
  - number: 2.16a
    text: |-
      Onverminderd [artikel 16.8][ref1] stemmen het bestuur van de emissieautoriteit en het bestuursorgaan dat
      bevoegd is een omgevingsvergunning te verlenen voor een milieubelastende activiteit met betrekking tot een
      broeikasgasinstallatie als bedoeld in [artikel 16.1, tweede lid][ref2], onderling de uitoefening van de taken af,
      waarmee zij zijn belast bij of krachtens de [hoofdstukken 16][ref3] en [18][ref4] van deze wet, onderscheidenlijk
      de [afdelingen 4.1][ref5], [5.1][ref6], [16.1][ref7], [16.2][ref8], [16.3][ref9], [16.5][ref10] en [16.8][ref11] en
      [hoofdstuk 18 van de Omgevingswet][ref12].


