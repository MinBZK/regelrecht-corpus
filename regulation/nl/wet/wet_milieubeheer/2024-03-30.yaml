        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.39i.1
    text: |-
      Vliegtuigexploitanten brengen eenmaal per jaar en overeenkomstig het door de Europese Commissie op grond van
      artikel 14, vijfde lid, van de EG-richtlijn handel in broeikasgasemissierechten vastgestelde monitorings-,
      rapportage- en verificatiekader bij het bestuur van de emissieautoriteit verslag uit over de niet-CO-effecten die
      zich vanaf 1 januari 2025 voordoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39i
  - number: 16.39i.2
    text: |-
      Het bestuur van de emissieautoriteit legt een aanvraag van een vliegtuigexploitant die voldoet aan de in artikel
      14, zesde lid, laatste alinea, van de EG-richtlijn handel in broeikasgasemissierechten vermelde vereisten om
      een ontheffing van de publicatie van de op grond van artikel 14, zesde lid, onderdelen a en b, van de genoemde
      richtlijn geaggregeerde jaarlijkse emissie gerelateerde gegevens voor aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39i
  - number: 16.39j.1
    text: 'Een vliegtuigexploitant kan het bestuur van de emissieautoriteit verzoeken om kosteloze toewijzing van:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.1.a
    text: |-
      broeikasgasemissierechten voor de periode van 1 januari 2024 tot en met 31 december 2025. Het bestuur van de
      emissieautoriteit verleent uiterlijk op 30 juni van elk kalenderjaar binnen die periode aan een vliegtuigexploitant
      het aantal emissierechten dat hem krachtens dit onderdeel is toegewezen en maakt hier melding van in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.1.b
    text: |-
      broeikasgasemissierechten met betrekking tot de in artikel 3 quater, zesde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten genoemde brandstoffen voor de periode van 1 januari 2024 tot en met 31 december 2030.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.2
    text: |-
      Bij de aanvraag als bedoeld in het eerste lid, onderdeel a worden geverifieerde emissies overgelegd over de
      in bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten opgenomen luchtvaartactiviteiten die de
      vliegtuigexploitant in het referentiejaar heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.3
    text: 'De overgelegde geverifieerde emissies zijn bepaald en geregistreerd:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.3.a
    text: |-
      overeenkomstig een plan dat een beschrijving bevat van de wijze waarop de geverifieerde emissies worden bepaald,
      geregistreerd en bewaard;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.3.b
    text: met inachtneming van de krachtens het zevende lid, aanhef en onder a en b, gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.4
    text: |-
      Het plan, bedoeld in het derde lid, onder a, is goedgekeurd door het bestuur van de emissieautoriteit.
      [Artikel 16.39d][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2.2
        afdeling: 16.2.2
  - number: 16.39j.5
    text: |-
      Bij de aanvraag als bedoeld in het eerste lid, onderdeel b, berekent het bestuur van de emissieautoriteit het
      kostenverschil met toepassing van de door de Europese Commissie op grond van artikel 3 quater, zesde lid, van de
      EG-richtlijn handel in broeikasgasemissierechten vastgestelde regels voor de jaarlijkse berekening van genoemd
      kostenverschil en verleent aan een vliegtuigexploitant het aantal emissierechten dat hem krachtens genoemd
      onderdeel is toegewezen en maakt hier melding van in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.6
    text: |-
      De aanvraag wordt ten aanzien van de in het eerste lid, onderdeel a, bedoelde periode ingediend op uiterlijk
      31 maart van elk kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7
    text: 'Bij ministeriële regeling kunnen ter uitvoering van dit artikel regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.a
    text: de wijze waarop een tonkilometer wordt berekend;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.b
    text: het bepalen en registreren van geverifieerde emissies;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.c
    text: het indienen van een ontwerp van een plan als bedoeld in het derde lid, onder a;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.d
    text: het goedkeuren van een plan als bedoeld in het derde lid, onder a;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.e
    text: het actualiseren van een plan als bedoeld in het derde lid, onder a;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.f
    text: het melden van veranderingen en afwijkingen van een plan als bedoeld in het derde lid, onder a;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39j.7.g
    text: |-
      de wijze waarop een aanvraag om toewijzing van emissierechten dient te worden gedaan en de gegevens die door de
      aanvrager dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39j
  - number: 16.39k
    text: |-
      Het bestuur van de emissieautoriteit legt aanvragen die tijdig zijn ingediend en voldoen aan
      [artikel 16.39j, derde lid][ref1] voor wat betreft de eisen waaraan de onafhankelijke deskundige moet voldoen, voor
      aan de Commissie van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2.3
        afdeling: 16.2.2
  - number: 16.39m
    text: |-
      Voor de jaren 2024 en 2025 wordt van het totale aantal broeikasgasemissierechten voor de luchtvaart, bedoeld in
      artikel 3 quater, vijfde en zevende lid, van de EG-richtlijn handel in broeikasgasemissierechten, een gedeelte
      geveild. Het te veilen gedeelte wordt vastgesteld met toepassing van de in artikel 3 quinquies, eerste lid, van de
      genoemde richtlijn vermelde methode.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39m
  - number: 16.39sa.1
    text: |-
      Het is vliegtuigexploitanten die over een door Nederland afgegeven bewijs luchtvaartexploitant beschikken of in
      Nederland geregistreerd zijn toegestaan om overeenkomstig artikel 11 bis, eerste lid, van de EG-richtlijn handel
      in broeikasgasemissierechten de door de ICAO-raad aanvaarde eenheden te annuleren met betrekking tot de door het
      bestuur van de emissieautoriteit overeenkomstig artikel 12, zesde lid, van de genoemde richtlijn vastgestelde
      compensatievereisten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sa
  - number: 16.39sa.2
    text: |-
      Vliegtuigexploitanten annuleren de in het eerste lid vermelde eenheden met betrekking tot de door het bestuur van
      de emissieautoriteit vastgestelde compensatievereisten:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sa
  - number: 16.39sa.2.a
    text: uiterlijk op 31 januari 2025 voor emissies in de periode van 1 januari 2021 tot en met 31 december 2023;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sa
  - number: 16.39sa.2.b
    text: uiterlijk op 31 januari 2028 voor emissies in de periode van 1 januari 2024 tot en met 31 december 2026.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sa
  - number: 16.39sb.1
    text: |-
      De in deze wet overeenkomstig de EG-richtlijn handel in broeikasgasemissierechten vastgestelde vereisten aangaande
      het inleveren van monitoringsplannen en het monitoren en rapporteren van emissies zijn vervuld:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.1.a
    text: |-
      voor ieder kalenderjaar in de periode van 1 januari 2021 tot en met 31 december 2026 met betrekking tot vluchten
      tussen een luchthaven in Nederland en een luchthaven in een land buiten de gebieden waarop de Overeenkomst
      betreffende de Europese Economische Ruimte van toepassing is en waarmee overeenkomstig artikel 25 of 25 bis van de
      genoemde richtlijn een overeenkomst gesloten is met uitzondering van vluchten tussen een luchthaven in Nederland en
      een luchthaven in het Verenigd Koninkrijk en Zwitserland;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.1.b
    text: |-
      voor ieder kalenderjaar in de periode van 1 januari 2013 tot en met 31 december 2023 met betrekking tot vluchten
      tussen een luchthaven in Nederland en een luchthaven in een ultraperifeer gebied van een andere lidstaat als
      vermeld in artikel 349 van het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.2
    text: |-
      Bij de toepassing van het eerste lid, onderdelen a en b, wordt de door de Europese Commissie overeenkomstig artikel
      28 ter van de EG-richtlijn handel in broeikasgasemissierechten gepleegde evaluatie in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.3
    text: |-
      Vliegtuigexploitanten zijn vrijgesteld van het inleveren van door de ICAO-raad aanvaarde eenheden voor vluchten
      tussen Nederland en de minst ontwikkelde landen en kleine eilandstaten in ontwikkeling zoals gedefinieerd door
      de Verenigde Naties met uitzondering van landen met een bruto binnenlands product per hoofd van de bevolking dat
      gelijk is aan of groter is dan het gemiddelde van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.4
    text: |-
      Voor de periode tot en met 31 december 2026 zijn vliegtuigexploitanten vrijgesteld van het inleveren van door de
      ICAO-raad aanvaarde eenheden voor vluchten:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.4.a
    text: |-
      tussen Nederland en landen en kleine eilandstaten in ontwikkeling die zijn opgenomen in de door de Europese
      Commissie overeenkomstig artikel 25 bis, derde lid, van de EG-richtlijn handel in broeikasgasemissierechten
      vastgestelde uitvoeringshandeling;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.4.b
    text: |-
      tussen Nederland en landen buiten de gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is en die niet zijn opgenomen in de in onderdeel a genoemde uitvoeringshandeling met uitzondering van
      het Verenigd Koninkrijk en Zwitserland.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sb.5
    text: |-
      Bij de toepassing van [afdeling 16.2.4][ref1] van deze wet en de bepalingen aangaande het monitoren en rapporteren
      van emissies en het inleveren en annuleren van door de ICAO-raad aanvaarde eenheden worden de emissies van vluchten
      anders dan de vluchten vermeld in het eerste lid, onderdelen a en b, beschouwd als geverifieerde emissies van de
      vliegtuigexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        afdeling: 16.2.4
  - number: 16.39sb.6
    text: |-
      Voor de periode van 1 januari 2013 tot en met 31 december 2026 wordt het totale aantal emissierechten dat geveild
      wordt verminderd met de toegewezen emissierechten voor vluchten vermeld in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sb
  - number: 16.39sc
    text: |-
      Bij ministeriële regeling worden overeenkomstig artikel 11 bis, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten regels gesteld met betrekking tot het gebruik van de door de ICAO-raad aanvaarde
      eenheden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sc
  - number: 16.39sd.1
    text: Het bestuur van de emissieautoriteit stelt de CORSIA-nalevingsperiodes vast.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.2
    text: |-
      Met toepassing van de door de Europese Commissie overeenkomstig artikel 12, achtste lid, van de EG-richtlijn handel
      in broeikasgasemissierechten vastgestelde methode berekent het bestuur van de emissieautoriteit:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.2.a
    text: jaarlijks de voorlopige compensatievereisten; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.2.b
    text: de definitieve compensatievereisten aan het einde van de in het eerste lid genoemde nalevingsperiodes.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.3
    text: 'Het bestuur van de emissieautoriteit maakt uiterlijk op 30 november:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.3.a
    text: |-
      van elk kalenderjaar melding van de in het tweede lid, onderdeel a, genoemde voorlopige compensatievereisten aan
      vliegtuigexploitanten die aan de in artikel 12, zesde lid, onderdelen a en b, van de genoemde richtlijn vermelde
      voorwaarden voldoen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39sd.3.b
    text: |-
      van het jaar volgend op het laatste jaar van de in het eerste lid genoemde nalevingsperiodes melding van de in het
      tweede lid, onderdeel b, genoemde definitieve compensatievereisten aan vliegtuigexploitanten die aan de in artikel
      12, zesde lid, onderdelen a en b, van de genoemde richtlijn vermelde voorwaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39sd
  - number: 16.39t.1
    text: |-
      Een vliegtuigexploitant levert met betrekking tot ieder kalenderjaar voor 1 oktober van het daarop volgende
      kalenderjaar ten minste een aantal broeikasgasemissierechten in, dat overeenkomt met de hoeveelheid van de emissie
      gedurende het eerstbedoelde kalenderjaar van in bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten
      opgenomen luchtvaartactiviteiten waarvoor die vliegtuigexploitant verantwoordelijk is en die op of na 1 januari
      2012 hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.2
    text: |-
      Een scheepvaartmaatschappij levert met betrekking tot ieder kalenderjaar voor 1 oktober van het daarop volgende
      kalenderjaar ten minste een aantal broeikasgasemissierechten in dat overeenkomt met de hoeveelheid van de totale
      emissie gedurende het eerstbedoelde kalenderjaar, zoals geverifieerd overeenkomstig de Verordening monitoring,
      rapportage en verificatie van broeikasgasemissies door maritiem vervoer en zoals berekend volgens het door de
      Commissie vastgestelde model-emissieverslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.3
    text: |-
      Ter bepaling van de hoeveelheid van de emissie, bedoeld in het tweede lid, worden de gegevens in acht genomen,
      die overeenkomstig de Verordening EU-register handel in emissierechten in het EU-register voor de handel in
      emissierechten zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.4
    text: 'De in het tweede lid bedoelde emissierechten worden overeenkomstig het volgende schema ingeleverd:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.4.a
    text: 40% van de voor 2024 gerapporteerde geverifieerde emissies;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.4.b
    text: 70% van de voor 2025 gerapporteerde geverifieerde emissies;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.4.c
    text: 100% van de geverifieerde emissies die zijn gerapporteerd voor 2026 en elk daaropvolgend jaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.5
    text: |-
      In afwijking van het tweede en vierde lid mag een scheepvaartmaatschappij tot 31 december 2030 5% minder
      emissierechten inleveren dan de geverifieerde emissies voor schepen met ijsklasse 1A of 1A super of een
      gelijkwaardige ijsklasse, zoals vastgesteld op basis van aanbeveling 25/7 van de Commissie ter bescherming van het
      mariene milieu van het Oostzeegebied.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.6
    text: |-
      Een scheepvaartmaatschappij voldoet tot 31 december 2030 aan de eisen bedoeld in het tweede lid indien een
      uitvoeringshandeling van de Europese Commissie als bedoeld in artikel 12, derde lid quinqies, derde lid quater en
      derde lid ter, van de EG-richtlijn handel in broeikasgasemissierechten dat bepaalt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.7
    text: |-
      Indien de eindverantwoordelijkheid voor de aankoop van de brandstof of de exploitatie van een schip op grond
      van een contractuele regeling berust bij een ander dan de emissiegerechtigde scheepvaartmaatschappij, heeft die
      scheepvaartmaatschappij recht op terugbetaling door die ander van de kosten die voortvloeien uit het inleveren van
      de in het tweede en vierde lid bedoelde emissierechten door de emissiegerechtigde scheepvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
  - number: 16.39t.9
    text: |-
      [Artikel 16.37, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39t
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.39v
    text: |-
      [Artikel 16.36][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39v
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.39w
    text: |-
      Indien een vliegtuigexploitant ter voldoening aan [artikel 16.39t, eerste lid][ref1] of een scheepvaartmaatschappij
      ter voldoening aan artikel 16.39t, tweede lid, minder broeikasgasemissierechten heeft ingeleverd dan overeenkomt
      met de hoeveelheid van de emissie, die hij gedurende het betrokken kalenderjaar heeft veroorzaakt, wordt het aantal
      broeikasgasemissierechten dat hij in het daarop volgende kalenderjaar ter uitvoering van dat artikellid dient in te
      leveren, van rechtswege verhoogd met het aantal broeikasgasemissierechten dat hij te weinig had ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39w
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2.4
        afdeling: 16.2.2
  - number: 16.39x.1
    text: Deze afdeling is van toepassing op gereglementeerde entiteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39x
  - number: 16.39x.2
    text: |-
      Voor de toepassing van deze afdeling wordt onder «brandstof» verstaan: elk energieproduct, bedoeld in artikel
      2, eerste lid, van [Richtlijn 2003/96](32003L0096) van de Raad van 27 oktober 2003 tot herstructurering van de
      communautaire regeling voor de belasting van energieproducten en elektriciteit (PbEU 2003, L283), met inbegrip van
      de brandstoffen die zijn vermeld in tabel A en tabel C van bijlage I bij die richtlijn, alsmede elk ander product
      dat voor gebruik bedoeld is, als motor-of verwarmingsbrandstof te koop wordt aangeboden of wordt gebruikt als
      bedoeld in artikel 2, derde lid, van die richtlijn, ook voor de productie van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39x
  - number: 16.39y
    text: |-
      De rijksbelastingdienst en de netbeheerder voor gas als bedoeld in [artikel 1, eerste lid, van de Gaswet][ref1]
      verstrekken op verzoek het bestuur van de emissieautoriteit de bij ministeriële regeling vast te stellen gegevens,
      voor zover die gegevens voor de uitvoering van deze afdeling noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39y
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 16.39z
    text: |-
      Het is vanaf 1 januari 2025 verboden om zonder vergunning van het bestuur van de emissieautoriteit de bij algemene
      maatregel van bestuur aangewezen activiteiten uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39z
  - number: 16.39aa.1
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot inhoud van de vergunning, de wijze waarop de
      aanvraag om een vergunning moet geschieden, de gegevens die door de aanvrager moeten worden verstrekt met het oog
      op de beslissing op de aanvraag, en de wijze waarop die gegevens moeten worden verkregen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aa
  - number: 16.39aa.2
    text: |-
      Op de vergunningverlening zijn de [artikelen 16.7][ref1], [16.9][ref2], [16.10][ref3] en [16.11][ref4] van
      overeenkomstige toepassing met dien verstande dat telkens voor «broeikasgasinstallatie» en «exploitant van de
      broeikasgasinstallatie» wordt gelezen «gereglementeerde entiteit».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aa
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.39ab.1
    text: |-
      Het bestuur van de emissieautoriteit kan de vergunning wijzigen of aanvullen, de daaraan verbonden voorschriften
      wijzigen, aanvullen of intrekken of voorschriften aan de vergunning verbinden, indien dit naar zijn oordeel nodig
      is in het belang van de goede werking van het systeem van handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ab
  - number: 16.39ab.2
    text: |-
      Op aanvraag van de vergunninghouder kan het bestuur van de emissieautoriteit de vergunning en de daaraan verbonden
      voorschriften wijzigen, aanvullen of intrekken of voorschriften aan de vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ab
  - number: 16.39ab.3
    text: |-
      De verplichting tot het indienen van een emissieverslag blijft voor wat betreft het kalenderjaar waarin de
      beschikking tot intrekking van de vergunning van kracht is geworden, na intrekking van de vergunning op de
      laatste houder daarvan rusten, totdat aan die verplichting is voldaan, tenzij in het gehele jaar van intrekking de
      gereglementeerde entiteit geen activiteiten verricht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ab
  - number: 16.39ab.4
    text: |-
      Met betrekking tot de beslissing op grond van het eerste lid zijn de [artikelen 16.7][ref1], [16.9][ref2] en
      [16.11][ref3] en met betrekking tot de beslissing op grond van het tweede lid de [artikelen 16.39aa][ref4], 16.7,
      [16.9 tot en met 16.12][ref5] van overeenkomstige toepassing met dien verstande dat telkens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ab
    references:
