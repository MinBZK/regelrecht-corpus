  - number: 19.3.2
    text: |-
      Indien in een stuk ten aanzien waarvan bij of krachtens deze wet of door [afdeling 3.4][ref1]
      of [3.6 van de Algemene wet bestuursrecht][ref2] openbaarmaking wordt voorgeschreven, milieu-
      informatie voorkomt of uit zodanig stuk milieu-informatie kan worden afgeleid, waarvan de
      openbaarmaking achterwege dient te blijven, onderscheidenlijk achterwege mag blijven, op grond van
      __REF002___________________________________________________________________________________________________________
      ___________, wordt op aanwijzing van Onze betrokken Minister ten behoeve van de openbaarmaking een tweede tekst
      overgelegd, waarin die informatie niet voorkomt, onderscheidenlijk waaruit deze niet kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.3
