  - number: 16.39ae.3.a
    text: |-
      voor «broeikasgasinstallatie» en «exploitant van de broeikasgasinstallatie» wordt gelezen «gereglementeerde
      entiteit»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ae
  - number: 16.39ae.3.b
    text: |-
      voor «[artikel 16.5][ref1]» wordt gelezen «[artikel 16.39z][ref2]»;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
