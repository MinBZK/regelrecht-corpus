  - number: 16.39h.2.a
    text: |-
      voor «Verordening monitoring en rapportage emissiehandel» en «Verordening verificatie en accreditatie
      emissiehandel» wordt gelezen «Verordening monitoring, rapportage en verificatie van broeikasgasemissies door
      maritiem vervoer»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39h
  - number: 16.39h.2.b
    text: |-
      in [artikel 16.13][ref1] voor «vergunninghouder» wordt gelezen «scheepvaartmaatschappij»; en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39h
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
