        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
  - number: 16a.2.1
    text: |-
      Dit hoofdstuk is van toepassing op broeikasgasinstallaties als bedoeld in de [artikelen 16.2, eerste lid][ref1], en
      [16.3][ref2], waarin door brandstofverbruik of grondstofgebruik elektriciteit wordt opgewekt, met uitzondering van
      broeikasgasinstallaties waarin uitsluitend elektriciteit wordt opgewekt door middel van een noodstroomaggregaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.2
    references:
