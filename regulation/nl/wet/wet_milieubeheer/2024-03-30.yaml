  - number: 19.7.3
    text: |-
      [De artikelen 19.4][ref1] en [19.5, eerste lid][ref2], zijn van overeenkomstige toepassing, met dien verstande dat
      het bestuursorgaan, bedoeld in het eerste lid, wordt aangemerkt als het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.7.4
    text: |-
      Indien een verzoek als bedoeld in het eerste lid is gedaan, kan openbaarmaking van het betrokken emissieverslag of
      elektriciteitsemissieverslag of industrieel emissieverslag achterwege blijven tot uiterlijk vier weken nadat op dat
      verzoek onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.7
  - number: 20.1.1
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State beslist op een beroep tegen een besluit op grond van
      deze wet of tegen besluiten als bedoeld in [artikel 20.3, eerste lid][ref1], binnen twaalf maanden na afloop
      van de beroepstermijn. In afwijking van de eerste volzin beslist de Afdeling op een beroep tegen een nationaal
      toewijzingsbesluit als bedoeld in [artikel 16.24, eerste lid][ref2], of een gewijzigd nationaal toewijzingsbesluit
      als bedoeld in [artikel 16.31, eerste lid][ref3], binnen veertig weken na afloop van de termijn voor het indienen
      van een beroepschrift tegen eerstbedoeld besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 20.1.2
    text: |-
      Het beroep tegen een gewijzigd nationaal toewijzingsbesluit als bedoeld in [artikel 16.31, eerste lid][ref1],
      kan uitsluitend worden ingesteld door een belanghebbende die rechtstreeks in zijn belang is getroffen door
      de wijzigingen die ten opzichte van het oorspronkelijke nationale toewijzingsbesluit zijn aangebracht.
      [Artikel 6:13 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 20.1.3
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen
      van beroep tegen een nationaal toewijzingsbesluit als bedoeld in [artikel 16.24, eerste lid][ref2],
      aan met ingang van de dag na die waarop in de Staatscourant een mededeling is gedaan als bedoeld in
      [artikel 16.30a, eerste lid][ref3], dan wel met ingang van de dag na die waarop het gewijzigde nationale
      toewijzingsbesluit overeenkomstig artikel 16.30a, derde lid, tweede volzin, in verbinding met artikel 16.30, vierde
      lid, in de Staatscourant is bekendgemaakt. In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref4]
      bedraagt de termijn voor het instellen van beroep tegen een gewijzigd nationaal toewijzingsbesluit als bedoeld in
      [artikel 16.31, eerste lid][ref5], vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.1
    references:
