  - number: 18.16e.2
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], of
      [artikel 16.39t, eerste, tweede en derde lid][ref2], bedraagt een bestuurlijke boete als bedoeld
      in [artikel 18.16a, tweede lid][ref3], het in artikel 16, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten genoemde bedrag per ton emissie van een kooldioxide-equivalent, die meer is
      veroorzaakt dan overeenkomt met het aantal broeikasgasemissierechten, emissiereductie-eenheden of gecertificeerde
      emissiereducties dat overeenkomstig artikel 16.37, eerste lid, onderscheidenlijk artikel 16.39t, eerste lid, is
      ingeleverd. [Artikel 5:46, derde lid, van de Algemene wet bestuursrecht][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
