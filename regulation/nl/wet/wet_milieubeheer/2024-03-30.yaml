  - number: 18.16e.3
    text: |-
      In afwijking van het tweede lid bedraagt de bestuurlijke boete, bedoeld in dat lid, met betrekking tot het
      kalenderjaar 2013 en daarop volgende kalenderjaren per ton emissie van een kooldioxide-equivalent het in artikel
      16, derde lid, van de EG-richtlijn handel in broeikasgasemissierechten genoemde bedrag, jaarlijks verhoogd
      overeenkomstig de Europese consumentenprijsindex.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16e
  - number: 18.16e.4
    text: |-
      [Artikel 16.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16e
