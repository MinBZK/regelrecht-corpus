        artikel: '16'
  - number: 10.48.3
    text: |-
      Onze Minister kan in het belang van een doelmatig beheer van afvalstoffen de tarieven vaststellen, die ten minste
      dan wel ten hoogste in rekening worden gebracht bij het in ontvangst nemen van afvalstoffen door de houder van een
      vergunning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.48
  - number: 10.49.1
    text: |-
      De aan de vergunning, bedoeld in [artikel 10.48, eerste lid][ref1], te verbinden voorschriften kunnen in ieder
      geval inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.49.1.a
    text: |-
      dat in daarbij aangewezen categorieën van gevallen afvalstoffen niet mogen worden ingezameld zonder afzonderlijke
      toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.49.1.b
    text: |-
      de verplichting, daarbij aangewezen afvalstoffen, wanneer zij aan de inzamelaar worden aangeboden, in ontvangst
      te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.49.1.c
    text: |-
      de verplichting, daarbij aangewezen categorieën van afvalstoffen die gescheiden worden afgegeven, afzonderlijk in
      te zamelen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.49.1.d
    text: de verplichting, daarbij aangewezen afvalstoffen, wanneer zij aan de inzamelaar worden aangeboden, op te halen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.49.1.e
    text: de verplichting afvalstoffen af te geven aan daarbij aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.49.2
    text: |-
      Een vergunning geldt slechts voor degene aan wie zij is verleend. Deze draagt ervoor zorg dat de aan de vergunning
      verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.49
  - number: 10.50.1
    text: |-
      Onze Minister kan, indien voor het beheer van de betrokken stoffen, mengsels of voorwerpen een verplichting deze
      in te nemen als bedoeld in [artikel 9.5.2][ref1] of een daaraan gelijkwaardige vrijwillige inname bestaat, bij
      ministeriële regeling categorieën van gevallen aangeven waarin de verplichtingen, gesteld bij of krachtens de
      [artikelen 10.38 tot en met 10.40][ref2], [10.45][ref3], [10.46][ref4] en [10.48][ref5] niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.50.2
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid omvat de verplichting tot het registreren van daarbij aan
      te geven gegevens op een daarbij aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.50
  - number: 10.54.1
    text: 'Het is verboden gevaarlijke afvalstoffen tijdens het inzamelen of vervoeren daarvan:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.54
  - number: 10.54.1.a
    text: anders dan handmatig te scheiden, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.54
  - number: 10.54.1.b
    text: |-
      te mengen, daaronder mede begrepen verdunnen, met andere bij algemene maatregel van bestuur aangewezen categorieën
      van afvalstoffen of met andere stoffen dan afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.54
  - number: 10.54.2
    text: |-
      Het verbod geldt niet voor handelingen die aan degene die gevaarlijke afvalstoffen inzamelt, uitdrukkelijk zijn
      toegestaan krachtens [artikel 10.47][ref1] of [10.48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.54.3
    text: |-
      [Artikel 10.2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.55.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.1.a
    text: bedrijfsafvalstoffen of gevaarlijke afvalstoffen voor anderen tegen vergoeding te vervoeren,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.1.b
    text: bedrijfsafvalstoffen of gevaarlijke afvalstoffen te verhandelen,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.1.c
    text: ten behoeve van anderen te bemiddelen bij het beheer van bedrijfsafvalstoffen of gevaarlijke afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.2
    text: |-
      Het verbod, bedoeld in het eerste lid, onder a, geldt niet voor degene die krachtens [artikel 10.45][ref1] bevoegd
      is tot het inzamelen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.55.3
    text: |-
      Onze Minister wijst een instantie aan die namens hem zorg draagt voor de vermelding van vervoerders, handelaars en
      bemiddelaars op de lijst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.4
    text: |-
      Onze Minister stelt nadere regels omtrent de vermelding van vervoerders, handelaars en bemiddelaars op de lijst,
      bedoeld in het eerste lid. Deze regels bevatten in ieder geval criteria voor vermelding op de lijst en voor
      beëindiging daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.5
    text: |-
      Een vervoerder, handelaar of bemiddelaar als bedoeld in het eerste lid registreert met betrekking tot de
      activiteiten, bedoeld in het eerste lid, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.5.a
    text: 'de naam en het adres van degene:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.5.a.1
    text: van wie de afvalstoffen afkomstig zijn,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.5.a.2
    text: aan wie de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.5.b
    text: de gebruikelijke benaming en de hoeveelheid van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.55.6
    text: |-
      [Artikel 10.38, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.55.7
    text: |-
      Onze Minister stelt regels inhoudende de verplichting dat een vervoerder als bedoeld in het eerste lid tijdens
      het vervoeren daarbij aan te geven bescheiden aanwezig heeft, waaruit blijkt dat hij staat vermeld op de lijst
      van vervoerders.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.55
  - number: 10.56.1
    text: Onze Minister stelt regels ter uitvoering van artikel 6 van de EG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.56
  - number: 10.56.2
    text: |-
      Ter uitvoering van andere artikelen dan het in het eerste lid genoemde artikel van de EG-verordening overbrenging
      van afvalstoffen kan Onze Minister regels stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.56
  - number: '10.57'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de titels II en VII van de EG-verordening overbrenging
      van afvalstoffen van overeenkomstige toepassing zijn met betrekking tot de overbrenging van afvalstoffen binnen
      Nederland.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.57
  - number: '10.58'
    text: Onze Minister is de bevoegde autoriteit, bedoeld in artikel 53 van de EG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.58
  - number: '10.59'
    text: |-
      Op een kennisgeving als bedoeld in de EG-verordening overbrenging van afvalstoffen is
      [artikel 4:15 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 10.60.1
    text: |-
      Het is verboden afvalstoffen waarop de EG-verordening overbrenging van afvalstoffen van toepassing is, binnen of
      buiten Nederlands grondgebied te brengen, indien de voorgenomen overbrenging, nuttige toepassing of verwijdering,
      naar het oordeel van Onze Minister in strijd zou zijn met het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.2
    text: |-
      Het is verboden handelingen te verrichten als bedoeld in artikel 2, onder 35, van de EG-verordening overbrenging
      van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.3
    text: |-
      Het is verboden te handelen in strijd met artikel 49, eerste lid, van de EG-verordening overbrenging van
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.4
    text: |-
      Het is verboden te handelen in strijd met de voorschriften als bedoeld in de artikelen 35, vijfde lid, 37, vierde
      lid, of 38, zesde lid, van de EG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.5
    text: 'Het is verboden afvalstoffen over te brengen indien gehandeld wordt in strijd met een voorschrift gesteld bij:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.5.a
    text: |-
      artikel 13, tweede lid, 15, onder c, 16, onder a, b, c, eerste of tweede volzin, of d, 18, eerste of tweede lid, of
      19 van de EG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.5.b
    text: |-
      artikel 35, eerste lid, 38, eerste lid, 42, eerste lid, 44, eerste lid, 45 in verbinding met 42, eerste lid, 46,
      eerste lid, 47 in verbinding met 42, eerste lid, of 48, eerste lid, in verbinding met 47 en 42, eerste lid, van
      de EG-verordening overbrenging van afvalstoffen, telkens in verbinding met één of meer van de onder a genoemde
      bepalingen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.5.c
    text: artikel 55, laatste volzin, van de EG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.6
    text: 'Het is verboden afvalstoffen over te brengen indien gehandeld wordt in strijd met een voorwaarde gesteld krachtens:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.6.a
    text: artikel 10, eerste of tweede lid, of 13, derde lid, van de EG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.6.b
    text: |-
      artikel 35, eerste lid, 38, eerste lid, 42, eerste lid, 44, eerste lid, 45 in verbinding met 42, eerste lid, 46,
      eerste lid, 47 in verbinding met 42, eerste lid, of 48, eerste lid, in verbinding met 47 en 42, eerste lid, van
      de EG-verordening overbrenging van afvalstoffen, telkens in verbinding met één of meer van de onder a genoemde
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.7
    text: 'Het is verboden afvalstoffen over te brengen indien gehandeld wordt in strijd met een voorschrift gesteld bij:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.7.a
    text: |-
      artikel 15, onder d of e, laatste volzin, 16, onder c, laatste volzin, of onder e, of 20 van de EG-verordening
      overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.7.b
    text: |-
      artikel 35, eerste lid, 38, eerste lid, 42, eerste lid, 44, eerste lid, 45 in verbinding met 42, eerste lid, 46,
      eerste lid, 47 in verbinding met 42, eerste lid, of 48, eerste lid, in verbinding met 47 en 42, eerste lid, van
      de EG-verordening overbrenging van afvalstoffen, telkens in verbinding met één of meer van de onder a genoemde
      bepalingen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.60.7.c
    text: |-
      artikel 35, derde lid, onder c, 38, derde lid, onder b, 42, derde lid, onder c, 44, derde lid, in verbinding met
      42, derde lid, onder c, 45 in verbinding met artikel 42, derde lid, onder c, 47 in verbinding met 42, derde lid,
      onder c, 48, eerste lid, in verbinding met 47 en 42, derde lid, onder c, of 48, tweede lid, aanhef, in verbinding
      met 44, derde lid, en 42, derde lid, onder c, van de EG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.60
  - number: 10.61.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover dat in het belang van een doelmatig beheer van afvalstoffen
      noodzakelijk is, regels worden gesteld met betrekking tot het opnemen in de afvalstoffenverordening of het
      omgevingsplan van regels als bedoeld in [de artikelen 10.21][ref1], [10.24][ref2], [10.25][ref3] en [10.26][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.61
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.61.2
    text: |-
      Bij een maatregel als bedoeld in het eerste lid wordt aangegeven binnen welke termijn en, indien nodig, op welke
      wijze die regels moeten zijn opgenomen in de verordening.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.61
  - number: 10.63.1
    text: |-
      Burgemeester en wethouders kunnen, indien het belang van de bescherming van het milieu zich daartegen niet verzet,
      ontheffing verlenen van het in [artikel 10.2, eerste lid][ref1], gestelde verbod om huishoudelijke afvalstoffen te
      verbranden, voorzover het geen gevaarlijke afvalstoffen betreft. Op de ontheffing, bedoeld in de vorige volzin, is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 10.63.2
    text: |-
      Gedeputeerde staten kunnen, indien het belang van de bescherming van het milieu zich daartegen niet verzet,
      ontheffing verlenen van het in [artikel 10.2, eerste lid][ref1], gestelde verbod om huishoudelijke afvalstoffen te
      storten of anderszins op of in de bodem te brengen, voorzover het geen gevaarlijke afvalstoffen betreft, en, indien
      het belang van een doelmatig beheer van afvalstoffen zich daartegen niet verzet, ontheffing verlenen van de in de
      [artikelen 10.37][ref2] en [10.54][ref3] gestelde verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.63.3
    text: |-
      Onze Minister kan, indien het belang van een doelmatig beheer van afvalstoffen zich daartegen niet verzet,
      ontheffing verlenen van het bepaalde in een algemene maatregel van bestuur krachtens de artikelen 10.28, 10.29,
      10.47 en, indien het belang van de bescherming van het milieu zich daartegen niet verzet, van het bepaalde bij
      of krachtens een algemene maatregel van bestuur op grond van [de artikelen 10.41, eerste en tweede lid][ref1],
      [10.42, eerste lid][ref2], [10.43, eerste lid][ref3], [10.44, derde lid][ref4], en [10.46, eerste lid][ref5],
      alsmede van het bepaalde in de [artikelen 10.23, derde lid][ref6], en [10.48][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
