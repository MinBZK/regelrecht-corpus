    text: 'Indien degene tot wie een beschikking is gericht krachtens:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.20
  - number: 15.20.1.a
    text: |-
      [artikel 9.2.2.1, eerste lid][ref1], juncto [artikel 9.2.2.3, zevende lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
