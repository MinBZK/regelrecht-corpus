        afdeling: 16.2.1
  - number: 16a.3.1
    text: |-
      De exploitant van een broeikasgasinstallatie, monitort de emissie van broeikasgas als gevolg van de
      opwekking van elektriciteit op basis van een elektriciteitsmonitoringsplan, tenzij het tarief, bedoeld in
      [artikel 71f, eerste lid, van de Wet belastingen op milieugrondslag][ref1], nihil is.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel71f
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 71f
  - number: 16a.3.2
    text: |-
      Het elektriciteitsmonitoringsplan of een wijziging daarvan behoeft goedkeuring van het bestuur van de
      emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.3
    text: |-
      De [artikelen 16.6, eerste en derde lid][ref1], [16.7][ref2], [16.9][ref3], [16.11][ref4], [16.12][ref5],
      [16.18][ref6] en [16.19, eerste lid][ref7] zijn van overeenkomstige toepassing met dien verstande dat telkens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
