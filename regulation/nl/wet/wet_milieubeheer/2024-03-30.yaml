        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 20.1.4
    text: |-
      In afwijking van [artikel 6:19, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt het beroep tegen het
      nationale toewijzingsbesluit als bedoeld in [artikel 16.24, eerste lid][ref2], geacht mede gericht te zijn tegen
      het gewijzigde nationale toewijzingsbesluit als bedoeld in [artikel 16.31, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.1
    references:
      - id: ref1
