      - id: ref4
        bwb_id: BWBR0009449
      - id: ref5
        bwb_id: BWBR0005537
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 20.3.2
    text: |-
      In afwijking van het eerste lid, eerste volzin, treedt een besluit op een aanvraag om een vergunning voor
      het oprichten, in werking brengen, in werking houden, buiten gebruik stellen, wijzigen of ontmantelen van een
      inrichting als bedoeld in [artikel 15, onder b, van de Kernenergiewet][ref1] dat tevens is aan te merken als
      het bouwen van een bouwwerk waarvoor een omgevingsvergunning voor een omgevingsplanactiviteit als bedoeld in
      [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref2], bestaande uit een bouwactiviteit of het
      in stand houden van een bouwwerk, of een omgevingsvergunning voor een bouwactiviteit als bedoeld in artikel 5.1,
      tweede lid, aanhef en onder a, van de Omgevingswet is vereist, niet eerder in werking dan nadat de betrokken
      omgevingsvergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 20.3.3
    text: |-
      Indien het gebruik maken van een besluit als bedoeld in het eerste lid, eerste volzin, voordat op een beroep
      is beslist, wegens de daaraan verbonden kosten, dan wel wegens de daardoor veroorzaakte wijziging in feitelijke
      omstandigheden die bij de beslissing op het beroep een rol kunnen spelen, aanmerkelijke invloed kan hebben op die
      beslissing, wordt een zodanige voorlopige voorziening getroffen dat die invloed zich niet kan voordoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.3
  - number: '20.4'
    text: |-
      [Artikel 20.3][ref1] is niet van toepassing op besluiten op een aanvraag om een vergunning of op bezwaren krachtens
      de EG-verordening overbrenging van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 20.5.1
    text: |-
      In gevallen waarin het onverwijld in werking treden van een besluit als bedoeld in
      [artikel 20.3, eerste lid, eerste volzin][ref1], naar het oordeel van het bevoegd gezag noodzakelijk is, kan het in
      afwijking van dat lid in het besluit bepalen dat het terstond in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 20.5.2
    text: |-
      Het eerste lid is niet van toepassing op besluiten op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 20.5a.1
    text: |-
      De Afdeling bestuursrechtspraak van de Raad van State voegt de behandeling van bij haar aanhangige zaken
      over een nationaal toewijzingsbesluit als bedoeld in [artikel 16.24, eerste lid][ref1], die op dezelfde
      handelsperiode betrekking hebben. De eerste volzin is niet van toepassing op latere wijzigingen van een nationaal
      toewijzingsbesluit overeenkomstig subparagraaf 16.2.1.3.2.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 20.5a.2
    text: |-
      Alvorens te beslissen op een beroep tegen een nationaal toewijzingsbesluit als bedoeld in
      [artikel 16.24, eerste lid][ref1], geeft de Afdeling, in gevallen waarin het beroep naar haar oordeel gegrond is,
      toepassing aan [artikel 8:51d van de Algemene wet bestuursrecht][ref2], met dien verstande dat de tussenuitspraak,
      bedoeld in [artikel 8:80a, eerste lid, van de Algemene wet bestuursrecht][ref3], wordt gedaan binnen achttien weken
      na afloop van de voor dat besluit geldende beroepstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.5a.3
    text: |-
      De Afdeling voegt bij haar aanhangig gemaakte zaken met betrekking tot een naar aanleiding van haar tussenuitspraak
      gewijzigd nationaal toewijzingsbesluit als bedoeld in [artikel 16.31, eerste lid][ref1], ter behandeling met zaken
      over het oorspronkelijke nationale toewijzingsbesluit die reeds bij haar aanhangig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 21.1.1
    text: |-
      Burgemeester en wethouders, gedeputeerde staten en ieder Onzer betrokken Ministers doen jaarlijks verslag aan
      onderscheidenlijk de gemeenteraad, provinciale staten en de Staten-Generaal over hun beleid met betrekking tot
      de uitvoering van de [hoofdstukken 8][ref1], [13][ref2] en [18][ref3]. Burgemeester en wethouders en gedeputeerde
      staten zenden het verslag gelijktijdig met de aanbieding aan de gemeenteraad, onderscheidenlijk provinciale staten,
      aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '18'
  - number: 21.1.2
    text: 'Zij vermelden in hun verslag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.1
  - number: 21.1.2.a
    text: |-
      het aantal malen dat in de periode waarop het verslag betrekking heeft, de termijnen zijn overschreden, die
      ingevolge [artikel 3:18 van de Algemene wet bestuursrecht][ref1] gelden voor het geven van de beschikking,
      de oorzaken daarvan en de maatregelen die zij hebben getroffen of zullen treffen om het overschrijden van die
      termijnen zo veel mogelijk te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 21.1.2.b
    text: |-
      afzonderlijk de wijze waarop zij de in het eerste lid genoemde hoofdstukken van deze wet hebben uitgevoerd ten
      aanzien van inrichtingen die geheel of gedeeltelijk gedreven worden door onderscheidenlijk de betrokken gemeente,
      de betrokken provincie of het rijk.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.1
  - number: 21.1.3
    text: |-
      Gevallen ten aanzien waarvan [artikel 13.10][ref1] is toegepast, worden in het verslag van Onze Minister niet
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 21.2.1
    text: |-
      Onze Minister zendt - voor zover het betreft het ambtsterrein van één of meer Onzer andere Ministers, in
      overeenstemming met die Ministers - binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens
      om de vijf jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.2
  - number: 21.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de toepassing van
      het eerste lid. Deze regelen kunnen voor daarbij aangewezen bestuursorganen de verplichting inhouden jaarlijks op
      de daarbij aangegeven wijze de gegevens te verstrekken, die voor de opstelling van het in het eerste lid bedoelde
      verslag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.2
  - number: 21.2a
    text: |-
      Een bestuursorgaan verstrekt Onze Minister de gegevens die hij nodig heeft ter uitvoering van de in de artikelen
      51, 55, 59 en 72 van richtlijn nr. 2010/75/EU van het Europees Parlement en de Raad van 24 november 2010 inzake
      industriële emissies (PbEU L 334) opgelegde verplichtingen tot informatieverstrekking. Bij ministeriële regeling
      kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.2a
  - number: '21.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen bepalingen van deze wet die betrekking hebben op stoffen, van toepassing
      worden verklaard op micro-organismen, niet zijnde genetisch gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.4
  - number: '21.5'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een gemeente of provincie,
      worden, voor zover nodig, bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die
      de in deze wet vervatte bevoegdheden uitoefenen en ten aanzien van de bestuursorganen die bij die uitvoering dienen
      te worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.5
  - number: 21.6.1
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 9.2.3.2][ref1] wordt Ons gedaan door
      Onze Minister van Volksgezondheid, Welzijn en Sport, mede namens Onze Minister en Onze Minister van Sociale Zaken
      en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
  - number: 21.6.2
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens
      [artikel 1.1, eerste, derde, zesde, zevende of achtste lid][ref1], [2.2, derde lid][ref2], [8.40][ref3],
      [8.49, vijfde lid][ref4], [9.2.1.3, tweede lid][ref5], [9.2.1.4][ref6], [9.2.2.1, eerste lid][ref7],
      [9.2.3.2][ref8], [9.2.3.3, vierde lid][ref9], [9.5.2][ref10], [10.2, tweede lid][ref11],
      [10.22, tweede lid][ref12], [10.28, eerste lid][ref13], [10.29, eerste lid][ref14],
      [10.41, eerste en tweede lid][ref15], [10.42, eerste lid][ref16], [10.43, eerste lid][ref17],
      [10.44, derde lid][ref18], [10.46, eerste lid][ref19], [10.47, eerste lid][ref20], [10.48, eerste lid][ref21],
      [10.54, derde lid][ref22], [10.61, eerste lid][ref23], [11.11, tweede lid][ref24], [15.13, eerste lid][ref25],
