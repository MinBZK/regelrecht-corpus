        paragraaf: 9.8.1
  - number: 9.8.1.2
    text: 'Deze titel is van toepassing op brandstoffen en energie voor:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.2.a
    text: wegvoertuigen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.2.b
    text: niet voor de weg bestemde mobiele machines;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.2.c
    text: landbouwtrekkers;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.2.d
    text: bosbouwmachines, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.2.e
    text: pleziervaartuigen, niet zijnde zeeschepen, wanneer die niet op zee varen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.2
  - number: 9.8.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën rapportageplichtigen worden aangewezen waarop de
      in deze titel opgenomen bepalingen niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.3
  - number: 9.8.1.4
    text: |-
      Onze minister en de rijksbelastingdienst verstrekken op verzoek van het bestuur van de emissieautoriteit de
      bij ministeriële regeling vast te stellen gegevens, voor zover die gegevens voor de uitvoering van deze titel
      noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.1.4
  - number: 9.8.2.1.1
    text: |-
      De rapportageplichtige vermindert de broeikasgasintensiteit van zijn uitslag tot verbruik van benzine en diesel
      aan de bestemmingen, bedoeld in [artikel 9.8.1.2][ref1], voor enig kalenderjaar met een bij of krachtens algemene
      maatregel van bestuur vast te stellen percentage ten opzichte van de in bijlage II van die richtlijn bedoelde
      uitgangsnorm voor brandstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.1
  - number: 9.8.2.1.2
    text: |-
      De rapportageplichtige voldoet aan de reductieverplichting, bedoeld in het eerste lid, met de inzet
      van hernieuwbare brandstofeenheden of geleverde betere fossiele brandstof, met inachtneming van
      [artikel 9.7.2.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.2
  - number: 9.8.2.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het in het eerste
      lid genoemde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.1
  - number: 9.8.2.2
    text: De rapportageplichtige heeft een rekening met reductieverplichtingfaciliteit in het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.2
  - number: 9.8.2.3.1
    text: |-
      De rapportageplichtige voert voor 1 maart van enig kalenderjaar zijn uitslag tot vervoersverbruik van het direct
      aan die datum voorafgaande kalenderjaar op zijn rekening met reductieverplichtingfaciliteit in het register in.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
  - number: 9.8.2.3.2
    text: |-
      Voor de toepassing van het eerste lid wordt de uitslag tot verbruik, bedoeld in
      [artikel 2 van de Wet op de accijns][ref1], van benzine en diesel volgens de gegevens van de rijksbelastingdienst
      beschouwd als uitslag tot vervoersverbruik, tenzij de rapportageplichtige aantoont dat die uitslag tot verbruik
      betrekking heeft op andere bestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: 9.8.2.3.3
    text: |-
      Voor de toepassing van het eerste lid wordt de uitslag tot verbruik, bedoeld in
      [artikel 2 van de Wet op de accijns][ref1], van betere fossiele brandstof volgens de gegevens van de
      rijksbelastingdienst niet beschouwd als uitslag tot vervoersverbruik, tenzij de rapportageplichtige het tegendeel
      aantoont.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: 9.8.2.3.4
    text: |-
      Voor de toepassing van het eerste lid wordt de uitslag tot verbruik, bedoeld in
      [artikel 2 van de Wet op de accijns][ref1], van benzine en diesel en samengeperste waterstof, niet aangemerkt als
      een betere fossiele brandstof, tenzij de rapportageplichtige het tegendeel aantoont.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: 9.8.2.3.5
    text: |-
      Wijzigingen in de voor enig kalenderjaar op zijn rekening ingevoerde uitslag tot vervoersverbruik na de datum,
      bedoeld in het eerste lid, meldt de rapportageplichtige aan het bestuur van de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
  - number: 9.8.2.3.6
    text: |-
      Bij ministeriële regeling worden de bij het invoeren op de rekening te vermelden gegevens en te hanteren
      berekeningsmethode als bedoeld in richtlijn (EU) 2015/652 bepaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
  - number: 9.8.2.3.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop het aantonen, bedoeld in het tweede,
      derde en vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
  - number: 9.8.2.3.8
    text: |-
      De gegevens, bedoeld in het zesde lid, en de onderliggende stukken worden door de rapportageplichtige bewaard tot
      ten minste vijf jaar na afloop van het kalenderjaar waarop die gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.3
  - number: 9.8.2.4.1
    text: |-
      Indien een rapportageplichtige in enig kalenderjaar zijn uitslag tot vervoersverbruik niet voor 1 maart van het
      daaropvolgende kalenderjaar heeft ingevoerd op zijn rekening met een reductieverplichtingfaciliteit, kan het
      bestuur van de emissieautoriteit hem ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.4
  - number: 9.8.2.4.2
    text: |-
      Indien een rapportageplichtige in enig kalenderjaar zijn uitslag tot vervoersverbruik niet juist heeft ingevoerd op
      zijn rekening met een reductieverplichtingfaciliteit, kan het bestuur van de emissieautoriteit hem tot vijf jaar na
      dat kalenderjaar ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.4
  - number: 9.8.2.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.4
  - number: 9.8.2.5.1
    text: 'Op 1 mei van enig kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
  - number: 9.8.2.5.1.a
    text: heeft de rapportageplichtige ten minste het aantal per soort hernieuwbare brandstofeenheden op zijn rekening, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
  - number: 9.8.2.5.1.b
    text: |-
      schrijft het bestuur van de emissieautoriteit van de rekening van de rapportageplichtige het aantal per soort
      hernieuwbare brandstofeenheden af,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
  - number: 9.8.2.5.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de afschrijving van het aantal per soort
      hernieuwbare brandstofeenheden, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
  - number: 9.8.2.5.3
    text: |-
      Indien toepassing van [artikel 9.8.2.4, tweede lid][ref1], leidt tot een verhoging van de reductieverplichting
      voor het betrokken kalenderjaar, schrijft het bestuur van de emissieautoriteit met inachtneming van het tweede
      lid het aantal per soort hernieuwbare brandstofeenheden dat overeenkomt met die verhoging af van de rekening van
      de rapportageplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.2
  - number: 9.8.2.5.4
    text: |-
      Indien toepassing van [artikel 9.8.2.4, tweede lid][ref1], leidt tot een verlaging van de reductieverplichting
      voor het betrokken kalenderjaar en de rapportageplichtige met hernieuwbare brandstofeenheden aan zijn
      reductieverplichting voldaan heeft, schrijft het bestuur van de emissieautoriteit met inachtneming van het tweede
      lid het aantal per soort hernieuwbare brandstofeenheden dat overeenkomt met die verlaging bij op de rekening van de
      rapportageplichtige. Het bestuur van de emissieautoriteit houdt hierbij rekening met [artikel 9.7.5.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.8.2.5.5
    text: |-
      Indien het aantal per soort hernieuwbare brandstofeenheden op de rekening van de rapportageplichtige als gevolg van
      de toepassing van het eerste of derde lid minder is dan nul, vult hij het tekort aan binnen drie kalendermaanden,
      met de inzet van hernieuwbare brandstofeenheden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.2.5
  - number: 9.8.3.4
    text: |-
      Het bestuur van de emissieautoriteit stelt jaarlijks de broeikasgasemissiereductiebijdrage van de hernieuwbare
      brandstofeenheid vast voor het behalen van de reductieverplichting. Bij of krachtens algemene regels van bestuur
      worden regels gesteld met betrekking tot de jaarlijkse vaststelling.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.3.4
  - number: 9.8.3.6
    text: |-
      Indien het aantal hernieuwbare brandstofeenheden op een rekening minder is dan nul, worden de bijgeschreven
      hernieuwbare brandstofeenheden per soort volgens bij algemene maatregel van bestuur vast te stellen regels
      afgeschreven.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.3.6
  - number: 9.8.4.1.1
    text: Er is een elektronisch register rapportage- en reductieverplichting vervoersemissies.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.1
  - number: 9.8.4.1.2
    text: Het register wordt beheerd door de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.1
  - number: 9.8.4.1.3
    text: |-
      Het register bestaat uit de rekeningen, bedoeld in [artikel 9.8.4.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.4
  - number: 9.8.4.2.1
    text: |-
      Bij ministeriële regeling worden regels gesteld over de werking, organisatie, beschikbaarheid en beveiliging van
      het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.2
  - number: 9.8.4.2.2
    text: Het bestuur van de emissieautoriteit kan voorwaarden voor het gebruik van het register vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.2
  - number: 9.8.4.3.1
    text: |-
      Het bestuur van de emissieautoriteit opent op verzoek van de rapportageplichtige op diens naam een rekening met
      reductieverplichtingfaciliteit en met overboekfaciliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.3
  - number: 9.8.4.3.2
    text: Het bestuur van de emissieautoriteit opent op naam van een onderneming niet meer dan één rekening.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.3
  - number: 9.8.4.3.3
    text: Bij ministeriële regeling worden regels gesteld over het openen, bijhouden en beheer van de rekeningen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.3
  - number: 9.8.4.4.1
    text: |-
      Het bestuur van de emissieautoriteit kan bij een vermoeden van fraude of misbruik of indien niet wordt voldaan aan
      de bij of krachtens deze titel gestelde eisen voor het hebben van een rekening in het register of voor het gebruik
      van die rekening:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.1.a
    text: weigeren een rekening te openen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.1.b
    text: een rekening of een faciliteit van die rekening blokkeren;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.1.c
    text: een rekening opheffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.2
    text: Het bestuur van de emissieautoriteit kan op verzoek van de rekeninghouder een rekening opheffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de toepassing van het eerste lid en
      kunnen regels worden gesteld over de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.4.4
    text: De hernieuwbare brandstofeenheden op een opgeheven rekening vervallen van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.4
  - number: 9.8.4.5.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor het openen en bijhouden van een rekening, bedoeld in
      [artikel 9.8.4.3, eerste tot en met derde lid][ref1], een vergoeding verschuldigd is overeenkomstig de bij die
      regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.4
  - number: 9.8.4.5.2
    text: 'Bij de regeling, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.5
  - number: 9.8.4.5.2.a
    text: |-
      wordt de hoogte van de vergoeding vastgesteld, welke niet hoger is dan noodzakelijk is ter dekking van de ten
      laste van de emissieautoriteit komende kosten van het verrichten van werkzaamheden waarvoor de vergoeding is
      verschuldigd, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.5
  - number: 9.8.4.5.2.b
    text: worden regels gesteld omtrent de wijze waarop de vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.5
  - number: 9.8.4.6.1
    text: |-
      Nadat het bestuur van de emissieautoriteit toepassing heeft gegeven aan
      [artikel 9.8.2.5, eerste lid, onderdeel b][ref1], wordt een gedeelte van het aantal per soort
      hernieuwbare brandstofeenheden op 1 mei van enig kalenderjaar op de rekening van een rapportageplichtige
      gespaard ten behoeve van het direct daaropvolgende kalenderjaar, met inachtneming van
      [artikel 9.7.5.6, eerste tot en met derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.8.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.8.4.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het gedeelte, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.6
  - number: 9.8.4.6.3
    text: De hernieuwbare brandstofeenheden die niet worden gespaard, vervallen van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.8.4.6
  - number: 10.1.1
    text: |-
      Een ieder die handelingen met betrekking tot afvalstoffen verricht of nalaat en die weet of redelijkerwijs
      had kunnen weten dat daardoor nadelige gevolgen voor het milieu ontstaan of kunnen ontstaan, is verplicht alle
      maatregelen te nemen of na te laten die redelijkerwijs van hem kunnen worden gevergd, teneinde die gevolgen zoveel
      mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1
  - number: 10.1.2
    text: |-
      Het is een ieder bij wie afvalstoffen ontstaan, verboden handelingen met betrekking tot die afvalstoffen te
      verrichten of na te laten, waarvan hij weet of redelijkerwijs had kunnen weten dat daardoor nadelige gevolgen voor
      het milieu ontstaan of kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1
  - number: 10.1.3
    text: |-
      Het is een ieder verboden bedrijfsmatig of in een omvang of op een wijze alsof deze bedrijfsmatig was, handelingen
      met betrekking tot afvalstoffen te verrichten, indien daardoor, naar hij weet of redelijkerwijs had kunnen weten,
      nadelige gevolgen voor het milieu ontstaan of kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1
  - number: 10.1.4
    text: |-
      Onder handelingen als bedoeld in het derde lid wordt in ieder geval verstaan: inzamelen of anderszins in ontvangst
      nemen, bewaren, nuttig toepassen, verwijderen, vervoeren of verhandelen van afvalstoffen of bemiddelen bij het
      beheer van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1
  - number: 10.1.5
    text: |-
      De verboden, bedoeld in het tweede en derde lid, gelden niet voor zover deze handelingen betreffen, die degene die
      deze verricht, uitdrukkelijk zijn toegestaan bij of krachtens deze wet, een in [artikel 13.1, tweede lid][ref1],
      genoemde wet, de [Omgevingswet][ref2] of de EG-verordening overbrenging van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
      - id: ref2
        bwb_id: BWBR0037885
  - number: 10.1a.1
    text: |-
      Dit hoofdstuk is, met uitzondering van de [artikelen 10.1][ref1], [10.2][ref2] en [10.54][ref3] en
      [titel 10.2][ref4], niet van toepassing op de volgende stoffen, preparaten en voorwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 10.1a.1.a
    text: |-
      gasvormige effluenten die in de atmosfeer worden uitgestoten, alsmede kooldioxide dat wordt afgevangen en
      getransporteerd met het oog op geologische opslag en dat geologisch is opgeslagen overeenkomstig het bepaalde in
      richtlijn nr. 2009/31/EG van het Europees Parlement en de Raad van de Europese Unie van 23 april 2009 betreffende
      de geologische opslag van kooldioxide en tot wijziging van Richtlijn 85/337/EEG van de Raad, de Richtlijnen
      2000/60/EG, 2001/80/EG, 2004/35/EG, 2006/12/EG en 2008/1/EG en Verordening (EG) nr. 1013/2006 van het Europees
      Parlement en de Raad (PbEU L 140), dan wel op grond van artikel 2, tweede lid, van die richtlijn buiten de
      werkingssfeer van die richtlijn valt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.b
    text: bodem met inbegrip van niet-uitgegraven verontreinigde grond en duurzaam met de bodem verbonden gebouwen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.c
    text: |-
      niet-verontreinigde grond en ander van nature voorkomend materiaal, afgegraven bij bouwactiviteiten, indien
      vaststaat dat het materiaal in natuurlijke staat zal worden gebruikt voor bouwdoeleinden op de locatie waar het
      werd afgegraven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.d
    text: radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.e
    text: afgedankte explosieven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.f
    text: |-
      uitwerpselen, voor zover niet vallend onder onderdeel h, onder 1°, stro en ander natuurlijk, niet-gevaarlijk
      landbouw- of bosbouwmateriaal dat wordt gebruikt in de landbouw, de bosbouw of voor de productie van energie uit
      die biomassa door middel van processen of methoden die onschadelijk zijn voor het milieu en die de menselijke
      gezondheid niet in gevaar brengen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.g
    text: |-
      sediment dat binnen oppervlaktewater wordt verplaatst met het oog op het beheer van water en waterwegen of
      om overstromingen te voorkomen of de gevolgen van overstromingen en droogte te verminderen, of met het oog op
      landwinning, indien is aangetoond dat het sediment ongevaarlijk is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.h
    text: 'voor zover daarover bij of krachtens communautaire regelgeving regels zijn gesteld:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.h.1°
    text: |-
      dierlijke bijproducten, met inbegrip van verwerkte producten, in de zin van verordening (EG) nr. 1069/2009 van het
      Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor
      menselijke consumptie bestemde dierlijke bijproducten en afgeleide producten en tot intrekking van Verordening (EG)
      nr. 1774/2002 (verordening dierlijke bijproducten)(PbEU 2009, L 300), behalve die welke bestemd zijn om te worden
      verbrand of gestort of voor gebruik in een biogas- of composteerinstallatie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.h.2°
    text: |-
      kadavers van niet door slachting gestorven dieren, met inbegrip van dieren die worden gedood om een epizoötie uit
      te roeien en overeenkomstig de onder 1° genoemde verordening nr. 1069/2009 worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.1.h.3°
    text: |-
      stoffen die bestemd zijn voor gebruik als voedermiddelen als omschreven in artikel 3, tweede lid, onderdeel g, van
      Verordening (EG) nr. 767/2009 van het Europees Parlement en de Raad van 13 juli 2009 betreffende het in de handel
      brengen en het gebruik van diervoeders, tot wijziging van Verordening (EG) nr. 1831/2003 van het Europees Parlement
      en de Raad en tot intrekking van [Richtlijn 79/373/EEG](31979L0373) van de Raad, [Richtlijn 80/511/EEG](31980L0511)
      van de Commissie, [Richtlijnen 82/471/EEG](31982L0471), [83/228/EEG](31983L0228), [93/74/EEG](31993L0074), [93/113/
      EG](31993L0113) en [96/25/EG](31996L0025) van de Raad en Beschikking [2004/217/EG](32004L0217) van de Commissie
      (PbEU L 229) en die geen dierlijke bijproducten bevatten of daaruit bestaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
  - number: 10.1a.2
    text: |-
      Op de in het eerste lid bedoelde stoffen, preparaten en voorwerpen is, voor zover het afvalstoffen betreft,
      het bepaalde bij of krachtens de [artikelen 15.33][ref1], [15.35][ref2] en [15.36][ref3], alsmede de
      [artikelen 5.8 tot en met 5.16][ref4], [5.34, tweede lid][ref5], en [5.36, vierde lid, van de Omgevingswet][ref6],
      evenmin van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref4
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0037885
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 10.2.1
    text: Het is verboden huishoudelijke afvalstoffen te storten, anderszins op of in de bodem te brengen of te verbranden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet, voor daarbij aangegeven categorieën van gevallen vrijstelling worden verleend van het
      verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.2
  - number: 10.2.3
    text: |-
      Indien toepassing is gegeven aan het tweede lid, kunnen bij of krachtens algemene maatregel van bestuur in het
      belang van de bescherming van het milieu regels worden gesteld met betrekking tot handelingen als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.2
  - number: 10.2.4
    text: Dit artikel is niet van toepassing op afgegeven of ingezamelde huishoudelijke afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.2
  - number: '10.3'
    text: Onze Minister stelt ten minste eenmaal in de zes jaar een afvalbeheerplan vast.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.3
  - number: 10.4.1
    text: |-
      Bij de vaststelling van het afvalbeheerplan en bij het nemen van andere maatregelen voor de preventie en het beheer
      van afvalstoffen hanteert Onze Minister als prioriteitsvolgorde de volgende afvalhiërarchie:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.1.a
    text: preventie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.1.b
    text: voorbereiding voor hergebruik;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.1.c
    text: recycling;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.1.d
    text: andere nuttige toepassing, waaronder energieterugwinning;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.1.e
    text: veilige verwijdering.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: 10.4.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het nemen van maatregelen als bedoeld in dat
      lid door gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.4
  - number: '10.5'
    text: |-
      Bij de vaststelling van het afvalbeheerplan en bij het nemen van andere maatregelen voor de preventie en het beheer
      van afvalstoffen:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.5
  - number: 10.5.a
    text: |-
      kan zonodig voor bepaalde specifieke afvalstromen van de afvalhiërarchie, bedoeld in [artikel 10.4][ref1], worden
      afgeweken, indien dit, de gehele levenscyclus in beschouwing nemende, met betrekking tot de algemene effecten van
      het produceren en beheren van dergelijke afvalstoffen gerechtvaardigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.5.b
    text: |-
      houdt Onze Minister er rekening mee dat het belang van een doelmatig beheer van afvalstoffen vereist dat het beheer
      op effectieve en efficiënte wijze geschiedt en effectief toezicht dan wel douanecontrole op het beheer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.5
  - number: 10.7.1
    text: |-
      Het afvalbeheerplan bevat de onderwerpen die ingevolge voor Nederland bindende besluiten van de instellingen van
      de Europese Unie moeten worden opgenomen in een zodanig plan. Het afvalbeheerplan voldoet aan het bij of krachtens
      de kaderrichtlijn afvalstoffen daaromtrent bepaalde, met inbegrip van hetgeen bij of krachtens die richtlijn is
      bepaald met betrekking tot afvalpreventieprogramma’s.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.2
    text: |-
      Het afvalbeheerplan bevat mede de afvalpreventieprogramma’s als bedoeld in artikel 29 van de kaderrichtlijn
      afvalstoffen, met inbegrip van de doelstellingen en maatregelen, gericht op het loskoppelen van economische groei
      van de milieueffecten die samenhangen met de productie van afvalstoffen. Voor de bewaking en evaluatie van de in
      de afvalpreventieprogramma’s vastgestelde doelstellingen van de daarin opgenomen afvalpreventiemaatregelen kan Onze
      Minister indicatoren vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.3
    text: 'Het afvalbeheerplan bevat voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.3.a
    text: |-
      de hoofdlijnen van het beleid ter uitvoering van deze wet met betrekking tot het voorkomen of beperken van het
      ontstaan van afvalstoffen en het beheer van afvalstoffen in de betrokken periode van zes jaar en, voor zover
      mogelijk, in de daarop volgende zes jaar;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.3.b
    text: |-
      een uitwerking van deze hoofdlijnen met betrekking tot daarbij aangewezen categorieën van afvalstoffen of wijzen
      van beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.3.c
    text: |-
      de capaciteit die benodigd is voor de daarbij aangewezen wijzen van beheer van afvalstoffen in de betrokken periode
      van zes jaar en, voor zover mogelijk, in de daaropvolgende zes jaar;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.7.3.d
    text: |-
      een beschrijving van het beleid ter uitvoering van de EG-verordening overbrenging van afvalstoffen in de betrokken
      periode van zes jaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.7
  - number: 10.8.1
    text: |-
      Onze Minister stelt het onderdeel van het afvalbeheerplan, bedoeld in [artikel 10.7, tweede lid, onder a][ref1],
      op na overleg met een instantie die representatief kan worden geacht voor de provinciebesturen en met een instantie
      die representatief kan worden geacht voor de gemeentebesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.2
    text: |-
      Onze Minister stelt de onderdelen van het afvalbeheerplan, bedoeld in [artikel 10.7, derde lid, onder b en c][ref1],
      op in gezamenlijk overleg met een instantie die representatief kan worden geacht voor de provinciebesturen en met
      een instantie die representatief kan worden geacht voor de gemeentebesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.3
    text: |-
      Onze Minister betrekt voorts bij de voorbereiding van het afvalbeheerplan de naar zijn oordeel bij de te behandelen
      onderwerpen meest belanghebbende andere bestuursorganen, instellingen en organisaties.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.8
  - number: 10.8.4
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop uitvoering wordt gegeven aan het
      bepaalde in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.8
  - number: 10.9.1
    text: |-
      Met betrekking tot de voorbereiding van het afvalbeheerplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 10.9.2
    text: |-
      Het ontwerp van het afvalbeheerplan wordt, gelijktijdig met de terinzagelegging ervan, overgelegd aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.9
  - number: '10.10'
    text: |-
      Ten behoeve van het opstellen van het afvalbeheerplan verschaffen de bestuursorganen aan Onze Minister op
      zijn verzoek alle inlichtingen en gegevens waarover zij kunnen beschikken, voor zover die voor dat opstellen
      redelijkerwijs noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.10
  - number: 10.11.1
    text: |-
      Zodra het afvalbeheerplan is vastgesteld, doet Onze Minister hiervan mededeling door overlegging van het
      afvalbeheerplan aan de beide kamers der Staten-Generaal en door toezending ervan aan gedeputeerde staten van de
      provincies en burgemeester en wethouders van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.11
  - number: 10.11.2
    text: |-
      Onze Minister zendt het afvalbeheerplan tevens toe aan de bestuursorganen, instellingen en organisaties, die
      overeenkomstig [artikel 10.8, derde lid][ref1], waren betrokken bij de voorbereiding ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.12.1
    text: |-
      Het afvalbeheerplan geldt met ingang van de dag waarop vier weken zijn verstreken na de dag waarop de vaststelling
      van het afvalbeheerplan is bekendgemaakt in de Staatscourant. Onze Minister kan bepalen dat het afvalbeheerplan, of
      onderdelen daarvan, eerst op een later tijdstip gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.12
  - number: 10.12.2
    text: |-
      Het afvalbeheerplan geldt, behoudens indien eerder een nieuw afvalbeheerplan is vastgesteld, voor een tijdvak van
      zes jaar. Onze Minister kan de geldingsduur van het afvalbeheerplan eenmaal met ten hoogste twee jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.12
  - number: 10.13.1
    text: Het afvalbeheerplan kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.13
  - number: 10.13.2
    text: |-
      Met betrekking tot een wijziging van het afvalbeheerplan zijn [de artikelen 10.4][ref1] tot en met [10.11][ref2] en
      [10.12, eerste lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.14.1
    text: |-
      Ieder bestuursorgaan houdt rekening met het geldende afvalbeheerplan bij het uitoefenen van
      een bevoegdheid krachtens deze wet of bij het uitoefenen van een taak of bevoegdheid krachtens
      [artikel 4.1 van de Omgevingswet][ref1], voor zover de taak of bevoegdheid wordt uitgeoefend met betrekking tot
      afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.14
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 10.14.2
    text: |-
      Voor zover het afvalbeheerplan niet voorziet in het onderwerp met betrekking waartoe de taak of bevoegdheid wordt
      uitgeoefend, houdt het bestuursorgaan rekening met de voorkeursvolgorde, aangegeven in [artikel 10.4][ref1], en de
      criteria, genoemd in [artikel 10.5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.14.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij het uitoefenen van een taak of bevoegdheid krachtens de EG-
      verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.14
  - number: 10.21.1
    text: |-
      De gemeenteraad en burgemeester en wethouders dragen, al dan niet in samenwerking met de gemeenteraad en
      burgemeester en wethouders van andere gemeenten, ervoor zorg dat ten minste eenmaal per week de huishoudelijke
      afvalstoffen met uitzondering van grove huishoudelijke afvalstoffen worden ingezameld bij elk binnen haar
      grondgebied gelegen perceel waar zodanige afvalstoffen geregeld kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.21
  - number: 10.21.2
    text: |-
      In aanvulling op het eerste lid kunnen, in het belang van een doelmatig beheer van afvalstoffen, bij algemene
      maatregel van bestuur regels worden gesteld over het zorgdragen door de gemeenteraad en burgemeesters en wethouders
      voor de inzameling van daarbij aan te wijzen afvalstoffen die in aard en samenstelling vergelijkbaar zijn met
      huishoudelijke afvalstoffen en afkomstig zijn van daarbij aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.21
  - number: 10.21.3
    text: |-
      Indien toepassing is gegeven aan het tweede lid, worden die afvalstoffen aangemerkt als huishoudelijke
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.21
  - number: 10.21.4
    text: |-
      De gemeenteraad kan besluiten tot het afzonderlijk inzamelen van andere bestanddelen van huishoudelijke
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.21
  - number: 10.22.1
    text: 'Elke gemeente draagt er zorg voor:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.22
  - number: 10.22.1.a
    text: |-
      dat grove huishoudelijke afvalstoffen worden ingezameld bij elk binnen haar grondgebied gelegen perceel waar
      zodanige afvalstoffen ontstaan, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.22
  - number: 10.22.1.b
    text: |-
      dat er op ten minste één daartoe ter beschikking gestelde plaats binnen de gemeente of binnen de gemeenten waarmee
      wordt samengewerkt, in voldoende mate gelegenheid wordt geboden om grove huishoudelijke afvalstoffen achter te
      laten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.22
  - number: 10.22.2
    text: |-
      In het belang van een doelmatig beheer van grove huishoudelijke afvalstoffen kan bij algemene maatregel van
      bestuur worden bepaald dat het eerste lid geheel of gedeeltelijk buiten toepassing blijft met betrekking tot bij
      de maatregel aangewezen categorieën van grove huishoudelijke afvalstoffen, al dan niet voor zover deze vrijkomen in
      een hoeveelheid of een omvang die, of een gewicht dat groter is dan bij de maatregel is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.22
  - number: 10.23.1
    text: |-
      De gemeenteraad stelt in het belang van de bescherming van het milieu een afvalstoffenverordening vast, tenzij de
      op grond van [artikel 10.24, eerste lid][ref1], te stellen regels zijn opgenomen in het omgevingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.23.2
    text: |-
      De afvalstoffenverordening of het omgevingsplan bevat geen regels als bedoeld in [artikel 10.48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.24.1
    text: 'De afvalstoffenverordening of het omgevingsplan bevat ten minste regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.24
  - number: 10.24.1.a
    text: |-
      het overdragen of het ter inzameling aanbieden van huishoudelijke afvalstoffen aan een bij of krachtens de
      verordening of bij omgevingsplan aangewezen inzameldienst;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.24
  - number: 10.24.1.b
    text: het overdragen van zodanige afvalstoffen aan een ander;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.24
  - number: 10.24.1.c
    text: het achterlaten van zodanige afvalstoffen op een daartoe ter beschikking gestelde plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.24
  - number: 10.24.2
    text: |-
      Bij de afvalstoffenverordening of bij omgevingsplan kunnen voorts regels worden gesteld omtrent het inzamelen van
      huishoudelijke afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.24
  - number: '10.25'
    text: 'Bij de afvalstoffenverordening of bij omgevingsplan kunnen in ieder geval regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.25
  - number: 10.25.a
    text: |-
      ten einde te voorkomen dat afvalstoffen als zwerfafval in het milieu terechtkomen dan wel teneinde te bereiken dat
      zulks zo min mogelijk gebeurt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.25
  - number: 10.25.b
    text: omtrent het opruimen van afvalstoffen die als zwerfafval in het milieu terecht zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.25
  - number: 10.25.c
    text: omtrent het op een voor het publiek zichtbare plaats aanwezig hebben van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.25
  - number: 10.26.1
    text: |-
      De gemeenteraad kan, in afwijking van [artikel 10.21][ref1], in het belang van een doelmatig beheer van
      huishoudelijke afvalstoffen bij de afvalstoffenverordening of bij omgevingsplan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.1.a
    text: huishoudelijke afvalstoffen worden ingezameld nabij elk perceel;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.26
  - number: 10.26.1.b
    text: huishoudelijke afvalstoffen worden ingezameld met een daarbij aangegeven regelmaat;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.26
  - number: 10.26.1.c
    text: in een gedeelte van het grondgebied van de gemeente geen huishoudelijke afvalstoffen worden ingezameld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.26
  - number: 10.26.2
    text: |-
      De gemeenteraad betrekt bij de voorbereiding van een afvalstoffenverordening waarin regels als bedoeld
      in het eerste lid zijn opgenomen de ingezetenen en belanghebbenden, op de wijze voorzien in de krachtens
      [artikel 150 van de Gemeentewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '10.27'
    text: |-
      In gevallen als bedoeld in [artikel 10.26, eerste lid, onder b en c][ref1], dragen de gemeenteraad en burgemeester
      en wethouders er zorg voor dat op ten minste één daartoe ter beschikking gestelde plaats binnen de gemeente of
      binnen de gemeenten waarmee wordt samengewerkt, in voldoende mate gelegenheid wordt geboden om huishoudelijke
      afvalstoffen achter te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.28.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het opnemen in de verordening
      of het omgevingsplan van een verplichting bestanddelen van huishoudelijke afvalstoffen te brengen naar een daartoe
      beschikbaar gestelde plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.28
  - number: 10.28.2
    text: |-
      Bij de maatregel kan worden aangegeven op welke wijze de gemeenteraad en burgemeester en wethouders er zorg voor
      dragen dat plaatsen als bedoeld in het eerste lid, binnen de gemeente in voldoende mate beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.28
  - number: 10.28.3
    text: |-
      Bij de maatregel kan worden bepaald dat [de artikelen 10.21, eerste lid][ref1], en
      [10.24, eerste lid, onder a][ref2], niet van toepassing zijn met betrekking tot de inzameling van de bestanddelen
      van huishoudelijke afvalstoffen, die zijn aangewezen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.29.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover het betreft gevallen waarin een doelmatig beheer van
      huishoudelijke afvalstoffen van meer dan gemeentelijk belang is, regels worden gesteld omtrent de inzameling van
      die afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29
  - number: 10.29.2
    text: |-
      Hiertoe kunnen in ieder geval behoren regels die inhouden dat burgemeester en wethouders maatregelen treffen voor
      de inzameling van die afvalstoffen of daartoe voorzieningen tot stand brengen en in stand houden. Indien zulks
      noodzakelijk is om de nuttige toepassing van afvalstoffen te faciliteren of te verbeteren wordt bij algemene
      maatregel van bestuur de verplichting opgenomen om daarbij aangegeven huishoudelijke afvalstoffen gescheiden en
      niet gemengd met afvalstoffen of materialen die niet dezelfde eigenschappen bezitten, in te zamelen, waarbij tevens
      kan worden bepaald onder welke voorwaarden afwijking van die verplichting mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29
  - number: 10.29a
    text: |-
      Een bestuursorgaan houdt er bij het uitoefenen van een bevoegdheid krachtens deze wet of bij het uitoefenen van
      een taak of bevoegdheid krachtens [artikel 4.1 van de Omgevingswet][ref1], voor zover die taak of bevoegdheid wordt
      uitgeoefend met betrekking tot afvalwater, rekening mee dat het belang van de bescherming van het milieu vereist
      dat in de navolgende voorkeursvolgorde:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 10.29a.a
    text: het ontstaan van afvalwater wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
  - number: 10.29a.b
    text: verontreiniging van afvalwater wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
  - number: 10.29a.c
    text: |-
      afvalwaterstromen gescheiden worden gehouden, tenzij het niet gescheiden houden geen nadelige gevolgen heeft voor
      een doelmatig beheer van afvalwater;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
  - number: 10.29a.d
    text: |-
      huishoudelijk afvalwater en, voor zover doelmatig en kostenefficiënt, afvalwater dat daarmee wat biologische
      afbreekbaarheid betreft overeenkomt worden ingezameld en naar een zuiveringtechnisch werk als bedoeld in de
      [Omgevingswet][ref1] getransporteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 10.29a.e
    text: ander afvalwater dan bedoeld in onderdeel d zo nodig na retentie of zuivering bij de bron, opnieuw wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
  - number: 10.29a.f
    text: |-
      ander afvalwater dan bedoeld in onderdeel d lokaal, zo nodig na retentie of zuivering bij de bron, in het milieu
      wordt gebracht en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
  - number: 10.29a.g
    text: |-
      ander afvalwater dan bedoeld in onderdeel d naar een zuiveringtechnisch werk als bedoeld in de [Omgevingswet][ref1]
      wordt getransporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.29a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '10.31'
    text: |-
      [De artikelen 10.21][ref1] tot en met [10.29][ref2] en titel 10.6 zijn niet van toepassing op het brengen van
      afvalwater en andere afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater, het
      inzamelen en transporteren van afvalwater in een zodanige voorziening en het vanuit een zodanige voorziening
      afgeven van afvalwater aan een persoon die een zuiveringstechnisch werk beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.36'
    text: |-
      Voor de toepassing van deze titel worden ingezamelde of afgegeven huishoudelijke afvalstoffen gelijkgesteld met
      bedrijfsafvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.36
  - number: 10.37.1
    text: Het is verboden zich door afgifte aan een ander van bedrijfsafvalstoffen of gevaarlijke afvalstoffen te ontdoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
  - number: 10.37.2
    text: 'Het verbod geldt niet indien bedrijfsafvalstoffen of gevaarlijke afvalstoffen worden afgegeven aan een persoon:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
  - number: 10.37.2.a
    text: |-
      die krachtens [artikel 10.45][ref1] of [10.48][ref2] bevoegd is de betrokken afvalstoffen in te zamelen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.37.2.b
    text: 'die bevoegd is de betrokken afvalstoffen nuttig toe te passen of te verwijderen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
  - number: 10.37.2.b.1°
    text: |-
      krachtens [hoofdstuk 8][ref1] van deze wet of [artikel 4.3 van de Omgevingswet][ref2] of op grond van een
      omgevingsvergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 10.37.2.b.2°
    text: |-
      op grond van een krachtens [artikel 10.2, tweede lid][ref1], verleende vrijstelling of een ontheffing krachtens
      [artikel 10.63, eerste of tweede lid][ref2], van het verbod, bedoeld in [artikel 10.2, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.37.2.b.3°
    text: |-
      krachtens [artikel 10.52][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.37.2.b.4°
    text: |-
      op grond van een krachtens [artikel 10.54, derde lid][ref1], verleende vrijstelling of een ontheffing krachtens
      [artikel 10.63, tweede lid][ref2], van het verbod, bedoeld in [artikel 10.54, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.37.2.c
    text: |-
      die krachtens [artikel 10.50][ref1] is vrijgesteld van de verplichtingen, gesteld bij of krachtens de
      [artikelen 10.38][ref2] tot en met [10.40][ref3], [10.45][ref4], [10.46][ref5] en [10.48][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.37.2.d
    text: |-
      die op grond van een omgevingsvergunning bevoegd is afvalstoffen aan boord van een vaartuig of luchtvaartuig te
      nemen met het oogmerk ze te lozen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
  - number: 10.37.2.e
    text: |-
      die in een ander land dan Nederland is gevestigd, en die overeenkomstig de EG-verordening overbrenging van
      afvalstoffen en [titel 10.7][ref1] die afvalstoffen naar dat land brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 10.37.2.f
    text: |-
      die krachtens [artikel 10.55][ref1] bevoegd is de betrokken afvalstoffen te vervoeren of te verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.38.1
    text: |-
      Degene die zich van bedrijfsafvalstoffen of gevaarlijke afvalstoffen ontdoet door deze af te geven aan een persoon
      als bedoeld in [artikel 10.37, tweede lid, onder a tot en met e][ref1], registreert met betrekking tot zodanige
      afgifte:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.38.1.a
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.1.b
    text: de naam en het adres van degene aan wie de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.1.c
    text: de gebruikelijke benaming en de hoeveelheid van die afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.1.d
    text: de plaats waar en de wijze waarop de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.1.e
    text: de voorgenomen wijze van beheer van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.1.f
    text: |-
      ingeval de afgifte geschiedt door tussenkomst van een ander die opdracht heeft de afvalstoffen te vervoeren naar
      degene voor wie deze zijn bestemd: diens naam en adres en de naam en het adres van degene in wiens opdracht het
      vervoer geschiedt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.2
    text: |-
      De geregistreerde gegevens worden ten minste vijf jaar bewaard en gedurende die periode door de afvalstoffenhouder
      ter beschikking gehouden van degenen die zijn belast met het toezicht of de douanecontrole op de naleving van de
      wet en van voorgaande afvalstoffenhouders.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
  - number: 10.38.3
    text: |-
      Een persoon als bedoeld in [artikel 10.37, tweede lid, onder a of b][ref1], die zich van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen ontdoet door deze af te geven aan een andere zodanige persoon, meldt met betrekking tot
      een zodanige afgifte de in het eerste lid bedoelde gegevens aan een door Onze Minister aan te wijzen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.39.1
    text: |-
      Degene die zich van bedrijfsafvalstoffen of gevaarlijke afvalstoffen ontdoet door afgifte aan een persoon als
      bedoeld in [artikel 10.37, tweede lid, onder a tot en met d][ref1], verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.39.1.a
    text: aan deze persoon een omschrijving van aard, eigenschappen en samenstelling van die afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.39
  - number: 10.39.1.b
    text: aan degene die opdracht heeft de afvalstoffen naar die persoon te vervoeren, een begeleidingsbrief.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.39
  - number: 10.39.2
    text: |-
      De begeleidingsbrief bevat ten minste de in het eerste lid, onder a, en de in [artikel 10.38, eerste lid][ref1],
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.1
    text: |-
      Een persoon als bedoeld in [artikel 10.37, tweede lid, onder a of b][ref1], aan wie bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen worden afgegeven, meldt met betrekking tot een zodanige afgifte, aan een door Onze
      Minister aan te wijzen instantie:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.1.a
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.1.b
    text: de naam en het adres van degene van wie de afvalstoffen afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.1.c
    text: de gebruikelijke benaming en de hoeveelheid van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.1.d
    text: de plaats waar en de wijze waarop de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.1.e
    text: de wijze waarop de afvalstoffen nuttig worden toegepast of worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.1.f
    text: |-
      ingeval de afgifte geschiedt door tussenkomst van een ander die opdracht had de afvalstoffen naar hem te vervoeren:
      diens naam en adres en de naam en het adres van degene in wiens opdracht het vervoer geschiedt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40.2
    text: |-
      Het is een persoon als bedoeld in het eerste lid verboden bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      in ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39, eerste lid, onder a en b][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.3
    text: |-
      Op verzoek van gedeputeerde staten van een provincie of burgemeester en wethouders van een gemeente die terzake
      bevoegd gezag zijn, worden de gegevens, als bedoeld in het eerste lid, aan gedeputeerde staten of burgemeester en
      wethouders gezonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40
  - number: 10.40a.1
    text: |-
      De in [artikel 10.38][ref1] gestelde verplichting de afgifte van afvalstoffen te registreren of te melden, geldt
      niet voor degene die zich ontdoet van bij algemene maatregel van bestuur aangewezen afvalstoffen afkomstig van
      schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40a.2
    text: |-
      Degene die bij algemene maatregel van bestuur aangewezen afvalstoffen afkomstig van schepen in ontvangst neemt,
      bevestigt deze ontvangst op een bij algemene maatregel van bestuur aan te geven wijze op een formulier.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.40a
  - number: 10.41.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop aan
      [de artikelen 10.38][ref1] tot en met [10.40][ref2] uitvoering wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.41.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald of de melding, bedoeld in
      [de artikelen 10.38, derde lid][ref1], en [10.40][ref2], voorafgaand aan de afgifte, onderscheidenlijk de ontvangst
      van afvalstoffen plaatsvindt of erna. Daarbij kan een onderscheid worden gemaakt naar categorie van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.42.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan aan in [artikel 10.38, eerste lid][ref1], bedoelde personen de
      verplichting worden opgelegd de in dat artikel bedoelde gegevens te melden aan een door Onze Minister aan te wijzen
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.42.2
    text: |-
      [De artikelen 10.40, derde lid][ref1], en [10.41][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.43.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot bedrijfsafvalstoffen en
      gevaarlijke afvalstoffen categorieën van gevallen worden aangewezen waarvoor verplichtingen als bedoeld in de
      [artikelen 10.38 tot en met 10.40][ref1] niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.43.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt bij of krachtens de algemene maatregel van bestuur aan
      personen als bedoeld in [artikel 10.40, eerste lid][ref1], de verplichting opgelegd de in de betrokken bepalingen
      bedoelde gegevens te registreren op een daarbij aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.44.1
    text: |-
      Degene die bedrijfsafvalstoffen of gevaarlijke afvalstoffen vervoert, is verplicht zolang hij die afvalstoffen
      onder zich heeft, een begeleidingsbrief als bedoeld in artikel 10.39 bij die afvalstoffen aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.44
  - number: 10.44.2
    text: |-
      Hij geeft, indien een ander de afvalstoffen in ontvangst neemt, de begeleidingsbrief aan die ander af, bij dat in
      ontvangst nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.44
  - number: 10.44.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop aan de
      verplichtingen, bedoeld in het eerste en tweede lid, uitvoering wordt gegeven. Tevens kunnen daarbij categorieën
      van gevallen worden aangewezen waarvoor zodanige verplichtingen niet gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.44
  - number: 10.45.1
    text: 'Het is verboden bedrijfsafvalstoffen of gevaarlijke afvalstoffen in te zamelen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.45.1.a
    text: zonder vermelding op een lijst van inzamelaars, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.45.1.b
    text: |-
      ingeval de afvalstoffen tot de krachtens [artikel 10.48][ref1] aangewezen categorieën behoren, zonder vergunning
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.45.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet, voor daarbij aangegeven categorieën van gevallen vrijstelling worden verleend van het
      verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.45.3
    text: |-
      Onze Minister wijst een instantie aan die namens hem zorg draagt voor de vermelding van inzamelaars op de in het
      eerste lid bedoelde lijst van inzamelaars.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.45.4
    text: Op aanwijzing van Onze Minister wordt de vermelding van een inzamelaar op de lijst beëindigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.45.5
    text: Onze Minister stelt regels met betrekking tot de criteria voor vermelding op de lijst en beëindiging daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.45
  - number: 10.46.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van een doelmatig beheer van
      bedrijfsafvalstoffen of gevaarlijke afvalstoffen regels gesteld omtrent het inzamelen van die afvalstoffen, al dan
      niet afkomstig van personen, behorende tot een bij of krachtens die maatregel aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.46.2
    text: 'Tot de regels behoren:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.46.2.a
    text: |-
      regels omtrent de wijze waarop een inzamelaar zich bij de krachtens [artikel 10.45, derde lid][ref1], aangewezen
      instantie meldt en de gegevens die daarbij worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.46.2.b
    text: regels inhoudende de verplichting een wijziging te melden in de gegevens welke bij de melding zijn overgelegd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.46.2.c
    text: |-
      regels omtrent het aan een ieder inzage geven van de gegevens, overgelegd bij de melding alsmede van een wijziging
      als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.46.2.d
    text: |-
      regels inhoudende de verplichting dat de inzamelaar tijdens het inzamelen daarbij aan te geven bescheiden aanwezig
      heeft, waaruit blijkt dat hij staat vermeld op de lijst van inzamelaars.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.46.3
    text: |-
      Bij de regels kan worden bepaald dat de vermelding op de lijst van inzamelaars slechts geldt voor een daarbij
      aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.46
  - number: 10.47.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van een doelmatig beheer van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen regels worden gesteld omtrent de inzameling van die afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.47.2
    text: 'Hiertoe kunnen in ieder geval behoren regels die inhouden dat:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.47.2.a
    text: |-
      burgemeester en wethouders of gedeputeerde staten voor de inzameling van die afvalstoffen maatregelen treffen of
      daartoe voorzieningen tot stand brengen en in stand houden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.47.2.b
    text: |-
      daarbij aangewezen categorieën van bedrijfsafvalstoffen of gevaarlijke afvalstoffen die gescheiden worden
      afgegeven, afzonderlijk worden ingezameld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.47.3
    text: |-
      Indien zulks noodzakelijk is om de nuttige toepassing van afvalstoffen te faciliteren of te verbeteren wordt bij
      algemene maatregel van bestuur de verplichting opgenomen om daarbij aangegeven bedrijfsafvalstoffen gescheiden en
      niet gemengd met afvalstoffen of materialen die niet dezelfde eigenschappen bezitten, in te zamelen, waarbij tevens
      kan worden bepaald onder welke voorwaarden afwijking van die verplichting mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.47.4
    text: |-
      Bij de maatregel wordt aangegeven binnen welke termijn de regels door de daarbij aangewezen bestuursorganen moeten
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.47
  - number: 10.48.1
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van een doelmatig beheer van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen worden bepaald dat voor het inzamelen van daarbij aangewezen categorieën van zodanige
      afvalstoffen een vergunning van Onze Minister is vereist.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.48
  - number: 10.48.2
    text: |-
      Het voor milieubelastende activiteiten bij of krachtens de [artikelen 4.5, tweede lid][ref1], [5.18][ref2].
      [5.19][ref3], [5.26][ref4], [5.31][ref5], [5.34, eerste en vierde lid][ref6], [5.37][ref7], [5.38][ref8],
      [5.39, aanhef en onder a][ref9], [5.40, eerste lid, onder a, en tweede lid, onder a tot en met e][ref10],
      [5.41][ref11], [5.42, tweede lid][ref12], [13.5][ref13], [16.15][ref14], [16.16][ref15],
      [16.55, eerste, derde en vierde lid][ref16], [16.65 tot en met 16.68][ref17] en [16.139 van de Omgevingswet][ref18]
      bepaalde is van overeenkomstige toepassing met betrekking tot het verlenen, weigeren, wijzigen en intrekken van
      een vergunning als bedoeld in het eerste lid, met dien verstande dat voor de toepassing van genoemde artikelen het
      belang van de bescherming van het milieu beperkt wordt tot het belang van een doelmatig beheer van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5
