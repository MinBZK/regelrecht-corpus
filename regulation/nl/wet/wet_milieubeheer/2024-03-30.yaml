  - number: 16.39ac.1
    text: |-
      Het bestuur van de emissieautoriteit kan de vergunning intrekken indien deze afdeling niet meer van toepassing is
      op de gereglementeerde entiteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ac
  - number: 16.39ac.2
    text: |-
      Met betrekking tot de beslissing ter zake is [artikel 16.39ab, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ac
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2a.2
        afdeling: 16.2.2A
  - number: 16.39ad.1
    text: |-
      De vergunninghouder meldt aan het bestuur van de emissieautoriteit een verandering van naam of adres van de
      gereglementeerde entiteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ad
  - number: 16.39ad.2
    text: 'Bij ministeriële regeling kunnen ter uitvoering van deze paragraaf regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ad
  - number: 16.39ad.2.a
    text: |-
      het melden door de gereglementeerde entiteit aan het bestuur van de emissieautoriteit van alle geplande wijzigingen
      in de aard van haar activiteiten of in de brandstoffen die zij tot verbruik uitslaat, waarvoor een aanpassing van
      de broeikasgasemissievergunning nodig zou zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ad
  - number: 16.39ad.2.b
    text: |-
      het melden door de gereglementeerde entiteit aan het bestuur van de emissieautoriteit van andere handelingen of
      omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ad
  - number: 16.39ad.2.c
    text: het goedkeuren van veranderingen van het monitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ad
  - number: 16.39ae.1
    text: |-
      De gereglementeerde entiteit monitort vanaf 2025 de emissies die overeenstemmen met de hoeveelheden brandstof die
      tot verbruik zijn uitgeslagen en brengt hierover vanaf 2026 een emissieverslag uit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ae
  - number: 16.39ae.2
    text: |-
      De gereglementeerde entiteit die op 1 januari 2025 over een vergunning beschikt rapporteert haar historische
      emissies voor het jaar 2024 uiterlijk op 30 april 2025.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ae
  - number: 16.39ae.3
    text: |-
      Op de monitoring, rapportage en verificatie van emissies zijn de [artikelen 16.4a][ref1], [16.12][ref2],
      [16.13][ref3], [16.14][ref4], [16.15][ref5], [16.16][ref6], [16.17][ref7], [16.18][ref8] van overeenkomstige
      toepassing, met dien verstande dat telkens:


