        artikel: '10'
        hoofdstuk: '10'
  - number: 11a.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van de kwaliteit van bij of krachtens de
      maatregel aangewezen werkzaamheden als bedoeld in het tweede lid, en ter bevordering van de integriteit van degenen
      die deze werkzaamheden uitvoeren, regels worden gesteld, die nodig zijn in verband met de bescherming van het
      milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2
    text: 'Werkzaamheden als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.a
    text: het verrichten van berekeningen, metingen of tellingen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.b
    text: |-
      het nemen of analyseren van monsters of het anderszins verrichten van onderzoek naar de aard of mate van
      verontreinigingen in stoffen, producten, afvalstoffen, afvalwater, lucht, oppervlaktewater, grond, organismen of
      bodem;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.c
    text: |-
      het beperken, ongedaan maken of anderszins saneren van een verontreiniging in stoffen, producten, afvalstoffen,
      afvalwater, lucht, oppervlaktewater, grond of bodem;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.d
    text: het beoordelen of inspecteren van stoffen, producten, voorzieningen of installaties;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.e
    text: |-
      het toepassen of geschikt maken voor toepassing, van stoffen, producten of afvalstoffen in een werk of het
      uitvoeren van een werk op of in de bodem;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.f
    text: |-
      het houden van toezicht op of het voorbereiden of begeleiden van werkzaamheden als bedoeld in de onderdelen a tot
      en met e;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.g
    text: |-
      bemiddelen bij, beoordelen van of adviseren of rapporteren over werkzaamheden als bedoeld in de onderdelen a tot en
      met f;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.h
    text: het afgeven, wijzigen, schorsen, intrekken of weigeren van certificaten, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.2.i
    text: werkzaamheden met betrekking tot een bodemenergiesysteem.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.3
    text: |-
      Tot de bij een maatregel krachtens het eerste lid te stellen regels kunnen behoren regels, inhoudende een verbod
      een aangewezen werkzaamheid uit te voeren zonder dat voor die werkzaamheid wordt beschikt over:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.3.a
    text: |-
      een erkenning waarmee Onze Minister, in overeenstemming met Onze betrokken Minister, of een bij de maatregel
      aangewezen instantie, heeft vastgesteld dat degene die een werkzaamheid als bedoeld in het eerste lid uitvoert
      voldoet aan bij of krachtens de maatregel gestelde eisen met betrekking tot onafhankelijkheid, deskundigheid,
      bekwaamheid, betrouwbaarheid, financiële draagkracht of andere eisen waarmee de kwaliteit van de werkzaamheden en
      de integriteit van degene die een werkzaamheid uitvoert kan worden bevorderd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.3.b
    text: |-
      een certificaat waarmee een krachtens onderdeel a erkende certificeringsinstelling kenbaar heeft gemaakt dat er
      gedurende een bepaalde periode een gerechtvaardigd vertrouwen bestaat dat een natuurlijk persoon of rechtspersoon
      voldoet aan de voor de certificering geldende normen met betrekking tot deskundigheid, bekwaamheid, het
      kwaliteitssysteem, de interne kwaliteitsbewaking, werkinstructies, klachtbehandeling of andere normen waarmee de
      kwaliteit van de werkzaamheden kan worden bevorderd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.3.c
    text: |-
      een accreditatie waarmee de Stichting Raad voor Accreditatie te Utrecht kenbaar heeft gemaakt dat er gedurende een
      bepaalde periode een gerechtvaardigd vertrouwen bestaat dat een certificeringsinstelling, een inspectie-instelling,
      een laboratorium of een andere instelling competent is voor het uitvoeren van de desbetreffende werkzaamheid en
      dat wordt voldaan aan eisen omtrent de onafhankelijkheid, onpartijdigheid, continuïteit of andere eisen waarmee de
      kwaliteit van de werkzaamheden kan worden bevorderd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.4
    text: |-
      Tot de bij een maatregel krachtens het eerste lid te stellen regels kunnen tevens behoren regels, inhoudende de
      verplichting:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.4.a
    text: te handelen overeenkomstig de aan de erkenning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.4.b
    text: |-
      te handelen overeenkomstig het voor de desbetreffende werkzaamheid bij of krachtens de maatregel aangewezen
      document;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.4.c
    text: |-
      te handelen overeenkomstig bij of krachtens de maatregel gestelde eisen omtrent de onafhankelijkheid,
      deskundigheid, bekwaamheid, betrouwbaarheid, financiële draagkracht of andere eisen waarmee de kwaliteit van de
      werkzaamheden en de integriteit van degene die een werkzaamheid uitvoert kan worden bevorderd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.4.d
    text: |-
      van een intrekking of een schorsing van een certificaat of een accreditatie een kennisgeving te doen aan Onze
      Minister of een bij de maatregel aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.5
    text: |-
      Indien toepassing wordt gegeven aan het derde lid, aanhef en onderdeel a, worden bij de maatregel regels gesteld
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.5.a
    text: |-
      de wijze waarop de aanvraag voor een erkenning moet geschieden en de gegevens die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.5.b
    text: |-
      de gronden waarop en de voorwaarden waaronder Onze Minister, in overeenstemming met Onze betrokken Minister, of een
      bij de maatregel aangewezen instantie, een erkenning kan verlenen, wijzigen, weigeren, schorsen of intrekken, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.5.c
    text: de termijn waarvoor een erkenning kan worden verleend of geschorst.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.2.6
    text: |-
      Indien op grond van het vijfde lid, onderdeel b, bij de maatregel is bepaald dat Onze Minister,
      in overeenstemming met Onze betrokken Minister of een bij de maatregel aangewezen instantie,
      een erkenning kan weigeren dan wel intrekken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], kan bij die maatregel
      worden bepaald dat voorafgaand aan de weigering of intrekking het Bureau bevordering integriteitsbeoordelingen
      door het openbaar bestuur, bedoeld in [artikel 8 van die wet][ref2] om een advies als bedoeld in
      [artikel 9 van die wet][ref3] kan worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 11a.2.7
    text: |-
      Onze Minister kan, in overeenstemming met Onze betrokken Minister, voor daarbij aangegeven categorieën van
      werkzaamheden of categorieën van natuurlijke personen, rechtspersonen of instellingen die werkzaamheden verrichten,
      vrijstelling verlenen van krachtens het derde tot en met vijfde lid gestelde regels, voor zover het belang van de
      bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.2
  - number: 11a.3
    text: |-
      Voor zover uitvoering is gegeven aan [artikel 11A.2, eerste en derde lid][ref1], kan bij de maatregel worden
      bepaald dat in bij de maatregel aangegeven gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 11a
        hoofdstuk: 11a
  - number: 11a.3.a
    text: |-
      het bevoegd gezag een aanvraag om een beschikking die bij of krachtens deze wet, dan wel bij of krachtens de in
      [artikel 13.1, tweede lid][ref1], genoemde wetten wordt gegeven, niet in behandeling neemt indien daarbij gegevens
      zijn gevoegd die afkomstig zijn van een natuurlijk persoon, rechtspersoon of instelling die in strijd heeft
      gehandeld met [artikel 11A.2, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: 11a
        hoofdstuk: 11a
  - number: 11a.3.b
    text: |-
      ter voldoening aan een bij of krachtens deze wet, dan wel bij of krachtens de in [artikel 13.1, tweede lid][ref1],
      genoemde wetten geldende verplichting geen gegevens worden verstrekt die afkomstig zijn van een natuurlijk persoon,
      rechtspersoon of instelling die in strijd heeft gehandeld met [artikel 11A.2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel11a.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: 11a
        hoofdstuk: 11a
  - number: 13.1.1
    text: |-
      Bij de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] op de voorbereiding van beschikkingen
      krachtens deze wet en van beschikkingen krachtens de in het tweede lid genoemde wetten, wordt [afdeling 13.2][ref2]
      in acht genomen, voor zover dat bij of krachtens de betrokken wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 13.1.2
    text: |-
      De in het eerste lid bedoelde wetten zijn de [Kernenergiewet][ref1], en de [Wet bescherming Antarctica][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0009449
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0002402
      - id: ref2
        bwb_id: BWBR0009449
  - number: '13.3'
    text: |-
      Zienswijzen als bedoeld in [artikel 3:15 van de Algemene wet bestuursrecht][ref1], kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 13.5.1
    text: |-
      Bij het geven van een beschikking als bedoeld in [artikel 13.1][ref1] kan het bevoegd gezag zich in ieder geval
      baseren op gegevens en onderzoeken die niet ouder zijn dan twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
  - number: 13.5.2
    text: |-
      Het eerste lid is niet van toepassing op een beschikking die krachtens de [Wet bescherming Antarctica][ref1] wordt
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009449
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.5
    references:
      - id: ref1
        bwb_id: BWBR0009449
  - number: '13.6'
    text: |-
      Indien de aanvrager daarom heeft verzocht, stelt het bevoegd gezag hem, voordat het stukken ter inzage legt die
      niet van zijn kant zijn ingebracht, in de gelegenheid die stukken in te zien met het oog op de toepassing van de
      [artikelen 19.3 tot en met 19.5][ref1]. Tot de in de eerste volzin bedoelde stukken behoren niet de verslagen,
      gemaakt overeenkomstig [artikel 3:17, tweede lid, van de Algemene wet bestuursrecht][ref2], en afschriften van
      zienswijzen, door anderen dan betrokken bestuursorganen ingebracht overeenkomstig [artikel 3:15 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 13.8.1
    text: |-
      Indien op de voorbereiding van de beschikking op een of meerdere van de aanvragen die gecoördineerd worden
      behandeld met andere aanvragen [artikel 31, vierde lid, van de Dienstenwet][ref1] van toepassing is, is dat lid van
      toepassing op de voorbereiding van alle beschikkingen op die aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel31
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.8
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '31'
  - number: 13.8.2
    text: |-
      Indien de termijn voor het geven van een beschikking op een aanvraag wordt
      verlengd overeenkomstig [artikel 31, vierde lid, van de Dienstenwet][ref1] of
      [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref2], geldt die termijn tevens voor de beschikking
      op de andere aanvragen waarmee de aanvraag gecoördineerd wordt behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.8
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.9'
    text: |-
      Indien een beslissing op een aanvraag om een vergunning of ontheffing of een beschikking tot wijziging daarvan niet
      kan worden gegeven dan nadat is voldaan aan een uit een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie voortvloeiende verplichting, wordt de termijn voor het
      geven van die beschikking opgeschort tot de ten aanzien van die verplichting geldende procedure is afgerond.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.9
  - number: '13.10'
    text: |-
      In gevallen waarin Onze Minister bevoegd is een vergunning of ontheffing te verlenen, kan hij in overeenstemming
      met Onze betrokken Minister in het belang van de veiligheid van de Staat de toepassing van [afdeling 3.4][ref1]
      en [artikel 3:44 van de Algemene wet bestuursrecht][ref2] geheel of gedeeltelijk achterwege laten, voor zover dat
      belang zulks vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.11'
    text: |-
      Het bevoegd gezag kan bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] buiten toepassing blijft
      bij de voorbereiding van de beschikking op een aanvraag om een vergunning of ontheffing of van een beschikking tot
      wijziging daarvan, indien die beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 13.11.a
    text: |-
      betrekking heeft op het beheer van gevaarlijke afvalstoffen waarvan het beheer door een ongewone omstandigheid op
      korte termijn nodig is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.11
  - number: 13.11.b
    text: |-
      betrekking heeft op het beheer van andere dan gevaarlijke afvalstoffen waarvan het beheer door een ongewone
      omstandigheid en in verband met de hoeveelheid waarin die afvalstoffen vrijkomen, op korte termijn nodig is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.11
  - number: 13.11.c
    text: |-
      strekt tot uitvoering van een verplichting, opgelegd krachtens [artikel 17.4][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 13.13.1
    text: |-
      Indien de aanvraag om een vergunning betrekking heeft op een winningsafvalvoorziening categorie A, die is gelegen
      in een ander land en die belangrijke nadelige gevolgen voor het milieu in Nederland kan hebben, wordt de aanvraag
      met de daarop betrekking hebbende stukken door gedeputeerde staten van de provincie waarbinnen bedoelde gevolgen
      zich kunnen voordoen, ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.13
  - number: 13.13.2
    text: |-
      [Artikel 3:12, derde lid, onderdelen a, b en c, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel13.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
