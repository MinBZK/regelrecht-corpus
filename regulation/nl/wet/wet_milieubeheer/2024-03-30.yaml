  - number: 22.1.4
    text: |-
      [Titel 9.2][ref1] laat het met betrekking tot stoffen of mengsels bij of krachtens de [Kernenergiewet][ref2]
      bepaalde onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel22.1
    references:
