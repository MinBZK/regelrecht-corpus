  - number: 18.16a.2
    text: |-
      Het bestuur van de emissieautoriteit legt een bestuurlijke boete op in geval van overtreding van het
      bepaalde bij [artikel 16.37, eerste lid][ref1], of [artikel 16.39t, eerste, tweede en derde lid][ref2].
      [Artikel 5:41 van de Algemene wet bestuursrecht][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16a
