  - number: '18.18'
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet of een verordening als
      bedoeld in [artikel 18.1a, eerste lid][ref1] verleende vergunning of ontheffing, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.19.1
    text: |-
      Een overheidslichaam kan – behoudens matiging door de rechter – de voor zijn rekening komende kosten van het beheer
      van afvalstoffen waarbij in strijd is gehandeld met het bij of krachtens deze wet bepaalde, verhalen op degene door
      wiens onrechtmatige daad die kosten zijn veroorzaakt, of op degene die anderszins krachtens burgerlijk recht buiten
      overeenkomst aansprakelijk is voor de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.19
  - number: 18.19.2
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      afvalstoffen ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.19
  - number: 18.19.3
    text: |-
      Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde afvalstoffen zich heeft voorgedaan, als tegenover de overheid onrechtmatig
      werd gehandeld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.19
  - number: 18.20.1
    text: |-
      De [artikelen 18.20 tot en met 18.22][ref1] hebben, in verband met de uitvoering van de EU-verordening
      markttoezicht, betrekking op de handhaving van het bepaalde bij of krachtens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.20.1.a
    text: |-
      de [titels 9.3][ref1], [9.3a][ref2] en [9.4][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '9'
  - number: 18.20.1.b
    text: de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.1.c
    text: de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.1.d
    text: de EG-verordening EU-milieukeur of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.1.e
    text: |-
      de [titels 2.5][ref1], [9.2][ref2] en [9.5][ref3], voor zover daarbij uitvoering wordt gegeven aan een
      internationale verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '9'
  - number: 18.20.2
    text: |-
      In verband met de uitvoering van het eerste lid, zijn bevoegd om, onder verstrekking van onjuiste of onvolledige
      gegevens met betrekking tot hun identiteit en hoedanigheid, stoffen, mengsels of producten te verkrijgen ten
      behoeve van het controleren van de kenmerken van deze stoffen, mengsels of producten en de verificatie van de
      betreffende documenten en de hieraan gerelateerde handelingen te verrichten voor zover dat voor de vervulling van
      hun taak noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.2.i
    text: |-
      krachtens [artikel 18.6 van de Omgevingswet][ref1] juncto [artikel 18.1a, eerste lid][ref2], aangewezen
      toezichthouders,


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.20.2.ii
    text: |-
      Onze Minister voor zover de op grond van [artikel 18.2b, eerste lid][ref1], bedoelde zorg voor de
      bestuursrechtelijke handhaving bij hem berust, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.20.2.iii
    text: |-
      Onze Minister van Economische Zaken en Klimaat, Onze Minister van Sociale Zaken en Werkgelegenheid
      of Onze Minister van Volksgezondheid, Welzijn en Sport, voor zover deze de zorg voor de
      bestuursrechtelijke handhaving ingevolge [artikel 18.2b, tweede lid][ref1], tot taak heeft.
      [Artikel 5.12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.20.3
    text: |-
      Degene die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het tweede lid, maakt daarvan een schriftelijk
      verslag op, waarin vermeld wordt:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.a
    text: zijn naam of nummer en hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.b
    text: de motivering van de noodzaak tot uitoefening van de bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.c
    text: de voorschriften op de naleving waarvan wordt toegezien;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.d
    text: |-
      het adres, waaronder indien van toepassing, het elektronische adres waar de stof, het mengsel of het product, is
      verkregen en, voor zover bekend, de omschrijving van de betrokken marktdeelnemer, bedoeld in artikel 3, onderdeel
      13, van de EU-verordening markttoezicht;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.e
    text: de onjuiste of onvolledige gegevens die zijn verstrekt bij de verkrijging van de stof, het mengsel of het product;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.f
    text: de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.20.3.g
    text: wat de uitkomst is van het onderzoek van de verkregen stof, het verkregen mengsel of het verkregen product.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.20
  - number: 18.21.1
    text: |-
      In verband met de uitvoering van [artikel 18.20, eerste lid][ref1], kan Onze ingevolge artikel 18.20, tweede
      lid, onderdelen ii en iii, bevoegde Minister, indien er geen andere doeltreffende middelen voorhanden zijn om
      een ernstig risico als bedoeld in artikel 3, onderdeel 20, van de EU-verordening markttoezicht, gevormd door een
      stof, mengsel of product, weg te nemen, een zelfstandige last opleggen aan degene die daartoe in staat is, om
      inhoud te verwijderen van of de toegang te beperken tot een online interface als bedoeld in artikel 3, onderdeel
      15, van de EU-verordening markttoezicht of opdracht te geven tot de duidelijke weergave van een waarschuwing voor
      eindgebruikers, bedoeld in artikel 3, onderdeel 21, van de EU-verordening markttoezicht, wanneer zij zich toegang
      verschaffen tot een online interface.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.21.2
    text: |-
      Indien niet binnen de daarvoor gestelde termijn aan een last als bedoeld in het eerste lid is voldaan, kan Onze
      Minister een zelfstandige last opleggen aan een aanbieder van diensten van de informatiemaatschappij, als bedoeld
      in artikel 3, onderdeel 14, van de EU-verordening markttoezicht om alle maatregelen te treffen die redelijkerwijs
      van hem kunnen worden gevergd om de toegang tot een online interface te beperken, onder meer door een daarvoor in
      aanmerking komende derde te verzoeken dergelijke maatregelen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
  - number: 18.21.3
    text: |-
      Degene tot wie een zelfstandige last als bedoeld in het eerste of het tweede lid is gericht, handelt overeenkomstig
      die last.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
  - number: 18.21.4
    text: |-
      Op grond van het eerste of tweede lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of
      filteren van internetverkeer.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
  - number: 18.21.5
    text: |-
      Voor een zelfstandige last als bedoeld in het eerste of tweede lid is voorafgaande machtiging vereist van de
      rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 18.21.6
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het vijfde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor Onze Minister, binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
  - number: 18.21.7
    text: |-
      Onze Minister maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige last, bedoeld in het
      eerste of tweede lid, bekend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.21
  - number: '18.22'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover de krachtens
      [artikel 18.6 van de Omgevingswet][ref2] juncto [artikel 18.1a, eerste lid][ref3], aangewezen toezichthouders,
      bijstand verlenen aan een markttoezichtautoriteit als bedoeld in artikel 3, onderdeel 4, van de EU-verordening
      markttoezicht, uit een andere lidstaat van de Europese Unie op grond van artikel 22 of artikel 23 van die
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.22
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 19.1a.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder milieu-informatie: alle informatie,
      neergelegd in documenten, over:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.a
    text: |-
      de toestand van elementen van het milieu, zoals lucht en atmosfeer, water, bodem, land, landschap en natuurgebieden
      met inbegrip van vochtige biotopen, kust- en zeegebieden, biologische diversiteit en haar componenten, met inbegrip
      van genetisch gemodificeerde organismen, en de interactie tussen deze elementen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.b
    text: |-
      factoren, zoals stoffen, energie, geluid, straling of afval, met inbegrip van radioactief afval, emissies,
      lozingen en ander vrijkomen van stoffen in het milieu die de onder a bedoelde elementen van het milieu aantasten of
      waarschijnlijk aantasten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.c
    text: |-
      maatregelen, met inbegrip van bestuurlijke maatregelen, zoals beleidsmaatregelen, wetgeving, plannen, programma’s,
      milieuakkoorden en activiteiten die op de onder a en b bedoelde elementen en factoren van het milieu een uitwerking
      hebben of kunnen hebben, alsmede maatregelen of activiteiten ter bescherming van die elementen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.d
    text: verslagen over de toepassing van de milieuwetgeving;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.e
    text: |-
      kosten-baten- en andere economische analyses en veronderstellingen die worden gebruikt in het kader van de onder c
      bedoelde maatregelen en activiteiten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.1.f
    text: |-
      de toestand van de gezondheid en veiligheid van de mens, met inbegrip van de verontreiniging van de voedselketen,
      indien van toepassing, de levensomstandigheden van de mens, waardevolle cultuurgebieden en bouwwerken, voorzover
      zij worden of kunnen worden aangetast door de onder a bedoelde toestand van elementen van het milieu of, via deze
      elementen, door de onder b en c bedoelde factoren, maatregelen of activiteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
  - number: 19.1a.2
    text: |-
      De definitie van «document» in [artikel 2.1 van de Wet open overheid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.1a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '2'
  - number: 19.1b.1
    text: |-
      Na het einde van de termijn waarbinnen beroep kan worden ingesteld tegen een beschikking op grond van deze wet, de
      [Kernenergiewet][ref1], de [Mijnbouwwet][ref2], de [Omgevingswet][ref3], de [Wet bescherming Antarctica][ref4], de
      [Wet bodembescherming][ref5], de [Wet geluidhinder][ref6] of de [Wet dieren][ref7] voor zover deze betrekking heeft
      op dierlijke bijproducten op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref8] van
      toepassing is, wordt, zolang zij niet is tenietgegaan, door het bevoegd gezag aan een ieder desgevraagd kosteloos
      inzage gegeven in en tegen vergoeding van ten hoogste de kosten een exemplaar verstrekt van de beschikking en
      voor zover mogelijk van de stukken die in verband met de totstandkoming daarvan overeenkomstig deze wet dan wel
      [afdeling 3.4][ref9] of [artikel 3:44 van de Algemene wet bestuursrecht][ref10] ter inzage dienden te worden
      gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0014168
      [ref3]: https://wetten.overheid.nl/BWBR0037885
