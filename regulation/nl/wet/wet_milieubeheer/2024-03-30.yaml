  - number: 1.1.1.a
    text: |-
      de hoeveelheden afvalstoffen, al dan niet via het hergebruik van producten of de verlenging van de levensduur van
      producten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.1.b
    text: de negatieve gevolgen van de geproduceerde afvalstoffen voor het milieu en de menselijke gezondheid, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.1.c
    text: het gehalte aan gevaarlijke stoffen in materialen en producten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.2
    text: 'In deze wet en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.2.a
    text: |-
      worden onder gevolgen voor het milieu in ieder geval verstaan gevolgen voor het fysieke milieu, gezien vanuit
      het belang van de bescherming van mensen, dieren, planten en goederen, van water, bodem en lucht en van
      landschappelijke, natuurwetenschappelijke en cultuurhistorische waarden en van de beheersing van het klimaat,
      alsmede van de relaties daartussen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.2.b
    text: |-
      worden onder gevolgen voor het milieu mede verstaan gevolgen die verband houden met een doelmatig beheer van
      afvalstoffen of een doelmatig beheer van afvalwater, gevolgen die verband houden met het verbruik van energie en
      grondstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.2.c
    text: |-
      worden onder bescherming van het milieu mede verstaan de verbetering van het milieu, de zorg voor een doelmatig
      beheer van afvalstoffen of een doelmatig beheer van afvalwater, de zorg voor een zuinig gebruik van energie en
      grondstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3.a
    text: |-
      onder het zich ontdoen van afvalstoffen mede verstaan het nuttig toepassen of verwijderen van afvalstoffen op de
      locatie waar deze zijn ontstaan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3.b
    text: 'onder het zich door afgifte ontdoen van afvalstoffen mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3.b.1°
    text: |-
      het voor nuttige toepassing of verwijdering brengen van afvalstoffen van een locatie naar een elders gelegen
      locatie die aan dezelfde natuurlijke of rechtspersoon behoort;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3.b.2°
    text: het tijdelijk voor nuttige toepassing afgeven van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.3.b.3°
    text: het voor verwerking afgeven van afvalstoffen aan een afvalstoffenhandelaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.4
    text: |-
      Stoffen, mengsels of voorwerpen die het resultaat zijn van een productieproces dat niet in de eerste plaats
      is bedoeld voor de productie van die stoffen, mengsels of voorwerpen worden niet als afvalstoffen maar als
      bijproducten beschouwd indien wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.4.a
    text: het is zeker dat de stoffen, mengsels of voorwerpen zullen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.4.b
    text: |-
      de stoffen, mengsels of voorwerpen kunnen onmiddellijk worden gebruikt zonder enige verdere behandeling anders dan
      die welke bij normale productie gangbaar is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.4.c
    text: de stoffen, mengsels of voorwerpen worden geproduceerd als een integraal onderdeel van een productieproces; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.4.d
    text: |-
      verder gebruik is rechtmatig, inhoudende dat de stoffen, mengsels of voorwerpen voldoen aan alle voorschriften
      inzake producten, milieu en gezondheidsbescherming voor het specifieke gebruik en dat gebruik niet zal leiden tot
      over het geheel genomen ongunstige effecten voor het milieu of de menselijke gezondheid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.5
    text: |-
      Bij ministeriële regeling kan Onze Minister bepalen dat een specifieke soort stoffen, mengsels of voorwerpen niet
      als afvalstoffen maar als bijproducten worden beschouwd, indien wordt voldaan aan criteria voor de toepassing
      van de voorwaarden, bedoeld in het vierde lid, op die soort stoffen, mengsels of voorwerpen, voor zover voor
      die soort stoffen, mengsels of voorwerpen geen criteria zijn vastgesteld krachtens artikel 5, tweede lid, van de
      kaderrichtlijn afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.6
    text: |-
      Afvalstoffen die een behandeling van recycling of andere nuttige toepassing hebben ondergaan, worden niet langer
      als afvalstoffen beschouwd, indien zij voldoen aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.6.a
    text: de stoffen, mengsels of voorwerpen zijn bestemd om te worden gebruikt voor specifieke doelen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.6.b
    text: er is een markt voor of vraag naar de stoffen, mengsels of voorwerpen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.6.c
    text: |-
      de stoffen, mengsels of voorwerpen voldoen aan de technische voorschriften voor de specifieke doelen en aan de voor
      producten geldende wetgeving en normen; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.6.d
    text: |-
      het gebruik van de stoffen, mengsels of voorwerpen heeft over het geheel genomen geen ongunstige effecten voor het
      milieu of de menselijke gezondheid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.7
    text: |-
      Bij ministeriële regeling kan Onze Minister, in overeenstemming met de in artikel 6, tweede lid, van de
      kaderrichtlijn afvalstoffen opgenomen vereisten, bepalen dat een specifieke soort afvalstoffen die een behandeling
      van recycling of andere nuttige toepassing heeft ondergaan niet langer als afvalstoffen worden beschouwd,
      indien wordt voldaan aan criteria voor de toepassing van de voorwaarden, bedoeld in het zesde lid, op die soort
      afvalstoffen, voor zover voor die soort afvalstoffen geen criteria zijn vastgesteld krachtens artikel 6, tweede
      lid, van de kaderrichtlijn afvalstoffen. Bij het vaststellen van de criteria wordt rekening gehouden met eventuele
      nadelige effecten voor het milieu en de menselijke gezondheid van de stoffen, mengsels of voorwerpen die het
      resultaat zijn van de handeling van recycling of andere nuttige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.8
    text: |-
      Bij ministeriële regeling wordt aangegeven welke stoffen, mengsels of voorwerpen in ieder geval, onverminderd het
      bepaalde in het zesde en zevende lid, worden aangemerkt als afvalstoffen, indien de houder zich daarvan ontdoet,
      voornemens is zich daarvan te ontdoen of zich daarvan moet ontdoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.9
    text: |-
      Een afvalstof wordt in ieder geval aangemerkt als huishoudelijke afvalstof onderscheidenlijk bedrijfsafvalstof,
      indien die afvalstof bij algemene maatregel van bestuur als zodanig is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.10
    text: |-
      Onze Minister kan, indien naar zijn oordeel in het belang van een doelmatig beheer van afvalstoffen een onverwijlde
      voorziening noodzakelijk is, een regeling vaststellen van de in het negende lid bedoelde strekking. Een zodanige
      regeling vervalt een jaar nadat zij in werking is getreden of, indien binnen die termijn een algemene maatregel
      van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip waarop die maatregel in werking
      treedt. Onze Minister kan de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.11
    text: |-
      Onze Minister kan nadere regels stellen omtrent de aanwijzing van gevaarlijke afvalstoffen, bedoeld in het eerste
      lid. Tevens kan Onze Minister of een door hem aan te wijzen instantie vaststellen dat een afvalstof, zoals die door
      de houder ter beoordeling wordt aangeboden:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.11.a
    text: |-
      niet de eigenschappen bezit op grond waarvan deze ingevolge bijlage III bij de kaderrichtlijn afvalstoffen als
      gevaarlijke afvalstof dient te worden aangemerkt, uitgezonderd de gevallen waarin dat het gevolg is van verdunning
      of vermenging, bedoeld om de concentratie van gevaarlijke stoffen onder de drempelwaarde voor gevaarlijke stoffen
      te brengen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.11.b
    text: |-
      hoewel deze niet als gevaarlijke afvalstof is aangewezen, toch de eigenschappen bezit op grond waarvan deze
      ingevolge de in onderdeel a genoemde bijlage als gevaarlijke afvalstof dient te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.12
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat in deze wet en de daarop berustende bepalingen wordt verstaan
      onder «genetisch gemodificeerde organismen».
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.13
    text: |-
      Een wijziging van de bijlagen gaat voor de toepassing van de in het eerste lid gegeven omschrijvingen van «nuttige
      toepassing» en «verwijdering» en voor de toepassing van het elfde lid gelden met ingang van de dag waarop aan de
      desbetreffende wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant
      wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: 1.1.16
    text: |-
      Een wijziging uit hoofde van artikel 20, eerste lid, van de kaderrichtlijn water gaat voor de toepassing van deze
      wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij
      bij ministerieel besluit, dat in de Staatscourant of op andere geschikte wijze wordt bekendgemaakt, een ander
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel1.1
  - number: '2.1'
    text: Er is een Nederlandse emissieautoriteit, gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.1
  - number: 2.2.1
    text: |-
      De emissieautoriteit heeft de in de Verordening monitoring en rapportage emissiehandel, de Verordening verificatie
      en accreditatie emissiehandel, de Verordening monitoring, rapportage en verificatie van broeikasgasemissies
      door maritiem vervoer, met uitzondering van artikel 20, derde, vierde en vijfde lid, van die verordening, en
      de in de [hoofdstukken 16][ref1], [16a][ref2], [16b][ref3], [16c][ref4] en [18][ref5] en de [titels 9.7][ref6]
      en [9.8][ref7] opgedragen taken. De emissieautoriteit is voorts de bevoegde autoriteit, bedoeld in artikel 3,
      onderdeel 13, van de Verordening koolstofcorrectie aan de grens.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16a
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16c
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk18
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: 16a
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: 16b
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: 16c
      - id: ref5
        bwb_id: BWBR0003245
        hoofdstuk: '18'
      - id: ref6
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref7
        bwb_id: BWBR0003245
        hoofdstuk: '9'
  - number: 2.2.2
    text: 'De emissieautoriteit heeft voorts tot taak:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.2.a
    text: |-
      het bijhouden van gegevens en het opstellen van rapportages met betrekking tot de naleving door Nederland van een
      voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie,
      dat de beperking van de emissies van broeikasgassen in de lucht tot doel heeft;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.2.b
    text: |-
      het verzamelen van gegevens over technieken ter bepaling van de emissies van broeikasgassen waarop,
      [titel 16.2][ref1] en [hoofdstuk 16a][ref2] en [hoofdstuk 16b][ref3] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16a
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: 16a
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 2.2.2.c
    text: het verzamelen van andere gegevens die met het oog op de uitoefening van haar taken van belang zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.2.d
    text: |-
      het rapporteren aan Onze Minister van Economische Zaken en Klimaat en aan andere bij algemene maatregel van bestuur
      aangewezen instanties over de ontwikkeling van de onder a bedoelde emissies in Nederland alsmede over de overige
      aspecten van duurzaamheid van in Nederland te gebruiken brandstoffen en elektriciteit ten behoeve van vervoer;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.2.e
    text: |-
      de uitvoering van gedelegeerde handelingen en uitvoeringshandelingen die de Europese Commissie op grond van
      artikel 10bis, eerste en eenentwintigste lid, onderscheidenlijk artikel 28 quater van de EG-richtlijn handel in
      broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij algemene maatregel van bestuur kan de emissieautoriteit, voorzover die taken niet de uitoefening van openbaar
      gezag inhouden, worden belast met andere taken dan in het eerste of tweede lid bedoeld, in het bijzonder taken
      betreffende de uitvoering door Nederland van een voor Nederland verbindend verdrag of een voor Nederland verbindend
      besluit van een volkenrechtelijke organisatie, dat de beperking van de emissies van broeikasgassen in de lucht tot
      doel heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de inhoud van de taken van de
      emissieautoriteit nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.2.5
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover dat noodzakelijk is voor een effectieve en efficiënte
      uitvoering van de Verordening koolstofcorrectie aan de grens en in afwijking in zoverre van het bepaalde in het
      eerste lid, de taken en bevoegdheden van de bevoegde autoriteit die voortvloeien uit artikel 17 van die verordening
      worden toegewezen aan een andere uitvoeringsorganisatie van het Rijk.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.2
  - number: 2.3.1
    text: Het bestuur van de emissieautoriteit bestaat uit ten hoogste vijf leden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.3
  - number: 2.3.2
    text: |-
      Onze Minister van Economische Zaken en Klimaat benoemt uit de leden een voorzitter en een plaatsvervangend
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.3
  - number: 2.3.3
    text: De leden worden benoemd voor een periode van vier jaren. Zij zijn aansluitend twee malen herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.3
  - number: '2.5'
    text: |-
      Leden van het bestuur van de emissieautoriteit en medewerkers van de emissieautoriteit zijn direct noch
      indirect betrokken bij het overdragen van broeikasgasemissierechten, emissiereductie-eenheden, gecertificeerde
      emissiereducties, toegewezen eenheden en verwijderingseenheden, behoudens voor zover die betrokkenheid noodzakelijk
      is ter uitvoering van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.5
  - number: 2.7.1
    text: |-
      Onze Minister van Economische Zaken en Klimaat stelt aan het bestuur van de emissieautoriteit ambtenaren ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.7
  - number: 2.7.2
    text: |-
      Het bestuur van de emissieautoriteit draagt er zorg voor dat de werkzaamheden die voortvloeien uit
      [artikel 18.2f][ref1], gescheiden worden uitgevoerd van de overige werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: '2.8'
    text: De emissieautoriteit stelt een bestuursreglement vast waarin haar werkwijze wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.8
  - number: '2.9'
    text: |-
      In afwijking van [artikel 18, eerste lid, eerste volzin, van de Kaderwet zelfstandige bestuursorganen][ref1] stelt
      het bestuur van de emissieautoriteit jaarlijks voor 1 juli een jaarverslag op.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 2.16.1
    text: |-
      Onverminderd [artikel 16.8][ref1] verstrekken het bestuur van de emissieautoriteit en het bestuursorgaan
      dat bevoegd is een omgevingsvergunning te verlenen voor een milieubelastende activiteit met betrekking
      tot een broeikasgasinstallatie als bedoeld in [artikel 16.1, tweede lid][ref2], elkaar op verzoek of uit
      eigen beweging tijdig alle redelijkerwijs benodigde gegevens voor de uitoefening van de taken, waarmee zij
      zijn belast bij of krachtens de [hoofdstukken 16][ref3] en [18][ref4] van deze wet, onderscheidenlijk de
      [afdelingen 4.1][ref5], [5.1][ref6], [16.1][ref7], [16.2][ref8], [16.3][ref9], [16.5][ref10] en [16.8][ref11] en
      [hoofdstuk 18 van de Omgevingswet][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
