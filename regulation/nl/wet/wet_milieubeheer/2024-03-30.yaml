  - number: 18.16l
    text: |-
      In afwijking van [artikel 5:45, eerste lid, van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid
      tot het opleggen van een bestuurlijke boete op grond van de [artikelen 18.16a, eerste en tweede lid][ref2], en
      [18.16b, eerste lid][ref3] en [18.16c, eerste lid][ref4], tien jaren nadat de overtreding heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16l
    references:
