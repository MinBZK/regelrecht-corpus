        afdeling: 16.2.1
      - id: ref5
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.35.1
    text: |-
      Broeikasgasemissierechten worden overeenkomstig de Verordening EU-register handel in emissierechten verleend aan de
      exploitant van de broeikasgasinstallatie. Verlening van broeikasgasemissierechten vindt slechts plaats, indien voor
      de betrokken broeikasgasinstallatie een vergunning als bedoeld in [artikel 16.5][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.35.2
    text: |-
      Het bestuur van de emissieautoriteit verleent voor een broeikasgasinstallatie als bedoeld in
      [artikel 16.32, eerste lid][ref1], het aantal broeikasgasemissierechten dat overeenkomstig dat lid aan die
      broeikasgasinstallatie is toegewezen. Het eerste lid, tweede volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.35c.1
    text: |-
      Het bestuur van de emissieautoriteit kan broeikasgasemissierechten die, gelet op de wijziging van het daaraan
      ten grondslag liggende toewijzingsbesluit, onverschuldigd zijn verleend, terugvorderen van de exploitant van de
      broeikasgasinstallatie. Indien de exploitant van de broeikasgasinstallatie, onvoldoende broeikasgasemissierechten
      bezit, kan een met de waarde van die rechten corresponderend bedrag worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35c
  - number: 16.35c.2
    text: |-
      Het bestuur van de emissieautoriteit kan het terug te vorderen bedrag dat met de waarde van de onverschuldigd
      verleende broeikasgasemissierechten correspondeert, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35c
  - number: 16.35c.3
    text: |-
      Het bestuur van de emissieautoriteit kan broeikasgasemissierechten die, gelet op de wijziging van het daaraan
      ten grondslag liggende toewijzingsbesluit, onverschuldigd zijn verleend, verrekenen met de hoeveelheid voor
      de exploitant van de broeikasgasinstallatie, te verlenen broeikasgasemissierechten voor de daarop volgende
      handelsperiode.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35c
  - number: 16.35c.4
    text: |-
      Terugvordering vindt niet plaats voor zover na de dag waarop het besluit houdende kosteloze toewijzing van
      broeikasgasemissierechten is bekendgemaakt, acht jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35c
  - number: 16.35c.5
    text: |-
      Bij het bepalen van de waarde van een broeikasgasemissierecht, bedoeld in het eerste lid, tweede volzin, wordt
      uitgegaan van de gemiddelde marktprijs van een dergelijk recht op het moment van terugvordering. Bij ministeriële
      regeling worden nadere regels gesteld met betrekking tot de wijze waarop de gemiddelde marktprijs van een
      broeikasgasemissierecht wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.35c
  - number: 16.36.1
    text: Een broeikasgasemissierecht dat met ingang van 1 januari 2013 is verleend, is voor onbepaalde tijd geldig.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.36
  - number: 16.36.2
    text: |-
      Een broeikasgasemissierecht dat met ingang van 1 januari 2021 is verleend, bevat een aanduiding waaruit blijkt in
      welke periode van tien jaar te rekenen vanaf 1 januari 2021 het is verstrekt en is geldig voor emissies met ingang
      van het eerste jaar van die periode.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.36
  - number: 16.36.3
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.36
  - number: 16.37.1
    text: |-
      Onverminderd artikel 30, tiende lid, van de Verordening EU-register handel in emissierechten, levert de
      exploitant van de broeikasgasinstallatie, niet zijnde een broeikasgasinstallatie voor de verbranding van
      stedelijk afval, met betrekking tot ieder kalenderjaar voor 1 oktober van het daarop volgende kalenderjaar ten
      minste een aantal broeikasgasemissierechten, niet zijnde broeikasgasemissierechten die zijn verleend krachtens
      [afdeling 16.2.2][ref1], in, dat overeenkomt met de hoeveelheid van de emissie, die de broeikasgasinstallatie in
      het eerstbedoelde kalenderjaar heeft veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.37.2
    text: |-
      Ter bepaling van de hoeveelheid van de emissie, bedoeld in het eerste lid, worden de gegevens in acht genomen,
      die overeenkomstig de Verordening EU-register handel in emissierechten in het EU-register voor de handel in
      emissierechten zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.37
  - number: 16.37.3
    text: |-
      Voor emissies van broeikasgassen die geacht worden te zijn afgevangen en gebruikt op zo een manier dat ze permanent
      chemisch in een product worden gebonden en bij normaal gebruik, waaronder normale activiteiten die plaatsvinden
      na het einde van de levensduur van het product, niet in de atmosfeer terecht komen, ontstaat geen verplichting om
      broeikasgasemissierechten in te leveren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.37
  - number: 16.37.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorschriften om te beoordelen of
      broeikasgassen permanent chemisch in een product zijn gebonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.37
  - number: '16.39'
    text: |-
      Indien de exploitant van de broeikasgasinstallatie, ter voldoening aan [artikel 16.37, eerste lid][ref1],
      met betrekking tot een kalenderjaar minder broeikasgasemissierechten heeft ingeleverd dan overeenkomt met de
      hoeveelheid van de emissie, die de broeikasgasinstallatie gedurende dat kalenderjaar heeft veroorzaakt, wordt het
      aantal broeikasgasemissierechten dat hij in het daarop volgende kalenderjaar ter uitvoering van dat artikel dient
      in te leveren, van rechtswege verhoogd met het aantal broeikasgasemissierechten dat hij te weinig had ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.39a.1
    text: 'Deze afdeling is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.1.a
    text: |-
      vliegtuigexploitanten ten aanzien waarvan Nederland verantwoordelijk is voor de administratie van de regeling voor
      de handel in broeikasgasemissierechten binnen de Gemeenschap en die luchtvaartactiviteiten als bedoeld in bijlage I
      bij de EG-richtlijn handel in broeikasgasemissierechten uitvoeren;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.1.b
    text: niet-CO-effecten van de luchtvaart;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.1.c
    text: |-
      scheepvaartmaatschappijen waarvoor Nederland verantwoordelijk is voor het beheer van het EU-ETS en die maritieme
      vervoersactiviteiten uitvoeren als bedoeld in bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.1.d
    text: |-
      emissies van bij algemene maatregel van bestuur aangewezen broeikasgassen veroorzaakt door luchtvaartactiviteiten
      als bedoeld onder a of maritiem vervoer als bedoeld onder c.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.2
    text: |-
      Nederland is ten aanzien van een vliegtuigexploitant administrerende lidstaat als bedoeld in het eerste lid, onder
      a:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.2.a
    text: |-
      indien de vliegtuigexploitant beschikt over een geldige vergunning als bedoeld in
      [artikel 16 van de Luchtvaartwet][ref1] die valt onder verordening (EG) nr. 1008/2008 van het Europees Parlement
      en de Raad van de Europese Unie van 24 september 2008 inzake gemeenschappelijke regels voor de exploitatie van
      luchtdiensten in de Gemeenschap (PbEU L 293);


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 16.39a.2.b
    text: |-
      in gevallen waarin de vliegtuigexploitant niet beschikt over een geldige, door een lidstaat overeenkomstig de
      verordening, genoemd onder a, verleende exploitatievergunning: indien aan Nederland het grootste deel van de
      geschatte luchtvaartemissies van door de betrokken vliegtuigexploitant in het basisjaar uitgevoerde vluchten
      kan worden toegeschreven als bedoeld in artikel 18bis, eerste lid, onder b, van de EG-richtlijn handel in
      broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.4
    text: |-
      Nederland is administrerende autoriteit voor een scheepvaartmaatschappij die wordt vermeld op de door de Europese
      Commissie gepubliceerde lijst van scheepvaartmaatschappijen die een in bijlage I bij de EG-richtlijn handel in
      broeikasgasemissierechten vermelde maritieme vervoersactiviteit uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5
    text: |-
      De toewijzing van emissierechten aan scheepvaartmaatschappijen en de inleveringsverplichting van emissierechten
      door scheepvaartmaatschappijen is van toepassing op:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5.a
    text: |-
      50% van de emissies van schepen die reizen uitvoeren vanuit een Nederlandse haven naar een buiten de Europese Unie
      gelegen aanloophaven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5.b
    text: |-
      50% van de emissies van schepen die reizen uitvoeren vanuit een buiten de Europese Unie gelegen aanloophaven naar
      een Nederlandse haven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5.c
    text: |-
      100% van de emissies van schepen die reizen uitvoeren van een Nederlandse haven naar een binnen de Europese Unie
      gelegen aanloophaven en vice versa;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5.d
    text: 100% van de emissies van schepen in een Nederlandse aanloophaven
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.5
    text: |-
      Voor de toepasselijkheid van het tweede lid, aanhef en onder b, wordt uitgegaan van de meest actuele uitgave van de
      door de Commissie van de Europese Gemeenschappen op grond van artikel 18bis, derde lid, van de EG-richtlijn handel
      in broeikasgasemissierechten gepubliceerde lijst.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39a.6
    text: |-
      Bij de administratie van vliegtuigexploitanten neemt het bestuur van de emissieautoriteit de richtsnoeren in acht
      die de Commissie van de Europese Gemeenschappen overeenkomstig artikel 18bis, vierde lid, van de EG-richtlijn
      handel in broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39a
  - number: 16.39b
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de interpretatie van de luchtvaartactiviteiten,
      bedoeld in bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten. Deze regels voldoen in elk geval aan
      de richtsnoeren die de Commissie van de Europese Gemeenschappen op grond van artikel 3 ter van genoemde richtlijn
      heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39b
  - number: 16.39d.1
    text: |-
      De ingevolge artikel 12, eerste lid, van de Verordening monitoring en rapportage emissiehandel of artikel 6,
      achtste lid, van de Verordening monitoring, rapportage en verificatie van broeikasgasemissies door maritiem vervoer
      vereiste goedkeuring wordt door het bestuur van de emissieautoriteit geweigerd, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39d
  - number: 16.39d.1.a
    text: |-
      het monitoringsplan niet voldoet aan de eisen die daaraan gesteld zijn bij bij of krachtens de genoemde
      verordeningen of bij of krachtens dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39d
  - number: 16.39d.1.b
    text: |-
      het bestuur van oordeel is dat onvoldoende is gewaarborgd dat de vliegtuigexploitant of scheepvaartmaatschappij in
      staat is het monitoringsplan naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39d
  - number: 16.39d.2
    text: |-
      Het eerste lid is niet van toepassing op vluchten vermeld in [artikel 16.39sb, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39d
