      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 20.3.1
    text: |-
      Een besluit op grond van: - deze wet;
        - de [artikelen 34][ref1], [39, eerste lid, van de Mijnbouwwet][ref2], met uitzondering van een besluit omtrent een
      mijnbouwmilieuvergunning voor een mijnbouwwerk te plaatsen of geplaatst aan de zeezijde van de in de [bijlage bij
      de Mijnbouwwet](onbekend) vastgelegde lijn en een besluit omtrent instemming met een winningsplan of opslagplan,
      voor zover het winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen geschiedt vanuit of in een
      voorkomen dat is gelegen aan de zeezijde van de in de bijlage bij de Mijnbouwwet vastgelegde lijn;
        - de [Kernenergiewet][ref3];
        - de [Wet bescherming Antarctica][ref4];
        - de EG-verordening overbrenging van afvalstoffen; waartegen ingevolge artikel 2 van de bij de Algemene
      wet bestuursrecht behorende [Bevoegdheidsregeling bestuursrechtspraak][ref5] beroep bij de Afdeling
      bestuursrechtspraak van de Raad van State kan worden ingesteld, treedt in werking met ingang van de dag
      na de dag waarop de termijn voor het indienen van een bezwaarschrift afloopt, dan wel, indien ingevolge
      [artikel 7:1, eerste lid, onderdeel d of e, van de Algemene wet bestuursrecht][ref6] geen bezwaar kan worden
      gemaakt, met ingang van de dag na de dag waarop de termijn voor het indienen van een beroepschrift afloopt. Indien
      gedurende die termijn bij de bevoegde rechter een verzoek om voorlopige voorziening is gedaan, treedt het besluit
      niet in werking voordat op dat verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002402
      [ref4]: https://wetten.overheid.nl/BWBR0009449
      [ref5]: https://wetten.overheid.nl/BWBR0005537
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '39'
      - id: ref3
