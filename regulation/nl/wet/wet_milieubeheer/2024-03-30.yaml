  - number: 18.16s.2
    text: |-
      De boete, bedoeld in het eerste lid, bedraagt ten hoogste € 450 000 per overtreding, of, indien de omzet van
      de betrokken onderneming in het boekjaar voorafgaand aan het jaar waarin de beschikking tot oplegging van de
      bestuurlijke boete is gegeven meer dan € 4 500 000 bedraagt, ten hoogste 10% van die omzet.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16s
  - number: 18.16s.3
    text: |-
      [Artikel 18.16e, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
