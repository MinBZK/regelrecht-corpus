  - number: 16a.3.3.a
    text: voor «vergunning» wordt gelezen «goedkeuring van een elektriciteitsmonitoringsplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.3.b
    text: voor «vergunninghouder» wordt gelezen «de exploitant van een broeikasgasinstallatie»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.3.c
    text: voor «monitoringsplan» wordt gelezen «elektriciteitsmonitoringsplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.3.d
    text: voor «emissieverslag» wordt gelezen «elektriciteitsemissieverslag»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.3.e
    text: |-
      voor «Verordening monitoring en rapportage emissiehandel» wordt gelezen «de regels gesteld bij of krachtens
      [hoofdstuk 16a][ref1]».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16a
  - number: 16a.3.4
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.4.a
    text: |-
      het melden van een wijziging of een tijdelijke afwijking van het elektriciteitsmonitoringsplan aan het bestuur van
      de emissieautoriteit;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.3.4.b
    text: het goedkeuren van een wijziging van het elektriciteitsmonitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.3
  - number: 16a.4
    text: |-
      Het bestuur van de emissieautoriteit weigert de goedkeuring van een elektriciteitsmonitoringsplan indien het
      elektriciteitsmonitoringsplan niet voldoet aan de eisen die daaraan gesteld zijn bij of krachtens dit hoofdstuk of
      het bestuur van de emissieautoriteit van oordeel is dat onvoldoende is gewaarborgd dat de aanvrager in staat is het
      elektriciteitsmonitoringsplan naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.4
  - number: 16a.5.1
    text: 'De exploitant van een broeikasgasinstallatie wijzigt het elektriciteitsmonitoringsplan zo spoedig mogelijk, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.5
  - number: 16a.5.1.a
    text: |-
      de regels gesteld bij of krachtens [hoofdstuk 16a][ref1] daartoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16a
  - number: 16a.5.1.b
    text: het bestuur van de emissieautoriteit daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.5
  - number: 16a.5.2
    text: |-
      De exploitant van een broeikasgasinstallatie legt op verzoek van het bestuur van de emissieautoriteit de meest
      actuele versie van het elektriciteitsmonitoringsplan over.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.5
  - number: 16a.6.1
    text: |-
      De exploitant van een broeikasgasinstallatie dient elk jaar een elektriciteitsemissieverslag in bij de
      emissieautoriteit gelijktijdig met het emissieverslag, bedoeld in [artikel 16.1, derde lid][ref1], tenzij het
      tarief, bedoeld in [artikel 71f, eerste lid, van de Wet belastingen op milieugrondslag][ref2], nihil is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel71f
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 71f
  - number: 16a.6.2
    text: Het elektriciteitsemissieverslag bevat de elektriciteitsjaarvracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.6
  - number: 16a.7.1
    text: |-
      Het bestuur van de emissieautoriteit kan uiterlijk op 30 september van het kalenderjaar waarin het
      elektriciteitsemissieverslag moet worden ingediend, vaststellen dat dit verslag niet voldoet aan de eisen die
      daaraan bij of krachtens dit hoofdstuk zijn gesteld. Het bestuur van de emissieautoriteit kan de beslissing
      voor ten hoogste drie maanden verdagen. Van de verdaging wordt voor het in de eerste volzin genoemde tijdstip
      schriftelijk mededeling gedaan aan degene die het elektriciteitsemissieverslag heeft ingediend. De mededeling omvat
      de reden voor de verdaging.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.7
  - number: 16a.7.2
    text: |-
      Het bestuur van de emissieautoriteit kan na het tijdstip, genoemd in het eerste lid, onderscheidenlijk, indien
      toepassing is gegeven aan de tweede volzin van dat lid, na het tijdstip dat met toepassing van die volzin is
      vastgesteld alsnog vaststellen dat het elektriciteitsemissieverslag niet voldoet aan de eisen die daaraan bij of
      krachtens dit hoofdstuk zijn gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.7
  - number: 16a.7.2.a
    text: |-
      degene bij het bestuur van de emissieautoriteit een elektriciteitsemissieverslag heeft ingediend, in dat verslag
      onjuiste of onvolledige gegevens heeft verstrekt en verstrekking van juiste of volledige gegevens zou hebben geleid
      tot de vaststelling van een andere elektriciteitsjaarvracht;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.7
  - number: 16a.7.2.b
    text: |-
      het betrokken elektriciteitsemissieverslag anderszins onjuist was en de betrokken persoon dit wist of behoorde
      te weten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.7
  - number: 16a.7.3
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt tien jaren na afloop van het kalenderjaar, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.7
  - number: 16a.8.1
    text: |-
      Bij de opwekking van elektriciteit zonder een warmtekrachtkoppeling, bepaalt en registreert de exploitant van een
      broeikasgasinstallatie zijn elektriciteitsjaarvracht op basis van het brandstofverbruik en het grondstofverbruik
      overeenkomstig het goedgekeurde elektriciteitsmonitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.2
    text: |-
      Bij de opwekking van elektriciteit met een warmtekrachtkoppeling, bepaalt en registreert de exploitant van een
      broeikasgasinstallatie zijn elektriciteitsjaarvracht op basis van het brandstofverbruik, de elektriciteitsopwekking
      en de warmteopwekking overeenkomstig het goedgekeurde elektriciteitsmonitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.3.a
    text: de bepaling en registratie van de elektriciteitsjaarvracht, bedoeld in het eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.3.b
    text: |-
      de bepaling en registratie van de elektriciteitsjaarvracht bij de opwekking van elektriciteit door middel van
      restgassen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.4
    text: |-
      Het bestuur van de emissieautoriteit kan de elektriciteitsjaarvracht van een inrichting op basis van een
      conservatieve schatting ambtshalve vaststellen indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.4.a
    text: het elektriciteitsemissieverslag niet of niet tijdig bij de emissieautoriteit is ingediend;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
  - number: 16a.8.4.b
    text: |-
      het bestuur van de emissieautoriteit ingevolge [artikel 16a.7, eerste of tweede lid][ref1], heeft verklaard dat het
      elektriciteitsemissieverslag niet voldoet aan de eisen die daaraan bij of krachtens dit hoofdstuk zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16a
        hoofdstuk: 16a
  - number: 16a.9.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot broeikasgasinstallaties als bedoeld in
      [artikel 16a.2, eerste lid][ref1], regels worden gesteld die nodig zijn in het belang van de goede werking van
      het monitoren van emissie als gevolg van elektriciteitsopwekking. Bij onderscheidenlijk krachtens de maatregel
      kan worden bepaald dat bij onderscheidenlijk krachtens de maatregel gestelde regels slechts gelden in daarbij
      aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16a
        hoofdstuk: 16a
  - number: 16a.9.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verificatie van
      het elektriciteitsemissieverslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.9
  - number: 16b.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *broeikasgasinstallatie:*
      broeikasgasinstallatie als bedoeld in de [artikelen 16.1, tweede lid][ref1], en [16.3][ref2]; -
      *dispensatierecht:* dispensatierecht als bedoeld in [artikel 71h, onderdeel d, van de Wet belasting
      op milieugrondslag](onbekend); - *historisch industrieel emissieverslag:* verslag ten behoeve van het
      vaststellen van het historisch activiteitenniveau van afvalverbrandingsinstallaties en lachgasinstallaties; -
      *industrieel emissieverslag:* verslag betreffende de industriële jaarvracht in een kalenderjaar als bedoeld in
      [artikel 16b.3][ref3]; - *industriële jaarvracht:* industriële jaarvracht als bedoeld in [artikel 71h, onderdeel
      h, van de Wet belastingen op milieugrondslag](onbekend); - *industrieel monitoringsplan:* plan betreffende de
      bepaling en registratie van de industriële jaarvracht; - *restgassen:* afgas als bedoeld in artikel 2, elfde lid,
      van de Verordening kosteloze toewijzing van emissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.1
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.2.1
  - number: 16b.1.2
    text: |-
      [Artikel 16.1, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
  - number: 16b.2
    text: |-
      Dit hoofdstuk is van toepassing op de exploitant van een industriële installatie als bedoeld in [artikel 71h,
      onderdeel g](onbekend), in samenhang met de [artikelen 71i](onbekend) en [71k, tweede lid, van de Wet belastingen
      op milieugrondslag](onbekend).
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.2
  - number: 16b.3.1
    text: |-
      De exploitant van een industriële installatie dient na afloop van elk jaar op uiterlijk 31 maart een industrieel
      emissieverslag in bij het bestuur van de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.3
  - number: 16b.3.2
    text: Het industrieel emissieverslag bevat de industriële jaarvracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.3
  - number: 16b.3.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de bepaling en registratie van de
      industriële jaarvracht, het industrieel emissieverslag, het historisch industrieel emissieverslag en de verificatie
      van deze emissieverslagen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.3
  - number: 16b.4
    text: 'De exploitant van een industriële installatie bepaalt de industriële jaarvracht op basis van:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.4
  - number: 16b.4.a
    text: |-
      de gegevens uit het emissieverslag dan wel de schatting hiervan door het bestuur van de emissieautoriteit als
      bedoeld in de artikel 70 van de Verordening monitoring en rapportage emissiehandel;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.4
  - number: 16b.4.b
    text: |-
      de gegevens uit het verslag over het activiteitsniveau, bedoeld in artikel 3, eerste lid, van de Verordening
      aanpassingen kosteloze toewijzing door verandering activiteitsniveau dan wel de schatting hiervan door het bestuur
      van de emissieautoriteit, bedoeld in de artikel 3, vierde lid, van de Verordening aanpassingen kosteloze toewijzing
      door verandering activiteitsniveau; of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.4
  - number: 16b.4.c
    text: |-
      de monitoring op basis van een industrieel monitoringsplan als bedoeld in [afdeling 16b.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
        afdeling: 16b.2.2
  - number: 16b.5.1
    text: |-
      Bij een warmtekrachtkoppeling wordt de industriële jaarvracht bepaald en geregistreerd op basis van het
      brandstofverbruik, de elektriciteitsopwekking en de warmteopwekking.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.5
  - number: 16b.5.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de bepaling en registratie van de industriële
      jaarvracht. Deze regels kunnen betrekking hebben op warmtekrachtkoppelingen, bij het gebruik van restgassen en de
      overdracht van warmte naar een andere industriële installatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.5
  - number: 16b.6.1
    text: |-
      Het bestuur van de emissieautoriteit kan uiterlijk op 30 september van het kalenderjaar waarin het industrieel
      emissieverslag moet worden ingediend, vaststellen dat dit verslag niet voldoet aan de eisen die daaraan bij of
      krachtens dit hoofdstuk zijn gesteld. Het bestuur van de emissieautoriteit kan de beslissing voor ten hoogste drie
      maanden verdagen. Van de verdaging wordt voor het in de eerste volzin genoemde tijdstip schriftelijk mededeling
      gedaan aan degene die het industrieel emissieverslag heeft ingediend. De mededeling omvat de reden voor de
      verdaging.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.2
    text: |-
      Het bestuur van de emissieautoriteit kan na het tijdstip, genoemd in het eerste lid, onderscheidenlijk, indien
      toepassing is gegeven tweede volzin van dat lid, na het tijdstip dat met toepassing van die volzin is vastgesteld
      alsnog vaststellen dat het industrieel emissieverslag niet voldoet aan de eisen die daaraan bij of krachtens dit
      hoofdstuk zijn gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.2.a
    text: |-
      degene die bij het bestuur van de emissieautoriteit een industrieel emissieverslag heeft ingediend, in dat verslag
      onjuiste of onvolledige gegevens heeft verstrekt en verstrekking van juiste of volledige gegevens zou hebben geleid
      tot de vaststelling van een andere industriële jaarvracht;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.2.b
    text: |-
      het betrokken industrieel emissieverslag anderszins onjuist was en de betrokken persoon dit wist of behoorde te
      weten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.3
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt tien jaren na afloop van het kalenderjaar, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.4
    text: |-
      Het bestuur van de emissieautoriteit kan de industriële jaarvracht van een industriële installatie op basis van een
      conservatieve schatting ambtshalve vaststellen indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.4.a
    text: het industrieel emissieverslag niet of niet tijdig bij de emissieautoriteit is ingediend;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
  - number: 16b.6.4.b
    text: |-
      het bestuur van de emissieautoriteit heeft verklaard dat het industrieel emissieverslag niet voldoet aan de eisen
      die daaraan bij of krachtens dit [hoofdstuk][ref1] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.7.1
    text: |-
      De exploitant stelt, voor zover dat noodzakelijk is, voor een industriële installatie een industrieel
      monitoringsplan op dat hij indient bij het bestuur van de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.2
    text: |-
      Een industrieel monitoringsplan of een wijziging daarvan behoeft goedkeuring van het bestuur van de
      emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3
    text: |-
      De [artikelen 16.7][ref1], [16.9][ref2], [16.11][ref3], [16.18][ref4] en [16.19][ref5] zijn van overeenkomstige
      toepassing met dien verstande dat telkens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16b.7.3.a
    text: voor «broeikasgasinstallatie» wordt gelezen «industriële installatie»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3.b
    text: voor «emissieverslag» wordt gelezen «industrieel emissieverslag»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3.c
    text: voor «monitoringsplan» wordt gelezen «industrieel monitoringsplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3.d
    text: voor «vergunning» wordt gelezen «goedkeuring van een industrieel monitoringsplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3.e
    text: voor «vergunninghouder» wordt gelezen «de exploitant»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.3.f
    text: |-
      voor «bij de Verordening monitoring en rapportage emissiehandel of bij of krachtens dit hoofdstuk, hoofdstuk 8
      van deze wet» wordt gelezen «bij of krachtens dit hoofdstuk, de [hoofdstukken 8][ref1], [16][ref2] of 16a van deze
      wet».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 16b.7.4
    text: |-
      Bij ministeriële regeling worden regels gesteld die nodig zijn in het belang van de goede werking van het monitoren
      van emissie van de industriële jaarvracht of in welke gevallen een monitoringsplan in elk geval noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.7.5
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop de aanvraag om een goedkeuring
      van een industrieel monitoringsplan moet geschieden, de gegevens en de bescheiden die door de aanvrager moeten
      worden verstrekt met het oog op de beslissing op de aanvraag, en de wijze waarop die gegevens moeten worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.7
  - number: 16b.8.1
    text: |-
      Het industrieel monitoringplan bestaat uit een gedetailleerde, volledige en transparante documentatie over de
      monitoringmethode voor een industriële installatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.8
  - number: 16b.8.2
    text: |-
      Bij ministeriële regeling worden regels gesteld aan de inhoud van het industrieel monitoringplan. De regels zijn
      voor zover mogelijk in overeenstemming met de Verordening monitoring en rapportage emissiehandel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.8
  - number: 16b.9
    text: |-
      Het bestuur van de emissieautoriteit weigert de goedkeuring van een industrieel monitoringsplan indien
      het industrieel monitoringsplan niet voldoet aan de eisen die daaraan gesteld zijn bij of krachtens dit
      [hoofdstuk][ref1] of indien het bestuur van de emissieautoriteit van oordeel is dat onvoldoende is gewaarborgd dat
      de aanvrager in staat is het industrieel monitoringsplan naar behoren uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.10.1
    text: 'De exploitant wijzigt het industrieel monitoringsplan zo spoedig mogelijk, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.10.1.a
    text: |-
      de regels gesteld bij of krachtens dit [hoofdstuk][ref1] daartoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.10.1.b
    text: het bestuur van de emissieautoriteit daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.10.2
    text: |-
      De exploitant legt op verzoek van het bestuur van de emissieautoriteit de meest actuele versie van het industrieel
      monitoringsplan over.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.10.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.10.3.a
    text: |-
      het melden van een wijziging of een tijdelijke afwijking van het industrieel monitoringsplan aan het bestuur van de
      emissieautoriteit, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.10.3.b
    text: het goedkeuren van een wijziging van een industrieel monitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.10
  - number: 16b.11.1
    text: Er is een elektronisch register dispensatierechten industrie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.11
  - number: 16b.11.2
    text: Het register wordt beheerd door het bestuur van de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.11
  - number: 16b.11.3
    text: |-
      Het register bestaat uit rekeningen als bedoeld in [artikel 16b.13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.3.1
  - number: 16b.11.4
    text: |-
      Het bestuur van de emissieautoriteit draagt er zorg voor dat alle besluiten en verslagen die verband
      houden met de hoeveelheid dispensatierechten onverwijld op passende wijze openbaar worden gemaakt.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.11
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 16b.12.1
    text: Het bestuur van de emissieautoriteit kan voorwaarden aan het gebruik van het register vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.12
  - number: 16b.12.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de werking, organisatie, beschikbaarheid en beveiliging
      van het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.12
  - number: 16b.13.1
    text: |-
      Het bestuur van de emissieautoriteit opent ambtshalve voor iedere industriële installatie met een goedgekeurd
      monitoringsplan of industrieel monitoringsplan één rekening op naam van de exploitant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.13
  - number: 16b.13.2
    text: Bij ministeriële regeling worden regels gesteld over het openen, bijhouden en beheer van de rekening.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.13
  - number: 16b.14.1
    text: |-
      Het bestuur van de emissieautoriteit kan bij een vermoeden van fraude of misbruik of indien niet wordt voldaan aan
      de bij of krachtens deze titel gestelde eisen voor het hebben van een rekening in het register of voor het gebruik
      van die rekening:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.14
  - number: 16b.14.1.a
    text: een rekening blokkeren;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.14
  - number: 16b.14.1.b
    text: een rekening opheffen; of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.14
  - number: 16b.14.1.c
    text: |-
      het aantal dispensatierechten voor een of meer rekeningen terugzetten op het aantal dispensatierechten voor die
      rekeningen op een eerder tijdstip waarin de fraude of misbruik zich niet voordeed.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.14
  - number: 16b.14.2
    text: Bij ministeriele regeling kunnen regels worden gesteld over de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.14
  - number: 16b.15.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor het openen en bijhouden van een rekening een vergoeding
      verschuldigd is overeenkomstig de bij die regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.15
  - number: 16b.15.2
    text: 'Bij de regeling, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.15
  - number: 16b.15.2.a
    text: |-
      wordt de hoogte van de vergoeding vastgesteld, welke niet hoger is dan noodzakelijk is ter dekking van de ten
      laste van de emissieautoriteit komende kosten van het verrichten van werkzaamheden waarvoor de vergoeding is
      verschuldigd, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.15
  - number: 16b.15.2.b
    text: worden regels gesteld omtrent de wijze waarop de vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.15
  - number: 16b.16.1
    text: |-
      De rekening van een exploitant voor een industriële installatie onderscheidt per kalenderjaar het aantal
      dispensatierechten dat voor ieder kalenderjaar voor die industriële installatie is opgebouwd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.16
  - number: 16b.16.2
    text: Bij aanvang van ieder kalenderjaar bedraagt het aantal dispensatierechten voor dat kalenderjaar nul.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.16
  - number: 16b.16.3
    text: |-
      Het bestuur van de emissieautoriteit stort na afloop van het kalenderjaar op uiterlijk 30 april het aantal
      dispensatierechten op de rekening in het register dispensatierechten industrie voor dat kalenderjaar. De
      storting is overeenkomstig het verslag over het aantal dispensatierechten van de exploitant, bedoeld in
      [artikel 16b.17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.3.2
  - number: 16b.16.4
    text: |-
      Het bestuur van de emissieautoriteit stort dispensatierechten op of boekt dispensatierechten af van een rekening op
      basis van een ambtshalve vaststelling van de dispensatierechten als bedoeld in [artikel 16b.24, eerste lid][ref1],
      nadat die vaststelling is onherroepelijk geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.3.2
  - number: 16b.16.5
    text: |-
      De exploitant kan na afloop van het kalenderjaar in de periode van 1 mei tot en met 31 augustus dispensatierechten
      verhandelen overeenkomstig [afdeling 16b.3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
        afdeling: 16b.3.3
  - number: 16b.17.1
    text: |-
      De exploitant dient uiterlijk 31 maart bij het bestuur van de emissieautoriteit een verslag in over het aantal
      dispensatierechten dat hij heeft berekend. Bij ministeriële regeling kunnen hierover nadere regels worden gesteld.
      De nadere regels kunnen betrekking hebben op de verificatie van het verslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de berekening van het aantal dispensatierechten op basis van
      onder andere de reductiefactor en de gegevens die zijn opgenomen in:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.2.a
    text: |-
      het verslag over het activiteitsniveau, bedoeld in artikel 3, eerste lid, van de Verordening aanpassingen
      kosteloze toewijzing door verandering activiteitsniveau dan wel de schatting hiervan door het bestuur van de
      emissieautoriteit als bedoeld in de artikel 3, vierde lid, van de Verordening aanpassingen kosteloze toewijzing
      door verandering activiteitsniveau;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.2.b
    text: |-
      het verslag met referentiegegevens, bedoeld in artikel 4, tweede lid, onderdeel a, in samenhang met artikel 15,
      eerste en tweede lid, van de Verordening kosteloze toewijzing van emissierechten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.2.c
    text: |-
      het industriële emissieverslag of de ambtshalve vaststelling van de industriële jaarvracht als bedoeld in
      [artikel 16b.6, vierde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.2.1
  - number: 16b.17.2.d
    text: |-
      het verslag over het industriële activiteitsniveau dat is gemonitord op basis van een industrieel
      monitoringsmethodiekplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.3
    text: |-
      De reductiefactor voor het jaar 2023 bedraagt 1,213. Bij aanvang van ieder daarop volgend kalenderjaar wordt de
      reductiefactor telkens verlaagd met 0,078.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4
    text: |-
      De regels zijn voor zover mogelijk in overeenstemming met het vaststellen van de voorlopige kosteloze toewijzing
      van broeikasgasemissierechten in de Verordening kosteloze toewijzing van emissierechten en de Verordening
      aanpassingen kosteloze toewijzing door verandering activiteitsniveau, in ieder geval met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.a
    text: geen dispensatierechten worden berekend voor de export van meetbare warmte voor stadsverwarming;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.b
    text: |-
      bij een product gerelateerd activiteitsniveau in aanmerking wordt genomen het actuele activiteitsniveau betreffende
      het kalenderjaar in plaats van het historische activiteitsniveau;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.c
    text: |-
      bij een product gerelateerd activiteitsniveau met uitwisselbaarheid van elektriciteit en brandstof voor een
      installatie gebruik wordt gemaakt van de voor die installatie beschikbare historische correctiefactor in de periode
      2014–2018;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.d
    text: |-
      het warmte gerelateerd activiteitsniveau ook meetbare warmte kan omvatten die is geproduceerd op basis van
      elektriciteit;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.e
    text: 'bij een activiteitsniveau, anders dan onder b, in aanmerking wordt genomen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.e.1
    text: het jaarlijks activiteitsniveau in plaats van het historisch activiteitsniveau; dan wel
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.e.2
    text: |-
      het historisch activiteitsniveau indien het jaarlijks activiteitsniveau minder dan 15% lager of hoger is dan het
      historisch activiteitsniveau; dan wel
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.e.3
    text: |-
      het historisch activiteitsniveau als het jaarlijks activiteitsniveau meer dan 15% lager is als het historisch
      activiteitsniveau als gevolg van een toename van de energie efficiëntie of reductiemaatregelen, dan wel
      15% hoger is als het historische activiteitsniveau als gevolg van een afname van de energie efficiëntie of
      reductiemaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.f
    text: |-
      generiek de benchmarks die volgen uit deze verordeningen met een voor alle benchmarks gelijk jaarlijks
      verminderingspercentage kunnen worden bijgewerkt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.17.4.g
    text: |-
      van de regels in deze verordeningen in elk geval kan worden afgeweken indien dat wenselijk is ter voorkoming
      van onnodige administratieve lasten, onnodige uitvoeringshandelingen of manipulatie of misbruik van het
      activiteitsniveau.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.17
  - number: 16b.18
    text: |-
      Indien een exploitant voor een industriële installatie het verslag over het aantal dispensatierechten niet of niet
      tijdig heeft ingediend bedraagt het aantal dispensatierechten nihil.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.18
  - number: 16b.19.1
    text: |-
      De exploitant stelt, voor zover dat noodzakelijk is om het aantal dispensatierechten te berekenen, voor een
      industriële installatie een industrieel monitoringsmethodiekplan op dat hij indient bij het bestuur van de
      emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.2
    text: |-
      Het industrieel monitoringsmethodiekplan of een wijziging daarvan behoeft goedkeuring van het bestuur van de
      emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3
    text: |-
      De [artikelen 16.7][ref1], [16.9][ref2], [16.11][ref3] en [16.19][ref4] zijn van overeenkomstige toepassing met
      dien verstande dat telkens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16b.19.3.a
    text: voor «broeikasgasinstallatie» wordt gelezen «industriële installatie»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3.b
    text: voor «emissieverslag» wordt gelezen «verslag over het industriële activiteitsniveau»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3.c
    text: voor «monitoringsplan» wordt gelezen «industrieel monitoringsmethodiekplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3.d
    text: voor «vergunning» wordt gelezen «goedkeuring van een industrieel monitoringsmethodiekplan»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3.e
    text: voor «vergunninghouder» wordt gelezen «de exploitant»;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.19.3.f
    text: |-
      voor «bij de Verordening monitoring en rapportage emissiehandel of bij of krachtens dit hoofdstuk, hoofdstuk 8
      van deze wet» wordt gelezen «bij of krachtens dit hoofdstuk, de [hoofdstukken 8][ref1], [16][ref2] of 16a van deze
      wet».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 16b.19.4
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop de aanvraag om een goedkeuring van een
      industrieel monitoringsmethodiekplan moet geschieden, de gegevens en de bescheiden die door de aanvrager moeten
      worden verstrekt met het oog op de beslissing op de aanvraag, en de wijze waarop die gegevens moeten worden
      verkregen. Deze regels zijn, voor zover mogelijk, in overeenstemming met de artikelen 4, tweede lid, onderdeel b,
      5, tweede lid, 8, 9 en 10 van de Verordening kosteloze toewijzing van emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.19
  - number: 16b.20.1
    text: |-
      Het industrieel monitoringsmethodiekplan bestaat uit een gedetailleerde, volledige en transparante documentatie
      over de monitoringmethodiek voor een industriële installatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.20
  - number: 16b.20.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van het industrieel
      monitoringsmethodiekplan. De regels zijn voor zover mogelijk in overeenstemming met het vaststellen van de
      voorlopige kosteloze toewijzing van broeikasgasemissierechten in de Verordening kosteloze toewijzing van
      emissierechten en de Verordening aanpassingen kosteloze toewijzing door verandering activiteitsniveau, met dien
      verstande dat van de regels in deze Verordeningen kan worden afgeweken indien dat wenselijk is ter voorkoming van
      onnodige administratieve lasten, onnodige uitvoeringshandelingen of manipulatie of misbruik van het industrieel
      monitoringsmethodiekplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.20
  - number: 16b.21
    text: |-
      Het bestuur van de emissieautoriteit weigert de goedkeuring van een industrieel monitoringsmethodiekplan indien
      het industrieel monitoringsmethodiekplan niet voldoet aan de eisen die daaraan gesteld zijn bij of krachtens dit
      [hoofdstuk][ref1] of het bestuur van de emissieautoriteit van oordeel is dat onvoldoende is gewaarborgd dat de
      aanvrager in staat is het industrieel monitoringsmethodiekplan naar behoren uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.22.1
    text: 'De exploitant wijzigt het industrieel monitoringsmethodiekplan zo spoedig mogelijk, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.1.a
    text: |-
      de regels gesteld bij of krachtens [hoofdstuk 16b][ref1] daartoe aanleiding geven; of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.22.1.b
    text: het bestuur van de emissieautoriteit daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.2
    text: |-
      De exploitant legt op verzoek van het bestuur van de emissieautoriteit de meest actuele versie van het industrieel
      monitoringsmethodiekplan over.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.3.a
    text: |-
      het melden van een wijziging of een tijdelijke afwijking van het industrieel monitoringsmethodiekplan aan het
      bestuur van de emissieautoriteit; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.3.b
    text: het goedkeuren van een wijziging van een industrieel monitoringsmethodiekplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.22.4
    text: |-
      Deze regels zijn, voor zover mogelijk, in overeenstemming met artikel 9 van de Verordening kosteloze toewijzing
      van emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.22
  - number: 16b.23.1
    text: |-
      Het verslag over het industriële activiteitsniveau bevat het industriële activiteitsniveau van de industriële
      installatie. Het maakt onderdeel uit van het verslag over het aantal dispensatierechten, bedoeld in
      [artikel 16b.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.3.2
  - number: 16b.23.2
    text: |-
      Bij ministeriele regeling worden regels gesteld over de inhoud van het verslag over het industriële
      activiteitsniveau. Deze regels zijn, voor zover mogelijk, in overeenstemming met artikel 4, tweede lid, onderdeel
      a, van de Verordening kosteloze toewijzing van emissierechten. De regels kunnen betrekking hebben op de verificatie
      van het verslag over het industriële activiteitsniveau.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.23
  - number: 16b.24.1
    text: |-
      Het bestuur van de emissieautoriteit kan uiterlijk op 30 september van het kalenderjaar waarin het verslag over
      het aantal dispensatierechten moet worden ingediend, vaststellen dat dit verslag niet voldoet aan de eisen die
      daaraan bij of krachtens dit [hoofdstuk][ref1] zijn gesteld. Het bestuur van de emissieautoriteit kan de beslissing
      voor ten hoogste drie maanden verdagen. Van de verdaging wordt voor het in de eerste volzin genoemde tijdstip
      schriftelijk mededeling gedaan aan degene die het verslag heeft ingediend. De mededeling omvat de reden voor de
      verdaging.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.24.2
    text: |-
      Het bestuur van de emissieautoriteit kan na het tijdstip, genoemd in het eerste lid, onderscheidenlijk, indien
      toepassing is gegeven tweede volzin van dat lid, na het tijdstip dat met toepassing van die volzin is vastgesteld
      alsnog vaststellen dat het verslag niet voldoet aan de eisen die daaraan bij of krachtens dit [hoofdstuk][ref1]
      zijn gesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.24.2.a
    text: |-
      degene bij het bestuur van de emissieautoriteit een verslag heeft ingediend, in dat verslag onjuiste of onvolledige
      gegevens heeft verwerkt en de verwerking van juiste of volledige gegevens zou hebben geleid tot de storting van een
      ander aantal dispensatierechten; of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
  - number: 16b.24.2.b
    text: het betrokken verslag anderszins onjuist was en de betrokken persoon dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
  - number: 16b.24.3
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt tien jaren na afloop van het kalenderjaar, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
  - number: 16b.24.4
    text: |-
      Het bestuur van de emissieautoriteit kan het aantal dispensatierechten van een industriële installatie op basis
      van een conservatieve schatting ambtshalve vaststellen indien het bestuur van de emissieautoriteit heeft verklaard
      dat het verslag over het aantal dispensatierechten niet voldoet aan de eisen die daaraan bij of krachtens dit
      [hoofdstuk][ref1] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: 16b
  - number: 16b.25
    text: Een dispensatierecht kan uitsluitend in het register dispensatierechten industrie worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.25
  - number: 16b.26.1
    text: |-
      Een dispensatierecht is vatbaar voor overdracht indien de overdragende exploitant en de ontvangende exploitant
      ieder op hun naam een rekening hebben in het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.26
  - number: 16b.26.2
    text: |-
      De overdracht vindt uitsluitend plaats in de periode van 1 mei tot en met 31 augustus van het jaar volgend op het
      kalenderjaar waarover de dispensatierechten zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.26
  - number: 16b.26.3
    text: Een dispensatierecht is ook vatbaar voor andere overgang. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.26
  - number: 16b.27.1
    text: |-
      Overdracht van een of meer dispensatierechten kan niet leiden tot een aantal dispensatierechten dat minder is dan
      de industriële jaarvracht van dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.27
  - number: 16b.27.2
    text: |-
      Overdracht van een of meer dispensatierechten is niet toegestaan, indien het aantal dispensatierechten op een
      rekening minder is dan de industriële jaarvracht van dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.27
  - number: 16b.28.1
    text: 'De voor overdracht van een dispensatierecht vereiste levering geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.28
  - number: 16b.28.1.a
    text: |-
      afschrijving van het dispensatierecht van de rekening die in het register op naam staat van de exploitant die de
      dispensatierechten overdraagt; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.28
  - number: 16b.28.1.b
    text: |-
      bijschrijving op de rekening die in het register op naam staat van de exploitant die de dispensatierechten
      verkrijgt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.28
  - number: 16b.28.2
    text: Het eerste lid is van overeenkomstige toepassing op elke overgang anders dan overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.28
  - number: 16b.28.3
    text: |-
      Elke overgang anders dan overdracht werkt tegenover derden eerst nadat de overgang in het register is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.28
  - number: 16b.29.1
    text: |-
      Nietigheid of vernietiging van de overeenkomst die tot de overdracht heeft geleid, of onbevoegdheid van degene
      die overdraagt, heeft, nadat de overdracht is voltooid, geen gevolgen voor de af- en bijschrijvingen van de
      dispensatierechten in het register dispensatierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.29
  - number: 16b.29.2
    text: |-
      Elk voorbehoud met betrekking tot de overdracht is uitgewerkt op het moment dat de af- en bijschrijving van de
      dispensatierechten in het register dispensatierechten tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.29
  - number: 16b.29.3
    text: |-
      Indien het bestuur van de emissieautoriteit ambtshalve het aantal dispensatierechten heeft vastgesteld als bedoeld
      in [artikel 16b.24, vierde lid][ref1], heeft dat geen gevolgen voor de af- en bijschrijving van dispensatierechten
      die in het register dispensatierechten tot stand zijn gekomen. Deze ambtshalve vaststelling kan leiden tot een
      aantal dispensatierechten in het register dispensatierechten dat lager is dan de industriële jaarvracht van dat
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 16b
        hoofdstuk: 16b
        afdeling: 16b.3.2
  - number: 16b.30.1
    text: |-
      In afwijking van [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op een dispensatierecht geen recht
      van pand worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.30
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '288'
  - number: 16b.30.2
    text: Op een dispensatierecht kan geen recht van vruchtgebruik worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.30
  - number: 16b.30.3
    text: Een dispensatierecht is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16b.30
  - number: 16c.1
    text: |-
      Een importeur als bedoeld in artikel 3, onderdeel 15, van de Verordening koolstofcorrectie aan de grens,
      of in de situaties die onder artikel 32 van die verordening vallen, een overeenkomstig artikel 18 van de
      Verordening (EU) nr. 952/2013 aangewezen indirecte douanevertegenwoordiger, voldoet tijdig en volledig aan de
      rapportageverplichting, bedoeld in artikel 35, eerste lid, van die verordening.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16c.1
  - number: 16c.2
    text: |-
      Het bestuur van de emissieautoriteit wisselt alle informatie uit als bedoeld in artikel 11, tweede lid, van de
      Verordening koolstofcorrectie aan de grens.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16c.2
  - number: 17.4.1
    text: |-
      Indien dat door een ongewoon voorval nodig is, wordt in het belang van de bescherming van het milieu een of meer
      van de volgende verplichtingen of het volgende verbod opgelegd aan degene bij wie afvalstoffen ontstaan of aanwezig
      zijn, die zijn aangewezen in de daartoe strekkende beschikking:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.1.a
    text: een verplichting die afvalstoffen te scheiden en – mede van andere stoffen en afvalstoffen – gescheiden te houden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.1.b
    text: een verplichting die afvalstoffen gescheiden af te geven, wanneer zij zich daarvan ontdoen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.1.c
    text: |-
      een verplichting die afvalstoffen ter plaatse waar zij zijn ontstaan, op een bij de beschikking aangegeven wijze
      nuttig toe te passen of te verwijderen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.1.d
    text: een verbod die afvalstoffen langer onder zich te houden dan gedurende een bij de beschikking aangegeven termijn;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.1.e
    text: |-
      een verplichting die afvalstoffen af te geven aan een persoon behorende tot een bij de beschikking aangewezen
      categorie, of te brengen naar een daartoe aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.2
    text: 'Een verplichting of verbod als bedoeld in het eerste lid, wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.2.a
    text: |-
      voor zover de verplichting of het verbod betrekking heeft op een milieubelastende activiteit: door het bevoegd
      gezag voor de omgevingsvergunning voor de milieubelastende activiteit, of, indien voor de milieubelastende
      activiteit regels gelden als bedoeld in [paragraaf 4.1.1 van de Omgevingswet][ref1], door het bestuursorgaan
      waaraan een melding als bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref2] met betrekking tot die
      milieubelastende activiteit zou moeten worden gedaan of, in andere gevallen, door burgemeester en wethouders;


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Paragraaf4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
    references:
      - id: ref1
        bwb_id: BWBR0037885
        paragraaf: 4.1.1
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 17.4.2.b
    text: 'in andere gevallen: door gedeputeerde staten.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.4.3
    text: |-
      Het bestuursorgaan, bedoeld in het tweede lid, geeft bij zijn beschikking aan binnen welke termijn de verplichting
      moet worden uitgevoerd en kan aangeven op welke wijze de verplichting moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.4
  - number: 17.5a.1
    text: |-
      Indien zich een gebeurtenis voordoet, die gevolgen kan hebben voor de stabiliteit van een afvalvoorziening, of
      indien bij controle- en monitoringsprocedures met betrekking tot die voorziening blijkt dat nadelige gevolgen
      voor het milieu zijn ontstaan of dreigen te ontstaan, meldt de exploitant van de winningsafvalvoorziening, dit zo
      spoedig mogelijk, in elk geval binnen 48 uur, aan het bestuursorgaan dat bevoegd is een omgevingsvergunning voor de
      milieubelastende activiteit met betrekking tot de winningsafvalvoorziening te verlenen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2
    text: |-
      De exploitant van de winningsafvalvoorziening verstrekt het bestuursorgaan, bedoeld in het eerste lid, tevens,
      zodra zij bekend zijn, de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2.a
    text: de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2.b
    text: de door het voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2.c
    text: |-
      andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het voorval te
      kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.2.e
    text: |-
      de maatregelen die zijn genomen of worden overwogen om te voorkomen dat een zodanig voorval zich nogmaals kan
      voordoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5a.3
    text: |-
      [Artikel 19.3 van de Omgevingswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.5a.4
    text: Bij of krachtens algemene maatregel van bestuur worden categorieën van winningsafvalvoorzieningen aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5a
  - number: 17.5b
    text: |-
      Indien de situatie, bedoeld in [artikel 17.5a, eerste lid][ref1], betrekking heeft op een winningsafvalvoorziening
      categorie A, voert de exploitant van de winningsafvalvoorziening, onmiddellijk het voor die
      winningsafvalvoorziening voorgeschreven interne noodplan uit


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.5c.1
    text: |-
      Het bevoegd gezag kan instructies geven met betrekking tot het treffen van de nodige preventieve of
      herstelmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
  - number: 17.5c.2
    text: |-
      De exploitant van de winningsafvalvoorziening volgt de in het eerste lid bedoelde instructies op en draagt de
      kosten voor de getroffen preventieve of herstelmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
  - number: 17.5c.3
    text: |-
      Het bevoegd gezag kan zelf elke nodige preventieve of herstelmaatregel treffen of de uitvoering daarvan opdragen
      aan derden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
  - number: 17.5c.4
    text: |-
      Een beslissing als bedoeld in het derde lid wordt op schrift gesteld. De schriftelijke beslissing is een
      beschikking.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
  - number: 17.5c.5
    text: |-
      In het geval het bevoegd gezag zelf maatregelen treft of de uitvoering daarvan opdraagt aan derden, verhaalt het
      de kosten op degene die de activiteiten verricht. Het bevoegd gezag stelt de hoogte van de verschuldigde kosten bij
      beschikking vast. Het bevoegd gezag kan de kosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
  - number: 17.5c.6
    text: |-
      [Artikel 17.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.5d
    text: |-
      Deze titel is van overeenkomstige toepassing op gesloten winningsafvalvoorzieningen, met uitzonderingen van die
      gesloten winningsafvalvoorzieningen ten aanzien waarvan het bevoegd gezag is belast met de nazorg, bedoeld in
      [artikel 8.49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.5d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 17.6.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder: *activiteit:* beroepshalve of
      bedrijfsmatig verrichte activiteit, ongeacht het openbare of particuliere, winstgevende of niet-winstgevende
      karakter daarvan; *beschermde soorten:* soorten als bedoeld in artikel 2, derde lid, onder a, van EG-richtlijn
      milieuaansprakelijkheid; *degene die de activiteit verricht:* de natuurlijke persoon of de privaatrechtelijke
      of publiekrechtelijke rechtspersoon die de activiteit verricht of heeft verricht, regelt of heeft geregeld,
      of aan wie een doorslaggevende economische zeggenschap over het technisch functioneren van de activiteit is
      overgedragen, met inbegrip van de houder van een vergunning of toelating voor het verrichten van de activiteit
      en de persoon die de activiteit laat of heeft laten registreren of er kennisgeving van doet of heeft gedaan;
      *ecosysteemfuncties:* functies die natuurlijke rijkdommen vervullen ten behoeve van andere natuurlijke rijkdommen
      of het publiek; *EG-richtlijn milieuaansprakelijkheid:* richtlijn nr. 2004/35/EG van het Europees Parlement en de
      Raad van de Europese Unie van 21 april 2004 betreffende milieuaansprakelijkheid met betrekking tot het voorkomen
      en herstellen van milieuschade (PbEU L 143); *herstelmaatregelen:* maatregelen of combinatie van maatregelen,
      met inbegrip van inperkende of tussentijdse maatregelen, gericht op herstel, rehabilitatie of vervanging van de
      aangetaste natuurlijke rijkdommen of ecosysteemfuncties, of op het verschaffen van een gelijkwaardig alternatief
      voor rijkdommen of functies als bedoeld in bijlage II bij EG-richtlijn milieuaansprakelijkheid; *kosten:* kosten
      verbonden aan de toepassing van preventieve maatregelen of herstelmaatregelen, met inbegrip van ramingskosten
      van milieuschade, onmiddellijke dreiging van zulke schade en alternatieve maatregelen, alsook de administratieve,
      juridische en handhavingskosten, de kosten van het vergaren van gegevens en andere algemene kosten, en de kosten in
      verband met monitoring en toezicht; *milieuschade:* 1°. elke vorm van schade aan beschermde soorten of natuurlijke
      habitats die, gelet op de referentietoestand en de criteria van bijlage I bij EG-richtlijn milieuaansprakelijkheid,
      aanmerkelijke negatieve effecten heeft op het bereiken of handhaven van de gunstige staat van instandhouding van
      deze soorten of habitats; 2°. elke vorm van schade aan wateren die een aanmerkelijke negatieve invloed heeft op de
      ecologische, chemische of kwantitatieve toestand of het ecologisch potentieel, als omschreven in de kaderrichtlijn
      water, van de betrokken wateren, met uitzondering van de negatieve effecten waarop artikel 4, zevende lid,
      van die richtlijn van toepassing is; 3°. elke vorm van schade die een aanmerkelijke negatieve invloed heeft op
      de milieutoestand van de betrokken maritieme wateren, als omschreven in richtlijn 2008/56/EG van het Europees
      parlement en de Raad van 17 juni 2008 tot vaststelling van een kader voor communautaire maatregelen betreffende
      het beleid ten aanzien van het mariene milieu (Kaderrichtlijn mariene strategie) (PbEU 2008, L 164), voor zover
      bijzondere aspecten van de milieutoestand van het mariene milieu al niet in de kaderrichtlijn water worden
      behandeld; 4°. elke vorm van bodemverontreiniging die een aanmerkelijk risico inhoudt voor negatieve effecten op
      de menselijke gezondheid, waarbij direct of indirect op, in of onder de bodem, stoffen, preparaten, organismen
      of micro-organismen gebracht zijn; *milieuschade of een onmiddellijke dreiging daarvan:* milieuschade of een
      voldoende waarschijnlijkheid dat zich in de nabije toekomst milieuschade zal voordoen; *natuurlijke habitats:*
      habitats van de soorten, natuurlijke habitats en voortplantings- of rustplaatsen als bedoeld in artikel 2, derde
      lid, onder b, van EG-richtlijn milieuaansprakelijkheid; *natuurlijke regeneratie:* 1°. in het geval van schade
      aan wateren, beschermde soorten of natuurlijke habitats: de terugkeer van aangetaste natuurlijke rijkdommen
      en ecosysteemfuncties tot de referentietoestand; 2°. in geval van bodemverontreiniging: het verdwijnen van een
      aanmerkelijk gevaar van een nadelig effect op de menselijke gezondheid; *natuurlijke rijkdommen:* beschermde
      soorten, natuurlijke habitats, wateren of bodem; *preventieve maatregelen:* maatregelen naar aanleiding van een
      gebeurtenis, handeling of nalatigheid waardoor een onmiddellijke dreiging van milieuschade is ontstaan, teneinde
      die schade te voorkomen of tot een minimum te beperken; *referentietoestand:* de toestand waarin de natuurlijke
      rijkdommen of ecosysteemfuncties zich ten tijde van de schade zouden hebben bevonden indien zich geen milieuschade
      had voorgedaan, gereconstrueerd aan de hand van de beste beschikbare informatie; *schade:* meetbare negatieve
      verandering in de natuurlijke rijkdommen of aantasting van een ecosysteemfunctie, die direct of indirect optreedt;
      *staat van instandhouding:* staat van instandhouding als bedoeld in artikel 2, vierde lid, van EG-richtlijn
      milieuaansprakelijkheid; *wateren:* wateren waarop de kaderrichtlijn water van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.6
  - number: 17.6.2
    text: |-
      In afwijking van het bepaalde in [artikel 1.1][ref1] wordt in deze titel en de daarop berustende bepalingen onder
      *emissie* verstaan: het als gevolg van menselijke activiteiten in het milieu brengen van stoffen, preparaten,
      organismen of micro-organismen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 17.6.3
    text: |-
      Een wijziging van een van de bijlagen bij EG-richtlijn milieuaansprakelijkheid gaat voor de toepassing van deze
      titel en de daarop berustende bepalingen gelden met ingang van de dag waarop aan de desbetreffende wijziging
      uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een
      ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.6
  - number: 17.6.4
    text: |-
      Onder schade aan beschermde soorten en natuurlijke habitats wordt voor de toepassing van deze titel mede begrepen
      schade aan deze soorten en habitats binnen de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.6
  - number: '17.7'
    text: 'Deze titel is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.7
  - number: 17.7.a
    text: |-
      milieuschade of een onmiddellijke dreiging daarvan die wordt veroorzaakt door activiteiten als bedoeld in bijlage
      III bij de EG-richtlijn milieuaansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.7
  - number: 17.7.b
    text: |-
      milieuschade aan beschermde soorten of natuurlijke habitats of een onmiddellijke dreiging daarvan die wordt
      veroorzaakt door een andere activiteit dan bedoeld onder a, indien degene die de activiteit verricht schuld of
      nalatigheid kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.7
  - number: '17.8'
    text: |-
      In afwijking van [artikel 17.7][ref1] is deze titel niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.8.a
    text: 'milieuschade of een onmiddellijke dreiging daarvan ten gevolge van:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.1°
    text: een oorlogshandeling, vijandelijkheden, burgeroorlog of oproer;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.2°
    text: een natuurverschijnsel dat uitzonderlijk, onontkoombaar en onafwendbaar is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.3°
    text: |-
      een gebeurtenis waarvoor de aansprakelijkheid of schadevergoeding binnen de werkingssfeer valt van een van de in
      bijlage IV bij EG-richtlijn milieuaansprakelijkheid genoemde verdragen, waaraan Nederland gebonden is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.4°
    text: |-
      nucleaire risico’s of een activiteit waarop het Verdrag tot oprichting van de Europese Gemeenschap voor
      Atoomenergie van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.5°
    text: |-
      een activiteit of gebeurtenis waarvoor de aansprakelijkheid of schadevergoeding binnen de werkingssfeer valt van
      een van de in bijlage V bij EG-richtlijn milieuaansprakelijkheid genoemde verdragen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.6°
    text: een activiteit die hoofdzakelijk de landsverdediging of de internationale veiligheid dient, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.a.7°
    text: een activiteit die uitsluitend tot doel heeft bescherming te bieden tegen natuurrampen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.b
    text: |-
      milieuschade aan beschermde soorten of natuurlijke habitats bestaande uit de vooraf vastgestelde negatieve effecten
      van activiteiten waarvoor door het bevoegd gezag vergunning is verleend:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.b.1°
    text: |-
      in overeenstemming met bepalingen ter uitvoering van artikel 6, derde en vierde lid, of artikel 16 van richtlijn
      nr. 92/43/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992 inzake de instandhouding van de
      natuurlijke habitats en de wilde flora en fauna, artikel 9 van richtlijn nr. 2009/147/EG van het Europees Parlement
      en de Raad van de Europese Unie van 30 november 2009 inzake het behoud van de vogelstand, of,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.b.2°
    text: |-
      in het geval van niet onder het Gemeenschapsrecht vallende soorten, in overeenstemming met het bepaalde krachtens
      [artikel 5.1, tweede lid, aanhef en onder g, van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 17.8.c
    text: 'milieuschade of een onmiddellijke dreiging daarvan veroorzaakt door een emissie of gebeurtenis:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.c.1°
    text: die voor 30 april 2007 heeft plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.c.2°
    text: |-
      die na 30 april 2007 heeft plaatsgevonden, indien de schade het gevolg is van een specifieke activiteit die heeft
      plaatsgevonden en is beëindigd voor die datum, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.8.c.3°
    text: die meer dan 30 jaar geleden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.8
  - number: 17.9.1
    text: |-
      Het bevoegd gezag is het bestuursorgaan waarbij op grond van [artikel 18.2 van de Omgevingswet][ref1] de
      bestuursrechtelijke handhavingstaak berust voor de activiteit waardoor de milieuschade of onmiddellijke dreiging
      daarvan wordt veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 17.9.2
    text: |-
      In afwijking van het eerste lid is het bevoegd gezag, indien de milieuschade of een onmiddellijke dreiging daarvan
      geheel of in hoofdzaak betrekking heeft op wateren, het bestuursorgaan waarbij de betrokken wateren in beheer zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.9.3
    text: |-
      Indien de activiteit waardoor de milieuschade of een onmiddellijke dreiging daarvan wordt veroorzaakt, wordt
      verricht buiten een inrichting is het bevoegd gezag voor zover de milieuschade of een onmiddellijke dreiging
      daarvan betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.9.3.a
    text: |-
      de bodem: het bestuursorgaan, bedoeld in [artikel 95, derde en vierde lid, van de Wet bodembescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel95
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '95'
  - number: 17.9.3.b
    text: |-
      beschermde soorten: het bevoegd gezag, bedoeld in [artikel 18.2, van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 17.9.3.c
    text: |-
      natuurlijke habitats: het bevoegd gezag, bedoeld in [artikel 18.2, van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 17.9.3.d
    text: 'wateren: het bestuursorgaan, waarbij de betrokken wateren in beheer zijn.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.9.4
    text: |-
      In afwijking van het eerste tot en met het derde lid is Onze Minister het bevoegd gezag, indien de activiteit
      waardoor de milieuschade of een onmiddellijke dreiging daarvan wordt veroorzaakt, betrekking heeft op genetisch
      gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.9.5
    text: |-
      Indien in geval van milieuschade of een onmiddellijke dreiging daarvan meer dan een bestuursorgaan als bevoegd
      gezag is aangewezen, of bij of krachtens deze of een andere wet aan een ander bestuursorgaan bevoegdheden zijn
      toegekend, wordt tussen deze bestuursorganen tijdig overleg gevoerd, teneinde een zo goed mogelijke afstemming
      tussen de te nemen besluiten of de te treffen maatregelen te bevorderen. De bestuursorganen stemmen onderling af
      welk orgaan zich met de coördinatie belast.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.9.6
    text: |-
      Indien in geval van milieuschade of een onmiddellijke dreiging daarvan meer dan een bestuursorgaan
      als bevoegd gezag is aangewezen, wordt een verzoek als bedoeld in [artikel 17.13, zesde lid][ref1], of
      [artikel 17.15, eerste lid][ref2], gecoördineerd behandeld. Bij de beslissing op een dergelijk verzoek wordt
      rekening gehouden met de onderlinge samenhang tussen de beschikkingen die op dit verzoek worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.9.7
    text: |-
      Indien in geval van milieuschade of een onmiddellijke dreiging daarvan bij of krachtens deze of een andere wet aan
      het bevoegd gezag bevoegdheden zijn toegekend, geeft het bevoegd gezag onverminderd die bevoegdheden toepassing aan
      deze titel en draagt het er zorg voor dat, voor zover het ook uitvoering geeft aan bedoelde bevoegdheden, er geen
      strijd ontstaat met het bepaalde bij of krachtens deze titel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.9
  - number: 17.10.1
    text: |-
      Het bevoegd gezag kan degene die een activiteit verricht, waardoor zich milieuschade of een onmiddellijke dreiging
      daarvan voordoet:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
  - number: 17.10.1.a
    text: |-
      verplichten informatie te verstrekken over een onmiddellijke dreiging van milieuschade of in gevallen waarin een
      dergelijke dreiging vermoed wordt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
  - number: 17.10.1.b
    text: verplichten aanvullende gegevens te verstrekken over elke milieuschade die zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
  - number: 17.10.1.c
    text: verplichten de nodige preventieve of herstelmaatregelen te treffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
  - number: 17.10.1.d
    text: instructies geven met betrekking tot de maatregelen, bedoeld onder c.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
  - number: 17.10.2
    text: |-
      Het bevoegd gezag kan zelf elke maatregel als bedoeld in [artikel 17.13, eerste lid][ref1], alsmede de nodige
      preventieve of herstelmaatregelen treffen of de uitvoering daarvan opdragen aan derden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.10.3
    text: |-
      Een beslissing als bedoeld in het eerste lid, onder c, of tweede lid, wordt op schrift gesteld. De schriftelijke
      beslissing is een beschikking. Van de beschikking wordt mededeling gedaan aan de bestuursorganen of
      overheidsdiensten, bedoeld in [artikel 19.3, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.10
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.12.1
    text: |-
      Indien door een activiteit een onmiddellijke dreiging van milieuschade ontstaat, treft degene die de activiteit
      verricht onmiddellijk de nodige preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
  - number: 17.12.2
    text: |-
      Hij informeert zo spoedig mogelijk het bevoegd gezag over alle relevante aspecten van de situatie.
      [Artikel 17.2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.12.3
    text: |-
      Het bevoegd gezag informeert onverwijld de bestuursorganen of overheidsdiensten, bedoeld in
      [artikel 19.3, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.12.4
    text: Het bevoegd gezag verplicht degene die de activiteit verricht onmiddellijk de nodige maatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
  - number: 17.12.5
    text: |-
      Het bevoegd gezag stelt belanghebbenden, respectievelijk de bestuursorganen of overheidsdiensten, bedoeld in
      [artikel 19.3, eerste lid, van de Omgevingswet][ref1], in de gelegenheid hun zienswijze naar voren te brengen,
      respectievelijk advies uit te brengen over het ontwerp van het te nemen besluit, bedoeld in het vierde lid, tenzij
      de situatie zo spoedeisend is dat een zienswijze of advies niet kan worden afgewacht.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.12.6
    text: |-
      Het bevoegd gezag betrekt bij de beslissing, bedoeld in het vierde lid, de naar voren gebrachte zienswijzen en
      houdt bij die beslissing rekening met de uitgebrachte adviezen. Van de beschikking wordt mededeling gedaan aan de
      bestuursorganen of overheidsdiensten, bedoeld in [artikel 19.3, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.12
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.13.1
    text: |-
      Indien door een activiteit milieuschade ontstaat, treft degene die de activiteit verricht elke haalbare maatregel
      om de betrokken verontreinigende stoffen of andere schadefactoren onmiddellijk onder controle te houden, in te
      perken, te verwijderen of anderszins te beheersen, teneinde verdere milieuschade en negatieve effecten op de
      menselijke gezondheid of verdere aantasting van functies te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
  - number: 17.13.2
    text: Hij informeert zo spoedig mogelijk het bevoegd gezag over alle relevante aspecten van de situatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
  - number: 17.13.3
    text: |-
      Het bevoegd gezag informeert onverwijld de bestuursorganen of overheidsdiensten, bedoeld in
      [artikel 19.3, eerste lid, van de Omgevingswet][ref1], alsmede in het geval de milieuschade zich voordoet of kan
      voordoen buiten de grenzen van Nederland Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
  - number: 17.13.4
    text: |-
      Onze Minister informeert na ontvangst van de informatie als bedoeld in het derde lid de regering van het betrokken
      land of een door die regering aan te wijzen autoriteit of instantie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
  - number: 17.13.5
    text: |-
      Het bevoegd gezag verplicht degene die de activiteit verricht onmiddellijk de nodige maatregelen te treffen.
      [Artikel 17.12, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.13.6
    text: |-
      Degene die de activiteit verricht, stelt in overeenstemming met bijlage II bij EG-richtlijn milieuaansprakelijkheid
      potentiële herstelmaatregelen vast en legt die aan het bevoegd gezag ter instemming voor.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.13
  - number: 17.14.1
    text: |-
      Het bevoegd gezag stelt vast wie de activiteit verricht waardoor milieuschade of de onmiddellijke dreiging daarvan
      wordt veroorzaakt, alsmede de omvang van de milieuschade. [Artikel 17.13, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.2
    text: |-
      Indien niet kan worden vastgesteld wie de activiteit verricht waardoor de milieuschade of de onmiddellijke dreiging
      daarvan wordt veroorzaakt, beslist het bevoegd gezag of het krachtens het bepaalde in deze titel maatregelen treft.
      [Artikel 17.10, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.3
    text: |-
      Het bevoegd gezag beslist op een verzoek tot instemming als bedoeld in [artikel 17.13, zesde lid][ref1], welke
      herstelmaatregelen in overeenstemming met bijlage II bij EG-richtlijn milieuaansprakelijkheid door degene die de
      activiteit verricht worden getroffen. Het bevoegd gezag kan verlangen dat bij of ter aanvulling op dit verzoek een
      beoordeling van de omvang van de schade wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.4
    text: |-
      Indien zich meerdere gevallen van milieuschade voordoen en de nodige herstelmaatregelen niet gelijktijdig kunnen
      worden getroffen, beslist het bevoegd gezag welke schade het eerst wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.14
  - number: 17.14.5
    text: |-
      Het bevoegd gezag houdt bij het besluit, bedoeld in het tweede, derde en vierde lid, in ieder geval rekening met
      de aard, de omvang en de ernst van de milieuschade, en met de mogelijkheid van gevaar voor de menselijke gezondheid
      en van natuurlijke regeneratie. Op dit besluit is [artikel 17.12, vijfde en zesde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.15.1
    text: |-
      Belanghebbenden, alsmede de bestuursorganen of overheidsdiensten, bedoeld in
      [artikel 19.3, eerste lid, van de Omgevingswet][ref1], kunnen in geval van milieuschade of een onmiddellijke
      dreiging daarvan het bevoegd gezag verzoeken een beschikking tot het treffen van maatregelen als bedoeld in
      [artikel 17.10, derde lid][ref2], [artikel 17.12, vierde lid][ref3], of [artikel 17.13, vijfde lid][ref4], te
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.15
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.15.2
    text: |-
      Onze Minister kan, indien dat in het belang van de bescherming van het milieu geboden is en indien ter
      zake van een geval van milieuschade of een onmiddellijke dreiging daarvan het dagelijks bestuur van
      een waterschap het bevoegd gezag is, vorderen dat dit bestuursorgaan binnen een door hem te stellen
      termijn toepassing geeft aan [artikel 17.12, vierde lid][ref1], [artikel 17.13, vijfde lid][ref2], of
      [artikel 17.14, eerste, tweede en derde lid][ref3]. De [artikelen 121 tot en met 121f van de Provinciewet][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '121'
  - number: 17.16.1
    text: |-
      Degene die de activiteit verricht waardoor milieuschade of een onmiddellijke dreiging daarvan wordt veroorzaakt,
      draagt de kosten voor de getroffen preventieve of herstelmaatregelen, tenzij hij bewijst dat de milieuschade of de
      onmiddellijke dreiging daarvan:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.1.a
    text: ondanks door hem getroffen passende veiligheidsmaatregelen door een derde is veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.1.b
    text: |-
      het gevolg is van de opvolging van een dwingende opdracht of instructie van een bestuursorgaan, niet zijnde een
      opdracht of instructie naar aanleiding van een emissie of gebeurtenis die door hemzelf is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.2
    text: |-
      In het geval het bevoegd gezag zelf maatregelen treft of de uitvoering daarvan opdraagt aan derden, verhaalt het
      de kosten op degene die de activiteit verricht. Het bevoegd gezag stelt de hoogte van de verschuldigde kosten bij
      beschikking vast. Het bevoegd gezag kan de kosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.3
    text: 'Het bevoegd gezag kan afzien van kostenverhaal indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.3.a
    text: de verhaalkosten groter zijn dan het terug te vorderen bedrag, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.3.b
    text: niet kan worden vastgesteld wie de activiteit verricht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.4
    text: |-
      Terzake van herstelmaatregelen die uit hoofde van deze titel zijn genomen, kan het bevoegd gezag geheel of
      gedeeltelijk afzien van kostenverhaal, voor zover deze kosten redelijkerwijs niet of niet geheel ten laste van
      degene die de activiteit verricht behoren te komen, indien degene die de activiteit verricht, bewijst dat
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.4.a
    text: hij niet in gebreke of nalatig is geweest, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.4.b
    text: 'de schade is veroorzaakt door een activiteit, emissie of gebeurtenis, die op het tijdstip dat deze plaatsvond:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.4.b.1°
    text: |-
      uitdrukkelijk was toegestaan op grond van en geheel in overeenstemming was met de aan een vergunning verbonden
      voorschriften, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: 17.16.4.b.2°
    text: op grond van de stand van de wetenschappelijke en technologische kennis niet als schadelijk werd beschouwd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.16
  - number: '17.17'
    text: |-
      De bevoegdheid tot kostenverhaal met betrekking tot de uit hoofde van deze titel genomen maatregelen vervalt vijf
      jaren na de dag waarop die maatregelen geheel zijn voltooid of na de dag waarop degene die de milieuschade of de
      onmiddellijke dreiging daarvan veroorzaakt is geïdentificeerd, indien deze dag later valt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.17
  - number: '17.18'
    text: |-
      Het bevoegd gezag verstrekt Onze Minister de informatie over de tenuitvoerlegging nodig ter uitvoering van artikel
      18 van de EG-richtlijn milieuaansprakelijkheid. Bij ministeriële regeling kunnen daaromtrent nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.18
  - number: 17.19.1
    text: |-
      Indien stoffen, mengsels of genetisch gemodificeerde organismen, dan wel handelingen daarmee, naar het oordeel van
      Onze Minister onduldbaar gevaar opleveren voor de gezondheid van de mens of voor het milieu, kan hij, zo nodig met
      behulp van de sterke arm, alle maatregelen nemen die hij in het belang van de bescherming van de gezondheid van de
      mens en van het milieu noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.2
    text: 'Tot de in het eerste lid bedoelde maatregelen kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.2.a
    text: |-
      het geheel of gedeeltelijk stopzetten van het vervaardigen of in Nederland invoeren van stoffen, mengsels of
      genetisch gemodificeerde organismen of producten die deze bevatten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.2.b
    text: |-
      het in beslag nemen en, zo nodig, vernietigen van stoffen, mengsels of genetisch gemodificeerde organismen of
      producten die deze bevatten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.2.c
    text: |-
      het beletten dat bepaalde gebieden zonder toestemming van Onze Minister worden betreden of dat dieren, planten of
      goederen zonder zodanige toestemming daarbinnen of daarbuiten worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.2.d
    text: het verwijderen van personen, dieren, planten of goederen uit bepaalde gebieden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.3
    text: |-
      Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat, tenzij de vereiste spoed zich naar zijn oordeel daartegen verzet. In laatstgenoemd geval onderwerpt Onze
      Minister de maatregel zo spoedig mogelijk aan het oordeel van de Raad van Ministers. Indien deze met de maatregel
      niet instemt, trekt Onze Minister hem terstond in.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.4
    text: |-
      Onze Minister maakt een maatregel krachtens het eerste lid en de intrekking daarvan bekend in de Staatscourant.
      Daarnaast bevordert hij dat de maatregel, onderscheidenlijk de intrekking daarvan, zo spoedig mogelijk ter kennis
      van de betrokkenen komt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 17.19.5
    text: Een gedraging in strijd met een krachtens het eerste lid genomen maatregel is verboden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel17.19
  - number: 18.1a.1
    text: |-
      De [artikelen 18.2, vijfde lid][ref1], [18.4][ref2], [18.4a][ref3], [18.6][ref4],
      [18.6a, eerste en tweede lid][ref5], [18.7][ref6], [18.10][ref7], [de paragrafen 18.3.2 tot en met 18.3.4][ref8]
      en [artikel 19.4, vierde lid, van de Omgevingswet][ref9] zijn van overeenkomstige toepassing met betrekking tot de
      handhaving van het bepaalde bij of krachtens:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref8]: https://wetten.overheid.nl/BWBR0037885#Paragraaf18.3.2
      [ref9]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
    references:
