  - number: 10.64.2
    text: |-
      In afwijking van het eerste lid is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing op
      een ontheffing als bedoeld in [artikel 10.63, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel10.64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
