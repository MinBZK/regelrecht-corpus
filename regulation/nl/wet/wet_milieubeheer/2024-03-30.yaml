        artikel: '17'
        hoofdstuk: '17'
  - number: 18.4.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [hoofdstukken 16][ref1], [16a][ref2], [16b][ref3] en
      [16c][ref4] bepaalde, alsmede de naleving van de in [artikel 18.5][ref5] genoemde bepalingen van de Verordening
      monitoring en rapportage emissiehandel, de naleving van de in [artikel 18.5a][ref6] genoemde bepalingen van
      de Verordening kosteloze toewijzing van emissierechten, de naleving van de in [artikel 18.5b][ref7] genoemde
      bepalingen van de Verordening aanpassingen kosteloze toewijzing door verandering activiteitsniveau, de naleving
      van de in [artikel 18.5c][ref8] genoemde bepalingen van de Verordening monitoring, rapportage en verificatie
      van wereldwijde luchtvaartemissies, de naleving van de in [artikel 18.5d][ref9] genoemde bepalingen van de
      Verordening monitoring, rapportage en verificatie van broeikasgasemissies door maritiem vervoer en van de in
      [artikel 18.6][ref10] genoemde bepalingen van de Verordening verificatie en accreditatie emissiehandel, zijn belast
      de bij besluit van Onze Minister aangewezen ambtenaren.


