        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16p.1
    text: |-
      Het bestuur van de emissieautoriteit stelt elk jaar voor 1 oktober een overzicht op van personen die het bepaalde
      bij [artikel 16.37, eerste lid][ref1], of [artikel 16.39t, eerste, tweede en derde lid][ref2], hebben overtreden
      en ten aanzien van wie de beschikking tot oplegging van de bestuurlijke boete, bedoeld in [artikel 18.16k][ref3],
      onherroepelijk is geworden. Het overzicht wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16p
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2.4
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16p.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het overzicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16p
  - number: 18.16q.1
    text: |-
      Het bestuur van de emissieautoriteit kan degene die jegens de in [artikel 18.4, eerste of tweede lid][ref1],
      bedoelde personen in strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2], een
      bestuurlijke boete opleggen van ten hoogste € 4 500 of een last onder bestuursdwang als bedoeld in artikel 5.20,
      derde lid, van de Algemene wet bestuursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16q
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.16q.2
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16q
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 18.16r.1
    text: |-
      Het bestuur van de emissieautoriteit kan de Commissie van Europese Gemeenschappen verzoeken een exploitatieverbod
      als bedoeld in artikel 16, tiende lid, van de EG-richtlijn handel in broeikasgasemissierechten op te leggen aan een
      vliegtuigexploitant die niet voldoet aan het bepaalde bij of krachtens [afdeling 16.2.2][ref1], indien zulks niet
      met andere handhavingsmaatregelen kon worden gewaarborgd. Het verzoek voldoet in elk geval aan de in artikel 16,
      zesde lid, van genoemde richtlijn opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 18.16r.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het eerste lid.
      Indien regels worden gesteld, worden in de maatregel in elk geval geregeld:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16r.2.a
    text: de gevallen waarin een verzoek kan worden ingediend;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16r.2.b
    text: de procedure die voorafgaand aan het indienen van het verzoek moet worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16r.3
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, regels stellen met betrekking
      tot de eisen waaraan een verzoek overigens moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16r.4
    text: |-
      Krachtens het tweede en derde lid gestelde regels voldoen in elk geval aan de eisen die de Commissie
      van de Europese Gemeenschappen op grond van artikel 16, twaalfde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16r.5
    text: |-
      Het bestuur van de emissieautoriteit zendt een afschrift van een verzoek als bedoeld in het eerste lid aan Onze
      Minister en aan Onze Minister van Verkeer en Waterstaat. Het afschrift wordt verzonden gelijktijdig met het
      indienen van het verzoek bij de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16r
  - number: 18.16s.1
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens de [artikelen 9.7.1.3][ref1], [9.7.2.3][ref2],
      [9.7.2.5][ref3], [9.7.4.1 tot en met 9.7.4.5][ref4], [9.7.4.8][ref5], [9.7.4.10][ref6], [9.7.4.12][ref7],
      [9.7.4.13][ref8], [9.7.6.1][ref9], [9.7.6.2][ref10], [9.8.2.3][ref11] of [9.8.2.5][ref12] kan het bestuur van de
      emissieautoriteit de overtreder een bestuurlijke boete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
