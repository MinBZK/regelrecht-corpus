  - number: 19.4.1
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 19.3, eerste lid][ref1], vult de verzoeker, indien een tweede
      tekst naar het oordeel van het bevoegd gezag niet voldoende gegevens zou verschaffen voor een goede beoordeling
      van het stuk waarop het verzoek betrekking heeft, een ander stuk in samenhang waarmee het stuk wordt ingediend,
      het ontwerp van het besluit of het besluit, de stukken binnen een door het bevoegd gezag te stellen termijn zoveel
      mogelijk aan met andere gegevens die voor die beoordeling bevorderlijk kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.4.2
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 19.3, tweede lid][ref1], vult Onze betrokken Minister,
      indien een tweede tekst naar zijn oordeel niet voldoende gegevens zou verschaffen voor een goede beoordeling van
      het stuk waarop het verzoek betrekking heeft, een ander stuk in samenhang waarmee het stuk wordt ingediend, het
      ontwerp van het besluit of het besluit, de stukken zoveel mogelijk aan met andere gegevens die voor die beoordeling
      bevorderlijk kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.4.3
    text: |-
      Op de tweede tekst stelt het bevoegd gezag een aantekening waaruit blijkt dat die tekst dient ter vervanging van de
      oorspronkelijke tekst waarin gegevens voorkomen, waarvan de geheimhouding gerechtvaardigd onderscheidenlijk geboden
      is. Indien het eerste of tweede lid toepassing heeft gevonden, vermeldt de aantekening tevens dat de stukken zijn
      aangevuld met gegevens als in die leden bedoeld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.4
  - number: 19.5.1
    text: |-
      Op een verzoek tot geheimhouding beslist het bevoegd gezag binnen vier weken na ontvangst. Van de beslissing
      wordt mededeling gedaan aan de betrokken bestuursorganen. Indien het verzoek in het kader van de toepassing van
      [afdeling 16.4 van de Omgevingswet][ref1] is gedaan en betrekking heeft op een plan of programma onderscheidenlijk
      besluit waarover de Commissie voor de milieueffectrapportage op grond van [artikel 16.39 van die wet][ref2]
      onderscheidenlijk [16.47 van die wet][ref3], in de gelegenheid wordt gesteld advies uit te brengen, wordt van de
      beslissing tevens mededeling gedaan aan die commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling16.4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '16.4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '16'
  - number: 19.5.2
    text: |-
      Indien een verzoek tot geheimhouding in het kader van de toepassing van [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] indien het een besluit op aanvraag betreft, schort het bevoegd
      gezag de verdere behandeling van de aanvraag op totdat, indien het verzoek wordt toegestaan, de tweede tekst
      is overgelegd en de stukken zijn aangevuld met de in [artikel 19.4, eerste lid][ref3], bedoelde gegevens, dan
      wel, indien het verzoek geheel of gedeeltelijk wordt afgewezen, de beslissing op het verzoek onherroepelijk
      is geworden. De krachtens de [artikelen 3:18][ref4] en [4:5 van de Algemene wet bestuursrecht][ref5],
      [artikel 31 van de Dienstenwet][ref6], [artikel 16.64 van de Omgevingswet][ref7] en [artikel 13.8][ref8] geldende
      termijnen lopen niet zolang de behandeling is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0026759#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel19.5
    references:
