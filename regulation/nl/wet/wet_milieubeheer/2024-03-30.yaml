  - number: 15.21.2
    text: In gevallen als bedoeld in het eerste lid beslist Onze Minister over het toekennen van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.21
  - number: '15.22'
    text: |-
      Voor zover de toekenning van de vergoeding niet is geschied met instemming van Onze Minister, komen de kosten
      daarvan ten laste van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.22
  - number: 15.23.1
    text: |-
      Bij koninklijk besluit kan, naar aanleiding van een daartoe strekkend verzoek van het bevoegd gezag, worden bepaald
      dat de kosten van een toegekende vergoeding alsnog geheel of gedeeltelijk ten laste van het Rijk komen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.23
  - number: 15.23.2
    text: |-
      [Artikel 20 van de Wet op de Raad van State][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.23
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '20'
  - number: '15.31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van vergoedingen voor
      keuringen als bedoeld in
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.31
  - number: 15.31.a
    text: |-
      [artikel 9.2.2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 15.31.b
    text: |-
      [artikel 9.5.1, derde lid, onder e en f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.32.1
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 9.5.2, eerste lid][ref1], kunnen regels worden
      gesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.32.1.a
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die stoffen, mengsels of
      produkten in Nederland op de markt brengen in bij de maatregel aangewezen verpakkingen, voor zodanige verpakkingen
      een bij of krachtens de maatregel te bepalen statiegeld in rekening te brengen en zodanige verpakkingen na gebruik
      met terugbetaling van het statiegeld in te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.32.1.b
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die daarbij aangewezen
      stoffen, mengsels of produkten in Nederland op de markt brengen, voor zodanige stoffen, mengsels of produkten
      een bij of krachtens de maatregel te bepalen statiegeld in rekening te brengen en zodanige stoffen, mengsels of
      produkten na gebruik met terugbetaling van het statiegeld in te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.32.2
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 9.5.2, eerste lid][ref1], kunnen regels worden
      gesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.32.2.a
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die stoffen, mengsels of
      produkten in Nederland op de markt brengen in bij de maatregel aangewezen verpakkingen, zodanige verpakkingen na
      gebruik tegen betaling van een bij of krachtens de maatregel te bepalen premie in te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.32.2.b
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die daarbij aangewezen
      stoffen, mengsels of produkten in Nederland op de markt brengen, deze na gebruik tegen betaling van een bij of
      krachtens de maatregel te bepalen premie in te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.32.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, kan worden bepaald dat daarbij aangegeven handelingen
      door andere dan de in het eerste en tweede lid bedoelde, bij die maatregel aangewezen categorieën van personen
      moeten worden verricht. In deze gevallen kan tevens worden bepaald dat eveneens bij de maatregel aangewezen
      categorieën van personen het statiegeld, bedoeld in het eerste lid, of de premie, bedoeld in het tweede lid, geheel
      of gedeeltelijk op een daarbij aangegeven wijze dienen af te dragen aan een of meer daarbij aangewezen andere
      personen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.32.4
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, wordt een termijn bepaald, eerst bij het verstrijken
      waarvan die regels ten aanzien van stoffen, mengsels of produkten die bij het in werking treden van de maatregel
      reeds vervaardigd en in Nederland aanwezig waren, gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.32
  - number: 15.33.1
    text: |-
      De gemeenteraad kan ter bestrijding van de kosten die voor haar verbonden zijn aan het beheer van
      huishoudelijke afvalstoffen een heffing instellen, waaraan kunnen worden onderworpen degenen die, al dan niet
      krachtens een zakelijk of persoonlijk recht, gebruik maken van een perceel ten aanzien waarvan krachtens de
      [artikelen 10.21][ref1] en [10.22][ref2] een verplichting tot het inzamelen van huishoudelijke afvalstoffen geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.33.2
    text: 'Voor de toepassing van het eerste lid, wordt:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
  - number: 15.33.2.a
    text: |-
      gebruikmaken van een perceel door de leden van een huishouden aangemerkt als gebruikmaken door het door de in
      [artikel 231, tweede lid, onderdeel b, van de Gemeentewet][ref1] bedoelde gemeenteambtenaar aangewezen lid van
      dat huishouden;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
  - number: 15.33.2.b
    text: |-
      gebruikmaken door degene aan wie een deel van een perceel in gebruik is gegeven, aangemerkt als gebruikmaken door
      degene die dat deel in gebruik heeft gegeven, met dien verstande dat degene die het deel in gebruik heeft gegeven,
      bevoegd is de heffing als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
  - number: 15.33.2.c
    text: |-
      het ter beschikking stellen van een perceel voor volgtijdig gebruik aangemerkt als gebruikmaken door degene die dat
      perceel ter beschikking heeft gesteld, met dien verstande dat degene die het perceel ter beschikking heeft gesteld,
      bevoegd is de heffing als zodanig te verhalen op degene aan wie het perceel ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
  - number: 15.33.3
    text: |-
      Onder de in het eerste lid bedoelde kosten wordt mede verstaan de omzetbelasting die ingevolge de
      [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: 15.33.4
    text: |-
      Met betrekking tot deze heffingen zijn [de artikelen 216 tot en met 219][ref1] en
      [230 tot en met 257 van de Gemeentewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel230
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '230'
  - number: 15.34a
    text: |-
      Met betrekking tot beschikkingen tot verlening, wijziging of intrekking van een vergunning of ontheffing krachtens
      deze wet worden geen rechten geheven.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.34a
  - number: '15.35'
    text: |-
      Voor de toepassing van deze titel en de daarop berustende bepalingen wordt verstaan onder: afvalbeheerbijdrage:
      bijdrage in de kosten van het beheer van een afvalstof; overeenkomst over een afvalbeheerbijdrage: schriftelijke
      overeenkomst tussen degenen die een stof, mengsels of product in Nederland invoeren of op de markt brengen, tot het
      afdragen van een afvalbeheerbijdrage.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.35
  - number: 15.36.1
    text: |-
      Onze Minister kan, indien dat in het belang is van een doelmatig beheer van afvalstoffen en in overeenstemming
      is met artikel 8bis van de kaderrichtlijn afvalstoffen, op een met redenen omkleed verzoek een overeenkomst over
      een afvalbeheerbijdrage algemeen verbindend verklaren voor een ieder die die stof, dat mengsels of dat produkt in
      Nederland invoert of op de markt brengt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.36
  - number: 15.36.2
    text: |-
      Onze Minister stelt regels met betrekking tot de onderwerpen die in ieder geval in een overeenkomst over een
      afvalbeheerbijdrage, waarvoor een algemeen verbindend verklaring wordt gevraagd, aan de orde dienen te komen,
      alsmede met betrekking tot de bij een verzoek als bedoeld in het eerste lid over te leggen gegevens. Tot die
      gegevens behoren in ieder geval gegevens, waaruit duidelijk wordt dat redelijkerwijs is getracht te voorkomen, dat
      gebruikers van die stof, dat mengsels of dat produkt in de praktijk meer dan eenmaal een bijdrage voor het beheer
      daarvan verschuldigd zullen zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.36
  - number: 15.36.3
    text: |-
      [Artikel 9.5.2, eerste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de regels, bedoeld
      in dat lid, tevens kunnen worden gesteld ten aanzien van de uitvoering van een regeling voor uitgebreide
      producentenverantwoordelijkheid die is opgelegd middels een algemeen verbindend verklaarde overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.37.1
    text: |-
      Een verzoek als bedoeld in [artikel 15.36][ref1] kan slechts worden ingediend door degenen die, onderscheidenlijk
      organisaties van degenen die wat betreft de gezamenlijke omzet van de betrokken stoffen, mengsels of produkten
      een naar het oordeel van Onze Minister belangrijke meerderheid vormen van degenen die deze stoffen, mengsels of
      produkten in Nederland invoeren of op de markt brengen. Onze Minister betrekt bij zijn oordeel met betrekking
      tot de vraag of degenen die, onderscheidenlijk de organisaties van degenen die het verzoek hebben ingediend, een
      belangrijke meerderheid vormen, in ieder geval het aantal van hen in verhouding met het totale aantal van degenen
      die deze stoffen, mengsels of produkten in Nederland invoeren of op de markt brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.37.2
    text: |-
      Op de voorbereiding van een besluit op het verzoek is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 15.37.3
    text: |-
      Indien een besluit niet kan worden genomen dan nadat is voldaan aan een uit een voor Nederland verbindend verdrag
      of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie voortvloeiende verplichting, wordt
      de termijn voor het nemen van dat besluit opgeschort tot de ten aanzien van die verplichting geldende procedure is
      afgerond. Van de opschorting wordt mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.37
  - number: 15.37.4
    text: |-
      Indien bij het besluit een overeenkomst over een afvalbeheerbijdrage algemeen verbindend wordt verklaard, wordt van
      de overeenkomst in de *Staatscourant* mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.37
  - number: 15.38.1
    text: |-
      Onze Minister kan van een algemeen verbindend verklaarde overeenkomst over een afvalbeheerbijdrage op een daartoe
      strekkend verzoek ontheffing verlenen, indien de verzoeker zorg draagt voor een zodanig beheer van de betrokken
      afvalstoffen dat deze naar het oordeel van Onze Minister ten minste gelijkwaardig is aan het beheer overeenkomstig
      de betrokken algemeen verbindend verklaarde overeenkomst over een afvalbeheerbijdrage.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.38
  - number: 15.38.2
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.38
  - number: 15.38.3
    text: |-
      Een krachtens het eerste lid verleende ontheffing kan ambtshalve of op een daartoe strekkend verzoek worden
      gewijzigd of ingetrokken. [Artikel 15.39, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande
      dat voor het in onderdeel *b* van dat lid genoemde belang in de plaats treedt: het niet langer voldoen aan het in
      het eerste lid van dit artikel genoemde vereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.38.4
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het eerste en derde lid, is
      [artikel 15.37, tweede tot en met vierde lid][ref1], van overeenkomstige toepassing. Onze Minister stelt de houder
      van de ontheffing, behoudens in gevallen waarin deze om wijziging of intrekking verzoekt, van zijn voornemen tot
      wijziging of intrekking in kennis, alvorens een besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.38.5
    text: |-
      Onze Minister kan regels stellen met betrekking tot de gegevens die een verzoeker bij een verzoek als bedoeld in
      het eerste lid dient te overleggen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.38
  - number: 15.39.1
    text: |-
      Een besluit krachtens [artikel 15.36, eerste lid][ref1], geldt voor een daarbij aangegeven termijn van ten hoogste
      vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.2
    text: |-
      Onze Minister kan een besluit krachtens [artikel 15.36, eerste lid][ref1], intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.2.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist zijn of onvolledig blijken, dat op het verzoek een andere
      beslissing zou zijn genomen als bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
  - number: 15.39.2.b
    text: |-
      op grond van een verandering van de omstandigheden of inzichten opgetreden na het nemen van het besluit, moet
      worden aangenomen dat het van kracht blijven van het besluit het belang van een doelmatig beheer van afvalstoffen
      op onaanvaardbare wijze zou schaden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
  - number: 15.39.2.c
    text: |-
      een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie, dan wel regels ter uitvoering daarvan, hiertoe verplichten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
  - number: 15.39.3
    text: |-
      Alvorens een besluit krachtens [artikel 15.36, eerste lid][ref1], op grond van het tweede lid, onder *a*, in
      te trekken, stelt Onze Minister degenen die het verzoek tot algemeen verbindend verklaring hebben gedaan, in de
      gelegenheid hun zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.4
    text: |-
      Op de voorbereiding van een besluit tot intrekking van een besluit krachtens [artikel 15.36, eerste lid][ref1], op
      grond van het tweede lid, onder b of c, is [artikel 15.37, tweede tot en met vierde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: '15.40'
    text: |-
      Een ieder is tot naleving van een voor hem geldende algemeen verbindend verklaarde overeenkomst over een
      afvalbeheerbijdrage gehouden tegenover ieder ander, die bij de naleving een redelijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.40
  - number: '15.41'
    text: |-
      Indien een of meer van degenen die een stof, mengsels of product in Nederland invoeren of op de markt brengen,
      waarvoor een overeenkomst over een afvalbeheerbijdrage algemeen verbindend is verklaard, het vermoeden gegrond
      achten dat door een of meer anderen een of meer van de algemeen verbindend verklaarde bepalingen uit die
      overeenkomst niet worden nageleefd, kunnen zij met het oog op het instellen van een rechtsvordering op grond van
      [artikel 15.40][ref1] Onze Minister verzoeken een onderzoek daarnaar te doen instellen. De inspecteur stelt het
      onderzoek in en brengt aan Onze Minister verslag uit van hetgeen bij het onderzoek is gebleken. Onze Minister stelt
      het verslag ter beschikking van degene of degenen, die om het onderzoek hebben gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: '15.42'
    text: |-
      In deze titel en de daarop berustende bepalingen wordt onder «stortplaats», «gesloten stortplaats» en
      «bedrijfsgebonden stortplaats» verstaan hetgeen daaronder wordt verstaan in [paragraaf 8.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '15.43'
    text: |-
      Deze titel is niet van toepassing op stortplaatsen waar baggerspecie is gestort en die worden gedreven of mede
      worden gedreven door Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.43
  - number: 15.44.1
    text: 'Provinciale staten stellen een heffing in ter bestrijding van de kosten die gemoeid zullen zijn met:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
  - number: 15.44.1.a
    text: de in artikel 8.49 bedoelde zorg voor de in de betrokken provincie gelegen stortplaatsen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
  - number: 15.44.1.b
    text: |-
      een voor de betrokken provincie geldende verplichting tot afdracht aan een fonds als bedoeld in
      [artikel 15.48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.44.1.c
    text: |-
      de door de provincie uitgevoerde inventarisatie van plaatsen waar afvalstoffen zijn gestort en waar dat storten
      vóór 1 september 1996 is beëindigd, en het onderzoek naar en systematische controle van aanwezigheid, aard en
      omvang van eventuele verontreiniging aldaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
  - number: 15.44.2
    text: |-
      De in het eerste lid bedoelde heffing kan mede betrekking hebben op de kosten die gemoeid zullen zijn met de
      dekking van de aansprakelijkheid, bedoeld in [artikel 176 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 15.44.3
    text: |-
      Met betrekking tot de heffing en invordering zijn de [artikelen 227][ref1] tot en met
      [232h van de Provinciewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel232h
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '227'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 232h
  - number: 15.45.1
    text: De heffing wordt geheven van degene die een stortplaats drijft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.45
  - number: 15.45.2
    text: |-
      Het bedrag van de heffing wordt zodanig vastgesteld dat uit de opbrengst van de heffing en de daarover verkregen
      rentebaten en beleggingsopbrengsten de kosten kunnen worden bestreden, die naar verwachting gemoeid zullen zijn met
      de uitvoering van het in [artikel 8.49, derde en vierde lid][ref1], bedoelde nazorgplan waarmee gedeputeerde staten
      hebben ingestemd, of, indien geen nazorgplan geldt, de in [artikel 8.49, eerste lid][ref2], bedoelde zorg voor die
      stortplaats. Indien na de vaststelling blijkt dat de opbrengst van de heffing hoger dan wel lager is dan het bedrag
      dat nodig is om de kosten te bestrijden die naar verwachting met die zorg van die stortplaats gemoeid zullen zijn,
      kan het bedrag van de heffing opnieuw worden vastgesteld. Het reeds betaalde bedrag van de heffing wordt hierop in
      mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.45.3
    text: |-
      In afwijking van het tweede lid kan de heffing terzake van de niet-bedrijfsgebonden stortplaatsen in de betrokken
      provincie worden vastgesteld aan de hand van de hoeveelheid en de aard van de afvalstoffen die op de stortplaats
      zijn afgegeven. Het bedrag wordt zodanig vastgesteld dat uit het totaal van de opbrengsten van de heffing en de
      daarover verkregen rentebaten en beleggingsopbrengsten voor de niet-bedrijfsgebonden stortplaatsen in die provincie
      de kosten kunnen worden bestreden die naar verwachting gemoeid zullen zijn met de zorg voor die stortplaatsen.
      De kosten, bedoeld in [de tweede volzin][ref1], worden berekend met inachtneming van de voor die stortplaatsen
      geldende nazorgplannen waarmee gedeputeerde staten hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.45.4
    text: Het derde lid is niet van toepassing op stortplaatsen waar baggerspecie is gestort.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.45
  - number: 15.46.1
    text: |-
      Gedeputeerde staten kunnen bepalen dat degenen die een stortplaats drijven, waarop
      [artikel 15.45, derde lid][ref1], niet van toepassing is, financiële zekerheid stellen voor het nakomen van de
      krachtens [de artikelen 15.44, eerste lid, onder a, en 15.45][ref2] voor hen geldende verplichting. Daarbij wordt
      in ieder geval aangegeven het bedrag waarvoor de zekerheid ten hoogste in stand moet worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.2
    text: |-
      De verplichting financiële zekerheid in stand te houden vervalt op het tijdstip waarop een bedrag aan heffing, als
      bedoeld in [artikel 15.45, tweede lid][ref1], is betaald, voor zover het betreft het gedeelte dat overeenkomt met
      het bedrag dat is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.3
    text: |-
      Gedeputeerde staten kunnen verhaal nemen op de gestelde zekerheid, voor zover degene die de zekerheid heeft
      gesteld, het bedrag van de heffing, zoals dat is vastgesteld ingevolge [artikel 15.45, tweede lid][ref1], niet
      tijdig heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.4
    text: Gedeputeerde staten kunnen het ingevolge het derde lid te verhalen bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.46
  - number: 15.46.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop financiële zekerheid
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.46
  - number: 15.47.1
    text: |-
      Gedeputeerde staten van een provincie richten voor hun provincie een fonds op, bestemd voor de in
      [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.47.2
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten van verschillende provincies gezamenlijk voor hun
      provincies een fonds als bedoeld in het eerste lid oprichten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.3
    text: Een fonds is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.4
    text: |-
      Gedeputeerde staten van de betrokken provincie, onderscheidenlijk provincies zijn belast met het beheer van het in
      hun provincie, onderscheidenlijk provincies werkzame fonds.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.5
    text: 'Een fonds ontvangt jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.5.a
    text: |-
      de opbrengst van de in [artikel 15.44][ref1] bedoelde heffing, verminderd met het bedrag ter bestrijding van de
      kosten in verband met de in [artikel 15.44, eerste lid, onder c][ref2], bedoelde handelingen en met het gedeelte
      van de heffingen, bedoeld in [artikel 15.48, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.5.b
    text: |-
      de bedragen die ingevolge [artikel 15.46, derde lid][ref1], worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.5.c
    text: rentebaten en beleggingsopbrengsten die via het fonds zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.5.d
    text: het batig saldo van de laatstelijk afgesloten rekening van het fonds.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.6
    text: |-
      Een fonds is gerechtigd ook andere bedragen, bestemd voor de in [artikel 8.49][ref1] bedoelde zorg, dan die,
      bedoeld in het vijfde lid, in ontvangst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.47.7
    text: 'Uit het fonds worden uitsluitend bestreden de kosten die:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.7.a
    text: |-
      worden gemaakt in verband met de uitvoering van de in [artikel 8.49][ref1] bedoelde zorg met betrekking tot
      gesloten stortplaatsen in de betrokken provincie of provincies;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.47.7.b
    text: |-
      zijn verbonden aan de werkzaamheden van het fonds dat in de betrokken provincie, onderscheidenlijk provincies
      werkzaam is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
  - number: 15.47.7.c
    text: |-
      worden gemaakt ter dekking van de aansprakelijkheid, bedoeld in
      [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref1], doch slechts voor zover de in
      [artikel 15.44][ref2] bedoelde heffing mede op deze kosten betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel176
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '176'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.8
    text: |-
      Onder de kosten, bedoeld in het zevende lid, worden niet begrepen de kosten die in verband met de in
      [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen door de betrokken provincie, onderscheidenlijk
      provincies worden gemaakt ten behoeve van haar bestuurlijk apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.48.1
    text: |-
      Gedeputeerde staten van provincies kunnen gezamenlijk een fonds oprichten ter dekking van grote financiële risico's
      in verband met de in [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 15.48.2
    text: |-
      Het in het eerste lid bedoelde fonds ontvangt jaarlijks van die provincies een door het bestuur van dat fonds te
      bepalen gedeelte van de aan die provincies afgedragen heffingen als bedoeld in [artikel 15.45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.48.3
    text: |-
      Van [artikel 15.47][ref1] zijn het derde en vierde lid, alsmede het achtste lid, in verbinding met het zevende lid,
      onder b, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.49.1
    text: |-
      Ter zake van door een stortplaats veroorzaakte schade, die bekend is geworden na het tijdstip waarop een verklaring
      als bedoeld in [artikel 8.47, derde lid][ref1], met betrekking tot die stortplaats is afgegeven, doet noch een
      provincie, noch het in deze titel bedoelde fonds een beroep op de aansprakelijkheid van degene die als laatste de
      stortplaats heeft gedreven op grond van [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 15.49.2
    text: |-
      Indien degene die als laatste een stortplaats heeft gedreven, waarvoor een verklaring als bedoeld in
      [artikel 8.47, derde lid][ref1], is afgegeven, aansprakelijk is voor de door die stortplaats veroorzaakte schade
      op grond van [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref2], kan degene jegens wie deze
      aansprakelijkheid bestaat, zijn recht op schadevergoeding geldend maken tegen het in deze titel bedoelde fonds dat
      in de betrokken provincie werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 15.50.1
    text: |-
      Onze Minister kan uitkeringen verlenen aan personen bij wie ten gevolge van blootstelling aan asbest maligne
      mesothelioom of asbestose is vastgesteld en die niet in aanmerking kunnen komen voor een daarmee verband houdende
      uitkering op grond van de [Kaderwet SZW-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008754
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.50
    references:
      - id: ref1
        bwb_id: BWBR0008754
  - number: 15.50.2
    text: Onze Minister stelt nadere regels ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.50
  - number: 15.51.1
    text: Deze titel is van toepassing op het telen van gewassen in kassen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51
  - number: 15.51.2
    text: 'Deze activiteit omvat ook andere milieubelastende activiteiten die worden verricht op dezelfde locatie en die:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51
  - number: 15.51.2.a
    text: |-
      hiermee rechtstreeks samenhangen, in technisch verband staan, en gevolgen kunnen hebben voor de emissies en
      verontreiniging, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51
  - number: 15.51.2.b
    text: deze functioneel ondersteunen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51
  - number: 15.51a
    text: 'Deze titel is niet van toepassing op het telen van gewassen in kassen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.a
    text: |-
      met een totale oppervlakte kleiner dan 2.500 m2, indien op het terrein niet uitsluitend gewassen in kassen worden
      geteeld,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.b
    text: 'alleen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.b.1°
    text: bij een huishouden of bij het uitoefenen van beroep of bedrijf aan huis,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.b.2°
    text: voor educatieve doeleinden,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.b.3°
    text: bij onderzoeksinstellingen, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.b.4°
    text: bij volkstuinen, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
  - number: 15.51a.c
    text: |-
      voor zover het een milieubelastende activiteit met betrekking tot een broeikasgasinstallatie als bedoeld in
      [artikel 16.1, tweede lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
  - number: 15.51b.1
    text: |-
      Voor activiteiten als bedoeld in [artikel 15.51][ref1] geldt een systeem van verevening van kosten van het in
      een kalenderjaar overschrijden van de voor het verrichten van de activiteiten gezamenlijk voor dat kalenderjaar
      vastgestelde hoeveelheid CO-emissies.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.51b.2
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit, de hoeveelheid
      CO-emissies, bedoeld in het eerste lid vast. Het besluit wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.51b
  - number: '15.52'
    text: |-
      Indien de hoeveelheid emissies, bedoeld in [artikel 15.51b, eerste lid][ref1], wordt overschreden, is degene die
      een activiteit als bedoeld in [artikel 15.51][ref2] verricht een vergoeding verschuldigd aan Onze Minister. Bij
      algemene maatregel van bestuur wordt de hoogte van die vergoeding dan wel de wijze van berekenen van de hoogte van
      die vergoeding vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.52
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: '15.53'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten behoeve van de uitvoering van de
      [artikelen 15.51][ref1], [15.51b][ref2] en [15.52][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.53
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 16.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: aanloophaven: de haven waar een
      schip stopt om vracht te laden of te lossen of om passagiers te laten in- of ontschepen, of de haven waar een
      offshoreschip stopt om de bemanning af te lossen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.1.1°
    text: |-
      stops die uitsluitend bedoeld zijn voor het tanken, het inslaan van voorraden, het aflossen van de bemanning
      van een ander schip dan een offshoreschip, het indokken of het verrichten van herstellingen aan het schip of de
      uitrusting ervan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.1.2°
    text: stops in een haven omdat het schip bijstand nodig heeft of in nood is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.1.3°
    text: buiten een haven verrichte schip-tot-schiptransfers;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.1.4°
    text: |-
      stops die uitsluitend bedoeld zijn voor het schuilen bij noodweer of die noodzakelijk zijn voor opsporings- en
      reddingsactiviteiten; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.1.5°
    text: |-
      stops van containerschepen in een naburige containeroverslaghaven die is opgenomen in de lijst van de uit hoofde
      van artikel 3 octies bis, tweede lid, van de EG-richtlijn handel in broeikasgasemissierechten, vastgestelde
      uitvoeringshandeling;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
  - number: 16.1.2
    text: |-
      Voor de toepassing van [titel 16.2][ref1] en de daarop berustende bepalingen wordt verstaan onder:
      broeikasgasinstallatie: vaste technische eenheid, waarin een of meer activiteiten worden verricht, die een emissie
      van een broeikasgas in de lucht veroorzaken en die behoren tot een categorie die met betrekking tot het betrokken
      broeikasgas bij algemene maatregel van bestuur is aangewezen, alsmede andere activiteiten die met eerstbedoelde
      activiteiten rechtstreeks samenhangen en daarmee technisch in verband staan en die gevolgen kunnen hebben voor de
      emissie van het betrokken broeikasgas in de lucht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 16.1.3
    text: |-
      Voor de toepassing van [afdeling 16.2.1][ref1] onderscheidenlijk [afdeling 16.2.2][ref2] wordt verstaan onder: -
      *emissieverslag:* verslag betreffende de emissies in een kalenderjaar als bedoeld in artikel 67 en bijlage X van de
      Verordening monitoring en rapportage emissiehandel en artikel 11 en 11bis van de Verordening monitoring, rapportage
      en verificatie van broeikasgasemissies door maritiem vervoer;
        - *handelsperiode:* handelsperiode als bedoeld in artikel 3, onder 2, van de Verordening monitoring en rapportage
      emissiehandel;
        - *monitoringsplan:* plan als bedoeld in artikel 12 en bijlage I van de Verordening monitoring en rapportage
      emissiehandel en artikel 6 van de Verordening monitoring, rapportage en verificatie van broeikasgasemissies door
      maritiem vervoer;
        - *verificateur:* verificateur als bedoeld in artikel 3, onder 3, van de Verordening verificatie en
      accreditatie emissiehandel en artikel 3, onder f, van de Verordening monitoring, rapportage en verificatie van
      broeikasgasemissies door maritiem vervoer;
        - *verificatie:* door een verificateur uitgevoerde activiteiten om een verificatierapport of verificatieverslag uit
      te brengen overeenkomstig de Verordening verificatie en accreditatie emissiehandel en de Verordening monitoring,
      rapportage en verificatie van broeikasgasemissies door maritiem vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.2.1
    text: Een emissie van een broeikasgas in de lucht wordt uitgedrukt in tonnen kooldioxide-equivalent.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2
  - number: 16.2a.1
    text: |-
      Deze afdeling is, met uitzondering van [paragraaf 16.2.1.3][ref1], mede van toepassing op het transport van CO
      (CCS).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.2a.2
    text: |-
      Voor de toepassing van deze afdeling op het transport van CO (CCS) wordt onder «de exploitant van de
      broeikasgasinstallatie» verstaan: de natuurlijke persoon of de rechtspersoon die de transportactiviteit verricht
      of aan wie een doorslaggevende economische zeggenschap over het technisch functioneren van die activiteit is
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2a
  - number: 16.2b.1
    text: |-
      De artikelen [16.24 tot en met 16.30a][ref1] zijn van overeenkomstige toepassing op broeikasgasinstallaties
      die op grond van artikel 27, eerste lid of artikel 27bis, eerste lid, van de EG-richtlijn handel in
      broeikasgasemissierechten zijn uitgesloten van het systeem van handel in broeikasgasemissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.2b.2
    text: Het eerste lid geldt met ingang van 1 januari van het eerste kalenderjaar van de betrokken handelsperiode.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2b
  - number: 16.2b.3
    text: |-
      Indien een broeikasgasinstallatie op grond van artikel 27, derde lid of artikel 27bis, tweede lid,
      van de EG-richtlijn handel in broeikasgasemissierechten weer is opgenomen in het systeem van handel in
      broeikasgasemissierechten omdat de door die broeikasgasinstallatie veroorzaakte emissies de in artikel 27, eerste
      lid, van die richtlijn opgenomen hoeveelheid overschrijden, is het eerste lid niet langer van toepassing en is
      deze afdeling, met uitzondering van [artikel 16.37][ref1], op die broeikasgasinstallatie van toepassing met ingang
      van 1 januari van het kalenderjaar volgend op het kalenderjaar waarin de broeikasgasinstallatie niet meer voldoet
      aan de voorwaarden voor uitsluiting. Artikel 16.37 is van toepassing met ingang van 1 januari van het tweede
      kalenderjaar volgend op het kalenderjaar waarin de broeikasgasinstallatie niet meer aan bedoelde voorwaarden
      voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.2b.4
    text: |-
      Indien een broeikasgasinstallatie op grond van artikel 27, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten weer is opgenomen in het systeem van handel in broeikasgasemissierechten omdat de
      maatregelen die een gelijkwaardige bijdrage leveren tot emissiereductie, niet langer van toepassing zijn, is
      het eerste lid niet langer van toepassing en is deze afdeling, met uitzondering van [artikel 16.37][ref1], op
      die broeikasgasinstallatie van toepassing met ingang van de dag volgend op de dag waarop bedoelde maatregelen
      zijn vervallen. Artikel 16.37 is van toepassing met ingang van 1 januari van het kalenderjaar volgend op het
      kalenderjaar waarin bedoelde maatregelen zijn vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.2b.5
    text: |-
      Indien een broeikasgasinstallatie op grond van artikel 27, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten weer is opgenomen in het systeem van handel in broeikasgasemissierechten blijft de
      broeikasgasinstallatie in het systeem van handel in broeikasgasemissierechten gedurende de rest van de in artikel
      11, eerste lid, van de EG-richtlijn handel in broeikasgasemissierechten bedoelde periode waarin ze werd ingevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.2b
  - number: '16.3'
    text: |-
      Onder broeikasgasinstallaties worden mede begrepen broeikasgasinstallaties binnen de Nederlandse exclusieve
      economische zone.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.3
  - number: '16.4'
    text: |-
      Een wijziging van de EG-richtlijn handel in broeikasgasemissierechten of van een bijlage bij die richtlijn gaat
      voor de toepassing van deze titel gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet
      zijn gegeven, tenzij bij een besluit van Onze Minister van Economische Zaken en Klimaat, dat in de Staatscourant
      wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.4
  - number: 16.4a.1
    text: |-
      Het bestuur van de emissieautoriteit draagt er zorg voor dat alle besluiten en verslagen die verband houden met
      de hoeveelheid emissierechten en de toewijzing daarvan en met de bewaking, rapportage en verificatie van emissies
      onverwijld op passende wijze openbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.4a
  - number: 16.4a.2
    text: |-
      [Artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.4a
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 16.5.1
    text: |-
      Het is verboden zonder vergunning van het bestuur van de emissieautoriteit een broeikasgasinstallatie te
      exploiteren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.5
  - number: 16.5.2
    text: |-
      Een aanvraag om een vergunning kan naar keuze van de aanvrager betrekking hebben op één of meer
      broeikasgasinstallaties die worden geëxploiteerd op dezelfde locatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.5
  - number: 16.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de
      aanvraag om een vergunning moet geschieden, de gegevens en de bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag, en de wijze waarop die gegevens moeten worden verkregen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.6
  - number: 16.6.2
    text: |-
      Bij of krachtens de maatregel wordt in ieder geval bepaald dat de aanvrager een monitoringsplan, alsmede de
      in artikel 12, eerste lid, van de Verordening monitoring en rapportage emissiehandel bedoelde ondersteunende
      documenten bij de aanvraagt indient.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.6
  - number: 16.6.3
    text: |-
      Onze Minister van Economische Zaken en Klimaat kan nadere regels stellen ter uitvoering van het bepaalde krachtens
      het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.6
  - number: '16.7'
    text: Het bestuur van de emissieautoriteit beslist binnen vier maanden op de aanvraag om een vergunning.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.7
  - number: 16.8.1
    text: |-
      Het bestuur van de emissieautoriteit zendt het monitoringsplan dat is ingediend bij de aanvraag om een vergunning
      krachtens [artikel 16.5][ref1], aan het bestuursorgaan dat voor de broeikasgasinstallatie waarop de aanvraag
      betrekking heeft, bevoegd is een omgevingsvergunning te verlenen, dan wel, in geval voor de broeikasgasinstallatie
      het in [artikel 40, tweede lid, van de Mijnbouwwet][ref2] vervatte verbod geldt, Onze Minister van Economische
      Zaken en Klimaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '40'
  - number: 16.8.2
    text: |-
      Het bestuur van de emissieautoriteit stelt het betrokken andere bestuursorgaan, bedoeld in het eerste lid,
      gedurende vier weken in de gelegenheid advies uit te brengen over het monitoringsplan met het oog op de samenhang
      tussen dit plan en de betrokken omgevingsvergunning, dan wel de betrokken aanvraag om een omgevingsvergunning.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.8
  - number: '16.9'
    text: |-
      Het bestuur van de emissieautoriteit draagt er bij de beslissing op de aanvraag zorg voor dat geen strijd
      ontstaat met regels die met betrekking tot de broeikasgasinstallatie gelden, gesteld bij de Verordening
      monitoring en rapportage emissiehandel of bij of krachtens dit hoofdstuk, [hoofdstuk 8][ref1] van deze wet of
      [afdeling 2.2][ref2], [hoofdstuk 4][ref3], [afdeling 5.1][ref4] of [hoofdstuk 16 van de Omgevingswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling2.2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.1
      [ref5]: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '2.2'
      - id: ref3
        bwb_id: BWBR0037885
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0037885
        afdeling: '5.1'
      - id: ref5
        bwb_id: BWBR0037885
        hoofdstuk: '16'
  - number: '16.10'
    text: |-
      De vergunning wordt geweigerd indien het monitoringsplan niet voldoet aan de eisen die daaraan bij of krachtens
      de Verordening monitoring en rapportage emissiehandel, dit hoofdstuk of, voor zover van toepassing, artikel 24,
      derde lid, van de EG-richtlijn handel in broeikasgasemissierechten bedoelde verordening zijn gesteld dan wel indien
      door verlening anderszins strijd zou ontstaan met regels die met betrekking tot de broeikasgasinstallatie gelden,
      gesteld bij de Verordening monitoring en rapportage emissiehandel of bij of krachtens dit hoofdstuk, of indien het
      bestuur van de emissieautoriteit van oordeel is dat onvoldoende is gewaarborgd dat de aanvrager in staat is het
      monitoringsplan naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.10
  - number: 16.11.1
    text: |-
      In een vergunning wordt duidelijk aangegeven waarop zij betrekking heeft. De vergunning vermeldt de naam en het
      adres van de exploitant van de broeikasgasinstallatie, waarop de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.11
  - number: 16.11.2
    text: |-
      Het monitoringsplan maakt in ieder geval deel uit van de vergunning. De overige onderdelen van de aanvraag om de
      vergunning maken deel uit van de vergunning, voorzover dat in de vergunning is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.11
  - number: '16.12'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van de Verordening monitoring en
      rapportage emissiehandel en met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.12
  - number: 16.12.a
    text: de monitoring van emissies;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.12
  - number: 16.12.b
    text: het emissieverslag;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.12
  - number: 16.12.c
    text: |-
      andere personen dan de vergunninghouder krachtens [artikel 16.5][ref1], die bij de uitvoering van het
      monitoringsplan zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.13.1
    text: 'De vergunninghouder wijzigt het monitoringsplan zo spoedig mogelijk, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13
  - number: 16.13.1.a
    text: wijziging van de Verordening monitoring en rapportage emissiehandel daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13
  - number: 16.13.1.b
    text: |-
      de krachtens de [artikelen 16.6][ref1] of [16.12][ref2] gestelde regels daartoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.13.1.c
    text: het bestuur van de emissieautoriteit daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13
  - number: 16.13.2
    text: |-
      De vergunninghouder legt op verzoek van het bestuur van de emissieautoriteit de meest actuele versie van het
      monitoringsplan over.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13
  - number: 16.13a.1
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van deze paragraaf regels gesteld met betrekking tot het melden aan
      het bestuur van de emissieautoriteit van:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13a
  - number: 16.13a.1.a
    text: het beëindigen van de werking van een broeikasgasinstallatie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13a
  - number: 16.13a.1.b
    text: het niveau van in bedrijf zijn van een broeikasgasinstallatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13a
  - number: 16.13a.2
    text: |-
      Bij ministeriële regeling kan ter uitvoering van deze paragraaf worden bepaald dat ook andere handelingen of
      omstandigheden aan het bestuur van de emissieautoriteit moeten worden gemeld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13a
  - number: 16.13a.3
    text: |-
      Bij ministeriële regeling kunnen tevens regels worden gesteld met betrekking tot het goedkeuren van veranderingen
      van het monitoringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.13a
  - number: '16.14'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van de Verordening verificatie en
      accreditatie emissiehandel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.14
  - number: '16.15'
    text: |-
      Het bestuur van de emissieautoriteit zendt op verzoek het betrokken andere bestuursorgaan, bedoeld in
      [artikel 16.8, eerste lid][ref1], een exemplaar van het voor de betrokken broeikasgasinstallatie opgestelde
      emissieverslag en het bijbehorende verificatierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.16.1
    text: |-
      Het bestuur van de emissieautoriteit kan uiterlijk op 30 september van het kalenderjaar waarin het emissieverslag
      overeenkomstig artikel 68 van de Verordening monitoring en rapportage emissiehandel moet worden ingediend,
      vaststellen dat dit verslag niet voldoet aan de eisen die daaraan bij genoemde verordening of bij of krachtens
      dit hoofdstuk zijn gesteld. Het bestuur van de emissieautoriteit kan de beslissing voor ten hoogste drie maanden
      verdagen. Van de verdaging wordt voor het in de eerste volzin genoemde tijdstip schriftelijk mededeling gedaan aan
      degene die het emissieverslag heeft ingediend. De mededeling omvat de reden voor de verdaging.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.16
  - number: 16.16.2
    text: |-
      Het bestuur van de emissieautoriteit kan na het tijdstip, genoemd in het eerste lid, onderscheidenlijk, indien
      toepassing is gegeven aan de tweede volzin van dat lid, na het tijdstip dat met toepassing van die volzin is
      vastgesteld alsnog vaststellen dat het emissieverslag niet voldoet aan de eisen die daaraan bij de Verordening
      monitoring en rapportage emissiehandel of bij of krachtens dit hoofdstuk zijn gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.16
  - number: 16.16.2.a
    text: |-
      degene die overeenkomstig artikel 68 van de genoemde verordening bij het bestuur van de emissieautoriteit een
      emissieverslag heeft ingediend, in dat verslag onjuiste of onvolledige gegevens heeft verstrekt en verstrekking van
      juiste of volledige gegevens zou hebben geleid tot de vaststelling van een andere jaarvracht,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.16
  - number: 16.16.2.b
    text: het betrokken emissieverslag anderszins onjuist was en de betrokken persoon dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.16
  - number: 16.16.3
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt tien jaren na afloop van het kalenderjaar, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.16
  - number: '16.17'
    text: |-
      Voordat het bestuur van de emissieautoriteit toepassing geeft aan artikel 70, eerste lid, van de Verordening
      monitoring en rapportage emissiehandel, stelt het degene, die ingevolge artikel 68 van genoemde verordening het
      emissieverslag heeft ingediend of had moeten indienen, in de gelegenheid zijn zienswijze naar voren te brengen,
      tenzij de ambtshalve vaststelling plaatsvindt conform de door de exploitant van de broeikasgasinstallatie
      aangeleverde gegevens.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.17
  - number: 16.18.1
    text: |-
      Het bestuur van de emissieautoriteit geeft desgevraagd aan een ieder kosteloos inzage in en verstrekt tegen
      vergoeding van ten hoogste de kosten een exemplaar van een emissieverslag dat bij hem is ingediend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.18
  - number: 16.18.2
    text: |-
      Het bestuur van de emissieautoriteit geeft vooraf kennis van de mogelijkheid tot inzage in en van de
      verkrijgbaarheid van het emissieverslag. De kennisgeving wordt gedaan op zodanige wijze dat het daarmee beoogde
      doel zo goed mogelijk wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.18
  - number: 16.19.1
    text: |-
      Een voor een broeikasgasinstallatie verleende vergunning geldt voor een ieder die de broeikasgasinstallatie
      exploiteert. Deze draagt ervoor zorg dat het monitoringsplan wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.19
  - number: 16.19.2
    text: |-
      De vergunninghouder meldt aan het bestuur van de emissieautoriteit een verandering van exploitant van de
      broeikasgasinstallatie en een verandering van naam of adres van de vergunninghouder of, indien dit een ander is,
      van de exploitant van de broeikasgasinstallatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.19
  - number: 16.20.1
    text: |-
      Het bestuur van de emissieautoriteit kan de vergunning wijzigen of aanvullen, de daaraan verbonden voorschriften
      wijzigen, aanvullen of intrekken of voorschriften aan de vergunning verbinden, indien dit naar zijn oordeel nodig
      is in het belang van de goede werking van het systeem van handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20
  - number: 16.20.2
    text: |-
      Met betrekking tot de beslissing ter zake zijn de [artikelen 16.7][ref1], [16.8][ref2], [16.9][ref3] en
      [16.11][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.20.3
    text: |-
      In een geval als bedoeld in [artikel 16.19, tweede lid][ref1], wijzigt het bestuur van de emissieautoriteit de
      vergunning overeenkomstig de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.20a.1
    text: |-
      Op aanvraag van de vergunninghouder kan het bestuur van de emissieautoriteit de vergunning en de daaraan verbonden
      voorschriften wijzigen, aanvullen of intrekken of voorschriften aan de vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20a
  - number: 16.20a.2
    text: |-
      Met betrekking tot de beslissing ter zake, met uitzondering van het besluit tot intrekking van de
      emissievergunning, zijn de [artikelen 16.6 tot en met 16.12][ref1] van overeenkomstige toepassing. Op
      het besluit tot intrekking van de emissievergunning zijn de [artikelen 16.6][ref2], [16.7][ref3] en
      [16.9 tot en met 16.12][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.20a.3
    text: |-
      De verplichting tot het indienen van een emissieverslag als bedoeld in artikel 68, eerste lid, van de Verordening
      monitoring en rapportage emissiehandel blijft, voor wat betreft het kalenderjaar waarin de beschikking tot
      intrekking van de vergunning van kracht is geworden, na intrekking van de vergunning op de laatste houder
      daarvan rusten, totdat aan die verplichting is voldaan, tenzij in het gehele jaar van intrekking geen
      broeikasgasinstallatie aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20a
  - number: 16.20c.1
    text: 'Het bestuur van de emissieautoriteit kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20c
  - number: 16.20c.1.a
    text: |-
      met betrekking tot de broeikasgasinstallaties de omgevingsvergunning voor de milieubelastende activiteit is
      ingetrokken;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20c
  - number: 16.20c.1.b
    text: deze afdeling niet meer op de broeikasgasinstallatie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20c
  - number: 16.20c.2
    text: |-
      Met betrekking tot de beslissing ter zake is [artikel 16.20a, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.20c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.21.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot broeikasgasinstallaties waarvoor het in
      [artikel 16.5][ref1], vervatte verbod geldt en die behoren tot een bij onderscheidenlijk krachtens de maatregel
      aangewezen categorie, regels worden gesteld, die nodig zijn in het belang van de goede werking van het systeem van
      handel in emissierechten. Bij onderscheidenlijk krachtens de maatregel kan worden bepaald dat bij onderscheidenlijk
      krachtens de maatregel gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
  - number: 16.21.2
    text: |-
      Bij of krachtens de maatregel kan met betrekking tot daarbij aangegeven onderwerpen worden bepaald dat het bestuur
      van de emissieautoriteit bij het verlenen of wijzigen van de vergunning daaraan voorschriften kan verbinden.
      Bij of krachtens de maatregel kan worden bepaald dat de voorschriften van de bij onderscheidenlijk krachtens de
      maatregel gestelde regels kunnen afwijken. Bij of krachtens de maatregel kan tevens worden bepaald in welke mate
      de voorschriften van die regels kunnen afwijken en kan worden bepaald dat slechts kan worden afgeweken in daarbij
      aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.21
  - number: 16.23.1
    text: |-
      Overeenkomstig artikel 10 en, in voorkomend geval, artikel 29bis van de EG-richtlijn handel in
      broeikasgasemissierechten worden broeikasgasemissierechten die niet overeenkomstig deze paragraaf kosteloos worden
      toegewezen, geveild.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.23
  - number: 16.23.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van de Verordening inzake tijdstippen, beheer
      en andere aspecten van veiling van broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.23
  - number: 16.24.1
    text: |-
      Onverminderd [artikel 16.31][ref1] beslist het bestuur van de emissieautoriteit per handelsperiode over de
      kosteloze toewijzing van broeikasgasemissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.24.2
    text: |-
      De kosteloze toewijzing geschiedt overeenkomstig de uitvoeringsmaatregelen die de Europese Commissie op grond van
      artikel 10bis, eerste lid, van de EG-richtlijn handel in broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.24
  - number: 16.24.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter implementatie van de EG-richtlijn handel in
      broeikasgasemissierechten, nadere regels worden gesteld met betrekking tot de inhoud en de totstandkoming van het
      nationale toewijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.24
  - number: '16.25'
    text: |-
      De berekening van de aantallen broeikasgasemissierechten met het oog op kosteloze toewijzing geschiedt
      overeenkomstig de uitvoeringsmaatregelen die de Europese Commissie op grond van artikel 10bis, eerste lid, van de
      EG-richtlijn handel in broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.25
  - number: '16.26'
    text: |-
      Bij de in [artikel 16.25][ref1] bedoelde berekening wordt de in artikel 9 van de EG-richtlijn handel in
      broeikasgasemissierechten bedoelde lineaire factor toegepast, voor zover de in artikel 16.25 bedoelde
      uitvoeringsmaatregelen daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.27.1
    text: |-
      In geval een bedrijfstak of een deeltak die overeenkomstig artikel 10ter, eerste lid, van de EG-richtlijn handel
      in broeikasgasemissierechten geacht wordt te zijn blootgesteld aan een significant weglekrisico wordt voor de
      handelsperiode die aanvangt op 1 januari 2021 van de voor dat geval berekende aantallen broeikasgasemissierechten
      100% kosteloos toegewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.27
  - number: 16.27.2
    text: |-
      In afwijking van het eerste lid wordt van de aantallen broeikasgasemissierechten die voor een handelsperiode zijn
      berekend voor broeikasgasinstallaties als bedoeld in [artikel 16.2b, eerste lid][ref1], 0% kosteloos toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.1
        afdeling: 16.2.1
  - number: 16.27.3
    text: |-
      Andere bedrijfstakken en deeltakken krijgen tot 2026 kosteloze emissierechten toegewezen ten belope van 30% van
      de hoeveelheid die op grond van artikel 10bis van de EG-richtlijn handel in broeikasgasemissierechten is bepaald.
      Na 2026 worden kosteloze toewijzingen met gelijke hoeveelheden verminderd om in 2030 een hoeveelheid kosteloze
      toewijzing van 0% te bereiken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.27
  - number: 16.28.1
    text: 'Geen kosteloze toewijzing van broeikasgasemissierechten vindt plaats voor:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.1.a
    text: het opwekken van elektriciteit, tenzij de elektriciteit met restgassen wordt geproduceerd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.1.b
    text: |-
      broeikasgasinstallaties in bedrijfstakken en deeltakken voor zover deze onder andere maatregelen vallen die het
      risico op koolstoflekkage aanpakken;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.1.c
    text: de verbranding van brandstoffen in broeikasgasinstallaties voor de verbranding van stedelijk afval.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.2
    text: 'De kosteloos toegewezen rechten worden met 20 procent verminderd in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.2.a
    text: |-
      indien voor een installatie de verplichting geldt om een energie-audit uit te voeren op grond van
      [artikel 18, eerste lid, van de Wet uitvoering EU-handelingen energie-efficiëntie][ref1] en de aanbevelingen van
      het verslag van de energie-audit of van het energiebeheersysteem, bedoeld in artikel 18, vierde lid, van de Wet
      uitvoering EU-handelingen energie-efficiëntie, niet worden uitgevoerd, tenzij de terugverdientijd voor de betrokken
      investeringen meer dan drie jaar bedraagt of de kosten van die investeringen onevenredig zijn; of


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '18'
  - number: 16.28.2.b
    text: |-
      exploitanten van broeikasgasinstallaties waarvan de broeikasgasemissieniveaus hoger zijn dan 80 procent van de
      emissieniveaus voor de relevante productbenchmarks, die uiterlijk op 1 mei 2024 geen klimaatneutraliteitsplan voor
      elk van die installaties hebben opgesteld of de intermediaire streefdoelen en mijlpalen als bedoeld in het vierde
      lid, onderdeel b, niet zijn geverifieerd of verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.3
    text: |-
      De hoeveelheid kosteloos toegewezen emissierechten als bedoeld in het tweede lid, onderdeel a, wordt
      niet verminderd als een exploitant aantoont dat hij andere maatregelen heeft uitgevoerd die resulteren in
      broeikasgasemissiereducties die gelijkwaardig zijn aan de in het verslag van de energie-audit of door het
      energiebeheersysteem voor de betrokken installatie aanbevolen emissiereducties.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.4
    text: 'Het klimaatneutraliteitsplan, bedoeld in het tweede lid, onderdeel b, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.4.a
    text: |-
      maatregelen en investeringen om uiterlijk in 2050 klimaatneutraliteit te bereiken op installatie- of
      bedrijfsniveau, met uitzondering van het gebruik van koolstofcompensatiekredieten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.4.b
    text: |-
      intermediaire streefdoelen en mijlpalen om uiterlijk op 31 december 2025 en vervolgens uiterlijk op 31 december van
      elke volgende vijf jaar de vooruitgang te meten die is geboekt bij het bereiken van klimaatneutraliteit als bedoeld
      in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.4.c
    text: |-
      een raming van het effect van elk van de in onderdeel a bedoelde maatregelen en investeringen met betrekking tot de
      vermindering van de uitstoot van broeikasgassen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: 16.28.5
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt bij ministeriële regeling de hoeveelheid kosteloze
      emissierechten voor de productie van producten in Annex I van de Verordening koolstofcorrectie aan de grens
      vastgesteld overeenkomstig de percentages genoemd in artikel 10bis, lid 1a, tweede paragraaf, van de EG-richtlijn
      handel in broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.28
  - number: '16.29'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.29.a
    text: de kosteloze toewijzing van broeikasgasemissierechten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.29.b
    text: het aanleveren van gegevens met het oog op die toewijzing;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.29.c
    text: de verificatie van de aan te leveren gegevens;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.29.d
    text: de berekening van de aantal broeikasgasemissierechten met het oog op die toewijzing;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.29.e
    text: |-
      de uitvoering van gedelegeerde handelingen en uitvoeringshandelingen die de Europese Commissie op grond van artikel
      10bis, eerste en eenentwintigste lid, van de EG-richtlijn handel in broeikasgasemissierechten heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.29
  - number: 16.30.1
    text: |-
      Op de voorbereiding van het nationale toewijzingsbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.30.2
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30
  - number: 16.30.3
    text: |-
      In afwijking van [artikel 3:18 van de Algemene wet bestuursrecht][ref1] wordt het nationale toewijzingsbesluit
      uiterlijk 9 maanden na de dag waarop de aanvraag uiterlijk moet worden ingediend vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 16.30.4
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt het vastgestelde
      nationale toewijzingsbesluit bekendgemaakt in de Staatscourant. Het nationale toewijzingsbesluit wordt tevens
      toegezonden aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 16.30a.1
    text: |-
      Indien het nationale toewijzingsbesluit naar aanleiding van de beoordeling door de Europese Commissie
      overeenkomstig de artikelen 10bis, vijfde lid, 11, derde lid, 27, eerste en tweede lid, en 27 bis, van de EG-
      richtlijn handel in broeikasgasemissierechten niet behoeft te worden gewijzigd, wordt daarvan mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30a
  - number: 16.30a.2
    text: |-
      Indien het nationale toewijzingsbesluit naar aanleiding van de in het eerste lid bedoelde beoordeling, dan wel
      op basis van overige aanwijzingen of aanvullingen van de Europese Commissie, geheel of gedeeltelijk moet worden
      gewijzigd, stelt het bestuur van de emissieautoriteit het nationale toewijzingsbesluit opnieuw vast.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30a
  - number: 16.30a.3
    text: |-
      [Artikel 16.30, eerste tot en met derde lid][ref1], is niet van toepassing. Artikel 16.30, vierde lid, eerste
      volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.30a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.31.1
    text: |-
      Indien de Afdeling bestuursrechtspraak van de Raad van State met toepassing van [artikel 20.5a][ref1] een
      tussenuitspraak heeft gedaan, wijzigt het bestuur van de emissieautoriteit het nationale toewijzingsbesluit
      met inachtneming van die uitspraak. Op de voorbereiding van het besluit tot wijziging van het nationale
      toewijzingsbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.31.2
    text: |-
      Het besluit tot wijziging van het nationale toewijzingsbesluit wordt genomen binnen tien weken na de dag waarop de
      tussenuitspraak, bedoeld in [artikel 20.5a][ref1], in het openbaar is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 16.31.3
    text: |-
      Voor de toepassing van dit hoofdstuk vervangt een met toepassing van het eerste lid gewijzigd nationaal
      toewijzingsbesluit het oorspronkelijke nationale toewijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.31
  - number: 16.32.1
    text: |-
      De exploitant van de broeikasgasinstallatie, die kan worden aangemerkt als nieuwkomer als bedoeld in artikel
      3, onder h, van de EG-richtlijn handel in broeikasgasemissierechten, kan het bestuur van de emissieautoriteit
      verzoeken om kosteloze toewijzing van broeikasgasemissierechten. De toewijzing geschiedt overeenkomstig artikel
      10bis, zevende lid, en de op grond van artikel 10bis, eerste lid, door de Europese Commissie gestelde regels en,
      indien het betreft een activiteit die op grond van artikel 24 van genoemde richtlijn in het systeem van handel in
      broeikasgasemissierechten is opgenomen, overeenkomstig artikel 24, tweede lid, van genoemde richtlijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.32
  - number: 16.32.2
    text: |-
      De [artikelen 16.24, tweede lid][ref1], en [16.25 tot en met 16.29][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.32.3
    text: |-
      Een op grond van het eerste lid genomen besluit houdende kosteloze toewijzing van broeikasgasemissierechten wordt
      toegezonden aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.32
  - number: 16.32.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze waarop een verzoek als bedoeld in
      het eerste lid wordt gedaan en kunnen nadere regels worden gesteld omtrent de procedure met betrekking tot de
      behandeling van een dergelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.32
  - number: 16.33a
    text: |-
      Indien de Europese Commissie op grond van artikel 24bis van de EG-richtlijn handel in broeikasgasemissierechten
      uitvoeringsmaatregelen heeft vastgesteld, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot
      de kosteloze toewijzing en verlening van broeikasgasemissierechten voor projecten die de emissie van broeikasgassen
      verlagen maar waarop deze titel niet van toepassing is. Deze regels voldoen aan genoemde uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.33a
  - number: 16.34a
    text: |-
      Indien de Europese Commissie op grond van artikel 10ter van de EG-richtlijn handel in broeikasgasemissierechten
      de groep bedrijfstakken en deeltakken die geacht worden een koolstofweglekrisico te lopen, aanpast, en het
      bedrijfstakken of deeltakken betreft die in Nederland zijn gevestigd, wijzigt het bestuur van de emissieautoriteit
      een overeenkomstig deze afdeling genomen besluit houdende kosteloze toewijzing van broeikasgasemissierechten
      overeenkomstig de uitvoeringsmaatregelen die de Europese Commissie op grond van artikel 10ter van die
      richtlijn heeft vastgesteld. De [artikelen 16.24, tweede lid][ref1], en [16.25 tot en met 16.29][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.34b.1
    text: |-
      Een overeenkomstig deze afdeling genomen besluit houdende kosteloze toewijzing van broeikasgasemissierechten kan
      overeenkomstig de gedelegeerde handelingen en uitvoeringshandelingen die de Europese Commissie op grond van artikel
      10bis, eerste en eenentwintigste lid, van de EG-richtlijn handel in broeikasgasemissierechten heeft vastgesteld,
      worden gewijzigd of ingetrokken:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34b
  - number: 16.34b.1.a
    text: indien de werking van een broeikasgasinstallatie wordt beëindigd, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34b
  - number: 16.34b.1.b
    text: |-
      indien het niveau van in bedrijf zijn van de broeikasgasinstallatie wordt verminderd of verhoogd in de zin van
      artikel 10bis, twintigste lid, van de EG-richtlijn handel in broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34b
  - number: 16.34b.2
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34b
  - number: 16.34b.3
    text: |-
      De [artikelen 16.25 tot en met 16.29][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.34c.1
    text: |-
      Een overeenkomstig deze afdeling genomen besluit houdende kosteloze toewijzing van broeikasgasemissierechten kan
      tevens worden gewijzigd of ingetrokken, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34c
  - number: 16.34c.1.a
    text: |-
      degene die de broeikasgasinstallatie exploiteert, onjuiste of onvolledige gegevens heeft verstrekt en de
      verstrekking van juiste of volledige gegevens tot een ander besluit zou hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34c
  - number: 16.34c.1.b
    text: |-
      het besluit anderszins onjuist was en degene die de broeikasgasinstallatie exploiteert, dit wist of behoorde te
      weten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34c
  - number: 16.34c.2
    text: |-
      De [artikelen 16.25 tot en met 16.29][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.34c.3
    text: |-
      Een besluit houdende kosteloze toewijzing van broeikasgasemissierechten kan niet meer worden ingetrokken of ten
      nadele van de betrokken broeikasgasinstallatie worden gewijzigd indien acht jaren zijn verstreken sedert de dag
      waarop het besluit is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34c
  - number: 16.34d
    text: |-
      Bij intrekking of wijziging op grond van [artikel 16.34b][ref1] of [artikel 16.34c][ref2] kan worden bepaald dat de
      intrekking of wijziging terugwerkt tot en met een bij dat besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.34e
    text: |-
      Op de voorbereiding van een krachtens [artikel 16.34a][ref1], [16.34b][ref2] of [16.34c][ref3] genomen
      besluit, voor zover een dergelijk besluit strekt tot wijziging van het nationale toewijzingsbesluit, zijn
      [artikel 16.30, vierde lid][ref4], van deze wet en [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.34e
