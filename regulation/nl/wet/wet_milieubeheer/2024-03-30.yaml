        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.2
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '10'
