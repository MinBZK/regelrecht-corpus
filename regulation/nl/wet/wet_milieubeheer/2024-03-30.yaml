        hoofdstuk: '18'
  - number: 18.4.3
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden, bedoeld in de
      [artikelen 5:15 tot en met 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
