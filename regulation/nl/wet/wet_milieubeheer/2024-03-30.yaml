    text: 'Deze wet kan worden aangehaald als: Wet milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel22.2
  - number: '22.3'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel22.3
