  - number: 21.6.3
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het tweede lid wordt, nadat hij is vastgesteld, toegezonden aan
      de beide kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van
      het *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.6
  - number: 21.6.4
    text: |-
      Hetgeen ingevolge deze wet bij algemene maatregel van bestuur kan worden geregeld, wordt in afwijking daarvan
      bij ministeriële regeling geregeld, indien de regels uitsluitend strekken ter uitvoering van een voor Nederland
      verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, tenzij voor
      een juiste uitvoering wijziging van een algemene maatregel van bestuur of de wet noodzakelijk is. Indien wijziging
      van een algemene maatregel van bestuur noodzakelijk is, wordt daarvan, gelijktijdig met de voordracht aan Ons,
      gemotiveerd kennis gegeven aan de beide kamers der Staten-Generaal, onder korte vermelding van de inhoud van de
      voorgenomen algemene maatregel van bestuur. Het ontwerp van een ministeriële regeling als bedoeld in de eerste
      volzin wordt ten minste vier weken voordat de regeling wordt vastgesteld, toegezonden aan de beide kamers der
      Staten-Generaal. Op de vaststelling van een ministeriële regeling is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.6
  - number: '21.7'
    text: |-
      De bevoegdheid van gemeenteraden en waterschappen tot het maken van verordeningen blijft ten aanzien van het
      onderwerp waarin [hoofdstuk 10][ref1] voorziet, gehandhaafd, voor zover deze verordeningen niet met het bij of
      krachtens deze wet bepaalde in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: '21.8'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel21.8
  - number: 22.1.1
    text: |-
      [De hoofdstukken 8][ref1] en [17][ref2] van deze wet zijn niet van toepassing op inrichtingen waarvoor een
      vergunning is vereist krachtens [artikel 15, onder b, van de Kernenergiewet][ref3], behoudens voor zover uit de
      bepalingen van die wet anders blijkt. Die hoofdstukken en die titel zijn evenmin van toepassing op inrichtingen,
      voor zover daarvoor bij of krachtens andere dan in de eerste volzin genoemde bepalingen van die wet vergunning is
      vereist of algemene voorschriften gelden, behoudens voor zover uit de bij of krachtens die wet gestelde bepalingen
      anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk17
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel22.1
