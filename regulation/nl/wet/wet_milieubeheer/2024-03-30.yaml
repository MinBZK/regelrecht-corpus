        hoofdstuk: '15'
  - number: 15.21.1.a
    text: |-
      de [artikelen 9.2.2.1][ref1] en [9.2.2.6][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.21
