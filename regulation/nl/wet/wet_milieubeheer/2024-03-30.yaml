        afdeling: 16.2.1
  - number: 16a.2.2
    text: |-
      [Artikel 16.2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.2
    references:
