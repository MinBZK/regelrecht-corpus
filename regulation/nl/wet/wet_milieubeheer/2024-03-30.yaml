  - number: 18.16d
    text: |-
      Indien de gedraging tevens een strafbaar feit is en de ernst van de overtreding of de omstandigheden waaronder
      zij is begaan daartoe aanleiding geven, legt het bestuur van de emissieautoriteit haar aan het openbaar ministerie
      voor.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16d
  - number: 18.16e.1
    text: |-
      Een bestuurlijke boete als bedoeld in de [artikelen 18.16a, eerste lid][ref1], [18.16b, eerste lid][ref2] en
      [18.16c][ref3], bedraagt ten hoogste € 450 000 per overtreding of, indien de omzet van de betrokken onderneming
      in het boekjaar voorafgaand aan het jaar waarin de beschikking tot oplegging van de bestuurlijke boete is gegeven,
      meer dan € 4 500 000 bedraagt, ten hoogste 10% van die omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.16e
