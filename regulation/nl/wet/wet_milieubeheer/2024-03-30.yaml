  - number: 18.16s.4
    text: |-
      Het bestuur van de emissieautoriteit kan, indien een inboeker drie of meer overtredingen van de
      [artikelen 9.7.4.1 tot en met 9.7.4.5][ref1], [9.7.4.8][ref2], [9.7.4.10][ref3], [9.7.4.12][ref4],
