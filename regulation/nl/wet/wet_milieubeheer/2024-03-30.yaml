  - number: 9.7.1.2.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën leveranciers tot eindverbruik worden aangewezen
      waarop de in deze titel opgenomen bepalingen met betrekking tot de leverancier tot eindverbruik niet van toepassing
      zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.1.2
  - number: 9.7.1.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen leveringen van soorten biobrandstoffen en hernieuwbare
      brandstoffen aan luchtvaart en zeevaart van de toepassing van [paragraaf 9.7.4][ref1] worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.1.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de invoer en het gebruik van informatie door inboekers en
      andere marktdeelnemers in de Uniedatabank als bedoeld in artikel 28, tweede lid, van de richtlijn hernieuwbare
      energie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.1.3
  - number: 9.7.1.4
    text: |-
      Onze minister en de rijksbelastingdienst verstrekken op verzoek het bestuur van de emissieautoriteit de bij
      ministeriële regeling vast te stellen gegevens, voor zover die gegevens voor de uitvoering van deze titel
      noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.1.4
  - number: 9.7.2.1.1
    text: |-
      De leverancier tot eindverbruik is in enig kalenderjaar het aantal per soort hernieuwbare brandstofeenheden
      verschuldigd dat overeenkomt met het bij algemene maatregel van bestuur vast te stellen gedeelte van de energie-
      inhoud van zijn levering tot eindverbruik in het direct aan dat kalenderjaar voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.1
  - number: 9.7.2.1.2
    text: |-
      Bij algemene maatregel van bestuur worden voor de toepassing van het eerste lid eisen gesteld aan het aantal per
      soort hernieuwbare brandstofeenheden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.1
  - number: 9.7.2.2
    text: De leverancier tot eindverbruik heeft een rekening met jaarverplichtingfaciliteit in het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.2
  - number: 9.7.2.3.1
    text: |-
      De leverancier tot eindverbruik voert voor 1 maart van enig kalenderjaar zijn levering tot eindverbruik van het
      direct aan die datum voorafgaande kalenderjaar op zijn rekening met jaarverplichtingfaciliteit in het register in.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.3
  - number: 9.7.2.3.2
    text: |-
      Wijzigingen in de voor enig kalenderjaar op zijn rekening ingevoerde levering tot eindverbruik na de datum, bedoeld
      in het eerste lid, meldt de leverancier tot eindverbruik aan het bestuur van de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.3
  - number: 9.7.2.3.3
    text: Bij ministeriële regeling worden de bij het invoeren op de rekening te vermelden gegevens bepaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.3
  - number: 9.7.2.3.4
    text: |-
      De gegevens, bedoeld in het derde lid, en de onderliggende stukken, worden door de leverancier tot eindverbruik
      bewaard tot ten minste vijf jaar na afloop van het kalenderjaar waarop die gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.3
  - number: 9.7.2.4.1
    text: |-
      Indien een leverancier tot eindverbruik in enig kalenderjaar zijn levering tot eindverbruik niet voor 1 maart van
      het daarop volgende kalenderjaar heeft ingevoerd op zijn rekening met jaarverplichtingfaciliteit, kan het bestuur
      van de emissieautoriteit haar ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.4
  - number: 9.7.2.4.2
    text: |-
      Indien een leverancier tot eindverbruik in enig kalenderjaar zijn levering tot eindverbruik niet juist heeft
      ingevoerd op zijn rekening met jaarverplichtingfaciliteit, kan het bestuur van de emissieautoriteit haar tot vijf
      jaar na dat kalenderjaar ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.4
  - number: 9.7.2.4.3
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.4
  - number: 9.7.2.5.1
    text: 'Op 1 mei van enig kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
  - number: 9.7.2.5.1.a
    text: |-
      heeft de leverancier tot eindverbruik ten minste het aantal per soort hernieuwbare brandstofeenheden op zijn
      rekening, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
  - number: 9.7.2.5.1.b
    text: |-
      schrijft het bestuur van de emissieautoriteit van de rekening van de leverancier tot eindverbruik het aantal per
      soort hernieuwbare brandstofeenheden af,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
  - number: 9.7.2.5.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de afschrijving van het aantal per soort
      hernieuwbare brandstofeenheden, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
  - number: 9.7.2.5.3
    text: |-
      Indien toepassing van [artikel 9.7.2.4, tweede lid][ref1], leidt tot een verhoging van de jaarverplichting voor
      het betrokken kalenderjaar, schrijft het bestuur van de emissieautoriteit met inachtneming van het tweede lid
      het aantal per soort hernieuwbare brandstofeenheden dat overeenkomt met die verhoging af van de rekening van de
      leverancier tot eindverbruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.2
  - number: 9.7.2.5.4
    text: |-
      Indien toepassing van [artikel 9.7.2.4, tweede lid][ref1], leidt tot een verlaging van de jaarverplichting
      voor het betrokken kalenderjaar, schrijft het bestuur van de emissieautoriteit, met inachtneming van het
      tweede lid, het aantal per soort hernieuwbare brandstofeenheden dat overeenkomt met die verlaging bij op de
      rekening van de leverancier tot eindverbruik. Het bestuur van de emissieautoriteit houdt hierbij rekening met
      [artikel 9.7.5.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.7.2.5.5
    text: |-
      Indien het aantal per soort hernieuwbare brandstofeenheden op de rekening van de leverancier tot eindverbruik
      als gevolg van de toepassing van het eerste of derde lid minder is dan nul, vult hij het tekort binnen drie
      kalendermaanden aan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.2.5
  - number: 9.7.3.1.1
    text: 'Het register heeft vier soorten hernieuwbare brandstofeenheden:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.1.1.a
    text: een hernieuwbare brandstofeenheid conventioneel;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.1.1.b
    text: een hernieuwbare brandstofeenheid geavanceerd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.1.1.c
    text: een hernieuwbare brandstofeenheid bijlage IX-B;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.1.1.d
    text: een hernieuwbare brandstofeenheid overig.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.1.2
    text: |-
      Een hernieuwbare brandstofeenheid vertegenwoordigt een bijdrage aan de jaarverplichting van één gigajoule
      hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.1
  - number: 9.7.3.2
    text: |-
      Een hernieuwbare brandstofeenheid kan uitsluitend in het register, bedoeld in [paragraaf 9.7.5][ref1] en
      [9.8.4][ref2], gehouden worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '9'
        paragraaf: 9.7.5
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '9'
        paragraaf: 9.8.4
  - number: 9.7.3.3
    text: |-
      Een hernieuwbare brandstofeenheid is vatbaar voor overdracht indien de overdragende partij en de ontvangende partij
      ieder op hun naam een rekening hebben in het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.3
  - number: 9.7.3.4.1
    text: |-
      Overdracht van een of meer hernieuwbare brandstofeenheden kan niet leiden tot een aantal hernieuwbare
      brandstofeenheden conventioneel, geavanceerd, bijlage IX-B of overig op een rekening dat minder is dan nul.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.4
  - number: 9.7.3.4.2
    text: |-
      Overdracht van een of meer hernieuwbare brandstofeenheden is niet toegestaan, indien het aantal of soort
      hernieuwbare brandstofeenheden conventioneel, geavanceerd, bijlage IX-B of overig op een rekening minder is dan
      nul.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.4
  - number: 9.7.3.5.1
    text: 'De voor overdracht van een hernieuwbare brandstofeenheid vereiste levering geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.5
  - number: 9.7.3.5.1.a
    text: |-
      afschrijving van de hernieuwbare brandstofeenheid van de rekening die in het register op naam staat van de partij
      die de hernieuwbare brandstofeenheid overdraagt, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.5
  - number: 9.7.3.5.1.b
    text: |-
      bijschrijving op de rekening die in het register op naam staat van de partij die de hernieuwbare brandstofeenheid
      verkrijgt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.5
  - number: 9.7.3.5.2
    text: Het eerste lid is van overeenkomstige toepassing op elke overgang anders dan overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.5
  - number: 9.7.3.5.3
    text: |-
      Elke overgang anders dan overdracht werkt tegenover derden eerst nadat de overgang in het register is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.5
  - number: 9.7.3.6.1
    text: |-
      Nietigheid of vernietiging van de overeenkomst die tot de overdracht heeft geleid, of onbevoegdheid van degene die
      overdraagt, heeft, nadat de overdracht is voltooid, geen gevolgen voor de geldigheid van de overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.6
  - number: 9.7.3.6.2
    text: Elk voorbehoud met betrekking tot de overdracht is uitgewerkt op het moment dat de overdracht tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.6
  - number: 9.7.3.7.1
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op een hernieuwbare brandstofeenheid
      geen recht van pand worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.7
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: 9.7.3.7.2
    text: Op een hernieuwbare brandstofeenheid kan geen recht van vruchtgebruik worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.7
  - number: 9.7.3.7.3
    text: Een hernieuwbare brandstofeenheid is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.7
  - number: 9.7.3.8
    text: |-
      Indien het aantal hernieuwbare brandstofeenheden op een rekening minder is dan nul, worden de bijgeschreven
      hernieuwbare brandstofeenheden per soort volgens bij algemene maatregel van bestuur vast te stellen regels
      afgeschreven.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.3.8
  - number: 9.7.4.1.1
    text: |-
      Een inboeker kan tot 1 maart van enig kalenderjaar inboeken in het register de in het direct aan die datum
      voorafgaande kalenderjaar door hem aan:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
  - number: 9.7.4.1.1.a
    text: |-
      de Nederlandse markt geleverde vloeibare biobrandstof die voldoet aan [artikel 9.7.4.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.1.1.b
    text: |-
      vervoer in Nederland geleverde gasvormige biobrandstof die voldoet aan [artikel 9.7.4.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.1.1.c
    text: |-
      de Nederlandse markt voor vervoer geleverde vloeibare hernieuwbare brandstof die voldoet aan
      [artikel 9.7.4.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.1.1.d
    text: |-
      vervoer in Nederland geleverde gasvormige hernieuwbare brandstof die voldoet aan [artikel 9.7.4.4][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.1.1.e
    text: |-
      vervoer in Nederland geleverde elektriciteit, met uitzondering van elektriciteit geleverd aan spoorvoertuigen, die
      voldoet aan bij of krachtens algemene maatregel van bestuur gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
  - number: 9.7.4.1.2
    text: |-
      De inboeker kan aan een inboeking tot 1 april een verklaring van een verificateur als bedoeld in
      [artikel 9.7.4.8, tweede lid][ref1], koppelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inboeker, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.1
  - number: 9.7.4.2
    text: 'De in te boeken vloeibare biobrandstof:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.2
  - number: 9.7.4.2.a
    text: |-
      voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde duurzaamheids- en
      broeikasgasemissiereductiecriteria;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.2
  - number: 9.7.4.2.b
    text: |-
      bevond zich direct voorafgaand aan de levering aan de Nederlandse markt op een locatie van de inboeker die door
      het door hem gehanteerde duurzaamheidsysteem is gecertificeerd, dan wel op een andere locatie voor zover die
      certificering zich over die locatie uitstrekt,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.2
  - number: 9.7.4.2.c
    text: voldoet aan bij of krachtens algemene maatregel van bestuur gestelde eisen, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.2
  - number: 9.7.4.2.d
    text: |-
      wordt niet geproduceerd uit olie uit sojabonen, met uitzondering van olie uit sojabonen met een gecertificeerd laag
      risico op indirecte veranderingen in landgebruik als bedoeld in [verordening (EU) 2019/807](32707R2019).
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.2
  - number: 9.7.4.3
    text: 'De in te boeken gasvormige biobrandstof voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.3
  - number: 9.7.4.3.a
    text: de bij of krachtens algemene maatregel van bestuur gestelde duurzaamheids- en broeikasgasemissiereductiecriteria;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.3
  - number: 9.7.4.3.b
    text: de overige eisen, gesteld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.3
  - number: 9.7.4.4.1
    text: 'De in te boeken vloeibare of gasvormige hernieuwbare brandstof voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.4
  - number: 9.7.4.4.1.a
    text: de bij of krachtens algemene maatregel van bestuur gestelde broeikasgasemissiereductiedrempels;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.4
  - number: 9.7.4.4.1.b
    text: de overige eisen, gesteld bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.4
  - number: 9.7.4.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen soorten hernieuwbare brandstof worden aangewezen waarvan,
      onder bij of krachtens die maatregel te stellen voorwaarden, de energie-inhoud wordt vermenigvuldigd met een bij
      ministeriële regeling vastgestelde factor.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.4
  - number: 9.7.4.5.1
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
  - number: 9.7.4.5.1.a
    text: worden regels gesteld over de bepaling van de ingeboekte hoeveelheid hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
  - number: 9.7.4.5.1.b
    text: |-
      wordt bepaald op welke wijze de inboeker aantoont dat is voldaan aan de [artikelen 9.7.4.2][ref1], [9.7.4.3][ref2]
      en [9.7.4.4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.5.1.c
    text: worden de bij het inboeken te vermelden gegevens bepaald;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
  - number: 9.7.4.5.1.d
    text: kunnen regels worden gesteld voor het geaggregeerd inboeken van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
  - number: 9.7.4.5.2
    text: |-
      De gegevens, bedoeld in het eerste lid, onderdeel c, worden door de inboeker bewaard gedurende ten minste vijf jaar
      na het kalenderjaar waarin de inboeking plaatsvond.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.5
  - number: 9.7.4.6.1
    text: |-
      Het bestuur van de emissieautoriteit schrijft voor één gigajoule hernieuwbare energie die is ingeboekt in het
      register:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.a
    text: |-
      één hernieuwbare brandstofeenheid conventioneel bij op de rekening van de inboeker, indien de geleverde
      biobrandstof is geproduceerd uit:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.a.1°
    text: |-
      voedsel- en voedergewassen, met een laag risico of gecertificeerd laag risico op indirecte veranderingen in
      landgebruik als bedoeld in [verordening (EU) 2019/807](32707R2019); of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.a.2°
    text: |-
      een bijproduct van de productie of verwerking van voedsel- en voedergewassen, niet zijnde de grondstoffen, bedoeld
      in bijlage IX van de richtlijn hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.b
    text: |-
      één hernieuwbare brandstofeenheid geavanceerd bij op de rekening van de inboeker, indien de geleverde biobrandstof
      is geproduceerd uit:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.b.1°
    text: grondstoffen als bedoeld in bijlage IX, deel A, van de richtlijn hernieuwbare energie; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.b.2°
    text: |-
      indien de geleverde biobrandstof is geproduceerd uit de grondstof als bedoeld in bijlage IX, deel A, onderdeel d,
      van de richtlijn hernieuwbare energie, de grondstof voorkomt op een bij ministeriële regeling vast te stellen lijst
      van materialen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.c
    text: |-
      één hernieuwbare brandstofeenheid bijlage IX-B bij op de rekening van de inboeker, indien de geleverde biobrandstof
      is geproduceerd uit grondstoffen als bedoeld in bijlage IX, deel B, van de richtlijn hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d
    text: 'één hernieuwbare brandstofeenheid overig bij op de rekening van de inboeker:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d.1°
    text: |-
      indien de geleverde biobrandstof is geproduceerd uit zetmeelrijke gewassen of suiker- en oliegewassen die als
      tussenteelt op landbouwgrond worden geteeld en die niet leiden tot de vraag naar meer land;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d.2°
    text: |-
      indien de geleverde biobrandstof is geproduceerd uit een residu van de productie of verwerking van voedsel- en
      voedergewassen, niet zijnde de grondstoffen, bedoeld in bijlage IX van de richtlijn hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d.3°
    text: bij een geleverde vloeibare of gasvormige hernieuwbare brandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d.4°
    text: voor het gedeelte van de geleverde elektriciteit afkomstig uit hernieuwbare bronnen, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.1.d.5°
    text: |-
      indien de geleverde biobrandstof is geproduceerd uit grondstoffen, niet zijnde de grondstoffen, bedoeld in de
      onderdelen a b, c en d, onder 1.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.2
    text: |-
      De hoeveelheid ingeboekte hernieuwbare energie wordt per soort hernieuwbare brandstofeenheid naar beneden afgerond
      op één gigajoule.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.3
    text: |-
      In afwijking van het eerste lid schrijft het bestuur van de emissieautoriteit een aantal hernieuwbare
      brandstofeenheden bij ter grootte van een bij ministeriële regeling vastgesteld gedeelte van de energie-
      inhoud, vermenigvuldigd met een bij die ministeriële regeling vastgestelde factor, van de hoeveelheid ingeboekte
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.4
    text: |-
      In afwijking van het eerste lid kan het bestuur van de emissieautoriteit een aantal hernieuwbare brandstofeenheden
      bijschrijven ter grootte van de energie-inhoud, vermenigvuldigd met een bij ministeriële regeling vastgestelde
      factor groter dan één, voor aan luchtvaart en zeevaart geleverde brandstoffen, met uitzondering van uit voedsel- en
      voedergewassen geproduceerde brandstoffen, of een factor kleiner dan één, voor aan zeevaart geleverde brandstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.5
    text: |-
      In afwijking van het eerste lid schrijft het bestuur van de emissieautoriteit voor een door een importeur
      ingeboekte hoeveelheid hernieuwbare energie hernieuwbare brandstofeenheden bij op de rekening van die importeur,
      nadat die importeur volgens bij ministeriële regeling gestelde regels heeft aangetoond dat die hoeveelheid aan de
      Nederlandse markt is geleverd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.6.6
    text: |-
      In aanvulling op het eerste lid en gelet op [artikel 9.7.4.8, eerste lid][ref1], schrijft het bestuur van de
      emissieautoriteit op de rekening van de inboeker het resterende aantal hernieuwbare brandstofeenheden bij, na
      koppeling van een verklaring als bedoeld in [artikel 9.7.4.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.6.7
    text: |-
      Een geleverde biobrandstof die geproduceerd is uit zetmeelrijke gewassen of suiker- en oliegewassen wordt geacht
      niet als tussenteelt op landbouwgrond te zijn geteeld en te hebben geleid tot de vraag naar meer land, tenzij de
      inboeker het tegendeel aantoont.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.6
  - number: 9.7.4.7.1
    text: |-
      Het bestuur van de emissieautoriteit maakt ieder jaar op bij ministeriële regeling te bepalen momenten een
      overzicht van het aantal per soort beschikbare hernieuwbare brandstofeenheden openbaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.7
  - number: 9.7.4.7.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het openbaar maken, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.7
  - number: 9.7.4.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen soorten biobrandstof worden aangewezen waarvan, onder bij
      of krachtens die maatregel te stellen voorwaarden, de energie-inhoud wordt vermenigvuldigd met een bij ministeriële
      regeling vastgestelde factor.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.8
  - number: 9.7.4.8.2
    text: |-
      De inboeker die een hoeveelheid biobrandstof als bedoeld in het eerste lid inboekt, beschikt over een verklaring
      van een verificateur dat die biobrandstof voldoet aan de voorwaarden, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.8
  - number: 9.7.4.8.3
    text: De verificateur geeft geen verklaring af indien niet is voldaan aan de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.8
  - number: 9.7.4.8.4
    text: |-
      De verificateur bewaart alle gegevens en documentatie met betrekking tot de verificatie gedurende ten minste vijf
      jaar na afloop van het kalenderjaar waarop de verificatie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.8
  - number: 9.7.4.8.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere eisen worden gesteld aan de verificateur en de
      verificatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.8
  - number: 9.7.4.9
    text: |-
      Voor hernieuwbare energie die tussen 1 januari en 1 mei van enig kalenderjaar wordt geleverd en ingeboekt
      in het register, schrijft het bestuur van de emissieautoriteit na 1 mei van dat kalenderjaar de hernieuwbare
      brandstofeenheden bij op de rekening van de inboeker.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.9
  - number: 9.7.4.10
    text: |-
      Een hoeveelheid hernieuwbare energie die wordt ingeboekt in het register is niet als duurzaam overgedragen en wordt
      niet nog een keer ingeboekt in het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.10
  - number: 9.7.4.11.1
    text: |-
      Het bestuur van de emissieautoriteit kan het bijschrijven van hernieuwbare brandstofeenheden opschorten of weigeren
      indien het misbruik of fraude vermoedt dan wel andere redenen heeft om aan te nemen dat niet wordt voldaan aan de
      bij of krachtens deze paragraaf gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.11
  - number: 9.7.4.11.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het opschorten of
      weigeren, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.11
  - number: 9.7.4.12.1
    text: |-
      De inboeker overlegt voor 1 mei van het kalenderjaar volgend op het kalenderjaar waarin hij de
      hernieuwbare energie heeft geleverd aan het bestuur van de emissieautoriteit een verklaring van een
      verificateur waaruit blijkt dat, voor zover van toepassing, is voldaan aan de bij of krachtens de
      [artikelen 9.7.4.1 tot en met 9.7.4.5, eerste lid][ref1], [9.7.4.8, tweede lid][ref2], en [9.7.4.10][ref3] gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.12.2
    text: De verificateur geeft geen verklaring af indien niet is voldaan aan de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.12
  - number: 9.7.4.12.3
    text: |-
      De verificateur bewaart alle gegevens en documentatie met betrekking tot de verificatie gedurende ten minste vijf
      jaar na afloop van het kalenderjaar waarop de verificatie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.12
  - number: 9.7.4.12.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere eisen worden gesteld aan de verificateur en de
      verificatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.12
  - number: 9.7.4.13.1
    text: |-
      Indien naar het oordeel van het bestuur van de emissieautoriteit niet is voldaan aan de bij of krachtens deze
      paragraaf gestelde eisen voor het inboeken in het register van een hoeveelheid hernieuwbare energie of de
      verificatie, bedoeld in [artikel 9.7.4.12][ref1], kan het bestuur die hoeveelheid, de kenmerken van die hoeveelheid
      of de factor, bedoeld in [artikel 9.7.4.8][ref2], tot vijf jaar na het kalenderjaar van inboeken ambtshalve
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.4
  - number: 9.7.4.13.2
    text: |-
      Indien uit de vaststelling, bedoeld in het eerste lid, volgt dat de inboeker te veel hernieuwbare brandstofeenheden
      heeft ontvangen voor de geleverde hoeveelheid hernieuwbare energie, wordt het aantal per soort hernieuwbare
      brandstofeenheden dat die inboeker te veel heeft ontvangen, afgeschreven van de rekening van die inboeker.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.13
  - number: 9.7.4.13.3
    text: |-
      Indien uit de vaststelling, bedoeld in het eerste lid, volgt dat de inboeker te weinig hernieuwbare
      brandstofeenheden heeft ontvangen voor de geleverde hoeveelheid hernieuwbare energie, wordt het aantal per soort
      hernieuwbare brandstofeenheden dat die inboeker te weinig heeft ontvangen, bijgeschreven op de rekening van die
      inboeker. Het bestuur van de emissieautoriteit houdt hierbij rekening met [artikel 9.7.5.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.7.4.13.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de toepassing van het eerste, tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.13
  - number: 9.7.4.13.5
    text: |-
      Indien het aantal per soort hernieuwbare brandstofeenheden op de rekening van de inboeker als gevolg van de
      toepassing van tweede lid minder is dan nul, vult hij het tekort aan binnen drie kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.13
  - number: 9.7.4.14.1
    text: |-
      De emissieautoriteit maakt ieder jaar een overzicht openbaar, waarin per inboeker van biobrandstof de aard
      en herkomst van de door die inboeker ingeboekte biobrandstoffen alsmede het door die inboeker gehanteerde
      duurzaamheidssysteem zijn opgenomen. [Artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.14
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 9.7.4.14.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud en de wijze van openbaarmaking
      van het overzicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.4.14
  - number: 9.7.5.1.1
    text: Er is een elektronisch register hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.1
  - number: 9.7.5.1.2
    text: Het register wordt beheerd door de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.1
  - number: 9.7.5.1.3
    text: |-
      Het register bestaat uit de rekeningen, bedoeld in [artikel 9.7.5.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.7.5.2.1
    text: |-
      Bij ministeriële regeling worden regels gesteld over de werking, organisatie, beschikbaarheid en beveiliging van
      het register.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.2
  - number: 9.7.5.2.2
    text: Het bestuur van de emissieautoriteit kan voorwaarden voor het gebruik van het register vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.2
  - number: 9.7.5.3.1
    text: |-
      Het bestuur van de emissieautoriteit opent op verzoek van de leverancier tot eindverbruik op diens naam een
      rekening met jaarverplichtingfaciliteit en met overboekfaciliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.3.2
    text: |-
      Het bestuur van de emissieautoriteit opent op verzoek van een inboeker op diens naam een rekening met
      inboekfaciliteit en met overboekfaciliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.3.3
    text: |-
      Het bestuur van de emissieautoriteit opent op verzoek van een andere onderneming dan die bedoeld in het eerste of
      tweede lid, die behoort tot een bij algemene maatregel van bestuur aangewezen categorie, op diens naam een rekening
      met overboekfaciliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.3.4
    text: |-
      Het bestuur van de emissieautoriteit opent op naam van een onderneming niet meer dan één rekening. Een rekening kan
      alle in het eerste en tweede lid genoemde faciliteiten omvatten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.3.5
    text: Het bestuur van de emissieautoriteit opent een afboekrekening.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.3.6
    text: Bij ministeriële regeling worden regels gesteld over het openen, bijhouden en beheer van de rekeningen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.3
  - number: 9.7.5.4.1
    text: |-
      Het bestuur van de emissieautoriteit kan indien het redenen heeft om aan te nemen dat er sprake is van fraude
      of misbruik of dat niet wordt voldaan aan de bij of krachtens deze titel gestelde eisen voor het hebben van een
      rekening in het register of voor het gebruik van die rekening:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.1.a
    text: weigeren een rekening te openen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.1.b
    text: een rekening of een faciliteit van die rekening blokkeren;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.1.c
    text: een rekening opheffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.2
    text: Het bestuur van de emissieautoriteit kan op verzoek van de rekeninghouder een rekening opheffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van het eerste lid en kunnen
      regels worden gesteld over de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.4.4
    text: De hernieuwbare brandstofeenheden op een opgeheven rekening vervallen van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.4
  - number: 9.7.5.5.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor het openen en bijhouden van een rekening met
      overboekfaciliteit, inboekfaciliteit of jaarverplichtingfaciliteit een vergoeding verschuldigd is overeenkomstig de
      bij die regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.5
  - number: 9.7.5.5.2
    text: 'Bij de regeling, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.5
  - number: 9.7.5.5.2.a
    text: |-
      wordt de hoogte van de vergoeding vastgesteld, welke niet hoger is dan noodzakelijk is ter dekking van de ten
      laste van de emissieautoriteit komende kosten van het verrichten van werkzaamheden waarvoor de vergoeding is
      verschuldigd, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.5
  - number: 9.7.5.5.2.b
    text: worden regels gesteld omtrent de wijze waarop de vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.5
  - number: 9.7.5.6.1
    text: |-
      Van het aantal per soort hernieuwbare brandstofeenheden op 1 mei van enig kalenderjaar op de rekening
      van een leverancier tot eindverbruik nadat het bestuur van de emissieautoriteit toepassing heeft gegeven
      aan [artikel 9.7.2.5, eerste lid, onderdeel b][ref1], een inboeker of een onderneming als bedoeld in
      [artikel 9.7.5.3. derde lid][ref2], wordt een gedeelte gespaard ten behoeve van het direct daaropvolgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.7.5.6.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het gedeelte, bedoeld in het eerste lid, en de
      volgorde waarin de soort hernieuwbare brandstofeenheden gespaard worden. Voor de leverancier tot eindverbruik,
      de inboeker of de onderneming, bedoeld in [artikel 9.7.5.3, derde lid][ref1], kunnen verschillende regels worden
      vastgesteld omtrent het gedeelte, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.7.5
  - number: 9.7.5.6.3
    text: |-
      In afwijking van het eerste lid kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld
      over het gedeelte dat gespaard kan worden ten behoeve van enig ander kalenderjaar dan het direct daaropvolgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.6
  - number: 9.7.5.6.4
    text: De hernieuwbare brandstofeenheden die niet worden gespaard, vervallen van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.5.6
  - number: 9.7.6.1.1
    text: 'De producent van biobrandstoffen bepaalt en controleert:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.1.a
    text: de aard en hoeveelheid van de door hem ontvangen duurzame grondstof voor de vervaardiging van de biobrandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.1.b
    text: |-
      de juiste verhouding tussen de aard en hoeveelheid gebruikte duurzame grondstof en de soort en hoeveelheid door hem
      vervaardigde duurzame biobrandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.1.c
    text: de hoeveelheid per afnemer van de door hem geleverde duurzame biobrandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.2
    text: 'De producent van hernieuwbare brandstof controleert:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.2.a
    text: |-
      de aard en hoeveelheid van de door hem gebruikte energie uit hernieuwbare bronnen, niet zijnde biomassa, voor de
      vervaardiging van de hernieuwbare brandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.2.b
    text: |-
      de juiste verhouding tussen de aard en hoeveelheid gebruikte energie uit hernieuwbare bronnen, niet zijnde
      biomassa, en tot de soort en hoeveelheid door hem vervaardigde hernieuwbare brandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.2.c
    text: de hoeveelheid per afnemer van de door hem geleverde hernieuwbare brandstof;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.1.3
    text: Bij ministeriële regeling worden nadere regels gesteld over het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.1
  - number: 9.7.6.2.1
    text: |-
      Een onderneming die gecertificeerd is volgens een duurzaamheidssysteem voert een massabalans over duurzame
      grondstof en duurzame biobrandstof.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.2
  - number: 9.7.6.2.2
    text: Bij ministeriële regeling worden nadere regels gesteld over de massabalans.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.2
  - number: 9.7.6.3.1
    text: |-
      Het bestuur van de emissieautoriteit houdt toezicht op een certificeringsorgaan dat namens het duurzaamheidsysteem
      in het kader van de naleving van duurzaamheids- of broeikasgasemissiereductiecriteria voor grondstoffen voor
      biobrandstof en biobrandstof onafhankelijke audits uitvoert.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.3
  - number: 9.7.6.3.2
    text: |-
      Het bestuur van de emissieautoriteit brengt bij vastgestelde non-conformiteit met de duurzaamheids- en
      broeikasgasemissiereductiecriteria onverwijld het duurzaamheidsysteem hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.7.6.3
  - number: 9.8.1.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder: - *benzine:* ongelode lichte olie als
      bedoeld in [artikel 26, tweede lid, van de Wet op de accijns][ref1] en andere minerale oliën die op grond van
      [artikel 28, met uitzondering van het tweede en zesde lid, van die wet][ref2] voor het tarief van ongelode lichte
      olie aan de accijns onderworpen zijn;
        - *betere fossiele brandstof:* brandstof van fossiele herkomst die: 1°. is genoemd in bijlage I, deel 2, onderdeel
      5, van [richtlijn (EU) 2015/652](32015L0652); 2°. een broeikasgasintensiteit heeft die lager is dan het voor
      dat kalenderjaar vastgestelde reductiepercentage ten opzichte van de in bijlage II van [richtlijn (EU) 2015/652]
      (32015L0652) bedoelde uitgangsnorm voor brandstoffen;
        - *broeikasgasintensiteit:* broeikasgasemissie gedurende de levenscyclus per eenheid energie uitgedrukt in gCO-eq/
      MJ, als bedoeld in bijlage I, deel 1, onderdeel 3, onder e, van [richtlijn (EU) 2015/652](32015L0652);
        - *diesel:* gasolie als bedoeld in [artikel 26, vierde lid, van de Wet op de accijns][ref3] en andere minerale
      oliën die op grond van [artikel 28, met uitzondering van het tweede lid, van die wet][ref4] voor het tarief van
      gasolie aan de accijns onderworpen zijn;
        - *hernieuwbare brandstofeenheid:* hernieuwbare brandstofeenheid als bedoeld in
      [artikel 9.7.3.1, eerste lid][ref5];
        - *importeur:* onderneming die minerale oliën invoert in Nederland, maar geen houder is van een vergunning voor een
      accijnsgoederenplaats als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref6] voor minerale oliën,
      of geregistreerde geadresseerde als bedoeld in artikel 1a, eerste lid, van die wet voor minerale oliën;
        - *minerale oliën:* oliën als bedoeld in [artikel 25 van de Wet op de accijns][ref7];
        - *onderneming:* onderneming als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref8];
        - *overboekfaciliteit:* eigenschap van een rekening in het register die de overboeking van een hernieuwbare
      brandstofeenheid mogelijk maakt;
        - *rapportageplichtige:* houder van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, van de Wet op de accijns][ref9] voor minerale oliën, of geregistreerde geadresseerde
      als bedoeld in artikel 1a, eerste lid, van die wet voor minerale oliën, of importeur, met een uitslag tot
      vervoersverbruik;
        - *reductiepercentage:* het percentage ten opzichte van de uitgangsnorm voor brandstoffen, bedoeld in bijlage II
      van [richtlijn (EU) 2015/652](32015L0652), dat ingevolge [artikel 9.8.2.1, eerste lid][ref10], bij of krachtens
      algemene maatregel van bestuur voor een kalenderjaar vastgesteld is;
        - *reductieverplichting:* verplichting als bedoeld in [artikel 9.8.2.1, eerste lid][ref11];
        - *reductieverplichtingfaciliteit:* eigenschap van een rekening in het register die een rapportageplichtige
      ingevolge [artikel 9.8.2.2][ref12] heeft om aan zijn reductieverplichting te voldoen;
        - *register:* register rapportage- en reductieverplichting vervoersemissies als bedoeld in
      [artikel 9.8.4.1][ref13];
        - *richtlijn 98/70/EG:* [richtlijn nr. 98/70/EG](31998L0070) van het Europees Parlement en de Raad van de
      Europese Unie van 13 oktober 1998 betreffende de kwaliteit van benzine en van dieselbrandstof en tot wijziging van
      [Richtlijn 93/12/EEG](31993L0012) van de Raad (PbEG L 350);
        - *richtlijn (EU) 2015/652:* richtlijn (EU) 2015/652 van de Raad van 20 april 2015 tot vaststelling van
      berekeningsmethoden en rapportageverplichtingen overeenkomstig [Richtlijn 98/70/EG](31998L0070) van het Europees
      Parlement en de Raad betreffende de kwaliteit van benzine en van dieselbrandstof (PbEU L 107);
        - *uitslag tot vervoersverbruik:* uitslag tot verbruik als bedoeld in [artikel 2 van de Wet op de accijns][ref14],
      van benzine, diesel en betere fossiele brandstof, aan de bestemmingen, bedoeld in [artikel 9.8.1.2][ref15].


