  - number: 16.39af.1
    text: |-
      De gereglementeerde entiteit brengt vanaf 1 januari 2028 tot en met 2030 jaarlijks voor 1 mei verslag uit over het
      gemiddelde aandeel van de kosten in verband met de inlevering van emissierechten die zij het voorgaande jaar aan
      eindverbruikers heeft doorberekend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39af
  - number: 16.39af.2
    text: |-
      Indien artikel 30 duodecies van de EG-richtlijn handel in broeikasgasemissierechten van toepassing is brengt de
      gereglementeerde entiteit het in het eerste lid bedoelde verslag vanaf 1 januari 2029 uit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39af
  - number: 16.39af.3
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop het verslag moet worden
      ingediend en de gegevens die door de gereglementeerde entiteit moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39af
  - number: 16.39ag
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten behoeve van het betrouwbaar en nauwkeurig identificeren
      en documenteren van de precieze volumes van de tot verbruik uitgeslagen brandstoffen, mede ter voorkoming van
      dubbeltelling van emissies.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ag
  - number: 16.39ah.1
    text: |-
      Broeikasgasemissierechten worden overeenkomstig artikel 30 quinquies van de EG-richtlijn handel in
      broeikasgasemissierechten geveild.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ah
  - number: 16.39ah.2
    text: |-
      [Artikel 16.23, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ah
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.3
        afdeling: 16.2.1
  - number: 16.39ai.1
    text: |-
      Broeikasgasemissierechten worden overeenkomstig de Verordening EU-register handel in emissierechten verleend aan de
      gereglementeerde entiteit.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ai
  - number: 16.39ai.2
    text: |-
      Verlening van broeikasgasemissierechten vindt slechts plaats, indien aan de betreffende gereglementeerde entiteit
      een vergunning als bedoeld in [artikel 16.39z][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ai
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2a.2
        afdeling: 16.2.2A
  - number: 16.39ai.3
    text: |-
      [Artikel 16.36][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ai
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.4
        afdeling: 16.2.1
  - number: 16.39aj.1
    text: |-
      Met ingang van 1 januari 2028 levert de gereglementeerde entiteit voor 1 juni een hoeveelheid emissierechten
      in dat gelijk is aan de totale emissies van de gereglementeerde entiteit, die overeenstemmen met de hoeveelheid
      brandstoffen die zij in het voorgaande kalenderjaar tot verbruik heeft uitgeslagen, voor zover het de
      gereglementeerde activiteit betreft die bij algemene maatregel van bestuur is aanwezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aj
  - number: 16.39aj.2
    text: |-
      Ter bepaling van de hoeveelheid van de emissie, bedoeld in het eerste lid, worden de gegevens in acht genomen,
      die overeenkomstig de Verordening EU-register handel in emissierechten in het EU-register voor de handel in
      emissierechten zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aj
  - number: 16.39aj.3
    text: |-
      Indien artikel 30 duodecies van de EG-richtlijn handel in broeikasgasemissierechten van toepassing is, levert de
      gereglementeerde entiteit, in afwijking van het eerste lid, emissierechten in met ingang van 1 januari 2029.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aj
  - number: 16.39aj.4
    text: |-
      Indien de gereglementeerde entiteit met betrekking tot een kalenderjaar minder emissierechten heeft ingeleverd
      dan noodzakelijk op grond van het eerste lid, wordt het aantal emissierechten dat hij in het daaropvolgende
      kalenderjaar dient in te leveren van rechtswege verhoogd met het aantal emissierechten dat hij te weinig had
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39aj
  - number: 16.39ak
    text: |-
      [Artikel 16.21, eerste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat voor
      «broeikasgasinstallaties» wordt gelezen «gereglementeerde entiteiten» en voor «[artikel 16.5][ref2]» wordt gelezen
      «[16.39z][ref3]».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39ak
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.1.2
        afdeling: 16.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.2a.2
        afdeling: 16.2.2A
  - number: 16.40.1
    text: |-
      Een broeikasgasemissierecht dat overeenkomstig de Verordening EU-register handel in emissierechten is verleend,
      is vatbaar voor overdracht indien alle bij de overdracht betrokken personen op hun naam een rekening hebben
      in het EU-register voor de handel in emissierechten. De eerste volzin is van overeenkomstige toepassing op
      broeikasgasemissierechten die overeenkomstig de Verordening EU-register handel in emissierechten in een andere
      lidstaat van de Europese Unie zijn verleend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.40
  - number: 16.40.2
    text: |-
      Bij algemene maatregel van bestuur kunnen broeikasgasemissierechten die zijn ontstaan in andere landen dan de
      lidstaten van de Europese Unie worden aangewezen als broeikasgasemissierechten die kunnen worden overgedragen of
      verkregen door een persoon op wiens naam in het EU-register voor de handel in emissierechten een rekening staat.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.40
  - number: 16.40.3
    text: |-
      Een broeikasgasemissierecht is ook vatbaar voor andere overgang. Het eerste en tweede lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.40
  - number: 16.41.1
    text: 'De voor overdracht van een broeikasgasemissierecht vereiste levering geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.41
  - number: 16.41.1.a
    text: |-
      afschrijving van het broeikasgasemissierecht van de rekening die in het EU-register voor de handel in
      emissierechten op naam staat van de persoon die het broeikasgasemissierecht overdraagt, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.41
  - number: 16.41.1.b
    text: |-
      bijschrijving op een rekening in een register als bedoeld onder a, die op naam staat van de persoon die het
      broeikasgasemissierecht verkrijgt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.41
  - number: 16.41.2
    text: Het eerste lid is van overeenkomstige toepassing op elke overgang anders dan overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.41
  - number: 16.41.3
    text: |-
      Elke overgang anders dan overdracht werkt tegenover derden eerst nadat het bestuur van de emissieautoriteit de
      overgang heeft geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.41
  - number: 16.42.1
    text: |-
      Nietigheid of vernietiging van de overeenkomst die tot de overdracht heeft geleid, of onbevoegdheid van degene die
      overdraagt, heeft, nadat de overdracht is voltooid, geen gevolgen voor de geldigheid van de overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42
  - number: 16.42.2
    text: Elk voorbehoud met betrekking tot de overdracht is uitgewerkt op het moment dat de overdracht tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42
  - number: 16.42.3
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op een broeikasgasemissierecht geen
      recht van pand worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: 16.42.4
    text: Op een broeikasgasemissierecht kan geen recht van vruchtgebruik worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42
  - number: 16.42.5
    text: Een broeikasgasemissierecht is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42
  - number: 16.42a.1
    text: |-
      De [artikelen 16.40, eerste en vierde lid][ref1], [16.41][ref2] en [16.42][ref3] zijn van overeenkomstige
      toepassing op de overgang van emissiereductie-eenheden, gecertificeerde emissiereducties, toegewezen eenheden en
      verwijderingseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.3
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.3
  - number: 16.42a.2
    text: |-
      Voorzover het betreft de overgang van emissiereductie-eenheden, gecertificeerde emissiereducties, toegewezen
      eenheden en verwijderingseenheden, wordt voor de toepassing van de [artikelen 16.40, eerste lid][ref1], en
      [16.41, eerste lid][ref2], onder «een register dat door de betrokken lidstaat van de Europese Unie overeenkomstig
      de Verordening EU-register handel in emissierechten is ingesteld» mede verstaan: een register dat overeenkomstig
      artikel 7, vierde lid, van het Protocol van Kyoto en de overeenkomstig dat protocol genomen besluiten is ingesteld
      door een in bijlage I bij het Raamverdrag van de Verenigde Naties inzake klimaatverandering opgenomen Partij die
      het Protocol van Kyoto heeft bekrachtigd, zoals gespecificeerd in artikel 1, punt 7, van dat protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.42a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.3
  - number: 16.43.1
    text: |-
      Het bestuur van de emissieautoriteit wordt aangewezen als bevoegde autoriteit als bedoeld in de Verordening EU-
      register handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.43
  - number: 16.43.2
    text: |-
      Het bestuur van de emissieautoriteit voert de taken die het heeft als bevoegde autoriteit voor het EU-register
      voor de handel in emissierechten uit in overeenstemming met de Verordening EU-register handel in emissierechten
      en draagt er zorg voor dat het register voldoet aan de vereisten die daaraan ingevolge de Verordening EU-register
      handel in emissierechten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.43
  - number: 16.43.3
    text: |-
      Als nationale administrateur als bedoeld in artikel 3, onder 2, van de Verordening EU-register handel in
      emissierechten wordt aangewezen een bij besluit van het bestuur van de emissieautoriteit aangewezen medewerker van
      de emissieautoriteit. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.43
  - number: 16.43.4
    text: |-
      Onze Minister van Economische Zaken en Klimaat wordt aangewezen als betrokken instantie en desbetreffende instantie
      als bedoeld in de Verordening EU-register handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.43
  - number: 16.43.5
    text: |-
      In het EU-register voor de handel in emissierechten kunnen naast broeikasgasemissierechten tevens emissiereductie-
      eenheden, gecertificeerde emissiereducties, toegewezen eenheden en verwijderingseenheden worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.43
  - number: 16.44.1
    text: |-
      Een ieder kan broeikasgasemissierechten, emissiereductie-eenheden, gecertificeerde emissiereducties, toegewezen
      eenheden en verwijderingseenheden bezitten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.44
  - number: 16.44.2
    text: 'In afwijking van het eerste lid is niet toegestaan het bezit van:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.44
  - number: 16.44.2.a
    text: |-
      lange-termijn gecertificeerde emissiereducties als bedoeld in artikel 3, onder 9, van de Verordening EU-register
      handel in emissierechten (lCER);
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.44
  - number: 16.44.2.b
    text: |-
      voorlopige gecertificeerde emissiereducties als bedoeld in artikel 3, onder 11, van de Verordening EU-register
      handel in emissierechten (tCER).
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.44
  - number: '16.45'
    text: |-
      Onze Minister van Economische Zaken en Klimaat kan regels stellen ter uitvoering van de Verordening EU-register
      handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.45
  - number: '16.46'
    text: |-
      Emissiereductie-eenheden, gecertificeerde emissiereducties en verwijderingseenheden die aan het einde van de
      aanvullende periode voor het voldoen aan verplichtingen, bedoeld in het overeenkomstig het Protocol van Kyoto
      genomen besluit 13/CMP.1, op een rekening in het register voor handel in emissierechten zijn geregistreerd, worden
      geannuleerd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46
  - number: 16.46a
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder projectdeelnemer:
      persoon die een verzoek om instemming als bedoeld in [artikel 16.46b, derde lid][ref1] indient.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.5
  - number: 16.46b.1
    text: 'Dit artikel is van toepassing op projectactiviteiten in het kader van:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.1.a
    text: |-
      het mechanisme van gemeenschappelijke uitvoering, bedoeld in artikel 6 van het Protocol van Kyoto (JI), die buiten
      Nederland of buiten de Nederlandse exclusieve economische zone worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.1.b
    text: het mechanisme voor schone ontwikkeling, bedoeld in artikel 12 van het Protocol van Kyoto (CDM).
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.2
    text: |-
      Onze Minister van Economische Zaken en Klimaat kan op verzoek van de projectdeelnemer instemming verlenen
      met deelname aan projectactiviteiten als bedoeld in het eerste lid en de met betrekking tot die activiteiten
      overeenkomstig het Protocol van Kyoto genomen besluiten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.3
    text: 'De instemming wordt in ieder geval geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.3.a
    text: |-
      de deelname door de projectdeelnemer aan de projectactiviteit niet voldoet aan de eisen die in het Protocol van
      Kyoto en de overeenkomstig dat protocol genomen besluiten aan die deelname zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.3.b
    text: |-
      de projectdeelnemer zijn hoofdvestiging niet heeft in een staat die de internationale overeenkomst, bedoeld in
      artikel 11ter, eerste lid, van de EG-richtlijn handel in broeikasgasemissierechten, heeft bekrachtigd, of in een
      staat of een subfederale of regionale entiteit die overeenkomstig artikel 25 van genoemde richtlijn aan het systeem
      van handel in broeikasgasemissierechten is gekoppeld, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.3.c
    text: |-
      voor zover het gaat om projectactiviteiten voor het opwekken van elektriciteit door waterkracht met een
      opwekkingsvermogen van meer dan 20 MW: bij de projectactiviteit en de uitvoering daarvan de in artikel 11ter,
      zesde lid, van de EG-richtlijn handel in broeikasgasemissierechten bedoelde internationale normen en richtsnoeren,
      waaronder de richtlijnen van de Wereldcommissie Stuwdammen, niet in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.4
    text: 'Instemming kan worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.4.a
    text: |-
      van een andere projectactiviteit waarbij de projectdeelnemer is of was betrokken en waarvoor Onze Minister van
      Economische Zaken en Klimaat instemming heeft verleend, is gebleken dat niet is voldaan aan de eisen die in het
      derde lid met betrekking tot die uitvoering zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.4.b
    text: niet wordt voldaan aan de regels, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.5
    text: |-
      Bij regeling van Onze Minister van Economische Zaken en Klimaat kunnen nadere regels worden gesteld met betrekking
      tot de instemming, bedoeld in het tweede lid, met deelname aan projectactiviteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.6
    text: |-
      Een verleende instemming omvat mede de machtiging van de betrokken projectdeelnemer, voorzover een dergelijke
      machtiging op grond van de artikelen 6, derde lid, en 12, negende lid, van het Protocol van Kyoto en de
      overeenkomstig dat protocol genomen besluiten is vereist. Indien de eerste volzin van toepassing is, wordt in de
      beslissing op het verzoek aangegeven dat de instemming mede de machtiging omvat.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.7
    text: |-
      Een verleende instemming kan worden ingetrokken, indien niet meer wordt voldaan aan de eisen, gesteld in het derde
      lid, onder a of b, of, voor zover van toepassing, onder c, of de nadere regels, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.8
    text: |-
      Bij regeling van Onze Minister van Economische Zaken en Klimaat kan worden bepaald dat voor het verlenen van
      instemming een vergoeding is verschuldigd. In dat geval worden bij die regeling tevens nadere regels gesteld met
      betrekking tot de hoogte van de vergoeding en de wijze waarop deze moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
  - number: 16.46b.9
    text: |-
      Onze Minister van Economische Zaken en Klimaat stelt bij hem berustende informatie over
      projectactiviteiten waarvoor hij instemming heeft verleend, voor het publiek beschikbaar.
      [Artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.46b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 16a.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *elektriciteitsemissieverslag:*
      verslag betreffende de emissies in een kalenderjaar als gevolg van elektriciteitsopwekking; -
      *elektriciteitsmonitoringsplan:* plan betreffende de bepaling en registratie van de emissies als gevolg van
      elektriciteitsopwekking; - *elektriciteitsjaarvracht:* het aantal ton kooldioxide-equivalent dat in de lucht
      is veroorzaakt als gevolg van het opwekken van elektriciteit in de betreffende broeikasgasinstallatie in
      het betreffende kalenderjaar, waarbij een gedeelte van een ton rekenkundig wordt afgerond op een hele ton; -
      *noodstroomaggregaat:t* echnische eenheid die uitsluitend wordt gebruikt om elektriciteit op te wekken indien
      de gebruikelijke primaire elektriciteitsvoorziening uitvalt en niet meer dan 50 uren per jaar in werking
      is; - *Restgassen:* afgas als bedoeld in artikel 2, elfde lid, van de Verordening kosteloze toewijzing van
      emissierechten; - *warmtekrachtkoppeling:* gelijktijdige opwekking in een proces van thermische energie en
      elektrische of mechanische energie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.1
  - number: 16a.1.2
    text: |-
      [Artikel 16.1, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16a.1
    references:
