  - number: 18.1a.1.a
    text: deze wet;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
  - number: 18.1a.1.b
    text: de EG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
  - number: 18.1a.1.c
    text: de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
  - number: 18.1a.1.d
    text: de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
  - number: 18.1a.1.e
    text: de EG-verordening EU-milieukeur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
  - number: 18.1a.2
    text: |-
      In afwijking van het eerste lid is [artikel 18.4 van de Omgevingswet][ref1] niet van toepassing voor zover het
      betreft de handhaving van het bij of krachtens [hoofdstuk 16][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 18.1a.3
    text: |-
      Tot de bevoegdheid tot oplegging van een last onder bestuursdwang krachtens [artikel 18.3][ref1] of
      [18.4 van de Omgevingswet][ref2] behoort het in Nederland door of vanwege het bevoegde bestuursorgaan beheren van
      afvalstoffen in gevallen waarin die afvalstoffen in strijd met het bij of krachtens de EG-verordening overbrenging
      van afvalstoffen of [titel 10.7][ref3] bepaalde, binnen of buiten Nederlands grondgebied worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.1a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: '18.2'
    text: |-
      Het bevoegd gezag waarbij op grond van [artikel 18.2 van de Omgevingswet][ref1] de bestuursrechtelijke
      handhavingstaak berust, heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de voorschriften
      die voor degene die de activiteit verricht, gelden op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 18.2.1°
    text: het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2
  - number: 18.2.2°
    text: de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2
  - number: 18.2.3°
    text: de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2
  - number: 18.2a.1
    text: |-
      Voor zover [artikel 18.2 van de Omgevingswet][ref1] niet van toepassing is, hebben Onze betrokken Minister,
      gedeputeerde staten, burgemeester en wethouders en het dagelijks bestuur van het waterschap tot taak zorg te dragen
      voor de bestuursrechtelijke handhaving van [artikel 10.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2a.2
    text: |-
      Gedeputeerde staten, burgemeester en wethouders en het dagelijks bestuur van het waterschap hebben tot taak zorg
      te dragen voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens [de artikelen 10.2][ref1] en
      [10.54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2a.3
    text: |-
      Onze betrokken Minister heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het bepaalde bij
      of krachtens de [artikelen 11a.2][ref1] en [11a.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 11a
        hoofdstuk: 11a
      - id: ref2
        bwb_id: BWBR0003245
        artikel: 11a
        hoofdstuk: 11a
  - number: 18.2b.1
    text: |-
      Onze Minister heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het bepaalde bij of
      krachtens:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
  - number: 18.2b.1.a
    text: |-
      de [titels 9.2 tot en met 9.5][ref1] en de [artikelen 17.19][ref2] en [18.21, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.2b.1.b
    text: de EG-verordening registratie, evaluatie en autorisatie van chemische stoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
  - number: 18.2b.1.c
    text: de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
  - number: 18.2b.1.d
    text: de EG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
  - number: 18.2b.1.e
    text: de EG-verordening EU-milieukeur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
  - number: 18.2b.2
    text: |-
      Onverminderd het eerste lid hebben Onze Ministers van Economische Zaken, van Sociale Zaken en Werkgelegenheid
      en van Volksgezondheid, Welzijn en Sport tot taak zorg te dragen voor de bestuursrechtelijke handhaving van het
      bepaalde bij of krachtens de [titels 9.2][ref1], [9.3][ref2] en [9.3a][ref3], de EG-verordening registratie,
      evaluatie en autorisatie van chemische stoffen en de EG-verordening indeling, etikettering en verpakking van
      stoffen en mengsels voor zover het bepaalde bij of krachtens genoemde titels of verordeningen betrekking heeft op
      beleid dat tot hun verantwoordelijkheid behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '9'
  - number: 18.2b.3
    text: |-
      In afwijking van het eerste lid kan bij een maatregel als bedoeld in [artikel 9.2.2.1, eerste lid][ref1], worden
      bepaald dat gedeputeerde staten of burgemeester en wethouders in plaats van Onze Minister of Onze betrokken
      Minister tot taak hebben zorg te dragen voor de bestuursrechtelijke handhaving van bij de maatregel gestelde regels
      of van daaromtrent gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 18.2b.4
    text: |-
      Onze Minister heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij of krachtens
      [hoofdstuk 10][ref1] gestelde verplichtingen, voor zover zij betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2b.4.a
    text: |-
      overbrengen van afvalstoffen als bedoeld in [titel 10.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2b.4.b
    text: |-
      het inzamelen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in [artikel 10.45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 18.2b.4.c
    text: |-
      verhandelen, bemiddelen of vervoeren als bedoeld in [artikel 10.55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2c.1
    text: |-
      Gedeputeerde staten hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij of
      krachtens [hoofdstuk 10][ref1] gestelde verplichtingen, voorzover zij betrekking hebben op het aanwezig hebben
      van een begeleidingsbrief bij het vervoer van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in
      [artikel 10.44][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.2
  - number: 18.2c.2
    text: |-
      Gedeputeerde staten hebben tevens tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de krachtens
      [artikel 17.4][ref1] opgelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 18.2d.1
    text: |-
      Voor zover [artikel 18.1, aanhef en onder a, van de Omgevingswet][ref1] niet van toepassing is, hebben burgemeester
      en wethouders tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de verplichtingen, gesteld bij
      of krachtens:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 18.2d.1.a
    text: |-
      de afvalstoffenverordening of het omgevingsplan voor zover het verplichtingen krachtens de
      [artikelen 10.24 tot en met 10.28][ref1] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2d.1.b
    text: |-
      [artikel 10.29][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2d.2
    text: |-
      Burgemeester en wethouders hebben tevens tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij
      of krachtens [hoofdstuk 10][ref1] gestelde verplichtingen, voor zover zij betrekking hebben op het zich ontdoen van
      bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in [artikel 10.37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 18.2f.1
    text: |-
      De emissieautoriteit draagt zorg voor de handhaving van de bij of krachtens [hoofdstukken 16][ref1], [16a][ref2],
      [16b][ref3] en [16c][ref4] gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16a
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16b
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16c
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: 16a
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: 16b
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: 16c
  - number: 18.2f.2
    text: |-
      Onverminderd [artikel 18.2b, eerste lid][ref1], draagt de emissieautoriteit zorg voor de bestuursrechtelijke
      handhaving van het bepaalde bij of krachtens [artikel 9.2.2.6a][ref2] en [titels 9.7][ref3] en [9.8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
