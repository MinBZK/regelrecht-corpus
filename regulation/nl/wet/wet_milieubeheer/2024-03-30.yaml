    text: |-
      [artikel 9.5.2, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 15.21.1.c
    text: |-
      de [artikelen 6 tot en met 11 van de Wet bodembescherming][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel15.21
