  - number: '2.26'
    text: Er is een Commissie genetische modificatie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.26
  - number: 2.27.1
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.27
  - number: 2.27.1.a
    text: |-
      Onze Minister te adviseren over kennisgevingen en aanvragen om vergunning met betrekking tot het vervaardigen van
      of handelen met genetisch gemodificeerde organismen en over veiligheidsmaatregelen die in het kader daarvan moeten
      worden getroffen ter bescherming van mens en milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.27
  - number: 2.27.1.b
    text: |-
      het bestuursorgaan dat belast is met het toezicht op het vervaardigen van of handelen met genetisch gemodificeerde
      organismen, te adviseren met betrekking tot dat toezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.27
  - number: 2.27.2
    text: |-
      Op verzoek van Onze Minister of Onze Minister wie het aangaat, of uit eigen beweging informeert de commissie Onze
      betrokken Minister indien aan het vervaardigen van of aan handelingen met genetisch gemodificeerde organismen
      ethische of maatschappelijke aspecten zijn verbonden die naar het oordeel van de commissie van belang zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.27
  - number: '2.28'
    text: |-
      Onze Minister en Onze Ministers wie het mede aangaat, dragen er zorg voor dat de commissie op de hoogte wordt
      gehouden ten aanzien van het beleid op het terrein van het vervaardigen van of van handelingen met genetisch
      gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.28
  - number: '2.29'
    text: |-
      Telkens binnen een termijn van vier jaren brengt de commissie een rapport uit aan Onze Minister, waarin ten minste
      de taak, de samenstelling, de inrichting en werkwijze van de commissie aan een onderzoek worden onderworpen en
      voorstellen kunnen worden gedaan voor gewenste veranderingen. Onze Minister zendt dit rapport, voorzien van zijn
      standpunt, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.29
  - number: 2.30.1
    text: De commissie bestaat uit een voorzitter en ten minste vijftien en ten hoogste twintig andere leden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.30
  - number: 2.30.2
    text: |-
      De voorzitter en de andere leden van de commissie worden benoemd op grond van hun deskundigheid op het gebied van
      het vervaardigen van of van handelingen met genetisch gemodificeerde organismen en de mogelijke gevolgen daarvan
      voor mens en milieu, daarbij inbegrepen de ecologische gevolgen en de daarbij te nemen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.30
  - number: 2.31.1
    text: |-
      De voorzitter van de commissie wordt door Onze Minister benoemd. Onze Minister hoort de commissie alvorens hij de
      voorzitter benoemt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.31
  - number: 2.31.2
    text: Onze Minister benoemt de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.31
  - number: 2.31.3
    text: De voorzitter en de leden worden voor de tijd van vier jaren benoemd. Zij zijn terstond weer benoembaar.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.31
  - number: 2.31.4
    text: |-
      De voorzitter en de leden kunnen te allen tijde hun functie neerleggen door een schriftelijke kennisgeving aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.31
  - number: 2.31.5
    text: |-
      Onze Minister kan in bijzondere gevallen de voorzitter en de andere leden in hun functie schorsen en uit hun
      functie ontslaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.31
  - number: 2.32.1
    text: De commissie wijst uit haar midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.32
  - number: 2.32.2
    text: |-
      De plaatsvervangend voorzitter kan te allen tijde zijn functie neerleggen door een schriftelijke kennisgeving aan
      de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.32
  - number: 2.32.3
    text: |-
      In bijzondere gevallen kan de commissie de plaatsvervangend voorzitter in zijn functie schorsen en uit zijn functie
      ontslaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.32
  - number: 2.33.1
    text: De commissie wordt bijgestaan door een secretaris. Aan de secretaris kan een adjunct-secretaris worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.33
  - number: 2.33.2
    text: |-
      De secretaris en de adjunct-secretaris worden door Onze Minister benoemd, in hun functie geschorst en uit hun
      functie ontslagen, de commissie gehoord.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.33
  - number: 2.33.3
    text: De secretaris is geen lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.33
  - number: 2.33.4
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.33
  - number: 2.33.5
    text: Onze Minister kan voorzien in een bureau voor de commissie, dat onder leiding staat van de secretaris.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.33
  - number: 2.34.1
    text: De commissie kan voor bepaalde onderwerpen subcommissies instellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.34
  - number: 2.34.2
    text: De voorzitter van een subcommissie wordt door de commissie uit haar midden benoemd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.34
  - number: 2.35.1
    text: |-
      De commissie en haar subcommissies kunnen zich bij hun werkzaamheden doen bijstaan door personen die geen lid zijn
      van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.35
  - number: 2.35.2
    text: |-
      Onze Minister en Onze Ministers van Sociale Zaken en Werkgelegenheid, van Volksgezondheid, Welzijn en Sport en van
      Landbouw, Natuur en Voedselkwaliteit kunnen, ieder voor hun ministerie, ambtenaren aanwijzen, die bevoegd zijn tot
      het bijwonen van de door de commissie en haar subcommissies te houden vergaderingen, met dien verstande dat in de
      vergaderingen van de commissie voor ieder van die ministeries ten hoogste één ambtenaar aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.35
  - number: 2.36.1
    text: |-
      De vergaderingen van de commissie zijn openbaar. De commissie stelt bij haar in [artikel 2.40][ref1] bedoelde
      besluit regels betreffende de openbaarheid van de vergaderingen van de subcommissies.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.36.2
    text: |-
      Een vergadering of een gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 5.1, eerste lid, van de Wet open overheid][ref1] en in gevallen waarin het belang van openbaarheid niet
      opweegt tegen de in [artikel 5.1, tweede lid, van die wet][ref2] genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 2.37.1
    text: De adviezen van de commissie worden uitgebracht overeenkomstig het gevoelen van de meerderheid van de vergadering.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.37
  - number: 2.37.2
    text: Ter vergadering ingebrachte minderheidsstandpunten worden in of bij de adviezen vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.37
  - number: '2.38'
    text: |-
      De commissie houdt de op de door haar uitgebrachte adviezen betrekking hebbende voorbereidende stukken ter
      beschikking van Onze Minister en van de bestuursorganen, bedoeld in [artikel 2.27, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.39.1
    text: |-
      De voorzitter van de commissie pleegt ten minste eenmaal per jaar overleg met Onze Minister over de door de
      commissie voorgenomen werkzaamheden voor de komende twaalf maanden. De commissie stelt vervolgens het programma van
      haar werkzaamheden vast en zendt dit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.39
  - number: 2.39.2
    text: |-
      Ten behoeve van de voorbereiding van het in het eerste lid bedoelde overleg stelt de commissie een overzicht van
      de door haar voorgenomen werkzaamheden op en legt dit tijdig aan Onze Minister voor. De commissie voegt bij het
      overzicht een raming van de met de uitvoering van de werkzaamheden gepaard gaande kosten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.39
  - number: 2.39.3
    text: |-
      De commissie oefent haar werkzaamheden uit binnen het raam van de middelen welke haar jaarlijks ingevolge de
      begrotingswet ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.39
  - number: '2.40'
    text: |-
      De commissie stelt nadere regels betreffende haar werkwijze en de werkwijze van haar subcommissies en zendt deze
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.40
  - number: 2.51.1
    text: Onze Minister wijst een instantie aan als bedoeld in artikel 4, eerste lid, van de EG-verordening EU-milieukeur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.51
  - number: 2.51.2
    text: Aan de aanwijzing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.51
  - number: 2.52.1
    text: |-
      Onze Minister kan subsidie verstrekken aan de instantie voor de taken die voortvloeien uit de EG-verordening EU-
      milieukeur.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.52
  - number: 2.52.2
    text: |-
      Op deze subsidieverstrekking is [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '2.53'
    text: |-
      De instantie, bedoeld in [artikel 2.51, eerste lid][ref1], voert haar taken uit overeenkomstig het door haar
      vastgestelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.54.1
    text: |-
      Het is verboden in strijd te handelen met de volgende bepalingen van EG-verordening EU-milieukeur: de artikelen 9,
      tweede, zesde, negende en dertiende lid, en 10, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.54
  - number: 2.54.2
    text: 'Het is verboden in strijd te handelen met de volgende bepaling van de EU-verordening markttoezicht: artikel 7.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel2.54
  - number: 8.40.1
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over milieubelastende activiteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.40
  - number: 8.40.2
    text: |-
      De [artikelen 4.4][ref1], [4.5][ref2] en [4.7 van de Omgevingswet][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.40
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 8.40.3
    text: |-
      [Artikel 4.9 van de Omgevingswet][ref1] is van overeenkomstige toepassing, tenzij bij de maatregel anders is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.40
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 8.42a
    text: |-
      Het bevoegd gezag kan voorschriften aan een omgevingsvergunning voor een inrichting verbinden die afwijken van de
      regels, gesteld bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 8.40][ref1], indien
      dat bij of krachtens die maatregel is bepaald. Bij of krachtens de maatregel kan worden bepaald in welke mate
      de voorschriften kunnen afwijken en kan worden bepaald dat slechts kan worden afgeweken in daarbij aangegeven
      categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.42a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.42b.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur als bedoeld in [artikel 8.40][ref1] kan met betrekking tot daarbij
      aangegeven onderwerpen worden bepaald dat bij provinciale of gemeentelijke verordening gestelde regels omtrent
      die onderwerpen van de bij of krachtens de maatregel gestelde regels kunnen afwijken, in welke mate kan worden
      afgeweken en kan worden bepaald dat slechts kan worden afgeweken in daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.42b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.42b.2
    text: |-
      Op het stellen van provinciale of gemeentelijke regels als bedoeld in het eerste lid, is
      [artikel 8.40, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.42b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.43.1
    text: |-
      Bij het in ontvangst nemen van afvalstoffen wordt een bedrag in rekening gebracht als van anderen afkomstige
      afvalstoffen worden gestort, waarbij in ieder geval rekening wordt gehouden met de kosten van:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.43
  - number: 8.43.1.a
    text: de inrichting en exploitatie van het terrein waar de afvalstoffen worden gestort,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.43
  - number: 8.43.1.b
    text: |-
      de voorzieningen die bewerkstelligen dat na buitengebruikstelling van het terrein, geen nadelige gevolgen voor het
      milieu worden veroorzaakt, daaronder mede begrepen de kosten van de krachtens [artikel 15.44, eerste lid][ref1],
      verschuldigde heffing, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 8.43.1.c
    text: |-
      financiële zekerheid in categorieën van gevallen waarvoor het stellen van financiële zekerheid krachtens
      [artikel 13.5 van de Omgevingswet][ref1] is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '13'
  - number: 8.43.2
    text: Onze Minister kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.43
  - number: 8.47.1
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.1.a
    text: |-
      stortplaats: terrein waar afvalstoffen worden gestort, dan wel het gedeelte van een terrein, waar afvalstoffen
      worden gestort, indien op het terrein niet uitsluitend afvalstoffen worden gestort, met uitzondering van
      afvalvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.1.b
    text: 'gesloten stortplaats: stortplaats ten aanzien waarvan de in het derde lid bedoelde verklaring is afgegeven;'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.1.c
    text: |-
      bedrijfsgebonden stortplaats: stortplaats waar uitsluitend afvalstoffen worden gestort, die afkomstig zijn van tot
      de onderneming waartoe de stortplaats behoort, behorende installaties die onderling technische, organisatorische of
      functionele bindingen hebben en in elkaars onmiddellijke nabijheid zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.2
    text: |-
      Onder stortplaats wordt mede verstaan een gesloten stortplaats. Tot de stortplaats wordt mede gerekend het gedeelte
      van de stortplaats waar het storten van afvalstoffen is beëindigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.3
    text: 'Het bevoegd gezag verklaart een stortplaats voor gesloten, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.3.a
    text: het storten van afvalstoffen is beëindigd,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.3.b
    text: voor zover een daartoe strekkend voorschrift voor de inrichting geldt, een bovenafdichting is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
  - number: 8.47.3.c
    text: |-
      een eindinspectie door het bevoegd gezag is uitgevoerd waaruit is gebleken dat aan alle voorschriften,
      verbonden aan de omgevingsvergunningen voor de stortplaats, is voldaan en dat ook geen andere
      maatregelen ingevolge de [Wet bodembescherming][ref1], zoals die wet luidde tot het tijdstip waarop de
      [Aanvullingswet bodem Omgevingswet][ref2] in werking is getreden getroffen dienen te worden door degene die de
      stortplaats drijft, in geval van verontreiniging of aantasting van de bodem onder de stortplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
      [ref2]: https://wetten.overheid.nl/BWBR0043277
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47
    references:
      - id: ref1
        bwb_id: BWBR0003994
      - id: ref2
        bwb_id: BWBR0043277
  - number: 8.47a
    text: |-
      Het bevoegd gezag stelt Onze Minister zo spoedig mogelijk op de hoogte van een verklaring als bedoeld in
      [artikel 8.47, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.47a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.48.1
    text: |-
      Deze paragraaf is van toepassing op stortplaatsen waarvoor met betrekking tot het verrichten van een
      milieubelastende activiteit een omgevingsvergunning is vereist, waar op of na 1 september 1996 afvalstoffen worden
      gestort, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.48
  - number: 8.48.1.a
    text: |-
      waarvoor met betrekking tot het verrichten van een milieubelastende activiteit een algemene maatregel van bestuur
      geldt als bedoeld in [artikel 5.34, tweede lid, van de Omgevingswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 8.48.1.b
    text: uitsluitend baggerspecie wordt gestort.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.48
  - number: 8.48.2
    text: |-
      Deze paragraaf is, met uitzondering van het eerste lid van dit artikel, van overeenkomstige toepassing op
      winningsafvalvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.48
  - number: 8.48.3
    text: |-
      Het tweede lid is niet van toepassing op bij algemene maatregel van bestuur aangewezen categorieën van
      winningsafvalvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.48
  - number: 8.49.1
    text: |-
      Met betrekking tot een gesloten stortplaats worden zodanige maatregelen getroffen dat wordt gewaarborgd dat die
      stortplaats geen nadelige gevolgen voor het milieu veroorzaakt, dan wel, voor zover dat redelijkerwijs niet kan
      worden gevergd, de grootst mogelijke bescherming wordt geboden tegen die nadelige gevolgen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.2
    text: 'Tot de maatregelen, bedoeld in het eerste lid, worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.2.a
    text: |-
      maatregelen strekkende tot het in stand houden en onderhouden, alsmede het herstellen, verbeteren of vervangen van
      voorzieningen ter bescherming van de bodem;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.2.b
    text: het regelmatig inspecteren van voorzieningen ter bescherming van de bodem, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.2.c
    text: het regelmatig onderzoeken van de bodem onder de stortplaats.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.3
    text: |-
      Degene die een stortplaats drijft, stelt een nazorgplan op ter uitvoering van de maatregelen, bedoeld in het eerste
      en tweede lid. Het nazorgplan behoeft de instemming van het bevoegd gezag. Het bevoegd gezag beslist hierover
      binnen dertien weken na de indiening van het nazorgplan. Indien het bevoegd gezag niet binnen de gestelde termijn
      heeft beslist, is de instemming van rechtswege gegeven. Het bevoegd gezag maakt de instemming van rechtswege
      onverwijld nadat de beslistermijn is verstreken, bekend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.4
    text: |-
      Het bevoegd gezag kan degene die een stortplaats drijft, bevelen het nazorgplan waarmee het heeft ingestemd, aan
      te passen gezien de ontwikkelingen op het gebied van de technische mogelijkheden tot bescherming van het milieu
      en de ontwikkelingen met betrekking tot de kwaliteit van het milieu, dan wel in verband met een verandering van de
      stortplaats sedert de datum van instemming met het nazorgplan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.49.5
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot de in het eerste en tweede lid bedoelde maatregelen
      alsmede met betrekking tot het in het derde lid bedoelde nazorgplan nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.49
  - number: 8.50.1
    text: |-
      Het bevoegd gezag is belast met de maatregelen, bedoeld in [artikel 8.49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.50.2
    text: |-
      Het bevoegd gezag kan de zorg voor de uitvoering van de werkzaamheden die verband houden met de in
      [artikel 8.49][ref1] bedoelde maatregelen, opdragen aan een daartoe door hem aangewezen rechtspersoon of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.50.3
    text: |-
      In afwijking van het eerste lid berust de zorg voor de uitvoering van de werkzaamheden die verband houden met de in
      [artikel 8.49][ref1] bedoelde maatregelen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.50.3.a
    text: |-
      gesloten stortplaatsen waar baggerspecie is gestort en die worden gedreven of mede worden gedreven door Onze
      Minister van Verkeer en Waterstaat, bij die minister;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
  - number: 8.50.3.b
    text: |-
      gesloten afvalvoorzieningen waarin zich een mijnbouwwerk als bedoeld in
      [artikel 1, onder n, van de Mijnbouwwet][ref1] bevindt, bij degene die de winningsafvalvoorziening het laatst heeft
      gedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 8.50.4
    text: |-
      Op verzoek van degene die een bedrijfsgebonden stortplaats het laatst heeft gedreven, wordt bij het al dan niet
      toepassen van het tweede lid rekening gehouden met de mogelijkheid die zorg aan die persoon op te dragen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.50
  - number: '8.52'
    text: |-
      Naar aanleiding van de door de provincie uitgevoerde inventarisatie van plaatsen waar afvalstoffen zijn gestort
      en waar dat storten voor 1 september 1996 is beëindigd, delen gedeputeerde staten van de provincie waar de
      desbetreffende stortplaatsen liggen, Onze Minister zo spoedig mogelijk mede welke stortplaatsen dit betreft.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.52
  - number: 8.53.1
    text: |-
      Onze Minister houdt een lijst bij van gesloten stortplaatsen als bedoeld in [artikel 8.47][ref1], en van de
      stortplaatsen, bedoeld in [artikel 8.52][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.53
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: 8.53.2
    text: |-
      Hij draagt zorgt voor bekendmaking van deze lijst en doet een afschrift van de lijst alsmede de aanvullingen erop
      toekomen aan de ter zake van de afvalstoffenbelasting bevoegde inspecteur van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel8.53
  - number: 9.1.1
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn mede van toepassing op handelingen verricht binnen de
      exclusieve economische zone, voor zover dat bij algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.1.1
  - number: 9.2.1.1
    text: |-
      Deze titel en de daarop berustende bepalingen zijn, met uitzondering van de regels die uitsluitend strekken
      ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie, niet van toepassing op voedingsmiddelen, genotmiddelen en diervoeders.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.1
  - number: 9.2.1.2
    text: |-
      Een ieder die beroepshalve een stof, mengsel of genetisch gemodificeerd organisme vervaardigt, in Nederland
      invoert, toepast, bewerkt, verwerkt of aan een ander ter beschikking stelt, en die weet of redelijkerwijs had
      kunnen vermoeden dat door zijn handelingen met die stof of dat mengsel of organisme gevaren kunnen optreden voor de
      gezondheid van de mens of voor het milieu, is verplicht alle maatregelen te nemen die redelijkerwijs van hem kunnen
      worden gevergd, teneinde die gevaren zoveel mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.2
  - number: 9.2.1.3.1
    text: |-
      Een ieder die beroepshalve een stof, mengsel of genetisch gemodificeerd organisme vervaardigt, in Nederland
      invoert, toepast, bewerkt, verwerkt of aan een ander ter beschikking stelt, verstrekt desgevraagd aan Onze Minister
      gegevens over die stof of dat mengsel of organisme waarover hij beschikt of redelijkerwijs kan beschikken.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.3
  - number: 9.2.1.3.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.3
  - number: 9.2.1.4.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat degene die beroepshalve stoffen, mengsels of genetisch
      gemodificeerde organismen vervaardigt, in Nederland invoert, toepast, bewerkt of verwerkt, in daarbij aangegeven
      categorieën van gevallen een administratie bijhoudt van de hoeveelheden die hij daarvan heeft vervaardigd, in
      Nederland heeft ingevoerd, heeft toegepast, bewerkt of verwerkt of aan een ander ter beschikking heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.4
  - number: 9.2.1.4.2
    text: |-
      Bij of krachtens de maatregel worden regels gesteld met betrekking tot de wijze waarop de administratie wordt
      bijgehouden en kunnen andere gegevens worden aangewezen die in de administratie dienen te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.4
  - number: 9.2.1.5.1
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de landsverdediging vrijstelling worden verleend van de in
      [artikel 9.2.3.3][ref1] , [9.3.3][ref2] of [9.3a.3][ref3] gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.1.5.2
    text: |-
      Bij koninklijk besluit kan in het belang van de landsverdediging ontheffing worden verleend van de bij of krachtens
      [artikel 9.2.1.4][ref1], [9.2.2.1][ref2], [9.2.2.2][ref3], [9.2.2.6][ref4], [9.2.3.2][ref5], [9.2.3.3][ref6],
      [9.2.3.5, tweede lid][ref7], [9.3.3][ref8] of [9.3a.3][ref9] gestelde verboden en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref8
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref9
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.1.5.3
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden die nodig zijn in het belang van de
      bescherming van de gezondheid van de mens en van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.5
  - number: 9.2.1.5.4
    text: |-
      De voordracht voor een besluit krachtens het eerste of tweede lid wordt Ons niet gedaan dan op verzoek van Onze
      Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.1.5
  - number: 9.2.2.1.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien een redelijk vermoeden is gerezen dat door handelingen met
      stoffen, mengsels of genetisch gemodificeerde organismen ongewenste effecten voor de gezondheid van de mens of
      voor het milieu zullen ontstaan, regels worden gesteld met betrekking tot het vervaardigen, in Nederland invoeren,
      toepassen, bewerken, verwerken, voorhanden hebben, aan een ander ter beschikking stellen, vervoeren, uitvoeren en
      zich ontdoen van deze stoffen, mengsels of organismen, met inbegrip van het voorbereiden of bevorderen van deze
      handelingen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2
    text: 'Hiertoe kunnen behoren regels, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.a
    text: |-
      een verbod een of meer van de in het eerste lid genoemde handelingen te verrichten met betrekking tot bij de
      maatregel aangewezen stoffen, mengsels of genetisch gemodificeerde organismen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.b
    text: |-
      een verbod een zodanige handeling te verrichten op een bij de maatregel aangegeven wijze, voor daarbij aangegeven
      doeleinden, op daarbij aangegeven plaatsen of onder daarbij aangegeven omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.c
    text: een verbod een handeling als onder a of b bedoeld te verrichten zonder daartoe verleende vergunning;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.d
    text: |-
      een verbod een zodanige handeling te verrichten indien met betrekking tot de stoffen, mengsels of genetisch
      gemodificeerde organismen niet aan bij de maatregel gestelde eisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.e
    text: |-
      een verbod een zodanige handeling te verrichten indien bij degene die die handeling verricht, niet de bij de
      maatregel aangegeven deskundigheid aanwezig is;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.f
    text: |-
      een verbod een zodanige handeling te verrichten met betrekking tot producten, indien deze daarbij aangewezen
      stoffen, mengsels of genetisch gemodificeerde organismen bevatten, of indien deze zodanige stoffen, mengsels of
      genetisch gemodificeerde organismen bevatten in grotere dan daarbij aangegeven hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.g
    text: |-
      een verbod bij de maatregel aangewezen stoffen of mengsels toe te passen in producten die niet behoren tot een type
      dat bij een keuring, verricht aan de hand van de bij de maatregel daartoe vastgestelde regels, is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.h
    text: |-
      een verbod bij de maatregel aangewezen stoffen, mengsels of genetisch gemodificeerde organismen ter beschikking te
      stellen aan een daarbij aangewezen categorie van personen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.i
    text: |-
      een verplichting een of meer van de in het eerste lid genoemde handelingen met betrekking tot bij de maatregel
      aangewezen stoffen, mengsels of genetisch gemodificeerde organismen of daarbij aangewezen categorieën van producten
      waarin die stoffen, mengsels of organismen voorkomen, of een voornemen tot het verrichten van die handelingen,
      te melden op een daarbij aangegeven wijze aan een daarbij aangewezen bestuursorgaan, of met betrekking tot die
      handelingen of het voornemen tot het verrichten van die handelingen op een daarbij aangegeven wijze aan een daarbij
      aangewezen bestuursorgaan daarbij aangewezen gegevens te verstrekken;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.j
    text: |-
      een verplichting met betrekking tot zodanige handelingen volgens bij de maatregel gestelde regels
      controleonderzoeken te verrichten en de resultaten van die onderzoeken op de bij de maatregel aangegeven wijze aan
      Onze Minister over te leggen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.k
    text: |-
      een verplichting bij de maatregel aangewezen stoffen, mengsels of daarbij aangewezen categorieën van producten
      waarin die stoffen of mengsels voorkomen, na toepassing terug te zenden aan degene die de stoffen, mengsels of
      producten ter beschikking heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.l
    text: |-
      een verplichting bij de maatregel aangewezen stoffen, mengsels of genetisch gemodificeerde organismen of daarbij
      aangewezen categorieën van producten waarin die stoffen, mengsels of organismen voorkomen, af te geven aan daarbij
      aangewezen personen of instellingen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.2.m
    text: |-
      een verplichting voor degenen die bij de maatregel aangewezen stoffen, mengsels of genetisch gemodificeerde
      organismen of daarbij aangewezen categorieën van producten waarin die stoffen, mengsels of organismen voorkomen,
      vervaardigen, in Nederland invoeren of aan een ander ter beschikking stellen, voor daarbij aangewezen personen
      of instellingen die krachtens hoofdstuk 10 bevoegd zijn tot of vergunning hebben voor het nuttig toepassen of
      verwijderen van gevaarlijke afvalstoffen, dan wel voor bij de maatregel aangewezen bestuursorganen, om die stoffen,
      mengsels, organismen of producten in te zamelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1.3
    text: Onze Minister kan omtrent in een maatregel krachtens het eerste lid geregelde onderwerpen nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1
  - number: 9.2.2.1b
    text: |-
      De regels, bedoeld in [artikel 9.2.2.1, tweede lid, onder i of j][ref1], kunnen, in afwijking van
      [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref2] een verplichting inhouden een handeling met
      betrekking tot asbest of een asbesthoudend product of een voornemen tot het verrichten van die handeling langs
      elektronische weg te melden dan wel met betrekking tot die handeling of dat voornemen langs elektronische weg
      gegevens en bescheiden te verstrekken dan wel de resultaten van een controleonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.1b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 9.2.2.2
    text: |-
      Een algemene maatregel van bestuur waarbij toepassing is gegeven aan
      [artikel 9.2.2.1, tweede lid, onder b, d, g, i, j, k, l of m][ref1], kan tevens de verplichting inhouden te
      voldoen aan door bestuursorganen die bij de maatregel zijn aangewezen, omtrent onderwerpen die in de maatregel zijn
      geregeld, gestelde nadere eisen. Bij het stellen van een zodanige eis wordt tevens het tijdstip bepaald waarop ten
      aanzien van die eis de verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.3.1
    text: |-
      Indien toepassing wordt gegeven aan [artikel 9.2.2.1, tweede lid, onder c][ref1], worden tevens bij algemene
      maatregel van bestuur regels gesteld betreffende het ter zake bevoegde gezag, de wijze waarop de aanvraag om een
      vergunning geschiedt, en de gegevens die van de aanvrager kunnen worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.3.2
    text: 'De vergunning kan slechts worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.2.a
    text: in het belang van de bescherming van de gezondheid van de mens en van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.2.b
    text: |-
      indien de uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie daartoe noopt, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.2.c
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], indien dat bij de
      maatregel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 9.2.2.3.3
    text: |-
      Voordat toepassing wordt gegeven aan het tweede lid, aanhef en onder c, of het zesde lid, aanhef en
      onder c, kan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 9.2.2.3.4
    text: |-
      Op de voorbereiding van de beschikking op de aanvraag om een vergunning zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2][ref2] van toepassing. Bij een algemene
      maatregel van bestuur als bedoeld in het eerste lid kunnen categorieën van gevallen worden aangewezen, waarin
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en [afdeling 13.2][ref4] geheel of gedeeltelijk buiten
      toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 9.2.2.3.5
    text: |-
      Een vergunning kan in het belang van de bescherming van de gezondheid van de mens en van het milieu onder
      beperkingen worden verleend. Aan een vergunning kunnen in het belang van de bescherming van de gezondheid van
      de mens en van het milieu voorschriften worden verbonden. Deze kunnen, voorzover bij de maatregel niet anders is
      bepaald, de verplichting inhouden te voldoen aan door bestuursorganen die bij het voorschrift zijn aangewezen,
      in het belang van de bescherming van de gezondheid van de mens en van het milieu gestelde nadere eisen. Bij het
      stellen van een zodanige eis wordt tevens het tijdstip bepaald, waarop ten aanzien van die eis de verplichting
      ingaat.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.6
    text: |-
      Onverminderd [artikel 18.10, eerste en vierde lid, van de Omgevingswet][ref1] kan een vergunning worden
      ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '18'
  - number: 9.2.2.3.6.a
    text: |-
      indien de handeling aanmerkelijk gevaar oplevert voor de gezondheid van de mens of voor het milieu en wijziging of
      aanvulling van de aan de vergunning verbonden voorschriften redelijkerwijs geen oplossing kan bieden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.6.b
    text: |-
      indien de uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie daartoe noopt, of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.6.c
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], indien dat bij de
      maatregel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 9.2.2.3.7
    text: |-
      Voor zover bij algemene maatregel van bestuur is bepaald, kan de vergunning in het belang van de bescherming van de
      gezondheid van de mens en van het milieu worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
  - number: 9.2.2.3.8
    text: |-
      Op de voorbereiding van een intrekking of wijziging als bedoeld in het zesde lid, respectievelijk het zevende
      lid, zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2][ref2] niet van toepassing,
      tenzij uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie daartoe noopt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 9.2.2.4.1
    text: |-
      Indien toepassing wordt gegeven aan [artikel 9.2.2.1, tweede lid, onder g][ref1], wijst Onze Minister de instantie
      aan, die de in die bepaling bedoelde keuring verricht. Bij de maatregel worden regels gesteld ten aanzien van de
      wijze waarop een zodanige keuring plaatsheeft en de gronden waarop de in de eerste volzin bedoelde aanwijzing kan
      worden ingetrokken dan wel gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.4.2
    text: |-
      Indien ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van
      een volkenrechtelijke organisatie, toepassing wordt gegeven aan [artikel 9.2.2.1, tweede lid, onder g][ref1],
      en het verdrag of besluit van die volkenrechtelijke organisatie niet verplicht tot aanwijzing van een instantie
      als bedoeld in het eerste lid, geldt in afwijking van het eerste lid geen verplichting tot aanwijzing van een
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.5
    text: |-
      Indien toepassing wordt gegeven aan [artikel 9.2.2.1, tweede lid, onder k, l of m][ref1], kan tevens worden bepaald
      dat de schade, geleden door degene die de stoffen, mengsels, genetisch gemodificeerde organismen of producten moet
      terugzenden of afgeven, of de kosten, gemaakt door degene die is aangewezen om die stoffen, mengsels, organismen
      of producten in te zamelen, ten laste kunnen worden gebracht van degenen die deze stoffen, mengsels, organismen
      of producten hebben vervaardigd of in Nederland ingevoerd. Daarbij kunnen tevens regels worden gesteld inzake
      de berekening van die schade of kosten en de bepaling van degenen ten laste van wie die schade of kosten worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.6.1
    text: |-
      Indien de verwachte of gebleken effecten van stoffen, mengsels of genetisch gemodificeerde organismen op de
      gezondheid van de mens of op het milieu het stellen van regels als bedoeld in [artikel 9.2.2.1, eerste lid][ref1],
      naar het oordeel van Onze Minister dringend noodzakelijk maken en naar zijn oordeel de totstandkoming van
      een algemene maatregel van bestuur krachtens dat artikel niet kan worden afgewacht, kan hij een besluit
      nemen van de in dat lid bedoelde strekking. Onze Minister neemt een zodanig besluit in overeenstemming met
      Onze Ministers wie het mede aangaat, tenzij de vereiste spoed zich daartegen naar zijn oordeel verzet. De
      [artikelen 9.2.2.2 tot en met 9.2.2.5][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.6.2
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid vervalt een jaar nadat zij in werking is getreden of indien
      binnen die termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden,
      op het tijdstip waarop die maatregel in werking treedt. De termijn kan bij ministeriële regeling eenmaal met ten
      hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6
  - number: 9.2.2.6a.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bij het op de markt brengen van brandstoffen ten behoeve
      van vervoer in bij de maatregel aangewezen gevallen wordt voldaan aan bij of krachtens de maatregel gestelde eisen
      van duurzaamheid, waaronder begrepen de uitstoot van broeikasgassen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6a
  - number: 9.2.2.6a.2
    text: |-
      De eisen, bedoeld in het eerste lid, kunnen in elk geval betrekking hebben op de voor brandstoffen gebruikte
      grondstoffen en de omstandigheden waaronder die grondstoffen worden vervaardigd, omgezet en, al dan niet omgezet,
      worden overgebracht voor eindgebruik in Nederland.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6a
  - number: 9.2.2.6a.3
    text: |-
      Bij of krachtens de maatregel kunnen tevens regels worden gesteld omtrent de overlegging van gegevens waaruit
      blijkt dat de brandstoffen voldoen aan de krachtens het eerste lid gestelde eisen van duurzaamheid, alsmede van
      gegevens, waaruit blijkt in hoeverre de brandstoffen aan andere bij of krachtens algemene maatregel van bestuur aan
      te wijzen duurzaamheidscriteria voldoen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6a
  - number: 9.2.2.6a.4
    text: |-
      [Artikel 9.2.2.6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.7.1
    text: |-
      Onze Minister kan in bijzondere gevallen van het krachtens [artikel 9.2.1.4][ref1], [9.2.2.1][ref2],
      [9.2.2.6][ref3] of [9.2.2.6a][ref4] bepaalde op een daartoe strekkende aanvraag ontheffing verlenen, indien het
      belang van de bescherming van de gezondheid van de mens en van het milieu zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.2.7.2
    text: |-
      Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen de voorschriften worden verbonden,
      die naar het oordeel van Onze Minister in het belang van de bescherming van de gezondheid van de mens en van het
      milieu noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.7
  - number: 9.2.2.7.3
    text: |-
      Op de voorbereiding van een beschikking op een aanvraag om een ontheffing als bedoeld eerste lid, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 9.2.2.7.4
    text: |-
      Een ontheffing kan door Onze Minister worden gewijzigd of ingetrokken, indien dat in het belang van de bescherming
      van de gezondheid van de mens en van het milieu noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.2.7
  - number: 9.2.3.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de aanduiding van
      producten waarin bepaalde stoffen of mengsels voorkomen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.2
  - number: 9.2.3.3.1
    text: 'De verpakking en sluiting die een genetisch gemodificeerd organisme rechtstreeks omsluiten, zijn:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.1.a
    text: zodanig dat ongewild verlies van de inhoud niet kan plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.1.b
    text: |-
      vervaardigd van materiaal dat niet door het organisme kan worden aangetast, noch hiermee een gevaarlijke reactie
      kan aangaan of een gevaarlijke verbinding kan vormen, en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.1.c
    text: zodanig dat zij niet kunnen losraken en tegen normale behandeling bestand zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.2
    text: |-
      Indien de verpakking is voorzien van een sluiting die meermalen kan worden gebruikt, zijn de verpakking en sluiting
      zodanig dat de verpakking meermalen opnieuw kan worden afgesloten zonder dat ongewild verlies van de inhoud
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.3
    text: |-
      In afwijking van het eerste lid, onder a, mogen aan de verpakking, indien nodig, een of meer ontluchtingsventielen
      of andersoortige veiligheidsvoorzieningen aangebracht zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot de verpakking en sluiting regels worden
      gesteld. Daarbij kan worden bepaald dat die regels slechts gelden voor daarbij aangewezen genetisch gemodificeerde
      organismen of categorieën daarvan of in daarbij aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.3
  - number: 9.2.3.4
    text: |-
      Het aanduiden van een genetisch gemodificeerd organisme op een wijze die misleidend is ten aanzien van de effecten
      daarvan op de gezondheid van de mens of op het milieu of ten aanzien van het krachtens [artikel 9.2.2.1][ref1] of
      [9.2.2.6][ref2] bepaalde, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.2
  - number: 9.2.3.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat in daarbij aangewezen gevallen de
      [artikelen 9.2.3.3][ref1] en [9.2.3.4][ref2] geheel of voor een daarbij te bepalen gedeelte niet van toepassing
      zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
  - number: 9.2.3.5.1.a
    text: |-
      ter uitvoering van een krachtens het Verdrag betreffende de oprichting van de Europese Unie tot stand gekomen
      bindende regeling of
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.5
  - number: 9.2.3.5.1.b
    text: indien het belang van de bescherming van de gezondheid van de mens en van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.5
  - number: 9.2.3.5.2
    text: |-
      Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen regels worden gesteld met betrekking tot de in
      de [artikelen 9.2.3.3][ref1] en [9.2.3.4][ref2] geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: 9.2.3
  - number: 9.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van de EG-verordening
      registratie, evaluatie en autorisatie van chemische stoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.1
  - number: 9.3.2.1
    text: |-
      Onze Minister is de bevoegde instantie, bedoeld in de EG-verordening registratie, evaluatie en autorisatie van
      chemische stoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.2
  - number: 9.3.2.2
    text: |-
      Voor onderdelen van de verordening die betrekking hebben op beleid dat behoort tot de verantwoordelijkheid van een
      Onzer andere Ministers, wordt voor die onderdelen die minister als bevoegde instantie aangewezen. De aanwijzing
      geschiedt bij regeling van Onze Minister in overeenstemming met die minister.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.2
  - number: 9.3.3.1
    text: |-
      Het is verboden te handelen in strijd met de volgende bepalingen van de EG-verordening registratie, evaluatie en
      autorisatie van chemische stoffen: de artikelen 5, 7, derde lid, 8, tweede lid, 9, vierde en zesde lid, 14, eerste,
      zesde en zevende lid, 31, eerste, tweede, derde, zevende en negende lid, 32, eerste en derde lid, 33, 34, 35, 37,
      vierde tot en met zevende lid, 38, eerste, derde en vierde lid, 39, eerste en tweede lid, 40, derde en vierde lid,
      50, vierde lid, 55, 56, eerste en tweede lid, 60, tiende lid, 65 en 67, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.3
  - number: 9.3.3.2
    text: |-
      Het is eveneens verboden te handelen in strijd met de volgende bepalingen van de EG-verordening registratie,
      evaluatie en autorisatie van chemische stoffen: de artikelen 6, eerste en derde lid, 7, eerste, tweede en vijfde
      lid, 9, tweede lid, 11, eerste lid, 13, eerste, derde en vierde lid, 17, eerste lid, 18, eerste lid, 19, eerste
      lid, 22, eerste, tweede en vierde lid, 24, tweede lid, 25, eerste en tweede lid, 26, eerste en derde lid, 30,
      eerste, tweede, derde en vierde lid, 31, vijfde en achtste lid, 32, tweede lid, 36, 37, tweede en derde lid, 41,
      vierde lid, 46, tweede lid, 49, 50, tweede en derde lid, 61, eerste en derde lid, 63, derde lid, 66, eerste lid
      en 105.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.3
  - number: 9.3.3.3
    text: |-
      Het is verboden handelingen te verrichten of na te laten in strijd met andere bepalingen van de EG-verordening
      registratie, evaluatie en autorisatie van chemische stoffen dan genoemd in het eerste of tweede lid, voor zover die
      bepalingen ter uitvoering van artikel 126 van die verordening bij algemene maatregel van bestuur zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.3
  - number: 9.3.3.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid vervalt een jaar nadat hij in werking is getreden,
      dan wel, indien binnen die termijn een voorstel van wet tot wijziging van het eerste of tweede lid bij de Staten-
      Generaal is ingediend, op het tijdstip waarop dat voorstel is verworpen of, na tot wet te zijn verheven, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.3
  - number: 9.3.3.5
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op gedragingen, voorzover daaromtrent regels zijn gesteld
      bij of krachtens de [Warenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.3
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 9.3.4
    text: 'Het is verboden te handelen in strijd met de volgende bepaling van de EU-verordening markttoezicht: artikel 7.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3.4
  - number: 9.3a.1
    text: |-
      De Minister van Volksgezondheid, Welzijn en Sport wijst bij ministeriële regeling het orgaan aan dat belast is
      met de uitvoering van de taak, bedoeld in artikel 45, eerste lid, van de EG-verordening indeling, etikettering en
      verpakking van stoffen en mengsels. In de ministeriële regeling kunnen regels worden gesteld met betrekking tot de
      wijze van uitvoeren van die taak.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.1
  - number: 9.3a.2
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport is de bevoegde instantie, bedoeld in artikel 43 van de EG-
      verordening indeling, etikettering en verpakking van stoffen en mengsels, voor zover het betreft het doen van
      voorstellen voor een geharmoniseerde indeling en etikettering van stoffen en mengsels.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.2
  - number: 9.3a.3.1
    text: |-
      Het is verboden te handelen in strijd met de volgende bepalingen van de EG-verordening indeling, etikettering
      en verpakking van stoffen en mengsels: de artikelen 4, eerste tot en met vierde lid, zevende lid, achtste lid en
      tiende lid, 7, eerste tot en met derde lid, 13, 15, vierde lid, 17, eerste en tweede lid, 18, eerste tot en met
      derde lid, 19, eerste en tweede lid, 20, eerste en derde lid, 21, eerste en derde lid, 22, eerste en vierde lid,
      23, 25, eerste, tweede en vierde tot en met achtste lid, 28, tweede en derde lid, 29, eerste en derde lid, 30,
      eerste lid, 31, eerste tot en met vijfde lid, 32, eerste tot en met vierde en zesde lid, 33, eerste tot en met
      derde lid, 35, eerste en tweede lid, en 48, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.3
  - number: 9.3a.3.2
    text: |-
      Het is eveneens verboden te handelen in strijd met de volgende bepalingen van de EG-verordening indeling,
      etikettering en verpakking van stoffen en mengsels: de artikelen 16, eerste lid, 26, eerste en tweede lid, 27, 28,
      eerste lid, 30, tweede en derde lid, 40, eerste tot en met derde lid, en 49, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.3
  - number: 9.3a.3.3
    text: |-
      Het is verboden handelingen te verrichten of na te laten in strijd met andere bepalingen van de EG-verordening
      indeling, etikettering en verpakking van stoffen en mengsels dan genoemd in het eerste of tweede lid, voor
      zover die bepalingen ter uitvoering van artikel 47 van die verordening bij algemene maatregel van bestuur zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.3
  - number: 9.3a.3.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het derde lid vervalt een jaar nadat hij in werking is getreden,
      dan wel, indien binnen die termijn een voorstel van wet tot wijziging van het eerste of tweede lid bij de Staten-
      Generaal is ingediend, op het tijdstip waarop dat voorstel is verworpen of, na tot wet te zijn verheven, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.3
  - number: 9.3a.4
    text: 'Het is verboden te handelen in strijd met de volgende bepaling van de EU-verordening markttoezicht: artikel 7.'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.3a.4
  - number: 9.4.1.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder: *aanbieder van diensten van de
      informatiemaatschappij*: aanbieder van een dienst zoals gedefinieerd in artikel 1, eerste lid, onderdeel b, van
      [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad van 9 september 2015 betreffende
      een informatieprocedure op het gebied van technische voorschriften en regels betreffende de diensten van
      de informatiemaatschappij (PbEU 2015, L 241); *CE-markering*: markering als bedoeld in besluit nr. 93/465/
      EEG van de Raad van de Europese Unie van 22 juli 1993 betreffende de modules voor de verschillende fasen van
      de conformiteitbeoordelingsprocedures en de voorschriften inzake het aanbrengen en het gebruik van de CE-
      markering van overeenstemming (PbEG L 220) en bestaande uit het opschrift «CE» als weergegeven in bijlage III
      bij de EG-richtlijn ecologisch ontwerp energiegerelateerde producten; *componenten en subeenheden*: onderdelen
      die bedoeld zijn om in een ingevolge een algemene maatregel van bestuur of een uitvoeringsmaatregel als
      bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen energiegerelateerd product te worden ingebouwd en die
      niet als losse onderdelen ten behoeve van gebruikers op de markt worden geïntroduceerd of in gebruik worden
      genomen, dan wel waarvan de milieuprestaties niet onafhankelijk van voornoemd product kunnen worden beoordeeld;
      *conformiteitsverklaring*: document waarbij de fabrikant overeenkomstig bijlage VI bij de EG-richtlijn ecologisch
      ontwerp energiegerelateerde producten verklaart dat aan alle voor dat product relevante bepalingen van de
      toepasselijke uitvoeringsmaatregel wordt voldaan, onder verwijzing naar die uitvoeringsmaatregel; *EG-richtlijn
      ecologisch ontwerp energiegerelateerde producten*: richtlijn nr. 2009/125/EG van het Europees Parlement en de Raad
      van de Europese Unie van 21 oktober 2009 betreffende de totstandbrenging van een kader voor het vaststellen van
      eisen inzake ecologisch ontwerp voor energiegerelateerde producten (herschikking) (PbEU L 285); *energiegerelateerd
      product*: product dat wanneer het op de markt is geïntroduceerd of in gebruik is genomen, een effect heeft op het
      energieverbruik, met inbegrip van onderdelen die bedoeld zijn om in dat product te worden ingebouwd en die ten
      behoeve van gebruikers op de markt worden geïntroduceerd of in gebruik worden genomen als losse onderdelen waarvan
      de milieuprestaties onafhankelijk kunnen worden beoordeeld; *fabrikant*: degene die een energiegerelateerd product
      vervaardigt met het oog op het op de markt introduceren onder zijn eigen naam of handelsmerk of voor eigen gebruik;
      *importeur*: in de Europese Gemeenschap gevestigde persoon die in het kader van zijn commerciële activiteiten een
      product uit een land buiten de Europese Unie op de markt introduceert; *marktdeelnemer:* marktdeelnemer als bedoeld
      in artikel 3, onderdeel 13, van de EU-verordening markttoezicht; *op de markt introduceren*: op de markt aanbieden,
      tegen vergoeding of kosteloos, met het oog op de distributie of het gebruik ervan, ongeacht de wijze waarop dat
      geschiedt; *uitvoeringsmaatregel*: krachtens de EG-richtlijn ecologisch ontwerp energiegerelateerde producten
      goedgekeurde maatregel tot vaststelling van voorschriften voor een ecologisch ontwerp voor daarin aangegeven
      energiegerelateerde producten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.1.2
    text: |-
      Voor de toepassing van deze titel en de daarop berustende bepalingen wordt onder *ecologisch ontwerp, ecologisch
      profiel, geharmoniseerde norm, materialen, milieuprestaties, productontwerp* onderscheidenlijk *verbetering
      van de milieuprestaties* verstaan hetgeen daaronder in artikel 2 van de EG-richtlijn ecologisch ontwerp
      energiegerelateerde producten wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.1
  - number: 9.4.1.3
    text: |-
      Bij het ontbreken van een fabrikant of importeur van een energiegerelateerd product wordt degene die dat
      energiegerelateerde product op de markt introduceert of in gebruik neemt, voor de toepassing van deze titel en de
      daarop berustende bepalingen als fabrikant aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.1
  - number: 9.4.1.4
    text: |-
      Een wijziging van de in het tweede lid genoemde begrippen in de EG-richtlijn ecologisch ontwerp energiegerelateerde
      producten of van een bijlage bij die richtlijn waarnaar bij of krachtens deze titel wordt verwezen, gaat voor
      de toepassing van het bij of krachtens deze titel bepaalde gelden met ingang van de dag waarop aan de betrokken
      wijziging uitvoering moet zijn gegeven, tenzij bij een besluit van Onze Minister, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.1
  - number: 9.4.2
    text: |-
      Een fabrikant kan een persoon schriftelijk machtigen om namens hem bij of krachtens deze titel geldende
      verplichtingen na te komen, mits deze gemachtigde binnen de Europese Gemeenschap is gevestigd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.2
  - number: 9.4.3
    text: Deze titel is niet van toepassing op middelen voor het vervoer van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.3
  - number: 9.4.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van energie-efficiëntie en bescherming van
      het milieu met betrekking tot het ecologisch ontwerp van een categorie van energiegerelateerde producten en de
      verstrekking van daarmee verband houdende informatie over die producten aan de gebruikers regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.4
  - number: 9.4.4.2
    text: |-
      Het is de fabrikant onderscheidenlijk importeur van een energiegerelateerd product dat behoort tot een bij
      algemene maatregel van bestuur aangewezen categorie of tot een categorie, aangewezen in een uitvoeringsmaatregel
      die in de vorm van een verordening is gesteld, verboden dat product op de markt te introduceren of in gebruik
      te nemen, indien met betrekking tot dat product niet wordt voldaan aan de bij of krachtens deze titel en in de
      uitvoeringsmaatregel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.4
  - number: 9.4.5.1
    text: |-
      De fabrikant onderscheidenlijk importeur draagt er zorg voor dat een energiegerelateerd product dat behoort tot
      een ingevolge een algemene maatregel van bestuur als bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen
      categorie of tot een categorie, aangewezen in een uitvoeringsmaatregel die in de vorm van een verordening
      is gesteld, alvorens dat product op de markt wordt geïntroduceerd of in gebruik wordt genomen, aan een
      conformiteitsbeoordeling wordt onderworpen, waarbij wordt getoetst of het voldoet aan de bij of krachtens deze
      titel en in de uitvoeringsmaatregel gestelde eisen. Bij algemene maatregel van bestuur kunnen regels worden gegeven
      met betrekking tot de wijze waarop de toetsing met betrekking tot dat product plaatsvindt. Onze Minister kan een of
      meer instanties aanwijzen, die de conformiteitsbeoordeling verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.5.2
    text: |-
      De fabrikant maakt met betrekking tot een energiegerelateerd product dat behoort tot een ingevolge een algemene
      maatregel van bestuur als bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie,
      aangewezen in een uitvoeringsmaatregel die in de vorm van een verordening is gesteld, een conformiteitsverklaring
      op en brengt een CE-markering op het product aan. De importeur draagt er zorg voor dat hij met betrekking tot een
      dergelijk product beschikt over de conformiteitsverklaring en dat op het product een CE-markering is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.6.1
    text: |-
      De fabrikant onderscheidenlijk importeur van een energiegerelateerd product dat behoort tot een ingevolge een
      algemene maatregel van bestuur als bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een
      categorie, aangewezen in een uitvoeringsmaatregel die in de vorm van een verordening is gesteld, bewaart na het
      in Nederland op de markt introduceren of in gebruik nemen van dat product de relevante documenten betreffende
      de conformiteitsbeoordeling, als bedoeld in [artikel 9.4.5, eerste lid][ref2], en de daaromtrent afgegeven
      conformiteitsverklaringen gedurende een periode van tien jaar na beëindiging van de vervaardiging van dat product.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.6.2
    text: |-
      De fabrikant onderscheidenlijk importeur stelt de in het eerste lid bedoelde documenten binnen tien dagen na
      ontvangst van een verzoek van het bevoegd gezag, belast met het toezicht op de naleving van de wet, beschikbaar aan
      dat bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.6
  - number: 9.4.6.3
    text: |-
      Fabrikanten van componenten en subeenheden kunnen bij of krachtens algemene maatregel van bestuur met
      betrekking tot een energiegerelateerd product dat behoort tot een ingevolge een algemene maatregel van bestuur
      als bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie, aangewezen in
      een uitvoeringsmaatregel die in de vorm van een verordening is gesteld, worden verplicht aan de fabrikant
      onderscheidenlijk importeur van dat product daarbij aangegeven relevante informatie te verstrekken over de
      materiaalsamenstelling en het verbruik van energie, materialen of hulpbronnen van de door hen geproduceerde
      componenten of subeenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.7.1
    text: |-
      Het is verboden op een energiegerelateerd product een markering aan te brengen, die de gebruikers van dat product
      kan misleiden omtrent de betekenis of de vorm van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.7
  - number: 9.4.7.2
    text: |-
      Het is verboden een energiegerelateerd product dat behoort tot een ingevolge een algemene maatregel van
      bestuur als bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie, aangewezen
      in een uitvoeringsmaatregel die in de vorm van een verordening is gesteld, dat nog niet op de markt is
      geïntroduceerd en niet in overeenstemming is met het bij of krachtens deze titel bepaalde en met de toepasselijke
      uitvoeringsmaatregel, te tonen of te demonstreren op handelsbeurzen, tentoonstellingen of soortgelijke
      evenementen. Het verbod geldt niet indien duidelijk zichtbaar is aangegeven dat het product nog niet met die
      uitvoeringsmaatregel in overeenstemming is en niet op de markt zal worden geïntroduceerd, zolang het product nog
      niet met het bij of krachtens deze titel bepaalde en met de toepasselijke uitvoeringsmaatregel in overeenstemming
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.8.1
    text: |-
      Een energiegerelateerd product, behorende tot een ingevolge een algemene maatregel van bestuur als
      bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie, aangewezen in een
      uitvoeringsmaatregel die in de vorm van een verordening is gesteld, dat van een CE-markering is voorzien, wordt
      vermoed te voldoen aan de voor dat product bij of krachtens deze titel en in de uitvoeringsmaatregel gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.8.2
    text: |-
      Een energiegerelateerd product, behorende tot een ingevolge een algemene maatregel van bestuur als
      bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie, aangewezen in een
      uitvoeringsmaatregel die in de vorm van een verordening is gesteld, waarvoor een geharmoniseerde norm is toegepast
      waarvan het referentienummer in het Publicatieblad van de Europese Unie is bekendgemaakt, wordt vermoed te voldoen
      aan de voorschriften van de toepasselijke uitvoeringsmaatregel waarop die norm betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.8.3
    text: |-
      Een energiegerelateerd product, behorende tot een ingevolge een algemene maatregel van bestuur als
      bedoeld in [artikel 9.4.4, tweede lid][ref1], aangewezen categorie of tot een categorie, aangewezen in een
      uitvoeringsmaatregel die in de vorm van een verordening is gesteld, waarvoor overeenkomstig verordening (EG)
      nr. 66/2010 van het Europees Parlement en de Raad van de Europese Unie van 25 november 2009 betreffende de EU-
      milieukeur (PbEU L 27) de communautaire milieukeur is verleend, wordt vermoed te voldoen aan de voorschriften
      inzake ecologisch ontwerp van de toepasselijke uitvoeringsmaatregel voor zover de milieukeur aan die voorschriften
      voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.4.9.1
    text: |-
      Het is een marktdeelnemer die betrokken is of betrokken is geweest bij het op de markt aanbieden of in de handel
      brengen van een energiegerelateerd product dat behoort tot een bij algemene maatregel van bestuur aangewezen
      categorie of tot een categorie aangewezen in een uitvoeringsmaatregel die in de vorm van een verordening is
      gesteld, verboden in strijd te handelen met de artikelen 4, eerste, derde en vierde lid, en 7, eerste lid, van de
      EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.9
  - number: 9.4.9.2
    text: |-
      Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het op de markt
      aanbieden of in de handel brengen van een energiegerelateerd product dat behoort tot een bij algemene maatregel
      van bestuur aangewezen categorie of tot een categorie aangewezen in een uitvoeringsmaatregel die in de vorm
      van een verordening is gesteld, verboden in strijd te handelen met artikel 7, tweede lid, van de EU-verordening
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.9
  - number: 9.4.9.3
    text: |-
      Het is een gemachtigde als bedoeld in artikel 4, tweede lid, onderdeel c, van de EU-verordening markttoezicht,
      die betrokken is of betrokken is geweest bij het op de markt aanbieden of in de handel brengen van een
      energiegerelateerd product dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie of tot
      een categorie aangewezen in een uitvoeringsmaatregel die in de vorm van een verordening is gesteld, verboden te
      handelen in strijd met artikel 5, tweede lid, tweede volzin, van de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.4.9
  - number: 9.5.1.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het voorkomen of beperken van luchtverontreiniging of
      geluidhinder regels worden gesteld met betrekking tot het vervaardigen, in Nederland invoeren, voorhanden hebben,
      aan een ander ter beschikking stellen, vervoeren en gebruiken van bij de maatregel aangewezen producten.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.2
    text: |-
      In afwijking van het eerste lid worden in het belang van het voorkomen of beperken van geluidhinder bij een
      maatregel als bedoeld in het eerste lid geen regels gesteld met betrekking tot luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende een verbod met betrekking tot zodanige
      producten een of meer van de in het eerste lid genoemde handelingen:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.a
    text: te verrichten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.b
    text: |-
      te verrichten anders dan met inachtneming van de omtrent die handelingen of die producten bij de maatregel gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.c
    text: |-
      te verrichten met producten, behorende tot een bij de maatregel aangewezen categorie, op de bij de maatregel
      aangegeven plaatsen, op de bij de maatregel aangegeven wijze of onder de bij de maatregel aangegeven
      omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.d
    text: te verrichten indien de producten niet voldoen aan de bij de maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.e
    text: |-
      te verrichten indien de producten niet behoren tot een type dat bij een keuring, verricht overeenkomstig bij de
      maatregel gestelde regels is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.3.f
    text: te verrichten indien de producten niet overeenkomstig bij de maatregel gestelde regels zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.4
    text: |-
      Bij een maatregel als bedoeld in het eerste lid kan worden bepaald dat daarbij gestelde regels slechts gelden in
      bij de maatregel aangegeven categorieën van gevallen of in de bij de maatregel aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.5
    text: |-
      Bij een maatregel als bedoeld in het eerste lid kan in het belang van de landsverdediging vrijstelling worden
      verleend van de krachtens het eerste lid gestelde verboden en verplichtingen. Aan een vrijstelling kunnen
      voorschriften worden verbonden die nodig zijn in het belang van het voorkomen of beperken van luchtverontreiniging
      dan wel van geluidhinder.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.6
    text: |-
      Voor zover een maatregel als bedoeld in het eerste lid strekt tot nakoming van verplichtingen op grond van een voor
      Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, kunnen
      tot de regels, bedoeld in het eerste lid, tevens behoren regels die voorzien in:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.6.a
    text: |-
      een verbod om zonder vergunning, verleend door een bij die maatregel aangewezen bestuursorgaan, handelingen te
      verrichten met betrekking tot de bij die maatregel aangewezen producten of categorieën daarvan;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.6.b
    text: |-
      een verplichting om ten aanzien van die producten of categorieën daarvan in bij de maatregel aangegeven gevallen
      van het gebruik daarvan aangifte te doen bij een bestuursorgaan, dat bij die maatregel is aangewezen, dan wel te
      voldoen aan meetvoorschriften op een bij de maatregel te bepalen wijze;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.6.c
    text: |-
      een verplichting te voldoen aan door een bestuursorgaan, dat bij de maatregel is aangewezen, gestelde nadere eisen
      omtrent de onderwerpen die in die maatregel zijn geregeld, op een door het bestuursorgaan te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.7
    text: |-
      Indien toepassing wordt gegeven aan het derde lid, onder e of f, wijst Onze Minister op grond van de bij of
      krachtens een maatregel als bedoeld in het eerste lid te stellen eisen de instanties aan die de in die onderdelen
      bedoelde keuringen verrichten. Bij of krachtens die maatregel wordt in dat geval tevens bepaald op grond waarvan
      Onze Minister de aanwijzing kan schorsen of intrekken en worden regels gesteld over de wijze waarop de keuringen
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.1.8
    text: Onze Minister kan omtrent in een maatregel krachtens het eerste lid geregelde onderwerpen nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.1
  - number: 9.5.2.1
    text: |-
      Bij algemene maatregel van bestuur kunnen ter stimulering van hergebruik, preventie, recycling en andere nuttige
      toepassing, van een doelmatig beheer van afvalstoffen of anderszins in het belang van de bescherming van het milieu
      regels worden gesteld met betrekking tot het vervaardigen, in Nederland invoeren, toepassen, voorhanden hebben,
      aan een ander ter beschikking stellen, in ontvangst nemen, innemen, nuttig toepassen en verwijderen van bij de
      maatregel aangewezen stoffen, mengsels of producten of afvalstoffen. Met betrekking tot producten worden zodanige
      regels niet gesteld in het belang dat [artikel 9.5.1][ref1] beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.2.2
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen behoren regels, inhoudende een verbod met betrekking tot zodanige
      stoffen, mengsels of producten of afvalstoffen een of meer van de in het eerste lid genoemde handelingen:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.2.a
    text: te verrichten;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.2.b
    text: |-
      te verrichten anders dan met inachtneming van de omtrent die handelingen of die stoffen, mengsels of producten of
      afvalstoffen bij de maatregel gestelde regels;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.2.c
    text: |-
      te verrichten op een bij de maatregel aangewezen wijze, onder daarbij aangegeven omstandigheden, of voor daarbij
      aangewezen doeleinden;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.2.d
    text: |-
      te verrichten indien de stoffen, mengsels of producten of afvalstoffen niet voldoen aan de bij de maatregel
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen tevens behoren regels, inhoudende de verplichting voor degene die
      bij de maatregel aangewezen stoffen, mengsels of producten op de markt brengt:
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.a
    text: |-
      die stoffen, mengsels of producten of de verpakking ervan te voorzien van een door Onze Minister aangegeven
      aanduiding;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.b
    text: |-
      om geheel of gedeeltelijk de financiële of financiële en organisatorische verantwoordelijkheid voor de
      inname en het beheer van die stoffen, mengsels of producten overgebleven afvalstoffen te dragen, waarbij, in
      het geval van een regeling voor uitgebreide producentenverantwoordelijkheid, de verplichtingen die daaruit
      voortvloeien tevens kunnen worden uitgevoerd door een organisatie die namens diegene de regeling voor uitgebreide
      producentenverantwoordelijkheid nakomt;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.c
    text: |-
      zorg te dragen voor het treffen van voorzieningen die erop gericht zijn om die stoffen, mengsels of producten na
      inname op een bij de maatregel aangegeven wijze nuttig toe te passen of te verwijderen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.d
    text: |-
      zorg te dragen voor het, na inname, afgeven van die stoffen, mengsels of producten aan een persoon, behorende tot
      een bij de maatregel aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.e
    text: 'openbaar beschikbare informatie te verstrekken over:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.e.1°
    text: de mate waarin die stoffen, preparaten of producten geschikt zijn voor hergebruik en recycleerbaar zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.e.2°
    text: |-
      voorzieningen die er op gericht zijn om die stoffen, mengsels of producten in te nemen voor hergebruik of nuttig
      toepassing; en
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.3.e.3°
    text: afvalpreventiemaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.4
    text: 'Tot de regels, bedoeld in het eerste lid, kunnen verder behoren regels, inhoudende de verplichting:'
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.4.a
    text: |-
      voor bij de maatregel aangewezen personen bij de maatregel aangewezen afvalstoffen of andere stoffen, mengsels of
      producten in ontvangst te nemen en vervolgens op een bij de maatregel aangegeven wijze toe te passen;
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.4.b
    text: |-
      voor burgemeester en wethouders er zorg voor te dragen dat er op ten minste één daartoe ter beschikking gestelde
      plaats binnen de gemeente of binnen de gemeenten waarmee wordt samengewerkt, in voldoende mate gelegenheid wordt
      geboden om bij de maatregel aangewezen stoffen, mengsels of producten achter te laten die zijn ingenomen krachtens
      het derde lid, onder b, op een bij de maatregel aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.5
    text: |-
      Bij een maatregel als bedoeld in het eerste lid kan worden bepaald dat daarbij gestelde regels slechts gelden in
      bij de maatregel aangegeven categorieën van gevallen of in de bij de maatregel aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.2.6
    text: |-
      [Artikel 9.5.1, zesde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de regels, bedoeld
      in dat lid, tevens kunnen worden gesteld ten aanzien van bij de maatregel, bedoeld in het eerste lid, aangewezen
      stoffen en mengsels of categorieën daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.2.7
    text: Onze Minister kan omtrent in een maatregel krachtens het eerste lid geregelde onderwerpen nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.2
  - number: 9.5.3
    text: |-
      Bij een algemene maatregel van bestuur, vastgesteld krachtens [artikel 9.5.1][ref1], kan worden bepaald dat het
      gezag dat bevoegd is een omgevingsvergunning voor een milieubelastende activiteit te verlenen, bij het verlenen of
      wijzigen van de vergunning met betrekking tot bij de maatregel aangegeven onderwerpen in de beperkingen waaronder
      de vergunning wordt verleend, of in de daaraan verbonden voorschriften van bij de maatregel of de krachtens artikel
      9.5.1, zesde lid, gestelde regels met betrekking tot producten kan afwijken. In dat geval wordt bij de maatregel
      aangegeven in hoeverre het bevoegd gezag van de regels kan afwijken. Bij de maatregel kan tevens worden bepaald dat
      de bevoegdheid tot afwijken slechts geldt in daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.4
    text: |-
      Onze Minister kan, indien naar zijn oordeel in het belang van het voorkomen of beperken van luchtverontreiniging
      of geluidhinder, dan wel in het belang van de stimulering van hergebruik, preventie, recycling of andere nuttige
      toepassing, van een doelmatig beheer van afvalstoffen of anderszins in het belang van de bescherming van het milieu
      een onverwijlde voorziening noodzakelijk is, een regeling vaststellen van de in de [artikelen 9.5.1][ref1] of
      [9.5.2][ref2] bedoelde strekking voor een termijn van ten hoogste twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.1
    text: |-
      Bij koninklijk besluit kan in het belang van de landsverdediging op verzoek van Onze Minister van Defensie
      ontheffing worden verleend van het bepaalde krachtens [artikel 9.5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.2
    text: |-
      Onze Minister kan voorts op aanvraag ontheffing verlenen van het bepaalde krachtens de [artikelen 9.5.1][ref1] of
      [9.5.2][ref2] indien het belang dat die artikelen beogen te beschermen, zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.3
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in de [artikelen 9.5.1][ref1] of [9.5.2][ref2] kan worden
      bepaald dat een bij de maatregel aangewezen ander bestuursorgaan in plaats van Onze Minister ontheffing kan
      verlenen van het bepaalde krachtens deze artikelen, indien het belang dat die artikelen beogen te beschermen, zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.4
    text: |-
      Aan een ontheffing als bedoeld in het eerste tot en met derde lid kunnen voorschriften en beperkingen worden
      verbonden in het belang dat de [artikelen 9.5.1][ref1] of [9.5.2][ref2] beogen te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.5
    text: |-
      De voorschriften en beperkingen, bedoeld in het vierde lid, kunnen worden gewijzigd, aangevuld of ingetrokken in
      het belang dat de [artikelen 9.5.1][ref1] of [9.5.2][ref2] beogen te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.6
    text: |-
      Een ontheffing als bedoeld in het eerste tot en met derde lid kan geheel of gedeeltelijk worden ingetrokken in het
      belang dat de [artikelen 9.5.1][ref1] of [9.5.2][ref2] beogen te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.5.7
    text: |-
      Bij algemene maatregel van bestuur krachtens [artikel 9.5.2][ref1] kan worden bepaald dat in daarbij aangegeven
      categorieën van gevallen op de voorbereiding van een beschikking op de aanvraag om ontheffing te verlenen,
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 9.5.6.1
    text: |-
      Indien toepassing wordt gegeven aan [artikel 9.5.1, zesde lid, onder a][ref1], of [artikel 9.5.2, zesde lid][ref2],
      in samenhang met artikel 9.5.1, zesde lid, onder a, is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van
      toepassing op de voorbereiding van een beschikking op de aanvraag om een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 9.5.6.2
    text: |-
      Een vergunning kan slechts worden geweigerd in het belang dat de [artikelen 9.5.1][ref1] of [9.5.2][ref2] beogen
      te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.6.3
    text: Een vergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
  - number: 9.5.6.4
    text: |-
      Aan een vergunning kunnen voorschriften worden verbonden. Hiertoe kan behoren het voorschrift, dat met betrekking
      tot in het voorschrift geregelde onderwerpen moet worden voldaan aan nadere eisen, die door een bij het voorschrift
      aangewezen bestuursorgaan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
  - number: 9.5.6.5
    text: |-
      Bij de betrokken algemene maatregel van bestuur kunnen categorieën van gevallen worden aangewezen waarin het eerste
      lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
  - number: 9.5.6.6
    text: |-
      Voor zover dat bij de betrokken maatregel is bepaald, kan de vergunning worden gewijzigd of ingetrokken. Op de
      voorbereiding van een zodanige wijziging of intrekking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 9.5.7.1
    text: |-
      Er is een elektronisch landelijk asbestvolgsysteem, waarin met betrekking tot saneringen van asbest gegevens
      en bescheiden worden opgenomen die betrekking hebben op handelingen die in de achtereenvolgende fasen van de
      asbestsanering worden verricht, in het bijzonder de inventarisatie en verwijdering van asbest, de eindbeoordeling
      van het resultaat van de verwijdering en de afvoer en de verwerking van het asbestafval. Hiertoe kunnen ook
      persoonsgegevens behoren.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.7
  - number: 9.5.7.2
    text: |-
      Onze Minister draagt zorg voor de inrichting, instandhouding, werking, toegankelijkheid en beveiliging
      van het landelijk asbestvolgsysteem en voor het beheer van de daarin opgenomen gegevens en bescheiden en
      treft de nodige voorzieningen voor de elektronische uitwisseling van gegevens en bescheiden met betrekking
      tot saneringen van asbest tussen het landelijk asbestvolgsysteem en de landelijke voorziening, bedoeld in
      [artikel 20.21 van de Omgevingswet][ref1]. Onze Minister wordt tevens aangemerkt als verwerkingsverantwoordelijke
      voor de verwerking van de persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '20'
  - number: 9.5.7.3
    text: |-
      De gegevens en bescheiden die in het landelijk asbestvolgsysteem zijn opgenomen, zijn langs elektronische weg
      toegankelijk voor bij algemene maatregel van bestuur aangewezen bestuursorganen, bedrijven en personen.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.7
  - number: 9.5.7.4
    text: |-
      Bij algemene maatregel van bestuur worden de gegevens en bescheiden aangewezen die in het landelijk
      asbestvolgsysteem worden opgenomen en worden regels gesteld met betrekking tot de toegankelijkheid van het systeem
      en de periode gedurende welke de gegevens en bescheiden worden bewaard. Daarbij kunnen tevens regels worden
      gesteld met betrekking tot de inrichting, instandhouding, werking en beveiliging van het systeem en het beheer
      van de gegevens en bescheiden die daarin zijn opgenomen. Bij ministeriële regeling kunnen met het oog op een goede
      uitvoering nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.7
  - number: 9.5.8.1
    text: |-
      Er is een pyro-passregister, waarin controledocumenten zijn opgenomen waarmee het bewijs wordt geleverd dat
      een persoon gemachtigd is bepaalde pyrotechnische artikelen te hanteren of te gebruiken in het bijzonder in een
      grensoverschrijdende context. In het pyro-passregister kunnen hiertoe persoonsgegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
  - number: 9.5.8.2
    text: |-
      Onze Minister draagt zorgt voor de inrichting, instandhouding, werking, toegankelijkheid en beveiliging van
      het pyro-passregister en voor het beheer van de daarin opgenomen gegevens en bescheiden en treft de nodige
      voorzieningen voor de elektronische uitwisseling van gegevens en bescheiden. Onze Minister wordt aangemerkt als
      verwerkingsverantwoordelijke voor de verwerking van de persoonsgegevens in het pyro-passregister.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
  - number: 9.5.8.3
    text: |-
      De gegevens en bescheiden die in het pyro-passregister zijn opgenomen, zijn langs elektronische weg toegankelijk
      voor bij algemene maatregel van bestuur aangewezen bestuursorganen, bedrijven en personen, met dien verstande dat
      de aangewezen bedrijven en personen slechts toegang hebben voor zover dat noodzakelijk is om te verifiëren of het
      controledocument in het pyro-passregister geldig is.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
  - number: 9.5.8.4
    text: |-
      Bij algemene maatregel van bestuur worden de gegevens en bescheiden aangewezen die in het pyro-passregister worden
      opgenomen en worden regels gesteld met betrekking tot de toegankelijkheid van het systeem en de periode gedurende
      welke de gegevens en bescheiden worden bewaard. Daarbij kunnen tevens regels worden gesteld met betrekking tot de
      inrichting, instandhouding, werking en beveiliging van het systeem en het beheer van de gegevens en bescheiden die
      daarin zijn opgenomen. Bij ministeriële regeling kunnen met het oog op een goede uitvoering nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
  - number: 9.5.8.5
    text: |-
      Bij ministeriële regeling kan worden bepaald dat voor de aanvraag om opgenomen te worden in het pyro-passregister
      een vergoeding verschuldigd is. In dat geval worden bij die regeling tevens nadere regels gesteld met betrekking
      tot de hoogte van de vergoeding en de wijze waarop deze moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
  - number: 9.5.8.6
    text: |-
      Alvorens pyrotechnische artikelen te verstrekken die uitsluitend op de markt mogen worden aangeboden aan personen
      met gespecialiseerde kennis, stellen marktdeelnemers voor personen die in België, Nederland of Luxemburg als
      persoon met gespecialiseerde kennis zijn aangewezen aan de hand van de pyro-pass, raadpleging van het pyro-
      passregister en een document als bedoeld in [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref1]
      vast of deze gemachtigd zijn betreffende pyrotechnische artikelen te hanteren of te gebruiken. Bij of krachtens
      algemene maatregel van bestuur kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.5.8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 9.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld om te verzekeren dat bij die maatregel
      genoemde aanbestedende diensten en aanbestedende instanties bij een aanbesteding waarbij in die maatregel genoemde
      wegvoertuigen zijn betrokken, rekening wordt gehouden met de minimumstreefcijfers voor schone wegvoertuigen,
      bedoeld in artikel 5, van [richtlijn 2009/33/EG](32009L0033) van het Europees Parlement en de Raad van 23 april
      2009 inzake de bevordering van schone wegvoertuigen ter ondersteuning van emissiearme mobiliteit (PbEU 2009, L120).
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel9.6.1
  - number: 9.7.1.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder: - *afboekrekening:* rekening in het
      register, bedoeld om de naar die rekening overgeboekte hernieuwbare brandstofeenheden te onttrekken aan het aantal,
      voor het voldoen aan de jaarverplichting, beschikbare hernieuwbare brandstofeenheden;
        - *benzine:* ongelode lichte olie als bedoeld in [artikel 26, tweede lid, van de Wet op de accijns][ref1] en
      minerale oliën die op grond van [artikel 28, met uitzondering van het tweede en zesde lid, van die wet][ref2] voor
      het tarief van ongelode lichte olie aan de accijns onderworpen zijn;
        - *bijproduct:* product dat een hoofddoel vormt van het productieproces, niet zijnde een residu;
        - *biobrandstof:* biogas als bedoeld in artikel 2, onderdeel 28, van de richtlijn hernieuwbare energie, vloeibare
      biomassa als bedoeld in artikel 2, onderdeel 32, van die richtlijn of biobrandstof als bedoeld in artikel 2,
      onderdeel 33, van die richtlijn;
        - *diesel:* gasolie als bedoeld in [artikel 26, vierde lid, van de Wet op de accijns][ref3] en minerale oliën die
      op grond van [artikel 28, met uitzondering van het tweede lid, van die wet][ref4] voor het tarief van gasolie aan
      de accijns onderworpen zijn;
        - *duurzaamheidssysteem:* vrijwillig systeem als bedoeld in artikel 30, vierde lid, van de richtlijn hernieuwbare
      energie dat door de Europese Commissie is erkend;
        - *energie-inhoud:* energie-inhoud als bedoeld in bijlage III bij de richtlijn hernieuwbare energie of, indien
      niet opgenomen in die bijlage, berekend volgens bij ministeriële regeling te stellen regels. In afwijking van
      de vorige volzin geldt voor benzine en diesel de energie-inhoud als bedoeld in bijlage I, deel 1, onderdeel 3,
      onder c, van richtlijn (EU) 2015/652 van de Raad van 20 april 2015 tot vaststelling van berekeningsmethoden en
      rapportageverplichtingen overeenkomstig Richtlijn 98/70/EG van het Europees Parlement en de Raad betreffende de
      kwaliteit van benzine en van dieselbrandstof (PbEU L 107);
        - *hernieuwbare brandstof:* hernieuwbare vloeibare en gasvormige vervoersbrandstof van niet-biologische oorsprong
      als bedoeld in artikel 2, onderdeel 36, van de richtlijn hernieuwbare energie;
        - *hernieuwbare brandstofeenheid:* hernieuwbare brandstofeenheid als bedoeld in [artikel 9.7.3.1][ref5];
        - *hernieuwbare energie:* energie uit hernieuwbare bronnen als bedoeld in artikel 2, onderdeel 1, van de richtlijn
      hernieuwbare energie;
        - *importeur:* onderneming die minerale oliën invoert in Nederland, maar geen houder van een vergunning voor een
      accijnsgoederenplaats als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref6] voor minerale oliën
      of geregistreerde geadresseerde als bedoeld in artikel 1a, eerste lid, van die wet voor minerale oliën is;
        - *inboeker:* onderneming die ingevolge bij of krachtens [artikel 9.7.4.1][ref7] bevoegd is om een geleverde
      hoeveelheid hernieuwbare energie in het register in te voeren;
        - *inboekfaciliteit:* eigenschap van een rekening in het register die de inboeking van hernieuwbare energie
      overeenkomstig [artikel 9.7.4.1][ref8] mogelijk maakt;
        - *jaarverplichting:* aantal per soort hernieuwbare brandstofeenheden dat de leverancier tot eindverbruik is
      verschuldigd op grond van [artikel 9.7.2.1][ref9];
        - *jaarverplichtingfaciliteit:* eigenschap van een rekening in het register die een leverancier tot eindverbruik
      ingevolge [artikel 9.7.2.2][ref10] heeft om aan zijn jaarverplichting te voldoen;
        - *leverancier tot eindverbruik:* houder van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, van de Wet op de accijns][ref11] voor minerale oliën, of geregistreerde geadresseerde
      als bedoeld in artikel 1a, eerste lid, van die wet voor minerale oliën, of importeur, met een levering tot
      eindverbruik;
        - *leveren aan de Nederlandse markt:* uitslag tot verbruik als bedoeld in
      [artikel 2 van de Wet op de accijns][ref12], dan wel leveren van minerale oliën door een houder van een vergunning
      voor een accijnsgoederenplaats als bedoeld in [artikel 1a, eerste lid, van die wet][ref13] aan een andere
      houder van een vergunning voor een accijnsgoederenplaats, voor zover de inboeker kan aantonen dat de hoeveelheid
      ingeboekte biobrandstof is uitgeslagen tot verbruik als bedoeld in artikel 2 van de Wet op de accijns;
        - *levering tot eindverbruik:* uitslag tot verbruik als bedoeld in [artikel 2 van de Wet op de accijns][ref14] van
      benzine, diesel en zware stookolie;
        - *luchtvaart:* nationaal en internationaal transport door de lucht;
        - *minerale oliën:* oliën als bedoeld in [artikel 25 van de Wet op de accijns][ref15];
        - *onderneming:* onderneming als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref16];
        - *overboekfaciliteit:* eigenschap van een rekening in het register die de overboeking van een hernieuwbare
      brandstofeenheid mogelijk maakt;
        - *register:* register hernieuwbare energie als bedoeld in [artikel 9.7.5.1, eerste lid][ref17];
        - *residu:* een stof als bedoeld in artikel 2, onderdeel 43, van de richtlijn hernieuwbare energie;
        - *richtlijn hernieuwbare energie:* [richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad
      van 11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *verordening (EU) 2019/807:* gedelegeerde [verordening (EU) 2019/807](32707R2019) van de commissie van 13 maart
      2019 tot aanvulling van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad wat betreft
      het bepalen van de grondstoffen met een hoog risico van indirecte veranderingen in landgebruik waarbij een
      belangrijke uitbreiding van het productiegebied naar land met grote koolstofvoorraden waar te nemen valt, en de
      certificering van biobrandstoffen, vloeibare biomassa en biomassabrandstoffen met een laag risico op indirecte
      veranderingen in landgebruik (PbEU 2019, L 133);
        - *vervoer:* alle vormen van transport over de weg, het spoor, het water en door de lucht;
        - *voedsel- en voedergewassen:* voedsel- en voedergewassen als bedoeld in artikel 2, onderdeel 40, van de richtlijn
      hernieuwbare energie;
        - *zetmeelrijke gewassen:* gewassen als bedoeld in artikel 2, onderdeel 39, van de richtlijn hernieuwbare energie;
        - *zware stookolie:* zware stookolie als bedoeld in [artikel 26, vijfde lid, van de Wet op de accijns][ref18] en
      minerale oliën die op grond van [artikel 28, met uitzondering van het tweede en zesde lid, van die wet][ref19] voor
      het tarief van zware stookolie aan de accijns onderworpen zijn.


