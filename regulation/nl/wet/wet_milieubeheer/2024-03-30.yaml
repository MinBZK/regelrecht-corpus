        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0002402
  - number: 22.1.5
    text: |-
      [Titel 9.2][ref1] is niet van toepassing op het vervoeren, het ten vervoer aanbieden en het ten vervoer
      aannemen, het laden en het lossen en het nederleggen tijdens het vervoer van stoffen, mengsels of micro-
      organismen, alsmede op het laten staan en het laten liggen van een vervoermiddel waarin of waarop
      zich zodanige stoffen, mengsels of micro-organismen of resten daarvan bevinden, voorzover daaromtrent
      regels zijn gesteld bij of krachtens de [Wet luchtvaart][ref2], dan wel op de handelingen, genoemd in
      [artikel 2, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref3] ten aanzien van stoffen, mengsels of
      micro-organismen, voorzover daaromtrent regels zijn gesteld bij of krachtens [die wet][ref4]. In afwijking van
      de eerste volzin is [titel 9.2][ref5] van toepassing met betrekking tot de verpakking van micro-organismen,
      zijnde genetisch gemodificeerde organismen, indien die organismen zich bij de handelingen, bedoeld in de eerste
      volzin, niet bevinden in een verpakking die voldoet aan de regels die terzake zijn gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref6] of de [Wet luchtvaart][ref7].


