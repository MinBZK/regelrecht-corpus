        paragraaf: 10.6.3
  - number: 10.64.1
    text: |-
      Het voor milieubelastende activiteiten bij of krachtens de [artikelen 4.5, tweede lid][ref1], [5.18][ref2],
      [5.19][ref3], [5.26][ref4], [5.31][ref5], [5.34, eerste en vierde lid][ref6], [5.37][ref7], [5.38][ref8],
      [5.39, aanhef en onder a][ref9], [5.40, eerste lid, onder a, en tweede lid, onder a tot en met e][ref10],
      [5.41][ref11], [5.42, tweede lid][ref12], [13.5][ref13], [16.15][ref14],
      [16.55, eerste, derde en vierde lid][ref15], [16.65 tot en met 16.68][ref16] en [16.139 van de Omgevingswet][ref17]
      bepaalde is van overeenkomstige toepassing met betrekking tot het verlenen, weigeren, wijzigen en intrekken van een
      ontheffing als bedoeld in [artikel 10.63][ref18], met dien verstande dat – behalve ten aanzien van een ontheffing
      van de in [artikel 10.2, eerste lid][ref19], en [artikel 10.54, eerste lid][ref20], gestelde verboden –, voor die
      toepassing het belang van de bescherming van het milieu wordt beperkt tot het belang van een doelmatig beheer van
      de betrokken categorie van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
