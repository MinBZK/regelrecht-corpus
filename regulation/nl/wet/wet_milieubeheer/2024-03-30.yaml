        afdeling: 16.2.1
  - number: 16.39h.2.c
    text: |-
      in [artikel 16.16][ref1] voor «artikel 68» wordt gelezen «artikel 11bis».


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel16.39h
    references:
      - id: ref1
