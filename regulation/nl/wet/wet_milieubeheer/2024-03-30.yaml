  - number: 18.5.1
    text: |-
      Het is verboden te handelen in strijd met de volgende bepalingen van de Verordening monitoring en rapportage
      emissiehandel: artikel 4 in verbinding met de artikelen 5 tot en met 9, en de artikelen 11, 12, 51, 52, 53, 57
      en 68.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5
  - number: 18.5.2
    text: |-
      Het is voorts verboden te handelen in strijd met de volgende bepalingen van de Verordening monitoring en rapportage
      emissiehandel: de artikelen 14, 15, 16, 19 tot en met 54, 55, 56, 58 tot en met 67, 69, 72 en 73.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5
  - number: 18.5a.1
    text: |-
      Het is verboden te handelen in strijd met de volgende bepalingen van de Verordening kosteloze toewijzing van
      emissierechten: de artikelen 4, tweede lid, onderdeel a, 5, tweede lid, en 6 tot en met 9.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5a
  - number: 18.5a.2
    text: |-
      Het is voorts verboden te handelen in strijd met de volgende bepalingen van de Verordening kosteloze toewijzing van
      emissierechten: artikelen 10, 11, 12, 23 en 25.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5a
  - number: 18.5b
    text: |-
      Het is verboden te handelen in strijd met artikel 3, eerste, tweede en derde lid, van de Verordening aanpassingen
      kosteloze toewijzing door verandering activiteitsniveau.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5b
  - number: 18.5c
    text: |-
      Het is verboden te handelen in strijd met de artikelen 2, 3, 4 en 5 van de Verordening monitoring, rapportage en
      verificatie van wereldwijde luchtvaartemissies.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5c
  - number: 18.5d
    text: |-
      Het is verboden te handelen in strijd met de artikelen 4, 5, 6, eerste tot en met derde lid en vijfde tot en met
      zevende lid, 7, eerste tot en met vierde lid, 8, 9, 10, 11, eerste, tweede en derde lid, 11 bis, eerste en tweede
      lid, 12, eerste lid, 13, 14, 15, eerste, tweede, derde en zesde lid, 16, eerste en tweede lid en 17, eerste, tweede
      en vierde lid, van de Verordening monitoring, rapportage en verificatie van broeikasgasemissies door maritiem
      vervoer.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.5d
  - number: 18.6.1
    text: |-
      Het is verboden te handelen in strijd met artikel 7 in verbinding met hoofdstuk II en met de artikelen 35 en 44 van
      de Verordening verificatie en accreditatie emissiehandel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.6
  - number: 18.6.2
    text: |-
      Het is voorts verboden te handelen in strijd met de artikelen 26, 27 en 31, eerste lid, van de Verordening
      verificatie en accreditatie emissiehandel.
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.6
  - number: 18.6a.1
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens de [artikelen 16.5][ref1], [16.6][ref2], [16.12][ref3],
      16.12 in verbinding met [16.39h][ref4], 16.12 in verbinding met [16.39ab, vierde lid][ref5], 16.12 in verbinding
      met [16.39ae][ref6], [16.13][ref7], 16.13 in verbinding met 16.39h, [16.13a][ref8], [16.14][ref9], 16.14 in
      verbinding met 16.39h, 16.14 in verbinding met 16.39ae, derde lid, [16.19][ref10], [16.20c, tweede lid][ref11],
      [16.21][ref12], 16.21 in verbinding met 16.39h, 16.21, eerste lid, in verbinding met [16.39ak][ref13],
      [16.23, tweede lid][ref14], in verbinding met [16.39ai][ref15], [16.29, onderdelen b en c][ref16], [16.39z][ref17],
      [16.39aa][ref18], [16.39ab, derde lid][ref19], [16.39ad][ref20], [16.39ae, eerste en tweede lid, derde lid][ref21],
      [16.39af][ref22], [16.39ag][ref23], of van de [artikelen 18.5][ref24], [18.5a][ref25], [18.5b][ref26],
      [18.5c][ref27], [18.5d][ref28] en [18.6][ref29] of van [18.18][ref30] voor zover het een voorschrift betreft dat is
      verbonden aan een vergunning krachtens [hoofdstuk 16][ref31], of van artikel 56, eerste lid, van de Verordening EU-
      register handel in emissierechten, kan het bestuur van de emissieautoriteit een last onder dwangsom opleggen.


