preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz. Allen, die
    deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, naast de wettelijke regelingen, geldende voor de
    onderscheidene onderdelen van het gebied van de milieuhygiëne, regelen te stellen met betrekking tot een aantal
    algemene onderwerpen op dat gebied;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: adviseurs: bestuursorganen die krachtens
      wettelijk voorschrift in de gelegenheid moeten worden gesteld advies uit te brengen met betrekking tot het
      geven van een beschikking of het nemen van een ander besluit; afvalbeheerplan: afvalbeheerplan, bedoeld in
      [artikel 10.3][ref1]; afvalstoffen: alle stoffen, mengsels of voorwerpen, waarvan de houder zich ontdoet,
      voornemens is zich te ontdoen of zich moet ontdoen; afvalstoffenhandelaar: natuurlijke of rechtspersoon die als
      verantwoordelijke optreedt bij het bedrijfsmatig aankopen en vervolgens verkopen van afvalstoffen, met inbegrip
      van natuurlijke of rechtspersonen die de afvalstoffen niet fysiek in hun bezit hebben; afvalstoffenhouder:
      afvalstoffenproducent dan wel de natuurlijke of rechtspersoon die de afvalstoffen in zijn bezit heeft;
      afvalstoffenmakelaar: natuurlijke of rechtspersoon die ten behoeve van anderen bedrijfsmatig de verwijdering
      of de nuttige toepassing van afvalstoffen organiseert, met inbegrip van de natuurlijke of rechtspersonen die
      de afvalstoffen niet fysiek in hun bezit hebben; afvalstoffenproducent: natuurlijke of rechtspersoon wiens
      activiteiten afvalstoffen voortbrengen of die voorbehandelingen, vermengingen of andere bewerkingen verricht
      die leiden tot een wijziging in de aard of de samenstelling van die afvalstoffen; afvalstoffenverordening: de
      verordening, bedoeld in [artikel 10.23][ref2]; afvalwater: alle water waarvan de houder zich ontdoet, voornemens
      is zich te ontdoen of zich moet ontdoen; bedrijfsafvalstoffen: afvalstoffen, niet zijnde huishoudelijke
      afvalstoffen of gevaarlijke afvalstoffen; beheer van afvalstoffen: inzameling, vervoer, nuttige toepassing, met
      inbegrip van sortering, en verwijdering van afvalstoffen, met inbegrip van het toezicht op die handelingen
      en de nazorg voor stortplaatsen na sluiting en met inbegrip van de activiteiten van afvalstoffenhandelaars en
      afvalstoffenmakelaars; betrokken bestuursorganen: adviseurs en andere bestuursorganen die krachtens wettelijk
      voorschrift worden betrokken bij de totstandkoming van de in [artikel 13.1, eerste lid][ref3], bedoelde
      beschikkingen; bevoegd gezag: bestuursorgaan dat bevoegd is tot het geven van een beschikking of het nemen van
      een ander besluit; bioafval: biologisch afbreekbaar tuin- en plantsoenafval, levensmiddelenafval en keukenafval
      afkomstig van huishoudens, kantoren, restaurants, groothandels, kantines, cateringfaciliteiten en winkels en
      vergelijkbare afvalstoffen van de levensmiddelenindustrie; biochemisch zuurstofverbruik: massaconcentratie aan
      opgeloste zuurstof die gedurende vijf dagen wordt verbruikt door biochemische oxydatie van organische bestanddelen
      onder uitsluiting van ammoniumoxydatie onder omstandigheden die zijn gespecificeerd in een door Onze Minister
      aangewezen norm van het Nederlands Normalisatie Instituut; broeikasgas: gas, genoemd in bijlage II bij de EG-
      richtlijn handel in broeikasgasemissierechten; broeikasgasemissierecht: overeenkomstig het bepaalde bij en
      krachtens [hoofdstuk 16][ref4] overdraagbaar recht, uitsluitend teneinde aan het bepaalde bij en krachtens
      dat hoofdstuk te voldoen, om gedurende een bepaalde periode een emissie van één ton kooldioxide-equivalent
      in de lucht te veroorzaken; Commissie genetische modificatie: de Commissie genetische modificatie, bedoeld in
      [artikel 2.26][ref5]; doelmatig beheer van afvalstoffen: zodanig beheer van afvalstoffen dat daarbij rekening
      wordt gehouden met het geldende afvalbeheerplan, dan wel de voor de vaststelling van het plan geldende bepalingen,
      dan wel de voorkeursvolgorde aangegeven in [artikel 10.4][ref6], en de criteria, genoemd in [artikel 10.5][ref7];
      één ton kooldioxide-equivalent: een metrische ton kooldioxide of een hoeveelheid van een ander broeikasgas
      met een gelijkwaardig aardopwarmingsvermogen; de EG-richtlijn handel in broeikasgasemissierechten: [richtlijn
      nr. 2003/87/EG](32003L0087) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot
      vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap en tot wijziging
      van [Richtlijn 96/61/EG](31996L0061) van de Raad (PbEU L 275); EG-verordening EU-milieukeur: [verordening (EG)
      nr. 66/2010](32010R0066) van het Europees parlement en de Raad van 25 november 2009 betreffende de EU-milieukeur
      (PbEU L 2010, 27); EG-verordening indeling, etikettering en verpakking van stoffen en mengsels: verordening (EG)
      nr. 1272/2008 van het Europees Parlement en de Raad van de Europese Unie van 16 december 2008 betreffende de
      indeling, etikettering en verpakking van stoffen en mengsels tot wijziging en intrekking van de Richtlijnen 67/548/
      EEG en 1999/45/EG en tot wijziging van Verordening (EG) nr. 1907/2006 (PbEU L 353); EG-verordening overbrenging
      van afvalstoffen: verordening (EG) nr. 1013/2006 van het Europees Parlement en de Raad van de Europese Unie van
      14 juni 2006 betreffende de overbrenging van afvalstoffen (PbEU L 190); EG-verordening registratie, evaluatie
      en autorisatie van chemische stoffen: verordening (EG) nr. 1907/2006 van het Europees Parlement en de Raad
      van 18 december 2006 inzake de registratie en beoordeling van en de autorisatie en beperkingen ten aanzien van
      chemische stoffen (REACH), tot oprichting van een Europees Agentschap voor chemische stoffen, houdende wijziging
      van Richtlijn 1999/45/EG en houdende intrekking van Verordening (EEG) nr. 793/93 van de Raad en Verordening
      (EG) nr. 1488/94 van de Commissie alsmede Richtlijn 76/769/EEG van de Raad en de Richtlijnen 91/155/EEG, 93/67/
      EEG, 93/105/EG en 2000/21/EG van de Commissie (PbEU 2007, L 136); emissie: stoffen, trillingen, warmte, die of
      geluid dat direct of indirect vanuit een bron in de lucht, het water of de bodem worden, onderscheidenlijk wordt
      gebracht; de emissieautoriteit: de Nederlandse emissieautoriteit, genoemd in [artikel 2.1][ref8]; emissiereductie-
      eenheid: eenheid, uitgegeven overeenkomstig artikel 6 van het Protocol van Kyoto en de overeenkomstig het
      Raamverdrag van de Verenigde Naties inzake klimaatverandering of het Protocol van Kyoto genomen besluiten (ERU);
      EU-verordening markttoezicht: [verordening (EU) nr. 2019/1020](32920R2019) van het Europees Parlement en de
      Raad van 20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn
      2004/42/EG](32004L0042) en [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305)
      (PbEU 2019, L 169); gecertificeerde emissiereductie: eenheid, uitgegeven overeenkomstig artikel 12 van het
      Protocol van Kyoto en de overeenkomstig het Raamverdrag van de Verenigde Naties inzake klimaatverandering of
      het Protocol van Kyoto genomen besluiten (CER); geluid: met het menselijk oor waarneembare luchttrillingen;
      geluidhinder: 'gevaar, schade of hinder, als gevolg van geluid; gescheiden inzameling: inzameling waarbij een'
      afvalstoffenstroom gescheiden gehouden wordt naar soort en aard van de afvalstoffen om een specifieke behandeling
      te vergemakkelijken; gevaarlijke afvalstof: afvalstof die een of meer van de in bijlage III bij de kaderrichtlijn
      afvalstoffen genoemde gevaarlijke eigenschappen bezit; hergebruik: elke handeling waarbij producten of componenten
      die geen afvalstoffen zijn, opnieuw worden gebruikt voor hetzelfde doel als dat waarvoor zij waren bedoeld;
      huishoudelijk afvalwater: afvalwater dat overwegend afkomstig is van menselijke stofwisseling en huishoudelijke
      werkzaamheden; huishoudelijke afvalstoffen: afvalstoffen afkomstig uit particuliere huishoudens, behoudens
      voor zover het ingezamelde bestanddelen van die afvalstoffen betreft, die zijn aangewezen als gevaarlijke
      afvalstoffen; inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar; inzameling: verzameling
      van afvalstoffen, met inbegrip van de voorlopige sortering en de voorlopige opslag van afvalstoffen, om deze
      daarna te vervoeren naar een afvalverwerkingsinstallatie; kaderrichtlijn afvalstoffen: richtlijn nr. 2008/98/EG
      van het Europees Parlement en de Raad van de Europese Unie van 19 november 2008 betreffende afvalstoffen en tot
      intrekking van een aantal richtlijnen (PbEU L 312); de kaderrichtlijn water: [richtlijn nr. 2000/60/EG](32000L0060)
      van het Europees Parlement en de Raad van de Europese Unie van 23 oktober 2000 tot vaststelling van een kader
      voor communautaire maatregelen betreffende het waterbeleid (PbEG L 327), zoals deze is gewijzigd bij beschikking
      nr. 2455/2001/EG van het Europees Parlement en de Raad van 20 november 2001 tot vaststelling van de lijst van
      prioritaire stoffen op het gebied van het waterbeleid en tot wijziging van [richtlijn 2000/60/EG](32000L0060)
      (PbEG L 331) en met inbegrip van wijzigingen uit hoofde van artikel 20, eerste lid, van de richtlijn, doch voor
      het overige naar de tekst zoals deze bij de richtlijn is vastgesteld; luchtverontreiniging: aanwezigheid in de
      buitenlucht van vaste, vloeibare of gasvormige stoffen, niet zijnde splijtstoffen, ertsen of radioactieve stoffen
      als bedoeld in de [Kernenergiewet][ref9], die op zichzelf dan wel tezamen of in verbinding met andere stoffen
      nadelige gevolgen voor het milieu kunnen veroorzaken; mengsel: een mengsel of een oplossing bestaande uit twee of
      meer stoffen; milieubelastende activiteit: milieubelastende activiteit als bedoeld in de [Omgevingswet][ref10];
      nuttige toepassing: elke handeling met als voornaamste resultaat dat afvalstoffen een nuttig doel dienen door
      hetzij in de betrokken installatie, hetzij in de ruimere economie, andere materialen te vervangen die anders
      voor een specifieke functie zouden zijn gebruikt, of waardoor de afvalstof voor die functie wordt klaargemaakt,
      tot welke handelingen in ieder geval behoren de handelingen die zijn genoemd in bijlage II bij de kaderrichtlijn
      afvalstoffen; omgevingsvergunning: omgevingsvergunning als bedoeld in de [Omgevingswet][ref11]; Onze Minister: Onze
      Minister van Infrastructuur en Milieu; preventie: maatregelen die worden genomen voordat een stof, materiaal of
      product afvalstof is geworden, ter vermindering van:


