  - number: 18.16a.3
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], wordt een bestuurlijke boete
      als bedoeld in het tweede lid, onderscheidenlijk kan een bestuurlijke boete als bedoeld in het eerste lid worden
      opgelegd naast een verhoging van het aantal broeikasgasemissierechten dat degene die de betrokken inrichting
      drijft, met betrekking tot een kalenderjaar overeenkomstig [artikel 16.39][ref2] dient in te leveren. In geval van
      overtreding van het bepaalde bij [artikel 16.39t, eerste lid][ref3], wordt een bestuurlijke boete als bedoeld in
      het tweede lid en kan een bestuurlijke boete als bedoeld in het eerste lid worden opgelegd naast een verhoging van
      het aantal broeikasgasemissierechten dat de vliegtuigexploitant met betrekking tot een kalenderjaar overeenkomstig
      [artikel 16.39w][ref4] dient in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
