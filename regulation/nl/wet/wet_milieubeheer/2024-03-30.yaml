  - number: 16.39h.1
    text: |-
      De [artikelen 16.12][ref1], [16.13][ref2], [16.14][ref3], [16.16][ref4], [16.17][ref5], [16.18][ref6] en
      [16.21][ref7] zijn van overeenkomstige toepassing op luchtvaartactiviteiten, met dien verstande dat in artikel
      16.13, eerste lid, onder b, in plaats van «de artikelen 16.6 of 16.12» wordt gelezen: artikel 16.12.


