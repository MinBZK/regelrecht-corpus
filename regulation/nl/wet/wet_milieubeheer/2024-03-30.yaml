  - number: 19.5.3
    text: |-
      Indien een verzoek tot geheimhouding in het kader van de toepassing van [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] indien het geen besluit op aanvraag betreft, laat het bevoegd gezag
      de openbaarmaking van het stuk waarop het verzoek betrekking heeft, achterwege totdat, indien het verzoek wordt
      toegestaan, de tweede tekst is overgelegd en de stukken zijn aangevuld met de in [artikel 19.4, eerste lid][ref3],
      bedoelde gegevens, dan wel, indien het verzoek geheel of gedeeltelijk wordt afgewezen, de beslissing op het verzoek
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel19
