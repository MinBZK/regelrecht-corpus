  - number: 18.2i
    text: |-
      Het bevoegd gezag, bedoeld in [artikel 17.9, eerste, tweede, derde of vierde lid][ref1], draagt zorg voor de
      bestuursrechtelijke handhaving van de bij of krachtens titel 17.2 gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2024-03-30#Artikel18.2i
    references:
