  - number: 18.16k
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], of
      [artikel 16.39t, eerste, tweede en derde lid][ref2] vermeldt de beschikking tot oplegging van de
      bestuurlijke boete tevens dat de naam van de overtreder wordt opgenomen in het overzicht, bedoeld in
      [artikel 18.16p, eerste lid][ref3].


