enrichment:
  regulation: wet_milieubeheer
  bwb_id: BWBR0003245
  valid_from: "2026-06-20"
  completed_at: "2026-07-09"
  model: claude-sonnet-4-6

  steps:
    mvt_research:
      status: skipped
      reason: >-
        WebFetch/WebSearch tools not authorized in this session. No MvT documents
        retrieved; no Gherkin feature file generated.

    generate:
      status: completed
      articles_total: 450
      articles_with_machine_readable: 18
      articles_skipped_reason: >-
        The vast majority of Wet milieubeheer articles are framework provisions,
        delegation clauses, definitional articles, or procedural rules that contain
        no computable logic expressible in the Regelrecht schema.

    validate:
      status: skipped
      reason: >-
        `just validate` requires user approval in this session. Schema compliance
        was checked manually; YAML syntax is well-formed.

    reverse_validate:
      status: completed
      articles_checked: 18
      fully_grounded: 15
      contains_untranslatables: 3
      elements_removed: 0
      scope_violations: 0

  articles:
    - number: "8.49"
      lid: 3
      topic: Nazorgplan stortplaats — beslistermijn en instemming van rechtswege
      outputs:
        - beslistermijn_einddatum
        - instemming_van_rechtswege
      notes: >-
        13 weken na indiening nazorgplan; instemming van rechtswege indien bevoegd
        gezag niet tijdig heeft beslist.

    - number: "15.20"
      lid: 5
      topic: Schadevergoeding — beslistermijn vier of zeven maanden
      outputs:
        - beslistermijn_einddatum
      notes: >-
        4 maanden standaard; 7 maanden indien deskundigenadvies is ingewonnen (lid 4).

    - number: "16.7"
      lid: 1
      topic: Emissieautoriteit — beslistermijn vergunning vier maanden
      outputs:
        - beslistermijn_einddatum
      notes: >-
        Eenvoudige DATE_ADD: vier maanden na aanvraagdatum.

    - number: "16.37"
      lid: 1
      topic: Inleverplicht broeikasgasemissierechten — deadline en nalevingscheck
      outputs:
        - inleverdeadline
        - voldoet_aan_inleverplicht
      notes: >-
        Deadline is 1 oktober van het volgende kalenderjaar. Nalevingscheck:
        ingeleverde rechten >= veroorzaakte emissies.

    - number: "16.39"
      lid: 1
      topic: Automatische verhoging inleverplicht bij tekort (installaties)
      outputs:
        - te_leveren_rechten
      notes: >-
        Van rechtswege verhoogd: emissies huidig jaar + tekort vorig jaar.

    - number: "16.39a"
      lid: 5
      topic: Dekkingspercentage maritieme emissies (50% of 100%)
      outputs:
        - dekkingspercentage
        - toepasselijke_emissies
      notes: >-
        50% voor reizen van/naar buiten-EU havens; 100% voor EU-interne reizen
        en verblijf in Nederlandse haven.

    - number: "16.39t"
      lid: null
      topic: Inleverplicht emissierechten luchtvaart en scheepvaart — deadline, fasering en ijsklasse-uitzondering
      outputs:
        - inleverdeadline
        - te_leveren_rechten_luchtvaart
        - te_leveren_rechten_scheepvaart
      notes: >-
        Deadline 1 oktober volgend kalenderjaar (lids 1 en 2). Luchtvaart: rechten
        = emissies (lid 1). Scheepvaart fasering: 40% (2024), 70% (2025), 100%
        (2026+) (lid 6). IJsklasse-uitzondering: 5% korting t/m 31-12-2030 (lid 7).

    - number: "16.39w"
      lid: 1
      topic: Automatische verhoging inleverplicht bij tekort (luchtvaart/scheepvaart)
      outputs:
        - te_leveren_rechten
      notes: >-
        Identiek patroon als 16.39 maar voor vliegtuigexploitanten en
        scheepvaartmaatschappijen.

    - number: "18.16e"
      lid: 1
      topic: Maximale bestuurlijke boete — drempelomzet € 4.500.000 / 10%
      outputs:
        - maximale_bestuurlijke_boete
      untranslatables:
        - construct: "boetebedrag per ton CO2-equivalent (lid 2)"
          reason: EU-richtlijn bedrag niet uitdrukbaar zonder extern datapunt
        - construct: "jaarlijkse CPI-verhoging (lid 3)"
          reason: Tijdreeksindexering niet beschikbaar als engine-operatie
      notes: >-
        Lid 1: IF omzet > € 4.500.000 (= 450.000.000 eurocent) THEN 10% van omzet
        ELSE € 450.000 (= 45.000.000 eurocent). Lids 2 en 3 zijn untranslatables.

    - number: "18.16l"
      lid: null
      topic: Verjaringstermijn bestuurlijke boete — 10 jaar (in afwijking van AWB 5:45)
      outputs:
        - verjaringstermijn_jaren
        - verjaring_einddatum
      notes: >-
        Overrides AWB artikel 5:45. Verjaringstermijn is 10 jaar na datum overtreding.
        DATE_ADD(overtreding_datum, years=10).

    - number: "18.16q"
      lid: 1
      topic: Maximale bestuurlijke boete — belemmering toezichthouders (€ 4.500)
      outputs:
        - maximale_boete_medewerking
      notes: >-
        Vaste boeteplafond: ten hoogste € 4.500 = 450.000 eurocent.

    - number: "2.3"
      lid: 3
      topic: Bestuur emissieautoriteit — samenstelling, benoemingstermijn en herbenoeming
      outputs:
        - benoemingstermijn_jaren
        - max_herbenoemingen
        - maximale_aaneengesloten_diensttijd_jaren
        - max_bestuursleden
      notes: >-
        Lid 1: ten hoogste 5 leden. Lid 3: termijn 4 jaren, aansluitend 2x herbenoembaar;
        maximale aaneengesloten diensttijd = 3 × 4 = 12 jaren.

    - number: "2.9"
      lid: null
      topic: Jaarverslag emissieautoriteit — deadline 1 juli (afwijking Kaderwet ZBO)
      outputs:
        - jaarverslag_deadline
      notes: >-
        In afwijking van Kaderwet ZBO artikel 18 eerste lid: jaarlijks voor 1 juli.
        DATE(jaar, 7, 1).

    - number: "2.29"
      lid: null
      topic: Rapport Commissie genetische modificatie — vierjarige rapportageplicht
      outputs:
        - volgende_rapport_deadline
      notes: >-
        Telkens binnen vier jaren na vorig rapport. DATE_ADD(vorig_rapport_datum, years=4).

    - number: "16.36"
      lid: 1
      topic: Geldigheid broeikasgasemissierechten (vanaf 2013 onbepaalde tijd)
      outputs:
        - geldig_voor_onbepaalde_tijd
      untranslatables:
        - construct: "bepaling tienjarige periode op basis van verleningsdatum (lid 2)"
          reason: Gehele-getaldeling (FLOOR) niet beschikbaar als engine-operatie
      notes: >-
        Lid 1: rechten verleend vanaf 1 jan 2013 zijn voor onbepaalde tijd geldig.
        Lid 2 (10-jaar periode) is untranslatable door ontbrekende FLOOR operatie.

    - number: "18.16p"
      lid: 1
      topic: Overzicht overtreders emissierechten — jaarlijkse deadline 1 oktober
      outputs:
        - overzicht_deadline
      notes: >-
        Elk jaar voor 1 oktober een overzicht van overtreders publiceren.
        DATE(jaar, 10, 1).

    - number: "18.16s"
      lid: 2
      topic: Maximale bestuurlijke boete hernieuwbare energie — 10% omzet of categorie 6 WvSr
      outputs:
        - boetemaximum_omzet_percentage
      untranslatables:
        - construct: "boetemaximum zesde categorie WvSr (lid 2)"
          reason: Extern vastgesteld bedrag niet beschikbaar als engine-waarde
      notes: >-
        10% van omzet berekend. Het hogere van categorie 6 WvSr en 10% omzet geldt;
        categorie 6 is untranslatable (extern bedrag, periodiek bijgesteld).

    - number: "18.17"
      lid: null
      topic: Intrekking vergunning na tweemaal bestuurlijke boete binnen vier jaar
      outputs:
        - intrekking_mogelijk
        - vier_jaar_periode_einddatum
      notes: >-
        Bevoegdheid tot intrekking ontstaat indien twee onherroepelijke boetes voor
        hetzelfde feit binnen vier jaar. Periode_einddatum = DATE_ADD(datum_eerste_boete, years=4);
        intrekking_mogelijk = datum_tweede_boete <= periode_einddatum.

  reverse_validation_report:
    fully_grounded: 15
    assumptions: 0
    elements_removed: 0
    untranslatable_workarounds: 0
    new_untranslatables_flagged: 4
    operation_correctness: passed
    scope_violations: 0
    notes: >-
      Alle 18 machine_readable secties zijn geverifieerd. Nieuwe secties (2.3, 2.9,
      2.29, 16.36, 18.16p, 18.16s, 18.17) zijn volledig herleidbaar naar de wettekst.
      Untranslatables toegevoegd: 16.36 lid 2 (FLOOR voor tienjarige periodeberekening),
      18.16e lids 2 en 3 (ETS boetebedrag en CPI-indexering),
      18.16s lid 2 (zesde categorie WvSr bedrag). Geen scope-overtredingen.

law_id: wet_milieubeheer
