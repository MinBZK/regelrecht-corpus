  - number: 1.1.2
    text: 'In deze wet en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.2.a
    text: |-
      worden onder gevolgen voor het milieu in ieder geval verstaan gevolgen voor het fysieke milieu, gezien vanuit
      het belang van de bescherming van mensen, dieren, planten en goederen, van water, bodem en lucht en van
      landschappelijke, natuurwetenschappelijke en cultuurhistorische waarden en van de beheersing van het klimaat,
      alsmede van de relaties daartussen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.2.b
    text: |-
      worden onder gevolgen voor het milieu mede verstaan gevolgen die verband houden met een doelmatig beheer van
      afvalstoffen of een doelmatig beheer van afvalwater, gevolgen die verband houden met het verbruik van energie
      en grondstoffen, alsmede gevolgen die verband houden met het verkeer van personen of goederen van en naar de
      inrichting;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.2.c
    text: |-
      worden onder bescherming van het milieu mede verstaan de verbetering van het milieu, de zorg voor een doelmatig
      beheer van afvalstoffen of een doelmatig beheer van afvalwater, de zorg voor een zuinig gebruik van energie en
      grondstoffen, alsmede de zorg voor de beperking van de nadelige gevolgen voor het milieu van het verkeer van
      personen of goederen van en naar de inrichting.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Bij algemene maatregel van bestuur worden categorieën van inrichtingen aangewezen, die nadelige gevolgen voor het
      milieu kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.4
    text: |-
      Elders in deze wet en de daarop berustende bepalingen wordt onder inrichting verstaan een inrichting, behorende
      tot een categorie die krachtens het derde lid is aangewezen. Daarbij worden als één inrichting beschouwd de
      tot eenzelfde onderneming of instelling behorende installaties die onderling technische, organisatorische of
      functionele bindingen hebben en in elkaars onmiddellijke nabijheid zijn gelegen. Onze Minister kan nadere regels
      stellen met betrekking tot hetgeen in deze wet en de daarop berustende bepalingen onder inrichting wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.5
    text: 'In deze wet en de daarop berustende bepalingen wordt onder het zich ontdoen van afvalstoffen mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.5.a
    text: het nuttig toepassen of verwijderen van afvalstoffen binnen de inrichting waarin deze zijn ontstaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.5.b
    text: |-
      het voor nuttige toepassing of verwijdering brengen van afvalstoffen vanuit een inrichting naar een elders gelegen
      inrichting die aan dezelfde natuurlijke of rechtspersoon behoort;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.5.c
    text: het tijdelijk voor nuttige toepassing afgeven van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.6
    text: |-
      Bij ministeriële regeling wordt aangegeven welke stoffen, preparaten of andere producten in ieder geval worden
      aangemerkt als afvalstoffen, indien de houder zich daarvan ontdoet, voornemens is zich daarvan te ontdoen of zich
      daarvan moet ontdoen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.7
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van het bevorderen van nuttige toepassing worden bepaald dat
      geen sprake is van het zich ontdoen van afvalstoffen, indien bij die maatregel aangewezen stoffen, preparaten of
      andere producten:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.7.a
    text: |-
      door de houder rechtstreeks worden afgegeven aan een persoon die deze stoffen, preparaten of andere produkten
      geheel toepast op een bij die maatregel aangegeven wijze;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.7.b
    text: voldoen aan bij die maatregel te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.8
    text: |-
      Een afvalstof wordt in ieder geval aangemerkt als huishoudelijke afvalstof onderscheidenlijk bedrijfsafvalstof,
      indien die afvalstof bij algemene maatregel van bestuur als zodanig is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.9
    text: |-
      Onze Minister kan, indien naar zijn oordeel in het belang van een doelmatig beheer van afvalstoffen een onverwijlde
      voorziening noodzakelijk is, een regeling vaststellen van de in het zevende of achtste lid bedoelde strekking.
      Een zodanige regeling vervalt een jaar nadat zij in werking is getreden of, indien binnen die termijn een algemene
      maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip waarop die maatregel
      in werking treedt. Onze Minister kan de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.10
    text: |-
      Onze Minister kan nadere regels stellen omtrent de aanwijzing van gevaarlijke afvalstoffen, bedoeld in het eerste
      lid. Tevens kan Onze Minister of een door hem aan te wijzen instantie vaststellen dat een afvalstof, zoals die door
      de houder ter beoordeling wordt aangeboden:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.10.a
    text: |-
      niet de eigenschappen bezit op grond waarvan deze ingevolge bijlage III bij [richtlijn nr. 91/689/EEG](31991L0689)
      van de Raad van de Europese gemeenschappen van 12 december 1991 betreffende gevaarlijke afvalstoffen als
      gevaarlijke afvalstof dient te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.10.b
    text: |-
      hoewel deze niet als gevaarlijke afvalstof is aangewezen, toch de eigenschappen bezit op grond waarvan deze
      ingevolge de in onderdeel a genoemde bijlage als gevaarlijke afvalstof dient te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.11
    text: |-
      Een wijziging van de bijlagen bij [richtlijn nr. 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen
      van 15 juli 1975 betreffende afvalstoffen gaat voor de toepassing van de in het eerste lid gegeven omschrijvingen
      van «afvalstoffen»,« beheer van afvalstoffen», «nuttige toepassing» en« verwijdering» gelden met ingang van de dag
      waarop aan de desbetreffende wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.12
    text: |-
      Een wijziging van bijlage III bij [richtlijn nr. 91/689/EEG](31991L0689) van de Raad van de Europese gemeenschappen
      van 12 december 1991 betreffende gevaarlijke afvalstoffen gaat voor de toepassing van het tiende lid gelden met
      ingang van de dag waarop aan de desbetreffende wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1.14
    text: |-
      Een wijziging uit hoofde van artikel 20, eerste lid, van de kaderrichtlijn water gaat voor de toepassing van deze
      wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij
      bij ministerieel besluit, dat in de Staatscourant of op andere geschikte wijze wordt bekendgemaakt, een ander
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1
  - number: 1.1a.1
    text: Een ieder neemt voldoende zorg voor het milieu in acht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1a
  - number: 1.1a.2
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan
      vermoeden dat door zijn handelen of nalaten nadelige gevolgen voor het milieu kunnen worden veroorzaakt, verplicht
      is dergelijk handelen achterwege te laten voor zover zulks in redelijkheid kan worden gevergd, dan wel alle
      maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd teneinde die gevolgen te voorkomen of, voor
      zover die gevolgen niet kunnen worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1a
  - number: 1.1a.3
    text: |-
      Het bepaalde in het eerste en tweede lid laat onverlet de uit het burgerlijk recht voortvloeiende aansprakelijkheid
      en de mogelijkheid van rechtspersonen als bedoeld in [artikel 1, boek 2, van het Burgerlijk Wetboek][ref1], om uit
      dien hoofde in rechte op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 1.2.1
    text: Provinciale staten stellen ter bescherming van het milieu een verordening vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.2
    text: 'De verordening bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.2.a
    text: |-
      regels ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning in bij de verordening
      aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.2.b
    text: regels inzake het voorkomen of beperken van geluidhinder in bij de verordening aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.2.c
    text: regels over de samenstelling en de werkwijze van de provinciale milieucommissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Bij de verordening worden, voor zover dit naar het oordeel van provinciale staten van meer dan gemeentelijk belang
      is, verdere regels gesteld ter bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.4
    text: |-
      Bij de verordening kan worden bepaald dat bij de verordening gestelde regels slechts gelden voor een of meer
      daarbij aan te wijzen delen van het grondgebied van de provincie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.5
    text: |-
      De verordening bevat geen regels met betrekking tot de samenstelling of eigenschappen van produkten. Ten aanzien
      van gebieden die door Onze Minister in overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      zijn aangewezen, houdt de verordening geen regels in, die betrekking hebben op de agrarische bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.6
    text: |-
      De verordening kan slechts, voor zover dit uit een oogpunt van doelmatige regelgeving bijzonder aangewezen is,
      regels bevatten die rechtstreeks betrekking hebben op bij die regels aangewezen categorieën van inrichtingen, voor
      zover:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2.6.a
    text: |-
      ten aanzien van die inrichtingen het in [artikel 8.1, eerste lid][ref1], gestelde verbod niet geldt, en die regels
      noodzakelijk zijn ter bescherming van de kwaliteit van het grondwater met het oog op de waterwinning in bij de
      verordening aangewezen gebieden, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 1.2.6.b
    text: |-
      het regels betreft, inhoudende een verbod tot het oprichten of in werking hebben van dergelijke inrichtingen in
      gebieden als bedoeld [onder ][ref1], dan wel tot het op een bij die verordening aan te geven wijze veranderen van
      dergelijke inrichtingen in die gebieden, of het veranderen van de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 1.2.7
    text: |-
      Bij de verordening kan, voor zover het gevallen betreft als bedoeld in het zesde lid, worden bepaald dat het
      orgaan dat bevoegd is een vergunning krachtens [hoofdstuk 8][ref1] te verlenen, bij het verlenen of wijzigen van
      de vergunning met betrekking tot de daarbij aangegeven onderwerpen in de beperkingen waaronder de vergunning wordt
      verleend of in de daaraan verbonden voorschriften van bij de verordening gestelde regels kan afwijken. In dat geval
      wordt bij de verordening aangegeven in hoeverre het bevoegd gezag van de regels kan afwijken. Bij de verordening
      kan tevens worden bepaald dat de bevoegdheid tot afwijken slechts geldt in daarbij aangegeven categorieën van
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: 1.2.8
    text: |-
      Bij de vaststelling van de verordening houden provinciale staten rekening met het geldende provinciale
      milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2
  - number: 1.2a
    text: |-
      Bij de provinciale milieuverordening worden geen regels gesteld, die het naar of uit de provincie brengen van
      afvalstoffen beperken of uitsluiten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.2a
  - number: 1.3.1
    text: |-
      Bij de provinciale milieuverordening kan worden bepaald dat daarbij aangewezen bestuursorganen in daarbij
      aangegeven categorieën van gevallen ontheffing kunnen verlenen van bij die verordening aangewezen regels, indien
      het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, geldt niet met betrekking tot inrichtingen waarvoor een vergunning
      krachtens [artikel 8.1][ref1] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 1.3.3
    text: |-
      Het betrokken orgaan houdt bij de beslissing op de aanvraag om een ontheffing in ieder geval rekening met het voor
      hem geldende milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.3
  - number: 1.3.4
    text: |-
      Op de voorbereiding van een beschikking krachtens het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Indien uit het oogpunt van bescherming van
      het milieu redelijkerwijs geen zienswijzen zijn te verwachten, kan bij de provinciale milieuverordening anders
      worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 1.4.1
    text: |-
      Bij de voorbereiding van het voorstel voor een provinciale milieuverordening plegen gedeputeerde staten overleg met
      de niet tot de provincie behorende bestuursorganen die het aangaat.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.4
  - number: 1.4.2
    text: |-
      Gedeputeerde staten stellen de provinciale milieucommissie in de gelegenheid over het ontwerp van een verordening
      advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.4
  - number: 1.4.3
    text: |-
      Van een besluit tot vaststelling of wijziging van de verordening wordt door gedeputeerde staten mededeling gedaan
      door toezending aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel1.4
  - number: 2.2.1
    text: |-
      De emissieautoriteit heeft de in de [hoofdstukken 16][ref1] en [18][ref2] opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '18'
  - number: 2.2.2
    text: 'De emissieautoriteit heeft voorts tot taak:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      het bijhouden van gegevens en het opstellen van rapportages met betrekking tot de naleving door Nederland van een
      voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie,
      dat de beperking van de emissies van broeikasgassen of stikstofoxiden in de lucht tot doel heeft;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      het verzamelen van gegevens over technieken ter bepaling van de emissies van broeikasgassen of stikstofoxiden,
      waarop [titel 16.2][ref1] onderscheidenlijk [titel 16.3][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 2.2.2.c
    text: het verzamelen van andere gegevens die met het oog op de uitoefening van haar taken van belang zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.2.2.d
    text: |-
      het rapporteren aan Onze Minister en aan andere bij algemene maatregel van bestuur aangewezen instanties over de
      ontwikkeling van de onder a bedoelde emissies in Nederland.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij algemene maatregel van bestuur kan de emissieautoriteit, voorzover die taken niet de uitoefening van
      openbaar gezag inhouden, worden belast met andere taken dan in het eerste of tweede lid bedoeld, in het bijzonder
      taken betreffende de uitvoering door Nederland van een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie, dat de beperking van de emissies van broeikasgassen of
      stikstofoxiden in de lucht tot doel heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de inhoud van de taken van de
      emissieautoriteit nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.2
  - number: 2.16a
    text: |-
      Onverminderd de [artikelen 16.8][ref1] en [18.3][ref2] stemmen het bestuur van de emissieautoriteit en het
      bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8.1][ref3] te verlenen voor een inrichting waarop
      [hoofdstuk 16][ref4] betrekking heeft, dan wel Onze Minister van Economische Zaken in geval voor een inrichting
      waarop dat hoofdstuk betrekking heeft, het in [artikel 40, tweede lid, van de Mijnbouwwet][ref5] vervatte verbod
      geldt, onderling de uitoefening van de taken af, waarmee zij zijn belast bij of krachtens [hoofdstuk 16][ref6],
      onderscheidenlijk [hoofdstuk 8][ref7], onderscheidenlijk [artikel 40 van de Mijnbouwwet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel40
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref8]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '40'
      - id: ref6
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref7
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref8
        bwb_id: BWBR0014168
        artikel: '40'
  - number: 2.16b
    text: |-
      De emissieautoriteit draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de
      nodige technische en organisatorische voorzieningen ter beveiliging van haar gegevens tegen verlies of aantasting
      en tegen onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.16b
  - number: 2.17.1
    text: Er is een Commissie voor de milieu-effectrapportage.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.17
  - number: 2.17.2
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.17
  - number: 2.17.2.a
    text: |-
      Onze Minister en Onze Minister van Landbouw, Natuurbeheer en Visserij overeenkomstig
      [artikel 7.5, zesde lid][ref1], van advies te dienen met betrekking tot verzoeken om ontheffing van de verplichting
      tot het maken van een milieu-effectrapport;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 2.17.2.b
    text: |-
      het bevoegd gezag overeenkomstig [de artikelen 7.14, eerste lid][ref1], en [7.26][ref2] van advies te dienen met
      betrekking tot milieu-effectrapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: '2.18'
    text: |-
      De commissie brengt elk jaar aan Onze Minister en Onze Minister van Landbouw, Natuurbeheer en Visserij een verslag
      uit van haar werkzaamheden. Onze Ministers maken het verslag openbaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.18
  - number: 2.19.1
    text: |-
      De commissie bestaat uit deskundigen op het gebied van de beschrijving, de bescherming en de verontreiniging en
      aantasting van het milieu en op het gebied van de overeenkomstig de [artikelen 7.2][ref1] en [7.6][ref2] aangewezen
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 2.19.2
    text: |-
      De voorzitter, een of meer plaatsvervangende voorzitters en de overige leden van de commissie worden door Ons,
      op gezamenlijke voordracht van Onze Minister en Onze Minister van Landbouw, Natuurbeheer en Visserij, benoemd
      en ontslagen. De voordracht tot benoeming van de voorzitter geschiedt in overeenstemming met het gevoelen van de
      ministerraad.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.19
  - number: 2.19.3
    text: |-
      De leden worden, met uitzondering van de voorzitter en de plaatsvervangende voorzitters, benoemd voor de tijd van
      vijf jaren. Zij zijn terstond wederbenoembaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.19
  - number: 2.19.4
    text: |-
      De leden kunnen te allen tijde ontslag nemen door een schriftelijke kennisgeving aan Onze Minister en Onze Minister
      van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.19
  - number: '2.20'
    text: |-
      De rechtspositie van de voorzitter, de plaatsvervangende voorzitters en de overige leden wordt voor zover nodig
      nader geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.20
  - number: 2.21.1
    text: |-
      Zodra de commissie in de gelegenheid wordt gesteld advies uit te brengen met betrekking tot een verzoek om
      ontheffing of een milieu-effectrapport, stelt de voorzitter, na overleg met de plaatsvervangende voorzitters, uit
      de leden van de commissie een werkgroep samen, die aan het bevoegd gezag advies uitbrengt. De voorzitter of de door
      hem aangewezen plaatsvervangende voorzitter van de commissie is voorzitter van de werkgroep.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Als lid van een werkgroep worden slechts leden van de commissie aangewezen, die niet rechtstreeks
      betrokken zijn of zijn geweest bij de activiteit of bij de alternatieven daarvoor, als bedoeld in
      [artikel 7.10, eerste lid, onder b][ref1], of bij een besluit bij de voorbereiding waarvan het milieu-effectrapport
      wordt of zou moeten worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 2.21.3
    text: |-
      Indien een lid van een werkgroep niet meer voldoet aan het in het tweede lid gestelde vereiste, ontheft de
      voorzitter van de werkgroep hem, na overleg met de voorzitter van de commissie, van zijn lidmaatschap van de
      werkgroep.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.21
  - number: 2.21.4
    text: |-
      De werkgroep kan zich doen bijstaan door deskundigen die geen lid zijn van de commissie. Het tweede en derde lid
      zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.21
  - number: 2.21.5
    text: |-
      De voorzitter van de commissie deelt aan het bevoegd gezag en aan degene die het milieu-effectrapport maakt of zou
      moeten maken, mede uit welke leden van de commissie de werkgroep bestaat en door welke deskundigen zij zich doet
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.21
  - number: 2.22.1
    text: |-
      De adviezen worden uitgebracht in overeenstemming met het gevoelen van de meerderheid van de leden van de
      werkgroep.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.22
  - number: 2.22.2
    text: |-
      Op verzoek van de leden die in de werkgroep een standpunt hebben verdedigd, dat afwijkt van het gevoelen van
      de meerderheid, wordt dat standpunt in het advies vermeld. Deze leden kunnen omtrent een zodanig standpunt een
      afzonderlijke nota bij het advies voegen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.22
  - number: '2.23'
    text: |-
      De commissie heeft een secretaris, die door Ons wordt benoemd en ontslagen, op gezamenlijke voordracht van Onze
      Minister en Onze Minister van Landbouw, Natuurbeheer en Visserij, de commissie gehoord. De commissie heeft een
      bureau, dat onder leiding staat van de secretaris.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.23
  - number: '2.24'
    text: De commissie stelt nadere regels betreffende haar werkwijze en zendt deze aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.24
  - number: '2.25'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder genetisch gemodificeerde organismen: organismen
      waarvan het genetisch materiaal is veranderd op een wijze die van nature niet mogelijk is door voortplanting of
      recombinatie en die het vermogen bezitten dat genetisch materiaal te vermenigvuldigen of over te dragen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.25
  - number: '2.26'
    text: Er is een Commissie genetische modificatie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.26
  - number: 2.27.1
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.27
  - number: 2.27.1.a
    text: |-
      Onze Minister te adviseren over kennisgevingen en aanvragen om vergunning met betrekking tot het vervaardigen van
      of handelen met genetisch gemodificeerde organismen en over veiligheidsmaatregelen die in het kader daarvan moeten
      worden getroffen ter bescherming van mens en milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.27
  - number: 2.27.1.b
    text: |-
      het bestuursorgaan dat bevoegd is tot het verlenen van vergunningen krachtens [artikel 8.1][ref1], te adviseren
      over aanvragen om vergunning met betrekking tot bij algemene maatregel van bestuur aangewezen inrichtingen voor
      zover die aanvragen betrekking hebben op het vervaardigen van of handelen met genetisch gemodificeerde organismen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 2.27.1.c
    text: |-
      het bestuursorgaan dat belast is met het toezicht op het vervaardigen van of handelen met genetisch gemodificeerde
      organismen, te adviseren met betrekking tot dat toezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.27
  - number: 2.27.2
    text: |-
      Op verzoek van Onze Minister of Onze Minister wie het aangaat, of uit eigen beweging informeert de commissie Onze
      betrokken Minister indien aan het vervaardigen van of aan handelingen met genetisch gemodificeerde organismen
      ethische of maatschappelijke aspecten zijn verbonden die naar het oordeel van de commissie van belang zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.27
  - number: '2.28'
    text: |-
      Onze Minister en Onze Ministers wie het mede aangaat, dragen er zorg voor dat de commissie op de hoogte wordt
      gehouden ten aanzien van het beleid op het terrein van het vervaardigen van of van handelingen met genetisch
      gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.28
  - number: '2.29'
    text: |-
      Telkens binnen een termijn van vier jaren brengt de commissie een rapport uit aan Onze Minister, waarin ten minste
      de taak, de samenstelling, de inrichting en werkwijze van de commissie aan een onderzoek worden onderworpen en
      voorstellen kunnen worden gedaan voor gewenste veranderingen. Onze Minister zendt dit rapport, voorzien van zijn
      standpunt, aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.29
  - number: 2.30.1
    text: De commissie bestaat uit een voorzitter en ten minste vijftien en ten hoogste twintig andere leden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.30
  - number: 2.30.2
    text: |-
      De voorzitter en de andere leden van de commissie worden benoemd op grond van hun deskundigheid op het gebied van
      het vervaardigen van of van handelingen met genetisch gemodificeerde organismen en de mogelijke gevolgen daarvan
      voor mens en milieu, daarbij inbegrepen de ecologische gevolgen en de daarbij te nemen veiligheidsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.30
  - number: 2.31.1
    text: |-
      De voorzitter van de commissie wordt door Onze Minister benoemd. Onze Minister hoort de commissie alvorens hij de
      voorzitter benoemt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.31
  - number: 2.31.2
    text: Onze Minister benoemt ten minste veertien en ten hoogste negentien andere leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.31
  - number: 2.31.3
    text: De voorzitter en de leden worden voor de tijd van vier jaren benoemd. Zij zijn terstond weer benoembaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.31
  - number: 2.31.4
    text: |-
      De voorzitter en de leden kunnen te allen tijde hun functie neerleggen door een schriftelijke kennisgeving aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.31
  - number: 2.31.5
    text: |-
      Onze Minister kan in bijzondere gevallen de voorzitter en de andere leden in hun functie schorsen en uit hun
      functie ontslaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.31
  - number: 2.32.1
    text: De commissie wijst uit haar midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.32
  - number: 2.32.2
    text: |-
      De plaatsvervangend voorzitter kan te allen tijde zijn functie neerleggen door een schriftelijke kennisgeving aan
      de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.32
  - number: 2.32.3
    text: |-
      In bijzondere gevallen kan de commissie de plaatsvervangend voorzitter in zijn functie schorsen en uit zijn functie
      ontslaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.32
  - number: 2.33.1
    text: De commissie wordt bijgestaan door een secretaris. Aan de secretaris kan een adjunct-secretaris worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.33
  - number: 2.33.2
    text: |-
      De secretaris en de adjunct-secretaris worden door Onze Minister benoemd, in hun functie geschorst en uit hun
      functie ontslagen, de commissie gehoord.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.33
  - number: 2.33.3
    text: De secretaris is geen lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.33
  - number: 2.33.4
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.33
  - number: 2.33.5
    text: Onze Minister kan voorzien in een bureau voor de commissie, dat onder leiding staat van de secretaris.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.33
  - number: 2.34.1
    text: De commissie kan voor bepaalde onderwerpen subcommissies instellen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.34
  - number: 2.34.2
    text: De voorzitter van een subcommissie wordt door de commissie uit haar midden benoemd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.34
  - number: 2.35.1
    text: |-
      De commissie en haar subcommissies kunnen zich bij hun werkzaamheden doen bijstaan door personen die geen lid zijn
      van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.35
  - number: 2.35.2
    text: |-
      Onze Minister en Onze Ministers van Sociale Zaken en Werkgelegenheid, van Volksgezondheid, Welzijn en Sport en van
      Landbouw, Natuur en Voedselkwaliteit kunnen, ieder voor hun ministerie, ambtenaren aanwijzen, die bevoegd zijn tot
      het bijwonen van de door de commissie en haar subcommissies te houden vergaderingen, met dien verstande dat in de
      vergaderingen van de commissie voor ieder van die ministeries ten hoogste één ambtenaar aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.35
  - number: 2.36.1
    text: |-
      De vergaderingen van de commissie zijn openbaar. De commissie stelt bij haar in [artikel 2.40][ref1] bedoelde
      besluit regels betreffende de openbaarheid van de vergaderingen van de subcommissies.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.36.2
    text: |-
      Een vergadering of een gedeelte daarvan is niet openbaar in gevallen als bedoeld in
      [artikel 10, eerste lid, van de Wet openbaarheid van bestuur][ref1] en in gevallen waarin het belang van
      openbaarheid niet opweegt tegen de in [artikel 10, tweede lid][ref2], van die wet genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 2.37.1
    text: De adviezen van de commissie worden uitgebracht overeenkomstig het gevoelen van de meerderheid van de vergadering.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.37
  - number: 2.37.2
    text: Ter vergadering ingebrachte minderheidsstandpunten worden in of bij de adviezen vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.37
  - number: '2.38'
    text: |-
      De commissie houdt de op de door haar uitgebrachte adviezen betrekking hebbende voorbereidende stukken ter
      beschikking van Onze Minister en van de bestuursorganen, bedoeld in [artikel 2.27, eerste lid, onder b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.39.1
    text: |-
      De voorzitter van de commissie pleegt ten minste eenmaal per jaar overleg met Onze Minister over de door de
      commissie voorgenomen werkzaamheden voor de komende twaalf maanden. De commissie stelt vervolgens het programma van
      haar werkzaamheden vast en zendt dit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.39
  - number: 2.39.2
    text: |-
      Ten behoeve van de voorbereiding van het in het eerste lid bedoelde overleg stelt de commissie een overzicht van
      de door haar voorgenomen werkzaamheden op en legt dit tijdig aan Onze Minister voor. De commissie voegt bij het
      overzicht een raming van de met de uitvoering van de werkzaamheden gepaard gaande kosten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.39
  - number: 2.39.3
    text: |-
      De commissie oefent haar werkzaamheden uit binnen het raam van de middelen welke haar jaarlijks ingevolge de
      begrotingswet ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.39
  - number: '2.40'
    text: |-
      De commissie stelt nadere regels betreffende haar werkwijze en de werkwijze van haar subcommissies en zendt deze
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.40
  - number: 2.41.1
    text: |-
      Provinciale staten stellen een provinciale milieucommissie in, die door het provinciaal bestuur vooraf wordt
      gehoord over maatregelen en plannen, die van betekenis zijn voor het provinciale milieubeheer.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.41
  - number: 2.41.2
    text: De inspecteur is ambtshalve lid van de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel2.41
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt onder Onze Ministers verstaan: Onze Minister, te zamen met Onze Ministers van Verkeer en
      Waterstaat, van Landbouw, Natuurbeheer en Visserij en van Economische Zaken voor zover het onderdelen van het
      milieubeleid betreft, die tot hun verantwoordelijkheid behoren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1
  - number: 4.1a.1
    text: |-
      Indien ter uitvoering van een voor Nederland verbindend besluit van een volkenrechtelijke organisatie een plan
      of programma moet worden vastgesteld waarvoor geen grondslag in de wet is opgenomen en ten aanzien waarvan
      ingevolge artikel 2, tweede lid, van [richtlijn nr. 2003/35/EG](32003L0035) van het Europees Parlement en
      de Raad van 26 mei 2003 tot voorziening in inspraak van het publiek in de opstelling van bepaalde plannen
      en programma’s betreffende het milieu en, met betrekking tot inspraak van het publiek en toegang tot de
      rechter, tot wijziging van de [Richtlijnen 85/337/EEG](31985L0337) en [96/61/EG](31996L0061) van de Raad (PbEU
      L 156) in inspraak van het publiek moet worden voorzien, is op de voorbereiding van dat plan of programma
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. De eerste volzin is van overeenkomstige
      toepassing op een herziening van een plan of programma.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.1a.2
    text: |-
      Zienswijzen als bedoeld in [artikel 3:15 van de Algemene wet bestuursrecht][ref1] kunnen naar voren worden gebracht
      door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 4.1a.3
    text: |-
      Een wijziging van de in het eerste lid genoemde richtlijn of van een bijlage bij die richtlijn gaat voor de
      toepassing van dit hoofdstuk gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn
      gegeven, tenzij bij een besluit van Onze Minister, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1a
  - number: 4.1b.1
    text: |-
      Voorzover op de voorbereiding van een in deze wet voorzien plan of programma dat wordt genoemd in bijlage I bij
      [richtlijn nr. 2003/35/EG](32003L0035) van het Europees Parlement en de Raad van 26 mei 2003 tot voorziening
      in inspraak van het publiek in de opstelling van bepaalde plannen en programma’s betreffende het milieu en, met
      betrekking tot inspraak van het publiek en toegang tot de rechter, tot wijziging van de [Richtlijnen 85/337/
      EEG](31985L0337) en [96/61/EG](31996L0061) van de Raad (PbEU L 156), de procedure van toepassing is die is
      voorgeschreven in [hoofdstuk 7][ref1] of in de [Wet op de waterhuishouding][ref2], geldt uitsluitend die procedure
      en blijven de bepalingen die terzake in andere hoofdstukken, onderscheidenlijk in deze wet, zijn opgenomen,
      voorzover nodig buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004575
  - number: 4.1b.2
    text: |-
      Een wijziging van bijlage I bij de in het eerste lid genoemde richtlijn gaat voor de toepassing van dit hoofdstuk
      gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij een besluit
      van Onze Minister, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.1b
  - number: 4.2.1
    text: |-
      Het Rijksinstituut voor volksgezondheid en milieu, hierna aan te duiden als RIVM, brengt eenmaal in de vier
      jaar aan Onze Minister een wetenschappelijk rapport uit, waarin de ontwikkeling van de kwaliteit van het milieu
      wordt beschreven over een door Onze Minister aan te geven periode van ten minste de eerstvolgende tien jaar.
      In ieder geval wordt die ontwikkeling beschreven, uitgaande van de voor die periode meest waarschijnlijke
      ontwikkeling van de omstandigheden die daarvoor van belang zijn. Tevens worden in het rapport beschrijvingen
      opgenomen, die telkens uitgaan van andere ontwikkelingen van die omstandigheden, die zich, naar redelijkerwijs
      kan worden verondersteld, in de betrokken periode zouden kunnen voordoen. Het rapport wordt uitgebracht ten
      minste 6 maanden en ten hoogste 12 maanden voordat Onze Ministers het eerstvolgende nationale milieubeleidsplan
      vaststellen. Om aan deze verplichting te kunnen voldoen in gevallen waarin de geldingsduur van een nationaal
      milieubeleidsplan met toepassing van [artikel 4.6, tweede lid][ref1], wordt verlengd, kan worden afgeweken van de
      in [de eerste volzin][ref2] gestelde termijn van vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2.2
    text: |-
      Het RIVM brengt jaarlijks aan Onze Minister een wetenschappelijk rapport uit, waarin de ontwikkeling van de
      kwaliteit van het milieu wordt beschreven, die het resultaat is van de uitvoering van de beleidsmaatregelen die
      van invloed zijn op die kwaliteit en die in het jaar waarop het rapport betrekking heeft, van kracht waren. Daarbij
      wordt in ieder geval aangegeven in hoeverre die maatregelen hebben bijgedragen aan de verwezenlijking van de
      resultaten, waarvan in het geldende nationale milieubeleidsplan is aangegeven dat zij voor het betrokken jaar zijn
      beoogd. Tevens wordt aangegeven hoe de beschreven ontwikkeling van de kwaliteit van het milieu zich verhoudt tot de
      ontwikkeling daarvan die is beschreven in de overeenkomstige eerder uitgebrachte rapporten. Indien zich onvoorzien
      een omstandigheid voordoet die belangrijke gevolgen kan hebben voor de ontwikkeling van de kwaliteit van het milieu
      op langere termijn, en Onze Minister daarom verzoekt, neemt het RIVM in een rapport tevens een beschrijving op van
      die ontwikkeling die daarvan het resultaat kan zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Onze Minister wijst, te zamen met - ieder voor zover het hem aangaat - Onze Ministers van Verkeer en Waterstaat,
      van Economische Zaken en van Landbouw, Natuurbeheer en Visserij, overheidsinstellingen aan, die door het RIVM
      in ieder geval worden betrokken bij het opstellen van de rapporten. Een overheidsinstelling komt voor aanwijzing
      slechts in aanmerking indien zij in staat is naar organisatie, personeel en uitrusting de voor het opstellen van de
      rapporten nodige werkzaamheden op passend wetenschappelijk niveau te verrichten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Onze Minister kan, te zamen met - ieder voor zover het hem aangaat - Onze Ministers van Verkeer en Waterstaat,
      van Economische Zaken en van Landbouw, Natuurbeheer en Visserij, regels stellen ten aanzien van de wijze waarop de
      krachtens het derde lid aangewezen overheidsinstellingen bij het opstellen van de rapporten worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2
  - number: 4.2a.1
    text: |-
      Onze Minister kan aanwijzingen geven omtrent veronderstelde ontwikkelingen die in ieder geval als grondslag
      voor beschrijvingen als bedoeld in [artikel 4.2, eerste lid][ref1], moeten worden aangenomen. Hij kan tevens
      aanwijzingen geven omtrent onderwerpen die in ieder geval in een rapport, als bedoeld in dat artikellid, moeten
      worden beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2a.2
    text: |-
      Behoudens het in het [artikel 4.2, tweede lid, vierde volzin][ref1], en in het eerste lid van dit artikel bepaalde,
      geven Onze betrokken Ministers het RIVM en de krachtens [artikel 4.2, derde lid][ref2], aangewezen instellingen
      geen aanwijzingen met betrekking tot de inhoud van de rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2a.3
    text: |-
      Onze Minister zendt de rapporten aan de Staten-Generaal; een rapport als bedoeld in
      [artikel 4.2, eerste lid][ref1], voor of gelijktijdig met het eerstvolgende nationale milieubeleidsplan; een
      rapport als bedoeld in [artikel 4.2, tweede lid][ref2], voor of gelijktijdig met het eerstvolgende nationale
      milieuprogramma. Het RIVM draagt ervoor zorg dat de rapporten algemeen verkrijgbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2b
    text: |-
      Ten behoeve van het opstellen van milieubeleidsplannen en van milieuprogramma’s verschaffen de onderscheidene
      overheidsorganen elkaar desgevraagd alle inlichtingen en gegevens, waarover zij kunnen beschikken, voor zover die
      voor dat opstellen redelijkerwijs noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.2b
  - number: 4.3.1
    text: |-
      Onze Ministers stellen ten minste eenmaal in de vier jaar een nationaal milieubeleidsplan vast, dat met het oog op
      de bescherming van het milieu richting geeft aan van rijkswege in de eerstvolgende vier jaar te nemen beslissingen,
      en dat naar verwachting tevens richting zal kunnen geven aan in de daarop volgende vier jaar te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Het plan bevat de hoofdzaken van het door de regering te voeren milieubeleid, dat in het bijzonder is gericht op
      een ontwikkeling die voorziet in de behoeften van de huidige generatie, zonder daarmee voor toekomstige generaties
      de mogelijkheden in gevaar te brengen om ook in hun behoeften te voorzien, en op het bereiken van een zo hoog
      mogelijk niveau van bescherming van het milieu als redelijkerwijze te bereiken is. De mogelijke ontwikkelingen
      in de samenleving en de gewenste kwaliteit van het milieu op lange termijn, alsmede de daarvoor van belang zijnde
      internationale ontwikkelingen, worden in het plan in beschouwing genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3
    text: 'Tot deze hoofdzaken behoren ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3.a
    text: |-
      de in de betrokken periode van acht jaar en, voor zover deze redelijkerwijze zijn aan te geven, de in de
      eerstvolgende vier jaar beoogde resultaten inzake de kwaliteit van de onderscheidene onderdelen van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3.b
    text: |-
      de in de betrokken periode van acht jaar en, voor zover deze redelijkerwijze zijn aan te geven, de in de
      eerstvolgende vier jaar beoogde resultaten inzake het voorkomen, beperken of ongedaan maken van gevolgen van
      menselijke activiteiten die het milieu verontreinigen, aantasten of uitputten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3.c
    text: |-
      de aanduiding van gebieden waarin de kwaliteit van het milieu of van een of meer onderdelen daarvan bijzondere
      bescherming behoeft;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3.d
    text: |-
      de wijze waarop het bereiken en instandhouden van de onder a , b en c bedoelde resultaten zal worden nagestreefd
      en de termijnen die daarbij zullen worden gehanteerd, alsmede de mate van prioriteit die aan het bereiken van die
      resultaten wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.3.e
    text: de redelijkerwijze te verwachten financiële, economische en ruimtelijke gevolgen van het te voeren milieubeleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
  - number: 4.3.4
    text: |-
      In het plan geven Onze Ministers voorts aan in hoeverre het voorgenomen beleid is afgestemd op, dan
      wel leidt tot aanpassing van het nationale waterhuishoudingsbeleid en het nationale natuurbeleid, en
      in hoeverre en binnen welke termijn zij voornemens zijn de nota voor de waterhuishouding, bedoeld in
      [artikel 3, eerste lid, van de Wet op de waterhuishouding][ref1], respectievelijk het Natuurbeleidsplan, bedoeld in
      [artikel 4 van de Natuurbeschermingswet 1998][ref2] te herzien. Met het geldende nationale milieubeleidsplan wordt
      tevens rekening gehouden bij de vaststelling van beleid op andere beleidsterreinen, voor zover daarbij het belang
      van de bescherming van het milieu wordt geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '4'
  - number: 4.4.1
    text: |-
      Onze Ministers betrekken bij de voorbereiding van het nationale milieubeleidsplan de naar hun oordeel bij de te
      behandelen onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties. Daartoe behoren in elk
      geval gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Op de voorbereiding van het nationale milieubeleidsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.5.1
    text: |-
      Zodra het nationale milieubeleidsplan is vastgesteld, doen Onze Ministers hiervan mededeling door overlegging van
      het plan aan de Staten-Generaal en door toezending ervan aan gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Onze Minister maakt de vaststelling bekend in de *Staatscourant*. Hierbij geeft hij aan op welke wijze kennis kan
      worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Het nationale milieubeleidsplan geldt met ingang van een bij besluit van Onze Ministers vast te stellen tijdstip.
      Een besluit als bedoeld in [de eerste volzin][ref1], wordt niet eerder genomen dan acht weken nadat het plan
      ingevolge [artikel 4.5, eerste lid][ref2], is overgelegd aan de Staten-Generaal. Indien door of namens een der
      kamers der Staten-Generaal binnen acht weken nadat het plan is overgelegd, te kennen wordt gegeven dat zij over
      het plan in het openbaar wil beraadslagen, wordt een besluit als bedoeld in [de eerste volzin][ref3], niet eerder
      genomen dan zes maanden na de overlegging van het plan, dan wel, indien de beraadslagingen op een eerder tijdstip
      zijn beëindigd, na die beraadslagingen. Onze Ministers stellen de Staten-Generaal schriftelijk op de hoogte van de
      gevolgtrekkingen die zij aan de beraadslagingen verbinden voor het nationale milieubeleid en voor de uitvoering van
      het plan. Onze Minister maakt een besluit als bedoeld in [de eerste volzin][ref4], bekend in de *Staatscourant* en
      vermeldt daarbij de gevolgtrekkingen die aan de Staten-Generaal zijn meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.6.2
    text: |-
      Het plan geldt, behoudens ingeval eerder een nieuw plan is vastgesteld, voor een tijdvak van vier jaar. Onze
      Ministers kunnen de geldingsduur van het plan eenmaal met ten hoogste twee jaar verlengen. Onze Minister doet
      mededeling van een besluit als bedoeld in [de tweede volzin][ref1], door overlegging van het besluit aan de Staten-
      Generaal en maakt het bekend in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.6.3
    text: |-
      De organen van het Rijk houden in elk geval rekening met het geldende nationale milieubeleidsplan bij het nemen van
      een besluit dat daartoe is aangewezen in deze wet, en bij het nemen van een besluit krachtens een wet, genoemd in
      de bij deze wet behorende bijlage, voor zover daarbij het belang van de bescherming van het milieu in beschouwing
      moet of kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
  - number: 4.6.4
    text: 'Het derde lid is niet van toepassing op besluiten:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
  - number: 4.6.4.a
    text: |-
      met betrekking tot een nota voor de waterhuishouding als bedoeld in
      [artikel 3, eerste lid, van de Wet op de waterhuishouding][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '3'
  - number: 4.6.4.b
    text: |-
      die door een orgaan van het Rijk worden genomen in de plaats van een orgaan van een ander openbaar lichaam, wegens
      het in gebreke blijven van dat orgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
  - number: 4.6.5
    text: |-
      Voor de toepassing van het derde lid worden gevolgtrekkingen die overeenkomstig het bepaalde in het eerste lid aan
      de Staten-Generaal zijn meegedeeld, aangemerkt als onderdeel van het plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.6
  - number: 4.7.1
    text: Onze Ministers stellen jaarlijks een nationaal milieuprogramma vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.2
    text: 'Het programma bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.2.a
    text: |-
      een programma van van rijkswege in de eerstvolgende vier jaar te verrichten activiteiten ter bescherming van het
      milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.2.b
    text: |-
      een programma voor de vaststelling en herziening van milieukwaliteitseisen krachtens
      [artikel 5.1, eerste lid][ref1], onder aanduiding van de daarbij beoogde resultaten;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.7.2.c
    text: |-
      een overzicht van de in de onderscheidene begrotingshoofdstukken opgenomen begrotingsposten op het gebied van het
      milieubeheer, alsmede een aanduiding van de financiële gevolgen van de onder a bedoelde activiteiten voor het Rijk
      voor de volgende jaren;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.2.d
    text: een verslag van de voortgang van de uitvoering van het geldende nationale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.3
    text: Bij de vaststelling van het programma houden Onze Ministers rekening met het geldende nationale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Op de voorbereiding van het nationale milieuprogramma is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.8.1
    text: |-
      Onze Minister maakt het nationale milieuprogramma bekend door het bij de aanbieding van de rijksbegroting over te
      leggen aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.8
  - number: 4.8.2
    text: Onze Minister doet van het programma mededeling door toezending aan gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.8
  - number: 4.9.1
    text: |-
      Provinciale staten stellen ten minste eenmaal in de vier jaar een provinciaal milieubeleidsplan vast, dat met het
      oog op de bescherming van het milieu richting geeft aan in de eerstvolgende vier jaar te nemen beslissingen van
      het provinciaal bestuur en van bestuursorganen waaraan provinciale bevoegdheden zijn gedelegeerd bij de uitoefening
      waarvan met het plan rekening moet worden gehouden, en dat naar verwachting tevens richting zal kunnen geven aan in
      de daarop volgende vier jaar te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.2
    text: Het plan bevat de hoofdzaken van het door het provinciaal bestuur te voeren milieubeleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.3
    text: 'Tot deze hoofdzaken behoren ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.3.a
    text: |-
      de in de betrokken periode van acht jaar en, voor zover deze redelijkerwijze zijn aan te geven, de in de
      eerstvolgende vier jaar beoogde resultaten inzake de kwaliteit van de onderscheidene onderdelen van het milieu,
      mede gelet op de krachtens of overeenkomstig [artikel 5.1, eerste lid][ref1], vastgestelde grenswaarden en
      richtwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.9.3.b
    text: |-
      de in de betrokken periode van acht jaar en, voor zover deze redelijkerwijze zijn aan te geven, de in de
      eerstvolgende vier jaar beoogde resultaten inzake het voorkomen, beperken of ongedaan maken van gevolgen van
      menselijke activiteiten die het milieu verontreinigen, aantasten of uitputten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.3.c
    text: |-
      de aanduiding van gebieden waarin de kwaliteit van het milieu of van een of meer onderdelen daarvan bijzondere
      bescherming behoeft;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.3.d
    text: |-
      de wijze waarop het bereiken en instandhouden van de onder *a*, *b* en *c* bedoelde resultaten door de in het
      eerste lid bedoelde bestuursorganen zal worden nagestreefd en de termijnen die daarbij zullen worden gehanteerd,
      alsmede de mate van prioriteit die aan het bereiken van die resultaten wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.3.e
    text: de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren milieubeleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.4
    text: 'Tot de gebieden, bedoeld in het derde lid, onder *c*, behoren ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.4.a
    text: de gebieden die krachtens de Natuurbeschermingswet zijn aangewezen als beschermd natuurmonument, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.4.b
    text: |-
      de gebieden die zijn aangewezen ter uitvoering van de Overeenkomst inzake watergebieden van internationale
      betekenis, in het bijzonder als verblijfplaats voor watervogels (Conventie van Ramsar, *Trb.* 1975, 84),
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
  - number: 4.9.5
    text: |-
      In het plan geven provinciale staten voorts aan in hoeverre het voorgenomen beleid is afgestemd op, dan wel leidt
      tot aanpassing van het provinciale waterhuishoudingsbeleid, het provinciale ruimtelijk beleid of het provinciale
      verkeers- en vervoerbeleid en in hoeverre en binnen welke termijn zij voornemens zijn het geldende provinciale
      plan voor de waterhuishouding, bedoeld in [artikel 7, eerste lid, van de Wet op de waterhuishouding][ref1]‘ een
      of meer geldende streekplannen als bedoeld in [artikel 4a van de Wet op de Ruimtelijke Ordening][ref2] of het
      geldende provinciale verkeers- en vervoerplan als bedoeld in [artikel 5 van de Planwet verkeer en vervoer][ref3],
      te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0009642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0009642
        artikel: '5'
  - number: 4.10.1
    text: Het provinciale milieubeleidsplan wordt voorbereid door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Gedeputeerde staten betrekken bij de voorbereiding van het plan de naar hun oordeel bij de te behandelen
      onderwerpen meest belanghebbende overheidsorganen. Daartoe behoren in elk geval:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
  - number: 4.10.2.a
    text: gedeputeerde staten van de aangrenzende provincies,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
  - number: 4.10.2.b
    text: |-
      de bestuursorganen waaraan provinciale bevoegdheden zijn gedelegeerd bij de uitoefening waarvan met het plan
      rekening moet worden gehouden, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
  - number: 4.10.2.c
    text: Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
  - number: 4.10.3
    text: |-
      Gedeputeerde staten betrekken bij de voorbereiding van het plan voorts de ingezetenen en belanghebbenden, op de
      wijze voorzien in de krachtens [artikel 147 van de Provinciewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel147
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '147'
  - number: 4.11.1
    text: |-
      Zodra het provinciale milieubeleidsplan is vastgesteld, doen gedeputeerde staten hiervan mededeling door toezending
      van het plan aan Onze Minister en aan de bestuursorganen waaraan provinciale bevoegdheden zijn gedelegeerd bij de
      uitoefening waarvan met het plan rekening moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Gedeputeerde staten maken de vaststelling bekend in de *Staatscourant*. Hierbij geven zij aan op welke wijze kennis
      kan worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Het provinciale milieubeleidsplan geldt, behoudens ingeval eerder een nieuw plan is vastgesteld, voor een tijdvak
      van vier jaar nadat de vaststelling ervan overeenkomstig [artikel 4.11, tweede lid][ref1], is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.12.2
    text: |-
      Provinciale staten kunnen de geldingsduur van het plan eenmaal met ten hoogste twee jaar verlengen. Gedeputeerde
      staten doen mededeling van een besluit als bedoeld in [de eerste volzin][ref1], door toezending daarvan aan Onze
      Minister en aan de bestuursorganen waaraan provinciale bevoegdheden zijn gedelegeerd bij de uitoefening waarvan met
      het plan rekening moet worden gehouden. Zij maken het bekend in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.12.3
    text: |-
      Het provinciaal bestuur houdt in elk geval rekening met het geldende provinciale milieubeleidsplan bij het
      nemen van een besluit dat daartoe is aangewezen in deze wet, en bij het nemen van een besluit krachtens een wet,
      genoemd in de bij deze wet behorende bijlage, voor zover daarbij het belang van de bescherming van het milieu in
      beschouwing moet of kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.12.4
    text: 'Het derde lid is niet van toepassing op besluiten:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.12.4.a
    text: |-
      met betrekking tot een provinciaal plan voor de waterhuishouding als bedoeld in
      [artikel 7, eerste lid, van de Wet op de waterhuishouding][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '7'
  - number: 4.12.4.b
    text: |-
      die door het provinciaal bestuur worden genomen in de plaats van een orgaan van een ander openbaar lichaam, wegens
      het in gebreke blijven van dat orgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.12.5
    text: 'Het derde lid is van overeenkomstige toepassing op besluiten:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.12.5.a
    text: |-
      die door een orgaan van een ander openbaar lichaam worden genomen in de plaats van het provinciaal bestuur, wegens
      het in gebreke blijven van dat bestuur;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.12.5.b
    text: krachtens een provinciale bevoegdheid die aan een orgaan van een ander openbaar lichaam is overgedragen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Onze Ministers kunnen, voor zover dat in het algemeen belang geboden is, gedeputeerde staten gehoord, aan
      provinciale staten aanwijzingen geven omtrent de inhoud van het provinciale milieubeleidsplan. Bij een aanwijzing
      wordt een termijn gesteld, binnen welke het plan in overeenstemming met de aanwijzing moet zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      Bij het geven van een aanwijzing houden Onze Ministers rekening met het geldende nationale milieubeleidsplan en het
      geldende afvalbeheersplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.13
  - number: 4.13.3
    text: |-
      Onze Minister doet van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan de
      Staten-Generaal en door plaatsing ervan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.13
  - number: 4.14.1
    text: Gedeputeerde staten stellen jaarlijks een provinciaal milieuprogramma vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.2
    text: 'Het programma bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.2.a
    text: |-
      een programma van door het provinciale bestuur in de eerstvolgende vier jaar te verrichten activiteiten ter
      bescherming van het milieu, daaronder begrepen:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.2.a.1°
    text: |-
      een overzicht van onderzoeksgevallen en gevallen van ernstige verontreiniging als bedoeld in
      [artikel 1 van de Wet bodembescherming][ref1], alsmede, met betrekking tot die gevallen, een overzicht van de door
      of vanwege het provinciaal bestuur, onderscheidenlijk van de aan het provinciaal bestuur bekende door anderen in de
      eerstvolgende vier jaren te verrichten activiteiten en een aanduiding van het tijdstip waarop met het onderzoek of
      de sanering van die gevallen zal of dient worden aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '1'
  - number: 4.14.2.a.2°
    text: een overzicht van de in de volgende vier jaren noodzakelijke maatregelen tot bestrijding van de geluidhinder;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.2.b
    text: |-
      een overzicht van de financiële gevolgen van de onder a, onder 2°, bedoelde activiteiten, met inbegrip van de
      subsidies die met het oog daarop aan het Rijk worden gevraagd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.2.c
    text: een verslag van de voortgang van de uitvoering van het geldende provinciale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Bij de vaststelling van het programma houden gedeputeerde staten rekening met het geldende provinciale
      milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      [Artikel 4.10, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.15.2
    text: |-
      Gedeputeerde staten maken het programma bekend door het bij het ontwerp van de begroting over te leggen aan
      provinciale staten. Zij doen gelijktijdig mededeling van het programma door toezending aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15
  - number: 4.15.3
    text: |-
      [Artikel 4.11, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.15a.1
    text: |-
      Het algemeen bestuur van een plusregio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1]
      die de gemeente of gemeenten Amsterdam, Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-
      Gravenhage, Rotterdam of Utrecht omvat, kan een regionaal milieubeleidsplan vaststellen, dat met het oog op de
      bescherming van het milieu richting geeft aan beslissingen tot het nemen waarvan de bevoegdheid bij of krachtens de
      wet aan een orgaan van dat lichaam is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 4.15a.2
    text: |-
      [De artikelen 4.13][ref1], [4.16, tweede lid][ref2], [4.17][ref3], [4.18][ref4] en [4.19][ref5] zijn van
      overeenkomstige toepassing, met dien verstande dat naast de in [artikel 4.17, tweede lid][ref6], genoemde
      bestuursorganen ook burgemeester en wethouders van de in de plusregio gelegen gemeenten bij de voorbereiding van
      het plan worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.15b.1
    text: |-
      Het dagelijks bestuur van een plusregio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1]
      die de gemeente of gemeenten Amsterdam, Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-
      Gravenhage, Rotterdam of Utrecht omvat, stelt jaarlijks een milieuprogramma vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15b
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: 4.15b.2
    text: |-
      [De artikelen 4.20, tweede en derde lid][ref1], en [4.21][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat het programma naast de in [artikel 4.20, tweede lid][ref3], genoemde onderdelen ook een verslag van
      de voortgang van de uitvoering van het geldende regionale milieubeleidsplan bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.15b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.16.1
    text: |-
      De gemeenteraad kan een gemeentelijk milieubeleidsplan vaststellen, dat met het oog op de bescherming van het
      milieu richting geeft aan door het gemeentebestuur te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.16
  - number: 4.16.2
    text: Het plan bevat de hoofdzaken van het door het gemeentebestuur te voeren milieubeleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.16
  - number: 4.17.1
    text: Het gemeentelijke milieubeleidsplan wordt voorbereid door burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
  - number: 4.17.2
    text: |-
      Burgemeester en wethouders betrekken bij de voorbereiding van het plan de naar hun oordeel bij de te behandelen
      onderwerpen meest belanghebbende bestuursorganen. Daartoe behoren in elk geval:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
  - number: 4.17.2.a
    text: gedeputeerde staten,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
  - number: 4.17.2.b
    text: burgemeester en wethouders van de aangrenzende gemeenten, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
  - number: 4.17.2.c
    text: Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
  - number: 4.17.3
    text: |-
      Burgemeester en wethouders betrekken bij de voorbereiding van het plan voorts de ingezetenen en belanghebbenden, op
      de wijze voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 4.18.1
    text: |-
      Zodra het gemeentelijke milieubeleidsplan is vastgesteld, doen burgemeester en wethouders hiervan mededeling door
      toezending van het plan aan gedeputeerde staten en aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Burgemeester en wethouders maken de vaststelling bekend in één of meer dag- of nieuwsbladen die in de gemeente
      verspreid worden. Hierbij geven zij aan op welke wijze kennis kan worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.18
  - number: 4.19.1
    text: |-
      Bij de vaststelling van het gemeentelijke milieubeleidsplan bepaalt de gemeenteraad het tijdvak gedurende hetwelk
      het geldt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.19
  - number: 4.19.2
    text: |-
      De gemeenteraad kan de geldingsduur eenmaal met ten hoogste twee jaar verlengen. Artikel 4.18, tweede lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      Indien in de gemeente een gemeentelijk milieubeleidsplan geldt, houdt het gemeentebestuur in elk geval rekening
      met dat plan bij het nemen van een besluit dat daartoe is aangewezen in deze wet, en bij het nemen van een besluit
      krachtens een wet, genoemd in de bij deze wet behorende bijlage, voor zover daarbij het belang van de bescherming
      van het milieu in beschouwing moet of kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.19
  - number: 4.19.4
    text: |-
      Het derde lid is niet van toepassing op besluiten krachtens een bevoegdheid van een ander openbaar lichaam, die aan
      het gemeentebestuur is gedelegeerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.19
  - number: 4.19.5
    text: |-
      Het derde lid is van overeenkomstige toepassing op besluiten die door een orgaan van een ander openbaar lichaam
      worden genomen in de plaats van het gemeentebestuur, wegens het in gebreke blijven van dat bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.19
  - number: 4.20.1
    text: De gemeenteraad stelt jaarlijks voor een daarbij vast te stellen periode een gemeentelijk milieuprogramma vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.20
  - number: 4.20.2
    text: 'Het programma bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.20
  - number: 4.20.2.a
    text: |-
      een programma van door het gemeentebestuur in de betrokken periode te verrichten activiteiten ter uitvoering van de
      bij wettelijk voorschrift met het oog op de bescherming van het milieu aan het gemeentebestuur opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.20
  - number: 4.20.2.b
    text: |-
      een overzicht van de financiële gevolgen van [de onder ][ref1] bedoelde activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 4.20.3
    text: |-
      Indien in de gemeente een gemeentelijk milieubeleidsplan geldt, houdt de gemeenteraad met dat plan rekening bij de
      vaststelling van een gemeentelijk milieuprogramma.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.20
  - number: 4.21.1
    text: |-
      Het gemeentelijke milieuprogramma wordt voorbereid door burgemeester en wethouders. Burgemeester en wethouders
      leggen het ontwerp van het programma bij het ontwerp van de begroting voor aan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      [Artikel 4.17, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.21.3
    text: |-
      Zodra het gemeentelijke milieuprogramma is vastgesteld, doen burgemeester en wethouders hiervan mededeling door
      toezending van het programma aan gedeputeerde staten en aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.21
  - number: 4.21.4
    text: |-
      Burgemeester en wethouders maken de vaststelling bekend in één of meer dag- of nieuwsbladen die in de gemeente
      verspreid worden. Hierbij geven zij aan op welke wijze kennis kan worden gekregen van de inhoud van het programma.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.21
  - number: 4.22.1
    text: De gemeenteraad stelt telkens voor een daarbij vast te stellen periode een gemeentelijk rioleringsplan vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.22.2
    text: 'Het plan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.22.2.a
    text: |-
      een overzicht van de in de gemeente aanwezige voorzieningen voor de inzameling en het transport van afvalwater en
      een aanduiding van het tijdstip waarop die voorzieningen naar verwachting aan vervanging toe zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.22.2.b
    text: |-
      een overzicht van de in de door het plan bestreken periode aan te leggen of te vervangen voorzieningen als bedoeld
      [onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.22.2.c
    text: |-
      een overzicht van de wijze waarop de voorzieningen, bedoeld [onder ][ref1] en [][ref2], worden of zullen worden
      beheerd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.22.2.d
    text: |-
      de gevolgen voor het milieu van de aanwezige voorzieningen als bedoeld onder *a*, en van de in het plan
      aangekondigde activiteiten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.22.2.e
    text: een overzicht van de financiële gevolgen van de in het plan aangekondigde activiteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.22.3
    text: |-
      Indien in de gemeente een gemeentelijk milieubeleidsplan geldt, houdt de gemeenteraad met dat plan rekening bij de
      vaststelling van een gemeentelijk rioleringsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.22
  - number: 4.23.1
    text: |-
      Het gemeentelijke rioleringsplan wordt voorbereid door burgemeester en wethouders. Zij betrekken bij de
      voorbereiding van het plan in elk geval:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.23.1.a
    text: gedeputeerde staten,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.23.1.b
    text: de beheerders van de zuiveringstechnische werken waarnaar het ingezamelde afvalwater wordt getransporteerd, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.23.1.c
    text: de beheerders van de oppervlaktewateren waarop het ingezamelde water wordt geloosd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.23.2
    text: |-
      Zodra het plan is vastgesteld, doen burgemeester en wethouders hiervan mededeling door toezending van het plan aan
      de in het eerste lid, onder a tot en met c, genoemde instanties, en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.23.3
    text: |-
      Burgemeester en wethouders maken de vaststelling bekend in één of meer dag- of nieuwsbladen die in de gemeente
      verspreid worden. Hierbij geven zij aan op welke wijze kennis kan worden gekregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.23
  - number: 4.24.1
    text: |-
      Gedeputeerde staten kunnen, nadat burgemeester en wethouders in de gelegenheid zijn gesteld hun zienswijze naar
      voren te brengen, aan de gemeenteraad aanwijzingen geven omtrent de inhoud van het gemeentelijk rioleringsplan.
      Bij een aanwijzing wordt een termijn gesteld, binnen welke het plan in overeenstemming met de aanwijzing moet zijn
      gebracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.24
  - number: 4.24.2
    text: |-
      Bij het geven van een aanwijzing houden gedeputeerde staten rekening met het geldende provinciale milieubeleidsplan
      en met het geldende provinciale waterhuishoudingsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel4.24
  - number: 5.1.1
    text: |-
      In het belang van de bescherming van het milieu kunnen, voor zover dit van meer dan provinciaal belang is, bij
      algemene maatregel van bestuur eisen worden gesteld ten aanzien van de kwaliteit van onderdelen van het milieu
      vanaf een daarbij te bepalen tijdstip. Bij een maatregel als bedoeld in de eerste volzin, kunnen alarmdrempels
      worden vastgesteld ter uitvoering van een richtlijn van de Raad van de Europese Unie, vastgesteld overeenkomstig
      artikel 4 van de EG-kaderrichtlijn luchtkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Bij de beslissing tot het vaststellen van een algemene maatregel van bestuur als bedoeld in het eerste lid, worden
      in ieder geval betrokken:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2.a
    text: de beschikbare wetenschappelijke en technische gegevens,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2.b
    text: de beschikbare gegevens inzake de bestaande toestand van het milieu,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2.c
    text: de redelijkerwijs te verwachten ontwikkelingen die van belang zijn met het oog op de bescherming van het milieu,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2.d
    text: |-
      de mogelijkheid om de risico’s voor het milieu als gevolg van de bij het stellen van de eis in aanmerking te nemen
      milieubelastende factoren zo klein als redelijkerwijze mogelijk is te maken, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.2.e
    text: |-
      de redelijkerwijs te verwachten, uit de verwerkelijking van de te stellen eis voortvloeiende financiële en
      economische gevolgen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Bij een maatregel als bedoeld in het eerste lid, wordt ten aanzien van de daarbij gestelde milieukwaliteitseisen
      bepaald of zij worden aangemerkt als grenswaarde of als richtwaarde. Een grenswaarde geeft de kwaliteit aan die
      op het in de maatregel aangegeven tijdstip ten minste moet zijn bereikt, en die, waar zij aanwezig is, ten minste
      moet worden instandgehouden. Een richtwaarde geeft de kwaliteit aan die op het in de maatregel aangegeven tijdstip
      zoveel mogelijk moet zijn bereikt, en die, waar zij aanwezig is, zoveel mogelijk moet worden instandgehouden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.4
    text: |-
      Bij een maatregel als bedoeld in het eerste lid kan worden bepaald dat een daarbij gestelde milieukwaliteitseis
      slechts geldt voor een of meer bij of krachtens de maatregel aan te wijzen gebieden, dan wel voor gebieden
      die behoren tot een bij de maatregel aangegeven categorie. Een tijdstip als bedoeld in het eerste lid kan voor
      verschillende bij of krachtens de maatregel aan te geven gebieden of categorieën van gebieden verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.1.5
    text: |-
      Bij een maatregel als bedoeld in het eerste lid wordt ten aanzien van de daarbij gestelde milieukwaliteitseisen
      een termijn bepaald, voor het verstrijken waarvan Onze Minister en, voor zover het onderdelen van het milieubeleid
      betreft die tot hun verantwoordelijkheid behoren, Onze Ministers van Verkeer en Waterstaat en van Landbouw,
      Natuur en Voedselkwaliteit dienen aan te geven in hoeverre de desbetreffende milieukwaliteitseis naar hun oordeel
      herziening behoeft. Indien een gestelde milieukwaliteitseis niet een zodanige waarde heeft dat redelijkerwijs kan
      worden aangenomen dat, indien aan die eis is voldaan, de risico’s voor het milieu als gevolg van de bij het stellen
      van de eis in aanmerking genomen milieubelastende factoren verwaarloosbaar klein zijn, bedraagt de termijn, bedoeld
      in de vorige volzin, ten hoogste acht jaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], worden de bevoegdheden aangewezen bij de
      uitoefening waarvan de bij de maatregel gestelde grenswaarden in acht moeten worden genomen, of met de bij de
      maatregel gestelde richtwaarden rekening moet worden gehouden. Bij de maatregel kunnen voorts regels worden gesteld
      met betrekking tot de wijze waarop aan de daarin opgenomen verplichtingen uitvoering moet worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2.2
    text: |-
      Het eerste lid vindt slechts toepassing voor zover de wettelijke regeling waarop een bevoegdheid als bedoeld in dat
      lid berust, zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2
  - number: 5.2.3
    text: |-
      Indien in een gebied waarvoor een milieukwaliteitseis geldt, voor het betrokken onderdeel van het milieu de
      kwaliteit beter is dan de eis aangeeft, treedt die kwaliteit voor de toepassing van de krachtens het eerste lid
      aangewezen bevoegdheden voor dit gebied in de plaats van de in de eis aangegeven kwaliteit. In een maatregel als
      bedoeld in [artikel 5.1, eerste lid][ref1], kan worden bepaald dat [de eerste volzin][ref2] ten aanzien van de
      daarbij gestelde milieukwaliteitseis niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2.4
    text: |-
      Indien bij de uitoefening van een bevoegdheid ten aanzien waarvan krachtens het eerste lid is bepaald dat daarbij
      rekening moet worden gehouden met een richtwaarde, van die waarde wordt afgeweken, vermeldt de motivering van het
      desbetreffende besluit in ieder geval welke gewichtige redenen daartoe hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2
  - number: 5.2a.1
    text: |-
      Indien bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], grenswaarden zijn gesteld ter uitvoering
      van een richtlijn van de Raad van de Europese Unie, vastgesteld overeenkomstig artikel 4 van de EG-kaderrichtlijn
      luchtkwaliteit, bevat die maatregel regels met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2a.1.a
    text: |-
      het opstellen en uitvoeren van een plan of programma als bedoeld in artikel 8, derde lid, en bijlage IV van de EG-
      kaderrichtlijn luchtkwaliteit;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
  - number: 5.2a.1.b
    text: het opstellen van verslagen over de voortgang van de uitvoering van een plan of programma als bedoeld onder a en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
  - number: 5.2a.1.c
    text: |-
      het opstellen van actieplannen waarin wordt vermeld welke maatregelen bij een dreigende overschrijding van
      grenswaarden op korte termijn moeten worden genomen als bedoeld in artikel 7, derde lid, van de EG-kaderrichtlijn
      luchtkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
  - number: 5.2a.2
    text: |-
      Bij het stellen van de in het eerste lid bedoelde regels worden artikel 8, vierde lid, en artikel 11, eerste lid,
      onder a, sub iv, van de EG-kaderrichtlijn luchtkwaliteit in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
  - number: 5.2a.3
    text: |-
      Bij de maatregel kan worden bepaald dat een plan, programma of verslag als bedoeld in het eerste lid, of gedeelten
      daarvan, onderdeel uitmaken van het nationale milieubeleidsplan, het nationale milieuprogramma, het provinciale
      milieubeleidsplan, het provinciale milieuprogramma, het regionale milieubeleidsplan, het regionale milieuprogramma
      of het gemeentelijke milieuprogramma, bedoeld in de [artikelen 4.3][ref1], [4.7][ref2], [4.9][ref3], [4.14][ref4],
      [4.15a][ref5], [4.15b][ref6] onderscheidenlijk [4.20][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5a
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.5b
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: 5.2b.1
    text: |-
      Bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], ter uitvoering van de kaderrichtlijn water,
      wordt aan provinciale staten opgedragen milieukwaliteitseisen, voorzover die niet zijn vastgesteld bij een
      maatregel op grond van [artikel 5.1, eerste lid][ref2], in een provinciale milieuverordening als bedoeld in
      [artikel 5.5, eerste lid][ref3], vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2b.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld die provinciale staten bij de vaststelling van de
      eisen in de provinciale milieuverordening in daarbij aan te wijzen gevallen in acht moeten nemen. Een zodanige
      regeling wordt vastgesteld door Onze Minister tezamen met Onze Ministers van Verkeer en Waterstaat en van Landbouw,
      Natuur en Voedselkwaliteit, ieder voor zover het aangelegenheden betreft die mede tot zijn verantwoordelijkheid
      behoren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2b
  - number: 5.2b.3
    text: |-
      Bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], wordt overeenkomstig artikel 4, vierde, vijfde en
      zevende lid, van de kaderrichtlijn water bepaald in hoeverre en onder welke voorwaarden kan worden afgeweken van de
      eisen en streeftermijnen van artikel 4, eerste en tweede lid, van de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.2b.4
    text: |-
      De kwaliteit van oppervlaktewateren en grondwatervoorkomens waarvoor milieukwaliteitseisen gelden mag niet
      verslechteren, behoudens voor zover overeenkomstig artikel 4, zesde of zevende lid, van de kaderrichtlijn water bij
      een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], is bepaald dat een achteruitgang is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.1
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van milieukwaliteitseisen regels worden gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.1.a
    text: |-
      de wijze waarop en de frequentie waarmee de kwaliteit van de betrokken onderdelen van het milieu gemeten of
      berekend wordt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.1.b
    text: |-
      de verantwoordelijkheid voor de onder a bedoelde metingen, onderscheidenlijk berekeningen en de wijze waarop
      daarvan verslag wordt gedaan en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.1.c
    text: de wijze van bekostiging van de onder a bedoelde metingen, onderscheidenlijk berekeningen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Bij de in het eerste lid bedoelde maatregel kan worden bepaald dat de wijze van meten of berekenen en de frequentie
      daarvan bij ministeriële regeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.3
    text: |-
      Indien bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], grenswaarden zijn gesteld ter uitvoering
      van een richtlijn van de Raad van de Europese Unie, vastgesteld overeenkomstig artikel 4 van de EG-kaderrichtlijn
      luchtkwaliteit, bevat die maatregel voorts regels met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.3.3.a
    text: |-
      het opstellen van lijsten als bedoeld in artikel 8, eerste en tweede lid, of artikel 9 van de EG-kaderrichtlijn
      luchtkwaliteit, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.3.b
    text: |-
      het opstellen van verslagen, bevattende inlichtingen als bedoeld in artikel 11, eerste lid, onder a, sub i en ii,
      van de EG-kaderrichtlijn luchtkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: 5.3.4
    text: |-
      Indien bij een maatregel als bedoeld in [artikel 5.1, eerste lid][ref1], grenswaarden zijn gesteld ter uitvoering
      van een richtlijn van de Raad van de Europese Unie, vastgesteld overeenkomstig artikel 4 van de EG-kaderrichtlijn
      luchtkwaliteit, kan bij die maatregel worden bepaald dat een verslag als bedoeld in het derde lid, onder b, of
      gedeelten daarvan, onderdeel uitmaken van het nationale milieubeleidsplan, het nationale milieuprogramma, het
      provinciale milieubeleidsplan, het provinciale milieuprogramma, het regionale milieubeleidsplan, het regionale
      milieuprogramma of het gemeentelijke milieuprogramma, bedoeld in [de artikelen 4.3][ref2], [4.7][ref3],
      [4.9][ref4], [4.14][ref5], [4.15a][ref6], [4.15b][ref7] onderscheidenlijk [4.20][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel4
