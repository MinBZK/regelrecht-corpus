        hoofdstuk: '19'
  - number: 19.7.4
    text: |-
      Indien een verzoek als bedoeld in het eerste lid is gedaan, kan openbaarmaking van het betrokken milieuverslag
      achterwege blijven tot uiterlijk vier weken nadat op dat verzoek onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.7
  - number: 19.7.5
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing op een verslag als bedoeld in
      [artikel 16.12, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 19.7.6
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op gegevens die voorkomen in een milieuverslag
      als bedoeld in [titel 12.1][ref1] of die uit zodanig verslag kunnen worden afgeleid en die niet als milieu-
      informatie zijn te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.7
    references:
