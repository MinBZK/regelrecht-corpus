        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.63.4
    text: |-
      Onze Minister kan, indien het belang van een doelmatig beheer van afvalstoffen zich daartegen niet verzet,
      ontheffing verlenen van het bepaalde in een algemene maatregel van bestuur krachtens de artikelen 10.15 tot en
      met 10.19, [10.28][ref1], [10.29][ref2], [10.47][ref3], [10.51][ref4] en, indien het belang van de bescherming
      van het milieu zich daartegen niet verzet, van [10.52][ref5], van het bepaalde bij of krachtens een algemene
      maatregel van bestuur op grond van [de artikelen 10.41, eerste en tweede lid][ref6], [10.42, eerste lid][ref7],
      [10.43, eerste lid][ref8], [10.44, derde lid][ref9], en [10.46, eerste lid][ref10], alsmede van het bepaalde in de
      [artikelen 10.23, derde lid][ref11], en [10.48][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
