  - number: '13.2'
    text: |-
      Indien bij de voorbereiding van de beslissing op de aanvraag om een vergunning of een ontheffing een
      milieu-effectrapport moet worden gemaakt, wordt van die aanvraag kennisgegeven uiterlijk tien weken
      na ontvangst van de aanvraag. Met betrekking tot die kennisgeving zijn de [artikelen 3:11][ref1],
      [3:12, eerste en tweede lid, en derde lid, onder a][ref2], en [3:14 van de Algemene wet bestuursrecht][ref3] en
      [de artikelen 13.4][ref4] en [13.6][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
