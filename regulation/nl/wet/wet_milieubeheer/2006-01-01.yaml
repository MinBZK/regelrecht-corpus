        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: '22.2'
    text: 'Deze wet kan worden aangehaald als: Wet milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel22.2
  - number: '22.3'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel22.3
