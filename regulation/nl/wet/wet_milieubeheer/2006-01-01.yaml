  - number: 18.6a.2
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid, tot en met 5:35 van de Algemene wet bestuursrecht][ref1] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '18.7'
    text: |-
      Onze betrokken Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van het bepaalde bij of
      krachtens de betrokken wet in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.7
  - number: 18.7.a
    text: hem de zorg voor de bestuursrechtelijke handhaving daarvan is opgedragen of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.7
  - number: 18.7.b
    text: geen ander bestuursorgaan daartoe bevoegd is.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.7
  - number: 18.7a
    text: |-
      Artikel 18.7, aanhef en onder b, is niet van toepassing voorzover het betreft de handhaving van het bij of
      krachtens hoofdstuk 16 bepaalde.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.7a
  - number: '18.8'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang krachtens [artikel 18.7][ref1] behoort het in Nederland door
      of vanwege het bevoegde bestuursorgaan beheren van afvalstoffen in gevallen waarin die afvalstoffen in strijd met
      het bij of krachtens de EEG-verordening overbrenging van afvalstoffen of titel 10.7 bepaalde, binnen of buiten
      Nederlands grondgebied worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.8a.1
    text: |-
      Onze betrokken Minister kan, indien dat in het belang van de bescherming van het milieu geboden is, vorderen
      dat gedeputeerde staten, burgemeester en wethouders of het dagelijks bestuur van een waterschap ter zake van een
      overtreding van het bepaalde bij of krachtens de betrokken wetten waartoe zij tot bestuursrechtelijke handhaving
      bevoegd zijn, binnen een door hem te stellen termijn een beschikking tot toepassing van bestuursdwang, oplegging
      van een last onder dwangsom of intrekking van een vergunning of ontheffing, uitvoeren, dan wel geven en uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8a
  - number: 18.8a.2
    text: |-
      Het bestuursorgaan doet van de wijze waarop gevolg is gegeven aan de vordering schriftelijk mededeling aan Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8a
  - number: 18.8a.3
    text: |-
      Indien het bestuursorgaan niet of niet volledig gevolg geeft aan een vordering kan Onze betrokken Minister voor
      rekening van dat bestuursorgaan daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8a
  - number: 18.8a.4
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van toepassing, met dien verstande dat voor het
      bestuursorgaan dat bestuursdwang heeft toegepast, wordt gelezen: het bestuursorgaan dat geen gevolg heeft gegeven
      aan de vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.8b.1
    text: |-
      Onze betrokken Minister pleegt over een voornemen tot het geven van een vordering als bedoeld in
      [artikel 18.8a, eerste lid][ref1], overleg met burgemeester en wethouders, gedeputeerde staten of het dagelijks
      bestuur van het waterschap, onder gelijktijdige mededeling daarvan aan de gemeenteraad, provinciale staten,
      onderscheidenlijk het algemeen bestuur van het waterschap, tenzij de geboden spoed zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.8b.2
    text: |-
      Onze betrokken Minister doet van het besluit, houdende de vordering, mededeling door overlegging van het besluit
      aan de Staten-Generaal en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8b
  - number: 18.8b.3
    text: |-
      Indien in het belang van de bescherming van het milieu een onverwijlde vordering geboden is, en Onze betrokken
      Minister de vordering daardoor niet vooraf op schrift kan stellen, stelt hij deze alsnog zo spoedig mogelijk op
      schrift.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.8b
  - number: 18.9.1
    text: |-
      Een bestuursorgaan past geen bestuursdwang toe indien ter zake van de betrokken overtreding door een ander
      bestuursorgaan reeds een beschikking tot toepassing van bestuursdwang is gegeven en deze niet is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.9
  - number: 18.9.2
    text: |-
      Een bestuursorgaan legt geen last onder dwangsom op indien ter zake van de betrokken overtreding door een
      ander bestuursorgaan reeds een beschikking tot oplegging van een last onder dwangsom is gegeven en deze niet is
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.9
  - number: '18.10'
    text: |-
      Het bestuursorgaan dat een beschikking tot toepassing van bestuursdwang of oplegging van een last onder
      dwangsom heeft gegeven terzake van overtreding van [de artikelen 1.1a][ref1], [10.1][ref2], [10.2][ref3]
      of [10.54][ref4], van [artikel 13 van de Wet bodembescherming][ref5] of van het bepaalde bij of krachtens de
      [Wet milieugevaarlijke stoffen][ref6], zendt onverwijld een afschrift van die beschikking aan de bestuursorganen
      die eveneens bevoegd zijn tot bestuursrechtelijke handhaving van die bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref5
        bwb_id: BWBR0003994
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0003892
  - number: '18.11'
    text: |-
      Indien een verzoek als bedoeld in [artikel 5:34 van de Algemene wet bestuursrecht][ref1] wordt gedaan, geeft het
      bestuursorgaan dat de last onder dwangsom heeft opgelegd, zo spoedig mogelijk, doch uiterlijk binnen vier weken, de
      beschikking op het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.12.1
    text: |-
      Het ten aanzien van een vergunning of ontheffing bevoegde gezag kan de vergunning of ontheffing geheel of
      gedeeltelijk intrekken, indien niet overeenkomstig die vergunning of ontheffing is of wordt gehandeld, dan wel
      indien aan de vergunning of ontheffing verbonden voorschriften of voor de houder van de vergunning of ontheffing
      als zodanig geldende algemene regels niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.12
  - number: 18.12.2
    text: |-
      Een vergunning of ontheffing, die betrekking heeft op het beheer van gevaarlijke afvalstoffen, dan wel van andere
      afvalstoffen die van elders afkomstig zijn, kan, voor zover zij het beheer van afvalstoffen betreft, tevens worden
      ingetrokken, indien op grond van [hoofdstuk 10][ref1] voor de houder geldende voorschriften niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.12.3
    text: |-
      Indien binnen een periode van vier jaar aan een persoon tweemaal voor eenzelfde feit een bestuurlijke boete
      als bedoeld in [artikel 18.16a][ref1] is opgelegd en de betrokken boeten binnen die periode onherroepelijk zijn
      geworden, kan het bestuur van de emissieautoriteit de vergunning, bedoeld in [artikel 16.5, eerste lid][ref2],
      [artikel 16.5, eerste lid][ref3], in verbinding met [artikel 16.5, tweede lid][ref4], of
      [artikel 16.49, eerste lid][ref5], die de betrokken persoon houdt, intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.12
