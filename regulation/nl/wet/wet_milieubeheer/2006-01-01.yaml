        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2b.1.c
    text: |-
      het inzamelen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in [artikel 10.45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 18.2b.1.d
    text: |-
      verhandelen, bemiddelen of vervoeren als bedoeld in [artikel 10.55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2b.2
    text: |-
      Onze Minister heeft tevens tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij of krachtens
      de EEG-verordening overbrenging van afvalstoffen gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
  - number: 18.2c.1
    text: |-
      Gedeputeerde staten hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij of
      krachtens [hoofdstuk 10][ref1] gestelde verplichtingen, voorzover zij betrekking hebben op het aanwezig hebben
      van een begeleidingsbrief bij het vervoer van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in
      [artikel 10.44][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.2
  - number: 18.2c.2
    text: |-
      Gedeputeerde staten hebben tevens tot taak zorg te dragen voor de bestuursrechtelijke handhaving buiten een
      inrichting van de krachtens [artikel 17.4][ref1] gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 18.2d.1
    text: |-
      Burgemeester en wethouders hebben tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de
      verplichtingen, gesteld bij of krachtens:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
  - number: 18.2d.1.a
    text: de afvalstoffenverordening;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
  - number: 18.2d.1.b
    text: |-
      [artikel 10.29][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2d.1.c
    text: |-
      [artikel 10.52][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2d.2
    text: |-
      Burgemeester en wethouders hebben tevens tot taak zorg te dragen voor de bestuursrechtelijke handhaving buiten een
      inrichting van de bij of krachtens [hoofdstuk 10][ref1] gestelde verplichtingen, voor zover zij betrekking hebben
      op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2d.2.a
    text: |-
      het zich ontdoen van afvalwater als bedoeld in [de artikelen 10.30][ref1] en [10.32][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2d.2.b
    text: |-
      het zich ontdoen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in [artikel 10.37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 18.2d.2.c
    text: |-
      het zich ontdoen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen als bedoeld in [artikel 10.51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2e
    text: |-
      Bij het uitoefenen van de taak, bedoeld in [de artikelen 18.2][ref1] tot en met [18.2d][ref2], wordt rekening
      gehouden met het voor het betrokken bestuursorgaan geldende milieubeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.2f
    text: De emissieautoriteit draagt zorg voor de handhaving van de bij of krachtens hoofdstuk 16 gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2f
  - number: 18.3.1
    text: Bij algemene maatregel van bestuur worden in het belang van een doelmatige handhaving regels gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3
  - number: 18.3.2
    text: |-
      Bij de maatregel worden in ieder geval regels gesteld met betrekking tot een strategische, programmatische en
      onderling afgestemde uitoefening van de handhavingsbevoegdheden door de bestuursorganen die belast zijn met de
      bestuursrechtelijke handhaving van het bepaalde bij of krachtens de betrokken wetten en van het toezicht op de
      naleving door de onder hun gezag werkzame toezichthouders.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3
  - number: 18.3.3
    text: |-
      Bij de maatregel kunnen regels worden gesteld met betrekking tot de afstemming van de werkzaamheden van de
      bestuursorganen en toezichthouders, bedoeld in het tweede lid, op die van andere organen en ambtenaren, die belast
      zijn met de handhaving van het bepaalde bij of krachtens de betrokken wetten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3
  - number: 18.3.4
    text: |-
      Bij regeling van Onze Minister kunnen, in overeenstemming met Onze betrokken Minister, nadere regels worden gesteld
      met betrekking tot het bepaalde bij de maatregel.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3
  - number: 18.3a
    text: |-
      Gedeputeerde staten dragen zorg voor de coördinatie van de uitvoering van het bepaalde krachtens
      [artikel 18.3][ref1] in de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3b.1
    text: |-
      Ter uitvoering van [artikel 18.3a][ref1] wordt in iedere provincie regelmatig overleg gevoerd tussen de
      bestuursorganen die belast zijn met de handhaving van het bepaalde bij of krachtens de betrokken wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3b.2
    text: |-
      Gedeputeerde staten stellen voor dat overleg een of meer overlegorganen in. Aan het overleg kunnen, op uitnodiging,
      andere organen en ambtenaren, die belast zijn met de handhaving van het bepaalde bij of krachtens de betrokken
      wetten, deelnemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3b
  - number: 18.3b.3
    text: |-
      In dat overleg maken die bestuursorganen in ieder geval afspraken over de wijze waarop zij uitvoering zullen geven
      aan het bepaalde krachtens [artikel 18.3][ref1] en aan [artikel 18.3a][ref2] en over de voorzieningen die zij voor
      die uitvoering zullen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3c
    text: |-
      Onze Minister draagt zorg voor de coördinatie van de uitvoering van het bepaalde krachtens [artikel 18.3][ref1],
      voorzover die coördinatie naar zijn oordeel van meer dan provinciaal belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3d.1
    text: |-
      Gedeputeerde staten kunnen, indien dat in het belang van een doelmatige handhaving geboden is, aan burgemeester
      en wethouders of aan het dagelijks bestuur van een waterschap een aanwijzing geven ter zake van de uitvoering door
      deze bestuursorganen van het bepaalde krachtens [artikel 18.3][ref1]. Daarbij houden gedeputeerde staten rekening
      met het geldende provinciale milieubeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3d.2
    text: |-
      Bij een aanwijzing wordt een termijn gesteld binnen welke daaraan gevolg moet zijn gegeven. Burgemeester en
      wethouders doen, onderscheidenlijk het dagelijks bestuur van een waterschap doet, schriftelijk mededeling aan
      gedeputeerde staten van de wijze waarop gevolg is gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3d
  - number: 18.3d.3
    text: |-
      Gedeputeerde staten plegen over een voornemen tot het geven van een aanwijzing overleg met burgemeester en
      wethouders, onderscheidenlijk het dagelijks bestuur van het waterschap, onder gelijktijdige mededeling daarvan aan
      de gemeenteraad, onderscheidenlijk het algemeen bestuur van het waterschap.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3d
  - number: 18.3d.4
    text: |-
      Gedeputeerde staten doen van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan
      Onze betrokken Minister en aan provinciale staten en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3d
  - number: 18.3d.5
    text: |-
      Indien burgemeester en wethouders of het dagelijks bestuur geen gevolg geven, onderscheidenlijk geeft, aan een
      aanwijzing, kunnen gedeputeerde staten daaraan gevolg geven voor rekening van de gemeente, onderscheidenlijk het
      waterschap.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3d
  - number: 18.3e.1
    text: |-
      Gedeputeerde staten kunnen, indien zij hebben vastgesteld dat een behoorlijke uitvoering van het bepaalde krachtens
      [artikel 18.3][ref1] in de provincie onvoldoende gewaarborgd is, gemeenten of waterschappen aanwijzen waarvan
      burgemeester en wethouders, respectievelijk de dagelijkse besturen een gemeenschappelijke regeling moeten treffen
      als bedoeld in de [Wet gemeenschappelijke regelingen][ref2], ter behartiging van het belang van een doelmatige
      handhaving. [Artikel 99, eerste lid, van die wet][ref3] is niet van toepassing. Een waterschap wordt niet
      aangewezen dan nadat Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister heeft verklaard
      dat hij daartegen geen bezwaar heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003740
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel99
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003740
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '99'
  - number: 18.3e.2
    text: |-
      Gedeputeerde staten houden bij een aanwijzing rekening met de regio’s die overeenkomstig de [bijlage, behorend bij
      de Politiewet 1993](onbekend), zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
  - number: 18.3e.3
    text: |-
      Gedeputeerde staten kunnen te allen tijde bepalen dat de provincie deelneemt aan een regeling. Indien een aan
      te wijzen waterschap in meer dan een provincie ligt, geschiedt de aanwijzing in overeenstemming met gedeputeerde
      staten van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
  - number: 18.3e.4
    text: |-
      Bij de regeling wordt een openbaar lichaam als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1] ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 18.3e.5
    text: |-
      Bij de regeling worden door de deelnemende gemeenten of waterschappen aan het bestuur van het openbaar lichaam ten
      minste de volgende taken opgedragen:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
  - number: 18.3e.5.a
    text: |-
      het houden van toezicht op de naleving van het bepaalde bij of krachtens de betrokken wetten, het verzamelen en
      registreren van gegevens, bedoeld in [artikel 18.2, eerste lid, onder b][ref1], en het behandelen van klachten,
      bedoeld in dat artikellid, onder c, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3e.5.b
    text: |-
      het voorbereiden en het uitvoeren van door burgemeester en wethouders van een deelnemende gemeente of van door
      het dagelijks bestuur van een deelnemend waterschap te geven, dan wel gegeven beschikkingen tot toepassing van
      bestuursdwang, oplegging van een last onder dwangsom of intrekking van een vergunning of ontheffing op grond van
      [artikel 18.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3e.6
    text: |-
      Gedeputeerde staten doen van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan
      Onze betrokken Minister en aan provinciale staten en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3e
  - number: 18.3f.1
    text: |-
      Onze Minister kan, indien dat in het belang van een doelmatige handhaving geboden is, in overeenstemming met Onze
      betrokken Minister, aan gedeputeerde staten een aanwijzing geven ter zake van:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.3f.1.a
    text: |-
      de uitvoering door gedeputeerde staten van het bepaalde krachtens [artikel 18.3][ref1] en van de
      [artikelen 18.3a][ref2] en [18.3d][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3f.1.b
    text: |-
      het bepaalde in [artikel 18.3e, eerste, tweede, derde lid, eerste volzin, en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.3f.2
    text: |-
      Bij het geven van een aanwijzing houdt Onze Minister rekening met het geldende nationale milieubeleidsplan en stelt
      hij een termijn binnen welke gevolg moet zijn gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.3f.3
    text: Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.3f.4
    text: |-
      In een geval als bedoeld in het eerste lid, onder b, is
      [artikel 102, eerste lid, van de Wet gemeenschappelijke regelingen][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel102
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '102'
  - number: 18.3f.5
    text: |-
      Gedeputeerde staten doen schriftelijk mededeling aan Onze betrokken Minister van de wijze waarop zij gevolg hebben
      gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.3f.6
    text: |-
      Onze Minister doet van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan de
      Staten-Generaal en aan provinciale staten en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.3f.7
    text: |-
      Indien gedeputeerde staten geen gevolg geven aan een aanwijzing, kan Onze Minister gevolg geven aan de aanwijzing
      voor rekening van de betrokken provincie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.3f
  - number: 18.4.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde, zijn belast de bij besluit van
      Onze betrokken Minister aangewezen ambtenaren. Ambtenaren, ressorterende onder een ander dan zijn ministerie, wijst
      hij niet aan dan in overeenstemming met Onze Minister onder wiens ministerie zij ressorteren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
  - number: 18.4.2
    text: |-
      Voor de krachtens het eerste lid aangewezen ambtenaren, ressorterende onder een ander ministerie dan dat van Onze
      betrokken Minister, worden regels betreffende de vervulling van hun in het eerste lid bedoelde taak niet gesteld
      dan in overeenstemming met Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
  - number: 18.4.3
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde binnen hun ambtsgebied zijn
      eveneens belast de bij besluit van gedeputeerde staten en burgemeester en wethouders of andere met de uitvoering
      van de betrokken wet belaste bestuursorganen aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
  - number: 18.4.4
    text: |-
      Bij een besluit als bedoeld in het eerste lid kan Onze betrokken Minister gevallen of categorieën van gevallen
      aanwijzen met betrekking waartoe, in afwijking van het derde lid, bij zijn besluit aangewezen ambtenaren
      uitsluitend belast zijn met het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
  - number: 18.4.5
    text: |-
      Met het toezicht op de naleving van het bij of krachtens [hoofdstuk 16][ref1] bepaalde zijn belast de bij besluit
      van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 18.4.6
    text: |-
      Van een besluit als bedoeld in het eerste en vijfde lid, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4
  - number: 18.4a.1
    text: |-
      Met het onderzoek met betrekking tot overtredingen als bedoeld in [artikel 18.16a, eerste en tweede lid][ref1],
      zijn belast de krachtens [artikel 18.4, vijfde lid][ref2], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.4a.2
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden, bedoeld in de
      [artikelen 5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.4a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '18.5'
    text: |-
      De krachtens [artikel 18.4][ref1] aangewezen ambtenaren zijn voor de vervulling van hun taak met betrekking tot
      gevaarlijke afvalstoffen bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: '18.6'
    text: |-
      Het bevoegd gezag is bevoegd tot toepassing van bestuursdwang ter handhaving van [artikel 5:20, eerste lid, van de
      Algemene wet bestuursrecht](onbekend), voor zover het betreft de verplichting tot het verlenen van medewerking aan
      de krachtens [artikel 18.4][ref1] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.6a.1
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens [artikel 16.5, eerste lid][ref1],
      [16.5, eerste lid][ref2], in verbinding met [artikel 16.5, tweede lid][ref3],
      [artikel 16.6, eerste, tweede of derde lid][ref4], [artikel 16.6, eerste, tweede of derde lid][ref5], in verbinding
      met [artikel 16.49, tweede lid][ref6], [artikel 16.12, derde lid][ref7], [artikel 16.12, derde lid][ref8],
      in verbinding met [artikel 16.49, tweede lid][ref9], [artikel 16.13][ref10], [artikel 16.13][ref11] in
      verbinding met [artikel 16.49, tweede lid][ref12], [artikel 16.14][ref13], [artikel 16.14][ref14] in verbinding
      met [artikel 16.49, tweede lid][ref15], [artikel 16.21][ref16], [artikel 16.21][ref17] in verbinding met
      [artikel 16.49, tweede lid][ref18], of [artikel 16.49, eerste lid][ref19], of van [artikel 18.18][ref20], voorzover
      het een voorschrift betreft dat is verbonden aan een vergunning krachtens [hoofdstuk 16][ref21], of van artikel
      22, eerste lid, van de EG-verordening registratie handel in broeikasgasemissierechten, kan het bestuur van de
      emissieautoriteit een last onder dwangsom opleggen.


