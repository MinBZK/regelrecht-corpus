  - number: 5.3.5
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het opstellen van programma’s voor
      de monitoring van oppervlaktewateren en grondwatervoorkomens als bedoeld in artikel 8 van de kaderrichtlijn
      water, waarbij voor gebieden, bedoeld in bijlage IV van die richtlijn, aanvullende verplichtingen kunnen worden
      gesteld welke dienen ter uitvoering van een richtlijn van het Europees Parlement en de Raad van de Europese Unie.
      Bij de maatregel kan ten aanzien van de milieudoelstellingen, bedoeld in artikel 4 van de kaderrichtlijn water,
      overeenkomstige toepassing worden gegeven aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      Indien ter uitvoering van [dit hoofdstuk][ref1] een ministeriële regeling als
      bedoeld in [artikel 21.6, zesde lid][ref2], wordt vastgesteld, zijn daarop
      [de artikelen 5.1, derde, vierde en vijfde lid][ref3], [5.2][ref4] en [5.3][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '21'
        hoofdstuk: '21'
      - id: ref3
