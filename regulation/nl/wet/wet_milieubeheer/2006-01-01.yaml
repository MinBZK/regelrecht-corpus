        artikel: '5'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.1
    text: |-
      Provinciale staten kunnen in de provinciale milieuverordening milieukwaliteitseisen stellen als bedoeld in
      [artikel 5.1, eerste lid][ref1]. De artikelen 5.1, derde, vierde en vijfde lid, 5.2 en 5.3 zijn van overeenkomstige
      toepassing op de vaststelling van milieukwaliteitseisen als bedoeld in [de eerste volzin][ref2], met dien
      verstande, dat overeenkomstig [artikel 5.2, eerste lid][ref3], geen bevoegdheden van organen van het Rijk worden
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 5.1, eerste lid][ref1], of bij een ministeriële
      regeling als bedoeld in [artikel 21.6, zesde lid][ref2], kan de bevoegdheid, bedoeld in het eerste lid, met
      betrekking tot een onderwerp ten aanzien waarvan in die maatregel of in die regeling een milieukwaliteitseis is
      vastgesteld, voor zover dat in het algemeen belang geboden is, worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '21'
        hoofdstuk: '21'
  - number: 7.1.1
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen wordt verstaan onder: Onze Ministers: Onze Minister en
      Onze Minister van Landbouw, Natuurbeheer en Visserij; de commissie: de Commissie voor de milieu-effectrapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 7.1.2
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen worden, voor zover zij niet reeds op grond van andere
      wettelijke bepalingen als zodanig dienen te worden aangemerkt, tevens als adviseurs aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 7.1.2.a
    text: |-
      indien het bevoegd gezag een orgaan van de centrale overheid is: een door Onze Minister aangewezen bestuursorgaan
      en een door Onze Minister van Landbouw, Natuurbeheer en Visserij aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
  - number: 7.1.2.b
    text: 'indien het bevoegd gezag een ander bestuursorgaan is:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
  - number: 7.1.2.b.1º
    text: een door Onze Minister van Landbouw, Natuurbeheer en Visserij aangewezen bestuursorgaan, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
  - number: 7.1.2.b.2º
    text: |-
      de inspecteur, voor zover het betreft het oprichten, wijzigen of uitbreiden van een inrichting die behoort tot een
      krachtens [artikel 8.7, eerste lid, onder a][ref1], aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 7.1.3
    text: |-
      Bij algemene maatregel van bestuur kan met betrekking tot een daarbij aangewezen activiteit of besluit worden
      bepaald wie, onderscheidenlijk welk orgaan voor de toepassing van [dit hoofdstuk][ref1] wordt aangemerkt als degene
      die de activiteit onderneemt, onderscheidenlijk als bevoegd gezag. Daarbij kunnen voor de verschillende artikelen
      of onderdelen daarvan verschillende personen of organen worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 7.2.1
    text: |-
      Bij algemene maatregel van bestuur worden de activiteiten aangewezen, die belangrijke nadelige gevolgen kunnen
      hebben voor het milieu. Daarbij worden een of meer besluiten van bestuursorganen ter zake van die activiteiten
      aangewezen, bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Tot de activiteiten, bedoeld in het eerste lid, kunnen mede activiteiten behoren, die in samenhang met andere
      activiteiten belangrijke nadelige gevolgen kunnen hebben voor het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.2
  - number: 7.2.3
    text: |-
      Bij de maatregel kan worden bepaald dat de aanwijzing van een activiteit of een besluit slechts geldt in daarbij
      aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.2
  - number: 7.2.4
    text: |-
      Bij of krachtens de maatregel wordt het tijdstip bepaald met ingang waarvan met betrekking tot een aangewezen
      besluit de in het eerste lid bedoelde verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.2
  - number: 7.2.5
    text: De maatregel wordt telkens binnen vijf jaren nadat hij is vastgesteld, herzien.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Indien een van Onze Ministers voornemens is een activiteit te ondernemen, die niet is opgenomen in een algemene
      maatregel van bestuur krachtens [artikel 7.2][ref1] en die belangrijke nadelige gevolgen kan hebben voor het
      milieu, deelt hij dat voornemen onverwijld mede aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.3.2
    text: |-
      Jaarlijks doen Onze Ministers in de memorie van toelichting op het desbetreffende hoofdstuk van de Rijksbegroting
      ieder voor hun ministerie verslag van de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Bij algemene maatregel van bestuur worden de activiteiten aangewezen, ten aanzien waarvan het bevoegd gezag
      krachtens [artikel 7.8][ref1] en 7.8*d* moet bepalen of voor de activiteit, vanwege de bijzondere omstandigheden
      waaronder zij wordt ondernomen, een milieu-effectrapport moet worden gemaakt. Daarbij worden een of meer besluiten
      van bestuursorganen ter zake van die activiteiten aangewezen, bij de voorbereiding waarvan, indien het bevoegd
      gezag daartoe besluit, het in [de eerste volzin][ref2] bedoelde milieu-effectrapport moet worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.4.2
    text: |-
      [Artikel 7.2, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.5.1
    text: |-
      Onze Ministers te zamen kunnen ontheffing verlenen van de verplichting tot het maken van een milieu-effectrapport
      bij de voorbereiding van een of meer besluiten als aangewezen krachtens [artikel 7.2, eerste lid][ref1], in
      gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.5.1.a
    text: |-
      degene die de activiteit waarop die besluiten betrekking hebben, onderneemt, daarmee een activiteit ten aanzien
      waarvan reeds eerder een milieu-effectrapport is gemaakt, herhaalt of voortzet, indien het milieu-effectrapport
      redelijkerwijs geen nieuwe gegevens betreffende mogelijke nadelige gevolgen van de te ondernemen activiteit voor
      het milieu kan bevatten en de activiteit geen belangrijke nadelige gevolgen kan hebben voor het milieu in een ander
      land;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.1.b
    text: |-
      met betrekking tot dezelfde activiteit reeds eerder een milieu-effectrapport overeenkomstig het bij of
      krachtens [de artikelen 7.9][ref1] tot en met [7.26][ref2] bepaalde is gemaakt, indien het milieu-effectrapport
      redelijkerwijs geen nieuwe gegevens betreffende mogelijke nadelige gevolgen van die activiteit voor het milieu kan
      bevatten en de activiteit geen belangrijke nadelige gevolgen kan hebben voor het milieu in een ander land;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.5.1.c
    text: |-
      het algemeen belang het onverwijld ondernemen van de activiteit waarop die besluiten betrekking hebben,
      noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.2
    text: |-
      Een ontheffing krachtens het eerste lid kan worden verleend op verzoek van degene die de activiteit onderneemt, of
      van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.3
    text: |-
      Onze Ministers tekenen de datum van ontvangst van het verzoek aan op het geschrift waarbij het is ingediend, en
      zenden de verzoeker een bericht van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.4
    text: |-
      Behoudens in een geval als bedoeld in het eerste lid, onder *c*, stellen Onze Ministers, voordat zij op het
      verzoek beslissen, het bevoegd gezag, indien het verzoek daarvan niet afkomstig is, in de gelegenheid hun omtrent
      het verzoek advies uit te brengen. In een geval als bedoeld in het eerste lid, onder *a* of *b*, stellen zij
      tegelijkertijd ook de commissie daartoe in de gelegenheid. Indien van de gelegenheid advies uit te brengen gebruik
      wordt gemaakt, wordt het advies binnen vijf weken na de datum waarop daarom is verzocht, aan Onze Ministers
      gezonden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.5
    text: |-
      De beslissing op het verzoek wordt genomen uiterlijk negen weken na de datum van ontvangst. Tegelijkertijd met de
      bekendmaking wordt van de beslissing mededeling gedaan aan de commissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.6
    text: 'Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.6.a
    text: |-
      de wijze waarop het verzoek om een ontheffing moet worden gedaan en de gegevens die van de verzoeker kunnen worden
      verlangd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.6.b
    text: de terinzagelegging van het verzoek en de daarbij overgelegde gegevens en de kennisgeving van die terinzagelegging;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.5.6.c
    text: |-
      de wijze waarop en de termijn waarbinnen een ieder bedenkingen tegen verlening van de ontheffing bij Onze Ministers
      kan inbrengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Provinciale staten kunnen met het oog op de bescherming van het milieu in binnen hun provincie gelegen gebieden
      die van bijzondere betekenis zijn of waarin het milieu reeds in ernstige mate is verontreinigd of aangetast, in de
      provinciale milieuverordening activiteiten aanwijzen, die niet zijn opgenomen in een algemene maatregel van bestuur
      krachtens [artikel 7.2][ref1] en die belangrijke nadelige gevolgen kunnen hebben voor het milieu in die gebieden.
      Daarbij wijzen zij de besluiten van bestuursorganen ter zake van die activiteiten aan, bij de voorbereiding waarvan
      een milieu-effectrapport moet worden gemaakt, indien die activiteiten binnen hun provincie worden uitgevoerd.
      [Artikel 7.2, tweede lid en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.6.2
    text: |-
      Op de voorbereiding van een besluit, houdende een aanwijzing krachtens het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing; zienswijzen kunnen naar voren worden
      gebracht door een ieder. Gedeputeerde staten plegen over het ontwerp overleg met de besturen van de gemeenten
      en waterschappen in hun provincie. Zij stellen de in [artikel 7.1, tweede lid, onder b, 1°][ref2], bedoelde
      instantie, alsmede Onze Minister in de gelegenheid omtrent het ontwerp advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.6.3
    text: |-
      Gedeputeerde staten leggen met het ontwerp van het besluit aan provinciale staten een verslag over van het gevoerde
      overleg, de uitgebrachte adviezen en de naar voren gebrachte zienswijzen, waarbij zij onder opgave van redenen
      aangeven in hoeverre daarmee rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.6
  - number: 7.6.4
    text: |-
      Tegelijkertijd met de bekendmaking van een besluit als bedoeld in het eerste lid, wordt daarvan mededeling gedaan
      door toezending van een exemplaar aan ieder van Onze Ministers en aan de commissie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.6
  - number: '7.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld over de inhoud van besluiten, houdende een
      aanwijzing als bedoeld in [artikel 7.6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8.1
    text: |-
      Gedeputeerde staten kunnen van de krachtens een aanwijzing als bedoeld in [artikel 7.6][ref1] geldende
      verplichting tot het maken van een milieu-effectrapport ontheffing verlenen in gevallen als bedoeld in
      [artikel 7.5, eerste en tweede lid][ref2]. [Artikel 7.5, derde, vierde en vijfde lid][ref3], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8.2
    text: |-
      Behoudens in een geval als bedoeld in [artikel 7.5, eerste lid, onder ][ref1], stellen gedeputeerde staten,
      voordat zij een ontheffing verlenen, het bevoegd gezag, indien het verzoek daarvan niet afkomstig is, en de in
      [artikel 7.1, tweede lid][ref2], bedoelde instanties met uitzondering van de inspecteur in de gelegenheid advies
      uit te brengen. [Artikel 7.5, zevende lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8.3
    text: |-
      Bij een besluit, houdende een aanwijzing als bedoeld in [artikel 7.6, eerste lid][ref1], worden regelen gesteld
      omtrent de in [artikel 7.5, achtste lid][ref2], genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8a.1
    text: |-
      Indien degene die een activiteit onderneemt, aangewezen krachtens [artikel 7.4][ref1], voornemens is een verzoek in
      te dienen tot het nemen van een krachtens dat artikel aangewezen besluit, deelt hij dat voornemen schriftelijk mede
      aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8a.2
    text: |-
      Bij de mededeling, bedoeld in het eerste lid, wordt in elk geval aandacht besteed aan de in [artikel 7.8][ref1],
      bedoelde bijzondere omstandigheden waaronder de activiteit wordt ondernomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.8a.3
    text: |-
      Bij de mededeling, bedoeld in het eerste lid, kan degene die een activiteit onderneemt, aangewezen krachtens
      [artikel 7.4][ref1], verklaren dat hij bij de voorbereiding van het krachtens [artikel 7.4][ref2] aangewezen
      besluit een milieu-effectrapport maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8b.1
    text: |-
      Behoudens in het geval dat toepassing is gegeven aan [artikel 7.8][ref1], neemt het bevoegd gezag uiterlijk zes
      weken na de datum van ontvangst een beslissing omtrent de vraag of bij de voorbereiding van het betrokken besluit
      voor de activiteit, vanwege de belangrijke nadelige gevolgen die zij voor het milieu kan hebben, een milieu-
      effectrapport moet worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.8b.2
    text: |-
      Indien wenselijk, vindt, alvorens het bevoegd gezag een beslissing neemt, overleg plaats met degene die de
      mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.3
    text: |-
      Indien krachtens [artikel 7.4][ref1] meer dan één besluit is aangewezen, nemen de bevoegde bestuursorganen de in
      het eerste lid bedoelde beslissing gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8b.4
    text: |-
      Het bevoegd gezag houdt bij zijn beslissing rekening met de in bijlage III bij de EEG-richtlijn milieu-
      effectbeoordeling aangegeven omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.5
    text: 'Het bevoegd gezag doet mededeling van zijn beslissing door:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.5.a
    text: |-
      kennisgeving in een of meer dag-, nieuws- of huis-aan-huis-bladen, en indien is beslist dat voor de activiteit geen
      milieu-effectrapport moet worden gemaakt, kennisgeving in de *Staatscourant*;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.5.b
    text: terinzagelegging;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.5.c
    text: |-
      kennisgeving in een publicatie in een ander land indien er sprake is van mogelijke belangrijke nadelige gevolgen
      voor het milieu in dat andere land.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.6
    text: 'In kennisgevingen als bedoeld in het vijfde lid vermeldt het bevoegd gezag ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.6.a
    text: |-
      het tijdstip waarop een exemplaar van de beslissing ter inzage wordt gelegd, alsmede de uren waarop en de plaats
      waar het ter inzage ligt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8b.6.b
    text: de strekking van de beslissing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8b
  - number: 7.8c.1
    text: |-
      Degene die een activiteit onderneemt, aangewezen krachtens [artikel 7.4][ref1], is verplicht een milieu-
      effectrapport te maken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8c.1.a
    text: |-
      het bevoegd gezag heeft beslist dat bij de voorbereiding van het besluit een milieu-effectrapport moet worden
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8c
  - number: 7.8c.1.b
    text: |-
      hij een verklaring heeft gedaan als bedoeld in [artikel 7.8a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.8c.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder a en b, zijn [de artikelen 14.5][ref1] tot en met [14.16][ref2] en
      [7.9][ref3] tot en met [7.43][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: 7.8d.1
    text: |-
      Indien het bevoegd gezag voornemens is een activiteit te ondernemen, aangewezen krachtens [artikel 7.4][ref1],
      neemt het in een zo vroeg mogelijk stadium voor de voorbereiding van het besluit dat krachtens dat artikel is
      aangewezen een beslissing omtrent de vraag of, vanwege de bijzondere omstandigheden waaronder deze activiteit
      wordt ondernomen, een milieu-effectrapport moet worden gemaakt. Artikel 7.8*b*, derde en vierde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8d.2
    text: 'Onder een zo vroeg mogelijk stadium wordt het volgende verstaan:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.2.a
    text: |-
      indien het een besluit betreft waarvan krachtens wettelijk voorschrift het voorontwerp van het besluit ter inzage
      wordt gelegd, het stadium voorafgaand aan de terinzagelegging van dat voorontwerp, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.2.b
    text: indien deze verplichting niet geldt, het stadium voorafgaand aan de terinzagelegging van het ontwerp-besluit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.3
    text: |-
      Het bevoegd gezag neemt de beslissing na overleg met de instanties die bij of krachtens een wet moeten worden
      betrokken bij de voorbereiding van het besluit, aangewezen krachtens [artikel 7.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8d.4
    text: 'Het bevoegd gezag doet van de beslissing mededeling door:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.4.a
    text: terinzagelegging;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.4.b
    text: |-
      kennisgeving in een publicatie in een ander land indien er sprake is van mogelijke belangrijke nadelige gevolgen
      voor het milieu in dat andere land;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.4.c
    text: |-
      kennisgeving in de *Staatscourant* indien is beslist dat voor de activiteit geen milieu-effectrapport wordt
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.5
    text: 'Bij de bekendmaking en mededeling van de beslissing vermeldt het bevoegd gezag ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.5.a
    text: |-
      het tijdstip waarop een exemplaar van de beslissing ter inzage wordt gelegd, alsmede de uren waarop en de plaats
      waar het ter inzage ligt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.5.b
    text: de strekking van de beslissing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
  - number: 7.8d.6
    text: |-
      Indien het bevoegd gezag heeft bepaald dat bij de voorbereiding van het besluit een milieu-effectrapport wordt
      gemaakt, zijn [de artikelen 14.5][ref1] tot en met [14.16][ref2] en [7.9][ref3] tot en met [7.43][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: 7.8e
    text: |-
      [De artikelen 7.8][ref1] tot en met [7.8][ref2] vinden geen toepassing ten aanzien van een activiteit, aangewezen
      in een algemene maatregel van bestuur krachtens [artikel 7.4][ref3], voor zover die activiteit bij een provinciale
      verordening krachtens [artikel 7.6, eerste lid][ref4], overeenkomstig de omschrijving in die algemene maatregel van
      bestuur is aangewezen en het een besluit betreft dat ter zake van die activiteit bij die verordening overeenkomstig
      die maatregel is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.8e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.9.1
    text: |-
      In gevallen waarin een besluit bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt,
      wordt genomen op verzoek - al dan niet gedaan ingevolge een wettelijk voorschrift - van degene die de betrokken
      activiteit onderneemt, maakt deze het milieu-effectrapport.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.9
  - number: 7.9.2
    text: In andere dan de in het eerste lid bedoelde gevallen maakt het bevoegd gezag het milieu-effectrapport.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.9
  - number: 7.10.1
    text: 'Een milieu-effectrapport bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.a
    text: een beschrijving van hetgeen met de voorgenomen activiteit wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.b
    text: |-
      een beschrijving van de voorgenomen activiteit en van de wijze waarop zij zal worden uitgevoerd, alsmede van de
      alternatieven daarvoor, die redelijkerwijs in beschouwing dienen te worden genomen, en de motivering van de keuze
      voor de in beschouwing genomen alternatieven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.c
    text: |-
      een aanduiding van de besluiten bij de voorbereiding waarvan het milieu-effectrapport wordt gemaakt, en een
      overzicht van de eerder genomen besluiten van bestuursorganen, die betrekking hebben op de voorgenomen activiteit
      en de beschreven alternatieven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.d
    text: |-
      een beschrijving van de bestaande toestand van het milieu, voor zover de voorgenomen activiteit of de beschreven
      alternatieven daarvoor gevolgen kunnen hebben, alsmede van de te verwachten ontwikkeling van dat milieu, indien die
      activiteit noch de alternatieven worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.e
    text: |-
      een beschrijving van de gevolgen voor het milieu, die de voorgenomen activiteit, onderscheidenlijk de beschreven
      alternatieven kunnen hebben, alsmede een motivering van de wijze waarop deze gevolgen zijn bepaald en beschreven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.1.f
    text: |-
      een vergelijking van de ingevolge [onderdeel ][ref1] beschreven te verwachten ontwikkeling van het milieu met de
      beschreven gevolgen voor het milieu van de voorgenomen activiteit, alsmede met de beschreven gevolgen voor het
      milieu van elk der in beschouwing genomen alternatieven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.10.1.g
    text: |-
      een overzicht van de leemten in [de onder ][ref1] en [][ref2] bedoelde beschrijvingen ten gevolge van het ontbreken
      van de benodigde gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.10.1.h
    text: |-
      een samenvatting die aan een algemeen publiek voldoende inzicht geeft voor de beoordeling van het milieu-
      effectrapport en van de daarin beschreven gevolgen voor het milieu van de voorgenomen activiteit en van de
      beschreven alternatieven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.2
    text: |-
      Het milieu-effectrapport is gesteld in de Nederlandse taal, tenzij het bevoegd gezag aan degene die de activiteit
      onderneemt, bij het geven van de in [artikel 7.15][ref1] bedoelde richtlijnen toestemming heeft verleend het
      rapport in een daarbij aangewezen andere taal te stellen. De in het eerste lid, onder *h*, bedoelde samenvatting is
      steeds in de Nederlandse taal gesteld. Indien een activiteit bij de voorbereiding waarvan een milieu-effectrapport
      moet worden gemaakt, belangrijke nadelige gevolgen kan hebben voor het milieu in een ander land, zendt degene
      die de activiteit onderneemt, op verzoek van het bevoegd gezag binnen een bij dat verzoek te bepalen termijn een
      vertaling van de samenvatting in de landstaal van het gebied in het andere land waar de activiteit belangrijke
      nadelige gevolgen kan hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.10.3
    text: |-
      Tot de ingevolge het eerste lid, onder *b*, te beschrijven alternatieven behoort in ieder geval het alternatief
      waarbij de nadelige gevolgen voor het milieu worden voorkomen, dan wel, voor zover dat niet mogelijk is, deze met
      gebruikmaking van de beste bestaande mogelijkheden ter bescherming van het milieu, zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.4
    text: |-
      Het bevoegd gezag kan bepalen dat, indien niet alle nadelige gevolgen voor het milieu kunnen worden beperkt, bij de
      ingevolge het eerste lid, onder *b*, te beschrijven alternatieven tevens de mogelijkheden worden beschreven om door
      het treffen van voorzieningen of maatregelen elders de resterende nadelige gevolgen te compenseren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.10.5
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de wijze waarop de in het
      eerste lid bedoelde gegevens worden bepaald en beschreven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Bij algemene maatregel van bestuur kunnen gegevens worden aangewezen, die een milieu-effectrapport in het belang
      van een goede besluitvorming, naast de in [artikel 7.10][ref1] bedoelde, moet bevatten. Daarbij kunnen regelen
      worden gesteld met betrekking tot de wijze waarop die gegevens worden bepaald en beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.11.2
    text: |-
      Bij een maatregel krachtens het eerste lid kan worden bepaald dat een aanwijzing of regel slechts geldt in daarbij
      aangewezen categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.11
  - number: 7.11.3
    text: Onze Ministers kunnen te zamen regelen stellen met betrekking tot de vorm van een milieu-effectrapport.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.11
  - number: 7.12.1
    text: |-
      Indien degene die een activiteit onderneemt, aangewezen krachtens [artikel 7.2][ref1] of [7.6, eerste lid][ref2],
      voornemens is een verzoek in te dienen tot het nemen van een besluit bij de voorbereiding waarvan een milieu-
      effectrapport moet worden gemaakt, deelt hij dat voornemen schriftelijk mede aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.12.2
    text: |-
      Het bevoegd gezag tekent de datum van ontvangst van de mededeling aan op het geschrift waarbij zij is gedaan, en
      zendt degene die haar heeft gedaan, onverwijld een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
  - number: 7.12.3
    text: |-
      Het zendt tegelijkertijd een exemplaar van de mededeling aan de commissie en aan de adviseurs. Het vermeldt daarbij
      de datum van ontvangst.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
  - number: 7.12.4
    text: |-
      Het geeft voorts tegelijkertijd kennis van de ontvangst van de mededeling met overeenkomstige toepassing van
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1]. Kennisgeving geschiedt in een publicatie in een ander land
      ingeval er sprake is van mogelijke belangrijke nadelige gevolgen voor het milieu in dat andere land.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.12.5
    text: |-
      Indien overeenkomstig [artikel 14.6, eerste lid][ref1], een verzoek is gedaan tot toepassing van
      [artikel 14.5][ref2], vindt toepassing van het derde en vierde lid eerst plaats nadat op dat verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 7.12.6
    text: Onze Ministers stellen regelen omtrent de inhoud van een mededeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
  - number: 7.12.7
    text: |-
      Indien een activiteit bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, belangrijke
      nadelige gevolgen kan hebben voor het milieu in een ander land, zendt degene die de activiteit onderneemt, op
      verzoek van het bevoegd gezag binnen een bij dat verzoek te bepalen termijn een vertaling van de mededeling in de
      landstaal van het gebied in het andere land waar de activiteit belangrijke nadelige gevolgen kan hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.12
  - number: 7.13.1
    text: |-
      Indien het bevoegd gezag voornemens is een besluit te nemen bij de voorbereiding waarvan het een milieu-
      effectrapport moet maken, deelt het zijn voornemen schriftelijk mede aan de commissie en aan de adviseurs.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.13
  - number: 7.13.2
    text: |-
      Het geeft tegelijkertijd kennis van zijn voornemen met overeenkomstige toepassing
      van [artikel 3:12, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 7.12, vierde lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.13.3
    text: |-
      [Artikel 7.12, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.14.1
    text: |-
      Het bevoegd gezag stelt de commissie en de adviseurs in de gelegenheid advies uit te brengen over het geven van
      richtlijnen inzake de inhoud van het milieu-effectrapport.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.14
  - number: 7.14.2
    text: |-
      De commissie brengt haar advies uit binnen negen weken na de openbare kennisgeving van
      de in [artikel 7.12, eerste lid][ref1], bedoelde mededeling, onderscheidenlijk van het in
      [artikel 7.13, eerste lid][ref2], bedoelde voornemen. Indien er sprake is van mogelijke belangrijke nadelige
      grensoverschrijdende gevolgen voor het milieu, gaat de commissie in haar advies daarop in.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.14.3
    text: |-
      Indien het bevoegd gezag het milieu-effectrapport niet zelf maakt, pleegt het voorts overleg over het geven van
      richtlijnen inzake de inhoud ervan met degene die de activiteit onderneemt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.14
  - number: 7.14.4
    text: |-
      Het bevoegd gezag stelt een ieder in de gelegenheid naar keuze schriftelijk of mondeling hun zienswijze naar voren
      te brengen over het geven van richtlijnen inzake de inhoud van het milieu-effectrapport.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.14
  - number: 7.15.1
    text: |-
      Het bevoegd gezag geeft uiterlijk dertien weken na de openbare kennisgeving van een mededeling als bedoeld in
      [artikel 7.12, eerste lid][ref1], of van een voornemen als bedoeld in [artikel 7.13, eerste lid][ref2], richtlijnen
      inzake de inhoud van het milieu-effectrapport. In gevallen als bedoeld in [artikel 7.13, eerste lid][ref3], kan het
      bevoegd gezag de termijn, bedoeld in de eerste volzin, eenmaal met ten hoogste acht weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.15.2
    text: 'De in het eerste lid bedoelde richtlijnen kunnen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
  - number: 7.15.2.a
    text: |-
      betrekking hebben op de wijze waarop aan het bij of krachtens [de artikelen 7.10][ref1] of [7.11][ref2] bepaalde
      moet worden voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.15.2.b
    text: |-
      gegevens als bedoeld in [artikel 7.10][ref1] of [7.11][ref2] aanwijzen die het milieu-effectrapport in elk geval
      moet inhouden, zo nodig nadat daarnaar onderzoek is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.15.3
    text: |-
      De gegevens bedoeld in het tweede lid, onder b, omvatten de gegevens die zijn aangegeven in bijlage IV bij de EEG-
      richtlijn milieu-effectbeoordeling, voor zover het bevoegd gezag dat noodzakelijk acht ter uitvoering van artikel
      5, eerste lid, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
  - number: 7.15.4
    text: |-
      Ingeval de richtlijnen een milieu-effectrapport betreffen, dat moet worden gemaakt bij de voorbereiding
      van een besluit waarop [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, kan geen
      onderzoek als bedoeld in het tweede lid, onder b, worden verlangd ter verkrijging van gegevens als bedoeld in
      [artikel 7.10, eerste lid, onder d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.15.5
    text: |-
      De richtlijnen worden bekendgemaakt aan degene die de activiteit onderneemt en meegedeeld aan de commissie, de
      adviseurs en degenen die bij het bevoegd gezag overeenkomstig [artikel 7.14, vierde lid][ref1], zienswijzen naar
      voren hebben gebracht. [Artikel 3:44, tweede lid, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.16'
    text: |-
      [De artikelen 7.12][ref1] tot en met [7.15][ref2] vinden geen toepassing indien degene die het milieu-effectrapport
      zou moeten maken, reeds beschikt over een milieu-effectrapport, opgesteld overeenkomstig het bij of krachtens
      [dit hoofdstuk][ref3] bepaalde, en in dat milieu-effectrapport als alternatief de activiteit is beschreven, waarop
      het besluit betrekking heeft, bij de voorbereiding waarvan het milieu-effectrapport moet worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 7.17.1
    text: Een milieu-effectrapport dat niet door het bevoegd gezag is gemaakt, wordt aan het bevoegd gezag overgelegd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.17
  - number: 7.17.2
    text: |-
      Het bevoegd gezag tekent de datum van ontvangst van het rapport daarop aan. Het zendt degene die het heeft
      overgelegd, een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.17
  - number: 7.18.1
    text: |-
      Indien het bevoegd gezag van oordeel is, dat een aan hem overgelegd milieu-effectrapport, mede gelet op
      de daarvoor overeenkomstig [artikel 7.15][ref1] gegeven richtlijnen, niet voldoet aan de bij of krachtens
      [de artikelen 7.10][ref2] en [7.11][ref3] gestelde regels, dan wel dat het onjuistheden bevat, deelt het dat onder
      opgave van redenen uiterlijk zes weken na de in [artikel 7.17, tweede lid][ref4], bedoelde datum mede aan degene
      die het rapport heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.18.2
    text: |-
      Indien het bevoegd gezag van oordeel is dat het milieu-effectrapport slechts te kort schiet op ondergeschikte
      punten, kan het de mededeling, bedoeld in het eerste lid, achterwege laten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.18
  - number: 7.18.3
    text: |-
      Ten aanzien van een milieu-effectrapport met betrekking waartoe het eerste lid toepassing heeft gevonden, blijven
      de overige artikelen van deze paragraaf buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.18
  - number: '7.19'
    text: |-
      Het bevoegd gezag kan een orgaan aanwijzen, dat voor de toepassing van [artikel 7.20][ref1] voor hem in de plaats
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.20.1
    text: |-
      Het bevoegd gezag zendt van een milieu-effectrapport onverwijld een exemplaar aan de commissie en aan de adviseurs.
      Het vermeldt daarbij de in [artikel 7.17, tweede lid][ref1], bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.20.2
    text: |-
      Het geeft kennis van het milieu-effectrapport met overeenkomstige toepassing van
      [artikel 3:12 van de Algemene wet bestuursrecht][ref1]. Kennisgeving geschiedt in een publicatie in een ander
      land ingeval er sprake is van mogelijke belangrijke nadelige gevolgen voor het milieu in dat andere land.
      Van een milieu-effectrapport dat niet door het bevoegd gezag is gemaakt, wordt uiterlijk acht weken na de in
      [artikel 7.17, tweede lid][ref2], bedoelde datum openbaar kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.20.3
    text: |-
      De [artikelen 3:11][ref1], [3:14][ref2], [3:15, eerste lid][ref3], [3:16][ref4] en
      [3:17 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing, met dien verstande dat in
      plaats van «het ontwerp van het te nemen besluit» en «het ontwerp» wordt gelezen: het milieu-effectrapport.
      Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.20.4
    text: |-
      De zienswijzen kunnen slechts betrekking hebben op het, mede gelet op de overeenkomstig [artikel 7.15][ref1]
      gegeven richtlijnen inzake de inhoud van het milieu-effectrapport, niet voldoen van het rapport aan de bij of
      krachtens de [artikelen 7.10][ref2] en [7.11][ref3] gestelde regels dan wel op onjuistheden die het rapport bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.26.1
    text: |-
      De commissie wordt tot uiterlijk vijf weken na het einde van de in
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde termijn in de gelegenheid gesteld
      advies uit te brengen. [Artikel 7.20, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.26.2
    text: |-
      De commissie betrekt in haar advies de overeenkomstig [afdeling 3.3 van de Algemene wet bestuursrecht][ref1]
      uitgebrachte adviezen en de overeenkomstig [artikel 7.20, derde lid][ref2], juncto
      [artikel 3:15, eerste lid, van de Algemene wet bestuursrecht][ref3] naar voren gebrachte zienswijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.26.3
    text: |-
      Indien er sprake is van mogelijke belangrijke nadelige grensoverschrijdende gevolgen voor het milieu, gaat de
      commissie in haar advies daarop in.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.26
  - number: 7.27.1
    text: |-
      Het bevoegd gezag neemt een besluit bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, niet
      dan nadat toepassing is gegeven aan [de artikelen 7.12][ref1] tot en met [7.26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.27.2
    text: |-
      Het bevoegd gezag neemt een zodanig besluit evenmin, indien de gegevens die in het milieu-effectrapport zijn
      opgenomen, redelijkerwijs niet meer aan het besluit ten grondslag kunnen worden gelegd in verband met aanmerkelijke
      wijziging van de omstandigheden waarvan bij het maken van het milieu-effectrapport is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.27
  - number: 7.27.3
    text: |-
      Het bevoegd gezag neemt een beslissing omtrent een activiteit die in een algemene maatregel van
      bestuur krachtens [artikel 7.4][ref1] is aangewezen en ten aanzien waarvan geen provinciale verordening
      krachtens [artikel 7.6, eerste lid][ref2], van toepassing is, niet dan nadat toepassing is gegeven aan
      [de artikelen 7.8][ref3] tot en met [7.8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.28.1
    text: |-
      Het bevoegd gezag laat een aanvraag om een besluit als bedoeld in [artikel 7.27][ref1] buiten behandeling indien


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.28.1.a
    text: bij het indienen van de aanvraag geen milieu-effectrapport is overgelegd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
  - number: 7.28.1.b
    text: |-
      ten aanzien van het overgelegde milieu-effectrapport [artikel 7.18, eerste lid][ref1], toepassing heeft gevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.28.1.c
    text: |-
      in gevallen waarin krachtens [artikel 14.5][ref1] ter voorbereiding van meer dan een besluit één milieu-
      effectrapport wordt gemaakt, de van de aanvrager afkomstige aanvragen tot het nemen van de andere betrokken
      besluiten niet tegelijkertijd worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 7.28.2
    text: |-
      Het bevoegd gezag laat de aanvraag tevens buiten behandeling indien een besluit als bedoeld in [artikel 7.8a][ref1]
      krachtens wettelijk voorschrift op aanvraag wordt genomen en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.28.2.a
    text: |-
      bij het indienen van de aanvraag geen afschrift is gevoegd van de beslissing krachtens
      [artikel 7.8b, eerste lid][ref1], inhoudende dat geen milieu-effectrapport behoeft te worden gemaakt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.28.2.b
    text: bij het indienen van de aanvraag geen milieu-effectrapport is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.28
  - number: '7.29'
    text: |-
      Indien van een aanvraag als bedoeld in [artikel 7.28][ref1], openbaar kennis wordt gegeven, wordt van het milieu-
      effectrapport - zo nodig in afwijking van [artikel 7.20, tweede lid, derde volzin][ref2] - in ieder geval
      gelijktijdig openbaar kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.30.1
    text: |-
      Indien krachtens wettelijk voorschrift van het voorontwerp of het ontwerp van een besluit als bedoeld in
      [artikel 7.27, eerste lid][ref1], openbaar kennis wordt gegeven, wordt van het milieu-effectrapport gelijktijdig
      openbaar kennisgegeven, behoudens in gevallen als bedoeld in [artikel 7.29][ref2]. Indien krachtens wettelijk
      voorschrift zowel van een voorontwerp als van een ontwerp van het besluit openbaar kennis wordt gegeven, wordt van
      het milieu-effectrapport gelijktijdig met het voorontwerp kennisgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.30.2
    text: |-
      Van het ontwerp van een zodanig besluit wordt, indien van een aanvraag om of een voorontwerp van het
      besluit openbaar kennis is gegeven, niet openbaar kennisgegeven dan nadat toepassing is gegeven aan de
      [artikelen 7.17 tot en met 7.20][ref1] en [7.26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.32.1
    text: |-
      Indien met betrekking tot een aanvraag als bedoeld in [artikel 7.28][ref1], dan wel tot het voorontwerp of het
      ontwerp van een besluit als bedoeld in [artikel 7.27, eerste lid][ref2], opmerkingen of bedenkingen kunnen worden
      ingediend, kunnen opmerkingen over het milieu-effectrapport in ieder geval gelijktijdig worden ingediend met
      opmerkingen of bedenkingen met betrekking tot het stuk waarmee van dat rapport tegelijkertijd openbaar kennis is
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.32.2
    text: |-
      Indien opmerkingen en bedenkingen met betrekking tot een zodanige aanvraag of een zodanig voorontwerp of ontwerp
      krachtens wettelijk voorschrift gedurende een termijn van vier weken of van langer dan vier weken kunnen worden
      ingediend, kan het bevoegd gezag ingevolge [artikel 7.23, eerste lid][ref1], geen langere dan die termijn bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.34.1
    text: |-
      Indien met betrekking tot handelingen als bedoeld in de [artikelen 7.28, eerste lid][ref1], [7.29][ref2],
      [7.30][ref3] en [7.32][ref4] de krachtens deze wet en krachtens andere wettelijke voorschriften geldende termijnen
      niet even lang zijn, geldt voor de betrokken perioden met betrekking tot de totstandkoming van het besluit de
      langste van die termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.34.2
    text: |-
      Indien krachtens wettelijk voorschrift een besluit als bedoeld in [artikel 7.27, eerste lid][ref1], binnen een
      bepaalde termijn moet worden genomen, wordt die termijn verlengd met vijf weken, alsmede, indien ingevolge het
      eerste lid langere termijnen in de plaats treden van termijnen die bij de totstandkoming van het besluit zouden
      gelden, met de som van de verschillen tussen de laatstbedoelde en de ingevolge het eerste lid geldende termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.35.1
    text: |-
      Bij het nemen van een besluit als bedoeld in [artikel 7.27][ref1] houdt het bevoegd gezag rekening met alle
      gevolgen die de activiteit waarop het besluit betrekking heeft, voor het milieu kan hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.35.2
    text: |-
      Behoudens voor zover bij of krachtens het derde tot en met zesde lid anders is voorzien, is het eerste lid slechts
      van toepassing voor zover de wettelijke regeling waarop het besluit berust, zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
  - number: 7.35.3
    text: |-
      Het bevoegd gezag kan, indien krachtens [artikel 7.2][ref1], [7.4][ref2] of [7.6][ref3] ter zake van een activiteit
      slechts één besluit is aangewezen, ongeacht de beperkingen die ter zake in de wettelijke regeling waarop het
      besluit berust, zijn gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.35.3.a
    text: |-
      naast de voorwaarden, voorschriften en beperkingen tot het opnemen waarvan het ingevolge die wettelijke regeling
      bevoegd is, in het besluit tevens alle andere voorwaarden, voorschriften en beperkingen opnemen, die nodig zijn ter
      bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
  - number: 7.35.3.b
    text: |-
      een besluit nemen, ertoe strekkende dat de activiteit niet wordt ondernomen, indien het ondernemen van die
      activiteit tot ontoelaatbare nadelige gevolgen voor het milieu kan leiden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
  - number: 7.35.4
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het derde lid is, ongeacht hetgeen ter zake in de betrokken
      wettelijke regeling is bepaald, [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 7.35.5
    text: |-
      Indien op de voorbereiding van meer dan een van de krachtens [artikel 7.2][ref1], [7.4][ref2] of [7.6][ref3] ter
      zake van eenzelfde activiteit aangewezen besluiten [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van
      toepassing is, wordt een van die besluiten aangewezen als het besluit waarop het derde lid van toepassing is. Bij
      die aanwijzing kan worden bepaald dat zij slechts geldt in daarbij aangegeven gevallen. De aanwijzing geschiedt bij
      algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref4
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 7.35.6
    text: |-
      Met betrekking tot het krachtens het vijfde lid aangewezen besluit is het derde lid van toepassing, met dien
      verstande dat slechts voorwaarden, voorschriften en beperkingen kunnen worden gesteld met betrekking tot
      onderwerpen waaromtrent geen voorwaarden, voorschriften en beperkingen kunnen worden gesteld bij de andere in het
      vijfde lid bedoelde besluiten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
  - number: 7.35.7
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de toepassing van het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.35
  - number: '7.36'
    text: |-
      Een krachtens een andere wettelijke regeling te nemen besluit wordt, ook voor zover daarbij [artikel 7.35][ref1]
      wordt toegepast, geacht krachtens die regeling te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.37.1
    text: |-
      De motivering van een besluit als bedoeld in [artikel 7.27, eerste lid][ref1], vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.37.1.a
    text: |-
      de wijze waarop rekening is gehouden met de in het milieu-effectrapport beschreven gevolgen voor het milieu van de
      activiteit waarop het besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.37
  - number: 7.37.1.b
    text: hetgeen is overwogen omtrent de in het milieu-effectrapport beschreven alternatieven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.37
  - number: 7.37.1.c
    text: |-
      hetgeen is overwogen omtrent de terzake van het milieu-effectrapport overeenkomstig
      [artikel 7.20, derde lid][ref1], juncto [artikel 3:15, eerste lid, van de Algemene wet bestuursrecht][ref2] naar
      voren gebrachte zienswijzen en de overeenkomstig [artikel 7.26][ref3] uitgebrachte adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.37.2
    text: |-
      Het bevoegd gezag bepaalt bij het besluit de termijn of de termijnen alsmede de wijze waarop het het onderzoek,
      bedoeld in [artikel 7.39][ref1], zal verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: 7.38.1
    text: |-
      Van een besluit als bedoeld in [artikel 7.27, eerste lid][ref1], doet het bevoegd gezag zo spoedig mogelijk
      mededeling door toezending van een exemplaar aan degenen die overeenkomstig [artikel 7.20, derde lid][ref2],
      juncto [artikel 3:15, eerste lid, van de Algemene wet bestuursrecht][ref3] zienswijzen naar voren hebben gebracht,
      aan de commissie en aan de adviseurs. [Artikel 3:44, tweede lid, van de Algemene wet bestuursrecht][ref4] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.38.2
    text: |-
      Het doet van zijn besluit tevens zo spoedig mogelijk mededeling met overeenkomstige toepassing van
      [artikel 3.44, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.38a.1
    text: |-
      Indien een activiteit bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, belangrijke
      nadelige gevolgen kan hebben voor het milieu in een ander land, worden de in het kader van dit hoofdstuk
      verzamelde informatie, alsmede de aanvraag, bedoeld in [artikel 7.28][ref1], onderscheidenlijk het ontwerp van
      het besluit bij de voorbereiding waarvan het milieu-effectrapport moet worden gemaakt en het besluit, bedoeld in
      [artikel 7.27][ref2], aan de regering of een door die regering aan te wijzen autoriteit in het andere land verstrekt
      gelijktijdig met de bekendmaking in Nederland. Tevens worden deze informatie en deze bescheiden toegezonden aan de
      instanties die daartoe door de bevoegde autoriteit van dat andere land zijn aangewezen op grond van hun specifieke
      verantwoordelijkheid op milieugebied. [Artikel 3:16, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3]
      en de [artikelen 7.14, eerste lid][ref4], en [7.20, vierde lid][ref5], zijn ten aanzien van die instanties van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.38a.2
    text: |-
      De ingevolge het eerste lid te verstrekken stukken dienen als grondslag voor het overleg met bestuursorganen in het
      betrokken andere land over de belangrijke nadelige gevolgen die de activiteit voor het milieu in dat andere land
      kan hebben, en de maatregelen die worden overwogen om die gevolgen te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38a
  - number: 7.38a.3
    text: |-
      Onze Minister is belast met de taken die voortvloeien uit de toepassing van het eerste en tweede lid, voorzover het
      betreft het verschaffen van informatie aan en overleg met de regering van het andere land. Overigens is het bevoegd
      gezag belast met die taken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38a
  - number: 7.38a.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38a
  - number: 7.38b
    text: |-
      Behoudens het bepaalde in [artikel 7.38][ref1], informeren Onze Minister onderscheidenlijk het bevoegd gezag zo
      spoedig mogelijk nadat uit de in het kader van [dit hoofdstuk][ref2] verzamelde informatie duidelijk is geworden
      dat er sprake is van mogelijke belangrijke nadelige gevolgen voor het milieu in een ander land de regering of een
      door die regering aan te wijzen autoriteit in dat andere land. Artikel 7.38*a*, tweede lid, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 7.38c.1
    text: |-
      Het bevoegd gezag zendt, indien er sprake is van mogelijke belangrijke nadelige gevolgen voor het milieu in een
      ander land, aan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
  - number: 7.38c.1.a
    text: |-
      een exemplaar van de mededeling, bedoeld in [artikel 7.12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.38c.1.b
    text: |-
      een exemplaar van de richtlijnen, bedoeld in [artikel 7.15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 7.38c.1.c
    text: |-
      een exemplaar van het milieu-effectrapport, bedoeld in [artikel 7.20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.38c.1.d
    text: |-
      een exemplaar van de aanvraag, bedoeld in artikel 7.28, onderscheidenlijk van het ontwerp van het besluit bij de
      voorbereiding waarvan het milieu-effectrapport moet worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
  - number: 7.38c.1.e
    text: |-
      een exemplaar van het besluit, bedoeld in [artikel 7.27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.38c.2
    text: |-
      Bij de toezending verzoekt het bevoegd gezag Onze Minister toepassing te geven aan
      [artikel 7.38a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.8'
  - number: 7.38d
    text: |-
      Indien een ander land belangrijke nadelige gevolgen voor het milieu meent te kunnen ondervinden van een activiteit
      in Nederland bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, geven Onze Minister
      onderscheidenlijk het bevoegd gezag op verzoek van dit land toepassing aan [artikel 7.38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.8'
  - number: 7.38e
    text: |-
      Indien een ander land belangrijke nadelige gevolgen voor het milieu kan ondervinden van een activiteit in Nederland
      bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, kan Onze Minister bepalen dat het
      bevoegd gezag het besluit bij de voorbereiding waarvan het milieu-effectrapport moet worden gemaakt, niet neemt
      dan nadat Onze Minister gedurende dertien weken na het einde van de in [artikel 7.26][ref1] bedoelde termijn in
      de gelegenheid is gesteld de uitkomsten van het overleg, bedoeld in [artikel 7.38][ref2], aan het bevoegd gezag te
      doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.8'
  - number: 7.38f
    text: |-
      De motivering van een besluit als bedoeld in [artikel 7.27, eerste lid][ref1], vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: 7.38f.a
    text: |-
      indien in het milieu-effectrapport of in het advies, bedoeld in [artikel 7.26][ref1], aandacht wordt geschonken aan
      mogelijke belangrijke nadelige grensoverschrijdende milieugevolgen, hetgeen daaromtrent is overwogen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 7.38f.b
    text: |-
      hetgeen is overwogen omtrent de uitkomsten van het overleg, bedoeld in [artikel 7.38a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.8'
  - number: 7.38g.1
    text: |-
      Indien een voorgenomen activiteit in een ander land belangrijke nadelige gevolgen voor het milieu in Nederland kan
      hebben, draagt Onze Minister zorg voor het onderhouden van de contacten met dat land.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38g
  - number: 7.38g.2
    text: Onze Minister kan bij uitvoering van het eerste lid de commissie om advies verzoeken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.38g
  - number: '7.39'
    text: |-
      Het bevoegd gezag dat een besluit heeft genomen, bij de voorbereiding waarvan een milieu-effectrapport is gemaakt,
      onderzoekt de gevolgen van de betrokken activiteit voor het milieu, wanneer zij wordt ondernomen of nadat zij is
      ondernomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.39
  - number: '7.40'
    text: |-
      Degene die de activiteit onderneemt, is verplicht aan het bevoegd gezag desgevraagd alle medewerking te verlenen
      en alle inlichtingen te verstrekken, die het redelijkerwijs voor het verrichten van het in [artikel 7.39][ref1]
      bedoelde onderzoek behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: '7.41'
    text: |-
      Het bevoegd gezag stelt een verslag op van het onderzoek. Het zendt zo spoedig mogelijk een
      exemplaar van het verslag aan degene die de activiteit onderneemt, aan de commissie en aan
      de adviseurs. Het maakt het verslag gelijktijdig bekend met overeenkomstige toepassing van
      [artikel 3:12, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7.42.1
    text: |-
      Indien uit het in [artikel 7.39][ref1] bedoelde onderzoek blijkt dat de activiteit in belangrijke mate nadeliger
      gevolgen voor het milieu heeft dan die welke bij het nemen van het besluit werden verwacht, neemt het bevoegd
      gezag, indien dat naar zijn oordeel nodig is, de hem ter beschikking staande maatregelen ten einde die gevolgen
      zoveel mogelijk te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: 7.42.2
    text: |-
      Met betrekking tot wijziging of intrekking van het besluit zijn [de artikelen 7.35][ref1] en [7.36][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '7.43'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot het in
      [artikel 7.39][ref1] bedoelde onderzoek, met betrekking tot het daarover uit te brengen verslag en met betrekking
      tot de bekendmaking van het verslag en van de in [artikel 7.42][ref2] bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel7.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.9'
  - number: 8.1.1
    text: 'Het is verboden zonder daartoe verleende vergunning een inrichting:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
  - number: 8.1.1.a
    text: op te richten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
  - number: 8.1.1.b
    text: te veranderen of de werking daarvan te veranderen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
  - number: 8.1.1.c
    text: in werking te hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Het verbod geldt niet met betrekking tot inrichtingen, behorende tot een categorie die bij een algemene maatregel
      van bestuur krachtens [artikel 8.40, eerste lid][ref1], is aangewezen, behoudens in gevallen waarin, krachtens
      [de tweede volzin][ref2] van dat lid, de bij die maatregel gestelde regels niet gelden voor een zodanige
      inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.1.3
    text: |-
      Het verbod bedoeld in het eerste lid, onder b, geldt niet met betrekking tot veranderingen van de inrichting of
      van de werking daarvan die in overeenstemming zijn met de voor de inrichting verleende vergunning en de daaraan
      verbonden beperkingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.1
  - number: 8.2.1
    text: |-
      Burgemeester en wethouders van de gemeente waarin de inrichting geheel of in hoofdzaak zal zijn of is gelegen, zijn
      bevoegd te beslissen op de aanvraag om een vergunning, behoudens in gevallen als bedoeld in het tweede, het derde
      en het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.2
  - number: 8.2.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ten aanzien van daarbij aangewezen categorieën van
      inrichtingen gedeputeerde staten van de provincie waarin de inrichting geheel of in hoofdzaak zal zijn of is
      gelegen, of Onze Minister bevoegd zijn te beslissen op de aanvraag om een vergunning. Een zodanige maatregel wordt
      slechts vastgesteld met betrekking tot categorieën van inrichtingen ten aanzien waarvan dat geboden is gezien de
      aard en de omvang van de gevolgen die die inrichtingen voor het milieu kunnen veroorzaken, dan wel met het oog op
      de doelmatige bescherming van het milieu of met betrekking tot categorieën van gevallen waarin dat geboden is met
      het oog op het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.2
  - number: 8.2.3
    text: |-
      In afwijking van het eerste en het tweede lid is Onze Minister van Economische Zaken bevoegd te beslissen op een
      aanvraag om een vergunning voor een inrichting die een krachtens [artikel 1 van de Mijnbouwwet][ref1] aangewezen
      mijnbouwwerk is, voorzover het niet betreft de ondergronds gelegen inrichting voor het opslaan van afvalstoffen die
      van buiten het betrokken mijnbouwwerk afkomstig zijn, dan wel gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: 8.2.4
    text: |-
      In afwijking van het eerste en het tweede lid kan Onze Minister - indien dat geboden is in het belang van de
      veiligheid van de Staat - in overeenstemming met Onze betrokken Minister bepalen dat hij ten aanzien van een bij
      zijn besluit aangewezen inrichting bevoegd is te beslissen op de aanvraag om een vergunning.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Indien bij of krachtens een wettelijke bepaling, dan wel door een verandering van de inrichting of de werking
      daarvan de bevoegdheid te beslissen op aanvragen om een vergunning voor een inrichting overgaat naar een ander
      orgaan, worden reeds voor die inrichting verleende vergunningen gelijkgesteld met vergunningen, verleend door dat
      andere orgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.3
  - number: 8.3.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot hetgeen verder regeling behoeft
      in verband met een overgang als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Indien een vergunning wordt aangevraagd als bedoeld in [artikel 8.1, eerste lid, onder ][ref1], voor het veranderen
      van een inrichting of van de werking daarvan en voor die inrichting al een of meer vergunningen krachtens deze
      wet zijn verleend, kan het bevoegd gezag, uit eigen beweging of op verzoek, bepalen dat een vergunning moet worden
      aangevraagd voor die verandering en voor het in werking hebben na die verandering van de gehele inrichting of
      onderdelen daarvan, waarmee die verandering samenhangt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.4.2
    text: |-
      Indien het bevoegd gezag heeft bepaald dat een zodanige vergunning moet worden aangevraagd, besluit het tot het
      buiten behandeling laten van aanvragen om een vergunning voor de betrokken verandering van de inrichting of van de
      werking daarvan, die geen betrekking hebben op een zodanige vergunning.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.4
  - number: 8.4.3
    text: |-
      Het bevoegd gezag kan de rechten die de vergunninghouder aan de al eerder verleende vergunningen ontleende, niet
      wijzigen anders dan mogelijk zou zijn met toepassing van [afdeling 8.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.4.4
    text: |-
      Een met toepassing van [dit artikel][ref1] verleende vergunning vervangt met ingang van het tijdstip waarop zij
      in werking treedt, de eerder voor de inrichting of met betrekking tot de in het eerste lid bedoelde onderdelen
      daarvan verleende vergunningen. Deze vergunningen vervallen op het tijdstip waarop de met toepassing van
      [dit artikel][ref2] verleende vergunning onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.5.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de aanvraag moet
      geschieden en de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beslissing op de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.5
  - number: 8.5.2
    text: |-
      Bij de maatregel wordt in ieder geval bepaald dat de aanvrager in gevallen waarin de vergunning betrekking
      heeft op het oprichten of veranderen van een inrichting, dat tevens is aan te merken als bouwen in de zin van de
      [Woningwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 8.5.2.a
    text: |-
      indien de aanvraag om bouwvergunning voor dat bouwen tegelijk met de aanvraag om de vergunning krachtens deze wet
      is ingediend, een afschrift van die aanvraag om bouwvergunning bij zijn aanvraag overlegt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.5
  - number: 8.5.2.b
    text: |-
      indien de aanvraag om bouwvergunning voor dat bouwen niet tegelijk met de aanvraag om de vergunning krachtens deze
      wet wordt ingediend, een afschrift van die aanvraag om bouwvergunning aan het bevoegd gezag overlegt gelijktijdig
      met de indiening van die aanvraag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.5
  - number: 8.5.3
    text: Onze Minister kan nadere regels stellen ter uitvoering van het bepaalde krachtens het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.5
  - number: '8.6'
    text: |-
      Op de voorbereiding van de beschikking op de aanvraag om een vergunning is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.7.1
    text: Het bevoegd gezag stelt
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.7.1.a
    text: |-
      de inspecteur, indien de betrokken inrichting behoort tot een door Onze Minister bij ministeriële regeling
      aangewezen categorie,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.7.1.b
    text: |-
      burgemeester en wethouders van de gemeente waarin de betrokken inrichting zal zijn of is gelegen, in gevallen
      waarin zij niet het bevoegd gezag zijn,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.7.1.c
    text: |-
      andere bij algemene maatregel van bestuur aangewezen bestuursorganen in gevallen die bij die maatregel zijn
      aangewezen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.7.2
    text: |-
      De adviseurs kunnen het bevoegd gezag te allen tijde uit eigen beweging advies uitbrengen over de beslissing op
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Bij algemene maatregel van bestuur kunnen bestuursorganen worden aangewezen, die - anders dan als adviseurs -
      eveneens bij de totstandkoming van de beschikking op de aanvraag worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.7
  - number: 8.8.1
    text: 'Het bevoegd gezag betrekt bij de beslissing op de aanvraag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.1.a
    text: de bestaande toestand van het milieu, voor zover de inrichting daarvoor gevolgen kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.1.b
    text: |-
      de gevolgen voor het milieu, mede in hun onderlinge samenhang bezien, die de inrichting kan veroorzaken, mede
      gezien haar technische kenmerken en haar geografische ligging;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.1.c
    text: |-
      de met betrekking tot de inrichting en het gebied waar de inrichting zal zijn of is gelegen, redelijkerwijs te
      verwachten ontwikkelingen die van belang zijn met het oog op de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.1.d
    text: |-
      de voor het einde van de in [artikel 3:16 van de Algemene wet bestuursrecht][ref1] bedoelde termijn overeenkomstig
      [artikel 3:15 van die wet][ref2] naar voren gebrachte zienswijzen en door de krachtens [artikel 8.7][ref3]
      aangewezen adviseurs en overeenkomstig [artikel 8.31][ref4] uitgebrachte adviezen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
  - number: 8.8.1.e
    text: |-
      de mogelijkheden tot bescherming van het milieu, door de nadelige gevolgen voor het milieu, die de inrichting kan
      veroorzaken, te voorkomen, dan wel zoveel mogelijk te beperken, voor zover zij niet kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.1.f
    text: |-
      het systeem van met elkaar samenhangende technische, administratieve en organisatorische maatregelen om de gevolgen
      die de inrichting voor het milieu veroorzaakt, te monitoren, te beheersen en, voor zover het nadelige gevolgen
      betreft, te verminderen, dat degene die de inrichting drijft, met betrekking tot de inrichting toepast, alsmede het
      milieubeleid dat hij met betrekking tot de inrichting voert.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.2
    text: 'Het bevoegd gezag houdt bij de beslissing op de aanvraag in ieder geval rekening met:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.2.a
    text: het voor hem geldende milieubeleidsplan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.2.b
    text: |-
      het bepaalde in [artikel 10.14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.8.2.c
    text: |-
      de voor de onderdelen van het milieu, waarvoor de inrichting gevolgen kan hebben, geldende richtwaarden, voor zover
      de verplichting tot het rekening houden daarmee is vastgelegd krachtens of overeenkomstig [artikel 5.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.8.3
    text: 'Het bevoegd gezag neemt bij de beslissing op de aanvraag in ieder geval in acht:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: 8.8.3.a
    text: |-
      de voor de onderdelen van het milieu, waarvoor de inrichting gevolgen kan hebben, geldende grenswaarden, voor zover
      de verplichting tot het in acht nemen daarvan is vastgelegd krachtens of overeenkomstig [artikel 5.2][ref1], dan
      wel voortvloeit uit de [artikelen 41][ref2], [46 tot en met 50][ref3], [53][ref4], [65 tot en met 68][ref5] of
      [72, tweede lid, van de Wet geluidhinder][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel65
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel72
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '46'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '53'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '65'
      - id: ref6
        bwb_id: BWBR0003227
        artikel: '72'
  - number: 8.8.3.b
    text: |-
      de voor hem geldende, krachtens [artikel 8.45][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: 8.8.3.c
    text: |-
      de voor hem geldende, krachtens [artikel 8.46][ref1] gestelde regels, behoudens voor zover een aanwijzing van Onze
      Minister krachtens [artikel 8.27][ref2] afwijking noodzakelijk maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.1
        afdeling: 8.1.3
  - number: 8.8.3.d
    text: |-
      aanwijzingen die met betrekking tot de beslissing op de aanvraag krachtens [artikel 8.27][ref1] door Onze Minister
      zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.1
        afdeling: 8.1.3
  - number: 8.8.4
    text: |-
      Het bevoegd gezag geeft in de motivering van de beslissing op de aanvraag aan, op welke wijze de in het eerste lid
      genoemde aspecten de inhoud van het besluit hebben beïnvloed.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      Het bevoegd gezag draagt er bij de beslissing op de aanvraag zorg voor dat er geen strijd ontstaat met regels
      die met betrekking tot de inrichting gelden, gesteld bij of krachtens deze wet, dan wel bij of krachtens de in
      [artikel 13.1, tweede lid][ref1], genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
  - number: 8.10.1
    text: De vergunning kan slechts in het belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
  - number: 8.10.2
    text: 'De vergunning wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
  - number: 8.10.2.a
    text: |-
      door verlening daarvan niet kan worden bereikt dat in de inrichting ten minste de voor de inrichting in aanmerking
      komende beste beschikbare technieken worden toegepast;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
  - number: 8.10.2.b
    text: |-
      verlening daarvan niet in overeenstemming zou zijn met hetgeen overeenkomstig [artikel 8.8, derde lid][ref1], door
      het bevoegd gezag in acht moet worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.10.2.c
    text: |-
      door verlening daarvan strijd zou ontstaan met regels als bedoeld in [artikel 8.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.10.3
    text: |-
      In afwijking van het eerste lid kan de vergunning tevens worden geweigerd in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 8.10.4
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], om een advies als
      bedoeld in [artikel 9 van die wet][ref2] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: 8.11.1
    text: In een vergunning wordt duidelijk aangegeven waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.11
  - number: 8.11.2
    text: Een vergunning kan in het belang van de bescherming van het milieu onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.11
  - number: 8.11.3
    text: |-
      In het belang van het bereiken van een hoog niveau van bescherming van het milieu worden aan de vergunning de
      voorschriften verbonden, die nodig zijn om de nadelige gevolgen die de inrichting voor het milieu kan veroorzaken,
      te voorkomen of, indien dat niet mogelijk is, zoveel mogelijk – bij voorkeur bij de bron – te beperken en ongedaan
      te maken. Daarbij wordt ervan uitgegaan dat in de inrichting ten minste de voor de inrichting in aanmerking komende
      beste beschikbare technieken worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.11
  - number: 8.11.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de voor
      een inrichting in aanmerking komende beste beschikbare technieken worden bepaald. Daarbij kan worden bepaald dat de
      gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.11
  - number: 8.11.5
    text: |-
      Voor zover met betrekking tot de inrichting regels gelden, gesteld bij of krachtens deze wet, dan wel bij of
      krachtens de in [artikel 13.1, tweede lid][ref1], genoemde wetten, kunnen de beperkingen en voorschriften daarvan
      alleen afwijken voor zover dat bij die regels is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
  - number: 8.12.1
    text: |-
      De aan een vergunning te verbinden voorschriften geven de doeleinden aan, die de vergunninghouder in het belang van
      de bescherming van het milieu op een door hem te bepalen wijze dient te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.2
    text: |-
      Bij de voorschriften worden emissiegrenswaarden gesteld voor stoffen of voor daarbij aan te wijzen groepen,
      families of categorieën van stoffen – in het bijzonder die, genoemd in bijlage III van de EG-richtlijn inzake
      geïntegreerde preventie en bestrijding van verontreiniging –, die in aanmerkelijke hoeveelheden uit de inrichting
      kunnen vrijkomen en die direct of door overdracht tussen water, lucht en bodem nadelige gevolgen voor het milieu
      kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Bij het vaststellen van de emissiegrenswaarden wordt uitgegaan van de emissies op het punt waar zij de bron, in
      voorkomend geval na reiniging, verlaten, tenzij dat redelijkerwijs niet mogelijk is. De emissiegrenswaarden worden
      vastgesteld zonder rekening te houden met een mogelijke verdunning. Bij het vaststellen van emissiegrenswaarden
      voor afvalwater dat in een voorziening voor de inzameling en het transport van afvalwater wordt gebracht, kan
      rekening worden gehouden met het effect van een zuiveringstechnisch werk waarop die voorziening is aangesloten,
      voor zover daarvan geen nadeliger gevolgen voor het milieu zijn te verwachten en voldaan wordt aan de bepalingen
      die gelden ter uitvoering van [richtlijn nr. 76/464/EEG](31976L0464) van de Raad van de Europese Gemeenschappen van
      4 mei 1976 betreffende de verontreiniging veroorzaakt door bepaalde gevaarlijke stoffen die in het aquatisch milieu
      van de Gemeenschap worden geloosd, en de ter toepassing daarvan geldende richtlijnen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.4
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het eerste en tweede lid, worden
      daaraan in ieder geval ook voorschriften verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.4.a
    text: |-
      moet worden bepaald of aan de eerstbedoelde voorschriften wordt voldaan, waarbij de wijze van bepaling wordt
      aangegeven, die ten minste betrekking heeft op de methode en de frequentie van de bepaling en de procedure voor de
      beoordeling van de bij die bepaling verkregen gegevens en die tevens betrekking kan hebben op de organisatie van
      die bepalingen en beoordelingen en op de registratie van die gegevens en de resultaten van die beoordelingen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.4.b
    text: |-
      de bij die bepaling verkregen gegevens aan het bevoegd gezag moeten worden gemeld of ter inzage gegeven of
      anderszins ter beschikking moeten worden gesteld van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.5
    text: |-
      In afwijking van het vierde lid, onder b, worden geen voorschriften aan de vergunning verbonden met betrekking tot
      het ter beschikking stellen van gegevens als bedoeld in dat onderdeel, voor zover:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
  - number: 8.12.5.a
    text: |-
      die gegevens krachtens [artikel 12.4, tweede lid][ref1], moeten worden opgenomen in een milieuverslag dat ten
      behoeve van een bestuursorgaan moet worden opgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 8.12.5.b
    text: |-
      daardoor strijd ontstaat met regels gesteld krachtens de [artikelen 12.4, vierde lid][ref1], of [12.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 8.12a.1
    text: |-
      Voor zover dit naar het oordeel van het bevoegd gezag noodzakelijk is, kunnen aan de vergunning voorschriften
      worden verbonden, inhoudende de verplichting tot het treffen van technische maatregelen. Voor zover die
      voorschriften betrekking hebben op gpbv-installaties wordt daarbij niet het gebruik van bepaalde technieken of
      technologieën voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
  - number: 8.12a.2
    text: |-
      Indien voorschriften als bedoeld in het eerste lid, aan de vergunning worden verbonden in plaats van voorschriften
      als bedoeld in [artikel 8.12, eerste en tweede lid][ref1], leiden de technische maatregelen tot een gelijkwaardige
      bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.12a.3
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het eerste lid, kunnen daaraan in ieder
      geval ook voorschriften worden verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
  - number: 8.12a.3.a
    text: |-
      over de uitvoering van technische maatregelen waartoe die voorschriften verplichten, verslag wordt gedaan aan het
      bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
  - number: 8.12a.3.b
    text: |-
      daarbij aangegeven metingen, berekeningen of tellingen moeten worden verricht ter bepaling van de mate waarin de
      inrichting de nadelige gevolgen voor het milieu veroorzaakt, ter voorkoming of beperking waarvan die voorschriften
      zijn bedoeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
  - number: 8.12a.4
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het derde lid, is
      [artikel 8.12, vierde lid, onder b][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.12b
    text: |-
      Aan de vergunning worden in ieder geval de voor de betrokken inrichting in aanmerking komende voorschriften
      verbonden met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.a
    text: een doelmatig gebruik van energie en grondstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.b
    text: de bescherming van bodem en grondwater;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.c
    text: |-
      het voorkomen van het ontstaan van afvalstoffen en afvalwater en, voor zover dat niet mogelijk is, het doelmatig
      beheer van afvalstoffen en van afvalwater;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.d
    text: |-
      het beperken van de nadelige gevolgen voor het milieu van het verkeer van personen of goederen van en naar de
      inrichting;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.e
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van door de inrichting veroorzaakte verontreinigingen over lange
      afstand of grensoverschrijdende verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.f
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van de nadelige gevolgen voor het milieu, die kunnen worden
      veroorzaakt door opstarten, lekken, storingen, korte stilleggingen, definitieve bedrijfsbeëindiging of andere
      bijzondere bedrijfsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.g
    text: het voorkomen van ongevallen en het beperken van de gevolgen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.12b.h
    text: |-
      het treffen van maatregelen om bij definitieve bedrijfsbeëindiging de nadelige gevolgen die de inrichting heeft
      veroorzaakt voor het terrein waarop zij was gevestigd, ongedaan te maken of te beperken voor zover dat nodig is om
      dat terrein weer geschikt te maken voor een volgende functie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.12b
  - number: 8.13.1
    text: |-
      Aan een vergunning kunnen in het belang van de bescherming van het milieu andere voorschriften worden verbonden.
      Die voorschriften kunnen in ieder geval inhouden:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.a
    text: |-
      dat daarbij aangegeven metingen, berekeningen of tellingen – andere dan bedoeld in de [artikelen 8.12][ref1] en
      [8.12a][ref2] – moeten worden verricht ter bepaling van de mate waarin de inrichting nadelige gevolgen voor het
      milieu veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.13.1.b
    text: |-
      dat in een mate als bij het voorschrift aangegeven, onderzoek moet worden verricht naar mogelijkheden tot
      verdergaande bescherming van het milieu dan waarin de andere aan de vergunning verbonden voorschriften voorzien;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.c
    text: |-
      dat de uitkomsten van daarbij aangegeven metingen, berekeningen, tellingen of onderzoeken moeten worden
      geregistreerd en bewaard dan wel moeten worden gemeld of ter beschikking gesteld van bij het voorschrift aangewezen
      bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.d
    text: |-
      dat moet worden voldaan aan daarbij aangegeven eisen ten aanzien van de vakbekwaamheid van in de inrichting
      werkzame personen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.e
    text: |-
      dat aan de in de inrichting werkzame personen schriftelijk instructies worden gegeven om handelen in strijd met de
      vergunning, de daaraan verbonden voorschriften of krachtens [artikel 8.44][ref1] gestelde regels tegen te gaan, en
      dat toezicht wordt gehouden op het naleven van die instructies;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: 8.13.1.f
    text: |-
      dat met betrekking tot in het voorschrift geregelde, daarbij aangegeven onderwerpen moet worden voldaan aan nadere
      eisen die door een bij het voorschrift aangewezen bestuursorgaan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.g
    text: |-
      dat van daarbij aangegeven veranderingen als bedoeld in [artikel 8.1, derde lid][ref1], binnen een in het
      voorschrift te bepalen termijn schriftelijk mededeling wordt gedaan aan het bevoegd gezag of een door hem
      aangewezen instantie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.13.1.h
    text: |-
      dat met het oog op het kunnen voldoen aan de andere aan de vergunning verbonden voorschriften daarbij aangegeven
      organisatorische en administratieve maatregelen moeten worden getroffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.1.i
    text: |-
      dat met betrekking tot een bij het voorschrift aangegeven onderwerp waarover geen andere voorschriften aan de
      vergunning zijn verbonden, voldoende zorg in acht moet worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.2
    text: |-
      In afwijking van het eerste lid, onder *c*, worden geen voorschriften aan de vergunning verbonden met betrekking
      tot het melden of ter beschikking stellen van uitkomsten als bedoeld in dat onderdeel, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13.2.a
    text: |-
      die uitkomsten als gegevens krachtens [artikel 12.4, tweede lid][ref1], moeten worden opgenomen in een
      milieuverslag dat ten behoeve van een bestuursorgaan moet worden opgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 8.13.2.b
    text: |-
      daardoor strijd ontstaat met regels gesteld krachtens [de artikelen 12.4, vijfde lid][ref1], of [12.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 8.13.3
    text: |-
      Bij een voorschrift inzake nadere eisen als bedoeld in het eerste lid, onder *f*, kan worden aangegeven hoe van die
      eisen door het aangewezen bestuursorgaan openbaar wordt kennisgegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13
  - number: 8.13a.1
    text: |-
      Aan een vergunning worden geen voorschriften verbonden, die het naar of uit de provincie brengen van afvalstoffen
      beperken of uitsluiten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13a
  - number: 8.13a.2
    text: |-
      Aan een vergunning worden, indien het een inrichting betreft waarop de in [artikel 16.5, eerste lid][ref1],
      vervatte verboden betrekking hebben, geen voorschriften verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 8.13a.2.a
    text: |-
      inhoudende een emissiegrenswaarde voor de directe emissie van broeikasgassen, tenzij zulks noodzakelijk is om te
      verzekeren dat geen significante gevolgen voor het milieu in de onmiddellijke omgeving van de inrichting worden
      veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13a
  - number: 8.13a.2.b
    text: ter bevordering van een zuinig gebruik van energie in de inrichting.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13a
  - number: 8.13a.3
    text: |-
      Voorzover aan een vergunning die betrekking heeft op een inrichting als bedoeld in het tweede lid voorschriften
      zijn verbonden als in dat lid bedoeld, vervallen die voorschriften.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.13a
  - number: 8.14.1
    text: |-
      Indien de vergunning betrekking heeft op een inrichting waarin afvalstoffen nuttig worden toegepast of worden
      verwijderd, bevat de vergunning ten minste de verplichtingen:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.a
    text: 'tot het registreren van:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.a.1°
    text: |-
      daarbij aangewezen afvalstoffen die in de inrichting nuttig worden toegepast of worden verwijderd: naar
      hoeveelheid, aard en oorsprong;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.a.2°
    text: |-
      stoffen die bij de nuttige toepassing of verwijdering van die afvalstoffen worden gebruikt of verbruikt: naar aard
      en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.a.3°
    text: |-
      stoffen, preparaten en andere producten, hieronder mede begrepen afvalstoffen, die bij de nuttige toepassing of
      verwijdering ontstaan: naar aard en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.a.4°
    text: |-
      de wijze waarop [de onder 3°][ref1] bedoelde afvalstoffen nuttig worden toegepast of worden verwijderd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.14.1.a.5°
    text: |-
      stoffen, preparaten en andere producten die de inrichting verlaten, voor zover deze bij de nuttige toepassing of
      verwijdering zijn ontstaan: naar aard en hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.1.b
    text: tot het bewaren van de geregistreerde gegevens gedurende ten minste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.14.2
    text: Onze Minister kan regels stellen omtrent de wijze waarop de registratie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.14
  - number: 8.15.1
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat in daarbij aangegeven categorieën van gevallen waarin
      inrichtingen ernstige nadelige gevolgen voor het milieu kunnen veroorzaken, aan de vergunning tevens voorschriften
      kunnen worden verbonden, die de verplichting inhouden dat degene die de inrichting drijft:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
  - number: 8.15.1.a
    text: financiële zekerheid stelt voor het nakomen van krachtens de vergunning voor hem geldende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
  - number: 8.15.1.b
    text: |-
      financiële zekerheid stelt ter dekking van zijn aansprakelijkheid voor schade die voortvloeit uit door de
      inrichting veroorzaakte nadelige gevolgen voor het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
  - number: 8.15.2
    text: |-
      Bij een maatregel krachtens het eerste lid worden nadere regels gesteld met betrekking tot de op te leggen
      voorschriften. Daarbij worden in ieder geval aangegeven het bedrag waarvoor en de termijn gedurende welke de
      zekerheid ten hoogste in stand moet worden gehouden, alsmede de voorwaarden waaraan moet worden voldaan alvorens de
      verplichting kan komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
  - number: 8.15.3
    text: |-
      Bij de maatregel kunnen regels worden gesteld voor gevallen waarin aan de verplichting uitvoering wordt gegeven
      door het sluiten en in stand houden van een verzekering. Daarbij wordt rekening gehouden met hetgeen redelijkerwijs
      door verzekering kan worden gedekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
  - number: 8.15.4
    text: |-
      Indien overeenkomstig het eerste lid een voorschrift als bedoeld in dat lid, onder *a*, aan een vergunning is
      verbonden, kan het bevoegd gezag bij het niet nakomen door de houder van de vergunning van een krachtens de
      vergunning voor hem geldende verplichting waarvoor financiële zekerheid is gesteld, bepalen tot welk bedrag
      het verhaal zal nemen op de gestelde zekerheid. [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] is van
      overeenkomstige toepassing met betrekking tot de invordering van het te verhalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '8.16'
    text: 'In een vergunning kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.16
  - number: 8.16.a
    text: |-
      dat daarbij aangewezen voorschriften eerst in werking treden op een daarbij aangegeven tijdstip, dan wel wanneer
      een daarbij aangegeven omstandigheid zich voordoet;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.16
  - number: 8.16.b
    text: dat daarbij aangewezen voorschriften slechts gelden tot een daarbij aangegeven tijdstip, dan wel omstandigheid;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.16
  - number: 8.16.c
    text: |-
      dat daarbij aangewezen voorschriften nadat de vergunning haar gelding heeft verloren, gedurende een daarbij
      aangegeven termijn van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.16
  - number: 8.17.1
    text: |-
      In een vergunning kan worden bepaald dat zij slechts geldt voor een daarbij vast te stellen termijn van ten hoogste
      vijf jaar, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.1.a
    text: de inrichting waarop de vergunning betrekking heeft, naar haar aard tijdelijk is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.1.b
    text: uit de aanvraag blijkt dat de vergunning slechts voor een daarbij aangegeven termijn wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.1.c
    text: |-
      dat nodig is in het belang van het ontwikkelen van werkwijzen in de inrichting, die minder nadelige gevolgen voor
      het milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.1.d
    text: dat nodig is in verband met het ontwikkelen van een beter inzicht in de gevolgen van de inrichting voor het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.2
    text: |-
      Bij algemene maatregel van bestuur worden categorieën van inrichtingen waarin afvalstoffen nuttig worden toegepast
      of worden verwijderd, aangewezen, ten aanzien waarvan de vergunning, voorzover zij deze handelingen betreft,
      slechts geldt voor een bij de vergunning te stellen termijn van ten hoogste tien jaar. Bij de maatregel kan worden
      bepaald dat de aanwijzing slechts betrekking heeft op daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.17.3
    text: |-
      In een vergunning wordt bepaald dat zij slechts geldt voor een daarbij aangegeven termijn, voor zover dat is
      bepaald bij een algemene maatregel van bestuur, die is vastgesteld ter uitvoering van een voor Nederland verbindend
      verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie. De bij de maatregel
      aangegeven termijn kan zo nodig afwijken van de in het eerste en tweede lid genoemde termijnen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.17
  - number: 8.18.1
    text: De vergunning voor een inrichting vervalt
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.18
  - number: 8.18.1.a
    text: |-
      indien de inrichting niet binnen drie jaar nadat de vergunning onherroepelijk is geworden, is voltooid en in
      werking gebracht;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.18
  - number: 8.18.1.b
    text: |-
      indien de inrichting een stortplaats is, als bedoeld in [artikel 8.47][ref1]: indien de stortplaats krachtens het
      derde lid van genoemd artikel voor gesloten is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.18.2
    text: |-
      Indien kan worden verwacht dat de inrichting niet binnen de in het eerste lid, onder a, bedoelde termijn kan worden
      voltooid en in werking gebracht, kan in de vergunning een andere termijn worden vastgesteld, die daarvoor in de
      plaats treedt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.18
  - number: 8.19.1
    text: |-
      Een voor een inrichting verleende vergunning geldt ook voor een onderdeel van een inrichting, ten aanzien waarvan,
      ware het een zelfstandige inrichting, het in [artikel 8.1, eerste lid][ref1], gestelde verbod niet zou gelden
      ingevolge een algemene maatregel van bestuur krachtens [artikel 8.40][ref2], indien dat bij die maatregel is
      bepaald. In dat geval gelden voor het betrokken onderdeel uitsluitend de bij de maatregel gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.19.2
    text: |-
      Een voor een inrichting verleende vergunning geldt tevens voor veranderingen van de inrichting of van de werking
      daarvan die niet in overeenstemming zijn met de voor de inrichting verleende vergunning of de daaraan verbonden
      beperkingen en voorschriften, maar die niet leiden tot andere of grotere nadelige gevolgen voor het milieu dan die
      de inrichting ingevolge de vergunning en de daaraan verbonden beperkingen en voorschriften mag veroorzaken, onder
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.2.a
    text: deze veranderingen niet leiden tot een andere inrichting dan waarvoor vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.2.b
    text: |-
      het voornemen tot het uitvoeren van de verandering door de vergunninghouder schriftelijk overeenkomstig de
      krachtens het zevende lid, onder a, gestelde regels aan het bevoegd gezag is gemeld, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.2.c
    text: |-
      het bevoegd gezag aan de vergunninghouder schriftelijk heeft verklaard dat de voorgenomen verandering voldoet
      aan de aanhef en onderdeel a en de verandering naar zijn oordeel geen aanleiding geeft tot toepassing van
      [de artikelen 8.22][ref1], [8.23][ref2] of [8.25][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.19.3
    text: |-
      Het tweede lid is niet van toepassing op veranderingen ten aanzien waarvan, indien zij vergunningplichtig zouden
      zijn geweest, bij de voorbereiding van de besluiten terzake, een milieu-effectrapport had moeten worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.4
    text: |-
      Een besluit inzake een verklaring als bedoeld in het tweede lid, onder c, wordt zo spoedig mogelijk, doch uiterlijk
      zes weken na ontvangst van de melding, bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.5
    text: |-
      Zo spoedig mogelijk, doch uiterlijk twee weken na de bekendmaking van de verklaring geeft het bevoegd gezag
      openbaar kennis daarvan. Indien de verklaring betrekking heeft op een inrichting die behoort tot een krachtens
      [artikel 8.7, eerste lid, onder a][ref1], aangewezen categorie, zendt het bevoegd gezag bovendien een afschrift van
      de melding en de verklaring aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.19.6
    text: |-
      Het bevoegd gezag geeft een ieder desgevraagd kosteloos inzage in de melding en de daarbij behorende stukken en
      verstrekt daarvan desgevraagd tegen betaling van de kosten een afschrift.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.7
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.7.a
    text: de gegevens die bij de melding moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.19.7.b
    text: de openbare kennisgeving van de verklaring.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.19
  - number: 8.20.1
    text: |-
      Een voor een inrichting verleende vergunning geldt voor ieder die de inrichting drijft. Deze draagt ervoor zorg dat
      de aan de vergunning verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.20
  - number: 8.20.2
    text: |-
      Indien een vergunning zal gaan gelden voor een ander dan de vergunninghouder, meldt de vergunninghouder dat
      ten minste een maand voordien aan het bevoegd gezag, onder vermelding van de bij algemene maatregel van bestuur
      aangegeven gegevens.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.20
  - number: 8.20.3
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van gevallen worden aangegeven, waarin de vergunning slechts
      geldt voor degene aan wie zij is verleend. Daarbij kan tevens worden bepaald dat in daarbij aangegeven categorieën
      van gevallen:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.20
  - number: 8.20.3.a
    text: |-
      de vergunning nog gedurende een daarbij aangegeven termijn blijft gelden voor rechtsopvolgers van degene aan wie
      zij is verleend;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.20
  - number: 8.20.3.b
    text: |-
      de vergunning ook geldt voor een rechtspersoon, aan wie zij is overgedragen door een andere rechtspersoon, indien
      daarvoor door het bevoegd gezag, dan wel – in gevallen als aangegeven krachtens [artikel 8.35][ref1] – Onze
      Minister toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.21.1
    text: |-
      Indien met betrekking tot een inrichting waarvoor de in [artikel 8.1, eerste lid][ref1], vervatte verboden
      niet gelden, die verboden op enig tijdstip gaan gelden, kan die inrichting in afwijking van die bepaling zonder
      vergunning in werking worden gehouden tot twaalf weken na dat tijdstip en, indien binnen deze termijn een aanvraag
      om de krachtens die bepaling vereiste vergunning is ingediend, vervolgens tot acht weken na het tijdstip waarop de
      beschikking op die aanvraag in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.21.2
    text: |-
      Indien zodanige verboden gaan gelden ten gevolge van een verandering van de inrichting of van de werking daarvan,
      is het eerste lid niet van toepassing, voor zover het die verandering betreft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.21
  - number: 8.21.3
    text: |-
      Indien de in [artikel 8.1, eerste lid][ref1], vervatte verboden met betrekking tot de inrichting niet golden
      ingevolge het tweede lid van dat artikel, blijven de voorschriften die krachtens een algemene maatregel van bestuur
      krachtens [artikel 8.40][ref2] voor de inrichting golden of krachtens de provinciale milieuverordening krachtens
      [artikel 1.2, zesde lid, onder ][ref3], onmiddellijk voor het gaan gelden van die verboden, voor de inrichting
      van toepassing gedurende de periode waarin de inrichting ingevolge het eerste lid zonder vergunning in werking mag
      worden gehouden, behoudens voor zover het veranderingen als bedoeld in het tweede lid betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.22.1
    text: |-
      Het bevoegd gezag beziet regelmatig of de beperkingen waaronder een vergunning is verleend, en de voorschriften
      die aan een vergunning zijn verbonden, nog toereikend zijn gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.22
  - number: 8.22.2
    text: |-
      Het bevoegd gezag wijzigt de beperkingen waaronder de vergunning is verleend en de voorschriften die daaraan zijn
      verbonden, vult deze aan of trekt ze in, dan wel brengt alsnog beperkingen aan, of verbindt alsnog voorschriften
      aan de vergunning, voor zover blijkt dat de nadelige gevolgen die de inrichting voor het milieu veroorzaakt,
      gezien de ontwikkeling van de technische mogelijkheden tot bescherming van het milieu verder kunnen, of, gezien de
      ontwikkeling van de kwaliteit van het milieu, verder moeten worden beperkt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.22
  - number: 8.22.3
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van het milieu regels worden gesteld met
      betrekking tot de wijze waarop het eerste lid wordt toegepast met betrekking tot daarbij aangewezen categorieën van
      inrichtingen. Bij de maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven
      categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.22
  - number: 8.22.4
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van de beperkingen en voorschriften zijn de
      [artikelen 8.6 tot en met 8.17][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.23.1
    text: |-
      Het bevoegd gezag kan beperkingen waaronder een vergunning is verleend, en voorschriften die daaraan zijn
      verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen of voorschriften aan een
      vergunning verbinden in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.23
  - number: 8.23.2
    text: |-
      Een belanghebbende, met uitzondering van de vergunninghouder, kan het bevoegd gezag verzoeken een vergunning in het
      belang van de bescherming van het milieu met toepassing van het eerste lid te wijzigen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.23
  - number: 8.23.3
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van de beperkingen en voorschriften zijn de
      [artikelen 8.6 tot en met 8.17][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.24.1
    text: |-
      Op aanvraag van de vergunninghouder kan het bevoegd gezag beperkingen waaronder een vergunning is verleend, en
      voorschriften die daaraan zijn verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen
      of voorschriften aan een vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.24
  - number: 8.24.2
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van die beperkingen en voorschriften zijn de
      [artikelen 8.6 tot en met 8.17][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.25.1
    text: |-
      Het bevoegd gezag kan - onverminderd het in de[ artikelen 8.34][ref1], [8.38][ref2], [8.39][ref3] en [18.12][ref4]
      bepaalde - een vergunning voor een inrichting geheel of gedeeltelijk intrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 8.25.1.a
    text: |-
      indien de inrichting ontoelaatbaar nadelige gevolgen voor het milieu veroorzaakt en toepassing van
      [artikel 8.23][ref1] redelijkerwijs daarvoor geen oplossing biedt;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.25.1.b
    text: indien dit in het belang van een doelmatig beheer van afvalstoffen noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.1.c
    text: indien gedurende drie jaar geen handelingen zijn verricht met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.1.d
    text: indien de inrichting geheel of gedeeltelijk is verwoest;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.1.e
    text: |-
      indien, in gevallen als aangegeven krachtens [artikel 8.20, derde lid][ref1], de vergunninghouder niet meer degene
      is, die de inrichting drijft;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.25.1.f
    text: |-
      in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: 8.25.2
    text: 'Het bevoegd gezag trekt de vergunning in:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.2.a
    text: |-
      indien door toepassing van [artikel 8.22, tweede lid][ref1], redelijkerwijs niet kan worden bereikt dat in de
      inrichting ten minste de voor de inrichting in aanmerking komende beste beschikbare technieken worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.25.2.b
    text: |-
      voor zover regels vastgesteld bij algemene maatregel van bestuur ter uitvoering van een voor Nederland verbindend
      verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, hiertoe verplichten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.3
    text: |-
      Een belanghebbende, met uitzondering van de vergunninghouder, kan het bevoegd gezag verzoeken een vergunning met
      toepassing van het eerste lid in te trekken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.4
    text: |-
      Met betrekking tot een beslissing als bedoeld in het eerste lid zijn de [artikelen 8.6 tot en met 8.9][ref1] van
      overeenkomstige toepassing, met dien verstande dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] niet van
      toepassing is op de voorbereiding van de intrekking van een vergunning op grond van het eerste lid, onder c, d, e
      of f, of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.25.5
    text: |-
      In een geval als aangegeven krachtens [artikel 8.15][ref1] kan een voorschrift overeenkomstig de betrokken algemene
      maatregel van bestuur aan de beschikking tot intrekking worden verbonden. [Artikel 8.15, vierde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.25.6
    text: |-
      In de beschikking tot intrekking kan worden bepaald dat een voorschrift als bedoeld in het vijfde lid, dan wel
      daarbij aangewezen aan de vergunning verbonden voorschriften gedurende een daarbij aan te geven termijn blijven
      gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.25.7
    text: |-
      Met betrekking tot de totstandkoming van een beschikking krachtens het eerste lid, onder f, is
      [artikel 8.10, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.25.8
    text: |-
      Het bevoegd gezag gaat tot intrekking van een vergunning op grond van het eerste lid, onder c, d, e of f, of het
      tweede lid niet over zonder de vergunninghouder in de gelegenheid te hebben gesteld binnen een termijn van zes
      weken schriftelijk of mondeling zienswijzen over de intrekking naar voren te brengen. Van de beschikking wordt
      mededeling gedaan door toezending daarvan aan de adviseurs.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.25
  - number: 8.26.1
    text: |-
      Het bevoegd gezag kan de vergunning geheel of gedeeltelijk intrekken op verzoek van de vergunninghouder, indien het
      belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.26
  - number: 8.26.2
    text: |-
      Met betrekking tot de beslissing ter zake zijn de [artikelen 8.6][ref1], [8.8][ref2] en [8.9][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.26.3
    text: |-
      [Artikel 8.25, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.26a
    text: |-
      Een ingevolge deze afdeling gegeven beschikking waarop [artikel 3:18 van de Algemene wet bestuursrecht][ref1] niet
      van toepassing is, wordt gegeven binnen twaalf weken na de terinzagelegging van het ontwerp van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.26a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.27.1
    text: |-
      In gevallen waarin een ander bestuursorgaan dan een Onzer Ministers het bevoegd gezag is, kan Onze Minister, indien
      dat in het algemeen belang geboden is, aan het bevoegd gezag een bindende aanwijzing geven ter zake van het nemen
      van een besluit ten aanzien van een aanvraag om een vergunning of ten aanzien van een reeds verleende vergunning.
      Daarbij houdt hij rekening met het geldende nationale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.27
  - number: 8.27.2
    text: |-
      Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met het betrokken bevoegd gezag.
      Hij deelt het voornemen, onder vermelding van de redenen daarvoor, mee aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.27
  - number: 8.27.3
    text: |-
      De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een exemplaar
      ervan wordt gevoegd bij ieder exemplaar van die beschikking.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.27
  - number: '8.28'
    text: |-
      In gevallen waarin een vergunning krachtens deze wet wordt aangevraagd, die betrekking heeft op een
      inrichting van waaruit stoffen als bedoeld in [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref1]
      in het oppervlaktewater worden gebracht, worden, indien daarvoor een vergunning krachtens
      die wet vereist is, bij de toepassing van dit hoofdstuk, van [hoofdstuk 13][ref2] en van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] de bepalingen van deze paragraaf in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '8.29'
    text: |-
      Indien in de vergunning krachtens de [Wet verontreiniging oppervlaktewateren][ref1] een bepaling wordt opgenomen
      als bedoeld in [artikel 8.17][ref2] over de termijn waarvoor zij geldt, kan een gelijke bepaling worden opgenomen
      in de vergunning krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.29
    references:
      - id: ref1
        bwb_id: BWBR0002682
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.30.1
    text: |-
      De aanvraag om een vergunning of wijziging van de vergunning overeenkomstig [artikel 8.24][ref1]
      wordt tegelijk ingediend met de aanvraag om verlening of wijziging van de vergunning krachtens de
      [Wet verontreiniging oppervlaktewateren][ref2]. De aanvraag wordt door de aanvrager tevens gezonden aan het
      bestuursorgaan dat tot verlening van de vergunning krachtens die wet bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref2
        bwb_id: BWBR0002682
  - number: 8.30.2
    text: |-
      Indien de aanvraag om verlening of wijziging van de vergunning krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1] niet is ingediend binnen zes weken na het tijdstip waarop de
      aanvraag om een vergunning of wijziging van de vergunning krachtens deze wet is ingediend, wordt de aanvraag buiten
      behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 8.30.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing indien de aanvraag om verlening of wijziging van de vergunning
      krachtens de [Wet verontreiniging oppervlaktewateren][ref1] buiten behandeling wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 8.31.1
    text: |-
      Het bestuursorgaan dat tot verlening van de vergunning krachtens de [Wet verontreiniging oppervlaktewateren][ref1]
      bevoegd is, brengt een advies uit met het oog op de samenhang tussen de beschikkingen op de onderscheidene
      aanvragen. Het advies wordt uitgebracht binnen acht weken na ontvangst van de aanvraag om een vergunning of
      wijziging van de vergunning krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 8.31.2
    text: |-
      Het orgaan dat tot verlening van de vergunning krachtens de [Wet verontreiniging oppervlaktewateren][ref1] bevoegd
      is, wordt voorts in de gelegenheid gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvraag
      om een vergunning of wijziging van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 8.31.3
    text: |-
      In een geval als bedoeld in [artikel 3:18, tweede lid van de Algemene wet bestuursrecht][ref1] kan het bevoegd
      gezag de in het eerste lid bedoelde termijn met een bij zijn besluit te bepalen redelijke termijn verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.31a.1
    text: |-
      In een geval als bedoeld in [artikel 8.28][ref1], waarin burgemeester en wethouders bevoegd zijn de beschikking op
      de aanvraag om de vergunning krachtens deze wet te verlenen, kunnen gedeputeerde staten, indien dat met het oog op
      de samenhang tussen de beschikkingen op de onderscheidene aanvragen in het belang van de bescherming van het milieu
      geboden is, en zo nodig in afwijking van regels, gesteld krachtens [artikel 8.46][ref2], op een daartoe strekkend
      verzoek van het orgaan dat bevoegd is de vergunning krachtens de [Wet verontreiniging oppervlaktewateren][ref3] te
      verlenen, aan burgemeester en wethouders een bindende aanwijzing geven ter zake van de inhoud van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
      - id: ref3
        bwb_id: BWBR0002682
  - number: 8.31a.2
    text: |-
      Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvraag
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.31a.3
    text: |-
      De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een exemplaar
      ervan wordt gevoegd bij ieder exemplaar van die beschikking.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.31a
  - number: '8.32'
    text: |-
      De motivering van de beschikking vermeldt in ieder geval de invloed die de samenhang tussen de beschikkingen op
      de onderscheidene aanvragen heeft gehad op de inhoud van de vergunning of de beschikking tot wijziging van de
      vergunning krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.32
  - number: '8.33'
    text: |-
      Ten aanzien van een wijziging van een vergunning overeenkomstig de [artikelen 8.22, tweede lid][ref1], en
      [8.23][ref2] zijn de [artikelen 8.28][ref3], [8.29][ref4], [8.31, eerste en tweede lid][ref5], [8.31a][ref6] en
      [8.32][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
  - number: 8.34.1
    text: |-
      Het bevoegd gezag kan een vergunning geheel of gedeeltelijk intrekken, indien de krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1] verleende vergunning geheel of gedeeltelijk wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.34
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 8.34.2
    text: |-
      Met betrekking tot de totstandkoming van de beschikking is [artikel 8.25, achtste lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.34
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.35.1
    text: |-
      Indien een vergunning betrekking heeft op een inrichting, behorende tot een bij algemene maatregel van bestuur aan
      te wijzen categorie, waarin afvalstoffen nuttig worden toegepast of worden verwijderd, worden bij de toepassing van
      dit hoofdstuk, van [hoofdstuk 13][ref1] en van [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] de bepalingen
      van deze paragraaf in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.35.2
    text: |-
      Bij de maatregel kan worden bepaald dat een aanwijzing als bedoeld in het eerste lid slechts betrekking heeft op
      daarbij aangewezen categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.35
  - number: 8.36.1
    text: |-
      Onze Minister kan, indien naar zijn oordeel in het belang van een doelmatige beheer van afvalstoffen een
      onverwijlde voorziening noodzakelijk is, een regeling vaststellen van de in [artikel 8.35][ref1] bedoelde
      strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.36.2
    text: |-
      Een zodanige regeling vervalt een jaar nadat zij in werking is getreden of, indien binnen die termijn een algemene
      maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip waarop die maatregel
      in werking treedt. Onze Minister kan de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36
  - number: 8.36a.1
    text: |-
      Een vergunning wordt, voor zover zij een inrichting betreft die behoort tot een categorie of een categorie van
      gevallen die is aangewezen krachtens [artikel 8.35][ref1], niet verleend dan nadat Onze Minister heeft verklaard
      dat hij daartegen geen bedenkingen heeft. [Artikel 10:32 van de Algemene wet bestuursrecht](onbekend) is niet van
      toepassing met betrekking tot de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.36a.2
    text: |-
      De verklaring kan slechts worden geweigerd op grond van de criteria, genoemd in [artikel 10.5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.36b.1
    text: |-
      Onze Minister kan bij de verklaring, bedoeld in [artikel 8.36a][ref1], bepalen dat de vergunning onder beperkingen
      wordt verleend of dat er voorschriften aan worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.36b.2
    text: |-
      Indien toepassing is gegeven aan het eerste lid, wordt de vergunning onder de aangegeven beperkingen verleend en
      worden de aangegeven voorschriften eraan verbonden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36b
  - number: 8.36c.1
    text: |-
      [De artikelen 8.11][ref1] tot en met [8.17][ref2] zijn bij de toepassing van [artikel 8.36b, eerste lid][ref3], van
      overeenkomstige toepassing, met dien verstande dat de beperkingen en voorschriften slechts berusten op de criteria,
      genoemd in [artikel 10.5, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.36c.2
    text: |-
      Voorts kunnen de voorschriften, bedoeld in [artikel 8.36b][ref1], inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.36c.2.a
    text: |-
      dat in daarbij aangewezen categorieën van gevallen afvalstoffen in de inrichting niet nuttig mogen worden toegepast
      of mogen worden verwijderd zonder afzonderlijke toestemming van het bevoegd gezag, dan wel van Onze Minister;
      daarbij kan worden bepaald dat de toestemming door het bevoegd gezag eerst wordt gegeven nadat een bij het
      voorschrift aangewezen bestuursorgaan heeft verklaard dat geen andere wijze van nuttige toepassing of verwijdering
      mogelijk is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36c
  - number: 8.36c.2.b
    text: |-
      de verplichting overeenkomstig het in de vergunning ter zake bepaalde, daarbij aangewezen afvalstoffen in ontvangst
      te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36c
  - number: 8.36d
    text: |-
      In gevallen waarin een verklaring als bedoeld in [artikel 8.36a][ref1] vereist is, geeft het bevoegd gezag
      bij de beslissing op de aanvraag om de vergunning geen toepassing aan [artikel 8.8][ref2] en evenmin aan
      artikel 10.14 j° [artikel 10.4][ref3], voor zover deze bepalingen betrekking hebben op de criteria, genoemd in
      [artikel 10.5, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36d
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.36e.1
    text: De verklaring wordt vermeld in de beschikking ter zake waarvan zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36e
  - number: 8.36e.2
    text: Een exemplaar ervan wordt gevoegd bij ieder exemplaar van de beschikking.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36e
  - number: 8.36f.1
    text: |-
      Inrichtingen waarin van anderen afkomstige afvalstoffen worden gestort, brengen bij het in ontvangst nemen van
      afvalstoffen een bedrag in rekening waarbij in ieder geval rekening wordt gehouden:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
  - number: 8.36f.1.a
    text: met de kosten van het totstandbrengen, instandhouden en in werking hebben van de inrichting,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
  - number: 8.36f.1.b
    text: |-
      met de kosten van de voorzieningen die bewerkstelligen dat de inrichting, nadat zij buiten gebruik is gesteld,
      geen nadelige gevolgen voor het milieu veroorzaakt, daaronder mede begrepen de kosten van de krachtens
      [artikel 15.44, eerste lid][ref1], verschuldigde heffing, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 8.36f.1.c
    text: |-
      met de kosten van financiële zekerheid in categorieën van gevallen waarvoor het stellen van financiële zekerheid
      krachtens [artikel 8.15][ref1] is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.36f.2
    text: |-
      Onze Minister kan in het belang van een doelmatig beheer van afvalstoffen tarieven vaststellen, die ten minste
      dan wel ten hoogste in rekening worden gebracht bij het in ontvangst nemen van afvalstoffen door krachtens
      [artikel 8.35][ref1] aangewezen inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.36f.3
    text: Onze Minister kan nadere regels stellen met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.36f
  - number: 8.37.1
    text: Het bevoegd gezag zendt Onze Minister onverwijld een exemplaar van de aanvraag en van de daarbij gevoegde stukken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
  - number: 8.37.2
    text: |-
      Indien de aanvrager de krachtens [artikel 8.5][ref1] te verstrekken gegevens, voorzover deze betrekking hebben op
      het beheer van afvalstoffen, niet of niet volledig heeft verstrekt, laat het bevoegd gezag de aanvraag op verzoek
      van Onze Minister buiten behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.37.3
    text: |-
      Op verzoek van Onze Minister neemt het bevoegd gezag de aanvraag ondanks de onvolledigheid van de in het tweede lid
      bedoelde gegevens in behandeling. Het stelt de aanvrager op verzoek van Onze Minister in de gelegenheid de aanvraag
      overeenkomstig [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] binnen een bij het verzoek aan te
      geven termijn aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.37.4
    text: |-
      Onze Minister zendt een exemplaar van het ontwerp van de verklaring zo tijdig aan het
      bevoegd gezag dat het met een exemplaar van het ontwerp van de beschikking overeenkomstig
      [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref1] aan de aanvrager van de vergunning en aan de
      betrokken bestuursorganen kan worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.37.5
    text: |-
      Zienswijzen die overeenkomstig [artikel 3:15 van de Algemene wet bestuursrecht][ref1] naar voren worden gebracht
      alsmede door de krachtens [artikel 8.7][ref2] aangewezen adviseurs en overeenkomstig [artikel 8.31][ref3]
      uitgebrachte adviezen kunnen mede betrekking hebben op het ontwerp van de verklaring. Voor zover dat het geval is,
      zendt het bevoegd gezag ze onverwijld aan Onze Minister. Onze Minister deelt zijn oordeel over de zienswijzen en
      adviezen mee aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
  - number: 8.37.6
    text: |-
      Het bevoegd gezag kan Onze Minister te allen tijde advies uitbrengen met het oog op de samenhang tussen de
      beslissing omtrent de verklaring en de beslissing op de aanvraag. Het brengt met het oog op deze samenhang in ieder
      geval advies uit over het ontwerp van de verklaring.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
  - number: 8.37.7
    text: |-
      Onze Minister zendt een exemplaar van de verklaring zo tijdig aan het bevoegd gezag dat de beschikking kan
      worden genomen binnen de termijn, genoemd in [artikel 3:28 van de Algemene wet bestuursrecht][ref1], dan wel,
      indien toepassing is gegeven aan [artikel 3:29, eerste lid, van de Algemene wet bestuursrecht][ref2], binnen de
      overeenkomstig dat lid verlengde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.38.1
    text: |-
      De [artikelen 8.36a tot en met 8.37][ref1] zijn van overeenkomstige toepassing met betrekking tot wijziging en
      intrekking van een vergunning overeenkomstig de [artikelen 8.22 tot en met 8.26][ref2] en [8.34][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
  - number: 8.38.2
    text: |-
      Onze Minister zendt een exemplaar van de verklaring zo tijdig aan het bevoegd gezag dat het besluit kan
      worden genomen binnen de termijn, genoemd in [artikel 3:18 van de Algemene wet bestuursrecht][ref1] dan wel
      [artikel 8.26a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.39.1
    text: 'Onze Minister kan het bevoegd gezag verzoeken:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.39
  - number: 8.39.1.a
    text: |-
      beperkingen waaronder de vergunning is verleend, en voorschriften die aan de vergunning zijn verbonden, te
      wijzigen, aan te vullen of in te trekken, dan wel alsnog beperkingen aan te brengen of voorschriften aan de
      vergunning te verbinden,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.39
  - number: 8.39.1.b
    text: de vergunning geheel of gedeeltelijk in te trekken,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.39
  - number: 8.39.2
    text: Overeenkomstig het verzoek wijzigt het bevoegd gezag de vergunning of trekt het deze in.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.39
  - number: 8.39.3
    text: |-
      Het bevoegd gezag brengt adviezen en overeenkomstig [artikel 3:15 van de Algemene wet bestuursrecht][ref1] naar
      voren gebrachte zienswijzen ter kennis van Onze Minister. Deze deelt zijn oordeel daarover aan het bevoegd gezag
      mee. [Artikel 8.7][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.40.1
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aangewezen categorieën van inrichtingen,
      die niet behoren tot een categorie als bedoeld in bijlage I van de EG-richtlijn inzake geïntegreerde preventie
      en bestrijding van verontreiniging, regels worden gesteld, die nodig zijn ter bescherming van het milieu. Bij
      de maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van
      gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2
    text: |-
      Bij de beslissing tot het vaststellen van een algemene maatregel van bestuur als bedoeld in het eerste lid, worden
      in ieder geval betrokken:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2.a
    text: |-
      de bestaande toestand van het milieu, voor zover inrichtingen die tot de betrokken categorieën behoren, daarvoor
      gevolgen kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2.b
    text: |-
      de gevolgen voor het milieu, die inrichtingen die tot de betrokken categorieën behoren, kunnen veroorzaken, mede in
      hun onderlinge samenhang bezien;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2.c
    text: |-
      de met betrekking tot inrichtingen die tot de betrokken categorieën behoren, en de omgeving waarin zodanige
      inrichtingen zijn of kunnen zijn gelegen, redelijkerwijs te verwachten ontwikkelingen die van belang zijn met het
      oog op de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2.d
    text: |-
      de mogelijkheden tot bescherming van het milieu, door de nadelige gevolgen voor het milieu, die inrichtingen die
      tot de betrokken categorieën behoren, kunnen veroorzaken, te voorkomen, dan wel zoveel mogelijk te beperken, voor
      zover zij niet kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.2.e
    text: |-
      de voor onderdelen van het milieu, waarvoor de betrokken categorieën van inrichtingen gevolgen kunnen hebben,
      geldende milieukwaliteitseisen, vastgesteld krachtens of overeenkomstig [artikel 5.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.40.2.f
    text: de redelijkerwijs te verwachten financiële en economische gevolgen van de maatregel.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
  - number: 8.40.3
    text: |-
      Ten aanzien van bij de regels te stellen voorschriften zijn [de artikelen 8.11, derde lid][ref1], [8.12][ref2]
      tot en met [8.16][ref3] en [8.22, eerste en tweede lid][ref4], van overeenkomstige toepassing, met dien verstande
      dat het stellen van financiële zekerheid slechts kan worden voorgeschreven in de vorm van het sluiten van een
      verzekering tegen aansprakelijkheid voor schade, voortvloeiend uit de nadelige gevolgen voor het milieu, die de
      inrichting veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.41.1
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 8.40][ref1] wordt de verplichting opgelegd tot het
      melden van het oprichten of het veranderen van een inrichting waarop de maatregel betrekking heeft, dan wel van het
      veranderen van de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.41.2
    text: 'Bij de maatregel wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
  - number: 8.41.2.a
    text: het bestuursorgaan waaraan de melding wordt gericht;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
  - number: 8.41.2.b
    text: het tijdstip, voorafgaand aan het oprichten of veranderen, waarop de melding uiterlijk moet zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
  - number: 8.41.2.c
    text: de gegevens die bij de melding moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
  - number: 8.41.3
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de in het tweede lid, onder *c*, bedoelde gegevens en de
      wijze waarop zij moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
  - number: 8.41.4
    text: |-
      Van de melding wordt openbaar kennisgegeven in één of meer dag-, nieuws- of huis-aan-huisbladen. Indien op grond
      van een algemene maatregel van bestuur krachtens [artikel 8.40][ref1] ook anderszins gegevens moeten worden
      verstrekt, kunnen bij de maatregel regels over de openbare kennisgeving daarvan worden gesteld. Bij algemene
      maatregel van bestuur kunnen bestuursorganen worden aangewezen, waaraan een exemplaar van de melding of de
      anderszins verstrekte gegevens moet worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.42.1
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 8.40][ref1] kan de verplichting worden opgelegd
      te voldoen aan nadere eisen met betrekking tot daarbij aangegeven onderwerpen. Bij de maatregel wordt het
      bestuursorgaan aangegeven, dat die eisen kan stellen. Bij de maatregel worden de categorieën van gevallen
      aangegeven, waarin van de beschikking waarbij de nadere eis wordt gesteld, mededeling wordt gedaan door
      kennisgeving in één of meer dag-, nieuws- of huis-aan-huisbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.42.2
    text: |-
      Een algemene maatregel van bestuur krachtens [artikel 8.40][ref1] bevat een overgangsregeling met betrekking tot
      inrichtingen die al zijn opgericht op het tijdstip waarop de maatregel in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.44.1
    text: |-
      Indien dit uit een oogpunt van doelmatige regelgeving bijzonder aangewezen is, kunnen bij algemene maatregel van
      bestuur met betrekking tot daarbij aangewezen categorieën van inrichtingen, waarvoor het in [artikel 8.1][ref1]
      gestelde verbod geldt, regels worden gesteld, die nodig zijn ter bescherming van het milieu. Bij de maatregel kan
      worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen. Artikel
      8.40, tweede lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.44.2
    text: |-
      Ten aanzien van bij de regels te stellen voorschriften zijn [de artikelen 8.11, derde lid][ref1], [8.12][ref2]
      tot en met [8.16][ref3], [8.22, eerste en tweede lid][ref4], en [8.36c, tweede lid][ref5], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 8.44.3
    text: |-
      Indien op grond van een algemene maatregel van bestuur krachtens het eerste lid gegevens moeten worden verstrekt
      door degene die de inrichting drijft, kunnen bij de maatregel regels over de openbare kennisgeving daarvan worden
      gesteld. Bij de maatregel kunnen bestuursorganen worden aangewezen, waaraan de gegevens moeten worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
  - number: 8.44.4
    text: |-
      Bij een algemene maatregel van bestuur krachtens het eerste lid kan worden bepaald dat het bevoegd gezag bij
      het verlenen of wijzigen van de vergunning met betrekking tot daarbij aangegeven onderwerpen in de beperkingen
      waaronder de vergunning wordt verleend, of in de daaraan verbonden voorschriften van bij de maatregel gestelde
      regels kan afwijken. In dat geval wordt bij de maatregel aangegeven in hoeverre het bevoegd gezag van de regels
      kan afwijken. Bij de maatregel kan tevens worden bepaald dat de bevoegdheid tot afwijken slechts geldt in daarbij
      aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
  - number: 8.44.5
    text: |-
      Bij een algemene maatregel van bestuur krachtens het eerste lid kan de verplichting worden opgelegd met betrekking
      tot daarbij aangegeven onderwerpen te voldoen aan nadere eisen, die het bevoegd gezag kan stellen. Daarbij kan
      worden bepaald dat de bevoegdheid tot het stellen van nadere eisen slechts geldt in daarbij aangegeven categorieën
      van gevallen. Een nadere eis kan worden gesteld als beperking waaronder de vergunning wordt verleend of als
      voorschrift dat daaraan wordt verbonden. Bij de maatregel worden de categorieën van gevallen aangegeven, waarin
        - voor zover de nadere eis niet als zodanige beperking of voorschrift wordt gesteld - van de beschikking waarbij
      de nadere eis wordt gesteld, mededeling wordt gedaan door kennisgeving in één of meer dag-, nieuws- of huis-aan-
      huis-bladen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
  - number: 8.44.6
    text: |-
      Een algemene maatregel van bestuur krachtens het eerste lid bevat een overgangsregeling met betrekking tot
      inrichtingen die al zijn opgericht op het tijdstip waarop de maatregel in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.44
  - number: 8.45.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld, inhoudende de verplichting voor het bevoegd gezag
      beperkingen of voorschriften, die nodig zijn ter bescherming van het milieu en waarvan de inhoud in die maatregel
      is aangegeven, aan te brengen onderscheidenlijk te verbinden aan de vergunningen voor inrichtingen die behoren
      tot een bij de maatregel aangewezen categorie. Bij de maatregel kan worden bepaald dat de daarbij gestelde regels
      slechts gelden in daarbij aangegeven categorieën van gevallen. Artikel 8.40, tweede lid, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.45
  - number: 8.45.2
    text: |-
      Ten aanzien van krachtens het eerste lid aan te geven beperkingen en voorschriften zijn
      [de artikelen 8.11, derde lid][ref1], [8.12][ref2] tot en met [8.16][ref3] en [8.22, eerste en tweede lid][ref4],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 8.45.3
    text: |-
      Bij een algemene maatregel van bestuur krachtens het eerste lid wordt bepaald in hoeverre het bevoegd gezag met
      betrekking tot daarbij aangegeven onderwerpen van bij de maatregel gestelde regels kan afwijken of nadere eisen
      kan stellen. Daarbij kan worden bepaald dat de bevoegdheid tot afwijken of tot het stellen van nadere eisen slechts
      geldt in bij de maatregel aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.45
  - number: 8.45.4
    text: |-
      Bij de maatregel wordt voor de daarbij opgelegde verplichtingen het tijdstip aangegeven, waarop zij met betrekking
      tot de al verleende vergunningen moeten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.45
  - number: 8.46.1
    text: |-
      Bij de provinciale milieuverordening kunnen regels worden gesteld inhoudende de verplichting voor het bevoegd gezag
      beperkingen of voorschriften, die nodig zijn ter bescherming van het milieu en waarvan de inhoud in die verordening
      is aangegeven, aan te brengen onderscheidenlijk te verbinden aan de vergunningen voor inrichtingen die behoren tot
      een bij de verordening aangewezen categorie. Bij de verordening kan worden bepaald dat de daarbij gestelde regels
      slechts gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.46
  - number: 8.46.2
    text: |-
      Regels als bedoeld in het eerste lid kunnen niet betrekking hebben op beslissingen inzake vergunningen ten aanzien
      waarvan Onze Minister of Onze Minister van Economische Zaken het bevoegd gezag is.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.46
  - number: 8.46.3
    text: |-
      [Artikel 8.45, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: 8.47.1
    text: 'In deze titel en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.1.a
    text: |-
      stortplaats: inrichting waar afvalstoffen worden gestort, dan wel het gedeelte van een inrichting, waar
      afvalstoffen worden gestort, indien in de inrichting niet uitsluitend afvalstoffen worden gestort;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.1.b
    text: 'gesloten stortplaats: stortplaats ten aanzien waarvan de in het derde lid bedoelde verklaring is afgegeven;'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.1.c
    text: |-
      bedrijfsgebonden stortplaats: stortplaats waar uitsluitend afvalstoffen worden gestort, die afkomstig zijn van
      binnen de inrichting waartoe de stortplaats behoort.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.2
    text: |-
      Onder stortplaats wordt mede verstaan een gesloten stortplaats. Tot de stortplaats wordt mede gerekend het gedeelte
      van de stortplaats waar het storten van afvalstoffen is beëindigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.3
    text: 'Het bevoegd gezag verklaart een stortplaats voor gesloten, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.3.a
    text: het storten van afvalstoffen is beëindigd,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.3.b
    text: voor zover een daartoe strekkend voorschrift voor de inrichting geldt, een bovenafdichting is aangebracht, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
  - number: 8.47.3.c
    text: |-
      een eindinspectie door het bevoegd gezag is uitgevoerd waaruit is gebleken dat aan alle voorschriften,
      verbonden aan de vergunning voor de stortplaats, is voldaan en dat ook geen andere maatregelen ingevolge de
      [Wet bodembescherming][ref1] getroffen dienen te worden door degene die de stortplaats drijft, in geval van
      verontreiniging of aantasting van de bodem onder de stortplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.47
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: '8.48'
    text: |-
      Deze titel is slechts van toepassing op stortplaatsen waarvoor een vergunning ingevolge [artikel 8.1][ref1] is
      vereist, waar op of na 1 september 1996 afvalstoffen worden gestort, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 8.48.a
    text: |-
      waarvoor een algemene maatregel van bestuur geldt als bedoeld in [artikel 8.45][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: 8.48.b
    text: uitsluitend baggerspecie wordt gestort.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.48
  - number: 8.49.1
    text: |-
      Met betrekking tot een gesloten stortplaats worden zodanige maatregelen getroffen dat wordt gewaarborgd dat die
      stortplaats geen nadelige gevolgen voor het milieu veroorzaakt, dan wel, voor zover dat redelijkerwijs niet kan
      worden gevergd, de grootst mogelijke bescherming wordt geboden tegen die nadelige gevolgen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.2
    text: 'Tot de maatregelen, bedoeld in het eerste lid, worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.2.a
    text: |-
      maatregelen strekkende tot het in stand houden en onderhouden, alsmede het herstellen, verbeteren of vervangen van
      voorzieningen ter bescherming van de bodem;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.2.b
    text: het regelmatig inspecteren van voorzieningen ter bescherming van de bodem, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.2.c
    text: het regelmatig onderzoeken van de bodem onder de stortplaats.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.3
    text: |-
      Degene die een stortplaats drijft stelt een nazorgplan op ter uitvoering van de maatregelen, bedoeld in het
      eerste en tweede lid. Het nazorgplan behoeft de instemming van gedeputeerde staten van de provincie waarin de
      stortplaats geheel of in hoofdzaak is gelegen. Gedeputeerde staten beslissen hierover binnen dertien weken na de
      indiening van het nazorgplan. De goedkeuring is van rechtswege gegeven indien gedeputeerde staten niet binnen de
      instemmingstermijn van dertien weken een beslissing hebben genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.4
    text: |-
      Gedeputeerde staten kunnen degene die een stortplaats drijft bevelen het nazorgplan waarmee zij hebben ingestemd,
      aan te passen gezien de ontwikkelingen op het gebied van de technische mogelijkheden tot bescherming van het milieu
      en de ontwikkelingen met betrekking tot de kwaliteit van het milieu, dan wel in verband met een verandering van de
      stortplaats sedert de datum van instemming met het nazorgplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.49.5
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot de in het eerste en tweede lid bedoelde maatregelen
      alsmede met betrekking tot het in het derde lid bedoelde nazorgplan nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.49
  - number: 8.50.1
    text: |-
      Belast met de maatregelen, bedoeld in [artikel 8.49][ref1], zijn gedeputeerde staten van de provincie waarin de
      gesloten stortplaats geheel of in hoofdzaak is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.50.2
    text: |-
      Gedeputeerde staten kunnen de zorg voor de uitvoering van de werkzaamheden die verband houden met de in
      [artikel 8.49][ref1] bedoelde maatregelen, opdragen aan een daartoe door hen aangewezen rechtspersoon of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.50.3
    text: |-
      In afwijking van het tweede lid berust met betrekking tot gesloten stortplaatsen waar baggerspecie is gestort
      en die worden gedreven of mede worden gedreven door Onze Minister van Verkeer en Waterstaat, de zorg voor de
      uitvoering van de werkzaamheden die verband houden met de in [artikel 8.49][ref1] bedoelde maatregelen, bij die
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.50.4
    text: |-
      Op verzoek van degene die een bedrijfsgebonden stortplaats het laatst heeft gedreven, wordt bij het al dan niet
      toepassen van het tweede lid rekening gehouden met de mogelijkheid die zorg aan die persoon op te dragen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.50
  - number: '8.51'
    text: |-
      De rechthebbende ten aanzien van de plaats waar de in [artikel 8.49][ref1] bedoelde zorg met betrekking tot een
      gesloten stortplaats wordt uitgevoerd, is verplicht te gedogen dat werkzaamheden worden verricht ten behoeve van
      die zorg, onverminderd zijn recht op schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel8.51
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.1.1
    text: |-
      Een ieder die handelingen met betrekking tot afvalstoffen verricht of nalaat en die weet of redelijkerwijs
      had kunnen weten dat daardoor nadelige gevolgen voor het milieu ontstaan of kunnen ontstaan, is verplicht alle
      maatregelen te nemen of na te laten die redelijkerwijs van hem kunnen worden gevergd, teneinde die gevolgen zoveel
      mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.1
  - number: 10.1.2
    text: |-
      Het is een ieder bij wie afvalstoffen ontstaan, verboden handelingen met betrekking tot die afvalstoffen te
      verrichten of na te laten, waarvan hij weet of redelijkerwijs had kunnen weten dat daardoor nadelige gevolgen voor
      het milieu ontstaan of kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Het is een ieder verboden bedrijfsmatig of in een omvang of op een wijze alsof deze bedrijfsmatig was, handelingen
      met betrekking tot afvalstoffen te verrichten, indien daardoor, naar hij weet of redelijkerwijs had kunnen weten,
      nadelige gevolgen voor het milieu ontstaan of kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.1
  - number: 10.1.4
    text: |-
      Onder handelingen als bedoeld in het derde lid wordt in ieder geval verstaan: inzamelen of anderszins in ontvangst
      nemen, bewaren, nuttig toepassen, verwijderen, vervoeren of verhandelen van afvalstoffen of bemiddelen bij het
      beheer van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.1
  - number: 10.1.5
    text: |-
      De verboden, bedoeld in het tweede en derde lid, gelden niet voor zover deze handelingen betreffen, die degene die
      deze verricht, uitdrukkelijk zijn toegestaan bij of krachtens deze wet of een in [artikel 13.1, tweede lid][ref1],
      genoemde wet of de EEG-verordening overbrenging van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
  - number: 10.2.1
    text: |-
      Het is verboden zich van afvalstoffen te ontdoen door deze - al dan niet in verpakking - buiten een inrichting te
      storten, anderszins op of in de bodem te brengen of te verbranden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet, voor daarbij aangegeven categorieën van gevallen vrijstelling worden verleend van het
      verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.2
  - number: '10.3'
    text: Onze Minister stelt ten minste eenmaal in de vier jaar een afvalbeheersplan vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.3
  - number: '10.4'
    text: |-
      Bij de vaststelling van het afvalbeheersplan houdt Onze Minister er rekening mee dat het belang van de bescherming
      van het milieu vereist dat in de navolgende voorkeursvolgorde:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.a
    text: het ontstaan van afvalstoffen wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.b
    text: |-
      bij het vervaardigen van stoffen, preparaten of andere producten gebruik wordt gemaakt van stoffen en materialen
      die na gebruik van het product geen of zo min mogelijk nadelige gevolgen voor het milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.c
    text: stoffen, preparaten of andere producten na gebruik als zodanig opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.d
    text: stoffen en materialen waaruit een product bestaat, na gebruik van het product opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.e
    text: afvalstoffen worden toegepast met een hoofdgebruik als brandstof of voor een andere wijze van energieopwekking;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.f
    text: afvalstoffen worden verwijderd door deze te verbranden op land;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.4.g
    text: afvalstoffen worden gestort.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.4
  - number: 10.5.1
    text: |-
      Bij de vaststelling van het afvalbeheersplan houdt Onze Minister er rekening mee dat het belang van een doelmatig
      beheer van afvalstoffen vereist dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
  - number: 10.5.1.a
    text: het beheer van afvalstoffen op effectieve en efficiënte wijze geschiedt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
  - number: 10.5.1.b
    text: een effectief toezicht op het beheer van afvalstoffen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
  - number: 10.5.2
    text: |-
      Ten aanzien van een inrichting die behoort tot een categorie of een categorie van gevallen die is aangewezen
      krachtens [artikel 8.35][ref1], alsmede ten aanzien van een beslissing omtrent een vergunning als bedoeld in
      [artikel 10.48][ref2], houdt Onze Minister er rekening mee dat het belang van een doelmatig beheer van afvalstoffen
      voorts vereist dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.5.2.a
    text: de continuïteit van het beheer van afvalstoffen wordt gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
  - number: 10.5.2.b
    text: de capaciteit van de voorzieningen voor het beheer van afvalstoffen is afgestemd op het aanbod van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.5
  - number: '10.6'
    text: |-
      Bij de vaststelling van het afvalbeheersplan houdt Onze Minister rekening met het geldende nationale
      milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.6
  - number: 10.7.1
    text: |-
      Het afvalbeheersplan bevat de onderwerpen die ingevolge voor Nederland bindende besluiten van de instellingen van
      de Europese Unie moeten worden opgenomen in een zodanig plan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.7.2
    text: 'Het afvalbeheersplan bevat voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.7.2.a
    text: |-
      de hoofdlijnen van het beleid ter uitvoering van deze wet met betrekking tot het voorkomen of beperken van het
      ontstaan van afvalstoffen en het beheer van afvalstoffen in de betrokken periode van vier jaar en, voor zover
      mogelijk, in de daarop volgende zes jaar;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.7.2.b
    text: |-
      een uitwerking van deze hoofdlijnen met betrekking tot daarbij aangewezen categorieën van afvalstoffen of wijzen
      van beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.7.2.c
    text: |-
      de capaciteit die benodigd is voor de nuttige toepassing of verwijdering van afvalstoffen in inrichtingen die
      behoren tot een categorie of een categorie van gevallen die is aangewezen krachtens artikel 8.35 in de betrokken
      periode van vier jaar en, voor zover mogelijk, in de daaropvolgende zes jaar;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.7.2.d
    text: |-
      een beschrijving van het beleid ter uitvoering van de EEG-verordening overbrenging van afvalstoffen in de betrokken
      periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.7
  - number: 10.8.1
    text: |-
      Onze Minister stelt het onderdeel van het afvalbeheersplan, bedoeld in [artikel 10.7, tweede lid, onder a][ref1],
      op na overleg met een instantie die representatief kan worden geacht voor de provinciebesturen en met een instantie
      die representatief kan worden geacht voor de gemeentebesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.2
    text: |-
      Onze Minister stelt de onderdelen van het afvalbeheersplan, bedoeld in artikel 10.7, tweede lid, onder b en c, op
      in gezamenlijk overleg met een instantie die representatief kan worden geacht voor de provinciebesturen en met een
      instantie die representatief kan worden geacht voor de gemeentebesturen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.8
  - number: 10.8.3
    text: |-
      Onze Minister betrekt voorts bij de voorbereiding van het afvalbeheersplan de naar zijn oordeel bij de te
      behandelen onderwerpen meest belanghebbende andere bestuursorganen, instellingen en organisaties.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.8
  - number: 10.8.4
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de wijze waarop uitvoering wordt gegeven aan het
      bepaalde in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.8
  - number: 10.9.1
    text: |-
      Met betrekking tot de voorbereiding van het afvalbeheersplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 10.9.2
    text: |-
      Het ontwerp van het afvalbeheersplan wordt, gelijktijdig met de terinzagelegging ervan, overgelegd aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.9
  - number: '10.10'
    text: |-
      Ten behoeve van het opstellen van het afvalbeheersplan verschaffen de bestuursorganen aan Onze Minister op
      zijn verzoek alle inlichtingen en gegevens waarover zij kunnen beschikken, voor zover die voor dat opstellen
      redelijkerwijs noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.10
  - number: 10.11.1
    text: |-
      Zodra het afvalbeheersplan is vastgesteld, doet Onze Minister hiervan mededeling door overlegging van het
      afvalbeheersplan aan de beide kamers der Staten-Generaal en door toezending ervan aan provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.11
  - number: 10.11.2
    text: |-
      Onze Minister zendt het afvalbeheersplan tevens toe aan de bestuursorganen, instellingen en organisaties, die
      overeenkomstig [artikel 10.8, derde lid][ref1], waren betrokken bij de voorbereiding ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.12.1
    text: |-
      Het afvalbeheersplan geldt met ingang van de dag waarop vier weken zijn verstreken na de dag waarop de vaststelling
      van het afvalbeheersplan is bekendgemaakt in de Staatscourant. Onze Minister kan bepalen dat het afvalbeheersplan,
      of onderdelen daarvan, eerst op een later tijdstip gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.12
  - number: 10.12.2
    text: |-
      Het afvalbeheersplan geldt, behoudens indien eerder een nieuw afvalbeheersplan is vastgesteld, voor een tijdvak van
      vier jaar. Onze Minister kan de geldingsduur van het afvalbeheersplan eenmaal met ten hoogste twee jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.12
  - number: 10.13.1
    text: Het afvalbeheersplan kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.13
  - number: 10.13.2
    text: |-
      Met betrekking tot een wijziging van het afvalbeheersplan zijn [de artikelen 10.4][ref1] tot en met [10.11][ref2]
      en [10.12, eerste lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.14.1
    text: |-
      Ieder bestuursorgaan houdt rekening met het geldende afvalbeheersplan bij het uitoefenen van een bevoegdheid
      krachtens deze wet, voor zover de bevoegdheid wordt uitgeoefend met betrekking tot afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.14
  - number: 10.14.2
    text: |-
      Voor zover het afvalbeheersplan niet voorziet in het onderwerp met betrekking waartoe de bevoegdheid wordt
      uitgeoefend, houdt het bestuursorgaan rekening met de voorkeursvolgorde, aangegeven in [artikel 10.4][ref1], en de
      criteria, genoemd in [artikel 10.5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.14.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij het uitoefenen van een bevoegdheid krachtens de EEG-
      verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.14
  - number: 10.15.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het voorkomen of beperken van het ontstaan van
      afvalstoffen, regels worden gesteld ten aanzien van het vervaardigen, invoeren, toepassen, voorhanden hebben, aan
      een ander ter beschikking stellen of in ontvangst nemen van bij die maatregel aangewezen categorieën van stoffen,
      preparaten of andere producten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2
    text: |-
      Hiertoe kunnen in ieder geval behoren regels, inhoudende een verbod met betrekking tot zodanige stoffen, preparaten
      of andere producten:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.a
    text: een of meer van de in het eerste lid genoemde handelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.b
    text: 'zodanige handelingen te verrichten:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.b.1°
    text: op een bij de maatregel aangegeven wijze,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.b.2°
    text: onder daarbij aangegeven omstandigheden, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.b.3°
    text: voor daarbij aangewezen doeleinden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.c
    text: |-
      zodanige handelingen te verrichten, indien met betrekking tot de stoffen, preparaten of andere producten niet aan
      bij de maatregel gestelde eisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.2.d
    text: |-
      deze te vervaardigen of aan een ander ter beschikking te stellen, indien bij de vervaardiging niet aan bij de
      maatregel gestelde eisen wordt of is voldaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.3
    text: |-
      Met betrekking tot inrichtingen worden regels als bedoeld in het eerste lid alleen gesteld, indien dit uit een
      oogpunt van doelmatige regelgeving bijzonder aangewezen is.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.4
    text: |-
      In een algemene maatregel van bestuur krachtens het eerste lid wordt een termijn bepaald, eerst bij het verstrijken
      waarvan de bij die maatregel gestelde regels ten aanzien van stoffen, preparaten of andere producten, die bij het
      in werking treden van de maatregel reeds vervaardigd en hier te lande aanwezig waren, gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.15.5
    text: |-
      Onze Minister kan nadere regels stellen omtrent onderwerpen die zijn geregeld in een maatregel krachtens het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.15
  - number: 10.16.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van een doelmatig beheer van afvalstoffen regels worden
      gesteld, inhoudende een verplichting voor degene die bij die maatregel aangewezen categorieën van stoffen,
      preparaten of andere producten op de markt brengt, die stoffen, preparaten of andere producten of de verpakking
      ervan te voorzien van een door Onze Minister aangegeven aanduiding. Bij de maatregel kan worden bepaald dat die
      regels slechts gelden in daarbij aangewezen categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.16
  - number: 10.16.2
    text: |-
      Een aanduiding kan een aanbeveling inhouden met betrekking tot het beheer van de desbetreffende stoffen, preparaten
      of andere producten, de verpakking of de bij het gebruik vrijkomende afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.16
  - number: 10.16.3
    text: |-
      Onze Minister kan nadere regels stellen die aangeven welke producten worden begrepen onder de krachtens het eerste
      lid aangewezen categorieën van stoffen, preparaten of andere producten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.16
  - number: 10.17.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het bevorderen van nuttige toepassing of anderszins in
      het belang van de bescherming van het milieu regels worden gesteld met betrekking tot het innemen, nuttig toepassen
      of verwijderen van daarbij aangewezen categorieën van stoffen, preparaten of andere producten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.17
  - number: 10.17.2
    text: |-
      Hiertoe kunnen in ieder geval behoren regels, inhoudende de verplichting voor degene die stoffen, preparaten of
      andere producten op de markt brengt:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.17
  - number: 10.17.2.a
    text: die producten, na gebruik, in te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.17
  - number: 10.17.2.b
    text: |-
      zorg te dragen voor het treffen van voorzieningen die erop gericht zijn om die producten na inname op een bij die
      maatregel aangegeven wijze nuttig toe te passen of te verwijderen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.17
  - number: 10.17.2.c
    text: |-
      zorg te dragen voor het, na inname, afgeven van die producten aan een persoon, behorende tot een bij die maatregel
      aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.17
  - number: '10.18'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het bevorderen van nuttige toepassing of anderszins in
      het belang van de bescherming van het milieu, personen, behorende tot een bij de maatregel aangewezen categorie,
      worden verplicht bij die maatregel aangewezen categorieën van afvalstoffen of andere producten in ontvangst te
      nemen en vervolgens op een bij die maatregel aangegeven wijze toe te passen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.18
  - number: 10.19.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de gemeenten er zorg voor dragen dat er op ten minste één
      daartoe ter beschikking gestelde plaats binnen de gemeente of binnen de gemeenten waarmee wordt samengewerkt, in
      voldoende mate gelegenheid wordt geboden om daarbij aangewezen stoffen, preparaten of andere producten achter te
      laten die zijn ingenomen krachtens [artikel 10.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.19.2
    text: |-
      Bij de maatregel kunnen regels worden gesteld omtrent de wijze waarop de gemeenten uitvoering geven aan de
      verplichting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.19
  - number: 10.20.1
    text: |-
      Onze Minister kan, indien naar zijn oordeel in het belang van een doelmatig beheer van afvalstoffen een onverwijlde
      voorziening noodzakelijk is, een regeling vaststellen van de in [de artikelen 10.15][ref1] tot en met [10.19][ref2]
      bedoelde strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.20.2
    text: |-
      Een zodanige regeling vervalt een jaar nadat zij in werking is getreden of, indien binnen die termijn een algemene
      maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip waarop die maatregel
      in werking treedt. Onze Minister kan de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.20
  - number: 10.21.1
    text: |-
      Elke gemeente draagt er, al dan niet in samenwerking met andere gemeenten, zorg voor dat ten minste eenmaal per
      week de huishoudelijke afvalstoffen met uitzondering van grove huishoudelijke afvalstoffen worden ingezameld bij
      elk binnen haar grondgebied gelegen perceel waar zodanige afvalstoffen geregeld kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.21
  - number: 10.21.2
    text: Groente-, fruit- en tuinafval wordt daarbij in ieder geval afzonderlijk ingezameld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.21
  - number: 10.21.3
    text: |-
      De gemeenteraad kan besluiten tot het afzonderlijk inzamelen van andere bestanddelen van huishoudelijke
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.21
  - number: 10.22.1
    text: 'Elke gemeente draagt er zorg voor:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.22
  - number: 10.22.1.a
    text: |-
      dat grove huishoudelijke afvalstoffen worden ingezameld bij elk binnen haar grondgebied gelegen perceel waar
      zodanige afvalstoffen ontstaan, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.22
  - number: 10.22.1.b
    text: |-
      dat er op ten minste één daartoe ter beschikking gestelde plaats binnen de gemeente of binnen de gemeenten waarmee
      wordt samengewerkt, in voldoende mate gelegenheid wordt geboden om grove huishoudelijke afvalstoffen achter te
      laten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.22
  - number: 10.22.2
    text: |-
      In het belang van een doelmatig beheer van grove huishoudelijke afvalstoffen kan bij algemene maatregel van
      bestuur worden bepaald dat het eerste lid geheel of gedeeltelijk buiten toepassing blijft met betrekking tot bij
      de maatregel aangewezen categorieën van grove huishoudelijke afvalstoffen, al dan niet voor zover deze vrijkomen in
      een hoeveelheid of een omvang die, of een gewicht dat groter is dan bij de maatregel is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.22
  - number: 10.23.1
    text: De gemeenteraad stelt in het belang van de bescherming van het milieu een afvalstoffenverordening vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.23
  - number: 10.23.2
    text: |-
      Onverminderd [artikel 10.14][ref1] wordt bij het vaststellen of wijzigen van de verordening rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.23.2.a
    text: het gemeentelijke milieubeleidsplan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.23
  - number: 10.23.2.b
    text: het gemeentelijke milieuprogramma, indien in de gemeente geen milieubeleidsplan geldt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.23
  - number: 10.23.3
    text: |-
      De afvalstoffenverordening bevat geen regels als bedoeld in [artikel 10.48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.24.1
    text: 'De afvalstoffenverordening bevat ten minste regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.24
  - number: 10.24.1.a
    text: |-
      het overdragen of het ter inzameling aanbieden van huishoudelijke afvalstoffen aan een bij of krachtens de
      verordening aangewezen inzameldienst;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.24
  - number: 10.24.1.b
    text: het overdragen van zodanige afvalstoffen aan een ander;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.24
  - number: 10.24.1.c
    text: het achterlaten van zodanige afvalstoffen op een daartoe ter beschikking gestelde plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.24
  - number: 10.24.2
    text: |-
      Bij de afvalstoffenverordening kunnen voorts regels worden gesteld omtrent het inzamelen van huishoudelijke
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.24
  - number: '10.25'
    text: 'Bij de afvalstoffenverordening kunnen in ieder geval regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.25
  - number: 10.25.a
    text: |-
      ten einde te voorkomen dat afvalstoffen als zwerfafval in het milieu terecht komen dan wel teneinde te bereiken dat
      zulks zo min mogelijk gebeurt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.25
  - number: 10.25.b
    text: omtrent het opruimen van afvalstoffen die als zwerfafval in het milieu terecht zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.25
  - number: 10.25.c
    text: omtrent het op een voor het publiek zichtbare plaats aanwezig hebben van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.25
  - number: 10.26.1
    text: |-
      De gemeenteraad kan, in afwijking van [artikel 10.21][ref1], in het belang van een doelmatig beheer van
      huishoudelijke afvalstoffen bij de afvalstoffenverordening bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.26.1.a
    text: huishoudelijke afvalstoffen worden ingezameld nabij elk perceel;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
  - number: 10.26.1.b
    text: huishoudelijke afvalstoffen worden ingezameld met een bij de verordening aangegeven regelmaat;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
  - number: 10.26.1.c
    text: in een gedeelte van het grondgebied van de gemeente geen huishoudelijke afvalstoffen worden ingezameld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
  - number: 10.26.2
    text: |-
      De gemeenteraad betrekt bij de voorbereiding van een zodanig besluit de ingezetenen en belanghebbenden, op de wijze
      voorzien in de krachtens [artikel 150 van de Gemeentewet][ref1] vastgestelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: 10.26.3
    text: Burgemeester en wethouders stellen de inspecteur op de hoogte van het voornemen een zodanig besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
  - number: 10.26.4
    text: |-
      Onze Minister stelt regels inhoudende de voorwaarden waaronder ingevolge het eerste lid kan worden bepaald dat
      huishoudelijke afvalstoffen nabij elk perceel worden ingezameld. Hiertoe behoren in ieder geval regels omtrent de
      loopafstand van het perceel naar het inzamelpunt en de beschikbaarheid van het inzamelpunt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.26
  - number: '10.27'
    text: |-
      In gevallen als bedoeld in [artikel 10.26, eerste lid, onder b en c][ref1], draagt de gemeente er zorg voor dat
      op ten minste één daartoe ter beschikking gestelde plaats binnen de gemeente of binnen de gemeenten waarmee wordt
      samengewerkt, in voldoende mate gelegenheid wordt geboden om huishoudelijke afvalstoffen achter te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.28.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het opnemen in de verordening
      van een verplichting bestanddelen van huishoudelijke afvalstoffen te brengen naar een daartoe beschikbaar gestelde
      plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.28
  - number: 10.28.2
    text: |-
      Bij de maatregel kan worden aangegeven op welke wijze de gemeenten er zorg voor dragen dat plaatsen als bedoeld in
      het eerste lid, binnen de gemeente in voldoende mate beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.28
  - number: 10.28.3
    text: |-
      Bij de maatregel kan worden bepaald dat [de artikelen 10.21, eerste lid][ref1], en
      [10.24, eerste lid, onder a][ref2], niet van toepassing zijn met betrekking tot de inzameling van de bestanddelen
      van huishoudelijke afvalstoffen, die zijn aangewezen krachtens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.29.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover het betreft gevallen waarin een doelmatig beheer van
      huishoudelijke afvalstoffen van meer dan gemeentelijk belang is, regels worden gesteld omtrent de inzameling van
      die afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.29
  - number: 10.29.2
    text: |-
      Hiertoe kunnen in ieder geval behoren regels die inhouden dat de gemeenten maatregelen treffen voor de inzameling
      van die afvalstoffen of daartoe voorzieningen tot stand brengen en in stand houden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.29
  - number: 10.30.1
    text: |-
      Het is verboden zich, anders dan vanuit een inrichting, van afvalwater of andere afvalstoffen te ontdoen door deze
      in een voorziening voor de inzameling en het transport van afvalwater te brengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: 10.30.2
    text: 'Het verbod geldt niet voor het brengen in een zodanige voorziening van:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: 10.30.2.a
    text: afvloeiend hemelwater;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: 10.30.2.b
    text: huishoudelijk afvalwater in het kader van normaal huishoudelijk gebruik;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: 10.30.2.c
    text: |-
      bedrijfsafvalwater dat naar zijn aard overeenkomt met huishoudelijk afvalwater, in het kader van met normaal
      huishoudelijk gebruik vergelijkbaar gebruik, door middel van een straatkolk of inspectieput.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: 10.30.3
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van een doelmatig beheer van afvalwater voor daarbij
      aangegeven categorieën van gevallen vrijstelling worden verleend van het verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.30
  - number: '10.31'
    text: |-
      [De artikelen 10.21][ref1] tot en met [10.29][ref2] en titel 10.6 zijn niet van toepassing op het brengen van
      afvalwater en andere afvalstoffen in een voorziening voor de inzameling en het transport van afvalwater, het
      inzamelen en transporteren van afvalwater in een zodanige voorziening en het vanuit een zodanige voorziening
      afgeven van afvalwater aan een persoon die een zuiveringstechnisch werk beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.32'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van een doelmatig beheer van afvalwater regels worden
      gesteld met betrekking tot het brengen van afvalwater en andere afvalstoffen in een voorziening voor de inzameling
      en het transport van afvalwater, anders dan vanuit een inrichting.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.32
  - number: 10.33.1
    text: |-
      Elke gemeente draagt zorg voor de doelmatige inzameling en het doelmatig transport van afvalwater dat vrijkomt bij
      de binnen haar grondgebied gelegen percelen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.33
  - number: 10.33.2
    text: |-
      Op verzoek van burgemeester en wethouders kunnen gedeputeerde staten in het belang van een doelmatig beheer van
      afvalwater ontheffing verlenen van de verplichting opgenomen in het eerste lid, voor een in die ontheffing genoemde
      periode, voor:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.33
  - number: 10.33.2.a
    text: een gedeelte van het grondgebied van de gemeente, dat gelegen is buiten de bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.33
  - number: 10.33.2.b
    text: |-
      een bebouwde kom van waaruit afvalwater met een vervuilingswaarde van minder dan 2000 inwonerequivalenten wordt
      geloosd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.33
  - number: '10.34'
    text: |-
      Onze Minister stelt regels over het ontwerpen, bouwen, aanpassen en onderhouden van de voorzieningen voor de
      inzameling en het transport van afvalwater ter uitvoering van een voor Nederland verbindend verdrag of een voor
      Nederland verbindend besluit van een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.34
  - number: 10.35.1
    text: |-
      Onze Minister stelt iedere twee jaar een rapport op, waarin de stand van zaken wordt beschreven met betrekking tot
      de inzameling en het transport van afvalwater en de afvoer van slib dat geheel of in hoofdzaak afkomstig is van de
      rioolwaterzuiveringsinrichtingen die door een provincie, een gemeente of een waterschap worden beheerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.35
  - number: 10.35.2
    text: Van de vaststelling van het rapport wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.35
  - number: 10.35.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing van
      het eerste lid. Deze regels kunnen voor gemeenten de verplichting inhouden jaarlijks op een daarbij aangegeven
      wijze gegevens te verstrekken, die voor de opstelling van het rapport nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.35
  - number: '10.36'
    text: |-
      Voor de toepassing van deze titel worden ingezamelde of afgegeven huishoudelijke afvalstoffen gelijkgesteld met
      bedrijfsafvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.36
  - number: 10.37.1
    text: Het is verboden zich door afgifte aan een ander van bedrijfsafvalstoffen of gevaarlijke afvalstoffen te ontdoen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
  - number: 10.37.2
    text: 'Het verbod geldt niet indien bedrijfsafvalstoffen of gevaarlijke afvalstoffen worden afgegeven aan een persoon:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
  - number: 10.37.2.a
    text: |-
      die krachtens [artikel 10.45][ref1] of [10.48][ref2] bevoegd is de betrokken afvalstoffen in te zamelen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.37.2.b
    text: 'die bevoegd is de betrokken afvalstoffen nuttig toe te passen of te verwijderen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
  - number: 10.37.2.b.1°
    text: |-
      krachtens [hoofdstuk 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: 10.37.2.b.2°
    text: |-
      op grond van een krachtens [artikel 10.2, tweede lid][ref1], verleende vrijstelling of een ontheffing krachtens
      [artikel 10.63, tweede of derde lid][ref2], van het verbod, bedoeld in [artikel 10.2, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.37.2.b.3°
    text: |-
      krachtens [artikel 10.52][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.37.2.b.4°
    text: |-
      op grond van een krachtens [artikel 10.54, derde lid][ref1], verleende vrijstelling of een ontheffing krachtens
      [artikel 10.63, derde lid][ref2], van het verbod, bedoeld in [artikel 10.54, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.37.2.c
    text: |-
      die krachtens [artikel 10.50][ref1] is vrijgesteld van de verplichtingen, gesteld bij of krachtens
      [de artikelen 10.38][ref2] tot en met [10.40][ref3], [10.45][ref4], [10.46][ref5] en [10.48][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.37.2.d
    text: |-
      die op grond van een krachtens de [Wet verontreiniging zeewater][ref1] verleende ontheffing bevoegd is de betrokken
      afvalstoffen te lozen, dan wel aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk ze te lozen;


      [ref1]: https://wetten.overheid.nl/BWBR0002975
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0002975
  - number: 10.37.2.e
    text: |-
      die krachtens de [Wet verontreiniging oppervlaktewateren][ref1] bevoegd is afvalstoffen van de betrokken aard en
      samenstelling te brengen in oppervlaktewateren;


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 10.37.2.f
    text: |-
      die in een ander land dan Nederland is gevestigd, en die overeenkomstig de EEG-verordening overbrenging van
      afvalstoffen en [titel 10.7][ref1] die afvalstoffen naar dat land brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 10.38.1
    text: |-
      Degene die zich van bedrijfsafvalstoffen of gevaarlijke afvalstoffen ontdoet door deze af te geven aan een persoon
      als bedoeld in [artikel 10.37, tweede lid, onder a tot en met f][ref1], registreert met betrekking tot zodanige
      afgifte:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.38.1.a
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.1.b
    text: de naam en het adres van degene aan wie de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.1.c
    text: de gebruikelijke benaming en de hoeveelheid van die afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.1.d
    text: de plaats waar en de wijze waarop de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.1.e
    text: de voorgenomen wijze van beheer van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.1.f
    text: |-
      ingeval de afgifte geschiedt door tussenkomst van een ander die opdracht heeft de afvalstoffen te vervoeren naar
      degene voor wie deze zijn bestemd: diens naam en adres en de naam en het adres van degene in wiens opdracht het
      vervoer geschiedt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.2
    text: |-
      De geregistreerde gegevens worden tenminste vijf jaar bewaard en gedurende die periode ter beschikking gehouden van
      degenen die zijn belast met het toezicht op de naleving van de wet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
  - number: 10.38.3
    text: |-
      Een persoon als bedoeld in [artikel 10.37, tweede lid, onder a of b][ref1], die zich van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen ontdoet door deze af te geven aan een andere zodanige persoon, meldt met betrekking tot
      een zodanige afgifte de in het eerste lid bedoelde gegevens aan een door Onze Minister aan te wijzen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.39.1
    text: |-
      Degene die zich van bedrijfsafvalstoffen of gevaarlijke afvalstoffen ontdoet door afgifte aan een persoon als
      bedoeld in [artikel 10.37, tweede lid, onder a tot en met e][ref1], verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.39.1.a
    text: aan deze persoon een omschrijving van aard, eigenschappen en samenstelling van die afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.39
  - number: 10.39.1.b
    text: aan degene die opdracht heeft de afvalstoffen naar die persoon te vervoeren, een begeleidingsbrief.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.39
  - number: 10.39.2
    text: |-
      De begeleidingsbrief bevat ten minste de in het eerste lid, onder a, en de in [artikel 10.38, eerste lid][ref1],
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.1
    text: |-
      Een persoon als bedoeld in [artikel 10.37, tweede lid, onder a of b][ref1], aan wie bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen worden afgegeven, meldt met betrekking tot een zodanige afgifte, aan een door Onze
      Minister aan te wijzen instantie:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.1.a
    text: de datum van afgifte;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.1.b
    text: de naam en het adres van degene van wie de afvalstoffen afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.1.c
    text: de gebruikelijke benaming en de hoeveelheid van de afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.1.d
    text: de plaats waar en de wijze waarop de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.1.e
    text: de wijze waarop de afvalstoffen nuttig worden toegepast of worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.1.f
    text: |-
      ingeval de afgifte geschiedt door tussenkomst van een ander die opdracht had de afvalstoffen naar hem te vervoeren:
      diens naam en adres en de naam en het adres van degene in wiens opdracht het vervoer geschiedt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.40.2
    text: |-
      Het is een persoon als bedoeld in het eerste lid verboden bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      in ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39, eerste lid, onder a en b][ref1], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.40.3
    text: |-
      Op verzoek van een provincie of gemeente die terzake bevoegd gezag is, worden de gegevens, bedoeld in het eerste
      lid, aan die provincie of gemeente gezonden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.40
  - number: 10.41.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop aan
      [de artikelen 10.38][ref1] tot en met [10.40][ref2] uitvoering wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.41.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald of de melding, bedoeld in
      [de artikelen 10.38, derde lid][ref1], en [10.40][ref2], voorafgaand aan de afgifte, onderscheidenlijk de ontvangst
      van afvalstoffen plaatsvindt of erna. Daarbij kan een onderscheid worden gemaakt naar categorie van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.42.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan aan in [artikel 10.38, eerste lid][ref1], bedoelde personen de
      verplichting worden opgelegd de in dat artikel bedoelde gegevens te melden aan een door Onze Minister aan te wijzen
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.42.2
    text: |-
      [De artikelen 10.40, derde lid][ref1], en [10.41][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.42
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.43.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot bedrijfsafvalstoffen en
      gevaarlijke afvalstoffen categorieën van gevallen worden aangewezen waarvoor verplichtingen als bedoeld in de
      [artikelen 10.38 tot en met 10.40][ref1] niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.43.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt bij of krachtens de algemene maatregel van bestuur aan
      personen als bedoeld in [artikel 10.40, eerste lid][ref1], de verplichting opgelegd de in de betrokken bepalingen
      bedoelde gegevens te registreren op een daarbij aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.44.1
    text: |-
      Degene die bedrijfsafvalstoffen of gevaarlijke afvalstoffen vervoert, is verplicht zolang hij die afvalstoffen
      onder zich heeft, een begeleidingsbrief als bedoeld in artikel 10.39 bij die afvalstoffen aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.44
  - number: 10.44.2
    text: |-
      Hij geeft, indien een ander de afvalstoffen in ontvangst neemt, de begeleidingsbrief aan die ander af, bij dat in
      ontvangst nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.44
  - number: 10.44.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop aan de
      verplichtingen, bedoeld in het eerste en tweede lid, uitvoering wordt gegeven. Tevens kunnen daarbij categorieën
      van gevallen worden aangewezen waarvoor zodanige verplichtingen niet gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.44
  - number: 10.45.1
    text: 'Het is verboden bedrijfsafvalstoffen of gevaarlijke afvalstoffen in te zamelen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.45.1.a
    text: zonder vermelding op een lijst van inzamelaars, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.45.1.b
    text: |-
      ingeval de afvalstoffen tot de krachtens [artikel 10.48][ref1] aangewezen categorieën behoren, zonder vergunning
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.45.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, indien het belang van de bescherming van het milieu zich
      daartegen niet verzet, voor daarbij aangegeven categorieën van gevallen vrijstelling worden verleend van het
      verbod, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.45.3
    text: |-
      Onze Minister wijst een instantie aan die namens hem zorg draagt voor de vermelding van inzamelaars op de in het
      eerste lid bedoelde lijst van inzamelaars.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.45.4
    text: Op aanwijzing van Onze Minister wordt de vermelding van een inzamelaar op de lijst beëindigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.45.5
    text: Onze Minister stelt regels met betrekking tot de criteria voor vermelding op de lijst en beëindiging daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.45
  - number: 10.46.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van een doelmatig beheer van
      bedrijfsafvalstoffen of gevaarlijke afvalstoffen regels gesteld omtrent het inzamelen van die afvalstoffen, al dan
      niet afkomstig van personen, behorende tot een bij of krachtens die maatregel aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.46.2
    text: 'Tot de regels behoren:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.46.2.a
    text: |-
      regels omtrent de wijze waarop een inzamelaar zich bij de krachtens [artikel 10.45, derde lid][ref1], aangewezen
      instantie meldt en de gegevens die daarbij worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.46.2.b
    text: regels inhoudende de verplichting een wijziging te melden in de gegevens welke bij de melding zijn overgelegd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.46.2.c
    text: |-
      regels omtrent het aan een ieder inzage geven van de gegevens, overgelegd bij de melding alsmede van een wijziging
      als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.46.2.d
    text: |-
      regels inhoudende de verplichting dat de inzamelaar tijdens het inzamelen daarbij aan te geven bescheiden aanwezig
      heeft, waaruit blijkt dat hij staat vermeld op de lijst van inzamelaars.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.46.3
    text: |-
      Bij de regels kan worden bepaald dat de vermelding op de lijst van inzamelaars slechts geldt voor een daarbij
      aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.46
  - number: 10.47.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van een doelmatig beheer van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen regels worden gesteld omtrent de inzameling van die afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.47
  - number: 10.47.2
    text: 'Hiertoe kunnen in ieder geval behoren regels die inhouden dat:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.47
  - number: 10.47.2.a
    text: |-
      de gemeenten of de provincies voor de inzameling van die afvalstoffen maatregelen treffen of daartoe voorzieningen
      tot stand brengen en in stand houden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.47
  - number: 10.47.2.b
    text: |-
      daarbij aangewezen categorieën van bedrijfsafvalstoffen of gevaarlijke afvalstoffen die gescheiden worden
      afgegeven, afzonderlijk worden ingezameld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.47
  - number: 10.47.3
    text: |-
      Bij de maatregel wordt aangegeven binnen welke termijn de regels door de daarbij aangewezen bestuursorganen moeten
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.47
  - number: 10.48.1
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van een doelmatig beheer van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen worden bepaald dat voor het inzamelen van daarbij aangewezen categorieën van zodanige
      afvalstoffen een vergunning van Onze Minister is vereist.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.48
  - number: 10.48.2
    text: |-
      [De artikelen 8.5][ref1] tot en met [8.25][ref2] zijn van overeenkomstige toepassing met betrekking tot het
      verlenen, weigeren, wijzigen en intrekken van een vergunning als bedoeld in het eerste lid, met dien verstande dat
      voor de toepassing van genoemde artikelen het belang van de bescherming van het milieu beperkt wordt tot het belang
      van een doelmatig beheer van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 10.48.3
    text: |-
      Ten aanzien van de houder van een vergunning als bedoeld in het eerste lid, is [artikel 8.36f, tweede lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
  - number: 10.49.1
    text: |-
      De aan de vergunning, bedoeld in [artikel 10.48, eerste lid][ref1], te verbinden voorschriften kunnen in ieder
      geval inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.49.1.a
    text: |-
      dat in daarbij aangewezen categorieën van gevallen afvalstoffen niet mogen worden ingezameld zonder afzonderlijke
      toestemming van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.49.1.b
    text: |-
      de verplichting, daarbij aangewezen afvalstoffen, wanneer zij aan de inzamelaar worden aangeboden, in ontvangst
      te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.49.1.c
    text: |-
      de verplichting, daarbij aangewezen categorieën van afvalstoffen die gescheiden worden afgegeven, afzonderlijk in
      te zamelen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.49.1.d
    text: de verplichting, daarbij aangewezen afvalstoffen, wanneer zij aan de inzamelaar worden aangeboden, op te halen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.49.1.e
    text: de verplichting afvalstoffen af te geven aan daarbij aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.49.2
    text: |-
      Een vergunning geldt slechts voor degene aan wie zij is verleend. Deze draagt ervoor zorg dat de aan de vergunning
      verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.49
  - number: 10.50.1
    text: |-
      Onze Minister kan, indien voor het beheer van de betrokken stoffen, preparaten of andere producten een verplichting
      deze in te nemen als bedoeld in [artikel 10.17][ref1] of een daaraan gelijkwaardige vrijwillige inname bestaat,
      bij ministeriële regeling categorieën van gevallen aangeven waarin de verplichtingen, gesteld bij of krachtens
      [de artikelen 10.38][ref2] tot en met [10.40][ref3], [10.45][ref4], [10.46][ref5] en [10.48][ref6] niet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.50
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.50.2
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid omvat de verplichting tot het registreren van daarbij aan
      te geven gegevens op een daarbij aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.50
  - number: 10.51.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van een doelmatig beheer van bedrijfsafvalstoffen of
      gevaarlijke afvalstoffen regels worden gesteld omtrent het zich ontdoen buiten een inrichting van bij de maatregel
      aangewezen categorieën van bedrijfsafvalstoffen of gevaarlijke afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.51
  - number: 10.51.2
    text: 'Bij de maatregel kunnen in ieder geval regels worden gesteld, inhoudende de verplichting:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.51
  - number: 10.51.2.a
    text: die afvalstoffen te scheiden en – mede van andere stoffen en afvalstoffen – gescheiden te houden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.51
  - number: 10.51.2.b
    text: ingeval van afgifte aan een ander, die afvalstoffen gescheiden af te geven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.51
  - number: 10.52.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van het milieu regels worden gesteld
      omtrent het beheer van bij de maatregel aangewezen categorieën van bedrijfsafvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.52
  - number: 10.52.2
    text: |-
      Bij de maatregel kunnen in ieder geval regels worden gesteld, inhoudende een verbod bij de maatregel aangewezen
      categorieën van bedrijfsafvalstoffen buiten een inrichting nuttig toe te passen of te verwijderen zonder vergunning
      van het bestuursorgaan dat daartoe bij de maatregel is aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.52
  - number: 10.52.3
    text: |-
      Bij de maatregel kan de verplichting worden opgelegd te voldoen aan nadere eisen met betrekking tot daarbij
      aangegeven onderwerpen. Bij de maatregel wordt het bestuursorgaan aangewezen, dat die eisen kan stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.52
  - number: '10.53'
    text: |-
      [De artikelen 8.5][ref1] tot en met [8.25][ref2] zijn van overeenkomstige toepassing met betrekking tot het
      verlenen, weigeren, wijzigen en intrekken van een vergunning als bedoeld in [artikel 10.52, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.53
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 10.54.1
    text: Het is verboden gevaarlijke afvalstoffen buiten een inrichting nuttig toe te passen of te verwijderen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.54
  - number: 10.54.2
    text: |-
      Het verbod geldt niet voor handelingen die aan degene die gevaarlijke afvalstoffen inzamelt, uitdrukkelijk zijn
      toegestaan krachtens [de artikelen 10.47][ref1] of [10.48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.54.3
    text: |-
      [Artikel 10.2, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.55.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.1.a
    text: bedrijfsafvalstoffen of gevaarlijke afvalstoffen voor anderen tegen vergoeding te vervoeren,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.1.b
    text: bedrijfsafvalstoffen of gevaarlijke afvalstoffen te verhandelen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.1.c
    text: ten behoeve van anderen te bemiddelen bij het beheer van bedrijfsafvalstoffen of gevaarlijke afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.2
    text: |-
      Het verbod, bedoeld in het eerste lid, onder a, geldt niet voor degene die krachtens [artikel 10.45][ref1] bevoegd
      is tot het inzamelen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.3
  - number: 10.55.3
    text: |-
      Onze Minister wijst een instantie aan die namens hem zorg draagt voor de vermelding van vervoerders, handelaars en
      bemiddelaars op de lijst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.4
    text: |-
      Onze Minister stelt nadere regels omtrent de vermelding van vervoerders, handelaars en bemiddelaars op de lijst,
      bedoeld in het eerste lid. Deze regels bevatten in ieder geval criteria voor vermelding op de lijst en voor
      beëindiging daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.5
    text: |-
      Een vervoerder, handelaar of bemiddelaar als bedoeld in het eerste lid registreert met betrekking tot de
      activiteiten, bedoeld in het eerste lid, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.5.a
    text: 'de naam en het adres van degene:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.5.a.1
    text: van wie de afvalstoffen afkomstig zijn,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.5.a.2
    text: aan wie de afvalstoffen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.5.b
    text: de gebruikelijke benaming en de hoeveelheid van de afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
  - number: 10.55.6
    text: |-
      [Artikel 10.38, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.55
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.1
  - number: 10.56.1
    text: Onze Minister stelt regels ter uitvoering van artikel 27 van de EEG-verordening overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.56
  - number: 10.56.2
    text: |-
      Ter uitvoering van andere artikelen dan het in het eerste lid genoemde artikel van de EEG-verordening overbrenging
      van afvalstoffen kan Onze Minister regels stellen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.56
  - number: '10.57'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de titels II, VII en VIII van de EEG-verordening
      overbrenging van afvalstoffen van overeenkomstige toepassing zijn met betrekking tot de overbrenging van
      afvalstoffen binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.57
  - number: 10.58.1
    text: |-
      Het is verboden afvalstoffen waarop de EEG-verordening overbrenging van afvalstoffen van toepassing is, binnen
      Nederlands grondgebied of buiten Nederlands grondgebied te brengen, indien dat naar het oordeel van Onze Minister
      in strijd zou zijn met het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.58
  - number: 10.58.2
    text: |-
      Het is tevens verboden afvalstoffen waarop de EEG-verordening overbrenging van afvalstoffen van toepassing is,
      buiten Nederlands grondgebied te brengen om nuttig te worden toegepast of te worden verwijderd in een land buiten
      de Europese Unie, waar de EEG-verordening overbrenging van afvalstoffen niet van toepassing is, indien Onze
      Minister redelijkerwijs tot het oordeel moet komen dat de voorgenomen wijze van nuttig toepassen of verwijderen in
      strijd zal zijn met het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.58
  - number: 10.58.3
    text: |-
      Onze Minister is de bevoegde autoriteit, bedoeld in artikel 36 van de EEG-verordening overbrenging van
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.58
  - number: '10.59'
    text: |-
      Op een kennisgeving als bedoeld in de EEG-verordening overbrenging van afvalstoffen, zijn de [artikelen 4:2][ref1],
      [4:5][ref2] en [4:6 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 10.60.1
    text: |-
      Het is verboden handelingen te verrichten als bedoeld in artikel 26, eerste lid, van de EEG-verordening
      overbrenging van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2
    text: 'Het is verboden afvalstoffen over te brengen indien gehandeld wordt in strijd met:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2.a
    text: het verbod gesteld bij artikel 18, eerste lid, van de EEG-verordening overbrenging afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2.b
    text: het voorschrift gesteld bij artikel 24, zesde lid, van de EEG-verordening overbrenging afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2.c
    text: |-
      een voorschrift gesteld bij artikel 5, tweede of vijfde lid, 8, tweede of vijfde lid, 9, eerste lid, 11, 15,
      achtste lid, eerste volzin, 20, zevende lid, eerste volzin, of achtste lid, 23, zesde lid, eerste volzin, 28,
      eerste lid, tweede volzin, 29, of 39, tweede lid, van de EEG-verordening overbrenging afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2.d
    text: |-
      een voorwaarde gesteld krachtens artikel 4, tweede lid, onder d, 7, derde lid, 15, vijfde lid, of 23, vierde lid,
      van de EEG-verordening overbrenging afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
  - number: 10.60.2.e
    text: |-
      een voorschrift gesteld bij artikel 5, zesde lid, 8, zesde lid, 15, achtste lid, laatste [volzin, 17][ref1],
      zevende lid, eerste volzin, 23, zesde lid, derde volzin, of 35, van de EEG-verordening overbrenging afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.60
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.61.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, voor zover dat in het belang van een doelmatig beheer van afvalstoffen
      noodzakelijk is, regels worden gesteld met betrekking tot het opnemen in de afvalstoffenverordening van regels als
      bedoeld in [de artikelen 10.21][ref1], [10.24][ref2], [10.25][ref3] en [10.26][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.61
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.61.2
    text: |-
      Bij een maatregel als bedoeld in het eerste lid wordt aangegeven binnen welke termijn en, indien nodig, op welke
      wijze die regels moeten zijn opgenomen in de verordening.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.61
  - number: 10.62.1
    text: |-
      Onze Minister kan, voor zover dat in het belang van een doelmatig beheer van afvalstoffen noodzakelijk is, aan een
      gemeente een bindende aanwijzing geven met betrekking tot het opnemen in de afvalstoffenverordening, van regels als
      bedoeld in [de artikelen 10.21][ref1], [10.24][ref2], [10.25][ref3] en [10.26][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.62
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.62.2
    text: |-
      [Artikel 10.61, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.62
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.62.3
    text: |-
      Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met de betrokken gemeente. Hij
      deelt het voornemen, onder vermelding van de redenen daarvoor, mee aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.62
  - number: 10.62.4
    text: Van de aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.62
  - number: 10.63.1
    text: |-
      Burgemeester en wethouders kunnen, indien het belang van een doelmatig beheer van afvalwater zich daartegen niet
      verzet, ontheffing verlenen van het in [artikel 10.30, eerste lid][ref1], gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.63.2
    text: |-
      Burgemeester en wethouders kunnen, indien het belang van de bescherming van het milieu zich daartegen niet verzet,
      ontheffing verlenen van het in [artikel 10.2, eerste lid][ref1], gestelde verbod om zich van afvalstoffen te
      ontdoen door deze buiten een inrichting te verbranden, voorzover het geen gevaarlijke afvalstoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.63.3
    text: |-
      Gedeputeerde staten kunnen, indien het belang van de bescherming van het milieu zich daartegen niet verzet,
      ontheffing verlenen van het in [artikel 10.2, eerste lid][ref1], gestelde verbod om zich van afvalstoffen te
      ontdoen door deze buiten een inrichting te storten of anderszins op of in de bodem te brengen, voorzover het geen
      gevaarlijke afvalstoffen betreft, en, indien het belang van een doelmatig beheer van afvalstoffen zich daartegen
      niet verzet, ontheffing verlenen van de in de [artikelen 10.37][ref2] en [10.54][ref3] gestelde verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.63
    references:
