        paragraaf: '7.6'
      - id: ref10
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
      - id: ref11
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 19.5.3
    text: |-
      Indien een verzoek tot geheimhouding in het kader van de toepassing van [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] indien het geen besluit op aanvraag betreft of van
      [paragraaf 7.6][ref3] of [7.7][ref4] is gedaan, laat het bevoegd gezag de openbaarmaking van het stuk waarop het
      verzoek betrekking heeft, achterwege totdat, indien het verzoek wordt toegestaan, de tweede tekst is overgelegd
      en de stukken zijn aangevuld met de in [artikel 19.4, eerste lid][ref5], bedoelde gegevens, dan wel, indien het
      verzoek geheel of gedeeltelijk wordt afgewezen, de beslissing op het verzoek onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '7'
        paragraaf: '7.7'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.6a
    text: |-
      De [artikelen 19.3 tot en met 19.5][ref1] zijn van overeenkomstige toepassing op gegevens die voorkomen in een stuk
      ten aanzien waarvan openbaarmaking wordt voorgeschreven of die uit zodanig stuk kunnen worden afgeleid en die niet
      als milieu-informatie zijn te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.6b
    text: |-
      Indien bij de voorbereiding van een besluit dat is aangewezen krachtens [artikel 7.2][ref1] ter zake van een
      activiteit bij de voorbereiding waarvan een milieu-effectrapport moet worden gemaakt, dan wel van een besluit
      inzake vergunning voor een inrichting krachtens [artikel 8.1][ref2], ingevolge een wettelijk voorschrift of een
      besluit van het bevoegd gezag informatie openbaar wordt gemaakt, en dat wettelijk voorschrift of besluit zich
      op andere gronden dan voorzien in [artikel 10 van de Wet openbaarheid van bestuur][ref3] tegen de openbaarmaking
      verzet, is [artikel 10 van de Wet openbaarheid van bestuur][ref4] van overeenkomstige toepassing en blijft het
      wettelijk voorschrift of besluit dat zich tegen de openbaarmaking verzet, buiten toepassing. Indien milieu-
      informatie niet ter inzage wordt gelegd, wordt daarvan mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.6b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 19.7.1
    text: |-
      Indien in een milieuverslag als bedoeld in [titel 12.1][ref1], milieu-informatie voorkomt
      of milieu-informatie daaruit kan worden afgeleid, waarvan de geheimhouding op grond van
      [artikel 10 van de Wet openbaarheid van bestuur][ref2] gerechtvaardigd is, kan het bestuursorgaan, bedoeld in
      [artikel 12.4, eerste lid][ref3], eerste onderscheidenlijk tweede volzin, op een daartoe strekkend verzoek van
      degene die de inrichting drijft, toestaan dat een door dat bestuursorgaan goedgekeurde, tweede tekst openbaar
      wordt gemaakt, waarin die informatie niet voorkomt, onderscheidenlijk waaruit die informatie niet kan worden
      afgeleid. Het bestuursorgaan maakt van deze bevoegdheid slechts gebruik met betrekking tot bedrijfsgeheimen en
      beveiligingsgegevens. Het in de eerste volzin bedoelde verzoek wordt gedaan uiterlijk drie maanden na afloop van
      het verslagjaar. Bij het verzoek wordt een tweede tekst overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk12
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 19.7.2
    text: |-
      Indien in een milieuverslag als bedoeld in [titel 12.1][ref1], milieu-informatie voorkomt of daaruit milieu-
      informatie kan worden afgeleid, waarvan de openbaarmaking achterwege dient te blijven, onderscheidenlijk
      achterwege mag blijven, op grond van [artikel 10, eerste lid, aanhef en onder b][ref2], onderscheidenlijk
      [artikel 10, tweede lid, aanhef en onder a, van de Wet openbaarheid van bestuur][ref3], wordt een door degene die
      de inrichting drijft, op aanwijzing van Onze betrokken Minister opgestelde tweede tekst openbaar gemaakt, waarin
      die informatie niet voorkomt, onderscheidenlijk waaruit deze niet kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk12
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.7
