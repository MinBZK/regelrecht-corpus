  - number: 16.60.2
    text: |-
      Het bestuur van de emissieautoriteit opent op verzoek van de houder, bedoeld in het eerste lid, een deelrekening,
      die onderdeel uitmaakt van de rekening die voor die persoon is geopend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.60
  - number: '16.61'
    text: |-
      [Artikel 16.46][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.61
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.6
  - number: '16.62'
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________________(Stb. 233), en vervolgens telkens na vier
      jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze titel in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0018260#ArtikelI
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.62
    references:
      - id: ref1
        bwb_id: BWBR0018260
        artikel: I
  - number: '17.1'
    text: |-
      Indien zich in een inrichting een ongewoon voorval voordoet of heeft voorgedaan, waardoor nadelige gevolgen voor
      het milieu zijn ontstaan of dreigen te ontstaan, treft degene die de inrichting drijft, onmiddellijk de maatregelen
      die redelijkerwijs van hem kunnen worden verlangd, om de gevolgen van die gebeurtenis te voorkomen of, voor zover
      die gevolgen niet kunnen worden voorkomen, zoveel mogelijk te beperken en ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.1
  - number: 17.2.1
    text: |-
      Degene die een inrichting drijft, waarin zich een voorval, als bedoeld in [artikel 17.1][ref1], voordoet of heeft
      voorgedaan, meldt dat voorval zo spoedig mogelijk aan het bestuursorgaan dat bevoegd is een vergunning krachtens
      [artikel 8.1][ref2] voor een inrichting te verlenen, dan wel ingevolge [artikel 8.41, tweede lid, onder ][ref3],
      het orgaan is waaraan de melding wordt gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 17.2.2
    text: 'Hij verstrekt dat bestuursorgaan tevens, zodra zij bekend zijn, de gegevens met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.2.a
    text: de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.2.b
    text: de ten gevolge van het voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.2.c
    text: |-
      andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het voorval te
      kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.2.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.2.e
    text: de maatregelen die worden overwogen om te voorkomen dat een zodanig voorval zich nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3
    text: |-
      Het bestuursorgaan dat een melding als bedoeld in het eerste of tweede lid ontvangt, geeft van die melding en de
      daarbij verstrekte gegevens onverwijld kennis aan:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3.a
    text: de burgemeesters van de betrokken gemeenten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3.b
    text: de inspecteur;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3.c
    text: |-
      de commissarissen van de Koningin in de betrokken provincies in de gevallen dat de gevolgen van het voorval zich
      voordoen dan wel kunnen voordoen buiten de grenzen van de gemeente waar de inrichting geheel of in hoofdzaak is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3.d
    text: |-
      gedeputeerde staten van de betrokken provincie in de gevallen dat het voorval verontreiniging of aantasting van de
      bodem tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: 17.2.3.e
    text: andere bestuursorganen of overheidsdiensten, die direct belang hebben bij een onverwijlde mededeling.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.2
  - number: '17.3'
    text: |-
      Het bevoegd gezag ziet er op toe dat de nodige gegevens worden verzameld om een ongewoon voorval, als bedoeld in
      [artikel 17.1][ref1], te analyseren en de oorzaken ervan te achterhalen. Om herhaling te voorkomen wijzigt het zo
      nodig de vergunning met toepassing van de [artikelen 8.22][ref2] of [8.23][ref3], of doet het zo mogelijk daarop
      gerichte aanbevelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 17.4.1
    text: |-
      Indien dat door een ongewoon voorval nodig is, kunnen in het belang van de bescherming van het milieu een of meer
      van de volgende verplichtingen of het volgende verbod worden opgelegd aan degene bij wie afvalstoffen ontstaan of
      aanwezig zijn, die zijn aangewezen in de daartoe strekkende beschikking:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.1.a
    text: een verplichting die afvalstoffen te scheiden en – mede van andere stoffen en afvalstoffen – gescheiden te houden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.1.b
    text: een verplichting die afvalstoffen gescheiden af te geven, wanneer zij zich daarvan ontdoen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.1.c
    text: |-
      een verplichting die afvalstoffen ter plaatse waar zij zijn ontstaan, op een bij de beschikking aangegeven wijze
      nuttig toe te passen of te verwijderen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.1.d
    text: een verbod die afvalstoffen langer onder zich te houden dan gedurende een bij de beschikking aangegeven termijn;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.1.e
    text: |-
      een verplichting die afvalstoffen af te geven aan een persoon behorende tot een bij de beschikking aangewezen
      categorie, of te brengen naar een daartoe aangewezen plaats.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.2
    text: 'Een verplichting of verbod als bedoeld in het eerste lid, kan worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.2.a
    text: |-
      voor zover de verplichting of het verbod betrekking heeft op een inrichting: door het bestuursorgaan dat ingevolge
      [artikel 8.2][ref1] van deze wet het bevoegd gezag is ten aanzien van de vergunning voor de inrichting, of, indien
      voor de inrichting regels gelden krachtens [artikel 8.40][ref2], aan het bestuursorgaan waaraan een melding als
      bedoeld in [artikel 8.41, eerste lid][ref3], met betrekking tot die inrichting zou moeten worden gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 17.4.2.b
    text: 'in andere gevallen: door gedeputeerde staten.'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.4.3
    text: |-
      Het bestuursorgaan, bedoeld in het tweede lid, kan bij zijn beschikking aangeven binnen welke termijn en op welke
      wijze de verplichting moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.4
  - number: 17.5.1
    text: 'Onze Minister kan het bevoegde bestuursorgaan verzoeken binnen een door hem aangegeven termijn:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.5
  - number: 17.5.1.a
    text: |-
      op de daarbij aangegeven wijze toepassing te geven aan [artikel 17.4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.5.1.b
    text: |-
      in verband daarmee een voor de betrokkene krachtens [hoofdstuk 8][ref1] geldende vergunning te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: 17.5.2
    text: |-
      Indien de geboden spoed een zodanig verzoek niet toelaat of het bevoegde bestuursorgaan niet binnen de aangegeven
      termijn aan het verzoek gevolg heeft gegeven, geeft Onze Minister toepassing aan [artikel 17.4, eerste lid][ref1],
      onderscheidenlijk wijzigt hij de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel17.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: '18.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: overtreding: gedraging die in strijd is met het bij of krachtens
      [hoofdstuk 16][ref1] bepaalde, [artikel 18.18][ref2], voorzover het een voorschrift betreft dat is verbonden
      aan een vergunning krachtens [hoofdstuk 16][ref3], of artikel 22, eerste lid, van de EG-verordening registratie
      handel in broeikasgasemissierechten; overtreder: de persoon die de overtreding pleegt of medepleegt; bestuurlijke
      boete: bestuurlijke sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van een geldsom, gericht
      op bestraffing van de overtreder; dwangbevel: schriftelijk bevel van een bestuursorgaan dat ertoe strekt de
      betaling van een geldsom af te dwingen, voorzover de verplichting tot betaling van de geldsom uitsluitend aan dat
      bestuursorgaan voortvloeit uit een bij of krachtens deze wet gestelde regel; onderzoek: handelingen die worden
      verricht met het oog op de vaststelling dat al dan niet een overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 18.1a.1
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde,
      alsmede met betrekking tot de handhaving van het bij of krachtens de in [artikel 13.1, tweede lid][ref1], genoemde
      wetten bepaalde, voor zover dit bij of krachtens de betrokken wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
  - number: 18.1a.2
    text: |-
      De [artikelen 18.3 tot en met 18.18][ref1] zijn van overeenkomstige toepassing met betrekking tot de handhaving van
      het bij de EEG-verordening overbrenging van afvalstoffen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.2.1
    text: |-
      Het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8.1][ref1] voor een inrichting te verlenen,
      dan wel ingevolge [artikel 8.41, tweede lid, onder a][ref2], het orgaan is waaraan de melding wordt gericht, heeft
      tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 18.2.1.a
    text: |-
      zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van de betrokken wetten voor degene die de
      inrichting drijft, geldende voorschriften;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
  - number: 18.2.1.b
    text: |-
      andere gegevens dan die bedoeld in de [artikelen 8.12, vierde lid][ref1], [8.12a, derde lid][ref2],
      [8.13, eerste lid, onder c][ref3], en [8.14, eerste lid, onder a][ref4], die eveneens van belang zijn met het oog
      op de onder a bedoelde taak, te verzamelen en te registreren;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 18.2.1.c
    text: |-
      klachten, die betrekking hebben op de naleving van het met betrekking tot de inrichting bij of krachtens de
      betrokken wetten bepaalde, te behandelen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
  - number: 18.2.2
    text: |-
      Indien met betrekking tot een inrichting door het krachtens het eerste lid bevoegde bestuursorgaan een beschikking
      tot toepassing van bestuursdwang, oplegging van een last onder dwangsom of intrekking van een vergunning of
      ontheffing op grond van [artikel 18.12][ref1] is gegeven en, nadat die beschikking is gegeven, voor deze inrichting
      als gevolg van een verandering daarvan of van de werking daarvan een ander bestuursorgaan bevoegd wordt de
      vergunning te verlenen dan wel het orgaan wordt waaraan de melding wordt gericht, blijft het bestuursorgaan dat de
      beschikking heeft gegeven, bevoegd met betrekking tot die beschikking totdat zij


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.2.2.a
    text: onherroepelijk is geworden en is tenuitvoergelegd, dan wel de dwangsom is ingevorderd, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
  - number: 18.2.2.b
    text: |-
      is ingetrokken, dan wel de bij de beschikking opgelegde last overeenkomstig
      [artikel 5:34 van de Algemene wet bestuursrecht][ref1] is opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.2a.1
    text: |-
      Onze betrokken Minister, gedeputeerde staten, burgemeester en wethouders en de waterkwaliteitsbeheerder hebben tot
      taak zorg te dragen voor de bestuursrechtelijke handhaving van [de artikelen 1.1a][ref1] en [10.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.2a.2
    text: |-
      Gedeputeerde staten, burgemeester en wethouders en de waterkwaliteitsbeheerder hebben tot taak zorg te dragen voor
      de bestuursrechtelijke handhaving van het bepaalde bij of krachtens [de artikelen 10.2][ref1] en [10.54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.6.4
  - number: 18.2b.1
    text: |-
      Onze Minister heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de bij of krachtens
      [hoofdstuk 10][ref1] gestelde verplichtingen, voor zover zij betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2b.1.a
    text: |-
      preventie en nuttige toepassing als bedoeld in [titel 10.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: 18.2b.1.b
    text: |-
      overbrengen van afvalstoffen als bedoeld in [titel 10.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.2b
    references:
