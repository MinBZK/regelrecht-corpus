  - number: 22.1a
    text: |-
      Het bevoegd gezag draagt ervoor zorg dat vergunningen, verleend krachtens [artikel 8.1][ref1] van de Wet
      milieubeheer voor inrichtingen waartoe gpbv-installaties behoren, voor zover die niet in overeenstemming zijn
      met de regels die voor 31 oktober 2007 ter uitvoering van de EG-richtlijn geïntegreerde preventie en bestrijding
      van verontreiniging bij of krachtens deze wet zijn gesteld, uiterlijk met ingang van die datum daarmee in
      overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel22.1a
    references:
