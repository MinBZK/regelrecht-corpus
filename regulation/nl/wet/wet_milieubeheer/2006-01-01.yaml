  - number: 22.1.3
    text: |-
      [Hoofdstuk 8][ref1] van deze wet is niet van toepassing op inrichtingen waarin van buiten de inrichting afkomstige
      dierlijke meststoffen in de zin van de [Meststoffenwet][ref2] worden bewaard, bewerkt, verwerkt of vernietigd, voor
      zover het een doelmatig beheer van die stoffen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel22.1
