      - id: ref2
        bwb_id: BWBR0004054
  - number: 22.1.4
    text: |-
      [Hoofdstuk 10][ref1] is niet van toepassing op gedragingen, voor zover daaromtrent voorschriften
      gelden, die zijn gesteld bij of krachtens: de [Bestrijdingsmiddelenwet 1962][ref2], de
      [Wet voorkoming verontreiniging door schepen][ref3], de [Diergeneesmiddelenwet][ref4], de [Meststoffenwet][ref5],
      de [Scheepvaartverkeerswet][ref6], de [Destructiewet][ref7], de [Kernenergiewet][ref8], de
      [Wet verontreiniging oppervlaktewateren][ref9], de [Wet verontreiniging zeewater][ref10], behoudens voor zover uit
      de bepalingen van die wetten of van deze wet anders blijkt.


