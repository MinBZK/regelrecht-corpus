        hoofdstuk: '16'
        afdeling: 16.3.2
  - number: 18.12.4
    text: |-
      Het bevoegd gezag gaat niet tot intrekking als bedoeld in het eerste en tweede lid over dan nadat het de betrokkene
      de gelegenheid heeft geboden binnen een daartoe te bepalen termijn zijn handelen alsnog in overeenstemming te
      brengen met de vergunning of ontheffing, onderscheidenlijk de voorschriften of algemene regels, bedoeld in het
      eerste of tweede lid, na te leven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.12
  - number: '18.13'
    text: |-
      In een geval als aangegeven krachtens [artikel 8.35][ref1], geeft het bevoegd gezag geen beschikking tot toepassing
      van bestuursdwang, oplegging van een last onder dwangsom of intrekking van een vergunning dan na overleg met
      Onze Minister, voorzover het uitoefenen van die bevoegdheid verplichtingen betreft, die betrekking hebben op de
      continuïteit of de capaciteit, bedoeld in [artikel 10.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.14.1
    text: |-
      Een belanghebbende kan aan een bestuursorgaan dat bevoegd is tot toepassing van bestuursdwang, oplegging van een
      last onder dwangsom of intrekking van een vergunning of ontheffing, verzoeken een daartoe strekkende beschikking
      te geven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14
  - number: 18.14.2
    text: |-
      Op verzoek van Onze Minister geeft het bevoegd gezag een beschikking tot toepassing van bestuursdwang, oplegging
      van een last onder dwangsom of intrekking van de vergunning, indien in een geval als aangegeven krachtens
      [artikel 8.35][ref1], het bij of krachtens deze wet met betrekking tot de continuïteit of de capaciteit, bedoeld
      in [artikel 10.5, tweede lid][ref2], bepaalde niet wordt nageleefd. Bij het verzoek kan Onze Minister een termijn
      bepalen waarbinnen aan zijn verzoek wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 18.14a.1
    text: |-
      Indien een overeenkomstig [artikel 18.14, eerste lid][ref1], gedaan verzoek betrekking heeft op
      [de artikelen 1.1a][ref2], [10.1][ref3], [10.2][ref4] of 10.54, op [artikel 13 van de Wet bodembescherming][ref5]
      of op het bepaalde bij of krachtens de [Wet milieugevaarlijke stoffen][ref6], geeft het bestuursorgaan waarbij het
      verzoek is ingediend, een beschikking op het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003994#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref5
        bwb_id: BWBR0003994
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0003892
  - number: 18.14a.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: 18.14a.2.a
    text: |-
      een ander bestuursorgaan dat eveneens bevoegd is tot handhaving, schriftelijk heeft verklaard het verzoek in
      behandeling te willen nemen, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: 18.14a.2.b
    text: |-
      het bestuursorgaan waarbij het verzoek tot toepassing van bestuursdwang is ingediend, daarop het verzoek binnen
      twee weken na de datum waarop het is ontvangen, heeft doorgezonden aan dat andere bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: 18.14a.3
    text: 'In een geval als bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: 18.14a.3.a
    text: |-
      deelt het bestuursorgaan waarbij het verzoek is ingediend, onverwijld aan de afzender mede dat zijn verzoek is
      doorgezonden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: 18.14a.3.b
    text: geeft het bestuursorgaan waaraan het verzoek is doorgezonden, een beschikking op het verzoek.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.14a
  - number: '18.15'
    text: |-
      Het bestuursorgaan zendt een afschrift van de beschikking tot toepassing van bestuursdwang, tot oplegging van een
      last onder dwangsom of tot intrekking van zodanige beschikkingen dan wel van de beschikking tot intrekking van een
      vergunning of ontheffing aan:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.15
  - number: 18.15.a
    text: |-
      de inspecteur, in gevallen waarin de beschikking betrekking heeft op een inrichting die behoort tot een krachtens
      [artikel 8.7, eerste lid, onder a][ref1], aangewezen categorie, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 18.15.b
    text: de andere adviseurs.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.15
  - number: 18.16.1
    text: |-
      De beschikking op een overeenkomstig [artikel 18.14, eerste lid][ref1], gedaan verzoek wordt zo spoedig mogelijk
      gegeven, doch uiterlijk:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16.1.a
    text: |-
      indien het verzoek overeenkomstig [artikel 18.14a][ref1] is doorgezonden: zes weken na de datum waarop het verzoek
      is ontvangen door het bestuursorgaan waarbij het verzoek is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16.1.b
    text: 'in andere gevallen: vier weken na de datum waarop het verzoek is ontvangen.'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16
  - number: 18.16.2
    text: |-
      Indien het verzoek wordt ingewilligd, voegt het bestuursorgaan bij de bekendmaking van de beschikking aan de
      verzoeker een afschrift van de beschikking tot toepassing van bestuursdwang, oplegging van een last onder dwangsom
      of intrekking van de vergunning of ontheffing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16
  - number: 18.16a.1
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens de [artikelen 16.5, eerste lid][ref1],
      [16.5, eerste lid][ref2], in verbinding met [artikel 16.5, tweede lid][ref3], [16.12, derde lid][ref4],
      [16.12, derde lid][ref5], in verbinding met [artikel 16.49, tweede lid][ref6], [16.13][ref7],
      [16.13][ref8] in verbinding met [artikel 16.49, tweede lid][ref9], [16.14][ref10], [16.14][ref11] in
      verbinding met [artikel 16.49, tweede lid][ref12], [16.21][ref13], [16.21][ref14] in verbinding met
      [artikel 16.49, tweede lid][ref15], [16.49, eerste lid][ref16], of [16.51, eerste of tweede lid][ref17], of
      van [artikel 18.18][ref18], voorzover het een voorschrift betreft dat is verbonden aan een vergunning krachtens
      [hoofdstuk 16][ref19], kan het bestuur van de emissieautoriteit de overtreder een bestuurlijke boete opleggen.


