  - number: 16.53.1.a
    text: |-
      NO-emissierechten die hij ten behoeve van een kalenderjaar zou mogen gebruiken, in plaats daarvan ten behoeve van
      het daarop volgende kalenderjaar inleveren;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.53
  - number: 16.53.1.b
    text: |-
      NO-emissierechten ten behoeve van een kalenderjaar inleveren, in plaats van ten behoeve van het daarop volgende
      kalenderjaar waarvoor hij de betrokken rechten anders zou mogen gebruiken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.53
  - number: 16.53.2
    text: |-
      Het eerste lid is uitsluitend van toepassing voorzover het aantal NO-emissierechten, bedoeld in het eerste lid,
      onder a of b, het aantal NO-emissierechten, dat overeenkomt met een bij algemene maatregel van bestuur te bepalen
      percentage van het voor de houder, bedoeld in het eerste lid, geldende verkoopplafond, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.53
  - number: 16.54.1
    text: |-
      Indien degene die een inrichting drijft, ter voldoening aan het bepaalde in [artikel 16.51, eerste lid][ref1],
      met betrekking tot een kalenderjaar minder NO-emissierechten heeft ingeleverd dan overeenkomt met de hoeveelheid
      van een emissie van stikstofoxiden, die de inrichting gedurende dat kalenderjaar heeft veroorzaakt, wordt het
      aantal NO-emissierechten dat hij in het daarop volgende kalenderjaar ter voldoening aan dat artikellid dient in te
      leveren, van rechtswege verhoogd met het aantal NO-emissierechten dat hij te weinig had ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.54
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 16.54.2
    text: |-
      Indien de houder van een vergunning krachtens [artikel 16.49, eerste lid][ref1], of
      [artikel 16.5, eerste lid][ref2], in verbinding met [artikel 16.5, tweede lid][ref3], ter voldoening aan het
      bepaalde in [artikel 16.51, tweede lid][ref4], met betrekking tot een kalenderjaar een nadelig saldo van NO-
      emissierechten op zijn rekening, bedoeld in [artikel 16.60, eerste lid][ref5], heeft staan, wordt het aantal NO-
      emissierechten dat hij in het daarop volgende kalenderjaar ter voldoening aan [artikel 16.51, tweede lid][ref6],
      dient in te leveren, van rechtswege verhoogd met het aantal NO-emissierechten dat overeenkomt met het saldotekort.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
