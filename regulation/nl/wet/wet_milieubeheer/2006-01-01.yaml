  - number: 20.1.4
    text: |-
      Het beroep tegen een gewijzigd nationaal toewijzingsbesluit als bedoeld in [artikel 16.31, eerste lid][ref1],
      kan uitsluitend worden ingesteld door een belanghebbende die rechtstreeks in zijn belang is getroffen door
      de wijzigingen die ten opzichte van het oorspronkelijke nationale toewijzingsbesluit zijn aangebracht.
      [Artikel 6:13 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


