  - number: '21.7'
    text: |-
      De bevoegdheid van gemeenten en waterschappen tot het maken van verordeningen blijft ten aanzien van het onderwerp
      waarin [hoofdstuk 10][ref1] voorziet, gehandhaafd, voor zover deze verordeningen niet met het bij of krachtens deze
      wet bepaalde in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '10'
  - number: '21.8'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.8
  - number: 22.1.1
    text: |-
      [De hoofdstukken 8][ref1] en [17][ref2] en [titel 12.1][ref3] van deze wet zijn niet van toepassing op inrichtingen
      waarvoor een vergunning is vereist krachtens [artikel 15, onder b, van de Kernenergiewet][ref4], behoudens voor
      zover uit de bepalingen van die wet anders blijkt. Die hoofdstukken en die titel zijn evenmin van toepassing op
      inrichtingen, voor zover daarvoor bij of krachtens andere dan in [de eerste volzin][ref5] genoemde bepalingen van
      die wet vergunning is vereist of algemene voorschriften gelden, behoudens voor zover uit de bij of krachtens die
      wet gestelde bepalingen anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk17
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk17
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel22
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel22.1
