      en wethouders of aan het dagelijks bestuur van een waterschap ter zake van de uitvoering door deze bestuursorganen
      van het bepaalde krachtens [artikel 18.3][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 20.2.2.h
    text: |-
      houdende een verklaring van geen bezwaar als bedoeld in [artikel 18.3e, eerste lid, laatste volzin][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 20.2.2.i
    text: |-
      houdende een vordering als bedoeld in [artikel 18.8a, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 20.2.2.j
    text: |-
      inhoudende een aanmaning als bedoeld in [artikel 18.16m, derde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 20.2.2.k
    text: |-
      inhoudende een dwangbevel als bedoeld in [artikel 18.16n, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 20.2.3
    text: |-
      In afwijking van het tweede lid kan tegen een beschikking als bedoeld in dat lid, onder b, c, d of e, beroep
      worden ingesteld overeenkomstig de bepalingen van dit hoofdstuk door het ten aanzien van de beschikking waarop de
      aanwijzing, de verklaring, onderscheidenlijk het verzoek betrekking heeft, bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
  - number: 20.2.4
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de beroepstermijn
      in een geval als bedoeld in het derde lid aan met ingang van de dag na de dag waarop een
      exemplaar van de beschikking waarop de verklaring of het verzoek betrekking heeft, overeenkomstig
      [artikel 3:44, eerste lid, onder a, van de Algemene wet bestuursrecht][ref2] ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.3.1
    text: |-
      Een besluit als bedoeld in [artikel 20.1, eerste lid][ref1], treedt in werking met ingang van de dag
      na de dag waarop de termijn afloopt voor het indienen van een bezwaarschrift dan wel, indien ingevolge
      [artikel 7:1, eerste lid, onder ][ref2] geen bezwaar kan worden gemaakt, van een beroepschrift. Indien gedurende
      die termijn bij de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State, dan wel, in een geval
      waarin [artikel 20.1, zevende lid][ref3], van toepassing is, de voorzieningenrechter van de rechtbank te 's-
      Gravenhage, een verzoek om voorlopige voorziening is gedaan, treedt het besluit niet in werking voordat op dat
      verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 20.3.2
    text: |-
      Indien het gebruik maken van een besluit als bedoeld in [artikel 20.1, eerste lid][ref1], voordat op een beroep
      is beslist, wegens de daaraan verbonden kosten, dan wel wegens de daardoor veroorzaakte wijziging in feitelijke
      omstandigheden die bij de beslissing op het beroep een rol kunnen spelen, aanmerkelijke invloed kan hebben op die
      beslissing, wordt een zodanige voorlopige voorziening getroffen dat die invloed zich niet kan voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: '20.4'
    text: |-
      [Artikel 20.3][ref1] is niet van toepassing op besluiten:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 20.4.a
    text: houdende vergunning of bezwaren krachtens de EEG-verordening overbrenging van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.4
  - number: 20.4.b
    text: |-
      krachtens de artikelen [18.3e, eerste lid, eerste volzin][ref1], [18.7][ref2] en [18.8a, derde lid][ref3], van deze
      wet, de [artikelen 125 van de Gemeentewet][ref4], [122 van de Provinciewet][ref5], [61 van de Waterschapswet][ref6]
      en [5:32 van de Algemene wet bestuursrecht][ref7], voor zover het besluiten betreft die betrekking hebben op de
      handhaving van het bepaalde bij of krachtens de wetten waarop [hoofdstuk 18][ref8] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel125
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel122
      [ref6]: https://wetten.overheid.nl/BWBR0005108#Artikel61
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '125'
      - id: ref5
        bwb_id: BWBR0005645
        artikel: '122'
      - id: ref6
        bwb_id: BWBR0005108
        artikel: '61'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0003245
        hoofdstuk: '18'
  - number: '20.5'
    text: |-
      In gevallen waarin het onverwijld in werking treden van een besluit als bedoeld in
      [artikel 20.1, eerste lid][ref1], naar het oordeel van het bevoegd gezag noodzakelijk is, kan het in afwijking van
      [artikel 20.3, eerste lid][ref2], in het besluit bepalen dat het terstond in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 20.5a.1
    text: |-
      In afwijking van [artikel 36, eerste lid, van de Wet op de Raad van State][ref1] worden bij de Afdeling aanhangige
      zaken over een nationaal toewijzingsbesluit als bedoeld in artikel 16.29, eerste lid, die op dezelfde planperiode
      betrekking hebben, ter behandeling gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel36
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: '36'
  - number: 20.5a.2
    text: |-
      Alvorens te beslissen op een beroep tegen een nationaal toewijzingsbesluit als bedoeld in artikel 16.29, eerste
      lid, doet de Afdeling, in gevallen waarin het beroep naar haar oordeel gegrond is, binnen achttien weken na afloop
      van de beroepstermijn en na sluiting van het onderzoek een tussenuitspraak, waarbij zij Onze Minister en Onze
      Minister van Economische Zaken in de gelegenheid stelt de gebreken in het besluit te herstellen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5a
  - number: 20.5a.3
    text: |-
      In haar tussenuitspraak, bedoeld in het tweede lid, stelt de Afdeling vast in welke opzichten het beroep gegrond
      is. [Afdeling 8.2.6][ref1], met uitzondering van [artikel 8:72, eerste lid, van de Algemene wet bestuursrecht][ref2]
      is van overeenkomstige toepassing. In haar tussenuitspraak bepaalt de Afdeling dat het onderzoek wordt geschorst
      en ter voorbereiding van de einduitspraak wordt heropend nadat van het overeenkomstig artikel 16.31, eerste lid,
      genomen besluit aan haar mededeling is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20.5a.4
    text: |-
      De Afdeling voegt bij haar aanhangig gemaakte zaken met betrekking tot een naar aanleiding van haar tussenuitspraak
      gewijzigd nationaal toewijzingsbesluit als bedoeld in artikel 16.31, eerste lid, ter behandeling met zaken over het
      oorspronkelijke nationale toewijzingsbesluit die reeds bij haar aanhangig zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5a
  - number: 20.5a.5
    text: |-
      Voor de toepassing van [titel II, paragraaf 1, van de Wet op de Raad van State][ref1] wordt de tussenuitspraak
      geacht deel uit te maken van de einduitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.5a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        paragraaf: '1'
  - number: 20.6.1
    text: |-
      Deze paragraaf is van toepassing op het beroep tegen besluiten als bedoeld in [artikel 20.1, eerste lid][ref1], op
      de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 20.6.2
    text: |-
      [Artikel 20.5][ref1] is niet van toepassing op een besluit als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: '20.8'
    text: |-
      In afwijking van [artikel 20.3, eerste lid, eerste volzin][ref1], treedt een besluit als bedoeld in
      [artikel 20.6, eerste lid][ref2], in gevallen als bedoeld in [artikel 8.5, tweede lid][ref3], - waarin de
      vergunning betrekking heeft op het oprichten of veranderen van een inrichting, dat tevens is aan te merken als
      bouwen in de zin van de [Woningwet][ref4] - niet eerder in werking dan nadat de betrokken bouwvergunning is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0005181
  - number: '20.9'
    text: |-
      Indien in een geval als bedoeld in [artikel 8.28][ref1] ingevolge [dit hoofdstuk][ref2] beroep is
      ingesteld tegen een beschikking op de aanvraag om verlening of wijziging van een vergunning krachtens
      [artikel 7 van de Wet verontreiniging oppervlaktewateren][ref3] en krachtens [artikel 8.1][ref4] of
      [artikel 8.24][ref5] van deze wet een daarmee samenhangende beschikking is gegeven, kan de uitspraak in beroep ook
      op de laatstbedoelde beschikking betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '20'
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.2
  - number: 20.14.1
    text: |-
      Onze Minister is gemachtigd namens de Staat tot oprichting over te gaan van een stichting die tot doel heeft de
      taak te verrichten bedoeld in [artikel 20.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.3'
  - number: 20.14.2
    text: |-
      Wijziging van de statuten van de stichting, dan wel ontbinding van de stichting behoeft de toestemming van Onze
      Minister. Alvorens te beslissen over de toestemming, hoort Onze Minister de Afdeling bestuursrechtspraak van de
      Raad van State.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.14
  - number: 20.14.3
    text: De statuten van de stichting waarborgen dat de stichting haar werkzaamheden onpartijdig en onafhankelijk verricht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.14
  - number: '20.15'
    text: |-
      De stichting heeft tot taak aan de administratieve rechter op diens verzoek deskundigenbericht uit te brengen
      inzake beroepen op grond van [artikel 20.1][ref1] van deze wet. Op verzoek van de administratieve rechter brengt
      de stichting tevens deskundigenbericht uit inzake beroepen op grond van andere wetten, voor zover het onderwerpen
      betreft die samenhangen met aspecten van het milieubeheer waarvoor Onze Minister verantwoordelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: '20.16'
    text: |-
      De personen die deel uitmaken van de organen van de stichting, en het personeel van de stichting vervullen geen
      functies en betrekkingen, waarvan de uitoefening ongewenst is met het oog op de handhaving van de onpartijdigheid
      en onafhankelijkheid van de stichting dan wel van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.16
  - number: 20.17.1
    text: |-
      Indien met toepassing van [artikel 20.14][ref1] een stichting is opgericht, verstrekt Onze Minister aan de
      stichting subsidie overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen voorschriften, voor
      zover dat redelijkerwijs noodzakelijk is voor een goede taakuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.3'
  - number: 20.17.2
    text: |-
      [Artikel 8:36, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 21.1.1
    text: |-
      Burgemeester en wethouders, gedeputeerde staten en ieder Onzer betrokken Ministers doen jaarlijks verslag aan
      onderscheidenlijk de gemeenteraad, provinciale staten en de Staten-Generaal over hun beleid met betrekking tot
      de uitvoering van [de hoofdstukken 8][ref1], [13][ref2] en [18][ref3] en [paragraaf 14.1][ref4] van deze wet.
      Burgemeester en wethouders en gedeputeerde staten zenden het verslag gelijktijdig met de aanbieding aan de
      gemeenteraad, onderscheidenlijk provinciale staten, aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk18
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '18'
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 21.1.2
    text: 'Zij vermelden in hun verslag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.1
  - number: 21.1.2.a
    text: |-
      het aantal malen dat in de periode waarop het verslag betrekking heeft, de termijnen zijn overschreden, die
      ingevolge [artikel 3:18 van de Algemene wet bestuursrecht][ref1] alsmede [artikel 13.7][ref2] gelden voor het
      geven van de beschikking, de oorzaken daarvan en de maatregelen die zij hebben getroffen of zullen treffen om het
      overschrijden van die termijnen zo veel mogelijk te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 21.1.2.b
    text: |-
      afzonderlijk de wijze waarop zij de in het eerste lid genoemde hoofdstukken van deze wet hebben uitgevoerd ten
      aanzien van inrichtingen die geheel of gedeeltelijk gedreven worden door onderscheidenlijk de betrokken gemeente,
      de betrokken provincie of het rijk.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.1
  - number: 21.1.3
    text: |-
      Gevallen ten aanzien waarvan [artikel 13.10][ref1] is toegepast, worden in het verslag van Onze Minister niet
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 21.2.1
    text: |-
      Onze Minister zendt - voor zover het betreft het ambtsterrein van één of meer Onzer andere Ministers, in
      overeenstemming met die Ministers - binnen drie jaar na het in werking treden van deze wet, en vervolgens telkens
      om de vijf jaar, aan de Staten-Generaal een verslag over de wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.2
  - number: 21.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de toepassing van
      het eerste lid. Deze regelen kunnen voor daarbij aangewezen bestuursorganen de verplichting inhouden jaarlijks op
      de daarbij aangegeven wijze de gegevens te verstrekken, die voor de opstelling van het in het eerste lid bedoelde
      verslag nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.2
  - number: 21.2a
    text: |-
      Een bestuursorgaan verstrekt Onze Minister de gegevens die hij nodig heeft ter uitvoering van de in artikel 16
      van de EG-richtlijn inzake geïntegreerde preventie en bestrijding van verontreiniging opgelegde verplichting tot
      informatieverstrekking. Bij ministeriële regeling kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.2a
  - number: 21.3.1
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.3
  - number: 21.3.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 21.3.3
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.3
  - number: '21.5'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een gemeente of provincie,
      worden, voor zover nodig, bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die
      de in deze wet vervatte bevoegdheden uitoefenen en ten aanzien van de bestuursorganen die bij die uitvoering dienen
      te worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.5
  - number: 21.6.1
    text: |-
      Bij de vaststelling, wijziging of intrekking van een algemene maatregel van bestuur krachtens deze wet wordt
      rekening gehouden met het geldende nationale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.6
  - number: 21.6.2
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 5.1, eerste lid][ref1],
      [5.3, vijfde lid][ref2], of [18.3][ref3] wordt Ons gedaan door Onze Minister en, voor zover het onderdelen van
      het milieubeleid betreft die tot hun verantwoordelijkheid behoren, Onze Ministers van Verkeer en Waterstaat en
      van Landbouw, Natuur en Voedselkwaliteit en, voorzover het de strafrechtelijke handhaving betreft van het bepaalde
      bij of krachtens deze wet of de andere in [artikel 18.1a, eerste lid][ref4], bedoelde wetten, Onze Minister van
      Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
