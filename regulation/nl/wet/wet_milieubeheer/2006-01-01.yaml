regulatory_layer: WET
publication_date: '2026-01-19'
valid_from: '2006-01-01'
bwb_id: BWBR0003245
url: https://wetten.overheid.nl/BWBR0003245/2006-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz. Allen, die
    deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, naast de wettelijke regelingen, geldende voor de
    onderscheidene onderdelen van het gebied van de milieuhygiëne, regelen te stellen met betrekking tot een aantal
    algemene onderwerpen op dat gebied;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: adviseurs: bestuursorganen die krachtens
      wettelijk voorschrift in de gelegenheid moeten worden gesteld advies uit te brengen met betrekking tot het
      geven van een beschikking of het nemen van een ander besluit; afvalbeheersplan: het afvalbeheersplan, bedoeld
      in [artikel 10.3][ref1]; afvalstoffen: alle stoffen, preparaten of andere producten die behoren tot de
      categorieën die zijn genoemd in bijlage I bij [richtlijn nr. 75/442/EEG](31975L0442) van de Raad van de Europese
      Gemeenschappen van 15 juli 1975 betreffende afvalstoffen, waarvan de houder zich ontdoet, voornemens is zich
      te ontdoen of zich moet ontdoen; afvalstoffenverordening: de verordening, bedoeld in [artikel 10.23][ref2];
      afvalwater: alle water waarvan de houder zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen;
      bedrijfsafvalstoffen: afvalstoffen, niet zijnde huishoudelijke afvalstoffen of gevaarlijke afvalstoffen;
      bedrijfsafvalwater: 'afvalwater, niet zijnde huishoudelijk afvalwater; beheer van afvalstoffen: inzameling,'
      vervoer, nuttige toepassing of verwijdering van afvalstoffen; beste beschikbare technieken: voor het bereiken
      van een hoog niveau van bescherming van het milieu meest doeltreffende technieken om de emissies en andere
      nadelige gevolgen voor het milieu, die een inrichting kan veroorzaken, te voorkomen of, indien dat niet mogelijk
      is, zoveel mogelijk te beperken, die – kosten en baten in aanmerking genomen – economisch en technisch haalbaar
      in de bedrijfstak waartoe de inrichting behoort, kunnen worden toegepast, en die voor degene die de inrichting
      drijft, redelijkerwijs in Nederland of daarbuiten te verkrijgen zijn; daarbij wordt onder technieken mede
      begrepen het ontwerp van de inrichting, de wijze waarop zij wordt gebouwd en onderhouden, alsmede de wijze van
      bedrijfsvoering en de wijze waarop de inrichting buiten gebruik wordt gesteld; betrokken bestuursorganen: adviseurs
      en andere bestuursorganen die krachtens wettelijk voorschrift worden betrokken bij de totstandkoming van de in
      [artikel 13.1, eerste lid][ref3], bedoelde beschikkingen. bevoegd gezag: bestuursorgaan dat bevoegd is tot het
      geven van een beschikking of het nemen van een ander besluit; biochemisch zuurstofverbruik: massaconcentratie
      aan opgeloste zuurstof die gedurende vijf dagen wordt verbruikt door biochemische oxydatie van organische
      bestanddelen onder uitsluiting van ammoniumoxydatie onder omstandigheden die zijn gespecificeerd in een door Onze
      Minister aangewezen norm van het Nederlands Normalisatie Instituut; broeikasgas: gas, genoemd in bijlage II bij
      de EG-richtlijn handel in broeikasgasemissierechten; broeikasgasemissierecht: overeenkomstig het bepaalde bij
      en krachtens [hoofdstuk 16][ref4] overdraagbaar recht, uitsluitend teneinde aan het bepaalde bij en krachtens
      dat hoofdstuk te voldoen, om gedurende een bepaalde periode een emissie van één ton kooldioxide-equivalent
      in de lucht te veroorzaken; Commissie genetische modificatie: de Commissie genetische modificatie, bedoeld in
      [artikel 2.26][ref5]; Commissie voor de milieu-effectrapportage: de Commissie voor de milieu-effectrapportage,
      bedoeld in [artikel 2.17][ref6]; doelmatig beheer van afvalstoffen: zodanig beheer van afvalstoffen dat
      daarbij rekening wordt gehouden met het geldende afvalbeheersplan, dan wel de voor de vaststelling van het plan
      geldende bepalingen, dan wel de voorkeursvolgorde aangegeven in [artikel 10.4][ref7], en de criteria, genoemd in
      [artikel 10.5, eerste lid][ref8]; EEG-richtlijn milieu-effectbeoordeling: [richtlijn nr. 85/337/EEG](31985L0337)
      van de Raad van de Europese Gemeenschappen van 27 juni 1985 betreffende de milieu-effectbeoordeling van bepaalde
      openbare en particuliere projecten (PbEG L 175), zoals gewijzigd bij [richtlijn nr. 97/11/EG](31997L0011) van
      de Raad van de Europese gemeenschappen van 3 maart 1997 (PbEG L 73) tot wijziging van [richtlijn 85/337/EEG]
      (31985L0337) betreffende de milieu-effectbeoordeling van bepaalde openbare en particuliere projecten; de EEG-
      verordening overbrenging van afvalstoffen: de [verordening (EEG) nr. 259/93](31993R0259) van de Raad van de
      Europese Gemeenschappen van 1 februari 1993 betreffende toezicht en controle op de overbrenging van afvalstoffen
      binnen, naar en uit de Europese Gemeenschap (*PbEG* L 30); één ton kooldioxide-equivalent: een metrische ton
      kooldioxide of een hoeveelheid van een ander broeikasgas met een gelijkwaardig aardopwarmingsvermogen; de EG-
      kaderrichtlijn luchtkwaliteit: de [richtlijn (EG) nr. 96/62](31996L0062) van de Raad van de Europese Unie van 27
      september 1996 inzake de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), naar de tekst zoals deze
      bij die richtlijn is vastgesteld; de EG-richtlijn handel in broeikasgasemissierechten: [richtlijn nr. 2003/87/EG]
      (32003L0087) van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot vaststelling van
      een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van [Richtlijn
      96/61/EG](31996L0061) van de Raad (PbEU L 275); EG-richtlijn inzake geïntegreerde preventie en bestrijding van
      verontreiniging: [richtlijn (EG) nr. 96/61](31996L0061) van de Raad van de Europese Unie van 24 september 1996
      inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257), naar de tekst zoals deze bij
      die richtlijn is vastgesteld; de EG-verordening registratie van handel in broeikasgasemissierechten: verordening
      inzake een gestandaardiseerd en beveiligd stelsel van registers als bedoeld in artikel 19, derde lid, van de
      EG-richtlijn handel in broeikasgasemissierechten, nadat deze verordening door de Commissie van de Europese
      Gemeenschappen is vastgesteld en in werking is getreden; emissie: stoffen, trillingen, warmte, die of geluid dat
      direct of indirect vanuit een bron in de lucht, het water of de bodem worden, onderscheidenlijk wordt gebracht;
      de emissieautoriteit: de Nederlandse emissieautoriteit, genoemd in [artikel 2.1][ref9]; emissiegrenswaarde: massa
      gerelateerd aan bepaalde parameters, dan wel concentratie of niveau van een emissie uit een of meer bronnen, die
      gedurende een bepaalde periode niet mag worden overschreden; gemeentelijk milieubeleidsplan: het gemeentelijke
      milieubeleidsplan, bedoeld in [artikel 4.16][ref10]; gevaarlijke afvalstoffen: bij ministeriële regeling als
      zodanig aangewezen afvalstoffen, met inachtneming van ter zake voor Nederland verbindende verdragen en van
      besluiten van volkenrechtelijke organisaties; gpbv-installatie: installatie als bedoeld in bijlage 1 van de EG-
      richtlijn geïntegreerde preventie en bestrijding van verontreiniging;. huishoudelijke afvalstoffen: afvalstoffen
      afkomstig uit particuliere huishoudens, behoudens voor zover het ingezamelde bestanddelen van die afvalstoffen
      betreft, die zijn aangewezen als gevaarlijke afvalstoffen; huishoudelijk afvalwater: afvalwater afkomstig uit
      particuliere huishoudens; inrichting: elke door de mens bedrijfsmatig of in een omvang alsof zij bedrijfsmatig was,
      ondernomen bedrijvigheid die binnen een zekere begrenzing pleegt te worden verricht; inspecteur: als zodanig bij
      besluit van Onze Minister aangewezen ambtenaar; inwonerequivalent: biochemisch zuurstofverbruik van 54 gram per
      etmaal; de kaderrichtlijn water: [richtlijn nr. 2000/60/EG](32000L0060) van het Europees Parlement en de Raad van
      de Europese Unie van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het
      waterbeleid (PbEG L 327), zoals deze is gewijzigd bij beschikking nr. 2455/2001/EG van het Europees Parlement en de
      Raad van 20 november 2001 tot vaststelling van de lijst van prioritaire stoffen op het gebied van het waterbeleid
      en tot wijziging van [richtlijn 2000/60/EG](32000L0060) (PbEG L 331) en met inbegrip van wijzigingen uit hoofde
      van artikel 20, eerste lid, van de richtlijn, doch voor het overige naar de tekst zoals deze bij de richtlijn is
      vastgesteld. nationaal milieubeleidsplan: het nationale milieubeleidsplan, bedoeld in [artikel 4.3][ref11]; NO-
      emissierecht: overeenkomstig het bepaalde bij en krachtens [hoofdstuk 16][ref12] overdraagbaar recht, uitsluitend
      teneinde aan het bepaalde bij en krachtens dat hoofdstuk te voldoen, om gedurende een bepaalde periode een emissie
      van één kilogram stikstofoxiden in de lucht te veroorzaken; nuttige toepassing: de handelingen die zijn genoemd in
      bijlage II B bij [richtlijn nr. 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen van 15 juli 1975
      betreffende afvalstoffen; Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
      preparaten: 'preparaten in de zin van de [Wet milieugevaarlijke stoffen][ref13]; provinciaal milieubeleidsplan:'
      het provinciale milieubeleidsplan, bedoeld in [artikel 4.9][ref14]; provinciale milieucommissie: de provinciale
      milieucommissie, bedoeld in [artikel 2.41][ref15]; provinciale milieuverordening: de verordening, bedoeld in
      [artikel 1.2][ref16]; stikstofoxiden (NO): stikstofmonoxide en stikstofdioxide, uitgedrukt als stikstofdioxide;
      stoffen: 'stoffen in de zin van de [Wet milieugevaarlijke stoffen][ref17]; storten: op of in de bodem brengen'
      van afvalstoffen om deze daar te laten; verwijdering: de handelingen die zijn genoemd in bijlage II A bij
      [richtlijn nr. 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen van 15 juli 1975 betreffende
      afvalstoffen; waterkwaliteitsbeheerder: het bestuursorgaan dat bevoegd is tot vergunningverlening ingevolge de
      [Wet verontreiniging oppervlaktewateren][ref18];


