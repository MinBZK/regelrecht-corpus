  - number: 21.6.4
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens
      [artikel 1.1, eerste, derde, zesde, zevende of achtste lid][ref1], [2.2, derde lid][ref2], [5.1, eerste lid][ref3],
