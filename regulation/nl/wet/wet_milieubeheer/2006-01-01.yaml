        bwb_id: BWBR0003245
        hoofdstuk: '12'
  - number: 20.1.1
    text: |-
      Tegen een besluit op grond van deze wet - met uitzondering van een besluit ten aanzien waarvan op grond van deze
      wet een andere beroepsgang is opengesteld - of een van de in het derde lid bedoelde wetten of wettelijke bepalingen
      kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.1
  - number: 20.1.2
    text: |-
      De Afdeling beslist op een beroep als bedoeld in het eerste lid, binnen twaalf maanden na afloop van de
      beroepstermijn. In afwijking van de eerste volzin beslist de Afdeling op een beroep tegen een nationaal
      toewijzingsbesluit als bedoeld in [artikel 16.29, eerste lid][ref1], of een gewijzigd nationaal toewijzingsbesluit
      als bedoeld in [artikel 16.31, eerste lid][ref2], binnen veertig weken na afloop van de termijn voor het indienen
      van een beroepschrift tegen eerstbedoeld besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel20.1
