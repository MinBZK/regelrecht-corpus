  - number: 20.1.3
    text: |-
      De in het eerste lid bedoelde wetten of wettelijke bepalingen zijn: [artikel 40 van de Mijnbouwwet][ref1],
      de [Destructiewet][ref2], uitgezonderd [artikel 18][ref3], de [Kernenergiewet][ref4], de
      [Wet geluidhinder][ref5], de [Grondwaterwet][ref6], de [Wet inzake de luchtverontreiniging][ref7],
      de [Wet verontreiniging oppervlaktewateren][ref8], de [Wet verontreiniging zeewater][ref9],
      de [Wet milieugevaarlijke stoffen][ref10], de [Wet bodembescherming][ref11], de
      [Wet bescherming Antarctica][ref12], de EEG-verordening overbrenging van afvalstoffen en de
      [artikelen 125 van de Gemeentewet][ref13], [122 van de Provinciewet][ref14], [61 van de Waterschapswet][ref15]
      en [5:32 van de Algemene wet bestuursrecht][ref16], voor zover het besluiten betreft die betrekking hebben op de
      handhaving van het bepaalde bij of krachtens de wetten waarop [hoofdstuk 18][ref17] van deze wet van toepassing is.


