  - number: 16.1.2
    text: |-
      Voor de toepassing van [titel 16.2][ref1] en de daarop berustende bepalingen wordt verstaan onder:
      broeikasgasinstallatie: vaste technische eenheid, waarin een of meer activiteiten worden verricht, die een emissie
      van een broeikasgas in de lucht veroorzaken en die behoren tot een categorie die met betrekking tot het betrokken
      broeikasgas bij algemene maatregel van bestuur is aangewezen, alsmede andere activiteiten die met eerstbedoelde
      activiteiten rechtstreeks samenhangen en daarmee technisch in verband staan en die gevolgen kunnen hebben voor de
      emissie van het betrokken broeikasgas in de lucht; kalenderjaar: jaar als bedoeld in artikel 2, onder y, van de EG-
      verordening registratie van handel in broeikasgasemissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 16.1.3
    text: |-
      Voor de toepassing van [titel 16.3][ref1] en de daarop berustende bepalingen wordt onder NO-installatie verstaan:
      vaste technische eenheid die een emissie van stikstofoxiden in de lucht veroorzaakt en die behoort tot een
      categorie die bij algemene maatregel van bestuur is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 16.2.1
    text: Deze titel is van toepassing op inrichtingen waarin zich een of meer broeikasgasinstallaties bevinden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.2
  - number: 16.2.2
    text: Een emissie van een broeikasgas in de lucht wordt uitgedrukt in tonnen kooldioxide-equivalent.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.2
  - number: 16.2.3
    text: |-
      Voor de toepassing van [titel 16.2][ref1] wordt onder brandstofverbruik en grondstofgebruik verstaan het verbruik
      van brandstoffen, onderscheidenlijk het gebruik van grondstoffen, voorzover dat verbruik, onderscheidenlijk
      gebruik, waarschijnlijk tot emissies van een broeikasgas zal leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: '16.3'
    text: |-
      Onder inrichtingen als bedoeld in [artikel 16.2, eerste lid][ref1], worden mede begrepen inrichtingen binnen de
      Nederlandse exclusieve economische zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.1
  - number: '16.4'
    text: |-
      Een wijziging van de EG-richtlijn handel in broeikasgasemissierechten of van een bijlage bij die richtlijn gaat
      voor de toepassing van deze titel gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet
      zijn gegeven, tenzij bij een besluit van Onze Minister, dat in de Staatscourant wordt bekendgemaakt, een ander
      tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.4
  - number: 16.5.1
    text: 'Het is verboden zonder vergunning van het bestuur van de emissieautoriteit:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
  - number: 16.5.1.a
    text: een inrichting in werking te hebben;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
  - number: 16.5.1.b
    text: een inrichting uit te breiden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
  - number: 16.5.1.c
    text: |-
      een inrichting te veranderen of de werking daarvan te veranderen op zodanige wijze dat dit significante gevolgen
      heeft voor de emissie van broeikasgassen in de lucht dan wel voor het monitoringsprotocol dat van de vergunning
      deel uitmaakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
  - number: 16.5.1.d
    text: het voor de betrokken inrichting geldende monitoringsprotocol ingrijpend te veranderen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
  - number: 16.5.2
    text: |-
      Indien voor een inrichting als bedoeld in het eerste lid tevens de in [artikel 16.49, eerste lid][ref1], vervatte
      verboden gelden, hebben de in het eerste lid vervatte verboden tevens betrekking op de emissies van stikstofoxiden
      in de lucht, die de inrichting veroorzaakt, en zijn de in [artikel 16.49, eerste lid][ref2], vervatte verboden niet
      van toepassing. [Titel 16.3][ref3], met uitzondering van [artikel 16.49, eerste lid][ref4], is van overeenkomstige
      toepassing, voorzover het de emissie van stikstofoxiden in de lucht betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
  - number: 16.5.3
    text: |-
      [Artikel 8.4, eerste, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 16.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de
      aanvraag om een vergunning moet geschieden, de gegevens en de bescheiden die door de aanvrager moeten worden
      verstrekt met het oog op de beslissing op de aanvraag, en de wijze waarop die gegevens moeten worden verkregen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.2
    text: |-
      Bij of krachtens de maatregel wordt in ieder geval bepaald dat de aanvrager bij de aanvraag een protocol indient,
      dat voor de inrichting een beschrijving bevat van de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.2.a
    text: de jaarvracht wordt bepaald,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.2.b
    text: het brandstofverbruik en het grondstofgebruik worden bepaald,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.2.c
    text: gegevens die op het bepaalde onder a en b betrekking hebben, worden geregistreerd en bewaard, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.2.d
    text: |-
      aan het bestuur van de emissieautoriteit verslag wordt gedaan van de jaarvracht en de gegevens betreffende het
      brandstofverbruik en het grondstofgebruik.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.3
    text: |-
      Onze Minister kan nadere regels stellen ter uitvoering van het bepaalde krachtens het eerste of tweede lid. Deze
      regels voldoen in elk geval aan de richtsnoeren die de Commissie van de Europese Gemeenschappen heeft vastgesteld
      op grond van artikel 14, eerste lid, van de EG-richtlijn handel in broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
  - number: 16.6.4
    text: |-
      Voor het bepalen van de jaarvracht van een inrichting worden uitsluitend de emissies in aanmerking genomen,
      die worden veroorzaakt door activiteiten die in een broeikasgasinstallatie worden verricht en die krachtens
      [artikel 16.1, tweede lid][ref1], zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
  - number: '16.7'
    text: |-
      Op de voorbereiding van een besluit krachtens artikel 16.5, eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.8.1
    text: |-
      Het bestuur van de emissieautoriteit zendt het monitoringsprotocol dat is ingediend bij de aanvraag om een
      vergunning krachtens [artikel 16.5, eerste lid][ref1], aan het bestuursorgaan dat voor de inrichting waarop de
      aanvraag betrekking heeft, bevoegd is te beschikken op de aanvraag om een vergunning krachtens [artikel 8.1][ref2],
      dan wel, in geval voor de inrichting het in [artikel 40, tweede lid, van de Mijnbouwwet][ref3] vervatte verbod
      geldt, Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '40'
  - number: 16.8.2
    text: |-
      Het bestuur van de emissieautoriteit stelt het in het eerste lid bedoelde bestuursorgaan onderscheidenlijk Onze
      Minister van Economische Zaken gedurende vier weken in de gelegenheid advies aan hem uit te brengen over het in
      het eerste lid bedoelde monitoringsprotocol en de samenhang van het monitoringsprotocol met de vergunning krachtens
      [artikel 8.1][ref1] onderscheidenlijk [artikel 40, tweede lid, van de Mijnbouwwet][ref2], die voor de inrichting
      waarop de aanvraag betrekking heeft, is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '40'
  - number: '16.9'
    text: |-
      Het bestuur van de emissieautoriteit draagt er bij de beslissing op de aanvraag zorg voor dat geen strijd
      ontstaat met regels die met betrekking tot de inrichting gelden, gesteld bij of krachtens dit hoofdstuk of
      [hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '8'
  - number: 16.10.1
    text: |-
      De vergunning wordt geweigerd indien het monitoringsprotocol niet voldoet aan de eisen die daaraan bij of
      krachtens dit hoofdstuk zijn gesteld dan wel indien door verlening anderszins strijd zou ontstaan met regels die
      met betrekking tot de inrichting gelden, gesteld bij of krachtens dit hoofdstuk, of indien het bestuur van de
      emissieautoriteit van oordeel is dat onvoldoende is gewaarborgd dat de houder van de vergunning in staat is het
      monitoringsprotocol naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.10
  - number: 16.10.2
    text: |-
      In een geval als bedoeld in [artikel 16.5, tweede lid][ref1], wordt de vergunning gedeeltelijk geweigerd voorzover
      het de emissies van broeikasgassen, onderscheidenlijk de emissies van stikstofoxiden, betreft, indien een
      vergunning krachtens [artikel 16.5, eerste lid][ref2], onderscheidenlijk [artikel 16.49, eerste lid][ref3], zou
      zijn geweigerd in geval uitsluitend het vereiste van een vergunning krachtens [artikel 16.5, eerste lid][ref4],
      onderscheidenlijk [artikel 16.49, eerste lid][ref5], zou gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
  - number: 16.11.1
    text: |-
      In een vergunning wordt duidelijk aangegeven waarop zij betrekking heeft. De vergunning vermeldt de naam en het
      adres van degene die de inrichting drijft, waarop de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.11
  - number: 16.11.2
    text: |-
      Het monitoringsprotocol maakt in ieder geval deel uit van de vergunning. De overige onderdelen van de aanvraag om
      de vergunning maken deel uit van de vergunning, voorzover dat in de vergunning is aangegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.11
  - number: 16.12.1
    text: |-
      Aan een vergunning worden de voorschriften verbonden, die nodig zijn in het belang van de goede werking van het
      systeem van handel in emissierechten. Deze voorschriften houden voorts in ieder geval de verplichting in dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.a
    text: |-
      gedurende ieder kalenderjaar de jaarvracht, het brandstofverbruik en het grondstofgebruik worden bepaald en
      geregistreerd overeenkomstig het voor de betrokken inrichting geldende monitoringsprotocol;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.b
    text: |-
      met betrekking tot ieder kalenderjaar bij het bestuur van de emissieautoriteit voor 1 april van het
      daarop volgende kalenderjaar een verslag wordt ingediend, waarin voor de inrichting waarvoor krachtens
      [artikel 16.5, eerste lid][ref1], een vergunning is verleend, alsmede voor elke broeikasgasinstallatie die zich in
      de inrichting bevindt, met betrekking tot het kalenderjaar waarop het verslag betrekking heeft, worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.12.1.b.1°
    text: de jaarvracht, het brandstofverbruik en het grondstofgebruik en de wijze waarop deze zijn bepaald en geregistreerd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.b.2°
    text: |-
      de uitbreidingen en de veranderingen van de inrichting en de veranderingen van de werkwijze die hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.b.3°
    text: de veranderingen van het monitoringsprotocol die hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.b.4°
    text: |-
      de gevallen waarin van het monitoringsprotocol is afgeweken, de redenen daarvoor en de wijze waarop het meten en
      registreren van de emissies in die gevallen heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.c
    text: |-
      het emissieverslag vergezeld gaat van een verklaring van een onafhankelijke deskundige, waarin de
      resultaten worden weergegeven van een door hem uitgevoerde beoordeling van het verslag overeenkomstig
      [artikel 16.14, eerste en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.12.1.d
    text: |-
      aan het bestuur van de emissieautoriteit een verandering van de naam of het adres van de houder van de vergunning
      wordt gemeld;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.e
    text: |-
      aan het bestuur van de emissieautoriteit binnen een in het voorschrift aangegeven termijn het voornemen wordt
      gemeld:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.e.1°
    text: de inrichting waarop de vergunning betrekking heeft, te veranderen of de werking daarvan te veranderen of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.1.e.2°
    text: |-
      het voor de betrokken inrichting geldende monitoringsprotocol te veranderen, in gevallen waarin voor deze
      verandering geen vergunning krachtens [artikel 16.5, eerste lid][ref1], is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.12.1.f
    text: |-
      een afwijking van het monitoringsprotocol onverwijld aan de emissieautoriteit wordt gemeld, onder vermelding
      van de reden voor de afwijking en de wijze waarop het meten en registreren van de emissies in dat geval heeft
      plaatsgevonden of plaats zal vinden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.2
    text: |-
      In het voorschrift, bedoeld in het eerste lid, onder e, kan worden bepaald dat de verandering, voordat zij ten
      uitvoer mag worden gebracht, de goedkeuring behoeft van het bestuur van de emissieautoriteit. Indien toepassing is
      gegeven aan de eerste volzin, kan de goedkeuring worden onthouden:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.2.a
    text: in het belang van de goede werking van het systeem van handel in emissierechten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.2.b
    text: |-
      indien de verandering naar het oordeel van het bestuur van de emissieautoriteit noopt tot wijziging van de
      vergunning die krachtens [artikel 16.5, eerste lid][ref1], voor de inrichting is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.12.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen eisen worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.3.a
    text: |-
      een andere persoon dan de houder van een vergunning krachtens [artikel 16.5, eerste lid][ref1], die bij de
      uitvoering van het monitoringsprotocol is betrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.12.3.b
    text: |-
      de bepaling en de registratie van de jaarvracht, het brandstofverbruik en het grondstofgebruik, bedoeld in het
      eerste lid, onder a;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.3.c
    text: het emissieverslag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.12.4
    text: |-
      Eisen die krachtens het derde lid worden gesteld, voldoen in elk geval aan de richtsnoeren die de Commissie van
      de Europese Gemeenschappen heeft vastgesteld op grond van artikel 14, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.12
  - number: 16.13.1
    text: |-
      De houder van de vergunning beziet regelmatig of de in het monitoringsprotocol opgenomen gegevens met betrekking
      tot het bepalen van de jaarvracht, het brandstofverbruik en het grondstofgebruik, het registreren en bewaren van
      de daarop betrekking hebbende gegevens en de verslaglegging aan het bestuur van de emissieautoriteit nog juist en
      volledig zijn, gezien:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.13.1.a
    text: |-
      veranderingen die zijn opgetreden in de voor het bepalen van de jaarvracht, het brandstofverbruik en het
      grondstofgebruik en het registreren van de daarop betrekking hebbende gegevens relevante omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.13.1.b
    text: |-
      de ontwikkelingen op het gebied van de technische mogelijkheden inzake het bepalen van de jaarvracht, het
      brandstofverbruik en het grondstofgebruik en het registreren van de daarop betrekking hebbende gegevens.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.13.2
    text: 'Hij wijzigt het monitoringsprotocol zo spoedig mogelijk, indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.13.2.a
    text: |-
      de veranderingen of ontwikkelingen, bedoeld in het eerste lid, onder a onderscheidenlijk b, daartoe aanleiding
      geven;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.13.2.b
    text: |-
      wijziging van de krachtens [artikel 16.6][ref1] gestelde regels daartoe aanleiding geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.13.2.c
    text: het bestuur van de emissieautoriteit daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.13
  - number: 16.14.1
    text: |-
      Bij de verificatie wordt nagegaan of het emissieverslag voldoet aan de eisen die daaraan bij of krachtens dit
      hoofdstuk zijn gesteld. Indien het emissieverslag niet aan deze eisen voldoet, keurt de verificateur het verslag
      af.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.14
  - number: 16.14.2
    text: |-
      De verificateur mag niet betrokken zijn geweest bij het opstellen, beoordelen of uitvoeren van het
      monitoringsprotocol voor de betrokken inrichting.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.14
  - number: 16.14.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, inhoudende eisen waaraan een
      verificateur en een verificatie moeten voldoen. Deze regels voldoen in elk geval aan de eisen die zijn opgenomen
      in bijlage V bij de EG-richtlijn handel in broeikasgasemissierechten en de richtsnoeren die de Commissie van de
      Europese Gemeenschappen heeft vastgesteld op grond van artikel 14, eerste lid, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.14
  - number: '16.15'
    text: |-
      Het bestuur van de emissieautoriteit zendt van elk bij hem ingediend emissieverslag een exemplaar aan het
      bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8.1][ref1] voor de betrokken inrichting te
      verlenen, dan wel, in geval voor de inrichting het in [artikel 40, tweede lid, van de Mijnbouwwet][ref2] vervatte
      verbod geldt, aan Onze Minister van Economische Zaken. Het verslag gaat vergezeld van de verklaring, bedoeld in
      [artikel 16.12, eerste lid, onder c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.16.1
    text: |-
      Het bestuur van de emissieautoriteit kan uiterlijk op 30 september van het kalenderjaar waarin het emissieverslag
      overeenkomstig [artikel 16.12, eerste lid, onder b][ref1], moet worden ingediend, verklaren dat dit verslag niet
      voldoet aan de eisen die daaraan bij of krachtens dit hoofdstuk zijn gesteld. Het bestuur van de emissieautoriteit
      kan het afgeven van de in de eerste volzin bedoelde verklaring voor ten hoogste drie maanden verdagen. Van de
      verdaging wordt voor het in de eerste volzin genoemde tijdstip schriftelijk mededeling gedaan aan degene die het
      emissieverslag heeft ingediend. De mededeling omvat de reden voor de verdaging.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.16.2
    text: |-
      Het bestuur van de emissieautoriteit kan na het tijdstip, genoemd in het eerste lid, onderscheidenlijk, indien
      toepassing is gegeven aan de tweede volzin van dat lid, na het tijdstip dat met toepassing van die volzin is
      vastgesteld alsnog verklaren dat het emissieverslag niet voldoet aan de eisen die daaraan bij of krachtens dit
      hoofdstuk zijn gesteld, indien:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.16
  - number: 16.16.2.a
    text: |-
      degene die overeenkomstig [artikel 16.12, eerste lid, onder b][ref1], bij het bestuur van de emissieautoriteit een
      emissieverslag heeft ingediend, in dat verslag onjuiste of onvolledige gegevens heeft verstrekt en verstrekking van
      juiste of volledige gegevens zou hebben geleid tot de vaststelling van een andere jaarvracht,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.16.2.b
    text: het betrokken emissieverslag anderszins onjuist was,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.16
  - number: 16.16.3
    text: |-
      De bevoegdheid, bedoeld in het tweede lid, vervalt tien jaren na afloop van het kalenderjaar, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.16
  - number: '16.17'
    text: |-
      Indien degene die een inrichting drijft, waarop de in [artikel 16.5, eerste lid][ref1], gestelde verboden
      betrekking hebben, niet tijdig een emissieverslag bij het bestuur van de emissieautoriteit heeft ingediend, of het
      bestuur van de emissieautoriteit ingevolge [artikel 16.16, eerste of tweede lid][ref2], heeft verklaard dat het
      emissieverslag niet voldoet aan de eisen die daaraan bij of krachtens dit hoofdstuk zijn gesteld, kan het bestuur
      van de emissieautoriteit de betrokken gegevens op basis van een redelijke schatting ambtshalve vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.18.1
    text: |-
      Het bestuur van de emissieautoriteit geeft desgevraagd aan een ieder kosteloos inzage in en verstrekt tegen
      vergoeding van ten hoogste de kosten een exemplaar van een emissieverslag dat bij hem is ingediend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.18
  - number: 16.18.2
    text: |-
      Het bestuur van de emissieautoriteit geeft vooraf kennis van de mogelijkheid tot inzage in en van de
      verkrijgbaarheid van het emissieverslag. De kennisgeving wordt gedaan op zodanige wijze dat het daarmee beoogde
      doel zo goed mogelijk wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.18
  - number: '16.19'
    text: |-
      Een voor een inrichting verleende vergunning geldt voor een ieder die de inrichting drijft. Deze draagt ervoor zorg
      dat de aan de vergunning verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.19
  - number: 16.20.1
    text: |-
      Het bestuur van de emissieautoriteit kan de voorschriften die aan een vergunning zijn verbonden, wijzigen,
      aanvullen of intrekken, dan wel alsnog voorschriften aan een vergunning verbinden, indien dit naar zijn oordeel
      nodig is in het belang van de goede werking van het systeem van handel in emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
  - number: 16.20.2
    text: |-
      Op de voorbereiding van een beschikking krachtens het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. De [artikelen 16.8][ref2] en [16.9][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.20.3
    text: |-
      In een geval als bedoeld in [artikel 16.12, eerste lid, onder d][ref1], wijzigt het bestuur van de
      emissieautoriteit de vergunning overeenkomstig de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.20.4
    text: |-
      Indien het geval, bedoeld in [artikel 16.5, tweede lid][ref1], zich voordoet en voor de betrokken inrichting
      reeds een vergunning krachtens [artikel 16.5, eerste lid][ref2], is verleend voor het in werking hebben van een
      inrichting waarin zich een of meer broeikasgasinstallaties bevinden, vult het bestuur van de emissieautoriteit
      die vergunning aan met voorschriften en bepalingen die betrekking hebben op de emissie van stikstofoxiden
      in de lucht, die de inrichting veroorzaakt, en die noodzakelijk zijn ter uitvoering van [titel 16.3][ref3].
      Met betrekking tot de beslissing terzake en de inhoud van de voorschriften en bepalingen zijn de
      [artikelen 16.5, derde lid, tot en met 16.12][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.20.5
    text: |-
      Indien het geval, bedoeld in [artikel 16.5, tweede lid][ref1], zich voordoet en voor de betrokken inrichting
      reeds een vergunning krachtens [artikel 16.49, eerste lid][ref2], is verleend voor het in werking hebben van
      een inrichting waarin zich een of meer installaties bevinden, die een emissie van stikstofoxiden in de lucht
      veroorzaken, vult het bestuur van de emissieautoriteit die vergunning aan met voorschriften en bepalingen die
      betrekking hebben op de emissie van broeikasgassen in de lucht, die de inrichting veroorzaakt, en die noodzakelijk
      zijn ter uitvoering van [titel 16.2][ref3]. Met betrekking tot de beslissing terzake en de inhoud van de
      voorschriften en bepalingen zijn de [artikelen 16.5, derde lid, tot en met 16.12][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '16'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.20.6
    text: |-
      In geval het vierde of vijfde lid van toepassing is, kan het bestuur van de emissieautoriteit de rechten die de
      vergunninghouder aan de al eerder verleende vergunning ontleende, niet wijzigen anders dan mogelijk zou zijn met
      toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.20
  - number: '16.21'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot inrichtingen waarvoor de in
      [artikel 16.5, eerste lid][ref1], vervatte verboden gelden en die behoren tot een bij onderscheidenlijk krachtens
      de maatregel aangewezen categorie, regels worden gesteld, die nodig zijn in het belang van de goede werking van
      het systeem van handel in emissierechten. Bij onderscheidenlijk krachtens de maatregel kan worden bepaald dat
      bij onderscheidenlijk krachtens de maatregel gestelde regels slechts gelden in daarbij aangegeven categorieën
      van gevallen. [Artikel 8.44, vierde lid, vijfde lid, eerste en tweede volzin, en zesde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: '16.22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot inrichtingen waarvoor de in
      [artikel 16.5, eerste lid][ref1], vervatte verboden gelden en die behoren tot een bij onderscheidenlijk krachtens
      de maatregel aangewezen categorie, regels worden gesteld, inhoudende de verplichting voor het bestuur van de
      emissieautoriteit aan de vergunning voorschriften te verbinden, die nodig zijn in het belang van de goede werking
      van het systeem van handel in emissierechten. Bij onderscheidenlijk krachtens de maatregel kan worden bepaald dat
      bij onderscheidenlijk krachtens de maatregel gestelde regels slechts gelden in daarbij aangegeven categorieën van
      gevallen. [Artikel 8.45, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
  - number: 16.23.1
    text: |-
      Onze Ministers stellen voor emissies van broeikasgassen die een gevolg zijn van activiteiten die zijn genoemd in
      bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten, gezamenlijk een plan vast waarin voornemens zijn
      opgenomen met betrekking tot de toewijzing van broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.23
  - number: 16.23.2
    text: |-
      Nationale toewijzingsplannen gelden voor aansluitende perioden. Deze periode bedraagt voor elk plan vijf jaar, met
      uitzondering van de periode voor het eerste plan, welke drie jaar bedraagt, ingaande 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.23
  - number: '16.24'
    text: |-
      Het nationale toewijzingsplan wordt vastgesteld met inachtneming van artikel 10 van de EG-richtlijn handel in
      broeikasgasemissierechten en van de termijnen, genoemd in artikel 9 van de richtlijn. Het plan wordt vastgesteld
      met gebruikmaking van objectieve en transparante criteria, waaronder de criteria die zijn opgenomen in bijlage III
      bij die richtlijn, en de richtsnoeren die de Commissie van de Europese Gemeenschappen daaromtrent overeenkomstig
      artikel 9, eerste lid, van de richtlijn heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.24
  - number: 16.25.1
    text: 'Het nationale toewijzingsplan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
  - number: 16.25.1.a
    text: |-
      een aanduiding van het totale aantal broeikasgasemissierechten dat Onze Ministers voornemens zijn voor de
      planperiode toe te wijzen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
  - number: 16.25.1.b
    text: een beschrijving van de manier waarop Onze Ministers voornemens zijn broeikasgasemissierechten toe te wijzen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
  - number: 16.25.1.c
    text: |-
      een lijst van alle inrichtingen waarvoor Onze Ministers voornemens zijn op grond van
      [artikel 16.29, eerste lid][ref1], broeikasgasemissierechten toe te wijzen, onder vermelding van het aantal
      broeikasgasemissierechten dat zij voornemens zijn toe te wijzen voor elke afzonderlijke inrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.25.1.d
    text: |-
      een aanduiding van het gedeelte van het totale aantal broeikasgasemissierechten, bedoeld onder a, dat elk
      kalenderjaar op grond van [artikel 16.35, eerste lid][ref1], zal worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.25.2
    text: 'Het nationale toewijzingsplan kan tevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
  - number: 16.25.2.a
    text: |-
      een aanduiding van het gedeelte van het totale aantal broeikasgasemissierechten, bedoeld in het eerste lid, onder
      a, dat beschikbaar wordt gehouden om te kunnen worden toegewezen voor een of meer daarbij aangegeven categorieën
      van inrichtingen waarvoor een vergunning is vereist krachtens [artikel 16.5, eerste lid, onder a of b][ref1],
      indien deze vergunning nog niet is verleend op het moment dat het plan overeenkomstig artikel 9, eerste lid, van de
      EG-richtlijn handel in broeikasgasemissierechten aan de Commissie van de Europese Gemeenschappen is toegezonden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.25.2.b
    text: |-
      een aanduiding van het gedeelte van het totale aantal broeikasgasemissierechten, bedoeld in het eerste lid,
      onder a, dat beschikbaar wordt gehouden om te kunnen worden toegewezen voor inrichtingen waarvoor als gevolg
      van een wijziging van het nationale toewijzingsbesluit overeenkomstig [artikel 16.31, eerste lid][ref1], meer
      broeikasgasemissierechten worden toegewezen dan in het oorspronkelijke nationale toewijzingsbesluit het geval was;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.25.2.c
    text: |-
      indien toepassing is gegeven aan onderdeel a of b en indien Onze Ministers daartoe besluiten: een beschrijving
      van de manier waarop broeikasgasemissierechten worden toegewezen voor inrichtingen waarvoor in de desbetreffende
      planperiode reeds eerder broeikasgasemissierechten zijn toegewezen, voorzover het broeikasgasemissierechten betreft
      die beschikbaar zijn gehouden overeenkomstig onderdeel a of b en die op een in het nationale toewijzingsplan
      aangegeven datum binnen de desbetreffende planperiode niet zijn toegewezen overeenkomstig [artikel 16.32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.25.3
    text: |-
      Op een lijst als bedoeld in het eerste lid, onder c, worden uitsluitend personen vermeld, die een inrichting
      drijven die op die lijst is vermeld, waarin een activiteit wordt verricht, waarvoor een vergunning is vereist
      krachtens [artikel 16.5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.26.1
    text: |-
      Op de voorbereiding van het nationale toewijzingsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. De terinzagelegging van het ontwerp van het besluit geschiedt tevens ter griffie van de provincies. Het
      ontwerp van het plan wordt tevens toegezonden aan de beide kamers der Staten-Generaal. De toezending, bedoeld in
      de derde volzin, geschiedt ten minste vier weken voordat het plan overeenkomstig artikel 9, eerste lid, van de EG-
      richtlijn handel in broeikasgasemissierechten aan de Commissie van de Europese Gemeenschappen wordt toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.26.2
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.26
  - number: 16.26.3
    text: |-
      Onze Ministers stellen het nationale toewijzingsplan vast uiterlijk twaalf weken na de terinzagelegging van het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.26
  - number: 16.26.4
    text: Het vastgestelde nationale toewijzingsplan wordt bekendgemaakt door kennisgeving van het plan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.26
  - number: 16.26.5
    text: |-
      Indien het overeenkomstig het vierde lid bekendgemaakte plan niet behoeft te worden gewijzigd naar aanleiding van
      de beoordeling door de Commissie van de Europese Gemeenschappen van het plan dat overeenkomstig artikel 9, eerste
      lid, van de EG-richtlijn handel in broeikasgasemissierechten aan haar is toegezonden, wordt daarvan mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.26
  - number: '16.27'
    text: |-
      Indien de Commissie van de Europese Gemeenschappen het overeenkomstig artikel 9, eerste lid, van de EG-richtlijn
      handel in broeikasgasemissierechten aan haar toegezonden nationale toewijzingsplan geheel of gedeeltelijk verwerpt,
      stellen Onze Ministers het nationale toewijzingsplan opnieuw vast nadat daarin de door hen voorgestelde en door de
      Commissie aanvaarde wijzigingen zijn aangebracht. [Artikel 16.26, eerste tot en met derde lid][ref1], is niet van
      toepassing. [Artikel 16.26, vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: '16.28'
    text: |-
      Het nationale toewijzingsplan geldt met ingang van de dag na die waarop in de Staatscourant een mededeling is
      gedaan als bedoeld in [artikel 16.26, vijfde lid][ref1], dan wel, indien het plan dient te worden gewijzigd naar
      aanleiding van de beoordeling door de Commissie van de Europese Gemeenschappen, bedoeld in dat lid, de dag waarop
      het overeenkomstig [artikel 16.26, vierde lid][ref2], in verbinding met [artikel 16.27, laatste volzin][ref3], is
      bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.29.1
    text: |-
      Onverminderd [artikel 16.31][ref1] beslissen Onze Ministers voor emissies van broeikasgassen die een gevolg
      zijn van activiteiten die zijn genoemd in bijlage I bij de EG-richtlijn handel in broeikasgasemissierechten, met
      betrekking tot elke planperiode gezamenlijk over de toewijzing van broeikasgasemissierechten. Dat besluit bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.29.1.a
    text: het totale aantal broeikasgasemissierechten dat voor de planperiode wordt toegewezen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
  - number: 16.29.1.b
    text: de toewijzing van die broeikasgasemissierechten voor afzonderlijke inrichtingen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
  - number: 16.29.1.c
    text: |-
      onverminderd onderdeel d: het gedeelte van het totale aantal broeikasgasemissierechten, bedoeld onder a, dat elk
      kalenderjaar overeenkomstig [artikel 16.35, eerste lid][ref1], zal worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.29.1.d
    text: |-
      indien het nationale toewijzingsplan hierin voorziet: het gedeelte van het totale aantal broeikasgasemissierechten,
      bedoeld onder a, dat beschikbaar wordt gehouden om in de planperiode te kunnen worden toegewezen voor inrichtingen
      als bedoeld in [artikel 16.25, tweede lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.29.2
    text: |-
      Bij het nemen van het nationale toewijzingsbesluit nemen Onze Ministers het geldende nationale toewijzingsplan,
      voorzover het betreft de in [artikel 16.25, eerste lid, onder a, b en d][ref1] bedoelde onderdelen, alsmede artikel
      10 van de EG-richtlijn handel in broeikasgasemissierechten in acht, en houden ze rekening met dat plan, voorzover
      het betreft het in [artikel 16.25, eerste lid, onder c][ref2] bedoelde onderdeel. Het nationale toewijzingsbesluit
      wordt genomen met inachtneming van de termijnen, genoemd in artikel 11, eerste en tweede lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.29.3
    text: |-
      [Artikel 16.23, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.30.1
    text: |-
      Op de voorbereiding van het nationale toewijzingsbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. De terinzagelegging van het ontwerp van het besluit geschiedt tevens ter griffie van de provincies.
      Het ontwerp van het besluit wordt tevens toegezonden aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.30.2
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.30
  - number: 16.30.3
    text: |-
      Onze Ministers nemen het nationale toewijzingsbesluit uiterlijk twaalf weken na de terinzagelegging van het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.30
  - number: 16.30.4
    text: |-
      Van het vastgestelde nationale toewijzingsbesluit wordt mededeling gedaan door kennisgeving van het besluit in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.30
  - number: 16.31.1
    text: |-
      Indien de Afdeling bestuursrechtspraak van de Raad van State met toepassing van artikel 20.5a een tussenuitspraak
      heeft gedaan, wijzigen Onze Ministers het nationale toewijzingsbesluit met inachtneming van die uitspraak.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.31
  - number: 16.31.2
    text: |-
      Het besluit tot wijziging van het nationale toewijzingsbesluit waarop de tussenuitspraak, bedoeld in het eerste
      lid, betrekking heeft, wordt genomen binnen tien weken na de dag waarop de tussenuitspraak, bedoeld in artikel
      20.5a, in het openbaar is uitgesproken. [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 16.31.3
    text: |-
      Voor de toepassing van dit hoofdstuk vervangt een met toepassing van het eerste lid gewijzigd nationaal
      toewijzingsbesluit het oorspronkelijke nationale toewijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.31
  - number: 16.32.1
    text: |-
      Dit artikel is van toepassing indien in het nationale toewijzingsplan broeikasgasemissierechten beschikbaar worden
      gehouden voor toewijzing voor inrichtingen als bedoeld in [artikel 16.25, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.32.2
    text: |-
      Onze Ministers beslissen gezamenlijk, op verzoek van degene die een inrichting als bedoeld in het eerste lid
      drijft, over de toewijzing van broeikasgasemissierechten als bedoeld in het eerste lid voor de desbetreffende
      planperiode.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.32.3
    text: |-
      Bij het nemen van een besluit krachtens het tweede lid nemen Onze Ministers het geldende nationale toewijzingsplan,
      voorzover het betreft het in [artikel 16.25, eerste lid, onder b][ref1], bedoelde onderdeel, alsmede het geldende
      nationale toewijzingsbesluit, voorzover het betreft het in [artikel 16.29, eerste lid, onder d][ref2], bedoelde
      onderdeel in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.32.4
    text: |-
      Een verzoek om toewijzing van broeikasgasemissierechten als bedoeld in het eerste lid wordt afgewezen voorzover
      door toewijzing van die rechten het totale aantal broeikasgasemissierechten dat voor de toewijzing aan de in het
      geldende nationale toewijzingsplan aangegeven categorie van inrichtingen als bedoeld in het eerste lid waartoe de
      inrichting behoort, in de betrokken planperiode ten hoogste beschikbaar is, zou worden overschreden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.32.5
    text: 'Een verzoek om toewijzing van broeikasgasemissierechten als bedoeld in het eerste lid kan worden afgewezen indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.32.5.a
    text: |-
      voor 1 juli van het betrokken kalenderjaar voor de inrichting, bedoeld in het eerste lid, geen vergunning krachtens
      [artikel 16.5, eerste lid][ref1], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.32.5.b
    text: |-
      gerede twijfel bestaat of de inrichting, bedoeld in het eerste lid, voor 31 december van het betrokken kalenderjaar
      feitelijk in werking zal zijn gesteld overeenkomstig hetgeen daaromtrent is bepaald in het geldende nationale
      toewijzingsplan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.32.5.c
    text: |-
      niet is voldaan aan de eisen die overeenkomstig [artikel 16.25, eerste lid, onder b][ref1], in het geldende
      nationale toewijzingsplan zijn opgenomen met betrekking tot de toewijzing van broeikasgasemissierechten voor
      inrichtingen als bedoeld in [artikel 16.25, tweede lid, onder a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
  - number: 16.32.5.d
    text: |-
      de verzoeker onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van deze gegevens tot een onjuiste
      beslissing op het verzoek zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.32.6
    text: |-
      De toewijzing van broeikasgasemissierechten heeft uitsluitend betrekking op het resterende gedeelte van de
      planperiode. Broeikasgasemissierechten worden toegewezen vanaf het tijdstip waarop de inrichting in werking is
      gesteld, of naar verwachting in werking zal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.32
  - number: 16.33.1
    text: |-
      Verzoeken om toewijzing van broeikasgasemissierechten als bedoeld in [artikel 16.32, tweede lid][ref1], die na
      1 juli van een kalenderjaar zijn ingediend, worden op 1 juli van het daarop volgende kalenderjaar in behandeling
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.33.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop het verzoek om
      toewijzing van broeikasgasemissierechten, bedoeld in [artikel 16.32, tweede lid][ref1], moet worden gedaan en de
      gegevens die door de verzoeker moeten worden verstrekt met het oog op de beslissing op het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.33.3
    text: |-
      Op de voorbereiding van het besluit, bedoeld in [artikel 16.32, tweede lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 16.33.4
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.33
  - number: 16.33.5
    text: |-
      Onze Ministers nemen het besluit, bedoeld in [artikel 16.32, tweede lid][ref1], uiterlijk twaalf weken na de
      terinzagelegging van het ontwerp, doch in elk geval voor 1 oktober van het kalenderjaar waarin het betrokken
      verzoek in behandeling is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: '16.34'
    text: |-
      In een geval als bedoeld in artikel 16.25, tweede lid, onder c, wijzen Onze Ministers ambtshalve de
      broeikasgasemissierechten die niet zijn toegewezen, voor 1 oktober van het een na laatste kalenderjaar van de
      desbetreffende planperiode toe aan degenen die een inrichting drijven en aan wie in de desbetreffende planperiode
      reeds eerder broeikasgasemissierechten zijn toegewezen. Het besluit omtrent toewijzing wordt genomen overeenkomstig
      de daaromtrent in het geldende nationale toewijzingsplan opgenomen regels.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.34
  - number: 16.35.1
    text: |-
      Het bestuur van de emissieautoriteit verleent elk kalenderjaar binnen een planperiode aan degene die een inrichting
      drijft, voor 1 maart van dat jaar overeenkomstig hetgeen daarover is bepaald in het nationale toewijzingsbesluit
      een gedeelte van de broeikasgasemissierechten die voor de planperiode voor de betrokken inrichting in dat besluit
      zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.35
  - number: 16.35.2
    text: |-
      Onverminderd het eerste lid verleent het bestuur van de emissieautoriteit voor 1 juni van het eerste
      kalenderjaar binnen een planperiode aan degene op wiens naam op een rekening in het register voor
      handel in broeikasgasemissierechten broeikasgasemissierechten stonden ingeschreven die door het bestuur
      van de emissieautoriteit krachtens [artikel 16.38, derde lid][ref1], zijn ingetrokken, een aantal
      broeikasgasemissierechten dat overeenkomt met het aantal ten aanzien van de betrokken persoon ingetrokken
      broeikasgasemissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
  - number: 16.35.3
    text: |-
      Voorzover het geldende nationale toewijzingsbesluit daarin voorziet, verleent het bestuur van de emissieautoriteit
      voor 1 maart van het tweede en volgende kalenderjaar binnen een planperiode voor inrichtingen als bedoeld
      in [artikel 16.25, tweede lid, onder a][ref1], het aantal broeikasgasemissierechten dat met betrekking
      tot het betreffende kalenderjaar voor de betrokken inrichting is toegewezen in het besluit, bedoeld in
      [artikel 16.32, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.35.4
    text: |-
      Voorzover het geldende nationale toewijzingsplan daarin voorziet, verleent het bestuur van de emissieautoriteit,
      indien het geval, bedoeld in [artikel 16.25, tweede lid, onder c][ref1], zich voordoet, voor 1 maart van
      het laatste kalenderjaar in een planperiode voor inrichtingen als bedoeld in dat onderdeel, het aantal
      broeikasgasemissierechten dat voor de betrokken inrichtingen is toegewezen in het besluit, bedoeld in
      [artikel 16.34][ref2], dat op die periode betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.1
        afdeling: 16.2.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.36.1
    text: |-
      Een broeikasgasemissierecht dat krachtens [artikel 16.35][ref1] en overeenkomstig de EG-verordening registratie van
      handel in broeikasgasemissierechten is verleend, is geldig ten behoeve van de planperiode waarin of waarvoor het
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.36.2
    text: |-
      Een broeikasgasemissierecht is geldig met ingang van het tijdstip waarop het krachtens [artikel 16.35][ref1] is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.37.1
    text: |-
      Degene die een inrichting drijft, levert met betrekking tot ieder kalenderjaar voor 1 mei van het daarop volgende
      kalenderjaar ten minste een aantal broeikasgasemissierechten in, dat overeenkomt met de hoeveelheid van de emissie,
      die de inrichting in het eerstbedoelde kalenderjaar heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.37
  - number: 16.37.2
    text: |-
      Ter bepaling van de hoeveelheid van een emissie, bedoeld in het eerste lid, worden de gegevens betreffende de
      emissie in acht genomen, die overeenkomstig de EG-verordening registratie van handel in broeikasgasemissierechten
      in het register voor handel in broeikasgasemissierechten zijn opgenomen of de emissiegegevens die overeenkomstig
      [artikel 16.17][ref1] ambtshalve zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.38.1
    text: |-
      Indien degene die een inrichting drijft overeenkomstig [artikel 16.37, eerste lid][ref1], een
      broeikasgasemissierecht heeft ingeleverd, trekt het bestuur van de emissieautoriteit dat broeikasgasemissierecht
      onverwijld in.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
  - number: 16.38.2
    text: |-
      Degene op wiens naam een rekening in het register voor handel in broeikasgasemissierechten staat, kan bij
      het bestuur van de emissieautoriteit een verzoek indienen om een broeikasgasemissierecht dat op zijn rekening
      staat bijgeschreven, in te trekken. Het bestuur van de emissieautoriteit trekt het broeikasgasemissierecht in
      overeenkomstig het verzoek.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.38
  - number: 16.38.3
    text: |-
      Broeikasgasemissierechten die na afloop van de planperiode waarvoor ze zijn verleend, niet krachtens het eerste lid
      zijn ingetrokken, worden door het bestuur van de emissieautoriteit ingetrokken. De intrekking, bedoeld in de eerste
      volzin, geschiedt voor 1 mei van het eerste kalenderjaar van de daarop volgende planperiode.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.38
  - number: '16.39'
    text: |-
      Indien degene die een inrichting drijft, ter voldoening aan [artikel 16.37, eerste lid][ref1], met betrekking
      tot een kalenderjaar minder broeikasgasemissierechten heeft ingeleverd dan overeenkomt met de hoeveelheid van de
      emissie, die de inrichting gedurende dat kalenderjaar heeft veroorzaakt, wordt het aantal broeikasgasemissierechten
      dat hij in het daarop volgende kalenderjaar ter uitvoering van dat artikel dient in te leveren, van rechtswege
      verhoogd met het aantal broeikasgasemissierechten dat hij te weinig had ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
  - number: 16.40.1
    text: |-
      Een broeikasgasemissierecht dat krachtens [artikel 16.35][ref1] en overeenkomstig de EG-verordening registratie
      van handel in broeikasgasemissierechten is verleend, is vatbaar voor overdracht indien alle bij de overdracht
      betrokken personen op hun naam een rekening hebben in het register voor handel in broeikasgasemissierechten of
      in een register dat door de betrokken lidstaat van de Europese Unie overeenkomstig de EG-verordening registratie
      van handel in broeikasgasemissierechten is ingesteld. De eerste volzin is van overeenkomstige toepassing op
      broeikasgasemissierechten die overeenkomstig de EG-verordening registratie van handel in broeikasgasemissierechten
      in een andere lidstaat van de Europese Unie zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        paragraaf: 16.2.3.2
        afdeling: 16.2.3
  - number: 16.40.2
    text: |-
      Indien degene die voornemens is op of na 1 april van enig kalenderjaar een broeikasgasemissierecht over te
      dragen, een inrichting drijft, kan dat broeikasgasemissierecht niet worden overgedragen zolang de verificateur
      voor die inrichting met betrekking tot het daaraan voorafgaande kalenderjaar geen verklaring als bedoeld in
      [artikel 16.12, eerste lid, onder c][ref1], heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.40
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.40.3
    text: |-
      Bij algemene maatregel van bestuur kunnen broeikasgasemissierechten die zijn ontstaan in andere landen dan de
      lidstaten van de Europese Unie worden aangewezen als broeikasgasemissierechten die kunnen worden overgedragen
      of verkregen door een persoon op wiens naam in het register voor handel in broeikasgasemissierechten of in een
      register dat door de betrokken lidstaat van de Europese Unie overeenkomstig de EG-verordening registratie van
      handel in broeikasgasemissierechten is ingesteld, een rekening staat.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.40
  - number: 16.40.4
    text: |-
      Een broeikasgasemissierecht is ook vatbaar voor andere overgang. Het eerste tot en met derde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.40
  - number: 16.41.1
    text: 'De voor overdracht van een broeikasgasemissierecht vereiste levering geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.41
  - number: 16.41.1.a
    text: |-
      afschrijving van het broeikasgasemissierecht van de rekening die in het register voor handel in
      broeikasgasemissierechten dan wel in een register dat door de betrokken lidstaat van de Europese Unie
      overeenkomstig de EG-verordening registratie van handel in broeikasgasemissierechten is ingesteld, op naam staat
      van de persoon die het broeikasgasemissierecht overdraagt, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.41
  - number: 16.41.1.b
    text: |-
      bijschrijving op een rekening in een register als bedoeld onder a, die op naam staat van de persoon die het
      broeikasgasemissierecht verkrijgt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.41
  - number: 16.41.2
    text: Het eerste lid is van overeenkomstige toepassing op elke overgang anders dan overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.41
  - number: 16.41.3
    text: |-
      Elke overgang anders dan overdracht werkt tegenover derden eerst nadat het bestuur van de emissieautoriteit de
      overgang heeft geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.41
  - number: 16.42.1
    text: |-
      Nietigheid, vernietiging of ontbinding van de overeenkomst die tot de overdracht heeft geleid, heeft, nadat de
      overdracht is voltooid, geen gevolgen voor de geldigheid van de overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.42
  - number: 16.42.2
    text: Elk voorbehoud met betrekking tot de overdracht is uitgewerkt op het moment dat de overdracht tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.42
  - number: 16.42.3
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op een broeikasgasemissierecht geen
      recht van pand worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: 16.42.4
    text: Op een broeikasgasemissierecht kan geen recht van vruchtgebruik worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.42
  - number: 16.42.5
    text: Een broeikasgasemissierecht is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.42
  - number: 16.43.1
    text: |-
      Er is een register inzake de handel in broeikasgasemissierechten, als bedoeld in de EG-verordening registratie
      handel in broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.43
  - number: 16.43.2
    text: 'De emissieautoriteit wordt met betrekking tot het register voor handel in broeikasgasemissierechten aangewezen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.43
  - number: 16.43.2.a
    text: als bevoegd gezag als bedoeld in de EG-verordening registratie handel in broeikasgasemissierechten, en
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.43
  - number: 16.43.2.b
    text: |-
      als beheerder van het register voor handel in broeikasgasemissierechten als bedoeld in de EG-verordening
      registratie handel in broeikasgasemissierechten,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.43
  - number: 16.43.3
    text: |-
      De emissieautoriteit voert de taken die zij heeft als bevoegd gezag voor het register voor handel in
      broeikasgasemissierechten, onderscheidenlijk beheerder van het register voor handel in broeikasgasemissierechten,
      uit in overeenstemming met de EG-verordening registratie handel in broeikasgasemissierechten en draagt er zorg
      voor dat het register voldoet aan de vereisten die daaraan ingevolge de EG-verordening registratie handel in
      broeikasgasemissierechten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.43
  - number: '16.44'
    text: Een ieder kan broeikasgasemissierechten bezitten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.44
  - number: '16.45'
    text: |-
      Onze Minister kan regels stellen ter uitvoering van de EG-verordening registratie handel in
      broeikasgasemissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.45
  - number: 16.46.1
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat betrokkenen wegens het openen van een rekening in het
      register voor handel in broeikasgasemissierechten of voor het onderhoud van een dergelijke rekening vergoedingen
      verschuldigd zijn overeenkomstig de bij die regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.46
  - number: 16.46.2
    text: |-
      Bij een regeling als bedoeld in het eerste lid wordt de hoogte van de in het eerste lid bedoelde vergoeding
      vastgesteld, welke niet hoger is dan noodzakelijk is ter dekking van de ten laste van de emissieautoriteit komende
      kosten van het verrichten van de werkzaamheden waarvoor de vergoeding is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.46
  - number: 16.46.3
    text: |-
      Indien toepassing is gegeven aan het eerste lid, stelt Onze Minister regels vast omtrent de wijze waarop de in dat
      lid bedoelde vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.46
  - number: 16.47.1
    text: Deze titel is van toepassing op inrichtingen waarin zich een of meer NO-installaties bevinden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.47
  - number: 16.47.2
    text: Een emissie van stikstofoxiden in de lucht wordt uitgedrukt in kilogrammen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.47
  - number: 16.47.3
    text: |-
      [Artikel 16.2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.1
  - number: 16.49.1
    text: |-
      Onverminderd [artikel 16.5, tweede lid][ref1], is het verboden zonder vergunning van het bestuur van de
      emissieautoriteit:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.49.1.a
    text: een inrichting in werking te hebben;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: 16.49.1.b
    text: een inrichting uit te breiden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: 16.49.1.c
    text: |-
      een inrichting te veranderen of de werking daarvan te veranderen op zodanige wijze dat dit significante gevolgen
      heeft voor de emissie van stikstofoxiden in de lucht dan wel voor het monitoringsprotocol dat deel uitmaakt van
      de vergunning;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: 16.49.1.d
    text: het voor de betrokken inrichting geldende monitoringsprotocol ingrijpend te veranderen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: 16.49.2
    text: |-
      Het bepaalde bij of krachtens de [artikelen 16.5, derde lid, tot en met 16.22][ref1] is van overeenkomstige
      toepassing, met uitzondering van [artikel 16.6, derde lid, tweede volzin][ref2], [artikel 16.12, vierde lid][ref3],
      en [artikel 16.14, derde lid, tweede volzin][ref4], en met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.49.2.a
    text: |-
      [artikel 16.6, tweede lid][ref1], [artikel 16.12, eerste lid, onder a en b, onder 1°, en derde lid, onder b][ref2],
      en [artikel 16.13, eerste lid][ref3], geen betrekking hebben op het grondstofgebruik;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.49.2.b
    text: |-
      voorzover in de algemene maatregel van bestuur krachtens [artikel 16.50][ref1] het aantal NO-
      emissierechten, bedoeld in dat artikel, is vastgesteld per eenheid product: [artikel 16.6, tweede lid][ref2],
      [artikel 16.12, eerste lid, onder a en b, onder 1°, en derde lid, onder b][ref3], en
      [artikel 16.13, eerste lid][ref4], mede betrekking hebben op de productie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.49.3
    text: |-
      In de vergunning wordt het aantal NO-emissierechten vastgesteld dat in een kalenderjaar per overdracht ten hoogste
      mag worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: 16.49.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop het verkoopplafond
      wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.49
  - number: '16.50'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de bescherming van het milieu dan wel ter uitvoering
      van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie voor een bij de maatregel aangegeven tijdvak regels worden gesteld omtrent het aantal NO-emissierechten
      dat degene die een inrichting drijft, in een kalenderjaar opbouwt per bij de maatregel aangegeven eenheid brandstof
      die in de NO-installatie wordt verbruikt, of, in bij de maatregel aangegeven gevallen, per bij de maatregel
      aangegeven eenheid product dat in de NO-installatie wordt vervaardigd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.50
  - number: 16.51.1
    text: |-
      Degene die een inrichting drijft, levert met betrekking tot ieder kalenderjaar dat ligt binnen een tijdvak
      als bedoeld in [artikel 16.50][ref1], voor 1 mei van het daaropvolgende kalenderjaar ten minste een aantal NO-
      emissierechten in, dat overeenkomt met de hoeveelheid van de emissie van stikstofoxiden, die de inrichting in het
      eerstbedoelde kalenderjaar heeft veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.51
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
  - number: 16.51.2
    text: |-
      Onverminderd het eerste lid heeft de houder van een vergunning krachtens [artikel 16.49, eerste lid][ref1], of
      [artikel 16.5, eerste lid][ref2], in verbinding met [artikel 16.5, tweede lid][ref3], met betrekking tot ieder
      kalenderjaar dat ligt binnen een tijdvak als bedoeld in [artikel 16.50][ref4], op 1 mei van het daarop volgende
      kalenderjaar een saldo van nul of meer NO-emissierechten die betrekking hebben op het eerstbedoelde kalenderjaar op
      zijn rekening, bedoeld in [artikel 16.60, eerste lid][ref5], staan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.51
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.6
  - number: 16.51.3
    text: |-
      Voor de toepassing van het eerste lid worden ter bepaling van de hoeveelheid van de emissie, bedoeld in dat lid, en
      het aantal NO-emissierechten, bedoeld in [artikel 16.50][ref1], de gegevens in acht genomen, die daaromtrent zijn
      opgenomen in het emissieverslag dat de betrokken persoon overeenkomstig [artikel 16.12, eerste lid, onder b][ref2],
      in verbinding met [artikel 16.49, tweede lid][ref3], met betrekking tot dat kalenderjaar heeft ingediend of de
      gegevens die overeenkomstig [artikel 16.17][ref4] in verbinding met [artikel 16.49, tweede lid][ref5], ambtshalve
      zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.51
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
  - number: '16.52'
    text: |-
      Het aantal NO-emissierechten dat degene die een inrichting drijft, ter voldoening aan het bepaalde in
      [artikel 16.51, eerste lid][ref1], ten behoeve van enig kalenderjaar mag inleveren, wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.52
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 16.52.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.52
  - number: 16.52.a.1°
    text: |-
      het aantal NO-emissierechten dat hij met betrekking tot het kalenderjaar heeft opgebouwd op grond van
      [artikel 16.50][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.52
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
  - number: 16.52.a.2°
    text: |-
      het aantal NO-emissierechten dat hij met betrekking tot het kalenderjaar heeft verkregen, indien de overdracht
      overeenkomstig [artikel 16.57][ref1] is geregistreerd,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.52
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.5
  - number: 16.52.a.3°
