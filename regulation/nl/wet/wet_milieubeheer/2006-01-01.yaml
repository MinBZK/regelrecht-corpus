  - number: 21.6.5
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid wordt, nadat hij is vastgesteld, toegezonden aan
      de beide kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte
      van het *Staatsblad* waarin hij is geplaatst. Een krachtens [artikel 5.1, eerste lid][ref1], vastgestelde algemene
      maatregel van bestuur treedt in werking op een tijdstip dat, nadat vier weken na de toezending ervan aan de beide
      kamers der Staten-Generaal zijn verstreken, bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn
      door of namens een der kamers der Staten-Generaal of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat het in de algemene maatregel van bestuur geregelde onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en
      wordt de algemene maatregel van bestuur onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
        hoofdstuk: '5'
  - number: 21.6.6
    text: |-
      Hetgeen ingevolge deze wet bij algemene maatregel van bestuur kan worden geregeld, wordt in afwijking daarvan
      bij ministeriële regeling geregeld, indien de regels uitsluitend strekken ter uitvoering van een voor Nederland
      verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie, tenzij
      voor een juiste uitvoering wijziging van een algemene maatregel van bestuur of de wet noodzakelijk is. Indien
      wijziging van een algemene maatregel van bestuur noodzakelijk is, wordt daarvan, gelijktijdig met de voordracht
      aan Ons, gemotiveerd kennis gegeven aan de beide kamers der Staten-Generaal, onder vermelding van de korte
      inhoud van de voorgenomen algemene maatregel van bestuur. Het ontwerp van een ministeriële regeling als bedoeld
      in de eerste volzin wordt ten minste vier weken voordat de regeling wordt vastgesteld, toegezonden aan de beide
      kamers der Staten-Generaal. Op de vaststelling van een ministeriële regeling zijn het tweede en het derde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.6
  - number: 21.6.7
    text: |-
      Het tweede tot en met vijfde lid en het zesde lid, tweede, derde en vierde volzin, gelden niet voor een algemene
      maatregel van bestuur krachtens [artikel 8.40][ref1], [8.44][ref2] of [8.45][ref3], voorzover deze uitsluitend
      betrekking heeft op inrichtingen als bedoeld in [artikel 8.2, derde lid][ref4]. De voordracht voor een algemene
      maatregel van bestuur wordt Ons in dit geval gedaan door Onze Minister van Economische Zaken. Bij toepassing in
      dit geval van het zesde lid, eerste volzin, wordt de ministeriële regeling vastgesteld door Onze Minister van
      Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel21.6
