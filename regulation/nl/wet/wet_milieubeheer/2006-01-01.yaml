  - number: 10.64.1
    text: |-
      De [artikelen 8.5 tot en met 8.25][ref1] zijn van overeenkomstige toepassing met betrekking tot het
      verlenen, weigeren, wijzigen en intrekken van een ontheffing als bedoeld in [artikel 10.63][ref2], met
      dien verstande dat – behalve ten aanzien van een ontheffing van de in [artikel 10.2, eerste lid][ref3], en
      [artikel 10.54, eerste lid][ref4], gestelde verboden –, voor die toepassing het belang van de bescherming van het
      milieu wordt beperkt tot het belang van een doelmatig beheer van de betrokken categorie van afvalstoffen, dan wel –
      indien het een ontheffing betreft van krachtens de [artikelen 10.15][ref5], [10.17][ref6] en [10.18][ref7] gestelde
      regels – het door dat artikel beoogde belang.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.64
