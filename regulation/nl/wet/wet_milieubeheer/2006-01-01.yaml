        hoofdstuk: '10'
  - number: 10.64.2
    text: |-
      Bij een algemene maatregel van bestuur krachtens de [artikelen 10.15][ref1], [10.17][ref2] en [10.18][ref3]
      kan – in afwijking van het eerste lid – worden bepaald dat in daarbij aangegeven categorieën van gevallen
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.64
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 10.64.3
    text: |-
      In afwijking van het eerste lid is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing op
      een ontheffing als bedoeld in [artikel 10.63, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel10.64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 12.1.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder verslagjaar: kalenderjaar dat voorafgaat aan
      het jaar waarin een milieuverslag moet worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.1
  - number: 12.1.2
    text: |-
      De bij of krachtens deze titel gestelde bepalingen gelden voor bij algemene maatregel van bestuur aangegeven
      categorieën van gevallen waarin inrichtingen ernstige nadelige gevolgen voor het milieu kunnen veroorzaken. Bij
      de maatregel kan worden bepaald dat daarbij aangegeven regels slechts gelden in daarbij aangegeven categorieën van
      gevallen. De maatregel heeft uitsluitend betrekking op inrichtingen waarvoor gedeputeerde staten van de provincie
      krachtens [artikel 8.2][ref1] bevoegd zijn te beslissen op een aanvraag om een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 12.4.1
    text: |-
      Degene die de inrichting drijft, stelt jaarlijks ten behoeve van het bestuursorgaan dat bevoegd is een vergunning
      krachtens [artikel 8.1][ref1] voor de betrokken inrichting te verlenen, een milieuverslag op. In de gevallen waarin
      een vergunning vereist is krachtens [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref2] wordt het
      verslag tevens opgesteld ten behoeve van het bestuursorgaan dat tot verlening van die vergunning bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
  - number: 12.4.2
    text: |-
      Het verslag wordt opgesteld overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels. Het
      bevat de bij of krachtens die maatregel aan te wijzen gegevens omtrent:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.2.a
    text: de nadelige gevolgen voor het milieu, die de inrichting in het verslagjaar heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.2.b
    text: |-
      de technische, organisatorische en administratieve maatregelen en voorzieningen die in het verslagjaar met
      betrekking tot de inrichting zijn getroffen in het belang van de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.2.c
    text: |-
      de redelijkerwijs te verwachten ontwikkelingen met betrekking tot de onder *a* en *b* genoemde onderwerpen in het
      eerstvolgende verslagjaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.3
    text: |-
      Bij of krachtens de maatregel kunnen regels worden gesteld met betrekking tot de wijze waarop de gegevens, bedoeld
      in het tweede lid, moeten worden verkregen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.4
    text: |-
      Als gegevens als bedoeld in het tweede lid, tweede volzin, worden slechts aangewezen gegevens die redelijkerwijs
      nodig zijn voor:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.4.a
    text: |-
      de vervulling door de bestuursorganen, bedoeld in het eerste lid, van de in [artikel 18.2][ref1] van de Wet
      milieubeheer, onderscheidenlijk [artikel 29 van de Wet verontreiniging oppervlaktewateren][ref2] bedoelde taak,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel24
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '24'
  - number: 12.4.4.b
    text: |-
      de vaststelling van het door die bestuursorganen of andere bestuursorganen te voeren milieubeleid en de controle op
      de voortgang van de uitvoering van dat beleid, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.4.c
    text: |-
      de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.4.5
    text: |-
      Bij of krachtens een maatregel als bedoeld in het tweede lid, kan worden bepaald in hoeverre een bestuursorgaan als
      bedoeld in het eerste lid, bij het aanbrengen van beperkingen of het verbinden van voorschriften aan een vergunning
      met betrekking tot daarbij aangegeven onderwerpen van bij of krachtens de maatregel gestelde regels kan afwijken of
      nadere eisen kan stellen. Daarbij kan worden bepaald dat de bevoegdheid tot afwijken of tot het stellen van nadere
      eisen slechts geldt in bij of krachtens de maatregel aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.4
  - number: 12.5.1
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 12.4, tweede lid][ref1], wordt bepaald
      in hoeverre een bestuursorgaan als bedoeld in [artikel 12.4, eerste lid][ref2], voorschriften aan de vergunning kan
      verbinden, die de verplichting inhouden hem gegevens ter beschikking te stellen, die niet krachtens artikel 12.4 in
      een milieuverslag dat ten behoeve van dat bestuursorgaan wordt opgesteld, behoeven te worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.5.2
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 12.4, tweede lid][ref1], kunnen regels
      worden gesteld met betrekking tot hetgeen regeling behoeft in verband met het gaan gelden van de bij of krachtens
      die maatregel gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.6.1
    text: Een milieuverslag wordt in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.6
  - number: 12.6.2
    text: |-
      Het eerste lid geldt niet voor een milieuverslag als bedoeld in [artikel 12.4][ref1] dat ten behoeve van een
      bestuursorgaan wordt opgesteld, indien overeenkomstig [afdeling 2.2 van de Algemene wet bestuursrecht][ref2]
      de Friese taal gebruikt wordt. Indien het milieuverslag in de Friese taal is gesteld, verstrekt degene die de
      inrichting drijft, daarvan op verzoek een vertaling in de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling2.2
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '2.2'
  - number: 12.7.1
    text: |-
      Zo spoedig mogelijk, maar niet later dan zes maanden na afloop van het verslagjaar geeft degene die de inrichting
      drijft, desgevraagd aan een ieder kosteloos inzage in en verstrekt hij tegen vergoeding van ten hoogste de kosten
      een exemplaar van een milieuverslag dat hij ingevolge [artikel 12.4][ref1] moet opstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.7.2
    text: |-
      Degene die de inrichting drijft geeft vooraf kennis van de mogelijkheid tot inzage en de verkrijgbaarheid van
      het verslag. De kennisgeving wordt gedaan op zodanige wijze dat het daarmee beoogde doel zo goed mogelijk wordt
      bereikt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.7
  - number: 12.7.3
    text: |-
      Een ieder kan van degene die de inrichting drijft, bij de burgerlijke rechter nakoming vorderen van de in dit
      artikel omschreven verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.7
  - number: 12.8.1
    text: |-
      Zo spoedig mogelijk na het opstellen van een milieuverslag ten behoeve van een bestuursorgaan, bedoeld in
      [artikel 12.4, eerste lid, eerste volzin][ref1], maar niet later dan drie maanden na afloop van het verslagjaar,
      zendt degene die de inrichting drijft, het milieuverslag elektronisch of indien dat verslag niet elektronisch
      wordt verzonden, twee exemplaren van het door hem over het afgelopen verslagjaar opgestelde milieuverslag aan dat
      bestuursorgaan. In gevallen als bedoeld in [artikel 12.4, eerste lid, tweede volzin][ref2], zendt hij, indien het
      milieuverslag niet elektronisch wordt verzonden, tegelijkertijd tevens twee exemplaren van dat verslag aan het in
      die volzin bedoelde bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.8.2
    text: |-
      Het bestuursorgaan, bedoeld in [artikel 12.4, eerste lid, eerste volzin][ref1], zendt van elk ontvangen verslag
      een exemplaar aan de inspecteur. Het bestuursorgaan, bedoeld in [artikel 12.4, eerste lid, tweede volzin][ref2],
      zendt van elk ontvangen verslag een exemplaar aan het rijksinstituut, bedoeld in
      [artikel 32 van de Wet verontreiniging oppervlaktewateren][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel32
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '32'
  - number: '12.9'
    text: |-
      Indien degene die de inrichting drijft, verplicht is aan een ander bestuursorgaan dan de bestuursorganen, bedoeld
      in [artikel 12.4][ref1], gegevens ter beschikking te stellen, die in de vereiste vorm zijn opgenomen in een
      milieuverslag als bedoeld in [artikel 12.4][ref2] dat ten behoeve van een bestuursorgaan is opgesteld, kan aan deze
      verplichting worden voldaan door dat verslag over te leggen en voor deze gegevens te verwijzen naar het betrokken
      onderdeel van dat verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.11.1
    text: |-
      Onze Minister, Onze Minister van Verkeer en Waterstaat, Onze Minister van Landbouw, Natuur en Voedselkwaliteit,
      provinciale besturen, gemeentebesturen alsmede kwaliteitsbeheerders en kwantiteitsbeheerders als bedoeld in de
      [Wet op de waterhuishouding][ref1], dragen er zorg voor dat overeenkomstig artikel 6 van de kaderrichtlijn water
      één of meer registers worden bijgehouden van de in bijlage IV van de kaderrichtlijn water bedoelde beschermde
      gebieden, voor zover die gebieden onder hun beheer vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.11
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: 12.11.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aangaande de registers. Daarbij kan,
      in afwijking van het eerste lid, worden voorzien in de mogelijkheid dat de registratie van beschermde gebieden
      wordt gedaan door provinciale besturen dan wel Onze in het eerste lid genoemde ministers, mede als het gaat om
      gebieden die in beheer zijn bij andere bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel12.11
  - number: 13.1.1
    text: |-
      Bij de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] op de voorbereiding van beschikkingen
      krachtens de in het tweede lid genoemde wetten, wordt [afdeling 13.2][ref2] in acht genomen, indien dat bij of
      krachtens de betrokken wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 13.1.2
    text: |-
      De in het eerste lid bedoelde wetten zijn: de [Mijnbouwwet][ref1], de [Destructiewet][ref2],
      de [Kernenergiewet][ref3], de [Wet geluidhinder][ref4], de [Grondwaterwet][ref5], de
      [Wet inzake de luchtverontreiniging][ref6], de [Wet verontreiniging oppervlaktewateren][ref7], de
      [Wet verontreiniging zeewater][ref8], de [Wet milieugevaarlijke stoffen][ref9], de [Wet bodembescherming][ref10],
      de [Ontgrondingenwet][ref11], de [Wet bescherming Antarctica][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0002244
      [ref3]: https://wetten.overheid.nl/BWBR0002402
      [ref4]: https://wetten.overheid.nl/BWBR0003227
      [ref5]: https://wetten.overheid.nl/BWBR0003406
      [ref6]: https://wetten.overheid.nl/BWBR0002731
      [ref7]: https://wetten.overheid.nl/BWBR0002682
      [ref8]: https://wetten.overheid.nl/BWBR0002975
      [ref9]: https://wetten.overheid.nl/BWBR0003892
      [ref10]: https://wetten.overheid.nl/BWBR0003994
      [ref11]: https://wetten.overheid.nl/BWBR0002505
      [ref12]: https://wetten.overheid.nl/BWBR0009449
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.1
