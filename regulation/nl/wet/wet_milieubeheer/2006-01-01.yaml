  - number: 22.1.2
    text: |-
      [Hoofdstuk 8][ref1] van deze wet is niet van toepassing op inrichtingen, voor zover daarvoor een
      vergunning is vereist of algemene voorschriften gelden krachtens de [Destructiewet][ref2], de
      [Wet verontreiniging oppervlaktewateren][ref3], de [Grondwaterwet][ref4], behoudens voor zover uit de bepalingen
      van die wetten anders blijkt.


