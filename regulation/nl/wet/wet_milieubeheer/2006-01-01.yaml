      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 21.6.3
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [paragraaf 2.2][ref1], [hoofdstuk 7][ref2]
      of [paragraaf 14.2][ref3], wordt Ons gedaan door Onze Minister en Onze Minister van Landbouw, Natuurbeheer en
      Visserij. De voordracht voor een algemene maatregel van bestuur krachtens [titel 12.1][ref4] wordt Ons gedaan door
      Onze Minister en, voor zover het onderdelen van het milieubeleid betreft die tot hun verantwoordelijkheid behoren,
      Onze Ministers van Verkeer en Waterstaat, van Landbouw, Natuurbeheer en Visserij en van Economische Zaken. Indien
      het een of meer inrichtingen betreft, die onder Onze Minister van Defensie ressorteren, wordt de voordracht voor
      een algemene maatregel van bestuur krachtens [de artikelen 12.1, tweede lid][ref5], [12.4][ref6] en [12.5][ref7]
      Ons mede door hem gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
