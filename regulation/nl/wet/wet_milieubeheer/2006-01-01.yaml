  - number: 16.55.1
    text: |-
      Een NO-emissierecht is geldig ten behoeve van het kalenderjaar waarin het op grond van [artikel 16.50][ref1] is
      opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.55
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
  - number: 16.55.2
    text: |-
      In afwijking van het eerste lid is een NO-emissierecht in een geval als bedoeld in
      [artikel 16.53, eerste lid, onder a of b][ref1], geldig ten behoeve van het kalenderjaar waarin dat emissierecht
      ingevolge [artikel 16.53, eerste lid, onder a onderscheidenlijk b][ref2], mag worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.55
    references:
