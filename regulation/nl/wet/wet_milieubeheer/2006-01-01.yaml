        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 16.56.1
    text: Een NO-emissierecht is met inachtneming van het tweede en derde lid vatbaar voor overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.56.2
    text: 'Een NO-emissierecht kan uitsluitend worden overgedragen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.56.2.a
    text: |-
      tussen houders van een vergunning krachtens [artikel 16.49, eerste lid][ref1], of [artikel 16.5, eerste lid][ref2],
      in verbinding met [artikel 16.5, tweede lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
  - number: 16.56.2.b
    text: |-
      indien het betrekking heeft op een kalenderjaar dat ligt binnen een tijdvak waarvoor op het tijdstip van de
      voorgenomen overdracht toepassing is gegeven aan [artikel 16.50][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.3
  - number: 16.56.2.c
    text: |-
      voorzover het aantal NO-emissierechten dat de houder, bedoeld onder a, voornemens is over te dragen met betrekking
      tot een kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.56.2.c.1°
    text: vermeerderd met het aantal NO-emissierechten dat hij met betrekking tot dat kalenderjaar reeds heeft overgedragen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.56.2.c.2°
    text: verminderd met het aantal NO-emissierechten dat hij met betrekking tot dat kalenderjaar heeft verkregen,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.56.3
    text: |-
      Een NO-emissierecht is ook vatbaar voor andere overgang dan overdracht. Het eerste en tweede lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.56
  - number: 16.57.1
    text: 'De voor overdracht van een NO-emissierecht vereiste levering geschiedt door:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.57
  - number: 16.57.1.a
    text: |-
      afschrijving van het NO-emissierecht van de rekening of de deelrekening, bedoeld in [artikel 16.60][ref1], die in
      het register voor handel in NO-emissierechten op naam staat van de persoon die het NO-emissierecht overdraagt, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.57
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.6
  - number: 16.57.1.b
    text: |-
      bijschrijving op de rekening of de deelrekening, bedoeld in [artikel 16.60][ref1], die in het register voor handel
      in NO-emissierechten op naam staat van de persoon die het NO-emissierecht verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.57
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.6
  - number: 16.57.2
    text: Het eerste lid is van overeenkomstige toepassing op andere overgang dan overdracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.57
  - number: 16.57.3
    text: |-
      De [artikelen 16.41, derde lid][ref1], en [16.42][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.57
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.5
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.5
  - number: 16.58.1
    text: Er is een register inzake de handel in NO-emissierechten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.58
  - number: 16.58.2
    text: Het register wordt beheerd door de emissieautoriteit.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.58
  - number: 16.58.3
    text: |-
      In het register worden voor elke inrichting op de bijbehorende rekening of deelrekening, bedoeld in
      [artikel 16.60][ref1], de gegevens, bedoeld in de [artikelen 16.51, eerste lid][ref2], en [16.52][ref3] opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.58
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.6
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 16.58.4
    text: |-
      Onze Minister kan regels stellen met betrekking tot de werking, de organisatie, de beschikbaarheid en de
      beveiliging van het register voor handel in NO-emissierechten en het openen en bijhouden van rekeningen en
      deelrekeningen, bedoeld in [artikel 16.60][ref1]. Onze Minister kan tevens regels stellen ter uitvoering van het
      tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.58
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.6
  - number: 16.59.1
    text: 'De emissieautoriteit registreert de overdracht of andere overgang van NO-emissierechten indien:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.59
  - number: 16.59.1.a
    text: |-
      wordt voldaan aan het bepaalde in de [artikelen 16.56][ref1] en [16.57][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.59
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.5
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.5
  - number: 16.59.1.b
    text: |-
      bij de overdracht of overgang wordt aangegeven op welk kalenderjaar, bedoeld in
      [artikel 16.56, tweede lid, onder b][ref1], het NO-emissierecht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.59
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.5
  - number: 16.59.2
    text: |-
      De emissieautoriteit registreert de NO-emissierechten die worden ingeleverd op grond van
      [artikel 16.53, eerste lid, onder a of b][ref1], indien wordt voldaan aan het bepaalde bij of krachtens
      [artikel 16.53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.59
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 16.60.1
    text: |-
      Het bestuur van de emissieautoriteit opent voor elke houder van een vergunning krachtens
      [artikel 16.49, eerste lid][ref1], of [artikel 16.5, eerste lid][ref2], in verbinding met
      [artikel 16.5, tweede lid][ref3], voor de inrichting op diens naam een rekening in het register voor handel in
      NO-emissierechten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.60
    references:
      - id: ref1
        bwb_id: BWBR0003245
