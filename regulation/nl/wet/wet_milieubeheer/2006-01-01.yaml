  - number: 18.16a.2
    text: |-
      Het bestuur van de emissieautoriteit legt een bestuurlijke boete op in geval van overtreding van het bepaalde bij
      [artikel 16.37][ref1], eerste lid. [Artikel 18.16b][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16a.3
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens [artikel 16.21][ref1] of van [artikel 18.18][ref2],
      voorzover het een voorschrift betreft dat is verbonden aan een vergunning krachtens [hoofdstuk 16][ref3], kunnen
      een bestuurlijke boete en een last onder dwangsom tezamen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.2
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '16'
  - number: 18.16a.4
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], of
      [artikel 16.51, eerste of tweede lid][ref2], wordt een bestuurlijke boete als bedoeld in het tweede lid,
      onderscheidenlijk kan een bestuurlijke boete als bedoeld in het eerste lid worden opgelegd naast een verhoging
      van het aantal broeikasgasemissierechten onderscheidenlijk NO-emissierechten dat degene die de betrokken
      inrichting drijft, met betrekking tot een kalenderjaar overeenkomstig [artikel 16.39][ref3] onderscheidenlijk
      [artikel 16.54][ref4] dient in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.3.4
  - number: 18.16a.5
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], neemt het bestuur van de
      emissieautoriteit, naast het opleggen van een bestuurlijke boete, de overtreder op in het overzicht, bedoeld in
      [artikel 18.16p, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16b
    text: |-
      Het bestuur van de emissieautoriteit legt geen bestuurlijke boete op voorzover de overtreding niet aan de
      overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16b
  - number: 18.16c
    text: |-
      Het bestuur van de emissieautoriteit legt geen bestuurlijke boete op indien aan de overtreder wegens
      dezelfde gedraging reeds eerder een bestuurlijke boete is opgelegd, dan wel een mededeling als bedoeld in
      [artikel 18.16i, derde lid, onder a][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16d.1
    text: |-
      Het bestuur van de emissieautoriteit legt geen bestuurlijke boete op indien tegen de overtreder wegens dezelfde
      gedraging:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16d.1.a
    text: een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16d.1.b
    text: |-
      het recht tot strafvervolging is vervallen ingevolge [artikel 74][ref1]
      of [74c van het Wetboek van Strafrecht][ref2], dan wel ingevolge
      [artikel 37 van de Wet op de economische delicten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74c
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '37'
  - number: 18.16d.2
    text: |-
      Indien de gedraging tevens een strafbaar feit is en de ernst van de overtreding of de omstandigheden waaronder zij
      is begaan daartoe aanleiding geven, wordt zij aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16d.3
    text: |-
      Voor een gedraging die aan het openbaar ministerie moet worden voorgelegd, kan het bestuur van de emissieautoriteit
      alsnog een bestuurlijke boete opleggen indien:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16d.3.a
    text: het openbaar ministerie heeft medegedeeld van strafvervolging tegen de overtreder af te zien, of
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16d.3.b
    text: |-
      sedert het voorleggen van de gedraging dertien weken zijn verstreken en geen reactie van het openbaar ministerie
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16d
  - number: 18.16e.1
    text: |-
      Een bestuurlijke boete als bedoeld in [artikel 18.16a][ref1], eerste lid, bedraagt ten hoogste € 450 000 per
      overtreding of, indien de omzet van de betrokken onderneming in het boekjaar voorafgaand aan het jaar waarin de
      beschikking tot oplegging van de bestuurlijke boete is gegeven, meer dan € 4 500 000 bedraagt, ten hoogste 10% van
      die omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16e.2
    text: |-
      Het bestuur van de emissieautoriteit stemt de hoogte van de bestuurlijke boete af op de ernst van de overtreding
      en de mate waarin deze aan de overtreder kan worden verweten. Het bestuur van de emissieautoriteit houdt daarbij zo
      nodig rekening met de omstandigheden waaronder de overtreding is gepleegd.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
  - number: 18.16e.3
    text: |-
      In geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1], bedraagt een bestuurlijke boete
      als bedoeld in [artikel 18.16a, tweede lid][ref2], het in artikel 16, derde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten genoemde bedrag per ton emissie van een kooldioxide-equivalent, die de inrichting in
      een kalenderjaar meer heeft veroorzaakt dan overeenkomt met het aantal broeikasgasemissierechten dat degene die
      de betrokken inrichting drijft met betrekking tot dat jaar overeenkomstig [artikel 16.37, eerste lid][ref3], heeft
      ingeleverd. Het tweede lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
  - number: 18.16e.4
    text: |-
      In afwijking van het derde lid bedraagt de bestuurlijke boete, bedoeld in dat lid, met betrekking tot de periode
      van 1 januari 2005 tot en met 31 december 2007 het in artikel 16, vierde lid, van de EG-richtlijn handel in
      broeikasgasemissierechten genoemde bedrag per ton kooldioxide-equivalent.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
  - number: 18.16e.5
    text: |-
      [Artikel 16.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.1
  - number: 18.16e.6
    text: |-
      De berekening van de omzet, bedoeld in het eerste lid, geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16e
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: 18.16f.1
    text: |-
      Degene die aan een handeling van de emissieautoriteit redelijkerwijs de gevolgtrekking kan verbinden dat aan hem
      een bestuurlijke boete zal worden opgelegd, is niet langer verplicht ten behoeve van deze oplegging inlichtingen
      omtrent de overtreding te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16f
  - number: 18.16f.2
    text: |-
      De overtreder wordt op het bepaalde in het eerste lid gewezen alvorens hem mondeling wordt gevraagd inlichtingen te
      verstrekken, en in ieder geval wanneer hij in de gelegenheid wordt gesteld over het voornemen tot oplegging van de
      bestuurlijke boete zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16f
  - number: 18.16g.1
    text: |-
      Indien een overtreding als bedoeld in [artikel 18.16a, eerste of tweede lid][ref1], is gepleegd en het bestuur van
      de emissieautoriteit voornemens is in verband daarmee een bestuurlijke boete op te leggen, maakt het bestuur van de
      emissieautoriteit een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16g.2
    text: 'Het rapport is gedagtekend en vermeldt:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
  - number: 18.16g.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
  - number: 18.16g.2.b
    text: de overtreding alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
  - number: 18.16g.2.c
    text: een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
  - number: 18.16g.2.d
    text: |-
      in geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1]: het voornemen de naam van de
      overtreder op te nemen in het overzicht, bedoeld in [artikel 18.16p, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16g.3
    text: |-
      Een afschrift van het rapport wordt uiterlijk bij de bekendmaking van de beschikking tot oplegging van de
      bestuurlijke boete aan de overtreder toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
  - number: 18.16g.4
    text: |-
      Indien van de overtreding een proces-verbaal als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1]
      is opgemaakt, treedt dit voor de toepassing van dit hoofdstuk in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: 18.16g.5
    text: |-
      Indien de gedraging aan het openbaar ministerie wordt voorgelegd op grond van [artikel 18.16d, tweede lid][ref1],
      wordt een afschrift van het rapport aan het openbaar ministerie toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16g
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16h.1
    text: |-
      Het bestuur van de emissieautoriteit stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop
      het opleggen van de bestuurlijke boete, dan wel het voornemen daartoe, berust, in te zien. Het bestuur van de
      emissieautoriteit stelt op verzoek afschriften daarvan beschikbaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16h
  - number: 18.16h.2
    text: |-
      Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt de emissieautoriteit er zoveel
      mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16h
  - number: 18.16i.1
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het bestuur van de
      emissieautoriteit de overtreder in de gelegenheid om zijn zienswijze naar voren te brengen over het voornemen tot:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 18.16i.1.a
    text: het opleggen van een bestuurlijke boete;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
  - number: 18.16i.1.b
    text: |-
      in geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1]: het opnemen van de naam van de
      overtreder in het overzicht, bedoeld in [artikel 18.16p, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16i.2
    text: |-
      Het rapport, bedoeld in [artikel 18.16g, eerste lid][ref1], wordt reeds bij de uitnodiging, bedoeld in het eerste
      lid, aan de overtreder toegezonden of uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16i.3
    text: |-
      Indien het bestuur van de emissieautoriteit nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist
      dat:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
  - number: 18.16i.3.a
    text: |-
      voor de overtreding geen bestuurlijke boete zal worden opgelegd, of, in geval van overtreding van het bepaalde
      bij [artikel 16.37, eerste lid][ref1], de naam van de overtreder niet wordt opgenomen in het overzicht, bedoeld in
      [artikel 18.16p, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16i.3.b
    text: de overtreding alsnog aan het openbaar ministerie zal worden voorgelegd,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16i
  - number: 18.16j.1
    text: |-
      Het bestuur van de emissieautoriteit beslist binnen dertien weken na de dagtekening van het rapport, bedoeld in
      [artikel 18.16g, eerste lid][ref1], omtrent het opleggen van een bestuurlijke boete en, in geval van overtreding
      van het bepaalde bij [artikel 16.37, eerste lid][ref2], het opnemen van de naam van de overtreder in het overzicht,
      bedoeld in [artikel 18.16p, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16j
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16j.2
    text: |-
      De beslistermijn wordt opgeschort met ingang van de dag waarop de gedraging aan het openbaar ministerie is
      voorgelegd, tot de dag waarop het bestuur van de emissieautoriteit bevoegd wordt een bestuurlijke boete op te
      leggen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16j
  - number: 18.16k
    text: 'De beschikking tot oplegging van de bestuurlijke boete vermeldt:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.b
    text: de overtreding alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.c
    text: een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.d
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.e
    text: de termijn waarbinnen de betaling moet plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
  - number: 18.16k.f
    text: |-
      in geval van overtreding van het bepaalde bij [artikel 16.37, eerste lid][ref1]: het opnemen van de naam van de
      overtreder in het overzicht, bedoeld in [artikel 18.16p, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16k
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16l.1
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete als bedoeld in
      [artikel 18.16a, eerste en tweede lid][ref1], vervalt tien jaren nadat de overtreding heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16l
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16l.2
    text: |-
      Indien tegen de beschikking tot oplegging van de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt
      ingesteld, wordt de vervaltermijn opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16l
  - number: 18.16m.1
    text: |-
      De betaling van de bestuurlijke boete geschiedt binnen zes weken nadat de termijn afloopt voor het indienen van
      een bezwaarschrift of, indien gedurende die termijn bij de voorzieningenrechter van de rechtbank te 's-Gravenhage
      een verzoek om voorlopige voorziening is ingediend, op dat verzoek is beslist, tenzij de beschikking, bedoeld in
      [artikel 18.16k][ref1], een later tijdstip vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16m
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16m.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop de in het eerste lid bedoelde
      termijn is verstreken. Het bestuur van de emissieautoriteit stelt het bedrag van de verschuldigde rente vast.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16m
  - number: 18.16m.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, maant het bestuur van de emissieautoriteit
      degene aan wie de bestuurlijke boete is opgelegd schriftelijk aan binnen twee weken, gerekend vanaf de dag na
      die waarop de aanmaning is toegezonden, alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen. De aanmaning vermeldt dat bij niet tijdige betaling
      deze kan worden afgedwongen door op kosten van de schuldenaar uit te voeren invorderingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16m
  - number: 18.16n.1
    text: |-
      Bij gebreke van volledige betaling binnen de in [artikel 18.16m, derde lid][ref1], genoemde termijn van twee weken
      kan het bestuur van de emissieautoriteit de verschuldigde boete invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16n
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16n.2
    text: |-
      Een dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16n
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 18.16n.3
    text: |-
      De uitvaardiging en betekening van het dwangbevel geschieden op kosten van degene tegen wie het is uitgevaardigd.
      De kosten zijn ook verschuldigd indien het dwangbevel door betaling van verschuldigde bedragen niet of niet
      volledig ten uitvoer is gelegd. De kosten die het bestuur van de emissieautoriteit in rekening kan brengen,
      betreffen ten hoogste de daadwerkelijk gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16n
  - number: 18.16n.4
    text: |-
      Bij het dwangbevel worden tevens de kosten van de aanmaning, de wettelijke rente en de kosten van het dwangbevel in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16n
  - number: 18.16n.5
    text: |-
      De bekendmaking van een dwangbevel geschiedt door middel van betekening van een
      exploot als bedoeld in het [Wetboek van Burgerlijke Rechtsvordering][ref1]. De
      [artikelen 3:41 tot en met 3:45 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing. Het exploot
      vermeldt in ieder geval de rechtbank waarbij tegen het dwangbevel en de tenuitvoerlegging ervan overeenkomstig de
      [artikelen 438][ref3] en [438a van het Wetboek van Burgerlijke Rechtsvordering][ref4] kan worden opgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel438
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel438a
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16n
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '438'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 438a
  - number: 18.16o
    text: |-
      [Artikel 4:8 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de aanmaning, bedoeld in artikel
      18.16m, derde lid, en het dwangbevel, bedoeld in artikel 18.16n, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16o
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 18.16p.1
    text: |-
      Het bestuur van de emissieautoriteit stelt elk jaar voor 1 oktober een overzicht op van personen die het bepaalde
      bij [artikel 16.37, eerste lid][ref1], hebben overtreden en ten aanzien van wie de beschikking tot oplegging van de
      bestuurlijke boete, bedoeld in [artikel 18.16k][ref2], onherroepelijk is geworden. Het overzicht wordt gepubliceerd
      in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16p
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
        hoofdstuk: '16'
        afdeling: 16.2.4
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.16p.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het overzicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16p
  - number: 18.16q.1
    text: |-
      Het bestuur van de emissieautoriteit kan degene die jegens de in [artikel 18.4, vijfde lid][ref1],
      of [artikel 18.4a, eerste lid][ref2], bedoelde personen in strijd handelt met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref3], een boete opleggen van ten hoogste € 4 500.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16q
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 18.16q.2
    text: |-
      Het bestuur van de emissieautoriteit legt geen boete op als bedoeld in het eerste lid, indien de overtreder
      aannemelijk maakt dat hem van de overtreding geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16q
  - number: 18.16q.3
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.16q
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 18.17.1
    text: |-
      Een overheidslichaam kan - behoudens matiging door de rechter - de te zijnen laste komende kosten van het beheer
      van afvalstoffen ten aanzien waarvan in strijd is gehandeld met het bij of krachtens deze wet bepaalde, verhalen op
      degene door wiens onrechtmatige daad die kosten zijn veroorzaakt, of op degene die anderszins krachtens burgerlijk
      recht buiten overeenkomst aansprakelijk is voor de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.17
  - number: 18.17.2
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      afvalstoffen ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.17
  - number: 18.17.3
    text: |-
      Voor de toepassing van [dit artikel][ref1] is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde afvalstoffen zich heeft voorgedaan, reeds jegens de overheid onrechtmatig
      werd gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
        hoofdstuk: '18'
  - number: '18.18'
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet verleende vergunning of
      ontheffing, is verboden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel18.18
  - number: 19.1a.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder milieu-informatie: alle informatie,
      neergelegd in documenten, over:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.a
    text: |-
      de toestand van elementen van het milieu, zoals lucht en atmosfeer, water, bodem, land, landschap en natuurgebieden
      met inbegrip van vochtige biotopen, kust- en zeegebieden, biologische diversiteit en haar componenten, met inbegrip
      van genetisch gemodificeerde organismen, en de interactie tussen deze elementen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.b
    text: |-
      factoren, zoals stoffen, energie, geluid, straling of afval, met inbegrip van radioactief afval, emissies,
      lozingen en ander vrijkomen van stoffen in het milieu die de onder a bedoelde elementen van het milieu aantasten of
      waarschijnlijk aantasten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.c
    text: |-
      maatregelen, met inbegrip van bestuurlijke maatregelen, zoals beleidsmaatregelen, wetgeving, plannen, programma’s,
      milieuakkoorden en activiteiten die op de onder a en b bedoelde elementen en factoren van het milieu een uitwerking
      hebben of kunnen hebben, alsmede maatregelen of activiteiten ter bescherming van die elementen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.d
    text: verslagen over de toepassing van de milieuwetgeving;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.e
    text: |-
      kosten-baten- en andere economische analyses en veronderstellingen die worden gebruikt in het kader van de onder c
      bedoelde maatregelen en activiteiten;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.1.f
    text: |-
      de toestand van de gezondheid en veiligheid van de mens, met inbegrip van de verontreiniging van de voedselketen,
      indien van toepassing, de levensomstandigheden van de mens, waardevolle cultuurgebieden en bouwwerken, voorzover
      zij worden of kunnen worden aangetast door de onder a bedoelde toestand van elementen van het milieu of, via deze
      elementen, door de onder b en c bedoelde factoren, maatregelen of activiteiten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
  - number: 19.1a.2
    text: |-
      [Artikel 1, aanhef en onder a, van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '1'
  - number: 19.1b
    text: |-
      Na het einde van de termijn waarbinnen beroep kan worden ingesteld tegen een beschikking als bedoeld in
      [artikel 13.1][ref1] waarop [afdeling 3.5 van de Algemene wet bestuursrecht][ref2] van toepassing is, wordt,
      zolang zij niet is tenietgegaan, door het bevoegd gezag aan een ieder desgevraagd kosteloos inzage gegeven in en
      tegen vergoeding van ten hoogste de kosten een exemplaar verstrekt van de beschikking en voor zover mogelijk van
      de stukken die in verband met de totstandkoming daarvan overeenkomstig deze wet dan wel [afdeling 3.5][ref3] of
      [artikel 3:44][ref4] of [7:4 van de Algemene wet bestuursrecht][ref5] ter inzage dienden te worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 19.1c
    text: |-
      Onverminderd [artikel 8 van de Wet openbaarheid van bestuur][ref1] verstrekt een bestuursorgaan uit eigen beweging
      informatie over de openbare verantwoordelijkheden en functies die het heeft alsmede de openbare diensten die het
      verleent met betrekking tot het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.1c
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '8'
  - number: 19.2.1
    text: |-
      In het geval van een gebeurtenis waardoor een onmiddellijke bedreiging van het leven of de gezondheid van personen,
      van het milieu of van grote materiële belangen is ontstaan, verstrekken burgemeester en wethouders voorzover deze
      informatie niet reeds ingevolge [artikel 10b van de Wet rampen en zware ongevallen][ref1] of een ander wettelijk
      voorschrift moet worden verstrekt, aan de personen die getroffen kunnen worden, terstond op passende wijze alle
      informatie over de maatregelen die zijn getroffen ter voorkoming en beperking van de bedreiging en de daaruit
      voortvloeiende nadelige gevolgen en de daartoe door die personen te volgen gedragslijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.2
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: 10b
  - number: 19.2.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven over de gevallen waarin ingevolge het
      eerste lid informatie wordt verstrekt, over de inhoud van de te verstrekken informatie en over de wijze waarop de
      informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.2
  - number: 19.3.1
    text: |-
      Indien in een stuk ten aanzien waarvan bij of krachtens deze wet of door [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] openbaarmaking wordt voorgeschreven, milieu-informatie
      voorkomt of uit zodanig stuk milieu-informatie kan worden afgeleid, waarvan de geheimhouding op grond van
      [artikel 10 van de Wet openbaarheid van bestuur][ref3] gerechtvaardigd is, kan het bevoegd gezag op een daartoe
      strekkend schriftelijk verzoek van de belanghebbende toestaan dat deze ten behoeve van de openbaarmaking een,
      door het bevoegd gezag goedgekeurde, tweede tekst overlegt, waarin die informatie niet voorkomt, onderscheidenlijk
      waaruit deze niet kan worden afgeleid. Het bevoegd gezag maakt van deze bevoegdheid slechts gebruik met betrekking
      tot bedrijfsgeheimen en beveiligingsgegevens. Bij een algemene maatregel van bestuur krachtens deze wet kunnen
      ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie gegevens worden aangewezen waarvoor de in de eerste volzin bedoelde bevoegdheid
      eveneens geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 19.3.2
    text: |-
      Indien in een stuk ten aanzien waarvan bij of krachtens deze wet of door [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] openbaarmaking wordt voorgeschreven, milieu-informatie voorkomt of
      uit zodanig stuk milieu-informatie kan worden afgeleid, waarvan de openbaarmaking achterwege dient te blijven,
      onderscheidenlijk achterwege mag blijven, op grond van [artikel 10, eerste lid, aanhef en onder b][ref3],
      onderscheidenlijk [artikel 10, tweede lid, aanhef en onder a, van de Wet openbaarheid van bestuur][ref4], wordt op
      aanwijzing van Onze betrokken Minister ten behoeve van de openbaarmaking een tweede tekst overgelegd, waarin die
      informatie niet voorkomt, onderscheidenlijk waaruit deze niet kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 19.4.1
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 19.3, eerste lid][ref1], vult de verzoeker, indien een tweede
      tekst naar het oordeel van het bevoegd gezag niet voldoende gegevens zou verschaffen voor een goede beoordeling
      van het stuk waarop het verzoek betrekking heeft, een ander stuk in samenhang waarmee het stuk wordt ingediend,
      het ontwerp van het besluit of het besluit, de stukken binnen een door het bevoegd gezag te stellen termijn zoveel
      mogelijk aan met andere gegevens die voor die beoordeling bevorderlijk kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.4.2
    text: |-
      In gevallen waarin toepassing is gegeven aan [artikel 19.3, tweede lid][ref1], vult Onze betrokken Minister,
      indien een tweede tekst naar zijn oordeel niet voldoende gegevens zou verschaffen voor een goede beoordeling van
      het stuk waarop het verzoek betrekking heeft, een ander stuk in samenhang waarmee het stuk wordt ingediend, het
      ontwerp van het besluit of het besluit, de stukken zoveel mogelijk aan met andere gegevens die voor die beoordeling
      bevorderlijk kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.4.3
    text: |-
      Op de tweede tekst stelt het bevoegd gezag een aantekening waaruit blijkt dat die tekst dient ter vervanging van de
      oorspronkelijke tekst waarin gegevens voorkomen, waarvan de geheimhouding gerechtvaardigd onderscheidenlijk geboden
      is. Indien het eerste of tweede lid toepassing heeft gevonden, vermeldt de aantekening tevens dat de stukken zijn
      aangevuld met gegevens als in die leden bedoeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.4
  - number: 19.5.1
    text: |-
      Op een verzoek tot geheimhouding beslist het bevoegd gezag binnen vier weken na ontvangst. Van de beslissing
      wordt mededeling gedaan aan de betrokken bestuursorganen. Indien het verzoek in het kader van de toepassing van
      [hoofdstuk 7][ref1] is gedaan, wordt van de beslissing tevens mededeling gedaan aan de Commissie voor de milieu-
      effectrapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 19.5.2
    text: |-
      Indien een verzoek tot geheimhouding in het kader van de toepassing van [afdeling 3.4][ref1] of
      [3.6 van de Algemene wet bestuursrecht][ref2] indien het een besluit op aanvraag betreft of van
      [paragraaf 7.2][ref3] of [7.5][ref4] is gedaan, schort het bevoegd gezag de verdere behandeling van de aanvraag
      op totdat, indien het verzoek wordt toegestaan, de tweede tekst is overgelegd en de stukken zijn aangevuld met de
      in [artikel 19.4, eerste lid][ref5], bedoelde gegevens, dan wel, indien het verzoek geheel of gedeeltelijk wordt
      afgewezen, de beslissing op het verzoek onherroepelijk is geworden. De krachtens de [artikelen 3:18][ref6] en
      [4:5 van de Algemene wet bestuursrecht][ref7] en [de artikelen 7.5, zevende lid][ref8], [7.20, tweede lid][ref9],
      [13.7][ref10] en [13.8][ref11] geldende termijnen lopen niet zolang de behandeling is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref10]: https://wetten.overheid.nl/BWBR0003245#Artikel13
      [ref11]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel19.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.6'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref4
        bwb_id: BWBR0003245
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref8
