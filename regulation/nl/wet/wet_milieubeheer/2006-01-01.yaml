        afdeling: '13.2'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: '13.3'
    text: |-
      Zienswijzen als bedoeld in [artikel 3:15 van de Algemene wet bestuursrecht][ref1], kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.4'
    text: |-
      Indien de aanvraag om een vergunning of ontheffing betrekking heeft op een inrichting of werk, geschiedt de
      terinzagelegging, bedoeld in [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref1], in ieder geval
      ter secretarie van de gemeente waarin de inrichting of het werk geheel of in hoofdzaak zal zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '13.6'
    text: |-
      Indien de aanvrager daarom heeft verzocht, stelt het bevoegd gezag hem, voordat het stukken ter inzage legt die
      niet van zijn kant zijn ingebracht, in de gelegenheid die stukken in te zien met het oog op de toepassing van de
      [artikelen 19.3 tot en met 19.5][ref1]. Tot de in de eerste volzin bedoelde stukken behoren niet de verslagen,
      gemaakt overeenkomstig [artikel 3:17, tweede lid, van de Algemene wet bestuursrecht][ref2], en afschriften van
      zienswijzen, door anderen dan betrokken bestuursorganen ingebracht overeenkomstig [artikel 3:15 van die wet][ref3].
      [Artikel 10 van de Wet openbaarheid van bestuur][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '13.7'
    text: |-
      In afwijking van [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref1] houdt het bevoegd gezag
      de beslissing op de aanvraag aan indien deze betrekking heeft op een inrichting, behorende tot een krachtens
      [artikel 41 van de Wet geluidhinder][ref2] aangewezen categorie, die is gelegen op een terrein als bedoeld in dat
      artikel, waaromheen nog geen zone is vastgesteld. De verplichting tot aanhouding geldt niet, indien het bevoegd
      gezag van oordeel is dat de vergunning op andere gronden moet worden geweigerd. Het bevoegd gezag doet de aanvrager
      schriftelijk mededeling van de aanhouding. Binnen twaalf weken nadat een zone rond het betrokken terrein is
      vastgesteld, geeft het bevoegd gezag de beschikking op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '41'
  - number: '13.8'
    text: |-
      Indien een aanvraag ten aanzien waarvan toepassing is gegeven aan
      [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1], gecoördineerd behandeld wordt met andere
      aanvragen om een beschikking, op de voorbereiding waarvan [afdeling 3.4 van die wet][ref2] van toepassing is, geldt
      de ingevolge dat artikellid bepaalde termijn tevens voor de beschikking op de andere aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '13.9'
    text: |-
      Indien een beslissing op een aanvraag om een vergunning of ontheffing of een beschikking tot wijziging daarvan niet
      kan worden gegeven dan nadat is voldaan aan een uit een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie voortvloeiende verplichting, wordt de termijn voor het
      geven van die beschikking opgeschort tot de ten aanzien van die verplichting geldende procedure is afgerond.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.9
  - number: '13.10'
    text: |-
      In gevallen waarin Onze Minister bevoegd is een vergunning of ontheffing te verlenen, kan hij in
      overeenstemming met Onze betrokken Minister in het belang van de veiligheid van de Staat de toepassing van
      [afdeling 3.4][ref1] en [artikel 3:44 van de Algemene wet bestuursrecht][ref2] en van de [artikelen 8.7][ref3],
      [8.30, eerste lid, tweede volzin][ref4], en [8.31][ref5] geheel of gedeeltelijk achterwege laten, voor zover dat
      belang zulks vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.2
        afdeling: 8.1.3
  - number: 13.11.1
    text: |-
      Het bevoegd gezag kan bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] buiten toepassing blijft
      bij de voorbereiding van de beschikking op een aanvraag om een vergunning of ontheffing of van een beschikking tot
      wijziging daarvan, indien die beschikking:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 13.11.1.a
    text: |-
      betrekking heeft op het beheer van gevaarlijke afvalstoffen waarvan het beheer door een ongewone omstandigheid op
      korte termijn nodig is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.11
  - number: 13.11.1.b
    text: |-
      betrekking heeft op het beheer van andere dan gevaarlijke afvalstoffen waarvan het beheer door een ongewone
      omstandigheid en in verband met de hoeveelheid waarin die afvalstoffen vrijkomen, op korte termijn nodig is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.11
  - number: 13.11.1.c
    text: |-
      strekt tot uitvoering van een verplichting, opgelegd krachtens [artikel 17.4][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
        hoofdstuk: '17'
  - number: 13.11.2
    text: |-
      In gevallen als aangegeven krachtens [artikel 8.35][ref1] kan Onze Minister in gevallen als bedoeld in het eerste
      lid, bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel13.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.1.3.3
        afdeling: 8.1.3
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 14.1.1
    text: |-
      Ingeval ten behoeve van een zelfde inrichting aanvragen zijn gedaan tot het geven van
      met elkaar samenhangende beschikkingen en op de voorbereiding van ten minste een daarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, kunnen gedeputeerde staten van de
      provincie waar die inrichting geheel of in hoofdzaak is of zal zijn gelegen, indien ten minste één van die
      aanvragen tot hen is gericht, een gecoördineerde behandeling van die aanvragen bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 14.1.2
    text: |-
      Gedeputeerde staten zijn gehouden een gecoördineerde behandeling van aanvragen als bedoeld in de aanhef van het
      eerste lid, indien zij zijn gericht tot verschillende bestuursorganen, te bevorderen wanneer een van die organen
      dan wel de aanvrager of een der aanvragers hun daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.1
  - number: 14.1.3
    text: |-
      Gedeputeerde staten zijn voorts gehouden op verzoek van degene die voornemens is een of meer aanvragen te
      doen als in de aanhef van het eerste lid bedoeld, indien die aanvragen zullen worden gericht tot verschillende
      bestuursorganen, een gecoördineerde voorbereiding van die aanvragen te bevorderen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.1
  - number: 14.1.4
    text: |-
      De verplichtingen, bedoeld in het tweede en derde lid, gelden, voor zover het betreft aanvragen om beschikkingen
      op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing is, slechts
      voor zover nakoming daarvan mogelijk is in verband met de wettelijke voorschriften betreffende de totstandkoming
      van die beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 14.1.5
    text: |-
      Indien gedeputeerde staten toepassing geven aan het eerste, tweede of derde lid, delen zij dit onverwijld
      schriftelijk mede aan de aanvragers en elk der andere bestuursorganen waartoe één of meer der aanvragen mocht zijn
      gericht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.1
  - number: 14.2.1
    text: |-
      Ten aanzien van aanvragen als bedoeld in de [aanhef van artikel 14.1, eerste lid][ref1], die binnen
      een tijdsverloop van zes weken zijn gedaan, kunnen gedeputeerde staten, indien ten minste één van die
      aanvragen tot hen is gericht, bepalen dat als datum van ontvangst van die aanvragen geldt de datum waarop
      de laatste daarvan is ontvangen. Indien het ontwerp van de beschikking op een aanvraag al overeenkomstig
      [artikel 3:13 eerste lid, van de Algemene wet bestuursrecht][ref2] is toegezonden, blijft de eerste volzin met
      betrekking tot die aanvraag buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 14.2.2
    text: |-
      Gedeputeerde staten zijn gehouden ten aanzien van aanvragen als bedoeld in het eerste lid een bepaling als daar
      bedoeld te stellen wanneer een ander bestuursorgaan waartoe één of meer der aanvragen is gericht, dan wel de
      aanvrager of een der aanvragers hun daarom verzoekt. Een verzoek wordt schriftelijk bij gedeputeerde staten
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.2
  - number: 14.2.3
    text: |-
      Indien gedeputeerde staten toepassing geven aan het eerste of tweede lid, delen zij dit onverwijld mede aan de
      aanvragers en aan elk der andere bestuursorganen waartoe één of meer der aanvragen mocht zijn gericht, onder
      vermelding van de datum waarop de laatste aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.2
  - number: 14.3.1
    text: |-
      In geval van gecoördineerde behandeling van aanvragen bevorderen gedeputeerde staten in ieder geval, dat bij de
      beoordeling van de aanvragen door de onderscheidene bestuursorganen die bevoegd zijn daarop te beslissen, rekening
      wordt gehouden met de onderlinge samenhang tussen de betrokken aanvragen en dat door die organen tevens gelet wordt
      op de samenhang tussen de beschikkingen die op de aanvragen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.3
  - number: 14.3.2
    text: 'Zij dragen er daarnaast ten minste zorg voor dat zoveel mogelijk:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.3
  - number: 14.3.2.a
    text: |-
      ten aanzien van de ontwerpen van de betrokken beschikkingen gezamenlijk toepassing wordt gegeven aan de
      [artikelen 3:11, eerste lid][ref1], en [3:12 van de Algemene wet bestuursrecht][ref2] en [artikel 13.4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '13'
        hoofdstuk: '13'
        afdeling: '13.2'
  - number: 14.3.2.b
    text: |-
      de gelegenheid tot het mondeling naar voren brengen van zienswijzen overeenkomstig
      [artikel 3:15 van de Algemene wet bestuursrecht][ref1] wordt gegeven met betrekking tot de ontwerpen van de
      betrokken beschikkingen te zamen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 14.3.2.c
    text: |-
      de betrokken beschikkingen gezamenlijk overeenkomstig [artikel 3:44 van de Algemene wet bestuursrecht][ref1] worden
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '14.4'
    text: |-
      Gedeputeerde staten kunnen van de bestuursorganen die bevoegd zijn te beslissen op de aanvragen waarover
      de in [artikel 14.1][ref1] bedoelde coördinatie zich uitstrekt, alsmede van de bij de beslissingen op die
      aanvragen betrokken adviseurs de medewerking vorderen, die voor het welslagen van de coördinatie nodig is. Die
      bestuursorganen en adviseurs zijn gehouden de van hen gevorderde medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 14.5.1
    text: |-
      Ingeval ter zake van een activiteit, dan wel ter zake van verscheidene met elkaar samenhangende
      activiteiten meer dan een besluit is aangewezen, bij de voorbereiding waarvan op grond van het bij of
      krachtens deze wet bepaalde een milieu-effectrapport moet worden gemaakt en op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, wordt ter voorbereiding van die besluiten
      één milieu-effectrapport gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 14.5.2
    text: |-
      Buiten de gevallen, in het eerste lid bedoeld, kan, ingeval ter zake van een activiteit, dan wel ter zake van
      verscheidene met elkaar samenhangende activiteiten meer dan een besluit moet worden genomen, bij de voorbereiding
      waarvan op grond van het bij of krachtens deze wet bepaalde een milieu-effectrapport moet worden gemaakt, worden
      besloten dat ter voorbereiding van die besluiten één milieu-effectrapport wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
  - number: 14.5.3
    text: 'Een besluit krachtens het tweede lid wordt genomen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
  - number: 14.5.3.a
    text: |-
      indien de bevoegdheid tot het nemen van de in het tweede lid bedoelde besluiten berust bij één bestuursorgaan: door
      dat orgaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
  - number: 14.5.3.b
    text: |-
      indien die besluiten ingevolge wettelijk voorschrift op aanvraag worden genomen en de betrokken aanvragen ingevolge
      [artikel 14.1][ref1] gecoördineerd kunnen worden voorbereid of behandeld: door gedeputeerde staten van de betrokken
      provincie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 14.5.3.c
    text: 'in andere gevallen: door de bestuursorganen die bevoegd zijn tot het nemen van de betrokken besluiten, te zamen.'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
  - number: 14.5.4
    text: |-
      Een besluit krachtens het tweede lid kan ambtshalve of op verzoek worden genomen. In gevallen als bedoeld in het
      derde lid, onder *b*, kan het besluit, indien gedeputeerde staten niet bevoegd zijn tot het nemen van een der
      betrokken besluiten, uitsluitend op verzoek worden genomen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.5
  - number: 14.6.1
    text: |-
      Degene die een activiteit onderneemt in een geval als bedoeld in [artikel 14.5][ref1], kan tegelijkertijd met
      een mededeling als bedoeld in [artikel 7.12, eerste lid][ref2], verzoeken aan [artikel 14.5, tweede lid][ref3],
      toepassing te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.6.2
    text: |-
      In gevallen als bedoeld in [artikel 14.5, derde lid, onder ][ref1], kan een zodanig verzoek ook worden gedaan door
      een bestuursorgaan dat bevoegd is tot het nemen van een besluit als bedoeld in het tweede lid van dat artikel. Het
      wordt ingediend uiterlijk twee weken na de dag waarop met betrekking tot het milieu-effectrapport de kennisgeving
      krachtens of met overeenkomstige toepassing van [artikel 7.12, vierde lid][ref2], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.6.3
    text: |-
      Het verzoek - waarin alle besluiten vermeld zijn, waarop het betrekking heeft - wordt schriftelijk ingediend bij
      het orgaan dat erover moet beslissen. In een geval als bedoeld in [artikel 14.5, derde lid, onder ][ref1], wordt
      het verzoek ingediend bij een der bevoegde bestuursorganen; dat orgaan zendt het onverwijld aan de andere bevoegde
      organen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.6.4
    text: |-
      Het orgaan waarbij het verzoek is ingediend, tekent de datum van ontvangst aan op het geschrift waarbij het verzoek
      is ingediend, en zendt de verzoeker een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.6
  - number: 14.7.1
    text: Een verzoek wordt ingewilligd, tenzij het belang van een goede besluitvorming zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.7
  - number: 14.7.2
    text: |-
      Op een verzoek wordt niet beslist dan nadat degene die de betrokken activiteit onderneemt, en de tot het nemen van
      de betrokken besluiten bevoegde bestuursorganen in de gelegenheid zijn gesteld hun zienswijze daarover te geven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.7
  - number: 14.7.3
    text: Het besluit op het verzoek wordt genomen uiterlijk vier weken na de datum van ontvangst.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.7
  - number: '14.8'
    text: |-
      In gevallen als bedoeld in [artikel 14.5, derde lid, onder c][ref1], wordt bij de beslissing op het verzoek uit de
      bevoegde bestuursorganen het orgaan aangewezen dat met de in [artikel 14.9, eerste lid][ref2], bedoelde coördinatie
      wordt belast.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.9.1
    text: |-
      Indien op grond van [artikel 14.5, eerste lid][ref1], een milieu-effectrapport moet worden gemaakt, dan wel
      overeenkomstig [artikel 14.5, tweede lid][ref2], is besloten tot het maken van één milieu-effectrapport, wordt dat
      rapport gecoördineerd voorbereid en behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.9.2
    text: 'Met de coördinatie is belast:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.9
  - number: 14.9.2.a
    text: 'indien de bevoegdheid tot het nemen van de betrokken besluiten berust bij één bestuursorgaan: dat orgaan;'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.9
  - number: 14.9.2.b
    text: |-
      indien die besluiten ingevolge wettelijk voorschrift op aanvraag worden genomen en de betrokken aanvragen ingevolge
      [artikel 14.1][ref1] gecoördineerd kunnen worden voorbereid of behandeld: gedeputeerde staten van de betrokken
      provincie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 14.9.2.c
    text: |-
      in andere gevallen: het krachtens [artikel 14.8][ref1] daartoe aangewezen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.9
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.10.1
    text: |-
      Het met de coördinatie belaste orgaan bevordert dat bij het geven van de in [artikel 7.15][ref1] bedoelde
      richtlijnen rekening wordt gehouden met de onderlinge samenhang tussen die richtlijnen en dat bij het nemen van
      de besluiten bij de voorbereiding waarvan het milieu-effectrapport wordt gemaakt, rekening wordt gehouden met de
      onderlinge samenhang tussen die besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.10.2
    text: 'Het met de coördinatie belaste orgaan draagt er in ieder geval zoveel mogelijk zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
  - number: 14.10.2.a
    text: |-
      van de mededelingen van de voornemens tot het indienen van verzoeken, als bedoeld in
      [artikel 7.12, eerste lid][ref1], alsmede van de voornemens tot het nemen van besluiten, als bedoeld in
      [artikel 7.13, eerste lid][ref2], te zamen overeenkomstig [artikel 7.12, vierde en vijfde lid][ref3], wordt
      kennisgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.10.2.b
    text: |-
      de krachtens artikel 7.15 te geven richtlijnen te zamen worden toegezonden aan degene die het milieu-effectrapport
      maakt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
  - number: 14.10.2.c
    text: |-
      het milieu-effectrapport wordt toegezonden aan elk der bevoegde organen en overeenkomstig
      [artikel 7.20, eerste lid][ref1], aan de adviseurs en de Commissie voor de milieu-effectrapportage;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.10.2.d
    text: |-
      van het milieu-effectrapport overeenkomstig [artikel 7.20, tweede lid][ref1], wordt kennisgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.10.2.e
    text: |-
      overigens toepassing wordt gegeven aan [artikel 7.20][ref1] en aan [artikel 7.26, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.10.3
    text: |-
      [Artikel 14.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 14.11.1
    text: |-
      In gevallen waarin een orgaan met de coördinatie van de voorbereiding en behandeling van een milieu-effectrapport
      is belast, kan:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
  - number: 14.11.1.a
    text: |-
      in afwijking van [artikel 7.17, eerste lid][ref1], het rapport aan dat orgaan worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.11.1.b
    text: |-
      de Commissie voor de milieu-effectrapportage en kunnen de adviseurs hun adviezen over het geven van richtlijnen
      inzake de inhoud van het rapport en over het rapport bij dat orgaan indienen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
  - number: 14.11.1.c
    text: |-
      degene die gebruik maakt van de overeenkomstig [artikel 7.14, vierde lid][ref1], geboden gelegenheid zijn
      zienswijze naar voren te brengen over het geven van richtlijnen inzake de inhoud van het rapport, die zienswijze
      bij dat orgaan naar voren te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.11.1.d
    text: |-
      degene die gebruik maakt van de overeenkomstig [artikel 3:15, eerste lid, van de Algemene wet bestuursrecht][ref1]
      juncto [artikel 7.20, derde lid][ref2], geboden gelegenheid zijn zienswijze naar voren te brengen over het rapport,
      die zienswijze bij dat orgaan naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.11.2
    text: |-
      Indien stukken met een inhoud als bedoeld in het eerste lid worden overgelegd onderscheidenlijk ingediend bij een
      ander bevoegd gezag, zendt het deze onverwijld aan het met de coördinatie belaste orgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.11
  - number: 14.12.1
    text: |-
      Ingeval ter zake van een activiteit een besluit is aangewezen, bij de voorbereiding waarvan op grond van het bij
      of krachtens deze wet bepaalde een milieu-effectrapport moet worden gemaakt, en ter zake van die activiteit één
      of meer besluiten moeten worden genomen ten aanzien waarvan [artikel 14.1][ref1] niet kan worden toegepast, kan
      op verzoek van degene die de activiteit onderneemt, worden besloten tot een gecoördineerde voorbereiding van deze
      besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: 14.12.2
    text: 'Een besluit krachtens het eerste lid wordt genomen:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.12
  - number: 14.12.2.a
    text: |-
      indien de bevoegdheid tot het nemen van de in het eerste lid bedoelde besluiten berust bij één bestuursorgaan: door
      dat orgaan;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.12
  - number: 14.12.2.b
    text: 'in andere gevallen: door de bestuursorganen die bevoegd zijn tot het nemen van de betrokken besluiten, te zamen.'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.12
  - number: 14.13.1
    text: |-
      Een verzoek als bedoeld in [artikel 14.12, eerste lid][ref1], wordt schriftelijk ingediend gelijktijdig met de
      mededeling, bedoeld in [artikel 7.12, eerste lid][ref2]. Het verzoek vermeldt alle besluiten waarop het betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.13.2
    text: |-
      [Artikel 7.12, tweede lid][ref1], is van overeenkomstige toepassing. Het bevoegd gezag zendt onverwijld een
      afschrift van het verzoek aan de andere bevoegde organen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.13.3
    text: |-
      Een verzoek als bedoeld in [artikel 14.12, eerste lid][ref1], wordt alleen ingewilligd, indien het bevoegd gezag en
      de andere bevoegde organen daarmee instemmen. Artikel 14.7, tweede en derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
  - number: 14.14.1
    text: |-
      Indien een verzoek als bedoeld in [artikel 14.12, eerste lid][ref1], wordt ingewilligd, treedt het orgaan dat
      bevoegd is tot het nemen van het besluit bij de voorbereiding waarvan het milieu-effectrapport moet worden gemaakt,
      op als het met de coördinatie belaste orgaan. De overige betrokken organen worden voor wat betreft de toepassing
      van de [artikelen 7.12 tot en met 7.20][ref2] en [7.26][ref3] aangemerkt als adviseur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.6'
  - number: 14.14.2
    text: |-
      Indien ter zake van de activiteit waarop het verzoek betrekking heeft, meer dan één besluit moet worden genomen,
      bij de voorbereiding waarvan op grond van het bij of krachtens deze wet bepaalde een milieu-effectrapport moet
      worden gemaakt, wordt bij de beslissing op het verzoek uit de bestuursorganen die bevoegd zijn tot het nemen van
      die besluiten, het met de coördinatie belaste orgaan aangewezen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
  - number: 14.14.3
    text: 'Het met de coördinatie belaste orgaan draagt er in ieder geval zo veel mogelijk zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
  - number: 14.14.3.a
    text: |-
      bij het geven van de in [artikel 7.15][ref1] bedoelde richtlijnen rekening wordt gehouden met de onderlinge
      samenhang van de besluiten waarop het verzoek betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 14.14.3.b
    text: |-
      tussen de bevoegde bestuursorganen tijdig overleg wordt gevoerd, teneinde een zo goed mogelijke afstemming tussen
      de te nemen besluiten te bevorderen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
  - number: 14.14.4
    text: |-
      [Artikel 14.4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
        hoofdstuk: '14'
        paragraaf: '14.1'
  - number: '14.15'
    text: |-
      Met betrekking tot de termijn waarbinnen de betrokken besluiten moeten worden genomen, is [artikel 7.34][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.7'
  - number: '14.16'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de taken van het met de
      coördinatie belaste orgaan.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel14.16
  - number: '15.12'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1], is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] van toepassing op subsidies die krachtens deze titel
      uitsluitend worden verstrekt aan rechtspersonen die krachtens publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: 15.13.1
    text: |-
      Onze Minister kan voor bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling aangewezen
      activiteiten op het gebied van het milieubeheer subsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen in ieder geval regels worden
      gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.a
    text: criteria voor de verstrekking;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.b
    text: het tijdvak waarvoor de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.c
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.d
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.e
    text: de verplichtingen voor de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.f
    text: het bedrag van de subsidie dan wel de wijze waarop dit wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.2.g
    text: de betaling van de subsidie en het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.3
    text: |-
      Onze Minister kan ieder jaar bij ministeriële regeling subsidieplafonds vaststellen voor de verschillende
      activiteiten waarvoor subsidie kan worden verstrekt. Daarbij bepaalt hij de wijze van verdeling van het beschikbare
      bedrag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
  - number: 15.13.4
    text: |-
      Een aanvraag kan worden afgewezen en een beschikking inhoudende de verstrekking van een subsidie op
      grond van deze wet kan worden ingetrokken of gewijzigd voor zover subsidieverstrekking in strijd zou zijn
      respectievelijk in strijd is met ingevolge een verdrag voor de staat geldende verplichtingen. Bij de intrekking
      of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een rentevergoeding
      verschuldigd is. De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is
      verstrekt, tenzij bij de intrekking of wijziging anders is bepaald. De [artikelen 4:49, derde lid][ref1], en
      [4:57 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op de intrekking of wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 15.14.1
    text: |-
      De door Onze Minister aangewezen personen zijn bevoegd van de aanvrager van een subsidie inlichtingen te
      vorderen. De [artikelen 5:13][ref1], [5:15][ref2], voor zover het door de aanvrager gebruikte plaatsen betreft, en
      [5:17 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.14.2
    text: |-
      Een aanvraag kan worden afgewezen, indien de aanvrager geen medewerking verleent bij de uitoefening van de in het
      eerste lid bedoelde bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.14
  - number: 15.15.1
    text: |-
      Met het toezicht op de naleving van de aan de subsidie-ontvanger opgelegde verplichtingen zijn belast de bij
      besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.15
  - number: 15.15.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.15.3
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.15
  - number: 15.15.4
    text: |-
      Aan de krachtens deze wet verstrekte subsidies is de verplichting verbonden dat de subsidie-ontvanger aan
      een toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.15
  - number: 15.20.1
    text: 'Indien degene tot wie een beschikking is gericht krachtens:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
  - number: 15.20.1.a
    text: |-
      de artikelen 8.1, eerste lid, onder *b*, 8.1, eerste lid, onder *c*, juncto 8.21, eerste lid, in gevallen waarin
      [artikel 8.21, tweede lid][ref1], niet van toepassing is, 8.22, tweede lid, 8.23, eerste lid, 8.25, eerste lid,
      onder *a* en *b*, 8.34 of 8.39, tweede lid,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.1.1
  - number: 15.20.1.b
    text: |-
      de artikelen 10.48 of 10.52 juncto één of meer der [onder ][ref1] genoemde bepalingen,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.20.1.c
    text: |-
      [artikel 2, eerste lid][ref1], juncto [5, vijfde lid, onder ][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '5'
  - number: 15.20.1.d
    text: |-
      de [artikelen 13, eerste lid, onder ][ref1], juncto [16, vijfde lid][ref2], of
      [43, eerste lid, van de Wet inzake de luchtverontreiniging][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002731#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002731#Artikel43
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002731
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0002731
        artikel: '43'
  - number: 15.20.1.e
    text: |-
      [artikel 24, eerste lid][ref1], juncto [26, zevende lid, onder ][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel26
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '26'
  - number: 15.20.1.f
    text: |-
      de [artikelen 30][ref1] of [31 van de Wet bodembescherming][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel31
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '31'
  - number: 15.20.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die tengevolge van een maatregel als
      bedoeld in [artikel 40 van de Wet milieugevaarlijke stoffen][ref1] zich voor kosten ziet gesteld dan wel daardoor
      schade lijdt, als in het eerste lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel40
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '40'
  - number: 15.20.3
    text: |-
      Indien een beschikking als bedoeld in het eerste lid op aanvraag wordt gegeven, kan een verzoek om vergoeding
      worden ingediend na de toezending van een exemplaar van het ontwerp van die beschikking aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
  - number: 15.20.4
    text: |-
      Indien het in het eerste lid bedoelde gezag een advies van deskundigen heeft ingewonnen omtrent een verzoek om
      vergoeding of omtrent het voornemen tot een toekenning daarvan uit eigen beweging zendt het een exemplaar van het
      advies aan de belanghebbende. Het vermeldt daarbij de termijn waarbinnen de belanghebbende zijn opvattingen omtrent
      het advies kenbaar kan maken.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
  - number: 15.20.5
    text: |-
      Een beschikking op een verzoek om schadevergoeding wordt zo spoedig mogelijk gegeven, doch uiterlijk vier maanden
      na de datum waarop het verzoek is ontvangen, of, in gevallen als bedoeld in het vierde lid, uiterlijk zeven maanden
      na die datum.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.20
  - number: 15.21.1
    text: |-
      [Artikel 15.20][ref1] is van overeenkomstige toepassing ten aanzien van degene op wie bepalingen van een algemene
      maatregel van bestuur, onderscheidenlijk een ministeriële regeling of een verordening als bedoeld in


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.21.1.a
    text: artikel 1.2 van deze wet,
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
  - number: 15.21.1.b
    text: de artikelen 10.15 of 10.17, eerste lid, van deze wet;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
  - number: 15.21.1.c
    text: |-
      de [artikelen 24][ref1] of [31 van de Wet milieugevaarlijke stoffen][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel31
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0003892
        artikel: '31'
  - number: 15.21.1.d
    text: |-
      de [artikelen 6 tot en met 11 van de Wet bodembescherming][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel6
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '6'
  - number: 15.21.2
    text: |-
      In gevallen als bedoeld in het eerste lid, beslist Onze Minister over het toekennen van de vergoeding, behoudens in
      gevallen als bedoeld in het eerste lid, onder *a*. In die gevallen beslissen gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.21
  - number: 15.22.1
    text: |-
      Voor zover de toekenning van de vergoeding niet is geschied met instemming van Onze Minister, komen de kosten
      daarvan ten laste van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.22
  - number: 15.22.2
    text: |-
      In afwijking van het eerste lid komen in gevallen als bedoeld in [artikel 15.20, eerste lid, onder ][ref1], voor
      zover kosten zijn gemaakt in verband met de verlening van schadevergoeding vanwege het van toepassing worden van
      bepalingen van een provinciale milieuverordening als bedoeld in [artikel 1.2, tweede lid, onder ][ref2], en de
      verlening van schadevergoeding niet is geschied met instemming van gedeputeerde staten, de kosten daarvan ten laste
      van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.22
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 15.23.1
    text: |-
      Bij koninklijk besluit kan, naar aanleiding van een daartoe strekkend verzoek van het bevoegd gezag, worden bepaald
      dat de kosten van een toegekende vergoeding alsnog geheel of gedeeltelijk ten laste van het Rijk komen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.23
  - number: 15.23.2
    text: |-
      [Artikel 15][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel15c
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.23
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 15c
  - number: 15.24.1
    text: Er is een Fonds Luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.2
    text: Het fonds is rechtspersoon en gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.3
    text: Onze Minister is belast met het beheer van het fonds.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.4
    text: 'Het fonds ontvangt jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.4.a
    text: |-
      een bijdrage gelijk aan het in de begrotingswet opgenomen bedrag, aangevuld met een bedrag dat nodig is om het
      vermogen van het fonds de omvang te doen hebben die is bepaald bij of krachtens het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.4.b
    text: het batig saldo van de laatstelijk afgesloten rekening van het fonds;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.4.c
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.24.5
    text: |-
      Niet in het jaar van ontvangst bestede gelden blijven in het fonds. Het vermogen van het fonds bedraagt jaarlijks
      per 31 december ten minste een bedrag dat gelijk is aan een vijfde van het totale bedrag van de in het betrokken
      jaar en de vier daaraan voorafgaande jaren gedane toezeggingen. Onze Minister kan het vermogen van het fonds op een
      hoger bedrag vaststellen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.24
  - number: 15.25.1
    text: |-
      Uit het fonds kan aan een ieder die ten gevolge van plotseling optredende luchtverontreiniging schade heeft geleden
      welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, op zijn verzoek een vergoeding worden
      toegekend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.25
  - number: 15.25.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder luchtverontreiniging verstaan hetgeen in de
      [Wet inzake de luchtverontreiniging][ref1] wordt verstaan onder dit begrip.


      [ref1]: https://wetten.overheid.nl/BWBR0002731
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.25
    references:
      - id: ref1
        bwb_id: BWBR0002731
  - number: 15.26.1
    text: |-
      Onze Minister bepaalt de vergoeding, bedoeld in [artikel 15.25][ref1], naar billijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.26.2
    text: 'Geen vergoeding wordt toegekend ter zake van:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.26.2.a
    text: schade die minder dan € 225 bedraagt;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.26.2.b
    text: schade die langs burgerrechtelijke weg is of kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.26.2.c
    text: schade in welker vergoeding op andere wijze is of kan worden voorzien.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.26.3
    text: |-
      Indien een vaststelling vooraf omtrent het ontbreken van de in het tweede lid, onder *b* of *c*, bedoelde
      mogelijkheid zou leiden tot onredelijke vertraging in de behandeling van het verzoek, of tot van de belanghebbende
      in redelijkheid niet te vergen kosten, kan een zodanige schadevergoeding uit het fonds worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.26.4
    text: |-
      Het fonds treedt voor het aan de belanghebbende uitgekeerde bedrag in de rechten die deze ter zake van de door hem
      geleden schade tegenover derden heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.26
  - number: 15.27.1
    text: |-
      Een verzoek om vergoeding van de schade moet bij het fonds worden ingediend binnen acht weken na de dag sedert
      welke de verzoeker kennis draagt of redelijkerwijze geacht kan worden kennis te dragen van de schade.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.27
  - number: 15.27.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld omtrent de indiening en behandeling van en
      de beslissing op verzoeken om schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.27
  - number: 15.28.1
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld omtrent de inrichting en de administratie
      van het fonds en het daarop uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.28
  - number: 15.28.2
    text: Onze Minister doet jaarlijks verslag aan de Staten-Generaal omtrent het over het fonds gevoerde beheer.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.28
  - number: '15.31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van vergoedingen voor
      keuringen als bedoeld in
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.31
  - number: 15.31.a
    text: |-
      [artikel 13, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel13
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '13'
  - number: 15.31.b
    text: |-
      [artikel 2, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
  - number: 15.31.c
    text: |-
      [artikel 27 van de Wet milieugevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel27
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '27'
  - number: 15.31.d
    text: |-
      [artikel 15, tweede lid, van de Wet bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.31
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '15'
  - number: 15.32.1
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 10.17, eerste lid][ref1], kunnen regels worden
      gesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.32.1.a
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die stoffen, preparaten
      of andere produkten in Nederland op de markt brengen in bij de maatregel aangewezen verpakkingen, voor zodanige
      verpakkingen een bij of krachtens de maatregel te bepalen statiegeld in rekening te brengen en zodanige
      verpakkingen na gebruik met terugbetaling van het statiegeld in te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.32.1.b
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die daarbij aangewezen
      stoffen, preparaten of andere produkten in Nederland op de markt brengen, voor zodanige stoffen, preparaten
      of andere produkten een bij of krachtens de maatregel te bepalen statiegeld in rekening te brengen en zodanige
      stoffen, preparaten of andere produkten na gebruik met terugbetaling van het statiegeld in te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.32.2
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 10.17, eerste lid][ref1], kunnen regels worden
      gesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.32.2.a
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die stoffen, preparaten
      of andere produkten in Nederland op de markt brengen in bij de maatregel aangewezen verpakkingen, zodanige
      verpakkingen na gebruik tegen betaling van een bij of krachtens de maatregel te bepalen premie in te nemen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.32.2.b
    text: |-
      inhoudende een verplichting voor bij de maatregel aangewezen categorieën van personen die daarbij aangewezen
      stoffen, preparaten of andere produkten in Nederland op de markt brengen, deze na gebruik tegen betaling van een
      bij of krachtens de maatregel te bepalen premie in te nemen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.32.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, kan worden bepaald dat daarbij aangegeven handelingen
      door andere dan de in het eerste en tweede lid bedoelde, bij die maatregel aangewezen categorieën van personen
      moeten worden verricht. In deze gevallen kan tevens worden bepaald dat eveneens bij de maatregel aangewezen
      categorieën van personen het statiegeld, bedoeld in het eerste lid, of de premie, bedoeld in het tweede lid, geheel
      of gedeeltelijk op een daarbij aangegeven wijze dienen af te dragen aan een of meer daarbij aangewezen andere
      personen.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.32.4
    text: |-
      Indien toepassing wordt gegeven aan het eerste of tweede lid, wordt een termijn bepaald, eerst bij het verstrijken
      waarvan die regels ten aanzien van stoffen, preparaten of andere produkten die bij het in werking treden van de
      maatregel reeds vervaardigd en in Nederland aanwezig waren, gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.32
  - number: 15.33.1
    text: |-
      Elke gemeente kan ter bestrijding van de kosten die voor haar verbonden zijn aan het beheer van huishoudelijke
      afvalstoffen een heffing instellen, waaraan kunnen worden onderworpen degenen die, al dan niet krachtens
      een zakelijk of persoonlijk recht, feitelijk gebruik maken van een perceel ten aanzien waarvan krachtens
      de[ artikelen 10.21][ref1] en [10.22][ref2] een verplichting tot het inzamelen van huishoudelijke afvalstoffen
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
        hoofdstuk: '10'
  - number: 15.33.2
    text: |-
      Onder de in het eerste lid bedoelde kosten wordt mede verstaan de omzetbelasting die ingevolge de
      [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: 15.33.3
    text: |-
      Met betrekking tot deze heffingen zijn [de artikelen 216 tot en met 219][ref1] en
      [230 tot en met 257 van de Gemeentewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel230
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.33
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '230'
  - number: 15.34.1
    text: |-
      Voor zover kosten zijn gemaakt in verband met de verlening van schadevergoeding krachtens
      [artikel 15.20, eerste lid, onder ][ref1], of [artikel 15.21, eerste lid, onder ][ref2], vanwege het van toepassing
      worden van bepalingen van een provinciale milieuverordening als bedoeld in [artikel 1.2, tweede lid, onder ][ref3],
      kunnen provinciale staten ter bestrijding van die kosten een heffing instellen ter zake van het onttrekken van
      grondwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 15.34.2
    text: |-
      De heffing wordt geheven van houders van inrichtingen, bestemd tot het onttrekken van grondwater, daaronder niet
      begrepen inrichtingen welke uitsluitend dienen tot het regelen van de vrije grondwaterspiegel of van de stijghoogte
      van het grondwater.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
  - number: 15.34.3
    text: |-
      In de verordening tot instelling van de heffing kan worden bepaald dat de heffing wordt geheven van houders van
      inrichtingen als bedoeld in het tweede lid in één of meer beschermingsgebieden als bedoeld in [hoofdstuk VI,
      paragraaf 2, van de Wet bodembescherming](onbekend), dan wel van houders van zodanige inrichtingen in de gehele
      provincie.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
  - number: 15.34.4
    text: Als grondslag voor de heffing geldt de onttrokken hoeveelheid water.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
  - number: 15.34.5
    text: |-
      Tot het instellen van een heffing wordt overgegaan binnen een jaar nadat de beschikking waarbij de in het eerste
      lid bedoelde schadevergoeding is verleend, ingevolge [artikel 20.3][ref1] in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20'
        hoofdstuk: '20'
        paragraaf: '20.1'
  - number: 15.34.6
    text: |-
      De heffing wordt jaarlijks geheven gedurende een termijn van ten hoogste tien jaren. In de verordening tot
      instelling van de heffing kan worden bepaald dat de heffing op verzoek van de heffingplichtige voor de ten tijde
      van de indiening van het verzoek nog niet aangevangen jaren waarover de heffing wordt geheven, ineens kan worden
      voldaan volgens een in de verordening op te nemen regeling.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
  - number: 15.34.7
    text: |-
      [Hoofdstuk XV van de Provinciewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
  - number: 15.34a
    text: |-
      Met betrekking tot beschikkingen tot verlening, wijziging of intrekking van een vergunning of ontheffing krachtens
      deze wet worden geen rechten geheven.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.34a
  - number: '15.35'
    text: |-
      Voor de toepassing van deze titel en de daarop berustende bepalingen wordt verstaan onder: afvalbeheersbijdrage:
      bijdrage in de kosten van het beheer van een afvalstof; overeenkomst over een afvalbeheersbijdrage: schriftelijke
      overeenkomst tussen degenen die een stof, preparaat of ander product in Nederland invoeren of op de markt brengen,
      tot het afdragen van een afvalbeheersbijdrage.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.35
  - number: 15.36.1
    text: |-
      Onze Minister kan, indien dat in het belang is van een doelmatig beheer van afvalstoffen, op een met redenen
      omkleed verzoek, na overleg met Onze Minister van Economische Zaken een overeenkomst over een afvalbeheersbijdrage
      algemeen verbindend verklaren voor een ieder die die stof, dat preparaat of dat andere produkt in Nederland invoert
      of op de markt brengt.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.36
  - number: 15.36.2
    text: |-
      Onze Minister stelt regels met betrekking tot de onderwerpen die in ieder geval in een overeenkomst over een
      afvalbeheersbijdrage, waarvoor een algemeen verbindend verklaring wordt gevraagd, aan de orde dienen te komen,
      alsmede met betrekking tot de bij een verzoek als bedoeld in het eerste lid over te leggen gegevens. Tot die
      gegevens behoren in ieder geval gegevens, waaruit duidelijk wordt dat redelijkerwijs is getracht te voorkomen, dat
      gebruikers van die stof, dat preparaat of dat andere produkt in de praktijk meer dan eenmaal een bijdrage voor het
      beheer daarvan verschuldigd zullen zijn.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.36
  - number: 15.37.1
    text: |-
      Een verzoek als bedoeld in [artikel 15.36][ref1] kan slechts worden ingediend door degenen die, onderscheidenlijk
      organisaties van degenen die wat betreft de gezamenlijke omzet van de betrokken stoffen, preparaten of andere
      produkten een naar het oordeel van Onze Minister belangrijke meerderheid vormen van degenen die deze stoffen,
      preparaten of andere produkten in Nederland invoeren of op de markt brengen. Onze Minister betrekt bij zijn oordeel
      met betrekking tot de vraag of degenen die, onderscheidenlijk de organisaties van degenen die het verzoek hebben
      ingediend, een belangrijke meerderheid vormen, in ieder geval het aantal van hen in verhouding met het totale
      aantal van degenen die deze stoffen, preparaten of andere produkten in Nederland invoeren of op de markt brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.37.2
    text: |-
      Op de voorbereiding van een besluit op het verzoek is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 15.37.3
    text: |-
      Indien een besluit niet kan worden genomen dan nadat is voldaan aan een uit een voor Nederland verbindend verdrag
      of een voor Nederland verbindend besluit van een volkenrechtelijke organisatie voortvloeiende verplichting, wordt
      de termijn voor het nemen van dat besluit opgeschort tot de ten aanzien van die verplichting geldende procedure is
      afgerond. Van de opschorting wordt mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.37
  - number: 15.37.4
    text: |-
      Indien bij het besluit een overeenkomst over een afvalbeheersbijdrage algemeen verbindend wordt verklaard, wordt de
      tekst van de overeenkomst in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.37
  - number: 15.38.1
    text: |-
      Onze Minister kan van een algemeen verbindend verklaarde overeenkomst over een afvalbeheersbijdrage op een daartoe
      strekkend verzoek, na overleg met Onze Minister van Economische Zaken ontheffing verlenen, indien de verzoeker
      zorg draagt voor een zodanig beheer van de betrokken afvalstoffen dat deze naar het oordeel van Onze Minister ten
      minste gelijkwaardig is aan het beheer overeenkomstig de betrokken algemeen verbindend verklaarde overeenkomst over
      een afvalbeheersbijdrage.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.38
  - number: 15.38.2
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.38
  - number: 15.38.3
    text: |-
      Een krachtens het eerste lid verleende ontheffing kan ambtshalve of op een daartoe strekkend verzoek worden
      gewijzigd of ingetrokken. [Artikel 15.39, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande
      dat voor het in onderdeel *b* van dat lid genoemde belang in de plaats treedt: het niet langer voldoen aan het in
      het eerste lid van dit artikel genoemde vereiste.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.38.4
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het eerste en derde lid, is
      [artikel 15.37, tweede tot en met vierde lid][ref1], van overeenkomstige toepassing. Onze Minister stelt de houder
      van de ontheffing, behoudens in gevallen waarin deze om wijziging of intrekking verzoekt, van zijn voornemen tot
      wijziging of intrekking in kennis, alvorens een besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.38
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.1
    text: |-
      Een besluit krachtens [artikel 15.36, eerste lid][ref1], geldt voor een daarbij aangegeven termijn van ten hoogste
      vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.2
    text: |-
      Onze Minister kan een besluit krachtens [artikel 15.36, eerste lid][ref1], na overleg met Onze Minister van
      Economische Zaken intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.2.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist zijn of onvolledig blijken, dat op het verzoek een andere
      beslissing zou zijn genomen als bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
  - number: 15.39.2.b
    text: |-
      op grond van een verandering van de omstandigheden of inzichten opgetreden na het nemen van het besluit, moet
      worden aangenomen dat het van kracht blijven van het besluit het belang van een doelmatig beheer van afvalstoffen
      op onaanvaardbare wijze zou schaden;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
  - number: 15.39.2.c
    text: |-
      een voor Nederland verbindend verdrag of een voor Nederland verbindend besluit van een volkenrechtelijke
      organisatie, dan wel regels ter uitvoering daarvan, hiertoe verplichten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
  - number: 15.39.3
    text: |-
      Alvorens een besluit krachtens [artikel 15.36, eerste lid][ref1], op grond van het tweede lid, onder *a*, in
      te trekken, stelt Onze Minister degenen die het verzoek tot algemeen verbindend verklaring hebben gedaan, in de
      gelegenheid hun zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.39.4
    text: |-
      Op de voorbereiding van een besluit tot intrekking van een besluit krachtens [artikel 15.36, eerste lid][ref1], op
      grond van het tweede lid, onder b of c, is [artikel 15.37, tweede tot en met vierde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.39
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: '15.40'
    text: |-
      Een ieder is tot naleving van een voor hem geldende algemeen verbindend verklaarde overeenkomst over een
      afvalbeheersbijdrage gehouden tegenover ieder ander, die bij de naleving een redelijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.40
  - number: '15.41'
    text: |-
      Indien een of meer van degenen die een stof, preparaat of ander produkt in Nederland invoeren of op de markt
      brengen, waarvoor een overeenkomst over een afvalbeheersbijdrage algemeen verbindend is verklaard, het vermoeden
      gegrond achten dat door een of meer anderen een of meer van de algemeen verbindend verklaarde bepalingen uit die
      overeenkomst niet worden nageleefd, kunnen zij met het oog op het instellen van een rechtsvordering op grond van
      [artikel 15.40][ref1] Onze Minister verzoeken een onderzoek daarnaar te doen instellen. De inspecteur stelt het
      onderzoek in en brengt aan Onze Minister verslag uit van hetgeen bij het onderzoek is gebleken. Onze Minister stelt
      het verslag ter beschikking van degene of degenen, die om het onderzoek hebben gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.41
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: '15.42'
    text: |-
      In deze titel en de daarop berustende bepalingen wordt onder «stortplaats», «gesloten stortplaats» en
      «bedrijfsgebonden stortplaats» verstaan hetgeen daaronder wordt verstaan in titel 8.3.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.42
  - number: '15.43'
    text: |-
      Deze titel is niet van toepassing op stortplaatsen waar baggerspecie is gestort en die worden gedreven of mede
      worden gedreven door Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.43
  - number: 15.44.1
    text: 'Provinciale staten stellen een heffing in ter bestrijding van de kosten die gemoeid zullen zijn met:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
  - number: 15.44.1.a
    text: de in artikel 8.49 bedoelde zorg voor de in de betrokken provincie gelegen stortplaatsen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
  - number: 15.44.1.b
    text: |-
      een voor de betrokken provincie geldende verplichting tot afdracht aan een fonds als bedoeld in
      [artikel 15.48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.44.1.c
    text: |-
      de door de provincie uitgevoerde inventarisatie van plaatsen waar afvalstoffen zijn gestort en waar dat storten
      vóór 1 september 1996 is beëindigd, en het onderzoek naar en systematische controle van aanwezigheid, aard en
      omvang van eventuele verontreiniging aldaar.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
  - number: 15.44.2
    text: |-
      De in het eerste lid bedoelde heffing kan mede betrekking hebben op de kosten die gemoeid zullen zijn met de
      dekking van de aansprakelijkheid, bedoeld in [artikel 176 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 15.44.3
    text: |-
      Met betrekking tot de heffing en invordering zijn de [artikelen 227][ref1] tot en met
      [232h van de Provinciewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel232h
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.44
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '227'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 232h
  - number: 15.45.1
    text: De heffing wordt geheven van degene die een stortplaats drijft.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.45
  - number: 15.45.2
    text: |-
      Het bedrag van de heffing wordt zodanig vastgesteld dat uit de opbrengst van de heffing en de daarover verkregen
      rentebaten en beleggingsopbrengsten de kosten kunnen worden bestreden, die naar verwachting gemoeid zullen zijn met
      de uitvoering van het in [artikel 8.49, derde en vierde lid][ref1], bedoelde nazorgplan waarmee gedeputeerde staten
      hebben ingestemd, of, indien geen nazorgplan geldt, de in [artikel 8.49, eerste lid][ref2], bedoelde zorg voor die
      stortplaats. Indien na de vaststelling blijkt dat de opbrengst van de heffing hoger dan wel lager is dan het bedrag
      dat nodig is om de kosten te bestrijden die naar verwachting met die zorg van die stortplaats gemoeid zullen zijn,
      kan het bedrag van de heffing opnieuw worden vastgesteld. Het reeds betaalde bedrag van de heffing wordt hierop in
      mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.45.3
    text: |-
      In afwijking van het tweede lid kan de heffing terzake van de niet-bedrijfsgebonden stortplaatsen in de betrokken
      provincie worden vastgesteld aan de hand van de hoeveelheid en de aard van de afvalstoffen die op de stortplaats
      zijn afgegeven. Het bedrag wordt zodanig vastgesteld dat uit het totaal van de opbrengsten van de heffing en de
      daarover verkregen rentebaten en beleggingsopbrengsten voor de niet-bedrijfsgebonden stortplaatsen in die provincie
      de kosten kunnen worden bestreden die naar verwachting gemoeid zullen zijn met de zorg voor die stortplaatsen.
      De kosten, bedoeld in [de tweede volzin][ref1], worden berekend met inachtneming van de voor die stortplaatsen
      geldende nazorgplannen waarmee gedeputeerde staten hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.45.4
    text: Het derde lid is niet van toepassing op stortplaatsen waar baggerspecie is gestort.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.45
  - number: 15.46.1
    text: |-
      Gedeputeerde staten kunnen bepalen dat degenen die een stortplaats drijven, waarop
      [artikel 15.45, derde lid][ref1], niet van toepassing is, financiële zekerheid stellen voor het nakomen van de
      krachtens [de artikelen 15.44, eerste lid, onder a, en 15.45][ref2] voor hen geldende verplichting. Daarbij wordt
      in ieder geval aangegeven het bedrag waarvoor de zekerheid ten hoogste in stand moet worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.2
    text: |-
      De verplichting financiële zekerheid in stand te houden vervalt op het tijdstip waarop een bedrag aan heffing, als
      bedoeld in [artikel 15.45, tweede lid][ref1], is betaald, voor zover het betreft het gedeelte dat overeenkomt met
      het bedrag dat is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.3
    text: |-
      Gedeputeerde staten kunnen verhaal nemen op de gestelde zekerheid, voor zover degene die de zekerheid heeft
      gesteld, het bedrag van de heffing, zoals dat is vastgesteld ingevolge [artikel 15.45, tweede lid][ref1], niet
      tijdig heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.46.4
    text: |-
      Met betrekking tot de invordering van het ingevolge het derde lid te verhalen bedrag is
      [artikel 5:26 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 15.46.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop financiële zekerheid
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.46
  - number: 15.47.1
    text: |-
      Gedeputeerde staten van een provincie richten voor hun provincie een fonds op, bestemd voor de in
      [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.47.2
    text: |-
      In afwijking van het eerste lid kunnen gedeputeerde staten van verschillende provincies gezamenlijk voor hun
      provincies een fonds als bedoeld in het eerste lid oprichten.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.3
    text: Een fonds is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.4
    text: |-
      Gedeputeerde staten van de betrokken provincie, onderscheidenlijk provincies zijn belast met het beheer van het in
      hun provincie, onderscheidenlijk provincies werkzame fonds.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.5
    text: 'Een fonds ontvangt jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.5.a
    text: |-
      de opbrengst van de in [artikel 15.44][ref1] bedoelde heffing, verminderd met het bedrag ter bestrijding van de
      kosten in verband met de in [artikel 15.44, eerste lid, onder c][ref2], bedoelde handelingen en met het gedeelte
      van de heffingen, bedoeld in [artikel 15.48, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.5.b
    text: |-
      de bedragen die ingevolge [artikel 15.46, derde lid][ref1], worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.5.c
    text: rentebaten en beleggingsopbrengsten die via het fonds zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.5.d
    text: het batig saldo van de laatstelijk afgesloten rekening van het fonds.
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.6
    text: |-
      Een fonds is gerechtigd ook andere bedragen, bestemd voor de in [artikel 8.49][ref1] bedoelde zorg, dan die,
      bedoeld in het vijfde lid, in ontvangst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.47.7
    text: 'Uit het fonds worden uitsluitend bestreden de kosten die:'
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.7.a
    text: |-
      worden gemaakt in verband met de uitvoering van de in [artikel 8.49][ref1] bedoelde zorg met betrekking tot
      gesloten stortplaatsen in de betrokken provincie of provincies;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.47.7.b
    text: |-
      zijn verbonden aan de werkzaamheden van het fonds dat in de betrokken provincie, onderscheidenlijk provincies
      werkzaam is;
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
  - number: 15.47.7.c
    text: |-
      worden gemaakt ter dekking van de aansprakelijkheid, bedoeld in
      [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref1], doch slechts voor zover de in
      [artikel 15.44][ref2] bedoelde heffing mede op deze kosten betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel176
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '176'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.47.8
    text: |-
      Onder de kosten, bedoeld in het zevende lid, worden niet begrepen de kosten die in verband met de in
      [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen door de betrokken provincie, onderscheidenlijk
      provincies worden gemaakt ten behoeve van haar bestuurlijk apparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.47
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.48.1
    text: |-
      Gedeputeerde staten van provincies kunnen gezamenlijk een fonds oprichten ter dekking van grote financiële risico's
      in verband met de in [artikel 8.49][ref1] bedoelde zorg voor gesloten stortplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
  - number: 15.48.2
    text: |-
      Het in het eerste lid bedoelde fonds ontvangt jaarlijks van die provincies een door het bestuur van dat fonds te
      bepalen gedeelte van de aan die provincies afgedragen heffingen als bedoeld in [artikel 15.45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.48.3
    text: |-
      Van [artikel 15.47][ref1] zijn het derde en vierde lid, alsmede het achtste lid, in verbinding met het zevende lid,
      onder b, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.48
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
        hoofdstuk: '15'
  - number: 15.49.1
    text: |-
      Ter zake van door een stortplaats veroorzaakte schade, die bekend is geworden na het tijdstip waarop een verklaring
      als bedoeld in [artikel 8.47, derde lid][ref1], met betrekking tot die stortplaats is afgegeven, doet noch een
      provincie, noch het in deze titel bedoelde fonds een beroep op de aansprakelijkheid van degene die als laatste de
      stortplaats heeft gedreven op grond van [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 15.49.2
    text: |-
      Indien degene die als laatste een stortplaats heeft gedreven, waarvoor een verklaring als bedoeld in
      [artikel 8.47, derde lid][ref1], is afgegeven, aansprakelijk is voor de door die stortplaats veroorzaakte schade
      op grond van [artikel 176, vierde lid, van Boek 6 van het Burgerlijk Wetboek][ref2], kan degene jegens wie deze
      aansprakelijkheid bestaat, zijn recht op schadevergoeding geldend maken tegen het in deze titel bedoelde fonds dat
      in de betrokken provincie werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel176
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel15.49
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '176'
  - number: 16.1.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: emissieverslag: verslag
      als bedoeld in [artikel 16.12, eerste lid, onder b][ref1]; monitoringsprotocol: protocol als bedoeld
      in [artikel 16.6, tweede lid][ref2]; jaarvracht: totale hoeveelheid van een emissie gedurende een
      kalenderjaar; nationaal toewijzingsplan: plan als bedoeld in [artikel 16.23, eerste lid][ref3]; nationaal
      toewijzingsbesluit: 'besluit als bedoeld in [artikel 16.29, eerste lid][ref4]; Onze Ministers: Onze Minister'
      en Onze Minister van Economische Zaken; planperiode: periode waarop een nationaal toewijzingsplan ingevolge
      [artikel 16.23, tweede lid][ref5], betrekking heeft; register voor handel in broeikasgasemissierechten:
      register als bedoeld in [artikel 16.43, eerste lid][ref6]; register voor handel in NO-emissierechten:
      register als bedoeld in [artikel 16.58, eerste lid][ref7]; verificateur: onafhankelijke deskundige
      als bedoeld in [artikel 16.12, eerste lid, onder c][ref8]; verificatie: beoordeling als bedoeld in
      [artikel 16.12, eerste lid, onder c][ref9]; verkoopplafond: het aantal NO-emissierechten, bedoeld in
      [artikel 16.49, derde lid][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref9]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref10]: https://wetten.overheid.nl/BWBR0003245#Artikel16
    url: https://wetten.overheid.nl/BWBR0003245/2006-01-01#Artikel16.1
    references:
