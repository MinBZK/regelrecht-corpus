articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            dierziekten:

              de in de [bijlage 1][ref1] genoemde ziekten.



            b
            Minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            c
            bedrijf:

              locatie van een landbouwbedrijf, waar, anders dan voor recreatieve of educatieve doeleinden, een of meer
      varkens worden gehouden dan wel een locatie die voor het zodanig houden bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0006100
    url: https://wetten.overheid.nl/BWBR0006100/2003-02-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006100
  - number: '2'
    text: >-
      1 Het is verboden varkens op een bedrijf af te leveren of te ontvangen, tenzij de zending varkens vergezeld
      gaat van een geldige verklaring van een praktiserend dierenarts, waaruit ten genoege van de Minister blijkt dat
      onderzoek heeft aangetoond dat de dieren afkomstig zijn van een bedrijf dat vrij is van dierziekten.


      2 Het is verboden varkens op een bedrijf aanwezig te hebben, tenzij een geldige verklaring van een praktiserend
      dierenarts op het bedrijf aanwezig is, waaruit ten genoege van de Minister blijkt dat onderzoek heeft aangetoond
      dat het bedrijf waar de varkens aanwezig zijn vrij is van dierziekten.


      3 Het is verboden varkens te vervoeren, tenzij de zending varkens vergezeld gaat van een geldige verklaring van een
      praktiserend dierenarts, waaruit ten genoege van de Minister blijkt dat onderzoek heeft aangetoond dat de dieren
      afkomstig zijn van een bedrijf dat vrij is van dierziekten.
    url: https://wetten.overheid.nl/BWBR0006100/2003-02-05#Artikel2
  - number: '3'
    text: |-
      1 Het ingevolge [artikel 2][ref1] ten genoege van de Minister verrichte onderzoek dient in te houden dat:

      a. de dierenarts ten minste een keer in de vier weken de op het bedrijf aanwezige dieren klinisch heeft
      onderzocht en heeft vastgesteld dat er geen verschijnselen van besmettelijke veeziekten genoemd in
      [artikel 7 van de Veewet][ref2] en van varkenspest zijn;

      b. de dierenarts ten minste een keer in de vier maanden het bedrijf serologisch heeft laten onderzoeken bij
      een naar het oordeel van de Minister voldoende toegerust laboratorium op de aanwezigheid van antistoffen tegen
      vesiculaire varkensziekte bij:

      - 7 dieren, indien op het bedrijf 10 dieren of minder aanwezig zijn;
      - 9 dieren, indien op het bedrijf 11 tot en met 30 dieren aanwezig zijn;
      - 10 dieren, indien op het bedrijf 31 tot en met 120 dieren aanwezig zijn;
      - 12 dieren, indien op het bedrijf meer dan 120 dieren aanwezig zijn, met dien verstande dat het serologisch
      onderzoek betrekking moet hebben op dieren die tenminste 30 kg wegen;

      c. de uitslag van het in onderdeel b dan wel het in het tweede lid bedoelde onderzoek alsmede het in het derde lid
      bedoelde onderzoek negatief is bevonden.

      2 Indien het aantal op grond van het eerste lid serologisch te onderzoeken dieren, dat tenminste 30 kg weegt,
      niet op het bedrijf aanwezig is, dient, in afwijking van het eerste lid, onderdeel b, uit de in [artikel 2][ref3]
      bedoelde verklaring te blijken dat de dierenarts alle op het bedrijf aanwezige dieren die tenminste 30 kg wegen
      serologisch heeft laten onderzoeken op de aanwezigheid van antistoffen tegen vesiculaire varkensziekte.

      3 Indien niet is voldaan aan het eerste lid, onderdeel a, wordt de verklaring slechts afgegeven indien de
      dierenarts het bedrijf serologisch heeft laten onderzoeken op de aanwezigheid van antistoffen tegen varkenspest
      overeenkomstig [bijlage 2][ref4].


