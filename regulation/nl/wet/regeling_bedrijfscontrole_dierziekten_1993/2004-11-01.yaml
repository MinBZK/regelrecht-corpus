articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            dierziekten:

              de in de [bijlage 1][ref1] genoemde ziekten.



            b
            Minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            c
            bedrijf:

              locatie van een landbouwbedrijf, waar, anders dan voor recreatieve of educatieve doeleinden, een of meer
      varkens worden gehouden dan wel een locatie die voor het zodanig houden bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0006100
    url: https://wetten.overheid.nl/BWBR0006100/2004-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006100
  - number: '2'
    text: |-
      1 Het is verboden varkens op een bedrijf af te leveren of te ontvangen, tenzij de zending varkens vergezeld
      gaat van een geldige verklaring van een praktiserend dierenarts, waaruit ten genoege van de Minister blijkt dat
      onderzoek heeft aangetoond dat de dieren afkomstig zijn van een bedrijf dat vrij is van dierziekten.

      2 Het is verboden varkens op een bedrijf aanwezig te hebben, tenzij een geldige verklaring van een praktiserend
      dierenarts op het bedrijf aanwezig is, waaruit ten genoege van de Minister blijkt dat onderzoek heeft aangetoond
      dat het bedrijf waar de varkens aanwezig zijn vrij is van dierziekten.

      3 Het is verboden varkens te vervoeren, tenzij de zending varkens vergezeld gaat van een geldige verklaring van een
      praktiserend dierenarts, waaruit ten genoege van de Minister blijkt dat onderzoek heeft aangetoond dat de dieren
      afkomstig zijn van een bedrijf dat vrij is van dierziekten.
    url: https://wetten.overheid.nl/BWBR0006100/2004-11-01#Artikel2
  - number: '3'
    text: |-
      1 Het ingevolge [artikel 2][ref1] ten genoege van de Minister verrichte onderzoek dient in te houden
      dat de dierenarts ten minste een keer in de vier weken de op het bedrijf aanwezige dieren klinisch
      heeft onderzocht en heeft vastgesteld dat er geen verschijnselen van besmettelijke veeziekten genoemd in
      [artikel 7 van de Veewet][ref2] en van varkenspest zijn.

      2 Indien niet is voldaan aan het eerste lid, onderdeel a, wordt de verklaring slechts afgegeven indien de
      dierenarts het bedrijf serologisch heeft laten onderzoeken op de aanwezigheid van antistoffen tegen varkenspest
      overeenkomstig [bijlage 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006100#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006100
    url: https://wetten.overheid.nl/BWBR0006100/2004-11-01#Artikel3
