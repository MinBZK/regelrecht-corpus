  - number: '4'
    text: |-
      1 De in [artikel 2][ref1] bedoelde verklaring heeft een geldigheidsduur van vier weken. Als verklaring als bedoeld
      in [artikel 2][ref2] wordt tot en met 30 oktober 1998 in aanmerking genomen de verklaring die is verstrekt op grond
      van [artikel 2][ref3], zoals dat artikel luidde voor de inwerkingtreding van de onderhavige regeling.

      2 Een afschrift van de in [artikel 2][ref4] bedoelde verklaringen dient na het verstrijken van de geldigheidsduur
      tenminste twee jaar te worden bewaard.


