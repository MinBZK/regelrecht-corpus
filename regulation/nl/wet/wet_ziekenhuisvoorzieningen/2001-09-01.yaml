---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_ziekenhuisvoorzieningen
regulatory_layer: WET
publication_date: '2005-11-01'
valid_from: '2001-09-01'
bwb_id: BWBR0002753
url: https://wetten.overheid.nl/BWBR0002753/2001-09-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de volksgezondheid regelen te stellen
    ter bevordering van doelmatige voorzieningen ter zake van ziekenhuizen en andere inrichtingen voor gezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.1.b
    text: |-
      het College bouw: het College bouw ziekenhuisvoorzieningen, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '2'
        paragraaf: '1'
  - number: 1.1.c
    text: |-
      ziekenhuisvoorziening: inrichting voor gezondheidszorg, behorende tot een bij of krachtens algemene maatregel van
      bestuur aangewezen categorie, of een deel van zodanige inrichting, alsmede een met zodanige inrichting verbonden of
      ten behoeve van een of meer inrichtingen fungerende bouwkundige voorziening;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.1.d
    text: |-
      academisch ziekenhuis: een ziekenhuisvoorziening die in de zin van de Wet op het wetenschappelijk onderwijs een
      academisch ziekenhuis is;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.1.e
    text: |-
      bed of plaats: capaciteitsmaat waarmee wordt uitgedrukt het aantal patiënten dat gelijktijdig in het kader van een
      klinische behandeling of verpleging in een ziekenhuisvoorziening kan worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.1.f
    text: |-
      functie-eenheid: capaciteitsmaat voor de uitoefening van medisch-specialistische functies, overeenkomend met de
      gemiddelde jaarproductie van een medisch specialist met een volledige werkweek.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: '1.2'
    text: |-
      De voordracht tot een algemene maatregel als bedoeld in het eerste lid wordt Ons gedaan door Onze Minister tezamen
      met Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder een ziekenhuisvoorziening niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.3.a
    text: |-
      een inrichting voor de opname van gedetineerden in de zin van de [Penitentiaire beginselenwet][ref1], een inrichting
      voor de opname van verpleegden in de zin van de [Beginselenwet verpleging ter beschikking gestelden][ref2] en een
      inrichting voor de opname van jeugdigen in de zin van de [Beginselenwet justitiële jeugdinrichtingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765
      [ref3]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
      - id: ref3
        bwb_id: BWBR0011756
  - number: 1.3.c
    text: |-
      voorzieningen in het kader van de voorbereiding voor en in het geval van oorlog, oorlogsgevaar, daaraan verwante of
      daarmede verband houdende buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: 1.3.d
    text: militaire verblijven als een ziekenboeg, een kwartierziekenverblijf en een garnizoensziekenverblijf.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder het bouwen of de bouw van een
      ziekenhuisvoorziening mede verstaan het uitbreiden, verbouwen of vervangen van een ziekenhuisvoorziening, het
      als ziekenhuisvoorziening inrichten of in gebruik nemen van een gebouw of een gedeelte van een gebouw, alsmede
      het wijziging brengen in de bestemming van een ziekenhuisvoorziening. Onze Minister kan deze begrippen nader
      omschrijven.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een College bouw ziekenhuisvoorzieningen, dat rechtspersoonlijkheid bezit. Het College bouw is gevestigd in
      een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2
  - number: '2.2'
    text: Het College bouw is belast met de taken die hem bij of krachtens deze wet of een andere wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2
  - number: '2.3'
    text: Het College bouw wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2
  - number: 2a.1
    text: Het College bouw bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.2
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op
      grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College alsmede op grond van
      maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.3
    text: |-
      Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.4
    text: |-
      Bij de samenstelling van het College wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende
      tot etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.5
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.6
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2a.7
    text: |-
      Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2a
  - number: 2b.1
    text: |-
      Het College bouw stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld omtrent de wijze
      waarop besluiten worden voorbereid, genomen en uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2b
  - number: 2b.2
    text: |-
      In het bestuursreglement kan het College voorzien in de instelling van commissies, in welk geval in het
      bestuursreglement tevens regels worden gesteld omtrent de samenstelling en taken van de ingestelde commissie. In
      commissies kunnen ook personen deelnemen die geen lid van het College zijn.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2b
  - number: 2b.3
    text: |-
      Vergaderingen van het College en van commissies van het College zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2b
  - number: 2b.4
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2b
  - number: 2c.1
    text: Het College bouw benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2c
  - number: 2c.2
    text: Het College bouw stelt met betrekking tot de arbeidsvoorwaarden van het personeel regels vast.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2c
  - number: 2d
    text: |-
      Het College bouw zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende kalenderjaar.
      Het werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan beide kamers
      der Staten-Generaal. Het College stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2d
  - number: 2e
    text: |-
      Het College bouw zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten voor het
      volgende kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2e
  - number: 2f
    text: |-
      Het College bouw zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder, alsmede
      gegevens omtrent de uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze Minister zendt het verslag
      aan beide kamers der Staten-Generaal. Het College stelt het verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2f
  - number: 2g.1
    text: |-
      Het College bouw brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over zijn beheerskosten
      over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid
      en de rechtmatigheid van de ontvangsten en de uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2g.2
    text: |-
      Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College stelt het financieel verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2g
  - number: 2h
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2h
  - number: 2i
    text: |-
      De beheerskosten van het College bouw komen tot ten hoogste het in de begroting aangegeven bedrag ten laste van het
      Algemeen Fonds Bijzondere Ziektekosten, bedoeld in [artikel 38 van de Wet financiering volksverzekeringen][ref1].
      Op grond van de begroting worden maandelijks uit het Algemeen Fonds Bijzondere Ziektekosten voorschotten verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel38
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2i
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '38'
  - number: 2j
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College bouw.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2j
  - number: 2k.1
    text: Een besluit van het College bouw kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2k
  - number: 2k.2
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2k
  - number: 2l.1
    text: 'Het College bouw:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2l
  - number: 2l.1.a
    text: |-
      rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid van voorgenomen beleid met
      betrekking tot ziekenhuisvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2l
  - number: 2l.1.b
    text: |-
      geeft aan de provincies op hun verzoek inlichtingen met betrekking tot de bouwkundige en functionele staat van
      de ziekenhuisvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2l
  - number: 2l.1.c
    text: |-
      geeft aan Onze Minister desgevraagd advies over aanvragen om een verklaring als bedoeld in
      [artikel 7, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2l
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
  - number: 2l.2
    text: |-
      Het College signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het terrein van de
      infrastructuur van de gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2l
  - number: 2m.1
    text: |-
      Er is een College sanering ziekenhuisvoorzieningen, verder te noemen: het College sanering, dat
      rechtspersoonlijkheid bezit. Het College sanering is gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2m
  - number: 2m.2
    text: |-
      Het College sanering is belast met de taken die hem bij of krachtens deze wet, de Wet ambulancevervoer of een
      andere wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2m
  - number: 2m.3
    text: |-
      De [artikelen 2a][ref1] tot en met [2k][ref2], met uitzondering van [artikel 2d][ref3], zijn ten aanzien van het
      College sanering van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel2k
      [ref3]: https://wetten.overheid.nl/BWBR0002753#Artikel2d
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2m
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 2a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002753
        artikel: 2k
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002753
        artikel: 2d
        paragraaf: '1'
  - number: 2n
    text: |-
      Het College bouw en het College sanering verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn
      taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat
      voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2n
  - number: 2o
    text: |-
      Het College bouw en het College sanering verstrekken desgevraagd aan elkaar en aan het College voor
      zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref1], het College van toezicht op de
      zorgverzekeringen, genoemd in [artikel 1u van de Ziekenfondswet][ref2], en het College tarieven gezondheidszorg,
      bedoeld in de [Wet tarieven gezondheidszorg][ref3], de voor de uitoefening van hun taak benodigde inlichtingen. De
      bedoelde colleges kunnen inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling
      van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1u
      [ref3]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel2o
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1u
      - id: ref3
        bwb_id: BWBR0003356
  - number: '3.1'
    text: Onze Minister stelt beleidsregels vast over het ontwerpen van plannen voor ziekenhuisvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel3
  - number: '3.2'
    text: |-
      Deze beleidsregels kunnen, behalve op behoeftecriteria en op de samenhang zowel onderling als tussen
      ziekenhuisvoorzieningen en andere voorzieningen, onder meer betrekking hebben op functie-omschrijvingen en
      gebiedsindeling.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover deze beleidsregels betrekking hebben op academische ziekenhuizen geschiedt de vaststelling in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen. Voor zover deze beleidsregels betrekking
      hebben op de wijze waarop in een plan samenhang wordt aangebracht tussen de betrokken ziekenhuisvoorzieningen en
      de hiermede samenhangende voorzieningen op het terrein van maatschappelijke dienstverlening en andere verwante
      terreinen, worden deze beleidsregels gesteld door Onze Minister en Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel3
  - number: '3.4'
    text: |-
      Bij deze beleidsregels doet Onze minister in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschappen mededeling van de voorgenomen voorzieningen met betrekking tot wetenschappelijk onderwijs en
      onderzoek voor zover deze van invloed zijn op de behoefte aan academische ziekenhuizen, en in overeenstemming
      met Onze Minister van Defensie mededeling van de voorgenomen ziekenhuisvoorzieningen met betrekking tot militaire
      ziekenhuizen. Daarbij wordt tevens in overeenstemming met Onze Minister van Justitie mededeling gedaan van de
      omvang van de behoefte voor het opnemen van patiënten onder verantwoordelijkheid van Onze Minister van Justitie in
      het kader van de uitvoering van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister geeft aan provinciale staten van een of meer provinciën aanwijzingen voor het ontwerpen van plannen
      voor ziekenhuisvoorzieningen. Een zodanige aanwijzing kan strekken tot het ontwerpen van een plan ter zake van
      alle ziekenhuisvoorzieningen dan wel ziekenhuisvoorzieningen behorende tot een bij de aanwijzing aangegeven
      categorie, in een aangegeven gebied dat het geheel of een gedeelte van een of meer provinciën kan omvatten. Voor
      zover de aanwijzingen strekken tot het ontwerpen van plannen die betrekking hebben op academische ziekenhuizen,
      worden zij gegeven in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen waarbij het laatst
      vastgestelde overzicht, bedoeld in [artikel 5][ref1], en voorzover betrekking hebbend op de [artikelen 3][ref2],
      [4][ref3] en [5][ref4], in acht wordt genomen. Onze Minister stelt een termijn vast waarbinnen het ontworpen plan
      aan hem dient te zijn voorgelegd. Onze Minister kan deze termijn op verzoek van provinciale staten verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002753#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002753#Artikel5
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 5a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002753
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002753
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002753
        artikel: '5'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Gedeputeerde staten stellen een voorontwerp van plan op, waarin de behoefte aan de in de aanwijzing aangegeven
      ziekenhuisvoorzieningen in het aangegeven gebied is neergelegd, en omschreven wordt welke aanvullingen of
      veranderingen in het reeds aanwezige bestel naar hun oordeel nodig zijn om op een doelmatige wijze in die behoefte
      te voorzien.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
  - number: '4.3'
    text: |-
      Indien een plan voor ziekenhuisvoorzieningen betrekking zal hebben op een gebied dat tot meer provinciën behoort,
      stellen gedeputeerde staten van de betrokken provinciën een gezamenlijk voorontwerp van plan op. Voor zover naar
      het oordeel van gedeputeerde staten de behoefte aan ziekenhuisvoorzieningen in hun provincie samenhangt met de
      behoefte in een andere provincie, plegen zij omtrent de inhoud van het te ontwerpen plan overleg met gedeputeerde
      staten van de laatstbedoelde provincie.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
  - number: '4.4'
    text: |-
      Provinciale staten stellen het ontwerp-plan vast. Op de voorbereiding daarvan is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.5'
    text: |-
      De kennisgeving van de terinzagelegging, bedoeld in [artikel 3:12, eerste lid, van voornoemde wet][ref1], wordt
      tevens in de *Staatscourant* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '4.6'
    text: |-
      Gedeputeerde staten zenden aan Onze Minister en het College bouw het ontworpen plan voor ziekenhuisvoorzieningen
      toe, vergezeld van de hierover naar voren gebrachte zienswijzen en de inzichten uit de vergadering van provinciale
      staten hieromtrent.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
  - number: '4.7'
    text: |-
      Het College bouw breng aan Onze Minister op diens verzoek binnen een door deze vast te stellen termijn omtrent het
      ontworpen plan voor ziekenhuisvoorzieningen advies uit.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt het betrokken plan voor ziekenhuisvoorzieningen vast. Voor zover dit betrekking heeft op
      academische ziekenhuizen of militaire ziekenhuizen, stelt Onze Minister het plan vast in overeenstemming met Onze
      Minister van Onderwijs, Cultuur en Wetenschappen onderscheidenlijk van Defensie; voor zover dit betrekking heeft op
      inrichtingen waar uitsluitend of overwegend patiënten worden opgenomen onder verantwoordelijkheid van Onze Minister
      van Justitie in het kader van de uitvoering van een rechterlijke uitspraak, in overeenstemming met Onze Minister
      van Justitie.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel5
  - number: '5.2'
    text: |-
      Een plan voor ziekenhuisvoorzieningen wordt bekend gemaakt in de *Staatscourant* en in een of meer in het in de
      aanwijzing aangegeven gebied verspreide dag- of nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel5
  - number: '5.3'
    text: |-
      Tegen een besluit als bedoeld in het eerste lid kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel5
  - number: '5.4'
    text: |-
      Een plan voor ziekenhuisvoorzieningen wordt, behoudens in bijzondere omstandigheden, niet herzien binnen twee
      jaar na de vaststelling. Op de herziening zijn de regelen met betrekking tot de totstandkoming en het beroep van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel5
  - number: 5a
    text: |-
      Onze minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, biedt na overleg
      met de besturen van provincies periodiek aan de Tweede Kamer der Staten-Generaal een overzicht aan van zijn
      beleidsvoornemens met betrekking tot functies, capaciteit, samenhang en spreiding van de voorzieningen in
      academische ziekenhuizen. Hierbij wordt het bijzondere karakter van deze ziekenhuizen zoals vastgelegd in artikel
      150a van de Wet op het wetenschappelijk onderwijs in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel5a
  - number: '6.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel6
  - number: 6.1.a
    text: een ziekenhuisvoorziening te bouwen zonder vergunning van het College bouw;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel6
  - number: 6.1.b
    text: |-
      een ziekenhuisvoorziening te exploiteren, voor zover ten aanzien daarvan is gehandeld in strijd met het onder *a*
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel6
  - number: '6.2'
    text: |-
      Het verbod geldt niet voor uitbreidingen of verbouwingen van een door Onze Minister te bepalen aard, waarvan de
      kosten een door hem te bepalen bedrag niet te boven gaan, mits daarvan tevoren kennis is gegeven aan het College
      bouw. Het desbetreffende besluit wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel6
  - number: '6.3'
    text: |-
      Het verbod geldt mede niet voor de bouw van militaire ziekenhuizen, voor zover deze in een plan voor
      ziekenhuisvoorzieningen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel6
  - number: '7.1'
    text: |-
      Een aanvrage om een vergunning, als bedoeld in [artikel 6][ref1], wordt niet in behandeling genomen, indien niet
      zijn afgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel6
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '6'
        paragraaf: '3'
  - number: 7.1.a
    text: |-
      een onherroepelijk geworden verklaring van Onze Minister waaruit blijkt dat de beoogde bouw past in een plan voor
      ziekenhuisvoorzieningen, behoudens voor zover een zodanige verklaring op grond van [artikel 9][ref1] niet vereist
      is,


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel9
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '9'
        paragraaf: '3'
  - number: 7.1.b
    text: |-
      een goedkeuring door het College bouw van het programma van eisen voor de beoogde bouw, indien dit is
      voorgeschreven op grond van [artikel 9, derde lid][ref1] of [artikel 10, zesde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: 7.1.c
    text: een goedkeuring door het College bouw van het schetsontwerp voor de beoogde bouw.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel7
  - number: '7.2'
    text: |-
      De aanvrage om een vergunning dient voorts vergezeld te gaan van bestedingsgerede stukken voor de beoogde bouw,
      indien dit door het College bouw is voorgeschreven bij de goedkeuring van het schetsontwerp.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister stelt regelen, inhoudende welke gegevens dienen te worden verstrekt bij de aanvrage om een vergunning
      of een verklaring en bij de toezending van een programma van eisen, een schetsontwerp en bestedingsgerede stukken
      als bedoeld in [artikel 7][ref1]. Hij kan tevens regelen stellen betreffende de inhoud en de wijze van indiening
      hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: Onze Minister bepaalt de termijn waarbinnen adviezen moeten worden uitgebracht en op aanvragen moet worden beslist.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel8
  - number: '8.3'
    text: Besluiten krachtens het eerste of tweede lid worden in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel8
  - number: '9.1'
    text: |-
      Een verklaring als bedoeld in [artikel 7, eerste lid, onder ][ref1], is niet vereist voor de beoogde bouw van
      ziekenhuisvoorzieningen, behorende tot een door Onze Minister aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Onze Minister kan in zeer bijzondere gevallen waarin gewichtige belangen daartoe aanleiding geven, bepalen dat een
      verklaring niet vereist is. Alvorens hiertoe over te gaan wint Onze Minister het advies in van het College bouw en
      van gedeputeerde staten, bedoeld in [artikel 10, eerste lid][ref1]. De artikelen 11 en 13 zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: '9.3'
    text: |-
      Bij de toepassing van het eerste of tweede lid kan Onze Minister bepalen dat een programma van eisen voor de
      beoogde bouw moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel9
  - number: '10.1'
    text: |-
      Over een aanvrage om een verklaring wint Onze Minister het advies in van gedeputeerde staten van de provincie
      waarin de ziekenhuisvoorziening waarop de aanvrage betrekking heeft, zich bevindt of bevinden zal, alsmede, voor
      zover daartoe naar zijn oordeel gegronde redenen bestaan, van gedeputeerde staten van andere provinciën en het
      College bouw.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.2'
    text: Gedeputeerde staten en het College bouw zenden hun advies aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.3'
    text: |-
      Een verklaring kan uitsluitend worden afgegeven aan een rechtspersoon van wie mag worden aangenomen dat zijn
      werkzaamheid niet gericht is op het behalen van winst.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.4'
    text: |-
      Een verklaring wordt geweigerd indien de beoogde bouw niet past in een onherroepelijk geworden plan voor
      ziekenhuisvoorzieningen, alsmede indien in de behoefte aan voorzieningen, waarop de aanvrage betrekking heeft, zal
      worden voorzien op grond van andere verklaringen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.5'
    text: |-
      Indien het algemeen belang dit vereist, kan Onze Minister bij het afgeven van de verklaring bepalen
      dat binnen een door hem te bepalen termijn een aanvraag om goedkeuring van stukken als bedoeld in
      [artikel 7, eerste lid, onder b of c][ref1], of om een vergunning als bedoeld in [artikel 6][ref2], niet in
      behandeling wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel6
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002753
        artikel: '6'
        paragraaf: '3'
  - number: '10.6'
    text: |-
      Bij het afgeven van een verklaring kan Onze Minister bepalen dat een programma van eisen voor de beoogde bouw moet
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.7'
    text: |-
      Een beschikking op een aanvraag om een verklaring wordt, indien het betreft een academisch ziekenhuis, genomen in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen. In dat geval wordt de beoogde bouw mede
      beoordeeld aan de hand van criteria met het oog op wetenschappelijk onderwijs en onderzoek.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '10.8'
    text: |-
      Onze Minister kan de verklaring in bijzondere gevallen onder beperkingen verlenen. In bijzondere gevallen kunnen
      aan de verklaring voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel10
  - number: '11.1'
    text: |-
      De bekendmaking van een beschikking, houdende weigering van een verklaring dan wel afgifte van een verklaring met
      toepassing van [artikel 10, vijfde en achtste lid][ref1], gaat vergezeld van een afschrift van het advies of de
      adviezen welke ter zake door gedeputeerde staten en het College bouw zijn uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: '11.2'
    text: Van de beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel11
  - number: '11.3'
    text: |-
      Op verzoek van belanghebbenden bij de beschikking wordt door gedeputeerde staten en het College bouw kennis gegeven
      van hun ter zake uitgebrachte advies.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel11
  - number: '12.1'
    text: |-
      Voor ziekenhuisvoorzieningen, behorende tot een door Onze Minister aangewezen categorie, treedt in de plaats
      van een verklaring van Onze Minister een verklaring van gedeputeerde staten van de provincie, waarin de
      ziekenhuisvoorziening waarop de aanvrage betrekking heeft, zich bevindt of bevinden zal.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel12
  - number: '12.2'
    text: |-
      Indien de beoogde bouw mede dienstbaar kan zijn ten behoeve van een andere provincie, plegen gedeputeerde staten,
      alvorens op de aanvrage te beslissen, overleg met gedeputeerde staten van de laatstbedoelde provincie.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel12
  - number: '12.3'
    text: |-
      Van de beschikking op een aanvraag om een verklaring wordt mededeling gedaan in de *Staatscourant*; tevens wordt
      van de beschikking mededeling gedaan door toezending van een afschrift aan Onze Minister, het College bouw en
      gedeputeerde staten waarmee omtrent de aanvraag overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel12
  - number: '12.4'
    text: |-
      Met betrekking tot een beschikking als in het derde lid bedoeld is [artikel 10, vierde en achtste lid][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      Een verklaring vervalt, indien voor de bouw van datgene waarop de verklaring betrekking heeft, niet de nodige
      stukken zijn ingediend als bedoeld in [artikel 7, eerste lid, onder ][ref1], of geen vergunning is aangevraagd
      binnen een door Onze Minister te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      Een verklaring vervalt mede, indien een weigering van een vergunning voor datgene waarop de verklaring betrekking
      heeft, onherroepelijk is geworden, alsmede indien de vergunning vervalt. Het College bouw kan bij de weigering van
      de vergunning bepalen dat de verklaring blijft gelden gedurende een door hem te bepalen termijn nadat die weigering
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel13
  - number: '13.3'
    text: |-
      Een verklaring kan worden ingetrokken, indien een plan onherroepelijk zodanig is gewijzigd, dat de beoogde bouw
      niet meer in dat plan past. Een zodanige beschikking wordt niet genomen dan nadat het College bouw en gedeputeerde
      staten zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel13
  - number: '15.1'
    text: |-
      Een vergunning kan uitsluitend worden verleend aan een rechtspersoon van wie mag worden aangenomen dat zijn
      werkzaamheid niet gericht is op het behalen van winst.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: '15.2'
    text: 'Een vergunning kan slechts worden geweigerd indien de beoogde bouw:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: 15.2.a
    text: |-
      tekortschiet uit het oogpunt van doelmatigheid, waaronder begrepen voor zover het betreft academische ziekenhuizen,
      doelmatigheid met het oog op wetenschappelijk onderwijs en onderzoek;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: 15.2.b
    text: voorzieningen omvat, die niet een noodzakelijk bestanddeel van de te bouwen ziekenhuisvoorziening vormen;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: 15.2.c
    text: kan leiden tot toepassing van tarieven die hoger zijn dan in het algemeen belang verantwoord is te achten.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: '15.3'
    text: |-
      De vergunning kan op de in het tweede lid, onder *b*, bedoelde grond niet worden geweigerd wegens bezwaren tegen
      datgene waarvan bij de aanvrage om de verklaring opgave is gedaan overeenkomstig de regelen, gesteld krachtens
      [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel8
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '8'
        paragraaf: '3'
  - number: '15.4'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden. Aan
      een vergunning is in elk geval het voorschrift verbonden dat de eindafrekening ter goedkeuring wordt voorgelegd aan
      het College bouw. De beperkingen en voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe beperkingen en
      voorschriften kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15
  - number: 15a.1
    text: |-
      Het College bouw stelt bouwmaatstaven vast, inhoudende een nadere omschrijving van de in
      [artikel 15, tweede lid][ref1], genoemde criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel15
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '15'
        paragraaf: '3'
  - number: 15a.2
    text: |-
      De bouwmaatstaven behoeven de goedkeuring van Onze Minister. Het College bouw zendt daartoe de vastgestelde
      bouwmaatstaven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
  - number: 15a.3
    text: Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
  - number: 15a.4
    text: |-
      Het besluit omtrent goedkeuring wordt binnen acht weken na verzending bekendgemaakt. Het nemen van een besluit
      omtrent goedkeuring kan eenmaal voor ten hoogste vier weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
  - number: 15a.5
    text: |-
      Indien binnen de in het vierde lid genoemde termijn geen besluit tot goedkeuring of verdaging, dan wel binnen
      de termijn waarvoor het besluit is verdaagd, geen besluit omtrent goedkeuring is genomen, wordt een besluit tot
      goedkeuring geacht te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
  - number: 15a.6
    text: |-
      De bouwmaatstaven liggen voor een ieder bij het College bouw ter inzage. Het College bouw doet van de
      terinzagelegging mededeling in de Staatscourant en in één of meer dag- of nieuwsbladen die landelijk worden
      verspreid.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel15a
  - number: '16.1'
    text: |-
      Van een beschikking, houdende weigering of verlening van een vergunning, wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel16
  - number: '16.2'
    text: |-
      Tevens wordt van de beschikking mededeling gedaan door toezending van een afschrift aan Onze Minister en aan
      gedeputeerde staten van de provincies die omtrent de verklaring advies hebben uitgebracht of deze hebben afgegeven.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel16
  - number: '17.1'
    text: |-
      Een vergunning vervalt, indien de bouw van datgene waarop de vergunning betrekking heeft niet is begonnen binnen
      een jaar en voltooid binnen vier jaren nadat de vergunning onherroepelijk is geworden. Onze Minister kan op verzoek
      van de houder der vergunning deze termijnen verlengen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel17
  - number: '17.2'
    text: |-
      Een vergunning vervalt door intrekking van de verklaring ingevolge [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel13
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '13'
        paragraaf: '3'
  - number: 17a.1
    text: |-
      Het bestuur van een ziekenhuisvoorziening dat voornemens is om gebouwen of terreinen, of delen daarvan, blijvend
      niet meer voor de ziekenhuisvoorziening te gebruiken, doet hiervan onverwijld mededeling aan het College sanering.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel17a
  - number: 17a.2
    text: |-
      Het College sanering kan binnen acht weken na ontvangst van de mededeling beslissen dat het bestuur van de
      ziekenhuisvoorziening de gebouwen of terreinen niet kan verhuren, vervreemden of aan enig beperkt recht onderwerpen
      zonder zijn goedkeuring. Daarbij kan het College sanering bepalen dat bij verkoop het boekresultaat wordt gestort
      in het Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel17a
  - number: 17a.3
    text: |-
      Een rechtshandeling die is verricht in strijd met dit artikel, is vernietigbaar. De vernietigbaarheid kan worden
      ingeroepen door het College sanering.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel17a
  - number: 18a.1
    text: 'Onze Minister kan bepalen:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.1.a
    text: dat een ziekenhuisvoorziening moet worden gesloten;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.1.b
    text: |-
      dat het aantal bedden of plaatsen in een ziekenhuisvoorziening moet worden verminderd met een door hem aan te geven
      aantal;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.1.c
    text: |-
      dat de uitoefening van door hem aan te geven medische specialismen in een ziekenhuisvoorziening moet worden
      verminderd met een door hem aan te geven aantal functie-eenheden dan wel dient te worden beëindigd, indien een en
      ander niet past in een plan voor ziekenhuisvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.2
    text: |-
      Alvorens hiertoe over te gaan, hoort Onze Minister het College bouw en gedeputeerde staten van de provincie
      waarin de ziekenhuisvoorziening zich bevindt; gedeputeerde staten geven aan het bestuur van de gemeente, waarin de
      voorziening zich bevindt, en aan bestuur en medewerkers van de betrokken ziekenhuisvoorziening de gelegenheid om
      binnen een door Onze Minister te bepalen termijn hun opmerkingen omtrent dit voornemen aan hen kenbaar te maken.
      Indien toepassing is gegeven aan [artikel 4, achtste lid][ref1], treedt Onze Minister voor de toepassing van het
      tweede zinsdeel van de eerste volzin in de plaats van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel4
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '4'
        paragraaf: '2'
  - number: 18a.3
    text: |-
      Onze minister handelt bij toepassing van de voorgaande leden in overeenstemming met Onze Minister van Onderwijs,
      Cultuur en Wetenschappen met betrekking tot academische ziekenhuizen, met Onze Minister van Defensie met
      betrekking tot militaire ziekenhuizen en met Onze Minister van Justitie met betrekking tot ziekenhuisvoorzieningen
      waar uitsluitend of overwegend patiënten worden opgenomen onder diens verantwoordelijkheid in het kader van de
      uitvoering van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.4
    text: |-
      De werking van de beschikking krachtens het eerste lid, wordt opgeschort tot drie maanden na het verstrijken van
      de beroepstermijn of, indien beroep is ingesteld, tot drie maanden nadat op het beroep is beslist, tenzij Onze
      Minister, gezien de aard van de maatregel, anders bepaalt. Onze Minister kan desgevraagd de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18a.5
    text: Het is verboden een ziekenhuisvoorziening te exploiteren in strijd met een beschikking krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18a
  - number: 18b.1
    text: |-
      Een ziekenhuisvoorziening wendt zich tot het College sanering binnen zes weken na het onherroepelijk worden van een
      beslissing tot:
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.1.a
    text: |-
      intrekking van een verklaring op grond van [artikel 13, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel13
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '13'
        paragraaf: '3'
  - number: 18b.1.b
    text: |-
      wijziging van beperkingen of voorschriften dan wel het stellen van nieuwe beperkingen of voorschriften op grond van
      [artikel 15, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel15
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '15'
        paragraaf: '3'
  - number: 18b.1.c
    text: |-
      beëindiging van de uitvoering van bijzondere medische verrichtingen of beëindiging van het gebruik van apparatuur
      op grond van [artikel 6, vijfde lid, van de Wet op bijzondere medische verrichtingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel6
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '6'
  - number: 18b.1.d
    text: |-
      sluiting van de ziekenhuisvoorziening dan wel vermindering van het aantal bedden of plaatsen van de
      ziekenhuisvoorziening of van het aantal functie-eenheden van een medisch specialisme dan wel de beëindiging van de
      uitoefening van een medisch specialisme op grond van [artikel 18a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18a
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 18a
        paragraaf: '5'
  - number: 18b.2
    text: |-
      Het College sanering stelt de financiële gevolgen van sanering vast ter zake van een beslissing als bedoeld in het
      eerste lid alsmede ter zake van de uitvoering van een voornemen als bedoeld in [artikel 17a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 17a
        paragraaf: '3'
  - number: 18b.3
    text: |-
      De in het tweede lid bedoelde vaststelling kan inhouden dat het College sanering subsidie verstrekt ter voorziening
      in de financiële gevolgen van de sanering.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.a
    text: hetgeen onder financiële gevolgen van sanering moet worden verstaan;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.b
    text: de hoogte, de opbouw en wijze van berekening van de subsidie;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.c
    text: de aanvraag van de subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.d
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.e
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.f
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.4.g
    text: de betaling en terugvordering van de subsidie en het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.5
    text: |-
      In de in het vierde lid bedoelde algemene maatregel van bestuur kan worden bepaald dat het College sanering
      nadere regels stelt over daarbij aangewezen onderwerpen. De door het College sanering gestelde regels behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.6
    text: |-
      Een beschikking tot subsidievaststelling wordt niet genomen dan nadat het College voor zorgverzekeringen, genoemd
      in [artikel 1a van de Ziekenfondswet][ref1] is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: 18b.7
    text: |-
      De betaling van de subsidie of het voorschot geschiedt door het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1] ten laste van het Algemeen Fonds Bijzondere Ziektekosten. Onze Minister
      kan hieromtrent nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: 18b.8
    text: |-
      Indien het College sanering vaststelt dat de financiële gevolgen van de sanering een positief saldo voor de
      betrokken ziekenhuisvoorziening inhouden, is die ziekenhuisvoorziening verplicht dat saldo te storten in het
      Algemeen Fonds Bijzondere Ziektekosten. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het vierde
      lid, kunnen hieromtrent regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.9
    text: Van besluiten als bedoeld in het tweede lid doet het College sanering mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.10
    text: |-
      Onze Minister doet jaarlijks verslag aan de Staten-Generaal omtrent de door het College sanering ingevolge het
      tweede lid genomen besluiten.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: 18b.11
    text: |-
      Het College sanering is tevens belast met het toezicht op de sanering. Bij de algemene maatregel van bestuur,
      bedoeld in het vierde lid, kunnen hieromtrent regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel18b
  - number: '19'
    text: |-
      Tegen een beschikking als bedoeld in de [artikelen 6][ref1], [7][ref2], [9, tweede en derde lid][ref3],
      [10][ref4], [12][ref5], [13, derde lid][ref6], [15, vierde lid][ref7], [17a, tweede lid][ref8], [18][ref9], en
      [18b, zesde lid][ref10], kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad
      van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002753#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002753#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0002753#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002753#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0002753#Artikel15
      [ref8]: https://wetten.overheid.nl/BWBR0002753#Artikel17a
      [ref9]: https://wetten.overheid.nl/BWBR0002753#Artikel18a
      [ref10]: https://wetten.overheid.nl/BWBR0002753#Artikel18b
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002753
        artikel: '9'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002753
        artikel: '12'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0002753
        artikel: '13'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0002753
        artikel: '15'
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0002753
        artikel: 17a
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0002753
        artikel: 18a
        paragraaf: '5'
      - id: ref10
        bwb_id: BWBR0002753
        artikel: 18b
        paragraaf: '6'
  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid en andere deskundigen ter zake van
      ziekenhuisvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel20
  - number: '20.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel20
  - number: '21'
    text: |-
      De in [artikel 20][ref1] bedoelde personen beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '20'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '22.1'
    text: |-
      Ieder die bij de exploitatie van een ziekenhuisvoorziening betrokken is, is verplicht aan Onze Minister de
      documentatiegegevens te verstrekken, welke van belang zijn voor een goede uitvoering van deze wet, behoudens wat
      betreft de gegevens betreffende de bouwkundige en functionele staat van de ziekenhuisvoorziening, welke gegevens
      aan het College bouw worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel22
  - number: '22.2'
    text: Bij algemene maatregel van bestuur kunnen regelen hieromtrent worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel22
  - number: '23.1'
    text: |-
      Ieder die een ziekenhuisvoorziening beheert, is verplicht overeenkomstig de door Onze Minister te stellen regelen
      de begroting, de balans en de winst- en verliesrekening alsmede de daarbij behorende toelichting met betrekking
      tot deze ziekenhuisvoorziening vast te stellen en volledige afschriften hiervan ter inzage voor een ieder, neder te
      leggen ter plaatse, door Onze Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel23
  - number: '23.2'
    text: |-
      Ten aanzien van academische ziekenhuizen, van militaire ziekenhuizen en van ziekenhuisvoorzieningen, toebehorende
      aan publiekrechtelijke lichamen kan Onze Minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschappen, van Defensie onderscheidenlijk van Binnenlandse Zaken, regelen stellen die afwijken van de in het
      eerste lid bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel23
  - number: '28'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel28
  - number: '29.1'
    text: 'Voor zover nog geen plan voor ziekenhuisvoorzieningen is vastgesteld, wordt gelezen:'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29.1.a
    text: 'in artikel 6, derde lid, in plaats van de komma en het daarna gestelde: een punt;'
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29.1.b
    text: |-
      in de artikelen 7, eerste lid, onder *a*, en 10, vijfde lid, in plaats van "de beoogde bouw past in een plan voor
      ziekenhuisvoorzieningen": "aan de beoogde bouw behoefte bestaat";
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29.1.c
    text: |-
      in artikel 10, vierde lid, in plaats van "de beoogde bouw niet past in een onherroepelijk geworden plan voor
      ziekenhuisvoorzieningen": "aan de beoogde bouw geen behoefte bestaat";
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29.1.d
    text: |-
      in artikel 13, derde lid, in plaats van "een plan onherroepelijk zodanig is gewijzigd, dat de beoogde bouw niet
      meer in dat plan past": "aan de beoogde bouw geen behoefte meer blijkt te bestaan.";
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29.1.e
    text: |-
      in artikel 18*a*, eerste lid, in plaats van "in een plan voor ziekenhuisvoorzieningen": "in een krachtens
      [artikel 3, eerste lid][ref1], vastgestelde beleidsregel".


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel3
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '3'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Nadat een plan onherroepelijk is vastgesteld, kan een verklaring afgegeven overeenkomstig het eerste lid, onder
      *b*, worden ingetrokken, indien de in de verklaring beoogde bouw niet in dat plan past.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29
  - number: 29a
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College bouw dan wel het College sanering uit de wet voortvloeiende verplichtingen
      niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29a
  - number: 29b
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de
      beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het
      College bouw en het College sanering.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel29b
  - number: '30'
    text: Deze wet kan worden aangehaald als "Wet ziekenhuisvoorzieningen".
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel30
  - number: '31'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2001-09-01#Artikel31
