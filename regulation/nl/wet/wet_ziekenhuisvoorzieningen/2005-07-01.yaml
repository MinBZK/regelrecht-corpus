  - number: '2'
    text: |-
      1 Er is een College bouw ziekenhuisvoorzieningen, dat rechtspersoonlijkheid bezit. Het College bouw is gevestigd in
      een door Onze Minister te bepalen plaats.

      2 Het College bouw is belast met de taken die hem bij of krachtens deze wet of een andere wet zijn opgedragen.

      3 Het College bouw wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2
  - number: 2a
    text: |-
      1 Het College bouw bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.

      2 Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op
      grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College alsmede op grond van
      maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in
      de Staatscourant.

      3 Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College.

      4 Bij de samenstelling van het College wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende
      tot etnische of culturele minderheidsgroepen.

      5 De leden worden benoemd voor ten hoogste vier jaar.

      Herbenoeming kan twee maal en telkens voor ten hoogste vier jaar plaatsvinden.

      6 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Minister.

      7 Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2a
  - number: 2b
    text: |-
      1 Het College bouw stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld omtrent de wijze
      waarop besluiten worden voorbereid, genomen en uitgevoerd.

      2 In het bestuursreglement kan het College voorzien in de instelling van commissies, in welk geval in het
      bestuursreglement tevens regels worden gesteld omtrent de samenstelling en taken van de ingestelde commissie. In
      commissies kunnen ook personen deelnemen die geen lid van het College zijn.

      3 Vergaderingen van het College en van commissies van het College zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.

      4 Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2b
  - number: 2c
    text: |-
      1 Het College bouw benoemt, schorst en ontslaat het personeel.

      2 Het College bouw stelt met betrekking tot de arbeidsvoorwaarden van het personeel regels vast.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2c
  - number: 2d
    text: |-
      Het College bouw zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende kalenderjaar.
      Het werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan beide kamers
      der Staten-Generaal. Het College stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2d
  - number: 2e
    text: |-
      Het College bouw zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten voor het
      volgende kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2e
  - number: 2f
    text: |-
      Het College bouw zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder, alsmede
      gegevens omtrent de uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze Minister zendt het verslag
      aan beide kamers der Staten-Generaal. Het College stelt het verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2f
  - number: 2g
    text: |-
      1 Het College bouw brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over zijn
      beheerskosten over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid
      en de rechtmatigheid van de ontvangsten en de uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.

      2 Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College stelt het financieel verslag algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2h
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2h
  - number: 2i
    text: |-
      De beheerskosten van het College bouw komen tot ten hoogste het in de begroting aangegeven bedrag ten laste van het
      Algemeen Fonds Bijzondere Ziektekosten, bedoeld in [artikel 38 van de Wet financiering volksverzekeringen][ref1].
      Op grond van de begroting worden maandelijks uit het Algemeen Fonds Bijzondere Ziektekosten voorschotten verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel38
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2i
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '38'
  - number: 2j
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College bouw.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2j
  - number: 2k
    text: |-
      1 Een besluit van het College bouw kan bij koninklijk besluit worden vernietigd.

      2 Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2k
  - number: 2l
    text: |-
      1 Het College bouw:

      a. rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid van voorgenomen beleid met
      betrekking tot ziekenhuisvoorzieningen;

      b. geeft aan de provincies op hun verzoek inlichtingen met betrekking tot de bouwkundige en functionele staat van
      de ziekenhuisvoorzieningen;

      c. geeft aan Onze Minister desgevraagd advies over aanvragen om een verklaring als bedoeld in
      [artikel 7, eerste lid, onder a][ref1].

      2 Het College signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het terrein van de
      infrastructuur van de gezondheidszorg.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel2l
