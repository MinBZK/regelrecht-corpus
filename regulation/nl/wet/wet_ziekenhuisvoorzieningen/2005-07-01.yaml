        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Over een aanvrage om een verklaring wint Onze Minister het advies in van gedeputeerde staten van de provincie
      waarin de ziekenhuisvoorziening waarop de aanvrage betrekking heeft, zich bevindt of bevinden zal, alsmede, voor
      zover daartoe naar zijn oordeel gegronde redenen bestaan, van gedeputeerde staten van andere provinciën en het
      College bouw.

      2 Gedeputeerde staten en het College bouw zenden hun advies aan Onze Minister.

      3 Een verklaring kan uitsluitend worden afgegeven aan een rechtspersoon van wie mag worden aangenomen dat zijn
      werkzaamheid niet gericht is op het behalen van winst.

      4 Een verklaring wordt geweigerd indien de beoogde bouw niet past in een onherroepelijk geworden plan voor
      ziekenhuisvoorzieningen, alsmede indien in de behoefte aan voorzieningen, waarop de aanvrage betrekking heeft, zal
      worden voorzien op grond van andere verklaringen.

      5 Indien het algemeen belang dit vereist, kan Onze Minister bij het afgeven van de verklaring bepalen
      dat binnen een door hem te bepalen termijn een aanvraag om goedkeuring van stukken als bedoeld in
      [artikel 7, eerste lid, onder b of c][ref1], of om een vergunning als bedoeld in [artikel 6][ref2], niet in
      behandeling wordt genomen.

      6 Bij het afgeven van een verklaring kan Onze Minister bepalen dat een programma van eisen voor de beoogde bouw
      moet worden ingediend.

      7 Een beschikking op een aanvraag om een verklaring wordt, indien het betreft een academisch ziekenhuis, genomen in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen. In dat geval wordt de beoogde bouw mede
      beoordeeld aan de hand van criteria met het oog op wetenschappelijk onderwijs en onderzoek.

      8 Onze Minister kan de verklaring in bijzondere gevallen onder beperkingen verlenen. In bijzondere gevallen kunnen
      aan de verklaring voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel6
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel10
