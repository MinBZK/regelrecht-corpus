  - number: '8'
    text: |-
      1 Onze Minister stelt regelen, inhoudende welke gegevens dienen te worden verstrekt bij de aanvrage om
      een vergunning of een verklaring en bij de toezending van een programma van eisen, een schetsontwerp en
      bestedingsgerede stukken als bedoeld in [artikel 7][ref1]. Hij kan tevens regelen stellen betreffende de inhoud en
      de wijze van indiening hiervan.

      2 Onze Minister bepaalt de termijn waarbinnen adviezen moeten worden uitgebracht en op aanvragen moet worden
      beslist.

      3 Besluiten krachtens het eerste of tweede lid worden in de *Staatscourant* bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel8
