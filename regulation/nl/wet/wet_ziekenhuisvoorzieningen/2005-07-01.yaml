  - number: '11'
    text: |-
      1 De bekendmaking van een beschikking, houdende weigering van een verklaring dan wel afgifte van een verklaring
      met toepassing van [artikel 10, vijfde en achtste lid][ref1], gaat vergezeld van een afschrift van het advies of de
      adviezen welke ter zake door gedeputeerde staten en het College bouw zijn uitgebracht.

      2 Van de beschikking wordt mededeling gedaan in de *Staatscourant*.

      3 Op verzoek van belanghebbenden bij de beschikking wordt door gedeputeerde staten en het College bouw kennis
      gegeven van hun ter zake uitgebrachte advies.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel10
