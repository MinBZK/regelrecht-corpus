  - number: 5a
    text: |-
      Onze minister, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen, biedt na overleg
      met de besturen van provincies periodiek aan de Tweede Kamer der Staten-Generaal een overzicht aan van zijn
      beleidsvoornemens met betrekking tot functies, capaciteit, samenhang en spreiding van de voorzieningen in
      academische ziekenhuizen. Hierbij wordt het bijzondere karakter van deze ziekenhuizen zoals vastgelegd in artikel
      150a van de Wet op het wetenschappelijk onderwijs in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel5a
  - number: '6'
    text: |-
      1 Het is verboden:

      a. een ziekenhuisvoorziening te bouwen zonder vergunning van het College bouw;

      b. een ziekenhuisvoorziening te exploiteren, voor zover ten aanzien daarvan is gehandeld in strijd met het onder
      *a* bepaalde.

      2 Het verbod geldt niet voor uitbreidingen of verbouwingen van een door Onze Minister te bepalen aard, waarvan de
      kosten een door hem te bepalen bedrag niet te boven gaan, mits daarvan tevoren kennis is gegeven aan het College
      bouw. Het desbetreffende besluit wordt in de *Staatscourant* bekend gemaakt.

      3 Het verbod geldt mede niet voor de bouw van militaire ziekenhuizen, voor zover deze in een plan voor
      ziekenhuisvoorzieningen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel6
  - number: '7'
    text: |-
      1 Een aanvrage om een vergunning, als bedoeld in [artikel 6][ref1], wordt niet in behandeling genomen, indien niet
      zijn afgegeven:

      a. een onherroepelijk geworden verklaring van Onze Minister waaruit blijkt dat de beoogde bouw past in een plan
      voor ziekenhuisvoorzieningen, behoudens voor zover een zodanige verklaring op grond van [artikel 9][ref2] niet
      vereist is,

      b. een goedkeuring door het College bouw van het programma van eisen voor de beoogde bouw, indien dit is
      voorgeschreven op grond van [artikel 9, derde lid][ref3] of [artikel 10, zesde lid][ref4],

      c. een goedkeuring door het College bouw van het schetsontwerp voor de beoogde bouw.

      2 De aanvrage om een vergunning dient voorts vergezeld te gaan van bestedingsgerede stukken voor de beoogde bouw,
      indien dit door het College bouw is voorgeschreven bij de goedkeuring van het schetsontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel9
