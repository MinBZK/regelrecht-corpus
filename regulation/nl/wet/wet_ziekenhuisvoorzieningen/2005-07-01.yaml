preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de volksgezondheid regelen te stellen
    ter bevordering van doelmatige voorzieningen ter zake van ziekenhuizen en andere inrichtingen voor gezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. het College bouw: het College bouw ziekenhuisvoorzieningen, bedoeld in [artikel 2][ref1];

      c. ziekenhuisvoorziening: inrichting voor gezondheidszorg, behorende tot een bij of krachtens algemene maatregel
      van bestuur aangewezen categorie, of een deel van zodanige inrichting, alsmede een met zodanige inrichting
      verbonden of ten behoeve van een of meer inrichtingen fungerende bouwkundige voorziening;

      d. academisch ziekenhuis: een ziekenhuisvoorziening die in de zin van de Wet op het wetenschappelijk onderwijs een
      academisch ziekenhuis is;

      e. bed of plaats: capaciteitsmaat waarmee wordt uitgedrukt het aantal patiënten dat gelijktijdig in het kader van
      een klinische behandeling of verpleging in een ziekenhuisvoorziening kan worden opgenomen;

      f. functie-eenheid: capaciteitsmaat voor de uitoefening van medisch-specialistische functies, overeenkomend met de
      gemiddelde jaarproductie van een medisch specialist met een volledige werkweek.

      2 De voordracht tot een algemene maatregel als bedoeld in het eerste lid wordt Ons gedaan door Onze Minister
      tezamen met Onze Ministers wie het mede aangaat.

      3 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder een ziekenhuisvoorziening niet
      verstaan:

      a. een inrichting voor de opname van gedetineerden in de zin van de
      [Penitentiaire beginselenwet][ref2], een inrichting voor de opname van verpleegden in de zin van de
      [Beginselenwet verpleging ter beschikking gestelden][ref3] en een inrichting voor de opname van jeugdigen in de zin
      van de [Beginselenwet justitiële jeugdinrichtingen][ref4];

      b.

      c. voorzieningen in het kader van de voorbereiding voor en in het geval van oorlog, oorlogsgevaar, daaraan verwante
      of daarmede verband houdende buitengewone omstandigheden;

      d. militaire verblijven als een ziekenboeg, een kwartierziekenverblijf en een garnizoensziekenverblijf.

      4 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder het bouwen of de bouw van een
      ziekenhuisvoorziening mede verstaan het uitbreiden, verbouwen of vervangen van een ziekenhuisvoorziening, het
      als ziekenhuisvoorziening inrichten of in gebruik nemen van een gebouw of een gedeelte van een gebouw, alsmede
      het wijziging brengen in de bestemming van een ziekenhuisvoorziening. Onze Minister kan deze begrippen nader
      omschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009709
      [ref3]: https://wetten.overheid.nl/BWBR0008765
