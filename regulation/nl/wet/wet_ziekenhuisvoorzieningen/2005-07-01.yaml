  - number: '3'
    text: |-
      1 Onze Minister stelt beleidsregels vast over het ontwerpen van plannen voor ziekenhuisvoorzieningen.

      2 Deze beleidsregels kunnen, behalve op behoeftecriteria en op de samenhang zowel onderling als tussen
      ziekenhuisvoorzieningen en andere voorzieningen, onder meer betrekking hebben op functie-omschrijvingen en
      gebiedsindeling.

      3 Voor zover deze beleidsregels betrekking hebben op academische ziekenhuizen geschiedt de vaststelling in
      overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen. Voor zover deze beleidsregels betrekking
      hebben op de wijze waarop in een plan samenhang wordt aangebracht tussen de betrokken ziekenhuisvoorzieningen en
      de hiermede samenhangende voorzieningen op het terrein van maatschappelijke dienstverlening en andere verwante
      terreinen, worden deze beleidsregels gesteld door Onze Minister en Onze Ministers wie het mede aangaat.

      4 Bij deze beleidsregels doet Onze minister in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschappen mededeling van de voorgenomen voorzieningen met betrekking tot wetenschappelijk onderwijs en
      onderzoek voor zover deze van invloed zijn op de behoefte aan academische ziekenhuizen, en in overeenstemming
      met Onze Minister van Defensie mededeling van de voorgenomen ziekenhuisvoorzieningen met betrekking tot militaire
      ziekenhuizen. Daarbij wordt tevens in overeenstemming met Onze Minister van Justitie mededeling gedaan van de
      omvang van de behoefte voor het opnemen van patiënten onder verantwoordelijkheid van Onze Minister van Justitie in
      het kader van de uitvoering van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel3
  - number: 3a
    text: |-
      1 Onze Minister stelt een plan vast voor ziekenhuisvoorzieningen waarin de behoefte aan de desbetreffende
      ziekenhuisvoorzieningen in het aangegeven gebied is neergelegd, en omschreven wordt welke aanvullingen of
      veranderingen in het reeds aanwezige bestel nodig zijn om op een doelmatige wijze in die behoefte te voorzien.
      Voor zover dit betrekking heeft op academische ziekenhuizen of militaire ziekenhuizen, stelt Onze Minister het
      plan vast in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap onderscheidenlijk van Defensie;
      voorzover dit betrekking heeft op inrichtingen waar uitsluitend of overwegend patiënten worden opgenomen onder
      verantwoordelijkheid van Onze Minister van Justitie in het kader van de uitvoering van een rechterlijke uitspraak,
      in overeenstemming met Onze Minister van Justitie.

      2 Tegen een besluit als bedoeld in het eerste lid kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.

      3 Een plan voor ziekenhuisvoorzieningen wordt, behoudens in bijzondere omstandigheden, niet herzien binnen twee
      jaar na de vaststelling.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel3a
  - number: 3b
    text: |-
      1 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met
      dien verstande dat gedeputeerde staten:

      a. belast zijn met de opstelling van het ontwerp;

      b. toepassing geven aan die afdeling.

      2 Indien een plan voor ziekenhuisvoorzieningen betrekking zal hebben op een gebied dat tot meer provincies behoort,
      stellen gedeputeerde staten van de betrokken provincies een gezamenlijk ontwerp van plan op. Voor zover naar het
      oordeel van gedeputeerde staten de behoefte aan ziekenhuisvoorzieningen in hun provincie samenhangt met de behoefte
      in een andere provincie, plegen zij omtrent de inhoud van het te ontwerpen plan overleg met gedeputeerde staten van
      die provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4'
    text: |-
      1 Onze Minister geeft aan provinciale staten van een of meer provinciën aanwijzingen voor het ontwerpen van
      plannen voor ziekenhuisvoorzieningen. Een zodanige aanwijzing kan strekken tot het ontwerpen van een plan ter zake
      van alle ziekenhuisvoorzieningen dan wel ziekenhuisvoorzieningen behorende tot een bij de aanwijzing aangegeven
      categorie, in een aangegeven gebied dat het geheel of een gedeelte van een of meer provinciën kan omvatten. Voor
      zover de aanwijzingen strekken tot het ontwerpen van plannen die betrekking hebben op academische ziekenhuizen,
      worden zij gegeven in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen waarbij het laatst
      vastgestelde overzicht, bedoeld in [artikel 5][ref1], en voorzover betrekking hebbend op de [artikelen 3][ref2],
      [3a][ref3], [3b][ref4], [4][ref5] en [5][ref6], in acht wordt genomen. Onze Minister stelt een termijn vast
      waarbinnen het ontworpen plan aan hem dient te zijn voorgelegd. Onze Minister kan deze termijn op verzoek van
      provinciale staten verlengen.

      2 Gedeputeerde staten zenden aan Onze Minister en het College bouw het ontworpen plan voor ziekenhuisvoorzieningen
      toe, vergezeld van de hierover naar voren gebrachte zienswijzen en de inzichten uit de vergadering van provinciale
      staten hieromtrent.

      3 Het College bouw breng aan Onze Minister op diens verzoek binnen een door deze vast te stellen termijn omtrent
      het ontworpen plan voor ziekenhuisvoorzieningen advies uit.


