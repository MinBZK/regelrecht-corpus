        artikel: '7'
        paragraaf: '3'
  - number: 2m
    text: |-
      1 Er is een College sanering ziekenhuisvoorzieningen, verder te noemen: het College sanering, dat
      rechtspersoonlijkheid bezit. Het College sanering is gevestigd in een door Onze Minister te bepalen plaats.

      2 Het College sanering is belast met de taken die hem bij of krachtens deze wet, de Wet ambulancevervoer of een
      andere wet zijn opgedragen.

      3 De [artikelen 2a][ref1] tot en met [2k][ref2], met uitzondering van [artikel 2d][ref3], zijn ten aanzien van het
      College sanering van overeenkomstige toepassing.


