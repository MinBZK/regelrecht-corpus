        paragraaf: '3'
  - number: '9'
    text: |-
      1 Een verklaring als bedoeld in [artikel 7, eerste lid, onder ][ref1], is niet vereist voor de beoogde bouw van
      ziekenhuisvoorzieningen, behorende tot een door Onze Minister aangewezen categorie.

      2 Onze Minister kan in zeer bijzondere gevallen waarin gewichtige belangen daartoe aanleiding geven, bepalen dat
      een verklaring niet vereist is. Alvorens hiertoe over te gaan wint Onze Minister het advies in van het College
      bouw en van gedeputeerde staten, bedoeld in [artikel 10, eerste lid][ref2]. De artikelen 11 en 13 zijn van
      overeenkomstige toepassing.

      3 Bij de toepassing van het eerste of tweede lid kan Onze Minister bepalen dat een programma van eisen voor de
      beoogde bouw moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel9
