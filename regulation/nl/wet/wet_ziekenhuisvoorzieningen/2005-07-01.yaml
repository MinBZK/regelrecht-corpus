        paragraaf: '3'
  - number: '12'
    text: |-
      1 Voor ziekenhuisvoorzieningen, behorende tot een door Onze Minister aangewezen categorie, treedt in de
      plaats van een verklaring van Onze Minister een verklaring van gedeputeerde staten van de provincie, waarin de
      ziekenhuisvoorziening waarop de aanvrage betrekking heeft, zich bevindt of bevinden zal.

      2 Indien de beoogde bouw mede dienstbaar kan zijn ten behoeve van een andere provincie, plegen gedeputeerde staten,
      alvorens op de aanvrage te beslissen, overleg met gedeputeerde staten van de laatstbedoelde provincie.

      3 Van de beschikking op een aanvraag om een verklaring wordt mededeling gedaan in de *Staatscourant*; tevens wordt
      van de beschikking mededeling gedaan door toezending van een afschrift aan Onze Minister, het College bouw en
      gedeputeerde staten waarmee omtrent de aanvraag overleg is gepleegd.

      4 Met betrekking tot een beschikking als in het derde lid bedoeld is [artikel 10, vierde en achtste lid][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel10
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '10'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 Een verklaring vervalt, indien voor de bouw van datgene waarop de verklaring betrekking heeft, niet de nodige
      stukken zijn ingediend als bedoeld in [artikel 7, eerste lid, onder ][ref1], of geen vergunning is aangevraagd
      binnen een door Onze Minister te bepalen termijn.

      2 Een verklaring vervalt mede, indien een weigering van een vergunning voor datgene waarop de verklaring betrekking
      heeft, onherroepelijk is geworden, alsmede indien de vergunning vervalt. Het College bouw kan bij de weigering van
      de vergunning bepalen dat de verklaring blijft gelden gedurende een door hem te bepalen termijn nadat die weigering
      onherroepelijk is geworden.

      3 Een verklaring kan worden ingetrokken, indien een plan onherroepelijk zodanig is gewijzigd, dat de beoogde bouw
      niet meer in dat plan past. Een zodanige beschikking wordt niet genomen dan nadat het College bouw en gedeputeerde
      staten zijn gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel7
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '7'
        paragraaf: '3'
  - number: '15'
    text: |-
      1 Een vergunning kan uitsluitend worden verleend aan een rechtspersoon van wie mag worden aangenomen dat zijn
      werkzaamheid niet gericht is op het behalen van winst.

      2 Een vergunning kan slechts worden geweigerd indien de beoogde bouw:

      a. tekortschiet uit het oogpunt van doelmatigheid, waaronder begrepen voor zover het betreft academische
      ziekenhuizen, doelmatigheid met het oog op wetenschappelijk onderwijs en onderzoek;

      b. voorzieningen omvat, die niet een noodzakelijk bestanddeel van de te bouwen ziekenhuisvoorziening vormen;

      c. kan leiden tot toepassing van tarieven die hoger zijn dan in het algemeen belang verantwoord is te achten.

      3 De vergunning kan op de in het tweede lid, onder *b*, bedoelde grond niet worden geweigerd wegens bezwaren tegen
      datgene waarvan bij de aanvrage om de verklaring opgave is gedaan overeenkomstig de regelen, gesteld krachtens
      [artikel 8, eerste lid][ref1].

      4 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
      Aan een vergunning is in elk geval het voorschrift verbonden dat de eindafrekening ter goedkeuring wordt voorgelegd
      aan het College bouw. De beperkingen en voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe beperkingen
      en voorschriften kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel8
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '8'
        paragraaf: '3'
  - number: 15a
    text: |-
      1 Het College bouw stelt bouwmaatstaven vast, inhoudende een nadere omschrijving van de in
      [artikel 15, tweede lid][ref1], genoemde criteria.

      2 De bouwmaatstaven behoeven de goedkeuring van Onze Minister. Het College bouw zendt daartoe de vastgestelde
      bouwmaatstaven aan Onze Minister.

      3 Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.

      4 Het besluit omtrent goedkeuring wordt binnen acht weken na verzending bekendgemaakt. Het nemen van een besluit
      omtrent goedkeuring kan eenmaal voor ten hoogste vier weken worden verdaagd.

      5 Indien binnen de in het vierde lid genoemde termijn geen besluit tot goedkeuring of verdaging, dan wel binnen
      de termijn waarvoor het besluit is verdaagd, geen besluit omtrent goedkeuring is genomen, wordt een besluit tot
      goedkeuring geacht te zijn genomen.

      6 De bouwmaatstaven liggen voor een ieder bij het College bouw ter inzage. Het College bouw doet van de
      terinzagelegging mededeling in de Staatscourant en in één of meer dag- of nieuwsbladen die landelijk worden
      verspreid.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel15
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '15'
        paragraaf: '3'
  - number: '16'
    text: |-
      1 Van een beschikking, houdende weigering of verlening van een vergunning, wordt mededeling gedaan in de
      Staatscourant.

      2 Tevens wordt van de beschikking mededeling gedaan door toezending van een afschrift aan Onze Minister en aan
      gedeputeerde staten van de provincies die omtrent de verklaring advies hebben uitgebracht of deze hebben afgegeven.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel16
  - number: '17'
    text: |-
      1 Een vergunning vervalt, indien de bouw van datgene waarop de vergunning betrekking heeft niet is begonnen binnen
      een jaar en voltooid binnen vier jaren nadat de vergunning onherroepelijk is geworden. Onze Minister kan op verzoek
      van de houder der vergunning deze termijnen verlengen.

      2 Een vergunning vervalt door intrekking van de verklaring ingevolge [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel13
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '13'
        paragraaf: '3'
  - number: 17a
    text: |-
      1 Het bestuur van een ziekenhuisvoorziening dat voornemens is om gebouwen of terreinen, of delen daarvan, blijvend
      niet meer voor de ziekenhuisvoorziening te gebruiken, doet hiervan onverwijld mededeling aan het College sanering.

      2 Het College sanering kan binnen acht weken na ontvangst van de mededeling beslissen dat het bestuur van de
      ziekenhuisvoorziening de gebouwen of terreinen niet kan verhuren, vervreemden of aan enig beperkt recht onderwerpen
      zonder zijn goedkeuring. Daarbij kan het College sanering bepalen dat bij verkoop het boekresultaat wordt gestort
      in het Algemeen Fonds Bijzondere Ziektekosten.

      3 Een rechtshandeling die is verricht in strijd met dit artikel, is vernietigbaar. De vernietigbaarheid kan worden
      ingeroepen door het College sanering.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel17a
  - number: 18a
    text: |-
      1 Onze Minister kan bepalen:

      a. dat een ziekenhuisvoorziening moet worden gesloten;

      b. dat het aantal bedden of plaatsen in een ziekenhuisvoorziening moet worden verminderd met een door hem aan te
      geven aantal;

      c. dat de uitoefening van door hem aan te geven medische specialismen in een ziekenhuisvoorziening moet worden
      verminderd met een door hem aan te geven aantal functie-eenheden dan wel dient te worden beëindigd, indien een en
      ander niet past in een plan voor ziekenhuisvoorzieningen.

      2 Alvorens hiertoe over te gaan, hoort Onze Minister het College bouw en gedeputeerde staten van de provincie
      waarin de ziekenhuisvoorziening zich bevindt; gedeputeerde staten geven aan het bestuur van de gemeente, waarin de
      voorziening zich bevindt, en aan bestuur en medewerkers van de betrokken ziekenhuisvoorziening de gelegenheid om
      binnen een door Onze Minister te bepalen termijn hun opmerkingen omtrent dit voornemen aan hen kenbaar te maken.

      3 Onze minister handelt bij toepassing van de voorgaande leden in overeenstemming met Onze Minister van Onderwijs,
      Cultuur en Wetenschappen met betrekking tot academische ziekenhuizen, met Onze Minister van Defensie met
      betrekking tot militaire ziekenhuizen en met Onze Minister van Justitie met betrekking tot ziekenhuisvoorzieningen
      waar uitsluitend of overwegend patiënten worden opgenomen onder diens verantwoordelijkheid in het kader van de
      uitvoering van een rechterlijke uitspraak.

      4 De werking van de beschikking krachtens het eerste lid, wordt opgeschort tot drie maanden na het verstrijken
      van de beroepstermijn of, indien beroep is ingesteld, tot drie maanden nadat op het beroep is beslist, tenzij Onze
      Minister, gezien de aard van de maatregel, anders bepaalt. Onze Minister kan desgevraagd de termijn verlengen.

      5 Het is verboden een ziekenhuisvoorziening te exploiteren in strijd met een beschikking krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002753/2005-07-01#Artikel18a
  - number: 18b
    text: |-
      1 Een ziekenhuisvoorziening wendt zich tot het College sanering binnen zes weken na het onherroepelijk worden van
      een beslissing tot:

      a. intrekking van een verklaring op grond van [artikel 13, derde lid][ref1];

      b. wijziging van beperkingen of voorschriften dan wel het stellen van nieuwe beperkingen of voorschriften op grond
      van [artikel 15, vierde lid][ref2];

      c. beëindiging van de uitvoering van bijzondere medische verrichtingen of beëindiging van het gebruik van
      apparatuur op grond van [artikel 6, vijfde lid, van de Wet op bijzondere medische verrichtingen][ref3];

      d. sluiting van de ziekenhuisvoorziening dan wel vermindering van het aantal bedden of plaatsen van de
      ziekenhuisvoorziening of van het aantal functie-eenheden van een medisch specialisme dan wel de beëindiging van de
      uitoefening van een medisch specialisme op grond van [artikel 18a, eerste lid][ref4].

      2 Het College sanering stelt de financiële gevolgen van sanering vast ter zake van een beslissing als bedoeld in
      het eerste lid alsmede ter zake van de uitvoering van een voornemen als bedoeld in [artikel 17a][ref5].

      3 De in het tweede lid bedoelde vaststelling kan inhouden dat het College sanering subsidie verstrekt ter
      voorziening in de financiële gevolgen van de sanering.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. hetgeen onder financiële gevolgen van sanering moet worden verstaan;

      b. de hoogte, de opbouw en wijze van berekening van de subsidie;

      c. de aanvraag van de subsidie en de besluitvorming daarover;

      d. de voorwaarden waaronder de subsidie wordt verleend;

      e. de verplichtingen van de subsidie-ontvanger;

      f. de vaststelling van de subsidie;

      g. de betaling en terugvordering van de subsidie en het verlenen van voorschotten.

      5 In de in het vierde lid bedoelde algemene maatregel van bestuur kan worden bepaald dat het College sanering
      nadere regels stelt over daarbij aangewezen onderwerpen. De door het College sanering gestelde regels behoeven de
      goedkeuring van Onze Minister.

      6 Een beschikking tot subsidievaststelling wordt niet genomen dan nadat het College voor zorgverzekeringen, genoemd
      in [artikel 1a van de Ziekenfondswet][ref6] is gehoord.

      7 De betaling van de subsidie of het voorschot geschiedt door het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref7] ten laste van het Algemeen Fonds Bijzondere Ziektekosten. Onze Minister
      kan hieromtrent nadere regels stellen.

      8 Indien het College sanering vaststelt dat de financiële gevolgen van de sanering een positief saldo voor de
      betrokken ziekenhuisvoorziening inhouden, is die ziekenhuisvoorziening verplicht dat saldo te storten in het
      Algemeen Fonds Bijzondere Ziektekosten. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het vierde
      lid, kunnen hieromtrent regels worden gesteld.

      9 Van besluiten als bedoeld in het tweede lid doet het College sanering mededeling aan Onze Minister.

      10 Onze Minister doet jaarlijks verslag aan de Staten-Generaal omtrent de door het College sanering ingevolge het
      tweede lid genomen besluiten.

      11 Het College sanering is tevens belast met het toezicht op de sanering. Bij de algemene maatregel van bestuur,
      bedoeld in het vierde lid, kunnen hieromtrent regels worden gesteld.


