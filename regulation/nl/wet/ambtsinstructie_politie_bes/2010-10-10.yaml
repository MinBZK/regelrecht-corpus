  - number: '1.2'
    text: |-
      In dit besluit wordt ten aanzien van buitengewone agenten van politie voor «korpschef» gelezen: de door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister van Justitie,
      aangewezen ambtenaar die uit hoofd van zijn functie of krachtens beschikking of aanwijzing met de leiding is
      belast.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel1
  - number: '1.3'
    text: |-
      In dit besluit wordt ten aanzien van de door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      aangewezen ambtenaren die deel uitmaken van het recherchesamenwerkingsteam voor «korpschef» gelezen: de teamchef
      van het recherchesamenwerkingsteam, bedoeld in artikel 6, tweede lid, van het protocol inzake gespecialiseerde
      recherchesamenwerking tussen de landen van het Koninkrijk van 30 november 2001.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel1
  - number: '2'
    text: |-
      Bij de uitoefening van zijn taken onthoudt de ambtenaar zich van gedragingen waardoor aan de goede naam van het
      politiekorps afbreuk gedaan kan worden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Behoudens bij door de korpsbeheerder of, voor zover het betreft de functionarissen van de Koninklijke marechaussee,
      Onze Minister van Defensie vastgestelde bijzondere voorschriften, brengt de ambtenaar bij officiële aangelegenheden
      – in uniform gekleed – op militaire wijze de groet:
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: 3.1.a
    text: voor leden van het Koninklijk Huis en de Gouverneur van Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: 3.1.b
    text: |-
      tijdens het ten gehore brengen van volksliederen bij officiële gelegenheden, tenzij de dienstverrichting het
      brengen van de groet niet toelaat;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: 3.1.c
    text: |-
      voor ontplooide, door of vanwege Hare Majesteit de Koningin uitgereikte of met Koninklijke toestemming gevoerde
      vaandels en standaarden, waarbij halt en front wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: 3.1.d
    text: voor ministers, staatssecretarissen en gezaghebbers.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      De groet wordt niet gebracht door de ambtenaar die optreedt als bestuurder van een in beweging zijnd vervoermiddel,
      of die actief bezig is met de regeling van het verkeer.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      In burgerkleding groet de ambtenaar en brengt hij eerbewijzen met inachtneming van de gebruikelijke
      beleefdheidsvormen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel3
  - number: '4.1'
    text: De ambtenaar zorgt voor een correct voorkomen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel4
  - number: '4.2'
    text: Hij verricht zijn taken in uniform, tenzij hij is aangewezen om in burgerkleding dienst te doen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      In uniform of burgerkleding gekleed, draagt hij de wapens als voor de dienst voorgeschreven. Indien het dragen van
      wapens bij de uitoefening van de politietaak in burgerkleding is voorgeschreven, worden de wapens als regel niet
      zichtbaar gedragen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      Hij draagt er zorg voor dat zijn uniformkleding en uitrustingsstukken en de hem verstrekte wapens steeds in goed
      onderhouden en zindelijke staat verkeren.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel4
  - number: '4.5'
    text: |-
      Het is de ambtenaar verboden dienstkleding, -auto's en -gebouwen voor een ander doel te gebruiken dan waarvoor zij
      zijn verstrekt respectievelijk beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel4
  - number: '5'
    text: 'De ambtenaar legitimeert zich met het legitimatiebewijs dat aan hem is verstrekt:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel5
  - number: 5.a
    text: bij optreden in burgerkleding ongevraagd, tenzij bijzondere omstandigheden dit onmogelijk maken, en
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel5
  - number: 5.b
    text: bij optreden in uniform, op verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      De ambtenaar bekwaamt zich voortdurend in de kennis van zijn plichten, bevoegdheden en alle andere zaken met
      betrekking tot zijn taken.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      De ambtenaar stelt zich voortdurend op de hoogte van de geldende wettelijke regelingen, die voor de politie van
      belang zijn en van de voor hem geldende regelingen, dienstvoorschriften en ambtelijke instructies.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Indien tegen een verdachte van een strafbaar feit proces-verbaal zal worden opgemaakt, wordt dit zo mogelijk aan
      hem medegedeeld, met inachtneming van de geldende bepalingen van het [Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '8.1'
    text: |-
      De ambtenaar, die buiten dienst een ernstig voorval waarneemt dat binnen de bevoegdheidssfeer van de politie
      ligt, of die buiten dienst op andere wijze van een zodanig ernstig voorval mededeling ontvangt, is verplicht naar
      bevind van zaken hulp te bieden en voorlopige maatregelen te nemen ter voorkoming van verder onheil dan wel ter
      verzekering van de mogelijkheid tot opsporing van een strafbaar feit, een en ander in afwachting van het overnemen
      van de behandeling van de zaak door een dienstdoend functionaris die bij of krachtens wettelijk voorschrift belast
      is met toezichthoudende of opsporingstaken.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Bij dringende noodzaak verleent de ambtenaar die buiten dienst is, hulp bij de uitoefening van politietaken
      aan een dienstdoend functionaris die bij of krachtens wettelijk voorschrift belast is met toezichthoudende of
      opsporingsbevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      De ambtenaar die bevoegd is in de rechtmatige uitoefening van zijn taak geweld te gebruiken tegen personen en
      goederen of vrijheidsbeperkende beperkende middelen te gebruiken tegen personen, gebruikt geweld wanneer het
      daarmee beoogde doel dit, mede gelet op de hieraan verbonden gevaren, rechtvaardigt en dat doel niet op andere
      wijze kan worden bereikt. Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel9
  - number: '9.2'
    text: De uitoefening van de bevoegdheid dient in verhouding tot het beoogde doel redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel9
  - number: '10'
    text: 'Het gebruik van een geweldmiddel is uitsluitend toegestaan aan een ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel10
  - number: 10.a
    text: |-
      aan wie dat geweldmiddel rechtens is toegekend, voor zover hij optreedt ter uitvoering van de taak met het oog
      waarop het geweldmiddel hem is toegekend, en
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel10
  - number: 10.b
    text: die in het gebruik van dat geweldmiddel is geoefend.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Indien de ambtenaar, al of niet in gesloten verband, onder leiding van een ter plaatse aanwezige meerdere optreedt,
      zal hij geen geweld aanwenden dan na uitdrukkelijke last van deze meerdere. De meerdere geeft daarbij aan van welk
      geweldmiddel gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel11
  - number: '11.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel11
  - number: 11.2.a
    text: in het geval de meerdere, bedoeld in het eerste lid, vooraf anders heeft bepaald, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel11
  - number: 11.2.b
    text: |-
      in een geval als bedoeld in [artikel 13, eerste lid, onderdeel b][ref1], voor zover de last redelijkerwijs niet kan
      worden afgewacht.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel13
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Het gebruik van een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange afstandsprecisievuur kan
      worden afgegeven, is slechts geoorloofd:
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.b
    text: |-
      om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken, en die wordt verdacht van of is veroordeeld wegens het plegen van een
      misdrijf
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.b.1°
    text: waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld, en
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.b.2°
    text: dat een ernstige aantasting vormt van de lichamelijke integriteit of de persoonlijke levenssfeer, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.b.3°
    text: dat door zijn gevolg bedreigend voor de samenleving is of kan zijn.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.c
    text: |-
      tot het beteugelen van oproerige bewegingen of andere ernstige wanordelijkheden, indien er sprake is van een
      opdracht van het bevoegd gezag en een optreden in gesloten verband onder leiding van een meerdere;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: 12.1.d
    text: |-
      tot het beteugelen van militaire oproerige bewegingen, andere ernstige militaire wanordelijkheden of muiterij
      indien de militair van de Koninklijke marechaussee in opdracht van Onze Minister van Defensie dan wel de officier
      van justitie belast met militaire zaken in gesloten verband onder leiding van een meerdere optreedt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Het gebruik van het vuurwapen in de gevallen, bedoeld in het eerste lid, onder a en b, is slechts geoorloofd tegen
      personen en vervoermiddelen waarin of waarop zich personen bevinden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder a en b, wordt van het vuurwapen geen gebruik gemaakt indien
      de identiteit van de aan te houden persoon bekend is en redelijkerwijs mag worden aangenomen dat het uitstel
      van de aanhouding geen onaanvaardbaar te achten gevaar voor de rechtsorde met zich brengt, dan wel indien een
      aanmerkelijke kans bestaat dat onschuldige derden kunnen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
  - number: '12.4'
    text: |-
      Onder het plegen van een misdrijf, bedoeld in het eerste lid, onder b, worden mede begrepen de poging daartoe en de
      deelnemingsvormen, bedoeld in de [artikelen 49][ref1] en [50 van het Wetboek van Strafrecht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel50
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '50'
  - number: '13.1'
    text: |-
      De ambtenaar mag slechts uit voorzorg een vuurwapen, niet zijnde een vuurwapen waarmee automatisch vuur of lange
      afstandsprecisievuur kan worden afgegeven, ter hand nemen:
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel13
  - number: 13.1.a
    text: in gevallen waarin het gebruik van een vuurwapen is toegestaan, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel13
  - number: 13.1.b
    text: |-
      in verband met zijn veiligheid of die van anderen, indien redelijkerwijs mag worden aangenomen dat een situatie
      ontstaat, waarin hij bevoegd is dat vuurwapen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel13
  - number: '13.2'
    text: |-
      Indien een situatie als bedoeld in het eerste lid, onderdeel b, zich niet of niet meer voordoet, bergt de ambtenaar
      terstond het vuurwapen op.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      Het gebruik van een vuurwapen waarmee automatisch vuur kan worden afgegeven, is slechts geoorloofd tegen personen
      en tegen vervoermiddelen waarin of waarop zich personen bevinden, in een situatie waarin sprake is van een
      ogenblikkelijke, wederrechtelijke aanranding van eigen of eens anders lijf.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: '14.2'
    text: |-
      Een vuurwapen waarmee automatisch vuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve van de
      opleiding dan wel voor:
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: 14.2.a
    text: |-
      het verrichten van een aanhouding van een persoon van wie redelijkerwijs mag worden aangenomen dat hij een voor
      onmiddellijk gebruik gereed zijnd vuurwapen bij zich heeft en dit tegen personen zal gebruiken, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: 14.2.b
    text: de bewaking en beveiliging van personen en objecten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede
      lid, onder a, is slechts toegestaan na schriftelijke toestemming van de hoofdofficier van justitie. Indien wegens
      de vereiste spoed de toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden
      gevraagd en verleend. De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk
      bevestigd. De hoofdofficier van justitie doet van het meevoeren van vuurwapens waarmee automatisch vuur kan worden
      afgegeven zo mogelijk vooraf mededeling aan de betrokken gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: '14.4'
    text: |-
      Het meevoeren van vuurwapens waarmee automatisch vuur kan worden afgegeven in het geval, bedoeld in het tweede lid,
      onder b, is slechts mogelijk na schriftelijke toestemming van het bevoegd gezag. Indien wegens de vereiste spoed de
      toestemming niet schriftelijk kan worden gevraagd of verleend, kan deze ook mondeling worden gevraagd en verleend.
      De toestemming die mondeling is verleend, wordt binnen vierentwintig uur schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Het gebruik van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven, is slechts geoorloofd bij
      zeer ernstige misdrijven ter afwending van direct gevaar voor het leven van personen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Het gebruik, bedoeld in het eerste lid, vindt plaats onder bevel van de commandant van een bijstandseenheid, belast
      met bijzondere onderdelen van de politietaak.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      Een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven mag slechts worden meegevoerd ten behoeve van
      de opleiding dan wel ten behoeve van de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake is
      van direct levensbedreigende omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel15
  - number: '15.4'
    text: |-
      Het meevoeren van een vuurwapen waarmee lange afstandsprecisievuur kan worden afgegeven ten behoeve van
      de daadwerkelijke bestrijding van zeer ernstige misdrijven waarbij sprake is van direct levensbedreigende
      omstandigheden, is slechts toegestaan na schriftelijke toestemming van het bevoegd gezag. Aan de toestemming kunnen
      voorwaarden worden verbonden. Indien wegens de vereiste spoed de toestemming niet schriftelijk kan worden gevraagd
      of verleend, kan deze ook mondeling worden gevraagd en verleend. De toestemming die mondeling is verleend, wordt
      binnen vierentwintig uur schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen zal schieten, met luide stem of
      op andere niet mis te verstane wijze dat geschoten zal worden, indien niet onverwijld het gegeven bevel wordt
      opgevolgd. Deze waarschuwing, die zo nodig vervangen kan worden door een waarschuwingsschot, blijft slechts
      achterwege, wanneer de omstandigheden de waarschuwing redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Een waarschuwingsschot moet op zodanige wijze worden gegeven, dat gevaar voor personen of zaken zoveel mogelijk
      wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel16
  - number: '17'
    text: |-
      De [artikelen 12 tot en met 16][ref1] zijn niet van toepassing op het gebruik en het ter hand nemen van een
      vuurwapen dat is geladen met niet-penetrerende munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel12
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '18'
    text: 'Het gebruik van een vuurwapen dat is geladen met niet-penetrerende munitie is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel18
  - number: 18.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd wapen bij zich heeft en dit tegen personen zal gebruiken, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel18
  - number: 18.b
    text: |-
      om een persoon aan te houden die zich aan zijn aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming
      tracht te onttrekken of heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel18
  - number: '19'
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht met een vuurwapen dat is geladen met niet-penetrerende
      munitie zal schieten, met luide stem of op andere niet mis te verstane wijze dat geschoten zal worden, indien
      niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft slechts achterwege, wanneer de
      omstandigheden de waarschuwing redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel19
  - number: '20'
    text: |-
      De [artikelen 17 tot en met 19][ref1] zijn van overeenkomstige toepassing indien de niet-penetrerende munitie wordt
      afgegeven met een ander hulpmiddel dan een vuurwapen.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel17
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '21.1'
    text: 'Het gebruik van pepperspray is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.1.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.1.b
    text: |-
      om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming tracht
      te onttrekken of heeft onttrokken;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.1.c
    text: ter verdediging tegen of voor het onder controle brengen van agressieve dieren.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: '21.2'
    text: 'Pepperspray wordt niet gebruikt tegen:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.2.a
    text: personen die zichtbaar jonger dan 12 of ouder dan 65 jaar zijn;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.2.b
    text: vrouwen die zichtbaar zwanger zijn;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.2.c
    text: |-
      personen voor wie dit gebruik als gevolg van een voor de ambtenaar zichtbare ademhalings- of andere ernstige
      gezondheidsstoornis onevenredig schadelijk kan zijn;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: 21.2.d
    text: groepen personen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: '21.3'
    text: Bij gebruik van pepperspray wordt niet op de mond gericht.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel21
  - number: '22'
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij gericht pepperspray tegen een persoon zal gebruiken, met luide
      stem of op andere niet mis te verstane wijze dat pepperspray gebruikt zal worden, indien niet onverwijld het
      gegeven bevel wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing
      redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel22
  - number: '23'
    text: |-
      Pepperspray wordt tegen een persoon per geval ten hoogste twee maal voor de duur van niet langer dan ongeveer een
      seconde gebruikt en op een afstand van ten minste een meter.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel23
  - number: '24'
    text: 'Het gebruik van CS-traangas is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel24
  - number: 24.a
    text: |-
      in met in [artikel 12, eerste lid][ref1], genoemde situaties;


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel12
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 24.b
    text: om agressief gedrag of verzet van een persoon te onderdrukken respectievelijk te breken;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel24
  - number: 24.c
    text: om dreigende agressie of verzet van een persoon te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij CS-traangas tegen een persoon zal gebruiken, met luide stem of op
      andere niet mis te verstane wijze dat een traangas gebruikt zal worden, indien niet onverwijld het gegeven bevel
      wordt opgevolgd. Deze waarschuwing blijft achterwege indien de omstandigheden de waarschuwing redelijkerwijs niet
      toelaten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Het inzetten van een politiesurveillancehond is slechts geoorloofd onder het direct en voortdurend toezicht van een
      geleider bij:
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel26
  - number: 26.1.a
    text: de surveillancedienst,
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel26
  - number: 26.1.b
    text: |-
      het optreden van ambtenaren die zijn belast met het optreden ter handhaving van de openbare orde en hulpverlening
      bij grootschalige manifestaties en evenementen, het uitvoeren van evacuaties, het bewaken en beveiligen van
      objecten, het optreden tijdens tampen en crises, het uitvoeren van zoekacties en het aanhouden van ordeverstoorders
      na toestemming van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      Het inzetten van een politiehond bij het optreden van ambtenaren als bedoeld in
      [artikel 6 van het Besluit beheer politiekorps BES][ref1] of een bijstandseenheid is slechts geoorloofd onder het
      direct en voortdurend toezicht van een geleider bij het, na toestemming van het bevoegd gezag, optreden van deze
      ambtenaren of een dergelijke eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028780#Artikel6
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028780
        artikel: '6'
  - number: '26.3'
    text: |-
      De geleider dient in het bezit te zijn van een krachtens [artikel 41, eerste lid, van de rijkswet][ref1]
      vastgesteld certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel41
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '41'
  - number: '27'
    text: |-
      In een situatie als bedoeld in [artikel 26, eerste lid, onder b][ref1], waarschuwt de ambtenaar onmiddellijk
      voordat hij een politiesurveillancehond inzet tegen een persoon met luide stem of op andere niet mis te verstane
      wijze dat de hond zal worden ingezet, indien niet onverwijld het gegeven bevel wordt opgevolgd. Deze waarschuwing
      blijft achterwege indien de omstandigheden de waarschuwing redelijkerwijs niet toelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel26
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '28.1'
    text: 'Het gebruik van fysiek geweld en de wapenstok is slechts geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel28
  - number: 28.1.a
    text: |-
      om een persoon aan te houden ten aanzien van wie redelijkerwijs mag worden aangenomen dat hij een voor onmiddellijk
      gebruik gereed zijnd wapen bij zich heeft en dit tegen een persoon zal gebruiken;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel28
  - number: 28.1.b
    text: |-
      om een persoon aan te houden die zich aan aanhouding, voorgeleiding of andere rechtmatige vrijheidsbeneming tracht
      te onttrekken of heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel28
  - number: '29'
    text: |-
      De ambtenaar waarschuwt onmiddellijk voordat hij fysiek geweld of een wapenstok zal gebruiken, met luide stem of
      op andere niet mis te verstane wijze dat fysiek geweld of de wapenstok gebruikt zal worden, indien niet onverwijld
      het gegeven bevel wordt opgevolgd. Deze waarschuwing blijft slechts achterwege, wanneer de omstandigheden de
      waarschuwing redelijkerwijs niet toelaten.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel29
  - number: '30.1'
    text: |-
      De ambtenaar die geweld heeft aangewend, meldt de feiten en omstandigheden dienaangaande, alsmede de gevolgen
      hiervan, onverwijld aan zijn meerdere of een door de korpschef aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      De melding, bedoeld in het eerste lid, wordt door de meerdere of de door de korpschef aangewezen functionaris
      terstond vastgelegd, waarbij gebruik wordt gemaakt van het model, zoals opgenomen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '30.3'
    text: |-
      De korpschef wijst in elk bureau een functionaris aan die het opmaken van de in het eerste en tweede lid bedoelde
      melding coördineert en begeleidt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '30.4'
    text: |-
      De melding, bedoeld in het tweede lid, wordt door de korpschef binnen vierentwintig uur na ontvangst ter kennis
      gebracht van de officier van justitie, dan wel door de commandant van de Koninklijke marechaussee van de officier
      van justitie ingeval het een militair als bedoeld in [artikel 1, eerste lid, onder ][ref1], betreft, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel1
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '1'
        hoofdstuk: '1'
  - number: 30.4.a
    text: |-
      de gevolgen van het aanwenden van geweld daartoe naar het oordeel van de korpschef of de commandant van de
      Koninklijke marechaussee aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: 30.4.b
    text: het aanwenden van geweld lichamelijk letsel van meer dan geringe betekenis dan wel de dood heeft veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: 30.4.c
    text: gebruik is gemaakt van een vuurwapen en daarmee één of meer schoten zijn gelost.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '30.5'
    text: |-
      In geval van bijzondere bijstandseenheden die als collectief optreden, berust de in het eerste en tweede lid
      bedoelde verplichting tot schriftelijke vastlegging en inlevering bij degene die belast is met de leiding van de
      betrokken eenheid.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '30.6'
    text: |-
      De betrokken ambtenaar of de leidinggevende, bedoeld in het vijfde lid, wordt door de meerdere regelmatig op de
      hoogte gehouden van de afhandeling van de melding en de schriftelijke vastlegging.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      De ambtenaar kan een persoon die rechtens van zijn vrijheid is beroofd, ten behoeve van het vervoer handboeien
      aanleggen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen, indien de feiten of omstandigheden dit
      redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het oog op gevaar voor de veiligheid
      of het leven van de persoon die rechtens van zijn vrijheid is beroofd, van de ambtenaar of van derden.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel31
  - number: '31.3'
    text: 'De in het tweede lid bedoelde feiten of omstandigheden kunnen slechts gelegen zijn in:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel31
  - number: 31.3.a
    text: de persoon die rechtens van zijn vrijheid is beroofd, of
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel31
  - number: 31.3.b
    text: |-
      de aard van het strafbare feit op grond waarvan de vrijheidsbeneming heeft plaatsgevonden, één en ander in
      samenhang met de wijze waarop en de situatie waarin het vervoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel31
  - number: '32'
    text: |-
      De ambtenaar die gebruik heeft gemaakt van handboeien als bedoeld in [artikel 31][ref1], meldt dit onverwijld
      schriftelijk aan de meerdere, onder vermelding van de redenen die tot het gebruik van handboeien hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel31
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '31'
        hoofdstuk: '4'
  - number: '33.1'
    text: |-
      Het onderzoek, bedoeld in [artikel 13, vierde lid, van de rijkswet][ref1], geschiedt door het oppervlakkig aftasten
      van de kleding en wordt zoveel mogelijk uitgevoerd door een ambtenaar van hetzelfde geslacht als degene die aan het
      onderzoek wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '13'
  - number: '33.2'
    text: |-
      In het geval dat een persoon is of zal worden aangehouden, wordt van een onderzoek aan diens kleding door de
      ambtenaar die bevoegd is tot het onderzoek gemotiveerd melding gemaakt in het desbetreffende proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel33
  - number: '34'
    text: |-
      Het onderzoek, bedoeld in [artikel 13, vijfde lid, van de rijkswet][ref1], wordt uitgevoerd door een ambtenaar van
      hetzelfde geslacht als degene die aan het onderzoek wordt onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '13'
  - number: '35'
    text: |-
      De ambtenaar die een onderzoek als bedoeld in [artikel 13, vierde of vijfde lid, van de rijkswet][ref1] heeft
      uitgevoerd, meldt dit onverwijld schriftelijk aan de meerdere, onder vermelding van de redenen die tot dit
      onderzoek hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '13'
  - number: '36.1'
    text: |-
      De ambtenaar belast met de grensbewaking of met het toezicht op vreemdelingen, kan een vreemdeling bij diens
      feitelijke verwijdering of uitzetting met hulpmiddelen ten behoeve van de verwijdering of uitzetting in zijn
      bewegingsvrijheid beperken, ten behoeve van een goed verloop van de verwijdering of uitzetting.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: '36.2'
    text: 'De maatregel, bedoeld in het eerste lid, kan slechts worden getroffen indien:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: 36.2.a
    text: |-
      de feiten of omstandigheden dit redelijkerwijs vereisen met het oog op gevaar voor ontvluchting, dan wel met het
      oog op gevaar voor de veiligheid of het leven van de vreemdeling, van de ambtenaar of van derden, dan wel met het
      oog op gevaar voor een ernstige verstoring van de openbare orde, en
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: 36.2.b
    text: de toepassing van het hulpmiddel redelijkerwijs geen gevaar kan opleveren voor de gezondheid van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, onder leiding van een ter plaatste aanwezige meerdere optreedt,
      zal hij geen gebruik maken van deze hulpmiddelen dan na uitdrukkelijke last van deze meerdere. De meerdere geeft
      daarbij aan van welk hulpmiddel gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: '36.4'
    text: |-
      Het gebruik van een hulpmiddel is uitsluitend toegestaan aan een ambtenaar die in het gebruik van dat hulpmiddel
      is geoefend.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel36
  - number: '37.1'
    text: |-
      De ambtenaar die ten aanzien van een vreemdeling die wordt verwijderd of uitgezet gebruik heeft gemaakt van een
      hulpmiddel ten behoeve van de verwijdering of uitzetting als bedoeld in [artikel 36, eerste lid][ref1], meldt dit
      onverwijld schriftelijk aan de meerdere, onder vermelding van de aard van het hulpmiddel, de redenen die tot het
      gebruik hebben geleid en de daaruit voorvloeiende gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel36
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '36'
        hoofdstuk: '6'
  - number: '37.2'
    text: De meerdere draagt zorg voor registratie van de melding, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel37
  - number: '38.1'
    text: |-
      De ambtenaar draagt er zorg voor personen met lichte verwondingen, ziekteverschijnselen en personen ten aanzien
      van wie twijfel op dit punt bestaat, de weg te wijzen naar een huisarts of naar een E.H.B.O.-afdeling van een
      ziekenhuis. Indien dat noodzakelijk is, verleent de ambtenaar bemiddeling bij het verkrijgen van passend vervoer.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel38
  - number: '38.2'
    text: |-
      De ambtenaar draagt er zorg voor dat personen met ernstige verwondingen en bewustelozen, waar onder mede worden
      verstaan personen die niet wekbaar of niet aanspreekbaar zijn, per ambulance naar het ziekenhuis worden vervoerd.
      De gegevens omtrent aard en omstandigheden van de gebeurtenis die tot de ziektetoestand heeft geleid, alsmede de
      op de persoon aangetroffen medische gegevens en geneesmiddelen, worden door hem ter beschikking van de medische
      hulpverleners gesteld.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      De ambtenaar draagt er zoveel mogelijk zorg voor dat personen die door drankgebruik, dan wel door andere oorzaken,
      onmiddellijk gevaarlijk zijn, hetzij voor de openbare orde, veiligheid, of gezondheid, hetzij voor zichzelf, op
      de meest geschikte wijze van plaatsen die krachtens bestemming of vast gebruik openstaat voor het publiek worden
      verwijderd. Onder plaatsen die krachtens bestemming of vast gebruik openstaat voor het publiek worden mede verstaan
      vervoermiddelen die zich bevinden op deze plaatsen, een en ander voor zover niet gebezigd als woning.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel39
  - number: '39.2'
    text: |-
      De ambtenaar draagt personen als bedoeld in het eerste lid over aan het eigen zorgkader, voor zover de
      omstandigheden zulks toelaten. Zij kunnen bij het ontbreken van opvangmogelijkheden elders, bij wijze van
      hulpverlening, op het politie- of brigadebureau worden ondergebracht, indien dit nodig is voor hun bescherming en
      dit niet tegen hun wil geschiedt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel39
  - number: '39.3'
    text: |-
      Voor personen als bedoeld in het eerste lid, van wie bekend is dat zij geestelijk gestoord zijn of die geestelijk
      gestoord lijken, waarschuwt de ambtenaar de dienstdoend adviserend arts, nadat zo mogelijk getracht is contact te
      zoeken met de eigen huisarts.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel39
  - number: '40.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel40
  - number: 40.1.a
    text: '*arts:* de dienstdoend adviserend arts;'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel40
  - number: 40.1.b
    text: '*ingeslotene:* degene die rechtens van zijn vrijheid is beroofd.'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      Onder ingeslotene wordt mede verstaan degene die ten behoeve van de hulpverlening aan hem op het politie- of
      brigadebureau is ondergebracht.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel40
  - number: '41.1'
    text: |-
      De ambtenaar handelt jegens de ingeslotene overeenkomstig het gestelde bij of krachtens
      [artikel 9 van het Besluit beheer politiekorps BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028780#Artikel9
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028780
        artikel: '9'
  - number: '41.2'
    text: |-
      De ambtenaar registreert de gegevens die krachtens
      [artikel 9, zesde lid, van het Besluit beheer politiekorps BES][ref1] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0028780#Artikel9
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028780
        artikel: '9'
  - number: '42.1'
    text: |-
      Voor zover het bij of krachtens het [Wetboek van Strafvordering BES][ref1] bepaalde zich hiertegen niet verzet,
      stelt de ambtenaar een familielid of een huisgenoot van een ingeslotene zo spoedig mogelijk op de hoogte van de
      insluiting. In het geval de ingeslotene minderjarig is, doet hij dit uit eigen beweging, indien de ingeslotene
      meerderjarig is, doet hij dit slechts op verzoek van de ingeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: '42.2'
    text: |-
      Indien de omstandigheden de uitvoering van het eerste lid niet toelaten bij een ingeslotene die geen ingezetene
      is, wordt de ambassade of het consulaat van het land waarin de ingeslotene ingezetene is, op de hoogte gesteld van
      de insluiting.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel42
  - number: '43.1'
    text: |-
      De ambtenaar brengt de ingeslotene direct voorafgaand aan de insluiting op het politie- of brigadebureau op de
      hoogte van het bepaalde in de [artikelen 42][ref1], [48][ref2] en [49][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0028717#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0028717#Artikel49
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '42'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028717
        artikel: '48'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028717
        artikel: '49'
        hoofdstuk: '8'
  - number: '43.2'
    text: |-
      [Artikel 82, tweede, derde en vierde lid, van het Wetboek van Strafvordering BES][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel82
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '82'
  - number: '44.1'
    text: |-
      De ambtenaar onderzoekt de ingeslotene direct voorafgaand aan de insluiting op het politie- of brigadebureau, door
      het aftasten en doorzoeken van diens kleding op de aanwezigheid van voorwerpen die tijdens de insluiting een gevaar
      voor de veiligheid van de betrokkene of voor anderen kunnen vormen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel44
  - number: '44.2'
    text: Bij het aantreffen van voorwerpen als bedoeld in het eerste lid, neemt de ambtenaar deze in bewaring.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel44
  - number: '44.3'
    text: |-
      Het onderzoek, bedoeld in het eerste lid, wordt zoveel mogelijk uitgevoerd door een ambtenaar van hetzelfde
      geslacht als degene die aan het onderzoek wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      De ambtenaar kan slechts van de ingeslotene verlangen dat deze zich ontkleedt indien de kleding tijdens de
      insluiting een gevaar voor de veiligheid van betrokkene of van anderen kan vormen en een hulpofficier van justitie
      daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel45
  - number: '45.2'
    text: De ambtenaar neemt de kleding, bedoeld in het eerste lid, in bewaring en draagt zorg voor vervangende kleding.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      De ambtenaar die een onderzoek als bedoeld in [artikel 44, eerste lid][ref1], heeft uitgevoerd, maakt hiervan
      onverwijld schriftelijk rapport op ten behoeve van de meerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel44
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '44'
        hoofdstuk: '8'
  - number: '46.2'
    text: |-
      De ambtenaar tekent nauwkeurig alle voorwerpen en kledingstukken die hij in bewaring heeft genomen, op. Bij
      voorwerpen van een geringe omvang en waarde kan worden volstaan met een globale aanduiding.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel46
  - number: '46.3'
    text: |-
      Een afschrift van de aantekening, bedoeld in het tweede lid, wordt door de ingeslotene en de ambtenaar ondertekend
      en aan de ingeslotene overhandigd.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel46
  - number: '47.1'
    text: |-
      De ambtenaar kan de ingeslotene na toestemming van de hulpofficier van justitie aan permanente camera-observatie
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel47
  - number: '47.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, is slechts geoorloofd in die gevallen waarin sprake is van een zodanige
      dreiging van gevaar voor het leven of de veiligheid van de betrokkene dat doorlopende controle ter afwending van
      dit gevaar noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel47
  - number: '47.3'
    text: |-
      De ambtenaar doet aan de betrokkene mededeling van de permanente camera-observatie en maakt aantekening van de
      permanente camera-observatie.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      In het geval er aanwijzingen zijn dat een ingeslotene medische bijstand behoeft dan wel er bij deze persoon
      medicijnen zijn aangetroffen, overlegt de ambtenaar met de arts. De ambtenaar overlegt eveneens met de arts indien
      de ingeslotene zelf om medische bijstand of medicijnen vraagt.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel48
  - number: '48.2'
    text: |-
      In het geval de ingeslotene vraagt om medische bijstand van zijn eigen arts, stelt de ambtenaar die arts daarvan op
      de hoogte.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel48
  - number: '48.3'
    text: |-
      In het geval de ingeslotene te kennen geeft geen medische hulp te willen hebben, terwijl er aanwijzingen zijn dat
      medische bijstand gewenst is, waarschuwt de ambtenaar de arts en deelt hij deze de houding van de ingeslotene mee.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel48
  - number: '49'
    text: |-
      De ambtenaar mag aan de arts bij het onderzoek en de behandeling geen beperkingen opleggen. Hij volgt de
      aanwijzingen op die de arts over de zorg voor de gezondheid van de ingeslotene geeft en registreert de door de arts
      gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel49
  - number: '50.1'
    text: 'De ambtenaar controleert de ingeslotene regelmatig met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: 50.1.a
    text: in het geval de arts is gewaarschuwd, de ingeslotene ten minste elk kwartier in de cel wordt gadegeslagen;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: 50.1.b
    text: |-
      in het geval medische hulp is verstrekt, de ingeslotene zo vaak wordt geobserveerd als de arts heeft
      voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: 50.1.c
    text: in het geval geen medische hulp noodzakelijk wordt geacht, de ingeslotene eenmaal per twee uur wordt gadegeslagen.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: '50.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder a en b, observeert de ambtenaar de ingeslotene zo nodig in de
      cel en aan de persoon, waarbij hij vooral acht slaat op de mate waarin de ingeslotene wekbaar en aanspreekbaar is.
      Personen die in een toestand geraken waarin zij niet wekbaar of aanspreekbaar zijn, worden terstond per ambulance
      naar een ziekenhuis vervoerd.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: '50.3'
    text: De ambtenaar registreert de observaties, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel50
  - number: '51'
    text: |-
      Bij overplaatsing van de ingeslotene geeft de ambtenaar de geneesmiddelen, de registraties, bedoeld in de
      [artikelen 41, tweede lid][ref1], [49][ref2] en [50, derde lid][ref3], voor zover die van belang kunnen zijn, en de
      rapportage van de arts, die bestemd is voor een arts die de behandeling zal overnemen, mee.


      [ref1]: https://wetten.overheid.nl/BWBR0028717#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028717#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0028717#Artikel50
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028717
        artikel: '41'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028717
        artikel: '49'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028717
        artikel: '50'
        hoofdstuk: '8'
  - number: '52'
    text: |-
      De ambtenaar zorgt ervoor dat bij de invrijheidstelling van een persoon die zichzelf niet kan verplaatsen, vervoer
      en begeleiding voor die persoon beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel52
  - number: '53'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [rijkswet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028079
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028079
  - number: '54'
    text: 'Dit besluit wordt aangehaald als: Ambtsinstructie politie BES.'
    url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#Artikel54
