preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Justitie van 15
    december 2009, nr. 2009-0000720635, CZW/WSG, gedaan mede namens de Staatssecretaris van Binnenlandse Zaken en
    Koninkrijksrelaties en in overeenstemming met Onze Minister van Defensie;

    Gelet op artikel 14, tweede en derde lid, van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire,
    Sint Eustatius en Saba;

    De Raad van State gehoord (advies van 8 februari 2010, nr. W04.09.0548/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 16 september
    2010, nr. 2010-0000599327, uitgebracht mede namens Onze Minister van Justitie en in overeenstemming met Onze
    Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028717/2010-10-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *ambtenaar* a. de ambtenaar van politie, bedoeld in
      [artikel 3, onder a en c, van de rijkswet][ref1]; b. de ambtenaar van politie, bedoeld in
      [artikel 3, onder b, van de rijkswet][ref2], voor zover het betreft de [artikelen 1 tot en met 8][ref3]
      en [hoofdstuk 7][ref4]; c. degene die is benoemd tot aspirant voor de duur dat hij de praktijkstage
      volgt; d. de militair van de Koninklijke marechaussee in de uitvoering van de politietaken, bedoeld in
      [artikel 11, eerste lid, van de rijkswet][ref5]; e. de militair van de Koninklijke marechaussee en de krijgsmacht,
      bedoeld in [artikel 11, tweede en derde lid, van de rijkswet][ref6]; f. de buitengewoon agent van politie,
      bedoeld in [artikel 10, tweede lid, van de rijkswet][ref7]; g. de door Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties aangewezen ambtenaar die deel uitmaakt van het recherchesamenwerkingsteam, bedoeld in
      [artikel 57a, tweede lid, van de rijkswet][ref8].
        - *meerdere* a. de ambtenaar die uit hoofde van zijn functie of krachtens beschikking of aanwijzing
      met de leiding is belast of het bevel heeft over de taakuitvoering; b. indien op grond van het bepaalde
      onder a geen meerdere kan worden aangewezen de ambtenaar van politie die een hogere rang heeft of,
      bij gelijkheid in rang, degene met de meeste dienstjaren, dan wel bij optreden door militairen van de
      Koninklijke marechaussee of van enig ander krijgsmachtonderdeel degene die ingevolge bij of krachtens
      [artikel 67 van het Wetboek van Militair Strafrecht][ref9] met het bevel is belast.
        - *bevoegd gezag:* het gezag, bedoeld in de [artikelen 16][ref10] en [17 van de rijkswet][ref11].
        - *geweld:* elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;
        - *aanwenden van geweld:* het gebruiken van geweld en het dreigen met geweld, waaronder wordt begrepen het ter hand
      nemen van een vuurwapen;
        - *geweldmiddel* a. de krachtens [artikel 42, eerste en tweede lid, van de rijkswet][ref12] toegelaten uitrusting
      en bewapening waarmee geweld kan worden uitgeoefend; b. de door Onze Minister van Defensie ter beschikking gestelde
      uitrusting en bewapening waarmee geweld kan worden uitgeoefend in de uitvoering van de politietaken, bedoeld in
      [artikel 11 van de rijkswet][ref13];
        - *vuurwapen waarmee automatisch vuur kan worden afgegeven:* vuurwapen waarmee met één druk op het afvuurmechanisme
      meer schoten kunnen worden gelost dan wel een vuurwapen waarmee naar keus hetzij één schot, hetzij meer schoten
      kunnen worden gelost;
        - *het gebruik van een vuurwapen:* het richten, het gericht houden en het daadwerkelijk gebruik van een vuurwapen;
        - *niet-penetrerende munitie:* munitie die is ontworpen om bij het treffen van een persoon niet het lichaam binnen
      te dringen;
        - *rijkswet:* de [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref14];
        - *korpsbeheerder:* degene die op grond van [artikel 47, derde lid, van de rijkswet][ref15] wat betreft het beheer
      het bevoegd gezag uitoefent over het politiekorps van Bonaire, Sint Eustatius en Saba.


