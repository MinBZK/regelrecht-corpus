publication_date: '2018-12-27'
valid_from: '2019-01-01'
bwb_id: BWBR0026591
url: https://wetten.overheid.nl/BWBR0026591/2019-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ter implementatie van verordening (EG) nr. 765/2008 van het Europees
    Parlement en de Raad van de Europese Unie van 9 juli 2008 (PbEU L 218) tot vaststelling van de eisen inzake
    accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van verordening (EG) nr.
    339/93 voorzien moet worden in de aanwijzing van de nationale accreditatie-instantie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      b. verordening: [verordening (EG) nr. 765/2008](32008R0765) van het Europees Parlement en de Raad van de Europese
      Unie van 9 juli 2008 (PbEU L 218) tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende
      het verhandelen van producten en tot intrekking van [Verordening (EG) nr. 339/93](31993R0339);

      c. conformiteitsbeoordelingsinstantie: conformiteitsbeoordelingsinstantie als bedoeld in artikel 2, onderdeel 13,
      van de verordening;

      d. accreditatie: accreditatie als bedoeld in artikel 2, onderdeel 10, juncto artikel 3 van de verordening;

      e. Raad voor Accreditatie: de Stichting Raad voor Accreditatie genoemd in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026591#Artikel2
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026591
        artikel: '2'
        hoofdstuk: '2'
  - number: '2'
    text: |-
      1 De Stichting Raad voor Accreditatie wordt aangewezen als nationale accreditatie-instantie in de zin van artikel 4
      van de verordening.

      2 Het bestuur van de Raad voor Accreditatie wordt aangewezen als bestuursorgaan dat de in de verordening en deze
      wet aan de nationale accreditatie-instantie opgedragen taken uitvoert.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel2
  - number: '3'
    text: |-
      1 De benoeming en het ontslag van leden van het bestuur, alsmede wijziging van de statuten van de Raad voor
      Accreditatie, behoeven de goedkeuring van Onze Minister.

      2 Onze Minister onthoudt zijn goedkeuring indien naar zijn oordeel door de benoeming of door de statutenwijziging

      a. de Raad voor Accreditatie niet langer voldoet aan de eisen van de verordening of

      b. een goede taakvervulling of onafhankelijke besluitvorming binnen de Raad voor Accreditatie onvoldoende is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel3
  - number: '4'
    text: |-
      De Raad voor Accreditatie is belast met:

      a. het uitvoeren van de in de verordening aan de nationale accreditatie-instantie opgedragen taken;

      b. het verrichten van werkzaamheden op het gebied van accreditatie in verband met de uitvoering van verdragen of
      internationale afspraken, na een daartoe strekkend verzoek van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel4
  - number: '5'
    text: |-
      1 De Raad voor Accreditatie besluit op een aanvraag om accreditatie binnen zes maanden na ontvangst van de
      aanvraag.

      2 De in het eerste lid bedoelde termijn wordt verlengd met zes maanden ingeval de Raad voor Accreditatie bij de
      voorbereiding van het besluit vaststelt dat

      a. de aanvrager voor het verkrijgen van de accreditatie enkele wijzigingen moet aanbrengen in zijn onderneming of
      werkwijze alvorens de accreditatie kan worden verleend of

      b. het niet mogelijk is een onderzoek naar de geschiktheid voor de accreditatie te doen wegens een feitelijk gebrek
      aan de zijde van de aanvrager, dat niet aan de aanvrager te wijten is, in de mogelijkheden om dat onderzoek uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel5
  - number: '6'
    text: |-
      De Raad voor Accreditatie kan aan een besluit tot accreditatie voorwaarden verbinden die strekken tot de
      verwezenlijking van het doel van de accreditatie.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 De Raad voor Accreditatie stelt tarieven vast voor de door hem te verrichten werkzaamheden ten behoeve van
      conformiteitsbeoordelingsinstanties.

      2 De Raad voor Accreditatie kan voorts tarieven vaststellen die eenmalig of jaarlijks verschuldigd
      zijn voor informatieverstrekking en andere activiteiten in het kader van zijn contacten met
      conformiteitsbeoordelingsinstanties.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel7
  - number: '8'
    text: |-
      De [artikelen 26 tot en met 35 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn van toepassing ten aanzien
      van het financieel beheer en verantwoording door de Raad voor Accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '10'
    text: |-
      Op verzoeken om accreditatie die aan de Raad voor Accreditatie zijn gedaan voor 1 januari 2010 en waarop op die
      datum nog geen beslissing is genomen, wordt besloten met inachtneming van deze wet.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel10
  - number: '11'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2010. Indien het Staatsblad waarin deze wet wordt geplaatst
      wordt uitgegeven na 31 december 2009, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij wordt geplaatst en werkt zij terug tot en met 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet aanwijzing nationale accreditatie-instantie.'
    url: https://wetten.overheid.nl/BWBR0026591/2019-01-01#Artikel12
