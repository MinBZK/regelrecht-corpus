preamble:
  text: |-
    Gelet op artikel 56 van de Algemene Arbeidsongeschiktheidswet en artikel 59 e van de Wet op de
    arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003054/2005-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor zoveel nodig in afwijking van het bepaalde in
      [artikel 59b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of in
      [artikel 68 van de Wet werk en inkomen naar arbeidsvermogen][ref2], vindt, ingeval de
      arbeidsongeschiktheidsuitkering of werkhervattingsuitkering gedeeltelijk arbeidsgeschikten wordt beëindigd
      en het niet aannemelijk is, dat binnen korte tijd wederom aanspraak op een dergelijke uitkering zal ontstaan,
      uitbetaling van de vakantieuitkering plaats gelijktijdig met de uitbetaling van de laatste termijn van de
      arbeidsongeschiktheidsuitkering of werkhervattingsuitkering gedeeltelijk arbeidsgeschikten of zo spoedig mogelijk
      daarna.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel68
    url: https://wetten.overheid.nl/BWBR0003054/2005-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 59b
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '68'
  - number: '2'
    text: |-
      Indien na de toepassing van het voorgaande artikel wederom aanspraak op een arbeidsongeschiktheidsuitkering ontstaat
      en dientengevolge het voorgaande artikel of [artikel 59b van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      of in [artikel 68 van de Wet werk en inkomen naar arbeidsvermogen][ref2] moet worden toegepast, wordt daarbij
      rekening gehouden met hetgeen met toepassing van [artikel 1][ref3] van deze beschikking reeds werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0003054#Artikel1
    url: https://wetten.overheid.nl/BWBR0003054/2005-12-29#Artikel2
