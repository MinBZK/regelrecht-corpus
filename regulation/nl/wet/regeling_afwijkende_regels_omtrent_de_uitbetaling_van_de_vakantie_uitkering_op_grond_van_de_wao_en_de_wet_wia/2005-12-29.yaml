        artikel: '1'
  - number: '3'
    text: |-
      Deze regeling wordt aangehaald als: Regeling afwijkende regels omtrent de uitbetaling van de vakantie-uitkering op
      grond van de WAO en de Wet WIA.
    url: https://wetten.overheid.nl/BWBR0003054/2005-12-29#Artikel3
