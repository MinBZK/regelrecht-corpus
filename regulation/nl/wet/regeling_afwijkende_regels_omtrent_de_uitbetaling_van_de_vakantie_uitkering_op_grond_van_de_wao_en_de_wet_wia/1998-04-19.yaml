preamble:
  text: |-
    Gelet op artikel 56 van de Algemene Arbeidsongeschiktheidswet en artikel 59 e van de Wet op de
    arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003054/1998-04-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor zoveel nodig in afwijking van het bepaalde in
      [artikel 59 b van de Wet op de arbeidsongeschiktheidsverzekering][ref1], vindt, ingeval de
      arbeidsongeschiktheidsuitkering wordt beëindigd en het niet aannemelijk is, dat binnen korte tijd wederom
      aanspraak op een dergelijke uitkering zal ontstaan, uitbetaling van de vakantieuitkering plaats gelijktijdig met de
      uitbetaling van de laatste termijn van de arbeidsongeschiktheidsuitkering of zo spoedig mogelijk daarna.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
    url: https://wetten.overheid.nl/BWBR0003054/1998-04-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 59b
  - number: '2'
    text: |-
      Indien na de toepassing van het voorgaande artikel wederom aanspraak op een arbeidsongeschiktheidsuitkering ontstaat
      en dientengevolge het voorgaande artikel of [artikel 59b van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      moet worden toegepast, wordt daarbij rekening gehouden met hetgeen met toepassing van [artikel 1][ref2] van deze
      beschikking reeds werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel59b
      [ref2]: https://wetten.overheid.nl/BWBR0003054#Artikel1
    url: https://wetten.overheid.nl/BWBR0003054/1998-04-19#Artikel2
