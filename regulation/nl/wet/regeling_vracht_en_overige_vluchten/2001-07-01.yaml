  - number: '5'
    text: |-
      1 Een krachtens een verleende toestemming uit te voeren vlucht, alsmede het bij een zodanige vlucht te
      bewerkstelligen vervoer, dient aan de in dit besluit gestelde bepalingen te voldoen, tenzij daarvan ontheffing
      is verleend

      2 De Minister van Verkeer en Waterstaat kan verlangen dat een luchtvaartmaatschappij hem aantoont, dat
      een door haar uit te voeren of uitgevoerde vlucht, alsmede het bij een zodanige vlucht te bewerkstelligen
      of bewerkstelligd vervoer, zal voldoen dan wel heeft voldaan aan de in dit besluit gestelde bepalingen;
      indien zulks niet up bevredigende wijze wordt aangetoond, kan verleende toestemming, inbegrepen de in het
      [eerste lid van artikel 4][ref1] bedoelde, worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003376#Artikel4
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003376
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 Toestemming wordt verleend voor vluchten ten behoeve van reizen naar of van plaatsen binnen Europa, waarbij het
      doel van de reis van een duidelijk aantoonbaar culturele, sportieve, educatieve, religieuze of recreatieve aard
      is, mits:

      a. de deelnemers de heen- en terugvlucht samen maken;

      b. de deelnemers gezamenlijk aan één gemeenschappelijk programma deelnemen gedurende minimaal de helft van de
      verblijfsduur; de voor de nachtrust bestemde tijd wordt niet medegerekend bij de bepaling van de verblijfsduur;

      c. in de prijs per persoon naast het vervoer op retourbasis tenminste de kosten voor deelname aan het onder b
      genoemde gemeenschappelijke programma zijn begrepen, alsmede in geval van overnachting de overnachtingsaccommodatie
      voor de duur van de reis op de aangeboden plaats(en) van bestemming;

      d. geen vermenging geschiedt op éénzelfde vliegtuig van deelnemers aan de in dit artikel bedoelde reizen met ander
      soort vervoer;

      e. in de aanbieding(en) van de reizen aan het publiek en in het gemeenschappelijke programma geen reisdoel wordt
      vermeld dat in verband met de uitoefening van beroep of bedrijf wordt bezocht.

      2 Voor vluchten die niet voldoen aan het gestelde onder 1 e van dit artikel kan toestemming worden verleend, indien
      ten tijde van de aanvrage aannemelijk wordt gemaakt hetzij, dat gelet op de door de geregelde luchtdiensten geboden
      mogelijkheden een aanmerkelijk groter aantal passagiers gebruik zal maken van reismogelijkheden die door middel van
      ongeregelde vluchten worden geboden dan van die welke door de geregelde diensten worden geboden, hetzij dat door
      ongeregelde vluchten aanmerkelijk beter tegemoet wordt gekomen aan de behoeften van het voor zakelijke doeleinden
      reizend publiek.

      3 Voordat een luchtvaartmaatschappij contracten sluit voor de uitvoering van de in dit artikel bedoelde vluchten
      dient zij zich bij de Minister van Verkeer en Waterstaat te vergewissen of toestemming voor die vluchten kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel6
  - number: '7'
    text: |-
      Toestemming kan worden verleend voor vluchten uitsluitend voor het vervoer van buitenlandse werknemers, mits de
      geregelde luchtvaartmaatschappijen van de landen van herkomst of tewerkstelling van die buitenlandse werknemers
      voor dit vervoer geen redelijke mogelijkheden bieden.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel7
  - number: '8'
    text: |-
      Toestemming wordt verleend voor vluchten uitsluitend voor het vervoer van studenten, overeenkomstig de daarvoor
      krachtens recommandatie(s) van de Europese Burgerluchtvaart Organisatie (ECAC) aanbevolen criteria, voor zover
      zodanige recommandatie(s) door Nederland zijn aanvaard en openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel8
  - number: '9'
    text: |-
      1 In het algemeen wordt toestemming verleend wanneer aangetoond is dat door of ten behoeve van de verlader of
      ontvanger de gehele capaciteit van het betrokken vliegtuig is gehuurd uitsluitend voor het vervoer van aan hem
      toebehorende vracht.

      2 Bij het in overweging nemen van aanvragen om toestemming voor andere vluchten voor het vervoer van vracht zal in
      het bijzonder in aanmerking worden genomen of de geregelde luchtdiensten het vervoer naar de plaats van bestemming
      op adequate en redelijke wijze kunnen verzorgen en of de bevrachting ten behoeve van meer dan een verlader of
      ontvanger geschiedt.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel9
  - number: '10'
    text: |-
      1 Niet-Nederlandse luchtvaartmaatschappijen welke gevestigd zijn in de Staten, welke zijn aangesloten bij
      de Multilaterale Overeenkomst inzake commerciële rechten voor niet-geregelde luchtdiensten binnen Europa
      (Tractatenblad 1957, 137), mogen, behoudens voorafgaande kennisgeving, tussen Nederland en de andere bij genoemde
      Overeenkomst aangesloten Staten de volgende categorieën commerciële vluchten uitvoeren, t.w.:

      a. vluchten, welke worden uitgevoerd voor menslievende doeleinden of in geval van nood;

      b. passagiersvluchten per luchttaxi, welke een gelegenheidskarakter hebben en op aanvraag worden uitgevoerd,
      mits het luchtvaartuig geen plaatsruimte biedt aan meer dan tien passagiers en mits de bestemming wordt gekozen
      door de huurder of huurders en geen deel van het laadvermogen van het luchtvaartuig onder bezwarende titel wordt
      overgedragen aan publiek;

      c. vluchten, waarbij het gehele laadvermogen van de luchtvaartuigen wordt gehuurd door éénzelfde natuurlijke
      persoon of rechtspersoon voor het vervoer van zijn personeel of goederen, mits geen enkel deel van bedoeld
      laadvermogen aan een derde onder bezwarende titel wordt overgedragen;

      d. op zichzelf staande vluchten, met dien verstande, dat géén recht bestaat op meer dan één vlucht per maand tussen
      dezelfde twee verkeerscentra;

      e. vluchten voor uitsluitend vervoer van vracht;

      f. vluchten voor het vervoer van passagiers tussen gebieden, welke geen redelijke rechtstreekse verbindingen hebben
      door middel van geregelde luchtdiensten.

      2 Voor de toepassing van het eerste lid, onder d, van dit artikel worden de luchthavens Schiphol en Rotterdam
      aangemerkt als luchthavens die zowel voor vluchten van als naar Nederland dezelfde verkeerscentra bedienen.

      3 Desgewenst kan de DG RLD alle benodigde gegevens vragen ten einde zich te overtuigen dat de in dit artikel
      bedoelde vluchten voldoen aan de gestelde criteria.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel10
  - number: '11'
    text: |-
      1 Vluchten in Nederland zijn in beginsel voorbehouden aan luchtvaartmaatschappijen in het bezit van een daartoe
      strekkende vergunning ex [artikel 16 van de Luchtvaartwet][ref1] voor ongeregeld luchtvervoer.

      2 Het luchtvervoer op routes tussen Nederland enerzijds en de Nederlandse Antillen en/of Suriname anderzijds wordt
      in beginsel voorbehouden aan de luchtvaartmaatschappijen van Nederland, de Nederlandse Antillen en Suriname, die
      geregelde luchtdiensten tussen de genoemde landen onderhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '12'
    text: |-
      1 Aanvragen voor toestemming dienen door de betrokken luchtvaartmaatschappij(en) te worden ingediend bij de
      Minister van Verkeer en Waterstaat:

      a. in geval van een op zichzelf staande vlucht of een reeks van niet meer dan vier vluchten ten minste twee volle
      werkdagen voor de (eerste) vlucht; zulks met uitzondering van de in de [artikelen 6][ref1] en [7][ref2] van dit
      besluit bedoelde vluchten, waarvoor de navolgende onder b genoemde termijnen eveneens van toepassing zijn.

      b. in geval van grotere reeksen vluchten ten minste één maand voor de eerste vlucht.

      2 Desgewenst kan de Minister van Verkeer en Waterstaat voor bepaalde categorieën van vluchten afwijkende termijnen
      van indiening vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003376#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003376#Artikel7
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003376
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003376
        artikel: '7'
        hoofdstuk: III
  - number: '13'
    text: |-
      1 Bij aanvragen voor toestemming voor vluchten voor het vervoer van personen dienen ten minste de volgende gegevens
      te worden verstrekt:

      a. naam en adres (inbegrepen telex-of telegramadres) van de betrokken luchtvaartmaatschappij;

      b. de volledige vliegroute, het type van vervoer en het *doel* van het vervoer;

      c. naam en adres (inbegrepen telex- of telegramadres) van de charteraar(s);

      d. het aantal groepen dat op één vliegtuig zal reizen;

      e. de gecontracteerde zitplaatscapaciteit en type van het te gebruiken vliegtuig;

      f. de data en de tijden van vertrek uit en aankomst in Nederland;

      g. de prijs per passagier voor de reis.

      2 Bij aanvragen voor toestemming voor vrachtvluchten dienen de volgende, gegevens te worden verstrekt:

      a. naam en adres (inbegrepen telex- of telegramadres) van de betrokken luchtvaartmaatschappij;

      b. de volledige vliegroute;

      c. de naam en adres (inbegrepen telex- of telegramadres) van de charteraar(s) en de afzender(s);

      d. vracht-capaciteit, type en registratie van het te gebruiken vliegtuig;

      e. de data van vertrek uit en aankomst in Nederland;

      f. aard en gewicht van de vracht per afzender, de plaatsen van bestemming en herkomst en de tarieven.

      3 Wanneer zulks benodigd blijkt dienen aanvullende gegevens te worden verstrekt, alsmede passagierslijsten en
      chartercontracten te worden overgelegd.

      4 De Minister van Verkeer en Waterstaat kan verlangen dat de luchtvaartmaatschappijen hem periodiek gedetailleerde
      gegevens verstrekken van de door hen krachtens deze beschikking uitgevoerde vluchten.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling vracht- en overige vluchten.'
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel14
  - number: '15'
    text: Het besluit van 29 juli 1975, nr. POL/L 23674 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van heden.

      Dit besluit wordt geplaatst in de Nederlandse Staatscourant en in de Luchtvaartgids Nederland, terwijl bij
      Mededeling aan Luchtvarenden (MAL) en Information Circular de uitvaardiging van dit besluit bekend wordt gemaakt.

      Afschrift van dit besluit wordt toegezonden aan de Dienst Luchtvaart van het Korps Rijkspolitie op de luchthaven
      Schiphol.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel16
