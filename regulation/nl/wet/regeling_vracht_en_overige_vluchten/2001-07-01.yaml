articles:
  - number: '1'
    text: |-
      De begripsbepalingen, gegeven in de [Luchtvaartwet][ref1] en de daarop rustende algemene maatregelen van bestuur,
      zijn tevens van toepassing op dit besluit.

      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt voorts verstaan onder:

      A. toestemming respectievelijk ontheffing:

      door de Minister van Verkeer en Waterstaat verleende toestemming respectievelijk ontheffing, als bedoeld in de
      [artikelen 3][ref2] en [4 van het Besluit ongeregeld luchtvervoer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0002965#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002965#Artikel4
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel1
