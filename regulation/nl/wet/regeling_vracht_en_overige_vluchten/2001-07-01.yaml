        artikel: '4'
  - number: '2'
    text: |-
      1 Tenzij bij internationale overeenkomst anders is geregeld, gelden de bepalingen van dit besluit met betrekking
      tot het uitvoeren door luchtvaartmaatschappijen van vluchten naar of uit Nederland of met Nederland als
      tussenstation, alsmede voor vluchten in Nederland welke aansluiting geven op die vluchten:

      a. voor het vervoer van personen, anders dan bij alles-inbegrepen reizen, besloten groepsreizen en A(dvance)
      B(ookin) C(harter) reizen;

      b. voor het vervoer van vracht.

      2 Tevens gelden de bepalingen van dit besluit alsmede de bepalingen van de besluiten houdende regels inzake het
      uitvoeren van vluchten ten behoeve van alles-inbegrepen reizen en houdende regels inzake het luchtvervoer van
      besloten groepen, met betrekking tot het uitvoeren door luchtvaartmaatschappijen van vluchten *in* Nederland, welke
      *géén* aansluiting geven op vluchten naar of uit Nederland of met Nederland als tussenstation.
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel2
  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] bedoelde vluchten mogen slechts worden uitgevoerd na toestemming aan de betrokken
      luchtvaartmaatschappij(en).

      2 Het geven van toestemming wordt geacht te zijn geweigerd indien niet is beschikt:

      a. op aanvragen die ten minste acht weken voor de voorgenomen vluchtdatum zijn ingediend, binnen 30 dagen na
      ontvangst van de aanvraag;

      b. op aanvragen die op een kortere termijn dan vier weken voor de voorgenomen vluchtdatum zijn ingediend, op een
      termijn die in redelijke verhouding staat tot de termijn waarop de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003376#Artikel2
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003376
        artikel: '2'
        hoofdstuk: I
  - number: '4'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 2][ref1] en [3][ref2] mogen luchtvaartmaatschappijen, in
      het bezit van een daartoe strekkende vergunning ex [artikel 16 van de Luchtvaartwet][ref3] voor ongeregeld
      luchtvervoer, zonder toestemming uitvoeren:

      a. vluchten uitsluitend voor het vervoer van vracht;

      b. vluchten voor het vervoer van passagiers in Nederland, voor zover deze vluchten geen aansluiting geven op
      vluchten naar of uit Nederland, of met Nederland als tussenstation;

      c. vluchten voor het vervoer van passagiers naar of uit Nederland of met Nederland als tussenstation, waarbij geen
      commercieel vervoer wordt bewerkstelligd, voor zover deze vluchten geen aansluiting geven op vluchten, waarbij
      commercieel vervoer wordt bewerkstelligd.

      2 Behoudens kennisgeving en op basis van reciprociteit is geen toestemming benodigd voor vluchten waarbij alleen
      technische tussenlandingen of geen tussenlandingen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003376#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0003376/2001-07-01#Artikel4
