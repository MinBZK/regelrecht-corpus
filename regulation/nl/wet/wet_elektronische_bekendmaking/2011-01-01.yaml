preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de bekendmaking en beschikbaarstelling in
    geconsolideerde vorm van wetten, algemene maatregelen van bestuur, anders dan bij wet of algemene maatregel
    van bestuur vastgestelde algemeen verbindende voorschriften en andere besluiten die niet tot een of meer
    belanghebbenden zijn gericht, langs elektronische weg kan geschieden en dat in verband daarmee onder andere moet
    worden voorzien in de elektronische uitgifte van het Staatsblad, de Staatscourant en andere van overheidswege
    uitgegeven publicatiebladen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024913/2011-01-01#ArtikelAanhef
