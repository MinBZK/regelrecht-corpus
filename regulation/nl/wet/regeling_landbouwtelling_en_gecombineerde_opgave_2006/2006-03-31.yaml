---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_landbouwtelling_en_gecombineerde_opgave_2006
regulatory_layer: WET
publication_date: '2007-03-30'
valid_from: '2006-03-31'
bwb_id: BWBR0019662
url: https://wetten.overheid.nl/BWBR0019662/2006-03-31
preamble:
  text: |-
    Gelet op Verordening (EG) nr. 1782/2003 van de Raad van 29 september 2003 tot vaststelling van gemeenschappelijke
    voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers en houdende wijziging van de
    Verordeningen (EEG) nr. 2019/93, (EG) nr. 1452/2001, (EG) nr. 1453/2001, (EG) nr. 1454/2001, (EG) nr. 1868/94, (EG)
    nr. 1251/1999, (EG) nr. 1673/2000, (EEG) nr. 2358/71 en (EG) nr. 2529/2001 (PbEU L 270);

    Gelet op Verordening (EG) nr. 796/2004 van de Commissie van 21 april 2004 houdende uitvoeringsbepalingen inzake de
    randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem waarin is voorzien bij Verordening
    (EG) nr. 1782/2003;

    Gelet op de artikelen 52 en 55 van de Regeling GLB-inkomenssteun 2006, artikel 24 van de Regeling superheffing en
    melkpremie 2004 en gelet op artikel 26 van het Uitvoeringsbesluit Meststoffenwet;

    Voorts gelet op de artikelen 24 en 25 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel1
  - number: 1.a
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel1
  - number: 1.b
    text: |-
      beschrijvingsbiljet: als [bijlage I][ref1] bij deze regeling opgenomen modelformulier;


      [ref1]: https://wetten.overheid.nl/BWBR0019662
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019662
  - number: 1.c
    text: |-
      opgaveplichtige: persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de landbouw
      zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet, bedoeld in
      onderdeel b, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel1
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2006 tot en met 15 mei 2006 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel25
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019031
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt een beschrijvingsbiljet uitgereikt of verzonden
      door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019662#Artikel2
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019662
        artikel: '2'
        paragraaf: '1'
  - number: '4.1'
    text: De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2006.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel4
  - number: '4.2'
    text: |-
      De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de verwachte toestand
      op 15 mei 2006. Indien een beteelde oppervlakte op 15 mei 2006 nog niet zal zijn beteeld, wordt de eerstvolgende
      geplande teelt opgegeven.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel4
  - number: '4.3'
    text: |-
      Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet anders is aangegeven, en neemt daarbij
      de overige op het biljet of door Dienst Regelingen gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel4
  - number: '5.1'
    text: |-
      Voor de bepaling van de bedrijfsomvang geldt dat één Nederlandse grootte-eenheid gelijk is aan 1400 eenheden bruto
      standaardsaldo.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel5
  - number: '5.2'
    text: |-
      De bruto standaardsaldi respectievelijk de Nederlandse grootte-eenheid worden vastgesteld als vermeld in
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019662
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019662
  - number: '5.3'
    text: |-
      Bruto-standaardsaldi worden overeenkomstig [bijlage II][ref1] omgerekend in Nederlandse grootte-eenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019662
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019662
  - number: '6'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] maakt de uit dien hoofde opgaveplichtige die tevens gehouden is:


      [ref1]: https://wetten.overheid.nl/BWBR0019662#Artikel4
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019662
        artikel: '4'
        paragraaf: '1'
  - number: 6.a
    text: |-
      gegevens te verstrekken met betrekking tot subsidieaanvragen op grond van de
      bedrijfstoeslagregeling, de areaalbetalingen voor noten, energiegewassen en eiwithoudende
      gewassen en de productiesteun voor zetmeelaardappelen en zaaizaad van vezelvlas, bedoeld in
      [artikel 2, tweede lid, onderdeel a en b van de Regeling GLB-inkomenssteun 2006][ref1] en de melkpremie, bedoeld in
      [artikel 24 van de Regeling superheffing en melkpremie 2004][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539#Artikel24
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016539
        artikel: '24'
  - number: 6.b
    text: |-
      gegevens te verstrekken met betrekking tot de slachtpremieregeling, bedoeld in
      [artikel 2, tweede lid, sub c van de Regeling GLB-inkomenssteun 2006][ref1] of,


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
  - number: 6.c
    text: |-
      gegevens te verstrekken, als bedoeld in [artikel 26, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel26
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '26'
  - number: '7'
    text: |-
      De opgave, bedoeld in [artikel 2][ref1] van deze regeling, de aanvragen, bedoeld in
      [artikel 6, onder a en b][ref2], van deze regeling en de verstrekking van gegevens, bedoeld in
      [artikel 6 van deze regeling, onder c][ref3], kunnen gezamenlijk elektronisch worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019662#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019662#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019662#Artikel6
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019662
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019662
        artikel: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0019662
        artikel: '6'
        paragraaf: '1'
  - number: '8.1'
    text: De gezamenlijke elektronische indiening geschiedt met het daartoe bestemde elektronische formulier.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel8
  - number: '8.2'
    text: |-
      Het formulier wordt elektronisch ondertekend met een door de Minister aan de ondertekenaar ter beschikking gestelde
      eenmalig bruikbare tancode.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel8
  - number: '8.3'
    text: De Minister bevestigt de ontvangst van een elektronisch ingediend formulier.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel8
  - number: '9'
    text: |-
      Een tancode wordt uitsluitend overeenkomstig deze regeling gebruikt voor het doel waarvoor en door degene aan wie
      de tancode is verstrekt.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel9
  - number: '10'
    text: |-
      De Minister verstrekt op een met redenen omkleed verzoek van de aanvrager een set tancodes ten behoeve van de
      elektronische handtekening, ingeval
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel10
  - number: 10.a
    text: deze geen tancodes heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel10
  - number: 10.b
    text: de verstrekte tancodes zijn gebruikt, of
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel10
  - number: 10.c
    text: van verlies van eerder verstrekte tancodes.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel10
  - number: '11'
    text: |-
      De Minister kan besluiten een set tancodes niet te verstrekken of in te trekken, indien de indiener of een met hem
      geassocieerd bedrijf of organisatie in het verleden een tancode heeft gebruikt in strijd met deze regeling of op
      andere wijze de integriteit van een verstrekte handtekening heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel11
  - number: '12.1'
    text: |-
      Een belanghebbende kan de aan hem verstrekte tancodes doen gebruiken door een gemachtigde als bedoeld in
      [artikel 2:1 van de Algemene wet bestuursrecht][ref1] ten behoeve van het indienen van een elektronische formulier
      namens belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '12.2'
    text: |-
      De gemachtigde maakt bij het indienen van de aanvraag, de opgave onderscheidenlijk de verstrekking als bedoeld
      in [artikel 8][ref1] slechts gebruik van de aan de gemachtigde ter beschikking gestelde toegangscodes tot het
      elektronische formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0019662#Artikel8
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019662
        artikel: '8'
        paragraaf: '2'
  - number: '13.1'
    text: De Minister kan een elektronisch formulier weigeren, indien dit niet overeenkomstig deze regeling is ingediend.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel13
  - number: '13.2'
    text: |-
      De Minister kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of vertrouwelijkheid
      van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel13
  - number: '13.3'
    text: De Minister deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel13
  - number: '14'
    text: |-
      Als tijdstip waarop een elektronisch formulier door de Minister elektronisch is ontvangen, geldt het tijdstip
      waarop alle vereiste bescheiden als bedoeld in artikel 12 van [Verordening (EG) nr. 796/2004](32004R0796) zijn
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel14
  - number: '15'
    text: |-
      De Minister kan besluiten de elektronische aanvraag, opgave onderscheidenlijk verstrekking niet te behandelen,
      indien het elektronisch formulier geheel of gedeeltelijk is geweigerd op grond van [artikel 11][ref1].
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019662#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019662
        artikel: '11'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '16'
    text: |-
      De [Regeling landbouwtelling en gecombineerde opgave 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018131
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018131
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling en gecombineerde opgave 2006.'
    url: https://wetten.overheid.nl/BWBR0019662/2006-03-31#Artikel18
