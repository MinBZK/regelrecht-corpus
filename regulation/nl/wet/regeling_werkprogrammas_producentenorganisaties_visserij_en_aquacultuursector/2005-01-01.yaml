articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *raadsverordening:*


              [Verordening (EG) nr. 104/2000](32000R0104) van de Raad van 17 december 1999 houdende een
      gemeenschappelijke ordening der markten in de sector visserijproducten en producten van de aquacultuur;



            b

              *commissieverordening:*


              [Verordening (EG) nr. 2508/2000](32000R2508) van de Commissie van 15 november 2000 tot vaststelling van
      bepalingen ter uitvoering van [Verordening (EG) nr. 104/2000](32000R0104) wat betreft de werkprogramma's in de
      visserijsector;



            c

              *Dienst Regelingen:*


              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            d

              *producentenorganisatie:*


              groepering van producenten als bedoeld in artikel 5 van de Raadsverordening;



            e

              *werkprogramma:*


              programma voor het visseizoen als bedoeld in artikel 9 van de Raadsverordening;



            f

              *werkverslag:*


              verslag over het visseizoen als bedoeld in artikel 12 van de Commissieverordening.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het visseizoen beslaat de periode van 1 januari tot en met 31 december.

      2 In afwijking van het eerste lid beslaat het seizoen voor de mosselcultuur de periode van 1 juni tot en met 31 mei
      van het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een producentenorganisatie legt binnen zeven weken na het begin van het visseizoen haar werkprogramma ter
      goedkeuring voor aan de Minister.

      2 De Minister keurt, met inachtneming van het in de raadsverordening en de commissieverordening bepaalde, de
      ingediende werkprogramma's goed binnen twaalf weken na het begin van het visseizoen.

      3 Een producentenorganisatie dient binnen zeven weken na afloop van het visseizoen haar werkverslag in bij de
      Minister.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een goedgekeurd werkprogramma kan slechts als gevolg van onvoorziene omstandigheden gedurende het visseizoen
      worden herzien.

      2 Een producentenorganisatie legt een herziening als bedoeld in het eerste lid onmiddellijk en met redenen omkleed
      ter goedkeuring voor aan de Minister.

      3 Een besluit omtrent de goedkeuring wordt binnen zes weken na ontvangst van de herziening genomen.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel4
  - number: '5'
    text: |-
      De Minister kan na afloop van het visseizoen aan producentenorganisatie een vergoeding verstrekken, overeenkomstig
      artikel 10 van de raadsverordening, in de kosten die verbonden zijn geweest aan het opstellen van de
      werkprogramma's.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Voor een vergoeding komt slechts in aanmerking een producentenorganisatie die:

      1. erkend is als bedoeld in artikel 5, tweede lid, van de raadsverordening;

      2. beschikt over een goedgekeurd werkprogramma;

      3. tijdig een werkverslag heeft ingediend waaruit ten genoegen van de Minister blijkt dat zij haar verplichtingen
      krachtens artikel 9 van de Raadsverordening is nagekomen.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 6][ref1] komen in aanmerking voor vergoeding:

        - producentenorganisaties die vóór 1 januari 2001 zijn erkend, gedurende een periode van vier jaar, te rekenen
      vanaf 1 januari 2002;
        - producentenorganisaties die na 1 januari 2001 zijn erkend, gedurende een periode van vijf jaar volgend op het
      jaar van hun erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0014193#Artikel6
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014193
        artikel: '6'
  - number: '8'
    text: |-
      1 De aanvraag voor vergoeding wordt binnen zeven weken na afloop van het visseizoen ingediend door de
      producentenorganisatie bij de Dienst Regelingen door middel van een daartoe vastgesteld formulier.

      2 De vergoeding wordt binnen vier maanden na afloop van het visseizoen uitbetaald door de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel8
  - number: '9'
    text: De Minister stelt de bedragen voor vergoeding vast overeenkomstig artikel 10, tweede lid, van de raadsverordening.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als: Regeling werkprogramma's producentenorganisaties visserij- en
      aquacultuursector.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0014193/2005-01-01#Artikel11
