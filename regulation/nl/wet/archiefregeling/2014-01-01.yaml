        bwb_id: BWBR0007748
        artikel: '11'
  - number: '4'
    text: Papier voldoet aan NEN 2728:2006.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel4
  - number: '5'
    text: |-
      1 Inkten en toners alsmede de apparatuur waarmee deze op papier worden aangebracht bereiken een duurzaamheid
      overeenkomstig ISO 11798:1999.

      2 In afwijking van het eerste lid voldoen balpennen en balpeninkten aan DIN 16554-2:1982 of ISO 12757-2:1998 en
      rollerbalpennen en rollerbalpeninkten aan ISO 14145-2:1998.

      3 De zorgdrager voorkomt dat inkten en toners, die door hem worden gebruikt bij het opmaken en bewaren van
      archiefbescheiden, doorslaan.

      4 Schrijfmachine- en printerlinten bevatten als kleurstof koolstof of gelijkwaardige materialen.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel5
  - number: '6'
    text: |-
      1 Microfilm voor archiefbescheiden is een polyester halogeenzilverfilm, negatief ontwikkeld, die voldoet aan NEN
      3528:1975. Deze film wordt aangeduid als moederfilm.

      2 De kwaliteit van de opname van een moederfilm is overeenkomstig:

      a. Quality Index 10 van NEN-ISO 6199:2005, Annex C, hoog contrast ontwikkeld, voor wat betreft gedrukt of geprint
      materiaal; en

      b. Quality index 8 van NEN-ISO 6199:2005, Annex C, laag contrast ontwikkeld, voor wat betreft handgeschreven
      materiaal.

      3 Van een moederfilm wordt een kopie vervaardigd op een polyester halogeenzilverfilm, die ten opzichte van de
      moederfilm een kwaliteit heeft van ten hoogste 1 target minder volgens NEN-ISO 6199:2005. Deze film wordt aangeduid
      als duplicaatfilm. Bij het kopieerproces vindt geen wisseling van polariteit plaats. Voor het overige is de
      kwaliteit van een duplicaatfilm gelijk aan die van de moederfilm.

      4 De afwerking van moederfilms en duplicaatfilms voldoet aan NEN 2154:1980.

      5 Moederfilms en duplicaatfilms worden niet ter inzage gegeven.

      6 Gebruikskopieën worden gemaakt van een duplicaatfilm.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel6
  - number: '7'
    text: |-
      1 Zwart-witfilm voor archiefbescheiden is een polyester halogeenzilverfilm, negatief ontwikkeld, die voldoet aan
      NEN ISO 18901:2002. De afwerking voldoet aan ISO 18917:1999.

      2 De afwerking van papier voor zwart-witafdrukken voldoet aan ISO 18917:1999.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel7
  - number: '8'
    text: Kleurenfilm voor archiefbescheiden is een polyester film met stabiele kleurstof.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel8
  - number: '9'
    text: |-
      1 Omslagen en mappen zonder hechtmechanieken voldoen aan ICN-kwaliteitseis nummer 1.

      2 Omslagen en mappen met hechtmechanieken voldoen aan ICN-kwaliteitseisen nummers 2 en 12.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel9
  - number: '10'
    text: |-
      1 Archiefdozen voor standaardformaat papier voldoen aan:

      a. ICN-kwaliteitseis nummer 4 of 13, indien omslagen volgens ICN-kwaliteitseis nummer 1 of 2 worden toegepast; of

      b. ICN-kwaliteitseis nummer 3, indien de archiefbescheiden rechtstreeks in contact komen met het karton.

      2 Karton voor archiefdozen van andere dan standaardformaten voldoet aan:

      a. ICN-kwaliteitseis nummer 10 of 16, indien omslagen met ICN-kwaliteitseis nummer 1 of 2 worden toegepast; of

      b. ICN-kwaliteitseis nummer 11, indien de archiefbescheiden rechtstreeks in contact komen met het karton.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel10
  - number: '11'
    text: |-
      1 Zelfklevende etiketten bestemd voor omslagen, mappen en archiefdozen voldoen aan ICN-kwaliteitseis nummer 15.

      2 Voor niet-zelfklevende etiketten wordt lijm op acrylaatbasis gebruikt. De zuurgraad van de lijm heeft een pH-
      waarde van ten minste 7,5 en ten hoogste 10.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel11
  - number: '12'
    text: |-
      1 Andere materialen dan die, bedoeld in de [artikelen 9][ref1], [10][ref2] en [11][ref3], die rechtstreeks met de
      drager van archiefbescheiden in contact komen, bevatten geen:

      a. metaal;

      b. lignine;

      c. weekmakers;

      d. co-polymeren van vinylchloride; of

      e. andere stoffen die de archiefbescheiden kunnen beschadigen of de degradatie ervan bevorderen.

      2 Voor zover de andere materialen, bedoeld in het eerste lid, kunststoffen bevatten, bestaan die kunststoffen
      uitsluitend uit:

      a. polystyreen;

      b. polyethyleen;

      c. polypropyleen; of

      d. polycarbonaat.

      3 Het eerste lid, onderdeel a, is niet van toepassing op materialen als bedoeld in de
      [artikelen 6 tot en met 8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0027041#Artikel10
