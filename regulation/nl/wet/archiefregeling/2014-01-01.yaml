  - number: '3'
    text: |-
      Het gebruik van andere categorieën materialen dan die, bedoeld in dit hoofdstuk, is toegestaan, indien:

      a. deze andere materialen voldoen aan [artikel 11, eerste lid, van het Archiefbesluit 1995][ref1] in verband met de
      eigenschappen van die materialen of als gevolg van regelmatige conserverende handelingen; of

      b. de archiefbescheiden, opgemaakt door middel van deze andere materialen, tijdig worden vervangen door
      reproducties.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel11
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel3
    references:
