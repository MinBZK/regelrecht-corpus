  - number: '59'
    text: |-
      1 [Artikel 33, eerste lid, aanhef en onderdeel a, en tweede lid][ref1], is niet van toepassing op archiefruimten
      die zijn gebouwd voor het tijdstip van inwerkingtreding van deze regeling.

      2 [Artikel 39, eerste lid][ref2], zoals die bepaling luidde voor 1 januari 2014, blijft van toepassing op
      klimaatapparatuur die is geplaatst in de periode van 1 april 2010 tot en met 31 december 2013.

      3 De voor de inwerkingtreding van deze regeling op grond van de [artikelen 43][ref3] en
      [44 van de Regeling bouw en inrichting archiefruimten en archiefbewaarplaatsen][ref4], zoals die luidde voor
      inwerkingtreding van deze regeling, verleende ontheffingen blijven van kracht en gelden als ontheffingen als
      bedoeld in [artikel 57][ref5].


