    Besluit:
  url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *archiefbescheiden:* voor wat betreft:

      1°. [hoofdstuk 2][ref1]: archiefbescheiden als bedoeld in
      [artikel 11, eerste lid, van het Archiefbesluit 1995][ref2];

      2°. [hoofdstuk 3][ref3]: archiefbescheiden als bedoeld in [artikel 12 van het Archiefbesluit 1995][ref4];

      b. *bestandsformaat:* code volgens welke digitale gegevens op een gegevensdrager zijn opgeslagen;

      c. *besturingsprogrammatuur:* programmatuur bestemd voor de besturing van computers en software;

      d. *conversie:* omzetting of overzetting van gegevens in een ander bestandsformaat;

      e. *digitale archiefbescheiden:* archiefbescheiden die uitsluitend met behulp van besturingsprogrammatuur of
      toepassingsprogrammatuur geraadpleegd kunnen worden;

      f. *DIN:* door het Deutsches Institut für Normung uitgegeven norm, vermeld in [bijlage 1][ref5] bij deze regeling;

      g. *emulatie:* techniek waarmee een computer of toepassingsprogrammatuur zich hetzelfde gedraagt als één van een
      oudere generatie;

      h. *gedrag:* geheel van dynamische en interactieve kenmerken van archiefbescheiden

      1°. bij raadpleging of gebruik ten tijde van het ontvangen of opmaken van de archiefbescheiden door het
      overheidsorgaan; en

      2°. die voor het overheidsorgaan kenbaar moeten zijn voor de uitvoering van het betreffende werkproces;

      i. *ICN-kwaliteitseis:* in [bijlage 2][ref6] bij deze regeling opgenomen kwaliteitseis van het Instituut Collectie
      Nederland;

      j. *ISO of ISO-DIS:* door de International Organization for Standardization uitgegeven norm onderscheidenlijk Draft
      International Standard, vermeld in [bijlage 1][ref7] bij deze regeling;

      k. *migratie:* overzetting van gegevens en toepassingsprogrammatuur naar een ander platform;

      l. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      m. *NEN, NEN-EN, NEN-EN-IEC, NEN-EN-ISO/IEC, NEN-ISO of NPR:* door het Nederlands Normalisatie-Instituut uitgegeven
      norm of ontwerpnorm, vermeld in [bijlage 1][ref8] bij deze regeling;

      n. *overbrenging:* overbrenging als bedoeld in de [artikelen 12][ref9] en [13 van de Archiefwet 1995][ref10];

      o. *polyester:* polyethyleentereftalaat;

      p. *structuur:* logisch verband tussen de elementen van een document of van een archief;

      q. *toepassingsprogrammatuur:* programmatuur bestemd voor de ondersteuning van de uitvoering van een werkproces;

      r. *werkproces:* samenhangend geheel van stappen en procedures in het kader van de uitvoering van een taak.


