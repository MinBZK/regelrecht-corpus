        bwb_id: BWBR0027041
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0007748
        artikel: '23'
  - number: '58'
    text: |-
      1 [Artikel 19, tweede lid][ref1], is niet van toepassing op archiefbescheiden die zijn ontvangen of opgemaakt
      voorafgaand aan de inwerkingtreding van deze regeling en, voor zover het digitale archiefbescheiden betreft,
      waaraan of waarin sinds dat tijdstip geen gegevens zijn toegevoegd onderscheidenlijk zijn gewijzigd.

      2 De [artikelen 21][ref2], [22, aanhef en onderdeel b][ref3], en [24][ref4] zijn niet van toepassing op digitale
      archiefbescheiden in digitale bestanden ontvangen of opgemaakt in de periode, gelegen tussen 31 december 2003 en
      het tijdstip van inwerkingtreding van deze regeling, waaraan of waarin sinds laatstbedoeld tijdstip geen gegevens
      zijn toegevoegd onderscheidenlijk zijn gewijzigd.

      3 [Hoofdstuk 3][ref5] is niet van toepassing op digitale archiefbescheiden die zijn ontvangen of opgemaakt
      voorafgaand aan 1 januari 2004, waaraan of waarin sinds die datum geen gegevens zijn toegevoegd onderscheidenlijk
      zijn gewijzigd.

      4 Op digitale archiefbescheiden als bedoeld in het derde lid blijven de bepalingen van de
      [Regeling geordende en toegankelijke staat archiefbescheiden][ref6], zoals die luidde voor inwerkingtreding van
      deze regeling, van toepassing, met dien verstande dat in afwijking van die bepalingen toepassing wordt gegeven aan:

      a. [artikel 25][ref7] van deze regeling, indien een gerede kans bestaat dat dergelijke archiefbescheiden als gevolg
      van wijziging van besturingsprogrammatuur, toepassingsapparatuur of apparatuur niet binnen een redelijke termijn
      leesbaar of waarneembaar te maken zijn; en

      b. [artikel 26][ref8] van deze regeling, indien niet kan worden voldaan aan artikel 6 van de
      [Regeling geordende en toegankelijke staat archiefbescheiden][ref9], zoals die luidde voor inwerkingtreding van
      deze regeling.

      5 De voor de inwerkingtreding van deze regeling op grond van
      [artikel 10, vierde lid, van de Regeling geordende en toegankelijke staat archiefbescheiden][ref10], zoals die
      luidde voor inwerkingtreding van deze regeling, verleende ontheffingen blijven van kracht.


