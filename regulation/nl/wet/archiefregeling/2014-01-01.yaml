  - number: '13'
    text: |-
      Indien archiefbescheiden chemische of fysische reacties kunnen aangaan met andere archiefbescheiden wanneer zij
      met die archiefbescheiden in dezelfde verpakkingseenheid zouden worden bewaard, worden die andere archiefbescheiden
      binnen of buiten de verpakkingseenheid afzonderlijk verpakt.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel13
  - number: '14'
    text: |-
      Archiefbescheiden worden overgezet op nieuwe dragers, zodra het gevaar dreigt dat de informatie verloren gaat dan
      wel onleesbaar of niet waarneembaar wordt als gevolg van:

      a. natuurlijke of door de verpakking veroorzaakte veroudering van de gebruikte materialen; of

      b. het in onbruik raken van het type drager.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel14
  - number: '15'
    text: |-
      1 Optische schijven worden stofvrij, verticaal geplaatst en in het donker opgeborgen.

      2 Verpakkingsmateriaal voor optische schijven voldoet aan NEN-ISO 18925:2002.

      3 Het eerste en het tweede lid zijn van overeenkomstige toepassing op magnetische gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel15
  - number: '16'
    text: |-
      De zorgdrager zorgt ervoor dat het beheer van zijn archiefbescheiden voldoet aan toetsbare eisen van een door hem
      toe te passen kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel16
  - number: '17'
    text: |-
      De zorgdrager zorgt ervoor dat van elk van de archiefbescheiden te allen tijde kan worden vastgesteld:

      a. de inhoud, structuur en verschijningsvorm bij het ontvangen of opmaken ervan door het overheidsorgaan, een en
      ander voor zover deze aspecten kenbaar moesten zijn voor de uitvoering van het betreffende werkproces;

      b. wanneer, door wie en uit hoofde van welke taak of werkproces het door het overheidsorgaan werd ontvangen of
      opgemaakt;

      c. de samenhang met andere door het overheidsorgaan ontvangen en opgemaakte archiefbescheiden;

      d. de met betrekking tot de archiefbescheiden uitgevoerde beheeractiviteiten; en

      e. de besturingsprogrammatuur of toepassingsprogrammatuur waarmee de archiefbescheiden worden bewaard of beheerd.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel17
  - number: '18'
    text: |-
      1 De zorgdrager zorgt ervoor dat de onder hem ressorterende overheidsorganen beschikken over een actueel,
      compleet en logisch samenhangend overzicht van de bij dat overheidsorgaan berustende archiefbescheiden, geordend
      overeenkomstig het ten tijde van de vorming van het archief daarvoor geldende ordeningsstructuur.

      2 Indien de ordeningsstructuur tussentijds wordt aangepast, wordt de oorspronkelijke versie tezamen met de nieuwe
      versie bewaard.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel18
  - number: '19'
    text: |-
      1 De zorgdrager legt een metagegevensschema als bedoeld in NEN-ISO 23081:2006 vast.

      2 De zorgdrager koppelt aan archiefbescheiden metagegevens aan de hand waarvan te allen tijde de aspecten, bedoeld
      in [artikel 17][ref1], kunnen worden herleid.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel17
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0027041
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20'
    text: |-
      De zorgdrager zorgt ervoor dat het archiveringssysteem de toegankelijke staat van archiefbescheiden waarborgt,
      zodanig dat elk van de archiefbescheiden binnen een redelijke termijn

      a. kan worden gevonden

      1°. aan de hand van de daaraan gekoppelde metagegevens; of

      2°. door middel van een andere ontsluitingsmethode; en

      b. leesbaar of waarneembaar te maken is.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel20
  - number: '21'
    text: |-
      In aanvulling op [artikel 17, aanhef en onderdeel a][ref1], zorgt de zorgdrager ervoor, dat van elk van de digitale
      archiefbescheiden te allen tijde het gedrag kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel17
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0027041
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22'
    text: |-
      De zorgdrager zorgt ervoor dat van elk van de digitale archiefbescheiden de functionele eisen worden vastgelegd
      van:

      a. de inhoud, structuur en verschijningsvorm, bedoeld in [artikel 17, onderdeel a][ref1]; en

      b. het gedrag, voor zover dit noodzakelijk is voor het waarborgen van de authenticiteit van de digitale
      archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel17
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0027041
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23'
    text: |-
      In aanvulling op [artikel 18, eerste lid][ref1], zorgt de zorgdrager ervoor, dat aan de hand van het in dat lid
      bedoelde overzicht alle relevante digitale bestanden te identificeren zijn waarmee de bij hem berustende digitale
      archiefbescheiden leesbaar of waarneembaar zijn te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel18
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0027041
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '24'
    text: |-
      In aanvulling op de metagegevens, bedoeld in [artikel 19, tweede lid][ref1], koppelt de zorgdrager aan digitale
      archiefbescheiden metagegevens aan de hand waarvan te allen tijde gegevens over het navolgende kunnen worden
      herleid:

      a. de oorspronkelijke technische aard van de digitale archiefbescheiden, alsmede van de hard- en softwareomgeving
      daarvan;

      b. de actuele technische aard van de digitale archiefbescheiden, alsmede van de hard- en softwareomgeving daarvan,
      zodanig dat reproductie ervan te allen tijde mogelijk is; en

      c. voor zover gebruik is gemaakt van een digitale handtekening:

      1°. de houder van de digitale handtekening;

      2°. het moment van validatie van de digitale handtekening, alsmede het resultaat daarvan;

      3°. de voor de validatie verantwoordelijke functionaris; en

      4°. voor zover bekend ten tijde van het werkproces: de identificatie van het certificaat van de digitale
      handtekening.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel19
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0027041
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '25'
    text: |-
      1 Indien gerede kans bestaat dat als gevolg van wijziging of in onbruik raken van besturingsprogrammatuur of
      toepassingsprogrammatuur niet langer voldaan kan worden aan de bij deze regeling gestelde eisen ten aanzien van
      de toegankelijke en geordende staat van digitale archiefbescheiden, zorgt de zorgdrager ervoor dat conversie of
      migratie van die digitale archiefbescheiden plaatsvindt, dan wel dat die digitale archiefbescheiden door toepassing
      van emulatie kunnen worden gebruikt of geraadpleegd overeenkomstig de wijze ten tijde van het ontvangen of opmaken
      ervan door het overheidsorgaan.

      2 De zorgdrager maakt van de conversie of migratie een verklaring op, die ten minste een specificatie bevat van de
      digitale archiefbestanden die zijn geconverteerd of gemigreerd, en waarin tevens is aangegeven op welke wijze en
      met welk resultaat getoetst is of na de conversie of migratie aan de bij deze regeling gestelde eisen ten aanzien
      van de geordende en toegankelijke staat is of kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel25
  - number: '26'
    text: |-
      1 Digitale archiefbescheiden worden, uiterlijk op het tijdstip van overbrenging, opgeslagen in een valideerbaar
      en volledig gedocumenteerd bestandsformaat dat voldoet aan een open standaard, tenzij dit redelijkerwijs
      niet van de zorgdrager kan worden verlangd. Alsdan vindt met de beheerder van de voor overbrenging aangewezen
      archiefbewaarplaats overleg plaats over een alternatief bestandsformaat.

      2 Voor zover op het tijdstip van overbrenging gebruik wordt gemaakt van encryptietechniek, wordt aan de beheerder
      van de archiefbewaarplaats de bijbehorende decryptiesleutel verstrekt.

      3 Gebruikmaking van compressietechniek is slechts toegestaan, voor zover daarbij niet zodanig verlies van
      informatie optreedt, dat niet langer aan de bij deze regeling gestelde eisen ten aanzien van de toegankelijke en
      geordende staat van digitale archiefbescheiden kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel26
  - number: 26a
    text: Onder vervanging wordt in dit hoofdstuk niet begrepen conversie, migratie of emulatie.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel26a
  - number: 26b
    text: |-
      De zorgdrager verschaft in het besluit tot vervanging, bedoeld in
      [artikel 6, eerste lid, van het Archiefbesluit 1995][ref1], voor zover dit besluit archiefbescheiden betreft die
      ingevolge een selectielijst voor bewaring in aanmerking komen, inzicht in ten minste de volgende aspecten van het
      door hem toegepaste vervangingsproces:

      a. de reikwijdte van het vervangingsproces, waartoe in elk geval worden gerekend een opgave van de
      organisatieonderdelen en de categorieën archiefbescheiden waarvoor het vervangingsproces geldt;

      b. de inrichting van de apparatuur waarmee wordt vervangen, de gekozen instellingen en de randapparatuur;

      c. voor zover van toepassing de software en de gekozen instellingen;

      d. de criteria voor de keuze ter zake van reproductie in kleur, grijswaarden of zwartwit;

      e. de wijze waarop de reproductie tot stand komt, waartoe in elk geval worden gerekend de formaten, bewerkingen,
      metagegevens en, voor zover van toepassing, de keuze ter zake van reproductie per batch of per stuk;

      f. de inrichting van de controle op juiste en volledige weergave en van het herstel van fouten;

      g. het proces van vernietiging van de vervangen archiefbescheiden;

      h. de kwaliteitsprocedures.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel6
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '6'
  - number: '27'
    text: |-
      Aan een in deze regeling opgenomen voorschrift dat moet worden toegepast om te voldoen aan een met betrekking tot
      een archiefruimte of archiefbewaarplaats gestelde eis, behoeft niet te worden voldaan, voor zover anders dan door
      toepassing van dat voorschrift de archiefruimte of archiefbewaarplaats ten minste dezelfde mate van veiligheid,
      bescherming tegen water, klimaatbeheersing en milieuhygiëne biedt, als is beoogd met het betrokken voorschrift.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel27
  - number: '28'
    text: |-
      Het gebouw waarin een archiefruimte of archiefbewaarplaats is of wordt gesitueerd, is door zijn locatie, aard en
      bouwwijze zo goed mogelijk gevrijwaard van risico’s van:

      a. brand;

      b. overstroming; en

      c. vochtindringing door opkomend grond-, regen- of rioolwater, alsmede van elke overige vorm van wateroverlast.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel28
  - number: '29'
    text: |-
      Bij ondergronds bouwen van een archiefruimte of een archiefbewaarplaats heeft de waterindringing in het
      bouwmateriaal een waarde die onschadelijk is voor de bewaring van archiefbescheiden, gemeten volgens:

      a. ISO-DIS 7031:1983 of NPR 2877:1991 voor beton;

      b. NEN 2778:1991 voor andere bouwmaterialen.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel29
  - number: '30'
    text: |-
      1 Archiefruimten en archiefbewaarplaatsen zijn voorzien van deugdelijke en, mede gelet op de aard, oppervlakte en
      inhoud van de archiefruimte onderscheidenlijk archiefbewaarplaats, doelmatige middelen of voorzieningen voor het
      doven en vertragen van brand, waaronder in ieder geval voldoende en zichtbaar gemarkeerde draagbare blustoestellen.
      Poeder- of schuimblussers zijn niet toegestaan.

      2 Voor zover toegepast, zijn sprinklerinstallaties volautomatisch werkend en uitgevoerd met sprinklerkoppen die
      zich aan het plafond en in de stellingen of in de rekken bevinden. Open sprinklerkoppen zijn niet toegestaan.

      3 De middelen en voorzieningen voor het doven en vertragen van brand, bedoeld in eerste en tweede lid, zijn
      geschikt om de schadelijke gevolgen daarvan voor de aanwezige archiefbescheiden te beperken.

      4 De bijdrage tot de brandvoortplanting van in- en uitwendige scheidingsconstructies voldoet ten minste aan klasse
      2 volgens NEN 6065:1991.

      5 Ventilatie- of luchtbehandelingskanalen zijn voorzien van brandkleppen die voldoen aan NEN-EN 1366-1:1999 en NEN-
      EN 1366-2:1999.

      6 Archiefruimten en archiefbewaarplaatsen zijn voorzien van rookmelders en een brandmeldinstallatie met een
      automatische doormelding naar de brandweer. De brandmeldinstallatie wordt beheerd overeenkomstig NEN 2654-1:2002,
      deel 1.

      7 In een archiefruimte of archiefbewaarplaats bevinden zich geen materialen en apparaten die brandgevaar kunnen
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel30
  - number: '31'
    text: In archiefruimten en archiefbewaarplaatsen geldt een rookverbod.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel31
  - number: '32'
    text: |-
      Watermelders, voorzien van een doormelding via het gebouwbeheerssysteem, het beveiligingssysteem of het
      installatiebeheerssysteem, zijn aanwezig in archiefruimten en archiefbewaarplaatsen

      a. die zich deels of geheel beneden het maaiveld bevinden;

      b. die zijn voorzien van een sprinklerinstallatie; of

      c. waarin zich een of meer brandslanghaspels bevinden.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel32
  - number: '33'
    text: |-
      1 Kabels, leidingen of kanalen zijn slechts toegestaan

      a. als opbouw; en

      b. voor noodzakelijke voorzieningen in de archiefruimte of archiefbewaarplaats zelf.

      2 Voor zover een noodzakelijke voorziening zich in een compartiment bevindt, worden de daarvoor benodigde kabels,
      leidingen of kanalen niet door het overige gedeelte van de archiefruimte of archiefbewaarplaats gevoerd.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel33
  - number: '34'
    text: |-
      Deuren in een archiefruimte of een archiefbewaarplaats zijn zelfsluitend en draaien, voor zover draaiend
      uitgevoerd, naar buiten toe open.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel34
  - number: '35'
    text: |-
      De zorgdrager neemt doeltreffende maatregelen tegen ongeautoriseerde toegang tot de archiefruimte of de
      archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel35
  - number: '36'
    text: |-
      1 In een archiefruimte of archiefbewaarplaats bevinden zich geen materialen, apparaten of stoffen die:

      a. de temperatuur en de luchtvochtigheid nadelig kunnen beïnvloeden;

      b. verontreiniging kunnen verspreiden;

      c. insecten of micro-organismen kunnen aantrekken; of

      d. archiefbescheiden op een andere wijze kunnen beschadigen of de degradatie ervan bevorderen.

      2 Niet toegestaan zijn bouw- en afwerkmaterialen waaruit schadelijke gassen kunnen vrijkomen of die op andere wijze
      schade aan de archiefbescheiden kunnen veroorzaken of waarvan een redelijk vermoeden bestaat dat zij in de toekomst
      schade kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel36
  - number: '37'
    text: |-
      Vloeren, wanden en plafonds in een archiefruimte of een archiefbewaarplaats worden glad, vlak en stofvrij
      afgewerkt.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel37
  - number: '39'
    text: |-
      1 Klimaatapparatuur ten behoeve van een archiefruimte of een archiefbewaarplaats is zodanig uitgevoerd dat

      a. via de kanalen ervan geen water, stof, vuil of ongedierte kunnen doordringen; en

      b. geen onderlinge besmetting van compartimenten kan ontstaan met schimmels of andere micro-organismen.

      2 De deugdelijke werking van alle in een archiefruimte of archiefbewaarplaats aanwezige meetapparatuur voor
      relatieve luchtvochtigheid en temperatuur wordt regelmatig gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel39
  - number: '40'
    text: |-
      Archiefstellingen in een archiefruimte of een archiefbewaarplaats worden zodanig geplaatst van

      a. elkaar, van wanden en plafonds alsmede van de overige inrichting, dat steeds voldoende luchtcirculatie mogelijk
      is ter voorkoming van schimmels of andere micro-organismen;

      b. verlichtingselementen, dat geen voor de archiefbescheiden schadelijke warmteontwikkeling kan plaatsvinden; of

      c. doorvoeringen door scheidingsconstructies, dat eventuele branddoorslag geen direct gevaar voor de
      archiefbescheiden oplevert.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel40
  - number: '41'
    text: |-
      Magnetische gegevensdragers voor archiefbescheiden worden bewaard in een gesloten constructie die tegengaat dat
      voor de archiefbescheiden schadelijke elektromagnetische straling deze constructie kan binnendringen.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel41
  - number: '42'
    text: |-
      De vloerbelasting van een archiefruimte is berekend op het maximale gewicht van de daarop staande inrichting
      inclusief archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel42
  - number: '43'
    text: |-
      1 De in- en uitwendige scheidingsconstructies van een archiefruimte hebben een brandwerendheid van ten minste 60
      minuten volgens NEN 6069:2005, dan wel, voor zover gelet op de aard van de scheidingsconstructie van toepassing,
      NEN 6071:2001, NEN 6072:1991 of NEN 6073:1991.

      2 De bijdrage tot de brandvoortplanting van de inrichting voldoet aan klasse 2 volgens NEN 6065:1991.

      3 In of in de nabijheid van een archiefruimte zijn brandslanghaspels aanwezig. Indien de haspels zich in de
      archiefruimte bevinden, zijn deze toegepast met droge blusleidingen waarvan de aansluiting zich buiten de
      archiefruimte bevindt.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel43
  - number: '44'
    text: De luchtinhoud van een archiefruimte wordt ten hoogste eenmaal per etmaal ververst.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel44
  - number: '45'
    text: Een archiefruimte is voorzien van een goedwerkende thermometer en hygrometer. Haarhygrometers zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel45
  - number: 45a
    text: |-
      De relatieve luchtvochtigheid van archiefruimten heeft een zo constant mogelijke waarde van 50% R.V. +/- 10%. De
      temperatuur varieert tussen de 16°C en 20°C. Een overschrijding tot 25°C gedurende ten hoogste 10 etmalen per jaar
      is toegestaan.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel45a
  - number: '46'
    text: |-
      1 Toegangsdeuren in een archiefruimte en hang- en sluitwerk daarop voldoen aan klasse 3 volgens NEN 5088:1994/
      C2:1996 nl.

      2 Externe scheidingsconstructie en gevelelementen voldoen aan weerstandsklasse 4 of hoger volgens NEN 5096:2007
      +C1:2007 nl.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel46
  - number: '47'
    text: |-
      De in- en uitwendige scheidingsconstructies van een archiefbewaarplaats zijn

      a. vervaardigd van gewapend beton in kwaliteiten volgens NEN 6720:1995 of gelijkwaardig materiaal met een massa van
      minimaal 625 kg/m3;

      b. bestand tegen maximale belasting gedurende ten minste 120 minuten volgens NEN 6702:2007 ingeval van
      calamiteiten;

      c. waterdicht; en

      d. voldoende bestand tegen optredende waterdruk.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel47
  - number: '48'
    text: |-
      1 De in- en uitwendige scheidingsconstructies van een archiefbewaarplaats zijn brandwerend gedurende ten minste 120
      minuten volgens NEN 6069:2005, dan wel, voor zover gelet op de aard van de scheidingsconstructie van toepassing,
      NEN 6071:2001, NEN 6072:1991 of NEN 6073:1991.

      2 De hoofddraagconstructie van het gebouw heeft, voor zover van belang voor de archiefbewaarplaats, een
      brandwerendheid met betrekking tot bezwijken van ten minste 120 minuten volgens NEN 6069:2005, dan wel, voor zover
      gelet op de aard van de hoofddraagconstructie van toepassing, NEN 6071:2001, NEN 6072:1991 of NEN 6073:1991.

      3 De bijdrage tot de brandvoortplanting van de inrichting voldoet aan klasse 4 volgens NEN 6065:1991. Deuren zijn
      ten minste 120 minuten brandwerend.

      4 De wijze waarop de bijdrage tot brandvoortplanting van de vloer wordt bepaald voldoet aan klasse T volgens NEN
      1775:1991.

      5 Onverminderd artikel 30, tweede lid, en voor zover toegepast, zijn sprinklerinstallaties in archiefbewaarplaatsen
      uitgevoerd als tweemelderafhankelijk.

      6 De in de archiefbewaarplaats aanwezige draagbare blusapparaten bevinden zich in de directe nabijheid van de
      deuren alsmede op een plaats het verst verwijderd van de uitgang.

      7 In de archiefbewaarplaats is in directe nabijheid van de toegang daartoe een brandslanghaspel aanwezig, die
      voldoet aan NEN-EN 671-1:2001 en waarvan de afsluitkraan buiten de archiefbewaarplaats is aangebracht.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel48
  - number: '49'
    text: |-
      De maatgevende rookdichtheid van de archiefbewaarplaats, met inbegrip van de inrichting ervan, bedraagt ten hoogste
      10 m–1 volgens NEN 6066:1991.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel49
  - number: '50'
    text: |-
      In een archiefbewaarplaats zijn te allen tijde voldoende, goedwerkende telecommunicatiemiddelen voorhanden waarmee
      aanwezigen zich in verbinding kunnen stellen met personen buiten de archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel50
  - number: '51'
    text: |-
      1 De tot de archiefbewaarplaats toetredende verse en gerecirculeerde lucht wordt gezuiverd van zwaveldioxide,
      stikstofoxiden en ozon. De gemiddelde jaarconcentratie in de archiefbewaarplaats bedraagt ten hoogste:

      a. 1.3 ppb voor zwaveldioxide;

      b. 6.7 ppb voor stikstofoxiden; en

      c. 0.3 ppb voor ozon.

      2 Het ventilatievoud bedraagt bij een inrichting met vaste archiefstellingen ten minste 0,1 maal het volume van de
      ruimte per uur.

      3 Het circulatievoud bedraagt ten minste 1 maal het volume van de ruimte per uur.

      4 Bij toepassing van verrijdbare archiefstellingen bedraagt de inwendige circulatie ten minste 1,5 maal het volume
      van de ruimte per uur.

      5 De tot de archiefbewaarplaats toetredende verse en gerecirculeerde lucht bevat ten hoogste 75 µg/m3 stofdeeltjes.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel51
  - number: '52'
    text: |-
      De bewaarcondities in een archiefbewaarplaats worden bewaakt door luchtvochtigheid- en temperatuuropnemers die
      gekoppeld zijn aan het gebouwbeheerssysteem.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel52
  - number: '53'
    text: |-
      Een archiefbewaarplaats waarin regelmatig archiefbescheiden van buiten het gebouw worden opgenomen is voorzien van
      een ontvangst- en quarantaineruimte.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel53
  - number: '54'
    text: |-
      Onverminderd artikel 37 worden wanden en plafonds van een archiefbewaarplaats afgewerkt met een dampdoorlatende
      laag.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel54
  - number: 54a
    text: |-
      1 de relatieve luchtvochtigheid en temperatuur voor archiefbewaarplaatsen bedragen:

      a. 50% R.V. +/- 5% onderscheidenlijk 18°C +/- 2°C voor bewaring van:

      1°. papier;

      2°. perkament;

      3°. was;

      4°. leer;

      5°. textiel;

      6°. hout;

      7°. fotomateriaal op papier; of

      8°. optische schijven;

      b. 35% R.V. +/- 5% onderscheidenlijk 13° C +/- 2°C voor de bewaring van zwart-wit negatiefmaterialen;

      c. 38% R.V.+/- 5% R.V. onderscheidenlijk –20°C +/- 2°C voor de bewaring van zwart-wit negatiefmaterialen van di- en
      triacetaat en nitraatfilm en kleurnegatiefmaterialen;

      d. 40% R.V.+/- 2% R.V. onderscheidenlijk 10°C +/- 2°C voor de bewaring van moederkopieën van tapes; of

      e. 40% R.V.+/- 2% R.V. onderscheidenlijk 18°C +/- 2°C voor de bewaring van werkkopieën van tapes.

      2 Bij tussentijdse verplaatsing van archiefbescheiden naar een andere ruimte wordt voorzien in acclimatisering
      van de archiefbescheiden, indien gerede kans bestaat dat schadelijke condensvorming op zal treden als gevolg van
      verandering van relatieve vochtigheid of temperatuur.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel54a
  - number: '55'
    text: |-
      1 Buitendeuren en andere gevelelementen van een archiefbewaarplaats voldoen aan klasse 3 volgens NEN 5096:2007
      +C1:2007 nl.

      2 Toegangsdeuren zijn ten minste voorzien van insteeksloten met sluitkommen en van veiligheidsbouwbeslag met
      boorzekering, die voldoen aan klasse 3 volgens NEN 5088:1994.

      3 Een archiefbewaarplaats is voorzien van inbraakwering en -signalering die voldoen aan NEN 5089:2009 4e Ontw. nl.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel55
  - number: '56'
    text: Ramen zijn niet toegestaan in een archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel56
  - number: '57'
    text: |-
      1 Op daartoe strekkend verzoek kan in een bijzonder geval ontheffing worden verleend van een of meerdere
      voorschriften in de [hoofdstukken 4][ref1], [5][ref2] en [6][ref3] van deze regeling door:

      a. de minister, voor wat betreft archiefruimten bestemd of aangewezen voor de bewaring van archiefbescheiden,
      bedoeld in de [artikelen 23, eerste en tweede lid][ref4], en 41, eerste lid van de Archiefwet 1995, alsmede voor
      wat betreft de rijksarchiefbewaarplaatsen;

      b. gedeputeerde staten, voor wat betreft andere archiefruimten of archiefbewaarplaatsen.

      2 Aan de ontheffing, bedoeld in het eerste lid, kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0027041#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0027041#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0007748#Artikel23
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel57
