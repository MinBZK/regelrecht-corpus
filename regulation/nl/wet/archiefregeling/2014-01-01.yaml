  - number: '2'
    text: |-
      1 Met de in deze regeling genoemde technische producteisen worden gelijkgesteld technische producteisen die worden
      gesteld in een andere lidstaat van de Europese Unie, in een staat die partij is bij de overeenkomst inzake de
      Europese Economische Ruimte, dan wel in Turkije, en die ten minste een gelijkwaardige productkwaliteit waarborgen.

      2 Met de in deze regeling genoemde normen, uitgegeven door het Deutsches Institut für Normung, de International
      Organization for Standardization en het Nederlands Normalisatie-Instituut, worden gelijkgesteld nieuwere versies
      van die normen, uitgegeven door de betreffende organisaties.
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel2
  - number: 2a
    text: |-
      Aan een norm als bedoeld in [artikel 1, onderdelen f, j, of m][ref1], die is opgenomen in een voorschrift voor
      archiefbescheiden dat is gesteld in de [hoofdstukken 2][ref2] of [3][ref3], behoeft niet te worden voldaan voor
      zover voor archiefbescheiden anders dan door toepassing van die norm tenminste dezelfde mate van duurzaamheid of
      geordende en toegankelijke staat wordt bereikt als is beoogd met het voorschrift waarin die norm is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0027041#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027041#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0027041#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0027041/2014-01-01#Artikel2a
