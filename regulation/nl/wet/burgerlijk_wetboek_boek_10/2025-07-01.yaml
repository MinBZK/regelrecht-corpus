  - number: '137'
    text: |-
      Indien een stuk een aandeelbewijs is volgens het recht dat van toepassing is op de in dat stuk vermelde uitgevende
      vennootschap, bepaalt het recht van de staat op welks grondgebied het aandeelbewijs zich bevindt, of het een
      aandeel op naam dan wel een aandeel aan toonder is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel137
  - number: '138'
    text: |-
      1 Het goederenrechtelijke regime met betrekking tot een aandeel op naam wordt beheerst door het
      recht dat van toepassing is op de vennootschap die het aandeel uitgeeft dan wel heeft uitgegeven.
      [Artikel 135 leden 1 en 2][ref1] van dit Boek is van overeenkomstige toepassing op de vraag welke onderwerpen door
      dat recht worden beheerst.

      2 In afwijking van lid 1 kan met betrekking tot aandelen op naam in een Nederlandse naamloze vennootschap waaraan,
      ter bevordering van de verhandelbaarheid aan een gereglementeerde buitenlandse effectenbeurs een in de staat
      van vestiging van de beurs gebruikelijke vorm is gegeven, door de uitgevende vennootschap worden bepaald dat het
      goederenrechtelijke regime wordt beheerst door het recht van de staat van vestiging van de betrokken beurs dan
      wel het recht van de staat waarin met instemming van de betrokken beurs leveringen en andere goederenrechtelijke
      rechtshandelingen betreffende de aandelen kunnen of moeten worden verricht.

      3 Een aanwijzing van het toepasselijke recht als in lid 2 bedoeld dient uitdrukkelijk, op voor belanghebbenden
      kenbare wijze, te worden gedaan. Tevens dient deze aanwijzing te worden bekendgemaakt in twee landelijk verspreide
      Nederlandse dagbladen.

      4 De betrekkingen tussen de aandeelhouder, onderscheidenlijk de gerechtigde, en de vennootschap, alsmede
      de voorwaarden waaronder de overdracht dan wel de vestiging van een recht aan de vennootschap kan worden
      tegengeworpen, worden beheerst door het recht dat van toepassing is op de vennootschap die het aandeel heeft
      uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel135
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '135'
        afdeling: '3'
  - number: '139'
    text: |-
      1 Het goederenrechtelijke regime met betrekking tot een aandeel aan toonder wordt beheerst door het recht van
      de staat waar het toonderstuk zich bevindt. [Artikel 135 leden 1 en 2][ref1] van dit Boek is van overeenkomstige
      toepassing op de vraag welke onderwerpen door dat recht worden beheerst.

      2 De betrekkingen tussen de aandeelhouder, onderscheidenlijk de gerechtigde, en de vennootschap, alsmede
      de voorwaarden waaronder de overdracht dan wel de vestiging van een recht aan de vennootschap kan worden
      tegengeworpen, worden beheerst door het recht dat van toepassing is op de vennootschap.

      3 De [artikelen 130][ref2] en [131][ref3] van dit Boek zijn van overeenkomstige toepassing op aandelen aan toonder.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel135
