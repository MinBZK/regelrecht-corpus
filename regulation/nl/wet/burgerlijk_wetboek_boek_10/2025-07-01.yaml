  - number: '110'
    text: |-
      1 De erkenning, bedoeld in de [artikelen 108][ref1] en [109][ref2] van dit Boek, houdt tevens in de erkenning van:

      a. de familierechtelijke betrekkingen tussen het kind en zijn adoptiefouders en, in voorkomend geval, de
      bloedverwanten van zijn adoptiefouders;

      b. het gezag van de adoptiefouders over het kind;

      c. de verbreking van de voordien bestaande familierechtelijke betrekkingen tussen het kind en zijn moeder en vader,
      onderscheidenlijk de bloedverwanten van zijn moeder en vader, indien de adoptie dit gevolg heeft in de staat waar
      zij plaatsvond.

      2 Ingeval de adoptie in de staat waar zij plaatsvond niet tot gevolg heeft dat de voordien bestaande
      familierechtelijke betrekkingen worden verbroken, mist de adoptie ook in Nederland dat gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel109
