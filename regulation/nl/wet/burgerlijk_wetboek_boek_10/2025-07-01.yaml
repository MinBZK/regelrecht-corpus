        bwb_id: BWBR0030068
        artikel: '58'
        afdeling: '4'
  - number: '60'
    text: |-
      1 Het aangaan van een geregistreerd partnerschap in Nederland is onderworpen aan de bepalingen van
      [artikel 80a van Boek 1][ref1].

      2 De bevoegdheid van elk van de partners om in Nederland een geregistreerd partnerschap aan te gaan wordt beheerst
      door het Nederlandse recht.

      3 Wat de vorm betreft kan een geregistreerd partnerschap in Nederland slechts rechtsgeldig worden aangegaan ten
      overstaan van de ambtenaar van de burgerlijke stand met inachtneming van het Nederlandse recht, behoudens de
      bevoegdheid van buitenlandse diplomatieke en consulaire ambtenaren om, in overeenstemming met de voorschriften
      van het recht van de door hen vertegenwoordigde staat, aan het aangaan van geregistreerde partnerschappen mede te
      werken indien geen der partijen uitsluitend of mede de Nederlandse nationaliteit bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80a
  - number: '61'
    text: |-
      1 Een buiten Nederland aangegaan geregistreerd partnerschap dat ingevolge het recht van de staat waar het
      geregistreerd partnerschap is aangegaan rechtsgeldig is of nadien rechtsgeldig is geworden, wordt als zodanig
      erkend.

      2 Een buiten Nederland ten overstaan van een diplomatieke of consulaire ambtenaar aangegaan geregistreerd
      partnerschap dat voldoet aan de vereisten van het recht van de staat die die ambtenaar vertegenwoordigt, wordt als
      rechtsgeldig erkend tenzij het aangaan in de staat waar dit plaatsvond niet was toegestaan.

      3 Voor de toepassing van de leden 1 en 2 worden onder recht mede begrepen de regels van internationaal
      privaatrecht.

      4 Een geregistreerd partnerschap wordt vermoed rechtsgeldig te zijn, indien een verklaring omtrent het
      geregistreerd partnerschap is afgegeven door een bevoegde autoriteit.

      5 Ongeacht de leden 1 en 2 kan een buiten Nederland aangegaan geregistreerd partnerschap slechts als zodanig worden
      erkend indien het een wettelijk geregelde samenlevingsvorm betreft van twee personen die een nauwe persoonlijke
      betrekking onderhouden, welke samenlevingsvorm ten minste:

      a. door een ter plaatse van het aangaan bevoegde autoriteit is geregistreerd;

      b. het bestaan van een huwelijk of andere wettelijk geregelde samenlevingsvorm met een derde uitsluit; en

      c. verplichtingen tussen de partners in het leven roept die in hoofdzaak overeenstemmen met die welke verbonden
      zijn aan het huwelijk.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel61
  - number: '62'
    text: |-
      Ongeacht [artikel 61][ref1] van dit Boek wordt aan een buiten Nederland aangegaan geregistreerd partnerschap
      erkenning onthouden, indien deze erkenning kennelijk onverenigbaar is met de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel61
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '61'
        afdeling: '2'
  - number: '63'
    text: |-
      De [artikelen 61][ref1] en [62][ref2] van dit Boek zijn van toepassing, ongeacht of over de erkenning van de
      rechtsgeldigheid van een geregistreerd partnerschap als hoofdvraag, dan wel als voorvraag in verband met een andere
      vraag wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel62
