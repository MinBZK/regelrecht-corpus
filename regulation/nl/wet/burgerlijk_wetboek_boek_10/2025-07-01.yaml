  - number: '18'
    text: |-
      Deze titel geeft mede uitvoering aan de op 5 september 1980 te München tot stand gekomen Overeenkomst inzake het
      recht dat van toepassing is op geslachtsnamen en voornamen (Trb. 1981, 72).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel18
  - number: '19'
    text: |-
      1 De geslachtsnaam en de voornamen van een vreemdeling worden bepaald door het recht van de staat waarvan hij de
      nationaliteit heeft. Onder recht zijn mede begrepen de regels van internationaal privaatrecht. Uitsluitend voor
      de vaststelling van de geslachtsnaam en de voornaam worden de omstandigheden waarvan deze afhangen beoordeeld naar
      dat recht.

      2 Indien de vreemdeling de nationaliteit van meer dan een staat bezit geldt het recht van de staat van zijn
      nationaliteit die tevens zijn gewone verblijfplaats is als zijn nationale recht, of bij gebreke daaraan het recht
      van de staat waarmee hij, alle omstandigheden in aanmerking genomen, het nauwst verbonden is, tenzij uitdrukkelijk
      of anderszins voldoende duidelijk een rechtskeuze voor het recht van een andere staat van een nationaliteit van de
      vreemdeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel19
  - number: '20'
    text: |-
      De geslachtsnaam en de voornamen van een persoon die de Nederlandse nationaliteit bezit, worden, ongeacht de vraag
      of hij nog een andere nationaliteit heeft, bepaald door het Nederlandse recht. Dit geldt ook indien vreemd recht
      van toepassing is op de familierechtelijke betrekkingen waarvan het ontstaan of het tenietgaan gevolg kan hebben
      voor de geslachtsnaam.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel20
  - number: '21'
    text: |-
      Een persoon die de nationaliteit van meer dan een staat bezit, kan de ambtenaar van de burgerlijke stand verzoeken
      op zijn geboorteakte een latere vermelding te plaatsen van de naam die hij voert in overeenstemming met het niet
      toegepaste recht van een van die Staten.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel21
  - number: '22'
    text: |-
      1 In geval van verandering van nationaliteit is het recht van de staat van de nieuwe nationaliteit van toepassing,
      daaronder begrepen de regels van dat recht betreffende de gevolgen van de nationaliteitsverandering voor de naam.

      2 De verkrijging van de Nederlandse nationaliteit door een vreemdeling brengt geen wijziging in diens
      geslachtsnaam en voornamen, behoudens [artikel 25, onder b][ref1], van dit Boek en de [artikelen 6 lid 6][ref2] en
      [12 van de Rijkswet op het Nederlanderschap][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel12
