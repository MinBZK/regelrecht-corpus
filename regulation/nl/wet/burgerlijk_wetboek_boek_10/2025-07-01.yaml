articles:
  - number: '1'
    text: |-
      De in dit Boek en andere wettelijke regelingen vervatte regels van internationaal privaatrecht laten de werking van
      voor Nederland bindende internationale en communautaire regelingen onverlet.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel1
  - number: '2'
    text: De regels van internationaal privaatrecht en het door die regels aangewezen recht worden ambtshalve toegepast.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel2
  - number: '3'
    text: Op de wijze van procederen ten overstaan van de Nederlandse rechter is het Nederlandse recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel3
  - number: '4'
    text: |-
      Indien de vraag welke rechtsgevolgen aan een feit toekomen bij wijze van voorvraag in verband met een andere, aan
      vreemd recht onderworpen vraag moet worden beantwoord, wordt de voorvraag beschouwd als een zelfstandige vraag.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel4
  - number: '5'
    text: |-
      Onder de toepassing van het recht van een staat wordt verstaan de toepassing van de rechtsregels die in die staat
      gelden met uitzondering van het internationaal privaatrecht.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel5
  - number: '6'
    text: Vreemd recht wordt niet toegepast, voor zover de toepassing ervan kennelijk onverenigbaar is met de openbare orde.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel6
  - number: '7'
    text: |-
      1 Bepalingen van bijzonder dwingend recht zijn bepalingen aan de inachtneming waarvan een staat zo veel belang
      hecht voor de handhaving van zijn openbare belangen, zoals zijn politieke, sociale of economische organisatie, dat
      zij moeten worden toegepast op elk geval dat onder de werkingssfeer ervan valt, ongeacht welk recht overigens van
      toepassing is.

      2 De toepassing van het recht waarnaar een verwijzingsregel verwijst, blijft achterwege, voor zover in het gegeven
      geval bepalingen van Nederlands bijzonder dwingend recht toepasselijk zijn.

      3 Bij de toepassing van het recht waarnaar een verwijzingsregel verwijst, kan gevolg worden toegekend aan
      bepalingen van bijzonder dwingend recht van een vreemde staat waarmee het geval nauw is verbonden. Bij de
      beslissing of aan deze bepalingen gevolg moet worden toegekend, wordt rekening gehouden met hun aard en strekking
      alsmede met de gevolgen die uit het toepassen of het niet toepassen van deze bepalingen zouden voortvloeien.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel7
  - number: '8'
    text: |-
      1 Het recht dat is aangewezen door een wettelijke regel die berust op een veronderstelde nauwe band met dat recht,
      blijft bij uitzondering buiten toepassing, indien, gelet op alle omstandigheden van het geval, kennelijk de in die
      regel veronderstelde nauwe band slechts in zeer geringe mate bestaat, en met een ander recht een veel nauwere band
      bestaat. In dat geval wordt dat andere recht toegepast.

      2 Lid 1 is niet van toepassing in geval van een geldige rechtskeuze van partijen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel8
  - number: '9'
    text: |-
      Aan een feit waaraan rechtsgevolgen toekomen naar het recht dat toepasselijk is volgens het internationaal
      privaatrecht van een betrokken vreemde staat, kunnen, ook in afwijking van het naar Nederlands internationaal
      privaatrecht toepasselijke recht, in Nederland dezelfde rechtsgevolgen worden toegekend voor zover de
      niet-toekenning van zodanige gevolgen een onaanvaardbare schending zou zijn van het bij partijen levende
      gerechtvaardigde vertrouwen of van de rechtszekerheid.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel9
  - number: '10'
    text: |-
      Voor zover een rechtskeuze is toegelaten, dient deze uitdrukkelijk te zijn gedaan of anderszins voldoende duidelijk
      te blijken.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Of een natuurlijke persoon minderjarig is en in hoeverre hij bekwaam is rechtshandelingen te verrichten, wordt
      bepaald door zijn nationale recht. Indien de betrokken persoon de nationaliteit van meer dan een staat bezit en hij
      in een van deze staten zijn gewone verblijfplaats heeft, geldt het recht van die staat als zijn nationale recht.
      Heeft hij zijn gewone verblijfplaats niet in een van deze staten, dan geldt als zijn nationale recht het recht van
      de staat van zijn nationaliteit, waarmee hij alle omstandigheden in aanmerking genomen het nauwst verbonden is.

      2 Ten aanzien van een meerzijdige rechtshandeling die valt buiten het toepassingsgebied van de Verordening (EG)
      Nr. 593/2008 van het Europees Parlement en de Raad van 17 juni 2008 inzake het recht dat van toepassing is op
      verbintenissen uit overeenkomst (Rome I) (PbEU L 177) is artikel 13 van die Verordening van overeenkomstige
      toepassing op het beroep op handelingsonbekwaamheid of handelingsonbevoegdheid van een natuurlijk persoon die
      partij is bij die rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel11
  - number: '12'
    text: |-
      1 Een rechtshandeling is wat de vorm betreft geldig indien zij voldoet aan de vormvereisten van het recht dat op de
      rechtshandeling zelf van toepassing is, of van het recht van de staat waar de rechtshandeling is verricht.

      2 Een rechtshandeling die is verricht tussen personen die zich in verschillende staten bevinden, is wat de vorm
      betreft geldig indien zij voldoet aan de vormvereisten van het recht dat op de rechtshandeling zelf van toepassing
      is, of van het recht van een van die staten, of van het recht van de staat waar een van die personen zijn gewone
      verblijfplaats heeft.

      3 Indien de rechtshandeling is verricht door een vertegenwoordiger, wordt onder een staat als bedoeld in de leden 1
      en 2, verstaan de staat waar de vertegenwoordiger zich ten tijde van het verrichten van de rechtshandeling bevindt,
      of waar deze op dat tijdstip zijn gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel12
  - number: '13'
    text: |-
      Het recht dat een rechtsverhouding of rechtsfeit beheerst, is tevens van toepassing voor zover het ten aanzien van
      die rechtsverhouding of dat rechtsfeit wettelijke vermoedens vestigt of regels over de verdeling van de bewijslast
      bevat.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel13
  - number: '14'
    text: |-
      Of een recht of rechtsvordering is verjaard of vervallen, wordt bepaald door het recht dat van toepassing is op de
      rechtsverhouding waaruit dat recht of die rechtsvordering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel14
  - number: '15'
    text: |-
      1 Indien het nationale recht van een natuurlijke persoon van toepassing is en de staat van de nationaliteit van de
      betrokken persoon twee of meer rechtsstelsels kent die van toepassing zijn op verschillende categorieën personen
      of in verschillende gebiedsdelen, bepalen de in die staat ter zake geldende regels welk van die rechtsstelsels van
      toepassing is.

      2 Indien het recht van de gewone verblijfplaats van een natuurlijke persoon van toepassing is en de staat van
      de gewone verblijfplaats van de betrokken persoon twee of meer rechtsstelsels kent die van toepassing zijn op
      verschillende categorieën personen, bepalen de in die staat ter zake geldende regels welk van die rechtsstelsels
      van toepassing is.

      3 Indien de in de leden 1 en 2 bedoelde regels in een staat ontbreken of in de gegeven omstandigheden niet tot
      aanwijzing van een toepasselijk rechtsstelsel leiden, wordt het rechtsstelsel van die staat toegepast waarmee de
      betrokken persoon alle omstandigheden in aanmerking genomen het nauwst verbonden is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel15
  - number: '16'
    text: |-
      1 Indien het nationale recht van een natuurlijke persoon van toepassing is en de betrokken persoon staatloos is of
      zijn nationaliteit niet kan worden vastgesteld, geldt als zijn nationale recht het recht van de staat waar hij zijn
      gewone verblijfplaats heeft.

      2 De rechten welke deze persoon vroeger heeft verkregen en welke uit de persoonlijke staat voortvloeien, in het
      bijzonder de rechten voortvloeiende uit het huwelijk, worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel16
  - number: '17'
    text: |-
      1 De persoonlijke staat van een vreemdeling aan wie een verblijfsvergunning als bedoeld in [artikel 28][ref1] of
      [artikel 33 van de Vreemdelingenwet 2000][ref2] is verleend, van een vreemdeling aan wie een verblijfsdocument
      is afgegeven waarop een aantekening als bedoeld in [artikel 45c van die wet][ref3] is geplaatst, alsmede van een
      vreemdeling die een overeenkomstige verblijfsstatus in het buitenland heeft verkregen, wordt beheerst door het
      recht van zijn woonplaats, of, indien hij geen woonplaats heeft, door het recht van zijn verblijfplaats.

      2 De rechten welke deze vreemdeling vroeger heeft verkregen en welke uit de persoonlijke staat voortvloeien, in het
      bijzonder de rechten voortvloeiende uit het huwelijk, worden geëerbiedigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel45c
