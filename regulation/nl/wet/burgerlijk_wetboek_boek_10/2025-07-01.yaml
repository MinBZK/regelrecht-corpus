  - number: '116'
    text: |-
      Het recht dat toepasselijk is op verplichtingen tot levensonderhoud wordt bepaald door:

      a. het op 23 november 2007 te ’s-Gravenhage tot stand gekomen Protocol inzake het recht dat van toepassing is op
      onderhoudsverplichtingen (PbEU L 331/17),

      b. het op 2 oktober 1973 te ’s-Gravenhage tot stand gekomen Verdrag inzake de wet die van toepassing is op
      onderhoudsverplichtingen (Trb. 1974, 86), of

      c. het op 24 oktober 1956 te ’s-Gravenhage tot stand gekomen Verdrag nopens de wet welke op
      alimentatieverplichtingen jegens kinderen toepasselijk is (Trb. 1956, 144).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel116
  - number: '117'
    text: |-
      In deze titel wordt verstaan onder

      a. corporatie: een vennootschap, vereniging, coöperatie, onderlinge waarborgmaatschappij, stichting en ieder ander
      als zelfstandige eenheid of organisatie naar buiten optredend lichaam en samenwerkingsverband;

      b. functionaris: hij die, zonder orgaan te zijn, krachtens het op de corporatie toepasselijke recht en haar
      statuten of samenwerkingsovereenkomst bevoegd is deze te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel117
  - number: '118'
    text: |-
      Een corporatie die ingevolge de oprichtingsovereenkomst of akte van oprichting haar zetel of, bij gebreke daarvan,
      haar centrum van optreden naar buiten ten tijde van de oprichting, heeft op het grondgebied van de staat naar welks
      recht zij is opgericht, wordt beheerst door het recht van die staat.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel118
  - number: '119'
    text: |-
      Het op een corporatie toepasselijke recht beheerst naast de oprichting in het bijzonder de volgende onderwerpen:

      a. het bezit van rechtspersoonlijkheid, of van de bevoegdheid drager te zijn van rechten en verplichtingen,
      rechtshandelingen te verrichten en in rechte op te treden;

      b. het inwendig bestel van de corporatie en alle daarmee verband houdende onderwerpen;

      c. de bevoegdheid van organen en functionarissen van de corporatie om haar te vertegenwoordigen;

      d. de aansprakelijkheid van bestuurders, commissarissen en andere functionarissen als zodanig jegens de corporatie;

      e. de vraag wie naast de corporatie, voor de handelingen waardoor de corporatie wordt verbonden, aansprakelijk
      is uit hoofde van een bepaalde hoedanigheid zoals die van oprichter, vennoot, aandeelhouder, lid, bestuurder,
      commissaris of andere functionaris van de corporatie;

      f. de beëindiging van het bestaan van de corporatie.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel119
  - number: '120'
    text: |-
      Indien een rechtspersoonlijkheid bezittende corporatie haar statutaire zetel verplaatst naar een ander land en
      het recht van de staat van de oorspronkelijke zetel en dat van de staat van de nieuwe zetel op het tijdstip van
      de zetelverplaatsing het voortbestaan van de corporatie als rechtspersoon erkennen, wordt haar voortbestaan als
      rechtspersoon ook naar Nederlands recht erkend. Vanaf de zetelverplaatsing beheerst het recht van de staat van
      de nieuwe zetel de in [artikel 119][ref1] van dit Boek bedoelde onderwerpen, behoudens indien ingevolge dat recht
      daarop het recht van de staat van de oorspronkelijke zetel van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel119
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '119'
  - number: '121'
    text: |-
      1 In afwijking van de [artikelen 118][ref1] en [119][ref2] van dit Boek zijn de [artikelen 138][ref3] en
      [149 van Boek 2][ref4] van toepassing dan wel van overeenkomstige toepassing op de aansprakelijkheid van
      bestuurders en commissarissen van een ingevolge artikel 118 of [artikel 120][ref5] van dit Boek door buitenlands
      recht beheerste corporatie die in Nederland aan de heffing van vennootschapsbelasting onderworpen is, indien de
      corporatie in Nederland failliet wordt verklaard. Als bestuurders zijn eveneens aansprakelijk degenen die met de
      leiding van de in Nederland verrichte werkzaamheden zijn belast.

      2 De rechtbank die het faillissement heeft uitgesproken is bevoegd tot de kennisneming van alle vorderingen uit
      hoofde van lid 1.


