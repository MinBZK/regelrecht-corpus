        bwb_id: BWBR0030068
        artikel: '95'
        afdeling: '2'
  - number: '97'
    text: |-
      1 Of en onder welke voorwaarden ouderschap van een persoon gerechtelijk kan worden vastgesteld, wordt bepaald
      door het recht van de staat van de gemeenschappelijke nationaliteit van die persoon en de moeder of, indien dit
      ontbreekt, door het recht van de staat waar die persoon en de moeder elk hun gewone verblijfplaats hebben of,
      indien ook dit ontbreekt, door het recht van de staat van de gewone verblijfplaats van het kind.

      2 Wanneer de persoon, genoemd in lid 1, en de moeder een nationaliteit gemeenschappelijk hebben, geldt voor de
      toepassing van lid 1 als hun gemeenschappelijke nationale recht het recht van die nationaliteit, ongeacht of
      zij beiden of een hunner nog een andere nationaliteit bezitten. Bezitten zij meer dan een gemeenschappelijke
      nationaliteit, dan worden zij geacht geen gemeenschappelijke nationaliteit te bezitten.

      3 Voor de toepassing van lid 1 is bepalend het tijdstip van de indiening van het verzoek. Is de persoon, genoemd in
      lid 1, of de moeder op dat tijdstip overleden, dan is, bij gebreke van een gemeenschappelijke nationaliteit op het
      tijdstip van zijn overlijden, toepasselijk het recht van de staat waar die persoon en de moeder op dat tijdstip elk
      hun gewone verblijfplaats hadden of, indien ook dat ontbreekt, het recht van de staat van de gewone verblijfplaats
      van het kind op het tijdstip van de indiening van het verzoek.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel97
  - number: '98'
    text: |-
      1 Of een kind door het huwelijk van een van zijn ouders, dan wel door een nadien genomen beslissing van een
      rechterlijke of andere bevoegde autoriteit, wordt gewettigd, wordt bepaald door de op 10 december 1970 te Rome tot
      stand gekomen Overeenkomst inzake wettiging door huwelijk (Trb. 1972, 61).

      2 Indien toepassing van lid 1 niet leidt tot de wettiging, kunnen familierechtelijke betrekkingen door wettiging
      worden gevestigd volgens het recht van de staat van de gewone verblijfplaats van het kind.

      3 De leden 1 en 2 gelden niet indien een van de ouders de Nederlandse nationaliteit bezit en het huwelijk niet
      geldig is voltrokken in overeenstemming met de [artikelen 30][ref1] en [31][ref2] van dit Boek.

      4 Voor de toepassing van de voorgaande leden is bepalend het tijdstip van het huwelijk van de ouders, dan wel, bij
      de totstandkoming van de familierechtelijke betrekkingen door de beslissing van een rechterlijke of andere bevoegde
      autoriteit, het tijdstip van de indiening van het verzoek of de vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel31
