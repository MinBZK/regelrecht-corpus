  - number: '26'
    text: |-
      De vermelding van de geslachtsnamen en de voornamen in akten van de burgerlijke stand die vóór 1 januari 1990
      in de registers zijn opgenomen, wordt op verzoek van een belanghebbende in overeenstemming met de bepalingen van
      deze titel gewijzigd. Heeft het verzoek betrekking op een vreemdeling, dan moet de wijziging blijken uit een door
      een bevoegde autoriteit van het land waarvan hij de nationaliteit bezit opgemaakt stuk. De wijzigingen worden
      aangebracht door de plaatsing van een latere vermelding.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel26
  - number: '27'
    text: |-
      Deze afdeling geeft uitvoering aan het op 14 maart 1978 te ’s-Gravenhage tot stand gekomen Verdrag inzake de
      voltrekking en de erkenning van de geldigheid van huwelijken (Trb. 1987, 137). Zij is van toepassing op de
      huwelijksvoltrekking in Nederland indien, in verband met de nationaliteit of de woonplaats van de aanstaande
      echtgenoten, met betrekking tot de vraag welk recht de vereisten tot het aangaan van het huwelijk beheerst een
      keuze moet worden gedaan, alsmede op de erkenning in Nederland van in het buitenland voltrokken huwelijken. Zij is
      niet van toepassing op de bevoegdheid van de ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel27
  - number: '28'
    text: |-
      Het huwelijk wordt voltrokken indien ieder der aanstaande echtgenoten voldoet aan de vereisten tot het aangaan van
      een huwelijk van het Nederlandse recht.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel28
  - number: '30'
    text: |-
      Wat de vorm betreft kan een huwelijk in Nederland slechts worden voltrokken ten overstaan van de ambtenaar
      van de burgerlijke stand met inachtneming van het Nederlandse recht, behoudens de bevoegdheid van buitenlandse
      diplomatieke en consulaire ambtenaren om, in overeenstemming met de voorschriften van het recht van de door hen
      vertegenwoordigde staat, aan de voltrekking van huwelijken mede te werken indien geen der partijen uitsluitend of
      mede de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel30
  - number: '31'
    text: |-
      1 Een buiten Nederland gesloten huwelijk dat ingevolge het recht van de staat waar de huwelijksvoltrekking
      plaatsvond rechtsgeldig is of nadien rechtsgeldig is geworden, wordt als zodanig erkend.

      2 Een buiten Nederland ten overstaan van een diplomatieke of consulaire ambtenaar voltrokken huwelijk dat voldoet
      aan de vereisten van het recht van de staat die die ambtenaar vertegenwoordigt, wordt als rechtsgeldig erkend
      tenzij die voltrekking in de staat waar zij plaatsvond niet was toegestaan.

      3 Voor de toepassing van de leden 1 en 2 worden onder recht mede begrepen de regels van internationaal
      privaatrecht.

      4 Een huwelijk wordt vermoed rechtsgeldig te zijn, indien een huwelijksverklaring is afgegeven door een bevoegde
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel31
  - number: '32'
    text: |-
      Ongeacht [artikel 31][ref1] van dit Boek wordt aan een buiten Nederland gesloten huwelijk erkenning onthouden,
      indien deze erkenning kennelijk onverenigbaar is met de openbare orde en in ieder geval indien een der echtgenoten
      op het tijdstip van de sluiting van dat huwelijk:

      a. reeds gehuwd was of een geregistreerd partnerschap had gesloten met een persoon die de Nederlandse nationaliteit
      bezat of zelf de Nederlandse nationaliteit bezat of in Nederland zijn gewone verblijfplaats had, tenzij het eerder
      gesloten huwelijk of geregistreerd partnerschap is ontbonden of nietig verklaard;

      b. aan de andere echtgenoot in rechte lijn verwant was of de broer of zuster van die echtgenoot was, hetzij door
      bloedverwantschap, hetzij door adoptie, tenzij deze familierechtelijke betrekking later is verbroken vanwege het
      ontbreken van biologische verwantschap of herroeping van de adoptie;

      c. niet de leeftijd van achttien jaar had bereikt, tenzij de echtgenoten op het moment dat erkenning van het
      huwelijk gevraagd wordt beiden de leeftijd van achttien jaar hebben bereikt;

      d. geestelijk niet in staat was zijn toestemming te geven, tenzij deze daartoe wel in staat is op het moment dat de
      erkenning van het huwelijk gevraagd wordt en uitdrukkelijk met de erkenning van het huwelijk instemt; of

      e. niet vrijelijk zijn toestemming tot het huwelijk had gegeven, tenzij deze uitdrukkelijk met de erkenning van het
      huwelijk instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel31
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '31'
        afdeling: '1'
  - number: '33'
    text: |-
      De [artikelen 31][ref1] en [32][ref2] van dit Boek zijn van toepassing ongeacht of over de erkenning van de
      rechtsgeldigheid van een huwelijk als hoofdvraag, dan wel als voorvraag in verband met een andere vraag wordt
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel32
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030068
        artikel: '32'
        afdeling: '1'
  - number: '34'
    text: |-
      1 Deze afdeling is niet van toepassing op de erkenning van de geldigheid van huwelijken die zijn voltrokken voor
      1 januari 1990.

      2 Huwelijken die na 1 januari 1990 en voor 15 januari 1999 ten overstaan van buitenlandse diplomatieke en
      consulaire ambtenaren in overeenstemming met het recht van de door hen vertegenwoordigde staat zijn voltrokken
      worden, onverminderd [artikel 6][ref1] van dit Boek, als geldig aangemerkt indien de ene partij uitsluitend of
      mede de Nederlandse nationaliteit bezit en de andere partij uitsluitend of mede de nationaliteit van de door de
      diplomatieke of consulaire ambtenaar vertegenwoordigde staat.

      3 [Artikel 30][ref2] van dit Boek is van toepassing op huwelijken die na 15 januari 1999 ten overstaan van
      buitenlandse diplomatieke en consulaire ambtenaren zijn voltrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel30
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030068
        artikel: '30'
        afdeling: '1'
  - number: 34a
    text: |-
      In deze afdeling wordt onder «de Verordening (EU) nr. 2016/1103» verstaan: de Verordening (EU) nr. 2016/1103
      van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op het gebied van de bevoegdheid,
      het toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het gebied van
      huwelijksvermogensstelsels (PbEU 2016, L 183).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel34a
  - number: '35'
    text: |-
      1 De persoonlijke rechtsbetrekkingen tussen de echtgenoten onderling die niet worden begrepen onder de Verordening
      (EU) nr. 2016/1103, worden beheerst door het recht dat de echtgenoten voor of tijdens het huwelijk, al dan niet met
      wijziging van een eerdere aanwijzing, hebben aangewezen.

      2 De echtgenoten kunnen slechts een van de volgende rechtsstelsels aanwijzen:

      a. het recht van de staat van een gemeenschappelijke nationaliteit van de echtgenoten, of

      b. het recht van de staat waar zij elk hun gewone verblijfplaats hebben.

      3 Een aanwijzing als bedoeld in dit artikel is, wat de vorm betreft, geldig indien de vormvoorschriften voor
      de aanwijzing van het recht dat toepasselijk is op het huwelijksvermogensregime van de echtgenoten in acht zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel35
  - number: '36'
    text: |-
      Bij gebreke van een aanwijzing van het toepasselijke recht worden de persoonlijke rechtsbetrekkingen tussen de
      echtgenoten onderling die niet worden begrepen onder de Verordening (EU) nr. 2016/1103 beheerst:

      a. door het recht van de staat van de gemeenschappelijke nationaliteit van de echtgenoten, of bij gebreke daarvan

      b. door het recht van de staat waar zij elk hun gewone verblijfplaats hebben, of bij gebreke daarvan

      c. door het recht van de staat waarmee zij, alle omstandigheden in aanmerking genomen, het nauwst zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel36
  - number: '37'
    text: |-
      Indien de echtgenoten een nationaliteit gemeenschappelijk hebben, geldt voor de toepassing van [artikel 36][ref1]
      van dit Boek als hun gemeenschappelijke nationale recht het recht van die nationaliteit, ongeacht of zij beiden
      of een hunner nog een andere nationaliteit bezitten. Bezitten de echtgenoten meer dan een gemeenschappelijke
      nationaliteit, dan worden zij geacht geen gemeenschappelijke nationaliteit te bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel36
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '36'
        afdeling: '2'
  - number: '38'
    text: |-
      Indien een aanwijzing als bedoeld in [artikel 35][ref1] van dit Boek of een wijziging in de in [artikel 36][ref2]
      van dit Boek genoemde omstandigheden leidt tot toepasselijkheid van een ander recht dan het voorheen toepasselijke,
      is dat andere recht toepasselijk vanaf het tijdstip van die aanwijzing of wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel36
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '35'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030068
        artikel: '36'
        afdeling: '2'
  - number: '42'
    text: |-
      1 In deze afdeling wordt onder de Verordening (EU) nr. 2016/1103 verstaan: de Verordening (EU) nr.
      2016/1103 van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op het gebied van de
      bevoegdheid, het toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het gebied van
      huwelijksvermogensstelsels

      2 In aanvulling op de Verordening (EU) nr. 2016/1103 zijn de bepalingen van deze afdeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel42
  - number: '45'
    text: |-
      Een echtgenoot wiens huwelijksvermogensregime wordt beheerst door vreemd recht kan in het in
      [artikel 116 van Boek 1][ref1] bedoelde register een notariële akte doen inschrijven, inhoudende een verklaring dat
      het huwelijksvermogensregime wordt beheerst door dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
  - number: '47'
    text: |-
      Heeft een der echtgenoten door de toepassing op een buitenslands gelegen vermogensbestanddeel van een krachtens het
      internationaal privaatrecht van het land van ligging aangewezen recht een voordeel genoten dat hem niet zou zijn
      toegekomen indien het op grond van de Verordening (EU) nr. 2016/1103 aangewezen recht zou zijn toegepast, dan kan
      de andere echtgenoot daarvan verrekening of vergoeding vorderen bij de in verband met de beëindiging of wijziging
      van het huwelijksvermogensregime plaatsvindende afrekening.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel47
  - number: '51'
    text: |-
      1 Of een echtgenoot bij echtscheiding of scheiding van tafel en bed recht heeft op een
      gedeelte van de door de andere echtgenoot opgebouwde pensioenrechten, wordt beheerst door
      het recht dat van toepassing is op het huwelijksvermogensregime van de echtgenoten, behoudens
      [artikel 1 lid 7 van de Wet verevening pensioenrechten bij scheiding][ref1].

      2 Het voorgaande lid is van toepassing op de verevening van pensioenrechten van echtgenoten die na 1 maart 2001 van
      tafel en bed zijn gescheiden of wier huwelijk na 1 maart 2001 is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel1
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '1'
  - number: '53'
    text: |-
      Een aanwijzing door de echtgenoten van het op hun huwelijksvermogensregime toepasselijke recht, of de wijziging
      van een zodanige aanwijzing, welke is geschied voor 1 september 1992, kan niet als ongeldig worden beschouwd
      op de enkele grond dat de wet een zodanige aanwijzing toen niet regelde. Dit geldt niet voor de gevallen dat op
      het huwelijksvermogensregime de bepalingen van het op 17 juli 1905 te ’s-Gravenhage tot stand gekomen Verdrag
      betreffende de wetsconflicten met betrekking tot de gevolgen van het huwelijk ten opzichte van de rechten en
      verplichtingen der echtgenoten in hun persoonlijke betrekkingen en ten opzichte van hun goederen (Stb. 1912, 285)
      toepasselijk waren en de aanwijzing geschiedde voor 23 augustus 1977.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel53
  - number: '54'
    text: |-
      Deze afdeling geeft mede uitvoering aan:

      a. het op 1 juni 1970 te ’s-Gravenhage tot stand gekomen Verdrag inzake de erkenning van echtscheidingen en
      scheidingen van tafel en bed (Trb. 1979, 131); en

      b. het op 8 september 1967 te Luxemburg tot stand gekomen Verdrag inzake de erkenning van beslissingen betreffende
      de huwelijksband (Trb. 1979, 130).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel54
  - number: '55'
    text: |-
      Ontbinding van het huwelijk en scheiding van tafel en bed kunnen in Nederland uitsluitend worden uitgesproken door
      de Nederlandse rechter.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel55
  - number: '56'
    text: |-
      1 Of ontbinding van het huwelijk of scheiding van tafel en bed kan worden uitgesproken en op welke gronden, wordt
      bepaald door het Nederlandse recht.

      2 In afwijking van lid 1 wordt het recht van de staat van een gemeenschappelijke vreemde nationaliteit van de
      echtgenoten toegepast indien in het geding:

      a. door de echtgenoten gezamenlijk een keuze voor dit recht is gedaan of een dergelijke keuze van een van de
      echtgenoten onweersproken is gebleven; of

      b. door een van de echtgenoten een keuze voor dit recht is gedaan en beide echtgenoten een werkelijke
      maatschappelijke band met het land van die gemeenschappelijke nationaliteit hebben.

      3 Een rechtskeuze als bedoeld in het vorige lid moet uitdrukkelijk zijn gedaan of anderszins voldoende duidelijk
      blijken uit de in het verzoekschrift of het verweerschrift gebruikte bewoordingen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel56
  - number: '57'
    text: |-
      1 Een in het buitenland na een behoorlijke rechtspleging verkregen ontbinding van het huwelijk of scheiding van
      tafel en bed wordt in Nederland erkend, indien zij is tot stand gekomen door de beslissing van een rechter of
      andere autoriteit en indien aan die rechter of andere autoriteit daartoe rechtsmacht toekwam.

      2 Een in het buitenland verkregen ontbinding van het huwelijk of scheiding van tafel en bed die niet voldoet aan
      één of meer van de in lid 1 gestelde voorwaarden wordt nochtans in Nederland erkend, indien duidelijk blijkt dat de
      wederpartij hetzij tijdens de buitenlandse procedure uitdrukkelijk of stilzwijgend met die ontbinding of scheiding
      van tafel en bed heeft ingestemd, dan wel na afloop van de procedure in de uitspraak heeft berust.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel57
  - number: '58'
    text: |-
      Een ontbinding van het huwelijk in het buitenland die uitsluitend door een eenzijdige verklaring van een der
      echtgenoten is tot stand gekomen, wordt erkend indien:

      a. de ontbinding in deze vorm overeenstemt met een nationaal recht van de echtgenoot, die het huwelijk eenzijdig
      heeft ontbonden;

      b. de ontbinding in de staat waar zij geschiedde rechtsgevolg heeft; en

      c. duidelijk blijkt dat de andere echtgenoot uitdrukkelijk of stilzwijgend met de ontbinding heeft ingestemd dan
      wel daarin heeft berust.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel58
  - number: '59'
    text: |-
      Ongeacht de [artikelen 57][ref1] en [58][ref2] van dit Boek wordt aan een in het buitenland tot stand gekomen
      ontbinding van het huwelijk erkenning onthouden indien deze erkenning kennelijk onverenigbaar is met de openbare
      orde.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel58
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel59
