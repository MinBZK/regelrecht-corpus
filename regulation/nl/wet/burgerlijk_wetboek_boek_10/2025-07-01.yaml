  - number: '125'
    text: |-
      1 Het recht dat toepasselijk is op vertegenwoordiging wordt bepaald door het op 14 maart 1978 te ’s-Gravenhage tot
      stand gekomen Verdrag betreffende het toepasselijke recht op vertegenwoordiging (Trb. 1978, 138).

      2 Het verdrag is voor Nederland niet van toepassing op vertegenwoordiging inzake verzekeringen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel125
  - number: '126'
    text: |-
      1 Deze titel laat onverlet het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat
      toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141), alsmede [titel 11][ref1] van dit
      Boek. Onverminderd hetgeen voortvloeit uit dat verdrag en die titel, is een rechtshandeling die strekt tot een door
      Nederlands recht beheerste overdracht aan de trustee van een trust als bedoeld in [artikel 142][ref2] van dit Boek
      welke wordt beheerst door buitenlands recht, niet een ongeldige titel op de enkele grond dat die rechtshandeling
      tot doel heeft dat goed over te dragen tot zekerheid of de strekking mist het goed na de overdracht in het vermogen
      van de verkrijger te doen vallen.

      2 Deze titel laat onverlet Richtlijn 2014/60/EU van het Europees Parlement en de Raad van 15 mei 2014 betreffende
      de teruggave van cultuurgoederen die op onrechtmatige wijze buiten het grondgebied van een lidstaat zijn
      gebracht en houdende wijziging van Verordening (EU) nr. 1024/2012 (PbEU 2014, L 159) alsmede de bepalingen ter
      implementatie van deze richtlijn in het Burgerlijk Wetboek, [Wetboek van Burgerlijke Rechtsvordering][ref3] en de
      [Wet tot behoud van cultuurbezit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030068
