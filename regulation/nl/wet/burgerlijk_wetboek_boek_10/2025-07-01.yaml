  - number: '153'
    text: |-
      Voor de toepassing van deze titel wordt verstaan onder de verordening «Rome I»: de verordening (EG) nr. 593/2008
      van het Europees Parlement en de Raad van 17 juni 2008 inzake het recht dat van toepassing is op verbintenissen uit
      overeenkomst (Rome I) (Pb EU L 177).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel153
  - number: '154'
    text: |-
      Op verbintenissen die buiten de werkingssfeer van de verordening «Rome I» en de terzake geldende verdragen vallen
      en die als verbintenissen uit overeenkomst kunnen worden aangemerkt, zijn de bepalingen van de verordening «Rome I»
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel154
  - number: '155'
    text: |-
      In de gevallen bedoeld in artikel 7 lid 3, tweede alinea, van de verordening «Rome I», kunnen partijen een
      rechtskeuze maken overeenkomstig artikel 3 van de verordening «Rome I».
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel155
  - number: '156'
    text: |-
      Voor de toepassing van artikel 7 lid 4, onder b, van de verordening «Rome I» worden verzekeringsovereenkomsten voor
      de dekking van risico’s waarvoor een lidstaat een verplichting oplegt om een verzekering af te sluiten, beheerst
      door het recht van de lidstaat die de verzekeringsplicht oplegt.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel156
  - number: '157'
    text: |-
      Voor de toepassing van deze titel wordt verstaan onder de Verordening «Rome II» : de Verordening (EG) nr. 864/2007
      van het Europees Parlement en de Raad van 11 juli 2007 betreffende het recht dat van toepassing is op niet-
      contractuele verbintenissen (Rome II) (PbEU L 199).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel157
  - number: '158'
    text: |-
      1 De Verordening «Rome II» laat onverlet:

      a. het op 4 mei 1971 te ’s-Gravenhage tot stand gekomen Verdrag inzake de wet die van toepassing is op
      verkeersongevallen op de weg (Trb. 1971, 118); en

      b. het op 2 oktober 1973 te ’s-Gravenhage tot stand gekomen Verdrag betreffende de wet welke van toepassing is op
      de aansprakelijkheid wegens produkten (Trb. 1974, 84).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel158
  - number: '159'
    text: |-
      Op verbintenissen die buiten de werkingssfeer van de verordening «Rome II» en de terzake geldende verdragen
      vallen en die als onrechtmatige daad kunnen worden aangemerkt, zijn de bepalingen van de Verordening «Rome II»
      van overeenkomstige toepassing, met dien verstande dat op verbintenissen voortvloeiend uit de uitoefening van
      Nederlands openbaar gezag Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel159
  - number: '160'
    text: |-
      1 Indien in Nederland in geval van faillissement of van uitwinning de opbrengst van een teboekstaand schip moet
      worden verdeeld, wordt de vraag of, en zo ja, tot welke omvang, een daarbij geldend gemaakte vordering bestaat,
      beantwoord naar het recht dat die vordering beheerst.

      2 Of een vordering als bedoeld in het voorgaande lid bevoorrecht is en welke de omvang, de rangorde en de gevolgen
      van dat voorrecht zijn, wordt beslist naar het recht van de staat waar het schip ten tijde van de aanvang van het
      faillissement of de uitwinning teboekstond. Evenwel wordt bij de bepaling van de rangorde van vorderingen slechts
      aan die vorderingen voorrang toegekend boven door hypotheek gedekte vorderingen, die ook naar Nederlands recht een
      zodanige voorrang genieten.

      3 Aan een vordering die naar het daarop toepasselijke recht niet op het schip bevoorrecht is, wordt geen voorrang
      toegekend.

      4 De leden 2 en 3 zijn van overeenkomstige toepassing op de verhaalbaarheid van een vordering op het schip.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel160
  - number: '161'
    text: |-
      1 De vraag of een partij bij een overeenkomst tot exploitatie van een schip, of een persoon in haar dienst of
      anderszins te haren behoeve werkzaam, dan wel een eigenaar van of belanghebbende bij vervoerde of te vervoeren
      zaken, die buiten overeenkomst wordt aangesproken, zich kan beroepen op een door hemzelf of door een ander in
      de keten der exploitatieovereenkomsten gesloten overeenkomst, wordt beantwoord naar het recht dat op de buiten
      overeenkomst ingestelde vordering van toepassing is.

      2 Evenwel wordt in de verhouding tussen twee partijen bij eenzelfde exploitatieovereenkomst de in het voorgaande
      lid bedoelde vraag beantwoord naar het recht dat op die overeenkomst van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel161
  - number: '162'
    text: |-
      1 Bij vervoer van zaken onder cognossement wordt de vraag of, en zo ja, onder welke voorwaarden, naast degene
      die het cognossement ondertekende of voor wie een ander het ondertekende, een derde als vervoerder onder het
      cognossement verbonden of gerechtigd is, als ook de vraag wie drager is van de uit het cognossement voortvloeiende
      rechten en verplichtingen jegens de vervoerder, beantwoord naar het recht van de staat waarin de haven gelegen is,
      waar uit hoofde van de overeenkomst moet worden gelost, ongeacht een door de partijen bij de vervoerovereenkomst
      gedane rechtskeuze.

      2 Evenwel worden de in lid 1 bedoelde vragen beantwoord naar het recht van de staat waarin de haven van inlading
      gelegen is, wat betreft de verplichtingen ter zake van het ter beschikking stellen van de overeengekomen zaken, de
      plaats, de wijze en de duur van de inlading.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel162
  - number: '163'
    text: |-
      Ongeacht het op de overeenkomst tot vervoer van zaken toepasselijke recht, is het recht van de staat waarin de
      haven gelegen is, waar de zaken ter lossing worden aangevoerd van toepassing op de vragen:

      a. of, en in hoeverre, de vervoerder een recht van retentie op de zaken heeft, en

      b. of, en met welke gevolgen, de vervoerder dan wel degene die jegens de vervoerder recht heeft op aflevering
      van de zaken, bevoegd is een gerechtelijk onderzoek te doen instellen naar de toestand waarin de zaken worden
      afgeleverd en, indien verlies van of schade aan de zaken of een gedeelte daarvan wordt vermoed, een gerechtelijk
      onderzoek te doen instellen naar de oorzaken daarvan, waaronder begrepen een begroting van de schade of het
      verlies.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel163
  - number: '164'
    text: |-
      Voor zover de aansprakelijkheid ter zake van een aanvaring in volle zee niet wordt bestreken door de Verordening
      «Rome II», is daarop van toepassing het recht van de staat waar de vordering wordt ingesteld. De eerste zin is
      eveneens van toepassing indien schade door een zeeschip is veroorzaakt zonder dat een aanvaring plaats had.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel164
  - number: '165'
    text: |-
      1 De rechten, genoemd in het op 19 juni 1948 te Genève tot stand gekomen Verdrag betreffende internationale
      erkenning van rechten op luchtvaartuigen (Trb. 1952, 86) worden erkend onder de voorwaarden en met de gevolgen in
      dat verdrag vermeld.

      2 Deze erkenning werkt niet ten nadele van een beslagleggende crediteur of van de koper ter executie, wanneer de
      vestiging of overdracht van bedoelde rechten geschiedde door de geëxecuteerde, terwijl hij kennis droeg van het
      beslag.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel165
  - number: '166'
    text: |-
      In afwijking van [artikel 154][ref1] is een overeenkomst tot arbitrage materieel geldig als zij geldig is
      naar het recht dat partijen hebben gekozen of naar het recht van de plaats van arbitrage of, indien partijen
      geen rechtskeuze hebben gedaan, naar het recht dat van toepassing is op de rechtsbetrekking waarop de
      arbitrageovereenkomst betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel154
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '154'
  - number: '167'
    text: |-
      Indien een Staat, andere publiekrechtelijke rechtspersoon of staatsonderneming partij is bij een overeenkomst
      tot arbitrage, kan hij geen beroep doen op zijn wet of regelgeving teneinde zijn bekwaamheid of bevoegdheid tot
      het aangaan van de overeenkomst tot arbitrage of de vatbaarheid van het geschil voor beslissing door arbitrage te
      betwisten, indien de wederpartij deze regeling kende noch behoorde te kennen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel167
