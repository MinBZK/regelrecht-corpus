  - number: '99'
    text: |-
      1 Onverminderd hetgeen ten aanzien van bijzondere onderwerpen is bepaald, wordt de inhoud van de familierechtelijke
      betrekkingen tussen ouders en kind bepaald door het recht van de staat van de gemeenschappelijke nationaliteit van
      de ouders of, indien dit ontbreekt, door het recht van de staat waar de ouders elk hun gewone verblijfplaats hebben
      of, indien ook dit ontbreekt, door het recht van de staat van de gewone verblijfplaats van het kind.

      2 Bestaan alleen familierechtelijke betrekkingen tussen de moeder en het kind, dan wordt de inhoud van deze
      familierechtelijke betrekkingen bepaald door het recht van de staat van de gemeenschappelijke nationaliteit van de
      moeder en het kind. Bij gebreke van een gemeenschappelijke nationaliteit wordt zij bepaald door het recht van de
      gewone verblijfplaats van het kind.

      3 Wanneer de ouders, onderscheidenlijk de moeder en het kind een nationaliteit gemeenschappelijk hebben, geldt
      voor de toepassing van lid 1, onderscheidenlijk lid 2 als hun nationale recht het recht van die nationaliteit,
      ongeacht of zij beiden of een hunner nog een andere nationaliteit bezitten. Bezitten de ouders, onderscheidenlijk
      de moeder en het kind meer dan een gemeenschappelijke nationaliteit, dan worden zij geacht geen gemeenschappelijke
      nationaliteit te bezitten.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel99
  - number: '100'
    text: |-
      1 Een buitenslands tot stand gekomen onherroepelijke rechterlijke beslissing waarbij familierechtelijke
      betrekkingen uit hoofde van afstamming zijn vastgesteld of gewijzigd, wordt in Nederland van rechtswege erkend,
      tenzij:

      a. er voor de rechtsmacht van de rechter kennelijk onvoldoende aanknoping bestond met de rechtssfeer van diens
      land;

      b. aan die beslissing kennelijk geen behoorlijk onderzoek of behoorlijke rechtspleging is voorafgegaan, of

      c. de erkenning van die beslissing kennelijk onverenigbaar is met de openbare orde.

      2 De erkenning van de beslissing kan, ook wanneer daarbij een Nederlander betrokken is, niet wegens
      onverenigbaarheid met de openbare orde worden geweigerd op de enkele grond dat daarop een ander recht is toegepast
      dan uit deze titel zou zijn gevolgd.

      3 De beslissing is niet vatbaar voor erkenning indien zij onverenigbaar is met een onherroepelijk geworden
      beslissing van de Nederlandse rechter inzake de vaststelling of wijziging van dezelfde familierechtelijke
      betrekkingen.

      4 De voorgaande leden laten de toepassing van de in [artikel 98lid 1][ref1] van dit Boek bedoelde overeenkomst
      onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel98
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '98'
        afdeling: '3'
  - number: '101'
    text: |-
      1 [Artikel 100 leden 1, onder b en c, 2 en 3][ref1] van dit Boek is van overeenkomstige toepassing op buitenslands
      tot stand gekomen rechtsfeiten of rechtshandelingen waarbij familierechtelijke betrekkingen zijn vastgesteld of
      gewijzigd, welke zijn neergelegd in een door een bevoegde instantie overeenkomstig de plaatselijke voorschriften
      opgemaakte akte.

      2 De weigeringsgrond, bedoeld in [artikel 100 lid 1, onderdeel c][ref2], van dit Boek doet zich met betrekking tot
      de erkenning in elk geval voor

      a. indien deze is verricht door een Nederlander die naar Nederlands recht niet bevoegd zou zijn het kind te
      erkennen;

      b. indien, wat de toestemming van de moeder of het kind betreft, niet is voldaan aan de vereisten van het recht dat
      ingevolge [artikel 95 lid 3][ref3], van dit Boek toepasselijk is, of

      c. indien de akte kennelijk op een schijnhandeling betrekking heeft.

      3 De voorgaande leden laten de toepassing van de in [artikel 98 lid 1][ref4], van dit Boek genoemde Overeenkomst
      onverlet.


