  - number: '23'
    text: |-
      1 Indien de ambtenaar van de burgerlijke stand bij het opstellen van een akte waarin de geslachtsnaam en de
      voornamen van een vreemdeling moeten worden opgenomen het Nederlandse recht toepast omdat hij de inhoud van
      het recht dat op de vaststelling van die namen toepasselijk is niet kan vaststellen, deelt hij zijn beslissing
      onverwijld mede aan de officier van justitie in het arrondissement waarin de rechtbank is gelegen waar de akte in
      de registers van de burgerlijke stand is opgenomen.

      2 De aldus opgemaakte akte kan met overeenkomstige toepassing van [artikel 24 van Boek 1][ref1] op verzoek
      van iedere belanghebbende of op vordering van het openbaar ministerie worden verbeterd. Het verzoek van een
      belanghebbende wordt met toepassing van de Wet op de rechtsbijstand van rechtswege kosteloos behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '24'
  - number: '24'
    text: |-
      1 Indien de geslachtsnaam of de voornamen van een persoon ter gelegenheid van de geboorte buiten Nederland zijn
      vastgelegd of als gevolg van een buiten Nederland tot stand gekomen wijziging in de persoonlijke staat zijn
      gewijzigd en zijn neergelegd in een overeenkomstig de plaatselijke voorschriften door een bevoegde instantie
      opgemaakte akte, worden de aldus vastgelegde of gewijzigde geslachtsnaam of voornamen in Nederland erkend. De
      erkenning kan niet wegens onverenigbaarheid met de openbare orde worden geweigerd op de enkele grond dat een ander
      recht is toegepast dan uit de bepalingen van deze wet zou zijn gevolgd.

      2 Lid 1 laat onverlet de toepassing van [artikel 25][ref1] van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel25
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel24
