  - number: 63a
    text: |-
      In deze afdeling wordt onder «de Verordening (EU) nr. 2016/1104» verstaan de Verordening (EU) nr. 2016/1104
      van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op het gebied van de bevoegdheid, het
      toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het gebied van de vermogensrechtelijke
      gevolgen van geregistreerde partnerschappen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel63a
  - number: '64'
    text: |-
      1 De persoonlijke rechtsbetrekkingen tussen de partners onderling die niet worden begrepen onder de Verordening
      (EU) nr. 2016/1104, worden beheerst door het recht dat de partners voor of tijdens het geregistreerd partnerschap,
      al dan niet met wijziging van een eerdere aanwijzing, hebben aangewezen.

      2 De partners kunnen slechts een rechtsstelsel aanwijzen dat het instituut van het geregistreerd partnerschap kent.

      3 Een aanwijzing als bedoeld in dit artikel is, wat de vorm betreft, geldig indien de vormvoorschriften voor de
      aanwijzing van het recht dat toepasselijk is op het vermogensregime van de partners, in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel64
  - number: '65'
    text: |-
      Bij gebreke van een aanwijzing van het toepasselijke recht worden de persoonlijke rechtsbetrekkingen die niet
      worden begrepen onder de Verordening (EU) nr. 2016/1104 tussen partners die in Nederland een geregistreerd
      partnerschap zijn aangegaan, beheerst door het Nederlandse recht. Zijn de partners buiten Nederland een
      geregistreerd partnerschap aangegaan, dan worden deze persoonlijke rechtsbetrekkingen tussen hen beheerst door
      het recht, met inbegrip van het internationaal privaatrecht, van de staat waar het geregistreerd partnerschap is
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel65
  - number: '66'
    text: |-
      Indien een aanwijzing als bedoeld in [artikel 64][ref1] leidt tot toepasselijkheid van een ander recht dan het
      voorheen toepasselijke, is dat andere recht toepasselijk vanaf het tijdstip van die aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel64
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '64'
        afdeling: '3'
  - number: '70'
    text: |-
      1 In deze afdeling wordt onder de Verordening (EU) nr. 2016/1104 verstaan: de Verordening (EU) nr. 2016/1104
      van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op het gebied van de bevoegdheid, het
      toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het gebied van de vermogensrechtelijke
      gevolgen van geregistreerde partnerschappen.

      2 In aanvulling op de Verordening (EU) nr. 2016/1104 zijn de bepalingen van deze afdeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel70
  - number: '79'
    text: |-
      Een partner wiens partnerschapsvermogensregime wordt beheerst door vreemd recht, kan in het in
      [artikel 116 van Boek 1][ref1] bedoelde register een notariële akte doen inschrijven, inhoudende een verklaring dat
      het partnerschapsvermogensregime wordt beheerst door dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
  - number: '81'
    text: |-
      Heeft een der partners, door de toepassing op een buitenslands gelegen vermogensbestanddeel van een krachtens
      het internationaal privaatrecht van het land van ligging aangewezen recht, ten opzichte van de andere partner
      een voordeel genoten dat hem niet zou zijn toegekomen indien het op grond van de Verordening (EU) nr. 2016/1104
      aangewezen recht zou zijn toegepast, dan kan die andere partner daarvan verrekening of vergoeding vorderen bij de
      in verband met de beëindiging of wijziging van het partnerschapsvermogensregime tussen de partners plaatsvindende
      afrekening.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel81
  - number: '85'
    text: |-
      Of een partner bij beëindiging van het geregistreerd partnerschap met wederzijds goedvinden of door ontbinding
      recht heeft op een gedeelte van de door de andere partner opgebouwde pensioenrechten, wordt beheerst door het
      recht dat van toepassing is op het partnerschapsvermogensregime van de partners, behoudens het bepaalde in
      [artikel 1 lid 7 van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel1
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '1'
  - number: '86'
    text: |-
      Of een in Nederland aangegaan geregistreerd partnerschap in Nederland kan worden beëindigd met wederzijds
      goedvinden of door ontbinding en op welke gronden, wordt bepaald door het Nederlandse recht.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel86
  - number: '87'
    text: |-
      1 Of een buiten Nederland aangegaan geregistreerd partnerschap in Nederland kan worden beëindigd met wederzijds
      goedvinden of door ontbinding en op welke gronden, wordt bepaald door het Nederlandse recht.

      2 In afwijking van lid 1 is het recht van de staat waar het geregistreerd partnerschap is aangegaan toepasselijk
      indien in de door partners gesloten overeenkomst omtrent de beëindiging met wederzijds goedvinden van het
      geregistreerd partnerschap gezamenlijk een keuze voor dit recht is gedaan.

      3 In afwijking van lid 1 is ten aanzien van de beëindiging door ontbinding het recht van de staat waar het
      geregistreerd partnerschap is aangegaan toepasselijk indien in het geding:

      a. door de partners gezamenlijk een keuze voor dit recht is gedaan of een dergelijke keuze door een van de partners
      onweersproken is gebleven; of

      b. door een van beide partners een keuze voor dit recht is gedaan en beide partners een werkelijke maatschappelijke
      band met die staat hebben.

      4 Het Nederlandse recht bepaalt de wijze waarop de beëindiging met wederzijds goedvinden of de ontbinding van het
      buiten Nederland aangegane geregistreerd partnerschap geschiedt.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel87
  - number: '88'
    text: |-
      1 Een buiten Nederland tot stand gekomen beëindiging met wederzijds goedvinden van het geregistreerd partnerschap
      wordt erkend indien zij aldaar rechtsgeldig tot stand is gebracht.

      2 Een buiten Nederland na een behoorlijke rechtspleging verkregen beëindiging door ontbinding van het geregistreerd
      partnerschap wordt in Nederland erkend indien zij is tot stand gekomen door de beslissing van een rechter of andere
      autoriteit aan wie daartoe rechtsmacht toekwam.

      3 Een buiten Nederland verkregen beëindiging door ontbinding van het geregistreerd partnerschap, die niet voldoet
      aan een of meer van de in het vorige lid gestelde voorwaarden, wordt nochtans in Nederland erkend indien duidelijk
      blijkt dat de wederpartij in de buitenlandse procedure uitdrukkelijk of stilzwijgend hetzij tijdens die procedure
      heeft ingestemd met, hetzij zich na die procedure heeft neergelegd bij de ontbinding.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel88
  - number: '89'
    text: |-
      Ongeacht [artikel 88][ref1] van dit Boek wordt aan een in het buitenland tot stand gekomen beëindiging van het
      geregistreerd partnerschap erkenning onthouden indien deze erkenning kennelijk onverenigbaar is met de openbare
      orde.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel88
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '88'
        afdeling: '6'
  - number: '90'
    text: |-
      Het recht dat van toepassing is op verplichtingen tot levensonderhoud gedurende het geregistreerd partnerschap en
      na beëindiging daarvan wordt bepaald door

      a. het op 23 november 2007 te ’s-Gravenhage tot stand gekomen Protocol inzake het recht dat van toepassing is op
      onderhoudsverplichtingen (PbEU L 331/17), of

      b. het op 2 oktober 1973 te ’s-Gravenhage tot stand gekomen Verdrag inzake de wet die van toepassing is op
      onderhoudsverplichtingen (Trb. 1974, 86).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel90
  - number: '91'
    text: |-
      1 Deze titel is niet van toepassing op geregistreerde partnerschappen die voor 1 januari 2005 zijn aangegaan.

      2 In afwijking van lid 1 is [artikel 85][ref1] van dit Boek van toepassing op de verevening van pensioenrechten
      ingeval het geregistreerde partnerschap na 1 januari 2005 is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel85
