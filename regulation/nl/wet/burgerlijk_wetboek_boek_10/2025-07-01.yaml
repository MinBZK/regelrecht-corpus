  - number: '112'
    text: |-
      Deze titel is van toepassing op verzoeken tot adoptie die vanaf 1 januari 2004 in Nederland zijn ingediend en op de
      erkenning van adopties die vanaf 1 januari 2004 buitenslands tot stand zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel112
  - number: '113'
    text: |-
      Op de bescherming van kinderen zijn van toepassing:

      a. het op 19 oktober 1996 te ’s-Gravenhage tot stand gekomen Verdrag inzake de bevoegdheid, het toepasselijke
      recht, de erkenning en tenuitvoerlegging en de samenwerking op het gebied van ouderlijke verantwoordelijkheid en
      maatregelen ter bescherming van kinderen (Trb. 1997, 299),

      b. de Verordening (EU) nr. 2019/1111 van de Raad van 25 juni 2019 betreffende de bevoegdheid, de erkenning en
      tenuitvoerlegging van beslissingen in huwelijkszaken en inzake de ouderlijke verantwoordelijkheid, en betreffende
      internationale kinderontvoering (PbEU L 178), en

      c. de [Uitvoeringswet internationale kinderbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019574
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0019574
  - number: '114'
    text: |-
      Op internationale ontvoering van kinderen zijn van toepassing:

      a. het op 20 mei 1980 te Luxemburg tot stand gekomen Europese Verdrag betreffende de erkenning en de
      tenuitvoerlegging van beslissingen inzake het gezag over kinderen en betreffende het herstel van het gezag over
      kinderen (Trb. 1980, 134),

      b. het op 25 oktober 1980 te ’s-Gravenhage tot stand gekomen Verdrag inzake de burgerrechtelijke aspecten van
      internationale ontvoering van kinderen (Trb. 1987, 139),

      c. de in [artikel 113, onder b][ref1], van dit Boek genoemde verordening, en

      d. de
