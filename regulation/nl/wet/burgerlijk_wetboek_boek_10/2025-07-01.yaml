  - number: '140'
    text: |-
      Indien een aandeel behoort tot een verzameling van effecten die giraal overdraagbaar zijn, is op het
      goederenrechtelijke regime met betrekking tot dat aandeel [afdeling 4][ref1] niet van toepassing voor zover de
      bepalingen daarvan afwijken van [artikel 141][ref2] van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel141
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0030068
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030068
        artikel: '141'
        afdeling: '5'
  - number: '141'
    text: |-
      1 Het goederenrechtelijke regime met betrekking tot giraal overdraagbare effecten wordt beheerst door het recht van
      de staat op welks grondgebied de rekening waarin de effecten worden geadministreerd, wordt gehouden.

      2 Het in het vorige lid bedoelde recht bepaalt in het bijzonder:

      a. welke rechten op de effecten kunnen rusten en welke de aard en de inhoud van deze rechten zijn;

      b. welke vereisten aan de overdracht of de vestiging van de onder a bedoelde rechten worden gesteld;

      c. wie gerechtigd is tot de uitoefening van de in de effecten besloten rechten;

      d. op welke wijze de onder a bedoelde rechten zich wijzigen, overgaan en tenietgaan en welke hun onderlinge
      verhouding is;

      e. de executie.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel141
  - number: '142'
    text: |-
      Voor de toepassing van deze titel wordt verstaan onder:

        - *het Haags Trustverdrag 1985:* het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat
      toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985 141);
        - *trust:* een trust als omschreven in artikel 2 van het Haags Trustverdrag 1985, die door een wilsuiting in het
      leven is geroepen en waarvan blijkt uit een geschrift.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel142
  - number: '143'
    text: |-
      Met betrekking tot een goed ter zake waarvan inschrijvingen kunnen plaatsvinden in een ingevolge de wet gehouden
      register en dat behoort tot de trustgoederen die een afgescheiden vermogen vormen, kan de trustee verlangen dat een
      inschrijving geschiedt op zijn naam en in zijn hoedanigheid van trustee, of op een zodanige andere wijze dat van
      het bestaan van de trust blijkt.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel143
  - number: '144'
    text: |-
      Bepalingen van Nederlands recht inzake eigendomsoverdracht, zekerheidsrecht of de bescherming van schuldeisers
      in geval van insolventie laten de in artikel 11 van het Haags Trustverdrag 1985 omschreven rechtsgevolgen van de
      erkenning van een trust onverlet.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel144
  - number: '145'
    text: |-
      1 Voor de toepassing van deze titel wordt verstaan onder de verordening erfrecht: de verordening (EU) nr. 650/2012
      van het Europees Parlement en de Raad van 4 juli 2012 betreffende de bevoegdheid, het toepasselijke recht, de
      erkenning en de tenuitvoerlegging van beslissingen en de aanvaarding en de tenuitvoerlegging van authentieke akten
      op het gebied van erfopvolging, alsmede betreffende de instelling van een Europese erfrechtverklaring (PbEU 2012,
      L 201).

      2 Voor de toepassing van deze titel wordt verstaan onder het Haags Erfrechtverdrag 1989: het op 1 augustus 1989 te
      ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat van toepassing is op erfopvolging (Trb. 1994, 49).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel145
  - number: '147'
    text: |-
      1 Indien een der gerechtigden in een te vereffenen nalatenschap ten opzichte van een andere gerechtigde wordt
      benadeeld door de toepassing op een buitenslands gelegen vermogensbestanddeel van een krachtens het internationaal
      privaatrecht van het land van ligging aangewezen recht, worden de goederen, aldus overeenkomstig dat recht door die
      andere gerechtigde of door derden verkregen, als geldig verkregen erkend.

      2 De benadeelde gerechtigde kan echter vorderen dat ter gelegenheid van de vereffening van de nalatenschap tussen
      hem en de bevoordeelde gerechtigde een verrekening plaatsvindt tot ten hoogste het ondervonden nadeel. Verrekening
      is uitsluitend mogelijk met betrekking tot goederen van de nalatenschap dan wel door vermindering van een last.

      3 In de voorgaande leden wordt onder gerechtigde verstaan een erfgenaam, een legataris of een lastbevoordeelde.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel147
  - number: '148'
    text: |-
      De herroeping door de erflater van alle eerder door hem gemaakte uiterste wilsbeschikkingen wordt vermoed mede te
      omvatten een eerder door hem gedane aanwijzing van het recht dat de vererving van zijn nalatenschap beheerst.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel148
  - number: '149'
    text: |-
      1 De vereffening van de nalatenschap wordt door het Nederlandse recht beheerst indien de erflater zijn laatste
      gewone verblijfplaats in Nederland had. In het bijzonder zijn van toepassing de Nederlandse voorschriften inzake de
      gehoudenheid van de door het volgens het Haags Erfrechtverdrag 1989 toepasselijke recht aangewezen erfgenamen voor
      de schulden van de erflater en de voorwaarden waaronder zij hun gehoudenheid kunnen uitsluiten of beperken.

      2 De wijze waarop de verdeling van de nalatenschap tot stand wordt gebracht, wordt door het Nederlandse recht
      beheerst indien de erflater zijn laatste gewone verblijfplaats in Nederland had, tenzij de deelgenoten gezamenlijk
      het recht van een ander land aanwijzen. Met de eisen van het goederenrecht van de plaats van ligging der activa
      wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel149
  - number: '150'
    text: |-
      1 De taak en de bevoegdheden van een door de erflater aangewezen vereffenaar worden door het Nederlandse recht
      beheerst indien de erflater zijn laatste gewone verblijfplaats in Nederland had.

      2 De rechter kan op verlangen van een belanghebbende voorzieningen treffen om te waarborgen dat met betrekking tot
      de vererving van de in Nederland gelegen bestanddelen van de nalatenschap het volgens het Haags Erfrechtverdrag
      1989 toepasselijke recht wordt in acht genomen. Hij kan bevelen dat in verband daarmee zekerheden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel150
  - number: '151'
    text: |-
      1 De verordening erfrecht laat onverlet het op 5 oktober 1961 te ’s-Gravenhage tot stand gekomen Verdrag inzake de
      wetsconflicten betreffende de vorm van testamentaire beschikkingen (Trb. 1980, 50). Het recht dat van toepassing is
      op de vorm van uiterste wilsbeschikkingen wordt bepaald door dit verdrag.

      2 Een mondelinge testamentaire beschikking welke, behoudens in buitengewone omstandigheden, is gemaakt door een
      Nederlander die niet tevens een andere nationaliteit bezit, wordt in Nederland niet erkend.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel151
  - number: '152'
    text: |-
      1 De [artikelen 147][ref1] en [148][ref2] zijn van toepassing op de erfopvolging van personen wier overlijden na
      1 oktober 1996 heeft plaatsgevonden. Op de erfopvolging van personen wier overlijden op of na 17 augustus 2015
      heeft plaatsgevonden is artikel 147 alleen van toepassing als het vermogensbestanddeel waarop de verrekening
      betrekking heeft, ligt in een staat die niet gebonden is door de verordening erfrecht.

      2 Indien de erflater voor 1 oktober 1996 het op zijn erfopvolging toepasselijke recht heeft aangewezen, wordt die
      aanwijzing als geldig beschouwd indien zij voldoet aan de vereisten van artikel 5 van het Haags Erfrechtverdrag
      1989.

      3 Indien de partijen bij een overeenkomst inzake erfopvolging voor 1 oktober 1996 het op die overeenkomst
      toepasselijke recht hebben aangewezen, wordt die aanwijzing als geldig beschouwd indien zij voldoet aan de
      vereisten van artikel 11 van het Haags Erfrechtverdrag 1989.

      4 Onverminderd de voorgaande leden kan een aanwijzing door de erflater van het op de vererving van zijn
      nalatenschap toepasselijke recht of de wijziging van een zodanige aanwijzing, welke is geschied voor 1 oktober
      1996, niet als ongeldig worden beschouwd op de enkele grond dat de wet een zodanige aanwijzing toen niet regelde.

      5 De [artikelen 149][ref3] en [150][ref4] zijn uitsluitend van toepassing op de erfopvolging van personen wier
      overlijden na 1 oktober 1996 en vóór 17 augustus 2015 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel148
      [ref3]: https://wetten.overheid.nl/BWBR0030068#Artikel149
      [ref4]: https://wetten.overheid.nl/BWBR0030068#Artikel150
