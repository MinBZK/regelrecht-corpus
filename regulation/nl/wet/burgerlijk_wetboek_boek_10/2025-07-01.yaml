  - number: '102'
    text: |-
      Deze afdeling is van toepassing op rechtsbetrekkingen die na 1 januari 2003 zijn vastgesteld of gewijzigd alsmede
      op de erkenning van na 1 januari 2003 buitenslands vastgestelde of gewijzigde rechtsbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel102
  - number: '103'
    text: |-
      Voor de toepassing van deze titel wordt onder het Haags Adoptieverdrag 1993 verstaan: het op 29 mei 1993 te ’s-
      Gravenhage tot stand gekomen verdrag inzake de bescherming van kinderen en de samenwerking op het gebied van de
      interlandelijke adoptie (Trb. 1993, 97).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel103
  - number: '104'
    text: |-
      Onverminderd het Haags Adoptieverdrag 1993, de Wet van 14 mei 1998 tot uitvoering van het op 29 mei 1993 te ’s-
      Gravenhage tot stand gekomen Verdrag inzake de bescherming van kinderen en de samenwerking op het gebied van de
      inderlandelijke adoptie (Stb. 1998, 302) en de [Wet opneming buitenlandse kinderen ter adoptie][ref1], wordt in
      deze titel onder adoptie verstaan de beslissing van een bevoegde autoriteit waarbij familierechtelijke betrekkingen
      tussen een minderjarig kind en twee personen tezamen of een persoon alleen tot stand worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004447
  - number: '105'
    text: |-
      1 Op een in Nederland uit te spreken adoptie is, behoudens lid 2, het Nederlandse recht van toepassing.

      2 Op de toestemming dan wel de raadpleging of de voorlichting van de ouders van het kind of van andere personen
      of instellingen is toepasselijk het recht van de staat waarvan het kind de nationaliteit bezit. Bezit het kind de
      nationaliteit van meer dan een staat, dan is toepasselijk het recht volgens hetwelk toestemming dan wel raadpleging
      of voorlichting vereist is. Bezit het kind de Nederlandse nationaliteit, dan is het Nederlandse recht van
      toepassing, ongeacht of het kind naast de Nederlandse nationaliteit nog een andere nationaliteit bezit.

      3 Indien het ingevolge lid 2 op de toestemming dan wel raadpleging of voorlichting toepasselijke recht de adoptie
      niet kent, is het Nederlandse recht van toepassing. Het ingevolge dit lid toepasselijke recht bepaalt tevens of bij
      gebreke van toestemming deze kan worden vervangen door een rechterlijke beslissing.

      4 Op de herroeping van een in Nederland uitgesproken adoptie is het Nederlandse recht van toepassing.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel105
  - number: '106'
    text: |-
      Een in Nederland uitgesproken adoptie heeft, wat betreft het ontstaan en de verbreking van familierechtelijke
      betrekkingen, de rechtsgevolgen die daaraan worden toegekend door het Nederlandse recht.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel106
  - number: '107'
    text: Deze afdeling heeft betrekking op adopties waarop het Haags Adoptieverdrag 1993 niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel107
  - number: '108'
    text: |-
      1 Een buitenslands gegeven beslissing waarbij een adoptie tot stand is gekomen, wordt in Nederland van rechtswege
      erkend indien zij is uitgesproken door:

      a. een ter plaatse bevoegde autoriteit van de staat waar de adoptiefouders en het kind zowel ten tijde van het
      verzoek tot adoptie als ten tijde van de uitspraak hun gewone verblijfplaats hadden; of

      b. een ter plaatse bevoegde autoriteit van de staat waar hetzij de adoptiefouders, hetzij het kind zowel ten tijde
      van het verzoek tot adoptie als ten tijde van de uitspraak hun gewone verblijfplaats hadden.

      2 Aan een beslissing houdende adoptie wordt erkenning onthouden indien:

      a. aan die beslissing kennelijk geen behoorlijk onderzoek of behoorlijke rechtspleging is voorafgegaan, of

      b. in het geval, bedoeld in lid 1, onder b, de beslissing niet is erkend in de staat waar het kind,
      onderscheidenlijk de staat waar de adoptiefouders zowel ten tijde van het verzoek tot adoptie als ten tijde van de
      uitspraak hun gewone verblijfplaats hadden; of

      c. de erkenning van die beslissing kennelijk onverenigbaar is met de openbare orde.

      3 Op de in lid 2, onder c, genoemde grond wordt aan een beslissing houdende adoptie in elk geval erkenning
      onthouden indien de beslissing kennelijk op een schijnhandeling betrekking heeft.

      4 De erkenning van de beslissing kan, ook wanneer daarbij een Nederlander betrokken is, niet op de in lid 2,
      onder c, genoemde grond worden geweigerd enkel omdat daarop een ander recht is toegepast dan uit de bepalingen van
      afdeling 2 zou zijn gevolgd.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel108
  - number: '109'
    text: |-
      1 Een buitenslands gegeven beslissing waarbij een adoptie tot stand is gekomen en die is uitgesproken door een ter
      plaatse bevoegde autoriteit van de staat waar het kind zowel ten tijde van het verzoek tot adoptie als ten tijde
      van de uitspraak zijn gewone verblijfplaats had, terwijl de adoptiefouders hun gewone verblijfplaats in Nederland
      hadden, wordt erkend indien:

      a. de bepalingen van de [Wet opneming buitenlandse kinderen ter adoptie in acht][ref1] zijn genomen,

      b. de erkenning van de adoptie in het kennelijk belang van het kind is, en

      c. erkenning niet op een grond, bedoeld in [artikel 108 lid 2 of lid 3][ref2] van dit Boek, zou worden onthouden.

      2 Een adoptie als bedoeld in lid 1 wordt slechts erkend indien de rechter heeft vastgesteld dat aan de in dat lid
      genoemde voorwaarden voor erkenning is voldaan. Toepasselijk is de procedure van [artikel 26 van Boek 1][ref3] .

      3 De rechter die vaststelt dat aan de voorwaarden voor erkenning van de adoptie is voldaan, geeft ambtshalve
      een last tot toevoeging van een latere vermelding van de adoptie aan de daarvoor in aanmerking komende akte van
      de burgerlijke stand. De [artikelen 25 lid 5][ref4], [25c lid 3][ref5] en [25g lid 2 van Boek 1][ref6] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004447
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel108
