  - number: '127'
    text: |-
      1 Behoudens voor zover in de leden 2 en 3 anders is bepaald, wordt het goederenrechtelijke regime met betrekking
      tot een zaak beheerst door het recht van de staat op welks grondgebied de zaak zich bevindt.

      2 Behoudens [artikel 160][ref1] van dit Boek wordt het goederenrechtelijke regime met betrekking tot teboekstaande
      schepen beheerst door het recht van de staat waar het schip teboekstaat.

      3 Het goederenrechtelijke regime met betrekking tot teboekstaande luchtvaartuigen en luchtvaartuigen die
      uitsluitend staan ingeschreven in een nationaliteitsregister als bedoeld in artikel 17 van het op 7 december 1944
      te Chicago tot stand gekomen Verdrag inzake de internationale burgerluchtvaart, Stb. 1947, H 165, wordt beheerst
      door het recht van de staat waar het luchtvaartuig teboekstaat of in het nationaliteitsregister is ingeschreven.

      4 Het in de vorige leden bedoelde recht bepaalt in het bijzonder:

      a. of een zaak roerend of onroerend is;

      b. wat een bestanddeel van een zaak is;

      c. of een zaak vatbaar is voor overdracht van de eigendom ervan of vestiging van een recht erop;

      d. welke vereisten aan een overdracht of vestiging worden gesteld;

      e. welke rechten op een zaak kunnen rusten en welke de aard en de inhoud van deze rechten zijn;

      f. op welke wijze die rechten ontstaan, zich wijzigen, overgaan en tenietgaan en welke hun onderlinge verhouding
      is.

      5 Voor de toepassing van het vorige lid is, wat betreft de verkrijging, de vestiging, de overgang, de wijziging
      of het tenietgaan van rechten op een zaak, bepalend het tijdstip waarop de daarvoor noodzakelijke rechtsfeiten
      geschieden.

      6 De voorgaande leden zijn van overeenkomstige toepassing in het geval van overdracht en van vestiging van rechten
      op zakelijke rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel160
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '160'
  - number: '128'
    text: |-
      1 De goederenrechtelijke gevolgen van een eigendomsvoorbehoud worden beheerst door het recht van de staat op welks
      grondgebied de zaak zich op het tijdstip van levering bevindt. Zulks laat onverlet de verbintenissen die volgens
      het op het beding van eigendomsvoorbehoud toepasselijke recht, daaruit kunnen voortvloeien.

      2 In afwijking van de eerste zin van lid 1 kunnen partijen overeenkomen dat de goederenrechtelijke gevolgen van een
      eigendomsvoorbehoud van een voor uitvoer bestemde zaak worden beheerst door het recht van de staat van bestemming
      indien op grond van dat recht het eigendomsrecht niet zijn werking verliest totdat de prijs volledig is betaald.
      De aldus overeengekomen aanwijzing heeft slechts gevolg indien de zaak daadwerkelijk in de aangewezen staat van
      bestemming wordt ingevoerd.

      3 De voorgaande leden zijn van overeenkomstige toepassing op de goederenrechtelijke gevolgen van leasing van zaken
      die bestemd zijn voor gebruik in het buitenland.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel128
  - number: '129'
    text: |-
      Onverminderd [artikel 163, aanhef en onder a][ref1], van dit Boek worden het ontstaan en de inhoud van een recht
      van retentie bepaald door het recht dat de daaraan ten grondslag liggende rechtsverhouding beheerst. Een recht van
      retentie kan slechts geldend worden gemaakt voor zover het recht van de staat op welks grondgebied de zaak zich
      bevindt, zulks toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel163
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '163'
  - number: '130'
    text: |-
      Rechten op een zaak die overeenkomstig het ingevolge deze titel toepasselijke recht zijn verkregen of gevestigd,
      blijven daarop rusten, ook indien die zaak wordt overgebracht naar een andere staat. Deze rechten kunnen niet
      worden uitgeoefend op een wijze die onverenigbaar is met het recht van de staat op welks grondgebied de zaak zich
      ten tijde van die uitoefening bevindt.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel130
  - number: '131'
    text: |-
      De rechtsgevolgen van de verkrijging van een zaak van een beschikkingsonbevoegde worden beheerst door het recht van
      de staat op welks grondgebied de zaak zich ten tijde van die verkrijging bevond.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel131
  - number: '132'
    text: |-
      1 Indien het bezit van een zaak onvrijwillig is verloren en na dit verlies onbekend is in welke staat de
      zaak zich bevindt, worden de rechtsgevolgen van goederenrechtelijke rechtshandelingen, door de eigenaar of
      zijn rechtsopvolger verricht, beheerst door het recht van de staat op welks grondgebied de zaak zich voor het
      bezitsverlies bevond.

      2 Is in het in het vorige lid bedoelde geval het verlies door een verzekering gedekt, dan bepaalt het recht dat de
      verzekeringsovereenkomst beheerst, of en op welke wijze de eigendom op de verzekeraar overgaat.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel132
  - number: '133'
    text: |-
      1 Het goederenrechtelijke regime met betrekking tot een zaak die krachtens een overeenkomst van internationaal
      vervoer wordt vervoerd, wordt beheerst door het recht van de staat van bestemming.

      2 Indien het in lid 1 bedoelde vervoer plaatsvindt ter uitvoering van een koopovereenkomst of een andere
      overeenkomst die verplicht tot overdracht van de vervoerde zaak, of ter uitvoering van een tot vestiging van
      rechten op die zaak verplichtende overeenkomst, wordt, in afwijking van lid 1 een aanwijzing van het op de
      bedoelde overeenkomst toepasselijke recht, opgenomen in die overeenkomst, geacht mede betrekking te hebben op het
      goederenrechtelijke regime met betrekking tot de vervoerde zaak.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel133
  - number: '134'
    text: |-
      Indien een vordering belichaamd is in een stuk, bepaalt het recht van de staat op welks grondgebied het stuk zich
      bevindt, of de vordering een vordering op naam dan wel een vordering aan toonder is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel134
  - number: '135'
    text: |-
      1 De vatbaarheid van een vordering op naam voor overdracht dan wel voor vestiging daarop van rechten wordt beheerst
      door het recht dat op de vordering van toepassing is.

      2 Voor het overige wordt het goederenrechtelijke regime met betrekking tot een vordering op naam beheerst door
      het recht dat op de tot overdracht of vestiging van rechten verplichtende overeenkomst toepasselijk is. Dat recht
      bepaalt in het bijzonder:

      a. welke vereisten aan een overdracht of vestiging worden gesteld;

      b. wie gerechtigd is tot uitoefening van de in de vordering besloten rechten;

      c. welke rechten op de vordering kunnen rusten en welke de aard en de inhoud van deze rechten zijn;

      d. op welke wijze die rechten zich wijzigen, overgaan en tenietgaan en welke hun onderlinge verhouding is.

      3 De betrekkingen tussen de cessionaris, onderscheidenlijk de gerechtigde, en de schuldenaar, de voorwaarden
      waaronder de overdracht van een vordering op naam dan wel de vestiging daarop van een recht aan de schuldenaar kan
      worden tegengeworpen, alsmede de vraag of de schuldenaar door betaling is bevrijd, worden beheerst door het recht
      dat op de vordering van toepassing is.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel135
  - number: '136'
    text: |-
      1 Het goederenrechtelijke regime met betrekking tot een vordering aan toonder wordt beheerst door het recht van
      de staat op welks grondgebied het toonderstuk zich bevindt. [Artikel 135 leden 1 en 2][ref1] van dit Boek is van
      overeenkomstige toepassing op de vraag welke onderwerpen door dat recht worden beheerst.

      2 De betrekkingen tussen de verkrijger en de schuldenaar, de voorwaarden waaronder de overdracht van de vordering
      dan wel de vestiging daarop van een recht aan de schuldenaar kan worden tegengeworpen, alsmede de vraag of de
      schuldenaar door betaling is bevrijd, worden beheerst door het recht dat op de vordering van toepassing is.

      3 De [artikelen 130][ref2] en [131][ref3] van dit Boek zijn van overeenkomstige toepassing op vorderingen aan
      toonder.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel130
      [ref3]: https://wetten.overheid.nl/BWBR0030068#Artikel131
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel136
