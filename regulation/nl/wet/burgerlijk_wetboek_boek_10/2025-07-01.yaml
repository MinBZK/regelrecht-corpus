        bwb_id: BWBR0030068
        artikel: '25'
  - number: '25'
    text: |-
      1 Ter zake van de toepassing van [artikel 5 van Boek 1][ref1] geldt het volgende:

      a. Indien een kind buiten Nederland rechtsgeldig is erkend of gewettigd, door deze erkenning of wettiging in
      familierechtelijke betrekkingen tot de erkenner is komen te staan en daarbij het Nederlanderschap heeft verkregen
      of behouden, en indien de geslachtsnaam van dat kind niet is bepaald met inachtneming van een naamskeuze in de zin
      van [artikel 5 lid 2 van Boek 1][ref2], kunnen de moeder en de erkenner gezamenlijk alsnog, tot twee jaar na de
      erkenning of de wettiging, verklaren welke van hun beider geslachtsnamen of combinatie daarvan het kind zal hebben.
      Heeft het kind op het tijdstip van de erkenning of de wettiging de leeftijd van zestien jaren bereikt, dan kan het,
      tot twee jaar na de erkenning of de wettiging, zelf alsnog verklaren van wie van beide ouders het de geslachtsnaam
      of welke combinatie daarvan zal hebben.

      b. Indien een kind dat tijdens zijn minderjarigheid door een Nederlander is erkend of zonder erkenning door
      wettiging het kind van een Nederlander is geworden, door optie het Nederlanderschap verkrijgt en op het tijdstip
      van de optie tot zijn beide ouders in familierechtelijke betrekkingen staat, kunnen de ouders ter gelegenheid
      van de optie gezamenlijk verklaren welke van hun beider geslachtsnamen of combinatie daarvan het kind zal hebben.
      Heeft het kind op het tijdstip van de optie de leeftijd van zestien jaren bereikt, dan verklaart het zelf of het de
      geslachtsnaam van een van de ouders of een combinatie daarvan zal hebben.

      c. Indien een kind als gevolg van een buiten Nederland uitgesproken adoptie het Nederlanderschap heeft verkregen
      en indien de geslachtsnaam van dat kind na de adoptie niet is bepaald met inachtneming van een naamskeuze in de
      zin van [artikel 5 lid 3 van Boek 1][ref3], kunnen de ouders alsnog, tot twee jaar nadat de uitspraak in kracht
      van gewijsde is gegaan, gezamenlijk verklaren dat het kind de oorspronkelijke geslachtsnaam, een van hun beider
      geslachtsnamen of combinatie daarvan dan wel een van hun beider geslachtsnamen in combinatie met de oorspronkelijke
      geslachtsnaam zal hebben. Heeft het kind op het tijdstip waarop de uitspraak in kracht van gewijsde gaat de
      leeftijd van zestien jaren bereikt, dan kan het, tot twee jaar na dat tijdstip, zelf alsnog verklaren of het
      de oorspronkelijke geslachtsnaam, de geslachtsnaam van een van de ouders of een combinatie daarvan dan wel de
      geslachtsnaam van een van de ouders in combinatie met de oorspronkelijke geslachtsnaam zal hebben.

      d. De in [artikel 5 lid 4 van Boek 1][ref4] bedoelde verklaring houdende naamskeuze kan voor de geboorte van het
      kind worden afgelegd indien ten minste een van de ouders op het tijdstip van de verklaring het Nederlanderschap
      bezit.

      e. Indien een buiten Nederland geboren kind door geboorte in familierechtelijke betrekking tot de beide ouders
      staat en het Nederlanderschap bezit, en indien de geslachtsnaam van dat kind in de geboorteakte niet is bepaald
      met inachtneming van een naamskeuze in de zin van [artikel 5 lid 4 van Boek 1][ref5], kunnen de ouders gezamenlijk
      alsnog, tot twee jaar na de geboorte, verklaren welke van hun beider geslachtsnamen of combinatie daarvan het kind
      zal hebben.

      f. Indien het ouderschap van een kind buiten Nederland rechtsgeldig is vastgesteld en dat kind
      daardoor het Nederlanderschap heeft verkregen of behouden, en indien de geslachtsnaam van dat kind na
      de vaststelling van het ouderschap niet is bepaald met inachtneming van een naamskeuze in de zin van
      [artikel 5, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref6], kunnen de moeder en de persoon wiens
      ouderschap gerechtelijk is vastgesteld alsnog, tot twee jaar na het tijdstip waarop de gerechtelijke beslissing
      houdende vaststelling van het ouderschap in kracht van gewijsde gaat, gezamenlijk verklaren welke van hun beider
      geslachtsnamen of combinatie daarvan het kind zal hebben. Heeft het kind op het tijdstip waarop de beslissing
      houdende vaststelling van het ouderschap in kracht van gewijsde gaat, de leeftijd van zestien jaar bereikt, dan kan
      het, tot twee jaar na dat tijdstip, zelf alsnog verklaren van wie van beide ouders het de geslachtsnaam of welke
      combinatie daarvan zal hebben.

      g. Voor de in dit lid onder a – f bedoelde mogelijkheden tot naamskeuze is het onverschillig of het kind naast de
      Nederlandse nog een andere nationaliteit bezit.

      2 In het geval onder b wordt de verklaring houdende naamskeuze afgelegd ten overstaan van de ambtenaar van de
      burgerlijke stand van de gemeente waar de optie voor het Nederlanderschap in ontvangst wordt genomen. In de
      overige gevallen kan de verklaring houdende naamskeuze worden afgelegd ten overstaan van iedere ambtenaar van de
      burgerlijke stand.

      3 Indien het kind naast de Nederlandse nog een of meer andere nationaliteiten heeft of na registratie zal
      verkrijgen, kan ook de geslachtsnaam worden gekozen die het kind enkel volgens het recht van een andere
      nationaliteit van het kind zou kunnen krijgen.


