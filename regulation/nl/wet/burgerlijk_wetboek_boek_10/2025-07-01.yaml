  - number: '122'
    text: |-
      1 Het openbaar ministerie kan de rechtbank Midden-Nederland verzoeken voor recht te verklaren dat het doel of de
      werkzaamheid van een corporatie die niet is een Nederlandse rechtspersoon in strijd is met de openbare orde als
      bedoeld in [artikel 20 van Boek 2][ref1].

      2 De verklaring werkt voor en tegen een ieder met ingang van de eerste dag na de dag van de uitspraak.
      De verklaring wordt door de zorg van de griffier geplaatst in de Staatscourant. Is de corporatie in het
      handelsregister ingeschreven, dan wordt de verklaring aldaar eveneens ingeschreven.

      3 [Artikel 20, leden 2, 3, 5 en 6][ref2] en [artikel 20a van Boek 2][ref3] zijn van overeenkomstige toepassing.

      4 De rechter kan de in Nederland gelegen goederen van de corporatie desverlangd onder bewind stellen.
      [Artikel 22 van Boek 2][ref4] is van overeenkomstige toepassing.

      5 De in Nederland gelegen goederen van een corporatie ten aanzien waarvan de rechter een verklaring voor recht
      als bedoeld in lid 1 heeft gegeven, worden vereffend door een of meer door hem te benoemen vereffenaars. De
      [artikelen 23 tot en met 24 van Boek 2][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel20
