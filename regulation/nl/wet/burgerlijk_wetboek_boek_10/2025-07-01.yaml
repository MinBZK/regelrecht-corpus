  - number: '123'
    text: |-
      Een corporatie die niet is een Nederlandse rechtspersoon en is vermeld in de lijst, bedoeld in artikel 2 lid 3 van
      Verordening (EG) nr. 2580/2001 van de Raad van de Europese Unie van 27 december 2001 (PbEG L 344) inzake specifieke
      beperkende maatregelen tegen bepaalde personen en entiteiten met het oog op de strijd tegen terrorisme, of in
      Bijlage 1 van Verordening (EG) nr. 881/2002 van de Raad van de Europese Unie van 27 mei 2002 (PbEG L 139) tot
      vaststelling van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten die banden hebben
      met Usama bin Laden, het Al-Qau’ída-netwerk en de Taliban, en tot intrekking van Verordening (EG) nr. 467/2001
      van de Raad tot instelling van een verbod op de uitvoer van bepaalde goederen en diensten naar Afghanistan,
      tot versterking van het verbod op vluchten en verlenging van de bevriezing van tegoeden en andere financiële
      middelen ten aanzien van de Taliban in Afghanistan, of is vermeld en met een ster aangemerkt in de Bijlage bij
      het Gemeenschappelijk Standpunt nr. 2001/931 van de Raad van de Europese Unie van 27 december 2001 (PbEG L 344)
      betreffende de toepassing van specifieke maatregelen ter bestrijding van het terrorisme, is van rechtswege verboden
      en niet bevoegd tot het verrichten van rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel123
  - number: '124'
    text: |-
      Deze titel laat onverlet hetgeen bepaald is bij de [Wet op de formeel buitenlandse vennootschappen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009191
