  - number: '94'
    text: |-
      1 Of tussen een vrouw en het buiten huwelijk of geregistreerd partnerschap uit haar geboren kind door geboorte
      familierechtelijke betrekkingen ontstaan, wordt bepaald door het recht van de staat van de nationaliteit van
      de vrouw. Bezit de vrouw de nationaliteit van meer dan een staat, dan is bepalend het nationale recht volgens
      hetwelk zodanige betrekkingen ontstaan. In elk geval ontstaan zodanige betrekkingen indien de vrouw haar gewone
      verblijfplaats in Nederland heeft.

      2 Voor de toepassing van lid 1 is bepalend het tijdstip van de geboorte.

      3 De leden 1 en 2 laten onverlet de op 12 september 1962 te Brussel tot stand gekomen Overeenkomst betreffende de
      vaststelling van betrekkingen tussen het onwettige kind en zijn moeder (Trb. 1963, 93).
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel94
  - number: '95'
    text: |-
      1 Of erkenning door een persoon familierechtelijke betrekkingen doet ontstaan tussen hem en een kind, wordt,
      wat betreft de bevoegdheid van die persoon en de voorwaarden voor erkenning, bepaald door het recht van de staat
      waarvan die persoon de nationaliteit bezit. Bezit de persoon, genoemd in de eerste volzin, de nationaliteit van
      meer dan een staat, dan is bepalend het nationale recht volgens hetwelk de erkenning mogelijk is. Indien volgens
      het nationale recht van die persoon erkenning niet of niet meer mogelijk is, is bepalend het recht van de staat van
      de gewone verblijfplaats van het kind. Is zij ook volgens dat recht niet of niet meer mogelijk, dan is bepalend het
      recht van de staat waarvan het kind de nationaliteit bezit. Bezit het kind de nationaliteit van meer dan een staat,
      dan is bepalend het nationale recht volgens hetwelk de erkenning mogelijk is. Is zij ook volgens dat recht niet of
      niet meer mogelijk, dan is bepalend het recht van de staat van de gewone verblijfplaats van de persoon, genoemd in
      de eerste volzin.

      2 De akte van erkenning en de latere vermelding van de erkenning vermelden het recht dat ingevolge lid 1 is
      toegepast.

      3 Ongeacht het ingevolge lid 1 toepasselijke recht, is op de toestemming van de moeder, onderscheidenlijk het
      kind, tot de erkenning toepasselijk het recht van de staat waarvan de moeder, onderscheidenlijk het kind, de
      nationaliteit bezit. Bezit de moeder, onderscheidenlijk het kind, de nationaliteit van meer dan een staat, dan
      is toepasselijk het nationale recht volgens hetwelk toestemming is vereist. Bezit de moeder, onderscheidenlijk
      het kind, de Nederlandse nationaliteit, dan is het Nederlandse recht van toepassing, zulks ongeacht of de moeder,
      onderscheidenlijk het kind naast de Nederlandse nationaliteit nog een andere nationaliteit bezit. Indien het
      toepasselijke recht de erkenning niet kent, is toepasselijk het recht van de staat van de gewone verblijfplaats van
      de moeder, onderscheidenlijk het kind. Het op de toestemming toepasselijke recht bepaalt tevens of bij gebreke van
      toestemming deze kan worden vervangen door een rechterlijke beslissing.

      4 Voor de toepassing van de voorgaande leden is bepalend het tijdstip van de erkenning en de toestemming.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel95
  - number: '96'
    text: |-
      Of en op welke wijze een erkenning kan worden tenietgedaan, wordt, wat betreft de bevoegdheid van de persoon die
      het kind heeft erkend en de voorwaarden voor de erkenning, bepaald door het ingevolge [artikel 95 lid 1][ref1] van
      dit Boek toegepaste recht, en wat betreft de toestemming van de moeder, onderscheidenlijk het kind, door het recht
      dat ingevolge artikel 95 lid 3 van dit Boek toepasselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel95
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel96
