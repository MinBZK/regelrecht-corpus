  - number: '92'
    text: |-
      1 Of een kind door geboorte in familierechtelijke betrekkingen komt te staan tot de vrouw uit wie het is geboren en
      de met haar gehuwde of gehuwd geweest zijnde persoon of de persoon met wie zij door een geregistreerd partnerschap
      is verbonden of verbonden is geweest, wordt bepaald door het recht van de staat van de gemeenschappelijke
      nationaliteit van de vrouw en die persoon of, indien dit ontbreekt, door het recht van de staat waar de vrouw en
      die persoon elk hun gewone verblijfplaats hebben, of indien ook dit ontbreekt, door het recht van de staat van de
      gewone verblijfplaats van het kind.

      2 Wanneer de persoon, genoemd in lid 1, en de vrouw een nationaliteit gemeenschappelijk hebben, geldt voor de
      toepassing van lid 1 als hun nationale recht het recht van die nationaliteit, ongeacht of zij beiden dan wel een
      hunner nog een andere nationaliteit bezitten. Bezitten de echtgenoten of geregistreerde partners meer dan een
      gemeenschappelijke nationaliteit, dan worden zij geacht geen gemeenschappelijke nationaliteit te bezitten.

      3 Voor de toepassing van lid 1 is bepalend het tijdstip van de geboorte van het kind, dan wel indien het huwelijk
      of geregistreerd partnerschap van de ouders voordien is ontbonden, dat van de ontbinding.
    url: https://wetten.overheid.nl/BWBR0030068/2025-07-01#Artikel92
  - number: '93'
    text: |-
      1 Of familierechtelijke betrekkingen als bedoeld in [artikel 92][ref1] van dit Boek in een gerechtelijke procedure
      tot gegrondverklaring van een ontkenning kunnen worden tenietgedaan, wordt bepaald door het recht dat ingevolge dat
      artikel op het bestaan van die betrekkingen toepasselijk is.

      2 Is volgens het in lid 1 bedoelde recht ontkenning niet of niet meer mogelijk, dan kan de rechter, indien zulks
      in het belang is van het kind en de ouders en het kind een daartoe strekkend gezamenlijk verzoek doen, een ander
      in [artikel 92][ref2] van dit Boek genoemd recht toepassen, dan wel het recht toepassen van de staat van de gewone
      verblijfplaats van het kind ten tijde van de ontkenning of het Nederlandse recht.

      3 Ongeacht het ingevolge lid 1 of lid 2 toepasselijke recht is in de daar bedoelde gerechtelijke procedure
      [artikel 212 van Boek 1][ref3] van toepassing.

      4 Of familierechtelijke betrekkingen tussen een kind en de met zijn moeder gehuwd of gehuwd geweest zijnde persoon
      of de persoon met wie zijn moeder door een geregistreerd partnerschap is verbonden of verbonden is geweest door
      een verklaring houdende ontkenning door de moeder ten overstaan van de ambtenaar van de burgerlijke stand kunnen
      worden tenietgedaan, wordt bepaald door het recht dat ingevolge [artikel 92][ref4] van dit Boek op het bestaan van
      die betrekkingen toepasselijk is. Onverminderd de leden 1 en 2 kan een zodanige verklaring slechts worden afgelegd
      indien de met de moeder gehuwde of gehuwd geweest zijnde nog levende persoon respectievelijk de persoon met wie
      de moeder door een geregistreerd partnerschap is verbonden of de nog in levende zijn persoon met wie zij door een
      partnerschap verbonden is geweest erin toestemt en indien tegelijkertijd familierechtelijke betrekkingen tussen het
      kind en een andere persoon ontstaan of worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0030068#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel212
      [ref4]: https://wetten.overheid.nl/BWBR0030068#Artikel92
