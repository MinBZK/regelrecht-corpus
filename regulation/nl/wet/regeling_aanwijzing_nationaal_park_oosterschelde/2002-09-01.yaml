  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *overlegorgaan:*


              overlegorgaan als bedoeld in [artikel 3][ref1];



            c

              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992/93, 22880, nr. 5, blz.
      99).


      [ref1]: https://wetten.overheid.nl/BWBR0013675#Artikel3
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013675
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied Oosterschelde, zoals aangegeven op de kaart die als bijlage behoort
      bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Oosterschelde.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park
      Oosterschelde. Daartoe behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan;

      b. de onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationale park Oosterschelde
      beschikbare middelen in het kader van een jaarlijkse voortschrijdend meerjarenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van beheers- en inrichtingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park Oosterschelde.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park
      Oosterschelde van 22 november 2001 en met inachtneming van hetgeen te dien aanzien door de minister bij brief van 9
      april 2002, kenmerk DN 2002/1067 en bij brief van 26 april 2002, kenmerk DN 2002/1279 is gesteld.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel5
  - number: '6'
    text: |-
      In het overleg hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. negentien door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1. de provincie Zeeland;

      2. de gemeente Tholen;

      3. de gemeente Schouwen-Duiveland;

      4. de gemeente Kapelle;

      5. de gemeente Goes;

      6. de gemeente Noord-Beveland;

      7. de gemeente Reimerswaal;

      8. de gemeente Veere;

      9. het waterschap Zeeuwse eilanden;

      10. het Ministerie van Financiën;

      11. Rijkswaterstaat;

      12. het Staatsbosbeheer;

      13. de Stichting Het Zeeuwse Landschap;

      14. het Breed Overleg Deltawateren;

      15. de Vereniging voor Natuur- en Milieu-educatie, IVN;

      16. het Productschap Vis;

      17. het Delta Overleg;

      18. de Vereniging Natuurmonumenten;

      19. de particuliere eigenaren;

      c. een ambtenaar, werkzaam bij de directie Zuidwest van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel6
  - number: '7'
    text: |-
      1 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      2 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationaal park Oosterschelde verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel7
  - number: '8'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Zeeland te benoemen ambtenaar van die
      provincie.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel8
  - number: '9'
    text: |-
      Indien bij het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel9
  - number: '10'
    text: De regeling aanwijzing nationaal park in oprichting Oosterschelde wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 8 mei 2002.
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Oosterschelde.'
    url: https://wetten.overheid.nl/BWBR0013675/2002-09-01#Artikel12
