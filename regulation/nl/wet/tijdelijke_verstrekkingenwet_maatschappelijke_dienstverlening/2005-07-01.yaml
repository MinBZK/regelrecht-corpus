preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is tijdelijke regelen te stellen inzake de als categorieën
    van inrichtingen of als verstrekkingen aangewezen vormen van maatschappelijke dienstverlening ingevolge artikel 6,
    derde lid van de "Algemene Wet Bijzondere Ziektekosten";

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:

      a. Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;

      b. inrichting: een dagverblijf of een gezinsvervangend tehuis voor gehandicapten, waarin zorg, bedoeld in artikel
      6, eerste lid, van de "[Algemene Wet Bijzondere Ziektekosten][ref1]" wordt verleend;

      c. instelling: een instelling waardoor een als verstrekking aangewezen vorm van maatschappelijke dienstverlening,
      bedoeld in artikel 6, eerste lid, van de "Algemene Wet Bijzondere Ziektenkosten", wordt uitgevoerd;

      d. verstrekking: verstrekking verleend door een inrichting of instelling;

      e. ziekenfonds: een instelling, toegelaten overeenkomstig [artikel 34 van de Ziekenfondswet][ref2];

      f. ziektekostenverzekeraar: een instelling toegelaten overeenkomstig artikel 33 van de
      "[Algemene Wet Bijzondere Ziektekosten][ref3]";

      g. uitvoerend orgaan: een orgaan als bedoeld in artikel 38 van de "[Algemene Wet Bijzondere Ziektekosten][ref4]";

      h. verzekerde: de verzekerde bedoeld in artikel 5 van de "[Algemene Wet Bijzondere Ziektekosten][ref5]".


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel1
