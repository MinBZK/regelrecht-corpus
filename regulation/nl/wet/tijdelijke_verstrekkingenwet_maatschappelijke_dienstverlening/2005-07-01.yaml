  - number: 4a
    text: |-
      1 Onze Minister stelt telkens voor een categorie van inrichtingen of instellingen een plan vast, waarin is
      aangegeven de wijze waarop in de jaren waarop het plan betrekking heeft in de behoefte aan inrichtingen of
      instellingen wordt voorzien.

      2 Bij de vaststelling van het plan wordt onder meer rekening gehouden met de mogelijkheden voor de bouw, de
      personeelsvoorziening en de uit de omvang van het plan voortvloeiende financiële consequenties.

      3 Het plan wordt telkens voor een periode van ten hoogste vijf jaren vastgesteld.

      4 Het plan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel4a
  - number: 4b
    text: |-
      1 Onverminderd [artikel 10][ref1], is op de voorbereiding van het plan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat provinciale staten:

      a. belast zijn met de opstelling van het ontwerp, voorzover het de behoefte aan inrichtingen en instellingen in de
      desbetreffende provincie betreft;

      b. toepassing geven aan die afdeling.

      2 In deze paragraaf wordt onder «het provinciale plan» verstaan: het ontwerp, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '10'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5'
    text: |-
      1 Bij de voorbereiding van het provinciale plan vragen gedeputeerde staten advies aan de betrokken gemeenteraden.

      2 Bij de voorbereiding van het provinciale plan vragen gedeputeerde staten advies aan het orgaan van overleg en
      advies voor het maatschappelijk en cultureel welzijn indien dit in de provincie aanwezig is. Onze Minister kan
      andere adviesinstanties aanwijzen.

      3 Voor zover naar het oordeel van provinciale staten de behoefte aan inrichtingen of instellingen samenhangt met
      de behoefte in een andere provincie plegen zij omtrent de aan het provinciale plan te geven inhoud overleg met
      provinciale staten van die provincie.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister en Onze Ministers die het mede aangaat geven aan provinciale staten ter zake van hun in
      [artikel 4b, eerste lid, onder a][ref1], opgedragen taak beleidsregels omtrent de wijze waarop in het plan
      samenhang wordt aangebracht tussen tot de betrokken categorie behorende inrichtingen of instellingen en de met deze
      categorie samenhangende voorzieningen op het terrein van de gezondheidszorg, maatschappelijke dienstverlening en
      andere verwante terreinen.

      2 Onze Minister geeft regelen omtrent de voorbereiding, de inhoud, de omvang, de inrichting en de uitwerking van
      het provinciale plan.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: 4b
        hoofdstuk: III
        paragraaf: '1'
  - number: '8'
    text: |-
      Provinciale staten leggen binnen acht weken nadat de termijn voor het naar voren brengen van zienswijzen is
      verstreken, het plan, vergezeld van de over het plan naar voren gebrachte zienswijzen over aan Onze Minister en
      maken hun opmerkingen daarbij aan hem kenbaar.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel8
  - number: '10'
    text: |-
      Behoudens in de gevallen die naar het oordeel van Onze Minister een spoedeisend karakter hebben zijn op een
      tussentijdse wijziging de bepalingen omtrent de totstandbrenging van het plan van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel10
  - number: '11'
    text: |-
      Rechtspersonen met volledige rechtsbevoegdheid die voldoen aan bij of krachtens algemene maatregel van bestuur te
      stellen eisen, kunnen worden toegelaten tot het instandhouden van een inrichting of instelling, die in het plan
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel11
  - number: '12'
    text: |-
      1 Indien het betreft een inrichting of instelling welke behoort tot een categorie van inrichtingen of instellingen,
      die naar het oordeel van Onze Minister een werkgebied hebben dat in het algemeen niet groter is dan het gebied van
      een gemeente, geschiedt de toelating door de gemeenteraad.

      2 Indien het betreft een inrichting of instelling welke behoort tot een categorie van inrichtingen of instellingen,
      die naar het oordeel van Onze Minister een werkgebied hebben dat in het algemeen groter is dan het gebied van een
      gemeente, geschiedt de toelating door provinciale staten.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel12
  - number: '13'
    text: |-
      Het tijdstip en de wijze waarop verzoeken om toelating worden ingediend alsmede de wijze waarop en de termijn
      waarbinnen op verzoeken om toelating wordt beslist, worden bij of krachtens algemene maatregel van bestuur
      geregeld.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel13
  - number: '14'
    text: |-
      Tegen een besluit als bedoeld in [artikel 12][ref1] kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel12
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '15'
    text: |-
      1 De gemeenteraad besluit rechtstreeks van gemeentewege een inrichting of instelling bedoeld in
      [artikel 12, eerste lid][ref1], tot stand te brengen als dit noodzakelijk is voor de uitvoering van het plan.

      2 Provinciale staten besluiten rechtstreeks van provinciewege een inrichting of instelling bedoeld in
      [artikel 12, tweede lid][ref2], tot stand te brengen als dit noodzakelijk is voor de uitvoering van het plan.

      3 Onze Minister kan op grond van bijzondere redenen van het bepaalde in het eerste en tweede lid ontheffing
      verlenen, zonodig onder door hem te stellen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002957#Artikel12
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002957
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '16'
    text: |-
      [Artikel 15][ref1] kan slechts toepassing vinden indien aannemelijk is dat door toepassing van [artikel 11][ref2]
      niet in de uitvoering van het plan zal worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002957#Artikel11
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002957
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '17'
    text: |-
      Een inrichting of instelling waarin of waardoor een verstrekking kan worden verleend dient als
      zodanig door Onze Minister te zijn erkend, gehoord het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '18'
    text: Een inrichting of instelling wordt slechts erkend, indien zij in het plan is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel18
  - number: '21'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regelen gesteld omtrent de wijze en het tijdstip waarop
      een verzoek om erkenning wordt ingediend.

      2 Op een verzoek om erkenning wordt een beslissing genomen binnen vier maanden nadat het verzoek bij Onze Minister
      is binnengekomen. Onze Minister kan deze termijn met ten hoogste twee maanden verlengen, in welk geval hij daarvan
      aan de verzoeker mededeling doet. Het niet binnen de gestelde termijn beslissen wordt met een voorlopige erkenning
      voor een termijn van een jaar gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel21
  - number: '23'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van de normering van de
      kosten van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel23
  - number: '24'
    text: Het toezicht op de inrichtingen en instellingen is opgedragen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel24
  - number: '25'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 De toezichthoudende ambtenaren beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '27'
    text: |-
      De in [artikel 24][ref1] bedoelde ambtenaren hebben mede tot taak:

      a. het desgevraagd of uit eigen beweging voorlichten en adviseren van provinciale en gemeentebesturen en organen
      van particulier initiatief;

      b. het geven van inlichtingen aan Onze Minister omtrent de stand van zaken met betrekking tot de ontwikkeling van
      de aangewezen categorieën van inrichtingen en vormen van maatschappelijke dienstverlening;

      c. het doen van die voorstellen aan Onze Minister welke zij in het belang achten van de ontwikkeling van de
      aangewezen categorieën van inrichtingen en vormen van maatschappelijke dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel24
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '24'
        hoofdstuk: VI
  - number: '28'
    text: |-
      Onze Minister stelt nadere regelen omtrent de taak en werkwijze van de in [artikel 24][ref1] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel24
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '24'
        hoofdstuk: VI
  - number: '30'
    text: |-
      1 Wij kunnen bij algemene maatregel van bestuur voorschriften geven betreffende het verkrijgen van gegevens over de
      inrichtingen en instellingen ten behoeve van de statistiek.

      2 Van de gegevens, bedoeld bij het voorgaande lid, wordt geen ander gebruik gemaakt dan ten behoeve van de
      statistiek. De krachtens dat lid vastgestelde regeling stelt hiertoe de nodige waarborgen.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel30
  - number: '32'
    text: |-
      Overtreding van het bepaalde krachtens [artikel 30][ref1] wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel30
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '30'
        hoofdstuk: VII
  - number: '33'
    text: |-
      Hij die op grond van krachtens [artikel 30][ref1] vastgestelde bepalingen gehouden is gegevens te verstrekken en
      daarbij opzettelijk een valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt,
      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel30
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '30'
        hoofdstuk: VII
  - number: '34'
    text: |-
      1 Het feit, strafbaar gesteld in [artikel 32][ref1], wordt als een overtreding aangemerkt.

      2 Het feit strafbaar gesteld bij [artikel 33][ref2], wordt als een misdrijf aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002957#Artikel33
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '32'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002957
        artikel: '33'
        hoofdstuk: VIII
  - number: '36'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, behalve de ambtenaren bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de door Onze Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '37'
    text: |-
      Bij het opsporen van een bij of krachtens deze wet strafbaar gesteld feit hebben de in [artikel 36][ref1] bedoelde
      ambtenaren en personen toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel36
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '36'
        hoofdstuk: VIII
  - number: '38'
    text: |-
      1 Rechtspersonen met volledige rechtsbevoegdheid, die een inrichting of instelling in stand houden op het
      tijdstip waarop bij of krachtens de algemene maatregel van bestuur bedoeld in artikel 6, eerste lid, van de
      "[Algemene Wet Bijzondere Ziektekosten][ref1]", die categorie van inrichtingen of die vorm van maatschappelijke
      dienstverlening is aangewezen en die op dat tijdstip rijkssubsidie genieten, worden geacht toegelaten te zijn
      in [de zin van artikel 11][ref2] en voor een bij of krachtens algemene maatregel van bestuur te stellen termijn
      voorlopig erkend.

      2 Rechtspersonen met volledige rechtsbevoegdheid, die een inrichting in stand houden, die op het tijdstip van
      inwerkingtreding van deze wet op grond van de "[Algemene Wet Bijzondere Ziektekosten][ref3]" is erkend of voorlopig
      erkend, worden onder dezelfde voorschriften geacht te zijn erkend of voorlopig erkend op grond van deze wet en
      toegelaten in [de zin van artikel 11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002957#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0002957#Artikel11
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002957
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002614
      - id: ref4
        bwb_id: BWBR0002957
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '39'
    text: |-
      1 Voor de tijd dat voor een categorie van inrichtingen of instellingen nog geen plan als bedoeld in
      [artikel 9][ref1] is vastgesteld, doch niet voor langer dan twee jaren, stelt Onze Minister een programma
      vast, waarin is aangegeven de wijze waarop in de tijd waarop het programma betrekking heeft in de behoefte aan
      inrichtingen of instellingen wordt voorzien.

      2 Op het programma zijn [het tweede en vierde lid van artikel 9][ref2] van overeenkomstige toepassing.

      3 Het programma treedt voor de toepassing van de artikelen 11-16 en 18 in de plaats van het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0002957#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002957#Artikel9
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002957
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002957
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
  - number: '40'
    text: |-
      1 Het ontwerp van een besluit tot het vaststellen, wijzigen of intrekken van een algemene maatregel van bestuur
      wordt bekendgemaakt in de *Nederlandse Staatscourant.* Een voordracht tot het vaststellen, wijzigen of intrekken
      van een algemene maatregel van bestuur wordt Ons niet gedaan dan nadat twee maanden na die bekendmaking zijn
      verstreken.

      2 Alvorens Ons een voordracht te doen tot het vaststellen, wijzigen of intrekken van een algemene maatregel van
      bestuur, kan Onze Minister de naar zijn oordeel terzake representatieve organisaties horen.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel40
  - number: '41'
    text: Deze wet kan worden aangehaald als Tijdelijke Verstrekkingenwet maatschappelijke dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel41
  - number: '42'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, welk tijdstip voor de onderscheidene artikelen
      verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0002957/2005-07-01#Artikel42
