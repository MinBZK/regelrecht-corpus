preamble:
  text: |-
    Gelezen het verzoek van de algemeen directeur van de Dienst Vervoer & Ondersteuning van 27 december 2023 en de
    adviezen van de hoofdofficier van justitie bij het Landelijk Parket en de korpschef als bedoeld in artikel 27 van
    de Politiewet 2012;

    Gelet op:

    Besluit:
  url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder buitengewoon opsporingsambtenaar: de persoon als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049295#Artikel2
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0049295
        artikel: '2'
  - number: '2'
    text: |-
      De personen, werkzaam in de functie van

      a. Risico-analist;

      b. (inrichtings) Beveiliger;

      c. (inrichtings) Beveiliger Transport;

      d. (inrichtings) Beveiliger EBV;

      e. (inrichtings) Beveiliger BVIS;

      f. (inrichtings) Beveiliger LBB;

      g. (inrichtings) Beveiliger Hondengeleider;

      h. (inrichtings) Beveiliger BOT;

      i. (inrichting/arrestanten) beveiliger;

      j. Trainer/docent, in dienst van de Dienst Vervoer & Ondersteuning;

      k. medewerker Infodesk, zijn aangewezen als buitengewoon opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel2
  - number: '3'
    text: |-
      1 De buitengewoon opsporingsambtenaar is bevoegd tot het opsporen van de strafbare feiten behorend tot het
      domein VI, Generieke Opsporing, zoals opgenomen in de [bijlage bij de Regeling domeinlijsten buitengewoon
      opsporingsambtenaar](onbekend).

      2 De opsporingsbevoegdheid, bedoeld in het eerste lid, geldt voor het grondgebied van Nederland, voor zover
      noodzakelijk voor een goede vervulling van de aan de functie gerelateerde taken.

      3 De buitengewoon opsporingsambtenaar vermeldt in zijn processen-verbaal en schriftelijke verslagleggingen het in
      het eerste lid genoemde domein.
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel3
  - number: '4'
    text: Op grond van dit besluit kunnen maximaal 1500 personen als buitengewoon opsporingsambtenaar worden beëdigd.
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel4
  - number: '5'
    text: |-
      1 Als toezichthouder als bedoeld in [artikel 36 van het Besluit buitengewoon opsporingsambtenaar][ref1] is
      aangewezen de hoofdofficier van justitie bij het Landelijk Parket.

      2 Als direct toezichthouder als bedoeld in [artikel 36 van het Besluit buitengewoon opsporingsambtenaar][ref2] is
      aangewezen de korpschef als bedoeld in [artikel 27 van de Politiewet 2012][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007013#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0007013
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '27'
  - number: '6'
    text: |-
      1 De buitengewoon opsporingsambtenaar kan de in
      [artikel 7, eerste, derde en vierde lid (vervoersfouillering/insluitingsfouillering), van de Politiewet 2012][ref1]
      omschreven bevoegdheden uitoefenen met gebruikmaking van het vrijheidsbeperkend middel handboeien en de
      geweldsmiddelen korte wapenstok, pepperspray, uitschuifbare wapenstok en vuurwapen.

      2 De buitengewoon opsporingsambtenaar werkzaam in de functie van (inrichtings)Beveiliger BOT en LBB, kan gedurende
      de uitoefening van zijn taak als buitengewoon opsporingsambtenaar tevens zijn uitgerust met een semi-automatisch
      machinepistool van het merk Heckler en Koch, type MP5 A2 (met vaste kolf: niet automatisch), type MP5 A3 (met
      inschuifbare kolf: niet automatisch) kaliber 9 millimeter maal 19 millimeter.

      3 De buitengewoon opsporingsambtenaar werkzaam in de functie van (inrichtings)Beveiliger BOT kan gedurende de
      uitoefening van zijn taak als buitengewoon opsporingsambtenaar tevens zijn uitgerust met een semi-automatische
      uitvoering van de SIG SAUER MCX Rattler.

      4 De buitengewoon opsporingsambtenaar, werkzaam in de functie van (inrichtings)Beveiliger BOT en
      (inrichtings)Beveiliger LBB, kan gedurende zijn uitoefening van zijn taak als buitengewoon opsporingsambtenaar
      bovendien zijn uitgerust met CS-traangasgranaten en traangasverspreidende middelen van een door Onze Minister
      goedgekeurd merk en type.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '7'
    text: |-
      1 De algemeen directeur van de Dienst Vervoer & Ondersteuning brengt jaarlijks, voor 1 april, verslag uit over:

      a. het aantal buitengewoon opsporingsambtenaren werkzaam in de in [artikel 2][ref1] genoemde functie;

      b. de door die buitengewoon opsporingsambtenaren verrichte activiteiten;

      c. de stand van zaken met betrekking tot de opleiding van die buitengewoon opsporingsambtenaren, waarbij in
      ieder geval wordt aangegeven hoeveel personen in het verslagjaar zijn aangemeld voor het door de Minister voor
      Rechtsbescherming goedgekeurde examen en hoeveel personen in dat jaar voor dat examen zijn geslaagd.

      2 Dit verslag wordt toegezonden aan de in [artikel 5][ref2] bedoelde toezichthouder en direct toezichthouder en
      aan het Ministerie van Justitie en Veiligheid, Justis, afdeling V&T, postbus 20300, 2500 EH Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0049295#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049295#Artikel5
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0049295
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0049295
        artikel: '5'
  - number: '8'
    text: |-
      De op naam gestelde akten van beëdiging en de overige benoemingsbescheiden, afgegeven mede op basis van het in
      [artikel 9][ref1] genoemde besluit, worden geacht mede te zijn afgegeven op basis van dit besluit.

      Dit artikel brengt geen wijziging in de resterende looptijd van de afgegeven aktes.


      [ref1]: https://wetten.overheid.nl/BWBR0049295#Artikel9
    url: https://wetten.overheid.nl/BWBR0049295/2025-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0049295
        artikel: '9'
  - number: '9'
    text: |-
      Het [Besluit buitengewoon opsporingsambtenaar Dienst Vervoer & Ondersteuning 2019][ref1] van 7 februari 2019
      nr. BOACAT2019/006 zal vervallen op 12 februari 2024.

      Dit besluit treedt in werking met ingang van 12 februari 2024 en vervalt met ingang van 12 februari 2029.


      [ref1]: https://wetten.overheid.nl/BWBR0041893
