preamble:
  text: |-
    Gelet op verordening (EG) nr. 1013/2006 van het Europees Parlement en de Raad van de Europese Unie van 14 juni
    2006 betreffende de overbrenging van afvalstoffen (PbEU L 190) en artikel 10.56, eerste en tweede lid, van de Wet
    milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      de Minister: de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      financiële zekerheid: financiële zekerheid als bedoeld in [artikel 2][ref1];

      EVOA-inrichting: inrichting waarop de Verordening (EG) 1013/2006 van het Europees Parlement en de Raad van 14 juni
      2006 betreffende de overbrenging van afvalstoffen (PbEU L 190) van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022213#Artikel2
    url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022213
        artikel: '2'
  - number: '2'
    text: |-
      Financiële zekerheid kan worden gesteld in de vorm van:

      a. een waarborgsom of

      b. een gelijkwaardige verzekering.
    url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 De door of namens de kennisgever te stellen financiële zekerheid bedraagt € 450 per ton over te brengen
      afvalstoffen.

      2 In afwijking van het eerste lid bedraagt de door of namens de kennisgever te stellen financiële zekerheid voor
      de in [bijlage I][ref1] bij deze regeling bedoelde afvalstoffen per ton over te brengen afvalstoffen het ingevolge
      [die bijlage][ref2] voor die afvalstoffen geldende bedrag.

      3 Indien de kosten van nuttige toepassing of verwijdering, daaronder begrepen voorlopige handelingen, alsmede van
      opslag en vervoer van afvalstoffen, in belangrijke mate afwijken van het op grond van het eerste lid berekende
      bedrag, kan de Minister een hogere financiële zekerheid verlangen, dan wel genoegen nemen met een lagere financiële
      zekerheid. Bij de berekening van de kosten, bedoeld in de eerste volzin, gelden als kosten voor opslag en vervoer
      van afvalstoffen de bedragen, bedoeld in [bijlage I][ref3] bij deze regeling.

      4 Financiële zekerheid wordt gesteld ten behoeve van de Staat der Nederlanden.

      5 Indien het invoer van afvalstoffen betreft, afkomstig van een staat waar de EG-verordening overbrenging van
      afvalstoffen niet van toepassing is, en de gestelde financiële zekerheid in het land van verzending onvoldoende
      is, kan de Minister financiële zekerheid verlangen waarbij het eerste tot en met vierde lid van overeenkomstige
      toepassing is.


