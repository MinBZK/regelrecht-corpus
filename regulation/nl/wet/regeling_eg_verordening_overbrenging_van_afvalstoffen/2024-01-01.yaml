  - number: '4'
    text: |-
      1 De kennisgever voegt bij elke kennisgeving als bedoeld in artikel 4 van de EG-verordening overbrenging van
      afvalstoffen, een afschrift van het contract met de ontvanger als bedoeld in artikel 5, eerste lid, van de EG-
      verordening overbrenging van afvalstoffen.

      2 Indien het de overbrenging van afvalstoffen betreft tussen twee tot dezelfde natuurlijke of rechtspersoon
      behorende EVOA-inrichtingen en op grond van artikel 5, vijfde lid van de EG-verordening overbrenging van
      afvalstoffen kan worden volstaan met een verklaring van deze natuurlijke of rechtspersoon, waarbij deze zich ertoe
      verbindt de afvalstoffen nuttig toe te passen, dan wel te verwijderen, voegt deze natuurlijke of rechtspersoon, in
      afwijking van het eerste lid, een afschrift van deze verklaring bij de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#Artikel4
  - number: '5'
    text: |-
      Een afschrift van aan of door de bevoegde autoriteiten verzonden documenten inzake de overbrenging van afvalstoffen
      wordt door de kennisgever, de ontvanger en de EVOA-inrichting die de afvalstoffen ontvangt, ten minste vijf jaar
      bewaard.
    url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#Artikel5
  - number: '9'
    text: |-
      1 Deze regeling treedt in werking met ingang van 12 juli 2007.

      2 Indien het wetsvoorstel tot wijziging van de Wet milieubeheer, de Wet verontreiniging oppervlaktewateren, de Wet
      verontreiniging zeewater en de Wet op de economische delicten ter uitvoering van verordening (EG) nr. 1013/2006
      van het Europees Parlement en de Raad van de Europese Unie van 14 juni 2006 betreffende de overbrenging van
      afvalstoffen (PbEU L 190) (30 987), na tot wet te zijn verheven, later in werking treedt dan 12 juli 2007, treedt
      deze regeling op hetzelfde tijdstip in werking als dat wetsvoorstel.

      3 Indien de dagtekening van de Staatscourant waarin deze regeling wordt geplaatst minder dan twee dagen is vóór,
      gelijk is aan dan wel later is dan de in het eerste lid genoemde datum, onderscheidenlijk het in het tweede lid
      bedoelde tijdstip, treedt deze regeling in werking met ingang van de tweede dag na die dagtekening.
    url: https://wetten.overheid.nl/BWBR0022213/2024-01-01#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling EG-verordening overbrenging van afvalstoffen.'
