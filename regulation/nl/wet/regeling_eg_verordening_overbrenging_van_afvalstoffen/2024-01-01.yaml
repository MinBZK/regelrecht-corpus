  - number: 3a
    text: |-
      1 Op verzoek merkt de Minister een EVOA-inrichting waarin afvalstoffen nuttig worden toegepast aan als een vooraf
      goedgekeurde inrichting indien:

      a. een omgevingsvergunning voor een milieubelastende activiteit voor de EVOA-inrichting geldt en deze vergunning
      het nuttig toepassen van de in de aanvraag opgenomen afvalstoffen op de in de aanvraag opgenomen wijze toestaat,

      b. de EVOA-inrichting ten minste vier jaar in bedrijf is,

      c. ten aanzien van de natuurlijke of rechtspersoon die de EVOA-inrichting exploiteert, een verklaring omtrent het
      gedrag, als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], is afgegeven, die op
      het tijdstip van het verzoek aan de Minister niet ouder is dan twee maanden, en

      d. ten aanzien van de EVOA-inrichting in de vier jaar voorafgaand aan de aanvraag geen bestuursrechtelijke
      sancties die niet meer in rechte aanvechtbaar zijn, zijn opgelegd vanwege overtredingen van bepalingen, genoemd in
      [bijlage 1 bij de Aanwijzing handhaving milieurecht][ref2] van het College van procureurs-generaal van 29 november
      2005, kenmerk 2005A027 (Stcrt. 253).

      2 Met een verklaring omtrent het gedrag als bedoeld in het eerste lid, onder c, wordt gelijkgesteld een verklaring
      omtrent het gedrag afgegeven door een daartoe bevoegde instantie in een andere lidstaat van de Europese Unie dan
      wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend verdrag
      dat Nederland bindt, op basis van onderzoekingen of documenten die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het beschermingsniveau dat met de nationale onderzoekingen of documenten wordt geboden, mits
      die verklaring niet ouder is dan twee maanden.

      3 Voor een aanvraag als bedoeld in het eerste lid wordt gebruikgemaakt van een formulier waarvan het model is
      opgenomen in [bijlage II][ref3] bij deze regeling.

      4 Een besluit van de Minister, als bedoeld in het eerste lid, geldt gedurende een termijn van tien jaar of, indien
      binnen die termijn de omgevingsvergunning, bedoeld in het eerste lid, onder a, vervalt, tot en met het einde van de
      termijn waarvoor de omgevingsvergunning geldt.

      5 De Minister trekt een besluit als bedoeld in het eerste lid in indien niet meer wordt voldaan aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021148
      [ref3]: https://wetten.overheid.nl/BWBR0022213
