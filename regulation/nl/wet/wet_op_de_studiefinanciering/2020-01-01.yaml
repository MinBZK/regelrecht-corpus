preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een nieuw stelsel van studiefinanciering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003955/2020-01-01#ArtikelAanhef
articles:
  - number: '141'
    text: |-
      1 Ingeval de verplichting tot terugbetaling van renteloze voorschotten, verstrekt door Onze Minister met betrekking
      tot de lasten, verbonden aan het bezoeken van een school voor voortgezet onderwijs dan wel een instelling van
      wetenschappelijk onderwijs nog niet is aangevangen bij de inwerkingtreding van deze wet vangt deze terugbetaling
      niet eerder aan dan op het tijdstip waarop op grond van deze wet de verplichting tot terugbetaling van de
      rentedragende lening begint.

      2 Het bepaalde in de [artikelen 40, eerste en derde lid][ref1], [41 tot en met 50][ref2],[107][ref3],
      [121 tot en met 127][ref4], [130][ref5] en [132][ref6] is van overeenkomstige toepassing.


