  - number: '147'
    text: |-
      Op een studerende van 18 jaren en ouder die tot het tijdstip van inwerkingtreding van deze wet op grond van
      een onderwijswet een rijksstudietoelage werd toegekend voor het volgen van wetenschappelijk onderwijs en hoger
      beroepsonderwijs dan wel op een studerende van 21 jaren en ouder die een soortgelijke rijksstudietoelage werd
      toegekend voor het volgen van overig voortgezet onderwijs, is met ingang van de datum van inwerkingtreding van deze
      wet [hoofdstuk II][ref1] met uitzondering van artikel 8 van overeenkomstige toepassing tot het moment waarop hij de
      voor inwerkingtreding van deze wet aangevangen studie heeft voltooid dan wel gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003955/2020-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0003955
        hoofdstuk: II
  - number: '148'
    text: |-
      Op een studerende aan wie tot het tijdstip van inwerkingtreding van deze wet op grond van een onderwijswet een
      rijksstudietoelage werd toegekend onafhankelijk van het inkomen van de ouders of een van hen is met ingang van
      de datum van inwerkingtreding van deze wet [hoofdstuk II][ref1] uitgezonderd [paragraaf 2 van titel 3][ref2] van
      overeenkomstige toepassing tot het moment waarop hij de voor de inwerkingtreding van deze wet aangevangen studie
      heeft voltooid dan wel gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003955#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003955/2020-01-01#Artikel148
