  - number: '151'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.

      2

      3

      4

      5

      6 Op het moment waarop [hoofdstuk III][ref1] in werking treedt vervalt voor alle studerenden jonger dan 18
      jaren de mogelijkheid om een tegemoetkoming in de studiekosten op grond van de artikelen 80 en 143*bis*,
      vierde lid, van de Wet op het wetenschappelijk onderwijs dan wel op grond van een regeling krachtens
      [artikel 121 van de Wet op het voortgezet onderwijs][ref2] aan te vragen.


