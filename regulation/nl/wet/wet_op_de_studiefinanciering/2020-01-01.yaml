  - number: '143'
    text: |-
      In geval van samenloop van terugbetalingen als bedoeld in [artikel 142][ref1], wordt, zolang het renteloos
      voorschot nog niet is afgelost, voor de betrokkene [artikel 41, derde lid][ref2], zo toegepast dat het minimum
      bedrag van f 1200,- wordt verminderd met het in het desbetreffende jaar terug te betalen bedrag aan renteloos
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003955#Artikel41
