  - number: '144'
    text: |-
      Op 1 januari volgend op het tijdstip waarop de in [artikel 142][ref1] bedoelde voorschotten volledig moeten zijn
      terugbetaald, wordt de termijn, bedoeld in [artikel 41][ref2], opnieuw vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003955#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0003955#Artikel41
