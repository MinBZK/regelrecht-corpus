  - number: '145'
    text: |-
      1 Ingeval de verplichting tot terugbetaling van renteloze voorschotten verstrekt door Onze Minister met betrekking
      tot de lasten, verbonden aan het bezoeken van een school voor voortgezet onderwijs dan wel een instelling van
      wetenschappelijk onderwijs is aangevangen voor dan wel op de dag van de datum van inwerkingtreding van deze wet, is
      het bepaalde in [artikel 40, eerste en derde lid][ref1], alsmede de [artikelen 42 tot en met 48][ref2], [50][ref3],
      [107][ref4], [121 tot en met 127][ref5], [130][ref6] en [132][ref7] van overeenkomstige toepassing.

      2 Voor de toepassing van het bepaalde in de [artikelen 42 tot en met 50][ref8] wordt de aflosfase gesteld op 15
      jaar en vangt de aflosfase aan op 1 januari volgend op de dag van de datum van inwerkingtreding van deze wet.


