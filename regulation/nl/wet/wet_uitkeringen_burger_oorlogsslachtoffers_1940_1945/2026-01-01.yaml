        hoofdstuk: IV
  - number: '52'
    text: |-
      1 Alle ambtenaren, tot afgifte van uittreksels uit registers van de burgerlijke stand bevoegd, zijn gehouden aan de
      Raad of de Sociale verzekeringsbank de door hem gevraagde uittreksels uit de registers kosteloos te verstrekken.

      2 De gemeentebesturen zijn gehouden aan de Raad of de Sociale verzekeringsbank de door hem gevraagde inlichtingen
      uit de basisregistratie personen kosteloos te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003664/2026-01-01#Artikel52
  - number: '53'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 49][ref1], [50][ref2] en [51][ref3], doet de belanghebbende
      aan wie een uitkering of tegemoetkoming wordt uitbetaald, al dan niet door tussenkomst van zijn wettelijke
      vertegenwoordiger, op een door de Sociale verzekeringsbank te bepalen tijdstip en wijze, opgave van alle door hem,
      anders dan uit vermogen genoten inkomsten, en indien zulks door de Sociale verzekeringsbank wordt verlangd, van de
      hoogte en samenstelling van zijn vermogen.

      2 De Raad of de Sociale verzekeringsbank kan, voor zover zulks naar zijn oordeel nodig is, de financiële gegevens,
      die bij een aanvraag om een uitkering of tegemoetkoming zijn overgelegd, alsmede die welke op grond van het eerste
      lid zijn verstrekt, ter controle aan de Belastingdienst voorleggen. De Raad of de Sociale verzekeringsbank is
      gehouden de belanghebbende van deze mogelijkheid in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel50
