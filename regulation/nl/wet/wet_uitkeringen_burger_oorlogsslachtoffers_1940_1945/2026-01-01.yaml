  - number: '14'
    text: |-
      1 Het in [artikel 13][ref1] bedoelde percentage bedraagt voor het burger-oorlogsslachtoffer dat de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], nog niet
      heeft bereikt:

      a. 80, indien het burger-oorlogsslachtoffer is gehuwd, tenzij het bepaalde onder b van toepassing is;

      b. 70, indien het burger-oorlogsslachtoffer is gehuwd en het inkomen van de echtgenoot, inkomsten uit vermogen
      daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in [artikel 10, achtste lid, onder b][ref3];

      c. 75, indien het burger-oorlogsslachtoffer niet is gehuwd en minderjarige kinderen te zijnen laste heeft;

      d. 70, indien het burger-oorlogsslachtoffer als alleenstaande moet worden aangemerkt.

      2 Het in [artikel 13][ref4] bedoelde percentage bedraagt voor het burger-oorlogsslachtoffer
      met ingang van de dag waarop hij de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref5], heeft bereikt:

      a. 65, indien het burger-oorlogsslachtoffer is gehuwd, tenzij het bepaalde onder *b* van toepassing is;

      b. 55, indien het burger-oorlogsslachtoffer is gehuwd en het inkomen van de echtgenoot, inkomsten uit vermogen
      daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in [artikel 10, achtste lid, onder b][ref6];

      c. 60, indien het burger-oorlogsslachtoffer niet is gehuwd en minderjarige kinderen te zijnen laste heeft;

      d. 55, indien het burger-oorlogsslachtoffer als alleenstaande moet worden aangemerkt.

      3 Bij overlijden van de echtgenoot van het burger-oorlogsslachtoffer blijft het uitkeringspercentage ongewijzigd
      tot en met de laatste dag van de maand, volgende op die, waarin het overlijden heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003664#Artikel13
